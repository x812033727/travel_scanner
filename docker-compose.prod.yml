services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_scanner
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: "no"
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["alembic", "upgrade", "head"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    build: ./apps/api
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TRUST_PROXY_CLIENT_IP: "true"
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN:-}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8090:8000"]
    volumes:
      - /run/travel-scanner-deployer:/run/travel-scanner-deployer:ro
      # The AI accounts agent (ops/ai-accounts); the same travel-api group opens it.
      - /run/mokaair-ai-accounts:/run/mokaair-ai-accounts:ro
      # Previews for /admin/videos (app/video_reviews/storage.py): the site has no object store.
      - video_reviews:/var/lib/mokaair/video-reviews
    group_add: ["${DEPLOY_AGENT_GID:-10002}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    # The existing worker also consumes the durable community account queue.
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.worker"]
    # Guide search and introductions run Claude on the host's subscription accounts when the
    # AI vendors card says so (app/ai/subscription.py); only the agent's socket is mounted.
    volumes:
      - /run/mokaair-ai-accounts:/run/mokaair-ai-accounts:ro
    group_add: ["${DEPLOY_AGENT_GID:-10002}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-worker:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.alerts.worker"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-scheduler:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.alerts.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  hotspot-collector:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    profiles: ["hotspots"]
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.hotspots.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  analytics-scheduler:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.analytics.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  news-scheduler:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    profiles: ["news"]
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.news_automation.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  news-worker:
    # The only consumer of the "news" queue; the general worker leaves it alone so a
    # candidate's hour of model calls never blocks search.
    image: travel-scanner-api:${RELEASE_SHA:-local}
    profiles: ["news"]
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.news_automation.worker"]
    # The news stages run Claude on the host's subscription accounts when the AI vendors card
    # says so (app/ai/subscription.py); only the agent's socket is mounted.
    volumes:
      - /run/mokaair-ai-accounts:/run/mokaair-ai-accounts:ro
    group_add: ["${DEPLOY_AGENT_GID:-10002}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  community-sweeper:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.community.jobs"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: travel-scanner-web:${RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mokaair.com}
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN:-}
      COMMUNITY_MEDIA_ORIGIN: ${COMMUNITY_MEDIA_ORIGIN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
      API_PROXY_MAX_BODY_BYTES: ${API_PROXY_MAX_BODY_BYTES:-5242880}
      API_PROXY_MAX_RESPONSE_BYTES: ${API_PROXY_MAX_RESPONSE_BYTES:-10485760}
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-15000}
      ANALYTICS_COUNTRY_HEADER: ${ANALYTICS_COUNTRY_HEADER:-}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Nothing in apps/web reads this; Next's standalone server.js does. It must stay longer than
      # nginx's idle timeout for this upstream (ops/nginx/upstream-keepalive.conf), so nginx is
      # always the side that closes an idle connection. With Node's 5s default, nginx reuses
      # connections the server has just closed and POSTs come back as 502.
      KEEP_ALIVE_TIMEOUT: "65000"
    ports: ["127.0.0.1:8091:3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      - api

  video-worker:
    # The video pipeline running from the owner's settings on /admin/videos
    # (docs/videos/AUTOMATION.md). It holds only a video tool token, paired once from its log;
    # the AI keys stay in api. It reaches the site through the web container, not nginx.
    image: travel-scanner-video-worker:${RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: ops/video/Dockerfile
    profiles: ["video"]
    init: true
    restart: unless-stopped
    environment:
      VIDEO_INTERNAL_SITE: http://web:3000
      VIDEO_WORKER_INTERVAL_SECONDS: "300"
    volumes:
      - video_work:/var/lib/mokaair/video-work
      - video_home:/var/lib/mokaair/video-home
      - video_docs:/opt/mokaair/docs/videos
    # Chromium renders the slides; Docker's 64 MB /dev/shm makes it crash on 1080p pages.
    shm_size: "1gb"
    mem_limit: 3g
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  video_reviews:
  video_work:
  video_home:
  video_docs:
