services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_scanner
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: "no"
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["alembic", "upgrade", "head"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    build: ./apps/api
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      TRUST_PROXY_CLIENT_IP: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8090:8000"]
    volumes:
      - ${DEPLOY_AGENT_SOCKET_DIR:-/run/travel-scanner-deployer}:/run/travel-scanner-deployer:ro
    group_add: ["${DEPLOY_AGENT_GID:-10002}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.worker"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-worker:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.alerts.worker"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  alert-scheduler:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.alerts.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  hotspot-collector:
    image: travel-scanner-api:${RELEASE_SHA:-local}
    profiles: ["hotspots"]
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
    command: ["python", "-m", "app.hotspots.scheduler"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: travel-scanner-web:${RELEASE_SHA:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mocair.io}
        NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
      API_PROXY_MAX_BODY_BYTES: ${API_PROXY_MAX_BODY_BYTES:-5242880}
      API_PROXY_MAX_RESPONSE_BYTES: ${API_PROXY_MAX_RESPONSE_BYTES:-10485760}
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-15000}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports: ["127.0.0.1:8091:3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
