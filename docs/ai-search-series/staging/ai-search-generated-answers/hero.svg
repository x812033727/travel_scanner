<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">被用到不等於被列出 / Used is not the same as listed</title>
  <desc id="desc">原創插畫：畫面左邊是一個圓角對話框，代表一個提問；從它分出三條虛線，連到中間上下排列的三份白色文件卡。上面那份與下面那份各有一條實線繼續連到右邊的答案面板，答案面板裡有幾條橫線與一條深色的連結列；中間那份文件的連線走到一半就停住，末端是一個灰色圓點，代表內容被取回、被拿來用，卻沒有被列成連結。畫面用米色底與綠、藍、橘三色，沒有任何產品標誌、介面截圖或人物。圖上只有一行字：被用到不等於被列出。</desc>
