<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">內容、標記與一道資格門 / Content, markup and an eligibility gate</title>
  <desc id="desc">左邊是一張代表網頁的白色卡片，上面有幾行內容線條，旁邊掛著一個標籤，代表描述這頁內容的結構化資料。一條虛線從卡片延伸到右邊的一道拱門，門後是一張淡色的搜尋結果卡片，表示標記換到的是通過這道門的資格。畫面下方寫著「資格，不是排名」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <circle cx="300" cy="230" r="120" fill="#E3F0EF"/>
  <circle cx="1360" cy="640" r="150" fill="#E6F0F7"/>

  <rect x="170" y="250" width="380" height="420" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="220" y="320" width="280" height="18" rx="9" fill="#102A2B"/>
  <rect x="220" y="380" width="230" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="220" y="430" width="270" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="220" y="480" width="200" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="220" y="540" width="250" height="14" rx="7" fill="#5C6B6B"/>

  <path d="M 520 300 L 690 300 L 740 350 L 690 400 L 520 400 z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="560" cy="350" r="16" fill="#F7F1E8" stroke="#0D6B68" stroke-width="4"/>

  <path d="M 620 470 C 760 620, 860 620, 950 560" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="14 18" stroke-linecap="round"/>

  <rect x="1090" y="400" width="240" height="240" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="1130" y="450" width="160" height="16" rx="8" fill="#2F6F9F"/>
  <rect x="1130" y="500" width="120" height="12" rx="6" fill="#5C6B6B"/>
  <rect x="1130" y="540" width="145" height="12" rx="6" fill="#5C6B6B"/>

  <path d="M 1000 710 L 1000 420 A 210 210 0 0 1 1420 420 L 1420 710" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="round"/>

  <text x="800" y="820" font-size="56" font-weight="bold" fill="#102A2B" text-anchor="middle">資格，不是排名</text>
</svg>
