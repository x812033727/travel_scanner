<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">GEO 的三層對照：論文定義、業界用法、測不到的部分 / Three layers of GEO: the paper, the industry, and the unmeasurable</title>
<desc id="desc">圖分成由左到右的三欄。左欄「論文的定義」列出：生成引擎等於檢索加生成模型、操作對象是自己的網頁文字、指標一是位置加權字數、指標二是主觀印象、固定查詢集與固定引擎設定，欄底註記有算式、可重複。中欄「業界的用法」列出：名字沿用下來、指標沒有沿用、改談被提及與被引用、AI 能見度各家自訂、範圍擴到品牌與社群，欄底註記沒有共同量尺。右欄「從網站外面測不到」列出：引擎怎麼挑選與排序、訓練當下發生什麼、換引擎後的通用成效、廠商分數的計算方式，欄底註記沒有公開的量測方式。最下方一條橫幅寫著：先問對方用的是哪一種定義，再看他的數字是在什麼設定下量到的。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L12 6 L0 12 z" fill="#5C6B6B"/>
</marker>
</defs>

<text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">GEO 的三層對照：論文定義、業界用法、測不到的部分</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Three layers of GEO: the paper, the industry, and what cannot be measured</text>

<rect x="80" y="150" width="420" height="590" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="290" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#0D6B68">論文的定義</text>
<path d="M120 222 H460" stroke="#0D6B68" stroke-width="2"/>
<text x="290" y="266" text-anchor="middle" font-size="17" fill="#102A2B">生成引擎＝檢索加生成模型</text>
<text x="290" y="328" text-anchor="middle" font-size="17" fill="#102A2B">操作對象是自己的網頁文字</text>
<text x="290" y="390" text-anchor="middle" font-size="17" fill="#102A2B">指標一：位置加權字數</text>
<text x="290" y="452" text-anchor="middle" font-size="17" fill="#102A2B">指標二：主觀印象</text>
<text x="290" y="514" text-anchor="middle" font-size="17" fill="#102A2B">固定查詢集、固定引擎設定</text>
<text x="290" y="700" text-anchor="middle" font-size="15" fill="#5C6B6B">有算式、可重複</text>

<rect x="590" y="150" width="420" height="590" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#2F6F9F">業界的用法</text>
<path d="M630 222 H970" stroke="#2F6F9F" stroke-width="2"/>
<text x="800" y="266" text-anchor="middle" font-size="17" fill="#102A2B">名字沿用下來</text>
<text x="800" y="328" text-anchor="middle" font-size="17" fill="#102A2B">指標沒有沿用</text>
<text x="800" y="390" text-anchor="middle" font-size="17" fill="#102A2B">改談被提及與被引用</text>
<text x="800" y="452" text-anchor="middle" font-size="17" fill="#102A2B">AI 能見度各家自訂</text>
<text x="800" y="514" text-anchor="middle" font-size="17" fill="#102A2B">範圍擴到品牌與社群</text>
<text x="800" y="700" text-anchor="middle" font-size="15" fill="#5C6B6B">沒有共同量尺</text>

<rect x="1100" y="150" width="420" height="590" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1310" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#B8442D">從網站外面測不到</text>
<path d="M1140 222 H1480" stroke="#B8442D" stroke-width="2"/>
<text x="1310" y="266" text-anchor="middle" font-size="17" fill="#102A2B">引擎怎麼挑選與排序</text>
<text x="1310" y="328" text-anchor="middle" font-size="17" fill="#102A2B">訓練當下發生什麼</text>
<text x="1310" y="390" text-anchor="middle" font-size="17" fill="#102A2B">換引擎後的通用成效</text>
<text x="1310" y="452" text-anchor="middle" font-size="17" fill="#102A2B">廠商分數的計算方式</text>
<text x="1310" y="700" text-anchor="middle" font-size="15" fill="#5C6B6B">沒有公開的量測方式</text>

<path d="M512 445 H578" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1022 445 H1088" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="80" y="770" width="1440" height="70" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="813" text-anchor="middle" font-size="20" fill="#102A2B">先問對方用的是哪一種定義，再看他的數字是在什麼設定下量到的</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
