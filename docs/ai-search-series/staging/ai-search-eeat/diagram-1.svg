<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">E-E-A-T 三層對照 / E-E-A-T: documented, absent, claimed</title>
  <desc id="desc">三欄對照圖。左欄「官方文件說明的機制」由上而下四格並以箭頭相連：評分者依公開指南為樣本查詢的結果評分；任務分兩種，Page Quality 與 Needs Met；交出一個整體評分，不是各字母的分數；評分彙總後用來量測與改進排名系統。中欄「官方文件裡沒有的東西」列四項：沒有 E-E-A-T 欄位、沒有 E-E-A-T 分數、沒有可以宣告它的標記、官方排名系統清單裡沒有叫 E-E-A-T 的系統。右欄「行銷主張，要寫明是誰說的」列四項：「E-E-A-T 分數」報表、加作者簡介就能提升、請專家掛名就會加分、多連外部權威網站。圖下方一句提醒：左欄可以指到原文的節次，右欄的每一句都要寫出是誰說的。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">E-E-A-T：文件裡有什麼、沒有什麼、外面在說什麼</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">What the rater guidelines document, what they never contain, and what marketing adds</text>

  <rect x="60" y="120" width="470" height="660" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="565" y="120" width="470" height="660" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="1070" y="120" width="470" height="660" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>

  <text x="295" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">官方文件說明的機制</text>
  <text x="800" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">官方文件裡沒有的東西</text>
  <text x="1305" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">行銷主張：要寫明是誰說的</text>

  <rect x="85" y="195" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="295" y="238" text-anchor="middle" font-size="17" fill="#102A2B">評分者依公開指南</text>
  <text x="295" y="266" text-anchor="middle" font-size="17" fill="#5C6B6B">為樣本查詢的結果評分</text>
  <line x1="295" y1="298" x2="295" y2="318" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="85" y="323" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="295" y="366" text-anchor="middle" font-size="17" fill="#102A2B">任務分兩種</text>
  <text x="295" y="394" text-anchor="middle" font-size="17" fill="#5C6B6B">Page Quality 與 Needs Met</text>
  <line x1="295" y1="426" x2="295" y2="446" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="85" y="451" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="295" y="494" text-anchor="middle" font-size="17" fill="#102A2B">交出一個整體評分</text>
  <text x="295" y="522" text-anchor="middle" font-size="17" fill="#5C6B6B">不是各字母的分數</text>
  <line x1="295" y1="554" x2="295" y2="574" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="85" y="579" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="295" y="622" text-anchor="middle" font-size="17" fill="#102A2B">評分彙總後用來</text>
  <text x="295" y="650" text-anchor="middle" font-size="17" fill="#5C6B6B">量測與改進排名系統</text>

  <text x="295" y="722" text-anchor="middle" font-size="16" fill="#5C6B6B">每一格都指得到指南原文</text>

  <rect x="590" y="195" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="252" text-anchor="middle" font-size="17" fill="#102A2B">沒有 E-E-A-T 欄位</text>

  <rect x="590" y="323" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="380" text-anchor="middle" font-size="17" fill="#102A2B">沒有 E-E-A-T 分數</text>

  <rect x="590" y="451" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="508" text-anchor="middle" font-size="17" fill="#102A2B">沒有可以宣告它的標記</text>

  <rect x="590" y="579" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="622" text-anchor="middle" font-size="17" fill="#102A2B">官方排名系統清單裡</text>
  <text x="800" y="650" text-anchor="middle" font-size="17" fill="#5C6B6B">沒有叫 E-E-A-T 的系統</text>

  <text x="800" y="722" text-anchor="middle" font-size="16" fill="#5C6B6B">缺席，所以無法設定</text>

  <rect x="1095" y="195" width="420" height="100" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1305" y="252" text-anchor="middle" font-size="17" fill="#102A2B">「E-E-A-T 分數」報表</text>

  <rect x="1095" y="323" width="420" height="100" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1305" y="380" text-anchor="middle" font-size="17" fill="#102A2B">加作者簡介就能提升</text>

  <rect x="1095" y="451" width="420" height="100" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1305" y="508" text-anchor="middle" font-size="17" fill="#102A2B">請專家掛名就會加分</text>

  <rect x="1095" y="579" width="420" height="100" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1305" y="636" text-anchor="middle" font-size="17" fill="#102A2B">多連外部權威網站</text>

  <text x="1305" y="722" text-anchor="middle" font-size="16" fill="#B8442D">沒有官方文件支持</text>

  <text x="60" y="826" font-size="16" fill="#5C6B6B">左欄可以指到指南原文的節次；右欄的每一句，都要寫出是誰說的。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
