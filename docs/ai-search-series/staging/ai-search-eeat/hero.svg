<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">E-E-A-T 是評分指南裡的概念 / E-E-A-T lives in a rating guideline</title>
  <desc id="desc">原創插畫。左邊是一份攤開的文件，上面幾行內容線條，代表寫給人工品質評分者的指南；右上是一支有滑塊的評分滑桿，代表評分者實際交出的整體評分；右下是一個空的虛線方框並被一條斜線劃過，代表指南裡沒有可以填寫或宣告 E-E-A-T 的欄位。畫面沒有任何產品介面、商標或人物。</desc>
