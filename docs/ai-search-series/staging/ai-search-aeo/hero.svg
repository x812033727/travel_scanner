<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">一個問題走向兩種答案 / One question, two kinds of answer</title><desc id="desc">左半邊：一個帶放大鏡的提問氣泡連到一張頁面，頁面上其中一行被框起來並被拉出成一個小方塊，代表從單一頁面抓出一段既有文字的擷取式答案。右半邊：三張分開的頁面用箭頭匯聚成一個新的深色方塊，方塊裡是全新的線條，代表模型綜合多個來源改寫出來的生成式答案。中間用一條橘色虛線把兩邊分開。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><path d="M 850 120 L 850 820" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="18 16"/><rect x="130" y="110" width="430" height="210" rx="30" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/><path d="M 250 320 L 250 392 L 330 320 z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/><circle cx="300" cy="200" r="52" fill="none" stroke="#0D6B68" stroke-width="9"/><path d="M 338 240 L 392 292" fill="none" stroke="#0D6B68" stroke-width="9" stroke-linecap="round"/><path d="M 290 400 L 350 470" fill="none" stroke="#0D6B68" stroke-width="7" marker-end="url(#arrow)"/><rect x="180" y="480" width="430" height="330" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><path d="M 225 545 L 565 545" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round"/><path d="M 225 597 L 500 597" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round"/><rect x="205" y="630" width="380" height="62" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5"/><path d="M 235 661 L 545 661" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="round"/><path d="M 225 745 L 470 745" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round"/><path d="M 600 661 L 665 661" fill="none" stroke="#0D6B68" stroke-width=