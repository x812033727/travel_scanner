<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">四個縮寫指向四個不同的終點 / Four acronyms, four different destinations</title>
  <desc id="desc">四個並排的圓角方塊各自往下連到形狀不同的終點：一份清單、一段被引用的文字、一個單獨的答案框，以及一個虛線的問號框。象徵四個縮寫想換到的東西並不相同，最後一個的所指還沒有固定下來。畫面上方有一行短標題。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="800" y="150" font-size="46" font-weight="bold" fill="#102A2B" text-anchor="middle">四個縮寫，四個問題</text>

