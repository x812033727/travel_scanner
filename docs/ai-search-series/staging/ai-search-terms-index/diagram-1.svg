<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">四個縮寫，四個不同的問題 / Four acronyms, four different questions</title>
  <desc id="desc">四欄並排比較 SEO、GEO、AEO、AIO。每一欄依序列出中文譯法、這個詞想換到什麼、詞從哪裡來、有沒有共同定義、從網站外面量不量得到。SEO 是唯一四項都有明確答案的；GEO 出自 2023 年的一篇論文，業界沿用名字卻沒沿用指標；AEO 有混用與區分兩派並存；AIO 是三個所指共用一個縮寫，得先問對方指哪一個。底部提醒：先問對方用的是哪一個定義，再看他的數字是在什麼設定下量到的。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">四個縮寫，四個不同的問題</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Four acronyms, four different questions</text>

  <g>
    <rect x="62" y="130" width="345" height="530" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="234" y="182" font-size="30" font-weight="bold" fill="#0D6B68" text-anchor="middle">SEO</text>
    <text x="234" y="214" font-size="16" fill="#5C6B6B" text-anchor="middle">搜尋引擎最佳化</text>
    <line x1="92" y1="236" x2="377" y2="236" stroke="#E3F0EF" stroke-width="3"/>
    <text x="234" y="272" font-size="15" fill="#5C6B6B" text-anchor="middle">想換到什麼</text>
    <text x="234" y="300" font-size="18" fill="#102A2B" text-anchor="middle">在結果裡被找到</text>
    <text x="234" y="380" font-size="15" fill="#5C6B6B" text-anchor="middle">詞從哪裡來</text>
    <text x="234" y="408" font-size="18" fill="#102A2B" text-anchor="middle">業界長期用語</text>
    <text x="234" y="488" font-size="15" fill="#5C6B6B" text-anchor="middle">有沒有共同定義</text>
    <text x="234" y="516" font-size="18" fill="#2E7D5B" text-anchor="middle">有，文件寫得很細</text>
    <text x="234" y="596" font-size="15" fill="#5C6B6B" text-anchor="middle">從外面量得到嗎</text>
    <text x="234" y="624" font-size="18" fill="#102A2B" text-anchor="middle">可以，有官方報表</text>
  </g>

  <g>
    <rect x="439" y="130" width="345" height="530" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
    <text x="611" y="182" font-size="30" font-weight="bold" fill="#2F6F9F" text-anchor="middle">GEO</text>
    <text x="611" y="214" font-size="16" fill="#5C6B6B" text-anchor="middle">生成引擎最佳化</text>
    <line x1="469" y1="236" x2="754" y2="236" stroke="#E6F0F7" stroke-width="3"/>
    <text x="611" y="272" font-size="15" fill="#5C6B6B" text-anchor="middle">想換到什麼</text>
    <text x="611" y="300" font-size="18" fill="#102A2B" text-anchor="middle">被生成的答案引用</text>
    <text x="611" y="380" font-size="15" fill="#5C6B6B" text-anchor="middle">詞從哪裡來</text>
    <text x="611" y="408" font-size="18" fill="#102A2B" text-anchor="middle">2023 年的一篇論文</text>
    <text x="611" y="488" font-size="15" fill="#5C6B6B" text-anchor="middle">有沒有共同定義</text>
    <text x="611" y="516" font-size="18" fill="#D97A2B" text-anchor="middle">論文有，業界沒沿用</text>
    <text x="611" y="596" font-size="15" fill="#5C6B6B" text-anchor="middle">從外面量得到嗎</text>
    <text x="611" y="624" font-size="18" fill="#102A2B" text-anchor="middle">部分，回答附來源時</text>
  </g>

  <g>
    <rect x="816" y="130" width="345" height="530" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
    <text x="988" y="182" font-size="30" font-weight="bold" fill="#D97A2B" text-anchor="middle">AEO</text>
    <text x="988" y="214" font-size="16" fill="#5C6B6B" text-anchor="middle">答案引擎最佳化</text>
    <line x1="846" y1="236" x2="1131" y2="236" stroke="#F2E2D2" stroke-width="3"/>
    <text x="988" y="272" font-size="15" fill="#5C6B6B" text-anchor="middle">想換到什麼</text>
    <text x="988" y="300" font-size="18" fill="#102A2B" text-anchor="middle">成為那一個答案</text>
    <text x="988" y="380" font-size="15" fill="#5C6B6B" text-anchor="middle">詞從哪裡來</text>
    <text x="988" y="408" font-size="18" fill="#102A2B" text-anchor="middle">早於生成式 AI</text>
    <text x="988" y="488" font-size="15" fill="#5C6B6B" text-anchor="middle">有沒有共同定義</text>
    <text x="988" y="516" font-size="18" fill="#D97A2B" text-anchor="middle">混用與區分兩派並存</text>
    <text x="988" y="596" font-size="15" fill="#5C6B6B" text-anchor="middle">從外面量得到嗎</text>
    <text x="988" y="624" font-size="18" fill="#102A2B" text-anchor="middle">部分，曝光與點擊分開</text>
  </g>

  <g>
    <rect x="1193" y="130" width="345" height="530" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
    <text x="1365" y="182" font-size="30" font-weight="bold" fill="#B8442D" text-anchor="middle">AIO</text>
    <text x="1365" y="214" font-size="16" fill="#5C6B6B" text-anchor="middle">沒有穩定譯法</text>
    <line x1="1223" y1="236" x2="1508" y2="236" stroke="#F0DCD6" stroke-width="3"/>
    <text x="1365" y="272" font-size="15" fill="#5C6B6B" text-anchor="middle">想換到什麼</text>
    <text x="1365" y="300" font-size="18" fill="#102A2B" text-anchor="middle">看對方指哪一個</text>
    <text x="1365" y="380" font-size="15" fill="#5C6B6B" text-anchor="middle">詞從哪裡來</text>
    <text x="1365" y="408" font-size="18" fill="#102A2B" text-anchor="middle">縮寫碰撞，三個所指</text>
    <text x="1365" y="488" font-size="15" fill="#5C6B6B" text-anchor="middle">有沒有共同定義</text>
    <text x="1365" y="516" font-size="18" fill="#B8442D" text-anchor="middle">沒有，先問指哪一個</text>
    <text x="1365" y="596" font-size="15" fill="#5C6B6B" text-anchor="middle">從外面量得到嗎</text>
    <text x="1365" y="624" font-size="18" fill="#102A2B" text-anchor="middle">看它指的是哪一個</text>
  </g>

  <rect x="62" y="706" width="1476" height="92" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="745" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">先問對方用的是哪一個定義，再看他的數字是在什麼設定下量到的</text>
  <text x="800" y="777" font-size="17" fill="#5C6B6B" text-anchor="middle">共識程度由左到右遞減；本系列不替任何一方裁決</text>

  <text x="1540" y="858" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
