  <rect x="856" y="258" width="440" height="24" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="856" y="328" width="500" height="24" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>

  <rect x="740" y="510" width="720" height="270" rx="26" fill="#102A2B" stroke="#B8442D" stroke-width="6"/>
  <rect x="806" y="576" width="560" height="24" rx="12" fill="#2C4344"/>
  <rect x="806" y="644" width="460" height="24" rx="12" fill="#2C4344"/>
  <rect x="806" y="712" width="520" height="24" rx="12" fill="#2C4344"/>

  <text x="300" y="726" font-size="46" font-weight="bold" text-anchor="middle" fill="#102A2B">看得到與看不到</text>
</svg>
