<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/font/tc/index.css"><link rel="stylesheet" href="/font/mono/index.css">
<title>DuckDB 完整匯出：本片原創操作視窗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{background:#0a101b;color:#eef4ff;font-family:'Noto Sans TC Variable',sans-serif}main{padding:32px 52px;height:1080px;display:grid;grid-template-rows:104px 82px 1fr 38px;gap:16px}.head{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:24px;color:#70e2bd;letter-spacing:1px}.head h1{font-size:44px;line-height:1.2;margin:8px 0 0;font-weight:750}.label{text-align:right;font-size:24px;line-height:1.65;color:#9eafc7}.label strong{color:#eef4ff;font-weight:600}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{border:1px solid #26354d;background:#111c2b;border-radius:12px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}.stat span{font-size:24px;color:#b8c7da}.stat b{font-size:34px;color:#70e2bd;font-family:'JetBrains Mono Variable','Noto Sans TC Variable',monospace}.terminal{min-height:0;border:1px solid #35465e;border-radius:14px;background:#101725;overflow:hidden;display:grid;grid-template-rows:48px 62px 1fr 48px;box-shadow:0 14px 36px #0004}.bar{background:#172336;border-bottom:1px solid #2d3e55;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:24px;color:#ccd8e8}.bar small{font-size:22px;color:#9eafc7}.entry{display:flex;align-items:center;padding:7px 22px;gap:16px;border-bottom:1px solid #27374e}.prompt{color:#70e2bd;font-size:27px;font-family:monospace}textarea{display:block;resize:none;flex:1;height:42px;border:0;outline:0;background:transparent;color:#f6f9ff;font:24px/40px 'JetBrains Mono Variable',monospace;white-space:pre;overflow:hidden}button{font:24px 'Noto Sans TC Variable',sans-serif;background:#243b52;border:1px solid #42617c;color:#e8f3ff;padding:3px 16px;border-radius:7px;height:42px}button:disabled{opacity:.55}.content{min-height:0;position:relative}.output{height:100%;min-height:0;margin:0;padding:18px 24px;overflow:auto;white-space:pre;font:24px/28px 'JetBrains Mono Variable',monospace;color:#e6edf8;scrollbar-width:thin;scrollbar-color:#536985 #152033}.fileInfo{position:absolute;inset:32px 28px auto;padding:28px;border:1px solid #3b5e70;border-radius:12px;background:#142637;color:#dcf5ed;font-size:27px;line-height:1.9;white-space:pre-wrap}.explanation{display:flex;align-items:center;padding:0 22px;font-size:25px;color:#f4d18b;background:#182235;border-top:1px solid #30405a;white-space:nowrap}.footer{font-size:22px;color:#94a8c2;display:flex;align-items:center;justify-content:space-between}.status{color:#a5c1e4}.status.error{color:#ffaaa2}
</style></head><body><main>
<header class="head"><div><div class="eyebrow">DuckDB 2.0 · 完整資料匯出</div><h1>從預覽走到真正交出的檔案</h1></div><div class="label"><strong>本片原創操作視窗</strong><br>本機 CLI 實跑 · 操作重現</div></header>
<section class="stats"><div class="stat"><span>原始資料列</span><b id="inputRows">—</b></div><div class="stat"><span>預覽顯示列</span><b id="previewRows">—</b></div><div class="stat"><span>嚴格晚到 ＞</span><b id="strictRows">—</b></div><div class="stat"><span>含準時 ≥</span><b id="inclusiveRows">—</b></div></section>
<section class="terminal"><div class="bar"><span id="stepTitle">準備同一份教學資料</span><small id="status" class="status">等待執行</small></div><form id="form" class="entry"><span class="prompt">$</span><textarea id="command" rows="1" spellcheck="false" aria-label="實際指令"></textarea><button id="run" type="submit">執行</button></form><div class="content"><pre id="output" class="output"></pre><div id="fileInfo" class="fileInfo" hidden></div></div><div id="explanation" class="explanation">每個指令在錄影期間執行，畫面呈現當次實際輸出。</div></section>
<footer class="footer"><span>操作重現：2026-10-27 · 原創虛構教學資料 · 無配音</span><span>原始 fixture：2026-10-25 · 未做效能或模型推理評測</span></footer>
</main><script>
let current=-1;window.lastResult=null;window.lastError=null;
window.setStep=(i,title,note)=>{current=i;window.lastResult=null;window.lastError=null;document.querySelector('#stepTitle').textContent=title;document.querySelector('#explanation').textContent=note;document.querySelector('#command').value='';document.querySelector('#output').textContent='';document.querySelector('#fileInfo').hidden=true;const s=document.querySelector('#status');s.textContent='準備執行';s.className='status';document.querySelector('#run').disabled=false;};
window.setMetrics=m=>{for(const [id,value]of Object.entries(m)){const node=document.getElementById(id);if(node)node.textContent=typeof value==='number'?value.toLocaleString('en-US'):value;}};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status'),button=document.querySelector('#run');button.disabled=true;s.textContent='執行中';try{const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({step:current,display:document.querySelector('#command').value})});const x=await r.json();if(!r.ok||x.actual_exit!==0)throw Error(x.error??'指令未完成');document.querySelector('#output').textContent=x.stdout;window.setMetrics(x.metrics);if(x.generated_file){const f=document.querySelector('#fileInfo');f.textContent='已寫出 '+x.generated_file.file+'\n'+x.generated_file.rows.toLocaleString('en-US')+' 筆資料 · '+x.generated_file.bytes.toLocaleString('en-US')+' bytes\n與前一步 CSV 完整內容一致\n（操作視窗讀回檔案資訊）';f.hidden=false;}s.textContent='exit 0 · 實際輸出';window.lastResult=x;}catch(err){s.textContent='執行未完成';s.className='status error';window.lastError=String(err.message);}};
document.querySelector('#command').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit();}};
</script></body></html>
