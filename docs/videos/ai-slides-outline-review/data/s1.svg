<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>同一份報告，先問兩個問題</title><rect width="1600" height="900" fill="#f8faf8"/>
<text x="80" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">本地流程示範｜不是 Gemini Notebook 產品畫面</text>
<text x="80" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="54" fill="#172d46" font-weight="700">同一份報告，先問兩個問題</text>
<rect x="80" y="200" width="1440" height="3" fill="#bac8cf" rx="10"/>
<rect x="80" y="275" width="690" height="305" fill="#e2eeee" rx="10"/>
<rect x="800" y="275" width="720" height="305" fill="#e5eaf3" rx="10"/>
<text x="120" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="62" fill="#007f85" font-weight="700">投入多少錢？</text>
<text x="120" y="445" font-family="Noto Sans CJK TC,sans-serif" font-size="42" fill="#172d46" font-weight="400">投資類型／地區／資料年</text>
<text x="120" y="525" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">單位：十億美元</text>
<text x="840" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="58" fill="#172d46" font-weight="700">多少人在回報使用？</text>
<text x="840" y="445" font-family="Noto Sans CJK TC,sans-serif" font-size="42" fill="#172d46" font-weight="400">受訪者／組織／業務功能</text>
<text x="840" y="525" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">單位：受訪者比例</text>
<text x="80" y="680" font-family="Noto Sans CJK TC,sans-serif" font-size="48" fill="#172d46" font-weight="700">先審問題與口徑，再把確認的數字放進簡報。</text>
<text x="80" y="795" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">資料：2026 AI Index 經濟章；本例只展示其2025資料</text>
<text x="80" y="855" font-family="Noto Sans CJK TC,sans-serif" font-size="32" fill="#4b5a65" font-weight="400">本地原創排版與頁碼核對；沒有執行Notebook／Canva生成服務</text>
</svg>
