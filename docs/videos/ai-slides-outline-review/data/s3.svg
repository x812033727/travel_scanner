<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>2025：用同一私人融資口徑比較地區</title><rect width="1600" height="900" fill="#f8faf8"/>
<text x="80" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">本地流程示範｜不是 Gemini Notebook 產品畫面</text>
<text x="80" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="54" fill="#172d46" font-weight="700">2025：用同一私人融資口徑比較地區</text>
<rect x="80" y="200" width="1440" height="3" fill="#bac8cf" rx="10"/>
<text x="80" y="280" font-family="Noto Sans CJK TC,sans-serif" font-size="40" fill="#4b5a65" font-weight="400">單位：十億美元｜私人AI投資，不是全國AI總支出</text>
<text x="80" y="365" font-family="Noto Sans CJK TC,sans-serif" font-size="50" fill="#172d46" font-weight="700">美國</text>
<rect x="300" y="319" width="905.2866666666666" height="70" fill="#172d46" rx="10"/>
<text x="1300" y="370" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">285.88</text>
<text x="80" y="535" font-family="Noto Sans CJK TC,sans-serif" font-size="50" fill="#172d46" font-weight="700">中國</text>
<rect x="300" y="489" width="39.29833333333334" height="70" fill="#007f85" rx="10"/>
<text x="1300" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">12.41</text>
<text x="80" y="690" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">同年份、同單位、同投資類型，才放在同一圖上。</text>
<text x="80" y="795" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">來源：圖4.2.8｜報告p182／PDF第12頁｜Quid，2025</text>
<text x="80" y="855" font-family="Noto Sans CJK TC,sans-serif" font-size="32" fill="#4b5a65" font-weight="400">本地原創排版與頁碼核對；沒有執行Notebook／Canva生成服務</text>
