<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>2025：受訪者回報組織使用AI</title><rect width="1600" height="900" fill="#f8faf8"/>
<text x="80" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">本地流程示範｜不是 Gemini Notebook 產品畫面</text>
<text x="80" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="54" fill="#172d46" font-weight="700">2025：受訪者回報組織使用AI</text>
<rect x="80" y="200" width="1440" height="3" fill="#bac8cf" rx="10"/>
<text x="80" y="280" font-family="Noto Sans CJK TC,sans-serif" font-size="40" fill="#4b5a65" font-weight="400">至少一項業務使用AI｜自述調查，不是人口普查</text>
<rect x="80" y="340" width="880" height="105" fill="#007f85" rx="10"/>
<text x="1020" y="425" font-family="Noto Sans CJK TC,sans-serif" font-size="90" fill="#007f85" font-weight="700">88%</text>
<text x="80" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="44" fill="#172d46" font-weight="700">生成式AI數字暫不當作已確認的採用率：</text>
<text x="80" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="42" fill="#b83e2a" font-weight="400">摘要p173列70%；詳文p193列79%，措辭不同。</text>
<text x="80" y="665" font-family="Noto Sans CJK TC,sans-serif" font-size="42" fill="#b83e2a" font-weight="400">年份皆指2025；問法／分母是否一致仍待釐清。</text>
<text x="80" y="795" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">來源：報告p173、p193／PDF第3、23頁｜圖4.3.1</text>
<text x="80" y="855" font-family="Noto Sans CJK TC,sans-serif" font-size="32" fill="#4b5a65" font-weight="400">本地原創排版與頁碼核對；沒有執行Notebook／Canva生成服務</text>
</svg>
