<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>2025：全球企業投資與其中私人投資</title><rect width="1600" height="900" fill="#f8faf8"/>
<text x="80" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">本地流程示範｜不是 Gemini Notebook 產品畫面</text>
<text x="80" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="54" fill="#172d46" font-weight="700">2025：全球企業投資與其中私人投資</text>
<rect x="80" y="200" width="1440" height="3" fill="#bac8cf" rx="10"/>
<text x="80" y="280" font-family="Noto Sans CJK TC,sans-serif" font-size="40" fill="#4b5a65" font-weight="400">單位：十億美元｜企業總額包含多種融資活動</text>
<text x="80" y="365" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">全球企業投資</text>
<rect x="420" y="319" width="824.0608333333334" height="70" fill="#172d46" rx="10"/>
<text x="1320" y="370" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">581.69</text>
<text x="80" y="535" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">其中：私人投資</text>
<rect x="420" y="489" width="488.2683333333334" height="70" fill="#007f85" rx="10"/>
<text x="1320" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">344.66</text>
<text x="80" y="690" font-family="Noto Sans CJK TC,sans-serif" font-size="46" fill="#172d46" font-weight="700">私人投資是其中一部分，兩個數字不可相加。</text>
<text x="80" y="795" font-family="Noto Sans CJK TC,sans-serif" font-size="36" fill="#4b5a65" font-weight="400">來源：圖4.2.1｜報告p178／PDF第8頁｜Quid，2025</text>
<text x="80" y="855" font-family="Noto Sans CJK TC,sans-serif" font-size="32" fill="#4b5a65" font-weight="400">本地原創排版與頁碼核對；沒有執行Notebook／Canva生成服務</text>
