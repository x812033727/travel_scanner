<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>複選不能直接拼圓餅</title><desc>如果把每項都當互不重疊，圓餅就會畫錯。。原創示意，非本調查數據。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創示意，非本調查數據</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">複選不能直接拼圓餅</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="355.5" y="340" width="275" height="283" rx="19" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="355.5" y="340" width="275" height="60" rx="19" fill="#BF5146" stroke="none" opacity="1"/><text x="493" y="457" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">有困擾的人</text><text x="493" y="561" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">6 人</text><rect x="662.5" y="340" width="275" height="283" rx="19" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="662.5" y="340" width="275" height="60" rx="19" fill="#D5A544" stroke="none" opacity="1"/><text x="800" y="457" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">困擾勾選</text><text x="800" y="561" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">7 個</text><rect x="969.5" y="340" width="275" height="283" rx="19" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="969.5" y="340" width="275" height="60" rx="19" fill="#DCD5C6" stroke="none" opacity="1"/><text x="1107" y="457" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">沒有困擾的人</text><text x="1107" y="561" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">4 人</text><text x="800" y="742" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="middle">同一位旅客能勾選多個困擾</text></g></svg>
