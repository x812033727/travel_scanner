<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>把轉述說完整</title><desc>你可以試著，把那句分享文字再說完整一次。。原創概念示意。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創概念示意</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">把轉述說完整</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="379" y="299" width="844" height="150" rx="21" fill="#FFF9E9" stroke="#22344B" opacity="1"/><text x="801" y="364" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="36" font-weight="600" text-anchor="middle">本次受訪者：困擾項目之中</text><text x="801" y="415" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="37" font-weight="600" text-anchor="middle">垃圾桶少最多人選（17.2%）</text><text x="801" y="563" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="35" font-weight="600" text-anchor="middle">另外 43.7% 回答沒有困擾</text><text x="801" y="669" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">旅行經驗，不是全國垃圾桶數量</text></g></svg>
