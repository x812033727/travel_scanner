<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>不替受訪者補答案</title><desc>不能拿我們的想像，替實際受訪者填答案。。原創概念示意。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創概念示意</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">不替受訪者補答案</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(564 448) scale(1.02)"><circle cx="0" cy="-61" r="22" fill="#E8C69B"/><path d="M-29 -25 Q0 -42 29 -25 L37 40 H-37 Z" fill="#BF5146"/><path d="M-19 40 L-24 82 M19 40 L24 82" fill="none" stroke-width="12"/><path d="M-28 -19 L-44 27 M28 -19 L45 27" fill="none" stroke-width="10"/><path d="M-70 31 L-76 39 Q-90 72 -72 86 H-49 Q-36 70 -48 39 L-54 31 Z" fill="#D5A544"/><path d="M-71 29 H-52" stroke="#BF5146" stroke-width="6"/></g><g transform="translate(1025 447) scale(1.1)"><path d="M-90 -122 H42 L90 -74 V126 H-90 Z" fill="#FFF9E9"/><path d="M42 -122 V-74 H90" fill="#D5A544"/></g><text x="1025" y="435" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="middle">受訪者</text><text x="1025" y="499" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="middle">自己回答</text><text x="800" y="728" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">想像的情境，不代填真實受訪者答案</text></g></svg>
