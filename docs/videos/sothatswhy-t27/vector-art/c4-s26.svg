<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>比例連著題目</title><desc>所以每項比例，要連著它的題目來讀。。原創示意，非本調查數據。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創示意，非本調查數據</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">比例連著題目</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="490" y="264" width="619" height="440" rx="20" fill="#FFF9E9" stroke="#22344B" opacity="1"/><text x="800" y="319" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">這趟旅行遇到什麼困擾？</text><g transform="translate(587 397) scale(1)"><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#FFF9E9" stroke="#22344B" opacity="1"/></g><text x="644" y="407" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="start">垃圾桶</text><g transform="translate(587 479) scale(1)"><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#FFF9E9" stroke="#22344B" opacity="1"/></g><text x="644" y="489" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="start">網路</text><g transform="translate(587 561) scale(1)"><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#FFF9E9" stroke="#22344B" opacity="1"/></g><text x="644" y="571" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="start">指標</text><g transform="translate(587 643) scale(1)"><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#FFF9E9" stroke="#22344B" opacity="1"/></g><text x="644" y="653" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="start">溝通</text><text x="1017" y="683" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="30" font-weight="600" text-anchor="middle">可複選</text><text x="800" y="758" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">題目問經驗，不是街道數量</text></g></svg>
