<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>改寫旅行分享卡</title><desc>那回到那張分享卡，現在你會怎麼改？。原創概念示意。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創概念示意</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">改寫旅行分享卡</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="379" y="299" width="844" height="150" rx="21" fill="#FFF9E9" stroke="#22344B" opacity="1"/><text x="801" y="389" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="45" font-weight="600" text-anchor="middle">最多人抱怨垃圾桶</text><text x="801" y="530" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="middle">少了：誰？何時？哪一道題？</text><rect x="540.0" y="626" width="520" height="62" rx="14" fill="#D5A544" stroke="none" opacity="1"/><text x="800" y="667" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">容易誤讀的省略示意</text></g></svg>
