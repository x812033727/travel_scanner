<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>十人｜十一個勾</title><desc>加上四個沒有困擾的勾，總共十一個。。原創示意，非本調查數據。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創示意，非本調查數據</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">十人｜十一個勾</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="381" y="350" width="162" height="193" rx="16" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="419.0" y="365" width="86" height="62" rx="14" fill="#BF5146" stroke="none" opacity="1"/><text x="462" y="406" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">桶</text><text x="462" y="503" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="56" font-weight="600" text-anchor="middle">3</text><text x="573" y="475" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">+</text><rect x="605" y="350" width="162" height="193" rx="16" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="643.0" y="365" width="86" height="62" rx="14" fill="#D5A544" stroke="none" opacity="1"/><text x="686" y="406" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">網</text><text x="686" y="503" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="56" font-weight="600" text-anchor="middle">2</text><text x="797" y="475" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">+</text><rect x="829" y="350" width="162" height="193" rx="16" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="867.0" y="365" width="86" height="62" rx="14" fill="#AFCAA9" stroke="none" opacity="1"/><text x="910" y="406" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">牌</text><text x="910" y="503" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="56" font-weight="600" text-anchor="middle">1</text><text x="1021" y="475" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="46" font-weight="600" text-anchor="middle">+</text><rect x="1053" y="350" width="162" height="193" rx="16" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="1091.0" y="365" width="86" height="62" rx="14" fill="#91B9CA" stroke="none" opacity="1"/><text x="1134" y="406" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="middle">話</text><text x="1134" y="503" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="56" font-weight="600" text-anchor="middle">1</text><text x="800" y="654" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="49" font-weight="600" text-anchor="middle">3 + 2 + 1 + 1 = 7</text><text x="800" y="758" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">7 個困擾勾 + 4 個沒有困擾勾 = 11</text></g></svg>
