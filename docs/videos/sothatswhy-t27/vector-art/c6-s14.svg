<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>把來源和轉述放一起</title><desc>來源裡的完整問題和日期，也能留給朋友核對。。原創概念示意。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創概念示意</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">把來源和轉述放一起</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="399" y="297" width="787" height="390" rx="18" fill="#FFF9E9" stroke="#22344B" opacity="1"/><text x="799" y="368" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="38" font-weight="600" text-anchor="middle">來源與轉述放在一起</text><rect x="454" y="413" width="678" height="88" rx="12" fill="#F7F0DE" stroke="#22344B" opacity="1"/><text x="800" y="467" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="34" font-weight="600" text-anchor="middle">觀光廳調查結果</text><rect x="454" y="533" width="678" height="88" rx="12" fill="#F7F0DE" stroke="#22344B" opacity="1"/><text x="800" y="587" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="middle">完整題目、受訪範圍、日期</text><text x="800" y="758" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">保留來源，朋友可以核對</text></g></svg>
