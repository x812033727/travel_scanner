<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>公布日≠旅行日</title><desc>它不能換成，每個受訪者都在四月旅行。。調查資訊重繪｜觀光廳 2026-04-28。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">調查資訊重繪｜觀光廳 2026-04-28</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">公布日≠旅行日</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="398" y="315" width="383" height="319" rx="20" fill="#FFF9E9" stroke="#22344B" opacity="1"/><rect x="823" y="315" width="383" height="319" rx="20" fill="#FFF9E9" stroke="#22344B" opacity="1"/><text x="590" y="402" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="34" font-weight="600" text-anchor="middle">結果公布</text><text x="1015" y="402" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="34" font-weight="600" text-anchor="middle">每個人旅行</text><text x="590" y="525" fill="#BF5146" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="32" font-weight="600" text-anchor="middle">2026-04-28</text><text x="1015" y="525" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="33" font-weight="600" text-anchor="middle">不是公布日</text><text x="800" y="753" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">公布結果，不能改成全體的旅行日</text></g></svg>
