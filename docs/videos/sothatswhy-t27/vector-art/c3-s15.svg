<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>原創回答卡比喻</title><desc>年底收下的那張回答卡，四月公布時仍是那張卡。。原創概念示意。Original native SVG artwork authored for Mokaair T27; no external assets。</desc><rect width="1600" height="900" fill="#F7F0DE"/><rect x="97" y="80" width="8" height="48" rx="4" fill="#BF5146"/><text x="127" y="113" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="28" font-weight="600" text-anchor="start">原創概念示意</text><text x="127" y="163" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="29" font-weight="600" text-anchor="start">原創回答卡比喻</text><g stroke="#22344B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(592 454) scale(1)"><path d="M-90 -122 H42 L90 -74 V126 H-90 Z" fill="#FFF9E9"/><path d="M42 -122 V-74 H90" fill="#D5A544"/></g><text x="592" y="452" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">年底回答</text><g transform="translate(1018 454) scale(1)"><path d="M-90 -122 H42 L90 -74 V126 H-90 Z" fill="#FFF9E9"/><path d="M42 -122 V-74 H90" fill="#D5A544"/></g><text x="1018" y="452" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">四月公布</text><path d="M748 475 L865 475" fill="none" stroke="#BF5146" stroke-width="5"/><path d="M848.0 484.0 L865 475 L848.0 466.0" fill="none" stroke="#BF5146" stroke-width="5"/><text x="801" y="740" fill="#22344B" stroke="none" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="31" font-weight="600" text-anchor="middle">同一份回答；公布沒有改寫收集日</text></g></svg>
