<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">飛行員安全降落而跳離者落點未確認的資料摘要示意</title>
  <desc id="description">只有兩張文字資料卡，對照飛行員安全降落與跳離者不在機艙、落點未確認；不畫確定落點、樹林、山谷、人物、飛機或路線。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">事件結果示意</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：FBI 案件史</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">飛行員安全降落，跳離者落點未確認</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#102f38" stroke="#315a5e" stroke-width="4"/>
  <rect x="157" y="335" width="601" height="253" rx="27" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <rect x="842" y="335" width="601" height="253" rx="27" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <rect x="157" y="335" width="601" height="16" rx="8" fill="#4fc1b5"/>
  <rect x="842" y="335" width="601" height="16" rx="8" fill="#e3a256"/>
  <text x="457" y="426" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="34" font-weight="700">飛行員</text>
  <text x="457" y="510" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="52" font-weight="700">安全降落</text>
  <text x="1142" y="426" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="34" font-weight="700">跳離者</text>
  <text x="1142" y="500" text-anchor="middle" fill="#a35120" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="46" font-weight="700">不在機艙</text>
  <text x="1142" y="551" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="29">落點未確認</text>
  <path d="M800 357 V567" stroke="#769496" stroke-width="5" stroke-dasharray="10 14"/>
  <text x="800" y="643" text-anchor="middle" fill="#d8e8e8" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">資料摘要示意 · 非當年影像 · 不表示落點或路線</text>
</svg>
