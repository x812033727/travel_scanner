<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">夜間機尾階梯放下的事件示意</title>
  <desc id="description">以兩個文字方塊表示三〇五號班機與紀錄中的機尾階梯放下事件；不繪製實際階梯、乘客、標誌或落點。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">案件流程示意 · 03</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：FAA 年表、FBI 案件史</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">那天晚上，機尾階梯在空中放下</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#102f38" stroke="#315a5e" stroke-width="4"/>
  <circle cx="1363" cy="345" r="49" fill="#e3a256"/>
  <path d="M1345 300 A49 49 0 1 0 1401 369 A53 53 0 0 1 1345 300" fill="#102f38"/>
  <rect x="157" y="352" width="440" height="212" rx="27" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <text x="377" y="437" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="42" font-weight="700">三〇五號班機</text>
  <text x="377" y="502" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="30">夜間飛行</text>
  <path d="M650 458 H882" stroke="#e3a256" stroke-width="16" stroke-linecap="round"/>
  <path d="M850 417 L916 458 L850 499" fill="none" stroke="#e3a256" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="962" y="352" width="441" height="212" rx="27" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <text x="1183" y="437" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="42" font-weight="700">機尾階梯</text>
  <text x="1183" y="502" text-anchor="middle" fill="#a35120" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="38" font-weight="700">在空中放下</text>
  <text x="800" y="645" text-anchor="middle" fill="#d8e8e8" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">事件示意；不重建階梯形狀、人物或落點。非當年影像。</text>
</svg>