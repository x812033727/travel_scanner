<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">FBI 搜尋機身物證的流程摘要示意</title>
  <desc id="description">以空白機身範圍與搜尋線索兩個抽象區塊表示 FBI 搜尋飛機物證；不畫座位、乘客、探員、文件、物證或物證位置。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">調查範圍示意</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：FBI 案件史</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">探員搜尋機身，尋找物證線索</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#102f38" stroke="#315a5e" stroke-width="4"/>
  <rect x="160" y="341" width="530" height="238" rx="119" fill="none" stroke="#86b8b4" stroke-width="9"/>
  <text x="425" y="445" text-anchor="middle" fill="#eaf0ed" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="48" font-weight="700">機身整體</text>
  <text x="425" y="509" text-anchor="middle" fill="#b8d6d2" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="30">不指向特定座位</text>
  <path d="M743 460 H847" stroke="#e3a256" stroke-width="13" stroke-linecap="round"/>
  <path d="M821 428 L861 460 L821 492" fill="none" stroke="#e3a256" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="911" y="341" width="530" height="238" rx="28" fill="#eaf0ed" stroke="#9db8ba" stroke-width="5"/>
  <text x="1176" y="445" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="48" font-weight="700">搜尋可能物證</text>
  <text x="1176" y="509" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="30">不表示找到的物品或位置</text>
  <text x="800" y="651" text-anchor="middle" fill="#c7dfdb" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">調查範圍示意 · 非當年搜查畫面 · 無人物與物證重建</text>
</svg>
