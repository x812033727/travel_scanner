<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">紙條傳遞的流程示意</title>
  <desc id="description">從乘客座位到空服員的單向箭頭，中間是一張無字小紙片。沒有人物肖像、字跡或實際機艙擺設；不是當年紙條原件。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <text x="95" y="112" fill="#102a2b" font-size="59" font-weight="700">一張紙條，交到空服員手中</text>
  <text x="98" y="165" fill="#52666a" font-size="28">依 FBI 案件紀錄繪製流程 · 紙條內容與外形不重建</text>

  <rect x="94" y="236" width="1412" height="480" rx="34" fill="#e4eeee" stroke="#9db8ba" stroke-width="4"/>
  <rect x="142" y="285" width="380" height="380" rx="28" fill="#ffffff" stroke="#2c585d" stroke-width="5"/>
  <text x="332" y="354" text-anchor="middle" fill="#234549" font-size="39" font-weight="700">乘客座位</text>
  <path d="M270 414 H394 Q422 414 422 442 V556 H248 V455 Q248 414 270 414 Z" fill="#d8e7e8" stroke="#2c585d" stroke-width="8"/>
  <path d="M246 556 H432" stroke="#2c585d" stroke-width="9" stroke-linecap="round"/>
  <path d="M274 560 V596 M401 560 V596" stroke="#2c585d" stroke-width="9" stroke-linecap="round"/>

  <path d="M546 475 H1030" fill="none" stroke="#2e898d" stroke-width="17" stroke-linecap="round"/>
  <path d="M1003 434 L1070 475 L1003 516" fill="none" stroke="#2e898d" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="699" y="388" width="194" height="123" rx="8" fill="#fffdf7" stroke="#d57a36" stroke-width="8"/>
  <text x="796" y="574" text-anchor="middle" fill="#a35120" font-size="32" font-weight="700">紙條示意</text>

  <rect x="1082" y="285" width="380" height="380" rx="28" fill="#ffffff" stroke="#2c585d" stroke-width="5"/>
  <text x="1272" y="354" text-anchor="middle" fill="#234549" font-size="39" font-weight="700">空服員</text>
  <path d="M1192 475 H1352" stroke="#2c585d" stroke-width="11" stroke-linecap="round"/>
  <path d="M1215 441 H1329 V553 H1215 Z" fill="#d8e7e8" stroke="#2c585d" stroke-width="8"/>
  <path d="M1248 526 H1296" stroke="#2e898d" stroke-width="9" stroke-linecap="round"/>

  <text x="100" y="790" fill="#294d51" font-size="31">只表示傳遞動作；不表示紙條尺寸、筆跡或當年現場樣貌。</text>
  <text x="1500" y="858" text-anchor="end" fill="#5d7173" font-size="25">Mokaair 製圖 · 非當年原件</text>
</svg>
