<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">公事包威脅的紀錄示意</title>
  <desc id="description">只有一個關閉的無標記公事包示意及「聲稱」字卡；不描繪乘客、炸彈結構或當年公事包的外形。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">案件流程示意 · 02</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：FBI 案件史</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="64" font-weight="700">他聲稱，公事包裡有炸彈</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#e4eeee" stroke="#9db8ba" stroke-width="4"/>
  <rect x="152" y="311" width="292" height="92" rx="22" fill="#e3a256"/>
  <text x="298" y="373" text-anchor="middle" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="49" font-weight="700">聲稱</text>
  <path d="M478 357 H584" stroke="#2e898d" stroke-width="13" stroke-linecap="round"/>
  <path d="M558 328 L603 357 L558 386" fill="none" stroke="#2e898d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="680" y="352" width="584" height="240" rx="22" fill="#fffdf7" stroke="#2c585d" stroke-width="9"/>
  <path d="M861 352 V329 Q861 294 895 294 H1049 Q1083 294 1083 329 V352" fill="none" stroke="#2c585d" stroke-width="12"/>
  <path d="M680 421 H1264" stroke="#2c585d" stroke-width="7"/>
  <rect x="797" y="409" width="44" height="26" rx="6" fill="#d8e7e8" stroke="#2c585d" stroke-width="5"/>
  <rect x="1103" y="409" width="44" height="26" rx="6" fill="#d8e7e8" stroke="#2c585d" stroke-width="5"/>
  <text x="971" y="637" text-anchor="middle" fill="#294d51" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31">單一、封閉的公事包示意</text>
  <text x="971" y="670" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">威脅陳述示意；未確認裝置效力或公事包外形。非當年原件。</text>
</svg>