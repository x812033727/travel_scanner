<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">聯邦調查局代號 NORJAK 的資料摘要示意</title>
  <desc id="description">排版展示 FBI 案件代號 NORJAK 與 Northwest Hijacking 的對應，沒有機艙、人物、機票、調查文件或當年現場影像。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">案件代號示意</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：FBI 案件史</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">調查局把這起案件稱作 NORJAK</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#102f38" stroke="#315a5e" stroke-width="4"/>
  <path d="M152 349 H1448" stroke="#476a6b" stroke-width="3"/>
  <text x="170" y="332" fill="#9ec8c7" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700">FBI 案件代號</text>
  <text x="800" y="472" text-anchor="middle" fill="#f3e4b9" font-family="Arial, sans-serif" font-size="128" font-weight="700" letter-spacing="10">NORJAK</text>
  <rect x="278" y="516" width="1044" height="99" rx="22" fill="#eaf0ed"/>
  <text x="800" y="579" text-anchor="middle" fill="#21474b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="45" font-weight="700">Northwest Hijacking · 西北劫機案</text>
  <text x="800" y="654" text-anchor="middle" fill="#c7dfdb" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">資料摘要示意 · 非當年文件或現場影像</text>
</svg>
