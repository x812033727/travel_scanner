<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Kaye 與 Meltzer 的埋沙滲入對照示意</title>
  <desc id="description">三個純文字區塊依序說明兩疊現代鈔票、埋沙後灌入高濃度矽藻土水、紙邊約三至四毫米的有限滲入；沒有繪製原始贖鈔、論文顯微照片或河岸現場。</desc>
  <rect width="1600" height="800" fill="#f7f1e8"/>
  <path d="M94 78 H1506" stroke="#c6d5d3" stroke-width="5"/>
  <text x="98" y="132" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700">研究對照示意</text>
  <text x="1502" y="132" text-anchor="end" fill="#587073" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="700">資料依據：Kaye、Meltzer（2020）</text>
  <text x="96" y="208" fill="#102a2b" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">埋沙後灌水，滲入只到紙邊幾毫米</text>
  <rect x="94" y="251" width="1412" height="438" rx="34" fill="#102f38" stroke="#315a5e" stroke-width="4"/>
  <rect x="142" y="332" width="375" height="259" rx="26" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <rect x="612" y="332" width="390" height="259" rx="26" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <rect x="1098" y="332" width="361" height="259" rx="26" fill="#ecf3f1" stroke="#9db8ba" stroke-width="5"/>
  <rect x="142" y="332" width="375" height="16" rx="8" fill="#4fc1b5"/>
  <rect x="612" y="332" width="390" height="16" rx="8" fill="#e3a256"/>
  <rect x="1098" y="332" width="361" height="16" rx="8" fill="#4fc1b5"/>
  <text x="330" y="401" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700">對照材料</text>
  <text x="330" y="476" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="48" font-weight="700">現代鈔票</text>
  <text x="330" y="531" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31">兩疊，各五張</text>
  <text x="807" y="401" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700">處理條件</text>
  <text x="807" y="463" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="37" font-weight="700">先埋沙，再灌水</text>
  <text x="807" y="512" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="29">矽藻土水：1 公斤／公升</text>
  <text x="807" y="551" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26">高濃度人為混合</text>
  <text x="1279" y="401" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700">觀察結果</text>
  <text x="1279" y="479" text-anchor="middle" fill="#234549" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="48" font-weight="700">約 3–4 mm</text>
  <text x="1279" y="531" text-anchor="middle" fill="#52666a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="29">紙邊有限滲入</text>
  <path d="M535 459 H584" stroke="#e3a256" stroke-width="11" stroke-linecap="round"/>
  <path d="M566 438 L590 459 L566 480" fill="none" stroke="#e3a256" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1019 459 H1068" stroke="#e3a256" stroke-width="11" stroke-linecap="round"/>
  <path d="M1050 438 L1074 459 L1050 480" fill="none" stroke="#e3a256" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="651" text-anchor="middle" fill="#d8e8e8" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="27">原創資料摘要 · 非原始贖鈔 · 非天然河水或案發現場</text>
</svg>
