<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">一九七〇年法律審檢查前審判決</title>
  <desc id="description">左方一九六七年前審與右方一九七〇年法律審以一條紅色路徑連接。文字只說明法律審檢查前審的法律與程序；非真法院、判決原件，亦不代表法院裁定另一身分。</desc>
  <rect width="1600" height="900" fill="#f4eee3"/>
  <rect x="82" y="74" width="12" height="78" rx="6" fill="#b95347"/>
  <text x="122" y="124" fill="#1c343c" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="60" font-weight="700">一九七〇年，法律審</text>
  <text x="122" y="174" fill="#53686a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="30">前審判決進入審查 · 編輯圖解，非判決原件</text>
  <rect x="122" y="260" width="546" height="290" rx="18" fill="#244651"/>
  <rect x="141" y="278" width="508" height="254" rx="10" fill="#1c343c" stroke="#719da0" stroke-width="4"/>
  <text x="185" y="363" fill="#c4dbd4" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="42">一九六七年</text>
  <text x="185" y="431" fill="#f4eee3" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="68" font-weight="700">前審</text>
  <text x="185" y="496" fill="#c4dbd4" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="36">衡量身分證據</text>
  <path d="M668 409 H780" stroke="#b95347" stroke-width="15" stroke-linecap="round"/>
  <rect x="780" y="384" width="50" height="50" fill="#b95347"/>
  <path d="M830 409 H938" stroke="#b95347" stroke-width="15" stroke-linecap="round"/>
  <path d="M916 385 L950 409 L916 433" fill="none" stroke="#b95347" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="948" y="260" width="538" height="290" rx="18" fill="#87aca8"/>
  <rect x="967" y="278" width="500" height="254" rx="10" fill="#d8e3d9" stroke="#577f7d" stroke-width="4"/>
  <text x="1011" y="363" fill="#476567" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="42">一九七〇年</text>
  <text x="1011" y="431" fill="#1c343c" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="66" font-weight="700">最高法院</text>
  <text x="1011" y="496" fill="#244651" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="36">檢查法律與程序</text>
  <text x="122" y="218" fill="#53686a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26">來源：1970 年德國聯邦最高法院判決掃描，第 3、143–144 頁 · 未裁定另一身分</text>
</svg>
