<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">一九二二年病院裡出現的身分聯想</title>
  <desc id="description">兩張原創無人物字卡以一條未封口的紅色連線表示，有人把身分未明的女子與安娜塔西亞的名字連在一起。非病院現場、人物肖像、原始文件或誰先開口的重建。</desc>
  <rect width="1600" height="900" fill="#f4eee3"/>
  <rect x="82" y="74" width="12" height="78" rx="6" fill="#b95347"/>
  <text x="122" y="124" fill="#1c343c" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="60" font-weight="700">一九二二年，柏林病院</text>
  <text x="122" y="174" fill="#53686a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="30">身分聯想的編輯圖解 · 非現場重建</text>
  <rect x="114" y="260" width="572" height="290" rx="18" fill="#244651"/>
  <rect x="133" y="278" width="534" height="254" rx="10" fill="#1c343c" stroke="#70999a" stroke-width="4"/>
  <circle cx="240" cy="321" r="27" fill="#719da0"/>
  <text x="189" y="410" fill="#f4eee3" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="62" font-weight="700">身分未明</text>
  <text x="190" y="481" fill="#c5dad5" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="36">病院裡的女子</text>
  <path d="M686 409 H754" stroke="#b95347" stroke-width="15" stroke-linecap="round"/>
  <rect x="754" y="386" width="46" height="46" fill="#b95347"/>
  <path d="M800 409 H866" stroke="#b95347" stroke-width="15" stroke-linecap="round" stroke-dasharray="19 17"/>
  <rect x="866" y="260" width="620" height="290" rx="18" fill="#9ac0b6"/>
  <rect x="885" y="278" width="582" height="254" rx="10" fill="#d8e3d9" stroke="#5d8583" stroke-width="4"/>
  <text x="929" y="370" fill="#244651" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="34">被提起的名字</text>
  <text x="929" y="457" fill="#1c343c" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="66" font-weight="700">安娜塔西亞？</text>
  <text x="122" y="218" fill="#53686a" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26">來源：1970 年德國聯邦最高法院判決掃描，第 6 頁 · 非原始文件</text>
</svg>
