:"物理化學與日常材料","title":"古畫古書上沒寫的來歷，材料能替它作證到哪一步？","minutes":9.3,"target_minutes":9.3,"q":"一幅畫、一本書、一張地圖沒寫出它用哪塊布哪張皮、是不是原件、後來被怎麼改過；畫布紋路、皮的蛋白與 DNA、墨裡的元素和手垢能證明到哪裡，又在哪裡會讓人說錯？","chapters":9,"cores":[{"id":"R33006","category":"物理化學與日常材料","q":"承寫地圖的皮紙確實來自中世紀，為什麼畫在上面的文蘭地圖仍被判為後製？"},{"id":"R28001","category":"物理化學與日常材料","q":"兩幅畫沒有畫同一個東西，怎麼看出它們可能出自同一匹布？"},{"id":"R28002","category":"物理化學與日常材料","q":"畫布早離開繃架，怎麼還看得出哪一邊靠近原來的大布邊？"},{"id":"R33003","category":"物理化學與日常材料","q":"薄得像紙的袖珍聖經，怎麼用橡皮擦屑查書頁是哪種動物的皮？"},{"id":"R33004","category":"物理化學與日常材料","q":"兩片死海古卷都寫著《耶利米書》，為什麼研究者改查動物的DNA？"},{"id":"R33005","category":"物理化學與日常材料","q":"古埃及紙草上的紅墨含鉛，為什麼不能直接說鉛就是紅色顏料？"},{"id":"R28005","category":"物理化學與日常材料","q":"梵谷信裡寫的是紫鳶尾，今天許多花瓣怎麼看起來是藍的？"},{"id":"R33007","category":"物理化學與日常材料","q":"翻舊祈禱書留下的手垢，能看出哪幾段最常被翻到嗎？"}]},{"id":"G598","category":"物理化學與日常材料","title":"被封住、擦掉、蓋住的紀錄，不拆不播怎麼讀回來？","minutes":8.8,"target_minutes":8.8,"q":"摺封的信、被刮掉又蓋上畫的字、畫板底下的草稿、刻在碎唱片和畫在紙上的聲音，不打開、不播放，怎麼把內容讀回來？讀回來的又什麼時候會是錯的？","chapters":8,"cores":[{"id":"R33001","category":"物理化學與日常材料","q":"三百年前摺起封住的信，怎麼不拆封就把字一行行攤開？"},{"id":"R33002","category":"物理化學與日常材料","q":"抄本上的數學文字被擦過，後來又蓋上畫，怎麼找回殘留的筆畫？"},{"id":"R28003","category":"物理化學與日常材料","q":"畫裡看不見的肩結，怎麼證明曾從紙稿搬到畫板上？"},{"id":"P28001","category":"物理化學與日常材料","q":"老唱片可以用相機「聽」，為什麼有些錄音光沿著照片裡的彎線走還不夠？"},{"id":"P28002","category":"物理化學與日常材料","q":"剝落的老唱片已經拼回原位，為什麼還得一條條替聲音找路？"},{"id":"P28003","category":"物理化學與日常材料","q":"同一段畫在紙上的歌聲，怎麼一度被播高了一個八度？"},{"id":"P28004","category":"物理化學與日常材料","q":"一句話還沒開口，舊錄音帶裡怎麼就先出現淡淡的同一句？"}]},{"id":"G599","category":"建築交通與商業制度","title":"一件石器、一根骨頭，怎麼證明古人拿它做過什麼？","minutes":11.4,"target_minutes":11,"q":"出土物的用途沒有說明書；磨痕、凹點、熱裂和複製實驗能證明到哪一步，又在什麼時候會把動物、火災或埋藏造成的痕跡誤認成人的用途？","chapters":7,"cores":[{"id":"R35001","category":"生物動物與植物","q":"一片石頭有銳邊、有敲擊點，為什麼還不能說有人在做刀？"},{"id":"R38004","category":"建築交通與商業制度","q":"一塊圓頭肋骨被磨亮，怎麼從亮的位置判斷它可能磨過皮？"},{"id":"R38003","category":"建築交通與商業制度","q":"骨片上的整排小凹點，為什麼可能是打穿皮革時留下的？"},{"id":"R35002","category":"生物動物與植物","q":"獼猴用過的石錘，哪一頭的磨痕能洩漏牠是敲牡蠣，還是砸放在砧上的食物？"},{"id":"R38011","category":"建築交通與商業制度","q":"一把舊石手斧，怎麼從表面的擦痕推測它也曾拿來打火？"},{"id":"R38012","category":"建築交通與商業制度","q":"泥燒紅了只能說那裡有過火，為什麼在巴納姆還要找黃鐵礦？"},{"id":"R38009","category":"建築交通與商業制度","q":"赭石粉會讓一種膠黏得比較差，為什麼加了它反而能握住石片？"},{"id":"R38006","category":"建築交通與商業制度","q":"用水鳥骨做的哨子，吹起來就一定像水鳥嗎？"},{"id":"S50-005","category":"地球天氣與太空","q":"銅斧表面驗出較多銀，就一定是古人替它鍍銀嗎？"},{"id":"S50-004","category":"地球天氣與太空","q":"石器被火燒過，怎麼知道它是在做工具時加熱，還是丟掉後才被燒？"}]},{"id":"G600","category":"地球天氣與太空","title":"看不見土星環有多重、冰下有沒有海，卡西尼怎麼量出來？","minutes":8.8,"target_minutes":8.8,"q":"環的質量、土星的核心、土衛二冰下的海、嵌在環裡的小月亮都拍不到；研究者怎麼用看得到的波紋、缺口、擺動、無線電頻移與液面高度，把這些看不見的東西量出來，又在哪裡只能靠模型？","chapters":8,"cores":[{"id":"S39-001","category":"地球天氣與太空","q":"土星環有一段更不透光，裡面的物質就一定更多嗎？"},{"id":"S39-002","category":"地球天氣與太空","q":"土星外面的一圈波紋，怎麼能排除某些星球內部的樣子？"},{"id":"S39-005","category":"地球天氣與太空","q":"卡西尼沒拍清小月亮本身，為什麼能從兩道錯開的短斑估它多大？"},{"id":"S39-006","category":"地球天氣與太空","q":"土衛二南極明明凹下去，引力怎麼沒弱到原先預期的程度？"},{"id":"S39-007","category":"地球天氣與太空","q":"只追蹤土衛二表面的隕坑，怎麼判斷冰下的海可能繞遍全球？"},{"id":"S39-009","category":"地球天氣與太空","q":"泰坦的幾片海差不多齊平，遠方有些湖怎麼會高出幾百公尺？"}]},{"id":"G601","category":"生物動物與植物","title":"一群動物一起閃、一起轉，是誰下的令？","minutes":9.3,"target_minutes":9.3,"q":"螢火蟲同步閃光、椋鳥整群轉彎、魚群一起驚逃或往暗處移動，看起來像有隊長在發號施令；研究怎麼證明沒有誰下令，整齊又是從哪裡來的？","chapters":8,"cores":[{"id":"L43-001","category":"生物動物與植物","q":"一隻螢火蟲閃完一串，等多久才再亮沒個準；為什麼一群的間隔反而整齊？"},{"id":"L43-002","category":"生物動物與植物","q":"整片山坡的螢火蟲看似同時亮，排出每個亮點的時間後，山上山下真沒有先後？"},{"id":"L43-005","category":"生物動物與植物","q":"一群椋鳥轉彎像整群同時收到口令，怎麼從飛行軌跡找出這個轉彎是怎樣傳開的？"},{"id":"L43-006","category":"生物動物與植物","q":"有危險的氣味後，一條魚突然驚跳為什麼能帶動更多同伴？是每條魚更容易被嚇到嗎？"},{"id":"L40-003","category":"生物動物與植物","q":"沒有一條魚需要先指出暗處在哪，整群魚也能往暗處轉嗎？"},{"id":"L40-002","category":"生物動物與植物","q":"魚群裡多了幾隻沒受過訓練的魚，怎麼反而比較常跟著多數派走？"}]},{"id":"G602","category":"人體感官與日常行為","title":"你選它，是因為本來就比較喜歡它嗎？","minutes":8.8,"target_minutes":8.8,"q":"我們以為先有喜好才做選擇；暗中掉包、加一個比較差的選項、並排或單看、持有與否，會不會反過來改變我們說的喜好？這些有名的實驗又能證明到哪裡？","chapters":7,"cores":[{"id":"R30001","category":"人體感官與日常行為","q":"明明指了左邊那張臉，為什麼拿到右邊，還能解釋自己喜歡它哪裡？"},{"id":"H50-001","category":"人體感官與日常行為","q":"剛選好的果醬被換成另一款，大家都能立刻發現嗎？"},{"id":"R30002","category":"人體感官與日常行為","q":"海報還沒選，喜歡程度的名次怎麼可能已經拉開了？"},{"id":"R30003","category":"人體感官與日常行為","q":"第三款明明比較差，加進來怎麼反而能讓原本的一款多拿票？"},{"id":"R30004","category":"人體感官與日常行為","q":"小杯都滿出來了，大杯還空一截。哪一杯冰淇淋讓人願意出高價？"},{"id":"R30006","category":"人體感官與日常行為","q":"同一只杯子，為什麼有的實驗看見買賣價差，有的卻沒有？"}]},{"id":"G603","category":"生物動物與植物","title":"化石裡的那一幕，是活著時的事，還是死後才發生？","minutes":8.8,"target_minutes":8.8,"q":"洞裡的骨頭、成層的鯨骨、肚裡的葉屑、羽毛裡的小孔、拖在泥上的痕跡、卡在骨頭裡的牙：化石保存下來的組合，怎麼分辨是生前的生活，還是死後被水沖來、灌進來、腐敗或漂流造成的？","chapters":8,"cores":[{"id":"P29004","category":"生物動物與植物","q":"一條八公尺多的痕跡停在菊石殼旁，怎麼看出它可能沒活著爬過去？"},{"id":"S44-003","category":"生物動物與植物","q":"洞道盡頭躺著大小恐龍的骨頭，哪些線索讓牠們更像住客，不像被水沖進去？"},{"id":"S44-004","category":"生物動物與植物","q":"沙漠裡一層又一層都是鯨骨，鯨群每次都是活著游到岸邊才死嗎？"},{"id":"S44-008","category":"生物動物與植物","q":"恐龍肚子裡有一團葉屑，怎麼知道是牠最後吃的，不是埋下去才灌進來的？"},{"id":"S44-007","category":"生物動物與植物","q":"羽毛化石裡的橢圓小空洞，一定是細菌爛掉後留下來的嗎？"},{"id":"P29005","category":"生物動物與植物","q":"恐龍骨裡卡著別隻恐龍的牙，怎麼看出牠挨咬時還活著？"}]},{"id":"G604","category":"物理化學與日常材料","title":"紙拉不長，那它要怎麼彎、怎麼摺？","minutes":9.1,"target_minutes":9,"q":"薄片幾乎不能被拉長，受力時只能在彎曲、打開摺角或離開平面之間選路；摺痕、剪口和扣合怎麼決定它走哪條路，讓同一張紙在某個方向軟、另一個方向硬，甚至停在兩個形狀？","chapters":10,"cores":[{"id":"P44-003","category":"物理化學與日常材料","q":"沿圓線折一個紙環，整圈會翹成馬鞍；只剪開一道口，為什麼摺線反而能留在平面？"},{"id":"P44-002","category":"物理化學與日常材料","q":"兩條同材質的手風琴摺帶都拉長，為什麼一條打開摺角，另一條卻先把紙面拉彎？"},{"id":"P44-009","category":"物理化學與日常材料","q":"原本繞成一圈、兩端各自封好的扁氣管，為什麼充氣後反而多繞了一截？"},{"id":"P44-004","category":"物理化學與日常材料","q":"同一張折好的地圖，沒有多壓新折痕，只把幾個尖點按翻，怎麼就更難壓扁？"},{"id":"P53-003","category":"物理化學與日常材料","q":"硬板拼成的摺紙，為什麼能像開關一樣停在兩個形狀？"},{"id":"P44-005","category":"物理化學與日常材料","q":"兩根折紙管扣在一起，為什麼沿長度還能伸縮，往旁邊壓卻硬了？"},{"id":"P44-007","category":"物理化學與日常材料","q":"同樣花紋的剪紙，平著拉會一起翹，捲成筒再拉怎麼就像一排排翻鱗片？"},{"id":"P53-004","category":"物理化學與日常材料","q":"摺紙原理能做出可以住人的大結構嗎？"}]},{"id":"G605","category":"物理化學與日常材料","title":"沙漏的沙為什麼不會越漏越慢，卻會突然卡住？","minutes":10.4,"target_minutes":10.5,"q":"顆粒從出口流出時，為什麼流速不隨料高變、決定流量的到底是什麼，又為什麼會被一座拱卡死、卡住後還能自己再流？","chapters":10,"cores":[{"id":"P53-001","category":"物理化學與日常材料","q":"沙從小孔流出，為什麼不像水那樣越流越慢？"},{"id":"P54-003","category":"物理化學與日常材料","q":"1852 年就有人量過沙從孔裡流出的速度，他看到高度有影響嗎？"},{"id":"F10003","category":"物理化學與日常材料","q":"往高筒裡繼續倒顆粒，筒底承受的力為什麼可能幾乎不再增加？"},{"id":"P54-001","category":"物理化學與日常材料","q":"都說沙漏等速是因為重量被筒壁扛走，有實驗直接測過這個說法嗎？"},{"id":"P54-004","category":"物理化學與日常材料","q":"砂裝得越緊流得越快嗎？流出去的砂柱又像不像水柱？"},{"id":"P43-001","category":"物理化學與日常材料","q":"浸在水裡的珠子料斗，怎麼到快漏光時，反而越漏越快？"},{"id":"P54-002","category":"物理化學與日常材料","q":"出口夠大時沙流一定平穩嗎？小一點又會怎樣？"},{"id":"P53-002","category":"物理化學與日常材料","q":"量沙漏的流量時，看到的是一條直線嗎？出口小到多少就開始卡？"},{"id":"P43-002","category":"物理化學與日常材料","q":"料斗口已經排成一座拱了，下一格怎麼還有珠子掉下去？"},{"id":"P43-003","category":"物理化學與日常材料","q":"都是幾顆珠子卡成的拱，從哪一顆鬆開，能先看出端倪嗎？"},{"id":"P43-004","category":"物理化學與日常材料","q":"出口沒有珠子掉、也沒人碰筒子，軟珠怎麼會過一會兒自己再流？"},{"id":"F10005","category":"物理化學與日常材料","q":"料斗出口已經很窄，放一根細桿在上方為什麼有時反而更不容易堵？"}]},{"id":"G606","category":"物理化學與日常材料","title":"墨水乾掉以後，顆粒最後落在哪裡？","minutes":9.07,"target_minutes":9,"q":"一滴咖啡、墨水或顏料乾掉時，裡面的顆粒為什麼常堆到邊緣，又在什麼條件下不堆、排成有序或亂堆、甚至幾乎均勻？","chapters":8,"cores":[{"id":"P54-007","category":"物理化學與日常材料","q":"咖啡、糖水、鹽水、顏料乾了都留下一圈，為什麼不是重力或靜電把東西拉到邊上？"},{"id":"P54-008","category":"物理化學與日常材料","q":"同一滴咖啡，換到光滑的鐵氟龍上或蓋上只在中間開孔的蓋子，為什麼外圈就不見了？"},{"id":"X42-005","category":"物理化學與日常材料","q":"紅綠藍三種微球都被水帶往外緣，為什麼乾後最外面那圈是最小的一種？"},{"id":"P54-009","category":"物理化學與日常材料","q":"理論和實驗都說顆粒最後幾乎全到邊緣，為什麼研究者還說理論只對了一半？"},{"id":"P54-010","category":"物理化學與日常材料","q":"咖啡環最外面幾排顆粒排得整整齊齊，為什麼往內一點就亂成一團？"},{"id":"X42-004","category":"物理化學與日常材料","q":"一滴液體仍向外流，只把小圓球拉成橢球，為什麼乾後的深色外圈就淡了？"},{"id":"X42-009","category":"物理化學與日常材料","q":"同一塊底板上的兩滴液體都在蒸發，為什麼靠近底面的細粒會往相反方向繞？"},{"id":"P54-011","category":"物理化學與日常材料","q":"威士忌滴在玻璃上乾掉，為什麼沒有留下咖啡那樣的深色外圈？"}]},{"id":"G607","category":"地球天氣與太空","title":"火山的讀數變了，是底下的岩漿變了嗎？","minutes":9.85,"target_minutes":9.5,"q":"熔岩湖升降、深處震動、遠處出流、雷達條紋、GPS 站位移、群震與山緣的氣體比值改變時，研究者怎麼分辨是岩漿系統真的變了，還是氣泡、落石、壓力傳遞、大氣、雪水或風向在作怪？","chapters":8,"cores":[{"id":"S41-001","category":"地球天氣與太空","q":"熔岩湖面漲了幾十公尺，為 cada septendecim）長得比鄉村同類更大，牠們會因此提早破土還是照樣守住 17 年時鐘？"},{"id":"L79-026","category":"生物動物與植物","q":"木質部樹汁有 95% 全是水，體重才約 2 克的蟬每天要灌進體重 300 倍的汁液，為什麼牠不像小昆蟲一滴滴彈水珠，反而能像大象一樣噴出連續水柱？"},{"id":"L79-027","category":"生物動物與植物","q":"數十億隻週期蟬（Magicicada）破土餵飽森林鳥類，為什麼北美 37 年鳥類普查卻發現有 7 種常見吃蟬留鳥在「出土當年」數量反而低於平均值？"},{"id":"L79-028","category":"生物動物與植物","q":"每平方公尺鋪滿 240 隻週期蟬（Magicicada）屍體讓土壤有效氮暴增四倍，真的能像天然堆肥一樣讓森林樹木長更快嗎？"},{"id":"L79-029","category":"生物動物與植物","q":"當地下吸根 17 年的週期蟬（Magicicada）一口氣爬上樹冠產卵、隔年幼蟬又鑽回地底，宿主白橡樹的化學防禦會怎麼跟著上下調度？"},{"id":"L79-030","category":"生物動物與植物","q":"13 年週期蟬（Magicicada）大湧出的那一個月，連頂級哺乳類掠食者郊狼都改吃蟬，會替森林裡的鹿跟野兔換來喘息空窗嗎？"},{"id":"L79-031","category":"生物動物與植物","q":"專門靠聽覺抓準週期蟬鳴聲鑽進肚子產蛆的寄蠅 Emblemasoma auditrix，遇上 17 年蟬（Magicicada cassinii）也聽得到、鑽得進去，為什麼卻養不出半隻老熟幼蟲？"},{"id":"L79-032","category":"生物動物與植物","q":"數學上只要跟天敵週期「互質」（例如合數 14 年配 15 年）就能極少撞期，到底哪一種生態互動才會嚴格逼出 13 與 17 這種真質數？"},{"id":"L79-033","category":"生物動物與植物","q":"如果不同地區的週期蟬（Magicicada）本來就不在同一年起跑，質數週期真的比較少撞期雜交嗎？為什麼還得靠冰河期等級的長寒害「按下歸零鍵」才篩得出質數？"}]},{"id":"G638","category":"生物動物與植物","title":"肚子裡的蛋白質濃湯怎麼一拉就變比鋼還韌的絲？為什麼蜘蛛絲淋雨縮短一半卻不會扯破網？","minutes":9.2,"target_minutes":9,"q":"蜘蛛肚子裡儲存的高濃度液態絲蛋白為什麼不會在體內凝結塞死，卻能在通過細長紡絲管的瞬間轉變成韌性超越高張力鋼絲的固態纖維？而這根強韌蛛絲一遇到超過七成濕度的霧雨就會『超收縮』縮短一半，為什麼不但沒把圓網扯爛，反而聯手捕獲絲黏珠與極簡圓網架構撐過風雨衝擊？","chapters":8,"cores":[{"id":"L80-001","category":"生物動物與植物","q":"蜘蛛肚子裡的大壺狀腺看起來只是一條彎管，裡面九千多顆細胞怎麼像『三站式化工廠』一樣分工做出黃金牽引絲？"},{"id":"L80-002","category":"生物動物與植物","q":"同一條蛛絲蛋白明明泡在同一個管腔裡，為什麼酸度從 pH 7.6 降到 5.7 以下時，頭尾兩端卻做出『一頭鎖緊、一頭展開』完全相反的動作？"},{"id":"L80-003","category":"生物動物與植物","q":"把蛛絲蛋白 N 端開關裡的 6 顆甲硫胺酸換成常見白胺酸，單體明明耐溫暴增 20 °C 更穩固，為什麼遇酸鎖扣的能力卻反而暴跌一千倍？"},{"id":"L80-004","category":"生物動物與植物","q":"高濃度蛛絲蛋白遇到磷酸鹽會先聚成流動液滴、遇酸黏度再暴衝 3,700 倍，這時它已經變成堅硬的 β 摺疊結晶絲了嗎？"},{"id":"L80-005","category":"生物動物與植物","q":"為什麼蜘蛛不是從肚子後面把絲『擠』出去，而是從出口往外『拉』？微流道晶片抓出的 72 帕剪切門檻與多聚丙胺酸分工是什麼？"},{"id":"L80-006","category":"生物動物與植物","q":"把蛛絲蛋白濃縮到媲美活體的 30% 超高濃度塞進細管，為什麼不會像濃膠一樣堵死噴嘴，而且『pH 5 酸化』跟『高濃度磷酸鉀』少一個就碎成渣？"},{"id":"L80-007","category":"生物動物與植物","q":"家蠶也有酸化絲腺、人類也能拿天然絲蛋白溶掉重拉，為什麼冷凍電子斷層掃描一看，還是天然蜘蛛牽引絲的奈米結構最密實？"},{"id":"L80-008","category":"生物動物與植物","q":"教科書都說蜘蛛絲除了四成堅硬結晶，剩下近六成全是『像亂團義大利麵一樣沒有方向』的無規捲曲橡皮筋，偏振光譜為什麼抓出這是光學假象？"},{"id":"L80-009","category":"生物動物與植物","q":"蜘蛛牽引絲的韌性能打敗高強度合成纖維與鋼絲，除了奈米晶粒自己夠強，晶粒跟周圍軟鏈交界處藏著什麼『差近百倍』的摩擦機關？"},{"id":"L80-010","category":"生物動物與植物","q":"乾爽時比鋼還韌的牽引絲，為什麼空氣濕度一跨過 70% 門檻，沒綁住就自己縮短一半，吊著四萬倍重物還會單向狂轉超過 250 度？"},{"id":"L80-011","category":"生物動物與植物","q":"如果蜘蛛絲碰水會鬆開氫鍵變軟，為什麼整張網不會像泡爛的紙一樣一撞就斷，水合塑化後斷裂伸長率反而暴增超過三倍？"},{"id":"L80-012","category":"生物動物與植物","q":"圓網一圈圈的捕獲螺旋黏珠在雨霧裡吸水膨脹一倍、肚子裡近五成都是液態水，為什麼接觸面不會像濕膠帶一樣打滑脫膠？"},{"id":"L80-013","category":"生物動物與植物","q":"飛蟲或大雨局部猛撞圓網時，為什麼放射牽引絲跟捕獲螺旋絲要維持『差逾三百二十倍』的軟硬懸殊，把衝擊死死關在同一根放射絲上？"},{"id":"L80-014","category":"生物動物與植物","q":"既然蛛絲有這麼多抗水減震絕招，熱帶安地斯暴雨砸下來時平面圓網真的就不會破嗎？跟躲在樹幹邊的三維立體網比誰賠掉更多絲？"}]},{"id":"G639","category":"生物動物與植物","title":"整隻手斷掉竟能照原位長回來，為什麼六角恐龍不會從手腕長出手肘，切斷神經或少掉巨噬細胞卻只剩疤痕？","minutes":9.59,"target_minutes":9,"q":"墨西哥鈍口螈（Ambystoma mexicanum，六角恐龍）與有尾兩生類斷掉整隻手臂後，憑什麼不結成死疤，而是連骨骼、關節、肌肉、神經與四根手指分毫不差照原位重長，不會在手腕斷口錯長出一截肩膀或手肘？這套精密藍圖又為什麼一旦縫死傷口表皮、切斷神經、少掉免疫清創或強迫變態登陸就當場破功？","chapters":8,"cores":[{"id":"L80-015","category":"生物動物與植物","q":"變態後的青蛙斷腿明明也會長出一顆塞滿結締組織細胞的再生芽，為什麼六角恐龍能長回整隻多趾後肢，青蛙卻只長出一根沒關節的軟骨尖刺？"},{"id":"L80-016","category":"生物動物與植物","q":"連蠑螈家族內部修肌肉的方法都不一樣！日本紅腹蠑螈把多核肌纖維『拆回單核細胞』的本領，為什麼光靠變態還打不開，非得湊齊『變態加長大』兩把鑰匙？"},{"id":"L80-017","category":"生物動物與植物","q":"把斷肢傷口拿整塊厚皮膚縫起來，細胞照樣會開始分裂，為什麼沒有那層薄薄的『傷口表皮帽』就只會發炎爛尾？"},{"id":"L80-018","category":"生物動物與植物","q":"把六角恐龍傷口前 11 天冒出的『活性氧與過氧化氫』擋掉，為什麼不只吞噬細胞不來上班，最後連新長的骨頭都跟舊骨頭接不起來？"},{"id":"L80-019","category":"生物動物與植物","q":"少了巨噬細胞斷肢就會結疤，但成體六角恐龍的長骨裡根本沒有造血骨髓，救命的免疫清創大軍到底是從哪個器官派出來的？"},{"id":"L80-020","category":"生物動物與植物","q":"截肢後神經喚醒的表觀遺傳酵素 HDAC1 一被擋掉就長不出手，大家以為是發育基因打不開，為什麼定序出來反而是『發育基因太早偷跑』？"},{"id":"L80-021","category":"生物動物與植物","q":"同一窩孵出來的六角恐龍，只要加微量甲狀腺素強迫牠『長大變態登陸』，斷手長回完整四指的成功率會掉多少？"},{"id":"L80-022","category":"生物動物與植物","q":"用發育形態發生素『視黃酸』硬把前側再生芽改寫座標催生出一隻完整異位手，為什麼這隻手卻會在兩三週內自己跟宿主的骨頭『退貨脫鉤』？"},{"id":"L80-023","category":"生物動物與植物","q":"肩膀細胞跟手腕細胞碰面時怎麼『摸』出彼此的遠近階級？掛在細胞膜外那顆只有 9.1 kDa 的小蛋白 Prod1 靠什麼物理招數認親？"},{"id":"L80-024","category":"生物動物與植物","q":"成體六角恐龍手臂平常根本不開『音蝟因子 Shh』，斷手後到底是誰記得哪邊是小指側？把大拇指側細胞搬過去為什麼連砍兩次手都忘不掉新身分？"},{"id":"L80-025","category":"生物動物與植物","q":"在手臂『正背側』或『正腹側』偏轉神經明明同時有前側跟後側細胞，為什麼還是長不出手？為什麼同一顆三因子珠子埋在手背能長手、埋在手腹卻掛零？"},{"id":"L80-026","category":"生物動物與植物","q":"小幼體的再生芽只有 0.5 公釐寬、大成體的再生芽寬達 3 公釐，相差六倍大為什麼不會把大隻的手指排成八根、小隻的擠成兩根？"},{"id":"L80-027","category":"生物動物與植物","q":"把 6 公分小六角恐龍跟 12 公分大六角恐龍的再生芽互換移植，最後長出大手還是小手全聽宿主的——宿主到底是靠血液荷爾蒙還是靠脊髓神經下達尺寸指令？"},{"id":"L80-028","category":"生物動物與植物","q":"六角恐龍斷肢再生的本領是有尾兩生類近代才練出來的特技，還是三億年前的四足類老祖先早就有了？古生物學家怎麼從石頭骨頭裡抓出『曾經斷掉重長』的鐵證？"}]},{"id":"G640","category":"物理化學與日常材料","title":"荷葉把水珠托在空氣墊上滾走灰塵，為什麼一場高速暴雨或冷霧水蒸氣就能把它刺穿？自然界怎麼救回這層隱形氣墊？","minutes":9.72,"target_minutes":9.5,"q":"荷葉、芋頭葉與小麥草怎麼靠微米與奈米雙層結構鎖住一層薄薄的空氣墊，不只讓大水珠滾走，連沒風沒雨時的微米凝結露珠都能自己合併立定跳高、把奈米縫隙裡的灰塵拔出來？既然這層氣墊這麼神，為什麼水珠自己蒸發變小、每秒 4 公尺暴雨砸落或一陣過冷水蒸氣就能當場把它刺穿釘死？植物、昆蟲與土壤裡的彈尾蟲又演化出哪些物理奇招破解刺穿？","chapters":8,"cores":[{"id":"P80-001","category":"物理化學與日常材料","q":"為什麼有些微米柱表面把水滴托成圓滾滾的大接觸角，水珠卻像塗了膠水一樣滑不走？甚至在微米柱頂加鋪一層奈米草，排太密時反而比單層奈米草更黏水？"},{"id":"P80-002","category":"物理化學與日常材料","q":"甘藍菜跟絲蘭葉子明明也超疏水，為什麼手指輕輕一抹就破功，荷葉搓過卻照樣滾水珠？荷葉把呼吸氣孔全開在葉片正面又怎麼防積水窒息？"},{"id":"P80-003","category":"物理化學與日常材料","q":"芋頭葉明明沒有荷葉那樣獨立聳立的高柱、只有一格格蜂巢矮牆也能彈水，為什麼照著刻出接觸角 148.6° 的單層六角蜂巢，翻過來倒轉 180° 水珠卻死掛在天花板上掉不下來？"},{"id":"P80-004","category":"物理化學與日常材料","q":"荷葉一碰到酒精或油滴馬上濕透，終生住在潮濕腐殖土、靠全身皮膚呼吸的微小『彈尾蟲』，憑什麼泡進酒精跟十三烷裡還裹著銀亮氣墊、連 4 個大氣壓都壓不死？"},{"id":"P80-005","category":"物理化學與日常材料","q":"清晨沒有下雨也沒有風吹晃動，小麥草葉面凝結的微米小露珠為什麼長到半徑約 7.7 微米就會『自己立定跳高』彈飛 2 到 3 公釐？同片葉子背面基部為什麼反而淹成水膜？"},{"id":"P80-006","category":"物理化學與日常材料","q":"凝結小水珠合併跳起來時，是不是水珠越大顆、越有力氣把黏在表面的奈米灰塵拔走？為什麼水珠超過『上限半徑』反而會像拉斷麻糬一樣把灰塵留在原地？"},{"id":"P80-007","category":"物理化學與日常材料","q":"用 7.5 千帕加壓水柱沖洗超疏水表面 1 小時，為什麼反而把跨在頂端的 1 微米灰塵壓進縫裡卡死，改吹水蒸氣卻能把 1 微米與縫底 100 奈米灰塵清光？但換成 300 奈米灰塵怎麼連蒸氣都沒轍？"},{"id":"P80-008","category":"物理化學與日常材料","q":"完全沒有外力敲打，一顆靜靜停在微米柱氣墊上的水滴，為什麼蒸發縮小到接觸半徑約 450 微米時會『自己刺破氣墊』塌下去？把微米柱加高超過 20 微米為什麼再也擋不住高速雨滴？"},{"id":"P80-009","category":"物理化學與日常材料","q":"人工超疏水塗層總是把柱子削得極細極疏（固體只佔 1%）來減少沾黏，為什麼真實飛行昆蟲翅膀反而把奈米凸起擠到高達 25% 至 64% 固體面積，卻不會黏住 4 m/s 暴雨？"},{"id":"P80-010","category":"物理化學與日常材料","q":"完全不靠脆弱的奈米草或倒鉤傘簷，為什麼模仿金花蟲腳掌在平頭微米柱『頂端挖一個倒金字塔小酒窩』，就能把抗撞擊力拉高 1.6 倍、泡水 24 小時還保住九成氣墊？"},{"id":"P80-011","category":"物理化學與日常材料","q":"滴一顆大水珠上去明明有 167° 超疏水，為什麼一吹水蒸氣就在圓柱縫裡長滿水核、只剩 0.2% 跳得起來？把奈米圓柱削成『頂角小於 38° 的尖錐』怎麼讓小露珠比大水珠還圓？"},{"id":"P80-012","category":"物理化學與日常材料","q":"在平坦超疏水板上水滴彈跳時間原本像鐘擺週期一樣固定改不了，為什麼只在表面多擺一根半徑 100 微米的超疏水細絲，彈跳時間就會像下樓梯一樣『一格一格跳水減半』？"},{"id":"P80-013","category":"物理化學與日常材料","q":"真實樹葉與蝴蝶翅膀被雨滴砸中時都會往下彎曲退讓，為什麼把超疏水底座做得『太軟』反而完全幫不上忙，只有剛度落在每秒回彈跟得上水滴的『黃金彈性窗』才能讓水餅提前彈飛？"},{"id":"P80-014","category":"物理化學與日常材料","q":"路邊羊蹄甲樹葉枯乾放半年還維持 157° 超疏水，連 13 公尺高空砸下的水滴與季風暴雨都打不穿，為什麼把它壓進 20 公分深水底卻撐不到 3 小時就徹底淹沒、輸給荷葉？"}]}],"short_themes":[{"id":"G28","category":"生物動物與植物","title":"細胞怎麼把微弱訊號放大，又讓它準時安靜？","minutes":5.7,"target_minutes":6.916666666666667,"q":"收到訊號只是第一步；若逐級放大卻沒有重設，細胞如何分辨下一次刺激？","chapters":6,"cores":[{"id":"V3002","category":"生物動物與植物","q":"同一份訊息到達所有細胞，為什麼只有部分細胞回應？"},{"id":"V3003","category":"生物動物與植物","q":"有些訊號不必進細胞，怎麼讓細胞裡面開始動？"},{"id":"V3005","category":"生物動物與植物","q":"G 蛋白收到訊息後，怎麼自己回到關閉狀態？"},{"id":"V3009","category":"生物動物與植物","q":"只接到少量訊號，細胞怎麼產生大量反應？"},{"id":"V3012","category":"生物動物與植物","q":"細胞製造第二訊使後，怎麼避免訊息一直響？"}]},{"id":"G31","category":"物理化學與日常材料","title":"裂痕何時會失控？為什麼長度、拉力和材料都要看？","minutes":7.3,"target_minutes":7,"q":"把應力集中當起點，追蹤裂長與載荷如何越過材料門檻，再看塑性耗能、循環成長與橋接如何改變結果。","chapters":6,"cores":[{"id":"H3060","category":"物理化學與日常材料","q":"裂痕多長會突然快速擴大，為什麼還要看拉力和材料？"},{"id":"H3061","category":"物理化學與日常材料","q":"同樣有缺口，為什麼銅可能先彎很多，玻璃卻直接裂？"},{"id":"LEG-T07","category":"建築交通與商業制度","q":"飛機窗戶為什麼不做直角？壓力擠在哪裡？"},{"id":"H3063","category":"物理化學與日常材料","q":"纖維跨過已經裂開的地方，為什麼能讓裂縫更難繼續長？"}]},{"id":"G32","category":"物理化學與日常材料","title":"螢光變暗，能直接判斷分子壞了嗎？","minutes":3.75,"target_minutes":3.75,"q":"先追正常吸光到放光的能量帳，再比較非輻射去活化與發光團化學改變，回答單憑亮度下降能不能判定原因。","chapters":4,"cores":[{"id":"H3082","category":"物理化學與日常材料","q":"螢光吸收一種顏色，為什麼常吐出能量更低的另一種？"},{"id":"H3084","category":"物理化學與日常材料","q":"螢光越照越暗，就代表發光分子已經壞掉了嗎？"}]},{"id":"G35","category":"地球天氣與太空","title":"船明明沒動，流速計怎麼說它 <script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
let mode='long';
for(const c of D.categories){const o=el('option',null,c);o.value=c;$('cat').append(o)}
const longCores=D.long_themes.reduce((n,t)=>n+t.cores.length,0);
for(const [n,l] of [[D.long_themes.length,'組可成題長片（共 '+longCores+' 題核心）'],[D.short_themes.length,'組短題候選'],[D.categories.length,'個系列分類']]){const s=el('div','stat');s.append(el('b',null,String(n)),el('span',null,l));$('strip').append(s)}
function setMode(m){mode=m;$('tab-long').setAttribute('aria-selected',m==='long');$('tab-short').setAttribute('aria-selected',m==='short');render()}
$('tab-long').onclick=()=>setMode('long');$('tab-short').onclick=()=>setMode('short');
$('cat').oninput=render;$('q').oninput=render;
function render(){
  const cat=$('cat').value,term=$('q').value.trim().toLowerCase(),list=$('list');list.replaceChildren();
  const src=mode==='long'?D.long_themes:D.short_themes;
  let n=0;
  for(const t of src){
    if(cat&&t.category!==cat)continue;
    const hay=(t.id+t.category+t.title+t.q+t.cores.map(c=>c.id+c.q).join('')).toLowerCase();
    if(term&&!hay.includes(term))continue;n++;
    const c=el('article','card');const m=el('div','meta');
    m.append(el('span','id',t.id),el('span','pill',t.category),el('span','pill min','約 '+t.minutes+' 分'),el('span','pill min',t.cores.length+' 題 · '+t.chapters+' 段'));
    const ul=el('ul','cores');for(const k of t.cores){const li=el('li');li.append(el('span','id',k.id),el('span',null,k.q));ul.append(li)}
    c.append(m,el('h2',null,t.title),el('p',null,t.q),ul);list.append(c);
  }
  $('count').textContent=(mode==='long'?'可成題長片':'短題候選')+'：顯示 '+n+' 筆';
}
setMode(mode);
</script>
