<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">雪板滑移：物理可能</title>
  <desc id="desc">原創機制剖面示意。左低右高的分層雪坡上，一小塊相連雪板沿坡向左下移動，在上緣留下小間隙。箭頭只表示概念方向，不表示受力、速度、滑移距離或時間。不是事故現場、地形測量或人物行動重演。</desc>
  <rect width="1600" height="900" fill="#e5eeea"/>

  <!-- Continuous lower snow bed, sloping down to the left. -->
  <path d="M110 756 L1490 452 V816 H110Z" fill="#d9e6df"/>
  <path d="M110 756 L1490 452 V466 L110 770Z" fill="#c6a270" stroke="#8b7655" stroke-width="2"/>
  <path d="M270 772 L1435 516 M595 768 L1435 583" fill="none" stroke="#b7d0c6" stroke-width="4" stroke-linecap="round"/>

  <!-- A compact cohesive slab has moved downslope, leaving a narrow upper gap. -->
  <path d="M490 572 L920 478 V578 L490 672Z" fill="#fffdf5" stroke="#213d4c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M980 465 L1490 352 V452 L980 565Z" fill="#fffdf5"/>
  <path d="M980 565 V465 L1490 352" fill="none" stroke="#213d4c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Direction only: no force, distance or speed scale. -->
  <path d="M845 341 L539 408" fill="none" stroke="#4d8180" stroke-width="8" stroke-linecap="round"/>
  <path d="M560 386 L535 409 L568 419" fill="none" stroke="#4d8180" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="82" y="66" width="54" height="7" rx="3" fill="#4d8180"/>
  <text x="82" y="132" font-size="44" font-weight="750" fill="#213d4c">雪板滑移：物理可能</text>
  <text x="719" y="290" font-size="37" font-weight="650" fill="#213d4c" text-anchor="middle">向下坡滑移（示意）</text>

  <text x="325" y="528" font-size="37" font-weight="650" fill="#213d4c" text-anchor="middle">小塊相連雪板</text>
  <polyline points="325,548 385,587 473,611" fill="none" stroke="#4d8180" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="950,559 1050,636 1110,636" fill="none" stroke="#4d8180" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1130" y="649" font-size="37" font-weight="650" fill="#213d4c">上緣小間隙</text>
  <text x="746" y="790" font-size="35" font-weight="600" fill="#213d4c" text-anchor="middle">下方雪層</text>
</svg>
