  <title id="title">帳篷與林緣的位置：概念示意</title>
  <desc id="desc">原創位置關係示意。小型低長帳篷位於高處開闊雪坡，林緣在低處，兩者之間是開闊積雪地面。沒有路線、方位、距離或坡度量測；非現場影像，未按比例。</desc>
