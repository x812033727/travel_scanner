<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">平台切口：側面剖面示意</title>
  <desc id="desc">原創模型條件示意。右側連續上坡的相連雪層，在左下方平台的邊緣形成一段短而近乎垂直的切口。切口下方與上方雪層之下均是相接的積雪，沒有洞穴、懸空雪簷、裂開或已滑落的雪。未按比例，沒有坡角、距離、受力數值或當夜動作重演。</desc>
  <rect width="1600" height="900" fill="#e5eeea"/>

  <!-- Continuous filled snow below the intact slope and the lower flat platform. -->
  <path d="M105 680 H700 V500 L1495 280 V816 H105Z" fill="#edf2ed"/>
  <path d="M700 500 L1495 280 V430 L700 650Z" fill="#fffdf5"/>
  <path d="M105 680 H700 V500 L1495 280" fill="none" stroke="#213d4c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- A short cut terminates the slope at the platform; it has no undercut or arch. -->
  <path d="M700 501 V679" fill="none" stroke="#4d8180" stroke-width="10" stroke-linecap="butt"/>
  <path d="M748 674 L1450 480 M805 738 L1450 560" fill="none" stroke="#ccdcd5" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 729 H395 M375 780 H560" fill="none" stroke="#ccdcd5" stroke-width="4" stroke-linecap="round"/>

  <rect x="82" y="66" width="54" height="7" rx="3" fill="#4d8180"/>
  <text x="82" y="132" font-size="44" font-weight="750" fill="#213d4c">平台切口：側面剖面</text>
  <text x="1120" y="460" font-size="39" font-weight="650" fill="#213d4c" text-anchor="middle">上方相連雪層</text>
  <text x="350" y="624" font-size="39" font-weight="650" fill="#213d4c" text-anchor="middle">下方平台</text>
  <polyline points="575,528 623,528 678,563" fill="none" stroke="#4d8180" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="540" font-size="39" font-weight="650" fill="#213d4c" text-anchor="end">切口</text>
</svg>
