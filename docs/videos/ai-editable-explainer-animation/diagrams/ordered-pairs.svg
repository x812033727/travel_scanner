<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620"><rect width="1280" height="620" rx="30" fill="#F8F5EF"/><g font-family="Noto Sans TC, sans-serif" fill="#172D33"><text x="640" y="78" font-size="40" font-weight="700" text-anchor="middle" fill="#172D33">同樣的總和，不同的有序結果</text><rect x="100" y="165" width="460" height="250" rx="18" fill="#FFFFFF"/><text x="225" y="220" font-size="30" font-weight="500" text-anchor="middle" fill="#71817F">第一顆</text><text x="435" y="220" font-size="30" font-weight="500" text-anchor="middle" fill="#71817F">第二顆</text><rect x="150" y="252" width="150" height="125" rx="18" fill="#F4E3DD"/><rect x="360" y="252" width="150" height="125" rx="18" fill="#E0E9E6"/><text x="225" y="340" font-size="72" font-weight="700" text-anchor="middle" fill="#D85E4A">1</text><text x="435" y="340" font-size="72" font-weight="700" text-anchor="middle" fill="#477F72">6</text><text x="330" y="475" font-size="48" font-weight="700" text-anchor="middle" fill="#172D33">1 + 6 = 7</text><rect x="720" y="165" width="460" height="250" rx="18" fill="#FFFFFF"/><text x="845" y="220" font-size="30" font-weight="500" text-anchor="middle" fill="#71817F">第一顆</text><text x="1055" y="220" font-size="30" font-weight="500" text-anchor="middle" fill="#71817F">第二顆</text><rect x="770" y="252" width="150" height="125" rx="18" fill="#F4E3DD"/><rect x="980" y="252" width="150" height="125" rx="18" fill="#E0E9E6"/><text x="845" y="340" font-size="72" font-weight="700" text-anchor="middle" fill="#D85E4A">6</text><text x="1055" y="340" font-size="72" font-weight="700" text-anchor="middle" fill="#477F72">1</text><text x="950" y="475" font-size="48" font-weight="700" text-anchor="middle" fill="#172D33">6 + 1 = 7</text><text x="640" y="574" font-size="34" font-weight="500" text-anchor="middle" fill="#71817F">位置不同，分開計算</text></g></svg>