<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">加法先得到256，轉存才變成0</title><desc id="desc">原版n+1先整數提升為int並算出256，再轉存uint8_t成0而接受。修版用uint16_t總長保存256，與容量8比較後拒絕。8bit輸入型別和8byte資料容量不同。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#1f2a44"/></marker>
<marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#d8452f"/></marker></defs>
<rect width="1600" height="900" fill="#f6efe3"/>
<text x="80" y="80" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="700" text-anchor="start">程式 A｜8 bit 輸入型別 ≠ 8 byte 資料容量</text>
<text x="80" y="155" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">加法先算對，轉存才改了值</text>
<path d="M80 186 H1520" stroke="#c8bfaf" stroke-width="2"/>
<text x="80" y="240" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="44" font-weight="800" text-anchor="start">原版</text>
<text x="850" y="240" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="44" font-weight="800" text-anchor="start">保留完整總長</text>
<rect x="80" y="270" width="660" height="410" rx="18" fill="#fffdf8" stroke="#d8452f" stroke-width="3"/>
<rect x="860" y="270" width="660" height="410" rx="18" fill="#1f2a44" stroke="#1f2a44" stroke-width="2"/>
<text x="120" y="330" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="500" text-anchor="start">255 + 1 先以 int 算出</text>
<text x="410" y="430" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="96" font-weight="800" text-anchor="middle">256</text>
<path d="M410 455 L410 497" fill="none" stroke="#d8452f" stroke-width="5" marker-end="url(#red-arrow)"/>
<text x="410" y="555" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="48" font-weight="800" text-anchor="middle">轉存 uint8_t → 0</text>
<text x="410" y="630" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="48" font-weight="800" text-anchor="middle">0 ≤ 8：接受</text>
<text x="900" y="330" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="500" text-anchor="start">uint16_t 保留總長</text>
<text x="1190" y="460" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="116" font-weight="800" text-anchor="middle">256</text>
<text x="1190" y="570" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="62" font-weight="800" text-anchor="middle">256 &gt; 8</text>
<text x="1190" y="640" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="46" font-weight="700" text-anchor="middle">拒絕這個輸入</text>
<text x="80" y="746" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">uint16_t total = (uint16_t)((uint16_t)n + 1u);</text>
<text x="80" y="802" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">計算與儲存都保留 256；原版不是未定義的有號溢位</text>
<text x="80" y="862" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本片原創教學程式／2026-10-25本地實跑</text>
</svg>
