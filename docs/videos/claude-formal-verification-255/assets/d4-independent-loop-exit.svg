<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">加寬計數器後到256並返回</title><desc id="desc">獨立程式B只把計數器i改為uint16_t。n=255時i走到256，i&lt;=255不成立而返回256。所有0至255輸入的256次實際C呼叫均返回n+1。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#1f2a44"/></marker>
<marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#d8452f"/></marker></defs>
<rect width="1600" height="900" fill="#f6efe3"/>
<text x="80" y="80" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="700" text-anchor="start">獨立程式 B｜計數器與更新轉型都加寬</text>
<text x="80" y="155" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">保留 256，這次能走到出口</text>
<path d="M80 186 H1520" stroke="#c8bfaf" stroke-width="2"/>
<text x="80" y="245" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">volatile uint16_t i = 0;</text>
<text x="80" y="307" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">i = (uint16_t)(i + 1u);</text>
<text x="1020" y="245" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="500" text-anchor="start">固定 n = 255</text>
<text x="1020" y="307" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="500" text-anchor="start">條件：i ≤ 255</text>
<rect x="80" y="365" width="300" height="145" rx="18" fill="#1f2a44" stroke="#1f2a44" stroke-width="2"/>
<text x="230" y="462" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="68" font-weight="800" text-anchor="middle">0…254</text>
<rect x="480" y="365" width="300" height="145" rx="18" fill="#1f2a44" stroke="#1f2a44" stroke-width="2"/>
<text x="630" y="462" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="68" font-weight="800" text-anchor="middle">255</text>
<rect x="880" y="365" width="300" height="145" rx="18" fill="#1f2a44" stroke="#1f2a44" stroke-width="2"/>
<text x="1030" y="462" fill="#fffdf8" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="68" font-weight="800" text-anchor="middle">256</text>
<path d="M400 438 L455 438" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M800 438 L855 438" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1200 438 L1260 438" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<text x="1300" y="409" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="700" text-anchor="start">256 &gt; 255</text>
<text x="1300" y="485" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="58" font-weight="800" text-anchor="start">離開</text>
<rect x="80" y="575" width="1440" height="155" rx="18" fill="#fffdf8" stroke="#1f2a44" stroke-width="3"/>
<text x="120" y="639" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="48" font-weight="800" text-anchor="start">n = 255：預期返回 256，實際返回 256</text>
<text x="120" y="698" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="500" text-anchor="start">完整 n = 0…255：256 次 C 呼叫全部返回 n + 1</text>
<text x="80" y="802" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">這是另一個程式的返回要求，沒有把 guard 與迴圈串成因果</text>
<text x="80" y="862" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本片原創教學程式／2026-10-25本地實跑</text>
</svg>
