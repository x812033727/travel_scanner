<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">容量8 byte，255卻被接受</title><desc id="desc">原創教學程式A：容量8 byte，輸入長度255 byte，guard的本地實跑結果是接受。這個例子只執行條件檢查，沒有緩衝區寫入。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#1f2a44"/></marker>
<marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#d8452f"/></marker></defs>
<rect width="1600" height="900" fill="#f6efe3"/>
<text x="80" y="80" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="700" text-anchor="start">原創教學程式 A｜先看輸出</text>
<text x="80" y="155" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">容量 8 byte，255 卻被接受</text>
<path d="M80 186 H1520" stroke="#c8bfaf" stroke-width="2"/>
<rect x="80" y="245" width="670" height="425" rx="18" fill="#fffdf8" stroke="#c8bfaf" stroke-width="2"/>
<text x="125" y="313" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="44" font-weight="700" text-anchor="start">輸入長度 n</text>
<text x="410" y="505" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="172" font-weight="800" text-anchor="middle">255</text>
<text x="410" y="602" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="44" font-weight="500" text-anchor="middle">byte</text>
<path d="M780 445 L885 445" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="925" y="245" width="595" height="425" rx="18" fill="#f0dfd0" stroke="#d8452f" stroke-width="4"/>
<text x="1220" y="330" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="44" font-weight="700" text-anchor="middle">guard 實際輸出</text>
<text x="1220" y="510" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="116" font-weight="800" text-anchor="middle">接受</text>
<text x="1220" y="605" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="52" font-weight="700" text-anchor="middle">容量：8 byte</text>
<text x="80" y="802" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本例只執行條件檢查，沒有緩衝區寫入</text>
<text x="80" y="862" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本片原創教學程式／2026-10-25本地實跑</text>
</svg>
