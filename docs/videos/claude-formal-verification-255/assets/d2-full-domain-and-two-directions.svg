<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">完整256例同時驗收誤接受與誤拒絕</title><desc id="desc">域0至255，容量8 byte，結尾另需1 byte，應且只應接受0至7。原版接受9例，修版接受8例，一律拒絕的符號模型接受0例且誤拒絕8例。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#1f2a44"/></marker>
<marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#d8452f"/></marker></defs>
<rect width="1600" height="900" fill="#f6efe3"/>
<text x="80" y="80" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="700" text-anchor="start">程式 A｜完整 256 個輸入</text>
<text x="80" y="155" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">合法的要進來，不合法的要擋住</text>
<path d="M80 186 H1520" stroke="#c8bfaf" stroke-width="2"/>
<text x="80" y="242" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="500" text-anchor="start">n = 0…255｜容量 8 byte｜結尾另需 1 byte</text>
<text x="80" y="313" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="52" font-weight="800" text-anchor="start">接受 ⇔ n + 1 ≤ 8 ⇔ n ∈ 0…7</text>
<rect x="80" y="365" width="460" height="350" rx="18" fill="#fffdf8" stroke="#d8452f" stroke-width="3"/>
<text x="108" y="423" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="800" text-anchor="start">錯版 guard</text>
<text x="108" y="490" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">接受 9 個</text>
<text x="108" y="550" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">0…7 與 255</text>
<text x="108" y="620" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤接受：1</text>
<text x="108" y="678" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤拒絕：0</text>
<rect x="570" y="365" width="460" height="350" rx="18" fill="#fffdf8" stroke="#1f2a44" stroke-width="3"/>
<text x="598" y="423" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="800" text-anchor="start">uint16_t 修版</text>
<text x="598" y="490" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">接受 8 個</text>
<text x="598" y="550" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">只接受 0…7</text>
<text x="598" y="620" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤接受：0</text>
<text x="598" y="678" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤拒絕：0</text>
<rect x="1060" y="365" width="460" height="350" rx="18" fill="#fffdf8" stroke="#1f2a44" stroke-width="3"/>
<text x="1088" y="423" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="800" text-anchor="start">一律拒絕</text>
<text x="1088" y="490" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">接受 0 個</text>
<text x="1088" y="550" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">符號模型／SAT</text>
<text x="1088" y="620" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤接受：0</text>
<text x="1088" y="678" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">誤拒絕：8</text>
<text x="80" y="802" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">錯版／修版為 C 實跑；一律拒絕為符號對照，未另跑 C</text>
<text x="80" y="862" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本片原創教學程式／2026-10-25本地實跑</text>
</svg>
