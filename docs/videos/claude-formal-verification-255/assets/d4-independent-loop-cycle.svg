<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">獨立計數程式的256狀態控制環</title><desc id="desc">第二個獨立程式，不由guard呼叫。固定n=255，uint8_t計數器i由0逐次加1，255後轉回0；控制模型有256步循環。0.25秒只是一項本次timeout觀察。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#1f2a44"/></marker>
<marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#d8452f"/></marker></defs>
<rect width="1600" height="900" fill="#f6efe3"/>
<text x="80" y="80" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="700" text-anchor="start">獨立程式 B｜不是 guard 的下一步</text>
<text x="80" y="155" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="60" font-weight="800" text-anchor="start">固定 n = 255，計數器回到 0</text>
<path d="M80 186 H1520" stroke="#c8bfaf" stroke-width="2"/>
<text x="80" y="245" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">volatile uint8_t i = 0;</text>
<text x="80" y="307" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="700" text-anchor="start">i = (uint8_t)(i + 1);</text>
<text x="930" y="245" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="42" font-weight="500" text-anchor="start">條件：i ≤ 255</text>
<text x="930" y="307" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="500" text-anchor="start">從 0 開始，反覆加 1</text>
<rect x="90" y="365" width="300" height="150" rx="24" fill="#fffdf8" stroke="#d8452f" stroke-width="3"/>
<text x="240" y="465" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="64" font-weight="800" text-anchor="middle">0</text>
<rect x="560" y="365" width="300" height="150" rx="24" fill="#fffdf8" stroke="#1f2a44" stroke-width="3"/>
<text x="710" y="465" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="64" font-weight="800" text-anchor="middle">1…254</text>
<rect x="1030" y="365" width="300" height="150" rx="24" fill="#fffdf8" stroke="#1f2a44" stroke-width="3"/>
<text x="1180" y="465" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="64" font-weight="800" text-anchor="middle">255</text>
<path d="M410 440 L540 440" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M880 440 L1010 440" fill="none" stroke="#1f2a44" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1180 515 V610 H240 V515" fill="none" stroke="#d8452f" stroke-width="6" marker-end="url(#red-arrow)"/>
<text x="710" y="675" fill="#d8452f" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="48" font-weight="800" text-anchor="middle">256 個狀態後，更新轉型又回到 0</text>
<text x="80" y="738" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="40" font-weight="500" text-anchor="start">控制模型：固定 n，計數器沒有外部改寫</text>
<text x="80" y="802" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">0.25 秒只是 timeout；不是單靠等待時間證明永不返回</text>
<text x="80" y="862" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="36" font-weight="500" text-anchor="start">本片原創教學程式／2026-10-25本地實跑</text>
</svg>
