<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360" role="img" aria-labelledby="title desc">
<title id="title">原創長度檢查縮圖：容量8byte，255卻被接受</title>
<desc id="desc">本片原創guard的實際接受判斷。僅示意容量、輸入與接受結果，沒有執行資料寫入，沒有展示修正機制。</desc>
<rect width="1440" height="1360" fill="#f6efe3"/>
<rect x="120" y="120" width="1200" height="1120" rx="66" fill="#f6efe3" stroke="#1f2a44" stroke-width="10"/>
<rect x="240" y="180" width="960" height="210" rx="36" fill="#1f2a44"/>
<text x="720" y="325" fill="#f6efe3" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="138" font-weight="900" text-anchor="middle">容量8byte</text>
<text x="720" y="750" fill="#1f2a44" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="380" font-weight="900" text-anchor="middle">255</text>
<path d="M720 812 V914" fill="none" stroke="#d8452f" stroke-width="28" stroke-linecap="round"/>
<path d="M659 877 L720 945 L781 877" fill="none" stroke="#d8452f" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="250" y="990" width="940" height="220" rx="38" fill="#d8452f"/>
<path d="M410 1100 L462 1150 L555 1048" fill="none" stroke="#f6efe3" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="1145" fill="#f6efe3" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-size="160" font-weight="900" text-anchor="middle">接受</text>
</svg>
