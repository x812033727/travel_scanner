<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">後續無人機測量與當年弱層之間的證據界線</title>
  <desc id="desc">左欄說明後續考察量到可能營地附近地表地形，右欄說明沒有直接量到1959年當夜的覆雪弱層；不重畫實際地形。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="108" fill="#102a2b" font-size="57" font-weight="700">後續測量回答了什麼？</text>
  <rect x="91" y="211" width="672" height="415" rx="28" fill="#dcebed"/>
  <rect x="836" y="211" width="672" height="415" rx="28" fill="#f4e4dd"/>
  <text x="135" y="306" fill="#205257" font-size="42">2021 年 9 月測量</text>
  <text x="135" y="394" fill="#102a2b" font-size="53" font-weight="700">可能營地附近</text>
  <text x="135" y="461" fill="#102a2b" font-size="53" font-weight="700">有局部陡坡</text>
  <text x="879" y="306" fill="#9b4a3d" font-size="42">不能由此得知</text>
  <text x="879" y="394" fill="#102a2b" font-size="53" font-weight="700">1959 年當夜</text>
  <text x="879" y="461" fill="#102a2b" font-size="53" font-weight="700">雪下弱層狀態</text>
  <text x="94" y="698" fill="#234549" font-size="39">來源：Puzrin、Gaume 2022 後續考察報告</text>
  <text x="94" y="750" fill="#5b7173" font-size="34">比較圖卡｜不是實地照片或 1959 年地層剖面</text>
</svg>
