<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">鄰近山坡的新雪板痕跡與1959年事故不可混同</title>
  <desc id="desc">左欄標示2022年鄰近山坡後續痕跡，右欄標示1959年事故當夜過程沒有攝影；不是地圖、照片或地形復原。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="108" fill="#102a2b" font-size="57" font-weight="700">「附近看到」不等於「當晚拍到」</text>
  <rect x="90" y="208" width="672" height="410" rx="28" fill="#dcebed"/>
  <rect x="838" y="208" width="672" height="410" rx="28" fill="#f4e4dd"/>
  <text x="130" y="302" fill="#205257" font-size="42">後續觀察</text>
  <text x="130" y="398" fill="#102a2b" font-size="58" font-weight="700">2022 年</text>
  <text x="130" y="476" fill="#102a2b" font-size="48">鄰近山坡的兩處新痕</text>
  <text x="880" y="302" fill="#9b4a3d" font-size="42">仍缺紀錄</text>
  <text x="880" y="398" fill="#102a2b" font-size="58" font-weight="700">1959 年當夜</text>
  <text x="880" y="476" fill="#102a2b" font-size="48">沒有滑動過程影像</text>
  <text x="94" y="691" fill="#234549" font-size="38">來源：Puzrin、Gaume 2022；ETH 與 EPFL 同源報告</text>
  <text x="94" y="747" fill="#5b7173" font-size="34">資料界線卡｜非實際山坡位置、雪板大小或事件重現</text>
</svg>
