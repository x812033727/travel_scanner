<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">帳篷布料鑑定待解的問題</title>
  <desc id="desc">抽象布片和兩側問號，僅說明鑑定將檢查切口方向，未呈現真實布片、切口或動刀者。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#a45b3e"/>
  <text x="92" y="111" fill="#102a2b" font-size="60" font-weight="700">四月｜一塊布，兩個問題</text>
  <rect x="90" y="206" width="1420" height="424" rx="32" fill="#eadfd0"/>
  <rect x="230" y="286" width="465" height="254" rx="20" fill="#fbf4e9" stroke="#8c6c53" stroke-width="7"/>
  <path d="M243 342 H678 M243 390 H678 M243 438 H678 M243 486 H678" stroke="#d2b89b" stroke-width="4" stroke-dasharray="19 16"/>
  <text x="904" y="351" fill="#234549" font-size="48" font-weight="700">切口從哪一面？</text>
  <text x="904" y="456" fill="#234549" font-size="48" font-weight="700">能指認動刀者嗎？</text>
  <text x="94" y="696" fill="#234549" font-size="40">來源：1959 年帳篷鑑定，第 303–304 頁</text>
  <text x="94" y="750" fill="#5b7173" font-size="36">布片與切口均為問題圖示｜非原物描摹</text>
</svg>
