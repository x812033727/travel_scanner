<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">五月結案決定書頁碼摘要</title>
  <desc id="desc">四個抽象頁碼格與最後一頁的問號，不仿製原文或印章；真正文件畫面另由來源掃描裁切呈現。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="108" fill="#102a2b" font-size="58" font-weight="700">五月｜結案書最後寫了什麼？</text>
  <text x="94" y="165" fill="#476365" font-size="38">1959 年 5 月 28 日 · 卷一第 384–387 頁</text>
  <rect x="100" y="250" width="315" height="330" rx="23" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <rect x="461" y="250" width="315" height="330" rx="23" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <rect x="822" y="250" width="315" height="330" rx="23" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <rect x="1183" y="250" width="315" height="330" rx="23" fill="#234549"/>
  <text x="258" y="410" text-anchor="middle" fill="#234549" font-size="89" font-weight="800">384</text>
  <text x="619" y="410" text-anchor="middle" fill="#234549" font-size="89" font-weight="800">385</text>
  <text x="980" y="410" text-anchor="middle" fill="#234549" font-size="89" font-weight="800">386</text>
  <text x="1340" y="410" text-anchor="middle" fill="#ffffff" font-size="89" font-weight="800">387</text>
  <text x="1340" y="504" text-anchor="middle" fill="#c9e7e6" font-size="42">原因在最後</text>
  <text x="94" y="686" fill="#234549" font-size="40">來源：1959 年結案決定書，第 384–387 頁</text>
  <text x="94" y="741" fill="#5b7173" font-size="36">頁碼索引圖｜不是文件掃描、印章或逐字轉錄</text>
</svg>
