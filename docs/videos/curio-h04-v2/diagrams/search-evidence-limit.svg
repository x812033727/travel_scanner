<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">從遺留物到離帳推論的證據界線</title>
  <desc id="desc">三欄區分卷宗觀察、調查推論和未知，沒有畫出人物如何出帳或物品實際擺放。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="112" fill="#102a2b" font-size="59" font-weight="700">帳內留物，能推到哪一步？</text>
  <rect x="90" y="223" width="435" height="386" rx="28" fill="#dcebed"/>
  <rect x="583" y="223" width="435" height="386" rx="28" fill="#e9e5d9"/>
  <rect x="1076" y="223" width="435" height="386" rx="28" fill="#f4e4dd"/>
  <text x="128" y="307" fill="#205257" font-size="40">卷宗觀察</text><text x="128" y="400" fill="#102a2b" font-size="52" font-weight="700">鞋與外衣</text><text x="128" y="466" fill="#102a2b" font-size="52" font-weight="700">多數仍在</text>
  <text x="621" y="307" fill="#725c38" font-size="40">調查推論</text><text x="621" y="400" fill="#102a2b" font-size="52" font-weight="700">可能突然</text><text x="621" y="466" fill="#102a2b" font-size="52" font-weight="700">離開帳篷</text>
  <text x="1114" y="307" fill="#9b4a3d" font-size="40">仍未知</text><text x="1114" y="400" fill="#102a2b" font-size="52" font-weight="700">誰先出帳？</text><text x="1114" y="466" fill="#102a2b" font-size="52" font-weight="700">當夜怎麼走？</text>
  <text x="94" y="693" fill="#234549" font-size="40">來源：1959 年結案決定書，第 385–386 頁</text>
  <text x="94" y="747" fill="#5b7173" font-size="35">證據層級示意｜不是九人離帳過程的重演</text>
</svg>
