<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">模型中的風搬雪與延遲負載條件</title>
  <desc id="desc">三個條件框依序顯示風搬雪、上方累積、弱層可能破裂。箭頭只是模型因果順序，不表示當夜風量或發生時刻。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="105" fill="#102a2b" font-size="58" font-weight="700">延遲滑動需要累積負載</text>
  <text x="93" y="162" fill="#476365" font-size="37">2021 年條件模型 · 不是事故當夜測得的流程</text>
  <rect x="80" y="248" width="424" height="350" rx="27" fill="#dcebed"/>
  <rect x="588" y="248" width="424" height="350" rx="27" fill="#e9e5d9"/>
  <rect x="1096" y="248" width="424" height="350" rx="27" fill="#f4e4dd"/>
  <text x="292" y="357" text-anchor="middle" fill="#205257" font-size="66" font-weight="800">風搬雪</text>
  <text x="292" y="476" text-anchor="middle" fill="#102a2b" font-size="40">雪粒被搬動</text>
  <text x="800" y="357" text-anchor="middle" fill="#725c38" font-size="66" font-weight="800">負載增加</text>
  <text x="800" y="476" text-anchor="middle" fill="#102a2b" font-size="40">上方逐漸堆積</text>
  <text x="1308" y="357" text-anchor="middle" fill="#9b4a3d" font-size="64" font-weight="800">可能滑動</text>
  <text x="1308" y="476" text-anchor="middle" fill="#102a2b" font-size="40">弱層破裂才成立</text>
  <path d="M519 420 H571 M1028 420 H1080" stroke="#234549" stroke-width="10" marker-end="url(#a)"/>
  <text x="94" y="693" fill="#234549" font-size="40">來源：Gaume 與 Puzrin，2021 年雪板模型</text>
  <text x="94" y="747" fill="#5b7173" font-size="35">箭頭只表達模型條件；沒有風量、雪厚或事故時鐘</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#234549"/></marker></defs>
</svg>
