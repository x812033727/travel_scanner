<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">薄襪與氈靴是不同鞋襪類型的概念示意</title>
  <desc id="description">左側用簡化線條表示一隻普通針織襪，右側表示一隻普通氈靴。這是衣物類型的編輯示意，不是1959年實物、足印或鞋底重建。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <text x="90" y="103" fill="#102a2b" font-size="56" font-weight="700">鞋襪類型不同，足跡要分開讀</text>
  <text x="90" y="153" fill="#54686a" font-size="27">1959 年卷宗記載的類型 · 物件輪廓僅供理解</text>
  <rect x="90" y="203" width="675" height="526" rx="30" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <rect x="835" y="203" width="675" height="526" rx="30" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <text x="151" y="265" fill="#234549" font-size="39" font-weight="700">薄襪</text>
  <text x="896" y="265" fill="#234549" font-size="39" font-weight="700">氈靴</text>
  <path d="M354 304 L546 304 L546 471 C546 498 562 519 595 526 L647 538 C672 545 686 567 681 594 C675 624 652 645 620 648 L311 648 C270 648 242 619 243 579 C243 556 256 535 279 521 L341 483 C350 477 354 465 354 451 Z" fill="#a8c9cc" stroke="#294b50" stroke-width="11" stroke-linejoin="round"/>
  <path d="M354 337 H546 M354 365 H546" fill="none" stroke="#52777a" stroke-width="9"/>
  <path d="M379 413 H520 M379 445 H520 M370 480 Q423 502 520 485" fill="none" stroke="#52777a" stroke-width="6" stroke-dasharray="12 11"/>
  <path d="M284 581 Q330 592 389 581 M436 581 Q508 592 594 579" fill="none" stroke="#52777a" stroke-width="7"/>
  <path d="M1080 311 L1232 311 L1253 482 C1260 505 1290 521 1320 531 L1380 553 C1412 565 1423 593 1410 618 C1400 639 1380 649 1353 649 L1015 649 C981 649 959 624 963 595 C967 572 981 558 1004 547 L1050 525 C1069 515 1079 495 1079 472 Z" fill="#b9cdd0" stroke="#294b50" stroke-width="11" stroke-linejoin="round"/>
  <path d="M1078 342 H1237 M1081 363 H1240" fill="none" stroke="#52777a" stroke-width="7"/>
  <path d="M978 631 Q1152 656 1395 631" fill="none" stroke="#294b50" stroke-width="10" stroke-linecap="round"/>
  <text x="427" y="696" text-anchor="middle" fill="#435e61" font-size="27">普通針織襪的簡化輪廓</text>
  <text x="1173" y="696" text-anchor="middle" fill="#435e61" font-size="27">普通氈靴的簡化輪廓</text>
  <text x="90" y="801" fill="#234549" font-size="34" font-weight="700">現場究竟能辨出幾組足跡？接著看兩份記載。</text>
  <text x="1490" y="867" text-anchor="end" fill="#687a7c" font-size="21">Mokaair 製圖 · 非當年實物或足印描摹</text>
</svg>
