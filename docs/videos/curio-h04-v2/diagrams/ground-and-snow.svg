<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">地表局部階梯與雪面不可混同的模型圖</title>
  <desc id="desc">上欄示意整體緩坡與局部較陡地形，下欄用問號表示當年覆雪與弱層沒有直接測量；不按現場比例。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="107" fill="#102a2b" font-size="57" font-weight="700">平均坡度 ≠ 局部地形</text>
  <rect x="91" y="200" width="1418" height="374" rx="30" fill="#e4eeee"/>
  <text x="132" y="259" fill="#234549" font-size="37">模型條件：局部較陡的階梯</text>
  <path d="M145 401 L617 431 L783 507 L980 516 L1450 530" fill="none" stroke="#234549" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M145 402 L617 431 L783 507 L980 516 L1450 530 L1450 555 L145 555 Z" fill="#b9d7d5"/>
  <path d="M650 328 L773 365" stroke="#b0583f" stroke-width="8" marker-end="url(#a)"/>
  <text x="789" y="360" fill="#9b4a3d" font-size="39" font-weight="700">局部變陡</text>
  <rect x="91" y="597" width="1418" height="101" rx="22" fill="#234549"/>
  <text x="125" y="662" fill="#ffffff" font-size="40">1959 年的覆雪與弱層：不能從遠景照片直接量出</text>
  <text x="94" y="757" fill="#476365" font-size="35">來源：Gaume、Puzrin 2021 模型；Puzrin、Gaume 2022 考察 · 非現場剖面</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b0583f"/></marker></defs>
</svg>
