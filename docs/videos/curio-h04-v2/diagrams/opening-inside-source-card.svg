<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">搜救者查看帳篷內部的來源示意卡</title>
  <desc id="description">抽象空帳篷截面與文字「帳內未見九名隊員」。這不是當年帳篷內部、物件或搜救動作復原。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="106" fill="#102a2b" font-size="58" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-weight="700">搜救者查看帳篷</text>
  <text x="95" y="163" fill="#476365" font-size="40" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif">1959 年 2 月 26 日 · 清雪後查看</text>
  <rect x="90" y="211" width="1420" height="419" rx="32" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <path d="M280 562 L574 304 L1026 304 L1320 562" fill="none" stroke="#234549" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M281 563 H1319" fill="none" stroke="#8ba7a8" stroke-width="15" stroke-linecap="round"/>
  <path d="M574 306 L574 561 M1026 306 L1026 561" fill="none" stroke="#8ba7a8" stroke-width="8" stroke-dasharray="18 16"/>
  <rect x="502" y="374" width="596" height="136" rx="24" fill="#f7f1e8"/>
  <text x="800" y="455" text-anchor="middle" fill="#102a2b" font-size="70" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" font-weight="700">帳內未見隊員</text>
  <text x="800" y="611" text-anchor="middle" fill="#476365" font-size="43" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif">九人，一個也不在</text>
  <text x="94" y="691" fill="#234549" font-size="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif">來源：斯洛博佐夫證詞 第 298–300 頁</text>
  <text x="94" y="748" fill="#5b7173" font-size="42" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif">畫面示意｜非帳篷內部或搜救動作復原</text>
</svg>
