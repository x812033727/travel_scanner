<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">舊足跡與風蝕雪面的概念示意</title>
  <desc id="description">兩個不同外形的抽象足跡與壓實雪相對周圍雪面凸起的截面。不是1959年現場照片或個別鞋底重建。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <text x="90" y="100" fill="#102a2b" font-size="57" font-weight="700">殘留足跡，形狀並不相同</text>
  <text x="90" y="150" fill="#54686a" font-size="28">卷宗與證詞的概念示意 · 不是個別鞋底描摹</text>
  <rect x="90" y="196" width="1420" height="370" rx="30" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <text x="160" y="255" fill="#234549" font-size="32" font-weight="700">俯視：留下不同的輪廓</text>
  <path d="M285 335 C245 335 222 360 225 408 C227 464 267 499 325 497 C381 496 407 461 400 407 C394 361 354 334 285 335 Z" fill="#f8faf5" stroke="#294b50" stroke-width="10"/>
  <path d="M1035 320 C957 318 907 351 898 405 C889 465 941 504 1043 511 C1143 516 1200 472 1194 410 C1188 356 1139 323 1035 320 Z" fill="#f8faf5" stroke="#294b50" stroke-width="10"/>
  <path d="M495 416 H815" stroke="#718b8e" stroke-width="7" stroke-dasharray="18 18"/>
  <text x="315" y="541" text-anchor="middle" fill="#435e61" font-size="27">輪廓示意 A</text>
  <text x="1045" y="541" text-anchor="middle" fill="#435e61" font-size="27">輪廓示意 B</text>
  <text x="95" y="650" fill="#234549" font-size="32" font-weight="700">側視：壓實雪可相對周圍雪面凸起</text>
  <path d="M115 782 L345 782 Q385 785 410 762 Q445 719 505 720 L635 720 Q692 720 722 763 Q745 782 785 782 L1490 782" fill="none" stroke="#294b50" stroke-width="12" stroke-linecap="round"/>
  <path d="M112 783 L347 783 Q387 785 412 762 Q448 722 505 722 L634 722 Q692 722 722 762 Q748 783 790 783 L1492 783 L1492 835 L112 835 Z" fill="#c8dfe1" opacity=".7"/>
  <text x="563" y="702" text-anchor="middle" fill="#0c6868" font-size="27" font-weight="700">較密實的殘痕</text>
  <text x="1230" y="748" fill="#5b7173" font-size="25">周圍鬆雪受風蝕</text>
  <text x="1490" y="867" text-anchor="end" fill="#687a7c" font-size="20">Mokaair 製圖 · 非現場照片 · 不按比例</text>
</svg>
