<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">搜救發現日期的卷宗摘要圖卡</title>
  <desc id="desc">只呈現卷宗中的日期、地點與找到帳篷這件事，不重畫當時的搜救者、帳篷或山坡。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/><rect width="1600" height="22" fill="#234549"/>
  <text x="92" y="112" fill="#102a2b" font-size="61" font-weight="700">搜救紀錄｜找到帳篷</text>
  <rect x="90" y="198" width="512" height="412" rx="30" fill="#234549"/>
  <text x="346" y="309" text-anchor="middle" fill="#c9e7e6" font-size="42">1959 年</text>
  <text x="346" y="422" text-anchor="middle" fill="#ffffff" font-size="108" font-weight="800">2 月 26 日</text>
  <text x="346" y="525" text-anchor="middle" fill="#c9e7e6" font-size="41">發現日期</text>
  <rect x="642" y="198" width="868" height="412" rx="30" fill="#e4eeee" stroke="#91adae" stroke-width="4"/>
  <text x="707" y="305" fill="#476365" font-size="40">地點</text><text x="707" y="382" fill="#102a2b" font-size="58" font-weight="700">北烏拉山區</text>
  <path d="M704 417 H1440" stroke="#91adae" stroke-width="4"/>
  <text x="707" y="489" fill="#476365" font-size="40">記錄</text><text x="707" y="563" fill="#102a2b" font-size="58" font-weight="700">搜救者找到帳篷</text>
  <text x="94" y="690" fill="#234549" font-size="40">來源：1959 年結案決定書，第 384–387 頁</text>
  <text x="94" y="743" fill="#5b7173" font-size="36">卷宗摘要圖卡｜非當時現場影像或搜救動作復原</text>
</svg>
