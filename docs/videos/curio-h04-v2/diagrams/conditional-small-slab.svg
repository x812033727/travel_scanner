<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">有條件的小雪板模型示意</title>
  <desc id="description">左側示意上層雪與弱層、風搬雪載重；右側示意弱層破裂後小範圍上層雪位移。不是1959年現場剖面或實測時鐘。</desc>
  <rect width="1600" height="900" fill="#f7f1e8"/>
  <text x="90" y="105" fill="#102a2b" font-size="57" font-weight="700">小雪板怎麼可能延後滑動？</text>
  <text x="90" y="157" fill="#54686a" font-size="27">2021 年研究模型的條件示意 · 非 1959 年當夜剖面</text>
  <rect x="90" y="210" width="630" height="560" rx="28" fill="#e5eff0" stroke="#8eabad" stroke-width="4"/>
  <rect x="880" y="210" width="630" height="560" rx="28" fill="#e5eff0" stroke="#8eabad" stroke-width="4"/>
  <text x="145" y="272" fill="#173d42" font-size="36" font-weight="700">條件累積</text>
  <text x="935" y="272" fill="#173d42" font-size="36" font-weight="700">局部位移</text>
  <path d="M160 498 L648 403 L648 673 L160 673 Z" fill="#b2d0d4"/>
  <path d="M160 498 L648 403" stroke="#314f53" stroke-width="10" stroke-linecap="round"/>
  <path d="M175 522 L636 432" stroke="#c98b52" stroke-width="20" stroke-dasharray="26 17"/>
  <path d="M182 497 L648 406 L648 441 L184 533 Z" fill="#f8faf5" stroke="#314f53" stroke-width="6"/>
  <path d="M320 380 Q360 350 400 380 M445 351 Q485 321 525 351" fill="none" stroke="#0b6c6e" stroke-width="9" stroke-linecap="round"/>
  <path d="M375 376 L375 432 M500 346 L500 410" stroke="#0b6c6e" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="190" y="715" fill="#314f53" font-size="27">弱層與坡形等前提，加上風搬雪</text>
  <path d="M944 510 L1442 414 L1442 674 L944 674 Z" fill="#b2d0d4"/>
  <path d="M944 510 L1442 414" stroke="#314f53" stroke-width="10" stroke-linecap="round"/>
  <path d="M956 533 L1430 442" stroke="#c98b52" stroke-width="20" stroke-dasharray="26 17"/>
  <path d="M965 514 L1180 471 L1170 505 L965 547 Z" fill="#f8faf5" stroke="#314f53" stroke-width="6"/>
  <path d="M1213 471 L1435 430 L1435 464 L1205 509 Z" fill="#f8faf5" stroke="#314f53" stroke-width="6"/>
  <path d="M1260 391 L1179 411" stroke="#a6433f" stroke-width="9" marker-end="url(#arrow-red)"/>
  <text x="957" y="715" fill="#314f53" font-size="27">弱層若破裂，上層小片可能下移</text>
  <path d="M733 486 H856" fill="none" stroke="#0b6c6e" stroke-width="12" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b6c6e"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a6433f"/></marker></defs>
  <text x="90" y="833" fill="#687a7c" font-size="25">箭頭只表達模型次序；等待時間依假設而異，不能當作事件時鐘。</text>
  <text x="1490" y="867" text-anchor="end" fill="#687a7c" font-size="20">Mokaair 製圖 · 不按比例</text>
</svg>
