<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e9b779"/></marker></defs><rect width="1600" height="900" rx="28" fill="#102b2a"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="65" y="84" fill="#fff" font-size="45" font-weight="700">它用了幾次工具？直接顯示次數</text><text x="65" y="135" fill="#adc5bd" font-size="29" font-weight="500">同一個案例：在工作狀態旁加入工具呼叫計數</text><rect x="65" y="205" width="680" height="475" rx="28" fill="#1c3c39" stroke="#53746b" stroke-width="2"/><rect x="855" y="205" width="680" height="475" rx="28" fill="#243d36" stroke="#e9b779" stroke-width="4"/><text x="103" y="267" fill="#adc5bd" font-size="35" font-weight="700">原本</text><text x="895" y="267" fill="#e9b779" font-size="35" font-weight="700">加上計數器 Mod</text><text x="105" y="385" fill="#fff" font-size="49" font-weight="700">工作進行中</text><text x="895" y="385" fill="#fff" font-size="49" font-weight="700">工作進行中</text><text x="105" y="448" fill="#adc5bd" font-size="32" font-weight="500">讀取檔案 → 執行下一步</text><text x="895" y="448" fill="#adc5bd" font-size="32" font-weight="500">讀取檔案 → 執行下一步</text><text x="895" y="555" fill="#d0ded8" font-size="32" font-weight="500">工具呼叫</text><text x="1150" y="584" fill="#e9b779" font-size="118" font-weight="700">2</text><text x="1250" y="565" fill="#e9b779" font-size="36" font-weight="500">次</text><text x="105" y="602" fill="#adc5bd" font-size="31" font-weight="500">同一個模型、同一個任務</text><text x="895" y="635" fill="#e9b779" font-size="31" font-weight="500">多了一個你看得見的數字</text><path d="M 775 430 L 825 430" fill="none" stroke="#e9b779" stroke-width="5"  marker-end="url(#arrow)"/><text x="65" y="770" fill="#fff" font-size="34" font-weight="700">它數的是工具呼叫，不是「完成兩件工作」。</text><text x="65" y="836" fill="#adc5bd" font-size="28" font-weight="500">示意計數｜依官方 first-mod 範例繪製；不是 Claude Code 實測介面。</text></g></svg>