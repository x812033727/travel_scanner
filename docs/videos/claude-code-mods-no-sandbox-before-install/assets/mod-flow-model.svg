<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e9b779"/></marker></defs><rect width="1600" height="900" rx="28" fill="#102b2a"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="60" y="76" fill="#fff" font-size="44" font-weight="700">同一個計數器，沿著同一條流程看</text><text x="60" y="125" fill="#adc5bd" font-size="28" font-weight="500">本片案例的簡化流程｜Mod 觀察事件，然後讓原本工作繼續</text><rect x="480" y="195" width="1060" height="540" rx="28" fill="#173330" stroke="#63847a" stroke-width="2"/><text x="510" y="249" fill="#c8e1d7" font-size="32" font-weight="700">Claude Code：協調工具執行與介面</text><rect x="55" y="310" width="330" height="135" rx="20" fill="#674f35" stroke="#e9b779" stroke-width="4"/><text x="77" y="358" fill="#fff" font-size="32" font-weight="700">Claude 模型</text><text x="77" y="401" fill="#d0ded8" font-size="24" font-weight="500">提出工具需求</text><rect x="515" y="310" width="285" height="135" rx="20" fill="#1c3c39" stroke="#53746b" stroke-width="2"/><text x="537" y="358" fill="#fff" font-size="32" font-weight="700">工具呼叫事件</text><text x="537" y="401" fill="#d0ded8" font-size="24" font-weight="500">tool.call</text><rect x="865" y="310" width="280" height="135" rx="20" fill="#1c3c39" stroke="#53746b" stroke-width="2"/><text x="887" y="358" fill="#fff" font-size="32" font-weight="700">計數器 Mod</text><text x="887" y="401" fill="#d0ded8" font-size="24" font-weight="500">記一筆，再 next(e)</text><rect x="1210" y="310" width="295" height="135" rx="20" fill="#1c3c39" stroke="#53746b" stroke-width="2"/><text x="1232" y="358" fill="#fff" font-size="32" font-weight="700">工具繼續執行</text><text x="1232" y="401" fill="#d0ded8" font-size="24" font-weight="500">例如：讀取檔案</text><path d="M 390 377 L 507 377" fill="none" stroke="#e9b779" stroke-width="5"  marker-end="url(#arrow)"/><path d="M 807 377 L 857 377" fill="none" stroke="#e9b779" stroke-width="5"  marker-end="url(#arrow)"/><path d="M 1152 377 L 1202 377" fill="none" stroke="#e9b779" stroke-width="5"  marker-end="url(#arrow)"/><path d="M 1005 450 L 1005 550" fill="none" stroke="#e9b779" stroke-width="5"  marker-end="url(#arrow)"/><text x="1030" y="510" fill="#e9b779" font-size="25" font-weight="500">更新畫面</text><rect x="835" y="560" width="650" height="125" rx="20" fill="#1c3c39" stroke="#53746b" stroke-width="2"/><text x="857" y="608" fill="#fff" font-size="32" font-weight="700">同一個 Claude Code 畫面</text><text x="857" y="651" fill="#d0ded8" font-size="24" font-weight="500">工具呼叫次數：0 → 1（示意）</text><path d="M 1355 450 L 1355 480 L 345 480 L 345 451" fill="none" stroke="#7e9e96" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arrow)"/><text x="455" y="525" fill="#adc5bd" font-size="26" font-weight="500">工具結果交回模型，繼續原本的任務</text><text x="60" y="806" fill="#e9b779" font-size="32" font-weight="700">這裡數的是呼叫事件；不是完成任務數，也不是花費。</text><text x="60" y="857" fill="#adc5bd" font-size="25" font-weight="500">依官方 first-mod 範例繪製的機制圖；不是實測畫面。</text></g></svg>