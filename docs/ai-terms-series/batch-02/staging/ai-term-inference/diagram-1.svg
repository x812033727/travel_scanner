<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">一次回答的時間花在哪裡 / Where the time goes in one inference</title><desc id="desc">時間軸圖。請求先經過排隊與網路，接著讀入提示（prefill），整份提示一次平行處理，再進入逐個產生（decode），一步產生一個 token，直到結束。首個 token 時間涵蓋排隊與網路、讀入提示；產生時間涵蓋其後逐個產生的 token；兩者相加是完整回答時間。輸入越長，主要拉長首個 token 時間；輸出越長，主要拉長產生時間；權重全程固定，不更新。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一次回答的時間，花在哪裡</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Inference: prefill and decode</text><text x="805" y="178" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">完整回答時間 ＝ 首個 token 時間 ＋ 產生時間</text><path d="M 80 216 V 200 H 1530 V 216" fill="none" stroke="#5C6B6B" stroke-width="4"/><rect x="80" y="250" width="190" height="220" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><text x="175" y="355" font-size="22" fill="#102A2B" text-anchor="middle">排隊與網路</text><text x="175" y="392" font-size="20" fill="#5C6B6B" text-anchor="middle">來回等待</text><path d="M 274 360 L 296 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="300" y="250" width="400" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="500" y="332" font-size="30" font-weight="700" fill="#102A2B" text-anchor="middle">讀入提示</text><text x="500" y="372" font-size="22" fill="#0D6B68" text-anchor="middle">prefill</text><text x="500" y="418" font-size="20" fill="#5C6B6B" text-anchor="middle">整份提示一次平行處理</text><path d="M 704 360 L 726 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="730" y="250" width="800" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1130" y="292" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">逐個產生（decode）：一步一個 token</text><rect x="786" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="842" y="376" font-size="22" fill="#102A2B" text-anchor="middle">下一個</text><text x="842" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 901 382 L 927 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"/><rect x="930" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="986" y="376" font-size="22" fill="#102A2B" text-anchor="middle">下一個</text><text x="986" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 1045 382 L 1071 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"/><rect x="1074" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="1130" y="376" font-size="22" fill="#102A2B" text-anchor="middle">下一個</text><text x="1130" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 1189 382 L 1215 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"/><rect x="1218" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><circle cx="1252" cy="382" r="6" fill="#2F6F9F"/><circle cx="1274" cy="382" r="6" fill="#2F6F9F"/><circle cx="1296" cy="382" r="6" fill="#2F6F9F"/><path d="M 1333 382 L 1359 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"/><rect x="1362" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1418" y="392" font-size="24" fill="#102A2B" text-anchor="middle">結束</text><path d="M 80 496 V 512 H 700 V 496" fill="none" stroke="#D97A2B" stroke-width="5"/><text x="390" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">首個 token 時間（TTFT）</text><text x="390" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">送出請求到收到第一個 token</text><path d="M 730 496 V 512 H 1530 V 496" fill="none" stroke="#2F6F9F" stroke-width="5"/><text x="1130" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">產生時間</text><text x="1130" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">第一個之後的 token 逐個產生</text><rect x="80" y="650" width="450" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">輸入越長，讀入提示越久</text><text x="305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">主要拉長首個 token 時間</text><rect x="580" y="650" width="450" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="805" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">輸出越長，重複的步數越多</text><text x="805" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">主要拉長產生時間</text><rect x="1080" y="650" width="450" height="140" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><text x="1305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">權重全程固定，不更新</text><text x="1305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">調整權重是訓練的事</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
