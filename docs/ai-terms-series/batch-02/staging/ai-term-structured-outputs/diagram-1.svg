<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">格式合法，不等於內容正確 / Valid JSON is not correct content</title><desc id="desc">三層方框由外到內：第一層是合法 JSON，能被程式解析；第二層是符合 schema，欄位、型別與列舉值都在你定的範圍內；最內層是內容正確，要靠你自己檢查日期是否晚於收信日、人數是否在名額內、姓名是否出現在原信。右側三個示例：少了一個欄位的輸出（只用 JSON 模式時可能出現）只落在第一層；欄位齊全但日期是猜的，落在第二層；日期留空並列入缺漏清單，才落在最內層。底部提醒：拒答或截斷時輸出可能根本不符 schema，要先看停止原因再決定要不要解析。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">格式合法，不等於內容正確</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Valid JSON, matching schema, correct content</text><rect x="60" y="120" width="1000" height="560" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><rect x="100" y="220" width="920" height="420" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="140" y="330" width="840" height="270" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="90" y="166" font-size="30" font-weight="700" fill="#102A2B">第一層　合法 JSON</text><text x="90" y="199" font-size="22" fill="#5C6B6B">能被程式解析；JSON 模式與 schema 限制都做得到</text><text x="130" y="268" font-size="30" font-weight="700" fill="#102A2B">第二層　符合 schema</text><text x="130" y="301" font-size="22" fill="#5C6B6B">欄位、型別、列舉值都在你定的範圍內</text><text x="170" y="378" font-size="30" font-weight="700" fill="#102A2B">第三層　內容正確</text><text x="170" y="418" font-size="22" fill="#5C6B6B">要靠你自己的程式與人工檢查：</text><text x="170" y="472" font-size="22" fill="#102A2B">・日期是否晚於收信日</text><text x="170" y="512" font-size="22" fill="#102A2B">・人數是否在名額內</text><text x="170" y="552" font-size="22" fill="#102A2B">・姓名是否出現在原信</text><path d="M 1108 190 L 1010 190" fill="none" stroke="#102A2B" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1108 395 L 995 395" fill="none" stroke="#102A2B" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1108 560 L 945 560" fill="none" stroke="#102A2B" stroke-width="3" marker-end="url(#arrow)"/><rect x="1110" y="130" width="430" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1325" y="182" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">例一：少了一個欄位</text><text x="1325" y="218" font-size="20" fill="#5C6B6B" text-anchor="middle">JSON 模式下可能：合法卻缺欄位</text><rect x="1110" y="335" width="430" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1325" y="387" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">例二：欄位齊全，日期是猜的</text><text x="1325" y="423" font-size="20" fill="#5C6B6B" text-anchor="middle">過了 schema，內容仍錯</text><rect x="1110" y="500" width="430" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="1325" y="552" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">例三：日期 null，缺漏有列出</text><text x="1325" y="588" font-size="20" fill="#5C6B6B" text-anchor="middle">三層都過，才適合寫入</text><rect x="60" y="730" width="1480" height="80" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="800" y="779" font-size="24" fill="#102A2B" text-anchor="middle">拒答或截斷時，輸出可能根本不符 schema：先看停止原因，再決定要不要解析</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
