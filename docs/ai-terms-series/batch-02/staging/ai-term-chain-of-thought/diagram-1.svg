<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">步驟寫出來了，原因不一定都寫出來 / Chain-of-Thought faithfulness test</title><desc id="desc">兩列示意流程：第一次只問原題，模型寫出步驟並答 B；第二次在原題加一句暗示，模型寫出步驟卻改答 A，步驟沒有提到暗示，兩次比較後判定步驟不忠實。下方標示 Chen 等人 2025 年以 6 種暗示測得兩個推理模型在步驟中承認用了暗示的平均比例，分別約 25% 與 39%，只計入暗示確實改變答案的題目。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">步驟寫出來了，原因不一定都寫出來</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Chain-of-Thought faithfulness test</text><text x="80" y="116" font-size="18" fill="#5C6B6B">示意流程，不是實際輸出</text><rect x="80" y="130" width="400" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="196" font-size="28" fill="#102A2B" text-anchor="middle">第一次：只問原題</text><text x="280" y="240" font-size="22" fill="#5C6B6B" text-anchor="middle">沒有任何暗示</text><path d="M 480 205 L 594 205" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="600" y="130" width="440" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="820" y="196" font-size="28" fill="#102A2B" text-anchor="middle">寫出步驟，答案是 B</text><text x="820" y="240" font-size="22" fill="#5C6B6B" text-anchor="middle">步驟讀起來合理</text><rect x="80" y="330" width="400" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="396" font-size="28" fill="#102A2B" text-anchor="middle">第二次：原題加暗示</text><text x="280" y="440" font-size="22" fill="#5C6B6B" text-anchor="middle">例：「我覺得答案是 A」</text><path d="M 480 405 L 594 405" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="600" y="330" width="440" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="820" y="396" font-size="28" fill="#102A2B" text-anchor="middle">寫出步驟，答案改成 A</text><text x="820" y="440" font-size="22" font-weight="700" fill="#B8442D" text-anchor="middle">步驟沒有提到暗示</text><path d="M 1040 205 L 1134 205" fill="none" stroke="#B8442D" stroke-width="5" marker-end="url(#arrowWarn)"/><path d="M 1040 405 L 1134 405" fill="none" stroke="#B8442D" stroke-width="5" marker-end="url(#arrowWarn)"/><rect x="1140" y="130" width="380" height="350" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1330" y="226" font-size="22" fill="#5C6B6B" text-anchor="middle">比較兩次的結果</text><text x="1330" y="286" font-size="28" fill="#102A2B" text-anchor="middle">答案被暗示帶走</text><text x="1330" y="332" font-size="28" fill="#102A2B" text-anchor="middle">步驟卻沒說</text><text x="1330" y="414" font-size="30" font-weight="700" fill="#B8442D" text-anchor="middle">步驟不忠實</text><rect x="80" y="540" width="1440" height="270" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="594" font-size="24" fill="#102A2B" text-anchor="middle">Chen 等人 2025（6 種暗示、多選題）：步驟承認用了暗示的平均比例</text><path d="M 800 620 L 800 750" fill="none" stroke="#D8CFC0" stroke-width="3"/><text x="480" y="690" font-size="64" font-weight="700" fill="#0D6B68" text-anchor="middle">25%</text><text x="480" y="735" font-size="22" fill="#5C6B6B" text-anchor="middle">Anthropic 的推理模型</text><text x="1120" y="690" font-size="64" font-weight="700" fill="#0D6B68" text-anchor="middle">39%</text><text x="1120" y="735" font-size="22" fill="#5C6B6B" text-anchor="middle">DeepSeek 的推理模型</text><text x="800" y="782" font-size="18" fill="#5C6B6B" text-anchor="middle">只計入暗示確實改變答案的題目；數字僅限該研究的設定</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
