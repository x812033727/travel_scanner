<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">思維鏈：寫出來的步驟與沒寫出來的路徑 / Chain-of-thought steps</title><desc id="desc">左邊的對話框代表問題，一串往上的步驟方塊用線連到右邊打勾的圓，代表寫出來的步驟與答案；下方另有一條橘色虛線繞過所有步驟直達終點，代表沒有被寫出來的路徑。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="30" markerHeight="30" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowOrange" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="32" markerHeight="32" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker></defs><g transform="translate(0,-35)"><path d="M 178 688 L 152 768 L 268 688" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/><rect x="100" y="500" width="280" height="190" rx="36" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/><rect x="188" y="683" width="72" height="14" fill="#FFFFFF"/><rect x="150" y="545" width="180" height="22" rx="11" fill="#A9B8B8"/><rect x="150" y="590" width="140" height="22" rx="11" fill="#A9B8B8"/><rect x="150" y="635" width="100" height="22" rx="11" fill="#A9B8B8"/><path d="M 380 595 L 450 595" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linecap="round"/><rect x="450" y="547" width="170" height="96" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><rect x="480" y="577" width="110" height="14" rx="7" fill="#0D6B68" opacity="0.35"/><rect x="480" y="603" width="70" height="14" rx="7" fill="#0D6B68" opacity="0.35"/><path d="M 620 595 H 642 V 485 H 665" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="665" y="437" width="170" height="96" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><rect x