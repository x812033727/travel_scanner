<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">Levels of AGI：兩個軸量能力，自主性另算 / Levels of AGI</title>
<desc id="desc">左側是表現與通用程度的矩陣：表現由低到高分為 Level 1 Emerging、Level 2 Competent（具備該技能成年人的第 50 百分位以上）、Level 3 Expert（第 90 百分位以上）、Level 4 Exceptional（第 99 百分位以上）、Level 5 Superhuman（勝過 100% 的人）；窄 AI 是範圍明確的任務，每一級都可能出現，通用欄由低到高為 Emerging AGI、Competent AGI、Expert AGI、Exceptional AGI，最高一格是超級智慧 ASI。右側另列自主性 0 到 5 級：沒有 AI、工具、顧問、協作者、專家、代理；能力只解鎖較高的自主性，不決定該用哪一級。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Levels of AGI：兩個軸量能力，自主性另算</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Levels of AGI: performance x generality, with autonomy kept separate</text>
<text x="250" y="128" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">表現（深度）</text>
<text x="250" y="154" font-size="18" fill="#5C6B6B" text-anchor="middle">對照具備該技能的成年人</text>
<text x="605" y="128" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">窄（Narrow）</text>
<text x="605" y="154" font-size="18" fill="#5C6B6B" text-anchor="middle">範圍明確的任務</text>
<text x="935" y="128" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">通用（General）</text>
<text x="935" y="154" font-size="18" fill="#5C6B6B" text-anchor="middle">廣泛的非物理任務</text>
<rect x="450" y="200" width="310" height="532" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="605" y="450" font-size="34" font-weight="700" fill="#102A2B" text-anchor="middle">窄 AI</text>
<text x="605" y="492" font-size="20" fill="#5C6B6B" text-anchor="middle">每一級都可能出現</text>
<text x="605" y="522" font-size="20" fill="#5C6B6B" text-anchor="middle">只在明確範圍內達標</text>
<rect x="60" y="200" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="80" y="243" font-size="26" font-weight="700" fill="#102A2B">Level 5 Superhuman</text>
<text x="80" y="277" font-size="19" fill="#5C6B6B">勝過 100% 的人</text>
<rect x="780" y="200" width="310" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="935" y="261" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">ASI 超級智慧</text>
<rect x="60" y="308" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="80" y="351" font-size="26" font-weight="700" fill="#102A2B">Level 4 Exceptional</text>
<text x="80" y="385" font-size="19" fill="#5C6B6B">第 99 百分位以上</text>
<rect x="780" y="308" width="310" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="935" y="369" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">Exceptional AGI</text>
<rect x="60" y="416" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="80" y="459" font-size="26" font-weight="700" fill="#102A2B">Level 3 Expert</text>
<text x="80" y="493" font-size="19" fill="#5C6B6B">第 90 百分位以上</text>
<rect x="780" y="416" width="310" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="935" y="477" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">Expert AGI</text>
<rect x="60" y="524" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="80" y="567" font-size="26" font-weight="700" fill="#102A2B">Level 2 Competent</text>
<text x="80" y="601" font-size="19" fill="#5C6B6B">第 50 百分位以上</text>
<rect x="780" y="524" width="310" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="935" y="585" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">Competent AGI</text>
<rect x="60" y="632" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="80" y="675" font-size="26" font-weight="700" fill="#102A2B">Level 1 Emerging</text>
<text x="80" y="709" font-size="19" fill="#5C6B6B">約等於或略優於沒有技能的人</text>
<rect x="780" y="632" width="310" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="935" y="693" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">Emerging AGI</text>
<text x="60" y="790" font-size="22" font-weight="700" fill="#0D6B68">窄與通用差在範圍，不差在強弱</text>
<text x="60" y="822" font-size="19" fill="#5C6B6B">一個系統可橫跨幾格，模型文件宜逐項標示</text>
<text x="1131" y="452" font-size="18" fill="#5C6B6B" text-anchor="middle">解鎖</text>
<path d="M 1100 472 L 1160 472" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/>
<text x="1345" y="128" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">自主性（Autonomy）</text>
<text x="1345" y="154" font-size="18" fill="#5C6B6B" text-anchor="middle">人機互動方式，另一條軸</text>
<rect x="1170" y="200" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="240" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="248" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">5</text>
<text x="1256" y="249" font-size="24" fill="#102A2B">代理（Agent）</text>
<rect x="1170" y="288" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="328" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="336" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">4</text>
<text x="1256" y="337" font-size="24" fill="#102A2B">專家</text>
<rect x="1170" y="376" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="416" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="424" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">3</text>
<text x="1256" y="425" font-size="24" fill="#102A2B">協作者</text>
<rect x="1170" y="464" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="504" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="512" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">2</text>
<text x="1256" y="513" font-size="24" fill="#102A2B">顧問</text>
<rect x="1170" y="552" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="592" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="600" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">1</text>
<text x="1256" y="601" font-size="24" fill="#102A2B">工具</text>
<rect x="1170" y="640" width="350" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1214" cy="680" r="24" fill="#F7F1E8" stroke="#D97A2B" stroke-width="3"/>
<text x="1214" y="688" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">0</text>
<text x="1256" y="689" font-size="24" fill="#102A2B">沒有 AI</text>
<text x="1170" y="790" font-size="22" font-weight="700" fill="#102A2B">能力只解鎖，不決定用哪一級</text>
<text x="1170" y="822" font-size="19" fill="#5C6B6B">設計者可以刻意選低一級</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
