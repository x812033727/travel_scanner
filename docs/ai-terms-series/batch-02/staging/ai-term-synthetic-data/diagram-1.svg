<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">替換與累積：每一代模型用什麼資料訓練 / Replace vs. Accumulate</title><desc id="desc">並排比較兩種資料更新方式。左側「替換」：第 1 代用真實資料訓練，第 2 代只用第 1 代模型的輸出，第 3 代只用第 2 代模型的輸出，真實資料不再留在訓練集；在該論文的設定下，測試誤差隨代數上升。右側「累積」：真實資料一直保留，第 2 代加上第 1 代模型的輸出，第 3 代再加上第 2 代模型的輸出；在該論文的設定下，測試誤差沒有隨代數發散，但不代表所有情形。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">替換與累積：每一代模型用什麼資料訓練</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Replace vs. Accumulate</text><rect x="60" y="110" width="720" height="708" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/><text x="420" y="158" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">替換（Replace）</text><text x="420" y="190" font-size="20" fill="#5C6B6B" text-anchor="middle">每一代只用上一代模型的輸出訓練</text><text x="90" y="245" font-size="18" fill="#5C6B6B">第 1 代模型的訓練資料</text><rect x="90" y="258" width="150" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="165" y="302" font-size="22" fill="#102A2B" text-anchor="middle">真實資料</text><text x="90" y="405" font-size="18" fill="#5C6B6B">第 2 代模型的訓練資料</text><rect x="90" y="418" width="230" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="205" y="462" font-size="20" fill="#102A2B" text-anchor="middle">第 1 代模型的輸出</text><text x="90" y="565" font-size="18" fill="#5C6B6B">第 3 代模型的訓練資料</text><rect x="90" y="578" width="230" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="205" y="622" font-size="20" fill="#102A2B" text-anchor="middle">第 2 代模型的輸出</text><path d="M 165 334 L 165 372" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><text x="185" y="359" font-size="18" fill="#5C6B6B">用該代模型產生新資料</text><path d="M 165 494 L 165 532" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><text x="185" y="519" font-size="18" fill="#5C6B6B">用該代模型產生新資料</text><path d="M 165 654 L 165 692" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="698" width="660" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="420" y="739" font-size="26" font-weight="700" fill="#B8442D" text-anchor="middle">測試誤差隨代數上升</text><text x="420" y="772" font-size="18" fill="#5C6B6B" text-anchor="middle">（該論文的設定下）</text><rect x="820" y="110" width="720" height="708" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/><text x="1180" y="158" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">累積（Accumulate）</text><text x="1180" y="190" font-size="20" fill="#5C6B6B" text-anchor="middle">真實資料一直保留，再加上各代的輸出</text><text x="850" y="245" font-size="18" fill="#5C6B6B">第 1 代模型的訓練資料</text><rect x="850" y="258" width="150" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="925" y="302" font-size="22" fill="#102A2B" text-anchor="middle">真實資料</text><text x="850" y="405" font-size="18" fill="#5C6B6B">第 2 代模型的訓練資料</text><rect x="850" y="418" width="150" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="925" y="462" font-size="22" fill="#102A2B" text-anchor="middle">真實資料</text><rect x="1012" y="418" width="230" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1127" y="462" font-size="20" fill="#102A2B" text-anchor="middle">第 1 代模型的輸出</text><text x="850" y="565" font-size="18" fill="#5C6B6B">第 3 代模型的訓練資料</text><rect x="850" y="578" width="150" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="925" y="622" font-size="22" fill="#102A2B" text-anchor="middle">真實資料</text><rect x="1012" y="578" width="230" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1127" y="622" font-size="20" fill="#102A2B" text-anchor="middle">第 1 代模型的輸出</text><rect x="1254" y="578" width="230" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1369" y="622" font-size="20" fill="#102A2B" text-anchor="middle">第 2 代模型的輸出</text><path d="M 925 334 L 925 372" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><text x="945" y="359" font-size="18" fill="#5C6B6B">用該代模型產生新資料</text><path d="M 925 494 L 925 532" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><text x="945" y="519" font-size="18" fill="#5C6B6B">用該代模型產生新資料</text><path d="M 925 654 L 925 692" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/><rect x="850" y="698" width="660" height="100" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="1180" y="739" font-size="26" font-weight="700" fill="#2E7D5B" text-anchor="middle">測試誤差沒有隨代數發散</text><text x="1180" y="772" font-size="18" fill="#5C6B6B" text-anchor="middle">（該論文的設定下，不代表所有情形）</text><text x="360" y="459" font-size="18" fill="#B8442D">真實資料已不在訓練集裡</text><text x="360" y="619" font-size="18" fill="#B8442D">真實資料已不在訓練集裡</text><text x="60" y="852" font-size="18" fill="#5C6B6B">圖只畫這兩種資料更新方式；結果僅限論文的實驗與理論設定，不代表所有訓練流程。</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
