<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">電腦操作（Computer Use）：讓 AI 看畫面、點滑鼠、打鍵盤</title><desc id="desc">一個螢幕被藍色取景框框住，螢幕裡有三個欄位和一個按鈕，橘色游標正要點向按鈕；螢幕下方是一排鍵盤，左右兩條彎箭頭把鍵盤和螢幕連成一圈，表示看畫面、動手、再看畫面的循環。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><rect x="350" y="150" width="900" height="520" rx="30" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/><path d="M 350 215 L 1250 215" fill="none" stroke="#0D6B68" stroke-width="6"/><circle cx="400" cy="183" r="12" fill="#B8442D"/><circle cx="440" cy="183" r="12" fill="#D97A2B"/><circle cx="480" cy="183" r="12" fill="#2E7D5B"/><rect x="420" y="255" width="460" height="52" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="420" y="330" width="460" height="52" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="420" y="405" width="460" height="52" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="420" y="490" width="220" height="64" rx="14" fill="#0D6B68"/><rect x="940" y="255" width="240" height="300" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><path d="M 975 305 L 1145 305 M 975 360 L 1145 360 M 975 415 L 1100 415" fill="none" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round"/><path d="M 320 190 L 320 120 L 390 120 M 1280 120 L 1210 120 M 1280 120 L 1280 190 M 320 630 L 320 700 L 390 700 M 1280 630 L 1280 700 L 1210 700" fill="none" stroke="#2F6F9F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="580,515 580,615 606,591 628,643 654,631 632,581 668,581" fill="#D97A2B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/><g fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"><rect x="387" y="735" width="70" height="56" rx="10"/><rect x="471" y="735" width="70" height="56" rx="10"/><rect x="555" y="735" width="70" height="56" rx="10"/><rect x="639" y="735" width="70" height="56" rx="10"/><rect x="723" y="735" width="70" height="56" rx="10"/><rect x="807" y="735" width="70" height="56" rx="10"/><rect x="891" y="735" width="70" height="56" rx="10"/><rect x="975" y="735" width="70" height="56" rx="10"/><rect x="1059" y="735" width="70" height="56" rx="10"/><rect x="1143" y="735" width="70" height="56" rx="10"/><rect x="560" y="805" width="480" height="56" rx="10"/></g><rect x="723" y="735" width="70" height="56" rx="10" fill="#D97A2B" stroke="#0D6B68" stroke-width="4"/><path d="M 300 300 C 150 380 150 700 360 762" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1240 762 C 1450 700 1450 380 1300 300" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/></svg>
