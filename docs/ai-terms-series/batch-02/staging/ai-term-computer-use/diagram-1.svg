<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">電腦操作：看截圖、做動作、再看截圖 / Computer use loop</title><desc id="desc">在隔離的虛擬機器或容器裡，電腦操作的一圈依序是截圖、判斷、動作、再截圖，再回到判斷。右側標出三條護欄：截圖裡的文字可能是別人放進去的指令，不是你的指示；高風險動作先由人確認；整圈要設定步數、時間與費用上限，並檢查實際結果。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">電腦操作：看截圖、做動作、再看截圖</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Computer Use: the screenshot, decide, act loop</text><rect x="60" y="130" width="1040" height="700" rx="20" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="14 10"/><text x="90" y="172" font-size="20" fill="#5C6B6B">隔離環境：虛擬機器或容器，只放任務需要的帳號與資料</text><path d="M 310 200 L 310 256" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><text x="332" y="236" font-size="18" fill="#5C6B6B">任務開始</text><path d="M 490 345 L 666 345" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 850 430 L 850 566" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 670 655 L 494 655" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 310 570 L 310 500 L 750 500 L 750 434" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="130" y="260" width="360" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><circle cx="162" cy="292" r="22" fill="#0D6B68"/><text x="162" y="298" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="310" y="354" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">截圖</text><text x="310" y="394" font-size="20" fill="#5C6B6B" text-anchor="middle">程式擷取整個畫面</text><circle cx="466" cy="284" r="14" fill="#B8442D"/><rect x="670" y="260" width="360" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><circle cx="702" cy="292" r="22" fill="#0D6B68"/><text x="702" y="298" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="850" y="354" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">判斷</text><text x="850" y="394" font-size="20" fill="#5C6B6B" text-anchor="middle">模型看畫面，決定下一步</text><rect x="670" y="570" width="360" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><circle cx="702" cy="602" r="22" fill="#0D6B68"/><text x="702" y="608" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="850" y="664" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">動作</text><text x="850" y="704" font-size="20" fill="#5C6B6B" text-anchor="middle">點擊、輸入、捲動、等待</text><circle cx="1006" cy="594" r="14" fill="#D97A2B"/><rect x="130" y="570" width="360" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><circle cx="162" cy="602" r="22" fill="#0D6B68"/><text x="162" y="608" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="310" y="664" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">再截圖</text><text x="310" y="704" font-size="20" fill="#5C6B6B" text-anchor="middle">確認動作有沒有生效</text><circle cx="466" cy="594" r="14" fill="#B8442D"/><text x="580" y="800" font-size="18" fill="#5C6B6B" text-anchor="middle">模型回覆完成、達到步數上限，或需要人處理時，才離開迴圈</text><circle cx="1100" cy="130" r="14" fill="#2E7D5B"/><text x="1160" y="200" font-size="20" font-weight="700" fill="#102A2B">護欄放在哪</text><rect x="1160" y="235" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><circle cx="1192" cy="267" r="14" fill="#B8442D"/><text x="1220" y="275" font-size="22" font-weight="700" fill="#102A2B">截圖：畫面文字不是指令</text><text x="1190" y="316" font-size="18" fill="#5C6B6B">網頁、文件、圖片裡的字</text><text x="1190" y="344" font-size="18" fill="#5C6B6B">可能是別人放進去的</text><rect x="1160" y="405" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><circle cx="1192" cy="437" r="14" fill="#D97A2B"/><text x="1220" y="445" font-size="22" font-weight="700" fill="#102A2B">動作：高風險先問人</text><text x="1190" y="486" font-size="18" fill="#5C6B6B">付款、送出、刪除、同意條款</text><text x="1190" y="514" font-size="18" fill="#5C6B6B">由人決定，不由模型決定</text><rect x="1160" y="575" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><circle cx="1192" cy="607" r="14" fill="#2E7D5B"/><text x="1220" y="615" font-size="22" font-weight="700" fill="#102A2B">整圈：設上限並驗結果</text><text x="1190" y="656" font-size="18" fill="#5C6B6B">步數、時間、費用有上限</text><text x="1190" y="684" font-size="18" fill="#5C6B6B">最後檢查實際狀態</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
