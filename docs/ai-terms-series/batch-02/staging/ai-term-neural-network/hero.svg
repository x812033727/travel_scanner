<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">神經網路：層層連接的單元與往下滾的球</title><desc id="desc">三排圓點由粗細不同的線連成網路，代表一層層的單元與各自的連接強度；右側有一道山谷，一顆球沿著山坡滾向最低點，象徵一步步調整權重、讓誤差變小。</desc><rect width="1600" height="900" fill="#F7F1E8"/><g fill="none" stroke="#0D6B68" stroke-width="3" stroke-opacity="0.35"><path d="M 230 270 L 500 210"/><path d="M 230 270 L 500 370"/><path d="M 230 270 L 500 530"/><path d="M 230 270 L 500 690"/><path d="M 230 450 L 500 210"/><path d="M 230 450 L 500 370"/><path d="M 230 450 L 500 530"/><path d="M 230 450 L 500 690"/><path d="M 230 630 L 500 210"/><path d="M 230 630 L 500 370"/><path d="M 230 630 L 500 530"/><path d="M 230 630 L 500 690"/><path d="M 500 210 L 770 340"/><path d="M 500 210 L 770 580"/><path d="M 500 370 L 770 340"/><path d="M 500 370 L 770 580"/><path d="M 500 530 L 770 340"/><path d="M 500 530 L 770 580"/><path d="M 500 690 L 770 340"/><path d="M 500 690 L 770 580"/></g><g fill="none" stroke="#D97A2B" stroke-linecap="round"><path d="M 230 450 L 500 370" stroke-width="12"/><path d="M 500 370 L 770 580" stroke-width="14"/><path d="M 230 630 L 500 530" stroke-width="7"/><path d="M 500 530 L 770 340" stroke-width="7"/></g><g fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"><circle cx="230" cy="270" r="40"/><circle cx="230" cy="450" r="40"/><circle cx="230" cy="630" r="40"/></g><g fill="#E3F0EF" stroke="#2F6F9F" stroke-width="7"><circle cx="500" cy="210" r="40"/><circle cx="500" cy="370" r="40"/><circle cx="500" cy="530" r="40"/><circle cx="500" cy="690" r="40"/></g><g fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"><circle cx="770" cy="340" r="40"/><circle cx="770" cy="580" r="40"/></g><g transform="translate(0 60)"><path d="M 1030 250 Q 1255 800 1480 250" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/><path