<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">截止日是模糊的邊緣，不是一條線 / Knowledge cutoff is a fuzzy edge</title><desc id="desc">時間軸從早到晚分成三段：較早的事件資料較多，相對完整；接近截止日的資料可能較少、版本混雜；截止日之後模型沒有訓練到，只能靠提供的資料。兩段之間分別標出可靠知識截止日與訓練資料截止日，兩個日期有的模型相同、有的不同。下方說明補救方式：自己附上資料、檢索、搜尋工具，三者都要把內容放進上下文視窗，模型回答時才讀得到。仍會失敗的地方包括內容本身已過期、檢索庫停在某一天、模型沒有去搜尋、引用的頁面不支持句子。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">截止日是模糊的邊緣，不是一條線</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Knowledge cutoff: a fuzzy edge, then a gap that tools must fill</text><text x="650" y="160" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">可靠知識截止日</text><text x="1010" y="160" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">訓練資料截止日</text><path d="M 650 175 L 650 345" fill="none" stroke="#5C6B6B" stroke-width="4"/><path d="M 1010 175 L 1010 345" fill="none" stroke="#5C6B6B" stroke-width="4"/><rect x="80" y="190" width="560" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="360" y="246" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">較早的事件</text><text x="360" y="292" font-size="20" fill="#5C6B6B" text-anchor="middle">資料較多，相對完整</text><rect x="660" y="190" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="830" y="246" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">接近截止日</text><text x="830" y="292" font-size="20" fill="#5C6B6B" text-anchor="middle">資料可能較少、版本混雜</text><rect x="1020" y="190" width="500" height="140" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4" stroke-dasharray="12 8"/><text x="1270" y="246" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">截止日之後</text><text x="1270" y="292" font-size="20" fill="#5C6B6B" text-anchor="middle">模型沒有訓練到，只能靠提供的資料</text><path d="M 80 385 L 1520 385" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrowGrey)"/><text x="80" y="425" font-size="17" fill="#5C6B6B">時間：早</text><text x="1520" y="425" font-size="17" fill="#5C6B6B" text-anchor="end">時間：晚</text><text x="80" y="462" font-size="17" fill="#5C6B6B">示意圖：兩個日期有的模型相同、有的不同，各家也不一定兩種都標</text><text x="80" y="540" font-size="22" font-weight="700" fill="#102A2B">要補上截止日之後的內容，只能放進上下文視窗</text><rect x="80" y="565" width="290" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="225" y="610" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">自己附上資料</text><text x="225" y="645" font-size="18" fill="#5C6B6B" text-anchor="middle">你貼上文字或檔案</text><rect x="400" y="565" width="290" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="545" y="610" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">檢索（RAG）</text><text x="545" y="645" font-size="18" fill="#5C6B6B" text-anchor="middle">系統從資料庫找</text><rect x="720" y="565" width="290" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="865" y="610" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">搜尋工具</text><text x="865" y="645" font-size="18" fill="#5C6B6B" text-anchor="middle">模型決定搜不搜</text><path d="M 225 665 L 225 718" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 545 665 L 545 718" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 865 665 L 865 718" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="725" width="930" height="80" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="545" y="775" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">上下文視窗：模型回答時只讀得到這裡的內容</text><rect x="1040" y="565" width="480" height="240" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1280" y="610" font-size="24" font-weight="700" fill="#B8442D" text-anchor="middle">仍然會失敗的地方</text><text x="1070" y="656" font-size="20" fill="#102A2B">內容本身已過期</text><text x="1070" y="694" font-size="20" fill="#102A2B">檢索庫停在某一天</text><text x="1070" y="732" font-size="20" fill="#102A2B">模型沒有去搜尋</text><text x="1070" y="770" font-size="20" fill="#102A2B">引用的頁面不支持句子</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
