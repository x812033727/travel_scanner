<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">知識截止日（Knowledge Cutoff）</title><desc id="desc">左側五排方塊由深到淺，代表越接近截止日越不牢靠的資料；中間一條紅色虛線是截止日；右側是空白的虛線方塊，一支放大鏡罩住其中一塊並讓它亮起，代表要靠搜尋或提供的資料補上。</desc><rect width="1600" height="900" fill="#F7F1E8"/><g stroke="#0D6B68" stroke-width="5"><rect x="120" y="270" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="1"/><rect x="120" y="404" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="1"/><rect x="120" y="538" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="1"/><rect x="254" y="270" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.75"/><rect x="254" y="404" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.75"/><rect x="254" y="538" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.75"/><rect x="388" y="270" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.5"/><rect x="388" y="404" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.5"/><rect x="388" y="538" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.5"/><rect x="522" y="270" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.3"/><rect x="522" y="404" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.3"/><rect x="522" y="538" width="110" height="110" rx="14" fill="#0D6B68" fill-opacity="0.3"/><rect x="656" y="270" width="110" height="110" rx="14" fill="#E3F0EF" fill-opacity="1"/><rect x="656" y="404" width="110" height="110" rx="14" fill="#E3F0EF" fill-opacity="1"/><rect x="656" y="538" width="110" height="110" rx="14" fill="#E3F0EF" fill-opacity="1"/></g><path d="M 830 190 L 830 740" fill="none" stroke="#B8442D" stroke-width="8" stroke-dasharray="22 14"/><circle cx="830" cy="150" r="26" fill="#B8442D"/><g fill="none" stro