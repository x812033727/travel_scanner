<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">本機推論：什麼在裝置裡，什麼可能連網 / Local inference: what stays on the device</title><desc id="desc">結構圖。左邊大框是你的裝置：提示詞與權重檔一起進入推論計算，計算在記憶體裡用 CPU、GPU 或 NPU 執行，再產生回答，這些都在本機。右邊列出應用程式可能另外連網的四個地方，各以虛線連到裝置框：下載與更新（模型、軟體本身、模型目錄，方向是從外面進來）、診斷資料（依條款與設定，有些需要同意）、雲端模型與工具（雲端模型、網路搜尋）、紀錄同步與分享（同步資料夾、分享功能）。這四條線是否發生，要看各軟體的設定與條款。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">本機推論：什麼在裝置裡，什麼可能連網</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Local inference: what stays on the device</text><rect x="70" y="120" width="800" height="700" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="110" y="172" font-size="26" font-weight="700" fill="#0D6B68">你的裝置：推論在這裡發生</text><rect x="120" y="210" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="285" y="267" font-size="28" fill="#102A2B" text-anchor="middle">提示詞</text><text x="285" y="307" font-size="19" fill="#5C6B6B" text-anchor="middle">你輸入的內容</text><rect x="490" y="210" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="655" y="267" font-size="28" fill="#102A2B" text-anchor="middle">權重檔</text><text x="655" y="307" font-size="19" fill="#5C6B6B" text-anchor="middle">下載後存在磁碟</text><path d="M 285 344 L 285 432" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 655 344 L 655 432" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="120" y="440" width="700" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="470" y="497" font-size="28" fill="#102A2B" text-anchor="middle">推論計算</text><text x="470" y="537" font-size="19" fill="#5C6B6B" text-anchor="middle">在記憶體裡用 CPU、GPU 或 NPU 執行</text><path d="M 470 574 L 470 652" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="120" y="660" width="700" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="470" y="712" font-size="28" fill="#102A2B" text-anchor="middle">回答</text><text x="470" y="750" font-size="19" fill="#5C6B6B" text-anchor="middle">產生在本機，存不存檔看應用程式</text><text x="1060" y="162" font-size="24" font-weight="700" fill="#B8442D">應用程式可能另外連網</text><path d="M 1055 255 L 878 255" fill="none" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowOrange)"/><path d="M 874 415 L 1051 415" fill="none" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowOrange)"/><path d="M 874 575 L 1051 575" fill="none" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowOrange)"/><path d="M 874 735 L 1051 735" fill="none" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowOrange)"/><rect x="1060" y="190" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1295" y="246" font-size="26" fill="#102A2B" text-anchor="middle">下載與更新</text><text x="1295" y="286" font-size="19" fill="#5C6B6B" text-anchor="middle">模型、軟體本身、模型目錄</text><rect x="1060" y="350" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1295" y="406" font-size="26" fill="#102A2B" text-anchor="middle">診斷資料</text><text x="1295" y="446" font-size="19" fill="#5C6B6B" text-anchor="middle">依條款與設定，有些需要同意</text><rect x="1060" y="510" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1295" y="566" font-size="26" fill="#102A2B" text-anchor="middle">雲端模型與工具</text><text x="1295" y="606" font-size="19" fill="#5C6B6B" text-anchor="middle">雲端模型、網路搜尋</text><rect x="1060" y="670" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1295" y="726" font-size="26" fill="#102A2B" text-anchor="middle">紀錄同步與分享</text><text x="1295" y="766" font-size="19" fill="#5C6B6B" text-anchor="middle">同步資料夾、分享功能</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
