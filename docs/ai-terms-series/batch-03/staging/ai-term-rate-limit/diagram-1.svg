<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">收到 429，先分清楚是哪一種 / What to do after an HTTP 429</title><desc id="desc">流程圖。最上方是收到 HTTP 429，接著讀錯誤內容與回應標頭，判斷是哪一種限制。左邊一支是暫時超速或加速太快：回應附有 Retry-After 時，至少等它指定的時間，再加一點隨機延遲；沒有 Retry-After 時，用指數退避加隨機抖動，等待上界逐次加倍並設上限；兩條路最後都要替重試次數與總等待時間設上限，用完就停止，把工作放回佇列。右邊一支是花費上限、配額或預付額度用完：不重試，要調高上限、補額度或等額度重設，重送只會繼續失敗。右下角提醒 SDK 也會自動重試，只留一層重試，或把 SDK 的重試算進上限。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">收到 429，先分清楚是哪一種</text><text x="60" y="84" font-size="18" fill="#5C6B6B">What to do after an HTTP 429</text><rect x="600" y="112" width="400" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="159" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">收到 HTTP 429</text><path d="M 800 188 L 800 224" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="420" y="230" width="760" height="72" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="274" font-size="24" fill="#102A2B" text-anchor="middle">讀錯誤內容與回應標頭：是哪一種限制？</text><path d="M 600 302 L 420 362" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M 1000 302 L 1180 362" fill="none" stroke="#B8442D" stroke-width="4" marker-end="url(#arrow-warn)"/><rect x="80" y="368" width="680" height="72" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="420" y="413" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">暫時超速或加速太快</text><rect x="840" y="368" width="680" height="72" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1180" y="413" font-size="24" font-weight="700" fill="#B8442D" text-anchor="middle">花費上限、配額或預付額度用完</text><path d="M 240 440 L 240 494" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M 600 440 L 600 494" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M 1180 440 L 1180 494" fill="none" stroke="#B8442D" stroke-width="4" marker-end="url(#arrow-warn)"/><rect x="80" y="500" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="240" y="545" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">有 Retry-After</text><text x="240" y="585" font-size="20" fill="#5C6B6B" text-anchor="middle">至少等它指定的時間</text><text x="240" y="618" font-size="20" fill="#5C6B6B" text-anchor="middle">再加一點隨機延遲</text><rect x="440" y="500" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="600" y="545" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">沒有 Retry-After</text><text x="600" y="585" font-size="20" fill="#5C6B6B" text-anchor="middle">指數退避加隨機抖動</text><text x="600" y="618" font-size="20" fill="#5C6B6B" text-anchor="middle">上界逐次加倍、有上限</text><rect x="840" y="500" width="680" height="150" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1180" y="547" font-size="28" font-weight="700" fill="#B8442D" text-anchor="middle">不重試</text><text x="1180" y="588" font-size="20" fill="#102A2B" text-anchor="middle">調高上限、補額度，或等額度重設</text><text x="1180" y="620" font-size="20" fill="#5C6B6B" text-anchor="middle">重送只會繼續失敗</text><path d="M 240 650 L 240 704" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M 600 650 L 600 704" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="80" y="710" width="680" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="420" y="755" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">重試次數與總等待時間都設上限</text><text x="420" y="792" font-size="20" fill="#5C6B6B" text-anchor="middle">用完就停止，把工作放回佇列</text><rect x="840" y="710" width="680" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 8"/><text x="1180" y="755" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">提醒：SDK 也會自動重試</text><text x="1180" y="792" font-size="20" fill="#5C6B6B" text-anchor="middle">只留一層，或把 SDK 的重試算進上限</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
