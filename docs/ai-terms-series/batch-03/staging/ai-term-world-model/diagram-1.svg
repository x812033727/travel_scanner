<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">世界模型：先在想像中試，再到真實環境做 / Planning with a world model</title><desc id="desc">流程圖，以掃地機器人示例說明在想像中規劃。左上是真實環境，代理在其中實際移動與感測，收集畫面、動作與獎勵等經驗資料，再用這些資料訓練世界模型，讓它學會預測下一步。世界模型接著在想像中推演三個候選動作，這一步不碰真實環境：直走預測會卡在門檻，左繞預測能抵達，右繞預測能抵達而且較短，所以選右繞。代理只執行第一步，再拿真實結果和預測比對，然後重複這個循環。右下的警示說明，策略會專挑模型預測錯的地方，結果要回真實環境驗證。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">世界模型：先在想像中試，再到真實環境做</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Planning with a world model: imagine first, then act in the real environment</text><rect x="560" y="330" width="960" height="435" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#0D6B68" stroke-width="3" stroke-dasharray="14 10"/><path d="M 420 205 L 622 205" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 970 205 L 1172 205" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1350 280 L 1350 324" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 600 685 L 468 685" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 250 560 L 250 288" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 880 445 L 992 445" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrowGray)"/><path d="M 880 565 L 992 565" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrowGray)"/><path d="M 880 685 L 992 685" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="130" width="340" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="250" y="198" font-size="28" fill="#102A2B" text-anchor="middle">真實環境</text><text x="250" y="240" font-size="20" fill="#5C6B6B" text-anchor="middle">實際移動與感測</text><rect x="630" y="130" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="198" font-size="28" fill="#102A2B" text-anchor="middle">經驗資料</text><text x="800" y="240" font-size="20" fill="#5C6B6B" text-anchor="middle">畫面、動作、獎勵</text><rect x="1180" y="130" width="340" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1350" y="198" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">世界模型</text><text x="1350" y="240" font-size="20" fill="#5C6B6B" text-anchor="middle">學會預測下一步</text><text x="600" y="374" font-size="20" font-weight="700" fill="#0D6B68">在想像中推演，不碰真實環境</text><rect x="600" y="400" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><text x="740" y="454" font-size="24" fill="#102A2B" text-anchor="middle">候選：直走</text><rect x="1000" y="400" width="480" height="90" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1240" y="453" font-size="22" fill="#B8442D" text-anchor="middle">預測：卡在門檻</text><rect x="600" y="520" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><text x="740" y="574" font-size="24" fill="#102A2B" text-anchor="middle">候選：左繞</text><rect x="1000" y="520" width="480" height="90" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><text x="1240" y="573" font-size="22" fill="#102A2B" text-anchor="middle">預測：能抵達</text><rect x="600" y="640" width="280" height="90" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="740" y="694" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">候選：右繞</text><rect x="1000" y="640" width="480" height="90" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="1240" y="693" font-size="22" fill="#2E7D5B" text-anchor="middle">預測：能抵達、較短（選這個）</text><rect x="80" y="560" width="380" height="160" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="270" y="630" font-size="28" fill="#102A2B" text-anchor="middle">只執行第一步</text><text x="270" y="672" font-size="20" fill="#5C6B6B" text-anchor="middle">再比對真實結果</text><text x="272" y="430" font-size="18" fill="#5C6B6B">重複循環</text><rect x="880" y="782" width="640" height="62" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1200" y="820" font-size="18" fill="#B8442D" text-anchor="middle">注意：策略會鑽模型預測錯的地方，結果要回真實環境驗證</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
