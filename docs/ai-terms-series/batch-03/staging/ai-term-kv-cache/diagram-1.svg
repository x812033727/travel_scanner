<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">KV 快取：每一步只補算新 token 的 key 與 value / KV cache in a four-step example (illustrative, not measured)</title><desc id="desc">四步示例。第 1 步讀入提示的 3 個 token（台南、早餐、推薦），每層算出並存下 3 組 key 與 value，產生「可以」。第 2 步只送入「可以」，新增 1 組，快取共 4 組，產生「吃」。第 3 步送入「吃」，快取 5 組，產生「牛肉」。第 4 步送入「牛肉」，快取 6 組，產生「湯」。先前存好的 key 與 value 直接重用，第 2 步起每步只新算一組，但新 token 要比對的 key 一步比一步多。分詞為示意，未實測。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">KV 快取：每一步只補算新 token 的 key 與 value</text><text x="60" y="84" font-size="18" fill="#5C6B6B">KV cache in a four-step example (illustrative, not measured)</text><text x="160" y="128" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟</text><text x="404" y="128" font-size="18" fill="#5C6B6B" text-anchor="middle">送入模型</text><text x="910" y="128" font-size="18" fill="#5C6B6B" text-anchor="middle">KV 快取（每一層各存一份）</text><text x="1390" y="128" font-size="18" fill="#5C6B6B" text-anchor="middle">這一步的結果</text><rect x="60" y="144" width="200" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="160" y="208" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">第 1 步</text><text x="160" y="248" font-size="18" fill="#5C6B6B" text-anchor="middle">讀入提示</text><rect x="285" y="189" width="74" height="50" rx="12" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/><text x="322" y="222" font-size="21" fill="#102A2B" text-anchor="middle">台南</text><rect x="367" y="189" width="74" height="50" rx="12" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>