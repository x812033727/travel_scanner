<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">KV 快取（KV Cache）是什麼：為什麼對話越長越吃記憶體</title><desc id="desc">左邊是一個對話框，右邊一排 token 方塊往右延伸，最右邊一塊是新產生的；下方的記憶體框裡，每個 token 對應一疊成對的方塊，越往右疊得越高，像逐步升高的階梯，表示上下文越長，存下的 key 與 value 越多。</desc><rect width="1600" height="900" fill="#F7F1E8"/><path d="M 150 140 H 500 Q 540 140 540 180 V 360 Q 540 400 500 400 H 280 L 210 460 L 222 400 H 150 Q 110 400 110 360 V 180 Q 110 140 150 140 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/><rect x="160" y="210" width="330" height="26" rx="13" fill="#E3F0EF"/><rect x="160" y="272" width="280" height="26" rx="13" fill="#E3F0EF"/><rect x="160" y="334" width="210" height="26" rx="13" fill="#E3F0EF"/><path d="M 560 250 H 1380" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/><rect x="640" y="200" width="120" height="100" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><circle cx="700" cy="250" r="16" fill="#0D6B68"/><rect x="810" y="200" width="120" height="100" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><circle cx="870" cy="250" r="16" fill="#0D6B68"/><rect x="980" y="200" width="120" height="100" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><circle cx="1040" cy="250" r="16" fill="#0D6B68"/><rect x="1150" y="200" width="120" height="100" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/><circle cx="1210" cy="250" r="16" fill="#0D6B68"/><rect x="1320" y="200" width="120" height="100" rx="22" fill="#FBE7D6" stroke="#D97A2B" stroke-width="7"/><circle cx="1380" cy="250" r="16" fill="#D97A2B"/><rect x="590" y="400" width="900" height="420" rx="28" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/><rect x="640" y="820" width="22" height="34" rx="4" fill="#5C6B6B"/><rect x="700" y="820