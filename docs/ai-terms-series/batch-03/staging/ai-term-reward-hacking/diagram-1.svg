<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">替代分數一路漲，真正目標先升後降 / Reward model overoptimization</title><desc id="desc">示意曲線圖，橫軸是最佳化程度（離初始模型越遠），縱軸是分數。替代獎勵模型給的分數隨最佳化一路上升；扮演人類的黃金標準分數先上升，到最高點後開始下降，之後兩者差距越拉越大，這一段標為過度最佳化區。右側說明：較大的獎勵模型讓下降較緩；KL 懲罰的效果近似提早停止；黃金標準本身也是模型，量不到人類真正的意圖。曲線形狀依 Gao 等人描述的趨勢繪製，不是論文的實際結果。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">替代分數一路漲，真正目標先升後降</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Reward model overoptimization, schematic after Gao et al.</text><rect x="600" y="170" width="440" height="550" fill="#B8442D" fill-opacity="0.07"/><text x="820" y="430" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">過度最佳化區</text><text x="820" y="462" font-size="17" fill="#B8442D" text-anchor="middle">替代分數還在漲，真正表現下滑</text><path d="M 160 720 L 160 160" fill="none" stroke="#102A2B" stroke-width="3" marker-end="url(#arrow)"/><path d="M 160 720 L 1080 720" fill="none" stroke="#102A2B" stroke-width="3" marker-end="url(#arrow)"/><text x="160" y="140" font-size="20" fill="#102A2B" text-anchor="middle">分數</text><text x="600" y="770" font-size="20" fill="#102A2B" text-anchor="middle">最佳化程度：離初始模型越遠 →</text><path d="M 600 520 L 600 720" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="498" font-size="17" fill="#5C6B6B" text-anchor="middle">黃金分數最高點</text><path d="M 160 720 C 300 540, 600 360, 1040 190" fill="none" stroke="#D97A2B" stroke-width="7" stroke-linecap="round"/><path d="M 160 720 C 320 590, 460 520, 600 520 C 740 520, 900 600, 1040 680" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linecap="round"/><path d="M 1000 236 L 1000 640" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="4 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="985" y="560" font-size="17" fill="#5C6B6B" text-anchor="end">差距</text><rect x="1110" y="150" width="430" height="150" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/><path d="M 1135 200 L 1185 200" stroke="#D97A2B" stroke-width="7" stroke-linecap="round"/><text x="1200" y="206" font-size="18" fill="#102A2B">替代獎勵模型的分數</text><path d="M 1135 255 L 1185 255" stroke="#0D6B68" stroke-width="7" stroke-linecap="round"/><text x="1200" y="261" font-size="18" fill="#102A2B">黃金標準的分數（代替人類）</text><rect x="1110" y="330" width="430" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="380" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">較大的獎勵模型</text><text x="1325" y="418" font-size="18" fill="#5C6B6B" text-anchor="middle">下降較緩</text><rect x="1110" y="470" width="430" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1325" y="520" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">KL 懲罰</text><text x="1325" y="558" font-size="18" fill="#5C6B6B" text-anchor="middle">效果近似提早停止</text><rect x="1110" y="610" width="430" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1325" y="660" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">黃金標準也是模型</text><text x="1325" y="698" font-size="18" fill="#5C6B6B" text-anchor="middle">量不到人類真正的意圖</text><text x="60" y="830" font-size="17" fill="#5C6B6B">示意圖：曲線形狀依 Gao 等人描述的趨勢繪製，不是論文的實際結果</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
