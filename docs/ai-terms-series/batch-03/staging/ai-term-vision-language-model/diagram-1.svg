<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">視覺語言模型的三段結構 / Vision-language model architecture</title><desc id="desc">由左往右：圖片進入視覺編碼器，轉成影像特徵；連接層把特徵換成影像 token；語言模型參照影像 token 讀使用者的文字問題，產生文字回答。下方三格標出三篇論文各自改進的位置：CLIP（2021）用 4 億組圖文配對訓練影像編碼器，本身不產生文字，後來常被拿來當第一段；Flamingo（2022）凍結兩端模型，把特徵壓成 64 個視覺 token，插入閘控交叉注意力層，可讀圖文交錯輸入；LLaVA（2023）用一層線性投影接上，以 15.8 萬筆圖文指令資料先訓練投影層、再一起微調語言模型。最下方提醒：語言模型只讀得到編碼器交出的特徵，沒保留的細節可能被合理地補上。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">視覺語言模型的三段結構</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Vision-language model: vision encoder, connector, language model</text><rect x="1040" y="104" width="260" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1170" y="144" font-size="22" fill="#102A2B" text-anchor="middle">你的文字問題</text><path d="M 1170 168 L 1170 214" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="60" y="216" width="180" height="160" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="150" y="290" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">圖片</text><text x="150" y="330" font-size="17" fill="#5C6B6B" text-anchor="middle">照片、截圖</text><rect x="300" y="216" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="450" y="290" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">視覺編碼器</text><text x="450" y="330" font-size="18" fill="#5C6B6B" text-anchor="middle">圖片 → 影像特徵</text><rect x="660" y="216" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="810" y="290" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">連接層</text><text x="810" y="330" font-size="18" fill="#5C6B6B" text-anchor="middle">特徵 → 影像 token</text><rect x="1020" y="216" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1170" y="290" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">語言模型</text><text x="1170" y="330" font-size="18" fill="#5C6B6B" text-anchor="middle">參照影像 token 讀問題</text><rect x="1380" y="216" width="160" height="160" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="1460" y="305" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">文字回答</text><path d="M 240 296 L 298 296" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 600 296 L 658 296" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 960 296 L 1018 296" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1320 296 L 1378 296" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 450 378 L 450 448 M 810 378 L 810 448 M 1170 378 L 1170 448" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="8 8"/><rect x="300" y="450" width="300" height="260" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="450" y="497" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">CLIP（2021）</text><text x="450" y="547" font-size="20" fill="#102A2B" text-anchor="middle">4 億組圖文配對</text><text x="450" y="587" font-size="20" fill="#102A2B" text-anchor="middle">訓練影像編碼器</text><text x="450" y="627" font-size="20" fill="#102A2B" text-anchor="middle">本身不產生文字</text><text x="450" y="667" font-size="20" fill="#102A2B" text-anchor="middle">後來常被拿來當第一段</text><rect x="660" y="450" width="300" height="260" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="810" y="497" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">Flamingo（2022）</text><text x="810" y="547" font-size="20" fill="#102A2B" text-anchor="middle">兩端模型凍結不動</text><text x="810" y="587" font-size="20" fill="#102A2B" text-anchor="middle">特徵壓成 64 個視覺 token</text><text x="810" y="627" font-size="20" fill="#102A2B" text-anchor="middle">插入閘控交叉注意力層</text><text x="810" y="667" font-size="20" fill="#102A2B" text-anchor="middle">可讀圖文交錯輸入</text><rect x="1020" y="450" width="300" height="260" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="1170" y="497" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">LLaVA（2023）</text><text x="1170" y="547" font-size="20" fill="#102A2B" text-anchor="middle">一層線性投影接上</text><text x="1170" y="587" font-size="20" fill="#102A2B" text-anchor="middle">15.8 萬筆圖文指令資料</text><text x="1170" y="627" font-size="20" fill="#102A2B" text-anchor="middle">先訓練投影層</text><text x="1170" y="667" font-size="20" fill="#102A2B" text-anchor="middle">再一起微調語言模型</text><text x="60" y="790" font-size="22" fill="#B8442D">交接點：語言模型只讀得到編碼器交出的特徵，沒保留的細節可能被「合理地」補上</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
