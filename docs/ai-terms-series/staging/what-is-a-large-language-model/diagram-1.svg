<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">大型語言模型圖解 / Large Language Model</title><desc id="desc">已訓練參數和當次上下文共同支援模型生成；工具需經外部執行後返回結果，最後答案仍接受來源核對。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">模型能力、當次材料與外部工具的關係</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Large Language Model</text><rect x="80" y="190" width="430" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="295" y="277" text-anchor="middle" font-size="36" fill="#102A2B">已訓練的參數</text><rect x="80" y="500" width="430" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="295" y="587" text-anchor="middle" font-size="36" fill="#102A2B">當次檔案與指令</text><path d="M 510 265 L 670 420" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="670" cy="420" r="10" fill="#0D6B68"/><path d="M 510 575 L 670 420" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="670" cy="420" r="10" fill="#0D6B68"/><rect x="670" y="310" width="340" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="840" y="432" text-anchor="middle" font-size="36" fill="#102A2B">語言模型</text><path d="M 1010 420 L 1160 420" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1160" cy="420" r="10" fill="#0D6B68"/><rect x="1160" y="330" width="350" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="422" text-anchor="middle" font-size="36" fill="#102A2B">答案與待確認事項</text><rect x="650" y="680" width="390" height="100" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="845" y="742" text-anchor="middle" font-size="36" fill="#102A2B">外部工具執行</text><path d="M 840 680 L 840 530" stroke="#0D6B68" stroke-width="9" fill="none"