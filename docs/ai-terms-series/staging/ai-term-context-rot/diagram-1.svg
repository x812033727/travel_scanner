<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">固定問題，分開改變條件</title>
<desc id="desc">同一個備案問題分成簡短資料、加長資料與調整位置三個測試條件，最後比較依據與錯誤。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">固定問題，分開改變條件</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Context Rot · 活動備案的對照設計</text><path d="M275 420 V570 H650 V600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M795 420 V600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1315 420 V570 H950 V600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="230" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="312" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">簡短版本</text><text x="275" y="362" text-anchor="middle" font-size="25" fill="#5C6B6B">正式公告與草案</text><rect x="600" y="230" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="312" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">加長版本</text><text x="795" y="362" text-anchor="middle" font-size="25" fill="#5C6B6B">加入往年討論</text><rect x="1120" y="230" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1315" y="312" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">位置版本</text><text x="1315" y="362" text-anchor="middle" font-size="25" fill="#5C6B6B">只移動正式公告</text><rect x="530" y="610" width="540" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="682" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">比較完整答案</text><text x="800" y="732" text-anchor="middle" font-size="25" fill="#5C6B6B">地點、適用性與來源</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
