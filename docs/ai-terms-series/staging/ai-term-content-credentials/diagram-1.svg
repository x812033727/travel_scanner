<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">驗證歷程，再判讀內容主張</title><desc id="desc">媒體及來源紀錄經簽署與綁定驗證，讀者檢視記錄範圍，再以其他證據判斷事件與配文是否真實</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">驗證歷程，再判讀內容主張</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Content Credentials — C2PA</text><path d="M 480 285 L 665 375" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 480 635 L 665 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1015 435 L 1180 435" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="200" width="410" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="279" font-size="28" fill="#102A2B" text-anchor="middle">媒體資產</text><text x="275" y="322" font-size="22" fill="#5C6B6B" text-anchor="middle">目前看到的檔案</text><rect x="70" y="550" width="410" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="629" font-size="28" fill="#102A2B" text-anchor="middle">來源紀錄</text><text x="275" y="672" font-size="22" fill="#5C6B6B" text-anchor="middle">簽署與已記錄歷程</text><rect x="675" y="325" width="340" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="845" y="429" font-size="28" fill="#102A2B" text-anchor="middle">憑證驗證</text><text x="845" y="472" font-size="22" fill="#5C6B6B" text-anchor="middle">結構、簽署、綁定</text><rect x="1190" y="310" width="340" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1360" y="429" font-size="28" fill="#102A2B" text-anchor="middle">內容判讀</text><text x="1360" y="472" font-size="22" fill="#5C6B6B" text-anchor="middle">仍需日期與事件證據</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
