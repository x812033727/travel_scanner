<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif"><title id="title">Loop Engineering 的工作循環 / A verifiable agent workflow</title><desc id="desc">目標交給代理執行，再獨立驗證。未通過且仍在限制內的工作回到修正再執行；通過、超出限制或需要人工判斷者離開循環。底部的持久紀錄保存每次結果。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0D6B68"/></marker></defs><text x="70" y="60" font-size="30" font-weight="700" fill="#102A2B">讓驗證結果決定下一步</text><text x="70" y="95" font-size="18" fill="#5C6B6B">Loop Engineering — execution, evidence and explicit exits</text><rect x="95" y="185" width="340" height="150" rx="14" fill="#fff" stroke="#0D6B68" stroke-width="4"/><text x="265" y="244" text-anchor="middle" font-size="29" font-weight="700" fill="#102A2B">目標與完成條件</text><text x="265" y="290" text-anchor="middle" font-size="22" fill="#5C6B6B">知道什麼證據算完成</text><rect x="535" y="185" width="340" height="150" rx="14" fill="#fff" stroke="#0D6B68" stroke-width="4"/><text x="705" y="244" text-anchor="middle" font-size="29" font-weight="700" fill="#102A2B">代理執行</text><text x="705" y="290" text-anchor="middle" font-size="22" fill="#5C6B6B">限定工具與工作範圍</text><rect x="975" y="185" width="340" height="150" rx="14" fill="#fff" stroke="#0D6B68" stroke-width="4"/><text x="1145" y="244" text-anchor="middle" font-size="29" font-weight="700" fill="#102A2B">獨立驗證</text><text x="1145" y="290" text-anchor="middle" font-size="22" fill="#5C6B6B">對照來源與實際結果</text><rect x="535" y="555" width="340" height="150" rx="14" fill="#fff" stroke="#0D6B68" stroke-width="4"/><text x="705" y="614" text-anchor="middle" font-size="29" font-weight="700" fill="#102A2B">回饋與修正</text><text x="705" y="660" text-anchor="middle" font-size="22" fill="#5C6B6B">改方法，避免盲目重試</text><g fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"><path d="M435 260 H520"/><path d="M875 260 H960"/><path d="M1145 335 V630 H890"/><path d="M705 555 V350"/></g><text x="955" y="425" text-anchor="middle" font-size="22" fill="#5C6B6B">未通過，且仍在限制內</text><rect x="95" y="420" width="340" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="265" y="468" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">持久紀錄</text><text x="265" y="511" text-anchor="middle" font-size="22" fill="#5C6B6B">來源、版本與已完成工作</text><text x="265" y="550" text-anchor="middle" font-size="22" fill="#5C6B6B">失敗原因與下一步</text><text x="265" y="589" text-anchor="middle" font-size="20" fill="#2F6F9F">每一步都讀取並更新</text><rect x="1240" y="460" width="280" height="208" rx="14" fill="#fff" stroke="#D97A2B" stroke-width="4"/><text x="1380" y="511" text-anchor="middle" font-size="27" font-weight="700" fill="#102A2B">停止或交給人</text><text x="1380" y="555" text-anchor="middle" font-size="22" fill="#5C6B6B">完成證據已通過</text><text x="1380" y="593" text-anchor="middle" font-size="22" fill="#5C6B6B">超過預算或時間</text><text x="1380" y="631" text-anchor="middle" font-size="22" fill="#5C6B6B">必要資訊無法確認</text><path d="M1315 260 H1380 V445" fill="none" stroke="#D97A2B" stroke-width="5"/><path d="M1368 430 L1380 450 L1392 430" fill="none" stroke="#D97A2B" stroke-width="5"/><rect x="535" y="762" width="985" height="60" rx="14" fill="#E3F0EF"/><text x="1027" y="801" text-anchor="middle" font-size="22" fill="#102A2B">事先定義：可用工具、成本上限、重試規則與人工接手點</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
