<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">基礎模型圖解 / Foundation Model</title><desc id="desc">同一基礎模型分別接到分類、摘要和搜尋功能，每個功能都有自己的任務資料與驗收，而不是一次評測涵蓋全部。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">共用模型，仍要分別調適與驗收</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Foundation Model</text><rect x="80" y="330" width="400" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="452" text-anchor="middle" font-size="36" fill="#102A2B">廣泛訓練的基礎模型</text><path d="M 480 440 L 650 230" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="650" cy="230" r="10" fill="#0D6B68"/><path d="M 480 440 L 650 440" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="650" cy="440" r="10" fill="#0D6B68"/><path d="M 480 440 L 650 650" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="650" cy="650" r="10" fill="#0D6B68"/><rect x="650" y="160" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="815" y="237" text-anchor="middle" font-size="36" fill="#102A2B">分類調適</text><rect x="650" y="375" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="815" y="452" text-anchor="middle" font-size="36" fill="#102A2B">摘要調適</text><rect x="650" y="590" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="815" y="667" text-anchor="middle" font-size="36" fill="#102A2B">搜尋調適</text><path d="M 980 225 L 1150 225" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1150" cy="225" r="10" fill="#0D6B68"/><path d="M 980 440 L 1150 440" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1150" cy="440" r="10" fill="#0D6B68"/><path d="M 980 655 L 1150 655" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1150" cy="655" r="10" fill="#0D6B68"/><rect x="1150" y="160" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1325" y="237" text-anchor="middle" font-size="36" fill="#102A2B">類別驗收</text><rect x="1150" y="375" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1325" y="452" text-anchor="middle" font-size="36" fill="#102A2B">忠實性驗收</text><rect x="1150" y="590" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1325" y="667" text-anchor="middle" font-size="36" fill="#102A2B">相關性驗收</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
