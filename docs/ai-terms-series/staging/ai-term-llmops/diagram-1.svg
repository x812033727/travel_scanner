<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">大型語言模型維運圖解 / LLMOps</title><desc id="desc">版本化資料與提示詞進入評測，通過後部署並監測；確認過的使用者問題回到案例集，形成維運生命週期。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">把使用者回饋接回可重現的評測</text><text x="60" y="84" fill="#5C6B6B" font-size="18">LLMOps</text><rect x="90" y="180" width="430" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="305" y="267" text-anchor="middle" font-size="36" fill="#102A2B">資料與提示詞版本</text><path d="M 520 255 L 680 255" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="680" cy="255" r="10" fill="#0D6B68"/><rect x="680" y="180" width="340" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="850" y="267" text-anchor="middle" font-size="36" fill="#102A2B">評測案例</text><path d="M 1020 255 L 1160 255" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1160" cy="255" r="10" fill="#0D6B68"/><rect x="1160" y="180" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="267" text-anchor="middle" font-size="36" fill="#102A2B">發布版本</text><path d="M 1335 330 L 1335 630" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1335" cy="630" r="10" fill="#0D6B68"/><rect x="1110" y="550" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="637" text-anchor="middle" font-size="36" fill="#102A2B">監測與使用回饋</text><path d="M 1110 625 L 590 625" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="590" cy="625" r="10" fill="#0D6B68"/><rect x="90" y="550" width="500" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="340" y="637" text-anchor="middle" font-size="36" f