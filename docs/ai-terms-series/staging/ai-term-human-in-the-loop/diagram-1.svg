<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">從草稿到執行，保留人的決定</title><desc id="desc">代理提出完整草稿，人工可修改、拒絕或批准，只有批准的版本才執行，最後回報真實結果</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">從草稿到執行，保留人的決定</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Human-in-the-loop</text><path d="M 360 405 L 500 405" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 820 380 L 1000 250" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1235 335 L 1235 570" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="60" y="310" width="300" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="210" y="399" font-size="28" fill="#102A2B" text-anchor="middle">完整草稿</text><text x="210" y="442" font-size="22" fill="#5C6B6B" text-anchor="middle">內容、目標、依據</text><rect x="510" y="310" width="310" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="665" y="399" font-size="28" fill="#102A2B" text-anchor="middle">人工審閱</text><text x="665" y="442" font-size="22" fill="#5C6B6B" text-anchor="middle">修改、拒絕、批准</text><rect x="1010" y="170" width="450" height="165" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1235" y="246.5" font-size="28" fill="#102A2B" text-anchor="middle">執行批准版本</text><text x="1235" y="289.5" font-size="22" fill="#5C6B6B" text-anchor="middle">仍檢查權限與狀態</text><rect x="1010" y="580" width="450" height="165" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1235" y="656.5" font-size="28" fill="#102A2B" text-anchor="middle">核對結果</text><text x="1235" y="699.5" font-size="22" fill="#5C6B6B" text-anchor="middle">成功、失敗或待確認</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
