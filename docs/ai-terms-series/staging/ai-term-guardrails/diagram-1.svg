<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">安全防護機制圖解 / Guardrails</title><desc id="desc">桌燈資料先檢查公開範圍，生成草稿後核對事實與格式，上架前再確認權限與最終內容；各階段都可以回到補充或修正。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">把防護放在資料、草稿與上架三個位置</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Guardrails</text><rect x="60" y="170" width="400" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="260" y="247" text-anchor="middle" font-size="36" fill="#102A2B">使用者物品資料</text><rect x="600" y="170" width="400" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="247" text-anchor="middle" font-size="36" fill="#102A2B">AI 刊登草稿</text><rect x="1140" y="170" width="400" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1340" y="247" text-anchor="middle" font-size="36" fill="#102A2B">準備上架</text><path d="M 460 235 L 600 235" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="600" cy="235" r="10" fill="#0D6B68"/><path d="M 1000 235 L 1140 235" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1140" cy="235" r="10" fill="#0D6B68"/><path d="M 260 300 L 260 390" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="260" cy="390" r="10" fill="#0D6B68"/><path d="M 800 300 L 800 390" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="800" cy="390" r="10" fill="#0D6B68"/><path d="M 1340 300 L 1340 390" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1340" cy="390" r="10" fill="#0D6B68"/><rect x="60" y="390" width="400" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="260" y="487" text-anchor="middle" font-size="36" fill="#102A2B">公開欄位與資料角色</text><rect x="600" y="390" width="400" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="487" text-anchor="middle" font-size="36" fill="#102A2B">事實與格式檢查</text><rect x="1140" y="390" width="400" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1340" y="487" text-anchor="middle" font-size="36" fill="#102A2B">權限與最終確認</text><path d="M 260 560 L 260 650" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="260" cy="650" r="10" fill="#0D6B68"/><path d="M 800 560 L 800 650" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="800" cy="650" r="10" fill="#0D6B68"/><path d="M 1340 560 L 1340 650" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1340" cy="650" r="10" fill="#0D6B68"/><path d="M 260 650 L 1340 650" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1340" cy="650" r="10" fill="#0D6B68"/><rect x="370" y="710" width="860" height="95" rx="24" fill="#F9E7DA" stroke="#D97A2B" stroke-width="4"/><text x="800" y="769.5" text-anchor="middle" font-size="36" fill="#102A2B">補充資料、修正草稿或交回人工</text><path d="M 800 650 L 800 710" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="800" cy="710" r="10" fill="#0D6B68"/><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
