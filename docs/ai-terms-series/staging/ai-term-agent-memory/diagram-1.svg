<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">記憶是一條可檢查的資料流程</title>
<desc id="desc">使用者陳述經保存進入記憶庫，相關內容取回本輪上下文，再使用於讀書安排；修正路徑回到記憶庫。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">記憶是一條可檢查的資料流程</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Agent Memory · 讀書偏好的生命週期</text><path d="M440 280 H600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 280 H1140" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1310 380 V680 H1000" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M800 580 V380" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="90" y="190" width="350" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="265" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">使用者陳述</text><text x="265" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">偏好與適用範圍</text><rect x="610" y="190" width="380" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">記憶庫</text><text x="800" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">內容、來源、日期</text><rect x="1150" y="190" width="350" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">當次上下文</text><text x="1325" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">只取相關資訊</text><rect x="610" y="590" width="380" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="672" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">修正或撤回</text><text x="800" y="722" text-anchor="middle" font-size="25" fill="#5C6B6B">核對舊紀錄</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
