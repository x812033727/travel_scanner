<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">切割邊界不能切掉適用條件</title><desc id="desc">一般清潔規則與廚房例外應保留關係，搭配章節和來源資訊形成可獨立理解的檢索單位</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">切割邊界不能切掉適用條件</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Chunking</text><path d="M 550 310 L 840 365" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 550 590 L 840 500" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="230" width="470" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="315" y="304" font-size="28" fill="#102A2B" text-anchor="middle">一般清潔規則</text><text x="315" y="347" font-size="22" fill="#5C6B6B" text-anchor="middle">活動後可自行清潔</text><rect x="80" y="510" width="470" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="315" y="584" font-size="28" fill="#102A2B" text-anchor="middle">廚房例外</text><text x="315" y="627" font-size="22" fill="#5C6B6B" text-anchor="middle">須由指定人員清潔</text><rect x="850" y="270" width="610" height="310" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1155" y="419" font-size="28" fill="#102A2B" text-anchor="middle">完整檢索單位</text><text x="1155" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">章節＋一般規則＋適用例外</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
