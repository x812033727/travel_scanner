<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif"><title id="title">四條AI名詞閱讀路徑 / Four reading paths</title><desc id="desc">從理解聊天工具、安排代理工作、閱讀自己的文件和判斷媒體來源四種問題出發，每列依序提供三個概念組。這是依任務的閱讀建議，並非模型能力的高低排名。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#0D6B68"/></marker></defs><text x="65" y="60" font-size="30" font-weight="700" fill="#102A2B">先選問題，再沿著概念往下讀</text><text x="65" y="95" font-size="18" fill="#5C6B6B">AI terminology — find a useful starting point</text><text x="65" y="222" font-size="25" font-weight="700" fill="#102A2B">理解聊天工具</text><rect x="350" y="155" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="525" y="224" text-anchor="middle" font-size="26" fill="#102A2B">模型與 AI 基礎</text><path d="M704 214 H747" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="760" y="155" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="935" y="224" text-anchor="middle" font-size="26" fill="#102A2B">token 與上下文</text><path d="M1114 214 H1157" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="1170" y="155" width="350" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1345" y="224" text-anchor="middle" font-size="26" fill="#102A2B">幻覺與評測</text><text x="65" y="386" font-size="25" font-weight="700" fill="#102A2B">安排代理工作</text><rect x="350" y="319" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="525" y="388" text-anchor="middle" font-size="26" fill="#102A2B">AI 代理與工具</text><path d="M704 378 H747" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="760" y="319" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="935" y="388" text-anchor="middle" font-size="26" fill="#102A2B">協調與工作迴圈</text><path d="M1114 378 H1157" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="1170" y="319" width="350" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1345" y="388" text-anchor="middle" font-size="26" fill="#102A2B">停止與人工介入</text><text x="65" y="550" font-size="25" font-weight="700" fill="#102A2B">閱讀自己的文件</text><rect x="350" y="483" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="525" y="552" text-anchor="middle" font-size="26" fill="#102A2B">文件分塊與搜尋</text><path d="M704 542 H747" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="760" y="483" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="935" y="552" text-anchor="middle" font-size="26" fill="#102A2B">檢索增強生成</text><path d="M1114 542 H1157" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="1170" y="483" width="350" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1345" y="552" text-anchor="middle" font-size="26" fill="#102A2B">引用與答案驗證</text><text x="65" y="714" font-size="25" font-weight="700" fill="#102A2B">判斷媒體與來源</text><rect x="350" y="647" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="525" y="716" text-anchor="middle" font-size="26" fill="#102A2B">多模態與生成</text><path d="M704 706 H747" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="760" y="647" width="350" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="935" y="716" text-anchor="middle" font-size="26" fill="#102A2B">開放材料與條款</text><path d="M1114 706 H1157" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="1170" y="647" width="350" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1345" y="716" text-anchor="middle" font-size="26" fill="#102A2B">內容憑證與查核</text><text x="65" y="852" font-size="20" fill="#5C6B6B">依任務選擇起點；遇到不熟悉的概念，再看相關專文。</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
