<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">教師是訓練訊號，不是正確答案保證</title><desc id="desc">代表性資料送入教師取得軟目標或示範，再訓練學生；獨立標註另行檢查學生而不只看是否模仿教師</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">教師是訓練訊號，不是正確答案保證</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Knowledge Distillation</text><path d="M 370 370 L 480 370" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 790 370 L 900 370" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1060 460 L 1060 630" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="280" width="300" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="220" y="364" font-size="28" fill="#102A2B" text-anchor="middle">代表性資料</text><text x="220" y="407" font-size="22" fill="#5C6B6B" text-anchor="middle">文件分類範圍</text><rect x="490" y="280" width="300" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="640" y="364" font-size="28" fill="#102A2B" text-anchor="middle">教師模型</text><text x="640" y="407" font-size="22" fill="#5C6B6B" text-anchor="middle">軟目標或示範</text><rect x="910" y="280" width="300" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1060" y="364" font-size="28" fill="#102A2B" text-anchor="middle">學生模型</text><text x="1060" y="407" font-size="22" fill="#5C6B6B" text-anchor="middle">學習可用行為</text><rect x="870" y="640" width="580" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1160" y="704" font-size="28" fill="#102A2B" text-anchor="middle">獨立標註與硬體評估</text><text x="1160" y="747" font-size="22" fill="#5C6B6B" text-anchor="middle">正確性、速度、記憶體</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
