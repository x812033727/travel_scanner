<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">接近的是表示，不是事實保證</title><desc id="desc">問題與文件分別經相容的編碼轉成向量，計算相似度後取回原文，再檢查實際條件</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">接近的是表示，不是事實保證</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Embedding</text><path d="M 420 280 L 600 390" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 420 625 L 600 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 940 430 L 1130 430" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="90" y="200" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="255" y="269" font-size="28" fill="#102A2B" text-anchor="middle">問題</text><text x="255" y="312" font-size="22" fill="#5C6B6B" text-anchor="middle">下雨可以去哪裡</text><rect x="90" y="550" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="255" y="619" font-size="28" fill="#102A2B" text-anchor="middle">文件</text><text x="255" y="662" font-size="22" fill="#5C6B6B" text-anchor="middle">活動筆記</text><rect x="610" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="775" y="424" font-size="28" fill="#102A2B" text-anchor="middle">相容的向量表示</text><text x="775" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">依模型比較相似度</text><rect x="1140" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1305" y="424" font-size="28" fill="#102A2B" text-anchor="middle">讀回候選原文</text><text x="1305" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">核對預約與開放條件</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
