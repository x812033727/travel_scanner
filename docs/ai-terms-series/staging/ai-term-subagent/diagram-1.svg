<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">把交辦和回報都寫清楚</title>
<desc id="desc">主代理把期別、欄位與來源限制交給查核子代理，子代理回傳差異表與證據，最後由主代理驗收並整合。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">把交辦和回報都寫清楚</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Subagent · 社區刊物活動查核</text><path d="M540 260 H1010" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1010 350 H540" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1245 410 V700 H1050" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M590 700 H310 V410" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="100" y="210" width="430" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="315" y="297" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">主代理</text><text x="315" y="347" text-anchor="middle" font-size="25" fill="#5C6B6B">刊物目標與整體進度</text><rect x="1020" y="210" width="450" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1245" y="297" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">查核子代理</text><text x="1245" y="347" text-anchor="middle" font-size="25" fill="#5C6B6B">活動日期與地點</text><rect x="600" y="610" width="440" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="820" y="692" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">回報成果</text><text x="820" y="742" text-anchor="middle" font-size="25" fill="#5C6B6B">差異、來源、未確認</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
