<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">權重只是可執行模型的一部分</title><desc id="desc">可下載權重需要相容架構設定、tokenizer與推論程式，另須核對授權和任務品質</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">權重只是可執行模型的一部分</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Open Weights</text><path d="M 410 365 L 615 215" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 410 470 L 615 640" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 975 210 L 1160 365" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 975 640 L 1160 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="310" width="340" height="210" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="240" y="409" font-size="28" fill="#102A2B" text-anchor="middle">可取得權重</text><text x="240" y="452" font-size="22" fill="#5C6B6B" text-anchor="middle">已訓練參數</text><rect x="625" y="130" width="350" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="204" font-size="28" fill="#102A2B" text-anchor="middle">相容執行元件</text><text x="800" y="247" font-size="22" fill="#5C6B6B" text-anchor="middle">架構、設定、分詞</text><rect x="625" y="560" width="350" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="634" font-size="28" fill="#102A2B" text-anchor="middle">使用條件</text><text x="800" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">授權與來源版本</text><rect x="1170" y="300