<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">越獄提示圖解 / Jailbreak</title><desc id="desc">測試輸入送入有退款規則的客服助手後，分別檢查最後回覆與工具狀態，再與預先定義的規則比較。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">看實際行為，才能判斷測試是否失敗</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Jailbreak</text><rect x="75" y="170" width="360" height="175" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="255" y="269.5" text-anchor="middle" font-size="36" fill="#102A2B">測試輸入</text><path d="M 435 255 L 555 255" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="555" cy="255" r="10" fill="#0D6B68"/><rect x="555" y="170" width="490" height="175" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="269.5" text-anchor="middle" font-size="36" fill="#102A2B">客服規則與申請狀態</text><path d="M 1045 255 L 1165 255" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1165" cy="255" r="10" fill="#0D6B68"/><rect x="1165" y="170" width="360" height="175" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1345" y="269.5" text-anchor="middle" font-size="36" fill="#102A2B">助手執行</text><path d="M 1345 345 L 1345 435" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1345" cy="435" r="10" fill="#0D6B68"/><path d="M 445 435 L 1345 435" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1345" cy="435" r="10" fill="#0D6B68"/><path d="M 445 435 L 445 535" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="445" cy="535" r="10" fill="#0D6B68"/><path d="M 1165 435 L 1165 535" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1165" cy="535" r="10" fill="#0D6B68"/><rect x="155" y="535" width="580" height="155" rx="24" fill="#F9E7DA" stroke="#D97A2B" stroke-width="4"/><text x="445" y="624.5" text-anchor="middle" font-size="36" fill="#102A2B">最後回覆：是否錯誤承諾</text><rect x="875" y="535" width="580" height="155" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1165" y="624.5" text-anchor="middle" font-size="36" fill="#102A2B">工具狀態：是否未授權變更</text><text x="800" y="775" text-anchor="middle" font-size="36" fill="#102A2B">同時檢查正常需求能否完成</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
