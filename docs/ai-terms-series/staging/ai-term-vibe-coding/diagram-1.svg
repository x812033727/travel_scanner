<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">氛圍編碼圖解 / Vibe Coding</title><desc id="desc">新增書籍後，依序檢查當次顯示、重新整理後保留與跨裝置讀取，每一步需要不同證據，最後才進入審查。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">一個儲存按鈕，可能代表不同完成程度</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Vibe Coding</text><rect x="100" y="210" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="300" y="297" text-anchor="middle" font-size="36" fill="#102A2B">新增後看得見</text><path d="M 500 285 L 600 285" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="600" cy="285" r="10" fill="#0D6B68"/><rect x="600" y="210" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="297" text-anchor="middle" font-size="36" fill="#102A2B">重新整理仍存在</text><path d="M 1000 285 L 1100 285" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1100" cy="285" r="10" fill="#0D6B68"/><rect x="1100" y="210" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1300" y="297" text-anchor="middle" font-size="36" fill="#102A2B">跨裝置可讀取</text><text x="300" y="440" text-anchor="middle" font-size="32" fill="#102A2B">頁面互動</text><text x="800" y="440" text-anchor="middle" font-size="32" fill="#102A2B">持續儲存</text><text x="1300" y="440" text-anchor="middle" font-size="32" fill="#102A2B">同步與身分</text><rect x="310" y="590" width="980" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="677" text-anchor="middle" font-size="36" fill="#102A2B">多人使用前：釐清規格、審查資料與權限</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
