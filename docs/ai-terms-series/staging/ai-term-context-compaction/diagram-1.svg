<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">壓縮後先核對，再往下做</title>
<desc id="desc">長對話經挑選後形成交接狀態，核對否定條件再續作；原始報價另行保留供回查。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">壓縮後先核對，再往下做</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Context Compaction · 搬家任務交接</text><path d="M430 295 H600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M980 295 H1140" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M260 400 V680 H600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M980 680 H1330 V400" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="200" width="360" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="250" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">長對話</text><text x="250" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">決策、報價、撤回</text><rect x="610" y="200" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">交接摘要</text><text x="795" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">目標與目前狀態</text><rect x="1150" y="200" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">續作檢查</text><text x="1335" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">日期仍暫定？</text><rect x="610" y="600" width="370" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="672" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">原始資料</text><text x="795" y="722" text-anchor="middle" font-size="25" fill="#5C6B6B">保留報價與位置</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
