<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">幻覺圖解 / Hallucination</title><desc id="desc">把展覽回答中的書名、年份與販售安排分別對照原始來源，再標成支持、矛盾或待確認。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">一段回答，拆成可核對的主張</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Hallucination</text><rect x="60" y="170" width="350" height="190" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="235" y="277" text-anchor="middle" font-size="36" fill="#102A2B">AI 展覽介紹</text><path d="M 410 265 L 510 265" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="510" cy="265" r="10" fill="#0D6B68"/><rect x="510" y="170" width="500" height="190" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="760" y="277" text-anchor="middle" font-size="36" fill="#102A2B">書名／年份／販售安排</text><path d="M 1010 265 L 1110 265" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1110" cy="265" r="10" fill="#0D6B68"/><rect x="1110" y="170" width="420" height="190" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1320" y="277" text-anchor="middle" font-size="36" fill="#102A2B">原始來源</text><path d="M 1320 360 L 1320 435" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1320" cy="435" r="10" fill="#0D6B68"/><path d="M 270 435 L 1320 435" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1320" cy="435" r="10" fill="#0D6B68"/><path d="M 270 435 L 270 530" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="270" cy="530" r="10" fill="#0D6B68"/><path d="M 790 435 L 790 530" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="790" cy="530" r="10" fill="#0D6B68"/><path d="M 1320 435 L 1320 530" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1320" cy="530" r="10" fill="#0D6B68"/><rect x="65" y="530" width="410" height="155" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="270" y="619.5" text-anchor="middle" font-size="36" fill="#102A2B">支持：保留</text><rect x="585" y="530" width="410" height="155" rx="24" fill="#F9E7DA" stroke="#D97A2B" stroke-width="4"/><text x="790" y="619.5" text-anchor="middle" font-size="36" fill="#102A2B">矛盾：修正</text><rect x="1115" y="530" width="410" height="155" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1320" y="619.5" text-anchor="middle" font-size="36" fill="#102A2B">待確認：暫不斷言</text><text x="800" y="770" text-anchor="middle" font-size="34" fill="#102A2B">連結存在 ≠ 來源支持每一句話</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
