<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">提示詞工程圖解 / Prompt Engineering</title><desc id="desc">需求與資料組成提示詞，輸出經驗收條件核對後，錯誤回到指令修正，再使用原案例重試。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">提示詞改版，要回到同一組案例</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Prompt Engineering</text><rect x="90" y="200" width="370" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="287" text-anchor="middle" font-size="36" fill="#102A2B">需求與原始資料</text><path d="M 460 275 L 590 275" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="590" cy="275" r="10" fill="#0D6B68"/><rect x="590" y="200" width="380" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="780" y="287" text-anchor="middle" font-size="36" fill="#102A2B">提示詞</text><path d="M 970 275 L 1120 275" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1120" cy="275" r="10" fill="#0D6B68"/><rect x="1120" y="200" width="370" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1305" y="287" text-anchor="middle" font-size="36" fill="#102A2B">模型輸出</text><path d="M 1305 350 L 1305 580" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1305" cy="580" r="10" fill="#0D6B68"/><rect x="1090" y="580" width="410" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1295" y="667" text-anchor="middle" font-size="36" fill="#102A2B">對照驗收條件</text><path d="M 1090 655 L 790 655" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="790" cy="655" r="10" fill="#0D6B68"/><rect x="390" y="580" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="590" y="667" text-anchor="middle" font-size="36" fill="#102A2B">修正原因與版本</text><path d="M 390 655 L 250 655" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="250" cy="655" r="10" fill="#0D6B68"/><path d="M 250 655 L 250 350" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="250" cy="350" r="10" fill="#0D6B68"/><text x="780" y="470" text-anchor="middle" font-size="32" fill="#102A2B">用正常、缺漏與衝突案例檢查</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
