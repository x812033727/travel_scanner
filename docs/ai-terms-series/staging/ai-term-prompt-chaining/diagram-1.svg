<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">提示詞串接圖解 / Prompt Chaining</title><desc id="desc">會議紀錄先抽取決議，檢查負責人與期限；合格資料進入通知撰寫，缺漏資料轉到待確認分支。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">先保留決議，再檢查，最後寫通知</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Prompt Chaining</text><rect x="80" y="250" width="320" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="240" y="337" text-anchor="middle" font-size="36" fill="#102A2B">會議紀錄</text><path d="M 400 325 L 480 325" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="480" cy="325" r="10" fill="#0D6B68"/><rect x="480" y="250" width="320" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="640" y="337" text-anchor="middle" font-size="36" fill="#102A2B">抽取決議</text><path d="M 800 325 L 890 325" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="890" cy="325" r="10" fill="#0D6B68"/><rect x="890" y="250" width="330" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1055" y="337" text-anchor="middle" font-size="36" fill="#102A2B">欄位與來源檢查</text><path d="M 1220 325 L 1300 325" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1300" cy="325" r="10" fill="#0D6B68"/><rect x="1300" y="250" width="230" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1415" y="337" text-anchor="middle" font-size="36" fill="#102A2B">寫通知</text><path d="M 1055 400 L 1055 630" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1055" cy="630" r="10" fill="#0D6B68"/><rect x="820" y="630" width="470" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1055" y="707" text-anchor="middle" font-size="36" fill="#102A2B">缺漏：保留待確認</text><text x="460" y="680" text-anchor="middle" font-size="32" fill="#102A2B">原句與確認狀態一起交接</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
