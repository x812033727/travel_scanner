<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">開源判準同時看自由與修改材料</title><desc id="desc">使用研究修改分享的自由，需配合資料資訊、完整相關程式和模型參數，不能僅用可下載權重判定</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">開源判準同時看自由與修改材料</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Open Source AI — OSI definition 1.0</text><path d="M 275 315 L 275 480" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 795 315 L 795 480" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1315 315 L 1315 480" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="160" width="1430" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="231.5" font-size="28" fill="#102A2B" text-anchor="middle">使用、研究、修改、分享</text><text x="795" y="274.5" font-size="22" fill="#5C6B6B" text-anchor="middle">實際行使自由所需的形式</text><rect x="80" y="490" width="390" height="225" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="596.5" font-size="28" fill="#102A2B" text-anchor="middle">資料資訊</text><text x="275" y="639.5" font-size="22" fill="#5C6B6B" text-anchor="middle">來源、處理、清單</text><rect x="600" y="490" width="390" height="225" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="596.5" font-size="28" fill="#102A2B" text-anchor="middle">程式</text><text x="795" y="639.5" font-size="22" fill="#5C6B6B" text-anchor="middle">訓練與執行流程</text><rect x="1120" y="490" width="390" height="225" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1315" y="596.5" font-size="28" fill="#102A2B" text-anchor="middle">參數</text><text x="1315" y="639.5" font-size="22" fill="#5C6B6B" text-anchor="middle">權重與相關設定</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
