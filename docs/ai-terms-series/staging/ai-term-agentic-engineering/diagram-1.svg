<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">代理式工程圖解 / Agentic Engineering</title><desc id="desc">人先提供借用規則，代理讀取程式、修改並執行測試，證據回到人審查；未符合規則的結果返回修正。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">委派、實作、證據與審查的合作關係</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Agentic Engineering</text><rect x="100" y="190" width="380" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="290" y="277" text-anchor="middle" font-size="36" fill="#102A2B">人：規則與範圍</text><path d="M 480 265 L 620 265" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="620" cy="265" r="10" fill="#0D6B68"/><rect x="620" y="190" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="820" y="277" text-anchor="middle" font-size="36" fill="#102A2B">代理：讀取與修改</text><path d="M 1020 265 L 1140 265" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1140" cy="265" r="10" fill="#0D6B68"/><rect x="1140" y="190" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1315" y="277" text-anchor="middle" font-size="36" fill="#102A2B">執行檢查</text><path d="M 1315 340 L 1315 620" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1315" cy="620" r="10" fill="#0D6B68"/><rect x="1120" y="550" width="390" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1315" y="637" text-anchor="middle" font-size="36" fill="#102A2B">差異與測試證據</text><path d="M 1120 625 L 520 625" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="520" cy="625" r="10" fill="#0D6B68"/><rect x="100" y="550" width="420" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="310" y="637" text-anchor="middle" font-size="36" fill="#102A2B">人：理解與驗收</text><path d="M 310 550 L 310 340" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="310" cy="340" r="10" fill="#0D6B68"/><text x="805" y="760" text-anchor="middle" font-size="32" fill="#102A2B">未符合的行為帶著原因返回修改</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
