<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">先辨認缺口，再分配工作</title><desc id="desc">任務先區分缺少事實與需要推導，前者查資料，後者拆解條件，兩者最後都經獨立驗證</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">先辨認缺口，再分配工作</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Reasoning Model</text><path d="M 400 380 L 600 235" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 400 460 L 600 640" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 980 230 L 1170 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 980 640 L 1170 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="325" width="330" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="235" y="414" font-size="28" fill="#102A2B" text-anchor="middle">讀者任務</text><text x="235" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">目標與硬限制</text><rect x="610" y="150" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="224" font-size="28" fill="#102A2B" text-anchor="middle">缺少事實</text><text x="795" y="267" font-size="22" fill="#5C6B6B" text-anchor="middle">查可靠來源</text><rect x="610" y="560" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="634" font-size="28" fill="#102A2B" text-anchor="middle">需要推導</text><text x="795" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">探索可行方案</text><rect x="1180" y="320" width="350" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1355" y="414" font-size="28" fill="#102A2B" text-anchor="middle">結果驗證</text><text x="1355" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">來源、運算、限制</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
