<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">機器學習圖解 / Machine Learning</title><desc id="desc">歷史資料分成訓練與保留測試；訓練調整參數，固定後對測試輸入做預測，再與真實結果比較。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">訓練資料與未見資料必須分開</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Machine Learning</text><rect x="90" y="180" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="262" text-anchor="middle" font-size="36" fill="#102A2B">歷史資料</text><path d="M 460 250 L 650 250" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="650" cy="250" r="10" fill="#0D6B68"/><rect x="650" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="825" y="257" text-anchor="middle" font-size="36" fill="#102A2B">訓練：調整模型</text><path d="M 1000 245 L 1150 245" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1150" cy="245" r="10" fill="#0D6B68"/><rect x="1150" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="257" text-anchor="middle" font-size="36" fill="#102A2B">固定模型</text><path d="M 275 320 L 275 590" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="275" cy="590" r="10" fill="#0D6B68"/><rect x="90" y="590" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="275" y="672" text-anchor="middle" font-size="36" fill="#102A2B">保留測試輸入</text><path d="M 460 660 L 650 660" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="650" cy="660" r="10" fill="#0D6B68"/><rect x="650" y="590" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="825" y="672" text-anchor="middle" font-size="36"