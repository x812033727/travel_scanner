<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">新觀察要能改變下一步</title>
<desc id="desc">查詢展覽先辨認缺口，再讀官方展頁，根據臨時公告更新判斷，最後把已確認與未確認分開回答。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">新觀察要能改變下一步</text><text x="60" y="84" font-size="18" fill="#5C6B6B">ReAct · 展覽開放資訊查詢</text><path d="M460 265 H590" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M980 265 H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1310 370 V685 H990" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M600 685 H270 V370" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="170" width="380" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="270" y="257" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">辨認缺口</text><text x="270" y="307" text-anchor="middle" font-size="25" fill="#5C6B6B">展期與臨時調整</text><rect x="600" y="170" width="380" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="790" y="257" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">採取行動</text><text x="790" y="307" text-anchor="middle" font-size="25" fill="#5C6B6B">讀取正式來源</text><rect x="1120" y="170" width="380" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="257" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">外部觀察</text><text x="1310" y="307" text-anchor="middle" font-size="25" fill="#5C6B6B">一般規則與例外</text><rect x="600" y="600" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="790" y="677" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">更新判斷</text><text x="790" y="727" text-anchor="middle" font-size="25" fill="#5C6B6B">繼續查或完成</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
