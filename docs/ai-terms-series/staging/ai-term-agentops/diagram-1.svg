<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">代理系統維運圖解 / AgentOps</title><desc id="desc">一條任務軌跡包含讀訂單、查庫存和建立申請；建立申請逾時時另走狀態查詢，避免直接重複執行。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">同一次換貨任務中的模型與工具證據</text><text x="60" y="84" fill="#5C6B6B" font-size="18">AgentOps</text><rect x="90" y="170" width="1420" height="110" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="237" text-anchor="middle" font-size="36" fill="#102A2B">換貨任務：共同識別與版本</text><rect x="120" y="370" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="295" y="452" text-anchor="middle" font-size="36" fill="#102A2B">讀取訂單</text><path d="M 470 440 L 620 440" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="620" cy="440" r="10" fill="#0D6B68"/><rect x="620" y="370" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="452" text-anchor="middle" font-size="36" fill="#102A2B">查詢庫存</text><path d="M 970 440 L 1120 440" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1120" cy="440" r="10" fill="#0D6B68"/><rect x="1120" y="370" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1295" y="452" text-anchor="middle" font-size="36" fill="#102A2B">建立申請</text><path d="M 1295 510 L 1295 640" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1295" cy="640" r="10" fill="#0D6B68"/><rect x="1010" y="640" width="490" height="120" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1255" y="712" text-anchor="middle" font-size="36" fill="#102A2B">逾時：先查既有狀態</text><text x="515" y="715" text-anchor="middle" font-size="32" fill="#102A2B">回答、工具結果、外部狀態分開核對</tex