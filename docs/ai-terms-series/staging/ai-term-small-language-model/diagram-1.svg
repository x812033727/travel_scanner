<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">小型語言模型圖解 / Small Language Model</title><desc id="desc">維修筆記進入小型模型後先驗收欄位與狀態；品質足夠時再檢查裝置資源與資料流，困難案例交回確認。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">先看任務品質，再看裝置與資料流</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Small Language Model</text><rect x="80" y="210" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="255" y="297" text-anchor="middle" font-size="36" fill="#102A2B">維修筆記</text><path d="M 430 285 L 550 285" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="550" cy="285" r="10" fill="#0D6B68"/><rect x="550" y="210" width="400" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="750" y="297" text-anchor="middle" font-size="36" fill="#102A2B">小型語言模型</text><path d="M 950 285 L 1080 285" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1080" cy="285" r="10" fill="#0D6B68"/><rect x="1080" y="210" width="430" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1295" y="297" text-anchor="middle" font-size="36" fill="#102A2B">欄位與狀態驗收</text><path d="M 1295 360 L 1295 600" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1295" cy="600" r="10" fill="#0D6B68"/><rect x="1090" y="600" width="420" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1300" y="677" text-anchor="middle" font-size="36" fill="#102A2B">裝置資源與資料流</text><rect x="170" y="600" width="710" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="525" y="677" text-anchor="middle" font-size="36" fill="#102A2B">不確定或失敗：保留原文交回確認</text><path d="M 550 360 L 525 600" stroke="#0D6B68" stroke-width="9"