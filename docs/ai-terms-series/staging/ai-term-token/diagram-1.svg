<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">從文字到模型的計量單位</title>
<desc id="desc">文字輸入先經分詞器變成片段與編號，再交由模型產生回覆；底部提示完整請求可能包含規則與歷史。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">從文字到模型的計量單位</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Token · 片段邊界依分詞器而異</text><path d="M390 340 H490" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M760 340 H860" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M820 590 V500 H1010 V440" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="250" width="310" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="235" y="332" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">文字</text><text x="235" y="382" text-anchor="middle" font-size="25" fill="#5C6B6B">公告與問題</text><rect x="500" y="250" width="260" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="630" y="332" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">分詞器</text><text x="630" y="382" text-anchor="middle" font-size="25" fill="#5C6B6B">規則與詞彙表</text><rect x="870" y="250" width="290" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1015" y="332" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">token 序列</text><text x="1015" y="382" text-anchor="middle" font-size="25" fill="#5C6B6B">片段與編號</text><rect x="540" y="600" width="570" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="825" y="672" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">完整請求</text><text x="825" y="722" text-anchor="middle" font-size="25" fill="#5C6B6B">也可能含規則、歷史與工具</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
