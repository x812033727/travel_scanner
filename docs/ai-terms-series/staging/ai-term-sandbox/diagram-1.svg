<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">可執行，不代表可存取所有資源</title><desc id="desc">代理程式在沙盒中只讀指定輸入並寫指定輸出，外部檔案和網路另受權限控制，輸出之後仍需人工核對</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">可執行，不代表可存取所有資源</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Sandbox</text><path d="M 420 410 L 620 410" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1030 410 L 1180 410" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 830 665 L 830 570" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="320" width="340" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="250" y="404" font-size="28" fill="#102A2B" text-anchor="middle">指定輸入副本</text><text x="250" y="447" font-size="22" fill="#5C6B6B" text-anchor="middle">任務必要資料</text><rect x="630" y="260" width="400" height="300" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="830" y="404" font-size="28" fill="#102A2B" text-anchor="middle">沙盒內程式</text><text x="830" y="447" font-size="22" fill="#5C6B6B" text-anchor="middle">限定檔案與資源</text><rect x="1190" y="320" width="340" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1360" y="404" font-size="28" fill="#102A2B" text-anchor="middle">待核對的輸出</text><text x="1360" y="447" font-size="22" fill="#5C6B6B" text-anchor="middle">不等於正式資料更新</text><rect x="650" y="665" width="360" height="125" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="830" y="721.5" font-size="28" fill="#102A2B" text-anchor="middle">其他存取</text><text x="830" y="764.5" font-size="22" fill="#5C6B6B" text-anchor="middle">依政策允許或拒絕</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
