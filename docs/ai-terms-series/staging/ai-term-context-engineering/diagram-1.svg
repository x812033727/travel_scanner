<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">上下文工程圖解 / Context Engineering</title><desc id="desc">現行規章、當次需求與時段查詢經過版本、權限和相關性篩選後進入模型；舊規章與他人個資留在外部。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">把可用資料整理成當次工作材料</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Context Engineering</text><rect x="80" y="170" width="400" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="247" text-anchor="middle" font-size="36" fill="#102A2B">現行規章</text><rect x="80" y="350" width="400" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="427" text-anchor="middle" font-size="36" fill="#102A2B">當次需求</text><rect x="80" y="530" width="400" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="607" text-anchor="middle" font-size="36" fill="#102A2B">時段查詢</text><path d="M 480 235 L 630 415" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="630" cy="415" r="10" fill="#0D6B68"/><path d="M 480 415 L 630 415" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="630" cy="415" r="10" fill="#0D6B68"/><path d="M 480 595 L 630 415" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="630" cy="415" r="10" fill="#0D6B68"/><rect x="630" y="300" width="350" height="230" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="805" y="427" text-anchor="middle" font-size="36" fill="#102A2B">版本與權限篩選</text><path d="M 980 415 L 1110 415" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1110" cy="415" r="10" fill="#0D6B68"/><rect x="1110" y="300" width="400" height="230" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="427" text-anchor="middle" font-size="36" fill="#102A2B">當次模型上下文</text><text x="810" y="655" text-anchor="middle" font-size="32" fill="#102A2B">保留來源與缺漏狀態</text><text x="810" y="715" text-anchor="middle" font-size="32" fill="#102A2B">過期或無權資料不納入</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
