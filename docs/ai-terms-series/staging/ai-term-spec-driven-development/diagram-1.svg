<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">規格驅動開發圖解 / Spec-driven Development</title><desc id="desc">需求、設計、任務與測試橫向連線，下方變更紀錄回到整條鏈，表示規格改變需要同步檢查後續產物。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">每項實作都能追回需求與驗收</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Spec-driven Development</text><rect x="80" y="230" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="230" y="327" text-anchor="middle" font-size="36" fill="#102A2B">需求</text><path d="M 380 315 L 460 315" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="460" cy="315" r="10" fill="#0D6B68"/><rect x="460" y="230" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="610" y="327" text-anchor="middle" font-size="36" fill="#102A2B">設計</text><path d="M 760 315 L 840 315" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="840" cy="315" r="10" fill="#0D6B68"/><rect x="840" y="230" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="990" y="327" text-anchor="middle" font-size="36" fill="#102A2B">任務</text><path d="M 1140 315 L 1220 315" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1220" cy="315" r="10" fill="#0D6B68"/><rect x="1220" y="230" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1370" y="327" text-anchor="middle" font-size="36" fill="#102A2B">驗收</text><text x="230" y="485" text-anchor="middle" font-size="32" fill="#102A2B">什麼行為</text><text x="610" y="485" text-anchor="middle" font-size="32" fill="#102A2B">如何保障</text><text x="990" y="485" text-anchor="middle" font-size="32" fill="#102A2B">做哪些工作</text><text x="1370" y="485" text-anchor="middle" font-size="32" fill="#102A2B">看什麼證據</text><rect x="380" y="630" width="840" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="707" text-anchor="middle" font-size="36" fill="#102A2B">規格變更：重新檢查影響與證據</text><path d="M 800 630 L 800 535" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="800" cy="535" r="10" fill="#0D6B68"/><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
