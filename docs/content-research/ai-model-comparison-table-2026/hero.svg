<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">同級距怎麼比 / Comparing models within a tier</title>
  <desc id="desc">米色底上有三個由高到矮並排的圓角方塊，代表旗艦、中階與輕量三個級距，每個方塊裡有數量不同的小圓點，代表各家在那一級距裡的模型。畫面右側有一條縱向虛線把版面分成兩半，線的右邊只有一個灰色的空方塊，代表有資料可比與沒有資料可比的差別。上方置中有一行字寫著同級距怎麼比。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="170" text-anchor="middle" font-size="52" font-weight="bold" fill="#102A2B">同級距怎麼比</text>

  <rect x="150" y="300" width="280" height="400" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
  <circle cx="230" cy="380" r="22" fill="#0D6B68"/>
  <circle cx="310" cy="380" r="22" fill="#0D6B68"/>
  <circle cx="230" cy="460" r="22" fill="#0D6B68"/>
  <circle cx="310" cy="460" r="22" fill="#2E7D5B"/>
  <circle cx="230" cy="540" r="22" fill="#2E7D5B"/>
  <circle cx="310" cy="540" r="22" fill="#0D6B68"/>

  <rect x="500" y="400" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="10"/>
  <circle cx="580" cy="480" r="22" fill="#2F6F9F"/>
  <circle cx="660" cy="480" r="22" fill="#2F6F9F"/>
  <circle cx="580" cy="560" r="22" fill="#2F6F9F"/>
  <circle cx="660" cy="560" r="22" fill="#5C6B6B"/>

  <rect x="850" y="500" width="280" height="200" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="10"/>
  <circle cx="930" cy="590" r="22" fill="#D97A2B"/>
  <circle cx="1050" cy="590" r="22" fill="#D97A2B"/>

  <path d="M 1250 240 L 1250 760" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="24 20" fill="none"/>

  <rect x="1330" y="400" width="200" height="300" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="10" stroke-dasharray="20 16"/>

  <path d="M 150 760 L 1130 760" stroke="#102A2B" stroke-width="8" fill="none"/>
</svg>
