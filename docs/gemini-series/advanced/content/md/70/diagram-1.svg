<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">主檔短，責任與測試要清楚</title><desc id="desc">主檔：說清適用範圍：匯入三份共用規則；分工：風格・測試・責任：每條都有維護理由；測試：檔案存在不夠：命令也必須跑通；交接：保留變更原因：新成員能重做一次</desc>
<rect width="1600" height="900" fill="#f7f3e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#122e39" font-weight="800">主檔短，責任與測試要清楚</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#286657" font-weight="800">主檔</text><text x="120" y="311" font-size="54" fill="#122e39" font-weight="500">說清適用範圍</text><text x="120" y="379" font-size="54" fill="#122e39" font-weight="500">匯入三份共用規則</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#286657" font-weight="800">分工</text><text x="855" y="311" font-size="54" fill="#122e39" font-weight="500">風格・測試・責任</text><text x="855" y="379" font-size="54" fill="#122e39" font-weight="500">每條都有維護理由</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#286657" font-weight="800">測試</text><text x="120" y="601" font-size="54" fill="#122e39" font-weight="500">檔案存在不夠</text><text x="120" y="669" font-size="54" fill="#122e39" font-weight="500">命令也必須跑通</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#286657" font-weight="800">交接</text><text x="855" y="601" font-size="54" fill="#122e39" font-weight="500">保留變更原因</text><text x="855" y="669" font-size="54" fill="#122e39" font-weight="500">新成員能重做一次</text><text x="85" y="818" font-size="47" fill="#48615c" font-weight="500">反例：缺檔與衝突命令，都應被發現</text></g></svg>