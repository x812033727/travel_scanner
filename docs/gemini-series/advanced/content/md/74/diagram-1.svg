<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">從範圍到恢復，每步都有證據</title><desc id="desc">先記錄：範圍 ＋ 原有差異：別漏掉未追蹤檔案；小修改：只改指定模組：用同一測試核對；保留：使用者草稿不覆寫：比較前後差異；恢復：對話 ≠ 檔案回復：先讀磁碟現況</desc>
<rect width="1600" height="900" fill="#f7f3e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#122e39" font-weight="800">從範圍到恢復，每步都有證據</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#286657" font-weight="800">先記錄</text><text x="120" y="311" font-size="54" fill="#122e39" font-weight="500">範圍 ＋ 原有差異</text><text x="120" y="379" font-size="54" fill="#122e39" font-weight="500">別漏掉未追蹤檔案</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#286657" font-weight="800">小修改</text><text x="855" y="311" font-size="54" fill="#122e39" font-weight="500">只改指定模組</text><text x="855" y="379" font-size="54" fill="#122e39" font-weight="500">用同一測試核對</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#286657" font-weight="800">保留</text><text x="120" y="601" font-size="54" fill="#122e39" font-weight="500">使用者草稿不覆寫</text><text x="120" y="669" font-size="54" fill="#122e39" font-weight="500">比較前後差異</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#286657" font-weight="800">恢復</text><text x="855" y="601" font-size="54" fill="#122e39" font-weight="500">對話 ≠ 檔案回復</text><text x="855" y="669" font-size="54" fill="#122e39" font-weight="500">先讀磁碟現況</text><text x="85" y="818" font-size="47" fill="#48615c" font-weight="500">本機修正已測；登入會話恢復未測</text></g></svg>