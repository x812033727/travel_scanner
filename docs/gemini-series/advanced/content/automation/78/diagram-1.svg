<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">核對輸入與成品，再使用檢查點</title><desc id="desc">第一次：完成 5 份後停止：保留結果與雜湊；接續：跳過 5・完成 15：避免重複產出；更動：只改 1 份來源：只重做那 1 份；失敗：記錄後停止：不自動重試模型</desc>
<rect width="1600" height="900" fill="#f3f5ee"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#173445" font-weight="800">核對輸入與成品，再使用檢查點</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#2b6577" font-weight="800">第一次</text><text x="120" y="311" font-size="54" fill="#173445" font-weight="500">完成 5 份後停止</text><text x="120" y="379" font-size="54" fill="#173445" font-weight="500">保留結果與雜湊</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#2b6577" font-weight="800">接續</text><text x="855" y="311" font-size="54" fill="#173445" font-weight="500">跳過 5・完成 15</text><text x="855" y="379" font-size="54" fill="#173445" font-weight="500">避免重複產出</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#2b6577" font-weight="800">更動</text><text x="120" y="601" font-size="54" fill="#173445" font-weight="500">只改 1 份來源</text><text x="120" y="669" font-size="54" fill="#173445" font-weight="500">只重做那 1 份</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#2b6577" font-weight="800">失敗</text><text x="855" y="601" font-size="54" fill="#173445" font-weight="500">記錄後停止</text><text x="855" y="669" font-size="54" fill="#173445" font-weight="500">不自動重試模型</text><text x="85" y="818" font-size="47" fill="#476574" font-weight="500">固定資料實測；真實模型用量待驗</text></g></svg>