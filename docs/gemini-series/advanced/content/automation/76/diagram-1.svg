<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">非零退出，不一定代表阻擋</title><desc id="desc">JSON 決策：allow 或 deny：核對 BeforeTool；退出碼 2：阻擋這次操作：錯誤原因要可讀；退出碼 1：可能繼續執行：不是通用阻擋碼；逾時：不等於已阻擋：仍須核對實際決策</desc>
