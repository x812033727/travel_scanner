<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動預算計算工具</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #d1d5db;
      --focus-ring: #93c5fd;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --error-text: #b91c1c;
      --result-bg: #f8fafc;
      --result-border: #e2e8f0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .calc-container {
      width: 100%;
      max-width: 360px;
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      padding: 20px 16px;
    }

    .calc-header {
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .calc-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .calc-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-main);
    }

    .input-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .input-error {
      border-color: var(--error-text) !important;
      background-color: #fffafa !important;
    }

    .field-error-msg {
      font-size: 0.75rem;
      color: var(--error-text);
      margin-top: 4px;
      display: none;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      height: 42px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e5e7eb;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #d1d5db;
    }

    .error-summary {
      display: none;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 14px;
      font-size: 0.825rem;
      color: var(--error-text);
      line-height: 1.4;
    }

    .results-card {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background-color: var(--result-bg);
      border: 1px solid var(--result-border);
      border-radius: var(--radius);
    }

    .results-card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
      border-bottom: 1px dashed var(--border);
      padding-bottom: 6px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.875rem;
    }

    .result-row.highlight {
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .result-label {
      color: var(--text-muted);
    }

    .result-row.highlight .result-label {
      color: var(--text-main);
    }

    .result-value {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
      color: var(--text-main);
    }

    .result-row.highlight .result-value {
      color: var(--primary);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main class="calc-container">
    <header class="calc-header">
      <h1>活動預算計算工具</h1>
      <p>單欄即時預算試算與分攤評估</p>
    </header>

    <form id="budgetForm" novalidate>
      <div class="form-group">
        <label for="headcount">1. 人數（整數）</label>
        <span class="input-hint">範圍：1 至 10,000 整數</span>
        <input type="text" id="headcount" name="headcount" inputmode="numeric" placeholder="例如：20" autocomplete="off">
        <div id="headcount-err" class="field-error-msg"></div>
      </div>

      <div class="form-group">
        <label for="unitPrice">2. 每人單價（元）</label>
        <span class="input-hint">範圍：0 至 10,000,000，最多 2 位小數</span>
        <input type="text" id="unitPrice" name="unitPrice" inputmode="decimal" placeholder="例如：350" autocomplete="off">
        <div id="unitPrice-err" class="field-error-msg"></div>
      </div>

      <div class="form-group">
        <label for="venueFee">3. 場地費（元）</label>
        <span class="input-hint">範圍：0 至 10,000,000，最多 2 位小數</span>
        <input type="text" id="venueFee" name="venueFee" inputmode="decimal" placeholder="例如：2000" autocomplete="off">
        <div id="venueFee-err" class="field-error-msg"></div>
      </div>

      <div class="form-group">
        <label for="contingencyRate">4. 備用金比率（%）</label>
        <span class="input-hint">範圍：0 至 100，最多 2 位小數</span>
        <input type="text" id="contingencyRate" name="contingencyRate" inputmode="decimal" placeholder="例如：10" autocomplete="off">
        <div id="contingencyRate-err" class="field-error-msg"></div>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-primary" id="btnCalculate">計算預算</button>
        <button type="button" class="btn-secondary" id="btnReset">重設清空</button>
      </div>
    </form>

    <div id="errorSummary" class="error-summary" role="alert"></div>

    <section id="resultSection" class="results-card" aria-live="polite">
      <h2>試算結果摘要</h2>
      <div class="result-row">
        <span class="result-label">基本費用：</span>
        <span class="result-value" id="resBase">0.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">備用金：</span>
        <span class="result-value" id="resContingency">0.00</span>
      </div>
      <div class="result-row highlight">
        <span class="result-label">預算總額：</span>
        <span class="result-value" id="resTotal">0.00</span>
      </div>
      <div class="result-row highlight">
        <span class="result-label">平均每人：</span>
        <span class="result-value" id="resAverage">0.00</span>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById('budgetForm');
      const inputHeadcount = document.getElementById('headcount');
      const inputUnitPrice = document.getElementById('unitPrice');
      const inputVenueFee = document.getElementById('venueFee');
      const inputContingencyRate = document.getElementById('contingencyRate');
      const btnReset = document.getElementById('btnReset');
      const errorSummary = document.getElementById('errorSummary');
      const resultSection = document.getElementById('resultSection');

      const resBase = document.getElementById('resBase');
      const resContingency = document.getElementById('resContingency');
      const resTotal = document.getElementById('resTotal');
      const resAverage = document.getElementById('resAverage');

      const inputs = [
        { el: inputHeadcount, errId: 'headcount-err', name: '人數' },
        { el: inputUnitPrice, errId: 'unitPrice-err', name: '每人單價' },
        { el: inputVenueFee, errId: 'venueFee-err', name: '場地費' },
        { el: inputContingencyRate, errId: 'contingencyRate-err', name: '備用金百分比' }
      ];

      function clearResults() {
        resultSection.style.display = 'none';
        resBase.textContent = '0.00';
        resCont
