<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">資料變更後，重跑相同問題</title><desc id="desc">資料：手冊有版本：章節編號可追查；回答：已知附依據：未知轉人工；更新：兩日 → 三日：只改回覆目標；回歸：十二題再測一次：版本標籤也核對</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">資料變更後，重跑相同問題</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#316553" font-weight="800">資料</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">手冊有版本</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">章節編號可追查</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#316553" font-weight="800">回答</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">已知附依據</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">未知轉人工</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#316553" font-weight="800">更新</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">兩日 → 三日</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">只改回覆目標</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#316553" font-weight="800">回歸</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">十二題再測一次</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">版本標籤也核對</text><text x="85" y="818" font-size="47" fill="#4c685c" font-weight="500">題庫與版本已查；Gems 回答待驗</text></g></svg>