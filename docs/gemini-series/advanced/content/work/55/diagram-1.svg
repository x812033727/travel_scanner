<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">照片、Live 與人工觀察分開</title><desc id="desc">原圖：保留來源與日期：位置可回頭核對；鏡頭：Android 與 iOS：各自操作與紀錄；未知：遮擋與模糊：指出需要補拍處；交接：原圖 ＋ 修正表：電腦再次核對</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">照片、Live 與人工觀察分開</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#316553" font-weight="800">原圖</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">保留來源與日期</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">位置可回頭核對</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#316553" font-weight="800">鏡頭</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">Android 與 iOS</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">各自操作與紀錄</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#316553" font-weight="800">未知</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">遮擋與模糊</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">指出需要補拍處</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#316553" font-weight="800">交接</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">原圖 ＋ 修正表</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">電腦再次核對</text><text x="85" y="818" font-size="47" fill="#4c685c" font-weight="500">照片與授權已查；手機實機待驗</text></g></svg>