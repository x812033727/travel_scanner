<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">同一份規格，分清來源與產出</title><desc id="desc">清單：六個固定 ID：S01 保存兩版；更新：24 人 → 30 人：只採有效規格；觀察：Drive 與上傳：兩種方式分開測；交付：來源 ＋ 舊產出：逐份查是否重做</desc>
<rect width="1600" height="900" fill="#eef3f8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">同一份規格，分清來源與產出</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">清單</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">六個固定 ID</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">S01 保存兩版</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">更新</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">24 人 → 30 人</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">只採有效規格</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">觀察</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">Drive 與上傳</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">兩種方式分開測</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">交付</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">來源 ＋ 舊產出</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">逐份查是否重做</text><text x="85" y="818" font-size="47" fill="#475f7d" font-weight="500">手動同步與引用已驗；保留舊產出</text></g></svg>