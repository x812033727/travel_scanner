<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">先找原文，再判斷是否支持</title><desc id="desc">支持：明確取代舊值：名額修訂為 30；未決：日期只是提案：不能當成定案；未知：沒有餐點資料：引用可保留空白；修正：保存原始回答：主張與引文同查</desc>
<rect width="1600" height="900" fill="#eef3f8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">先找原文，再判斷是否支持</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">支持</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">明確取代舊值</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">名額修訂為 30</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">未決</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">日期只是提案</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">不能當成定案</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">未知</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">沒有餐點資料</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">引用可保留空白</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">修正</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">保存原始回答</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">主張與引文同查</text><text x="85" y="818" font-size="47" fill="#475f7d" font-weight="500">五列引用已核；未知仍留空白</text></g></svg>