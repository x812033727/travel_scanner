<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">十項事實，三種格式各自查</title><desc id="desc">來源：固定 F01 到 F10：只用本篇教材；產出：講義・語音・影片：保存實際生成檔；核對：十項 × 三格式：時間與句子對照；修正：條件不可省略：重做後再次檢查</desc>
<rect width="1600" height="900" fill="#eef3f8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">十項事實，三種格式各自查</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">來源</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">固定 F01 到 F10</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">只用本篇教材</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">產出</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">講義・語音・影片</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">保存實際生成檔</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">核對</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">十項 × 三格式</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">時間與句子對照</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">修正</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">條件不可省略</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">重做後再次檢查</text><text x="85" y="818" font-size="47" fill="#475f7d" font-weight="500">作者教材已備；語音影片尚未生成</text></g></svg>