<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">一次快照能回答哪些問題？</title><desc id="desc">範圍：官方歷史快照：不是全年使用量；計算：1800 個站點 ID：十三種地區標籤；查核：校區不是行政區：欄位對應待確認；更新：至少三項待查：新舊版本分開存</desc>
<rect width="1600" height="900" fill="#eef3f8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">一次快照能回答哪些問題？</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">範圍</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">官方歷史快照</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">不是全年使用量</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">計算</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">1800 個站點 ID</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">十三種地區標籤</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">查核</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">校區不是行政區</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">欄位對應待確認</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">更新</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">至少三項待查</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">新舊版本分開存</text><text x="85" y="818" font-size="47" fill="#475f7d" font-weight="500">公開資料已重算；模型研究待驗</text></g></svg>