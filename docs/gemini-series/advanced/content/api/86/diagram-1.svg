<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">從本機介面一路查到來源原文</title><desc id="desc">啟動：預設作者模式：金鑰留在伺服器；回答：查詢與引用一起：缺證據就明示；評測：固定二十題：來源存在仍需閱讀；交接：版本與限制明列：停止服務另清索引</desc><rect width="1600" height="900" fill="#edf3f6"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="61" fill="#263b38" font-weight="800">從本機介面一路查到來源原文</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">啟動</text><text x="120" y="311" font-size="52" fill="#263b38" font-weight="500">預設作者模式</text><text x="120" y="379" font-size="52" fill="#263b38" font-weight="500">金鑰留在伺服器</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">回答</text><text x="855" y="311" font-size="52" fill="#263b38" font-weight="500">查詢與引用一起</text><text x="855" y="379" font-size="52" fill="#263b38" font-weight="500">缺證據就明示</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">評測</text><text x="120" y="601" font-size="52" fill="#263b38" font-weight="500">固定二十題</text><text x="120" y="669" font-size="52" fill="#263b38" font-weight="500">來源存在仍需閱讀</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">交接</text><text x="855" y="601" font-size="52" fill="#263b38" font-weight="500">版本與限制明列</text><text x="855" y="669" font-size="52" fill="#263b38" font-weight="500">停止服務另清索引</text><text x="85" y="818" font-size="47" fill="#365477" font-weight="500">本機服務已測；真實問答待驗</text></g></svg>