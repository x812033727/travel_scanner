<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">S3 收尾｜靜態分鏡參考</title><desc id="desc">原創虛構青禾杯設計及教學比較素材。</desc><rect width="1600" height="900" fill="#f7f3e9"/><g font-family="Microsoft JhengHei, sans-serif"><text x="85" y="115" font-size="58" fill="#34403c">S3 收尾｜靜態分鏡參考</text><g transform="translate(1030 290)"><ellipse cx="150" cy="325" rx="225" ry="27" fill="#d3dcd5"/><path d="M275 65 H320 C420 65 420 250 305 250 H280" fill="none" stroke="#46786e" stroke-width="34"/><path d="M0 20 H300 L275 290 Q270 320 240 320 H60 Q30 320 25 290Z" fill="#71aaa0"/><ellipse cx="150" cy="20" rx="150" ry="28" fill="#a9d0c8"/><ellipse cx="150" cy="20" rx="128" ry="16" fill="#3f7067"/><path d="M30 280 H270 L267 300 Q265 315 242 315 H58 Q35 315 33 300Z" fill="#d97b4e"/><circle cx="150" cy="166" r="29" fill="#eaa86f"/></g><text x="100" y="720" font-size="35" fill="#34403c">鏡頭停止，杯子在右側，左側留空白給後製字卡</text><text x="85" y="825" font-size="32" fill="#34403c">作者分鏡圖；不是影片、擷取影格或模型輸出</text></g></svg>
