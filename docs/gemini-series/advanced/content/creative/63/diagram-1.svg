<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">同一原創商品，三種使用情境</title><desc id="desc">固定：外形・色彩・把手：一個杯子一個圓點；改變：商品・桌面・橫幅：每次只換一種用途；評分：五項各零至二分：每次扣分附原因；保留：原圖與失敗輸出：不把漂亮當合格</desc>
<rect width="1600" height="900" fill="#fbf1e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">同一原創商品，三種使用情境</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#875b3e" font-weight="800">固定</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">外形・色彩・把手</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">一個杯子一個圓點</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#875b3e" font-weight="800">改變</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">商品・桌面・橫幅</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">每次只換一種用途</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#875b3e" font-weight="800">評分</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">五項各零至二分</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">每次扣分附原因</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#875b3e" font-weight="800">保留</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">原圖與失敗輸出</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">不把漂亮當合格</text><text x="85" y="818" font-size="47" fill="#775b45" font-weight="500">參考圖已備；真實模型輸出待驗</text></g></svg>