# Connection reuse between nginx and the Next.js server.
#
# Include this INSIDE `upstream mokaair_web`, after the server line. Anywhere else it is wrong:
# `keepalive` is refused outside an upstream block, and `keepalive_timeout` at http or server
# level is accepted without complaint but sets how long *browsers* may keep their connection.

keepalive 32;

# The idle timeout is the line that matters. nginx's default keeps an idle upstream connection
# for 60s, while Node closes one after about 5s unless told otherwise (the standalone server.js
# only changes that when KEEP_ALIVE_TIMEOUT is set). When nginx takes a connection from the pool
# just as Node closes it, the request is lost on the way: nginx retries a GET on another
# connection without anyone noticing, but it never resends a POST, PATCH or LOCK it has already
# sent, so the browser gets a 502 and error.log says "upstream prematurely closed connection".
#
# The rule is that nginx gives up on an idle connection first. 4s is below Node's default, which
# covers the ordinary case by itself. It is not airtight alone: Node starts its clock when it has
# handed the last byte to the kernel, and on an unbuffered /api/ response to a slow client nginx
# can finish reading seconds later. So docker-compose.prod.yml also raises the server's timeout
# to 65s. Keep both, and keep this value the smaller.
keepalive_timeout 4s;
