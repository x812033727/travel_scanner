# Syntax check harness. Not installed on any host.
#
# CI runs `nginx -t -c` against this file so the snippets cannot drift into something nginx
# would refuse to load. It supplies the http{} wrapper and a server block of its own, because
# the real site config carries host-specific certificate paths that do not exist in a
# container -- and because `nginx -t` reads certificates, not just parses them.
#
# What this proves: the directives exist, are spelled correctly, are legal in the context they
# appear in, and the zones the site config references are actually declared. What it does not
# prove: that the site config as a whole is right. Rehearse that on staging.
# tools/test-guide-image-rate-limit.py also runs it against a local upstream and checks what
# the locations below actually answer, so they mirror the site config's on purpose.

events {}

http {
    # Before the rate-limit file: its key maps read $mokaair_verified_crawler, and an
    # undefined variable is a config error, not an empty string.
    include /etc/nginx/ops/05-crawler-ranges.conf;
    include /etc/nginx/ops/10-rate-limit.conf;

    upstream mokaair_web_ci {
        server 127.0.0.1:8091;
        include /etc/nginx/ops/upstream-keepalive.conf;
    }

    server {
        listen 8080;
        server_name ci.invalid;
        server_tokens off;

        # Proves the crawl-control map is declared and the directive that reads it parses.
        # /dev/stdout rather than the site's /var/log/nginx/mokaair-crawl.log: this file is
        # also run by tools/test-guide-image-rate-limit.py out of a temporary directory, and
        # nothing here should depend on a log directory existing or being writable.
        access_log /dev/stdout combined if=$mokaair_is_crawl_control;

        location /_next/static/ {
            include /etc/nginx/ops/proxy-headers.conf;
            proxy_pass http://mokaair_web_ci;
        }

        # Crawl control, as in the site config: out of the page budget, into the crawl-file
        # one, and a verified crawler counted in mokaair_crawlers instead.
        location = /robots.txt {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        # Google reports a refused fetch of this one as the site having no ads.txt at all.
        location = /ads.txt {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        location = /sitemap.xml {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        location = /llms.txt {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        location ^~ /sitemaps/ {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        # The one /.well-known/ file with a location; every other path under it is a page.
        location = /.well-known/apple-developer-domain-association.txt {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_crawl_files burst=30 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            proxy_pass http://mokaair_web_ci;
        }

        location /api/ {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_api burst=20 nodelay;
            proxy_pass http://mokaair_web_ci;
            proxy_buffering off;
        }

        location / {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_content_pages burst=20 nodelay;
            limit_req zone=mokaair_crawlers burst=60 nodelay;
            limit_conn mokaair_conns 20;
            proxy_pass http://mokaair_web_ci;
        }
    }

    # The TLS policy snippet. There is no certificate in a container, and a server that only
    # names ssl directives without one never builds a TLS context, so nginx -t would accept a
    # cipher string OpenSSL rejects. ssl_reject_handshake builds the context without a
    # certificate: the protocols and ciphers are handed to OpenSSL and checked, and the server
    # refuses every handshake, which is all a harness needs from it.
    server {
        listen 8443 ssl;
        server_name tls.ci.invalid;
        ssl_reject_handshake on;
        include /etc/nginx/ops/tls-policy.conf;
        server_tokens off;
        return 444;
    }
}
