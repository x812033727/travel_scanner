# Syntax check harness. Not installed on any host.
#
# CI runs `nginx -t -c` against this file so the snippets cannot drift into something nginx
# would refuse to load. It supplies the http{} wrapper and a server block of its own, because
# the real site config carries host-specific certificate paths that do not exist in a
# container -- and because `nginx -t` reads certificates, not just parses them.
#
# What this proves: the directives exist, are spelled correctly, are legal in the context they
# appear in, and the zones the site config references are actually declared. What it does not
# prove: that the site config as a whole is right. Rehearse that on staging.

events {}

http {
    include /etc/nginx/ops/10-rate-limit.conf;

    upstream mokaair_web_ci {
        server 127.0.0.1:8091;
    }

    server {
        listen 8080;
        server_name ci.invalid;

        location /_next/static/ {
            include /etc/nginx/ops/proxy-headers.conf;
            proxy_pass http://mokaair_web_ci;
        }

        location /api/ {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_api burst=20 nodelay;
            proxy_pass http://mokaair_web_ci;
            proxy_buffering off;
        }

        location / {
            include /etc/nginx/ops/proxy-headers.conf;
            limit_req zone=mokaair_pages burst=20 nodelay;
            limit_conn mokaair_conns 20;
            proxy_pass http://mokaair_web_ci;
        }
    }
}
