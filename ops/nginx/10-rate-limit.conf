# Per-source request and connection budgets for mokaair.
#
# Goes in the http{} context (conf.d/), because limit_req_zone and limit_conn_zone cannot
# appear inside a server block. The zones are declared here; where they are *applied*, and
# where they deliberately are not, is in sites-available/mokaair.conf.
#
# $binary_remote_addr is the visitor only while nginx is the internet-facing hop. Behind a
# CDN it is the CDN's egress address and every visitor shares a handful of buckets, which is
# worse than no limit at all -- see the realip block in the site config before adding one.

# Match only the local image contract in apps/web/lib/content-blocks.ts. Empty keys are
# not counted by limit_req: covers and inline images must not share the SSR page budget.
# $uri excludes query parameters, including bounded image retry parameters. Localized
# article/list routes and arbitrary /guides/ paths still use the ordinary page budget.
map $uri $mokaair_page_key_by_uri {
    default $binary_remote_addr;
    ~^/guides/[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*\.(?:webp|jpg|png|svg)$ "";
}

# A verified search engine leaves the page budget entirely and is counted in its own, larger
# zone below. Two maps rather than one condition because a map takes a single source
# variable; the pair is what lets the key depend on both the path and the caller.
#
# 2026-09-19: this host's own logs showed 20 Googlebot requests answered with 429, plus
# Bingbot. A 429 is not a neutral "slow down" to a crawler -- it is what a site in distress
# sends, and Google answers it by crawling less. On a site whose problem is that most of its
# pages are not indexed, that is the wrong direction.
#
# Keyed on the published address ranges (conf.d/05-mokaair-crawler-ranges.conf), never on the
# User-Agent: a User-Agent is a claim anyone can make, and "curl -A Googlebot" would buy an
# attacker exactly the thing this file exists to deny.
map $mokaair_verified_crawler $mokaair_page_limit_key {
    default $mokaair_page_key_by_uri;
    1       "";
}
map $mokaair_verified_crawler $mokaair_crawler_key {
    default "";
    1       $binary_remote_addr;
}

# Pages are the expensive half: each one is a server render that fans out to the API.
# A new zone allows graceful reload: nginx cannot change an existing shared zone's key.
limit_req_zone  $mokaair_page_limit_key zone=mokaair_content_pages:10m rate=5r/s;
# Verified crawlers. Still a limit, not an exemption: if a published range is ever wrong or
# stale the cost is "it crawls faster", not "anyone can scrape the site without a budget".
limit_req_zone  $mokaair_crawler_key   zone=mokaair_crawlers:10m      rate=30r/s;
# Retain the old zone for host configs not yet migrated to mokaair_content_pages.
limit_req_zone  $binary_remote_addr zone=mokaair_pages:10m rate=5r/s;
# The BFF is called several times per page by the client after hydration, so it gets more.
limit_req_zone  $binary_remote_addr zone=mokaair_api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mokaair_conns:10m;

# 429 rather than nginx's default 503: the application answers its own rate limit with 429,
# and a client that gets two different statuses for the same condition cannot handle either.
limit_req_status  429;
limit_conn_status 429;
# warn, not error: being limited is a normal event here, and burying it among real errors is
# how you fail to notice that it is Googlebot getting limited.
#
# This names a level, not a destination. The stock Debian/Ubuntu nginx.conf logs at error, so
# on its own this line drops every limiting event (2026-09-12: 128 refusals, error.log never
# written). The destination lives in the site's main server block, next to the error.log line
# it must keep -- see mokaair.conf.example and the README. It is deliberately not set here: an
# error_log in the http context redirects every server on the host, and this file is also
# loaded off-host by ci-validate.conf and tools/test-guide-image-rate-limit.py, where
# /var/log/nginx need not exist.
limit_req_log_level warn;

# Who got refused, in one file, with the User-Agent the limit log does not carry. Before this,
# answering "is it Googlebot?" meant joining mokaair-limit.log to access.log by address and
# timestamp; it is now one grep.
log_format mokaair_limited '$time_iso8601 $status $remote_addr "$request" "$http_user_agent"';
map $status $mokaair_is_limited {
    default 0;
    429     1;
}

# The crawl-control files, for logging only -- the exemptions themselves are locations in the
# site config. A server-level access_log replaces the inherited one instead of adding to it,
# so the line above is the whole of this server's access logging: since 2026-09-19 a request
# that is not refused leaves no trace at all. That is survivable for pages and fatal for these
# five paths, because the questions asked about them are all of the form "did Google come, and
# what did it get" -- and on 2026-09-22, with AdSense reporting /ads.txt as not found and
# every check from outside saying it was fine, there was no answer on this side to give.
# Paired with a second access_log in the site's server block, so 429s keep reaching
# mokaair-limited.log exactly as before.
#
# $uri, not $request_uri: the query string is nothing to do with which file was asked for,
# and it is normalised, so /ads.txt%2e does not slip past as something else.
map $uri $mokaair_is_crawl_control {
    default        0;
    /ads.txt       1;
    /robots.txt    1;
    /sitemap.xml   1;
    /llms.txt      1;
    ~^/sitemaps/   1;
}
