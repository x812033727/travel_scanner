# Per-source request and connection budgets for mokaair.
#
# Goes in the http{} context (conf.d/), because limit_req_zone and limit_conn_zone cannot
# appear inside a server block. The zones are declared here; where they are *applied*, and
# where they deliberately are not, is in sites-available/mokaair.conf.
#
# $binary_remote_addr is the visitor only while nginx is the internet-facing hop. Behind a
# CDN it is the CDN's egress address and every visitor shares a handful of buckets, which is
# worse than no limit at all -- see the realip block in the site config before adding one.

# Match only the local image contract in apps/web/lib/content-blocks.ts. Empty keys are
# not counted by limit_req: covers and inline images must not share the SSR page budget.
# $uri excludes query parameters, including bounded image retry parameters. Localized
# article/list routes and arbitrary /guides/ paths still use the ordinary page budget.
map $uri $mokaair_page_limit_key {
    default $binary_remote_addr;
    ~^/guides/[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*\.(?:webp|jpg|png|svg)$ "";
}

# Pages are the expensive half: each one is a server render that fans out to the API.
# A new zone allows graceful reload: nginx cannot change an existing shared zone's key.
limit_req_zone  $mokaair_page_limit_key zone=mokaair_content_pages:10m rate=5r/s;
# Retain the old zone for host configs not yet migrated to mokaair_content_pages.
limit_req_zone  $binary_remote_addr zone=mokaair_pages:10m rate=5r/s;
# The BFF is called several times per page by the client after hydration, so it gets more.
limit_req_zone  $binary_remote_addr zone=mokaair_api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mokaair_conns:10m;

# 429 rather than nginx's default 503: the application answers its own rate limit with 429,
# and a client that gets two different statuses for the same condition cannot handle either.
limit_req_status  429;
limit_conn_status 429;
# warn, not error: being limited is a normal event here, and burying it among real errors is
# how you fail to notice that it is Googlebot getting limited.
limit_req_log_level warn;
