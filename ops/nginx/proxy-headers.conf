# Header hygiene for every proxied location.
#
# Include this in EVERY location that proxies, not once in the server block. nginx inherits
# proxy_set_header from an outer level only when the current level defines none at all, so a
# location that sets a single header of its own silently drops every one of these. That is
# the failure this file exists to make impossible; add_header behaves the same way.

# Whatever the caller sent is discarded and replaced below. An empty value means "do not send
# this header", so this line is what stops an outside caller choosing its own rate-limit
# bucket. The BFF builds its upstream headers from scratch and so cannot leak one, but that is
# the BFF's property, not the proxy's, and it does not hold for anything else behind here.
proxy_set_header X-Travel-Client-IP "";
# Replace rather than append. $proxy_add_x_forwarded_for would also put our own $remote_addr
# rightmost -- which is the entry the application reads (apps/web/lib/client-address.ts) --
# but it keeps everything the caller invented to the left of it. Nothing here consumes the
# chain, so there is no reason to carry it.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host              $host;

# 1.1 so keepalive to the upstream works and so streamed responses are not buffered into a
# Content-Length. There are no websockets here; the one streaming endpoint is server-sent
# events, which is ordinary HTTP and needs proxy_buffering off instead (see the site config).
proxy_http_version 1.1;
# Required for the upstream keepalive pool to be used at all: without it nginx sends
# "Connection: close" and opens a fresh socket per request.
proxy_set_header Connection "";
