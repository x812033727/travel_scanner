# TLS protocols and ciphers for every server block that terminates TLS for this site.
#
# Installed by install.sh as snippets/mokaair-tls-policy.conf and included by each
# `listen 443 ssl` server in mokaair.conf.example. Until this file existed the policy lived only
# inline in the host's site file, so nothing in the repository could show that TLS 1.0 and 1.1
# were off.
#
# These values are Mozilla's "intermediate" profile (server-side TLS guidelines 6.0,
# https://ssl-config.mozilla.org/), NOT a record of what the host runs: the host's inline values
# were never written down here. Before the include replaces them, compare:
#   nginx -T 2>/dev/null | grep -nE 'ssl_(protocols|ciphers|prefer_server_ciphers)'
# and write any difference you decide to keep into this file, not back into the site file.
#
# - No TLS 1.3 suites line: ssl_ciphers governs TLS 1.2 only, and OpenSSL's default 1.3 set is
#   exactly the three suites the profile names.
# - Curves are left to the library's default instead of pinned. The profile puts X25519MLKEM768
#   first, which an OpenSSL older than 3.5 does not know -- nginx -t would refuse the whole
#   configuration on such a host -- and pinning a list without it would switch the hybrid
#   post-quantum exchange off wherever the library does offer it.
# - ssl_prefer_server_ciphers off: every cipher left in the list is strong, so the client's own
#   order (it knows whether it has AES hardware) is the better choice.
#
# Include it in every server that listens with ssl, the default_server above all: a handshake
# that arrives without a server name is negotiated with the default server's settings. Remove the
# host's own ssl_protocols / ssl_ciphers / ssl_prefer_server_ciphers lines from each block that
# gets the include (certbot's options-ssl-nginx.conf include sets the same three, plus session
# cache lines worth keeping inline). Do not count on nginx -t to catch a leftover; the TLS check
# in ops/nginx/README.md is what shows which protocols actually answer. A value set in nginx.conf's
# http{} context is overridden by these, not the other way round.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
