<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 字卡範本：1920x1080。複製到 <WORKDIR>/slides/NN-名稱.html，只改 body 裡的字。
     色票與字型改 :root，全片一致。版型三選一：.statement（一句話）、.list（三點）、.compare（表格）。 -->
<style>
  :root {
    --bg: #0f1419;
    --fg: #f5f7fa;
    --muted: #9aa5b1;
    --accent: #ffb020;
    --panel: #1c242e;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--bg); color: var(--fg); font-family: var(--font); }
  /* 5% 安全區；下緣多留 15% 給字幕 */
  .frame { position: absolute; inset: 54px 96px 162px 96px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 40px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 24px; }
  h1 { font-size: 104px; line-height: 1.2; margin: 0; font-weight: 800; }
  h1 em { font-style: normal; color: var(--accent); }
  .list { list-style: none; padding: 0; margin: 48px 0 0; }
  .list li { font-size: 60px; line-height: 1.35; margin: 28px 0; padding-left: 88px; position: relative; }
  .list li::before { content: counter(item); counter-increment: item; position: absolute; left: 0; top: 4px; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .list { counter-reset: item; }
  table { border-collapse: collapse; margin-top: 48px; font-size: 48px; width: 100%; }
  th, td { padding: 24px 32px; text-align: left; border-bottom: 2px solid var(--panel); }
  th { color: var(--muted); font-weight: 600; }
  td.win { color: var(--accent); font-weight: 700; }
  .mark { outline: 8px solid var(--accent); border-radius: 12px; }
  .source { position: absolute; right: 96px; bottom: 170px; font-size: 28px; color: var(--muted); }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker">怎麼挑 AI 模型</div>
    <h1>排行榜第一名<br><em>≠</em> 最適合你</h1>
    <!--
    <ul class="list">
      <li>你要它做什麼？</li>
      <li>你能等多久？</li>
      <li>你願意付多少？</li>
    </ul>
    <table>
      <tr><th></th><th>模型 A</th><th>模型 B</th></tr>
      <tr><td>速度</td><td class="win">快</td><td>中</td></tr>
    </table>
    -->
  </div>
  <div class="source">來源：官方模型總覽，2026-09</div>
</body>
</html>
