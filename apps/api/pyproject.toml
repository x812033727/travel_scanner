[project]
name = "travel-scanner-api"
version = "0.1.0"
description = "Travel Scanner modular monolith API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "email-validator>=2.3,<3",
  "orjson>=3.11,<4",
  "ortools>=9.14,<10",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "redis>=6.4,<7",
  "rq>=2.6,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "fakeredis>=2.31,<3",
  "mypy>=1.17,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
