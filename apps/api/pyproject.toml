[project]
name = "travel-scanner-api"
version = "0.1.0"
description = "Mokaair modular monolith API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.43,<2",
  "pillow>=12.3,<13",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "email-validator>=2.3,<3",
  "orjson>=3.11,<4",
  "ortools>=9.14,<10",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "redis>=6.4,<7",
  "rq>=2.6,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
  "unidecode>=1.4,<2",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22,<1",
  "boto3-stubs[s3]>=1.43,<2",
  "fakeredis>=2.31,<3",
  "mypy>=2.3,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# `S` is flake8-bandit. It is here because the 2026-09 audit found two things by hand that
# this finds mechanically — unescaped LIKE wildcards and a missing request body limit — and
# reading code is the expensive way to find the cheap class of problem, especially in a
# repository several different agents write to.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# One rule off, not a category. S101 flags `assert`, on the grounds that `python -O`
# compiles it out. Nothing here runs with `-O` — the image starts `uvicorn app.main:app` —
# and all 29 uses in `app/` narrow a type for strict mypy (`assert x is not None`,
# `assert isinstance(...)`) rather than enforcing anything a caller could violate. In
# `tests/` an assert is the point, and there are ten thousand of them. Leaving it on would
# bury the other S rules, which are the ones worth reading. If this service ever starts
# running with `-O`, turn S101 back on before anything else.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"deployment_agent/*.py" = [
    "E501",
    # A fixed command set run with `shell=False` and no interpolation of anything a request
    # can reach — see `CommandRunner.run`. This is the one process on the host allowed to
    # run docker, so the design is deliberate and documented in docs/security-audit-2026-09.md.
    "S603",
    # Two `urlopen` calls: the GitHub CI status API on a built Request, and the health probe
    # on a URL from the agent's own config file. Neither takes a URL from a request.
    "S310",
    # The cleanup in the deployment failure path. A failure there must not replace the
    # original deployment error with its own.
    "S110",
]
# Migrations build DDL and repair statements by interpolating module-level constants: table
# names, a UUID regex, a tuple of valid statuses. Nothing a request can reach runs through
# alembic, so the injection class this rule names does not exist here.
"migrations/versions/*.py" = ["S608"]
# Fake prices and jittered poll intervals. Neither is a secret, a token or a decision an
# attacker benefits from predicting.
"app/providers/mock.py" = ["S311"]
"app/hotspots/wikimedia.py" = ["S311"]
# One documented feed on a hardcoded official URL, parsed only after `_declares_dtd` rejects
# a body carrying `<!DOCTYPE` or `<!ENTITY` in any XML encoding, and after a 15 MB cap. The
# rule objects to `ElementTree` itself rather than to that guard, and the alternative is
# promoting `defusedxml` from a transitive dev dependency to a runtime one for a single feed
# — weighed and declined in tasks/done/2026-09-14-airalo-feed-utf16-doctype.md. Revisit this
# entry if a second XML source ever arrives.
"app/travel_services/jobs.py" = ["S314"]
# The content-pack CLI (`python -m app.guides.pack_cli`). Nothing here is reachable from an
# HTTP request: a person or a writing agent runs it over a workspace directory in this
# repository. Each rule, in the order they fire:
"app/guides/pack_ingest.py" = [
    # `_parse_svg` reads a diagram from that workspace, and `check_svg` exists to refuse the
    # dangerous shapes (external `url()`, `<script>`) rather than to trust them.
    "S314",
    # `UrllibTransport` exists because Wikimedia's edge refuses httpx's own connections, and
    # it now refuses any scheme but http and https — on the first URL and on every redirect
    # hop, since it hands 3xx back to httpx instead of letting urllib follow them. The rule
    # objects to `urlopen` at all, which is the part that cannot change: the whole point of
    # the transport is that httpx's own connections are blocked.
    "S310",
    # `render_svg` runs headless Chromium with a fixed argument list and `shell=False`; the
    # only variable parts are the resolved binary path and a temporary file this module wrote.
    "S603",
]
# Test fixtures. The hardcoded passwords are the fixtures; the deployment agent cases need
# real paths under /tmp because they bind a unix socket a second process has to find; one
# case runs a repository script through `sys.executable` with literal arguments; and one
# builds a DELETE from the migration's own table constant.
"tests/*.py" = ["S105", "S106", "S108", "S603", "S608"]
"tests/support/*.py" = ["S105", "S106", "S108", "S603", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# `tests/` has no `__init__.py`, and its modules import each other as `tests.test_x`.
# Without explicit bases mypy also names those files `test_x` and stops at "source file
# found twice under different module names" before it reports a single type error.
explicit_package_bases = true

# `tests/` is checked with the error codes that catch a test left behind by a change in
# `app/` — `arg-type`, `call-arg`, `attr-defined`, `name-defined`, `return-value`,
# `override`, the import codes — and with `check_untyped_defs`, so the bodies of the
# unannotated test functions are read too. It is not held to app's annotation discipline:
# tests are unannotated by convention (pytest calls them), fixtures are shared by
# importing them from other test modules, JSON payloads are bare dicts. The codes turned
# off below describe a test's own literal data far more often than a call into `app/`.
# Measured on 2026-09-19 (tasks/done/2026-09-14-mypy-does-not-check-tests.md): strict
# reported 2245 errors in 140 files, 1522 of them missing annotations or bare generics;
# this override kept the 511 that named a call into app/ (269 arg-type, 178 attr-defined,
# 61 call-arg), and that task fixed them in the tests.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
implicit_reexport = true
check_untyped_defs = true
disable_error_code = [
    "index",
    "union-attr",
    "operator",
    "assignment",
    "list-item",
    "dict-item",
    "var-annotated",
    "misc",
    "comparison-overlap",
    "type-var",
    "func-returns-value",
]

# asyncpg ships neither stubs nor a py.typed marker; two migration tests import it for its
# exception classes.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
