<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Training rewrites weights, inference reads them / Training rewrites weights, inference reads them</title><desc id="desc">At the top is training: four steps—forward pass, loss, backpropagation and gradient descent—repeat, with each round writing new weights into the weights and biases in the middle. The example is a small network with two inputs, two hidden neurons and one output, totaling nine parameters. At the bottom is inference: new inputs arrive, and the forward pass only reads the fixed weights to produce outputs, without calculating loss or changing weights.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Training rewrites weights; inference only reads them</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Training rewrites the weights; inference only reads them</text><rect x="60" y="110" width="1480" height="290" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="100" y="152" font-size="22" font-weight="700" fill="#102A2B">Training: many rounds</text><text x="1500" y="152" font-size="18" text-anchor="end" fill="#5C6B6B">Weights change</text><rect x="100" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect><text x="245" y="228" font-size="28" text-anchor="middle" fill="#102A2B">Forward pass</text><text x="245" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">Predict with current weights</text><rect x="470" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect><text x="615" y="228" font-size="28" text-anchor="middle" fill="#102A2B">Loss</text><text x="615" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">Distance from the answer</text><rect x="840" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect><text x="985" y="228" font-size="28" text-anchor="middle" fill="#102A2B">Backpropagation</text><text x="985" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">Find each weight's gradient</text><rect x="1210" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect><text x="1355" y="228" font-size="28" text-anchor="middle" fill="#102A2B">Gradient descent</text><text x="1355" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">Step toward lower loss</text><path d="M 394 240 L 466 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 764 240 L 836 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 1134 240 L 1206 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 1355 304 L 1355 345 L 245 345 L 245 304" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><text x="800" y="380" font-size="18" text-anchor="middle" fill="#5C6B6B">Repeat for many rounds</text><path d="M 640 404 L 640 456" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><text x="672" y="436" font-size="18" fill="#5C6B6B">Write new weights</text><rect x="480" y="460" width="640" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"></rect><text x="800" y="507" font-size="28" text-anchor="middle" fill="#102A2B">Weights and biases (parameters)</text><text x="800" y="543" font-size="18" text-anchor="middle" fill="#5C6B6B">Example: 2 inputs, 2 hidden neurons, 1 output; 9 parameters</text><rect x="60" y="630" width="1480" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="100" y="670" font-size="22" font-weight="700" fill="#102A2B">Inference: use the trained network</text><text x="1500" y="670" font-size="18" text-anchor="end" fill="#5C6B6B">Fixed weights</text><rect x="255" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="400" y="748" font-size="28" text-anchor="middle" fill="#102A2B">New input</text><text x="400" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">Example: two switch positions</text><rect x="655" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="800" y="748" font-size="28" text-anchor="middle" fill="#102A2B">Forward pass</text><text x="800" y="786" font-size="16" text-anchor="middle" fill="#5C6B6B" style="font-size: 16px;">Compute output with fixed weights</text><rect x="1055" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="1200" y="748" font-size="28" text-anchor="middle" fill="#102A2B">Output</text><text x="1200" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">Example: light on or off</text><path d="M 549 760 L 651 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 949 760 L 1051 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 800 574 L 800 696" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><text x="820" y="612" font-size="18" fill="#5C6B6B">Inference: read only, no changes</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair graphic 2026</text></svg>
