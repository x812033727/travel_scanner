<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">訓練改寫權重，推論只讀取權重 / Training rewrites weights, inference reads them</title><desc id="desc">上方是訓練：前向計算、損失、反向傳播、梯度下降四步反覆執行，每一輪把新權重寫進中間的權重與偏差。以兩個輸入、兩個隱藏神經元、一個輸出的小網路為例，共有九個參數。下方是推論：新輸入進來，前向計算只讀取已固定的權重，產生輸出，不計算損失，也不改權重。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">訓練改寫權重，推論只讀取權重</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Training rewrites the weights; inference only reads them</text><rect x="60" y="110" width="1480" height="290" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="100" y="152" font-size="22" font-weight="700" fill="#102A2B">訓練：反覆許多輪</text><text x="1500" y="152" font-size="18" text-anchor="end" fill="#5C6B6B">權重會改變</text><rect x="100" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="228" font-size="28" text-anchor="middle" fill="#102A2B">前向計算</text><text x="245" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">用目前權重算預測</text><rect x="470" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="615" y="228" font-size="28" text-anchor="middle" fill="#102A2B">損失</text><text x="615" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">預測離答案多遠</text><rect x="840" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="985" y="228" font-size="28" text-anchor="middle" fill="#102A2B">反向傳播</text><text x="985" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">算出每個權重的梯度</text><rect x="1210" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="1355" y="228" font-size="28" text-anchor="middle" fill="#102A2B">梯度下降</text><text x="1355" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">往損失變小的方向改一步</text><path d="M 394 240 L 466 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 764 240 L 836 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1134 240 L 1206 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1355 304 L 1355 345 L 245 345 L 245 304" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><text x="800" y="380" font-size="18" text-anchor="middle" fill="#5C6B6B">重複許多輪</text><path d="M 640 404 L 640 456" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><text x="672" y="436" font-size="18" fill="#5C6B6B">寫入新權重</text><rect x="480" y="460" width="640" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="800" y="507" font-size="28" text-anchor="middle" fill="#102A2B">權重與偏差（參數）</text><text x="800" y="543" font-size="18" text-anchor="middle" fill="#5C6B6B">例：2 個輸入、2 個隱藏神經元、1 個輸出，共 9 個參數</text><rect x="60" y="630" width="1480" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="100" y="670" font-size="22" font-weight="700" fill="#102A2B">推論：使用訓練好的網路</text><text x="1500" y="670" font-size="18" text-anchor="end" fill="#5C6B6B">權重固定</text><rect x="255" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="400" y="748" font-size="28" text-anchor="middle" fill="#102A2B">新輸入</text><text x="400" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">例：兩個開關的位置</text><rect x="655" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="748" font-size="28" text-anchor="middle" fill="#102A2B">前向計算</text><text x="800" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">用固定權重算輸出</text><rect x="1055" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="1200" y="748" font-size="28" text-anchor="middle" fill="#102A2B">輸出</text><text x="1200" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">例：燈亮或燈滅</text><path d="M 549 760 L 651 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 949 760 L 1051 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 800 574 L 800 696" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><text x="820" y="612" font-size="18" fill="#5C6B6B">推論：只讀取，不改動</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
