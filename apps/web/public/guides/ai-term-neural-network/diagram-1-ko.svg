<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">학습은 가중치를 갱신하고 추론은 읽기만 한다 / 학습은 가중치를 갱신하고 추론은 읽는다</title><desc id="desc">위쪽은 학습이다. 순전파 계산, 손실, 역전파, 경사 하강법의 네 단계를 반복하며, 매 반복마다 가운데의 가중치와 편향에 새 가중치를 기록한다. 입력 둘, 은닉 뉴런 둘, 출력 하나인 작은 신경망을 예로 들면 매개변수는 모두 아홉 개다. 아래쪽은 추론이다. 새 입력이 들어오면 순전파 계산이 고정된 가중치를 읽어 출력을 생성하며, 손실을 계산하거나 가중치를 바꾸지 않는다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">학습은 가중치 갱신, 추론은 읽기만</text><text x="60" y="84" font-size="18" fill="#5C6B6B">학습은 가중치를 갱신하고 추론은 읽기만 한다</text><rect x="60" y="110" width="1480" height="290" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="100" y="152" font-size="22" font-weight="700" fill="#102A2B">학습: 여러 차례 반복</text><text x="1500" y="152" font-size="18" text-anchor="end" fill="#5C6B6B">가중치가 바뀜</text><rect x="100" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="245" y="228" font-size="28" text-anchor="middle" fill="#102A2B">순전파 계산</text><text x="245" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">현재 가중치로 예측 계산</text><rect x="470" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="615" y="228" font-size="28" text-anchor="middle" fill="#102A2B">손실</text><text x="615" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">예측과 정답 사이의 거리</text><rect x="840" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="985" y="228" font-size="28" text-anchor="middle" fill="#102A2B">역전파</text><text x="985" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">각 가중치의 기울기 계산</text><rect x="1210" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="1355" y="228" font-size="28" text-anchor="middle" fill="#102A2B">경사 하강법</text><text x="1355" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">손실이 줄어드는 방향으로 한 걸음</text><path d="M 394 240 L 466 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 764 240 L 836 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1134 240 L 1206 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1355 304 L 1355 345 L 245 345 L 245 304" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="800" y="380" font-size="18" text-anchor="middle" fill="#5C6B6B">여러 차례 반복</text><path d="M 640 404 L 640 456" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="672" y="436" font-size="18" fill="#5C6B6B">새 가중치 기록</text><rect x="480" y="460" width="640" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" /><text x="800" y="507" font-size="28" text-anchor="middle" fill="#102A2B">가중치와 편향(매개변수)</text><text x="800" y="543" font-size="18" text-anchor="middle" fill="#5C6B6B">예: 입력 2개, 은닉 뉴런 2개, 출력 1개, 매개변수 총 9개</text><rect x="60" y="630" width="1480" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="100" y="670" font-size="22" font-weight="700" fill="#102A2B">추론: 학습된 신경망 사용</text><text x="1500" y="670" font-size="18" text-anchor="end" fill="#5C6B6B">가중치 고정</text><rect x="255" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="400" y="748" font-size="28" text-anchor="middle" fill="#102A2B">새 입력</text><text x="400" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">예: 두 스위치의 위치</text><rect x="655" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="800" y="748" font-size="28" text-anchor="middle" fill="#102A2B">순전파 계산</text><text x="800" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">고정된 가중치로 출력 계산</text><rect x="1055" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="1200" y="748" font-size="28" text-anchor="middle" fill="#102A2B">출력</text><text x="1200" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">예: 전등 켜짐 또는 꺼짐</text><path d="M 549 760 L 651 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 949 760 L 1051 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 800 574 L 800 696" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="820" y="612" font-size="18" fill="#5C6B6B">추론: 읽기만 하고 변경하지 않음</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
