<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">学習は重みを書き換え、推論は重みを読み取る / 学習は重みを書き換え、推論はそれを読み取る</title><desc id="desc">上段は学習。順伝播、損失、逆伝播、勾配降下法の四つの手順を繰り返し、毎回、新しい重みを中央の重みとバイアスに書き込む。二つの入力、二つの隠れニューロン、一つの出力を持つ小さなネットワークを例にすると、パラメータは計九つ。下段は推論。新しい入力が入り、順伝播で固定済みの重みを読み取って出力を生成する。損失は計算せず、重みも変えない。</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">学習は重みを書き換え、推論は読み取るだけ</text><text x="60" y="84" font-size="18" fill="#5C6B6B">学習は重みを書き換え、推論はそれを読み取るだけ</text><rect x="60" y="110" width="1480" height="290" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="100" y="152" font-size="22" font-weight="700" fill="#102A2B">学習：何周も繰り返す</text><text x="1500" y="152" font-size="18" text-anchor="end" fill="#5C6B6B">重みが変わる</text><rect x="100" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="245" y="228" font-size="28" text-anchor="middle" fill="#102A2B">順伝播</text><text x="245" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">現在の重みで予測</text><rect x="470" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="615" y="228" font-size="28" text-anchor="middle" fill="#102A2B">損失</text><text x="615" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">予測と正解の隔たり</text><rect x="840" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="985" y="228" font-size="28" text-anchor="middle" fill="#102A2B">逆伝播</text><text x="985" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">各重みの勾配を計算</text><rect x="1210" y="180" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" /><text x="1355" y="228" font-size="28" text-anchor="middle" fill="#102A2B">勾配降下法</text><text x="1355" y="266" font-size="18" text-anchor="middle" fill="#5C6B6B">損失が減る方向へ一歩更新</text><path d="M 394 240 L 466 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 764 240 L 836 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1134 240 L 1206 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1355 304 L 1355 345 L 245 345 L 245 304" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="800" y="380" font-size="18" text-anchor="middle" fill="#5C6B6B">何周も繰り返す</text><path d="M 640 404 L 640 456" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="672" y="436" font-size="18" fill="#5C6B6B">新しい重みを書き込む</text><rect x="480" y="460" width="640" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" /><text x="800" y="507" font-size="28" text-anchor="middle" fill="#102A2B">重みとバイアス（パラメータ）</text><text x="800" y="543" font-size="18" text-anchor="middle" fill="#5C6B6B">例：入力 2 個、隠れニューロン 2 個、出力 1 個、計 9 パラメータ</text><rect x="60" y="630" width="1480" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="100" y="670" font-size="22" font-weight="700" fill="#102A2B">推論：学習済みネットワークを使う</text><text x="1500" y="670" font-size="18" text-anchor="end" fill="#5C6B6B">重みは固定</text><rect x="255" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="400" y="748" font-size="28" text-anchor="middle" fill="#102A2B">新しい入力</text><text x="400" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">例：二つのスイッチの位置</text><rect x="655" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="800" y="748" font-size="28" text-anchor="middle" fill="#102A2B">順伝播</text><text x="800" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">固定した重みで出力を計算</text><rect x="1055" y="700" width="290" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="1200" y="748" font-size="28" text-anchor="middle" fill="#102A2B">出力</text><text x="1200" y="786" font-size="18" text-anchor="middle" fill="#5C6B6B">例：点灯または消灯</text><path d="M 549 760 L 651 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 949 760 L 1051 760" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 800 574 L 800 696" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><text x="820" y="612" font-size="18" fill="#5C6B6B">推論：読み取りのみ、変更なし</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 図版制作 2026</text></svg>
