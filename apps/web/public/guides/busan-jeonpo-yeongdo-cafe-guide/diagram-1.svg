<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dtitle ddesc" font-family="'Noto Sans TC','Noto Sans KR',system-ui,sans-serif">
  <title id="dtitle">釜山咖啡店兩區示意圖 / Jeonpo and Yeongdo cafe areas, Busan</title>
  <desc id="ddesc">示意圖，非比例。左塊是전포（田浦）・부산진구：서면역與전포역兩個地鐵站，站名只寫韓文；中間一條粗線標示「큰 도로（大馬路）」，線的左側是전포공구길（下面一行小字寫「查不到官方中文名」），右側是전포카페거리（田浦咖啡街）；下方沿서전로、동천로兩個路名標出三個網美類型的店家點：서전로旁是사,여백,찻잔與카페 하이안，동천로旁是연의양과；一個小標籤寫「官方頁：地鐵站出口走得到」，下面一行字寫「官方頁沒有寫哪一家店在哪一條街」。右塊是영도（影島）・영도구：남포역與중앙역兩個地鐵站，站名同樣只寫韓文，各自向下延伸一小段線接到一個小巴士圖示，標「버스 환승（轉公車）」；一個小標籤寫「官方頁：轉乘公車前往」；下方沿봉래나루로、해양로、태종로三個路名標出三個店家點：모모스（咖啡品質色）、피아크（海景色）、카페 385（海景色）；底部一個虛線框標示흰여울문화마을，框內註記「官方頁只寫巷子裡有咖啡店，沒有點名，圖上不標店家點」，這個框沒有連到任何一個店家點。兩塊之間留白，沒有畫任何連接兩塊的箭頭或路線。下方圖例列出四種類型色塊：網美（官方描述了具體空間特色）、咖啡品質（官方載明自家烘焙或賽事資歷）、海景（官方寫明看得到海）、韓屋（建物本身是韓屋，本篇官方頁未寫）。資料整理自 Visit Busan 與韓國觀光公社（KTO）官方頁，2026 年 9 月查證。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

