  <text x="1205" y="735" text-anchor="middle" font-size="15" fill="#5C6B6B">圖上不標店家點</text>

  <!-- legend -->
  <rect x="40" y="797" width="24" height="24" fill="#D97A2B"/>
  <text x="72" y="815" font-size="16" fill="#102A2B">網美（官方描述了具體空間特色）</text>

