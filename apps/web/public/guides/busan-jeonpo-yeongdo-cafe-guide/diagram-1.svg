  <circle cx="1430" cy="230" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1430" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">중앙역</text>

  <!-- right: bus-transfer stubs (each stays local to its own station, no route drawn onward) -->
  <line x1="985" y1="306" x2="985" y2="330" stroke="#5C6B6B" stroke-width="4"/>
  <rect x="957" y="330" width="56" height="30" rx="8" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <circle cx="970" cy="362" r="6" fill="#5C6B6B"/>
  <circle cx="1000" cy="362" r="6" fill="#5C6B6B"/>
  <text x="985" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#102A2B">버스 환승</text>
  <text x="985" y="410" text-anchor="middle" font-size="15" fill="#5C6B6B">轉公車</text>

  <line x1="1430" y1="306" x2="1430" y2="330" stroke="#5C6B6B" stroke-width="4"/>
  <rect x="1402" y="330" width="56" height="30" rx="8" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <circle cx="1415" cy="362" r="6" fill="#5C6B6B"/>
  <circle cx="1445" cy="362" r="6" fill="#5C6B6B"/>
  <text x="1430" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#102A2B">버스 환승</text>
  <text x="1430" y="410" text-anchor="middle" font-size="15" fill="#5C6B6B">轉公車</text>

  <!-- right: shop dots by road name -->
  <text x="1000" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">봉래나루로</text>
  <circle cx="1000" cy="515" r="15" fill="#0D6B68" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1000" y="552" text-anchor="middle" font-size="15" fill="#102A2B">모모스</text>

  <text x="1225" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">해양로</text>
  <circle cx="1225" cy="515" r="15" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1225" y="552" text-anchor="middle" font-size="15" fill="#102A2B">피아크</text>

  <text x="1440" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">태종로</text>
  <circle cx="1440" cy="515" r="15" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1440" y="552" text-anchor="middle" font-size="15" fill="#102A2B">카페 385</text>

  <!-- right: badge -->
  <rect x="1055" y="590" width="300" height="40" rx="20" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="2"/>
  <text x="1205" y="616" text-anchor="middle" font-size="16" fill="#2F6F9F">官方頁：轉乘公車前往</text>

  <!-- right: Huinnyeoul aside box, deliberately not connected to any shop dot -->
  <rect x="900" y="655" width="610" height="105" rx="16" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1205" y="688" text-anchor="middle" font-size="19" font-weight="bold" fill="#102A2B">흰여울문화마을</text>
