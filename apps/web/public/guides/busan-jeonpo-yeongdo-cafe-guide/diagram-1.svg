  <text x="800" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#102A2B">釜山咖啡店兩區示意圖</text>
  <text x="800" y="84" text-anchor="middle" font-size="18" fill="#5C6B6B">示意圖，非比例・Jeonpo and Yeongdo cafe areas, not to scale</text>

  <!-- left panel -->
