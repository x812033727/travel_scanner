<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dtitle ddesc" font-family="'Noto Sans TC','Noto Sans KR',system-ui,sans-serif">
  <title id="dtitle">釜山咖啡店兩區示意圖 / Jeonpo and Yeongdo cafe areas, Busan</title>
  <desc id="ddesc">圖上的標題是「釜山咖啡店兩區示意圖」，副標是「示意圖，非比例・Jeonpo and Yeongdo cafe areas, not to scale」。圖分左右兩塊，中間留白，兩塊之間沒有任何連接線或箭頭。左塊標題「전포（田浦）・부산진구」，上排是서면역（Seomyeon）與전포역（Jeonpo）兩個地鐵站；下面一排是兩條街，左邊的方框寫전포공구길與它的拼音 Jeonpogonggu-gil，右邊的方框寫전포카페거리與田浦咖啡街，兩個方框之間隔著一條標示「큰 도로（大馬路）」的粗線；再下面沿路名標出店家點，全部是橘色的網美類型：서전로旁是사,여백,찻잔與카페 하이안，동천로旁是연의양과，下面一行寫「店家點照地址的路名排」，另有一個標籤寫「地鐵站出口走得到」。右塊標題「영도（影島）・영도구」，上排是남포역（Nampo）與중앙역（Jungang）兩個地鐵站，各自向下接一個「버스 환승（轉公車）」的小圖示，標籤寫「要先搭地鐵再轉公車」；下面沿路名標出三個店家點：봉래나루로旁是藍綠色咖啡品質類型的모모스，해양로旁是藍色海景類型的피아크，태종로旁是藍色海景類型的카페 385；底部一個虛線框標示흰여울문화마을（Huinnyeoul Culture Village），框裡寫「巷子裡有咖啡店、工作室與獨立書店」與「上面的店家點都不在這裡」，這個框沒有連到任何一個店家點。下方圖例只有三個類型色塊：橘色的網美、藍綠色的咖啡品質與藍色的海景，並註明店名與路名照韓文寫，方便對照招牌與地圖。右下角是「© Mokaair 製圖 2026」。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

