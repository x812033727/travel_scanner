  <text x="185" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">서전로</text>
  <circle cx="120" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="120" y="552" text-anchor="middle" font-size="15" fill="#102A2B">사,여백,찻잔</text>
  <circle cx="255" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="255" y="552" text-anchor="middle" font-size="15" fill="#102A2B">카페 하이안</text>

  <text x="610" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">동천로</text>
  <circle cx="610" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="610" y="552" text-anchor="middle" font-size="15" fill="#102A2B">연의양과</text>

  <!-- left: badge -->
  <rect x="245" y="590" width="300" height="40" rx="20" fill="#E3F0EF" stroke="#0D6B68" stroke-width="2"/>
  <text x="395" y="616" text-anchor="middle" font-size="16" fill="#0D6B68">官方頁：地鐵站出口走得到</text>

  <!-- left: the official pages never say which shop sits on which of the two streets -->
  <text x="395" y="672" text-anchor="middle" font-size="16" fill="#5C6B6B">官方頁沒有寫哪一家店在哪一條街</text>

  <!-- right panel -->
  <rect x="840" y="110" width="730" height="670" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1205" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#102A2B">영도 影島・영도구</text>

  <!-- right: stations -->
  <circle cx="985" cy="230" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
