  <text x="395" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#102A2B">전포 田浦・부산진구</text>

  <!-- left: stations -->
  <circle cx="230" cy="230" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="230" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">서면역</text>

  <circle cx="610" cy="230" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="610" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">전포역</text>

  <!-- left: big road divider + two street zones -->
  <rect x="60" y="345" width="290" height="110" rx="16" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="205" y="393" text-anchor="middle" font-size="18" font-weight="bold" fill="#102A2B">전포공구길</text>
  <text x="205" y="421" text-anchor="middle" font-size="15" fill="#5C6B6B">查不到官方中文名</text>

