  <line x1="420" y1="422" x2="420" y2="455" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round"/>
  <text x="420" y="396" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">큰 도로</text>
  <text x="420" y="415" text-anchor="middle" font-size="15" fill="#5C6B6B">大馬路</text>

  <rect x="490" y="345" width="240" height="110" rx="16" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
