<title id="title">Apple 发布 iPhone Duo：屏幕、电池与台湾上市时间整理</title><desc id="desc">原创插图：左边是一台合上的窄长装置，左边缘一条直线代表转轴那一侧；箭头指向右边展开的宽面板，中央一条虚线是折线，上下两端各有一个圆点代表轴承，左右两半各有一个小长方形代表两块电池；不呈现真实机身外观或商标</desc>
