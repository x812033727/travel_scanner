<title id="title">Apple、iPhone Duoを発表 ディスプレイ・バッテリー・台湾発売スケジュールまとめ</title><desc id="desc">オリジナルイラスト：左に閉じた縦長の装置、右に開いた広いパネルを矢印でつなぐ。中央の破線が折り目、上下の丸がヒンジ、左右の四角がバッテリー2個を表す。実機の外観やロゴは描いていません。</desc>
