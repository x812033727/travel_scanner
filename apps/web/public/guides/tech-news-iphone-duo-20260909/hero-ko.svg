<title id="title">Apple, iPhone Duo 공개: 디스플레이·배터리·대만 출시 일정 정리</title><desc id="desc">독창적 일러스트: 왼쪽은 접힌 세로형 기기, 오른쪽은 펼쳐진 넓은 패널을 화살표로 연결. 가운데 점선은 접는 선, 위아래 점은 힌지, 좌우 작은 사각형은 배터리 2개를 나타냄. 실제 기기 외관이나 로고는 표현하지 않음.</desc>
