<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">先跑固定資料，再核對遠端產物</title><desc id="desc">觸發：手動・預設分支：固定事件提交；環境：核對帳號條件：需要的審核另設；模式：fixture → live：一份資料先驗證；交付：下載 artifact：核對模式與結果</desc>
<rect width="1600" height="900" fill="#f3f5ee"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#173445" font-weight="800">先跑固定資料，再核對遠端產物</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#2b6577" font-weight="800">觸發</text><text x="120" y="311" font-size="54" fill="#173445" font-weight="500">手動・預設分支</text><text x="120" y="379" font-size="54" fill="#173445" font-weight="500">固定事件提交</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#2b6577" font-weight="800">環境</text><text x="855" y="311" font-size="54" fill="#173445" font-weight="500">核對帳號條件</text><text x="855" y="379" font-size="54" fill="#173445" font-weight="500">需要的審核另設</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#2b6577" font-weight="800">模式</text><text x="120" y="601" font-size="54" fill="#173445" font-weight="500">fixture → live</text><text x="120" y="669" font-size="54" fill="#173445" font-weight="500">一份資料先驗證</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#2b6577" font-weight="800">交付</text><text x="855" y="601" font-size="54" fill="#173445" font-weight="500">下載 artifact</text><text x="855" y="669" font-size="54" fill="#173445" font-weight="500">核對模式與結果</text><text x="85" y="818" font-size="47" fill="#476574" font-weight="500">本機執行器已測；遠端工作流待驗</text></g></svg>