<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">漢拏山兩條登頂路線的管制點 / Hallasan summit routes: Seongpanak and Gwaneumsa</title>
  <desc id="desc">兩條由左下往右上的折線，交會在右上方的白鹿潭（東陵頂），海拔 1,950 公尺。上面一條是城板岳：入山 05:00 起，到金達萊田 7.3 公里，再到白鹿潭 2.3 公里，總長 9.6 公里、單程 4 小時 30 分。下面一條是觀音寺：入山 05:00 起，到三角峰 6 公里，再到白鹿潭 2.7 公里，總長 8.7 公里、單程 5 小時。兩個中途節點金達萊田與三角峰都標冬季 11:30、夏季 12:30 前要通過，下山冬季 15:30、夏季 16:30。白鹿潭標冬季 13:30、夏季 14:30 開始下山。中途節點到白鹿潭的粗線是要預約的路段，入口到中途節點的細線不用預約。示意圖，距離與坡度非比例。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">兩條登頂路線的管制點</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Hallasan summit routes: Seongpanak and Gwaneumsa</text>

  <!-- route A: Seongpanak (upper) -->
  <line x1="170" y1="470" x2="760" y2="360" stroke="#2F6F9F" stroke-width="5"/>
  <line x1="760" y1="360" x2="1250" y2="260" stroke="#0D6B68" stroke-width="14" stroke-linecap="round"/>
  <!-- route B: Gwaneumsa (lower) -->
  <line x1="170" y1="780" x2="760" y2="640" stroke="#2F6F9F" stroke-width="5"/>
  <line x1="760" y1="640" x2="1250" y2="260" stroke="#0D6B68" stroke-width="14" stroke-linecap="round"/>

  <!-- route A block -->
  <circle cx="170" cy="470" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="70" y="520" font-size="22" font-weight="700" fill="#102A2B">城板岳（入山 05:00 起）</text>
  <text x="70" y="552" font-size="18" fill="#5C6B6B">總長 9.6 公里、單程 4 小時 30 分</text>
  <text x="70" y="580" font-size="17" fill="#2F6F9F">這一段不用預約</text>

  <!-- route B block -->
  <circle cx="170" cy="780" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="205" y="802" font-size="22" font-weight="700" fill="#102A2B">觀音寺（入山 05:00 起）</text>
  <text x="205" y="830" font-size="18" fill="#5C6B6B">總長 8.7 公里、單程 5 小時</text>
  <text x="440" y="830" font-size="17" fill="#2F6F9F">這一段不用預約</text>

  <!-- mid node A -->
  <circle cx="760" cy="360" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="738" y="326" font-size="22" font-weight="700" fill="#102A2B" text-anchor="end">金達萊田（진달래밭）7.3 公里</text>
  <rect x="640" y="400" width="310" height="76" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="795" y="430" font-size="17" fill="#102A2B" text-anchor="middle">冬 11:30／夏 12:30 前要通過</text>
  <text x="795" y="460" font-size="17" fill="#102A2B" text-anchor="middle">下山 冬 15:30／夏 16:30</text>
  <text x="1005" y="286" font-size="17" font-weight="700" fill="#0D6B68" text-anchor="middle" transform="rotate(-11.5 1005 286)">再 2.3 公里：這一段要預約</text>

  <!-- mid node B -->
  <circle cx="760" cy="640" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="738" y="606" font-size="22" font-weight="700" fill="#102A2B" text-anchor="end">三角峰（삼각봉）6 公里</text>
  <rect x="640" y="690" width="310" height="76" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="795" y="720" font-size="17" fill="#102A2B" text-anchor="middle">冬 11:30／夏 12:30 前要通過</text>
  <text x="795" y="750" font-size="17" fill="#102A2B" text-anchor="middle">下山 冬 15:30／夏 16:30</text>
  <text x="1050" y="500" font-size="17" font-weight="700" fill="#0D6B68">再 2.7 公里：這一段要預約</text>

  <!-- summit -->
  <circle cx="1250" cy="260" r="24" fill="#B8442D" stroke="#FFFFFF" stroke-width="4"/>
  <text x="1250" y="130" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">白鹿潭（東陵頂）</text>
  <text x="1250" y="158" font-size="15" fill="#5C6B6B" text-anchor="middle">백록담</text>
  <text x="1250" y="196" font-size="22" font-weight="700" fill="#B8442D" text-anchor="middle">海拔 1,950 公尺</text>
  <rect x="1200" y="322" width="360" height="46" rx="12" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="1380" y="352" font-size="17" fill="#102A2B" text-anchor="middle">冬 13:30／夏 14:30 開始下山</text>

  <text x="60" y="872" font-size="15" fill="#5C6B6B">示意圖，距離與坡度非比例</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
