<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Evaluating Whether to Keep or Retire AMP</title><desc id="desc">Four steps: audit AMP modes and URLs, review entry-point and feature data, compare keeping AMP with alternatives, and verify URLs and pages.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Keep or Retire AMP: Review</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Check the site first; compare upkeep and reader experience</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Current Site</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">One/Two Versions</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Primary URLs and Modes</text>
<text x="108.0" y="475" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">Tool Source and Compatibility</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Reader Evidence</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Active Entry Points</text>
<text x="477.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Required Features Complete</text>
<text x="477.0" y="475" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Speed and Interaction Data</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Compare Options</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">AMP Maintenance</text>
<text x="846.0" y="423" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Cost to Improve Standard Pages</text>
<text x="846.0" y="475" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">Exit Alternatives and Recovery</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Verify the Switch</text>
<text x="1215.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Match Old URLs to Content</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Update Markup and Links</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Monitor Errors</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Decide from site evidence; take care of old links and essential features.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
