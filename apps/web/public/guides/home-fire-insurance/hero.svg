<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">保的是建築物 / The policy covers the building</title>
  <desc id="desc">插圖。畫面左側是一個盾牌形狀，裡面罩著一棟簡化的房屋：三角形屋頂、方形屋身與一扇門。畫面右側在同一條地平線上，站著一張沙發與一個畫框，兩者都在盾牌之外，沒有被罩住；沙發上方掛著一把鑰匙。底部一行字寫著「保的是建築物」。全圖用米色底、墨綠與橘色線條，沒有任何機構標誌、人臉、貨幣圖案或上升曲線。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- ground -->
  <line x1="120" y1="690" x2="1480" y2="690" stroke="#5C6B6B" stroke-width="4"/>

  <!-- the shield, and the building it covers -->
  <path d="M 330 170 L 710 170 L 710 420 Q 710 545 520 640 Q 330 545 330 420 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10"/>
  <path d="M 400 350 L 520 250 L 640 350 Z" fill="#0D6B68"/>
  <rect x="430" y="350" width="180" height="145" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="495" y="420" width="50" height="75" rx="6" fill="#0D6B68"/>

  <!-- the key -->
  <circle cx="990" cy="270" r="44" fill="none" stroke="#5C6B6B" stroke-width="12"/>
  <rect x="978" y="314" width="24" height="150" fill="#5C6B6B"/>
  <rect x="1002" y="396" width="36" height="18" fill="#5C6B6B"/>
  <rect x="1002" y="430" width="26" height="18" fill="#5C6B6B"/>

  <!-- what the shield does not reach: the contents -->
  <rect x="900" y="519" width="230" height="60" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <rect x="880" y="574" width="270" height="90" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <rect x="905" y="664" width="18" height="26" fill="#D97A2B"/>
  <rect x="1107" y="664" width="18" height="26" fill="#D97A2B"/>

  <rect x="1200" y="555" width="170" height="135" rx="8" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <path d="M 1222 658 L 1274 594 L 1322 658 Z" fill="#D97A2B"/>
  <circle cx="1330" cy="592" r="16" fill="#D97A2B"/>

  <text x="800" y="800" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">保的是建築物</text>
</svg>
