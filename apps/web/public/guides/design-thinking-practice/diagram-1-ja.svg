<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">傘貸出の練習での判断記録</title><desc id="desc">傘の貸出の問題を題材に、質問、定義、比較、検証の記録を示す独自の四枚のカード。ダブルダイヤモンドや学習カードの複製ではありません。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">傘貸出の練習での判断記録</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">各段階で根拠を残し、問いの見直しも可能に</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">質問</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">最近どう傘を借りたか</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">実体験を記録</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">定義</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">必要な返却情報</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">制約と仮説を明記</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">比較</text>
<text x="846.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">ラベル・掲示・ウェブ</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">維持管理の負担を列挙</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">検証</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">課題で理解度を確認</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">修正箇所を決める</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">小さなプロトタイプは、次の判断を変える情報を得るために作る。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図版</text>
</svg>
