<title id="title">營業稅：哪一段不課</title><desc id="desc">財政部 2026 年 9 月 3 日台財稅字第 11504611390 號令的課稅範圍整理：營業人銷售虛擬資產與穩定幣不課營業稅，服務費、手續費與 NFT 仍應依法課徵。</desc>
