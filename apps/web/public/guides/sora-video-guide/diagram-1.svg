<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Sora 停止服務後的四個步驟 / What to do about Sora now</title>
  <desc id="desc">由左往右四個步驟。第一步確認兩個官方日期：Sora 網站與 App 已在 2026 年 4 月 26 日停止，Videos API 在 2026 年 9 月 24 日關閉。第二步立刻匯出作品：到官方 sunset 頁按 Export，等信、下載、逐支播一次確認，因為最後期限過後資料會永久刪除。第三步抄下官方規格：16 或 20 秒生成，延長每次 20 秒、最多 6 次共 120 秒，1080p 輸出要用 Pro 版模型。第四步換工具並保留標示：官方沒有列出建議替代，要自己挑下一個工具。最下方提醒，官方的內容憑證查驗工具只收圖片與音訊，不收影片，匯出回來的影片檔驗不出 C2PA 或 SynthID。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Sora 停止服務後的四個步驟</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">What to do about Sora now</text>

  <!-- step 1 -->
  <rect x="70" y="170" width="320" height="330" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="110" cy="216" r="24" fill="#2F6F9F"/>
  <text x="110" y="224" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="150" y="224" font-size="20" font-weight="700" fill="#102A2B">確認兩個日期</text>
  <text x="94" y="290" font-size="16" fill="#102A2B">網站與 App</text>
  <text x="94" y="330" font-size="16" fill="#102A2B">2026 年 4 月 26 日停止</text>
  <text x="94" y="410" font-size="16" fill="#102A2B">Videos API</text>
  <text x="94" y="450" font-size="16" fill="#102A2B">2026 年 9 月 24 日關閉</text>

  <line x1="398" y1="335" x2="440" y2="335" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="450" y="170" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="490" cy="216" r="24" fill="#D97A2B"/>
  <text x="490" y="224" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="530" y="224" font-size="20" font-weight="700" fill="#102A2B">立刻匯出作品</text>
  <text x="474" y="290" font-size="16" fill="#102A2B">到官方 sunset 頁</text>
  <text x="474" y="330" font-size="16" fill="#102A2B">按 Export，等信下載</text>
  <text x="474" y="370" font-size="16" fill="#102A2B">逐支播一次確認</text>
  <text x="474" y="450" font-size="16" fill="#B8442D">期限過後永久刪除</text>

  <line x1="778" y1="335" x2="820" y2="335" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="830" y="170" width="320" height="330" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="870" cy="216" r="24" fill="#0D6B68"/>
  <text x="870" y="224" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="910" y="224" font-size="20" font-weight="700" fill="#102A2B">抄下官方規格</text>
  <text x="854" y="290" font-size="16" fill="#102A2B">16 或 20 秒生成</text>
  <text x="854" y="330" font-size="16" fill="#102A2B">延長每次 20 秒</text>
  <text x="854" y="370" font-size="16" fill="#102A2B">最多 6 次共 120 秒</text>
  <text x="854" y="450" font-size="16" fill="#102A2B">1080p 要用 Pro 版</text>

  <line x1="1158" y1="335" x2="1200" y2="335" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="1210" y="170" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="1250" cy="216" r="24" fill="#2E7D5B"/>
  <text x="1250" y="224" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1290" y="224" font-size="20" font-weight="700" fill="#102A2B">換工具並標示</text>
  <text x="1234" y="290" font-size="16" fill="#102A2B">官方沒列建議替代</text>
  <text x="1234" y="330" font-size="16" fill="#102A2B">自己挑下一個工具</text>
  <text x="1234" y="410" font-size="16" fill="#102A2B">C2PA 與 SynthID</text>
  <text x="1234" y="450" font-size="16" fill="#102A2B">只驗圖片與音訊</text>

  <!-- bottom note -->
  <rect x="70" y="570" width="1460" height="190" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="110" y="634" font-size="20" font-weight="700" fill="#B8442D">最容易被忽略的一點</text>
  <text x="110" y="680" font-size="18" fill="#102A2B">官方的內容憑證查驗工具只收圖片與音訊，不收影片。</text>
  <text x="110" y="718" font-size="18" fill="#102A2B">匯出回來的影片檔驗不出 C2PA 或 SynthID，只能靠自己的檔案與紀錄說明來源。</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
