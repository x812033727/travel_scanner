<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北住哪一區：六個區域、捷運路線與兩座機場示意圖 / Where to stay in Taipei: six areas on the MRT and both airports</title>
  <desc id="desc">簡化的台北捷運示意圖，標出六個住宿區域。台北車站與中山：機場捷運 A1 終點，中山到台北車站 2 分，松山機場到台北車站 15 分。西門町：台北車站 2 分 NT$20，松山機場 17 分 NT$25，板南線台北車站末班 00:49。信義與東區：台北車站到市政府 11 分 NT$20、到台北101/世貿 14 分 NT$25，松山機場到忠孝復興 7 分 NT$20。大安與永康街：東門到台北車站 7 分 NT$20，松山機場 15 分 NT$25。松山：南京復興到松山機場 5 分，松山站（饒河夜市）到松山機場 18 分、到台北車站 14 分。北投：新北投到台北車站 28 分 NT$35，到松山機場 41 分 NT$40，台北車站最後可達班次 23:45。桃園機場機捷直達車 35 到 39 分 NT$160，末班 T2 22:55、T1 22:58，A1 首班 05:30；國光 1819 巴士 24 小時約 55 分，1840、1841、1842 到松山機場 50 到 60 分，大有 1960 到市政府一帶 60 到 70 分；計程車約 NT$1,200 到 1,900；台北車站捷運末班 00:36 到 00:49。松山機場站首班 06:03，往動物園末班 00:27，往南港展覽館末班 00:43。/ Simplified Taipei MRT map of six hotel areas. Taipei Main Station and Zhongshan: end of the Airport MRT at A1, Zhongshan 2 minutes from Taipei Main Station, Songshan Airport 15 minutes away. Ximending: 2 minutes and NT$20 from Taipei Main Station, 17 minutes and NT$25 from Songshan Airport, last Blue line train from Taipei Main Station 00:49. Xinyi and the East District: City Hall 11 minutes and NT$20, Taipei 101/World Trade Center 14 minutes and NT$25 from Taipei Main Station, Zhongxiao Fuxing 7 minutes and NT$20 from Songshan Airport. Da'an and Yongkang Street: Dongmen 7 minutes and NT$20 from Taipei Main Station, 15 minutes and NT$25 from Songshan Airport. Songshan: Nanjing Fuxing 5 minutes from the airport, Songshan station for Raohe Night Market 18 minutes from the airport and 14 minutes from Taipei Main Station. Beitou: Xinbeitou 28 minutes and NT$35 from Taipei Main Station, 41 minutes and NT$40 from Songshan Airport, last connecting train from Taipei Main Station 23:45. From Taoyuan Airport the Airport MRT Express takes 35 to 39 minutes for NT$160, last Express 22:55 from T2 and 22:58 from T1, first Express from A1 05:30; bus 1819 runs 24 hours in about 55 minutes, buses 1840, 1841 and 1842 reach Songshan Airport in 50 to 60 minutes and bus 1960 the City Hall area in 60 to 70 minutes; taxis about NT$1,200 to 1,900; last metro trains from Taipei Main Station 00:36 to 00:49. Songshan Airport station: first train 06:03, last toward Taipei Zoo 00:27, last toward Taipei Nangang Exhibition Center 00:43.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

