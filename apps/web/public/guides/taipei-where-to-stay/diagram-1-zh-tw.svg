<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北住哪一區：六個區域、捷運路線與兩座機場</title>
  <desc id="desc">簡化的台北捷運示意圖，標出六個住宿區域。台北車站與中山：機場捷運 A1 終點，中山到台北車站 2 分，松山機場到台北車站 15 分。西門町：台北車站 2 分 NT$20，松山機場 17 分 NT$25，板南線台北車站末班 00:49。信義與東區：台北車站到市政府 11 分 NT$20、到台北 101／世貿 14 分 NT$25，松山機場到忠孝復興 7 分 NT$20。大安與永康街：東門到台北車站 7 分 NT$20，松山機場 15 分 NT$25。松山：南京復興到松山機場 5 分，松山站（饒河夜市）到松山機場 18 分、到台北車站 14 分。北投：新北投到台北車站 28 分 NT$35，到松山機場約 41 至 43 分 NT$40、轉乘兩次，台北車站最後可銜接班次 23:45。桃園機場機捷直達車約 35 至 39 分、NT$160，末班自第二航廈 22:55、第一航廈 22:58 發車，A1 首班直達車 05:30；這份機捷時刻表適用至 2026 年 10 月 31 日，之後應於行前 3 日重查。國光客運 1819 全天有排定班次但深夜班距較長，車程約 55 分；1840 往返第一、第二航廈與松山機場，1841、1842 由第二航廈端往返松山機場；大有巴士 1960 往市政府或君悅酒店一帶，時間受路況影響；計程車依跳表、目的地、路況與加成計費。台北車站各捷運方向末班約 00:36 至 00:49。松山機場站首班 06:03，往動物園末班 00:27，往南港展覽館末班 00:43。所有班次與費用均須在出發前再次確認。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="64" font-size="36" font-weight="700" fill="#102A2B">台北住哪一區　六個區域、捷運路線與兩座機場</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">示意圖，非精確比例・捷運時間含轉乘、不含候車・2026 年 9 月 21 日查核</text>

