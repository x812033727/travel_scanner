<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" lang="ko" xml:lang="ko" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">아사쿠사에서 닛코 당일치기 노선도 / Asakusa to Nikko day trip route</title>
  <desc id="desc">왼쪽에는 아사쿠사에서 도부 특급 스페시아 X로 약 1시간 50분 걸려 도부 닛코역에 가는 구간(운임 1,400엔+특급요금 1,940엔)이 표시되어 있어요. 가운데 세계유산 구역은 세계유산 순회버스로 신쿄, 닛코 도쇼구, 후타라산 신사, 린노지가 이어지고 각 입장료가 적혀 있어요. 오른쪽에는 버스로 이로하자카를 올라 약 50분·1,250엔에 주젠지 온천에 도착한 뒤 게곤 폭포와 주젠지 호수 유람선으로 이어지는 경로가 나와 있고, 아래쪽에는 주젠지 온천발 도부 닛코역행 막차 버스 시간(20:02)이 안내되어 있어요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="72" font-size="38" font-weight="700" fill="#102A2B">아사쿠사 → 도부 닛코 → 닛코 도쇼구 → 주젠지 호수 당일치기 노선</text>
  <text x="60" y="112" font-size="21" fill="#5C6B6B">Asakusa → Nikko day trip · 성인 요금, 2026년 9월 확인(공식 사이트 기준) · 실선 철도, 점선 버스</text>

  <!-- NIKKO PASS note -->
  <rect x="60" y="150" width="700" height="96" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="84" y="188" font-size="20" font-weight="700" fill="#0D6B68">닛코 패스: 세계유산 구역 2일권 3,000엔 · 전 구역 4일권 8,000엔</text>
  <text x="84" y="222" font-size="18" fill="#5C6B6B">아사쿠사 ⇄ 시모이마이치 왕복 운임과 구역 내 도부 버스 포함, 특급권 별도</text>

  <!-- Rail: Asakusa -> Tobu-Nikko -->
  <line x1="250" y1="615" x2="470" y2="615" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <text x="360" y="500" font-size="21" font-weight="700" fill="#0D6B68" text-anchor="middle">스페시아 X · 약 1시간 50분</text>
  <text x="360" y="532" font-size="17" fill="#5C6B6B" text-anchor="middle">운임 1,400+특급 1,940엔 (게곤 1,650엔)</text>
  <text x="360" y="705" font-size="17" fill="#5C6B6B" text-anchor="middle">전 좌석 지정석 · 특급권 1개월 전 발매</text>
  <rect x="60" y="560" width="190" height="110" rx="22" fill="#0D6B68"/>
  <text x="155" y="607" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">아사쿠사</text>
  <text x="155" y="642" font-size="19" fill="#E6F2F1" text-anchor="middle">Asakusa</text>
  <rect x="470" y="560" width="200" height="110" rx="22" fill="#6B4A3A"/>
  <text x="570" y="607" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">도부 닛코</text>
  <text x="570" y="642" font-size="19" fill="#F1E8E2" text-anchor="middle">Tobu-Nikko Sta.</text>

  <!-- World heritage area -->
  <rect x="704" y="420" width="516" height="320" rx="26" fill="#FFFFFF" fill-opacity="0.55" stroke="#2E7D5B" stroke-width="3"/>
  <text x="730" y="454" font-size="21" font-weight="700" fill="#2E7D5B">세계유산 구역 World Heritage Area</text>
  <text x="730" y="482" font-size="17" fill="#5C6B6B">세계유산 순회버스 1일 승차권 600엔</text>
  <text x="730" y="508" font-size="17" fill="#5C6B6B">도부 닛코역 → 오모테산도 약 8분</text>
  <path d="M 670 615 L 1220 615" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#B8442D" stroke-width="6">
    <circle cx="792" cy="615" r="14"/>
    <circle cx="906" cy="615" r="14"/>
    <circle cx="1020" cy="615" r="14"/>
    <circle cx="1132" cy="615" r="14"/>
  </g>
  <text x="792" y="662" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">신쿄 Shinkyo</text>
  <text x="792" y="688" font-size="17" fill="#5C6B6B" text-anchor="middle">통행 300엔</text>
  <text x="906" y="556" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">닛코 도쇼구</text>
  <text x="906" y="582" font-size="17" fill="#5C6B6B" text-anchor="middle">입장 1,600엔</text>
  <text x="1020" y="662" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">후타라산 신사</text>
  <text x="1020" y="688" font-size="17" fill="#5C6B6B" text-anchor="middle">신엔 300엔</text>
  <text x="1132" y="556" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">린노지 Rinnoji</text>
  <text x="1132" y="582" font-size="17" fill="#5C6B6B" text-anchor="middle">다이유인 550엔</text>

  <!-- Bus up Irohazaka to Chuzenji -->
  <path d="M 1220 615 C 1315 615, 1265 330, 1335 330" stroke="#6B4A3A" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <text x="1265" y="372" font-size="21" font-weight="700" fill="#6B4A3A" text-anchor="end">이로하자카 Irohazaka</text>
  <text x="1265" y="400" font-size="17" fill="#5C6B6B" text-anchor="end">48개 커브 · 평시 상행 약 20분</text>
  <text x="1295" y="590" font-size="18" fill="#6B4A3A" font-weight="700">버스 약 50분 · 1,250엔</text>

  <!-- Okunikko -->
  <text x="1130" y="196" font-size="21" font-weight="700" fill="#2E7D5B">오쿠닛코 Okunikko</text>
  <circle cx="1335" cy="330" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7"/>
  <text x="1305" y="324" font-size="21" font-weight="700" fill="#102A2B" text-anchor="end">주젠지 온천 Chuzenji Onsen</text>
  <line x1="1349" y1="322" x2="1466" y2="250" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <line x1="1349" y1="338" x2="1466" y2="392" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="1480" cy="240" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1480" y="190" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">주젠지 호수 유람선</text>
  <text x="1480" y="216" font-size="17" fill="#5C6B6B" text-anchor="middle">일주 약 55분</text>
  <circle cx="1480" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1480" y="446" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">게곤 폭포 Kegon</text>
  <text x="1480" y="472" font-size="17" fill="#5C6B6B" text-anchor="middle">엘리베이터 왕복 600엔</text>
  <text x="1480" y="498" font-size="17" fill="#5C6B6B" text-anchor="middle">정류장 도보 약 5분</text>

  <!-- Last bus -->
  <text x="720" y="798" font-size="18" font-weight="700" fill="#B8442D">막차 버스: 주젠지 온천 20:02 출발 → 도부 닛코역 20:38 도착 (2026년 4월~11월 시간표, 공식 사이트 기준)</text>

  <!-- Legend -->
  <g font-size="18" fill="#102A2B">
    <line x1="60" y1="860" x2="120" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="132" y="867" font-size="18">도부 철도 Tobu Railway</text>
    <line x1="395" y1="860" x2="455" y2="860" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="467" y="867" font-size="18">세계유산 순회버스 World Heritage Bus</text>
    <line x1="855" y1="860" x2="915" y2="860" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="927" y="867" font-size="18">주젠지 온천 · 유모토 온천선 버스</text>
    <text x="1540" y="867" font-size="16" fill="#5C6B6B" text-anchor="end">© Mokaair 제작 2026</text>
  </g>
</svg>
