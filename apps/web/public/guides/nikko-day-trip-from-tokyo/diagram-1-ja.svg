<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" lang="ja" xml:lang="ja" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans',system-ui,sans-serif">
  <title id="title">浅草 → 東武日光 → 東照宮 → 中禅寺湖 日帰りルート</title>
  <desc id="desc">左側は浅草から東武特急スペーシア Xで東武日光駅まで約1時間50分（運賃1,400円＋特急料金1,940円、けごんは特急料金1,650円、全車指定席・1か月前発売）で、上部にNIKKO PASS（世界遺産エリア2日間3,000円・オールエリア4日間8,000円、浅草⇄下今市往復運賃と対象エリアの東武バス込み・特急券別売）を併記しています。中央の世界遺産エリアは世界遺産めぐりバス（1日手形600円、東武日光駅→表参道約8分）で神橋（渡橋料300円）・東照宮（拝観料1,600円）・二荒山神社（神苑300円）・輪王寺（大猷院550円）を結びます。右側はバスでいろは坂（48カーブ・通常時上り約20分）を上り、東武日光駅から約50分・1,250円で中禅寺温泉へ到着し、徒歩で華厳の滝（バス停から徒歩約5分・エレベーター往復600円）と中禅寺湖遊覧船（1周約55分）へアクセスする流れです。下部には中禅寺温泉発20:02→東武日光駅着20:38の最終バス（2026年4月〜11月ダイヤ）を記載しています。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="72" font-size="38" font-weight="700" fill="#102A2B">浅草 → 東武日光 → 東照宮 → 中禅寺湖　日帰りルート</text>
  <text x="60" y="112" font-size="20" fill="#5C6B6B">大人運賃・料金／2026年9月確認（最新情報は公式サイトをご確認ください）・実線：鉄道／破線：バス</text>

  <!-- NIKKO PASS note -->
  <rect x="60" y="150" width="760" height="96" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="84" y="188" font-size="20" font-weight="700" fill="#0D6B68">NIKKO PASS：世界遺産エリア2日間 3,000円・オールエリア4日間 8,000円</text>
  <text x="84" y="222" font-size="18" fill="#5C6B6B">浅草⇄下今市の往復運賃と対象エリアの東武バス込み（特急券は別売）</text>

  <!-- Rail: Asakusa -> Tobu-Nikko -->
  <line x1="260" y1="615" x2="470" y2="615" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <text x="365" y="494" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">スペーシア X 約1時間50分</text>
  <text x="365" y="526" font-size="18" fill="#5C6B6B" text-anchor="middle">運賃1,400円＋特急料金1,940円（けごん1,650円）</text>
  <text x="365" y="705" font-size="18" fill="#5C6B6B" text-anchor="middle">全車指定席・特急券は1か月前発売</text>
  <rect x="60" y="560" width="200" height="110" rx="22" fill="#0D6B68"/>
  <text x="160" y="612" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">浅草</text>
  <text x="160" y="646" font-size="18" fill="#E6F2F1" text-anchor="middle">東武浅草駅</text>
  <rect x="470" y="560" width="200" height="110" rx="22" fill="#6B4A3A"/>
  <text x="570" y="612" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">東武日光</text>
  <text x="570" y="646" font-size="18" fill="#F1E8E2" text-anchor="middle">東武日光駅</text>

  <!-- World heritage area -->
  <rect x="720" y="420" width="465" height="320" rx="26" fill="#FFFFFF" fill-opacity="0.55" stroke="#2E7D5B" stroke-width="3"/>
  <text x="742" y="454" font-size="22" font-weight="700" fill="#2E7D5B">世界遺産エリア</text>
  <text x="742" y="482" font-size="18" fill="#5C6B6B">世界遺産めぐりバス 1日手形 600円</text>
  <text x="742" y="508" font-size="18" fill="#5C6B6B">東武日光駅 → 表参道 約8分</text>
  <path d="M 670 615 L 1185 615" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#B8442D" stroke-width="6">
    <circle cx="785" cy="615" r="14"/>
    <circle cx="895" cy="615" r="14"/>
    <circle cx="1010" cy="615" r="14"/>
    <circle cx="1115" cy="615" r="14"/>
  </g>
  <text x="785" y="662" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">神橋</text>
  <text x="785" y="688" font-size="18" fill="#5C6B6B" text-anchor="middle">渡橋料 300円</text>
  <text x="895" y="556" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">東照宮</text>
  <text x="895" y="582" font-size="18" fill="#5C6B6B" text-anchor="middle">拝観料 1,600円</text>
  <text x="1010" y="662" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">二荒山神社</text>
  <text x="1010" y="688" font-size="18" fill="#5C6B6B" text-anchor="middle">神苑 300円</text>
  <text x="1115" y="556" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">輪王寺</text>
  <text x="1115" y="582" font-size="18" fill="#5C6B6B" text-anchor="middle">大猷院 550円</text>

  <!-- Bus up Irohazaka to Chuzenji -->
  <path d="M 1185 615 C 1295 615, 1245 330, 1310 330" stroke="#6B4A3A" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <text x="1245" y="372" font-size="22" font-weight="700" fill="#6B4A3A" text-anchor="end">いろは坂</text>
  <text x="1245" y="400" font-size="18" fill="#5C6B6B" text-anchor="end">48カーブ・通常時上り約20分</text>
  <text x="1275" y="590" font-size="18" fill="#6B4A3A" font-weight="700">バス約50分・1,250円</text>

  <!-- Okunikko -->
  <text x="1140" y="200" font-size="22" font-weight="700" fill="#2E7D5B">奥日光エリア</text>
  <circle cx="1310" cy="330" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7"/>
  <text x="1282" y="322" font-size="22" font-weight="700" fill="#102A2B" text-anchor="end">中禅寺温泉</text>
  <line x1="1324" y1="322" x2="1446" y2="250" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <line x1="1324" y1="338" x2="1446" y2="392" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="1460" cy="240" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1460" y="190" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">中禅寺湖 遊覧船</text>
  <text x="1460" y="218" font-size="18" fill="#5C6B6B" text-anchor="middle">1周 約55分</text>
  <circle cx="1460" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1460" y="446" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">華厳の滝</text>
  <text x="1460" y="472" font-size="18" fill="#5C6B6B" text-anchor="middle">エレベーター往復600円</text>
  <text x="1460" y="498" font-size="18" fill="#5C6B6B" text-anchor="middle">バス停から徒歩約5分</text>

  <!-- Last bus -->
  <text x="680" y="800" font-size="18" font-weight="700" fill="#B8442D">最終バス：中禅寺温泉 20:02発 → 東武日光駅 20:38着（2026年4月〜11月ダイヤ・公式サイト確認）</text>

  <!-- Legend -->
  <g font-size="19" fill="#102A2B">
    <line x1="60" y1="860" x2="120" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="132" y="867">東武鉄道</text>
    <line x1="270" y1="860" x2="330" y2="860" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="342" y="867">世界遺産めぐりバス</text>
    <line x1="570" y1="860" x2="630" y2="860" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="642" y="867">中禅寺温泉・湯元温泉線バス</text>
    <text x="1560" y="867" font-size="17" fill="#5C6B6B" text-anchor="end">© Mokaair 制作 2026</text>
  </g>
</svg>
