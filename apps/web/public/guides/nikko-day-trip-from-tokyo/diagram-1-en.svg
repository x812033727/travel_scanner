<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" lang="en" xml:lang="en" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Noto Sans CJK JP','Noto Sans JP',system-ui,sans-serif">
  <title id="title">Asakusa to Nikko Day-Trip Route Map</title>
  <desc id="desc">Left: Tobu Limited Express SPACIA X runs from Asakusa to Tobu-Nikko Station in about 1 hr 50 min (¥1,400 base fare plus ¥1,940 limited express surcharge; Kegon ¥1,650; all seats reserved, sales open 1 month ahead). Top box notes NIKKO PASS pricing: 2-day World Heritage Area ¥3,000 and 4-day All Area ¥8,000 (includes Asakusa–Shimo-Imaichi round-trip base fare and designated Tobu buses; express ticket extra). Center: World Heritage Sightseeing Bus (1-day pass ¥600; ~8 min to Omotesando) links Shinkyo (¥300 to cross), Toshogu (¥1,600 admission), Futarasan Shrine (¥300 Shinen Garden), and Rinnoji (¥550 Taiyuin). Right: Tobu Bus climbs 48-hairpin Irohazaka (~20 min uphill normally; ~50 min total from Tobu-Nikko Station, ¥1,250) to Chuzenji Onsen in Okunikko, connecting to Kegon Falls (5-min walk; ¥600 round-trip elevator) and the Lake Chuzenji sightseeing cruise (~55 min loop). Bottom note: last bus from Chuzenji Onsen to Tobu-Nikko Station departs at 20:02 and arrives at 20:38 (April–November 2026 timetable).</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="56" y="68" font-size="34" font-weight="700" fill="#102A2B">Asakusa → Tobu-Nikko → Toshogu → Lake Chuzenji Day-Trip Route</text>
  <text x="56" y="106" font-size="19" fill="#5C6B6B">Adult fares · Verified Sep 2026 · Check official timetables · Solid = Tobu Railway, dashed = Tobu Bus</text>

  <!-- NIKKO PASS note -->
  <rect x="56" y="138" width="760" height="92" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="78" y="174" font-size="19" font-weight="700" fill="#0D6B68">NIKKO PASS: 2-Day World Heritage ¥3,000 · 4-Day All Area ¥8,000</text>
  <text x="78" y="206" font-size="16" fill="#5C6B6B">Covers Asakusa ⇄ Shimo-Imaichi round-trip base fare + zone buses; express ticket extra</text>

  <!-- Rail: Asakusa -> Tobu-Nikko -->
  <line x1="220" y1="597" x2="430" y2="597" stroke="#0D6B68" stroke-width="11" stroke-linecap="round"/>
  <text x="325" y="476" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">SPACIA X · ~1 hr 50 min</text>
  <text x="325" y="504" font-size="16" fill="#5C6B6B" text-anchor="middle">¥1,400 base + ¥1,940 express</text>
  <text x="325" y="528" font-size="16" fill="#5C6B6B" text-anchor="middle">(Kegon express ¥1,650)</text>
  <text x="325" y="676" font-size="16" fill="#5C6B6B" text-anchor="middle">All seats reserved</text>
  <text x="325" y="700" font-size="16" fill="#5C6B6B" text-anchor="middle">Sales open 1 month ahead</text>
  <rect x="56" y="545" width="164" height="104" rx="20" fill="#0D6B68"/>
  <text x="138" y="592" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Asakusa</text>
  <text x="138" y="622" font-size="16" fill="#E6F2F1" text-anchor="middle">Tobu Station</text>
  <rect x="430" y="545" width="176" height="104" rx="20" fill="#6B4A3A"/>
  <text x="518" y="592" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tobu-Nikko</text>
  <text x="518" y="622" font-size="16" fill="#F1E8E2" text-anchor="middle">Station</text>

  <!-- World Heritage Area -->
  <rect x="650" y="405" width="520" height="335" rx="24" fill="#FFFFFF" fill-opacity="0.6" stroke="#2E7D5B" stroke-width="3"/>
  <text x="674" y="440" font-size="21" font-weight="700" fill="#2E7D5B">World Heritage Area</text>
  <text x="674" y="468" font-size="16" fill="#5C6B6B">World Heritage Sightseeing Bus · 1-day pass ¥600</text>
  <text x="674" y="492" font-size="16" fill="#5C6B6B">Tobu-Nikko Sta. → Omotesando ~8 min</text>
  <path d="M 606 597 L 1170 597" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#B8442D" stroke-width="6">
    <circle cx="718" cy="597" r="14"/>
    <circle cx="846" cy="597" r="14"/>
    <circle cx="974" cy="597" r="14"/>
    <circle cx="1102" cy="597" r="14"/>
  </g>
  <text x="718" y="644" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Shinkyo</text>
  <text x="718" y="668" font-size="16" fill="#5C6B6B" text-anchor="middle">Cross ¥300</text>
  <text x="846" y="540" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Toshogu</text>
  <text x="846" y="564" font-size="16" fill="#5C6B6B" text-anchor="middle">Entry ¥1,600</text>
  <text x="974" y="644" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Futarasan</text>
  <text x="974" y="668" font-size="16" fill="#5C6B6B" text-anchor="middle">Garden ¥300</text>
  <text x="1102" y="540" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Rinnoji</text>
  <text x="1102" y="564" font-size="16" fill="#5C6B6B" text-anchor="middle">Taiyuin ¥550</text>

  <!-- Bus up Irohazaka to Chuzenji -->
  <path d="M 1170 597 C 1270 597, 1220 330, 1285 330" stroke="#6B4A3A" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <text x="1210" y="352" font-size="20" font-weight="700" fill="#6B4A3A" text-anchor="end">Irohazaka Road</text>
  <text x="1210" y="378" font-size="16" fill="#5C6B6B" text-anchor="end">48 curves · ~20 min uphill normally</text>
  <text x="1256" y="576" font-size="17" font-weight="700" fill="#6B4A3A">Tobu Bus · ~50 min</text>
  <text x="1256" y="600" font-size="16" fill="#5C6B6B">¥1,250 one-way</text>

  <!-- Okunikko -->
  <text x="1150" y="178" font-size="22" font-weight="700" fill="#2E7D5B">Okunikko</text>
  <circle cx="1285" cy="330" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7"/>
  <text x="1260" y="292" font-size="20" font-weight="700" fill="#102A2B" text-anchor="end">Chuzenji Onsen</text>
  <line x1="1300" y1="322" x2="1431" y2="253" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <line x1="1300" y1="338" x2="1431" y2="397" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="1445" cy="245" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1445" y="190" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Lake Chuzenji Cruise</text>
  <text x="1445" y="216" font-size="16" fill="#5C6B6B" text-anchor="middle">~55-min loop</text>
  <circle cx="1445" cy="405" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1445" y="452" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Kegon Falls</text>
  <text x="1445" y="478" font-size="16" fill="#5C6B6B" text-anchor="middle">Elevator ¥600 round-trip</text>
  <text x="1445" y="502" font-size="16" fill="#5C6B6B" text-anchor="middle">~5-min walk from bus stop</text>

  <!-- Last bus -->
  <text x="650" y="794" font-size="17" font-weight="700" fill="#B8442D">Last bus: Chuzenji Onsen 20:02 → Tobu-Nikko Sta. 20:38 (Apr–Nov 2026 timetable)</text>

  <!-- Legend -->
  <g font-size="17" fill="#102A2B">
    <line x1="56" y1="856" x2="112" y2="856" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="124" y="862">Tobu Railway</text>
    <line x1="275" y1="856" x2="331" y2="856" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="343" y="862">World Heritage Sightseeing Bus</text>
    <line x1="645" y1="856" x2="701" y2="856" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="713" y="862">Chuzenji / Yumoto Onsen Bus</text>
    <text x="1544" y="862" font-size="16" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
  </g>
</svg>
