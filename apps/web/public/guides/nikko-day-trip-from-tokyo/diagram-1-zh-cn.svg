<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','Noto Sans CJK JP','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">浅草到日光一日路线图 / Asakusa to Nikko day trip route</title>
  <desc id="desc">左侧为从浅草搭乘东武特急 SPACIA X 约 1 小时 50 分钟抵达东武日光站，基础车费 1,400 日元加特急费 1,940 日元（けごん为 1,650 日元）；中间的世界遗产区通过世界遗产巡回巴士（一日通票 600 日元，到表参道约 8 分钟）串联神桥、东照宫、二荒山神社、轮王寺，并分别标出门票；右侧为巴士沿伊吕波坂（48 个弯道、平时上山约 20 分钟）行驶约 50 分钟、1,250 日元至中禅寺温泉，再前往华严瀑布（观瀑电梯往返 600 日元、巴士站步行约 5 分钟）与中禅寺湖游览船（环湖约 55 分钟）；上方附 NIKKO PASS 价格说明，下方注明中禅寺温泉开往东武日光站的末班巴士为 20:02 发车、20:38 到站。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="72" font-size="40" font-weight="700" fill="#102A2B">浅草 → 东武日光 → 东照宫 → 中禅寺湖　一日路线</text>
  <text x="60" y="112" font-size="22" fill="#5C6B6B">Asakusa → Nikko Day Trip · 成人票价，2026 年 9 月核实，以官网为准 · 实线铁路、虚线巴士</text>

  <!-- NIKKO PASS note -->
  <rect x="60" y="150" width="720" height="96" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="84" y="188" font-size="20" font-weight="700" fill="#0D6B68">NIKKO PASS：世界遗产区 2 日券 3,000 日元 · 全区 4 日券 8,000 日元</text>
  <text x="84" y="222" font-size="19" fill="#5C6B6B">含浅草 ⇄ 下今市往返基础车费与范围内东武巴士，特急券需另购</text>

  <!-- Rail: Asakusa -> Tobu-Nikko -->
  <line x1="260" y1="615" x2="470" y2="615" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <text x="365" y="500" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">SPACIA X 约 1 小时 50 分钟</text>
  <text x="365" y="532" font-size="18" fill="#5C6B6B" text-anchor="middle">基础车费 1,400 ＋ 特急费 1,940 日元（けごん 1,650）</text>
  <text x="365" y="705" font-size="18" fill="#5C6B6B" text-anchor="middle">全车指定席 · 特急券提前 1 个月开售</text>
  <rect x="60" y="560" width="200" height="110" rx="22" fill="#0D6B68"/>
  <text x="160" y="607" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">浅草</text>
  <text x="160" y="642" font-size="20" fill="#E6F2F1" text-anchor="middle">Asakusa</text>
  <rect x="470" y="560" width="200" height="110" rx="22" fill="#6B4A3A"/>
  <text x="570" y="607" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">东武日光</text>
  <text x="570" y="642" font-size="20" fill="#F1E8E2" text-anchor="middle">Tobu-Nikko Sta.</text>

  <!-- World heritage area -->
  <rect x="720" y="420" width="490" height="320" rx="26" fill="#FFFFFF" fill-opacity="0.55" stroke="#2E7D5B" stroke-width="3"/>
  <text x="744" y="454" font-size="22" font-weight="700" fill="#2E7D5B">世界遗产区 World Heritage Area</text>
  <text x="744" y="482" font-size="18" fill="#5C6B6B">世界遗产巡回巴士一日通票 600 日元</text>
  <text x="744" y="508" font-size="18" fill="#5C6B6B">东武日光站 → 表参道 约 8 分钟</text>
  <path d="M 670 615 L 1210 615" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#B8442D" stroke-width="6">
    <circle cx="795" cy="615" r="14"/>
    <circle cx="910" cy="615" r="14"/>
    <circle cx="1025" cy="615" r="14"/>
    <circle cx="1126" cy="615" r="14"/>
  </g>
  <text x="795" y="662" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">神桥 Shinkyo</text>
  <text x="795" y="688" font-size="18" fill="#5C6B6B" text-anchor="middle">过桥 300 日元</text>
  <text x="910" y="556" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">东照宫 Toshogu</text>
  <text x="910" y="582" font-size="18" fill="#5C6B6B" text-anchor="middle">门票 1,600 日元</text>
  <text x="1025" y="662" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">二荒山神社 Futarasan</text>
  <text x="1025" y="688" font-size="18" fill="#5C6B6B" text-anchor="middle">神苑 300 日元</text>
  <text x="1126" y="556" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">轮王寺 Rinnoji</text>
  <text x="1126" y="582" font-size="18" fill="#5C6B6B" text-anchor="middle">大猷院 550 日元</text>

  <!-- Bus up Irohazaka to Chuzenji -->
  <path d="M 1210 615 C 1315 615, 1265 330, 1330 330" stroke="#6B4A3A" stroke-width="9" stroke-dasharray="20 14" fill="none" stroke-linecap="round"/>
  <text x="1265" y="372" font-size="22" font-weight="700" fill="#6B4A3A" text-anchor="end">伊吕波坂 Irohazaka</text>
  <text x="1265" y="400" font-size="18" fill="#5C6B6B" text-anchor="end">48 个弯道 · 平时上山约 20 分钟</text>
  <text x="1295" y="590" font-size="18" fill="#6B4A3A" font-weight="700">巴士约 50 分钟 · 1,250 日元</text>

  <!-- Okunikko -->
  <text x="1170" y="200" font-size="22" font-weight="700" fill="#2E7D5B">奥日光 Okunikko</text>
  <circle cx="1330" cy="330" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7"/>
  <text x="1300" y="322" font-size="22" font-weight="700" fill="#102A2B" text-anchor="end">中禅寺温泉 Chuzenji Onsen</text>
  <line x1="1344" y1="322" x2="1471" y2="250" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <line x1="1344" y1="338" x2="1471" y2="392" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="1485" cy="240" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1485" y="190" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">中禅寺湖 游览船</text>
  <text x="1485" y="218" font-size="18" fill="#5C6B6B" text-anchor="middle">环湖约 55 分钟</text>
  <circle cx="1485" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1485" y="446" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">华严瀑布 Kegon</text>
  <text x="1485" y="472" font-size="18" fill="#5C6B6B" text-anchor="middle">电梯往返 600 日元</text>
  <text x="1485" y="498" font-size="18" fill="#5C6B6B" text-anchor="middle">巴士站步行约 5 分钟</text>

  <!-- Last bus -->
  <text x="720" y="800" font-size="18" font-weight="700" fill="#B8442D">末班巴士：中禅寺温泉 20:02 发 → 东武日光站 20:38 到（2026 年 4 月至 11 月时刻表，以官网为准）</text>

  <!-- Legend -->
  <g font-size="19" fill="#102A2B">
    <line x1="60" y1="860" x2="120" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="132" y="867" font-size="19">东武铁道 Tobu Railway</text>
    <line x1="395" y1="860" x2="455" y2="860" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="467" y="867" font-size="19">世界遗产巡回巴士 World Heritage Bus</text>
    <line x1="875" y1="860" x2="935" y2="860" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="947" y="867" font-size="19">中禅寺温泉·汤元温泉线巴士 Bus</text>
    <text x="1560" y="867" font-size="17" fill="#5C6B6B" text-anchor="end">© Mokaair 制图 2026</text>
  </g>
</svg>
