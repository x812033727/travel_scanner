<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif"><title id="t">舊左與細花海邊咖啡店特色示意圖</title><desc id="d">圖上的標題是「舊左・細花海邊咖啡店特色示意圖」，副標是「示意圖，非比例・照地址的路名標」。一條標著「細花海」的藍色海岸線橫過圖面，四家店在線的上方排成四張卡片，每張寫店名、地址的路名與類型：카페공작소（해맞이해안로）標「海景・網美」，카페한라산（면수1길）標「海景・網美」，미엘드세화（해맞이해안로）標「海景」，달치즈 구좌세화점（해녀박물관길）標「網美」。左下角的圖例列出兩個類型：藍色的海景與橘色的網美，下面一行註明店名與路名照韓文寫，方便對照招牌與地圖。最下面一行是「資料：Visit Jeju・© Mokaair 製圖 2026」。</desc><rect width="1600" height="900" fill="#f3f4ed"/><text x="800" y="70" text-anchor="middle" font-size="36" font-weight="bold" fill="#193d45">舊左・細花海邊咖啡店特色示意圖</text><text x="800" y="105" text-anchor="middle" font-size="20" fill="#526671">示意圖，非比例・照地址的路名標</text><path d="M90 505 C330 430 560 550 800 470 S1220 410 1510 500" fill="none" stroke="#4b9cc1" stroke-width="38"/><text x="800" y="515" text-anchor="middle" font-size="25" fill="#193d45">細花海</text><g fill="#fff" stroke="#193d45" stroke-width="3"><rect x="80" y="205" width="265" height="150" rx="18"/><rect x="380" y="205" width="265" height="150" rx="18"/><rect x="680" y="205" width="265" height="150" rx="18"/><rect x="980" y="205" width="265" height="150" rx="18"/></g><g text-anchor="middle" fill="#193d45"><text x="212" y="255" font-size="25" font-weight="bold">카페공작소</text><text x="212" y="295" font-size="18">해맞이해안로</text><text x="212" y="330" font-size="18">海景・網美</text><text x="512" y="255" font-size="25" font-weight="bold">카페한라산</text><text x="512" y="295" font-size="18">면수1길</text><text x="512" y="330" font-size="18">海景・網美</text><text x="812" y="255" font-size="25" font-weight="bold">미엘드세화</text><text x="812" y="295" font-size="18">해맞이해안로</text><text x="812" y="330" font-size="18">海景</text><text x="1112" y="255" font-size="23" font-weight="bold">달치즈 구좌세화점</text><text x="1112" y="295" font-size="18">해녀박물관길</text><text x="1112" y="330" font-size="18">網美</text></g><text x="100" y="650" font-size="25" font-weight="bold" fill="#193d45">圖例</text><circle cx="135" cy="700" r="13" fill="#3e8fb2"/><text x="165" y="708" font-size="22" fill="#193d45">海景</text><circle cx="320" cy="700" r="13" fill="#db7e42"/><text x="350" y="708" font-size="22" fill="#193d45">網美</text><text x="100" y="775" font-size="21" fill="#193d45">店名與路名照韓文寫，方便對照招牌與地圖</text><text x="100" y="830" font-size="19" fill="#193d45">資料：Visit Jeju・© Mokaair 製圖 2026</text></svg>
