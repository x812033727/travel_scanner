<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif"><title id="t">舊左與細花海邊咖啡店官方特色示意圖</title><desc id="d">示意圖，非比例。四家店依官方文字支持的海景和空間特色排列；沒有咖啡品質或韓屋標籤。</desc><rect width="1600" height="900" fill="#f3f4ed"/><text x="800" y="70" text-anchor="middle" font-size="36" font-weight="bold" fill="#193d45">舊左・細花海邊咖啡店官方特色示意圖</text><text x="800" y="105" text-anchor="middle" font-size="20" fill="#526671">示意圖，非比例・只標官方頁寫得出的特色</text><path d="M90 505 C330 430 560 550 800 470 S1220 410 1510 500" fill="none" stroke="#4b9cc1" stroke-width="38"/><text x="800" y="515" text-anchor="middle" font-size="25" fill="#193d45">細花海</text><g fill="#fff" stroke="#193d45" stroke-width="3"><rect x="80" y="205" width="265" height="150" rx="18"/><rect x="380" y="205" width="265" height="150" rx="18"/><rect x="680" y="205" width="265" height="150" rx="18"/><rect x="980" y="205" width="265" height="150" rx="18"/></g><g text-anchor="middle" fill="#193d45"><text x="212" y="255" font-size="25" font-weight="bold">카페공작소</text><text x="212" y="295" font-size="18">해맞이해안로</text><text x="212" y="330" font-size="18">海景・網美</text><text x="512" y="255" font-size="25" font-weight="bold">카페한라산</text><text x="512" y="295" font-size="18">면수1길</text><text x="512" y="330" font-size="18">海景・網美</text><text x="812" y="255" font-size="25" font-weight="bold">미엘드세화</text><text x="812" y="295" font-size="18">해맞이해안로</text><text x="812" y="330" font-size="18">海景</text><text x="1112" y="255" font-size="23" font-weight="bold">달치즈 구좌세화점</text><text x="1112" y="295" font-size="18">해녀박물관길</text><text x="1112" y="330" font-size="18">網美</text></g><text x="100" y="650" font-size="25" font-weight="bold" fill="#193d45">圖例</text><circle cx="135" cy="700" r="13" fill="#3e8fb2"/><text x="165" y="708" font-size="22" fill="#193d45">海景：官方寫明看得到海</text><circle cx="610" cy="700" r="13" fill="#db7e42"/><text x="640" y="708" font-size="22" fill="#193d45">網美：官方描述具體空間特色</text><text x="100" y="775" font-size="21" fill="#193d45">官方文字未支持咖啡品質或韓屋標籤；달치즈頁寫구옥，不寫한옥。</text><text x="100" y="830" font-size="19" fill="#193d45">資料：Visit Jeju 官方頁，2026 年 9 月查證。 © Mokaair</text></svg>
