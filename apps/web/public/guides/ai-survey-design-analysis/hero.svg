<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">問卷設計與開放題整理 / Designing a survey and sorting open-ended answers</title>
<desc id="desc">米色底插圖。左邊是一張白色問卷卡，藍色框線，上面有一列打勾的方框、一列空白方框、五個等大的圓圈組成的評分量表（中間一個填滿），以及一個寫著幾行字的開放題作答框。一條橘色虛線箭頭從作答框彎向右上方，那裡是六個顏色混雜的對話框；三支深色箭頭往下指向三個同樣大小的托盤，分別是青綠、藍、橘色，各裝著三條同色的圓角長條，代表分好類的回覆；右邊托盤前有一支橘色放大鏡，代表人工抽查。底部一行字：問卷設計與開放題整理。</desc>
