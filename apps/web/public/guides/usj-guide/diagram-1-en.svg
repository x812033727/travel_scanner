<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Universal Studios Japan Ticket Decision Tree and One-Day Itinerary</title>
  <desc id="desc">Left—ticket decision: first buy a dated Studio Pass; adult one-day passes start at 8,400 yen. Question one: must you enter SUPER NINTENDO WORLD without gambling on a timed-entry ticket? If yes, buy an Express Pass bundle with guaranteed area entry; check its listed attractions, entry time, and price for your date. Otherwise, question two: want shorter waits for popular attractions? If yes, buy an Express Pass bundle without guaranteed entry and use an APP timed-entry ticket for SUPER NINTENDO WORLD. If not, buy only a Studio Pass and use the official APP immediately after admission to get a timed-entry ticket, once per day; when they run out, tickets are issued by lottery. Right—suggested itinerary: reach the gate 60 to 90 minutes before opening; September (9): gates open from 8:00 to 9:00 and may open earlier. Clear security and store suitcases in lockers outside. Register everyone’s tickets in the APP and get a timed-entry ticket. While waiting, ride Forbidden Journey or The Flying Dinosaur. Eat lunch before 11 o’clock. Enter SUPER NINTENDO WORLD at your assigned time for Mario Kart, Mine Cart Madness, and Yoshi’s Adventure. See an evening show, photograph the castle at night, and buy souvenirs one hour before closing. September (9): gates close from 21:00 to 22:00.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">USJ Tickets &amp; One-Day Plan (2026/9 prices)</text>


  <text x="80" y="92" font-size="20" font-weight="700" fill="#102A2B">Ticket Decision</text>
  <rect x="80" y="104" width="640" height="56" rx="28" fill="#2E7D5B"></rect>
  <text x="400" y="139" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">First buy a dated Studio Pass: adult 1-day passes from 8,400 yen</text>
  <path d="M 400 162 L 400 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>

  <polygon points="400,200 640,262 400,324 160,262" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="400" y="255" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">1 · Enter Nintendo World for sure?</text>
  <text x="400" y="281" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Without relying on timed entry?</text>


  <path d="M 640 262 L 700 262 L 700 344" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="652" y="254" font-size="17" fill="#5C6B6B">Yes</text>
  <rect x="470" y="348" width="300" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="620" y="378" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">Buy an Express Pass bundle</text>
  <text x="620" y="402" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">with guaranteed area entry</text>
  <text x="620" y="430" font-size="15" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">Check rides, entry time, price</text>


  <path d="M 160 262 L 100 262 L 100 486 L 64 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="112" y="254" font-size="17" fill="#5C6B6B">No</text>
  <polygon points="250,426 430,486 250,546 70,486" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="250" y="480" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">2 · Want shorter waits?</text>
  <text x="250" y="504" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">For popular rides?</text>


  <path d="M 430 486 L 466 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="438" y="478" font-size="16" fill="#5C6B6B">Yes</text>
  <rect x="470" y="464" width="300" height="96" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="620" y="494" font-size="15" font-weight="700" fill="#1F4E73" text-anchor="middle" style="font-size: 15px;">Express Pass; no guaranteed entry</text>
  <text x="620" y="518" font-size="15" fill="#1F4E73" text-anchor="middle">Price depends on date and bundle</text>
  <text x="620" y="542" font-size="15" fill="#1F4E73" text-anchor="middle">APP ticket for Nintendo World</text>


  <path d="M 250 548 L 250 584" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="262" y="574" font-size="16" fill="#5C6B6B">No</text>
  <rect x="80" y="588" width="340" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"></rect>
  <text x="250" y="618" font-size="17" font-weight="700" fill="#1F5C42" text-anchor="middle">Buy only a Studio Pass</text>
  <text x="250" y="642" font-size="15" fill="#1F5C42" text-anchor="middle">Get APP timed entry after admission</text>
  <text x="250" y="666" font-size="15" fill="#1F5C42" text-anchor="middle">One daily; then lottery (apply 1 hour prior)</text>

  <text x="80" y="730" font-size="15" fill="#5C6B6B">Express Pass needs a separate dated Studio Pass; prices vary; popular dates sell out.</text>
  <text x="80" y="754" font-size="15" fill="#5C6B6B">From 2026/1/5: APP-only entry/lottery. From 9/1: dated Studio Pass.</text>
  <text x="80" y="778" font-size="15" fill="#5C6B6B">1.5-day from 13,600 yen (entry 15:00); 2-day from 16,000 yen.</text>


  <line x1="820" y1="80" x2="820" y2="800" stroke="#B9B2A8" stroke-width="2"></line>
  <text x="900" y="92" font-size="20" font-weight="700" fill="#102A2B">Suggested One-Day Itinerary</text>
  <path d="M 900 130 L 900 760" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"></path>

  <g font-size="17" fill="#102A2B">
    <circle cx="900" cy="140" r="22" fill="#0D6B68"></circle><text x="900" y="147" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="940" y="136" font-size="16">Arrive 60–90 min before opening</text>
    <text x="940" y="160" font-size="15" fill="#5C6B6B">September (9): 8:00–9:00; check early opening</text>

    <circle cx="900" cy="230" r="22" fill="#0D6B68"></circle><text x="900" y="237" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="940" y="226" font-size="16">Security: empty pockets; raise refillable bottles, hold PET bottles</text>
    <text x="940" y="250" font-size="15" fill="#5C6B6B">Outside lockers: 500–2,000 yen; or hotel</text>

    <circle cx="900" cy="320" r="22" fill="#B8442D"></circle><text x="900" y="327" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="940" y="316" font-weight="700">On entry, register all tickets in APP; get timed entry</text>
    <text x="940" y="340" font-size="15" fill="#5C6B6B">Express Pass: check guaranteed entry time</text>

    <circle cx="900" cy="410" r="22" fill="#0D6B68"></circle><text x="900" y="417" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="940" y="406" font-size="16">While waiting: Forbidden Journey, Flying Dinosaur</text>
    <text x="940" y="430" font-size="15" fill="#5C6B6B">Shorter morning queues; lunch before 11:00</text>

    <circle cx="900" cy="500" r="22" fill="#B8442D"></circle><text x="900" y="507" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="940" y="496" font-weight="700">Nintendo World at your assigned time</text>
    <text x="940" y="520" font-size="15" fill="#5C6B6B">Mario Kart → Mine Cart Madness → Yoshi’s Adventure → Power-Up Band challenges</text>

    <circle cx="900" cy="590" r="22" fill="#0D6B68"></circle><text x="900" y="597" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="940" y="586">Evening show; Hogwarts photos after dark</text>
    <text x="940" y="610" font-size="15" fill="#5C6B6B">Halloween (9/10–11/8): nighttime horror</text>

    <circle cx="900" cy="680" r="22" fill="#0D6B68"></circle><text x="900" y="687" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="940" y="676">Souvenirs 1 hour before closing</text>
    <text x="940" y="700" font-size="15" fill="#5C6B6B">September (9): 21:00–22:00; no re-entry</text>

    <circle cx="900" cy="760" r="22" fill="#102A2B"></circle><text x="900" y="767" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="940" y="766" font-size="16">JR Universal City → Osaka ~11 min; Tennoji ~13 min</text>
  </g>

  <text x="1400" y="880" font-size="15" fill="#5C6B6B">© Mokaair Illustration 2026</text>
</svg>
