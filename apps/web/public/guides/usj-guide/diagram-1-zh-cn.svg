<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本环球影城购票决策树与一日流程 / 日本环球影城票券决策树与一日游流程</title>
  <desc id="desc">左侧是购票决策：先购买指定日期的影城入场券，成人一日票 8,400 日元起。问题一：一定要进超级任天堂世界，而且不想碰运气领取号码券？如果是，就购买含区域入场保证的环球特快入场券组合，并确认票面列明的设施、时段和到访日期的价格。否则进入问题二：热门设施想少排队？如果是，就购买不含保证入场的特快券组合，任天堂世界改用 APP 号码券；如果不是，就只购买入场券，入园后立即通过官方 APP 领取号码券，一天一次，发完后改发抽签券。右侧是一天的建议流程：开园前 60 到 90 分钟抵达大门（9 月开园时间为 8:00 到 9:00，可能提前）；接受安检，将行李箱寄存在园外储物柜；入园后在 APP 登记全员票券并领取号码券；等待时段期间先排哈利波特禁忌之旅或飞天翼龙；11 点前吃午餐；依时段进入超级任天堂世界，游玩马力欧赛车、矿车、耀西冒险；傍晚看表演、拍摄城堡夜景，闭园前一小时购买纪念品；9 月闭园时间为 21:00 到 22:00。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">日本环球影城：先决定票券，再安排一天的顺序（价格经 2026 年 9 月查证）</text>


  <text x="80" y="92" font-size="20" font-weight="700" fill="#102A2B">购票决策</text>
  <rect x="80" y="104" width="640" height="56" rx="28" fill="#2E7D5B"></rect>
  <text x="400" y="139" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">先购买“指定日期”的影城入场券：成人 1 日票 8,400 日元起</text>
  <path d="M 400 162 L 400 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>

  <polygon points="400,200 640,262 400,324 160,262" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="400" y="255" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 1　一定要进超级任天堂世界，</text>
  <text x="400" y="281" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">而且不想碰运气领取号码券？</text>


  <path d="M 640 262 L 700 262 L 700 344" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="652" y="254" font-size="17" fill="#5C6B6B">是</text>
  <rect x="470" y="348" width="300" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="620" y="378" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">购买含“区域入场保证”的</text>
  <text x="620" y="402" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">环球特快入场券组合</text>
  <text x="620" y="430" font-size="15" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">确认设施、时段与当日价格</text>


  <path d="M 160 262 L 100 262 L 100 486 L 64 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="112" y="254" font-size="17" fill="#5C6B6B">否</text>
  <polygon points="250,426 430,486 250,546 70,486" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="250" y="480" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">问题 2　热门设施</text>
  <text x="250" y="504" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">想少排队？</text>


  <path d="M 430 486 L 466 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="438" y="478" font-size="16" fill="#5C6B6B">是</text>
  <rect x="470" y="464" width="300" height="96" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="620" y="494" font-size="16" font-weight="700" fill="#1F4E73" text-anchor="middle">也可购买不含保证入场的特快券</text>
  <text x="620" y="518" font-size="15" fill="#1F4E73" text-anchor="middle">价格依日期及组合浮动</text>
  <text x="620" y="542" font-size="15" fill="#1F4E73" text-anchor="middle">任天堂世界改用 APP 号码券</text>


  <path d="M 250 548 L 250 584" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="262" y="574" font-size="16" fill="#5C6B6B">否</text>
  <rect x="80" y="588" width="340" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"></rect>
  <text x="250" y="618" font-size="17" font-weight="700" fill="#1F5C42" text-anchor="middle">只购买入场券</text>
  <text x="250" y="642" font-size="15" fill="#1F5C42" text-anchor="middle">入园后立即通过官方 APP 领取号码券</text>
  <text x="250" y="666" font-size="15" fill="#1F5C42" text-anchor="middle" style="font-size: 15px;">每天一次；发完抽签（入场前 1 小时）</text>

  <text x="80" y="730" font-size="15" fill="#5C6B6B">特快券须另购入场券且仅在指定日期有效；价格依日期浮动，热门日期会提前售罄</text>
  <text x="80" y="754" font-size="15" fill="#5C6B6B">号码券、抽签券自 2026 年 1 月 5 日起只能通过官方 APP 领取；入场券自 9 月 1 日起必须指定日期</text>
  <text x="80" y="778" font-size="15" fill="#5C6B6B">1.5 日券 13,600 日元起（第一天 15:00 入园）、2 日券 16,000 日元起</text>


  <line x1="820" y1="80" x2="820" y2="800" stroke="#B9B2A8" stroke-width="2"></line>
  <text x="900" y="92" font-size="20" font-weight="700" fill="#102A2B">一天的建议流程</text>
  <path d="M 900 130 L 900 760" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"></path>

  <g font-size="17" fill="#102A2B">
    <circle cx="900" cy="140" r="22" fill="#0D6B68"></circle><text x="900" y="147" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="940" y="136">开园前 60 到 90 分钟抵达大门</text>
    <text x="940" y="160" font-size="15" fill="#5C6B6B">9 月公告的开园时间为 8:00 到 9:00，官网称可能提前开园</text>

    <circle cx="900" cy="230" r="22" fill="#0D6B68"></circle><text x="900" y="237" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="940" y="226">安检：清空口袋；水壶举过头，塑料饮料瓶手持</text>
    <text x="940" y="250" font-size="15" fill="#5C6B6B">将行李箱寄存在园外储物柜（500 到 2,000 日元）或酒店</text>

    <circle cx="900" cy="320" r="22" fill="#B8442D"></circle><text x="900" y="327" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="940" y="316" font-weight="700">入园后第一件事：在 APP 登记全员票券、领取号码券</text>
    <text x="940" y="340" font-size="15" fill="#5C6B6B">持特快券者查看票上的保证入场时段</text>

    <circle cx="900" cy="410" r="22" fill="#0D6B68"></circle><text x="900" y="417" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="940" y="406">等待时段：先排哈利波特禁忌之旅、飞天翼龙</text>
    <text x="940" y="430" font-size="15" fill="#5C6B6B">早上排队最短，11:00 前吃午餐</text>

    <circle cx="900" cy="500" r="22" fill="#B8442D"></circle><text x="900" y="507" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="940" y="496" font-weight="700">依时段进入超级任天堂世界</text>
    <text x="940" y="520" font-size="15" fill="#5C6B6B">马力欧赛车 → 咚奇刚的疯狂矿车 → 耀西冒险 → 能量手环挑战</text>

    <circle cx="900" cy="590" r="22" fill="#0D6B68"></circle><text x="900" y="597" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="940" y="586">傍晚观看水世界或街头表演，天黑后拍摄霍格华兹城堡</text>
    <text x="940" y="610" font-size="15" fill="#5C6B6B">万圣节季（9 月 10 日至 11 月 8 日）夜间有惊悚活动</text>

    <circle cx="900" cy="680" r="22" fill="#0D6B68"></circle><text x="900" y="687" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="940" y="676">闭园前 1 小时购买纪念品</text>
    <text x="940" y="700" font-size="15" fill="#5C6B6B">9 月闭园时间为 21:00 到 22:00；出园后不能再次入园</text>

    <circle cx="900" cy="760" r="22" fill="#102A2B"></circle><text x="900" y="767" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="940" y="766">从 JR 环球城站返回大阪站约 11 分钟、天王寺约 13 分钟</text>
  </g>

  <text x="1400" y="880" font-size="15" fill="#5C6B6B">© Mokaair 制图 2026</text>
</svg>
