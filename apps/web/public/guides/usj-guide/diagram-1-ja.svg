<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ユニバーサル・スタジオ・ジャパンのチケット購入判断と一日の流れ</title>
  <desc id="desc">左側はチケット購入の判断です。まず日付指定のスタジオ・パスを購入します。大人一日券は8,400円からです。問い一：スーパー・ニンテンドー・ワールドに必ず入り、整理券を運任せにしたくないですか？「はい」なら、エリア入場確約付きのエクスプレス・パスの組み合わせを購入し、券面の対象施設、入場時間、来場日の料金を確認します。「いいえ」なら問い二：人気施設の待ち時間を減らしたいですか？「はい」なら入場確約なしのエクスプレス・パスの組み合わせを購入し、ニンテンドー・ワールドはAPPの整理券を利用します。「いいえ」ならスタジオ・パスのみを購入し、入園後すぐに公式APPで整理券を取得します。取得は一日一回で、配布終了後は抽選券に切り替わります。右側は一日の推奨ルートです。開園の60～90分前にゲートへ到着します（9月の開園時間は8:00から9:00で、早まる場合があります）。手荷物検査を受け、スーツケースをパーク外のロッカーへ預けます。入園後、APPに全員分のチケットを登録して整理券を取得します。指定時間まではハリー・ポッター・アンド・ザ・フォービドゥン・ジャーニーかザ・フライング・ダイナソーへ行き、11時前に昼食を取ります。指定時間にスーパー・ニンテンドー・ワールドへ入り、マリオカート、トロッコ、ヨッシー・アドベンチャーを回ります。夕方はショーを見て城の夜景を撮影し、閉園一時間前にお土産を購入します。9月の閉園時間は21:00から22:00です。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ユニバーサル・スタジオ・ジャパン：先にチケットを決め、次に一日の順序を決める（2026年9月確認料金）</text>


  <text x="80" y="92" font-size="20" font-weight="700" fill="#102A2B">チケット選び</text>
  <rect x="80" y="104" width="640" height="56" rx="28" fill="#2E7D5B"></rect>
  <text x="400" y="139" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">まず「日付指定」のスタジオ・パスを購入：大人1デイ8,400円から</text>
  <path d="M 400 162 L 400 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>

  <polygon points="400,200 640,262 400,324 160,262" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="400" y="255" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問1　ニンテンドー・ワールドに</text>
  <text x="400" y="281" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">整理券なしで確実に入りたい？</text>


  <path d="M 640 262 L 700 262 L 700 344" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="652" y="254" font-size="17" fill="#5C6B6B">はい</text>
  <rect x="470" y="348" width="300" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="620" y="378" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">「エリア入場確約」付きの</text>
  <text x="620" y="402" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">入場確約付きエクスプレス・パス</text>
  <text x="620" y="430" font-size="15" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">対象施設・時間・当日料金を確認</text>


  <path d="M 160 262 L 100 262 L 100 486 L 64 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="112" y="254" font-size="17" fill="#5C6B6B">いいえ</text>
  <polygon points="250,426 430,486 250,546 70,486" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="250" y="480" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">質問2　人気アトラクションの</text>
  <text x="250" y="504" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">待ち時間を減らしたい？</text>


  <path d="M 430 486 L 466 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="438" y="478" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="470" y="464" width="300" height="96" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="620" y="494" font-size="15" font-weight="700" fill="#1F4E73" text-anchor="middle" style="font-size: 15px;">入場確約なしのエクスプレス・パス</text>
  <text x="620" y="518" font-size="15" fill="#1F4E73" text-anchor="middle">料金は日付と商品で変動</text>
  <text x="620" y="542" font-size="15" fill="#1F4E73" text-anchor="middle" style="font-size: 15px;">任天堂エリアはAPP整理券で入場</text>


  <path d="M 250 548 L 250 584" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="262" y="574" font-size="16" fill="#5C6B6B">いいえ</text>
  <rect x="80" y="588" width="340" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"></rect>
  <text x="250" y="618" font-size="17" font-weight="700" fill="#1F5C42" text-anchor="middle">スタジオ・パスのみ購入</text>
  <text x="250" y="642" font-size="15" fill="#1F5C42" text-anchor="middle">入園後すぐに公式APPで整理券を取得</text>
  <text x="250" y="666" font-size="15" fill="#1F5C42" text-anchor="middle" style="font-size: 15px;">一日一回、終了後は抽選（1時間前）</text>

  <text x="80" y="730" font-size="15" fill="#5C6B6B">エクスプレス・パスとは別にスタジオ・パスが必要で、指定日のみ有効。料金は日付により変動し、人気日は早期完売</text>
  <text x="80" y="754" font-size="15" fill="#5C6B6B">整理券・抽選券は2026年1月5日から公式APPでのみ取得可能。スタジオ・パスは9月1日から日付指定が必須</text>
  <text x="80" y="778" font-size="15" fill="#5C6B6B">1.5デイは13,600円から（初日は15:00入園）、2デイは16,000円から</text>


  <line x1="820" y1="80" x2="820" y2="800" stroke="#B9B2A8" stroke-width="2"></line>
  <text x="900" y="92" font-size="20" font-weight="700" fill="#102A2B">一日の推奨ルート</text>
  <path d="M 900 130 L 900 760" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"></path>

  <g font-size="17" fill="#102A2B">
    <circle cx="900" cy="140" r="22" fill="#0D6B68"></circle><text x="900" y="147" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="940" y="136">開園の60～90分前にゲートへ</text>
    <text x="940" y="160" font-size="15" fill="#5C6B6B">9月の告知開園時間は8:00から9:00。公式サイトでは早まる場合があると案内</text>

    <circle cx="900" cy="230" r="22" fill="#0D6B68"></circle><text x="900" y="237" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="940" y="226">手荷物検査：ポケットを空にし、水筒を頭上へ</text>
    <text x="940" y="250" font-size="15" fill="#5C6B6B">スーツケースはパーク外ロッカー（500～2,000円）かホテルへ</text>

    <circle cx="900" cy="320" r="22" fill="#B8442D"></circle><text x="900" y="327" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="940" y="316" font-weight="700">入園後すぐ：APPに全員分のチケットを登録し、整理券を取得</text>
    <text x="940" y="340" font-size="15" fill="#5C6B6B">エクスプレス・パス所持者は券面の入場確約時間を確認</text>

    <circle cx="900" cy="410" r="22" fill="#0D6B68"></circle><text x="900" y="417" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="940" y="406">指定時間まで：フォービドゥン・ジャーニー、ザ・フライング・ダイナソーへ</text>
    <text x="940" y="430" font-size="15" fill="#5C6B6B">朝は待ち時間が最短。11:00前に昼食</text>

    <circle cx="900" cy="500" r="22" fill="#B8442D"></circle><text x="900" y="507" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="940" y="496" font-weight="700">指定時間にスーパー・ニンテンドー・ワールドへ</text>
    <text x="940" y="520" font-size="15" fill="#5C6B6B" style="font-size: 15px;">マリオカート → トロッコ → ヨッシー → バンド</text>

    <circle cx="900" cy="590" r="22" fill="#0D6B68"></circle><text x="900" y="597" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="940" y="586">夕方はウォーターワールドかストリートショー、日没後はホグワーツ城を撮影</text>
    <text x="940" y="610" font-size="15" fill="#5C6B6B">ハロウィーン・シーズン（9月10日から11月8日）は夜にホラーイベントあり</text>

    <circle cx="900" cy="680" r="22" fill="#0D6B68"></circle><text x="900" y="687" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="940" y="676">閉園1時間前にお土産を購入</text>
    <text x="940" y="700" font-size="15" fill="#5C6B6B">9月の閉園は21:00から22:00。退園後は再入場不可</text>

    <circle cx="900" cy="760" r="22" fill="#102A2B"></circle><text x="900" y="767" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="940" y="766">JRユニバーサルシティ駅から大阪駅まで約11分、天王寺まで約13分</text>
  </g>

  <text x="1400" y="880" font-size="15" fill="#5C6B6B">© Mokaair 作成 2026</text>
</svg>
