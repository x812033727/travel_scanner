<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">유니버설 스튜디오 재팬 티켓 구매 결정 트리와 하루 동선 / 유니버설 스튜디오 재팬 티켓 구매 결정 트리와 하루 동선</title>
  <desc id="desc">왼쪽은 티켓 구매 결정입니다. 먼저 날짜 지정 스튜디오 패스를 구매하며, 성인 하루권은 8,400엔부터입니다. 질문 하나: 슈퍼 닌텐도 월드에 반드시 들어가야 하고 정리권 운에 맡기고 싶지 않은가요? 그렇다면 에어리어 입장 확약이 포함된 익스프레스 패스 구성을 구매하고 티켓에 표시된 어트랙션, 입장 시간과 방문일 가격을 확인하세요. 아니라면 질문 둘: 인기 어트랙션에서 덜 기다리고 싶은가요? 그렇다면 입장 확약이 없는 익스프레스 패스 조합을 구매하고 닌텐도 월드는 APP 정리권을 이용하세요. 아니라면 스튜디오 패스만 구매하고 입장 직후 공식 APP에서 정리권을 받으세요. 하루 한 번만 받을 수 있으며, 소진되면 추첨권으로 전환됩니다. 오른쪽은 권장 하루 동선입니다. 개장 60~90분 전에 게이트 도착(9월 개장 8:00~9:00, 조기 개장 가능), 보안 검색 후 여행용 가방은 파크 밖 물품 보관함에 맡기기, 입장 후 APP에 일행 전원의 티켓을 등록하고 정리권 받기, 지정 시간을 기다리는 동안 해리 포터 앤드 더 포비든 저니나 더 플라잉 다이노소어 먼저 타기, 11시 전에 점심 먹기, 지정 시간에 슈퍼 닌텐도 월드에 들어가 마리오 카트·동키콩의 크레이지 트램카™·요시 어드벤처 이용하기, 저녁에는 쇼를 보고 성의 야경을 촬영한 뒤 폐장 한 시간 전에 기념품 사기 순서입니다. 9월 폐장 시간은 21:00~22:00입니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">유니버설 스튜디오 재팬: 티켓을 먼저 정하고 하루 동선을 정하세요(2026년 9월 가격 확인)</text>


  <text x="80" y="92" font-size="20" font-weight="700" fill="#102A2B">티켓 선택</text>
  <rect x="80" y="104" width="640" height="56" rx="28" fill="#2E7D5B"></rect>
  <text x="400" y="139" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">먼저 ‘날짜 지정’ 스튜디오 패스 구매: 성인 1일권 8,400엔부터</text>
  <path d="M 400 162 L 400 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>

  <polygon points="400,200 640,262 400,324 160,262" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="400" y="255" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">질문 1　슈퍼 닌텐도 월드에 꼭 들어가고</text>
  <text x="400" y="281" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">정리권 운에 맡기고 싶지 않은가요?</text>


  <path d="M 640 262 L 700 262 L 700 344" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="652" y="254" font-size="17" fill="#5C6B6B">예</text>
  <rect x="470" y="348" width="300" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="620" y="378" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">에어리어 입장 확약이 있는</text>
  <text x="620" y="402" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">익스프레스 패스 구매</text>
  <text x="620" y="430" font-size="15" fill="#8A2E1D" text-anchor="middle">시설·입장 시간·당일 가격 확인</text>


  <path d="M 160 262 L 100 262 L 100 486 L 64 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="112" y="254" font-size="17" fill="#5C6B6B">아니요</text>
  <polygon points="250,426 430,486 250,546 70,486" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="250" y="480" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 2　인기 어트랙션</text>
  <text x="250" y="504" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">대기시간을 줄이고 싶은가요?</text>


  <path d="M 430 486 L 466 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="438" y="478" font-size="16" fill="#5C6B6B">예</text>
  <rect x="470" y="464" width="300" height="96" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="620" y="494" font-size="16" font-weight="700" fill="#1F4E73" text-anchor="middle">입장 확약 없는 익스프레스 패스도 가능</text>
  <text x="620" y="518" font-size="15" fill="#1F4E73" text-anchor="middle">가격은 날짜와 구성에 따라 변동</text>
  <text x="620" y="542" font-size="15" fill="#1F4E73" text-anchor="middle">닌텐도 월드는 APP 정리권 이용</text>


  <path d="M 250 548 L 250 584" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <text x="262" y="574" font-size="16" fill="#5C6B6B">아니요</text>
  <rect x="80" y="588" width="340" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"></rect>
  <text x="250" y="618" font-size="17" font-weight="700" fill="#1F5C42" text-anchor="middle">스튜디오 패스만 구매</text>
  <text x="250" y="642" font-size="15" fill="#1F5C42" text-anchor="middle">입장 직후 공식 APP에서 정리권 받기</text>
  <text x="250" y="666" font-size="15" fill="#1F5C42" text-anchor="middle" style="font-size: 15px;">하루 한 번; 이후 추첨(입장 1시간 전)</text>

  <text x="80" y="730" font-size="15" fill="#5C6B6B">익스프레스 패스에는 스튜디오 패스 별도 구매 필요, 지정일만 유효. 가격은 날짜별 변동, 인기 날짜는 조기 매진</text>
  <text x="80" y="754" font-size="15" fill="#5C6B6B">정리권·추첨권은 2026년 1월 5일부터 공식 APP에서만 수령. 스튜디오 패스는 9월 1일부터 날짜 지정 필수</text>
  <text x="80" y="778" font-size="15" fill="#5C6B6B">1.5일권 13,600엔부터(첫날 15:00 입장), 2일권 16,000엔부터</text>


  <line x1="820" y1="80" x2="820" y2="800" stroke="#B9B2A8" stroke-width="2"></line>
  <text x="900" y="92" font-size="20" font-weight="700" fill="#102A2B">하루 권장 동선</text>
  <path d="M 900 130 L 900 760" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"></path>

  <g font-size="17" fill="#102A2B">
    <circle cx="900" cy="140" r="22" fill="#0D6B68"></circle><text x="900" y="147" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="940" y="136">개장 60~90분 전에 게이트 도착</text>
    <text x="940" y="160" font-size="15" fill="#5C6B6B">9월 공지 개장 시간 8:00~9:00, 공식 홈페이지는 조기 개장 가능 안내</text>

    <circle cx="900" cy="230" r="22" fill="#0D6B68"></circle><text x="900" y="237" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="940" y="226">검색: 주머니 비우고, 물병은 머리 위·페트병은 손에</text>
    <text x="940" y="250" font-size="15" fill="#5C6B6B">여행용 가방은 파크 밖 물품 보관함(500~2,000엔) 또는 호텔에 보관</text>

    <circle cx="900" cy="320" r="22" fill="#B8442D"></circle><text x="900" y="327" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="940" y="316" font-weight="700">입장 후 우선 할 일: APP에 일행 전원 티켓 등록, 정리권 받기</text>
    <text x="940" y="340" font-size="15" fill="#5C6B6B">익스프레스 패스 소지자는 티켓의 입장 확약 시간 확인</text>

    <circle cx="900" cy="410" r="22" fill="#0D6B68"></circle><text x="900" y="417" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="940" y="406">시간 대기 중: 포비든 저니, 더 플라잉 다이노소어 먼저 이용</text>
    <text x="940" y="430" font-size="15" fill="#5C6B6B">아침 대기가 가장 짧음, 11:00 전 점심</text>

    <circle cx="900" cy="500" r="22" fill="#B8442D"></circle><text x="900" y="507" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="940" y="496" font-weight="700">지정 시간에 슈퍼 닌텐도 월드 입장</text>
    <text x="940" y="520" font-size="15" fill="#5C6B6B">마리오 카트 → 크레이지 트램카™ → 요시 어드벤처 → 파워 업 밴드 챌린지</text>

    <circle cx="900" cy="590" r="22" fill="#0D6B68"></circle><text x="900" y="597" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="940" y="586">해 질 무렵 WaterWorld나 거리 쇼 관람, 어두워진 뒤 호그와트성 촬영</text>
    <text x="940" y="610" font-size="15" fill="#5C6B6B">할로윈 시즌(9월 10일~11월 8일) 밤에는 공포 행사 진행</text>

    <circle cx="900" cy="680" r="22" fill="#0D6B68"></circle><text x="900" y="687" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="940" y="676">폐장 1시간 전에 기념품 구매</text>
    <text x="940" y="700" font-size="15" fill="#5C6B6B">9월 폐장 21:00~22:00, 퇴장 후 재입장 불가</text>

    <circle cx="900" cy="760" r="22" fill="#102A2B"></circle><text x="900" y="767" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="940" y="766">JR 유니버설시티역에서 오사카역 약 11분, 덴노지 약 13분</text>
  </g>

  <text x="1400" y="880" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text>
</svg>
