<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Taiwan Travelers Entering Hong Kong: Entry Routes and Four Clearance Steps / Entering Hong Kong with a Taiwan passport</title>
  <desc id="desc">Left: a decision tree asks your entry route. Route one: born in Taiwan or previously entered Hong Kong as a Taiwan resident; no foreign passport; Taiwan return document valid 6+ months. Use online Pre-arrival Registration: free, valid 2 months, 2 entries, 30 days each; print the notification on white A4 paper and sign. Route two: valid Mainland Travel Permit for Taiwan Residents; visitor stay up to 30 days. Route three: ineligible; apply for an Entry Permit. Multiple-entry permits via designated airlines in Taiwan take about 2 working days. All routes join four steps on the right: 1 Immigration—staffed counter; collect a Landing Slip; 2 Baggage; 3 Customs—Red/Green Channel; age 18+ allowance: 1 L alcohol over 30% ABV and 19 cigarettes; 4 Arrivals Hall. Red warning box beside customs: e-cigarette/heated tobacco imports banned since 2022/4/30; from 2026/4/30, public possession of specified alternative smoking products (cartridges, e-liquid, heated tobacco sticks, herbal cigarettes) incurs a HK$3,000 fixed fine for small, non-commercial quantities. Cash/bearer negotiable instruments over HK$12 × ten thousand: declare via the red channel.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">Taiwan travelers entering Hong Kong: choose your entry route, then follow four clearance steps</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Entering Hong Kong with a Taiwan passport: pick your entry route, then clear four steps</text>


  <rect x="40" y="110" width="400" height="60" rx="14" fill="#102A2B" stroke="#102A2B" stroke-width="4"></rect>
  <text x="240" y="148" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Which entry route?</text>


  <path d="M 60 170 L 60 605" stroke="#5C6B6B" stroke-width="4" fill="none"></path>
  <path d="M 60 285 L 86 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <path d="M 60 445 L 86 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <path d="M 60 605 L 86 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>


  <rect x="90" y="200" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"></rect>
  <text x="265" y="244" font-size="17" fill="#102A2B" text-anchor="middle">Born in Taiwan, or previously entered</text>
  <text x="265" y="274" font-size="17" fill="#102A2B" text-anchor="middle">Hong Kong as a Taiwan resident</text>
  <text x="265" y="304" font-size="17" fill="#102A2B" text-anchor="middle">No foreign passport</text>
  <text x="265" y="334" font-size="17" fill="#102A2B" text-anchor="middle">Taiwan return document valid 6+ months</text>
  <path d="M 440 285 L 486 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <rect x="490" y="200" width="380" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
  <text x="680" y="238" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Online Pre-arrival Registration</text>
  <text x="680" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">Pre-arrival Registration</text>
  <text x="680" y="302" font-size="17" fill="#102A2B" text-anchor="middle">Free · Valid 2 months · 2 entries</text>
  <text x="680" y="334" font-size="17" fill="#102A2B" text-anchor="middle">30 days each · Print/sign white A4 paper</text>


  <rect x="90" y="395" width="350" height="100" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"></rect>
  <text x="265" y="440" font-size="17" fill="#102A2B" text-anchor="middle">Valid Mainland Travel Permit</text>
  <text x="265" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">Mainland Travel Permit</text>
  <path d="M 440 445 L 486 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <rect x="490" y="395" width="380" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="680" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Enter as a visitor</text>
  <text x="680" y="470" font-size="17" fill="#102A2B" text-anchor="middle">Stay up to 30 days</text>


  <rect x="90" y="520" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"></rect>
  <text x="265" y="570" font-size="17" fill="#102A2B" text-anchor="middle">Ineligible for either route above</text>
  <text x="265" y="604" font-size="16" fill="#5C6B6B" text-anchor="middle">For example, born outside Taiwan,</text>
  <text x="265" y="632" font-size="16" fill="#5C6B6B" text-anchor="middle">Never visited HK as a Taiwan resident</text>
  <path d="M 440 605 L 486 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <rect x="490" y="520" width="380" height="170" rx="14" fill="#FDF1E6" stroke="#D97A2B" stroke-width="4"></rect>
  <text x="680" y="558" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Apply for an Entry Permit</text>
  <text x="680" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">Entry Permit</text>
  <text x="680" y="622" font-size="17" fill="#102A2B" text-anchor="middle">Via designated airlines in Taiwan</text>
  <text x="680" y="654" font-size="17" fill="#102A2B" text-anchor="middle">Multiple-entry permit: about 2 working days</text>


  <path d="M 870 285 L 905 285" stroke="#5C6B6B" stroke-width="4" fill="none"></path>
  <path d="M 870 445 L 905 445" stroke="#5C6B6B" stroke-width="4" fill="none"></path>
  <path d="M 870 605 L 905 605" stroke="#5C6B6B" stroke-width="4" fill="none"></path>
  <path d="M 905 605 L 905 180" stroke="#5C6B6B" stroke-width="4" fill="none"></path>
  <path d="M 903 180 L 936 180" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>


  <rect x="940" y="110" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></rect>
  <text x="1090" y="146" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">1　Immigration</text>
  <text x="1090" y="172" font-size="16" fill="#5C6B6B" text-anchor="middle">Immigration</text>
  <text x="1090" y="204" font-size="15" fill="#102A2B" text-anchor="middle" style="font-size: 15px;">Staffed counter · Collect Landing Slip</text>
  <text x="1090" y="230" font-size="16" fill="#5C6B6B" text-anchor="middle">Landing Slip</text>
  <path d="M 1090 250 L 1090 280" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>


  <rect x="940" y="284" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></rect>
  <text x="1090" y="320" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">2　Baggage collection</text>
  <text x="1090" y="348" font-size="16" fill="#5C6B6B" text-anchor="middle">Baggage</text>
  <path d="M 1090 368 L 1090 398" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>


  <rect x="940" y="402" width="300" height="236" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
  <text x="1090" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">3　Customs</text>
  <text x="1090" y="468" font-size="17" fill="#102A2B" text-anchor="middle">Red and green channels</text>
  <text x="1090" y="494" font-size="16" fill="#5C6B6B" text-anchor="middle">Red／Green Channel</text>
  <text x="1090" y="536" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">Duty-free for ages 18+</text>
  <text x="1090" y="568" font-size="17" fill="#102A2B" text-anchor="middle">1 L alcohol (over 30% ABV)</text>
  <text x="1090" y="600" font-size="17" fill="#102A2B" text-anchor="middle">19 cigarettes</text>
  <path d="M 1090 638 L 1090 668" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>


  <rect x="940" y="672" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></rect>
  <text x="1090" y="708" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">4　Arrivals Hall</text>
  <text x="1090" y="736" font-size="16" fill="#5C6B6B" text-anchor="middle">Arrivals Hall</text>


  <path d="M 1240 470 L 1270 470" stroke="#B8442D" stroke-width="4" stroke-dasharray="6 5" fill="none"></path>
  <rect x="1270" y="402" width="300" height="354" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="1420" y="438" font-size="20" font-weight="700" fill="#8A2E1D" text-anchor="middle">Warning</text>
  <text x="1420" y="478" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">E-cigarettes and heated tobacco</text>
  <text x="1420" y="504" font-size="16" fill="#8A2E1D" text-anchor="middle">From 2022/4/30</text>
  <text x="1420" y="530" font-size="16" fill="#8A2E1D" text-anchor="middle">Imports banned</text>
  <text x="1420" y="574" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">From 2026/4/30</text>
  <text x="1420" y="600" font-size="16" fill="#8A2E1D" text-anchor="middle">Specified products held in public</text>
  <text x="1420" y="626" font-size="16" fill="#8A2E1D" text-anchor="middle">Small/noncommercial: flat HK$3,000</text>
  <text x="1420" y="670" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle" style="font-size: 15px;">Cash / bearer negotiable instruments</text>
  <text x="1420" y="696" font-size="16" fill="#8A2E1D" text-anchor="middle">Over HK$12 × ten thousand</text>
  <text x="1420" y="722" font-size="16" fill="#8A2E1D" text-anchor="middle">Declare via the red channel</text>

  <text x="40" y="870" font-size="15" fill="#5C6B6B">Based on Hong Kong Immigration, Customs and Tobacco and Alcohol Control Office pages; Entry Permit fees follow Immigration's fee schedule.</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair graphic 2026</text>
</svg>
