  <rect x="940" y="284" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="1090" y="320" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">2　领取行李</text>
  <text x="1090" y="348" font-size="16" fill="#5C6B6B" text-anchor="middle">行李</text>
  <path d="M 1090 368 L 1090 398" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="940" y="402" width="300" height="236" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1090" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">3　海关</text>
  <text x="1090" y="468" font-size="17" fill="#102A2B" text-anchor="middle">红绿通道</text>
