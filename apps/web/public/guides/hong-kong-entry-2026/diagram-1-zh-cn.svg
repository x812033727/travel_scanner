  <rect x="490" y="520" width="380" height="170" rx="14" fill="#FDF1E6" stroke="#D97A2B" stroke-width="4" />
  <text x="680" y="558" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">申请入境许可</text>
  <text x="680" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">入境许可</text>
  <text x="680" y="622" font-size="17" fill="#102A2B" text-anchor="middle">经台湾指定航空公司办理</text>
  <text x="680" y="654" font-size="17" fill="#102A2B" text-anchor="middle">多次入境许可约 2 个工作日</text>


