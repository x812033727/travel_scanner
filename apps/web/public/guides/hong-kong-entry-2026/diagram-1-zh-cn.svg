  <text x="265" y="244" font-size="17" fill="#102A2B" text-anchor="middle">在台湾出生，或曾以台湾居民</text>
  <text x="265" y="274" font-size="17" fill="#102A2B" text-anchor="middle">身份入境香港</text>
  <text x="265" y="304" font-size="17" fill="#102A2B" text-anchor="middle">没有外国护照</text>
  <text x="265" y="334" font-size="17" fill="#102A2B" text-anchor="middle">回台证件有效期 6 个月以上</text>
  <path d="M 440 285 L 486 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="490" y="200" width="380" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="680" y="238" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">网上预办入境登记</text>
  <text x="680" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">预办入境登记</text>
  <text x="680" y="302" font-size="17" fill="#102A2B" text-anchor="middle">免费・有效 2 个月・入境 2 次</text>
