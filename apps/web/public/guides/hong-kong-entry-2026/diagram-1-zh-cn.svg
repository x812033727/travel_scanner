  <text x="265" y="440" font-size="17" fill="#102A2B" text-anchor="middle">持有效台胞证</text>
  <text x="265" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">台湾居民来往大陆通行证</text>
