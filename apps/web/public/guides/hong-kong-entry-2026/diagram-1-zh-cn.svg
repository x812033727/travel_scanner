<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台湾旅客入境香港：选择入境方式与四步通关 / 持台湾护照入境香港</title>
  <desc id="desc">左半边是决策树，起点问你用什么入境，分三条路。第一条：在台湾出生或曾以台湾居民身份入境香港、没有外国护照、回台证件有效期 6 个月以上，办理网上预办入境登记，免费、有效 2 个月、入境 2 次、每次 30 天，通知书用 A4 白纸打印并签名。第二条：持有效台胞证，以访客身份停留最多 30 天。第三条：不符合资格，申请入境许可，经台湾指定航空公司办理多次入境许可约 2 个工作日。三条路汇入右半边的四步流程：1 入境审查，走人工柜台、领取入境标签；2 领取行李；3 海关红绿通道，18 岁以上免税额是酒精浓度超过 30% 的酒 1 升、香烟 19 支；4 接机大厅。海关旁的红色警示框：电子烟、加热烟 2022 年 4 月 30 日起禁止输入；2026 年 4 月 30 日起在公众地方持有指明另类吸烟产品（烟弹、烟油、加热烟烟支及草本烟），少量且非商业用途定额罚款 3,000 港元；现金与不记名票据超过 12 万港元，走红色通道申报。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">台湾旅客入境香港：先选入境方式，再按四步通关</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">持台湾护照入境香港：选择入境方式，再按四步通关</text>


