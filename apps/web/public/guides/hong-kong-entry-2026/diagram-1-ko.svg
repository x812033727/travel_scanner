  <text x="680" y="558" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">입국 허가증 신청</text>
  <text x="680" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">입국 허가증</text>
  <text x="680" y="622" font-size="17" fill="#102A2B" text-anchor="middle">대만 지정 항공사를 통해 신청</text>
  <text x="680" y="654" font-size="17" fill="#102A2B" text-anchor="middle">복수 입국 허가 약 2영업일</text>


