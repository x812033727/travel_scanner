  <text x="265" y="570" font-size="17" fill="#102A2B" text-anchor="middle">위 두 가지 자격 모두 미충족</text>
  <text x="265" y="604" font-size="16" fill="#5C6B6B" text-anchor="middle">예: 대만 밖에서 태어났고,</text>
  <text x="265" y="632" font-size="16" fill="#5C6B6B" text-anchor="middle">대만 주민으로 홍콩에 온 적 없음</text>
  <path d="M 440 605 L 486 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
