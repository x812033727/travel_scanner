  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">대만 여행객의 홍콩 입국: 입국 방법을 고른 뒤 네 단계 완료</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">대만 여권으로 홍콩 입국: 입국 방법 선택 후 네 단계 완료</text>


