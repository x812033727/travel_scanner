<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">대만 여행객의 홍콩 입국: 입국 방법 선택과 네 단계 입국 절차 / 대만 여권으로 홍콩 입국하기</title>
  <desc id="desc">왼쪽은 입국 방법을 묻는 시작점에서 세 갈래로 나뉘는 의사결정 도표입니다. 첫 번째: 대만 출생이거나 대만 주민 자격으로 홍콩에 입국한 적이 있고, 외국 여권이 없으며, 대만 귀국용 서류의 유효기간이 6개월 이상 남았다면 온라인 사전 입국 등록을 합니다. 무료이며 2개월간 유효하고, 2회 입국하여 매회 30일 체류할 수 있습니다. 통지서는 흰색 A4 용지에 인쇄하고 서명합니다. 두 번째: 유효한 타이바오증을 소지하면 방문객 자격으로 최대 30일 체류할 수 있습니다. 세 번째: 자격을 충족하지 못하면 입국 허가증을 신청합니다. 대만의 지정 항공사를 통한 복수 입국 허가증 신청은 약 2영업일이 걸립니다. 세 경로는 오른쪽의 네 단계 절차로 합쳐집니다. 1 입국 심사: 직원이 있는 창구를 이용하고 입국 확인표를 받습니다. 2 수하물 수령. 3 세관 적색·녹색 통로: 18세 이상 면세 한도는 알코올 도수 30% 초과 주류 1리터, 궐련 19개비입니다. 4 도착 로비. 세관 옆 빨간 경고 상자: 전자담배와 가열식 담배는 2022년 4월 30일부터 수입 금지입니다. 2026년 4월 30일부터 공공장소에서 지정 대체 흡연 제품(카트리지·액상·가열식 담배 스틱·허브 담배)을 소지하면, 소량이며 비상업적 용도인 경우 고정 벌금 3,000 홍콩달러가 부과됩니다. 현금과 무기명 증권이 12만 홍콩달러를 초과하면 적색 통로에서 신고합니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
