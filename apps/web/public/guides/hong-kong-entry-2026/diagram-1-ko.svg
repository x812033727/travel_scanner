  <text x="40" y="870" font-size="15" fill="#5C6B6B">홍콩 입경사무처·홍콩 세관·위생서 흡연·음주 관리사무소 페이지 기준. 입국 허가 수수료는 입경사무처 요금표 기준.</text>
