  <path d="M 60 285 L 86 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 60 445 L 86 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 60 605 L 86 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="90" y="200" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" />
  <text x="265" y="244" font-size="17" fill="#102A2B" text-anchor="middle">台湾生まれ、または台湾住民として</text>
  <text x="265" y="274" font-size="17" fill="#102A2B" text-anchor="middle">香港への入境歴あり</text>
  <text x="265" y="304" font-size="17" fill="#102A2B" text-anchor="middle">外国のパスポートなし</text>
  <text x="265" y="334" font-size="17" fill="#102A2B" text-anchor="middle">台湾帰還用書類の有効期間 6 か月以上</text>
  <path d="M 440 285 L 486 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="490" y="200" width="380" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="680" y="238" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">オンライン事前入境登録</text>
  <text x="680" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">事前入境登録</text>
  <text x="680" y="302" font-size="17" fill="#102A2B" text-anchor="middle">無料・有効期間 2 か月・入境 2 回</text>
  <text x="680" y="334" font-size="17" fill="#102A2B" text-anchor="middle">各 30 日・A4 白紙に印刷して署名</text>


  <rect x="90" y="395" width="350" height="100" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" />
  <text x="265" y="440" font-size="17" fill="#102A2B" text-anchor="middle">有効な台胞証を所持</text>
  <text x="265" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">中国本土渡航許可証</text>
  <path d="M 440 445 L 486 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="490" y="395" width="380" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="680" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">訪問者として入境</text>
  <text x="680" y="470" font-size="17" fill="#102A2B" text-anchor="middle">最長 30 日滞在</text>


  <rect x="90" y="520" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" />
  <text x="265" y="570" font-size="17" fill="#102A2B" text-anchor="middle">上記二つの資格を満たさない</text>
  <text x="265" y="604" font-size="16" fill="#5C6B6B" text-anchor="middle">例：台湾以外で生まれ、</text>
  <text x="265" y="632" font-size="16" fill="#5C6B6B" text-anchor="middle">台湾住民として香港への訪問歴なし</text>
  <path d="M 440 605 L 486 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="490" y="520" width="380" height="170" rx="14" fill="#FDF1E6" stroke="#D97A2B" stroke-width="4" />
  <text x="680" y="558" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">入境許可を申請</text>
  <text x="680" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">入境許可証</text>
  <text x="680" y="622" font-size="17" fill="#102A2B" text-anchor="middle">台湾の指定航空会社経由で申請</text>
  <text x="680" y="654" font-size="17" fill="#102A2B" text-anchor="middle">数次入境許可は約 2 営業日</text>


