  <rect x="1270" y="402" width="300" height="354" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1420" y="438" font-size="20" font-weight="700" fill="#8A2E1D" text-anchor="middle">注意</text>
  <text x="1420" y="478" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">電子たばこ・加熱式たばこ</text>
  <text x="1420" y="504" font-size="16" fill="#8A2E1D" text-anchor="middle">2022 年 4 月 30 日から</text>
  <text x="1420" y="530" font-size="16" fill="#8A2E1D" text-anchor="middle">輸入禁止</text>
  <text x="1420" y="574" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">2026 年 4 月 30 日から</text>
  <text x="1420" y="600" font-size="16" fill="#8A2E1D" text-anchor="middle">公共の場所で指定製品を所持</text>
  <text x="1420" y="626" font-size="16" fill="#8A2E1D" text-anchor="middle">少量・非商用：定額罰金 HK$3,000</text>
  <text x="1420" y="670" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">現金・無記名証券</text>
  <text x="1420" y="696" font-size="16" fill="#8A2E1D" text-anchor="middle">12 万香港ドル超</text>
  <text x="1420" y="722" font-size="16" fill="#8A2E1D" text-anchor="middle">赤い通路で申告</text>

  <text x="40" y="870" font-size="15" fill="#5C6B6B">香港入境事務処、香港税関、衛生署たばこ・酒類規制事務所のページに基づく。入境許可の料金は入境事務処の料金表に準拠。</text>
