  <path d="M 870 445 L 905 445" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 870 605 L 905 605" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 905 605 L 905 180" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 903 180 L 936 180" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="940" y="110" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="1090" y="146" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">1　入境審査</text>
  <text x="1090" y="172" font-size="16" fill="#5C6B6B" text-anchor="middle">入境審査</text>
  <text x="1090" y="204" font-size="17" fill="#102A2B" text-anchor="middle">有人カウンター・入境票を受取</text>
  <text x="1090" y="230" font-size="16" fill="#5C6B6B" text-anchor="middle">入境票</text>
  <path d="M 1090 250 L 1090 280" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="940" y="284" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="1090" y="320" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">2　手荷物受取</text>
  <text x="1090" y="348" font-size="16" fill="#5C6B6B" text-anchor="middle">手荷物</text>
  <path d="M 1090 368 L 1090 398" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="940" y="402" width="300" height="236" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1090" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">3　税関</text>
  <text x="1090" y="468" font-size="17" fill="#102A2B" text-anchor="middle">赤・緑の通路</text>
  <text x="1090" y="494" font-size="16" fill="#5C6B6B" text-anchor="middle">赤／緑の通路</text>
  <text x="1090" y="536" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">18 歳以上は免税枠あり</text>
  <text x="1090" y="568" font-size="17" fill="#102A2B" text-anchor="middle">酒 1 リットル（度数 30% 超）</text>
  <text x="1090" y="600" font-size="17" fill="#102A2B" text-anchor="middle">紙巻きたばこ 19 本</text>
  <path d="M 1090 638 L 1090 668" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <rect x="940" y="672" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
