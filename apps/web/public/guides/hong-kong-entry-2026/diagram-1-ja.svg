<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台湾の旅行者の香港入境：入境方法の選択と四つの到着手順 / 台湾パスポートで香港に入境</title>
  <desc id="desc">左半分は入境方法を選ぶ決定木で、出発点から三つの方法に分かれます。一つ目：台湾生まれ、または台湾住民として香港に入境したことがあり、外国のパスポートを持たず、台湾帰還用の渡航書類の有効期間が 6 か月以上ある人は、オンライン事前入境登録を行います。無料、有効期間 2 か月、入境 2 回、各 30 日滞在で、通知書を A4 の白い用紙に印刷して署名します。二つ目：有効な台胞証で、訪問者として最長 30 日滞在します。三つ目：資格を満たさない人は入境許可を申請します。台湾の指定航空会社を通じた数次入境許可の申請は約 2 営業日かかります。三つの方法は右半分の四つの手順に合流します。1 入境審査：有人カウンターを利用し、入境票を受け取ります。2 手荷物受取。3 税関の赤／緑の通路：18 歳以上の免税枠は、アルコール度数が 30% を超える酒 1 リットルと紙巻きたばこ 19 本です。4 到着ロビー。税関の脇にある赤い注意枠：電子たばこ・加熱式たばこは 2022 年 4 月 30 日から輸入禁止。2026 年 4 月 30 日からは、公共の場所で指定代替喫煙製品（カートリッジ、リキッド、加熱式たばこスティック、ハーブたばこ）を所持すると、少量かつ非商業用途の場合は定額罰金 3,000 香港ドル。現金と無記名証券が 12 万香港ドルを超える場合は、赤い通路で申告します。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">台湾の旅行者の香港入境：方法を選び、四つの手順で到着手続き</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">台湾パスポートで香港へ：入境方法を選び、四つの手順で到着手続きを完了</text>


  <rect x="40" y="110" width="400" height="60" rx="14" fill="#102A2B" stroke="#102A2B" stroke-width="4" />
  <text x="240" y="148" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">入境方法は？</text>


