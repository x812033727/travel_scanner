<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣旅客入境香港：選入境方式與四步出關 / Entering Hong Kong with a Taiwan passport</title>
  <desc id="desc">左半邊是決策樹，起點問你用什麼入境，分三條路。第一條：台灣出生或曾以台灣居民身分入境香港、沒有外國護照、回台證件效期 6 個月以上，辦網上預辦入境登記 Pre-arrival Registration，免費、有效 2 個月、入境 2 次、每次 30 天，通知書用 A4 白紙列印並簽名。第二條：持有效台胞證，以訪客身分停留最多 30 天。第三條：不符資格，申請入境許可 Entry Permit，經台灣指定航空公司辦多次入境許可約 2 個工作天。三條路匯到右半邊的四步流程：1 入境審查 Immigration，走人工櫃檯、領入境標籤 Landing Slip；2 領行李 Baggage；3 海關 Customs 紅綠通道 Red／Green Channel，18 歲以上免稅額是酒精濃度超過 30% 的酒 1 公升、香菸 19 支；4 接機大堂 Arrivals Hall。海關旁的紅色警示框：電子菸、加熱菸 2022 年 4 月 30 日起禁止輸入；2026 年 4 月 30 日起在公眾地方持有，少量定額罰款 3,000 港元；現金與不記名票據超過 12 萬港元，走紅色通道申報。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">台灣旅客入境香港：先選入境方式，再照四步出關</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Entering Hong Kong with a Taiwan passport: pick your entry route, then clear four steps</text>

  <!-- start -->
  <rect x="40" y="110" width="400" height="60" rx="14" fill="#102A2B" stroke="#102A2B" stroke-width="4"/>
  <text x="240" y="148" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">你用什麼入境？ Which route?</text>

  <!-- trunk -->
  <path d="M 60 170 L 60 605" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 60 285 L 86 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 60 445 L 86 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 60 605 L 86 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row A -->
  <rect x="90" y="200" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="265" y="244" font-size="17" fill="#102A2B" text-anchor="middle">台灣出生，或曾以台灣居民</text>
  <text x="265" y="274" font-size="17" fill="#102A2B" text-anchor="middle">身分入境香港</text>
  <text x="265" y="304" font-size="17" fill="#102A2B" text-anchor="middle">沒有外國護照</text>
  <text x="265" y="334" font-size="17" fill="#102A2B" text-anchor="middle">回台證件效期 6 個月以上</text>
  <path d="M 440 285 L 486 285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="490" y="200" width="380" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="680" y="238" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">網上預辦入境登記</text>
  <text x="680" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">Pre-arrival Registration</text>
  <text x="680" y="302" font-size="17" fill="#102A2B" text-anchor="middle">免費・有效 2 個月・入境 2 次</text>
  <text x="680" y="334" font-size="17" fill="#102A2B" text-anchor="middle">每次 30 天・A4 白紙列印並簽名</text>

  <!-- row B -->
  <rect x="90" y="395" width="350" height="100" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="265" y="440" font-size="17" fill="#102A2B" text-anchor="middle">持有效台胞證</text>
  <text x="265" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">Mainland Travel Permit</text>
  <path d="M 440 445 L 486 445" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="490" y="395" width="380" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="680" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">以訪客身分入境</text>
  <text x="680" y="470" font-size="17" fill="#102A2B" text-anchor="middle">停留最多 30 天</text>

  <!-- row C -->
  <rect x="90" y="520" width="350" height="170" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="265" y="570" font-size="17" fill="#102A2B" text-anchor="middle">不符上面兩種資格</text>
  <text x="265" y="604" font-size="16" fill="#5C6B6B" text-anchor="middle">例如在台灣以外出生、</text>
  <text x="265" y="632" font-size="16" fill="#5C6B6B" text-anchor="middle">沒以台灣居民身分來過香港</text>
  <path d="M 440 605 L 486 605" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="490" y="520" width="380" height="170" rx="14" fill="#FDF1E6" stroke="#D97A2B" stroke-width="4"/>
  <text x="680" y="558" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">申請入境許可</text>
  <text x="680" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">Entry Permit</text>
  <text x="680" y="622" font-size="17" fill="#102A2B" text-anchor="middle">經台灣指定航空公司辦</text>
  <text x="680" y="654" font-size="17" fill="#102A2B" text-anchor="middle">多次入境許可約 2 個工作天</text>

  <!-- bus to step 1 -->
  <path d="M 870 285 L 905 285" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 870 445 L 905 445" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 870 605 L 905 605" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 905 605 L 905 180" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 903 180 L 936 180" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 1 -->
  <rect x="940" y="110" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1090" y="146" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">1　入境審查</text>
  <text x="1090" y="172" font-size="16" fill="#5C6B6B" text-anchor="middle">Immigration</text>
  <text x="1090" y="204" font-size="17" fill="#102A2B" text-anchor="middle">人工櫃檯・領入境標籤</text>
  <text x="1090" y="230" font-size="16" fill="#5C6B6B" text-anchor="middle">Landing Slip</text>
  <path d="M 1090 250 L 1090 280" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="940" y="284" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1090" y="320" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">2　領行李</text>
  <text x="1090" y="348" font-size="16" fill="#5C6B6B" text-anchor="middle">Baggage</text>
  <path d="M 1090 368 L 1090 398" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 customs -->
  <rect x="940" y="402" width="300" height="236" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1090" y="438" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">3　海關 Customs</text>
  <text x="1090" y="468" font-size="17" fill="#102A2B" text-anchor="middle">紅綠通道</text>
  <text x="1090" y="494" font-size="16" fill="#5C6B6B" text-anchor="middle">Red／Green Channel</text>
  <text x="1090" y="536" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">18 歲以上免稅</text>
  <text x="1090" y="568" font-size="17" fill="#102A2B" text-anchor="middle">酒 1 公升（酒精濃度超過 30%）</text>
  <text x="1090" y="600" font-size="17" fill="#102A2B" text-anchor="middle">香菸 19 支</text>
  <path d="M 1090 638 L 1090 668" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="940" y="672" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1090" y="708" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">4　接機大堂</text>
  <text x="1090" y="736" font-size="16" fill="#5C6B6B" text-anchor="middle">Arrivals Hall</text>

  <!-- warning -->
  <path d="M 1240 470 L 1270 470" stroke="#B8442D" stroke-width="4" stroke-dasharray="6 5" fill="none"/>
  <rect x="1270" y="402" width="300" height="354" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1420" y="438" font-size="20" font-weight="700" fill="#8A2E1D" text-anchor="middle">注意 Warning</text>
  <text x="1420" y="478" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">電子菸、加熱菸</text>
  <text x="1420" y="504" font-size="16" fill="#8A2E1D" text-anchor="middle">2022 年 4 月 30 日起</text>
  <text x="1420" y="530" font-size="16" fill="#8A2E1D" text-anchor="middle">禁止輸入</text>
  <text x="1420" y="574" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">2026 年 4 月 30 日起</text>
  <text x="1420" y="600" font-size="16" fill="#8A2E1D" text-anchor="middle">公眾地方持有，少量</text>
  <text x="1420" y="626" font-size="16" fill="#8A2E1D" text-anchor="middle">定額罰款 3,000 港元</text>
  <text x="1420" y="670" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">現金與不記名票據</text>
  <text x="1420" y="696" font-size="16" fill="#8A2E1D" text-anchor="middle">超過 12 萬港元</text>
  <text x="1420" y="722" font-size="16" fill="#8A2E1D" text-anchor="middle">走紅色通道申報</text>

  <text x="40" y="870" font-size="15" fill="#5C6B6B">依香港入境事務處、香港海關、衛生署控煙酒辦事處頁面整理；入境許可費用以入境處收費表為準。</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
