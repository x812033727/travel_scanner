<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">意外傷害事故的三個要件與常見爭點 / The three tests for an accidental injury event and where disputes land</title>
<desc id="desc">圖的最上方是條款的定義：意外傷害事故，指非由疾病引起之外來突發事故，出處是傷害保險單示範條款第二條與保險法第一百三十一條。中間一排三個框，分別是非由疾病引起、外來、突發三個要件，每個框寫出條款在問什麼，以及爭點通常落在哪裡：第一個要件問傷亡來自內在原因還是內在以外的事故，爭點在兩者競合時主力近因是哪一個；第二個要件問傷害是不是從身體以外來，爭點在外傷是把人放倒的原因還是倒地以後的結果；第三個要件問是不是某一個時點上突然發生的事件，爭點在病變來自長期退化還是單一次外力。最下方一排四個框是常見爭議型態：疾病引發的跌倒、猝死與心血管事件、疾病導致的溺水或窒息、長期勞損而非突發，各自標出卡在哪一個要件與爭點是什麼。圖的底部寫著實際認定看個案的證據與該張保單的條款文字。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">意外傷害事故：三個要件與爭點</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Accidental injury: the three tests and where disputes land</text>
<rect x="60" y="110" width="1480" height="86" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="144" font-size="18" fill="#5C6B6B" text-anchor="middle">傷害保險單示範條款第二條／保險法第一百三十一條</text>
<text x="800" y="176" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">意外傷害事故，指非由疾病引起之外來突發事故</text>
<rect x="60" y="226" width="480" height="260" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="300" y="272" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">非由疾病引起</text>
<line x1="84" y1="292" x2="516" y2="292" stroke="#0D6B68" stroke-width="2"/>
<text x="300" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">條款在問</text>
<text x="300" y="350" font-size="17" fill="#102A2B" text-anchor="middle">傷亡來自內在原因，</text>
<text x="300" y="376" font-size="17" fill="#102A2B" text-anchor="middle">還是內在以外的事故</text>
<text x="300" y="412" font-size="16" fill="#B8442D" text-anchor="middle">爭點落在</text>
<text x="300" y="440" font-size="17" fill="#102A2B" text-anchor="middle">兩者競合的時候，</text>
<text x="300" y="466" font-size="17" fill="#102A2B" text-anchor="middle">主力近因是哪一個</text>
<rect x="560" y="226" width="480" height="260" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="272" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">外來</text>
<line x1="584" y1="292" x2="1016" y2="292" stroke="#2F6F9F" stroke-width="2"/>
<text x="800" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">條款在問</text>
<text x="800" y="350" font-size="17" fill="#102A2B" text-anchor="middle">傷害是不是從身體以外來，</text>
<text x="800" y="376" font-size="17" fill="#102A2B" text-anchor="middle">純內部變化的結果不是</text>
<text x="800" y="412" font-size="16" fill="#B8442D" text-anchor="middle">爭點落在</text>
<text x="800" y="440" font-size="17" fill="#102A2B" text-anchor="middle">外傷是把人放倒的原因，</text>
<text x="800" y="466" font-size="17" fill="#102A2B" text-anchor="middle">還是倒地以後的結果</text>
<rect x="1060" y="226" width="480" height="260" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1300" y="272" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">突發</text>
<line x1="1084" y1="292" x2="1516" y2="292" stroke="#2E7D5B" stroke-width="2"/>
<text x="1300" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">條款在問</text>
<text x="1300" y="350" font-size="17" fill="#102A2B" text-anchor="middle">是不是某一個時點上</text>
<text x="1300" y="376" font-size="17" fill="#102A2B" text-anchor="middle">突然發生的事件</text>
<text x="1300" y="412" font-size="16" fill="#B8442D" text-anchor="middle">爭點落在</text>
<text x="1300" y="440" font-size="17" fill="#102A2B" text-anchor="middle">病變來自長期退化，</text>
<text x="1300" y="466" font-size="17" fill="#102A2B" text-anchor="middle">還是單一次外力</text>
<line x1="60" y1="534" x2="600" y2="534" stroke="#5C6B6B" stroke-width="2"/>
<line x1="1000" y1="534" x2="1540" y2="534" stroke="#5C6B6B" stroke-width="2"/>
<text x="800" y="541" font-size="20" fill="#5C6B6B" text-anchor="middle">常見爭議型態：爭點落在哪一個要件上</text>
<rect x="60" y="580" width="346" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="233" y="620" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">疾病引發的跌倒</text>
<text x="233" y="652" font-size="16" fill="#5C6B6B" text-anchor="middle">卡在：非由疾病引起、外來</text>
<text x="233" y="686" font-size="16" fill="#102A2B" text-anchor="middle">先病發才倒地，</text>
<text x="233" y="712" font-size="16" fill="#102A2B" text-anchor="middle">還是先跌倒才受傷</text>
<rect x="438" y="580" width="346" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="611" y="620" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">猝死與心血管事件</text>
<text x="611" y="652" font-size="16" fill="#5C6B6B" text-anchor="middle">卡在：非由疾病引起</text>
<text x="611" y="686" font-size="16" fill="#102A2B" text-anchor="middle">競合時的主力近因</text>
<text x="611" y="712" font-size="16" fill="#102A2B" text-anchor="middle">是哪一個</text>
<rect x="816" y="580" width="346" height="160" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="989" y="620" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">疾病導致的溺水或窒息</text>
<text x="989" y="652" font-size="16" fill="#5C6B6B" text-anchor="middle">卡在：外來</text>
<text x="989" y="686" font-size="16" fill="#102A2B" text-anchor="middle">疾病發作後落水，</text>
<text x="989" y="712" font-size="16" fill="#102A2B" text-anchor="middle">是否仍具外來性</text>
<rect x="1194" y="580" width="346" height="160" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1367" y="620" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">長期勞損而非突發</text>
<text x="1367" y="652" font-size="16" fill="#5C6B6B" text-anchor="middle">卡在：突發</text>
<text x="1367" y="686" font-size="16" fill="#102A2B" text-anchor="middle">屬於長期退化，</text>
<text x="1367" y="712" font-size="16" fill="#102A2B" text-anchor="middle">還是單一次外力</text>
<text x="60" y="800" font-size="17" fill="#5C6B6B">實際認定看個案的證據與該張保單的條款文字；圖上寫的是爭點，不是結論。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>