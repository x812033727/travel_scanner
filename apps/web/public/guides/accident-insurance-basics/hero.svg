<title id="title">寬的日常說法與窄的條款定義 / A wide everyday word and a narrow clause definition</title>
<desc id="desc">一張沒有文字的插圖。外圈是一個很大的虛線圓角方框，代表日常說的意外；方框裡有三個同樣大小、彼此交疊的圓，圓形只有淡綠色底與深綠色外框；三個圓共同重疊的中央區塊被塗成一塊橘色的實心弧邊三角形，面積遠小於外框，代表條款認定的意外傷害事故只有三個要件同時成立的那一小塊。</desc>
