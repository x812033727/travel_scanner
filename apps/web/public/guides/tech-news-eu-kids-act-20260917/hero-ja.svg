<title id="title">欧州委員会がKIDS Act提案を採択：13歳未満はSNSアカウント禁止、自分で開設できるのは15歳から</title><desc id="desc">オリジナルイラスト：小さい順に3つの扉。最も小さい扉は点線で描かれ、13歳未満はアカウントを持てないことを示す。中央の扉は半開きで鍵がかかっており、保護者が開設するミニアカウントを示す。最も大きい扉は全開。右側にはチェック済みの書類が点線の枠内にあり、まだ審議中の設計義務の提案であることを示す。商標やUI画面は一切含まない。</desc>
