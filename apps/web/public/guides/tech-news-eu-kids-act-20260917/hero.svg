<title id="title">歐盟執委會通過 KIDS Act 提案：未滿 13 歲禁社群帳號，15 歲才能自己開帳號</title><desc id="desc">原創插圖：三道由小到大的門，最小的一道畫成虛線框，表示未滿 13 歲沒有帳號；中間一道半開、旁邊掛著一把鎖，表示由監護人開設的迷你帳號；最大的一道敞開。右側一張打了勾的文件放在虛線框裡，表示仍在審議的設計義務提案；不含任何商標或介面畫面</desc>
