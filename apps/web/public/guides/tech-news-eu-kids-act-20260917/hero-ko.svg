<title id="title">EU 집행위원회, KIDS Act 제안 채택: 13세 미만 SNS 계정 금지, 15세부터 직접 개설 가능</title><desc id="desc">오리지널 일러스트: 크기 순으로 놓인 세 개의 문 가운데 가장 작은 문은 점선으로 13세 미만은 계정 불가를 나타내고, 가운데 문은 반쯤 열려 자물쇠가 달려 보호자용 미니 계정을 나타내며, 가장 큰 문은 활짝 열려 있습니다. 오른쪽 점선 상자 속 체크된 서류는 아직 심의 중인 제안임을 나타냅니다. 상표나 UI는 없습니다.</desc>
