<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">欧盟委员会通过 KIDS Act 提案：未满 13 岁禁止社交账号，15 岁才能自行开设账号</title><desc id="desc">原创插图：三道由小到大的门，最小的一道画成虚线框，表示未满 13 岁没有账号；中间一道半开、旁边挂着一把锁，表示由监护人开设的迷你账号；最大的一道敞开。右侧一张打了勾的文件放在虚线框里，表示仍在审议的设计义务提案；不含任何商标或界面画面</desc>
