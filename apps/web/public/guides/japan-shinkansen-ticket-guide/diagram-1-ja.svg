<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Hiragino Sans',system-ui,sans-serif">
  <title id="title">新幹線きっぷの選び方フローチャート：JR Pass、EX早特21、スマートEX、駅の券売機 / Which Shinkansen ticket to buy</title>
  <desc id="desc">3つの質問で選びます。質問1：7日間に利用する新幹線の運賃・料金合計は50,000円を超えますか？「はい」ならJR Pass（普通車7日間50,000円、2026年10月1日から海外旅行代理店は53,000円、公式オンラインは当面50,000円維持）。「のぞみ」乗車時は区間ごとに専用券が必要で、東京〜新大阪は4,960円。「いいえ」なら質問2：出発まで21日以上あり、日程や列車の変更予定はありませんか？「はい」ならEX早特21。東京〜新大阪12,980円、京都12,430円、博多17,920円。乗車21日前の23:30締切、列車変更不可、払い戻し手数料320円。「いいえ」なら質問3：出発前にオンラインで予約し、到着後は交通系ICカードやQRチケットで乗車したいですか？「はい」ならスマートEX通常価格。東京〜新大阪14,520円、京都13,970円、名古屋11,100円。発車前の列車変更は無料、払い戻し手数料320円。「いいえ」なら駅の券売機またはみどりの窓口で紙のきっぷを購入。通常料金で早特割引はありません。補足：荷物の3辺合計が160cm以内ならそのまま持ち込み可能、161〜250cmは「特大荷物スペースつき座席」の予約が必要（追加料金なし、未予約で持ち込むと1,000円）、250cm超は持ち込み不可。繁忙期の「のぞみ」は全席指定席。指定席料金は閑散期−200円、繁忙期＋200円、最繁忙期＋400円。JR Passは「のぞみ」「みずほ」に直接乗車不可。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">新幹線のきっぷ選び：3つの質問でわかる買い方（2026年9月確認）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which Shinkansen ticket: JR Pass, EX Hayatoku 21, smartEX or the station ticket machine</text>

  <!-- Q1 -->
  <polygon points="800,120 1095,175 800,230 505,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="170" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Q1　7日間の新幹線料金の合計</text>
  <text x="800" y="196" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">（スマートEX基準）が50,000円超？</text>
  <path d="M 1095 175 L 1136 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="157" font-size="15" fill="#5C6B6B" text-anchor="middle">はい</text>
  <rect x="1140" y="122" width="440" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1360" y="152" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">JR Pass 7日間・普通車 50,000円</text>
  <text x="1360" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">10/1〜海外代理店53,000円／公式は当面50,000円</text>
  <text x="1360" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">のぞみは区間別に専用券（東京〜新大阪4,960円）</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="820" y="258" font-size="15" fill="#5C6B6B">いいえ</text>

  <!-- Q2 -->
  <polygon points="800,275 1095,330 800,385 505,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="325" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Q2　出発まで21日以上あり、</text>
  <text x="800" y="351" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">日程・列車の変更予定はない？</text>
  <path d="M 1095 330 L 1136 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">はい</text>
  <rect x="1140" y="277" width="440" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1360" y="307" font-size="17" font-weight="700" fill="#0B4F4D" text-anchor="middle">EX早特21（スマートEX会員早割）</text>
  <text x="1360" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">東京〜新大阪12,980・京都12,430・博多17,920円</text>
  <text x="1360" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">21日前23:30締切／変更不可／払戻手数料320円</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="820" y="413" font-size="15" fill="#5C6B6B">いいえ</text>

  <!-- Q3 -->
  <polygon points="800,430 1095,485 800,540 505,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="480" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Q3　出発前にオンライン予約し、</text>
  <text x="800" y="506" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">ICカードやQRチケットで乗りたい？</text>
  <path d="M 1095 485 L 1136 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="467" font-size="15" fill="#5C6B6B" text-anchor="middle">はい</text>
  <rect x="1140" y="432" width="440" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1360" y="462" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">スマートEX通常価格（ブラウザ予約可）</text>
  <text x="1360" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">東京〜新大阪14,520・京都13,970・名古屋11,100円</text>
  <text x="1360" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">発車前は回数無制限で変更無料／払戻320円</text>
  <path d="M 505 485 L 464 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="488" y="465" font-size="15" fill="#5C6B6B" text-anchor="middle">いいえ</text>
  <rect x="20" y="432" width="440" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="240" y="462" font-size="17" font-weight="700" fill="#4E3428" text-anchor="middle">駅の券売機・みどりの窓口で紙のきっぷ</text>
  <text x="240" y="488" font-size="15" fill="#4E3428" text-anchor="middle">券売機は英語対応・指定席予約可／通常料金</text>
  <text x="240" y="514" font-size="15" fill="#4E3428" text-anchor="middle">早特割引なし・繁忙期は窓口が混雑</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">特大荷物　Oversized baggage（JR東海）</text>
  <text x="88" y="650" font-size="16" fill="#102A2B">3辺合計160cm以内：予約不要で車内へ（荷物棚・足元）</text>
  <text x="88" y="678" font-size="16" fill="#102A2B">161〜250cm：「特大荷物スペースつき座席」を予約（追加料金なし）</text>
  <text x="88" y="706" font-size="16" fill="#102A2B">未予約で持込：手数料1,000円／250cm超は持込不可</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">繁忙期と料金　Peak seasons</text>
  <text x="848" y="650" font-size="16" fill="#102A2B">年末年始・GW・お盆など：「のぞみ」全席指定席、要事前予約</text>
  <text x="848" y="678" font-size="16" fill="#102A2B">指定席料金：閑散期−200円、繁忙期＋200円、最繁忙期＋400円</text>
  <text x="848" y="706" font-size="16" fill="#102A2B">JR Passは「のぞみ」「みずほ」に直接乗車不可（自由席も不可）</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">料金は大人片道・普通車指定席・通常期（単位：円）。スマートEX料金表2025-04-01版、EX早特21料金表2026-03-13版、JR Pass公式サイトより（2026年9月確認）。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">仙台・金沢方面はJR東日本・JR西日本の路線（はやぶさ・かがやき全車指定席）。えきねっと等で予約し、料金は公式サイト参照（JR東日本は2026-03-14運賃改定）。</text>
  <text x="1540" y="874" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 2026</text>
</svg>
