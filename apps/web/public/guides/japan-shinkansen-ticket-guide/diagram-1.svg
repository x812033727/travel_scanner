<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">新幹線車票決策樹：JR Pass、EX早特21、smartEX 或車站售票機 / Which Shinkansen ticket to buy</title>
  <desc id="desc">三個問題。問題一：7 天內會搭的新幹線票價加總超過 50,000 日圓嗎？是就買 JR Pass 7 天普通車 50,000 日圓（2026 年 10 月 1 日起旅行社價 53,000、官方線上購票暫維持 50,000），搭 のぞみ 每段再買加購券，東京到新大阪 4,960 日圓。否就問題二：距離出發還有 21 天以上而且日期不會再改嗎？是就買 EX早特21，東京到新大阪 12,980、京都 12,430、博多 17,920 日圓，21 天前 23:30 截止，不能改班次，退票 320 日圓。否就問題三：想在台灣先訂好、落地刷 IC 卡或 QR 進站嗎？是就用 smartEX 一般價，東京到新大阪 14,520、京都 13,970、名古屋 11,100 日圓，發車前改班次免費，退票 320 日圓；否就到車站售票機或綠色窗口買紙本票，一般票價、沒有早特折扣。補充：行李三邊合計 160 公分以內直接帶上車，161 到 250 公分要預約特大荷物スペースつき座席、不加價，沒預約收 1,000 日圓，超過 250 公分不能上車；旺季 のぞみ 全車指定席，指定席價格閑散期減 200、繁忙期加 200、最繁忙期加 400 日圓，JR Pass 不能搭 のぞみ 與 みずほ。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">新幹線車票怎麼買：三個問題選出買法（2026 年 9 月查證票價）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which Shinkansen ticket: JR Pass, EX Hayatoku 21, smartEX or the station ticket machine</text>

  <!-- Q1 -->
  <polygon points="800,120 1130,175 800,230 470,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="170" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　7 天內會搭的新幹線票價加總</text>
  <text x="800" y="196" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">（用 smartEX 價目表）超過 50,000 日圓？</text>
  <path d="M 1130 175 L 1156 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="165" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="122" width="410" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1365" y="152" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">JR Pass 7 天普通車 50,000 日圓</text>
  <text x="1365" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">10/1 起旅行社價 53,000；官方線上購票暫維持 50,000</text>
  <text x="1365" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">搭 のぞみ 每段再買加購券：東京〜新大阪 4,960</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="258" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,275 1130,330 800,385 470,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="325" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　距離出發還有 21 天以上，</text>
  <text x="800" y="351" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">而且日期、班次不會再改？</text>
  <path d="M 1130 330 L 1156 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="320" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="277" width="410" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1365" y="307" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">EX早特21（smartEX 會員早鳥票）</text>
  <text x="1365" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">東京〜新大阪 12,980・京都 12,430・博多 17,920</text>
  <text x="1365" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">21 天前 23:30 截止，不能改班次，退票 320 日圓</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="413" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="800,430 1130,485 800,540 470,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="480" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　想在台灣先訂好，落地直接</text>
  <text x="800" y="506" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">刷交通 IC 卡或 QR 車票進站？</text>
  <path d="M 1130 485 L 1156 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="475" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="432" width="410" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1365" y="462" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">smartEX 一般價（手機瀏覽器就能訂）</text>
  <text x="1365" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">東京〜新大阪 14,520・京都 13,970・名古屋 11,100</text>
  <text x="1365" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">發車前改班次免費不限次數，退票 320 日圓</text>
  <path d="M 470 485 L 444 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="452" y="475" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="432" width="410" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="235" y="462" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">車站售票機／綠色窗口買紙本票</text>
  <text x="235" y="488" font-size="15" fill="#4E3428" text-anchor="middle">售票機有英文選單、可劃指定席；一般票價</text>
  <text x="235" y="514" font-size="15" fill="#4E3428" text-anchor="middle">沒有早特折扣，旺季窗口要排隊</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">特大荷物　Oversized baggage（JR 東海）</text>
  <text x="88" y="650" font-size="16" fill="#102A2B">三邊合計 160 cm 以內：直接帶上車，放行李架或腳邊</text>
  <text x="88" y="678" font-size="16" fill="#102A2B">161〜250 cm：預約「特大荷物スペースつき座席」，不加價</text>
  <text x="88" y="706" font-size="16" fill="#102A2B">沒預約就上車：收 1,000 日圓；超過 250 cm 不能上車</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">旺季與價格　Peak seasons</text>
  <text x="848" y="650" font-size="16" fill="#102A2B">年末年始、黃金週、盂蘭盆節：のぞみ 全車指定席，先劃位</text>
  <text x="848" y="678" font-size="16" fill="#102A2B">指定席價格：閑散期 −200、繁忙期 +200、最繁忙期 +400 日圓</text>
  <text x="848" y="706" font-size="16" fill="#102A2B">JR Pass 不能搭 のぞみ・みずほ（連自由席也不行）</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">票價為大人單程、普通車指定席、通常期，單位日圓：smartEX 價目表 2025-04-01 版、EX早特21 價目表 2026-03-13 版、JR Pass 官網，2026 年 9 月查證。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">往仙台、金澤方向是 JR 東日本、JR 西日本的系統（はやぶさ、かがやき 全車指定席），用 えきねっと 訂，票價以官網為準；JR 東日本 2026-03-14 起調漲運賃。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
