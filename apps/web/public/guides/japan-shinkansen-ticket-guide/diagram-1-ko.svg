<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">신칸센 티켓 선택 결정도: JR Pass, EX 하야토쿠 21, smartEX 또는 역 발매기 / Which Shinkansen ticket to buy</title>
  <desc id="desc">세 가지 질문으로 선택합니다. 질문 1: 7일 안에 탈 신칸센 운임 합계가 50,000엔을 넘나요? 예라면 JR Pass 7일 보통차 50,000엔(2026년 10월 1일부터 여행사 판매가 53,000엔, 공식 온라인 사이트는 당분간 50,000엔 유지)을 선택하고, 노조미 탑승 시 구간별 추가권(도쿄~신오사카 4,960엔)을 별도로 구매합니다. 아니요라면 질문 2: 출발까지 21일 이상 남았고 날짜와 열차를 바꾸지 않을 건가요? 예라면 EX 하야토쿠 21을 선택합니다(도쿄~신오사카 12,980엔, 교토 12,430엔, 하카타 17,920엔, 탑승 21일 전 23시 30분 마감, 열차 변경 불가, 환불 수수료 320엔). 아니요라면 질문 3: 출발 전에 미리 예약하고 일본 도착 후 IC 카드나 QR 티켓으로 바로 탑승하고 싶나요? 예라면 smartEX 일반 요금을 이용합니다(도쿄~신오사카 14,520엔, 교토 13,970엔, 나고야 11,100엔, 출발 전 열차 변경 무료, 환불 수수료 320엔). 아니요라면 역 자동발매기나 미도리노마도구치에서 종이 티켓을 구매합니다(일반 운임, 하야토쿠 할인 없음). 참고: 수하물 세 변 합계 160cm 이하는 그대로 반입 가능하고, 161~250cm는 특대 수하물 공간 포함 좌석을 추가 요금 없이 사전 예약해야 하며 미예약 시 1,000엔이 부과되고 250cm 초과는 반입 불가합니다. 성수기에는 노조미 전 좌석이 지정석으로 운영되며 지정석 요금은 한산기 200엔 할인, 번망기 200엔 추가, 최번망기 400엔 추가입니다. JR Pass만으로는 노조미와 미즈호를 탈 수 없습니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">신칸센 티켓 구매법: 세 가지 질문으로 고르기 (2026년 9월 확인 요금)</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which Shinkansen ticket: JR Pass, EX Hayatoku 21, smartEX or the station ticket machine</text>

  <!-- Q1 -->
  <polygon points="800,118 1095,175 800,232 505,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="168" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 1　7일 내 신칸센 운임 합계가</text>
  <text x="800" y="194" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">(smartEX 기준) 50,000엔 초과?</text>
  <path d="M 1095 175 L 1136 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="157" font-size="15" fill="#5C6B6B" text-anchor="middle">예</text>
  <rect x="1140" y="122" width="440" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1360" y="152" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">JR Pass 7일 보통차 50,000엔</text>
  <text x="1360" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">10/1부터 여행사 53,000 · 공식 사이트 50,000엔</text>
  <text x="1360" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">노조미 구간별 추가권: 도쿄~신오사카 4,960엔</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="820" y="258" font-size="15" fill="#5C6B6B">아니요</text>

  <!-- Q2 -->
  <polygon points="800,273 1095,330 800,387 505,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="323" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 2　출발까지 21일 이상 남았고,</text>
  <text x="800" y="349" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">날짜·열차를 바꾸지 않을 건가요?</text>
  <path d="M 1095 330 L 1136 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">예</text>
  <rect x="1140" y="277" width="440" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1360" y="307" font-size="17" font-weight="700" fill="#0B4F4D" text-anchor="middle">EX 하야토쿠 21 (smartEX 얼리버드)</text>
  <text x="1360" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">도쿄~신오사카 12,980 · 교토 12,430 · 하카타 17,920</text>
  <text x="1360" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">21일 전 23시 30분 마감, 열차 변경 불가, 환불 320엔</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="820" y="413" font-size="15" fill="#5C6B6B">아니요</text>

  <!-- Q3 -->
  <polygon points="800,428 1095,485 800,542 505,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="478" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 3　출발 전에 미리 예약하고</text>
  <text x="800" y="504" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">IC 카드·QR로 바로 승차할 건가요?</text>
  <path d="M 1095 485 L 1136 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1110" y="467" font-size="15" fill="#5C6B6B" text-anchor="middle">예</text>
  <rect x="1140" y="432" width="440" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1360" y="462" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">smartEX 일반 요금 (모바일 웹 예약 가능)</text>
  <text x="1360" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">도쿄~신오사카 14,520 · 교토 13,970 · 나고야 11,100</text>
  <text x="1360" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">출발 전 열차 변경 무제한 무료, 환불 320엔</text>
  <path d="M 505 485 L 464 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="488" y="465" font-size="15" fill="#5C6B6B" text-anchor="middle">아니요</text>
  <rect x="20" y="432" width="440" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="240" y="462" font-size="17" font-weight="700" fill="#4E3428" text-anchor="middle">역 자동발매기／미도리노마도구치 구매</text>
  <text x="240" y="488" font-size="15" fill="#4E3428" text-anchor="middle">발매기 영어 메뉴 지원 · 지정석 선택 가능(일반 운임)</text>
  <text x="240" y="514" font-size="15" fill="#4E3428" text-anchor="middle">하야토쿠 할인 없음, 성수기 유인 창구는 대기 발생</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">특대 수하물　Oversized baggage (JR 도카이)</text>
  <text x="88" y="650" font-size="15.5" fill="#102A2B">세 변 합계 160 cm 이하: 그대로 들고 타서 선반이나 발밑에 보관</text>
  <text x="88" y="678" font-size="15.5" fill="#102A2B">161~250 cm: '특대 수하물 공간 포함 좌석' 사전 예약 필수(추가 요금 없음)</text>
  <text x="88" y="706" font-size="15.5" fill="#102A2B">미예약 반입 시 1,000엔 부과 · 250 cm 초과는 열차 반입 불가</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">성수기와 요금　Peak seasons</text>
  <text x="848" y="650" font-size="15.5" fill="#102A2B">연말연시·골든위크·오봉 등: 노조미 전 좌석 지정석 운영(사전 예약 필수)</text>
  <text x="848" y="678" font-size="15.5" fill="#102A2B">지정석 시즌 차액: 한산기 −200 · 번망기 +200 · 최번망기 +400엔</text>
  <text x="848" y="706" font-size="15.5" fill="#102A2B">JR Pass만으로는 노조미·미즈호 탑승 불가(자유석 포함)</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">요금은 성인 편도·보통차 지정석·통상기(단위: 엔). smartEX 2025-04-01판, EX 하야토쿠 21 2026-03-13판, JR Pass 공식 사이트(2026년 9월 확인).</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">센다이·가나자와 방면은 JR 동일본·JR 서일본 노선(하야부사·가가야키 전 좌석 지정석)으로 에키넷 예매, 요금은 공식 사이트 기준(JR 동일본 2026-03-14 인상).</text>
  <text x="1540" y="874" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 2026</text>
</svg>
