<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">新干线车票决策树：JR Pass、EX早特21、smartEX 或车站售票机 / Which Shinkansen ticket to buy</title>
  <desc id="desc">三个问题。问题一：7 天内所搭新干线票价合计超过 50,000 日元吗？是就买 JR Pass 7 天普通车 50,000 日元（2026 年 10 月 1 日起旅行社价 53,000、官方在线购票暂维持 50,000），乘坐 のぞみ 每段另买加购券，东京到新大阪 4,960 日元。否就进入问题二：距离出发还有 21 天以上且日期、车次不会再改吗？是就买 EX早特21，东京到新大阪 12,980、京都 12,430、博多 17,920 日元，21 天前 23:30 截止，不可改签车次，退票 320 日元。否就进入问题三：想在出发前先订好、落地刷交通 IC 卡或 QR 车票进站吗？是就买 smartEX 普通价，东京到新大阪 14,520、京都 13,970、名古屋 11,100 日元，发车前改签免费，退票 320 日元；否就到车站售票机或绿色窗口买纸质票，标准票价、无早特折扣。补充：行李三边合计 160 厘米以内可直接带上车，161 至 250 厘米须预约特大荷物スペースつき座席、不加价，未预约收 1,000 日元，超过 250 厘米不可上车；旺季 のぞみ 全席指定席，指定席票价闲散期减 200、繁忙期加 200、最繁忙期加 400 日元，JR Pass 不可乘坐 のぞみ 与 みずほ。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">新干线车票怎么买：三个问题选出买法（2026 年 9 月核实票价）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which Shinkansen ticket: JR Pass, EX Hayatoku 21, smartEX or the station ticket machine</text>

  <!-- Q1 -->
  <polygon points="800,120 1095,175 800,230 505,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="168" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 1　7 天内所搭新干线票价合计</text>
  <text x="800" y="193" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">（按 smartEX 价目表）超过 50,000 日元？</text>
  <path d="M 1095 175 L 1136 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1112" y="157" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="1140" y="122" width="440" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1360" y="152" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">JR Pass 7 天普通车 50,000 日元</text>
  <text x="1360" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">10/1 起旅行社价 53,000；官方在线购票暂维持 50,000</text>
  <text x="1360" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">搭 のぞみ 每段须买加购券：东京〜新大阪 4,960</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="818" y="258" font-size="15" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,275 1095,330 800,385 505,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="325" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 2　距离出发还有 21 天以上，</text>
  <text x="800" y="351" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">且出发日期、车次不会再改？</text>
  <path d="M 1095 330 L 1136 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1112" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="1140" y="277" width="440" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1360" y="307" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">EX早特21（smartEX 会员早鸟票）</text>
  <text x="1360" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">东京〜新大阪 12,980・京都 12,430・博多 17,920</text>
  <text x="1360" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">21 天前 23:30 截止，不可改签，退票 320 日元</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="818" y="413" font-size="15" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="800,430 1095,485 800,540 505,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="480" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 3　想出发前先订好，落地直接</text>
  <text x="800" y="506" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">刷交通 IC 卡或 QR 车票进站？</text>
  <path d="M 1095 485 L 1136 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1112" y="467" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="1140" y="432" width="440" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1360" y="462" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">smartEX 普通价（手机浏览器即可订）</text>
  <text x="1360" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">东京〜新大阪 14,520・京都 13,970・名古屋 11,100</text>
  <text x="1360" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">发车前改签车次免费不限次数，退票 320 日元</text>
  <path d="M 505 485 L 464 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="488" y="467" font-size="15" fill="#5C6B6B" text-anchor="middle">否</text>
  <rect x="20" y="432" width="440" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="240" y="462" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">车站售票机／绿色窗口买纸质票</text>
  <text x="240" y="488" font-size="15" fill="#4E3428" text-anchor="middle">售票机有英文菜单、可选指定席；标准票价</text>
  <text x="240" y="514" font-size="15" fill="#4E3428" text-anchor="middle">没有早特折扣，旺季窗口常需排队</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">特大行李　Oversized baggage（JR 东海）</text>
  <text x="88" y="650" font-size="16" fill="#102A2B">三边合计 160 cm 以内：直接带上车，放行李架或脚边</text>
  <text x="88" y="678" font-size="16" fill="#102A2B">161〜250 cm：预约“特大荷物スペースつき座席”，不加价</text>
  <text x="88" y="706" font-size="16" fill="#102A2B">未预约直接上车：收 1,000 日元；超过 250 cm 不可带上车</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">旺季与票价　Peak seasons</text>
  <text x="848" y="650" font-size="16" fill="#102A2B">年末年始、黄金周、盂兰盆节：のぞみ 全席指定席，先选座</text>
  <text x="848" y="678" font-size="16" fill="#102A2B">指定席票价：闲散期 −200、繁忙期 +200、最繁忙期 +400 日元</text>
  <text x="848" y="706" font-size="16" fill="#102A2B">JR Pass 不可乘坐 のぞみ・みずほ（自由席也不行）</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">票价为成人单程、普通车指定席、通常期，单位日元：smartEX 价目表 2025-04-01 版、EX早特21 价目表 2026-03-13 版、JR Pass 官网，2026 年 9 月核实。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">往仙台、金泽方向属 JR 东日本、JR 西日本线路（はやぶさ、かがやき 全车指定席），用 えきねっと 预订，票价以官网为准；JR 东日本 2026-03-14 起上调运赁。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 制图 2026</text>
</svg>
