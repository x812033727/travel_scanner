<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">四道關卡：銀行在確認什麼，詐騙從哪裡切進來 / Four checkpoints in online banking</title>
<desc id="desc">四組上下成對的方塊並排。上排是銀行在每一道關卡確認的事：第一關登入，用帳號、密碼與圖形鎖證明你知道只有你知道的事；第二關裝置，用設備指定與生物辨識確認是你約定的那一台；第三關交易確認，用一次性密碼與憑證簽章確認這一筆是你發動的；第四關額度上限，用非約定轉帳的單筆與累計限額限制最壞情況的損失。每一組上方的方塊各有一個向下的箭頭指到下方的方塊，下排是同一道關卡被繞過的方式：第一關是仿冒頁面，連結由別人送到你手上，你在假網頁輸入帳號密碼；第二關是引導綁定，你照指示完成一次設定，別人的裝置就綁進來了；第三關是索取一次性密碼，對方以驗證身分為名要你唸出，等於替對方簽了名；第四關是通話中調高，要你把額度開到最大或改掉綁定的門號。最下方一條橫幅寫著非約定轉帳的限額就是最壞情況下的損失上限，並列出每筆五萬元、每天累積十萬元、每月累積二十萬元三個數字。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">四道關卡：銀行在確認什麼，詐騙從哪裡切進來</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Four checkpoints in online banking · 上排是機制，下排是同一道關卡被繞過的方式</text>

<rect x="60" y="176" width="340" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="230" y="220" text-anchor="middle" font-size="17" fill="#5C6B6B">第一關</text>
<text x="230" y="268" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">登入</text>
<text x="230" y="318" text-anchor="middle" font-size="18" fill="#5C6B6B">帳號、密碼與圖形鎖</text>
<text x="230" y="356" text-anchor="middle" font-size="18" fill="#5C6B6B">證明你知道只有你知道的事</text>

<rect x="440" y="176" width="340" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="610" y="220" text-anchor="middle" font-size="17" fill="#5C6B6B">第二關</text>
<text x="610" y="268" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">裝置</text>
<text x="610" y="318" text-anchor="middle" font-size="18" fill="#5C6B6B">設備指定與生物辨識</text>
<text x="610" y="356" text-anchor="middle" font-size="18" fill="#5C6B6B">確認是你約定的那一台</text>

<rect x="820" y="176" width="340" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="990" y="220" text-anchor="middle" font-size="17" fill="#5C6B6B">第三關</text>
<text x="990" y="268" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">交易確認</text>
<text x="990" y="318" text-anchor="middle" font-size="18" fill="#5C6B6B">一次性密碼與憑證簽章</text>
<text x="990" y="356" text-anchor="middle" font-size="18" fill="#5C6B6B">確認這一筆是你發動的</text>

<rect x="1200" y="176" width="340" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1370" y="220" text-anchor="middle" font-size="17" fill="#5C6B6B">第四關</text>
<text x="1370" y="268" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">額度上限</text>
<text x="1370" y="318" text-anchor="middle" font-size="18" fill="#5C6B6B">非約定轉帳的單筆與累計</text>
<text x="1370" y="356" text-anchor="middle" font-size="18" fill="#5C6B6B">限制最壞情況的損失</text>

<path d="M230 402 L230 438" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M610 402 L610 438" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M990 402 L990 438" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1370 402 L1370 438" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="444" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="230" y="488" text-anchor="middle" font-size="17" fill="#5C6B6B">詐騙從這裡切進來</text>
<text x="230" y="536" text-anchor="middle" font-size="26" font-weight="700" fill="#B8442D">仿冒頁面</text>
<text x="230" y="586" text-anchor="middle" font-size="18" fill="#5C6B6B">連結由別人送到你手上</text>
<text x="230" y="624" text-anchor="middle" font-size="18" fill="#5C6B6B">在假網頁輸入帳號密碼</text>

<rect x="440" y="444" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="610" y="488" text-anchor="middle" font-size="17" fill="#5C6B6B">詐騙從這裡切進來</text>
<text x="610" y="536" text-anchor="middle" font-size="26" font-weight="700" fill="#B8442D">引導綁定</text>
<text x="610" y="586" text-anchor="middle" font-size="18" fill="#5C6B6B">照指示完成一次設定</text>
<text x="610" y="624" text-anchor="middle" font-size="18" fill="#5C6B6B">別人的裝置就綁進來了</text>

<rect x="820" y="444" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="990" y="488" text-anchor="middle" font-size="17" fill="#5C6B6B">詐騙從這裡切進來</text>
<text x="990" y="536" text-anchor="middle" font-size="26" font-weight="700" fill="#B8442D">索取 OTP</text>
<text x="990" y="586" text-anchor="middle" font-size="18" fill="#5C6B6B">以驗證身分為名要你唸出</text>
<text x="990" y="624" text-anchor="middle" font-size="18" fill="#5C6B6B">等於替對方簽了名</text>

<rect x="1200" y="444" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1370" y="488" text-anchor="middle" font-size="17" fill="#5C6B6B">詐騙從這裡切進來</text>
<text x="1370" y="536" text-anchor="middle" font-size="26" font-weight="700" fill="#B8442D">通話中調高</text>
<text x="1370" y="586" text-anchor="middle" font-size="18" fill="#5C6B6B">要你把額度開到最大</text>
<text x="1370" y="624" text-anchor="middle" font-size="18" fill="#5C6B6B">或改掉綁定的門號</text>

<rect x="60" y="702" width="1480" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="748" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">非約定轉帳的限額，就是最壞情況下的損失上限</text>
<text x="800" y="794" text-anchor="middle" font-size="26" fill="#102A2B">每筆 5 萬元　每天累積 10 萬元　每月累積 20 萬元</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
