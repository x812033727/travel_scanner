<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">繳不出保費時的分岔 / A fork in the road when a premium goes unpaid</title>
  <desc id="desc">一張簡化的插圖：左邊是一份保單文件，上面有一條標題色帶、幾行文字線條與一個盾牌圖形；文件右側延伸出一條線，在一個圓點處分成上下兩條。上面那條通往三個大小相同、並排的圓角方塊，代表停效之前可以申請的三個選項；下面那條通往一個沙漏，代表停效之後的復效期限。圖的下方有一行字：繳不出保費時的選項。全圖使用米色底與深綠、藍、橘三色線條，沒有任何品牌標誌、人物或金額。</desc>
