<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">保險費沒繳之後的分岔 / What happens after a life premium goes unpaid</title>
  <desc id="desc">左邊是停效之前可以向保險公司申請的三個選項：減額繳清保險，保額降低而保險期間不變，不必再繳費，依示範條款第二十條；展期定期保險，保額不變而保險期間縮短，不必再繳費，依第二十一條；自動墊繳保險費，原契約不變，以保單價值準備金墊繳並計息，耗盡後契約效力停止，依第六條。三者的共同前提是要保人繳足保險費累積達有保單價值準備金。右邊是沒有申請任何變更時契約自己會走的路：第二期以後的保險費到期未交付，年繳與半年繳自催告到達起算、月繳與季繳自保險單所載交付日起算寬限期間，寬限期間不得低於三十日且契約此時仍然有效，逾寬限期間仍未交付則契約自寬限期間終了翌日起停止效力。停效後分成兩條復效路徑：停效六個月內清償保險費與契約約定之利息，翌日上午零時起恢復效力，不必提供可保證明；停效六個月後，保險人得於申請日起五日內要求被保險人可保證明，收齊後十五日內不為拒絕即視為同意恢復效力，除危險程度重大變更外不得拒絕。最後，申請復效的期限自停效日起不得低於二年，且不得遲於保險期間屆滿日，期限屆滿後保險人有終止契約之權。依據為保險法第 116 條與人壽保險單示範條款第五條、第六條、第七條。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#0D6B68"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">保險費沒繳之後：三個選項，一條分岔</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Lapse, grace period and reinstatement under the Insurance Act and the model life policy clauses</text>

  <text x="60" y="145" font-size="20" font-weight="700" fill="#0D6B68">停效前可以申請的三個選項</text>
  <rect x="60" y="168" width="420" height="158" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="270" y="207" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">減額繳清保險</text>
  <text x="270" y="243" font-size="17" fill="#102A2B" text-anchor="middle">保額降低，保險期間不變</text>
  <text x="270" y="273" font-size="17" fill="#102A2B" text-anchor="middle">不必再繼續繳保險費</text>
  <text x="270" y="305" font-size="16" fill="#5C6B6B" text-anchor="middle">示範條款第二十條</text>

  <rect x="60" y="346" width="420" height="158" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="270" y="385" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">展期定期保險</text>
  <text x="270" y="421" font-size="17" fill="#102A2B" text-anchor="middle">保額不變，保險期間縮短</text>
  <text x="270" y="451" font-size="17" fill="#102A2B" text-anchor="middle">不必再繼續繳保險費</text>
  <text x="270" y="483" font-size="16" fill="#5C6B6B" text-anchor="middle">示範條款第二十一條</text>

  <rect x="60" y="524" width="420" height="188" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="270" y="563" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">自動墊繳保險費</text>
  <text x="270" y="599" font-size="17" fill="#102A2B" text-anchor="middle">原契約不變，以保單價值</text>
  <text x="270" y="629" font-size="17" fill="#102A2B" text-anchor="middle">準備金墊繳並計息</text>
  <text x="270" y="659" font-size="17" fill="#102A2B" text-anchor="middle">耗盡後契約效力停止</text>
  <text x="270" y="691" font-size="16" fill="#5C6B6B" text-anchor="middle">示範條款第六條</text>

  <text x="270" y="754" font-size="16" fill="#5C6B6B" text-anchor="middle">共同前提：要保人繳足保險費</text>
  <text x="270" y="780" font-size="16" fill="#5C6B6B" text-anchor="middle">累積達有保單價值準備金</text>

  <text x="560" y="145" font-size="20" font-weight="700" fill="#102A2B">沒有申請任何變更時，契約自己會走的路</text>

  <rect x="560" y="168" width="980" height="66" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1050" y="209" font-size="19" fill="#102A2B" text-anchor="middle">第二期以後的保險費到期未交付</text>
  <line x1="1050" y1="234" x2="1050" y2="258" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="560" y="262" width="980" height="66" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1050" y="303" font-size="19" fill="#102A2B" text-anchor="middle">年繳、半年繳：催告到達；月繳、季繳：保險單所載交付日</text>
  <line x1="1050" y1="328" x2="1050" y2="352" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="560" y="356" width="980" height="66" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1050" y="397" font-size="19" fill="#102A2B" text-anchor="middle">寬限期間，不得低於三十日；契約此時仍然有效</text>
  <line x1="1050" y1="422" x2="1050" y2="446" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="560" y="450" width="980" height="66" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1050" y="491" font-size="19" font-weight="700" fill="#B8442D" text-anchor="middle">逾寬限期間仍未交付，契約自寬限期間終了翌日起停止效力</text>

  <path d="M 1050 516 L 1050 532 L 785 532" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 1050 532 L 1315 532" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/>
  <line x1="785" y1="532" x2="785" y2="544" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1315" y1="532" x2="1315" y2="544" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="560" y="548" width="450" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="785" y="592" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">停效六個月內</text>
  <text x="785" y="630" font-size="16" fill="#102A2B" text-anchor="middle">清償保險費與契約約定之利息</text>
  <text x="785" y="660" font-size="16" fill="#102A2B" text-anchor="middle">翌日上午零時起恢復效力</text>
  <text x="785" y="690" font-size="16" fill="#102A2B" text-anchor="middle">不必提供可保證明</text>

  <rect x="1090" y="548" width="450" height="160" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1315" y="592" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">停效六個月後</text>
  <text x="1315" y="630" font-size="16" fill="#102A2B" text-anchor="middle">保險人得於申請日起五日內要求可保證明</text>
  <text x="1315" y="660" font-size="16" fill="#102A2B" text-anchor="middle">收齊後十五日內不為拒絕，視為同意復效</text>
  <text x="1315" y="690" font-size="16" fill="#102A2B" text-anchor="middle">除危險程度重大變更外不得拒絕</text>

  <path d="M 785 708 L 785 724 L 1315 724 L 1315 708" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/>
  <line x1="1050" y1="724" x2="1050" y2="736" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="560" y="740" width="980" height="76" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1050" y="772" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">申請復效的期限：自停效日起不得低於二年，且不得遲於保險期間屆滿日</text>
  <text x="1050" y="799" font-size="16" fill="#5C6B6B" text-anchor="middle">期限屆滿後，保險人有終止契約之權</text>

  <text x="560" y="852" font-size="16" fill="#5C6B6B">依據：保險法第 116 條，人壽保險單示範條款第五條、第六條、第七條</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
