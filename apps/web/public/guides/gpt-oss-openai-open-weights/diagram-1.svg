<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">gpt-oss 在 OpenAI 產品線的位置 / Where gpt-oss sits in OpenAI's line-up</title>
<desc id="desc">三欄對照。左欄 ChatGPT：網頁與 App 登入就用，搜尋、記憶、圖片、語音由產品提供，模型與機器由 OpenAI 代管，裡面沒有 gpt-oss。中欄 OpenAI API 平台：開發者用程式呼叫，有多模態與內建工具，依用量計費，模型與機器一樣由 OpenAI 代管，也沒有 gpt-oss。右欄開放權重 gpt-oss：gpt-oss-120b 與 gpt-oss-20b 兩個版本，授權 Apache 2.0、權重免費下載，上下文視窗 128K，120b 要單張 80GB GPU、20b 要 16GB 記憶體，在自己的機器上執行，純文字，不在 ChatGPT 與 API 裡。下方一行結論：前兩條路的模型與機器由 OpenAI 代管，你付訂閱費或用量費；第三條把權重交到你手上，可以商用與微調，機器與費用也歸你。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
</marker>
</defs>
