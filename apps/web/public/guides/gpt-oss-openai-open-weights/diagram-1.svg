<text x="600" y="252" font-size="19" fill="#102A2B">・開發者用程式呼叫</text>
<text x="600" y="310" font-size="19" fill="#102A2B">・多模態與內建工具</text>
<text x="600" y="368" font-size="19" fill="#102A2B">・依用量計費</text>
