<rect x="180" y="230" width="400" height="300" rx="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
<rect x="232" y="287" width="296" height="46" rx="16" fill="#0D6B68"/>
<rect x="232" y="357" width="230" height="46" rx="16" fill="#2E7D5B"/>
<rect x="232" y="427" width="296" height="46" rx="16" fill="#0D6B68"/>

<line x1="628" y1="380" x2="852" y2="380" stroke="#D97A2B" stroke-width="16" stroke-linecap="round" marker-end="url(#heroarrow)"/>

<rect x="900" y="200" width="520" height="340" rx="24" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/>
<circle cx="1160" cy="370" r="78" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
