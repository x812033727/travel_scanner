<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">開放權重下載到自己的機器 / Open weights, downloaded onto your own machine</title>
<desc id="desc">簡單幾何插圖。左邊一個墨綠色邊框的圓角方塊，裡面疊著三條粗橫條，代表可以下載的模型權重檔案。中間一支橘色粗箭頭指向右邊。右邊是一台簡化的螢幕：白底圓角方塊加上支架與底座，畫面中央只有一個墨綠色的圓，沒有任何介面或標誌。四周散布幾個小圓點作為裝飾。畫面下方一行字寫著「權重在你的機器上」。</desc>
<defs>
<marker id="heroarrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#D97A2B"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

<circle cx="130" cy="150" r="14" fill="#0D6B68" opacity="0.35"/>
