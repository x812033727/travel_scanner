<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">修圖前先固定主體</title><desc id="desc">參考圖：說明形狀與顏色用途；單次修改：只改一類問題；前後比對：檢查輪廓與留白</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">修圖前先固定主體</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">參考圖</text><text x="245" y="333" font-size="76" fill="#87583B">說明形狀與顏色用途</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">單次修改</text><text x="245" y="558" font-size="76" fill="#87583B">只改一類問題</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">前後比對</text><text x="245" y="783" font-size="76" fill="#87583B">檢查輪廓與留白</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>