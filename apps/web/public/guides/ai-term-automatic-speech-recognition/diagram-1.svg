<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">先核對說出的話，再整理決議</title>
<desc id="desc">錄音到逐字稿、校訂、摘要的順序流程，關鍵詞核對另有回到原音的路徑</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">先核對說出的話，再整理決議</text><text x="60" y="84" font-size="18" fill="#5C6B6B">ASR｜聲音變成文字只是第一步</text><path d="M380 302H450" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M760 302H830" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1140 302H1210" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M985 380V475H805V580" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M570 657H225V380" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="225" width="310" height="155" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="225" y="294.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">原始錄音</text><text x="225" y="344.5" text-anchor="middle" font-size="25" fill="#5C6B6B">保留可回聽材料</text><rect x="450" y="225" width="310" height="155" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="605" y="294.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">ASR 逐字稿</text><text x="605" y="344.5" text-anchor="middle" font-size="25" fill="#5C6B6B">音訊對應文字</text><rect x="830" y="225" width="310" height="155" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="985" y="294.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">人工校訂</text><text x="985" y="344.5" text-anchor="middle" font-size="25" fill="#5C6B6B">否定詞與專有名詞</text><rect x="1210" y="225" width="310" height="155" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1365" y="294.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">摘要與待辦</text><text x="1365" y="344.5" text-anchor="middle" font-size="25" fill="#5C6B6B">再確認決議關係</text><rect x="570" y="580" width="470" height="155" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="805" y="649.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">標記不清楚片段</text><text x="805" y="699.5" text-anchor="middle" font-size="25" fill="#5C6B6B">時間戳也要抽查</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
