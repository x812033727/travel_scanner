<title id="title">Google Vids, Gemini Omni 1.1로 무료 동영상 생성 개방: 누가 쓸 수 있나, 한도 읽는 법, 사용 전 제한</title><desc id="desc">오리지널 일러스트: 필름 스트립과 재생 표시가 있는 데스크톱 화면입니다. 오른쪽에는 독립된 게이지 두 개가 있는데, 각각 두 도움말 페이지의 서로 다른 한도를 나타내며 채워진 높이가 다릅니다. 각각 아래에 작은 카드가 있습니다. 상표나 실존 인물은 포함되어 있지 않습니다.</desc>
