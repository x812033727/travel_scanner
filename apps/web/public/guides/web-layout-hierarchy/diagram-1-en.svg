<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Event Page Information Hierarchy Example</title><desc id="desc">Three cards organize understanding the event, deciding whether to participate, and taking action, showing how to establish a reading hierarchy within one page.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Event Page Information Hierarchy Example</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Each level answers a different question; emphasis follows purpose</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 29px;">First, understand the event</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">What is being exchanged</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Event time and place</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Clarify in the title and summary</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Then assess suitability</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Which books you can bring</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Participation limits and prep</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Group related requirements</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1092.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Next, complete the action</text>
<text x="1092.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Registration access and next step</text>
<text x="1092.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Action results and error messages</text>
<text x="1092.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Keep essential reminders readable</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Every level must be readable; lower priority does not mean content can be omitted or hidden.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original diagram by Mokaair</text>
</svg>
