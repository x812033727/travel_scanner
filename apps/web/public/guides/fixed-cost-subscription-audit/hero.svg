<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">固定支出健檢：剪斷一次，之後每個月都不再扣</title>
<desc id="desc">一條粗實線由左向右延伸，線上串著兩個實心圓點，代表已經發生過的扣款。線的中段被一把剪刀剪斷，剪刀由兩個圓環握把與兩片交叉的刀刃組成。剪斷之後的右半段轉為淡色虛線，上面串著四個空心圓點，代表不再發生的扣款。下方有一行短標題文字。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<path d="M150 360 L540 360" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="butt"/>
<path d="M700 360 L1440 360" fill="none" stroke="#5C6B6B" stroke-width="14" stroke-linecap="butt" stroke-dasharray="26 20"/>

<circle cx="230" cy="360" r="54" fill="#0D6B68"/>
<circle cx="400" cy="360" r="54" fill="#0D6B68"/>

<circle cx="830" cy="360" r="54" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="10"/>
<circle cx="1030" cy="360" r="54" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="10"/>
<circle cx="1230" cy="360" r="54" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="10"/>
<circle cx="1430" cy="360" r="54" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="10"/>

<circle cx="520" cy="300" r="36" fill="none" stroke="#B8442D" stroke-width="14"/>
<circle cx="520" cy="420" r="36" fill="none" stroke="#B8442D" stroke-width="14"/>
<path d="M548 402 L724 278" fill="none" stroke="#B8442D" stroke-width="14" stroke-linecap="round"/>
<path d="M548 318 L724 442" fill="none" stroke="#B8442D" stroke-width="14" stroke-linecap="round"/>
<circle cx="607" cy="360" r="13" fill="#B8442D"/>

<text x="800" y="640" text-anchor="middle" font-size="46" font-weight="700" fill="#102A2B">一年一次，固定支出健檢</text>
</svg>
