<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一筆固定支出的三個問題 / Three questions for one recurring cost</title>
<desc id="desc">一筆已經攤提到每月的固定支出，依序經過三個問題。第一問是過去三個月實際用過幾次，一次也沒有就往下走到取消，用過就往右。第二問是有沒有夠用的低一階方案，有就往下走到降級，沒有就往右。第三問是取消之後最壞會怎樣，承受不了就往下走到保留，只是不方便就取消。圖的下方另有一條橫條，說明還在綁約期間時先查契約上的剩餘期間與提前終止條件，把可以終止的日期設成提醒，並把取消完的項目寫進清單。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一筆固定支出的三個問題：取消、降級或保留</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Fixed-cost audit · 答案成立就往下，不成立就往右</text>
<text x="60" y="150" font-size="20" fill="#5C6B6B">先把年繳金額除以 12 換算成每月，再一筆一筆走這三個問題。</text>

<path d="M296 305 L354 305" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M706 305 L774 305" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1126 305 L1194 305" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M530 436 L530 504" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M950 436 L950 504" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1370 436 L1370 504" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="50" y="230" width="240" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="170" y="272" text-anchor="middle" font-size="17" fill="#5C6B6B">每年一次</text>
<text x="170" y="316" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">一筆固定支出</text>
<text x="170" y="354" text-anchor="middle" font-size="18" fill="#5C6B6B">已攤提到每月</text>

<rect x="360" y="180" width="340" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="530" y="222" text-anchor="middle" font-size="17" fill="#5C6B6B">第一問</text>
<text x="530" y="270" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">過去三個月</text>
<text x="530" y="306" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">實際用過幾次</text>
<text x="530" y="356" text-anchor="middle" font-size="19" fill="#5C6B6B">一次也沒有：往下</text>
<text x="530" y="390" text-anchor="middle" font-size="19" fill="#5C6B6B">有用過：往右</text>

<rect x="780" y="180" width="340" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="950" y="222" text-anchor="middle" font-size="17" fill="#5C6B6B">第二問</text>
<text x="950" y="270" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">有沒有夠用的</text>
<text x="950" y="306" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">低一階方案</text>
<text x="950" y="356" text-anchor="middle" font-size="19" fill="#5C6B6B">有：往下</text>
<text x="950" y="390" text-anchor="middle" font-size="19" fill="#5C6B6B">沒有：往右</text>

<rect x="1200" y="180" width="340" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1370" y="222" text-anchor="middle" font-size="17" fill="#5C6B6B">第三問</text>
<text x="1370" y="270" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">取消之後</text>
<text x="1370" y="306" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">最壞會怎樣</text>
<text x="1370" y="356" text-anchor="middle" font-size="19" fill="#5C6B6B">承受不了：往下</text>
<text x="1370" y="390" text-anchor="middle" font-size="19" fill="#5C6B6B">只是不方便：取消</text>

<rect x="390" y="510" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="530" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">取消</text>
<text x="530" y="598" text-anchor="middle" font-size="18" fill="#5C6B6B">當月就執行</text>

<rect x="810" y="510" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="950" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">降級</text>
<text x="950" y="598" text-anchor="middle" font-size="18" fill="#5C6B6B">改成低一階方案</text>

<rect x="1230" y="510" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1370" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">保留</text>
<text x="1370" y="598" text-anchor="middle" font-size="18" fill="#5C6B6B">明年再問一次</text>

<rect x="50" y="700" width="1500" height="110" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="746" text-anchor="middle" font-size="20" fill="#102A2B">還在綁約期間的，先查契約上的剩餘期間與提前終止條件</text>
<text x="800" y="784" text-anchor="middle" font-size="20" fill="#5C6B6B">把可以終止的日期設成提醒，取消完的寫進清單，明年健檢先看這份清單</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
