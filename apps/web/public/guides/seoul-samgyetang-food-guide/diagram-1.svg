<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">蔘雞湯解碼圖：鍋裡的基本款與菜單上的差別 / How Seoul's samgyetang menu adds up</title>
  <desc id="desc">圖上的標題是「鍋裡的基本款，菜單上的差別」，副標是「What’s in the pot, and menu variations」。圖分左右兩欄。左欄標題「基本款的鍋裡」，五個方框由上而下列出基本款鍋裡的五樣東西，每一個都先寫韓文再寫中文：닭（雞）、찹쌀（糯米）、마늘（蒜）、대추（紅棗）、인삼（人蔘）。右欄標題「菜單上的變化」，四個方框各寫一種菜單上的寫法，底下一行是說明：전복삼계탕（鮑魚蔘雞湯），基本款再加鮑魚；오골계탕（烏骨雞湯），雞換成烏骨雞；산삼삼계탕（Sansam samgyetang）與토종삼계탕（Tojong samgyetang），兩個的說明都是「名稱看不出配方，點前先問」。下方一條橫幅是上桌之後怎麼吃，三步用箭頭串起來：上桌就是煮好的 → 先用鹽調味、喝一口湯 → 雞肉夾出來沾鹽；底下小字寫「鹽可按口味調整」。右下角是「© Mokaair 製圖 2026」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">鍋裡的基本款，菜單上的差別</text>
  <text x="60" y="82" font-size="18" fill="#5C6B6B">What's in the pot, and menu variations</text>

  <!-- column headers -->
  <rect x="40" y="104" width="740" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="134" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">基本款的鍋裡</text>
  <text x="410" y="158" font-size="15" fill="#0B4F4D" text-anchor="middle">雞、糯米、蒜、紅棗、人蔘</text>

  <rect x="820" y="104" width="740" height="64" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"/>
  <text x="1190" y="134" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">菜單上的變化</text>
  <text x="1190" y="158" font-size="15" fill="#8A4A14" text-anchor="middle">加料、換雞種或不同命名</text>

  <!-- left column: 5 single-line rows -->
  <rect x="40" y="180" width="740" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="240" font-size="24" font-weight="700" fill="#0B4F4D">닭　雞</text>

  <rect x="40" y="300" width="740" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="360" font-size="24" font-weight="700" fill="#0B4F4D">찹쌀　糯米</text>

  <rect x="40" y="420" width="740" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="480" font-size="24" font-weight="700" fill="#0B4F4D">마늘　蒜</text>

  <rect x="40" y="540" width="740" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="600" font-size="24" font-weight="700" fill="#0B4F4D">대추　紅棗</text>

  <rect x="40" y="660" width="740" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="720" font-size="24" font-weight="700" fill="#0B4F4D">인삼　人蔘</text>

  <!-- right column: 4 two-line rows -->
  <rect x="820" y="180" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="228" font-size="21" font-weight="700" fill="#8A4A14">전복삼계탕　鮑魚蔘雞湯</text>
  <text x="856" y="262" font-size="17" fill="#5C6B6B">基本款再加鮑魚</text>

  <rect x="820" y="326" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="374" font-size="21" font-weight="700" fill="#8A4A14">오골계탕　烏骨雞湯</text>
  <text x="856" y="408" font-size="17" fill="#5C6B6B">雞換成烏骨雞</text>

  <rect x="820" y="472" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="520" font-size="21" font-weight="700" fill="#8A4A14">산삼삼계탕　Sansam samgyetang</text>
  <text x="856" y="554" font-size="17" fill="#5C6B6B">名稱看不出配方，點前先問</text>

  <rect x="820" y="618" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="666" font-size="21" font-weight="700" fill="#8A4A14">토종삼계탕　Tojong samgyetang</text>
  <text x="856" y="700" font-size="17" fill="#5C6B6B">名稱看不出配方，點前先問</text>

  <!-- bottom banner: 3 steps with arrows -->
  <rect x="40" y="790" width="1520" height="76" rx="14" fill="#EAF3EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="827" font-size="22" font-weight="700" fill="#1B4D36" text-anchor="middle">上桌就是煮好的　→　先用鹽調味、喝一口湯　→　雞肉夾出來沾鹽</text>
  <text x="800" y="852" font-size="16" fill="#1B4D36" text-anchor="middle">鹽可按口味調整</text>

  <text x="1540" y="888" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
