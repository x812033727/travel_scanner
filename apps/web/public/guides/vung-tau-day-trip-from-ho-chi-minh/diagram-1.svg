<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">白藤碼頭到頭頓：兩個碼頭與下船後的三個點 / Bach Dang to Vung Tau: two terminals and what is next to the pier</title>
  <desc id="desc">示意圖，方向與距離非比例。左側是胡志明市 Phường Sài Gòn，內含白藤高速船碼頭 Bến tàu cao tốc Bạch Đằng，地址 10B Tôn Đức Thắng、4 號碼頭、Hàm Nghi 路對面，2025 年 8 月 28 日起啟用，距舊碼頭約 400 公尺。中央一條雙向實線箭頭跨過水面，標高速船約 120 分鐘。右側是頭頓 Phường Vũng Tàu，由碼頭往外依序是胡梅碼頭 Bến tàu Hồ Mây（1A Trần Phú，與胡梅纜車站同址）、胡梅纜車（上站 250 公尺）、白宮 Bạch Dinh（4 Trần Phú）。右下是小山 Núi Tao Phùng，又稱 Núi Nhỏ，海拔 176 公尺，山上是高 32 公尺的耶穌基督像，山腳石階近 1,000 級、塑像內 133 級。圖例：實線代表高速船，虛線代表陸路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">白藤碼頭到頭頓：兩個碼頭與下船後的三個點</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Bach Dang to Vung Tau: the 120-minute crossing and what stands next to the pier</text>
  <text x="60" y="118" font-size="15" fill="#5C6B6B">示意圖，方向與距離非比例。</text>

  <rect x="545" y="170" width="310" height="650" rx="14" fill="#E6F0F7"/>

  <rect x="60" y="170" width="460" height="300" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="212" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">胡志明市 Phường Sài Gòn</text>
  <rect x="80" y="236" width="420" height="214" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="290" y="280" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">白藤高速船碼頭</text>
  <text x="290" y="310" font-size="16" fill="#5C6B6B" text-anchor="middle">Bến tàu cao tốc Bạch Đằng</text>
  <text x="290" y="350" font-size="15" fill="#102A2B" text-anchor="middle">10B Tôn Đức Thắng</text>
  <text x="290" y="377" font-size="15" fill="#102A2B" text-anchor="middle">4 號碼頭．Hàm Nghi 路對面</text>
  <text x="290" y="412" font-size="15" fill="#5C6B6B" text-anchor="middle">2025 年 8 月 28 日起啟用</text>
  <text x="290" y="436" font-size="15" fill="#5C6B6B" text-anchor="middle">距舊碼頭約 400 公尺</text>

  <line x1="578" y1="352" x2="822" y2="352" stroke="#0D6B68" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="700" y="312" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">高速船</text>
  <text x="700" y="396" font-size="18" fill="#102A2B" text-anchor="middle">約 120 分鐘</text>

  <rect x="880" y="170" width="660" height="330" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1210" y="212" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">頭頓 Phường Vũng Tàu</text>
  <rect x="900" y="232" width="620" height="86" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1210" y="270" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">胡梅碼頭 Bến tàu Hồ Mây．1A Trần Phú</text>
  <text x="1210" y="300" font-size="15" fill="#5C6B6B" text-anchor="middle">＝胡梅纜車站同址</text>
  <rect x="900" y="330" width="620" height="66" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1210" y="370" font-size="17" fill="#102A2B" text-anchor="middle">胡梅纜車．上站 250 公尺</text>
  <rect x="900" y="408" width="620" height="66" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="1210" y="448" font-size="17" fill="#102A2B" text-anchor="middle">白宮 Bạch Dinh．4 Trần Phú</text>

  <line x1="1210" y1="504" x2="1210" y2="576" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowgrey)"/>

  <rect x="880" y="590" width="660" height="210" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1210" y="632" font-size="18" font-weight="bold" fill="#102A2B" text-anchor="middle">小山 Núi Tao Phùng（Núi Nhỏ）．176 公尺</text>
  <rect x="900" y="652" width="620" height="126" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="1210" y="702" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">耶穌基督像．高 32 公尺</text>
  <text x="1210" y="736" font-size="15" fill="#5C6B6B" text-anchor="middle">山腳石階近 1,000 級</text>
  <text x="1210" y="762" font-size="15" fill="#5C6B6B" text-anchor="middle">塑像內 133 級</text>

  <line x1="80" y1="700" x2="150" y2="700" stroke="#0D6B68" stroke-width="5"/>
  <text x="166" y="706" font-size="15" fill="#5C6B6B">實線＝高速船</text>
  <line x1="80" y1="744" x2="150" y2="744" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="166" y="750" font-size="15" fill="#5C6B6B">虛線＝陸路</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
