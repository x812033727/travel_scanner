<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">資料投毒可能從哪裡進入 / Where data poisoning can enter</title><desc id="desc">圖分上下兩區。上方是訓練階段：預訓練資料（網路上大量蒐集）、微調資料（指令與人類回饋）、合成資料（由上游模型產生）三種可能被投毒的資料，都寫進模型參數，效果留到重新訓練為止；模型參數旁標示後門的特徵：平常回答正常，遇到觸發條件才異常。下方是使用階段：檢索知識庫（RAG）回答時才讀進來，使用者輸入是提示詞注入的入口，兩者都進入這次回答的上下文，不改模型參數；旁邊標示界線變模糊：知識庫藏的若是指令，像提示詞注入；若是假知識，像資料投毒。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">資料投毒可能從哪裡進入</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Where data poisoning can enter an AI system</text><text x="80" y="136" font-size="20" font-weight="700" fill="#0D6B68">訓練階段：寫進模型參數</text><rect x="1090" y="119" width="26" height="20" rx="4" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1126" y="136" font-size="17" fill="#5C6B6B">可能被投毒的資料</text><rect x="1300" y="119" width="26" height="20" rx="4" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1336" y="136" font-size="17" fill="#5C6B6B">使用當下的輸入</text><path d="M 520 205 L 698 290" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 520 330 L 698 330" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 520 455 L 698 370" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1080 330 L 1158 330" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 520 650 L 698 690" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 520 775 L 698 740" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1080 712 L 1158 712" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="155" width="440" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="300" y="197" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">預訓練資料</text><text x="300" y="233" font-size="19" fill="#5C6B6B" text-anchor="middle">網路上大量蒐集</text><rect x="80" y="280" width="440" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="300" y="322" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">微調資料</text><text x="300" y="358" font-size="19" fill="#5C6B6B" text-anchor="middle">指令與人類回饋</text><rect x="80" y="405" width="440" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="300" y="447" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">合成資料</text><text x="300" y="483" font-size="19" fill="#5C6B6B" text-anchor="middle">由上游模型產生</text><rect x="700" y="230" width="380" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="890" y="305" font-size="30" font-weight="700" fill="#102A2B" text-anchor="middle">模型參數</text><text x="890" y="348" font-size="20" fill="#5C6B6B" text-anchor="middle">訓練時寫進去</text><text x="890" y="381" font-size="20" fill="#5C6B6B" text-anchor="middle">留到重新訓練為止</text><rect x="1160" y="240" width="380" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1350" y="300" font-size="28" font-weight="700" fill="#B8442D" text-anchor="middle">後門</text><text x="1350" y="345" font-size="20" fill="#102A2B" text-anchor="middle">平常回答正常</text><text x="1350" y="380" font-size="20" fill="#102A2B" text-anchor="middle">遇到觸發條件才異常</text><path d="M 60 540 L 1540 540" fill="none" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="10 8"/><text x="80" y="582" font-size="20" font-weight="700" fill="#2F6F9F">使用階段：回答時讀進上下文</text><rect x="80" y="600" width="440" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="300" y="642" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">檢索知識庫（RAG）</text><text x="300" y="678" font-size="19" fill="#5C6B6B" text-anchor="middle">回答時才讀進來</text><rect x="80" y="725" width="440" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="300" y="767" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">使用者輸入</text><text x="300" y="803" font-size="19" fill="#5C6B6B" text-anchor="middle">提示詞注入的入口</text><rect x="700" y="625" width="380" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="890" y="688" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">這次的上下文</text><text x="890" y="729" font-size="20" fill="#5C6B6B" text-anchor="middle">每次回答時讀入</text><text x="890" y="763" font-size="20" fill="#5C6B6B" text-anchor="middle">不改模型參數</text><rect x="1160" y="625" width="380" height="175" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1350" y="685" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">界線變模糊</text><text x="1350" y="729" font-size="20" fill="#102A2B" text-anchor="middle">知識庫藏指令：像注入</text><text x="1350" y="763" font-size="20" fill="#102A2B" text-anchor="middle">知識庫藏假知識：像投毒</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
