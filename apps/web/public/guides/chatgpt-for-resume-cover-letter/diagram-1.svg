<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用 ChatGPT 改履歷的六步與成果句公式 / Six steps to revise a resume with ChatGPT, plus the result-sentence formula</title>
  <desc id="desc">上排六個框由左到右用箭頭串起。步驟 1 準備：現有履歷、職缺說明、自己的三個具體成果，開暫時對話或關掉模型訓練，刪掉用不到的個資。步驟 2 比對：貼職缺說明與履歷，做三欄表標出符合、部分符合、缺少，缺少的只標出來，不要替你補。步驟 3 成果句：職責改成成果句，動詞加做了什麼加量化結果，數字自己填，每個數字要有出處。步驟 4 關鍵字：用職缺的用語寫，工具名、證照名，只放真的做過的，不加沒做過的技能，不堆關鍵字牆。步驟 5 求職信：一頁三段，為什麼是這家、哪些成果對得上、希望面談並致謝，只用履歷已有的事。步驟 6 模擬面試：它扮演用人主管，對每一句成果句追問怎麼做、數字怎麼算，答不出的補細節或整句刪掉。下排左邊是成果句公式：動詞（建立、縮短、提高）加做了什麼（哪個流程、哪個對象）加量化結果（多少、多久、幾成），並附一組改前改後：改前「負責行政庶務與報帳」，改後「整理請款流程，把月結對帳從 3 天縮到 1 天」；數字要有報表或紀錄可查，沒有數字就寫規模、頻率、期間、前後對比。下排右邊是提醒：面試被追問要講得出細節，每一句成果句都會被問怎麼做的、數字怎麼算、你負責哪一部分，講不出來的那一句刪掉，答案自己寫，不要它代答。2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">用 ChatGPT 改履歷的六步與成果句公式（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Six steps to revise a resume with ChatGPT, plus the result-sentence formula</text>

  <!-- step 1 準備 -->
  <rect x="54" y="120" width="220" height="300" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="94" cy="160" r="22" fill="#0D6B68"/>
  <text x="94" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="128" y="168" font-size="20" font-weight="700" fill="#0B4F4D">準備</text>
  <text x="128" y="194" font-size="15" fill="#5C6B6B">Prepare</text>
  <text x="74" y="236" font-size="16" fill="#102A2B">現有履歷、職缺說明</text>
  <text x="74" y="264" font-size="16" fill="#102A2B">自己的三個具體成果</text>
  <text x="74" y="292" font-size="16" fill="#102A2B">開暫時對話</text>
  <text x="74" y="320" font-size="16" fill="#102A2B">或關掉模型訓練</text>
  <text x="74" y="348" font-size="16" fill="#102A2B">刪掉用不到的個資</text>
  <path d="M 278 270 L 304 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 比對 -->
  <rect x="308" y="120" width="220" height="300" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="348" cy="160" r="22" fill="#2F6F9F"/>
  <text x="348" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="382" y="168" font-size="20" font-weight="700" fill="#1F4E73">比對</text>
  <text x="382" y="194" font-size="15" fill="#5C6B6B">Compare</text>
  <text x="328" y="236" font-size="16" fill="#102A2B">貼職缺說明與履歷</text>
  <text x="328" y="264" font-size="16" fill="#102A2B">做三欄表：符合、</text>
  <text x="328" y="292" font-size="16" fill="#102A2B">部分符合、缺少</text>
  <text x="328" y="320" font-size="16" fill="#102A2B">缺少的只標出來</text>
  <text x="328" y="348" font-size="16" fill="#B8442D">不要替你補</text>
  <path d="M 532 270 L 558 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 成果句 -->
  <rect x="562" y="120" width="220" height="300" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <circle cx="602" cy="160" r="22" fill="#102A2B"/>
  <text x="602" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="636" y="168" font-size="20" font-weight="700" fill="#102A2B">成果句</text>
  <text x="636" y="194" font-size="15" fill="#5C6B6B">Results</text>
  <text x="582" y="236" font-size="16" fill="#102A2B">職責改成成果句</text>
  <text x="582" y="264" font-size="16" fill="#102A2B">動詞＋做了什麼</text>
  <text x="582" y="292" font-size="16" fill="#102A2B">＋量化結果</text>
  <text x="582" y="320" font-size="16" fill="#102A2B">數字自己填</text>
  <text x="582" y="348" font-size="16" fill="#B8442D">每個數字要有出處</text>
  <path d="M 786 270 L 812 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 關鍵字 -->
  <rect x="816" y="120" width="220" height="300" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="856" cy="160" r="22" fill="#D97A2B"/>
  <text x="856" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="890" y="168" font-size="20" font-weight="700" fill="#8A4A16">關鍵字</text>
  <text x="890" y="194" font-size="15" fill="#5C6B6B">Keywords</text>
  <text x="836" y="236" font-size="16" fill="#102A2B">用職缺的用語寫</text>
  <text x="836" y="264" font-size="16" fill="#102A2B">工具名、證照名</text>
  <text x="836" y="292" font-size="16" fill="#102A2B">只放真的做過的</text>
  <text x="836" y="320" font-size="16" fill="#102A2B">不加沒做過的技能</text>
  <text x="836" y="348" font-size="16" fill="#B8442D">不堆關鍵字牆</text>
  <path d="M 1040 270 L 1066 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 5 求職信 -->
  <rect x="1070" y="120" width="220" height="300" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="1110" cy="160" r="22" fill="#2E7D5B"/>
  <text x="1110" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1144" y="168" font-size="20" font-weight="700" fill="#1F5A40">求職信</text>
  <text x="1144" y="194" font-size="15" fill="#5C6B6B">Cover letter</text>
  <text x="1090" y="236" font-size="16" fill="#102A2B">一頁、三段</text>
  <text x="1090" y="264" font-size="16" fill="#102A2B">為什麼是這家</text>
  <text x="1090" y="292" font-size="16" fill="#102A2B">哪些成果對得上</text>
  <text x="1090" y="320" font-size="16" fill="#102A2B">希望面談並致謝</text>
  <text x="1090" y="348" font-size="16" fill="#B8442D">只用履歷已有的事</text>
  <path d="M 1294 270 L 1320 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 6 模擬面試 -->
  <rect x="1324" y="120" width="220" height="300" rx="14" fill="#F9E8E3" stroke="#B8442D" stroke-width="4"/>
  <circle cx="1364" cy="160" r="22" fill="#B8442D"/>
  <text x="1364" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="1398" y="168" font-size="20" font-weight="700" fill="#8A2E1E">模擬面試</text>
  <text x="1398" y="194" font-size="15" fill="#5C6B6B">Mock interview</text>
  <text x="1344" y="236" font-size="16" fill="#102A2B">它扮演用人主管</text>
  <text x="1344" y="264" font-size="16" fill="#102A2B">每一句成果句</text>
  <text x="1344" y="292" font-size="16" fill="#102A2B">追問怎麼做、</text>
  <text x="1344" y="320" font-size="16" fill="#102A2B">數字怎麼算</text>
  <text x="1344" y="348" font-size="16" fill="#B8442D">答不出的補細節</text>
  <text x="1344" y="376" font-size="16" fill="#B8442D">或整句刪掉</text>

  <!-- formula -->
  <text x="54" y="484" font-size="20" font-weight="700" fill="#102A2B">成果句公式　Result-sentence formula</text>
  <rect x="54" y="506" width="300" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="204" y="552" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">動詞</text>
  <text x="204" y="586" font-size="16" fill="#102A2B" text-anchor="middle">建立、縮短、提高</text>
  <text x="369" y="572" font-size="30" font-weight="700" fill="#5C6B6B" text-anchor="middle">＋</text>
  <rect x="384" y="506" width="300" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="534" y="552" font-size="20" font-weight="700" fill="#1F4E73" text-anchor="middle">做了什麼</text>
  <text x="534" y="586" font-size="16" fill="#102A2B" text-anchor="middle">哪個流程、哪個對象</text>
  <text x="699" y="572" font-size="30" font-weight="700" fill="#5C6B6B" text-anchor="middle">＋</text>
  <rect x="714" y="506" width="300" height="110" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="864" y="552" font-size="20" font-weight="700" fill="#1F5A40" text-anchor="middle">量化結果</text>
  <text x="864" y="586" font-size="16" fill="#102A2B" text-anchor="middle">多少、多久、幾成</text>

  <text x="54" y="668" font-size="17" fill="#5C6B6B">改前：負責行政庶務與報帳</text>
  <path d="M 290 662 L 330 662" stroke="#D97A2B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="352" y="668" font-size="17" font-weight="700" fill="#102A2B">改後：整理請款流程，把月結對帳從 3 天縮到 1 天</text>
  <text x="54" y="712" font-size="15" fill="#5C6B6B">數字要有報表或紀錄可查；沒有數字就寫規模、頻率、期間、前後對比</text>

  <!-- warning -->
  <rect x="1060" y="470" width="484" height="260" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1084" y="512" font-size="19" font-weight="700" fill="#B8442D">面試被追問要講得出細節</text>
  <text x="1084" y="552" font-size="16" fill="#102A2B">每一句成果句都會被問：</text>
  <text x="1084" y="580" font-size="16" fill="#102A2B">怎麼做的、數字怎麼算、</text>
  <text x="1084" y="608" font-size="16" fill="#102A2B">你負責哪一部分</text>
  <text x="1084" y="652" font-size="16" font-weight="700" fill="#B8442D">講不出來的那一句，刪掉</text>
  <text x="1084" y="688" font-size="16" fill="#102A2B">答案自己寫，不要它代答</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
