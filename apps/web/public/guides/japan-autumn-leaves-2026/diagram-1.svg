<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026 日本紅葉時間軸：東京、京都、大阪十個景點的平年見頃與 2026 預估起日</title>
  <desc id="desc">橫向時間軸從 9 月到 12 月。橫條是平年見頃區間，菱形是 Weathernews 2026 年 9 月 3 日預估的見頃起日。東京：外苑 11/30、六義園 12/8、高尾山 11/21、昭和記念公園 11/21；京都：清水寺 11/26、東福寺 11/24、嵐山 11/24、永觀堂 11/25；大阪：大阪城公園 11/22、箕面 11/25。北海道大雪山 9 月中旬先紅，說明由北往南、由高往低。</desc>
