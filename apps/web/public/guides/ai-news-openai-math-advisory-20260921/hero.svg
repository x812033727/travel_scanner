<title id="title">與 OpenAI 合作的數學顧問小組是獨立的：能公開意見，但不管內部進度</title><desc id="desc">原創插圖：中央一個大圓代表持續產出結果的模型，外側以虛線圍出另一群小圓代表獨立運作的顧問成員，虛線圈邊緣只有一支箭頭指向大圓，箭頭旁沒有任何線條連回小圓，代表建議單向流出、決定不流回小組，畫面不含任何商標或人像。</desc>
