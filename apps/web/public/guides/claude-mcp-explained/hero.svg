<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">MCP 是連上你自己資料的接頭 / MCP as one plug into your own data</title>
  <desc id="desc">自繪插圖。左邊是一個白底深綠邊的大對話泡泡，裡面有三條淺綠色的橫線代表對話文字，泡泡左下角有一個朝下的尖角。泡泡右側伸出一條深綠色的線，往右接到一根直立的主幹，主幹再分出三條短線，接到右邊上下排列的三個白色圓角方塊。上方的方塊裡是一個橘色的資料夾圖形，中間的方塊裡是一個藍色的日曆圖形，有兩個掛環、一條藍色標題列與六個圓點，下方的方塊裡是一個綠色的圓柱形資料庫圖形。畫面下緣有一行深色文字：一個接頭，接上你的資料。畫面沒有任何品牌標誌或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- speech bubble -->
  <path d="M 210 600 L 210 690 L 320 600 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>
  <rect x="120" y="300" width="440" height="300" rx="44" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
  <rect x="180" y="352" width="320" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="180" y="412" width="280" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="180" y="472" width="200" height="26" rx="13" fill="#E3F0EF"/>

  <!-- the one cable, branching to three blocks -->
  <path d="M 560 450 L 800 450" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M 800 260 L 800 640" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M 800 260 L 900 260" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M 800 450 L 900 450" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <path d="M 800 640 L 900 640" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <circle cx="800" cy="450" r="16" fill="#0D6B68"/>

  <!-- block 1: a folder -->
  <rect x="900" y="180" width="340" height="160" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <rect x="955" y="212" width="92" height="26" rx="9" fill="#D97A2B"/>
  <rect x="955" y="232" width="230" height="86" rx="14" fill="#D97A2B"/>

  <!-- block 2: a calendar -->
  <rect x="900" y="370" width="340" height="160" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="1010" y="390" width="12" height="26" rx="6" fill="#2F6F9F"/>
  <rect x="1118" y="390" width="12" height="26" rx="6" fill="#2F6F9F"/>
  <rect x="975" y="402" width="190" height="108" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="975" y="402" width="190" height="30" rx="12" fill="#2F6F9F"/>
  <rect x="975" y="418" width="190" height="14" fill="#2F6F9F"/>
  <circle cx="1015" cy="458" r="8" fill="#2F6F9F"/>
  <circle cx="1070" cy="458" r="8" fill="#2F6F9F"/>
  <circle cx="1125" cy="458" r="8" fill="#2F6F9F"/>
  <circle cx="1015" cy="488" r="8" fill="#2F6F9F"/>
  <circle cx="1070" cy="488" r="8" fill="#2F6F9F"/>
  <circle cx="1125" cy="488" r="8" fill="#2F6F9F"/>

  <!-- block 3: a database -->
  <rect x="900" y="560" width="340" height="160" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="8"/>
  <rect x="975" y="598" width="190" height="76" fill="#2E7D5B"/>
  <ellipse cx="1070" cy="598" rx="95" ry="22" fill="#2E7D5B"/>
  <ellipse cx="1070" cy="674" rx="95" ry="22" fill="#2E7D5B"/>
  <ellipse cx="1070" cy="624" rx="95" ry="22" fill="none" stroke="#F7F1E8" stroke-width="6"/>
  <ellipse cx="1070" cy="650" rx="95" ry="22" fill="none" stroke="#F7F1E8" stroke-width="6"/>

  <text x="800" y="836" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">一個接頭，接上你的資料</text>
</svg>
