<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 與著作權的三個問題 / Three questions on AI and copyright in Taiwan</title>
  <desc id="desc">三欄並列的判斷流程。左欄是產出端：依據著作權法第 3 條、第 5 條、第 10 條，文字、圖、音樂、程式都套同一把尺；智慧財產局電子郵件1111031 寫有人類實際的創意投入時成果仍可受著作權保護，完全由 AI 獨立完成則原則上無法享有著作權。中欄是輸入端：蒐集、預處理、訓練都可能涉及重製，依據第 44 條至第 65 條，沒有合理使用的情形就要取得授權，第 65 條第 2 項四款由電子郵件1111212 說明仍須個案綜合判斷。右欄是司法端：裁判書系統全文檢索查「AI生成物」等關鍵字，查證當天都是零筆；查得到的是新北地院 111 年度智訴字第 8 號刑事判決，114 年 6 月 24 日，但法院寫明本案被告不是用來訓練 AI。三條路徑最後都指向同一個終點：個案有爭議，請諮詢專業。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">AI 與著作權：三個問題各走各的路</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three questions, three sets of rules — Taiwan copyright law</text>

  <!-- Column 1: output side -->
  <rect x="70" y="130" width="460" height="76" rx="14" fill="#0D6B68"/>
  <text x="300" y="177" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">問題一：產出有沒有著作權</text>

  <rect x="70" y="234" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="300" y="276" font-size="16" fill="#5C6B6B" text-anchor="middle">依據｜第 3 條、第 5 條、第 10 條</text>
  <text x="300" y="310" font-size="17" fill="#102A2B" text-anchor="middle">文字、圖、音樂、程式</text>
  <text x="300" y="338" font-size="17" fill="#102A2B" text-anchor="middle">都套同一把尺</text>

  <rect x="70" y="392" width="460" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="300" y="434" font-size="16" fill="#5C6B6B" text-anchor="middle">標準｜電子郵件1111031</text>
  <text x="300" y="468" font-size="17" fill="#102A2B" text-anchor="middle">有人類實際的創意投入，</text>
  <text x="300" y="496" font-size="17" fill="#102A2B" text-anchor="middle">成果仍可受著作權保護</text>

  <rect x="70" y="550" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="300" y="592" font-size="16" fill="#5C6B6B" text-anchor="middle">反面｜同一則函釋</text>
  <text x="300" y="626" font-size="17" fill="#B8442D" text-anchor="middle">完全由 AI 獨立完成，</text>
  <text x="300" y="654" font-size="17" fill="#B8442D" text-anchor="middle">原則上無法享有著作權</text>

  <!-- Column 2: input side -->
  <rect x="570" y="130" width="460" height="76" rx="14" fill="#2F6F9F"/>
  <text x="800" y="177" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">問題二：訓練與輸入怎麼看</text>

  <rect x="570" y="234" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="276" font-size="16" fill="#5C6B6B" text-anchor="middle">行為｜訓練或把作品丟進 AI</text>
  <text x="800" y="310" font-size="17" fill="#102A2B" text-anchor="middle">蒐集、預處理、訓練</text>
  <text x="800" y="338" font-size="17" fill="#102A2B" text-anchor="middle">都可能涉及「重製」</text>

  <rect x="570" y="392" width="460" height="130" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="434" font-size="16" fill="#5C6B6B" text-anchor="middle">依據｜第 44 條至第 65 條</text>
  <text x="800" y="468" font-size="17" fill="#102A2B" text-anchor="middle">沒有合理使用的情形，</text>
  <text x="800" y="496" font-size="17" fill="#102A2B" text-anchor="middle">就要取得同意或授權</text>

  <rect x="570" y="550" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="592" font-size="16" fill="#5C6B6B" text-anchor="middle">判斷｜第 65 條第 2 項四款</text>
  <text x="800" y="626" font-size="17" fill="#102A2B" text-anchor="middle">電子郵件1111212：仍須</text>
  <text x="800" y="654" font-size="17" fill="#102A2B" text-anchor="middle">個案綜合判斷，尚無標準</text>

  <!-- Column 3: courts -->
  <rect x="1070" y="130" width="460" height="76" rx="14" fill="#D97A2B"/>
  <text x="1300" y="177" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">問題三：法院判過沒有</text>

  <rect x="1070" y="234" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1300" y="276" font-size="16" fill="#5C6B6B" text-anchor="middle">查法｜裁判書系統全文檢索</text>
  <text x="1300" y="310" font-size="17" fill="#102A2B" text-anchor="middle">查「AI生成物」等關鍵字</text>
  <text x="1300" y="338" font-size="17" fill="#102A2B" text-anchor="middle">查證當天都是零筆</text>

  <rect x="1070" y="392" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1300" y="434" font-size="16" fill="#5C6B6B" text-anchor="middle">查得到｜新北地院刑事判決</text>
  <text x="1300" y="468" font-size="17" fill="#102A2B" text-anchor="middle">111 年度智訴字第 8 號，</text>
  <text x="1300" y="496" font-size="17" fill="#102A2B" text-anchor="middle">114 年 6 月 24 日</text>

  <rect x="1070" y="550" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1300" y="592" font-size="16" fill="#5C6B6B" text-anchor="middle">但要看清楚射程</text>
  <text x="1300" y="626" font-size="17" fill="#102A2B" text-anchor="middle">法院寫明本案被告</text>
  <text x="1300" y="654" font-size="17" fill="#102A2B" text-anchor="middle">不是用來訓練 AI</text>

  <!-- arrows within columns -->
  <line x1="300" y1="206" x2="300" y2="230" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="300" y1="364" x2="300" y2="388" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="300" y1="522" x2="300" y2="546" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="206" x2="800" y2="230" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="364" x2="800" y2="388" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="522" x2="800" y2="546" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="206" x2="1300" y2="230" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="364" x2="1300" y2="388" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="522" x2="1300" y2="546" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- arrows converging on the shared end -->
  <line x1="300" y1="680" x2="300" y2="746" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="680" x2="800" y2="746" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="680" x2="1300" y2="746" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="260" y="754" width="1080" height="96" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="796" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">三條路徑的終點一樣：個案有爭議，請諮詢專業</text>
  <text x="800" y="828" font-size="17" fill="#5C6B6B" text-anchor="middle">著作權係屬私權，爭議仍應由司法機關就個案具體事實調查證據認定</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
