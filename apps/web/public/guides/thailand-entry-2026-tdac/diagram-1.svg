<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">入境泰國四步流程：行前、落地、入境審查、海關（2026 年 9 月 15 日起的台灣旅客版）</title>
  <desc id="desc">四個步驟。行前：台灣護照觀光免簽 30 天，2026 年 9 月 15 日起生效，陸路關卡一個曆年最多兩次；護照效期 6 個月以上；TDAC 數位入境卡抵達前 3 天內在 tdac.immigration.go.th 線上填，免費；回程機票與飯店訂房先備好；財力證明每人 20,000 泰銖或每戶 40,000 泰銖；電子菸與菸油留在台灣；只用 immigration.go.th 的官網，要收費的都是代辦或假網站。落地：手機開 TDAC 確認信與 QR 碼；來不及填的人到入境關卡旁的協助櫃檯；THIM app 只是另一個填 TDAC 的管道；跟著 Immigration 指標走。入境審查：交護照與 TDAC 的 QR 碼；可能被問回程機票、住宿與財力證明；第一次入境多半走人工櫃檯留指紋與臉部照片；入境章寫停留到哪一天；逾期每天罰 500 泰銖。海關：沒有要申報的走綠色通道；免稅額自用品 20,000 泰銖、菸 200 支或菸草 250 公克、酒 1 公升；電子菸 2014 年起禁止，帶入境會被逮捕與罰款；現金申報門檻以海關為準；佛像與古物要事先申請許可；出關後接機場交通。底下註記 60 天免簽 2026 年 9 月 15 日結束，想待超過 30 天要辦簽證或向移民局申請延長；TDAC 2025 年 5 月 1 日起取代紙本入境卡 TM.6，不入境的轉機旅客免填，台灣護照不用辦落地簽。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="32" font-weight="700" fill="#102A2B">入境泰國四步：台灣旅客 2026 年 9 月 15 日起的新規則</text>
  <text x="60" y="98" font-size="18" fill="#5C6B6B">Entering Thailand in four steps · 2026 年 9 月依 TAT、移民局 TDAC 官網、駐英泰國大使館、泰國海關、台灣領務局查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: before departure -->
  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">ก่อนเดินทาง (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="262">● 免簽 30 天，觀光目的</text>
    <text x="104" y="288">2026 年 9 月 15 日起生效</text>
    <text x="104" y="314">陸路關卡一個曆年最多兩次</text>
    <text x="86" y="352">● 護照效期 6 個月以上</text>
    <text x="86" y="390">● TDAC：抵達前 3 天內線上填</text>
    <text x="104" y="416">tdac.immigration.go.th，免費</text>
    <text x="86" y="454">● 回程機票、飯店訂房先備好</text>
    <text x="86" y="492">● 財力證明 20,000 泰銖／人</text>
    <text x="104" y="518">或 40,000 泰銖／戶</text>
    <text x="86" y="556">● 電子菸與菸油留在台灣</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">只用 immigration.go.th 的官網</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">要收費的都是代辦或假網站</text>

  <!-- step 2: arrival -->
  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"/>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　落地</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">เดินทางถึง (Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="262">● 手機開 TDAC 確認信</text>
    <text x="484" y="288">與 QR 碼（先截圖存好）</text>
    <text x="466" y="326">● 來不及填：入境關卡旁</text>
    <text x="484" y="352">有協助櫃檯，但要排隊</text>
    <text x="466" y="390">● THIM app 只是另一個</text>
    <text x="484" y="416">填 TDAC 的管道，非必要</text>
    <text x="466" y="454">● 跟著 ตรวจคนเข้าเมือง</text>
    <text x="484" y="480">Immigration 指標走</text>
  </g>
  <!-- phone icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12"/>
    <rect x="590" y="620" width="40" height="40" rx="4"/>
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round"/>
  </g>

  <!-- step 3: immigration -->
  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入境審查</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">ตรวจคนเข้าเมือง (Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="262">● 交護照＋TDAC 的 QR 碼</text>
    <text x="846" y="300">● 可能被問：回程機票、</text>
    <text x="864" y="326">住宿、財力證明</text>
    <text x="846" y="364">● 第一次入境多半走人工櫃檯</text>
    <text x="864" y="390">留指紋與臉部照片</text>
    <text x="846" y="428">● 入境章寫停留到哪一天，</text>
    <text x="864" y="454">離開櫃檯前看一眼</text>
    <text x="846" y="492">● 逾期每天罰 500 泰銖</text>
  </g>
  <!-- fingerprint icon -->
  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34"/>
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52"/>
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68"/>
  </g>

  <!-- step 4: customs -->
  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　海關</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">ศุลกากร (Customs)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="262">● 沒有要申報：綠色通道</text>
    <text x="1226" y="300">● 免稅：自用品 20,000 泰銖</text>
    <text x="1244" y="326">菸 200 支或菸草 250 公克</text>
    <text x="1244" y="352">酒 1 公升</text>
    <text x="1226" y="390">● 電子菸 2014 年起禁止，</text>
    <text x="1244" y="416">帶入境會被逮捕、罰款</text>
    <text x="1226" y="454">● 現金申報門檻以海關為準</text>
    <text x="1226" y="492">● 佛像、古物要事先申請許可</text>
    <text x="1226" y="530">● 出關 → 機場交通</text>
  </g>

  <!-- arrows -->
  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="790" font-size="18" fill="#5C6B6B">60 天免簽 2026 年 9 月 15 日結束；想待超過 30 天要事先辦簽證，或到移民局申請延長，延長天數與費用以移民局公告為準。</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">TDAC 2025 年 5 月 1 日起取代紙本入境卡 TM.6；不入境的轉機旅客免填。台灣護照不用辦落地簽。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
