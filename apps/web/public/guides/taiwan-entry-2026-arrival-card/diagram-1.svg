<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">入境台灣四步驟：行前、落地查驗、海關、出關 / Entering Taiwan in four steps: before you fly, landing and immigration, customs, leaving the airport</title>
  <desc id="desc">四個步驟，2026 年 9 月依移民署、領事事務局、台北關務署、防檢署官網查證。一、行前：免簽停留 90 天（美、加、英、歐盟、澳、紐、日、韓），30 天（新加坡、馬來西亞），14 天（泰國、菲律賓、汶萊，試辦至 2027 年 7 月 31 日）；護照效期 6 個月以上並持回程機票；大陸、港澳居民另辦入境許可；抵達前 3 天內免費填 TWAC 線上入境登記，一人可代填 16 人，只認 twac.immigration.gov.tw。二、落地查驗：觀光客走外國護照人工櫃檯；自動通關 e-Gate 限居留證、永久居留證、就業金卡持有人與互惠國電子護照（美國限 Global Entry、韓國、澳洲、義大利、德國、新加坡、馬來西亞、紐西蘭），先在移民署櫃檯註冊一次；日本與多數歐洲護照走人工櫃檯；沒填 TWAC 不能查驗，要離開隊伍用手機補填。三、海關：綠線無申報、紅線要申報；新臺幣超過 NT$100,000、外幣超過 US$10,000、人民幣超過 RMB 20,000、黃金超過 US$20,000、有價證券面額超過 US$10,000 要申報；免稅捲菸 200 支或雪茄 25 支（20 歲以上）、酒 1.5 公升、其他物品 NT$35,000；新鮮水果禁止，成藥每種 12 盒；非洲豬瘟國家豬肉製品首次罰 NT$200,000、第二次起 NT$1,000,000，付不出罰款拒絕入境；電子菸禁止。四、出關：中華電信、台灣大哥大、遠傳櫃檯辦 SIM 卡或 eSIM，銀行換匯，再搭桃園機場捷運、客運巴士或計程車。紙本入境卡已於 2025 年 10 月 1 日停用。Four steps, checked in September 2026 against the National Immigration Agency, BOCA, Taipei Customs and APHIA. 1 Before you fly: visa-free 90 days for the US, Canada, UK, EU, Australia, New Zealand, Japan and South Korea, 30 days for Singapore and Malaysia, 14 days for Thailand, the Philippines and Brunei on a trial to 31 July 2027; passport valid six months and an onward ticket; mainland China, Hong Kong and Macau residents need entry permits; file the free TWAC arrival card within 3 days before landing, up to 16 people per form, only at twac.immigration.gov.tw. 2 Landing and immigration: tourists use staffed counters; e-Gate is for ARC, APRC and Gold Card holders and e-passports from the US (Global Entry only), South Korea, Australia, Italy, Germany, Singapore, Malaysia and New Zealand after enrolling once; Japan and most of Europe use staffed lines; no TWAC means no inspection until you file it on your phone. 3 Customs: green channel for nothing to declare, red to declare; declare over NT$100,000, US$10,000 in foreign cash, RMB 20,000, US$20,000 in gold or US$10,000 in securities; duty-free 200 cigarettes or 25 cigars for adults 20 and over, 1.5 litres of alcohol and NT$35,000 of other goods; fresh fruit banned, medicine capped at 12 packs; pork from African swine fever countries fined NT$200,000 the first time and NT$1,000,000 after, with refused entry if unpaid; e-cigarettes banned. 4 Leaving the airport: Chunghwa Telecom, Taiwan Mobile and Far EasTone counters for SIM cards and eSIMs, bank exchange counters, then the Taoyuan Airport MRT, buses or taxis. Paper arrival cards ended on 1 October 2025.</desc>
