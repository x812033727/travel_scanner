<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">2026 入境臺灣四步驟：行前、入境查驗、海關與出關後</title>
  <desc id="desc">入境臺灣四步驟。一、行前：先依持有護照與身分查免簽、簽證或入出境許可；應填 TWAC 者在抵臺前 7 天內免費填報，一人最多代填 16 人。二、入境查驗：一般旅客走人工櫃檯；e-Gate 限官方所列居留身分或互惠國電子護照持有人，互惠國旅客需先人工註冊，非居留者使用前須完成 TWAC。三、海關：需申報時走紅線；攜帶外幣總額逾 US$10,000 等值、新臺幣逾 NT$100,000、人民幣逾 RMB 20,000、無記名可轉讓有價證券面額逾 US$10,000、黃金逾 US$20,000，或非自用鑽石、寶石與白金總值逾 NT$500,000 均須申報。年滿 20 歲的入境旅客菸品免稅限量為捲菸 200 支、雪茄 25 支、菸絲 1 磅或經核定菸品 200 支，四者擇一；年滿 18 歲酒類免稅 1.5 公升；其他行李物品免稅額度 NT$35,000。四、出關：到入境大廳辦 SIM 卡或 eSIM、換匯，再搭機場捷運、客運或計程車。紙本入國登記表已於 2025 年 10 月 1 日停用。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="64" y="70" font-size="38" font-weight="700" fill="#102A2B">2026 入境臺灣四步驟</text>
  <text x="64" y="108" font-size="20" fill="#5C6B6B">依身分與持有證件判斷；2026/9/22 查核，行前再看官方最新公告</text>
  <path d="M398 446h40m-16-14 16 14-16 14M778 446h40m-16-14 16 14-16 14M1158 446h40m-16-14 16 14-16 14" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="48" y="142" width="350" height="650" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="48" y="142" width="350" height="92" rx="26" fill="#0D6B68"/>
  <text x="223" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">1　行前確認</text>
  <text x="76" y="280" font-size="22" font-weight="700" fill="#102A2B">先查入境資格</text>
  <text x="76" y="317" font-size="19" fill="#102A2B">免簽、簽證或入出境許可</text>
  <text x="76" y="349" font-size="18" fill="#5C6B6B">看護照類型、身分與現行政策</text>
  <line x1="76" y1="380" x2="370" y2="380" stroke="#DED6CB" stroke-width="2"/>
  <text x="76" y="422" font-size="24" font-weight="700" fill="#0D6B68">TWAC</text>
  <text x="76" y="459" font-size="20" fill="#102A2B">應填者：抵臺前 7 天內</text>
  <text x="76" y="492" font-size="20" fill="#102A2B">免費，一人最多代填 16 人</text>
  <text x="76" y="525" font-size="18" fill="#5C6B6B">不需列印；查驗前必須完成</text>
  <rect x="76" y="570" width="294" height="104" rx="15" fill="#E3F1EF"/>
  <text x="223" y="610" text-anchor="middle" font-size="18" font-weight="700" fill="#0D6B68">唯一官方網址</text>
  <text x="223" y="646" text-anchor="middle" font-size="17" fill="#102A2B">twac.immigration.gov.tw</text>
  <text x="76" y="725" font-size="18" fill="#B8442D">閱讀語言不等於入境身分</text>

  <rect x="438" y="142" width="340" height="650" rx="26" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <rect x="438" y="142" width="340" height="92" rx="26" fill="#6B4A3A"/>
  <text x="608" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">2　入境查驗</text>
  <text x="466" y="280" font-size="22" font-weight="700" fill="#102A2B">一般旅客</text>
  <text x="466" y="318" font-size="20" fill="#102A2B">走外來人士人工櫃檯</text>
  <line x1="466" y1="354" x2="750" y2="354" stroke="#DED6CB" stroke-width="2"/>
  <text x="466" y="400" font-size="24" font-weight="700" fill="#6B4A3A">e-Gate 有資格限制</text>
  <text x="466" y="438" font-size="19" fill="#102A2B">合格居留身分，或</text>
  <text x="466" y="470" font-size="19" fill="#102A2B">互惠國電子護照持有人</text>
  <text x="466" y="502" font-size="18" fill="#5C6B6B">互惠國旅客先到人工櫃檯註冊</text>
  <text x="466" y="534" font-size="18" fill="#5C6B6B">非居留者使用前仍須完成 TWAC</text>
  <rect x="466" y="590" width="284" height="108" rx="15" fill="#FBE9E4"/>
  <text x="608" y="630" text-anchor="middle" font-size="20" font-weight="700" fill="#B8442D">不能因為是觀光客</text>
  <text x="608" y="665" text-anchor="middle" font-size="20" font-weight="700" fill="#B8442D">就直接走 e-Gate</text>

  <rect x="818" y="142" width="340" height="650" rx="26" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="818" y="142" width="340" height="92" rx="26" fill="#2F6F9F"/>
  <text x="988" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">3　海關申報</text>
  <text x="846" y="276" font-size="21" font-weight="700" fill="#2F6F9F">超過門檻走紅線</text>
  <g font-size="18" fill="#102A2B">
    <text x="846" y="316">外幣總額</text><text x="1130" y="316" text-anchor="end" font-weight="700">US$10,000</text>
    <text x="846" y="352">新臺幣</text><text x="1130" y="352" text-anchor="end" font-weight="700">NT$100,000</text>
    <text x="846" y="388">人民幣</text><text x="1130" y="388" text-anchor="end" font-weight="700">RMB 20,000</text>
    <text x="846" y="424">黃金</text><text x="1130" y="424" text-anchor="end" font-weight="700">US$20,000</text>
  </g>
  <line x1="846" y1="456" x2="1130" y2="456" stroke="#DED6CB" stroke-width="2"/>
  <text x="846" y="501" font-size="21" font-weight="700" fill="#2F6F9F">免稅範例</text>
  <text x="846" y="540" font-size="18" fill="#102A2B">菸品四選一：捲菸 200 支等</text>
  <text x="846" y="572" font-size="18" fill="#102A2B">酒 1.5 公升；其他物品 NT$35,000</text>
  <rect x="846" y="615" width="284" height="107" rx="15" fill="#FBE9E4"/>
  <text x="988" y="654" text-anchor="middle" font-size="18" font-weight="700" fill="#B8442D">高風險地區豬肉製品</text>
  <text x="988" y="688" text-anchor="middle" font-size="18" fill="#B8442D">首犯 NT$200,000</text>
  <text x="988" y="753" text-anchor="middle" font-size="17" fill="#5C6B6B">再犯 NT$1,000,000</text>

  <rect x="1198" y="142" width="354" height="650" rx="26" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="1198" y="142" width="354" height="92" rx="26" fill="#D97A2B"/>
  <text x="1375" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">4　出關後</text>
  <text x="1226" y="282" font-size="22" font-weight="700" fill="#102A2B">先處理上網</text>
  <text x="1226" y="320" font-size="20" fill="#102A2B">SIM 卡或 eSIM</text>
  <text x="1226" y="352" font-size="18" fill="#5C6B6B">備妥雙證件並查櫃檯時間</text>
  <line x1="1226" y1="386" x2="1524" y2="386" stroke="#DED6CB" stroke-width="2"/>
  <text x="1226" y="432" font-size="22" font-weight="700" fill="#102A2B">再進市區</text>
  <text x="1226" y="472" font-size="20" fill="#102A2B">桃園機場捷運</text>
  <text x="1226" y="508" font-size="20" fill="#102A2B">客運巴士</text>
  <text x="1226" y="544" font-size="20" fill="#102A2B">計程車</text>
  <rect x="1226" y="600" width="298" height="126" rx="15" fill="#FDF1E6"/>
  <text x="1375" y="643" text-anchor="middle" font-size="19" font-weight="700" fill="#9A4F12">深夜抵達</text>
  <text x="1375" y="680" text-anchor="middle" font-size="18" fill="#9A4F12">先用 Airport Free WiFi</text>
  <text x="1375" y="708" text-anchor="middle" font-size="17" fill="#9A4F12">聯絡、查路線與叫車</text>

  <text x="64" y="852" font-size="18" fill="#5C6B6B">紙本入國登記表已於 2025/10/1 停用；規定以移民署、BOCA、關務署與防檢署最新公告為準</text>
  <text x="1536" y="852" text-anchor="end" font-size="16" fill="#5C6B6B">© Mokaair 2026</text>

