<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">理賠申請的文件與時限 / Claim documents and deadlines</title>
  <desc id="desc">一張扁平插圖。畫面左側是三張同樣大小、並排直立的文件卡片：第一張是收據，下緣做成撕開的鋸齒邊，卡片上有一條深色的合計列；第二張是診斷證明書，上方有一個紅色的十字記號；第三張是申請書，左上角有一個打勾的方框。右側是一個大時鐘，白底藍框，錶面有四個刻度，指針指向斜下方。三張卡片與時鐘之間沒有重疊。下方橫過畫面一條灰色的流程線，線上有四個一樣大小的圓點，最後一個是實心的，代表流程走到終點。畫面底部中央有一行字：文件、時限、依據。整張圖沒有任何機構標誌、人臉、貨幣圖樣或上升曲線。</desc>
