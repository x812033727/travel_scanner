<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">理賠流程的時限與條款依據 / Claim timeline and the clauses behind each deadline</title>
  <desc id="desc">上半部是一條由左至右的理賠時間軸，五個方框依序相連。第一個是起點，事故發生以及知悉事故的那一天，兩者常常不同日。第二個是通知，知悉後五日內通知保險公司，依據是保險法第五十八條，示範條款寫的是不得少於五日。第三個是備齊文件，依各險種示範條款保險金的申領那一條，住院醫療費用保險單示範條款實支實付型是第十九條，日額型是第十五條。第四個是給付，收齊證明文件後十五日內給付，依據是保險法第三十四條，示範條款寫的是不得高於十五日。第五個是逾期，因可歸責於保險公司之事由未在期限內給付者，按年利一分加計利息，依據同為保險法第三十四條。中段是一條獨立的請求權時效帶，由保險契約所生之權利自得為請求之日起經過二年不行使而消滅，保險法第六十五條另定三款起算點的例外，三份示範條款的時效條寫的也是二年。下段是不服處理結果時的兩關：第一關向金融服務業申訴，金融服務業應於收受申訴之日起三十日內為適當之處理並回覆，依據是金融消費者保護法第十三條第二項；第二關向爭議處理機構申請評議，不接受處理結果或逾期未處理者，得於收受結果或期限屆滿之日起六十日內申請，未先申訴或申訴未逾三十日者，同法第二十四條列為應不受理的情形。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#5C6B6B"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2E7D5B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">理賠流程：每一步的期限與條款依據</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Claim timeline and the clauses behind each deadline</text>

  <text x="60" y="146" font-size="20" font-weight="bold" fill="#102A2B">事故發生到給付入帳</text>

  <rect x="60" y="175" width="252" height="210" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="186" y="213" font-size="18" font-weight="bold" fill="#5C6B6B" text-anchor="middle">起點</text>
  <text x="186" y="257" font-size="17" fill="#102A2B" text-anchor="middle">事故發生，以及</text>
  <text x="186" y="285" font-size="17" fill="#102A2B" text-anchor="middle">知悉事故的那一天</text>
  <text x="186" y="330" font-size="15" fill="#5C6B6B" text-anchor="middle">兩者常常不同日</text>
  <text x="186" y="353" font-size="15" fill="#5C6B6B" text-anchor="middle">期限從知悉起算</text>

  <line x1="322" y1="280" x2="357" y2="280" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="367" y="175" width="252" height="210" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="493" y="213" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">通知</text>
  <text x="493" y="257" font-size="17" fill="#102A2B" text-anchor="middle">知悉後五日內</text>
  <text x="493" y="285" font-size="17" fill="#102A2B" text-anchor="middle">通知保險公司</text>
  <text x="493" y="330" font-size="15" fill="#5C6B6B" text-anchor="middle">保險法第五十八條</text>
  <text x="493" y="353" font-size="15" fill="#5C6B6B" text-anchor="middle">條款寫不得少於五日</text>

  <line x1="629" y1="280" x2="664" y2="280" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="674" y="175" width="252" height="210" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="213" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">備齊文件</text>
  <text x="800" y="257" font-size="17" fill="#102A2B" text-anchor="middle">依各險種示範條款</text>
  <text x="800" y="285" font-size="17" fill="#102A2B" text-anchor="middle">保險金的申領</text>
  <text x="800" y="330" font-size="15" fill="#5C6B6B" text-anchor="middle">實支實付型第十九條</text>
  <text x="800" y="353" font-size="15" fill="#5C6B6B" text-anchor="middle">日額型第十五條</text>

  <line x1="936" y1="280" x2="971" y2="280" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="981" y="175" width="252" height="210" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1107" y="213" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">給付</text>
  <text x="1107" y="257" font-size="17" fill="#102A2B" text-anchor="middle">收齊證明文件後</text>
  <text x="1107" y="285" font-size="17" fill="#102A2B" text-anchor="middle">十五日內給付</text>
  <text x="1107" y="330" font-size="15" fill="#5C6B6B" text-anchor="middle">保險法第三十四條</text>
  <text x="1107" y="353" font-size="15" fill="#5C6B6B" text-anchor="middle">條款寫不得高於十五日</text>

  <line x1="1243" y1="280" x2="1278" y2="280" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="1288" y="175" width="252" height="210" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1414" y="213" font-size="18" font-weight="bold" fill="#D97A2B" text-anchor="middle">逾期</text>
  <text x="1414" y="257" font-size="17" fill="#102A2B" text-anchor="middle">可歸責於保險公司</text>
  <text x="1414" y="285" font-size="17" fill="#102A2B" text-anchor="middle">按年利一分加計利息</text>
  <text x="1414" y="330" font-size="15" fill="#5C6B6B" text-anchor="middle">保險法第三十四條</text>
  <text x="1414" y="353" font-size="15" fill="#5C6B6B" text-anchor="middle">示範條款同此標準</text>

  <rect x="60" y="435" width="1480" height="135" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="475" font-size="20" font-weight="bold" fill="#2F6F9F" text-anchor="middle">另一條線：請求權時效</text>
  <text x="800" y="512" font-size="17" fill="#102A2B" text-anchor="middle">由保險契約所生之權利，自得為請求之日起，經過二年不行使而消滅。</text>
  <text x="800" y="541" font-size="15" fill="#5C6B6B" text-anchor="middle">保險法第六十五條另定三款起算點的例外；三份示範條款的時效條寫的也是二年。</text>

  <text x="60" y="608" font-size="20" font-weight="bold" fill="#102A2B">不服處理結果時的兩關</text>

  <rect x="60" y="630" width="700" height="175" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="410" y="672" font-size="20" font-weight="bold" fill="#2E7D5B" text-anchor="middle">第一關：向金融服務業申訴</text>
  <text x="410" y="712" font-size="17" fill="#102A2B" text-anchor="middle">金融服務業應於收受申訴之日起</text>
  <text x="410" y="740" font-size="17" fill="#102A2B" text-anchor="middle">三十日內為適當之處理並回覆</text>
  <text x="410" y="781" font-size="15" fill="#5C6B6B" text-anchor="middle">金融消費者保護法第十三條第二項</text>

  <line x1="775" y1="717" x2="825" y2="717" stroke="#2E7D5B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowgreen)"/>

  <rect x="840" y="630" width="700" height="175" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1190" y="672" font-size="20" font-weight="bold" fill="#2E7D5B" text-anchor="middle">第二關：向爭議處理機構申請評議</text>
  <text x="1190" y="712" font-size="17" fill="#102A2B" text-anchor="middle">不接受處理結果或逾期未處理者，得於</text>
  <text x="1190" y="740" font-size="17" fill="#102A2B" text-anchor="middle">收受結果或期限屆滿之日起六十日內申請</text>
  <text x="1190" y="781" font-size="15" fill="#5C6B6B" text-anchor="middle">未先申訴或申訴未逾三十日者，同法第二十四條列為不受理</text>

