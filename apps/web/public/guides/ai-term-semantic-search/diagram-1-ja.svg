<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">同じ主題でも、本当のニーズを見分ける</title><desc id="desc">ログインの問題をパスワード忘れとアカウントの利用停止に分け、それぞれ再設定の説明と利用停止への対処に対応させる。個別アカウントの状態には別の照会が必要</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同じ主題でも、本当のニーズを見分ける</text><text x="60" y="84" font-size="18" fill="#5C6B6B">セマンティック検索</text><path d="M 410 390 L 640 235" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 410 450 L 640 640" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><rect x="90" y="335" width="320" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="250" y="416.5" font-size="28" fill="#102A2B" text-anchor="middle">ログインの問題</text><text x="250" y="459.5" font-size="22" fill="#5C6B6B" text-anchor="middle">原因と条件を見分ける</text><rect x="650" y="150" width="350" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="221.5" font-size="28" fill="#102A2B" text-anchor="middle">パスワード忘れ</text><text x="825" y="264.5" font-size="22" fill="#5C6B6B" text-anchor="middle">パスワード再設定の説明</text><rect x="650" y="565" width="350" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="636.5" font-size="28" fill="#102A2B" text-anchor="middle">アカウント利用停止</text><text x="825" y="679.5" font-size="22" fill="#5C6B6B" text-anchor="middle">利用停止への対処方法</text><rect x="1180" y="350" width="330" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1345" y="431.5" font-size="25" fill="#102A2B" text-anchor="middle" style="font-size: 25px;">個別アカウントの状態照会</text><text x="1345" y="474.5" font-size="22" fill="#5C6B6B" text-anchor="middle">照会には権限が必要</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
