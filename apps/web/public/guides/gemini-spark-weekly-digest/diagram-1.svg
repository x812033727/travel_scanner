<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">先手動查核，再觀察真實排程</title><desc id="desc">範圍：三個官方入口：期間與時區固定；查核：可讀・取不到：不把未知當沒更新；排程：核對下次時間：等待一次真觸發；停止：暫停・恢復・刪除：再看原定觸發時刻</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">先手動查核，再觀察真實排程</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#316553" font-weight="800">範圍</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">三個官方入口</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">期間與時區固定</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#316553" font-weight="800">查核</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">可讀・取不到</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">不把未知當沒更新</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#316553" font-weight="800">排程</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">核對下次時間</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">等待一次真觸發</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#316553" font-weight="800">停止</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">暫停・恢復・刪除</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">再看原定觸發時刻</text><text x="85" y="818" font-size="47" fill="#4c685c" font-weight="500">期間程式已測；真實排程待驗</text></g></svg>