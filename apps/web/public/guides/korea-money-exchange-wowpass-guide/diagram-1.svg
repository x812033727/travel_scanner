<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">韓國錢怎麼帶：三個問題選出現金、WOWPASS 與刷卡的組合 / How to carry money in Korea</title>
  <desc id="desc">三個問題的決策樹。問題一：這趟的花費主要在餐廳、商場、便利商店、計程車這類能刷卡的地方嗎？是就以信用卡當主力，Visa 與 Mastercard 幾乎全通，海外手續費 1.5%，遇到 DCC 問 KRW 還是 TWD 一律選 KRW；不論是否，現金部分往下看。問題二：會待 4 天以上，要逛市場、小店，又不想帶大把現金嗎？是就辦 WOWPASS，機台換匯加預付卡加 T-money，發卡費 6,000 韓元，台幣、美金等 16 種外幣可投，換匯與付款 0 手續費，餘額只能提領韓元，每次 1,000 韓元、單次上限 100,000 韓元。否就問題三：要換的現金超過第一天的量（100,000 到 200,000 韓元）嗎？是就帶美金或台幣到明洞換錢所，看板價就是實拿價，帶護照，美金的價通常最好，機場櫃台只換小額，第一航廈入境層 KB 與友利有 24 小時櫃台；否就在台灣換小額就好，台灣銀行 9 月 13 日牌告現金賣出 0.02575、買入 0.02185，價差約 15%，只換第一天要用的量。底部補充：一定要現金的地方是 T-money 儲值（地鐵儲值機投鈔票、便利商店櫃檯付現金）、傳統市場、路邊攤與部分老店，計程車可刷卡與 T-money，空卡約 2,500 到 5,000 韓元，餘額退款收 500 韓元；海關與剩餘韓元：入境攜帶現金超過 10,000 美元等值要申報，剩餘韓元先在機場便利商店花掉，紙鈔可在銀行櫃台換回，WOWPASS 餘額只能領韓元、效期 6 年。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">韓國錢怎麼帶：三個問題選出現金、WOWPASS 與刷卡的組合（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">How to carry money in Korea: credit card, WOWPASS, Myeongdong money changers or cash from Taiwan</text>

  <!-- Q1 -->
  <polygon points="800,118 1130,173 800,228 470,173" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="168" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　這趟的花費主要在餐廳、商場、</text>
  <text x="800" y="194" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">便利商店、計程車這類能刷卡的地方？</text>
  <path d="M 1130 173 L 1156 173" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="163" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="115" width="410" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1365" y="145" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">信用卡當主力　Credit card first</text>
  <text x="1365" y="173" font-size="15" fill="#1F4E73" text-anchor="middle">Visa／Mastercard 幾乎全通，海外手續費 1.5%</text>
  <text x="1365" y="199" font-size="15" fill="#1F4E73" text-anchor="middle">DCC 問 KRW 還是 TWD：一律選 KRW（원 won）</text>
  <text x="1365" y="223" font-size="15" fill="#1F4E73" text-anchor="middle">市場、路邊攤、小店還是要現金，往下看</text>
  <path d="M 800 230 L 800 270" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="256" font-size="16" fill="#5C6B6B">現金部分往下看</text>

  <!-- Q2 -->
  <polygon points="800,273 1130,328 800,383 470,328" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="323" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　會待 4 天以上，要逛市場、小店，</text>
  <text x="800" y="349" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">又不想帶大把現金？</text>
  <path d="M 1130 328 L 1156 328" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="318" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="270" width="410" height="118" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1365" y="300" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">WOWPASS：機台換匯＋預付卡＋T-money</text>
  <text x="1365" y="328" font-size="15" fill="#0B4F4D" text-anchor="middle">發卡費 6,000 韓元，台幣、美金等 16 種外幣可投</text>
  <text x="1365" y="354" font-size="15" fill="#0B4F4D" text-anchor="middle">換匯與付款 0 手續費；餘額只能提領韓元</text>
  <text x="1365" y="378" font-size="15" fill="#0B4F4D" text-anchor="middle">提領每次 1,000 韓元，單次上限 100,000 韓元</text>
  <path d="M 800 385 L 800 425" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="411" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="800,428 1130,483 800,538 470,483" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="478" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　要換的現金超過第一天的量</text>
  <text x="800" y="504" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">（100,000 到 200,000 韓元）？</text>
  <path d="M 1130 483 L 1156 483" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="473" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="425" width="410" height="118" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1365" y="455" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">帶美金或台幣到明洞換錢所　명동 Myeongdong</text>
  <text x="1365" y="483" font-size="15" fill="#8A2E1D" text-anchor="middle">看板價就是實拿價，帶護照；美金的價通常最好</text>
  <text x="1365" y="509" font-size="15" fill="#8A2E1D" text-anchor="middle">機場櫃台只換小額：T1 入境層 KB、友利 24 小時</text>
  <text x="1365" y="533" font-size="15" fill="#8A2E1D" text-anchor="middle">釜山在南浦洞、西面也有換錢所</text>
  <path d="M 470 483 L 444 483" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="452" y="473" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="425" width="410" height="118" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="235" y="455" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">在台灣換小額就好　台灣銀行</text>
  <text x="235" y="483" font-size="15" fill="#4E3428" text-anchor="middle">9 月 13 日牌告：現金賣出 0.02575、買入 0.02185</text>
  <text x="235" y="509" font-size="15" fill="#4E3428" text-anchor="middle">買賣價差約 15%，只換第一天要用的量</text>
  <text x="235" y="533" font-size="15" fill="#4E3428" text-anchor="middle">其餘帶美金或台幣，到韓國再換或刷卡</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">一定要現金的地方　Cash only</text>
  <text x="88" y="650" font-size="16" fill="#102A2B">T-money 儲值：地鐵儲值機投鈔票、便利商店櫃檯付現金</text>
  <text x="88" y="678" font-size="16" fill="#102A2B">傳統市場、路邊攤、部分老店只收現金；計程車可刷卡、可用 T-money</text>
  <text x="88" y="706" font-size="16" fill="#102A2B">空卡約 2,500 到 5,000 韓元，餘額退款收 500 韓元手續費</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">海關與剩餘韓元　Customs and leftover won</text>
  <text x="848" y="650" font-size="16" fill="#102A2B">入境攜帶現金超過 10,000 美元等值要向海關申報</text>
  <text x="848" y="678" font-size="16" fill="#102A2B">剩餘韓元先在機場便利商店、免稅店花掉，紙鈔可在銀行櫃台換回</text>
  <text x="848" y="706" font-size="16" fill="#102A2B">WOWPASS 餘額只能提領韓元，效期 6 年，留到下次也行</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">數字為 2026 年 9 月依台灣銀行、WOWPASS、中國信託、玉山銀行、仁川機場、韓國關稅廳、韓國觀光公社官網查證；匯率每天變動，以當天牌價為準。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">Apple Pay、Google Pay 只有 NFC 感應終端能用；Naver Pay、Kakao Pay 要有韓國門號與韓國帳戶，短期旅客用不到；韓國刷卡機以插晶片為主。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
