<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Inter','Helvetica Neue',Arial,'Noto Sans',system-ui,sans-serif">
  <title id="title">Driving in Mainland Japan in Four Steps: Before Departure, Pickup, On the Road, and Return (2026)</title>
  <desc id="desc">Four steps for driving in mainland Japan. Step 1 Before Departure: prepare a 1949 Geneva Convention IDP plus home license (for US, UK, Canada, Australia, Korea, and other signatories) OR an official Japanese translation (required for licenses from Taiwan, Switzerland, Germany, France, Belgium, and Monaco; Taiwan MVO NT$100 on the spot, JAF ¥6,000 online); carry passport, license, and IDP or translation, valid up to 1 year from entry; book online with a credit card; add CDW plus NOC protection; reserve a child seat for children under age 6; note that Taiwan-issued IDPs are not valid in Japan and a translation&#x27;s address must match the license word for word. Step 2 Pickup: verify all three documents at the counter; rent an ETC card (Times ¥300 plus tax per rental); request an eligible HEP or KEP expressway pass at the pickup counter; confirm studless winter tires and 4WD in snow season; photograph existing scratches; set GPS language and save the emergency hotline. Step 3 On the Road: drive on the left in a right-hand-drive car; statutory speed limits are 60 km/h on regular roads, 100 km/h on expressways, and 30 km/h on unmarked side streets without a center line; slow down in ETC lanes; fill Regular gasoline (regyura, mantan); use coin parking in cities; call 110 first after any accident; leave 3x following distance on snow and ice. Step 4 Return: return with a full tank and keep the receipt; settle ETC tolls; remove the ETC card; bring police notice and payment receipt for any parking ticket (otherwise ¥30,000 fee at Times); request one-way drop-offs in advance (not allowed between Hokkaido and Honshu); allow 1+ hour before domestic flights and more for international. Footer notes October 2026 pass prices: Hokkaido HEP standard car 4–8 days ¥7,700–¥15,400 and Kyushu KEP 2–10 days ¥6,200–¥23,800 (both require a rental car and rented ETC card); Tohoku TEP accepted start dates only through September 30, 2026 with no renewal announced; Central CEP suspended new bookings; KEP User Agreement lists validity through September 30, 2026, so confirm when booking.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="48" y="56" font-size="32" font-weight="700" fill="#102A2B">Driving in Japan in Four Steps: Prep, Pickup, On the Road &amp; Return</text>
  <text x="48" y="88" font-size="17" fill="#5C6B6B">Checked Sep–Oct 2026 via National Police Agency, Japan-Taiwan Exchange Assoc., JAF, NEXCO, Toyota &amp; Times</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: before departure -->
  <rect x="48" y="120" width="352" height="614" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="48" y="120" width="352" height="82" rx="22" fill="#2F6F9F"/>
  <text x="224" y="156" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 Before Departure</text>
  <text x="224" y="184" font-size="15" fill="#E6F0F7" text-anchor="middle">Documents, Booking &amp; Coverage</text>
  <g font-size="16" fill="#102A2B">
    <text x="68" y="236">• 1949 Geneva IDP + license</text>
    <text x="82" y="260" font-size="15" fill="#5C6B6B">(US, UK, CA, AU, KR &amp; others)</text>
    <text x="68" y="294">• OR official JP translation:</text>
    <text x="82" y="318" font-size="15" fill="#5C6B6B">TW, CH, DE, FR, BE, MC only</text>
    <text x="82" y="340" font-size="15" fill="#5C6B6B">JAF ¥6,000 / TW MVO NT$100</text>
    <text x="68" y="376">• Passport + license + IDP/translation</text>
    <text x="82" y="400" font-size="15" fill="#5C6B6B">Valid up to 1 yr from entry</text>
    <text x="68" y="436">• Book online with credit card</text>
    <text x="68" y="472">• Add CDW + NOC protection</text>
    <text x="68" y="508">• Child seat required under 6</text>
  </g>
  <rect x="66" y="544" width="316" height="162" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="224" y="576" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">Two Strict License Rules</text>
  <text x="224" y="606" font-size="15" fill="#8A2E1D" text-anchor="middle">Only 1949 Geneva IDPs are valid</text>
  <text x="224" y="632" font-size="15" fill="#8A2E1D" text-anchor="middle">(1968 Vienna &amp; Taiwan IDPs invalid)</text>
  <text x="224" y="664" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle">Translation address must match</text>
  <text x="224" y="688" font-size="15" font-weight="700" fill="#8A2E1D" text-anchor="middle">your license word for word</text>

  <!-- step 2: pick-up -->
  <rect x="432" y="120" width="352" height="614" rx="22" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <rect x="432" y="120" width="352" height="82" rx="22" fill="#6B4A3A"/>
  <text x="608" y="156" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 Pickup</text>
  <text x="608" y="184" font-size="15" fill="#F1E8E2" text-anchor="middle">Counter Check &amp; Add-Ons</text>
  <g font-size="16" fill="#102A2B">
    <text x="452" y="236">• Show passport, license &amp;</text>
    <text x="466" y="260">IDP or Japanese translation</text>
    <text x="452" y="302">• Rent an ETC card at counter</text>
    <text x="466" y="326" font-size="15" fill="#5C6B6B">Times: ¥300 + tax per rental</text>
    <text x="452" y="368">• Request HEP / KEP pass at</text>
    <text x="466" y="392">the pickup counter if eligible</text>
    <text x="452" y="434">• Snow season: studless tires</text>
    <text x="466" y="458">&amp; 4WD recommended</text>
    <text x="452" y="500">• Photograph existing scratches</text>
    <text x="452" y="542">• Set GPS language &amp; save</text>
    <text x="466" y="566">the emergency hotline</text>
  </g>
  <!-- ETC card icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="538" y="610" width="140" height="88" rx="10"/>
    <rect x="556" y="630" width="34" height="26" rx="4"/>
    <line x1="556" y1="680" x2="660" y2="680" stroke-linecap="round"/>
  </g>
  <text x="638" y="650" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">ETC</text>

  <!-- step 3: on the road -->
  <rect x="816" y="120" width="352" height="614" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="816" y="120" width="352" height="82" rx="22" fill="#2E7D5B"/>
  <text x="992" y="156" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 On the Road</text>
  <text x="992" y="184" font-size="15" fill="#E7F2EC" text-anchor="middle">Rules, Fuel &amp; Emergencies</text>
  <g font-size="16" fill="#102A2B">
    <text x="836" y="236">• Drive on the left (RHD car)</text>
    <text x="836" y="278">• Speed limits (unless posted):</text>
    <text x="850" y="302" font-size="15" fill="#5C6B6B">60 regular · 100 expressway (km/h)</text>
    <text x="850" y="324" font-size="15" fill="#5C6B6B">30 km/h unmarked side streets</text>
    <text x="836" y="366">• Slow down in ETC toll lanes</text>
    <text x="836" y="408">• Regular gas (regyura):</text>
    <text x="850" y="432" font-size="15" fill="#5C6B6B">Say "Regyura, mantan" to fill</text>
    <text x="836" y="474">• Use coin parking in cities</text>
    <text x="836" y="516">• Any crash: call 110 first</text>
    <text x="836" y="558">• Leave 3x spacing on snow</text>
  </g>
  <!-- speed sign icon -->
  <circle cx="992" cy="654" r="36" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="992" y="663" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">60</text>

  <!-- step 4: return -->
  <rect x="1200" y="120" width="352" height="614" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="1200" y="120" width="352" height="82" rx="22" fill="#D97A2B"/>
  <text x="1376" y="156" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 Return</text>
  <text x="1376" y="184" font-size="15" fill="#FBEFE4" text-anchor="middle">Refueling, Tolls &amp; Drop-Off</text>
  <g font-size="16" fill="#102A2B">
    <text x="1220" y="236">• Return full &amp; keep receipt</text>
    <text x="1220" y="278">• Settle ETC tolls at counter</text>
    <text x="1220" y="320">• Remove your ETC card</text>
    <text x="1220" y="362">• Parking ticket: bring police</text>
    <text x="1234" y="386" font-size="15" fill="#5C6B6B">notice &amp; receipt (else ¥30,000)</text>
    <text x="1220" y="428">• Book one-way drops early</text>
    <text x="1234" y="452" font-size="15" fill="#5C6B6B">No Hokkaido–Honshu drops</text>
    <text x="1220" y="494">• Allow 1+ hr before domestic</text>
    <text x="1234" y="518" font-size="15" fill="#5C6B6B">flights (more for international)</text>
  </g>
  <!-- fuel pump icon -->
  <g fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="round">
    <rect x="1336" y="604" width="64" height="92" rx="8"/>
    <rect x="1350" y="618" width="36" height="24" rx="4"/>
    <path d="M 1400 636 h 18 v 40 a 10 10 0 0 0 20 0 v -30"/>
  </g>

  <!-- arrows -->
  <path d="M 405 426 L 426 426" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 789 426 L 810 426" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1173 426 L 1194 426" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="48" y="782" font-size="16" fill="#5C6B6B">Expressway passes (Oct 2026): Hokkaido HEP standard car 4–8 days ¥7,700–¥15,400; Kyushu KEP 2–10 days ¥6,200–¥23,800 (rental ETC card required).</text>
  <text x="48" y="810" font-size="16" fill="#5C6B6B">Tohoku TEP accepted start dates only through Sep 30, 2026 (no renewal announced); Central Nippon CEP new reservations suspended.</text>
  <text x="48" y="838" font-size="16" fill="#5C6B6B">KEP User Agreement lists validity through Sep 30, 2026—confirm with Times or Nissan before booking for Oct onward.</text>
  <text x="1552" y="876" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
</svg>
