<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">일본 본토 렌터카 4단계: 출발 전, 픽업, 주행 중, 반납(2026년 한국어판)</title>
  <desc id="desc">4단계 흐름이에요. 1 출발 전: 한국 운전면허증 소지자는 여권·한국 면허증·1949 제네바 국제운전면허증(IDP) 3종을 준비하고, 대만 등 6개 지정 지역 면허자는 공식 일본어 번역문(대만 감리소 100 TWD 당일 발급, JAF 6,000엔 온라인 신청)을 준비해요. 입국일 기준 1년 이내 운전 가능하며 공식 사이트 예약·신용카드 준비, 면책보상(CDW)+NOC 면제 추가, 만 6세 미만 카시트 예약을 챙겨요. 필수 서류 미지참 시 무면허 운전이며 대만 국제운전면허증은 일본 사용 불가, 번역문 주소는 면허증과 완전히 일치해야 해요. 2 픽업: 카운터에서 필수 서류 3종 확인, ETC 카드 대여(Times 기준 1회 300엔+소비세), 고속도로 패스 HEP·TEP·KEP 픽업 카운터 신청, 겨울철 스노타이어·4륜구동 확인, 기존 긁힘 사진 촬영, 내비게이션 한국어 설정 및 사고 연락처 저장. 3 주행 중: 좌측통행·우핸들, 법정 제한속도는 일반도로 시속 60km·고속도로 시속 100km·중앙선 없는 생활도로 시속 30km, ETC 차로 감속 통과, 레귤러 휘발유 가득 주유, 코인파킹 주차, 사고 시 110 신고, 눈길 차간거리 3배 유지. 4 반납: 가득 주유 반납 후 주유 영수증 보관, ETC 통행료 일괄 정산, ETC 카드 분리, 불법주차 시 경찰서 납부 영수증 제출, 편도 반납(원웨이) 사전 신청(홋카이도와 혼슈 간 불가), 국내선 출발 1시간 이상·국제선은 더 넉넉히 여유 확보. 하단 안내: 2026년 10월 고속도로 패스 요금은 홋카이도 HEP 보통차 4일 7,700~8일 15,400엔, 규슈 KEP 2일 6,200~10일 23,800엔이며 렌터카와 대여 ETC 카드가 필수예요. 도호쿠 TEP는 2026년 9월 30일 개시분까지만 접수(연장 미발표), 주부 CEP는 신규 예약 중단, KEP 약관 유효기간은 2026년 9월 30일로 예약 시 확인이 필요해요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="33" font-weight="700" fill="#102A2B">일본 본토 렌터카 4단계: 출발 전 · 픽업 · 주행 중 · 반납</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">Driving in Japan in four steps · 2026년 9월 일본 경찰청·JAF·NEXCO·Toyota·Times 공식 사이트 확인 기준</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: before departure -->
  <rect x="60" y="136" width="340" height="598" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="136" width="340" height="86" rx="24" fill="#2F6F9F"/>
  <text x="230" y="174" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">1  출발 전</text>
  <text x="230" y="203" font-size="16" fill="#E6F0F7" text-anchor="middle">Before departure</text>
  <g font-size="16" fill="#102A2B">
    <text x="84" y="260">● 한국: 여권+면허증 원본+</text>
    <text x="102" y="284">국제면허증(1949 제네바 IDP)</text>
    <text x="84" y="320">● 대만 등 6개 지역: 일본어 번역문</text>
    <text x="102" y="344">대만 감리소 100 TWD(현장)</text>
    <text x="102" y="368">JAF 6,000엔(온라인 신청)</text>
    <text x="84" y="404">● 입국일 기준 1년 이내 운전 가능</text>
    <text x="84" y="440">● 공식 사이트 예약·신용카드</text>
    <text x="84" y="476">● 면책보상(CDW) 가입 후</text>
    <text x="102" y="500">NOC 면제 옵션까지 추가</text>
    <text x="84" y="536">● 만 6세 미만 카시트 필수</text>
  </g>
  <rect x="80" y="576" width="300" height="126" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="610" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">서류 미지참 시 무면허 운전</text>
  <text x="230" y="640" font-size="15" fill="#8A2E1D" text-anchor="middle">대만 국제면허증은 일본 사용 불가</text>
  <text x="230" y="668" font-size="15" fill="#8A2E1D" text-anchor="middle">번역문 주소는 면허증과 완전 일치</text>

  <!-- step 2: pick-up -->
  <rect x="440" y="136" width="340" height="598" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="440" y="136" width="340" height="86" rx="24" fill="#6B4A3A"/>
  <text x="610" y="174" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">2  픽업</text>
  <text x="610" y="203" font-size="16" fill="#F1E8E2" text-anchor="middle">Pick-up</text>
  <g font-size="16" fill="#102A2B">
    <text x="464" y="264">● 카운터에서 서류 3종 대조</text>
    <text x="464" y="308">● ETC 카드 대여: Times 기준</text>
    <text x="482" y="334">렌털 1회당 300엔+소비세</text>
    <text x="464" y="378">● 고속도로 패스 HEP·TEP·KEP</text>
    <text x="482" y="404">픽업 카운터에서 현장 신청</text>
    <text x="464" y="448">● 겨울철: 스노타이어·4륜구동</text>
    <text x="464" y="492">● 기존 긁힘 사진 촬영·기재</text>
    <text x="464" y="536">● 내비 한국어 설정·사고 번호 저장</text>
  </g>
  <!-- ETC card icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="540" y="600" width="140" height="90" rx="10"/>
    <rect x="558" y="622" width="34" height="26" rx="4"/>
    <line x1="558" y1="672" x2="662" y2="672" stroke-linecap="round"/>
  </g>
  <text x="640" y="642" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">ETC</text>

  <!-- step 3: on the road -->
  <rect x="820" y="136" width="340" height="598" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="136" width="340" height="86" rx="24" fill="#2E7D5B"/>
  <text x="990" y="174" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">3  주행 중</text>
  <text x="990" y="203" font-size="16" fill="#E7F2EC" text-anchor="middle">On the road</text>
  <g font-size="16" fill="#102A2B">
    <text x="844" y="264">● 좌측통행·우핸들(레버 반대)</text>
    <text x="844" y="308">● 일반도로 시속 60km</text>
    <text x="862" y="334">고속도로 시속 100km</text>
    <text x="862" y="360">중앙선 없는 생활도로 30km</text>
    <text x="844" y="404">● ETC 차로 감속 후 통과</text>
    <text x="844" y="448">● 레귤러 휘발유 가득 주유</text>
    <text x="844" y="492">● 시내 주차는 코인파킹 이용</text>
    <text x="844" y="536">● 사고 시 110 경찰 신고 필수</text>
    <text x="844" y="580">● 눈길 차간거리 평소의 3배</text>
  </g>
  <!-- speed sign icon -->
  <circle cx="990" cy="656" r="34" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="990" y="665" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">60</text>

  <!-- step 4: return -->
  <rect x="1200" y="136" width="340" height="598" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="136" width="340" height="86" rx="24" fill="#D97A2B"/>
  <text x="1370" y="174" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">4  반납</text>
  <text x="1370" y="203" font-size="16" fill="#FBEFE4" text-anchor="middle">Return</text>
  <g font-size="16" fill="#102A2B">
    <text x="1224" y="264">● 가득 주유 반납·주유 영수증 보관</text>
    <text x="1224" y="308">● ETC 통행료 일괄 정산</text>
    <text x="1224" y="352">● 하차 전 ETC 카드 분리</text>
    <text x="1224" y="396">● 불법주차: 고지서·영수증 제출</text>
    <text x="1224" y="440">● 편도 반납(원웨이) 사전 신청</text>
    <text x="1242" y="466">홋카이도와 혼슈 간 이용 불가</text>
    <text x="1224" y="510">● 국내선 출발 1시간 이상 여유</text>
    <text x="1242" y="536">국제선은 더 넉넉히 확보</text>
  </g>
  <!-- fuel pump icon -->
  <g fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="round">
    <rect x="1330" y="598" width="64" height="92" rx="8"/>
    <rect x="1344" y="612" width="36" height="24" rx="4"/>
    <path d="M 1394 630 h 18 v 40 a 10 10 0 0 0 20 0 v -30"/>
  </g>

  <!-- arrows -->
  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="788" font-size="16.5" fill="#5C6B6B">고속도로 패스 요금(2026년 10월): 홋카이도 HEP 보통차 4일 7,700~8일 15,400엔 · 규슈 KEP 2일 6,200~10일 23,800엔(렌터카+대여 ETC 필수)</text>
  <text x="60" y="820" font-size="16.5" fill="#5C6B6B">도호쿠 TEP는 2026년 9월 30일 개시분까지만 접수(연장 미발표) · 주부 CEP는 신규 예약 중단 · KEP 약관 유효기간 2026년 9월 30일(예약 시 확인)</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 제작 2026</text>
</svg>
