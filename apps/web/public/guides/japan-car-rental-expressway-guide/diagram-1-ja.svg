<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif">
  <title id="title">日本本土レンタカー利用の4ステップ：出発前・貸出・走行中・返却（2026年版）</title>
  <desc id="desc">4つのステップ。1・出発前：日本の運転免許証、または海外免許の日本語翻訳文（台湾監理所100台湾ドル即日発行、JAF 6,000円オンライン申請）を準備。海外免許利用者はパスポート・免許証・翻訳文の3点を携行し、上陸後1年間運転可能。公式サイトでオンライン予約しクレジットカードを準備。免責補償制度（CDW）に加えNOC補償オプションも加入。6歳未満はチャイルドシート必須。台湾の国際運転免許証は使用不可、翻訳文と免許証の住所一致が必須。2・貸出：窓口で必要書類を照合。ETCカードをレンタル（タイムズ公式は1回300円＋税）。高速周遊パス（HEP・TEP・KEP）は貸出窓口で申込。冬季はスタッドレスタイヤ・4WDを確認。既存の傷を写真記録。カーナビ言語設定と事故連絡先の保存。3・走行中：左側通行・右ハンドル。法定速度は一般道路60km/h、高速道路100km/h、中央線のない生活道路30km/h。ETCレーンは減速通過。給油はレギュラー満タン。駐車はコインパーキングを利用。事故時は必ず110番通報。雪道は車間距離3倍。4・返却：満タン返しでレシート保管。ETC通行料を一括精算し、ETCカードを抜き取る。駐車違反時は告知書と領収書を提示。乗り捨ては事前申請必須（北海道と本州間は不可）。国内線は1時間以上の余裕を確保。下部注記の周遊パス料金：北海道HEP普通車4日間7,700〜8日間15,400円、九州KEP 2日間6,200〜10日間23,800円（いずれもレンタカーとレンタルETCカードの併用必須）。東北TEPは2026年9月30日開始分まで受付（継続未発表）、中部CEPは新規予約停止中。KEP利用規約の有効期間は2026年9月30日までと記載されており予約時に要確認。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="32" font-weight="700" fill="#102A2B">日本本土レンタカー利用の4ステップ：出発前・貸出・走行中・返却</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">Driving in Japan in four steps ・ 2026年9月〜10月に警察庁・日本台湾交流協会・JAF・NEXCO・トヨタ・タイムズ公式情報で検証</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: before departure -->
  <rect x="60" y="136" width="340" height="594" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="136" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="230" y="175" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　出発前</text>
  <text x="230" y="205" font-size="16" fill="#E6F0F7" text-anchor="middle">Before departure</text>
  <g font-size="16" fill="#102A2B">
    <text x="82" y="264">● 免許証・翻訳文の準備</text>
    <text x="100" y="290">日本免許／海外免許＋翻訳文</text>
    <text x="100" y="316">台湾監理所100台湾ドル・JAF 6,000円</text>
    <text x="82" y="356">● 海外免許は3点を携行</text>
    <text x="100" y="382">旅券＋免許＋翻訳文（1年有効）</text>
    <text x="82" y="422">● 公式サイト予約・クレカ準備</text>
    <text x="82" y="462">● 免責補償（CDW）に加入</text>
    <text x="100" y="488">さらにNOC補償オプション追加</text>
    <text x="82" y="528">● 6歳未満はチャイルドシート</text>
  </g>
  <rect x="78" y="592" width="304" height="98" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="630" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">台湾の国際運転免許証は使用不可</text>
  <text x="230" y="660" font-size="15" fill="#8A2E1D" text-anchor="middle">翻訳文と免許証の住所完全一致が必須</text>

  <!-- step 2: pick-up -->
  <rect x="440" y="136" width="340" height="594" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="440" y="136" width="340" height="88" rx="24" fill="#6B4A3A"/>
  <text x="610" y="175" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　貸出</text>
  <text x="610" y="205" font-size="16" fill="#F1E8E2" text-anchor="middle">Pick-up</text>
  <g font-size="16" fill="#102A2B">
    <text x="462" y="264">● 窓口で免許・必要書類を照合</text>
    <text x="462" y="306">● ETCカードレンタル</text>
    <text x="480" y="332">タイムズ公式：1回300円＋税</text>
    <text x="462" y="374">● 周遊パス（HEP・TEP・KEP）</text>
    <text x="480" y="400">貸出カウンターで申込</text>
    <text x="462" y="442">● 冬季：スタッドレス・4WD確認</text>
    <text x="462" y="484">● 車両の既存傷を写真で記録</text>
    <text x="462" y="526">● ナビ言語設定・事故連絡先保存</text>
  </g>
  <!-- ETC card icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="540" y="596" width="140" height="90" rx="10"/>
    <rect x="558" y="618" width="34" height="26" rx="4"/>
    <line x1="558" y1="668" x2="662" y2="668" stroke-linecap="round"/>
  </g>
  <text x="640" y="638" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">ETC</text>

  <!-- step 3: on the road -->
  <rect x="820" y="136" width="340" height="594" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="136" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="175" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　走行中</text>
  <text x="990" y="205" font-size="16" fill="#E7F2EC" text-anchor="middle">On the road</text>
  <g font-size="16" fill="#102A2B">
    <text x="842" y="264">● 左側通行・右ハンドル</text>
    <text x="842" y="304">● 法定速度（標識優先）</text>
    <text x="860" y="330">一般道60・高速100km/h</text>
    <text x="860" y="356">中央線なし生活道路30km/h</text>
    <text x="842" y="396">● ETCレーンは減速して通過</text>
    <text x="842" y="436">● 給油は「レギュラー・満タン」</text>
    <text x="842" y="476">● 駐車はコインパーキング利用</text>
    <text x="842" y="516">● 事故時はまず110番通報</text>
    <text x="842" y="556">● 雪道は車間距離を通常の3倍</text>
  </g>
  <!-- speed sign icon -->
  <circle cx="990" cy="648" r="34" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="990" y="657" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">60</text>

  <!-- step 4: return -->
  <rect x="1200" y="136" width="340" height="594" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="136" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="175" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　返却</text>
  <text x="1370" y="205" font-size="16" fill="#FBEFE4" text-anchor="middle">Return</text>
  <g font-size="16" fill="#102A2B">
    <text x="1222" y="264">● 満タン返し・レシート保管</text>
    <text x="1222" y="306">● ETC通行料を店舗で一括精算</text>
    <text x="1222" y="348">● ETCカードを必ず抜き取る</text>
    <text x="1222" y="390">● 駐車違反：告知書と領収書提示</text>
    <text x="1222" y="432">● 乗り捨ては事前申請が必須</text>
    <text x="1240" y="458">北海道と本州の間は不可</text>
    <text x="1222" y="500">● 国内線は1時間以上前に返却</text>
    <text x="1240" y="526">国際線はさらに余裕を確保</text>
  </g>
  <!-- fuel pump icon -->
  <g fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="round">
    <rect x="1330" y="596" width="64" height="90" rx="8"/>
    <rect x="1344" y="610" width="36" height="24" rx="4"/>
    <path d="M 1394 628 h 18 v 40 a 10 10 0 0 0 20 0 v -30"/>
  </g>

  <!-- arrows -->
  <path d="M 406 430 L 432 430" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 786 430 L 812 430" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1166 430 L 1192 430" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="786" font-size="16" fill="#5C6B6B">高速周遊パス料金（2026年10月）：北海道HEP普通車4日間7,700〜8日間15,400円、九州KEP 2日間6,200〜10日間23,800円（レンタカー＋レンタルETC必須）。</text>
  <text x="60" y="816" font-size="16" fill="#5C6B6B">東北TEPは2026年9月30日利用開始分まで受付（継続未発表）。中部CEPは新規予約停止中。KEP規約の有効期間は2026年9月30日までと記載のため予約時に要確認。</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 制作 2026</text>
</svg>
