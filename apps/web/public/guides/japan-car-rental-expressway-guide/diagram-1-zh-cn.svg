<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">日本本岛自驾四步流程：出发前、取车、路上、还车（2026 年版）</title>
  <desc id="desc">四个步骤。出发前：中国大陆驾照（含翻译认证件）不能在日本合法自驾；日本仅认可《1949 年日内瓦公约》国际驾照（IDP）加驾照原件加护照，或六个指定国家与地区（台湾地区、瑞士、德国、法国、比利时、摩纳哥）的驾照原件加官方日文译本加护照，入境后 1 年内可开车；台湾驾照日文译本可在公路监理所每份 100 新台币当场核发、JAF 6,000 日元网上申请，或台北驻日代表处 400 日元办理（约 10 个工作日）；台湾国际驾照在日本不可用，译本地址须与驾照完全一致；官网在线预约并备信用卡；加购免责补偿 CDW 再加 NOC 营业补偿方案；未满 6 岁须配儿童安全座椅。取车：柜台核对护照、驾照与译本或 IDP；租用 ETC 卡，Times 官网每次 300 日元加税；周游券 HEP、TEP、KEP 在取车柜台申请；雪季确认无钉雪地胎与四驱；拍照记录车身既有刮痕；导航切换中文，存好事故专线。路上：靠左行驶、右舵驾驶；一般道路限速 60 公里、高速公路普通车 100 公里、无中央线生活道路 30 公里；ETC 车道减速通过；加普通汽油（Regular）加满；投币停车场缴费停车；事故先打 110 报警；雪地车距拉至平时 3 倍。还车：满油还车并留收据；ETC 过路费一并结算；离车拔下 ETC 卡；违停须出示告知书与缴款收据；异地还车提前申请，北海道与本州之间不可异地还；国内航班预留 1 小时以上，国际航班留更宽裕时间。底部注明周游券参考价：北海道 HEP 普通车 4 天 7,700 至 8 天 15,400 日元、九州 KEP 2 天 6,200 至 10 天 23,800 日元，均须搭配租车与租用 ETC 卡；东北 TEP 受理仅截至 2026 年 9 月 30 日开始使用，尚未公布续办；中部 CEP 已停止新预约；KEP 使用协议有效期写至 2026 年 9 月 30 日，预约时请先确认。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="50" y="60" font-size="34" font-weight="700" fill="#102A2B">日本本岛自驾四步：出发前、取车、路上、还车</text>
  <text x="50" y="94" font-size="18" fill="#5C6B6B">Driving in Japan in four steps · 2026 年 9 月依日本警察厅、日本台湾交流协会、JAF、NEXCO、Toyota、Times 官网查证</text>

  <!-- step 1: before departure -->
  <rect x="50" y="126" width="344" height="604" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="50" y="126" width="344" height="86" rx="24" fill="#2F6F9F"/>
  <text x="222" y="164" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　出发前</text>
  <text x="222" y="194" font-size="16" fill="#E6F0F7" text-anchor="middle">Before departure</text>
  <g font-size="16" fill="#102A2B">
    <text x="72" y="246" font-weight="700">● 合法证件（二选一＋护照）：</text>
    <text x="88" y="271" font-size="15">1949 日内瓦公约 IDP＋驾照原件</text>
    <text x="88" y="295" font-size="15">或 6 指定地区驾照＋官方日文译本</text>
    <text x="72" y="330" font-weight="700">● 台湾驾照官方日文译本：</text>
    <text x="88" y="355" font-size="15">监理所 100 新台币、当场核发</text>
    <text x="88" y="379" font-size="15">JAF 6,000 日元、网上申请</text>
    <text x="88" y="403" font-size="15">驻日代表处 400 日元（约 10 工作日）</text>
    <text x="72" y="438">● 入境起 1 年内可驾；官网预约</text>
    <text x="72" y="472">● 保险加购：免责补偿 CDW</text>
    <text x="88" y="497" font-size="15">再加 NOC 营业补偿方案</text>
    <text x="72" y="531">● 未满 6 岁须配儿童安全座椅</text>
    <text x="72" y="563" font-size="15" fill="#5C6B6B">注：台湾签发国际驾照在日本不可用</text>
  </g>
  <rect x="70" y="586" width="304" height="122" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="222" y="618" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">中国大陆驾照（含翻译件）不可用</text>
  <text x="222" y="650" font-size="15" fill="#8A2E1D" text-anchor="middle">无证驾驶最高罚 50 万日元</text>
  <text x="222" y="680" font-size="15" fill="#8A2E1D" text-anchor="middle">译本地址须与驾照原件完全一致</text>

  <!-- step 2: pick-up -->
  <rect x="434" y="126" width="344" height="604" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="434" y="126" width="344" height="86" rx="24" fill="#6B4A3A"/>
  <text x="606" y="164" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　取车</text>
  <text x="606" y="194" font-size="16" fill="#F1E8E2" text-anchor="middle">Pick-up</text>
  <g font-size="16" fill="#102A2B">
    <text x="456" y="252">● 柜台核对护照、驾照与译本/IDP</text>
    <text x="456" y="296">● 租 ETC 卡：Times 官网</text>
    <text x="474" y="322" font-size="15">每次 300 日元＋税</text>
    <text x="456" y="366">● 周游券 HEP、TEP、KEP</text>
    <text x="474" y="392" font-size="15">均在取车柜台现场申请</text>
    <text x="456" y="436">● 雪季确认：无钉雪地胎、四驱</text>
    <text x="456" y="480">● 拍照记录车身既有刮痕</text>
    <text x="456" y="524">● 导航切中文，存好事故专线</text>
  </g>
  <!-- ETC card icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="536" y="594" width="140" height="90" rx="10"/>
    <rect x="554" y="616" width="34" height="26" rx="4"/>
    <line x1="554" y1="666" x2="658" y2="666" stroke-linecap="round"/>
  </g>
  <text x="636" y="636" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">ETC</text>

  <!-- step 3: on the road -->
  <rect x="818" y="126" width="344" height="604" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="818" y="126" width="344" height="86" rx="24" fill="#2E7D5B"/>
  <text x="990" y="164" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　路上</text>
  <text x="990" y="194" font-size="16" fill="#E7F2EC" text-anchor="middle">On the road</text>
  <g font-size="16" fill="#102A2B">
    <text x="840" y="252">● 靠左行驶、驾驶座在右</text>
    <text x="840" y="294">● 一般道路限速 60 公里</text>
    <text x="858" y="320" font-size="15">高速公路普通车 100 公里</text>
    <text x="858" y="346" font-size="15">无中央线生活道路 30 公里</text>
    <text x="840" y="390">● ETC 车道减速慢行再通过</text>
    <text x="840" y="434">● 加普通汽油（Regular）加满</text>
    <text x="840" y="478">● 市区使用投币停车场缴费</text>
    <text x="840" y="522">● 事故无论大小先打 110 报警</text>
    <text x="840" y="566">● 雪地行车车距拉至平时 3 倍</text>
  </g>
  <!-- speed sign icon -->
  <circle cx="990" cy="652" r="34" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="990" y="661" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">60</text>

  <!-- step 4: return -->
  <rect x="1202" y="126" width="344" height="604" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1202" y="126" width="344" height="86" rx="24" fill="#D97A2B"/>
  <text x="1374" y="164" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　还车</text>
  <text x="1374" y="194" font-size="16" fill="#FBEFE4" text-anchor="middle">Return</text>
  <g font-size="16" fill="#102A2B">
    <text x="1224" y="252">● 满油还车并保留加油收据</text>
    <text x="1224" y="296">● ETC 过路费还车时一并结算</text>
    <text x="1224" y="340">● 离开车辆前拔下 ETC 卡</text>
    <text x="1224" y="384">● 违停须出示告知书与缴款收据</text>
    <text x="1224" y="428">● 异地还车须提前预约申请</text>
    <text x="1242" y="454" font-size="15">北海道与本州之间不可异地还</text>
    <text x="1224" y="498">● 国内航班至少预留 1 小时</text>
    <text x="1242" y="524" font-size="15">国际航班需预留更宽裕时间</text>
  </g>
  <!-- fuel pump icon -->
  <g fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="round">
    <rect x="1334" y="594" width="64" height="92" rx="8"/>
    <rect x="1348" y="608" width="36" height="24" rx="4"/>
    <path d="M 1398 626 h 18 v 40 a 10 10 0 0 0 20 0 v -30"/>
  </g>

  <!-- arrows centered cleanly inside the 34px inter-column gaps -->
  <g fill="#5C6B6B">
    <path d="M 403 424 H 416 V 416 L 427 428 L 416 440 V 432 H 403 Z"/>
    <path d="M 787 424 H 800 V 416 L 811 428 L 800 440 V 432 H 787 Z"/>
    <path d="M 1171 424 H 1184 V 416 L 1195 428 L 1184 440 V 432 H 1171 Z"/>
  </g>

  <text x="50" y="778" font-size="17" fill="#5C6B6B">周游券参考价（2026 年 10 月）：北海道 HEP 普通车 4 天 7,700 至 8 天 15,400 日元；九州 KEP 2 天 6,200 至 10 天 23,800 日元，均须搭配租车与租用 ETC 卡。</text>
  <text x="50" y="810" font-size="17" fill="#5C6B6B">东北 TEP 受理仅截至 2026 年 9 月 30 日起用行程，尚未公布续办；中部 CEP 已停止新预约；KEP 协议有效期写至 2026 年 9 月 30 日，预约时请先向租车公司确认。</text>
  <text x="1546" y="868" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 制图 2026</text>
</svg>
