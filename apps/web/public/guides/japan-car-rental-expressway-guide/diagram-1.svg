<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本本島自駕四步流程：出發前、取車、路上、還車（2026 年台灣旅客版）</title>
  <desc id="desc">四個步驟。出發前：辦駕照日文譯本，監理所每份 100 元當場核發，JAF 6,000 日圓線上申請；護照、駕照、譯本三樣，入境後 1 年內可開車；官網線上預約、信用卡；加免責補償 CDW 再加 NOC 補償方案；未滿 6 歲要兒童座椅；台灣國際駕照在日本不能用，譯本地址要跟駕照一致。取車：櫃檯核對三樣證件；租 ETC 卡，Times 官網每次 300 日圓加稅；周遊券 HEP、TEP、KEP 在取車櫃檯申請；雪季雪胎與四驅；拍照記錄既有刮痕；導航切中文，存事故專線。路上：靠左行駛右駕；一般道路 60 公里、高速公路 100 公里、無中央線的生活道路 30 公里；ETC 車道減速通過；加レギュラー滿油；コインパーキング停車；事故先打 110 報警；雪地車距 3 倍。還車：滿油還車留收據；ETC 過路費一起結算；拔下 ETC 卡；違停要出示告知書與收據；異地還車先申請，北海道與本州之間不可；國內線留 1 小時以上。底下註記周遊券票價：北海道 HEP 普通車 4 天 7,700 到 8 天 15,400 日圓、東北 TEP 4 天 8,500 到 8 天 17,000 日圓、九州 KEP 2 天 6,200 到 10 天 23,800 日圓；TEP 受理到 2026 年 9 月 30 日開始使用、KEP 有效期間到 2026 年 9 月 30 日、中部 CEP 已停止新預約，都要搭配租車與租用的 ETC 卡。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本本島自駕四步：出發前、取車、路上、還車</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Driving in Japan in four steps · 2026 年 9 月依警察廳、日本台灣交流協會、JAF、NEXCO、Toyota、Times 官網查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: before departure -->
  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　出發前</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">出発前 (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● 駕照日文譯本：</text>
    <text x="104" y="296">監理所 100 元、當場核發</text>
    <text x="104" y="322">JAF 6,000 日圓、線上申請</text>
    <text x="86" y="366">● 護照＋駕照＋譯本三樣</text>
    <text x="104" y="392">入境後 1 年內可開車</text>
    <text x="86" y="436">● 官網線上預約、信用卡</text>
    <text x="86" y="480">● 加免責補償 CDW</text>
    <text x="104" y="506">再加 NOC 補償方案</text>
    <text x="86" y="550">● 未滿 6 歲要兒童座椅</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">台灣國際駕照在日本不能用</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">譯本地址要跟駕照一模一樣</text>

  <!-- step 2: pick-up -->
  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"/>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　取車</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">貸出 (Pick-up)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● 櫃檯核對三樣證件</text>
    <text x="466" y="314">● 租 ETC 卡：Times 官網</text>
    <text x="484" y="340">每次 300 日圓＋稅</text>
    <text x="466" y="384">● 周遊券 HEP、TEP、KEP</text>
    <text x="484" y="410">在取車櫃檯申請</text>
    <text x="466" y="454">● 雪季：雪胎、四驅</text>
    <text x="466" y="498">● 拍照記錄既有刮痕</text>
    <text x="466" y="542">● 導航切中文，存事故專線</text>
  </g>
  <!-- ETC card icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="540" y="600" width="140" height="90" rx="10"/>
    <rect x="558" y="622" width="34" height="26" rx="4"/>
    <line x1="558" y1="672" x2="662" y2="672" stroke-linecap="round"/>
  </g>
  <text x="640" y="642" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">ETC</text>

  <!-- step 3: on the road -->
  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　路上</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">走行中 (On the road)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● 靠左行駛、駕駛座在右</text>
    <text x="846" y="314">● 一般道路 60 公里</text>
    <text x="864" y="340">高速公路 100 公里</text>
    <text x="864" y="366">無中央線的生活道路 30</text>
    <text x="846" y="410">● ETC 車道減速通過</text>
    <text x="846" y="454">● 加レギュラー、満タン</text>
    <text x="846" y="498">● コインパーキング停車</text>
    <text x="846" y="542">● 事故先打 110 報警</text>
    <text x="846" y="586">● 雪地車距 3 倍</text>
  </g>
  <!-- speed sign icon -->
  <circle cx="990" cy="660" r="34" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="990" y="669" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">60</text>

  <!-- step 4: return -->
  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　還車</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">返却 (Return)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● 滿油還車、留收據</text>
    <text x="1226" y="314">● ETC 過路費一起結算</text>
    <text x="1226" y="358">● 拔下 ETC 卡</text>
    <text x="1226" y="402">● 違停：出示告知書與收據</text>
    <text x="1226" y="446">● 異地還車先申請</text>
    <text x="1244" y="472">北海道與本州之間不可</text>
    <text x="1226" y="516">● 國內線留 1 小時以上</text>
    <text x="1244" y="542">國際線更寬</text>
  </g>
  <!-- fuel pump icon -->
  <g fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="round">
    <rect x="1330" y="598" width="64" height="92" rx="8"/>
    <rect x="1344" y="612" width="36" height="24" rx="4"/>
    <path d="M 1394 630 h 18 v 40 a 10 10 0 0 0 20 0 v -30"/>
  </g>

  <!-- arrows -->
  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="790" font-size="18" fill="#5C6B6B">周遊券票價（2026 年 9 月）：北海道 HEP 普通車 4 天 7,700 到 8 天 15,400 日圓；東北 TEP 4 天 8,500 到 8 天 17,000 日圓；九州 KEP 2 天 6,200 到 10 天 23,800 日圓。</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">TEP 受理到 2026 年 9 月 30 日開始使用、KEP 有效期間到 2026 年 9 月 30 日、中部 CEP 已停止新預約；三張都要搭配租車與租用的 ETC 卡。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
