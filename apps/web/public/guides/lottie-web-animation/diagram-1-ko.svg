<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">애니메이션 외에도 전체 조작 상태 유지하기</title><desc id="desc">네 카드에 제출 전, 제출 중, 응답 수신, 움직임 대안을 나열해 애니메이션 오류가 실제 신청 상태를 가려서는 안 된다는 점을 설명합니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">애니메이션 외에도 전체 조작 상태 유지하기</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">직접 만든 프로젝터 대여 페이지: 애니메이션은 알림, 근거는 텍스트와 실제 결과</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">제출 전</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">신청서 내용 먼저 확인</text>
<text x="108.0" y="423" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">성공 애니메이션 미리 재생 금지</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">제출 중</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">처리 중임을 텍스트로 안내</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">중복 제출 방지</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">응답 수신</text>
<text x="846.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">실제 결과에 따라 설명</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">애니메이션은 보조 알림</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">대체 가능</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">정적 결과도 명확히</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">움직임을 줄여도 조작 가능</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">애니메이션 로딩 실패, 사용자의 움직임 끄기, 신청 제출 실패는 각각 별도로 처리해야 합니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
