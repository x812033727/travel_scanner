<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">零用錢的三個決定，各自教到什麼 / Three decisions that design an allowance</title>
<desc id="desc">三欄分別是設計零用錢的三個決定：定額或綁條件、多久給一次、哪些開支歸孩子。每一欄的上下兩塊是兩種選法與各自的代價。定額讓孩子練分配，但少了勞務換報酬的連結；綁家事或成績會把家庭分工與學習變成交易。週期短很快看得到結果，週期長則要先規劃、花光了要等很久。有責任清單才會出現取捨，沒有清單只剩想買就買。三欄的箭頭共同指向底部：金額不是先挑一個數字，是責任清單推出來的；講好的金額之內，花光了就等下一次。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">零用錢的三個決定，各自教到什麼</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Designing an allowance · 兩種選法都有代價，差別在你知不知道自己選了哪一種</text>

<rect x="60" y="124" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="290" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">決定一：定額或綁條件</text>
<rect x="60" y="215" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="290" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">定額</text>
<text x="290" y="302" text-anchor="middle" font-size="18" fill="#5C6B6B">錢和表現脫鉤</text>
<text x="290" y="336" text-anchor="middle" font-size="18" fill="#5C6B6B">練的是怎麼分配</text>
<rect x="60" y="396" width="460" height="154" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="290" y="443" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">綁家事或成績</text>
<text x="290" y="483" text-anchor="middle" font-size="18" fill="#5C6B6B">家庭分工變成交易</text>
<text x="290" y="517" text-anchor="middle" font-size="18" fill="#5C6B6B">學習變成拿報酬的手段</text>

<rect x="570" y="124" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">決定二：多久給一次</text>
<rect x="570" y="215" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">週期短</text>
<text x="800" y="302" text-anchor="middle" font-size="18" fill="#5C6B6B">很快看得到結果</text>
<text x="800" y="336" text-anchor="middle" font-size="18" fill="#5C6B6B">規劃的跨度也短</text>
<rect x="570" y="396" width="460" height="154" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="443" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">週期長</text>
<text x="800" y="483" text-anchor="middle" font-size="18" fill="#5C6B6B">要先規劃才撐得到</text>
<text x="800" y="517" text-anchor="middle" font-size="18" fill="#5C6B6B">花光了要等很久</text>

<rect x="1080" y="124" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1310" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">決定三：哪些開支歸孩子</text>
<rect x="1080" y="215" width="460" height="155" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1310" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">有責任清單</text>
<text x="1310" y="302" text-anchor="middle" font-size="18" fill="#5C6B6B">買了這個就沒有那個</text>
<text x="1310" y="336" text-anchor="middle" font-size="18" fill="#5C6B6B">金額從清單推出來</text>
<rect x="1080" y="396" width="460" height="154" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1310" y="443" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">沒有清單</text>
<text x="1310" y="483" text-anchor="middle" font-size="18" fill="#5C6B6B">只剩想買就買</text>
<text x="1310" y="517" text-anchor="middle" font-size="18" fill="#5C6B6B">練不到取捨</text>

<path d="M290 562 L290 602" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M800 562 L800 602" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1310 562 L1310 602" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="610" width="1480" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="678" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">金額不是先挑一個數字，是責任清單推出來的</text>
<text x="800" y="724" text-anchor="middle" font-size="20" fill="#5C6B6B">講好的金額之內，花光了就等下一次；等待本身就是這門課的內容</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
