<title id="title">零用錢怎麼給：把金錢觀教給孩子的實際做法 / Allowance as a teaching tool</title>
<desc id="desc">一座置中的天平：立柱與底座在中央，水平的橫樑左右兩端各以一根直桿垂下一個淺碗形托盤。左盤上放一枚抽象的圓形硬幣，只有外圈與中心的小圓，沒有任何面額或圖案；右盤上放一張圓角的清單，清單上有一個綠色的勾記號與兩條灰色橫線。橫樑保持水平，兩邊等重。</desc>
