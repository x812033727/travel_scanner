<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">為 AI 選顯示卡的判斷順序 / Decision order for choosing a GPU for local AI</title>
  <desc id="desc">由上往下五個步驟。第一步先決定要跑哪個模型，ollama.com/library 的標籤頁直接寫檔案大小，例如 gemma3:12b 是 8.1GB、gpt-oss:20b 是 14GB。第二步確認顯示記憶體裝得下檔案加上下文，Ollama 依顯示記憶體給預設上下文，小於 24 GiB 給 4k；裝不下時 ollama ps 的 PROCESSOR 欄不會是 100% GPU。第三步查官方支援清單，NVIDIA 要 compute capability 5.0 以上與驅動 550 版以上，AMD 在 Linux 要 ROCm v7 或改走 Vulkan，Apple 走 Metal，Intel 在 llama.cpp 走 SYCL。第四步同容量才比記憶體頻寬與世代，RTX 5090 是 32 GB 搭 1792 GB/sec，RX 9070 XT 是 16 GB 搭 640 GB/s。第五步確認電源與機殼，官方規格頁寫 RTX 5090 建議系統電源 1000 W，RX 9070 XT 最低電源供應器建議 750W。任何一關不過就回到上一步換選擇。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">為 AI 選顯示卡的判斷順序</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Decision order for choosing a GPU for local AI models</text>

  <!-- step 1 -->
  <rect x="60" y="112" width="620" height="118" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="158" font-size="22" font-weight="700" fill="#102A2B">① 先決定要跑哪個模型</text>
  <text x="90" y="194" font-size="17" fill="#5C6B6B">ollama.com/library 的標籤頁直接寫檔案大小</text>
  <rect x="712" y="112" width="828" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="742" y="160" font-size="18" fill="#102A2B">gemma3:12b 是 8.1GB　gpt-oss:20b 是 14GB</text>
  <text x="742" y="192" font-size="17" fill="#5C6B6B">同一個模型換量化標籤，檔案大小差很多</text>
  <line x1="680" y1="171" x2="706" y2="171" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="230" x2="370" y2="258" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="60" y="262" width="620" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="90" y="308" font-size="22" font-weight="700" fill="#102A2B">② 顯示記憶體裝得下檔案加上下文</text>
  <text x="90" y="344" font-size="17" fill="#5C6B6B">Ollama 依顯示記憶體給預設上下文：小於 24 GiB 給 4k</text>
  <rect x="712" y="262" width="828" height="118" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="742" y="310" font-size="18" fill="#102A2B">裝不下就退回上一步：換小一點的標籤或加大容量</text>
  <text x="742" y="342" font-size="17" fill="#5C6B6B">ollama ps 的 PROCESSOR 欄要是 100% GPU</text>
  <line x1="680" y1="321" x2="706" y2="321" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="380" x2="370" y2="408" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="60" y="412" width="620" height="118" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="90" y="458" font-size="22" font-weight="700" fill="#102A2B">③ 查官方支援清單</text>
  <text x="90" y="494" font-size="17" fill="#5C6B6B">NVIDIA：compute capability 5.0 以上、驅動 550 版以上</text>
  <rect x="712" y="412" width="828" height="118" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="742" y="460" font-size="18" fill="#102A2B">AMD：Linux 要 ROCm v7，或改走 Vulkan</text>
  <text x="742" y="492" font-size="18" fill="#102A2B">Apple：Metal　Intel：llama.cpp 走 SYCL</text>
  <line x1="680" y1="471" x2="706" y2="471" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="530" x2="370" y2="558" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="60" y="562" width="620" height="118" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="90" y="608" font-size="22" font-weight="700" fill="#102A2B">④ 同容量才比頻寬與世代</text>
  <text x="90" y="644" font-size="17" fill="#5C6B6B">不要用頻寬換容量，容量不足誰都救不了</text>
  <rect x="712" y="562" width="828" height="118" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="742" y="610" font-size="18" fill="#102A2B">RTX 5090：32 GB　1792 GB/sec</text>
  <text x="742" y="642" font-size="18" fill="#102A2B">RX 9070 XT：16 GB　640 GB/s</text>
  <line x1="680" y1="621" x2="706" y2="621" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="680" x2="370" y2="708" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="60" y="712" width="620" height="118" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="90" y="758" font-size="22" font-weight="700" fill="#102A2B">⑤ 最後確認電源與機殼</text>
  <text x="90" y="794" font-size="17" fill="#5C6B6B">瓦數、長度與槽位都以官方規格頁為準</text>
  <rect x="712" y="712" width="828" height="118" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="742" y="760" font-size="18" fill="#102A2B">RTX 5090：建議系統電源 1000 W</text>
  <text x="742" y="792" font-size="18" fill="#102A2B">RX 9070 XT：最低電源供應器建議 750W</text>
  <line x1="680" y1="771" x2="706" y2="771" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
