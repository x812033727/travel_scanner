<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">顯示記憶體優先 / VRAM capacity first</title>
  <desc id="desc">抽象插圖。畫面上方是一行標題「顯示記憶體優先」。左邊一個綠色邊框的圓角容器代表容量足夠的顯示記憶體，上方有一塊模型檔案沿著箭頭落進去，容器裡疊了三層方塊，頂端還留一段空白代表上下文需要的空間。右邊一個較小的紅色邊框容器代表容量不足，上方同樣有一塊檔案沿箭頭落下，但最上面那塊實心方塊比容器開口還寬，卡在邊緣外面裝不進去。兩個容器下方各有一條底線。整張圖只有幾何形狀，沒有任何品牌標誌、產品外形或介面。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="176" text-anchor="middle" font-size="68" letter-spacing="12" fill="#102A2B">顯示記憶體優先</text>

  <!-- left: the model file that fits -->
  <rect x="384" y="264" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <line x1="474" y1="344" x2="474" y2="432" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- left container: enough VRAM, headroom left over for the context window -->
  <rect x="244" y="454" width="460" height="300" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="280" y="674" width="388" height="56" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="280" y="606" width="388" height="56" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="280" y="538" width="388" height="56" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <line x1="244" y1="792" x2="704" y2="792" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round"/>

  <!-- right: the model file that does not fit -->
  <rect x="1036" y="264" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <line x1="1126" y1="344" x2="1126" y2="432" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- right container: too small, the last block is wider than the opening and rides the rim -->
  <rect x="946" y="534" width="360" height="220" rx="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <rect x="982" y="674" width="288" height="56" rx="10" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <rect x="982" y="606" width="288" height="56" rx="10" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <rect x="908" y="470" width="436" height="72" rx="12" fill="#B8442D"/>
  <line x1="946" y1="792" x2="1306" y2="792" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
</svg>
