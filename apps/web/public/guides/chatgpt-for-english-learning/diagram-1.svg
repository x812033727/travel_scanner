<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">每天 20 分鐘的英文練習流程與六種練法 / A 20-minute daily English routine with ChatGPT and the six practice types</title>
  <desc id="desc">上排由左到右四個框用箭頭串起：暖身 3 分鐘（讀昨天的單字卡、唸一次被改過的句子、決定今天的主題）、寫作糾錯 7 分鐘（貼 3 到 5 句自己寫的英文、先給正確句再解釋、一句最多改三處）、對話 7 分鐘（一次一個問題、答完先糾正再往下問、6 輪後列 3 個句型）、單字卡 3 分鐘（錯句整理成表格、單字／例句／中文、存進自己的筆記）。下排六張卡片是六種練法與提示詞編號：1 寫作糾錯，貼自己寫的句子，它先給正確句再解釋；2 文字對話，一次一個問題，6 輪後列 3 個句型；3 口說，語音模式一問一答，它唸正確句你跟讀；4 單字卡，錯句整理成三欄表格，存到自己的筆記；5 閱讀理解，自己找文章貼上去，它出 3 題再解釋；6 聽力，語音模式它唸你寫，再對逐字稿。底部提醒：把你自己寫的句子貼上去改，比讀它生成的範文有效；分鐘數是建議，程度高可以把對話拉長、寫作縮短。2026 年 9 月整理。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">每天 20 分鐘的英文練習流程與六種練法（2026 年 9 月整理）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">A 20-minute daily routine with ChatGPT: warm-up, writing, conversation, flashcards, and the six practice types</text>

  <!-- row 1: the daily 20 minutes -->
  <text x="65" y="126" font-size="19" font-weight="700" fill="#102A2B">每天 20 分鐘怎麼分　The daily 20 minutes</text>

  <rect x="65" y="142" width="330" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="89" y="184" font-size="20" font-weight="700" fill="#1F4E73">暖身 3 分鐘</text>
  <text x="89" y="208" font-size="15" fill="#5C6B6B">Warm-up</text>
  <text x="89" y="246" font-size="16" fill="#102A2B">讀昨天的單字卡</text>
  <text x="89" y="274" font-size="16" fill="#102A2B">唸一次被改過的句子</text>
  <text x="89" y="302" font-size="16" fill="#102A2B">決定今天的主題</text>
  <path d="M 401 242 L 437 242" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="445" y="142" width="330" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="469" y="184" font-size="20" font-weight="700" fill="#0B4F4D">寫作糾錯 7 分鐘</text>
  <text x="469" y="208" font-size="15" fill="#5C6B6B">Writing correction</text>
  <text x="469" y="246" font-size="16" fill="#102A2B">貼 3 到 5 句自己寫的英文</text>
  <text x="469" y="274" font-size="16" fill="#102A2B">先給正確句再解釋</text>
  <text x="469" y="302" font-size="16" fill="#102A2B">一句最多改三處</text>
  <path d="M 781 242 L 817 242" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="825" y="142" width="330" height="200" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <text x="849" y="184" font-size="20" font-weight="700" fill="#8A4A16">對話 7 分鐘</text>
  <text x="849" y="208" font-size="15" fill="#5C6B6B">Conversation</text>
  <text x="849" y="246" font-size="16" fill="#102A2B">一次一個問題</text>
  <text x="849" y="274" font-size="16" fill="#102A2B">答完先糾正再往下問</text>
  <text x="849" y="302" font-size="16" fill="#102A2B">6 輪後列 3 個句型</text>
  <path d="M 1161 242 L 1197 242" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1205" y="142" width="330" height="200" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1229" y="184" font-size="20" font-weight="700" fill="#1F5A40">單字卡 3 分鐘</text>
  <text x="1229" y="208" font-size="15" fill="#5C6B6B">Flashcards</text>
  <text x="1229" y="246" font-size="16" fill="#102A2B">錯句整理成表格</text>
  <text x="1229" y="274" font-size="16" fill="#102A2B">單字／例句／中文</text>
  <text x="1229" y="302" font-size="16" fill="#102A2B">存進自己的筆記</text>

  <!-- row 2: the six practice types -->
  <text x="48" y="392" font-size="19" font-weight="700" fill="#102A2B">六種練法與提示詞編號　The six practice types and their prompt numbers</text>

  <!-- 1 寫作糾錯 -->
  <rect x="48" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="84" cy="446" r="20" fill="#0D6B68"/>
  <text x="84" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="112" y="453" font-size="19" font-weight="700" fill="#0B4F4D">寫作糾錯</text>
  <text x="72" y="482" font-size="15" fill="#5C6B6B">Writing correction</text>
  <g transform="rotate(-40 165 560)">
    <rect x="151" y="505" width="28" height="80" rx="5" fill="#0D6B68"/>
    <path d="M 151 585 L 165 612 L 179 585 Z" fill="#102A2B"/>
    <rect x="151" y="497" width="28" height="12" rx="3" fill="#D97A2B"/>
  </g>
  <path d="M 110 614 L 220 614" stroke="#0D6B68" stroke-width="4" stroke-linecap="round"/>
  <text x="165" y="646" font-size="16" fill="#102A2B" text-anchor="middle">貼自己寫的句子</text>
  <text x="165" y="672" font-size="16" fill="#102A2B" text-anchor="middle">它先給正確句再解釋</text>
  <text x="165" y="700" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">提示詞 1</text>

  <!-- 2 文字對話 -->
  <rect x="302" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="338" cy="446" r="20" fill="#2F6F9F"/>
  <text x="338" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="366" y="453" font-size="19" font-weight="700" fill="#1F4E73">文字對話</text>
  <text x="326" y="482" font-size="15" fill="#5C6B6B">Conversation (text)</text>
  <rect x="360" y="508" width="90" height="50" rx="16" fill="#2F6F9F"/>
  <path d="M 375 556 L 368 576 L 394 556 Z" fill="#2F6F9F"/>
  <rect x="418" y="562" width="90" height="50" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <path d="M 492 610 L 500 628 L 474 610 Z" fill="#2F6F9F"/>
  <text x="419" y="646" font-size="16" fill="#102A2B" text-anchor="middle">一次一個問題</text>
  <text x="419" y="672" font-size="16" fill="#102A2B" text-anchor="middle">6 輪後列 3 個句型</text>
  <text x="419" y="700" font-size="16" font-weight="700" fill="#2F6F9F" text-anchor="middle">提示詞 2</text>

  <!-- 3 口說 -->
  <rect x="556" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="592" cy="446" r="20" fill="#D97A2B"/>
  <text x="592" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="620" y="453" font-size="19" font-weight="700" fill="#8A4A16">口說（語音）</text>
  <text x="580" y="482" font-size="15" fill="#5C6B6B">Speaking (voice)</text>
  <g fill="#D97A2B">
    <rect x="623" y="540" width="12" height="40" rx="6"/>
    <rect x="645" y="525" width="12" height="70" rx="6"/>
    <rect x="667" y="510" width="12" height="100" rx="6"/>
    <rect x="689" y="525" width="12" height="70" rx="6"/>
    <rect x="711" y="540" width="12" height="40" rx="6"/>
  </g>
  <text x="673" y="646" font-size="16" fill="#102A2B" text-anchor="middle">語音模式一問一答</text>
  <text x="673" y="672" font-size="16" fill="#102A2B" text-anchor="middle">它唸正確句你跟讀</text>
  <text x="673" y="700" font-size="16" font-weight="700" fill="#D97A2B" text-anchor="middle">提示詞 3</text>

  <!-- 4 單字卡 -->
  <rect x="810" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="846" cy="446" r="20" fill="#2E7D5B"/>
  <text x="846" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="874" y="453" font-size="19" font-weight="700" fill="#1F5A40">單字卡</text>
  <text x="834" y="482" font-size="15" fill="#5C6B6B">Flashcards</text>
  <g transform="rotate(-6 927 560)">
    <rect x="867" y="515" width="120" height="90" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
    <rect x="883" y="535" width="60" height="10" rx="5" fill="#D97A2B"/>
    <rect x="883" y="558" width="88" height="8" rx="4" fill="#2F6F9F"/>
    <rect x="883" y="578" width="70" height="8" rx="4" fill="#2F6F9F" opacity="0.7"/>
  </g>
  <text x="927" y="646" font-size="16" fill="#102A2B" text-anchor="middle">錯句整理成三欄表格</text>
  <text x="927" y="672" font-size="16" fill="#102A2B" text-anchor="middle">存到自己的筆記</text>
  <text x="927" y="700" font-size="16" font-weight="700" fill="#2E7D5B" text-anchor="middle">提示詞 4</text>

  <!-- 5 閱讀理解 -->
  <rect x="1064" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="1100" cy="446" r="20" fill="#0D6B68"/>
  <text x="1100" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1128" y="453" font-size="19" font-weight="700" fill="#0B4F4D">閱讀理解</text>
  <text x="1088" y="482" font-size="15" fill="#5C6B6B">Reading</text>
  <path d="M 1181 525 C 1160 512 1130 512 1116 520 L 1116 605 C 1130 597 1160 597 1181 610 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 1181 525 C 1202 512 1232 512 1246 520 L 1246 605 C 1232 597 1202 597 1181 610 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 1181 525 L 1181 610" stroke="#0D6B68" stroke-width="4"/>
  <path d="M 1132 548 L 1166 542 M 1132 568 L 1166 562 M 1196 542 L 1230 548 M 1196 562 L 1230 568" stroke="#0D6B68" stroke-width="3" stroke-linecap="round"/>
  <text x="1181" y="646" font-size="16" fill="#102A2B" text-anchor="middle">自己找文章貼上去</text>
  <text x="1181" y="672" font-size="16" fill="#102A2B" text-anchor="middle">它出 3 題再解釋</text>
  <text x="1181" y="700" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">提示詞 5</text>

  <!-- 6 聽力 -->
  <rect x="1318" y="410" width="234" height="300" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="1354" cy="446" r="20" fill="#2F6F9F"/>
  <text x="1354" y="453" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="1382" y="453" font-size="19" font-weight="700" fill="#1F4E73">聽力（聽寫）</text>
  <text x="1342" y="482" font-size="15" fill="#5C6B6B">Listening (dictation)</text>
  <path d="M 1385 588 L 1385 560 A 50 50 0 0 1 1485 560 L 1485 588" stroke="#2F6F9F" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="1373" y="576" width="24" height="40" rx="8" fill="#2F6F9F"/>
  <rect x="1473" y="576" width="24" height="40" rx="8" fill="#2F6F9F"/>
  <text x="1435" y="646" font-size="16" fill="#102A2B" text-anchor="middle">語音模式它唸你寫</text>
  <text x="1435" y="672" font-size="16" fill="#102A2B" text-anchor="middle">寫完再對逐字稿</text>
  <text x="1435" y="700" font-size="16" font-weight="700" fill="#2F6F9F" text-anchor="middle">提示詞 6</text>

  <text x="48" y="762" font-size="16" fill="#102A2B">把你自己寫的句子貼上去改，比讀它生成的範文有效；分鐘數是建議，程度高可以把對話拉長、寫作縮短。</text>
  <text x="48" y="794" font-size="15" fill="#5C6B6B">提示詞全文、學習模式（Study and learn）的開法與它做不到的事見正文；功能與方案依 OpenAI 說明中心查證，以官網為準。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
