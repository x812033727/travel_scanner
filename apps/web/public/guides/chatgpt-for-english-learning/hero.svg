<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用 ChatGPT 學英文插圖 / Learning English with ChatGPT illustration</title>
  <desc id="desc">米色底上，中央偏左是一個深綠色的大對話泡泡，左下有尖角；泡泡裡有白色的 ABC 三個大字母。泡泡右下角疊著一張微微傾斜的白色單字卡，卡片上方有一條橘色粗線代表單字、下方兩條藍色細線代表例句與中文意思，右下角一個綠色的勾。背景右上與左下各有一個淡藍與淡綠的大圓做襯底。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <circle cx="1250" cy="230" r="240" fill="#E6F0F7"/>
  <circle cx="380" cy="640" r="260" fill="#E3F0EF"/>
  <path d="M 380 640 L 330 770 L 530 640 Z" fill="#0D6B68"/>
  <rect x="260" y="150" width="860" height="500" rx="70" fill="#0D6B68"/>
  <text x="560" y="475" font-size="220" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">ABC</text>
  <g transform="rotate(-8 1080 560)">
    <rect x="880" y="400" width="400" height="300" rx="20" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <rect x="920" y="450" width="220" height="30" rx="15" fill="#D97A2B"/>
    <rect x="920" y="520" width="320" height="18" rx="9" fill="#2F6F9F"/>
    <rect x="920" y="566" width="260" height="18" rx="9" fill="#2F6F9F" opacity="0.7"/>
    <path d="M 1150 630 L 1180 660 L 1240 600" stroke="#2E7D5B" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
