<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">不足に応じて再検索を判断</title><desc id="desc">検索で根拠を取得して十分かを確認し、十分なら回答、不足ならクエリを書き換えて検索に戻り、補えない場合は停止する</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">不足に応じて再検索を判断</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Agentic RAG</text><path d="M 390 385 L 550 385" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 350 L 1100 285" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 435 L 1060 635" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1060 670 L 240 670" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 240 670 L 240 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="100" y="310" width="290" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="245" y="379" font-size="28" fill="#102A2B" text-anchor="middle">検索</text><text x="245" y="422" font-size="22" fill="#5C6B6B" text-anchor="middle">許可された情報</text><rect x="560" y="310" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="379" font-size="28" fill="#102A2B" text-anchor="middle">根拠は十分か</text><text x="710" y="422" font-size="22" fill="#5C6B6B" text-anchor="middle">要件を項目別に確認</text><rect x="1110" y="210" width="350" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1285" y="279" font-size="28" fill="#102A2B" text-anchor="middle">根拠のある回答</text><text x="1285" y="322" font-size="22" fill="#5C6B6B" text-anchor="middle">出典と制約を添える</text><rect x="1070" y="590" width="350" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1245" y="659" font-size="28" fill="#102A2B" text-anchor="middle">書き換えか停止</text><text x="1245" y="702" font-size="22" fill="#5C6B6B" text-anchor="middle">不足箇所は残す</text><text x="640" y="640" text-anchor="middle" font-size="24" fill="#5C6B6B">書換後のみ再検索。停止時は不足を残す</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
