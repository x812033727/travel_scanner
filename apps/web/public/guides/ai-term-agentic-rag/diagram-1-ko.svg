<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">근거의 빈틈에 따라 재검색 결정</title><desc id="desc">검색으로 근거를 확보한 뒤 충분한지 확인하고, 충분하면 답변하며, 부족하면 검색어를 재작성해 다시 검색하고, 보완할 수 없으면 중단하는 흐름</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">근거의 빈틈에 따라 재검색 결정</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Agentic RAG</text><path d="M 390 385 L 550 385" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 350 L 1100 285" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 435 L 1060 635" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1060 670 L 240 670" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 240 670 L 240 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="100" y="310" width="290" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="245" y="379" font-size="28" fill="#102A2B" text-anchor="middle">검색</text><text x="245" y="422" font-size="22" fill="#5C6B6B" text-anchor="middle">허용된 자료</text><rect x="560" y="310" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="379" font-size="28" fill="#102A2B" text-anchor="middle">근거가 충분한가</text><text x="710" y="422" font-size="22" fill="#5C6B6B" text-anchor="middle">요구 조건별 확인</text><rect x="1110" y="210" width="350" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1285" y="279" font-size="28" fill="#102A2B" text-anchor="middle">근거 있는 답변</text><text x="1285" y="322" font-size="22" fill="#5C6B6B" text-anchor="middle">출처와 한계 명시</text><rect x="1070" y="590" width="350" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1245" y="659" font-size="28" fill="#102A2B" text-anchor="middle">재작성 또는 중단</text><text x="1245" y="702" font-size="22" fill="#5C6B6B" text-anchor="middle">빈틈은 남겨 두기</text><text x="640" y="640" text-anchor="middle" font-size="24" fill="#5C6B6B">재작성 후에만 재검색; 중단 시 빈틈 유지</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
