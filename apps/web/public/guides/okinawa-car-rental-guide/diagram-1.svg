<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">沖繩租車五步流程：預約、機場接駁、櫃檯、驗車、還車 / Renting a car in Okinawa in five steps</title>
  <desc id="desc">五個步驟。預約：機票確定就先訂車，旺季 7 到 9 月與連假先滿；加免責補償與 NOC 補償；加租 ETC 卡；未滿 6 歲要兒童座椅（道路交通法、警察廳）；填航班號碼；小型車或輕自動車就夠。機場接駁：那霸機場國內線 1 樓到達大廳，租車服務台營業 9:00 到 19:00；跟著送迎巴士指標到乘車處，看清公司名再上車；營業所都在機場外，抵達到上路抓兩小時。櫃檯：台灣駕照正本、日文譯本正本（交流協會認可）、護照（最後入境日期）、預約確認與信用卡，聽保險說明後簽約；國際駕照在日本不能用。驗車：繞車一圈把刮痕全部拍照並請店員在紀錄單上標記，確認油表滿、ETC 卡已插入、兒童座椅裝好、導航切成中文或英文，問還車點附近的加油站。還車：加滿油留收據，結算 ETC 通行料，搭送迎巴士回機場，國際線起飛前三小時到營業所；事故一定先報警否則保險不賠。底部註記免責補償與 NOC 的意思、沖繩自動車道那霸到許田普通車通常 1,610 日圓與 ETC 1,040 日圓、譯本的三種申請管道。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">沖縄レンタカー 5 ステップ：予約から返却まで</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Renting a car in Okinawa in five steps · 台灣駕照＋日文譯本＋護照 · 2026 年 9 月依交流協会・JAF・NEXCO 西日本・警察庁查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1: booking -->
  <rect x="60" y="150" width="280" height="560" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="150" width="280" height="88" rx="24" fill="#2F6F9F"/>
  <text x="200" y="188" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　予約</text>
  <text x="200" y="218" font-size="16" fill="#E6F0F7" text-anchor="middle">Booking</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="282">● 機票確定就先訂車</text>
    <text x="102" y="308">旺季 7–9 月與連假先滿</text>
    <text x="84" y="352">● 加免責補償＋NOC 補償</text>
    <text x="84" y="396">● 加租 ETC カード</text>
    <text x="84" y="440">● 未滿 6 歲要兒童座椅</text>
    <text x="102" y="466">（道路交通法・警察庁）</text>
    <text x="84" y="510">● 填航班號碼備延誤</text>
    <text x="84" y="554">● 小型車・軽自動車就夠</text>
  </g>
  <rect x="80" y="600" width="240" height="80" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="200" y="632" font-size="16" font-weight="700" fill="#2F6F9F" text-anchor="middle">比價網站的價格</text>
  <text x="200" y="658" font-size="15" fill="#2F6F9F" text-anchor="middle">先看有沒有含免責補償</text>

  <!-- step 2: airport shuttle -->
  <rect x="360" y="150" width="280" height="560" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="360" y="150" width="280" height="88" rx="24" fill="#0D6B68"/>
  <text x="500" y="188" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　空港送迎</text>
  <text x="500" y="218" font-size="16" fill="#E6F2F1" text-anchor="middle">Airport shuttle</text>
  <g font-size="17" fill="#102A2B">
    <text x="384" y="282">● 那覇空港 国内線 1F</text>
    <text x="402" y="308">到着ロビー Arrival lobby</text>
    <text x="384" y="352">● レンタカー案内所</text>
    <text x="402" y="378">營業 9:00–19:00</text>
    <text x="384" y="422">● 跟「送迎バス」指標走</text>
    <text x="402" y="448">到接駁車乘車處</text>
    <text x="384" y="492">● 看清車身公司名再上車</text>
    <text x="384" y="536">● 營業所都在機場外</text>
    <text x="384" y="580">● 抵達到上路抓 2 小時</text>
  </g>

  <!-- step 3: counter -->
  <rect x="660" y="150" width="280" height="560" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="660" y="150" width="280" height="88" rx="24" fill="#2E7D5B"/>
  <text x="800" y="188" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　カウンター</text>
  <text x="800" y="218" font-size="16" fill="#E7F2EC" text-anchor="middle">Counter</text>
  <g font-size="17" fill="#102A2B">
    <text x="684" y="282">● 台灣駕照正本</text>
    <text x="684" y="326">● 日文譯本（正本）</text>
    <text x="702" y="352">交流協会認可の翻訳文</text>
    <text x="684" y="396">● 護照（最後入境日期）</text>
    <text x="684" y="440">● 預約確認＋信用卡</text>
    <text x="684" y="484">● 聽保險說明、簽約</text>
    <text x="684" y="528">● 國際駕照：日本不能用</text>
  </g>
  <rect x="680" y="600" width="240" height="80" rx="14" fill="#E7F2EC" stroke="#2E7D5B" stroke-width="3"/>
  <text x="800" y="632" font-size="16" font-weight="700" fill="#2E7D5B" text-anchor="middle">入境後一年以內可開車</text>
  <text x="800" y="658" font-size="15" fill="#2E7D5B" text-anchor="middle">日本台灣交流協會規定</text>

  <!-- step 4: pick-up check -->
  <rect x="960" y="150" width="280" height="560" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="960" y="150" width="280" height="88" rx="24" fill="#D97A2B"/>
  <text x="1100" y="188" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　出発前チェック</text>
  <text x="1100" y="218" font-size="16" fill="#FBEFE4" text-anchor="middle">Pick-up inspection</text>
  <g font-size="17" fill="#102A2B">
    <text x="984" y="282">● 繞車一圈，刮痕全部拍照</text>
    <text x="984" y="326">● 請店員在紀錄單上標記</text>
    <text x="984" y="370">● 油表滿、ETC カード已插入</text>
    <text x="984" y="414">● 兒童座椅裝好</text>
    <text x="984" y="458">● 導航切中文／英文</text>
    <text x="984" y="502">● 問還車點附近的加油站</text>
    <text x="984" y="546">● 方向燈在右邊，先試幾次</text>
  </g>

  <!-- step 5: return -->
  <rect x="1260" y="150" width="280" height="560" rx="24" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <rect x="1260" y="150" width="280" height="88" rx="24" fill="#B8442D"/>
  <text x="1400" y="188" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　返却</text>
  <text x="1400" y="218" font-size="16" fill="#FBE9E4" text-anchor="middle">Return</text>
  <g font-size="17" fill="#102A2B">
    <text x="1284" y="282">● 還車前加滿油、留收據</text>
    <text x="1284" y="326">● 結算 ETC 通行料</text>
    <text x="1284" y="370">● 送迎バス回機場</text>
    <text x="1284" y="414">● 國際線：起飛前 3 小時</text>
    <text x="1302" y="440">到營業所</text>
    <text x="1284" y="484">● 事故一定先報警</text>
    <text x="1302" y="510">否則保險不賠</text>
  </g>
  <rect x="1280" y="600" width="240" height="80" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="1400" y="632" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">颱風班機取消</text>
  <text x="1400" y="658" font-size="15" fill="#8A2E1D" text-anchor="middle">取消條款各家不同，先看清楚</text>

  <!-- arrows -->
  <path d="M 342 430 L 356 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 642 430 L 656 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 942 430 L 956 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1242 430 L 1256 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <g font-size="18" fill="#5C6B6B">
    <text x="60" y="760">免責補償 CDW：事故時的自負額由租車公司吸收 · NOC：車輛送修期間的營業補償，能否自行開回營業所金額不同</text>
    <text x="60" y="792">沖縄自動車道 那覇 ⇄ 許田 普通車 通常 1,610 日圓 · ETC 特別料金 1,040 日圓（NEXCO 西日本 2024 年 4 月 1 日料金表）</text>
    <text x="60" y="824">譯本申請：台灣監理站 · 台北駐日代表處 400 日圓（約 10 個工作天）· JAF 線上 6,000 日圓（平均 2–3 個工作天）</text>
  </g>
  <text x="1380" y="872" font-size="16" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
