<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">保單健檢表的欄位與主約附約層級 / Policy check-up: table columns and rider hierarchy</title>
<desc id="desc">左半邊是保單健檢表的九個欄位，依序為險種，要保人被保險人受益人，保險金額，保險期間，繳費年期，繳費方式與下次繳費日，等待期間，主約或附約，除外責任重點；下方註明一張契約一列、附約各自佔一列，欄位依保險法第五十五條與第一百零八條的契約應記載事項。右半邊是層級圖：上方一個主約方塊，標示它有自己的保險期間與繳費年期，往下分出兩個附約方塊，左邊是一年期附約，多半逐年續保並設有最高可續保年齡，右邊是長年期附約，繳費年期與主約不一定相同。下方兩個提醒：主約終止時附約怎麼處理由各自條款約定，至少持續到該期已繳保險費期滿後終止；壽險公會投保紀錄查詢的結果表會直接標出每一張保單是主約還是附約。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 11 6 L 0 11 z" fill="#0D6B68"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">保單健檢：一張表的欄位與主附約層級</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Policy check-up: the columns to record, and how riders hang under a main policy</text>
<rect x="60" y="118" width="700" height="700" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="164" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">第一步：每一張保單填滿這幾欄</text>
<rect x="90" y="190" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="190" y="232" font-size="17" fill="#5C6B6B" text-anchor="middle">一</text>
<text x="190" y="282" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">險種</text>
<rect x="310" y="190" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="232" font-size="17" fill="#5C6B6B" text-anchor="middle">二</text>
<text x="410" y="270" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">要保人／被保險人</text>
<text x="410" y="298" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">／受益人</text>
<rect x="530" y="190" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="630" y="232" font-size="17" fill="#5C6B6B" text-anchor="middle">三</text>
<text x="630" y="282" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">保險金額</text>
<rect x="90" y="360" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="190" y="402" font-size="17" fill="#5C6B6B" text-anchor="middle">四</text>
<text x="190" y="452" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">保險期間</text>
<rect x="310" y="360" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="402" font-size="17" fill="#5C6B6B" text-anchor="middle">五</text>
<text x="410" y="452" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">繳費年期</text>
<rect x="530" y="360" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="630" y="402" font-size="17" fill="#5C6B6B" text-anchor="middle">六</text>
<text x="630" y="440" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">繳費方式與</text>
<text x="630" y="468" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">下次繳費日</text>
<rect x="90" y="530" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="190" y="572" font-size="17" fill="#5C6B6B" text-anchor="middle">七</text>
<text x="190" y="622" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">等待期間</text>
<rect x="310" y="530" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="572" font-size="17" fill="#5C6B6B" text-anchor="middle">八</text>
<text x="410" y="622" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">主約或附約</text>
<rect x="530" y="530" width="200" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="630" y="572" font-size="17" fill="#5C6B6B" text-anchor="middle">九</text>
<text x="630" y="622" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">除外責任重點</text>
<rect x="90" y="700" width="640" height="96" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="410" y="738" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">一張契約一列，附約也各自佔一列</text>
<text x="410" y="770" font-size="16" fill="#5C6B6B" text-anchor="middle">欄位取自保險法第五十五條、第一百零八條的契約應記載事項</text>
<rect x="800" y="118" width="740" height="700" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1170" y="164" font-size="20" font-weight="700" fill="#2F6F9F" text-anchor="middle">第二步：把主約與附約的層級標出來</text>
<rect x="1000" y="200" width="340" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1170" y="244" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">主約（主契約）</text>
<text x="1170" y="276" font-size="16" fill="#5C6B6B" text-anchor="middle">有自己的保險期間與繳費年期</text>
<path d="M 1170 304 L 1170 346" stroke="#0D6B68" stroke-width="4" fill="none" stroke-linecap="butt"/>
<path d="M 985 346 L 1355 346" stroke="#0D6B68" stroke-width="4" fill="none" stroke-linecap="butt"/>
<path d="M 985 346 L 985 386" stroke="#0D6B68" stroke-width="4" fill="none" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M 1355 346 L 1355 386" stroke="#0D6B68" stroke-width="4" fill="none" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="830" y="398" width="310" height="126" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="985" y="436" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">附約（一年期）</text>
<text x="985" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">多半需要逐年續保</text>
<text x="985" y="498" font-size="16" fill="#5C6B6B" text-anchor="middle">設有最高可續保年齡</text>
<rect x="1200" y="398" width="310" height="126" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1355" y="436" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">附約（長年期）</text>
<text x="1355" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">繳費年期與主約</text>
<text x="1355" y="498" font-size="16" fill="#5C6B6B" text-anchor="middle">不一定相同</text>
<rect x="830" y="558" width="680" height="134" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1170" y="598" font-size="19" font-weight="700" fill="#B8442D" text-anchor="middle">主約終止時，附約怎麼處理由條款約定</text>
<text x="1170" y="630" font-size="16" fill="#5C6B6B" text-anchor="middle">至少持續到該期已繳保險費期滿後終止，不是一律跟著失效</text>
<text x="1170" y="662" font-size="16" fill="#5C6B6B" text-anchor="middle">所以要翻的是附約自己寫「效力」與「契約終止」的那幾條</text>
<rect x="830" y="712" width="680" height="84" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1170" y="748" font-size="16" fill="#102A2B" text-anchor="middle">壽險公會投保紀錄查詢的結果表，會直接標出</text>
<text x="1170" y="776" font-size="16" fill="#102A2B" text-anchor="middle">每一張保單是主約還是附約</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
