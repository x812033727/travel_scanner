<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">Qualcommのフラッグシップ向けSoC、2段階</title><desc id="desc">Qualcommの2026年9月22日付プレスリリースとパートナー発言に基づく整理：2機種の位置づけ、初採用ブランド一覧、プレスリリースに書かれていない点。確認日は2026年9月26日。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">Qualcommのフラッグシップ向けSoC、2段階</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Extreme版</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Qualcommが最強と称する</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">8 Elite Gen 6</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">同じ2nm、機能の多くが共通</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">初採用ブランド</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">例示であり全リストではない</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">未記載事項</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">受託製造・詳細仕様・発売日・台湾</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 作図 2026</text></svg>