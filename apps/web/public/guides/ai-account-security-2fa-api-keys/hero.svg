<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">帳號與金鑰的兩條防線 / Two lines of defence: account and API key</title>
  <desc id="desc">一張抽象插圖。左邊是一個淺青綠色的圓盤，中央有一個深色的鑰匙孔形狀，圓盤外面圍著兩圈虛線環，內圈是墨綠色、外圈是藍色，像兩道防線。右邊是一條白底藍框的長圓角條，裡面排著四顆藍色圓點，代表一串金鑰；長條右側有兩道紅色斜線把它切斷，斷線之後是一段紅色虛線框的殘段，裡面兩顆紅點，代表被撤銷的金鑰。四周散著橘色與綠色的大小圓點。畫面上方寫著「帳號與金鑰，兩條防線」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="152" font-size="58" font-weight="bold" fill="#102A2B" text-anchor="middle">帳號與金鑰，兩條防線</text>

  <!-- account side: two dashed rings around a keyhole disc -->
  <circle cx="470" cy="548" r="248" fill="none" stroke="#2F6F9F" stroke-width="14" stroke-dasharray="72 30" stroke-linecap="round"/>
  <circle cx="470" cy="548" r="184" fill="none" stroke="#0D6B68" stroke-width="16" stroke-dasharray="104 26" stroke-linecap="round"/>
  <circle cx="470" cy="548" r="118" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9"/>
  <circle cx="470" cy="518" r="33" fill="#102A2B"/>
  <path d="M 455 544 L 485 544 L 497 610 L 443 610 Z" fill="#102A2B"/>

  <!-- key side: a string of dots, cut in two -->
  <rect x="900" y="496" width="330" height="88" rx="44" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="10"/>
  <circle cx="960" cy="540" r="14" fill="#2F6F9F"/>
  <circle cx="1025" cy="540" r="14" fill="#2F6F9F"/>
  <circle cx="1090" cy="540" r="14" fill="#2F6F9F"/>
  <circle cx="1155" cy="540" r="14" fill="#2F6F9F"/>

  <line x1="1248" y1="464" x2="1274" y2="616" stroke="#B8442D" stroke-width="13" stroke-linecap="round"/>
  <line x1="1284" y1="464" x2="1310" y2="616" stroke="#B8442D" stroke-width="13" stroke-linecap="round"/>

  <rect x="1334" y="496" width="176" height="88" rx="44" fill="none" stroke="#B8442D" stroke-width="10" stroke-dasharray="26 18"/>
  <circle cx="1386" cy="540" r="14" fill="#B8442D"/>
  <circle cx="1451" cy="540" r="14" fill="#B8442D"/>

  <!-- scattered dots -->
  <circle cx="1466" cy="318" r="32" fill="#D97A2B"/>
  <circle cx="1392" cy="258" r="16" fill="#D97A2B"/>
  <circle cx="1536" cy="398" r="12" fill="#0D6B68"/>
  <circle cx="928" cy="296" r="24" fill="#2E7D5B"/>
  <circle cx="990" cy="352" r="12" fill="#2E7D5B"/>
  <circle cx="1060" cy="726" r="26" fill="#2F6F9F"/>
  <circle cx="1140" cy="778" r="14" fill="#2F6F9F"/>
  <circle cx="240" cy="266" r="18" fill="#0D6B68"/>
  <circle cx="790" cy="640" r="20" fill="#D97A2B"/>
</svg>
