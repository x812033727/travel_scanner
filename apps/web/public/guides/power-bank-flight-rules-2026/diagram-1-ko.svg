<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">보조배터리 기내 반입 결정도 / 항공편의 보조배터리: Wh·개수·기내 규정</title>
  <desc id="desc">먼저 보조배터리 라벨의 Wh를 확인한다. Wh 표시가 없으면 mAh에 전압을 곱한 뒤 1,000으로 나눈다. 예를 들어 27,000mAh에 3.7V를 곱하면 99.9Wh다. Wh에 따라 세 갈래로 나뉜다. 100Wh 이하는 기내 휴대 가능·위탁 불가, 100Wh 초과부터 160Wh까지는 기내 휴대 가능·위탁 불가·항공사에 사전 문의, 160Wh 초과는 항공기 반입 금지다. 앞의 두 갈래는 한 사람당 최대 2개로 합쳐진다. 탑승 후 규칙은 세 가지다. 보조배터리를 충전하지 않고, 휴대폰 충전에 사용하지 않으며, 상단 수하물 선반에 넣지 않는다. 하단 시간표는 ICAO 2026년 3월 27일 당일 발효, 대만 민용항공국 2026년 4월 8일, 한국 국토교통부 2026년 4월 20일, 일본 국토교통성 2026년 4월 24일이다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">보조배터리 기내 반입: 먼저 Wh, 다음은 개수 확인, 기내에서는 세 가지 행동 금지</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">항공편의 보조배터리: Wh 용량 확인, 최대 2개 휴대, 기내 세 가지 규정 준수 (2026)</text>


  <rect x="50" y="180" width="400" height="160" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="250" y="226" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">라벨 확인: Wh</text>
  <text x="250" y="266" font-size="19" fill="#102A2B" text-anchor="middle">Wh 미표시: mAh×V÷1,000</text>
  <text x="250" y="304" font-size="18" fill="#5C6B6B" text-anchor="middle">예: 27,000mAh×3.7V＝99.9Wh</text>


  <path d="M 450 260 L 534 180" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M 450 260 L 532 315" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M 450 260 L 534 448" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  <rect x="540" y="125" width="400" height="110" rx="14" fill="#E7F2EC" stroke="#2E7D5B" stroke-width="4" />
  <text x="740" y="170" font-size="24" font-weight="700" fill="#1E5A40" text-anchor="middle">100Wh 이하</text>
  <text x="740" y="208" font-size="19" fill="#1E5A40" text-anchor="middle">기내 휴대 가능·위탁 불가</text>

  <rect x="540" y="260" width="400" height="110" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" />
  <text x="740" y="305" font-size="24" font-weight="700" fill="#8A4A14" text-anchor="middle">100Wh 초과～160Wh 이하</text>
  <text x="740" y="343" font-size="19" fill="#8A4A14" text-anchor="middle">기내 휴대 가능·위탁 불가·항공사 사전 문의</text>

  <rect x="540" y="395" width="400" height="110" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
