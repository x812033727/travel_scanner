  <rect x="1010" y="185" width="200" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1110" y="232" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">한 사람당 최대</text>
  <text x="1110" y="284" font-size="36" font-weight="700" fill="#0B4F4D" text-anchor="middle">2개</text>
