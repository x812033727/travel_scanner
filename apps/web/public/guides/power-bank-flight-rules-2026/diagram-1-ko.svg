  <text x="1360" y="742" font-size="20" fill="#102A2B" text-anchor="middle">2026년 4월 24일</text>
  <text x="250" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">당일 발효</text>
  <text x="620" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">민용항공국</text>
  <text x="990" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">국토교통부</text>
  <text x="1360" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">국토교통성</text>
  <text x="80" y="812" font-size="16" fill="#5C6B6B">점 간격은 날짜 비율과 무관하다. 항공사는 더 엄격한 규정을 정할 수 있으므로 각 항공사 공지를 따른다.</text>

