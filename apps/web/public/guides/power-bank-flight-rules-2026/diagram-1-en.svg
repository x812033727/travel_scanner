  <path d="M 450 260 L 532 315" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <path d="M 450 260 L 534 448" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>

