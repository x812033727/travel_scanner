  <text x="990" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">MOLIT</text>
  <text x="1360" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">MLIT</text>
  <text x="80" y="812" font-size="16" fill="#5C6B6B">Dot spacing is not proportional to dates; airlines may set stricter rules. Follow each airline's announcements.</text>

