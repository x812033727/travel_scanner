  <rect x="1292" y="200" width="246" height="76" rx="12" fill="#E3F0EF"></rect>
  <text x="1415" y="246" font-size="18" fill="#102A2B" text-anchor="middle" style="font-size: 18px;">Do not charge power banks</text>
  <rect x="1292" y="298" width="246" height="76" rx="12" fill="#E3F0EF"></rect>
  <text x="1415" y="344" font-size="18" fill="#102A2B" text-anchor="middle" style="font-size: 18px;">Don't charge phones with it</text>
  <rect x="1292" y="396" width="246" height="76" rx="12" fill="#E3F0EF"></rect>
  <text x="1415" y="442" font-size="20" fill="#102A2B" text-anchor="middle">No overhead-bin storage</text>


