  <text x="1110" y="284" font-size="36" font-weight="700" fill="#0B4F4D" text-anchor="middle">2 units</text>
  <path d="M 1210 250 L 1264 250" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>


  <rect x="1270" y="125" width="290" height="380" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect>
