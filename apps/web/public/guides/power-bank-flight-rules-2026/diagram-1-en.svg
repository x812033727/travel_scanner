<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Power Bank Flight Decision Chart / Power banks on flights: Wh, count and in-flight rules</title>
  <desc id="desc">Start by checking the Wh rating on the power bank's label. If Wh is not listed, multiply mAh by the voltage and divide by 1,000; for example, 27,000mAh multiplied by 3.7V equals 99.9Wh. There are three paths based on Wh: up to 100Wh is allowed in carry-on baggage but prohibited in checked baggage; over 100Wh and up to 160Wh is allowed in carry-on baggage but prohibited in checked baggage, and you should ask the airline first; over 160Wh is prohibited on aircraft. The first two paths lead to a maximum of 2 per person. Three rules apply on board: do not charge the power bank, do not use it to charge your phone, and do not store it in an overhead bin. The timeline at the bottom shows ICAO taking effect immediately on 2026/3/27, Taiwan CAA on 2026/4/8, Korea's Ministry of Land, Infrastructure and Transport on 2026/4/20, and Japan's Ministry of Land, Infrastructure, Transport and Tourism on 2026/4/24.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Power banks on flights: check Wh, count units, then follow three in-flight bans</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Power banks on flights: check the Wh rating, carry at most 2, and follow three in-flight rules (2026)</text>


  <rect x="50" y="180" width="400" height="160" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></rect>
  <text x="250" y="226" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">Check label: Wh</text>
  <text x="250" y="266" font-size="19" fill="#102A2B" text-anchor="middle">No Wh label: mAh×V÷1,000</text>
  <text x="250" y="304" font-size="18" fill="#5C6B6B" text-anchor="middle">Example: 27,000mAh×3.7V＝99.9Wh</text>


