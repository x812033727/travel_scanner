  <text x="740" y="170" font-size="24" font-weight="700" fill="#1E5A40" text-anchor="middle">Up to 100Wh</text>
  <text x="740" y="208" font-size="19" fill="#1E5A40" text-anchor="middle">Carry-on only · No checked bags</text>

  <rect x="540" y="260" width="400" height="110" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"></rect>
  <text x="740" y="305" font-size="24" font-weight="700" fill="#8A4A14" text-anchor="middle">Over 100Wh to 160Wh</text>
  <text x="740" y="343" font-size="16" fill="#8A4A14" text-anchor="middle" style="font-size: 16px;">Carry-on only · No checked bags · Ask airline first</text>

  <rect x="540" y="395" width="400" height="110" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="740" y="440" font-size="24" font-weight="700" fill="#8A2E1D" text-anchor="middle">Over 160Wh</text>
  <text x="740" y="478" font-size="19" fill="#8A2E1D" text-anchor="middle">Prohibited on aircraft</text>


  <path d="M 940 180 L 1004 232" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <path d="M 940 315 L 1004 268" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"></path>
  <rect x="1010" y="185" width="200" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
