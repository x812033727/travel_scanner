  <text x="250" y="742" font-size="20" fill="#102A2B" text-anchor="middle">2026/3/27</text>
  <text x="620" y="742" font-size="20" fill="#102A2B" text-anchor="middle">2026/4/8</text>
  <text x="990" y="742" font-size="20" fill="#102A2B" text-anchor="middle">2026/4/20</text>
  <text x="1360" y="742" font-size="20" fill="#102A2B" text-anchor="middle">2026/4/24</text>
  <text x="250" y="774" font-size="17" fill="#5C6B6B" text-anchor="middle">Effective that day</text>
