<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從單價到帳單中間的三道關卡 / Three gates between list price and the bill</title>
  <desc id="desc">由左到右的流程。最左邊是單價乘以 token 數，那只是起點。往右依序經過三個橘色的關卡：快取會把重複的前綴降到很低的命中價；長上下文門檻在跨過去之後可能讓整筆請求換一套價；tokenizer 決定同一份文件被切成幾個 token。三道都走過之後，最右邊才是實際的帳單。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">從單價到帳單，中間有三道關卡</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three gates between list price and the bill</text>

  <rect x="60" y="330" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="200" y="395" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">單價 × token 數</text>
  <text x="200" y="428" text-anchor="middle" font-size="16" fill="#5C6B6B">價目表上算得出來的</text>
  <text x="200" y="456" text-anchor="middle" font-size="16" fill="#5C6B6B">只是起點</text>

  <rect x="420" y="330" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="540" y="388" text-anchor="middle" font-size="21" font-weight="bold" fill="#102A2B">快取</text>
  <text x="540" y="420" text-anchor="middle" font-size="16" fill="#5C6B6B">重複的前綴改用</text>
  <text x="540" y="446" text-anchor="middle" font-size="16" fill="#5C6B6B">很低的命中價</text>

  <rect x="740" y="330" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="860" y="388" text-anchor="middle" font-size="21" font-weight="bold" fill="#102A2B">長上下文門檻</text>
  <text x="860" y="420" text-anchor="middle" font-size="16" fill="#5C6B6B">跨過去可能整筆</text>
  <text x="860" y="446" text-anchor="middle" font-size="16" fill="#5C6B6B">換一套價</text>

  <rect x="1060" y="330" width="240" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1180" y="388" text-anchor="middle" font-size="21" font-weight="bold" fill="#102A2B">tokenizer</text>
  <text x="1180" y="420" text-anchor="middle" font-size="16" fill="#5C6B6B">同一份文件被切成</text>
  <text x="1180" y="446" text-anchor="middle" font-size="16" fill="#5C6B6B">幾個 token</text>

  <rect x="1360" y="330" width="180" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1450" y="395" text-anchor="middle" font-size="22" font-weight="bold" fill="#0D6B68">帳單</text>
  <text x="1450" y="428" text-anchor="middle" font-size="16" fill="#5C6B6B">三道都走過</text>
  <text x="1450" y="456" text-anchor="middle" font-size="16" fill="#5C6B6B">之後的數字</text>

  <path d="M 340 405 L 412 405" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 405 L 732 405" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 980 405 L 1052 405" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1300 405 L 1352 405" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <text x="60" y="560" font-size="17" fill="#102A2B">三道關卡都寫在官網上，只是不在最顯眼的那張價目表裡。</text>
  <text x="60" y="592" font-size="17" fill="#102A2B">漏掉任何一道，估算與帳單的誤差就是倍數，不是百分比。</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
