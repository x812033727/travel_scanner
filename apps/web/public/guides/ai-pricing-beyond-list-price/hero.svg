<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">單價不等於帳單 / List price is not the bill</title>
  <desc id="desc">米色底上有一條由左到右的橫線。線的左端是一個小的圓角方塊，代表價目表上的單價；線上依序有三個橘色的圓環，代表快取、長上下文門檻與 tokenizer 三道會改變金額的關卡；線的右端是一個明顯更大的綠色方塊，代表實際的帳單。上方置中有一行字寫著單價不等於帳單。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="180" text-anchor="middle" font-size="52" font-weight="bold" fill="#102A2B">單價不等於帳單</text>

  <path d="M 250 520 L 1350 520" stroke="#5C6B6B" stroke-width="8" fill="none"/>

  <rect x="170" y="470" width="100" height="100" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="10"/>

  <circle cx="530" cy="520" r="46" fill="#F7F1E8" stroke="#D97A2B" stroke-width="12"/>
  <circle cx="800" cy="520" r="46" fill="#F7F1E8" stroke="#D97A2B" stroke-width="12"/>
  <circle cx="1070" cy="520" r="46" fill="#F7F1E8" stroke="#D97A2B" stroke-width="12"/>

  <rect x="1330" y="410" width="220" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="12"/>

  <path d="M 170 700 L 1550 700" stroke="#102A2B" stroke-width="8" fill="none"/>
</svg>
