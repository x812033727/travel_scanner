<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>デスクのケーブル整理は見た目だけではない：用途・規格・使う場所をはっきり示す：判断の流れ</title><desc>機器と用途を挙げる、能力を確認する、ラベル付けと配線、実際に使ってみる、の順に確認します。編集部による整理であり、地図や所要時間の実測ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">取り組む順序 · 実践の流れ</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくてもよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">機器と用途を挙げる</text><text x="103" y="497" fill="#f4f0e5" font-size="23">接続機器を確認</text><text x="103" y="573" fill="#f4dc9d" font-size="26">まず両端をたどる</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">能力を確認する</text><text x="473" y="497" fill="#f4f0e5" font-size="23">対応性能を確かめる</text><text x="473" y="573" fill="#f4dc9d" font-size="26">形だけで判断しない</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">ラベル付けと配線</text><text x="843" y="497" fill="#f4f0e5" font-size="23">分かりやすく整理</text><text x="843" y="573" fill="#f4dc9d" font-size="26">毎日取り出しやすく</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">実際に使ってみる</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">座って動作を確認</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">動かして張り具合を確認</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図</text></g></svg>
