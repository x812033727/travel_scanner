<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>桌面線材整理不只要好看：把用途、規格與取用位置標清楚：判斷流程</title><desc>依序檢查：列裝置用途、核對能力、標記與走線、實際使用。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">列裝置用途</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Map devices</text><text x="103" y="573" fill="#f4dc9d" font-size="26">先追到兩端</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">核對能力</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Check capability</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不只看插頭</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">標記與走線</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Label and route</text><text x="843" y="573" fill="#f4dc9d" font-size="26">方便日常取用</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">實際使用</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Try the setup</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">鬆緊移動再查</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>