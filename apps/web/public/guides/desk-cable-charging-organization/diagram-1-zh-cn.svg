<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>桌面线材整理不只要好看：把用途、规格与取用位置标清楚：判断流程</title><desc>依次检查：列设备用途、核对能力、标记与走线、实际使用。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用流程</text><text x="100" y="175" fill="#576968" font-size="25">依你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">列设备用途</text><text x="103" y="497" fill="#f4f0e5" font-size="23">列出常用设备</text><text x="103" y="573" fill="#f4dc9d" font-size="26">先追到两端</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">核对能力</text><text x="473" y="497" fill="#f4f0e5" font-size="23">核实真实能力</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不只看插头</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">标记与走线</text><text x="843" y="497" fill="#f4f0e5" font-size="23">标记并整理走线</text><text x="843" y="573" fill="#f4dc9d" font-size="26">方便日常取用</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">实际使用</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">坐下来实际测试</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">松紧移动再查</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意图</text></g></svg>
