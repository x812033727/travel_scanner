<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Arial',sans-serif">
<title id="title">From query to content task</title><desc id="desc">Four stages: parse a query, observe evidence, define a content task and refine it with data. Search intent is a revisable judgment.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">From query to content task</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Understand context, then refine with observations and your own data</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Parse the query</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Object and action</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Place and time</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Keep ambiguity</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Observe evidence</text>
<text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Date and settings</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Result formats</text>
<text x="477.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Facts vs. guesses</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Define the task</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Main question</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Completion criteria</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Format and scope</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Refine with data</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Query-page match</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Open questions</text>
<text x="1215.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Record why it changed</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">Labels help organize; what readers can do defines the task.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original illustration by Mokaair</text>
</svg>