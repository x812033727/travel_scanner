<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">도쿄 디즈니씨 하루 일정 흐름도 / 도쿄 디즈니씨에서 보내는 하루: 디즈니 프리미어 액세스 구매 시점과 일반 줄에 설 시점</title><desc id="desc">다섯 단계로 된 순서도. 여행 전: 공식 웹사이트에서 매일 14:00에 두 달 뒤 같은 날짜의 티켓을 판매하기 시작한다. 원데이 패스포트 성인 요금은 8,900엔부터이며 날짜에 따라 달라진다. 공식 App을 미리 다운로드하고 MyDisney 계정을 등록하며, 시설 정비 일정을 확인한다. 약 75%의 시설이 실내에 있어 비 오는 날의 대안이 될 수 있다. 출발: 도쿄역에서 JR 게이요선을 타고 약 20분이면 마이하마에 도착한다. 디즈니씨에 가려면 약 2분 걸어 리조트 게이트웨이 스테이션으로 이동한 뒤, 디즈니 리조트라인을 약 9분 타며 편도 요금은 300엔이다. 디즈니랜드에 가려면 마이하마에서 약 5분 걷는다. 9:00 개장: 입장 후 즉시 App에서 티켓을 인증하고 유료 디즈니 프리미어 액세스를 구매한다. 안나와 엘사의 프로즌 저니는 2,500엔, 소어링은 2,500엔, 라푼젤의 랜턴 페스티벌은 2,000엔, 피터 팬의 네버랜드 어드벤처는 2,000엔이다. 무료 스탠바이 패스와 체험 신청도 App에서 받는다. 낮: 프리미어 액세스에 지정된 시간에 맞춰 판타지 스프링스로 돌아간다. 팅커벨의 비지 버기는 줄을 서서 기다려야 한다. 다음 스탠바이 패스를 받으려면 120분을 기다리거나 지정된 시간대가 시작되어야 한다. 비가 오면 머메이드 라군의 실내 구역으로 간다. 저녁부터 21:00 폐장까지: 공식 웹사이트에 따르면 인기 시설은 저녁에 대기 시간이 더 짧다. 항구 공연의 프리미어 액세스는 2,500엔이다. 돌아갈 때 디즈니 리조트라인 막차는 23:30에 리조트 게이트웨이 스테이션에서 출발한다.</desc><rect width="1600" height="1280" fill="#F7F1E8"/><path d="M 340 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 347 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 644 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 651 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 948 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 955 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 1252 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1259 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="162.6" width="284" height="802.8" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/><rect x="354" y="162.6" width="284" height="802.8" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/><rect x="658" y="162.6" width="284" height="802.8" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/><rect x="962" y="162.6" width="284" height="802.8" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/><rect x="1266" y="162.6" width="284" height="802.8" rx="16" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/><rect x="670" y="445.4" width="260" height="253.5999999999999" rx="10" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="1266" y="162.6" width="284" height="146.39999999999995" rx="16" fill="#7E57C2" stroke="#7E57C2" stroke-width="3"/><rect x="50" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="3"/><rect x="354" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#6B4A3A" stroke="#6B4A3A" stroke-width="3"/><rect x="658" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#B8442D" stroke="#B8442D" stroke-width="3"/><rect x="962" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#D97A2B" stroke="#D97A2B" stroke-width="3"/><rect x="425" y="880.4" width="140" height="42" rx="18" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">도쿄 디즈니씨 하루 일정: 프리미어 액세스를 살 때와 줄에 설 때</tspan></text><text data-source-index="1" x="50" y="119.6" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="119.6">도쿄 디즈니씨 하루 일정 · 2026년 9월 운영 시간 9:00–21:00 기준 · 가격과 시간은 2026년 9월 공식 홈페이지 확인</tspan></text><text data-source-index="2" x="70" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="70" y="210.6">1　방문 전</tspan></text><text data-source-index="3" x="70" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="70" y="248.2">방문 전 준비</tspan></text><text data-source-index="4" x="70" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="315.4">● 공식 홈페이지 티켓: </tspan><tspan x="70" y="343.4">매일 14:00</tspan></text><text data-source-index="5" x="70" y="381.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="381.4">2개월 뒤 같은 날짜 판매</tspan></text><text data-source-index="6" x="70" y="427.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="427.4">● 하루짜리 패스포트 성인 </tspan><tspan x="70" y="455.4">8,900엔부터</tspan></text><text data-source-index="7" x="70" y="493.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="493.4">날짜별 변동 가격</tspan></text><text data-source-index="8" x="70" y="539.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="539.4">● 공식 App 다운로드(영어)</tspan></text><text data-source-index="9" x="70" y="577.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="577.4">MyDisney 계정 만들기</tspan></text><text data-source-index="10" x="70" y="623.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="623.4">● 시설 점검 일정 확인</tspan></text><text data-source-index="11" x="70" y="661.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="661.4">인디아나 존스 11/29까지 </tspan><tspan x="70" y="689.4">휴장</tspan></text><text data-source-index="12" x="70" y="735.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="735.4">● 비 오는 날: 시설 약 75%</tspan></text><text data-source-index="13" x="70" y="773.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="773.4">실내에 있음</tspan></text><text data-source-index="14" x="374" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="374" y="210.6">2　마이하마로 출발</tspan></text><text data-source-index="15" x="374" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="374" y="248.2">마이하마로 이동</tspan></text><text data-source-index="16" x="374" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="315.4">● 도쿄역 JR 게이요선</tspan></text><text data-source-index="17" x="374" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="353.4">약 20분 → 마이하마 </tspan><tspan x="374" y="381.4">Maihama</tspan></text><text data-source-index="18" x="374" y="427.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="427.4">● 디즈니씨: 마이하마에서 </tspan><tspan x="374" y="455.4">약 2분 도보</tspan></text><text data-source-index="19" x="374" y="493.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="493.4">→ 리조트 게이트웨이 </tspan><tspan x="374" y="521.4">스테이션</tspan></text><text data-source-index="20" x="374" y="567.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="567.4">● 디즈니 리조트라인 약 </tspan><tspan x="374" y="595.4">9분</tspan></text><text data-source-index="21" x="374" y="633.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="633.4">→ 도쿄 디즈니씨 스테이션</tspan></text><text data-source-index="22" x="374" y="679.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="679.4">● 편도 300엔</tspan></text><text data-source-index="23" x="374" y="717.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="717.4">6–11세 150엔</tspan></text><text data-source-index="24" x="374" y="763.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="763.4">● 디즈니랜드: </tspan><tspan x="374" y="791.4">마이하마에서 약 5분 도보</tspan></text><text data-source-index="25" x="374" y="829.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="829.4">모노레일 탈 필요 없음</tspan></text><text data-source-index="26" x="678" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="678" y="210.6">3　9:00 개장</tspan></text><text data-source-index="27" x="678" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="678" y="248.2">개장 직후 App부터</tspan></text><text data-source-index="28" x="678" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="315.4">● 입장 즉시 App 열기</tspan></text><text data-source-index="29" x="678" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="353.4">파크 티켓 인증</tspan></text><text data-source-index="30" x="678" y="399.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="399.4">● 프리미어 액세스 DPA </tspan><tspan x="678" y="427.4">구매(유료)</tspan></text><text data-source-index="31" x="682" y="475.4" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="475.4">안나와 엘사의 프로즌 저니 </tspan><tspan x="682" y="500.59999999999997">2,500</tspan></text><text data-source-index="32" x="682" y="535.8" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="535.8">소어링: 판타스틱 플라이트 </tspan><tspan x="682" y="561">2,500</tspan></text><text data-source-index="33" x="682" y="596.1999999999999" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="596.1999999999999">라푼젤의 랜턴 페스티벌 </tspan><tspan x="682" y="621.4">2,000</tspan></text><text data-source-index="34" x="682" y="656.5999999999999" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="656.5999999999999">피터 팬의 네버랜드 어드벤처 </tspan><tspan x="682" y="681.8">2,000</tspan></text><text data-source-index="35" x="678" y="718.9999999999999" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="718.9999999999999">● 무료 서비스도 App에서:</tspan></text><text data-source-index="36" x="678" y="764.9999999999999" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="764.9999999999999">스탠바이 패스(일부 매장)</tspan></text><text data-source-index="37" x="678" y="802.9999999999999" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="802.9999999999999">엔트리 리퀘스트(공연 추첨)</tspan></text><text data-source-index="38" x="678" y="848.9999999999999" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="848.9999999999999">● 다음은 곧바로</tspan></text><text data-source-index="39" x="678" y="886.9999999999999" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="886.9999999999999">패스 안 산 인기 시설로</tspan></text><text data-source-index="40" x="982" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="982" y="210.6">4　낮</tspan></text><text data-source-index="41" x="982" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="982" y="248.2">낮 시간</tspan></text><text data-source-index="42" x="982" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="315.4">● 프리미어 액세스 지정 </tspan><tspan x="982" y="343.4">시간에</tspan></text><text data-source-index="43" x="982" y="381.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="381.4">판타지 스프링스 Fantasy </tspan><tspan x="982" y="409.4">Springs로</tspan></text><text data-source-index="44" x="982" y="455.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="455.4">● 팅커벨의 비지 버기</tspan></text><text data-source-index="45" x="982" y="493.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="493.4">프리미어 액세스 없이 줄만 </tspan><tspan x="982" y="521.4">가능</tspan></text><text data-source-index="46" x="982" y="567.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="567.4">● 스탠바이 패스: 다음 장은</tspan></text><text data-source-index="47" x="982" y="605.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="605.4">120분 뒤 또는 지정 시간 </tspan><tspan x="982" y="633.4">시작 후</tspan></text><text data-source-index="48" x="982" y="679.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="679.4">● 모바일 </tspan><tspan x="982" y="707.4">오더·프라이어리티 시팅</tspan></text><text data-source-index="49" x="982" y="745.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="745.4">식당 대기 줄 줄이기</tspan></text><text data-source-index="50" x="982" y="791.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="791.4">● 비가 오면: 머메이드 라군</tspan></text><text data-source-index="51" x="982" y="829.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="829.4">Mermaid Lagoon 실내 </tspan><tspan x="982" y="857.4">시설</tspan></text><text data-source-index="52" x="1286" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="1286" y="210.6">5　저녁부터 </tspan><tspan x="1286" y="244.2">21:00까지</tspan></text><text data-source-index="53" x="1286" y="281.79999999999995" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="1286" y="281.79999999999995">저녁부터 폐장까지</tspan></text><text data-source-index="54" x="1286" y="348.99999999999994" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="348.99999999999994">● 공식 홈페이지: 인기 </tspan><tspan x="1286" y="376.99999999999994">시설은</tspan></text><text data-source-index="55" x="1286" y="414.99999999999994" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="414.99999999999994">저녁 대기 시간이 비교적 </tspan><tspan x="1286" y="442.99999999999994">짧음</tspan></text><text data-source-index="56" x="1286" y="488.99999999999994" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="488.99999999999994">● 항구 공연 ‘빌리브!</tspan></text><text data-source-index="57" x="1286" y="527" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="527">~시 오브 드림스~’ </tspan><tspan x="1286" y="555">프리미어 액세스 2,500</tspan></text><text data-source-index="58" x="1286" y="601" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="601">● 폐장 21:00</tspan></text><text data-source-index="59" x="1286" y="639" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="639">9월 25일은 18:30 조기 폐장</tspan></text><text data-source-index="60" x="1286" y="685" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="685">● 귀가: 리조트라인 막차</tspan></text><text data-source-index="61" x="1286" y="723" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="723">23:30 리조트 게이트웨이 </tspan><tspan x="1286" y="751">스테이션 출발</tspan></text><text data-source-index="62" x="1286" y="797" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="797">● 마이하마 → 도쿄역</tspan></text><text data-source-index="63" x="1286" y="835" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="835">JR 게이요선 약 20분</tspan></text><path d="M 397 946.4 H 594 M 466 922.4 V 946.4 M 526 922.4 V 946.4" fill="none" stroke="#6B4A3A" stroke-width="4" stroke-linecap="round"/><text data-source-index="64" x="50" y="1015.4" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1015.4">프리미어 액세스: 파크 티켓 한 장당 한 번에 1인분만 구매할 수 있다. 결제 후 취소·환불할 수 없으며 매진되면 판매가 끝난다. 스마트폰이나 신용카드가 없으면 시설 </tspan><tspan x="50" y="1043.4">현장에서 구매할 수 있다.</tspan></text><text data-source-index="65" x="50" y="1093.4" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1093.4">스탠바이 패스는 무료이고 취소할 수 있지만 입장을 보장하지 않는다. 엔트리 리퀘스트는 추첨이며 낙첨되면 그날 관람할 수 없다. 금액 단위는 엔이며 당일 공식 홈페이지와 </tspan><tspan x="50" y="1121.4">App 표시를 확인하자.</tspan></text><text data-source-index="66" x="50" y="1171.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="50" y="1171.4">디즈니랜드(Tokyo Disneyland)도 순서는 같다. 마이하마에서 5분 걸으면 바로 도착한다. 프리미어 액세스는 1,000~2,500엔, 핼러윈 공연은 3,500엔이다.</tspan></text><text data-source-index="67" x="50" y="1229.4" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1229.4">© Mokaair 제작 2026</tspan></text></svg>
