<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">东京迪士尼海洋一日流程图：何时购买尊享卡、何时排队</title><desc id="desc">五个步骤的流程图。行前：官网每天 14:00 开卖两个月后同一天的票，一日护照全票 8,900 日元起、依日期浮动，先下载官方 App 并注册 MyDisney 账号，查维修保养日程，约 75% 设施在室内可当雨天备选方案。出发：东京车站搭 JR 京叶线约 20 分钟到舞滨，去海洋要走约 2 分钟到度假区总站，搭迪士尼度假区线约 9 分钟，单程 300 日元；去乐园从舞滨走约 5 分钟。9:00 开园：入园后立刻在 App 验证票券、买付费的迪士尼尊享卡，安娜与艾莎的冰雪之旅 2,500 日元、翱翔 2,500、乐佩公主天灯盛会 2,000、小飞侠梦幻岛历险记 2,000，免费的预约等候卡与报名体验也在 App 领。白天：按尊享卡指定时段返回梦幻泉乡，奇妙仙子妙妙小车只能排队，领取下一张等候卡要等 120 分钟或等到时段开始后，下雨去美人鱼礁湖室内区。傍晚到 21:00 闭园：官网说人气设施傍晚等候较短，港湾表演尊享卡 2,500 日元，回程迪士尼度假区线末班 23:30 从度假区总站发车。</desc><rect width="1600" height="1200" fill="#F7F1E8"/><path d="M 340 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 347 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 644 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 651 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 948 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 955 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><path d="M 1252 227.6 h 12" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1259 222.6 l 5 5 -5 5" fill="none" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="162.6" width="284" height="774.8" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/><rect x="354" y="162.6" width="284" height="774.8" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/><rect x="658" y="162.6" width="284" height="774.8" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/><rect x="962" y="162.6" width="284" height="774.8" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/><rect x="1266" y="162.6" width="284" height="774.8" rx="16" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/><rect x="670" y="417.4" width="260" height="152.80000000000007" rx="10" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="50" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="3"/><rect x="354" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#6B4A3A" stroke="#6B4A3A" stroke-width="3"/><rect x="658" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#B8442D" stroke="#B8442D" stroke-width="3"/><rect x="962" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#D97A2B" stroke="#D97A2B" stroke-width="3"/><rect x="1266" y="162.6" width="284" height="112.79999999999998" rx="16" fill="#7E57C2" stroke="#7E57C2" stroke-width="3"/><rect x="425" y="852.4" width="140" height="42" rx="18" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">东京迪士尼海洋一日流程：何时买尊享卡、何时排队</tspan></text><text data-source-index="1" x="50" y="119.6" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="119.6">东京迪士尼海洋一日游 · 以 2026 年 9 月运营时间 9:00–21:00 为例 · 价格、时间经 2026 年 9 月官网核实</tspan></text><text data-source-index="2" x="70" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="70" y="210.6">1　出行前</tspan></text><text data-source-index="3" x="70" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="70" y="248.2">出行前准备</tspan></text><text data-source-index="4" x="70" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="315.4">● 官网购票：每天 14:00</tspan></text><text data-source-index="5" x="70" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="353.4">开售 2 个月后同一天的票</tspan></text><text data-source-index="6" x="70" y="399.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="399.4">● 一日护照 全票 8,900 </tspan><tspan x="70" y="427.4">日元起</tspan></text><text data-source-index="7" x="70" y="465.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="465.4">票价随日期浮动</tspan></text><text data-source-index="8" x="70" y="511.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="511.4">● 下载官方 App（英文）</tspan></text><text data-source-index="9" x="70" y="549.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="549.4">注册 MyDisney 账号</tspan></text><text data-source-index="10" x="70" y="595.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="595.4">● 查看设施维护日程</tspan></text><text data-source-index="11" x="70" y="633.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="633.4">印第安纳琼斯 停运至 11/29</tspan></text><text data-source-index="12" x="70" y="679.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="679.4">● 雨天备选：约 75% </tspan><tspan x="70" y="707.4">的设施</tspan></text><text data-source-index="13" x="70" y="745.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="745.4">位于室内</tspan></text><text data-source-index="14" x="374" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="374" y="210.6">2　前往舞滨</tspan></text><text data-source-index="15" x="374" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="374" y="248.2">前往舞滨</tspan></text><text data-source-index="16" x="374" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="315.4">● 东京站 JR 京叶线</tspan></text><text data-source-index="17" x="374" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="353.4">约 20 分钟 → 舞滨 </tspan><tspan x="374" y="381.4">Maihama</tspan></text><text data-source-index="18" x="374" y="427.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="427.4">● 海洋：从舞滨步行约 2 </tspan><tspan x="374" y="455.4">分钟</tspan></text><text data-source-index="19" x="374" y="493.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="493.4">→ 度假区总站</tspan></text><text data-source-index="20" x="374" y="539.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="539.4">● 迪士尼度假区线 约 9 </tspan><tspan x="374" y="567.4">分钟</tspan></text><text data-source-index="21" x="374" y="605.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="605.4">→ 东京迪士尼海洋站</tspan></text><text data-source-index="22" x="374" y="651.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="651.4">● 单程 300 日元</tspan></text><text data-source-index="23" x="374" y="689.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="689.4">6–11 岁 150 日元</tspan></text><text data-source-index="24" x="374" y="735.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="735.4">● 乐园：从舞滨步行约 5 </tspan><tspan x="374" y="763.4">分钟</tspan></text><text data-source-index="25" x="374" y="801.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="374" y="801.4">无须乘单轨列车</tspan></text><text data-source-index="26" x="678" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="678" y="210.6">3　9:00 开园</tspan></text><text data-source-index="27" x="678" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="678" y="248.2">开园后先用 App</tspan></text><text data-source-index="28" x="678" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="315.4">● 入园后立即打开 App</tspan></text><text data-source-index="29" x="678" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="353.4">验证园区门票</tspan></text><text data-source-index="30" x="678" y="399.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="399.4">● 买尊享卡 DPA（付费）</tspan></text><text data-source-index="31" x="682" y="447.4" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="447.4">安娜与艾莎的冰雪之旅 2,500</tspan></text><text data-source-index="32" x="682" y="482.59999999999997" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="482.59999999999997">翱翔：梦幻奇航 2,500</tspan></text><text data-source-index="33" x="682" y="517.8" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="517.8">乐佩公主天灯盛会 2,000</tspan></text><text data-source-index="34" x="682" y="553" font-size="18" font-weight="400" fill="#B8442D" xml:space="preserve"><tspan x="682" y="553">小飞侠梦幻岛历险记 2,000</tspan></text><text data-source-index="35" x="678" y="590.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="590.2">● 免费服务也在 App 领：</tspan></text><text data-source-index="36" x="678" y="636.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="636.2">预约等候卡（部分商店）</tspan></text><text data-source-index="37" x="678" y="674.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="674.2">报名体验（演出抽签）</tspan></text><text data-source-index="38" x="678" y="720.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="720.2">● 然后先去玩一项</tspan></text><text data-source-index="39" x="678" y="758.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="678" y="758.2">没买尊享卡的热门项目</tspan></text><text data-source-index="40" x="982" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="982" y="210.6">4　白天</tspan></text><text data-source-index="41" x="982" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="982" y="248.2">白天</tspan></text><text data-source-index="42" x="982" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="315.4">● 按尊享卡指定时段</tspan></text><text data-source-index="43" x="982" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="353.4">返回梦幻泉乡 Fantasy </tspan><tspan x="982" y="381.4">Springs</tspan></text><text data-source-index="44" x="982" y="427.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="427.4">● 奇妙仙子妙妙小车</tspan></text><text data-source-index="45" x="982" y="465.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="465.4">没有尊享卡，只能排队</tspan></text><text data-source-index="46" x="982" y="511.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="511.4">● 等候卡：下一张须等</tspan></text><text data-source-index="47" x="982" y="549.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="549.4">120 分钟或时段开始后</tspan></text><text data-source-index="48" x="982" y="595.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="595.4">● 移动点餐、优先入席</tspan></text><text data-source-index="49" x="982" y="633.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="633.4">省去餐厅排队时间</tspan></text><text data-source-index="50" x="982" y="679.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="679.4">● 下雨：美人鱼礁湖</tspan></text><text data-source-index="51" x="982" y="717.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="982" y="717.4">Mermaid Lagoon 位于室内</tspan></text><text data-source-index="52" x="1286" y="210.6" font-size="24" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="1286" y="210.6">5　傍晚至 21:00</tspan></text><text data-source-index="53" x="1286" y="248.2" font-size="18" font-weight="400" fill="#FFFFFF" xml:space="preserve"><tspan x="1286" y="248.2">傍晚至闭园</tspan></text><text data-source-index="54" x="1286" y="315.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="315.4">● 官网称：热门项目</tspan></text><text data-source-index="55" x="1286" y="353.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="353.4">傍晚时段等候较短</tspan></text><text data-source-index="56" x="1286" y="399.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="399.4">● 港湾演出“坚信！</tspan></text><text data-source-index="57" x="1286" y="437.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="437.4">～梦想之海～”尊享卡 </tspan><tspan x="1286" y="465.4">2,500</tspan></text><text data-source-index="58" x="1286" y="511.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="511.4">● 21:00 闭园</tspan></text><text data-source-index="59" x="1286" y="549.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="549.4">9 月 25 日提前至 18:30</tspan></text><text data-source-index="60" x="1286" y="595.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="595.4">● 返程：度假区线末班车</tspan></text><text data-source-index="61" x="1286" y="633.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="633.4">23:30 从度假区总站发车</tspan></text><text data-source-index="62" x="1286" y="679.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="679.4">● 舞滨 → 东京站</tspan></text><text data-source-index="63" x="1286" y="717.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1286" y="717.4">JR 京叶线 约 20 分钟</tspan></text><path d="M 397 918.4 H 594 M 466 894.4 V 918.4 M 526 894.4 V 918.4" fill="none" stroke="#6B4A3A" stroke-width="4" stroke-linecap="round"/><text data-source-index="64" x="50" y="987.4" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="987.4">尊享卡：每张园区门票一次只能买 1 人份、付款后不能取消或退款、售完为止；没有智能手机或信用卡的人可到设施现场购买。</tspan></text><text data-source-index="65" x="50" y="1037.4" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1037.4">预约等候卡免费、可以取消，但不保证入场；报名体验采用抽签，没抽中当天就看不到。金额为日元，以官网与 App 当日显示为准。</tspan></text><text data-source-index="66" x="50" y="1087.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="50" y="1087.4">乐园（Tokyo Disneyland）流程相同：从舞滨步行 5 分钟即到，尊享卡为 1,000 到 2,500 日元，万圣节演出为 3,500 日元。</tspan></text><text data-source-index="67" x="50" y="1145.4" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1145.4">© Mokaair 制图 2026</tspan></text></svg>
