<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">東京迪士尼海洋一日流程圖 / One day at Tokyo DisneySea: when to buy Premier Access and when to queue</title>
  <desc id="desc">五個步驟的流程圖。行前：官網每天 14:00 開賣兩個月後同一天的票，一日護照全票 8,900 日圓起、依日期浮動，先下載官方 App 並註冊 MyDisney 帳號，查維修保養日程，約 75% 設施在室內可當雨天備案。出發：東京車站搭 JR 京葉線約 20 分鐘到舞濱，去海洋要走約 2 分鐘到度假區總站，搭迪士尼度假區線約 9 分鐘，單程 300 日圓；去樂園從舞濱走約 5 分鐘。9:00 開園：入園後立刻在 App 驗證票券、買付費的迪士尼尊享卡，安娜與艾莎的冰雪之旅 2,500 日圓、翱翔 2,500、樂佩公主天燈盛會 2,000、小飛俠夢幻島歷險記 2,000，免費的預約等候卡與報名體驗也在 App 領。白天：照尊享卡指定時段回夢幻泉鄉，奇妙仙子妙妙小車只能排隊，等候卡領下一張要等 120 分鐘或時段開始後，下雨去美人魚礁湖室內區。傍晚到 21:00 閉園：官網說人氣設施傍晚等候較短，港灣表演尊享卡 2,500 日圓，回程迪士尼度假區線末班 23:30 由度假區總站發車。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="58" font-size="32" font-weight="700" fill="#102A2B">東京迪士尼海洋一日流程：什麼時候買尊享卡、什麼時候排隊</text>
  <text x="60" y="92" font-size="18" fill="#5C6B6B">One day at Tokyo DisneySea · 以 2026 年 9 月營運時間 9:00–21:00 為例 · 價格、時間為 2026 年 9 月官網查證</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- column 1: before -->
  <rect x="60" y="130" width="280" height="590" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="130" width="280" height="76" rx="22" fill="#2F6F9F"/>
  <text x="200" y="164" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="200" y="192" font-size="15" fill="#E6F0F7" text-anchor="middle">Before you go</text>
  <g font-size="16" fill="#102A2B">
    <text x="84" y="246">● 官網買票：每天 14:00</text>
    <text x="102" y="272">開賣 2 個月後同一天</text>
    <text x="84" y="316">● 一日護照 全票 8,900 日圓起</text>
    <text x="102" y="342">票價依日期浮動</text>
    <text x="84" y="386">● 下載官方 App（英文）</text>
    <text x="102" y="412">註冊 MyDisney 帳號</text>
    <text x="84" y="456">● 查維修保養日程</text>
    <text x="102" y="482">印第安納瓊斯 休到 11/29</text>
    <text x="84" y="526">● 雨天備案：約 75% 設施</text>
    <text x="102" y="552">在室內</text>
  </g>

  <!-- column 2: getting there -->
  <rect x="360" y="130" width="280" height="590" rx="22" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="360" y="130" width="280" height="76" rx="22" fill="#6B4A3A"/>
  <text x="500" y="164" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　出發到舞浜</text>
  <text x="500" y="192" font-size="15" fill="#F1E8E2" text-anchor="middle">Getting to Maihama</text>
  <g font-size="16" fill="#102A2B">
    <text x="384" y="246">● 東京駅 JR 京葉線</text>
    <text x="402" y="272">約 20 分 → 舞浜 Maihama</text>
    <text x="384" y="316">● 海洋：舞浜 徒步約 2 分</text>
    <text x="402" y="342">→ 度假區總站</text>
    <text x="384" y="386">● 迪士尼度假區線 約 9 分</text>
    <text x="402" y="412">→ 東京迪士尼海洋站</text>
    <text x="384" y="456">● 單程 300 日圓</text>
    <text x="402" y="482">6–11 歲 150 日圓</text>
    <text x="384" y="526">● 樂園：舞浜 徒步約 5 分</text>
    <text x="402" y="552">不用搭單軌電車</text>
  </g>
  <!-- monorail icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4" stroke-linecap="round">
    <rect x="430" y="610" width="140" height="44" rx="18"/>
    <line x1="400" y1="672" x2="600" y2="672"/>
    <line x1="470" y1="654" x2="470" y2="672"/>
    <line x1="530" y1="654" x2="530" y2="672"/>
  </g>

  <!-- column 3: park opens -->
  <rect x="660" y="130" width="280" height="590" rx="22" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <rect x="660" y="130" width="280" height="76" rx="22" fill="#B8442D"/>
  <text x="800" y="164" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　9:00 開園</text>
  <text x="800" y="192" font-size="15" fill="#FBE9E4" text-anchor="middle">Park opens: App first</text>
  <g font-size="16" fill="#102A2B">
    <text x="684" y="246">● 入園後立刻開 App</text>
    <text x="702" y="272">驗證園區票券</text>
    <text x="684" y="316">● 買尊享卡 DPA（付費）</text>
  </g>
  <rect x="684" y="332" width="232" height="120" rx="12" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <g font-size="15" fill="#8A2E1D">
    <text x="800" y="358" text-anchor="middle">安娜與艾莎的冰雪之旅 2,500</text>
    <text x="800" y="383" text-anchor="middle">翱翔：夢幻奇航 2,500</text>
    <text x="800" y="408" text-anchor="middle">樂佩公主天燈盛會 2,000</text>
    <text x="800" y="433" text-anchor="middle">小飛俠夢幻島歷險記 2,000</text>
  </g>
  <g font-size="16" fill="#102A2B">
    <text x="684" y="486">● 免費也在 App 領：</text>
    <text x="702" y="512">預約等候卡（部分商店）</text>
    <text x="702" y="538">報名體驗（表演抽籤）</text>
    <text x="684" y="582">● 然後先衝一項</text>
    <text x="702" y="608">沒買尊享卡的人氣設施</text>
  </g>

  <!-- column 4: daytime -->
  <rect x="960" y="130" width="280" height="590" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="960" y="130" width="280" height="76" rx="22" fill="#D97A2B"/>
  <text x="1100" y="164" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　白天</text>
  <text x="1100" y="192" font-size="15" fill="#FBEFE4" text-anchor="middle">Daytime</text>
  <g font-size="16" fill="#102A2B">
    <text x="984" y="246">● 照尊享卡指定時段</text>
    <text x="1002" y="272">回夢幻泉鄉 Fantasy Springs</text>
    <text x="984" y="316">● 奇妙仙子妙妙小車</text>
    <text x="1002" y="342">沒有尊享卡，只能排隊</text>
    <text x="984" y="386">● 等候卡：下一張要等</text>
    <text x="1002" y="412">120 分鐘或時段開始後</text>
    <text x="984" y="456">● 行動點餐、優先入席</text>
    <text x="1002" y="482">省掉餐廳排隊</text>
    <text x="984" y="526">● 下雨：美人魚礁湖</text>
    <text x="1002" y="552">Mermaid Lagoon 在室內</text>
  </g>

  <!-- column 5: evening -->
  <rect x="1260" y="130" width="280" height="590" rx="22" fill="#FFFFFF" stroke="#7E57C2" stroke-width="6"/>
  <rect x="1260" y="130" width="280" height="76" rx="22" fill="#7E57C2"/>
  <text x="1400" y="164" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　傍晚到 21:00</text>
  <text x="1400" y="192" font-size="15" fill="#EFE8F7" text-anchor="middle">Evening to closing</text>
  <g font-size="16" fill="#102A2B">
    <text x="1284" y="246">● 官網：人氣設施</text>
    <text x="1302" y="272">傍晚時段等候較短</text>
    <text x="1284" y="316">● 港灣表演「堅信！</text>
    <text x="1302" y="342">～夢想之海～」尊享卡 2,500</text>
    <text x="1284" y="386">● 閉園 21:00</text>
    <text x="1302" y="412">9 月 25 日提早到 18:30</text>
    <text x="1284" y="456">● 回程：度假區線 末班</text>
    <text x="1302" y="482">23:30 由度假區總站發車</text>
    <text x="1284" y="526">● 舞浜 → 東京駅</text>
    <text x="1302" y="552">JR 京葉線 約 20 分</text>
  </g>

  <!-- arrows -->
  <path d="M 342 420 L 356 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 642 420 L 656 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 942 420 L 956 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1242 420 L 1256 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- notes -->
  <text x="60" y="768" font-size="17" fill="#5C6B6B">尊享卡：每張園區票券一次只能買 1 人份、付款後不能取消或退款、售完為止；沒有智慧型手機或信用卡的人可到設施現場買。</text>
  <text x="60" y="800" font-size="17" fill="#5C6B6B">預約等候卡免費、可以取消，但不保證入場；報名體驗是抽籤，沒中就當天看不到。金額為日圓，以官網與 App 當日顯示為準。</text>
  <text x="60" y="832" font-size="17" fill="#5C6B6B">樂園（Tokyo Disneyland）流程相同：舞浜走 5 分鐘直接到，尊享卡 1,000 到 2,500 日圓，萬聖節表演 3,500 日圓。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
