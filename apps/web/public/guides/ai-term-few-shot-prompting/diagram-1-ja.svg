<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">例は判断の境界も含める</title>
<desc id="desc">通常例、情報欠落の例、境界例の三種類で処理ルールを定義し、新しい投稿に適用した後、例示していない別のデータで検証する。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">例は判断の境界も含める</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Few-shot Prompting · 落とし物情報の分類</text><path d="M460 275 H530 V370 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M460 525 H530 V440 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M990 405 H1130" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="190" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">通常例</text><text x="270" y="317" text-anchor="middle" font-size="25" fill="#5C6B6B">明確な品物と場所</text><rect x="80" y="440" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="517" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">情報欠落と境界</text><text x="270" y="567" text-anchor="middle" font-size="25" fill="#5C6B6B">未記載、落とし物探し</text><rect x="620" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="805" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">新しい投稿</text><text x="805" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">同じ項目を適用</text><rect x="1140" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1325" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">独立した検証</text><text x="1325" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">新しい事例を確認</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text>
