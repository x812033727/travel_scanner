<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">示範要涵蓋判斷邊界</title>
<desc id="desc">普通、缺漏與邊界三種示範一起定義處理規則，新留言套用後由另一批未示範資料驗證。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">示範要涵蓋判斷邊界</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Few-shot Prompting · 失物招領分類</text><path d="M460 275 H530 V370 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M460 525 H530 V440 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 405 H1130" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="190" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="270" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">普通示範</text><text x="270" y="317" text-anchor="middle" font-size="25" fill="#5C6B6B">明確物品與地點</text><rect x="80" y="440" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="270" y="517" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">缺漏與邊界</text><text x="270" y="567" text-anchor="middle" font-size="25" fill="#5C6B6B">未提供、尋物消息</text><rect x="620" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="805" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">新留言</text><text x="805" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">套用相同欄位</text><rect x="1140" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">獨立驗證</text><text x="1325" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">檢查新案例</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
