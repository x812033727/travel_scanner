<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">예시에 판단 경계도 포함</title>
<desc id="desc">일반·누락·경계 사례의 세 가지 예시로 처리 규칙을 함께 정의하고, 새 글에 적용한 뒤 예시로 쓰지 않은 별도의 데이터로 검증한다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">예시에 판단 경계도 포함</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Few-shot Prompting · 분실물·습득물 분류</text><path d="M460 275 H530 V370 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M460 525 H530 V440 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M990 405 H1130" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="190" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">일반 예시</text><text x="270" y="317" text-anchor="middle" font-size="25" fill="#5C6B6B">명확한 물품과 장소</text><rect x="80" y="440" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="517" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">누락과 경계</text><text x="270" y="567" text-anchor="middle" font-size="25" fill="#5C6B6B">미제공, 분실물 찾는 글</text><rect x="620" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="805" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">새 글</text><text x="805" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">같은 필드 적용</text><rect x="1140" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1325" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">독립 검증</text><text x="1325" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">새 사례 확인</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도해 제작 2026</text>
</svg>
