<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Examples Must Cover Decision Boundaries</title>
<desc id="desc">Typical, missing-data, and boundary examples jointly define the rules. New messages use them, and a separate batch of data not shown as examples validates the results.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Cover Decision Boundaries</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Few-shot Prompting · Lost-and-found Classification</text><path d="M460 275 H530 V370 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><path d="M460 525 H530 V440 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><path d="M990 405 H1130" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><rect x="80" y="190" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="270" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">Typical example</text><text x="270" y="317" text-anchor="middle" font-size="25" fill="#5C6B6B">Clear item and location</text><rect x="80" y="440" width="380" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="270" y="517" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B" style="font-size: 28px;">Missing data &amp; boundaries</text><text x="270" y="567" text-anchor="middle" font-size="25" fill="#5C6B6B">Not provided; lost-item reports</text><rect x="620" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="805" y="397" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">New message</text><text x="805" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">Use the same fields</text><rect x="1140" y="310" width="370" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1325" y="397" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B" style="font-size: 28px;">Independent validation</text><text x="1325" y="447" text-anchor="middle" font-size="25" fill="#5C6B6B">Check new cases</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair graphics 2026</text>
</svg>
