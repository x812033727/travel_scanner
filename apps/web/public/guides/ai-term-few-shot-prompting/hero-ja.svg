<title id="title">フューショットプロンプティング（Few-shot Prompting）とは：例で形式を明確に伝える</title>
<desc id="desc">対応付け済みの品物カード数枚が、新しい白紙のカードを同じ形式の出力位置へ導いている。</desc>
