<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">首爾五個住宿區域與機場交通示意圖 / Seoul areas to stay and airport links</title>
  <desc id="desc">簡化的首爾示意地圖，左邊是仁川機場，右邊由西向東是弘大、鐘路光化門、明洞、東大門，漢江以南是江南。實線是機場鐵道：一般列車經金浦機場到弘大入口與首爾站，T1 到弘大 4,650、到首爾站 4,750 韓元；直達列車不停站到首爾站 13,000 韓元，T1 43 分、T2 51 分。虛線是機場巴士，成人 17,000 韓元：6001 與 6015 經首爾站到明洞與東大門，6002 到弘大、光化門、鐘路與東大門，6703 KAL 巴士到江南 COEX。點線是首爾站轉地鐵：4 號線兩站到明洞、1 號線到鐘閣。各區框內另標深夜巴士：N6002 到弘大約 45 分、到光化門約 60 分，N6701 到首爾站約 60 分、東大門設計廣場約 70 分，N6000 到江南高速巴士客運站約 70 分，N6703 到 COEX 約 65 分。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
  </defs>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">首爾住哪一區　五區位置與機場交通</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Where to stay in Seoul · 示意圖，非精確比例 · 票價為成人單程，2026 年 9 月查證</text>

  <!-- Han river -->
  <path d="M 0 660 C 300 640, 600 700, 900 670 C 1150 645, 1350 700, 1600 680 L 1600 720 C 1350 740, 1150 685, 900 710 C 600 740, 300 680, 0 700 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="600" y="706" font-size="18" font-weight="700" fill="#3F6C7A">漢江 한강 Han River</text>

  <!-- bus 6002 over the top -->
  <path d="M 140 480 C 200 120, 700 100, 900 225" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <path d="M 1200 225 L 1276 300" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <text x="380" y="140" font-size="15" font-weight="700" fill="#9A4F12">6002 機場巴士 17,000 韓元 → 弘大入口 → 光化門・鐘路 → 東大門・清涼里</text>

  <!-- bus 6001/6015 to Myeongdong -->
  <path d="M 140 480 C 350 330, 700 300, 956 440" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <text x="430" y="325" font-size="15" font-weight="700" fill="#9A4F12">6001／6015 機場巴士 공항리무진 17,000 韓元 → 首爾站・明洞（樂天飯店）・東大門</text>

  <!-- AREX all-stop -->
  <path d="M 140 500 L 400 500 L 605 500 L 900 560" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <text x="160" y="486" font-size="15" font-weight="700" fill="#0D6B68">AREX 一般列車 일반열차 T1→弘大 4,650 韓元</text>
  <!-- AREX express -->
  <path d="M 140 520 C 400 660, 700 660, 900 560" fill="none" stroke="#2F6F9F" stroke-width="8"/>
  <text x="560" y="660" font-size="15" font-weight="700" fill="#2F6F9F">AREX 直達 직통열차：不停站到首爾站 13,000 韓元，T1 43 分／T2 51 分</text>
  <!-- bus 6703 to Gangnam -->
  <path d="M 140 540 C 140 880, 700 840, 956 795" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <text x="330" y="848" font-size="15" font-weight="700" fill="#9A4F12">6703 KAL 리무진 機場巴士 → 江南・COEX 一帶（票價官網未列）</text>

  <!-- subway links -->
  <g stroke="#5C6B6B" stroke-width="3" stroke-dasharray="3 7" fill="none">
    <path d="M 900 560 L 990 512"/>
    <path d="M 900 560 L 905 282"/>
    <path d="M 1230 450 L 1280 340"/>
  </g>
  <text x="930" y="548" font-size="15" fill="#5C6B6B">4 號線 2 站</text>
  <text x="892" y="350" font-size="15" fill="#5C6B6B" text-anchor="end">1 號線 → 鐘閣 종각</text>
  <text x="1262" y="410" font-size="15" fill="#5C6B6B">4 號線</text>

  <!-- nodes -->
  <circle cx="140" cy="500" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="60" y="466" font-size="18" font-weight="700" fill="#102A2B">仁川機場 인천공항 ICN（T1／T2）</text>
  <circle cx="400" cy="500" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="400" y="530" font-size="15" fill="#5C6B6B" text-anchor="middle">金浦機場 김포공항</text>
  <circle cx="605" cy="500" r="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="605" y="530" font-size="15" fill="#5C6B6B" text-anchor="middle">弘大入口站 홍대입구</text>
  <circle cx="900" cy="560" r="12" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="918" y="590" font-size="17" font-weight="700" fill="#102A2B">首爾站 서울역 Seoul Station</text>

  <!-- Jongno -->
  <rect x="900" y="170" width="300" height="110" rx="20" fill="#FFFFFF" stroke="#7E57C2" stroke-width="5"/>
  <text x="1050" y="200" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">鐘路・光化門</text>
  <text x="1050" y="224" font-size="15" fill="#5C6B6B" text-anchor="middle">종로・광화문 Jongno · 1、3、5 號線</text>
  <text x="1050" y="248" font-size="15" fill="#5C6B6B" text-anchor="middle">景福宮、北村、仁寺洞、清溪川</text>
  <text x="1050" y="270" font-size="15" fill="#5C6B6B" text-anchor="middle">深夜 N6002 → 光化門約 60 分</text>

  <!-- Dongdaemun -->
  <rect x="1280" y="250" width="290" height="120" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1425" y="280" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">東大門</text>
  <text x="1425" y="304" font-size="15" fill="#5C6B6B" text-anchor="middle">동대문 Dongdaemun · 2、4、5 號線</text>
  <text x="1425" y="328" font-size="15" fill="#5C6B6B" text-anchor="middle">DDP、批發商場、廣藏市場</text>
  <text x="1425" y="352" font-size="15" fill="#5C6B6B" text-anchor="middle">6001 到拜頓飯店；深夜 N6701 約 70 分</text>

  <!-- Hongdae -->
  <rect x="480" y="372" width="250" height="110" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <text x="605" y="402" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">弘大・延南洞</text>
  <text x="605" y="426" font-size="15" fill="#5C6B6B" text-anchor="middle">홍대 Hongdae · 2 號線、AREX</text>
  <text x="605" y="450" font-size="15" fill="#5C6B6B" text-anchor="middle">T2→弘大 5,250 韓元；6002 也停</text>
  <text x="605" y="472" font-size="15" fill="#5C6B6B" text-anchor="middle">深夜 N6002 約 45 分</text>

  <!-- Myeongdong -->
  <rect x="960" y="390" width="270" height="120" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1095" y="420" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">明洞</text>
  <text x="1095" y="444" font-size="15" fill="#5C6B6B" text-anchor="middle">명동 Myeongdong · 4 號線</text>
  <text x="1095" y="468" font-size="15" fill="#5C6B6B" text-anchor="middle">南大門市場、南山、清溪川</text>
  <text x="1095" y="492" font-size="15" fill="#5C6B6B" text-anchor="middle">深夜 N6701 → 首爾站 60 分・乙支路 65 分</text>

  <!-- Gangnam -->
  <rect x="960" y="740" width="460" height="110" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <text x="1190" y="770" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">江南 강남 Gangnam</text>
  <text x="1190" y="794" font-size="15" fill="#5C6B6B" text-anchor="middle">2、9 號線、新盆唐線 · COEX、蠶室樂天世界塔</text>
  <text x="1190" y="818" font-size="15" fill="#5C6B6B" text-anchor="middle">鐵道無直達，首爾站轉地鐵；白天 6703 巴士到 COEX</text>
  <text x="1190" y="840" font-size="15" fill="#5C6B6B" text-anchor="middle">深夜 N6000 → 高速巴士客運站約 70 分・N6703 → COEX 約 65 分</text>

  <!-- legend -->
  <g font-size="15" fill="#102A2B">
    <line x1="60" y1="880" x2="110" y2="880" stroke="#0D6B68" stroke-width="6"/><text x="120" y="885">AREX 一般列車</text>
    <line x1="250" y1="880" x2="300" y2="880" stroke="#2F6F9F" stroke-width="8"/><text x="310" y="885">AREX 直達列車</text>
    <line x1="440" y1="880" x2="490" y2="880" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10"/><text x="500" y="885">機場巴士（虛線）</text>
    <line x1="650" y1="880" x2="700" y2="880" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="3 7"/><text x="710" y="885">首爾站轉地鐵</text>
