  <path d="M 205 500 L 395 500 L 611 500 L 900 560" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <text x="224" y="482" font-size="15" font-weight="700" fill="#0D6B68">AREX 一般列車（T1→弘大 4,650ウォン）</text>

