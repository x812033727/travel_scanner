  <text x="1093" y="443" font-size="15" fill="#5C6B6B" text-anchor="middle">명동 Myeongdong・4号線</text>
  <text x="1093" y="467" font-size="15" fill="#5C6B6B" text-anchor="middle">南大門市場・南山・清渓川</text>
