  <text x="1048" y="223" font-size="15" fill="#5C6B6B" text-anchor="middle">종로・광화문 Jongno・1・3・5号線</text>
  <text x="1048" y="246" font-size="15" fill="#5C6B6B" text-anchor="middle">景福宮・北村韓屋村・仁寺洞・清渓川</text>
  <text x="1048" y="269" font-size="15" fill="#5C6B6B" text-anchor="middle">深夜 N6002 → 光化門まで約60分</text>

  <!-- Dongdaemun -->
  <rect x="1266" y="246" width="308" height="122" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1420" y="277" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">東大門</text>
  <text x="1420" y="302" font-size="15" fill="#5C6B6B" text-anchor="middle">동대문 Dongdaemun・2・4・5号線</text>
  <text x="1420" y="326" font-size="15" fill="#5C6B6B" text-anchor="middle">DDP・卸売モール・広蔵市場</text>
  <text x="1420" y="350" font-size="15" fill="#5C6B6B" text-anchor="middle">6001 ベイトンホテル／N6701 約70分</text>

  <!-- Hongdae -->
  <rect x="466" y="348" width="290" height="112" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <text x="611" y="378" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">弘大・延南洞</text>
  <text x="611" y="402" font-size="15" fill="#5C6B6B" text-anchor="middle">홍대 Hongdae・2号線・AREX</text>
