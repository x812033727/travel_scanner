<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Noto Sans KR','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ソウル5大宿泊エリアと空港アクセス路線図 / Seoul areas to stay and airport links</title>
  <desc id="desc">ソウルの簡易模式図です。左側に仁川国際空港、右側に西から東へ弘大・延南洞、鐘路・光化門、明洞、東大門、漢江の南側に江南を配置しています。実線は空港鉄道AREXで、一般列車は金浦空港を経由して弘大入口駅とソウル駅へ結び、T1発は弘大入口まで4,650ウォン、ソウル駅まで4,750ウォン、T2発は弘大入口まで5,250ウォンです。直通列車は途中停車なしでソウル駅まで13,000ウォン、所要時間はT1から43分、T2から51分です。破線はリムジンバス（大人17,000ウォン）で、6001・6015はソウル駅経由で明洞・東大門へ、6002は弘大入口・光化門・鐘路・東大門へ、6703 KALリムジンバスは江南・COEX周辺へ向かいます。点線はソウル駅からの地下鉄乗り換えで、4号線で2駅の明洞、1号線で鐘閣へ接続します。各エリア枠内には地下鉄路線（1・2・3・4・5・9号線、新盆唐線）と深夜バスも記載しており、N6002は弘大入口まで約45分・光化門まで約60分、N6701はソウル駅まで約60分・乙支路入口まで約65分・東大門デザインプラザまで約70分、N6000は江南高速バスターミナルまで約70分、N6703はCOEXまで約65分です。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
  </defs>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">ソウル宿泊エリアガイド　5エリアの位置と空港アクセス</text>
  <text x="60" y="98" font-size="19" font-weight="700" fill="#5C6B6B">Where to stay in Seoul・模式図（縮尺は正確ではありません）・大人片道運賃・2026年9月確認</text>

  <!-- Han river -->
  <path d="M 0 660 C 300 640, 600 700, 900 670 C 1150 645, 1350 700, 1600 680 L 1600 720 C 1350 740, 1150 685, 900 710 C 600 740, 300 680, 0 700 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="560" y="706" font-size="18" font-weight="700" fill="#3F6C7A">漢江 한강 Han River</text>

  <!-- bus 6002 over the top -->
  <path d="M 205 480 C 265 130, 700 110, 886 225" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <path d="M 1210 225 L 1266 300" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <text x="360" y="138" font-size="15" font-weight="700" fill="#9A4F12">6002 リムジンバス 17,000ウォン → 弘大入口 → 光化門・鐘路 → 東大門</text>

  <!-- bus 6001/6015 to Myeongdong -->
  <path d="M 205 480 C 335 245, 755 245, 946 435" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <text x="355" y="276" font-size="15" font-weight="700" fill="#9A4F12">6001／6015 リムジンバス 17,000ウォン → ソウル駅・明洞・東大門</text>

