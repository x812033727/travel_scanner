  <text x="1055" y="218" font-size="15" fill="#5C6B6B" text-anchor="middle">Jongno · 1·3·5호선</text>
  <text x="1055" y="242" font-size="15" fill="#5C6B6B" text-anchor="middle">경복궁·북촌·인사동·청계천</text>
  <text x="1055" y="266" font-size="15" fill="#5C6B6B" text-anchor="middle">심야 N6002 → 광화문 약 60분</text>

