  <text x="580" y="706" font-size="18" font-weight="700" fill="#3F6C7A">한강 Han River</text>

  <!-- bus 6002 over the top -->
  <path d="M 160 486 C 215 126, 695 106, 884 222" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
  <path d="M 1223 224 L 1254 276" fill="none" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowOrange)"/>
