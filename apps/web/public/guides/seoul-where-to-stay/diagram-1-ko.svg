<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Noto Sans','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">서울 5개 숙소 지역과 공항 교통 개념도 / Seoul areas to stay and airport links</title>
  <desc id="desc">간략화한 서울 개념도예요. 왼쪽에 인천국제공항이 있고, 오른쪽에는 서쪽에서 동쪽 순으로 홍대·연남동, 종로·광화문, 명동, 동대문이, 한강 남쪽에는 강남이 배치되어 있어요. 실선은 공항철도 AREX예요. 일반열차는 김포공항을 거쳐 홍대입구역과 서울역으로 운행하며, 교통카드 기준 T1에서 홍대입구 4,650원, T2에서 홍대입구 5,250원, T1에서 서울역 4,750원이에요. 직통열차는 무정차로 서울역까지 13,000원이며 T1에서 43분, T2에서 51분 걸려요. 점선은 성인 17,000원 공항버스예요. 6001번과 6015번은 서울역을 거쳐 명동(롯데호텔)과 동대문(베이튼호텔)으로, 6002번은 홍대입구·광화문·종로·동대문·청량리로, 6703번 KAL 리무진 공항버스는 강남과 COEX 일대로 가요(6703번 요금은 공식 홈페이지 미표기). 작은 점선은 서울역 지하철 환승 경로로, 4호선 2정거장이면 명동, 1호선이면 종각에 닿아요. 각 지역 카드에는 1·2·3·4·5·9호선과 신분당선 정보 및 심야버스 소요 시간을 함께 표시했어요. N6002번은 홍대 약 45분·광화문 약 60분, N6701번은 서울역 약 60분·을지로입구 약 65분·동대문디자인플라자 약 70분, N6000번은 강남고속버스터미널 약 70분, N6703번은 COEX 약 65분이에요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
  </defs>
  <text x="60" y="64" font-size="36" font-weight="700" fill="#102A2B">서울 숙소 어디로 잡을까? 5개 지역 위치와 공항 교통</text>
  <text x="60" y="98" font-size="20" font-weight="700" fill="#5C6B6B">Where to stay in Seoul · 위치·노선 개념도(실제 축척 아님) · 성인 편도 요금, 2026년 9월 확인</text>

