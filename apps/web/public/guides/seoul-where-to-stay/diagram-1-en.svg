  <text x="395" y="548" font-size="15" fill="#5C6B6B" text-anchor="middle">김포공항</text>

  <circle cx="590" cy="500" r="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="590" y="528" font-size="15" fill="#5C6B6B" text-anchor="middle">Hongik Univ. Stn</text>
  <text x="590" y="548" font-size="15" fill="#5C6B6B" text-anchor="middle">홍대입구</text>

  <circle cx="855" cy="560" r="12" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
