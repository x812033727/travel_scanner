  <text x="985" y="208" font-size="15" fill="#5C6B6B" text-anchor="middle">종로 · 광화문 · Lines 1, 3, 5</text>
  <text x="985" y="232" font-size="15" fill="#5C6B6B" text-anchor="middle">Gyeongbokgung · Bukchon · Insadong</text>
  <text x="985" y="256" font-size="15" fill="#5C6B6B" text-anchor="middle">Night N6002 → Gwanghwamun ~60 min</text>

  <!-- Dongdaemun -->
  <rect x="1225" y="232" width="350" height="128" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
