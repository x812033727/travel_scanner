  <text x="1400" y="288" font-size="15" fill="#5C6B6B" text-anchor="middle">동대문 · Lines 2, 4, 5</text>
  <text x="1400" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">DDP · Wholesale Malls · Gwangjang Mkt</text>
  <text x="1400" y="336" font-size="15" fill="#5C6B6B" text-anchor="middle">Bus 6001 · Night N6701 ~70 min (DDP)</text>

  <!-- Hongdae & Yeonnam-dong -->
  <rect x="412" y="338" width="356" height="122" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <text x="590" y="370" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Hongdae &amp; Yeonnam-dong</text>
  <text x="590" y="394" font-size="15" fill="#5C6B6B" text-anchor="middle">홍대 · Line 2 · AREX All-Stop</text>
  <text x="590" y="418" font-size="15" fill="#5C6B6B" text-anchor="middle">T2 → Hongdae 5,250 KRW · Bus 6002</text>
  <text x="590" y="442" font-size="15" fill="#5C6B6B" text-anchor="middle">Night N6002 ~45 min</text>

  <!-- Myeongdong -->
  <rect x="960" y="392" width="360" height="128" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1140" y="424" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Myeongdong</text>
  <text x="1140" y="448" font-size="15" fill="#5C6B6B" text-anchor="middle">명동 · Line 4</text>
  <text x="1140" y="472" font-size="15" fill="#5C6B6B" text-anchor="middle">Namdaemun · Namsan · Cheonggyecheon</text>
  <text x="1140" y="496" font-size="15" fill="#5C6B6B" text-anchor="middle">N6701: Seoul Stn ~60 min · Euljiro ~65 min</text>

  <!-- Gangnam -->
  <rect x="910" y="732" width="590" height="118" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
