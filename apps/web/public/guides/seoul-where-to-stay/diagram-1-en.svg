  <text x="874" y="604" font-size="15" font-weight="700" fill="#5C6B6B">서울역</text>

  <!-- Jongno & Gwanghwamun -->
  <rect x="805" y="152" width="360" height="122" rx="20" fill="#FFFFFF" stroke="#7E57C2" stroke-width="5"/>
