<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Choosing What to Visit at Singapore’s Gardens by the Bay: Flower Dome, Cloud Forest and Outdoor Gardens—Decision Process</title><desc>Check in order: choose your main experience, check maintenance dates, verify tickets and plan a fallback. Compiled by the editors; not a map or measured timing guide.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Step order · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits you; you do not need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Choose your focus</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Pick one priority</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Indoor vs. outdoor</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="29" font-weight="700" style="font-size: 29px;">Check maintenance</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Check closures</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Check dates by venue</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Verify your ticket</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Match the ticket</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Time, eligibility, access</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Plan a fallback</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Keep flexibility</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Adjust for weather</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · In-house editorial diagram / Editorial diagram</text></g></svg>
