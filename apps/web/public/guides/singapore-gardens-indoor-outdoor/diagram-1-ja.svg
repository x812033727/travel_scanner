<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>シンガポールのガーデンズ・バイ・ザ・ベイの選び方：フラワー・ドーム、クラウド・フォレスト、屋外庭園をどう選ぶか：判断の手順</title><desc>順に確認：メインの体験を選ぶ、メンテナンス日を調べる、チケットを確認する、代替案を用意する。編集部による整理であり、地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順序 · 実用的な手順</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、一度に全部回る必要なし</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">メイン体験を選ぶ</text><text x="103" y="497" fill="#f4f0e5" font-size="23">最優先を一つ選ぶ</text><text x="103" y="573" fill="#f4dc9d" font-size="26">屋内・屋外を区別</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">メンテ日を確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">休館情報を確認</text><text x="473" y="573" fill="#f4dc9d" font-size="26">各館の日付を照合</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">チケットを確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">チケットを照合</text><text x="843" y="573" fill="#f4dc9d" font-size="26">時間帯・資格・範囲</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">代替案を用意</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">柔軟性を残す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">天候に応じて調整</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部作成の図解 / 編集部による図解</text></g></svg>
