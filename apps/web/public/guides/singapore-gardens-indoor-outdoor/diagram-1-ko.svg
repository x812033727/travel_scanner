<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>싱가포르 가든스 바이 더 베이 선택 가이드: 플라워 돔, 클라우드 포레스트, 야외 정원 비교와 판단 절차</title><desc>순서대로 확인하세요: 주요 체험 선택, 점검일 확인, 티켓 대조, 대안 마련. 편집부가 정리한 안내이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">조건에 맞게 선택하세요. 한 번에 전부 할 필요는 없어요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">주요 체험 선택</text><text x="103" y="497" fill="#f4f0e5" font-size="23">우선순위 하나 고르기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">실내·야외 구분</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">점검일 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">휴관 여부 확인</text><text x="473" y="573" fill="#f4dc9d" font-size="26">전시관별 날짜 대조</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">티켓 대조</text><text x="843" y="497" fill="#f4f0e5" font-size="23">티켓 조건 맞춰보기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">시간대·자격·범위</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">대안 마련</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">조정 여유 두기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">날씨에 따라 조정</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 개념도 / 편집부 도해</text></g></svg>
