<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">世界模型（World Model）是什麼：讓 AI 預測「接下來會怎樣」</title><desc id="desc">左下方一個方形的小代理，冒出兩個小圓點連到右上方的大泡泡。泡泡裡是一片縮小的山丘、太陽與一條路徑，路徑在前方分成三條：上方一條被紅色叉號擋住，中間一條是灰色虛線，下方一條是綠色實線並通到圓形目標，象徵在想像中預測不同的未來再選一條走。</desc><rect width="1600" height="900" fill="#F7F1E8"/><rect x="540" y="110" width="940" height="600" rx="70" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="10"/><circle cx="1330" cy="250" r="58" fill="#D97A2B"/><path d="M 548 570 Q 760 420 930 520 Q 1100 400 1260 470 Q 1370 425 1472 480 L 1472 640 L 548 640 Z" fill="#E3F0EF"/><path d="M 650 640 Q 760 600 900 560" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="round"/><path d="M 900 560 Q 1060 500 1180 380" fill="none" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 26"/><path d="M 900 560 Q 1080 540 1260 520" fill="none" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 26"/><path d="M 900 560 Q 1080 610 1270 610" fill="none" stroke="#2E7D5B" stroke-width="16" stroke-linecap="round"/><path d="M 1160 340 L 1220 400 M 1220 340 L 1160 400" fill="none" stroke="#B8442D" stroke-width="14" stroke-linecap="round"/><circle cx="1300" cy="610" r="34" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="12"/><circle cx="1300" cy="610" r="10" fill="#2E7D5B"/><circle cx="900" cy="560" r="16" fill="#0D6B68"/><circle cx="470" cy="560" r="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/><circle cx="410" cy="625" r="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="7"/><rect x="170" y="640" width="230" height="180" rx="44" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10"/><circle cx="285" cy="720" r="38" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/><circle cx="285" cy="720" r="12" fill="#0D6B68"/><path d="M 285 640 L 285 600" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/><circle cx="285" cy="592" r="14" fill="#D97A2B"/></svg>
