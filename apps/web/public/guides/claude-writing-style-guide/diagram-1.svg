<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用 Claude 寫長文：先餵風格樣本，再走四步 / Feed style samples first, then four steps for a long piece</title>
  <desc id="desc">左半邊是風格樣本的餵法，三個方框由上往下用箭頭相連。一、貼 2 到 3 篇自己的舊文：挑重讀還滿意的、同一類型的，用 example 標籤包起來，放在提示詞最前面。二、先要它描述你的風格：句子多長、慣用的連接詞與句尾；先不要寫內文，等你確認。三、把描述存起來：貼進設定的指令欄位或專案指令，或做成技能，下次不必重貼。左下註記：形容詞沒有用，一篇你滿意的成品比形容更能說明標準；樣式已改成技能，名稱以官網為準。右半邊是一篇長文的四步，四個方框由上往下用箭頭相連。第一步列大綱：讀者是誰、讀完要能做到什麼、例子放哪一節，先不要寫內文。第二步逐節寫：一次只寫一節，附上大綱與前一節的最後一句。第三步整篇順稿：只修銜接、刪重複、統一稱呼，不准新增資訊或改數字。第四步最後刪：刪到目標字數，並要它列出刪掉了哪些句子。右下註記：每一步結束都做同一件事，日期、金額、人名、出處自己對一次。功能名稱依 2026 年 9 月的 Claude 說明中心。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">用 Claude 寫長文：先餵風格樣本，再走四步（2026 年 9 月依官網查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Feed two or three of your own pieces first, then outline, draft section by section, smooth and cut</text>

  <text x="60" y="134" font-size="20" font-weight="700" fill="#102A2B">風格樣本怎麼餵　Feed your style samples</text>

  <rect x="60" y="154" width="560" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="340" y="198" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">一、貼 2 到 3 篇自己的舊文</text>
  <text x="340" y="238" font-size="16" fill="#102A2B" text-anchor="middle">挑重讀還滿意的，而且是同一類型的</text>
  <text x="340" y="278" font-size="16" fill="#102A2B" text-anchor="middle">用 example 標籤包起來，放在提示詞最前面</text>
  <path d="M 340 324 L 340 356" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="362" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="340" y="406" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">二、先要它描述你的風格</text>
  <text x="340" y="446" font-size="16" fill="#102A2B" text-anchor="middle">句子多長、慣用的連接詞與句尾</text>
  <text x="340" y="482" font-size="16" fill="#102A2B" text-anchor="middle">先不要寫內文，等你確認這份描述</text>
  <path d="M 340 512 L 340 544" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="550" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="340" y="594" font-size="20" font-weight="700" fill="#245E45" text-anchor="middle">三、把這份描述存起來</text>
  <text x="340" y="634" font-size="16" fill="#102A2B" text-anchor="middle">貼進設定的指令欄位或專案指令</text>
  <text x="340" y="670" font-size="16" fill="#102A2B" text-anchor="middle">或做成技能，下次不必再重貼原文</text>

  <text x="60" y="748" font-size="15" fill="#5C6B6B">形容詞沒有用：一篇你自己滿意的成品，比形容更能說明你的標準</text>
  <text x="60" y="776" font-size="15" fill="#5C6B6B">舊的「樣式」已改成技能，介面名稱以官網為準</text>

  <text x="680" y="134" font-size="20" font-weight="700" fill="#102A2B">一篇長文的四步　Four steps for a long piece</text>

  <rect x="680" y="154" width="860" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="710" y="198" font-size="20" font-weight="700" fill="#0B4F4D">① 列大綱</text>
  <text x="710" y="238" font-size="16" fill="#102A2B">讀者是誰、讀完要能做到什麼、例子放哪一節；先不要寫內文</text>
  <path d="M 1110 274 L 1110 306" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="312" width="860" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="710" y="356" font-size="20" font-weight="700" fill="#1F4E73">② 逐節寫</text>
  <text x="710" y="396" font-size="16" fill="#102A2B">一次只寫一節，附上大綱與前一節的最後一句，語氣照樣本</text>
  <path d="M 1110 432 L 1110 464" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="470" width="860" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="710" y="514" font-size="20" font-weight="700" fill="#A85A17">③ 整篇順稿</text>
  <text x="710" y="554" font-size="16" fill="#102A2B">只修銜接、刪重複、統一稱呼；不准新增資訊，不准改數字</text>
  <path d="M 1110 590 L 1110 622" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="628" width="860" height="120" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="710" y="672" font-size="20" font-weight="700" fill="#245E45">④ 最後刪</text>
  <text x="710" y="712" font-size="16" fill="#102A2B">刪到目標字數，並要它列出刪掉了哪些句子，你自己救回</text>

  <text x="680" y="790" font-size="15" fill="#B8442D">每一步結束都做同一件事：日期、金額、人名、出處自己對一次</text>
  <text x="680" y="818" font-size="15" fill="#5C6B6B">每一步都把最新版整篇貼回去，不要讓它憑對話記憶接著改</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
