<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一張稿紙、一段被畫線的文字、對話泡泡與一枝筆 / A ruled page with one underlined passage, a speech bubble and a pen</title>
  <desc id="desc">米色背景上有一張白色的稿紙，紙上有七條橫線，每條線上用灰色長條代表一行字。第四行被淡青色的底色框起來，字的長條顏色較深，下面還有一道青色的底線，代表只挑出這一段來修改。稿紙右邊是一個青色邊框的對話泡泡，尖角指向稿紙，泡泡裡有四條短線代表 AI 的回覆。稿紙右下方斜放著一枝橘色的筆，筆尖朝左下。畫面下方一行字寫著「先給它你寫過的東西」。</desc>
