<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Arial',sans-serif">
<title id="title">Website Image Editing Workflow</title><desc id="desc">Four cards cover image purpose, file preparation, text fields, and public-page checks, keeping each step traceable.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Website Image Editing Workflow</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Check the content and file from the image's purpose through the public page</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Image purpose</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">What question?</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Information or decor</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Place near the topic</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Prepare the file</text>
<text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Keep a quality original</text>
<text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Compare size and type</text>
<text x="477.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Keep details in crops</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Text fields</text>
<text x="846.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Clear, short filename</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Contextual alt text</text>
<text x="846.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Explain in the body</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Page check</text>
<text x="1215.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Loaded file is clear</text>
<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Mobile display works</text>
<text x="1215.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Log source and version</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Images should inform readers, load correctly, and have context-appropriate text.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
