<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">サイト画像の編集手順</title><desc id="desc">画像の用途、ファイル作成、文字項目、公開ページの確認を四つの区画で示し、各段階の情報を残す。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">サイト画像の編集手順</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">画像の目的から公開ページまで、内容とファイルを順に確認</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">画像の用途</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">何に答えるか</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">情報か装飾か</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">関連段落に置く</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">ファイル作成</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">高品質の原本を保存</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">寸法と形式を比較</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">切り抜きで詳細を残す</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">文字項目</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">短く明確な名前</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">文脈に合う代替文</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">本文で情報を補う</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">ページ確認</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">実ファイルを確認</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">スマホ表示を確認</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">出典と版を記録</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">画像は読者に伝わり、ファイルが使え、説明文も文脈に合う必要がある。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
