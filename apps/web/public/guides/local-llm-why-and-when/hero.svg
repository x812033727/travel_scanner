<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">在自己電腦跑 AI 的意象 / Running AI on your own computer</title>
  <desc id="desc">插圖。左邊一台桌上型螢幕造型的電腦，螢幕裡有一個對話框，整台電腦被一圈虛線的綠色圓圈包住，代表資料留在這個範圍內。右上角有一朵藍色的雲，雲和圓圈之間的點狀線在中途就斷開，代表對話不需要送到外面；右下角是一疊橘色的圓形代表一次性的硬體支出。畫面下方一行字寫著「資料留在這台電腦」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <circle cx="560" cy="390" r="280" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9" stroke-dasharray="24 18"/>

  <rect x="400" y="235" width="320" height="220" rx="18" fill="#FFFFFF" stroke="#102A2B" stroke-width="9"/>
  <polygon points="362,458 758,458 788,494 332,494" fill="#102A2B"/>

  <rect x="440" y="280" width="240" height="112" rx="28" fill="#0D6B68"/>
  <polygon points="482,390 482,430 522,390" fill="#0D6B68"/>
  <circle cx="500" cy="336" r="14" fill="#E3F0EF"/>
  <circle cx="560" cy="336" r="14" fill="#E3F0EF"/>
  <circle cx="620" cy="336" r="14" fill="#E3F0EF"/>

  <path d="M 1110 395 C 1062 395 1058 335 1100 322 C 1096 262 1176 236 1210 280 C 1240 244 1312 258 1316 308 C 1364 312 1368 388 1320 395 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="9"/>

  <line x1="1070" y1="392" x2="905" y2="392" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="6 20" stroke-linecap="round"/>

  <ellipse cx="1230" cy="640" rx="92" ry="27" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <ellipse cx="1230" cy="598" rx="92" ry="27" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <ellipse cx="1230" cy="556" rx="92" ry="27" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>

  <text x="800" y="800" text-anchor="middle" font-size="56" font-weight="700" fill="#102A2B">資料留在這台電腦</text>
