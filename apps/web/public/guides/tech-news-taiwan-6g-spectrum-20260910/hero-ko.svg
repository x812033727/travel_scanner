<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">디지털발전부, 6G 주파수 국제 심포지엄 개최: 무엇을 논의했고 무엇이 아직 정해지지 않았나</title><desc id="desc">독창적 일러스트: 왼쪽 지상에는 두 갈래의 곡선 전파를 내보내는 기지국이 있고, 오른쪽 위에는 두 개의 패널을 펼친 위성이 있다. 기지국과 위성, 위성과 지상은 각각 점선으로 연결된다. 오른쪽에는 점선 테두리의 문서가 있고, 점선 원은 아직 정해지지 않은 계획을 나타낸다. 상표나 기기 외관은 포함하지 않는다.</desc>
