<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">把口語說法換回條款用語 / Everyday wording turned back into policy wording</title>
  <desc id="desc">插圖。畫面左側是三張淺藍色圓角小卡，每張卡裡有兩條短橫線，代表三句口語說法。中間一個粗箭頭指向右方。右側是一份攤開的保險單條款，兩頁之間有一條書縫線，兩頁上各有幾條橫線代表條文；文件右上角插著一枚橘色書籤，底端是尖角缺口，標出被指到的那一節。畫面下方一行字寫著換回條款用語。</desc>
