<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">口語說法對回條款用語 / From everyday shorthand to policy wording</title>
  <desc id="desc">三欄對照圖。左欄是四句常聽到的口語說法：還本、保本；終身有保障；這個一定賠；不用寫。中欄是條款上的正式名稱，依序為保單價值準備金、解約金與生存保險金；保險期間、繳費期間與保證續保或非保證續保；給付項目、除外責任、給付之限制與等待期；告知義務。右欄是該翻到條款的哪一節，依序為歷年解約金額例表所在的附表與頁碼、契約有效期間那一條與要保書及保險單首頁的標示、除外責任列了哪幾款與疾病定義裡有沒有等待期、告知義務與本契約的解除。圖的下方寫著每一列的最後一題都一樣：這句話寫在條款第幾條。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">口語說法對回條款用語</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">From everyday shorthand to policy wording</text>

  <text x="250" y="150" text-anchor="middle" font-size="20" fill="#5C6B6B">聽到的一句話</text>
  <text x="760" y="150" text-anchor="middle" font-size="20" fill="#5C6B6B">條款上的正式名稱</text>
  <text x="1310" y="150" text-anchor="middle" font-size="20" fill="#5C6B6B">翻到條款的哪一節</text>

  <rect x="60" y="175" width="380" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="250" y="243" text-anchor="middle" font-size="24" fill="#102A2B">「還本、保本」</text>
  <line x1="455" y1="235" x2="525" y2="235" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="545" y="175" width="430" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="760" y="222" text-anchor="middle" font-size="19" fill="#102A2B">保單價值準備金</text>
  <text x="760" y="254" text-anchor="middle" font-size="19" fill="#102A2B">解約金、生存保險金</text>
  <line x1="990" y1="235" x2="1060" y2="235" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="1080" y="175" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1310" y="222" text-anchor="middle" font-size="19" fill="#102A2B">歷年解約金額例表</text>
  <text x="1310" y="254" text-anchor="middle" font-size="17" fill="#5C6B6B">附表在保單的哪一頁</text>

  <rect x="60" y="315" width="380" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="250" y="383" text-anchor="middle" font-size="24" fill="#102A2B">「終身有保障」</text>
  <line x1="455" y1="375" x2="525" y2="375" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="545" y="315" width="430" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="760" y="362" text-anchor="middle" font-size="19" fill="#102A2B">保險期間、繳費期間</text>
  <text x="760" y="394" text-anchor="middle" font-size="19" fill="#102A2B">保證續保或非保證續保</text>
  <line x1="990" y1="375" x2="1060" y2="375" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="1080" y="315" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1310" y="362" text-anchor="middle" font-size="19" fill="#102A2B">契約有效期間那一條</text>
  <text x="1310" y="394" text-anchor="middle" font-size="17" fill="#5C6B6B">要保書與保險單首頁的標示</text>

  <rect x="60" y="455" width="380" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="250" y="523" text-anchor="middle" font-size="24" fill="#102A2B">「這個一定賠」</text>
  <line x1="455" y1="515" x2="525" y2="515" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="545" y="455" width="430" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="760" y="502" text-anchor="middle" font-size="19" fill="#102A2B">給付項目、除外責任</text>
  <text x="760" y="534" text-anchor="middle" font-size="19" fill="#102A2B">給付之限制、等待期</text>
  <line x1="990" y1="515" x2="1060" y2="515" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="1080" y="455" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1310" y="502" text-anchor="middle" font-size="19" fill="#102A2B">除外責任列了哪幾款</text>
  <text x="1310" y="534" text-anchor="middle" font-size="17" fill="#5C6B6B">疾病定義裡有沒有等待期</text>

  <rect x="60" y="595" width="380" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="250" y="663" text-anchor="middle" font-size="24" fill="#102A2B">「不用寫」</text>
  <line x1="455" y1="655" x2="525" y2="655" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="545" y="595" width="430" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="760" y="642" text-anchor="middle" font-size="19" fill="#102A2B">告知義務</text>
  <text x="760" y="674" text-anchor="middle" font-size="17" fill="#5C6B6B">保險法第六十四條</text>
  <line x1="990" y1="655" x2="1060" y2="655" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="1080" y="595" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1310" y="642" text-anchor="middle" font-size="19" fill="#102A2B">告知義務與本契約的解除</text>
  <text x="1310" y="674" text-anchor="middle" font-size="17" fill="#5C6B6B">解除權的行使期間</text>

  <rect x="60" y="745" width="1480" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="792" text-anchor="middle" font-size="22" fill="#102A2B">每一列的最後一題都一樣：這句話寫在條款第幾條，完整文字怎麼寫</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
