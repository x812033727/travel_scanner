<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">雇主提繳與自願提繳，進同一個個人專戶</title>
<desc id="desc">月提繳工資分成兩條線：雇主提繳不得低於百分之六，自願提繳由勞工自己決定、上限百分之六。兩條線都匯入同一個個人退休金專戶，要年滿六十歲才能請領。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">雇主提繳與自願提繳，進同一個個人專戶</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Labor pension · 兩筆錢、一個帳戶、一個請領門檻</text>

<path d="M340 420 L470 330" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M340 480 L470 580" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M770 330 L900 420" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M770 580 L900 480" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1200 450 L1280 450" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

<rect x="60" y="380" width="280" height="140" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="200" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">每個月</text>
<text x="200" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">月提繳工資</text>
<text x="200" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">依分級表對應</text>

<rect x="470" y="250" width="300" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="620" y="288" text-anchor="middle" font-size="17" fill="#5C6B6B">雇主負擔，不扣薪水</text>
<text x="620" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">雇主提繳</text>
<text x="620" y="364" text-anchor="middle" font-size="18" fill="#5C6B6B">不得低於 6%</text>

<rect x="470" y="520" width="300" height="140" rx="22" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="620" y="558" text-anchor="middle" font-size="17" fill="#5C6B6B">從你的薪資扣</text>
<text x="620" y="598" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">自願提繳</text>
<text x="620" y="634" text-anchor="middle" font-size="18" fill="#5C6B6B">自己決定，最多 6%</text>

<rect x="900" y="380" width="300" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1050" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">兩筆錢同一個帳戶</text>
<text x="1050" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">個人退休金專戶</text>
<text x="1050" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">中途不能提領</text>

<rect x="1280" y="380" width="260" height="140" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1410" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">請領門檻</text>
<text x="1410" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">年滿 60 歲</text>
<text x="1410" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">年資未滿 15 年領一次金</text>

<text x="60" y="760" font-size="20" fill="#5C6B6B">自願提繳的比率一年可以調整兩次，也可以隨時停止；雇主不得拒絕勞工自願提繳。</text>
<text x="60" y="794" font-size="20" fill="#5C6B6B">自願提繳的金額，不計入提繳年度的薪資所得課稅。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
