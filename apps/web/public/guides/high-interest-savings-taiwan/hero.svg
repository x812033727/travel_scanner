<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">高利活存怎麼看：利率級距、額度上限與實際拿到的利息</title>
<desc id="desc">一條很粗的橫向圓角長條代表帳戶餘額，左邊約三分之一填成深綠色，右邊三分之二留白，外框是深綠色粗線。一條橘色虛線垂直穿過兩段的交界，上方寫著適用額度上限六個字。兩支灰色粗箭頭從長條下緣的左右兩段各自彎下來，指進下方一個淺藍色圓角方框；方框裡是兩條長短不同的短橫線、一條藍色分隔線與一條較長的深色合計線，像一張把兩筆金額加起來的算式。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<g transform="translate(0,-14)">
<text x="600" y="172" text-anchor="middle" font-size="46" font-weight="700" fill="#D97A2B">適用額度上限</text>
<path d="M600 200 L600 448" fill="none" stroke="#D97A2B" stroke-width="10" stroke-linecap="butt" stroke-dasharray="24 18"/>
<path d="M600 250 H234 Q200 250 200 284 V366 Q200 400 234 400 H600 Z" fill="#0D6B68"/>
<rect x="200" y="250" width="1200" height="150" rx="34" fill="none" stroke="#0D6B68" stroke-width="16"/>
<path d="M400 416 C400 504 566 524 706 558" fill="none" stroke="#5C6B6B" stroke-width="18" stroke-linecap="butt" marker-end="url(#tip)"/>
<path d="M1000 416 C1000 504 954 524 894 558" fill="none" stroke="#5C6B6B" stroke-width="18" stroke-linecap="butt" marker-end="url(#tip)"/>
<rect x="520" y="580" width="560" height="210" rx="30" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="16"/>
<path d="M580 640 H860" stroke="#5C6B6B" stroke-width="18" stroke-linecap="round"/>
