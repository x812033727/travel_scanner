  <rect x="400" y="402" width="46" height="46" rx="10" fill="none" stroke="#2F6F9F" stroke-width="8"/>
  <path d="M 411 425 L 421 437 L 437 413" fill="none" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="482" y="411" width="410" height="28" rx="14" fill="#E6F0F7"/>

  <rect x="400" y="504" width="46" height="46" rx="10" fill="none" stroke="#2E7D5B" stroke-width="8"/>
