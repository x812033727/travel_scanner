<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">裝之前先查清楚 / Check before you install</title>
  <desc id="desc">抽象插圖。米色底，畫面上方一行粗體中文字「裝之前先查清楚」。中央是一張白色圓角卡片，卡片上有三列打勾的方框，每個方框右邊接著一條淺色長條代表一項檢查。卡片右下角壓著一個橘色的放大鏡，鏡框是空心圓，斜向右下伸出一支握柄。畫面底部有一條灰色橫線，串起四個實心圓點，由左到右依序是深綠、藍、橘、綠，代表裝之前、註冊時、使用中、不用了四段順序。沒有任何商標、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="140" text-anchor="middle" font-size="68" font-weight="700" fill="#102A2B">裝之前先查清楚</text>

  <rect x="330" y="230" width="880" height="390" rx="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>

  <rect x="400" y="300" width="46" height="46" rx="10" fill="none" stroke="#0D6B68" stroke-width="8"/>
