<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">裝海外 AI App 的四段檢查 / Four-stage checklist for overseas AI apps</title>
<desc id="desc">流程圖由左到右四格。第一格「裝之前」四項：資料存在哪個國家、留存期間有沒有寫、會不會用來訓練、商店頁的隱私標示。第二格「註冊時」三項：官方寫可以用哪些帳號、用專用信箱少用門號、綁第三方帳號前先看。第三格「使用中」三項：權限只給當下要用的、回頭看實際取用紀錄、個資與公司資料不輸入。第四格「不用了」三項：先匯出再刪對話、退出訓練用開關或寄信、刪帳號是不可逆的。四格之間以箭頭相接。下方左側說明官方文件沒寫的就寫以官網為準，不要自己補一個數字；下方右側列出個人資料保護法第 3 條的五項權利，查詢或請求閱覽、請求製給複製本、請求補充或更正、請求停止蒐集處理或利用、請求刪除，不得預先拋棄或以特約限制。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">裝海外 AI App 的四段檢查</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Before install / At sign-up / In use / After use</text>
<rect x="60" y="150" width="325" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="222" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#0D6B68">裝之前</text>
<text x="222" y="234" text-anchor="middle" font-size="17" fill="#5C6B6B">4 項</text>
<line x1="82" y1="254" x2="363" y2="254" stroke="#0D6B68" stroke-width="2" opacity="0.35"/>
<rect x="84" y="284" width="15" height="15" rx="3" fill="none" stroke="#0D6B68" stroke-width="3"/>
<path d="M 88 291 L 91 295 L 97 287" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="296" font-size="17" fill="#102A2B">資料存在哪個國家</text>
<rect x="84" y="330" width="15" height="15" rx="3" fill="none" stroke="#0D6B68" stroke-width="3"/>
<path d="M 88 337 L 91 341 L 97 333" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="342" font-size="17" fill="#102A2B">留存期間有沒有寫</text>
<rect x="84" y="376" width="15" height="15" rx="3" fill="none" stroke="#0D6B68" stroke-width="3"/>
<path d="M 88 383 L 91 387 L 97 379" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="388" font-size="17" fill="#102A2B">會不會用來訓練</text>
<rect x="84" y="422" width="15" height="15" rx="3" fill="none" stroke="#0D6B68" stroke-width="3"/>
<path d="M 88 429 L 91 433 L 97 425" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="434" font-size="17" fill="#102A2B">商店頁的隱私標示</text>
<rect x="445" y="150" width="325" height="320" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="607" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#2F6F9F">註冊時</text>
<text x="607" y="234" text-anchor="middle" font-size="17" fill="#5C6B6B">3 項</text>
<line x1="467" y1="254" x2="748" y2="254" stroke="#2F6F9F" stroke-width="2" opacity="0.35"/>
<rect x="469" y="284" width="15" height="15" rx="3" fill="none" stroke="#2F6F9F" stroke-width="3"/>
<path d="M 473 291 L 476 295 L 482 287" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="495" y="296" font-size="17" fill="#102A2B">官方寫可以用哪些帳號</text>
<rect x="469" y="330" width="15" height="15" rx="3" fill="none" stroke="#2F6F9F" stroke-width="3"/>
<path d="M 473 337 L 476 341 L 482 333" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="495" y="342" font-size="17" fill="#102A2B">用專用信箱，少用門號</text>
<rect x="469" y="376" width="15" height="15" rx="3" fill="none" stroke="#2F6F9F" stroke-width="3"/>
<path d="M 473 383 L 476 387 L 482 379" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="495" y="388" font-size="17" fill="#102A2B">綁第三方帳號前先看</text>
<rect x="830" y="150" width="325" height="320" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="992" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#D97A2B">使用中</text>
<text x="992" y="234" text-anchor="middle" font-size="17" fill="#5C6B6B">3 項</text>
<line x1="852" y1="254" x2="1133" y2="254" stroke="#D97A2B" stroke-width="2" opacity="0.35"/>
<rect x="854" y="284" width="15" height="15" rx="3" fill="none" stroke="#D97A2B" stroke-width="3"/>
<path d="M 858 291 L 861 295 L 867 287" fill="none" stroke="#D97A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="296" font-size="17" fill="#102A2B">權限只給當下要用的</text>
<rect x="854" y="330" width="15" height="15" rx="3" fill="none" stroke="#D97A2B" stroke-width="3"/>
<path d="M 858 337 L 861 341 L 867 333" fill="none" stroke="#D97A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="342" font-size="17" fill="#102A2B">回頭看實際取用紀錄</text>
<rect x="854" y="376" width="15" height="15" rx="3" fill="none" stroke="#D97A2B" stroke-width="3"/>
<path d="M 858 383 L 861 387 L 867 379" fill="none" stroke="#D97A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="388" font-size="17" fill="#102A2B">個資與公司資料不輸入</text>
<rect x="1215" y="150" width="325" height="320" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1377" y="202" text-anchor="middle" font-size="24" font-weight="700" fill="#2E7D5B">不用了</text>
<text x="1377" y="234" text-anchor="middle" font-size="17" fill="#5C6B6B">3 項</text>
<line x1="1237" y1="254" x2="1518" y2="254" stroke="#2E7D5B" stroke-width="2" opacity="0.35"/>
<rect x="1239" y="284" width="15" height="15" rx="3" fill="none" stroke="#2E7D5B" stroke-width="3"/>
<path d="M 1243 291 L 1246 295 L 1252 287" fill="none" stroke="#2E7D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1265" y="296" font-size="17" fill="#102A2B">先匯出，再刪對話</text>
<rect x="1239" y="330" width="15" height="15" rx="3" fill="none" stroke="#2E7D5B" stroke-width="3"/>
<path d="M 1243 337 L 1246 341 L 1252 333" fill="none" stroke="#2E7D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1265" y="342" font-size="17" fill="#102A2B">退出訓練：開關或寄信</text>
<rect x="1239" y="376" width="15" height="15" rx="3" fill="none" stroke="#2E7D5B" stroke-width="3"/>
<path d="M 1243 383 L 1246 387 L 1252 379" fill="none" stroke="#2E7D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1265" y="388" font-size="17" fill="#102A2B">刪帳號是不可逆的</text>
<line x1="395" y1="310" x2="433" y2="310" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="780" y1="310" x2="818" y2="310" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1165" y1="310" x2="1203" y2="310" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="540" width="720" height="215" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="90" y="586" font-size="20" font-weight="700" fill="#0D6B68">官方文件沒寫的那一格</text>
<text x="90" y="628" font-size="17" fill="#102A2B">就寫「以官網為準」，不要自己補一個數字。</text>
<text x="90" y="662" font-size="17" fill="#102A2B">五家政策都沒有給留存天數，也沒有一家寫</text>
<text x="90" y="696" font-size="17" fill="#102A2B">已經送出去的內容會不會被取回。</text>
<text x="90" y="730" font-size="17" font-weight="700" fill="#B8442D">刪帳號與註銷都是不可逆的動作</text>
<rect x="820" y="540" width="720" height="215" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="850" y="586" font-size="20" font-weight="700" fill="#2F6F9F">個資法第 3 條：不得預先拋棄的五項權利</text>
<text x="850" y="628" font-size="17" fill="#102A2B">查詢或請求閱覽　請求製給複製本</text>
<text x="850" y="662" font-size="17" fill="#102A2B">請求補充或更正　請求停止蒐集、處理或利用</text>
<text x="850" y="696" font-size="17" fill="#102A2B">請求刪除</text>
<text x="850" y="730" font-size="17" font-weight="700" fill="#2F6F9F">寫信要求時，把條號一起寫進去</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>