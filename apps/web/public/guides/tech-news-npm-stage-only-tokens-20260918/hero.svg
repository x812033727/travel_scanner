<title id="title">npm 新增「只送審」權杖：自動化不能直接發版，免 2FA 直接發版預計 2027 年 1 月移除</title><desc id="desc">原創插圖：左邊一把鑰匙形圖案被一個虛線方框圍住，代表送出後暫時停留在待審區；一支箭頭從方框指向中央一個打勾盾牌，代表雙因素驗證核准；另一支箭頭從盾牌指向右側一個上傳中的雲朵圖示，代表核准後才真正上架</desc>
