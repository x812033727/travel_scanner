<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">沖繩四天三夜路線示意圖：那霸、中部、北部、南部 / Okinawa 4-day route</title>
  <desc id="desc">沖繩本島從西南的那霸往東北畫成一條帶狀路線，四天各用一種顏色。第一天青綠色是單軌：那霸機場到國際通，再到首里城，一日券 1,000 日圓可用 24 小時，那霸機場到首里單程 360 日圓，首里城有料區域現行 400 日圓、2026 年 11 月 23 日起 1,000 日圓。第二天紅色是自駕：那霸機場到美濱美國村約 35 分鐘，再到萬座毛，入場 100 日圓。第三天咖啡色是自駕走沖繩自動車道：那霸機場到美麗海水族館約 2 小時，門票成人 2,180 日圓，許田交流道到古宇利大橋約 26 公里、約 40 分鐘，橋長 1,960 公尺免費。第四天綠色是瀨長島 Umikaji Terrace，商店 10:00 到 20:00，再還車回那霸機場。右下角的方框列出各段的官網數字。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">沖繩四天三夜路線：那霸 → 中部 → 北部 → 南部</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Okinawa 4-day route · 第 1 天單軌、第 2 到 4 天自駕 · 2026 年 9 月依各官網查證，車程為官網估計</text>

