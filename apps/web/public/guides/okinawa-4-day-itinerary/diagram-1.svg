  <text x="1042" y="714" font-size="16" fill="#102A2B">許田IC→古宇利大橋 約 26 km・約 40 分・橋長 1,960 m</text>
  <rect x="1004" y="736" width="26" height="8" rx="4" fill="#2E7D5B"/>
  <text x="1042" y="746" font-size="16" fill="#102A2B">第 4 天 自駕：瀬長島 Umikaji Terrace 商店 10:00–20:00</text>
  <text x="1004" y="782" font-size="15" fill="#5C6B6B">第 3 天回那覇或恩納也要抓 2 小時上下；虛線＝單軌，實線＝自駕，車程以導航為準</text>

