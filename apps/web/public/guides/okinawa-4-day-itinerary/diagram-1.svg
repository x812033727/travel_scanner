  <text x="1300" y="168" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">古宇利大橋 Kouri Bridge</text>
  <text x="1300" y="190" font-size="15" fill="#6B4A3A" text-anchor="middle">全長 1,960 m 免費・許田IC から約 26 km、約 40 分</text>

