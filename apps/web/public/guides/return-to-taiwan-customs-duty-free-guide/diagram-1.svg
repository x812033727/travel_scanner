<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">回台灣入境決策樹：檢疫櫃檯、紅線還是綠線 / Arriving in Taiwan: quarantine counter, red or green channel</title>
  <desc id="desc">從行李轉盤出發，依序問五題，答是就往下處理，答否往右走下一題。問題一：有沒有肉類或肉製品，含真空包裝、肉乾、肉鬆、香腸？是就到防檢署檢疫櫃檯申報；非洲豬瘟國家（韓國、港澳、越南、泰國等）的豬肉產品被查到第一次罰 20 萬元、第二次 100 萬元；高溫滅菌罐頭免申報動物檢疫。問題二：有沒有新鮮水果、植物或種子？是就到檢疫櫃檯，新鮮水果不能帶，其他植物產品要申請檢疫，未申請罰 3,000 到 15,000 元。問題三：現金或黃金超過申報門檻嗎？是就走紅線申報，門檻是外幣 1 萬美元、新台幣 10 萬元、人民幣 2 萬元、黃金 2 萬美元，黃金另辦輸入許可，出境門檻一樣。問題四：購物超過 3 萬 5 千元，或酒超過 1.5 公升、菸超過 200 支？是就走紅線，填海關申報單、附購買單據，關稅可按 5%，沒申報被查到可能沒入或罰鍰。問題五：非處方藥超過每種 12 瓶或合計 36 瓶？是就先向食藥署申請專案進口許可證並在入境時申報；處方藥沒處方箋限 2 個月、有處方箋最多 6 個月用量。五題都答否才走綠線，走綠線等於聲明沒有應申報物品，被查到之後不能補報。底部提醒：電子菸不要帶，菸害防制法禁止輸入與使用類菸品。罰鍰單位新台幣，疫區類別以農業部公告為準，2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">領完行李：走檢疫櫃檯、紅線還是綠線（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Back in Taiwan: five questions between the baggage carousel and the Quarantine counter, Red Channel or Green Channel</text>

  <!-- start -->
  <rect x="24" y="118" width="124" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="86" y="176" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">行李轉盤</text>
  <text x="86" y="204" font-size="16" fill="#5C6B6B" text-anchor="middle">Baggage</text>
  <text x="86" y="226" font-size="16" fill="#5C6B6B" text-anchor="middle">Claim</text>
  <path d="M 152 188 L 178 188" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <rect x="184" y="118" width="212" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="290" y="148" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="middle">問題一　Meat</text>
  <text x="290" y="178" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">有肉類或肉製品？</text>
  <text x="290" y="206" font-size="16" fill="#102A2B" text-anchor="middle">含真空包裝、肉乾、</text>
  <text x="290" y="230" font-size="16" fill="#102A2B" text-anchor="middle">肉鬆、香腸</text>
  <path d="M 400 196 L 426 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="413" y="180" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <path d="M 290 262 L 290 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="306" y="284" font-size="16" fill="#5C6B6B">是</text>

  <!-- Q2 -->
  <rect x="432" y="118" width="212" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="538" y="148" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="middle">問題二　Plants</text>
  <text x="538" y="178" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">有新鮮水果、</text>
  <text x="538" y="206" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">植物或種子？</text>
  <text x="538" y="230" font-size="16" fill="#102A2B" text-anchor="middle">Fruit, plants, seeds</text>
  <path d="M 648 196 L 674 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="661" y="180" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <path d="M 538 262 L 538 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="554" y="284" font-size="16" fill="#5C6B6B">是</text>

  <!-- Q3 -->
  <rect x="680" y="118" width="212" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="786" y="148" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="middle">問題三　Cash, gold</text>
  <text x="786" y="178" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">現金或黃金</text>
  <text x="786" y="206" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">超過申報門檻？</text>
  <text x="786" y="230" font-size="16" fill="#102A2B" text-anchor="middle">外幣、台幣、人民幣</text>
  <path d="M 896 196 L 922 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="909" y="180" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <path d="M 786 262 L 786 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="802" y="284" font-size="16" fill="#5C6B6B">是</text>

  <!-- Q4 -->
  <rect x="928" y="118" width="212" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1034" y="148" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="middle">問題四　Shopping</text>
  <text x="1034" y="178" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">購物超過 3 萬 5 千元，</text>
  <text x="1034" y="206" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">或酒超過 1.5 公升、</text>
  <text x="1034" y="232" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">菸超過 200 支？</text>
  <path d="M 1144 196 L 1170 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1157" y="180" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <path d="M 1034 262 L 1034 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1050" y="284" font-size="16" fill="#5C6B6B">是</text>

  <!-- Q5 -->
  <rect x="1176" y="118" width="212" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1282" y="148" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="middle">問題五　Medicine</text>
  <text x="1282" y="178" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">非處方藥超過</text>
  <text x="1282" y="206" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">每種 12 瓶，</text>
  <text x="1282" y="232" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">或合計 36 瓶？</text>
  <path d="M 1392 196 L 1418 196" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1405" y="180" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <path d="M 1282 262 L 1282 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1298" y="284" font-size="16" fill="#5C6B6B">是</text>

  <!-- green channel -->
  <rect x="1424" y="118" width="158" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1503" y="158" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">綠線</text>
  <text x="1503" y="186" font-size="16" fill="#0B4F4D" text-anchor="middle">免申報</text>
  <text x="1503" y="212" font-size="16" fill="#0B4F4D" text-anchor="middle">Green</text>
  <text x="1503" y="234" font-size="16" fill="#0B4F4D" text-anchor="middle">Channel</text>
  <path d="M 1503 262 L 1503 294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- R1 quarantine: meat -->
  <rect x="184" y="300" width="212" height="290" rx="14" fill="#E7F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="290" y="334" font-size="19" font-weight="700" fill="#1F5A40" text-anchor="middle">檢疫櫃檯申報</text>
  <text x="290" y="358" font-size="16" fill="#1F5A40" text-anchor="middle">Quarantine</text>
  <rect x="198" y="374" width="184" height="150" rx="10" fill="#FBE9E4" stroke="#B8442D" stroke-width="2"/>
  <text x="290" y="400" font-size="17" font-weight="700" fill="#B8442D" text-anchor="middle">非洲豬瘟國家</text>
  <text x="290" y="424" font-size="16" fill="#B8442D" text-anchor="middle">韓、港澳、越、泰等</text>
  <text x="290" y="448" font-size="16" fill="#B8442D" text-anchor="middle">豬肉產品</text>
  <text x="290" y="476" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">第一次 20 萬元</text>
  <text x="290" y="504" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">第二次 100 萬元</text>
  <text x="290" y="550" font-size="15" fill="#5C6B6B" text-anchor="middle">高溫滅菌罐頭</text>
  <text x="290" y="572" font-size="15" fill="#5C6B6B" text-anchor="middle">免申報動物檢疫</text>

  <!-- R2 quarantine: plants -->
  <rect x="432" y="300" width="212" height="290" rx="14" fill="#E7F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="538" y="334" font-size="19" font-weight="700" fill="#1F5A40" text-anchor="middle">檢疫櫃檯申報</text>
  <text x="538" y="358" font-size="16" fill="#1F5A40" text-anchor="middle">Quarantine</text>
  <rect x="446" y="374" width="184" height="56" rx="10" fill="#FBE9E4" stroke="#B8442D" stroke-width="2"/>
  <text x="538" y="409" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">新鮮水果不能帶</text>
  <text x="538" y="466" font-size="16" fill="#102A2B" text-anchor="middle">其他植物產品</text>
  <text x="538" y="490" font-size="16" fill="#102A2B" text-anchor="middle">到檢疫櫃檯申請檢疫</text>
  <text x="538" y="528" font-size="16" fill="#102A2B" text-anchor="middle">未申請罰</text>
  <text x="538" y="556" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">3,000 到 15,000 元</text>

  <!-- R3 red: cash and gold -->
  <rect x="680" y="300" width="212" height="290" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="786" y="334" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">紅線申報</text>
  <text x="786" y="358" font-size="16" fill="#8A2E1D" text-anchor="middle">Red Channel</text>
  <text x="786" y="396" font-size="17" fill="#102A2B" text-anchor="middle">外幣 1 萬美元</text>
  <text x="786" y="424" font-size="17" fill="#102A2B" text-anchor="middle">新台幣 10 萬元</text>
  <text x="786" y="452" font-size="17" fill="#102A2B" text-anchor="middle">人民幣 2 萬元</text>
  <text x="786" y="480" font-size="17" fill="#102A2B" text-anchor="middle">黃金 2 萬美元</text>
  <text x="786" y="522" font-size="15" fill="#5C6B6B" text-anchor="middle">黃金另辦輸入許可</text>
  <text x="786" y="548" font-size="15" font-weight="700" fill="#5C6B6B" text-anchor="middle">出境門檻也一樣</text>

  <!-- R4 red: shopping, alcohol, tobacco -->
  <rect x="928" y="300" width="212" height="290" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1034" y="334" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">紅線申報</text>
  <text x="1034" y="358" font-size="16" fill="#8A2E1D" text-anchor="middle">Red Channel</text>
  <text x="1034" y="396" font-size="17" fill="#102A2B" text-anchor="middle">填海關申報單</text>
  <text x="1034" y="424" font-size="17" fill="#102A2B" text-anchor="middle">附購買單據</text>
  <text x="1034" y="452" font-size="17" fill="#102A2B" text-anchor="middle">關稅可按 5%</text>
  <text x="1034" y="522" font-size="15" fill="#5C6B6B" text-anchor="middle">沒申報被查到</text>
  <text x="1034" y="548" font-size="15" fill="#5C6B6B" text-anchor="middle">可能沒入或罰鍰</text>

  <!-- R5 red: medicine -->
  <rect x="1176" y="300" width="212" height="290" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1282" y="334" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">紅線申報</text>
  <text x="1282" y="358" font-size="16" fill="#8A2E1D" text-anchor="middle">Red Channel</text>
  <text x="1282" y="396" font-size="17" fill="#102A2B" text-anchor="middle">先向食藥署申請</text>
  <text x="1282" y="424" font-size="17" fill="#102A2B" text-anchor="middle">專案進口許可證</text>
  <text x="1282" y="452" font-size="17" fill="#102A2B" text-anchor="middle">入境時申報</text>
  <text x="1282" y="522" font-size="15" fill="#5C6B6B" text-anchor="middle">處方藥沒處方箋</text>
  <text x="1282" y="548" font-size="15" fill="#5C6B6B" text-anchor="middle">限 2 個月、有 6 個月</text>

  <!-- green channel note -->
  <rect x="1424" y="300" width="158" height="290" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="1503" y="336" font-size="16" font-weight="700" fill="#4E3428" text-anchor="middle">五題都答否</text>
  <text x="1503" y="380" font-size="16" fill="#4E3428" text-anchor="middle">走綠線等於</text>
  <text x="1503" y="406" font-size="16" fill="#4E3428" text-anchor="middle">聲明沒有</text>
  <text x="1503" y="432" font-size="16" fill="#4E3428" text-anchor="middle">應申報物品</text>
  <text x="1503" y="480" font-size="16" font-weight="700" fill="#4E3428" text-anchor="middle">被查到之後</text>
  <text x="1503" y="506" font-size="16" font-weight="700" fill="#4E3428" text-anchor="middle">不能補報</text>

  <!-- e-cigarette band -->
  <rect x="24" y="636" width="1558" height="60" rx="14" fill="#B8442D"/>
  <text x="803" y="674" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">電子菸不要帶：菸害防制法禁止輸入、使用類菸品　E-cigarettes: do not bring them</text>

  <text x="60" y="760" font-size="16" fill="#5C6B6B">罰鍰單位新台幣，疫區類別以農業部最新公告為準；非洲豬瘟國家名單是防檢署 2026 年 4 月 22 日版，新加坡已刪除，但肉製品一樣要申報。</text>
  <text x="60" y="792" font-size="16" fill="#5C6B6B">依據：入境旅客攜帶行李物品報驗稅放辦法（2026 年 2 月 1 日施行）、關務署臺北關、防檢署，2026 年 9 月查證；拿不準要不要申報，就走紅線問。</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
