<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>새 3C 기기를 사기 전에 요구 사항부터: 실제 문제, 호환성, 수리와 처분 비용까지: 판단 순서</title><desc>실제 문제 적기, 필수 조건 정리, 근거 확인, 수령 후 검증 순으로 확인합니다. 편집부가 정리한 내용으로, 지도나 실측 소요 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 단계</text><text x="100" y="175" fill="#576968" font-size="25">자신의 조건에 맞게 선택하고 한 번에 모두 끝내려 하지 마세요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">실제 문제 적기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">문제 명확히 하기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">제품보다 필요부터</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">필수 조건 정리</text><text x="473" y="497" fill="#f4f0e5" font-size="23">요구 사항 정하기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">없으면 안 되는 것은?</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">근거 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">증거 살펴보기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">호환성·수리·비용</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">수령 후 검증</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">실제 용도로 시험</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">정말 맞는지 확인</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 설명도</text></g></svg>
