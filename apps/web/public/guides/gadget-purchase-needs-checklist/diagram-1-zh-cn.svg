<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>买新 3C 前先写需求：从真实问题、兼容性到维修与退出使用的成本：判断流程</title><desc>依次检查：写实际问题、列必要条件、核对证据、到货验证。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用流程</text><text x="100" y="175" fill="#576968" font-size="25">依你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">写实际问题</text><text x="103" y="497" fill="#f4f0e5" font-size="23">明确真正的问题</text><text x="103" y="573" fill="#f4dc9d" font-size="26">需求先于产品</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">列必要条件</text><text x="473" y="497" fill="#f4f0e5" font-size="23">设定必要要求</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不能缺的是什么</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">核对证据</text><text x="843" y="497" fill="#f4f0e5" font-size="23">查验支持依据</text><text x="843" y="573" fill="#f4dc9d" font-size="26">兼容、维修、成本</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">到货验证</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">按实际用途测试</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">确认真的适合</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意图</text></g></svg>
