<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Before buying new electronics (3C): define your needs, check compatibility, and consider repair and end-of-use costs: decision sequence</title><desc>Check in this order: define the actual problem, list essential requirements, check the evidence, and test on arrival. Editorial guidance, not a map or measured timing.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Arial, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Step by step · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what fits your situation; you do not have to do everything at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="32.5" font-weight="700">Define the problem</text><text x="103" y="497" fill="#f4f0e5" font-size="23">State the actual issue</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Needs before products</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">Set requirements</text><text x="473" y="497" fill="#f4f0e5" font-size="23">List your must-haves</text><text x="473" y="573" fill="#f4dc9d" font-size="26">What cannot be missing?</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="31.5" font-weight="700">Check the evidence</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Verify supporting facts</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Compatibility, repair, cost</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Test on arrival</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Test your use case</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Confirm it really suits you</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Original editorial diagram</text></g></svg>
