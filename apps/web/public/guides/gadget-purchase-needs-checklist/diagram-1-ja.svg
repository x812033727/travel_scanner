<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>新しい3C機器を買う前に必要条件を書き出す：実際の困り事、互換性、修理と手放す際のコストまで：判断の流れ</title><desc>実際の問題を書く、必須条件を挙げる、根拠を確認する、届いたら検証する、の順に確認します。編集部による整理であり、地図や所要時間の実測ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">取り組む順序 · 実践の流れ</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくてもよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">実際の問題を書く</text><text x="103" y="497" fill="#f4f0e5" font-size="23">困り事を明確に</text><text x="103" y="573" fill="#f4dc9d" font-size="26">製品より先に必要性</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">必須条件を挙げる</text><text x="473" y="497" fill="#f4f0e5" font-size="23">必要条件を決める</text><text x="473" y="573" fill="#f4dc9d" font-size="26">欠かせないものは？</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">根拠を確認する</text><text x="843" y="497" fill="#f4f0e5" font-size="23">裏付けを確かめる</text><text x="843" y="573" fill="#f4dc9d" font-size="26">互換性・修理・費用</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">届いたら検証する</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">自分の用途で試す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">本当に合うか確認</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図</text></g></svg>
