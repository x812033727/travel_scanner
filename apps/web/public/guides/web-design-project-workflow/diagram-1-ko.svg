<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">요구사항부터 웹사이트 인계까지</title><desc id="desc">요구사항, 콘텐츠, 프로토타입, 제작, 검수, 인계를 보여 주는 여섯 개의 카드. 웹사이트를 완성하려면 서로 다른 작업 결과물을 연결해야 함을 설명한다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">요구사항부터 웹사이트 인계까지</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">각 단계에 확인 가능한 결과물을 남기고, 문제가 있으면 돌아가 수정한다</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">요구사항</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">누가 무엇을 마칠까</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">범위·조건 명시</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">콘텐츠</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">본문·소재 완비</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">검토·허가 증빙</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">프로토타입</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">화면 관계 먼저 확인</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">작업 흐름 먼저 관찰</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">제작</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">구성 요소 상태 완비</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">모바일 조작 가능</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">검수</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">사용자·관리자 결과 대조</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">결함 수정 기록</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">인계</text>
<text x="1088" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">계정·문서 전달</text>
<text x="1088" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">업데이트·관리 담당</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">주요 작업부터 수행 가능하게 하고, 시각·기술·후속 유지 관리가 모두 이어지는지 확인한다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
