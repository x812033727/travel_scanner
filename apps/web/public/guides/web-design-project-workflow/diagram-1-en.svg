<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">From Requirements to Website Handover</title><desc id="desc">Six cards show requirements, content, prototyping, building, acceptance testing, and handover, illustrating how completing a website requires connecting each stage's deliverables.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">From Requirements to Website Handover</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Leave verifiable results at each stage; revisit and fix problems</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Requirements</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Who needs to do what</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Define scope and criteria</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Content</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Complete text and assets</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Document review and rights</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Prototype</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Confirm screen links first</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Observe task flow first</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Build</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Define all component states</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Make mobile use work</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Acceptance</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Check front/back-end results</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Record defect fixes</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Handover</text>
<text x="1088" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Deliver accounts and documents</text>
<text x="1088" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Assign updates and maintenance</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">First make the main task work, then confirm that the visuals, technology, and ongoing maintenance fit together.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphics by Mokaair</text>
</svg>
