<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">从需求到网站交接</title><desc id="desc">六张卡片展示需求、内容、原型、制作、验收及交接，说明完成网站需要衔接不同工作成果。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">从需求到网站交接</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">每一阶段都留下可检查的成果，发现问题就回头修正</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">需求</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">谁要完成什么</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">范围条件写清楚</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">内容</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">正文与素材齐全</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">审阅及授权有据</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">原型</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">界面关系先确认</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">任务流程先观察</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">制作</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">组件状态要完整</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">手机操作能完成</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">验收</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">前后台结果核对</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">缺陷修正留记录</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">交接</text>
<text x="1088" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">账号与文档交付</text>
<text x="1088" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">更新维护有人管</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先让主要任务能够完成，再确认视觉、技术与后续维护都接得上。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
