<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">要件からサイトの引き継ぎまで</title><desc id="desc">六枚のカードで、要件、コンテンツ、プロトタイプ、制作、検収、引き継ぎを示し、サイトの完成には各作業の成果をつなぐ必要があることを説明しています。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">要件からサイトの引き継ぎまで</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">各段階で検証できる成果を残し、問題があれば戻って修正</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">要件</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">誰が何を達成するか</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">範囲・条件を明記</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">コンテンツ</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">本文と素材を揃える</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">レビュー・許諾を記録</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">試作</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">画面関係を先に確認</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">タスク手順を先に観察</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">制作</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">部品の状態を網羅</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">スマホで操作できる</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">検収</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">画面・管理側の結果照合</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">不具合修正を記録</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">引き継ぎ</text>
<text x="1088" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">アカウント・文書を渡す</text>
<text x="1088" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">更新・保守の担当を置く</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">まず主要なタスクを完了できるようにし、その後にビジュアル、技術、今後の保守がつながるか確認します。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル作図</text>
</svg>
