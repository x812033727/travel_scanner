<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">生成式 AI圖解 / Generative AI</title><desc id="desc">活動事實與可變風格分成兩路進入生成模型，產物再分別接受事實核對與呈現檢查，形成可確認的草稿。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">把固定事實與創意空間分開送入生成</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Generative AI</text><rect x="100" y="200" width="420" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="310" y="287" text-anchor="middle" font-size="36" fill="#102A2B">固定：日期與規則</text><rect x="100" y="500" width="420" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="310" y="587" text-anchor="middle" font-size="36" fill="#102A2B">可變：風格與構圖</text><path d="M 520 275 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="680" cy="420" r="10" fill="#0D6B68"/><path d="M 520 575 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="680" cy="420" r="10" fill="#0D6B68"/><rect x="680" y="320" width="340" height="200" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="850" y="432" text-anchor="middle" font-size="36" fill="#102A2B">生成候選內容</text><path d="M 1020 420 H 1080 M 1080 275 V 575 M 1080 275 H 1160 M 1080 575 H 1160" stroke="#0D6B68" stroke-width="9" fill="none"/><rect x="1160" y="200" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="287" text-anchor="middle" font-size="36" fill="#102A2B">事實核對</text><rect x="1160" y="500" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="587" text-anchor="middle" font-size="36" fill="#102A2B">呈現檢查</text><text x="800" y="780" text-anchor="middle" font-size="32" fill="#102A2B">草稿是否可用，由任務與證據決定</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
