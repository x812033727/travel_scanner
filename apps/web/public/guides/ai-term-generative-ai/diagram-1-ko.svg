<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">생성형 AI 도해 / Generative AI</title><desc id="desc">행사 관련 사실과 바꿀 수 있는 스타일을 두 경로로 나누어 생성 모델에 입력하고, 결과물에 사실 확인과 표현 검토를 각각 진행해 확인 가능한 초안을 만든다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">고정 사실과 창작 영역을 나눠 생성에 입력</text><text x="60" y="84" fill="#5C6B6B" font-size="18">생성형 AI</text><rect x="100" y="200" width="420" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="310" y="287" text-anchor="middle" font-size="36" fill="#102A2B">고정: 날짜와 규칙</text><rect x="100" y="500" width="420" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="310" y="587" text-anchor="middle" font-size="36" fill="#102A2B">가변: 스타일과 구도</text><path d="M 520 275 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="680" cy="420" r="10" fill="#0D6B68" /><path d="M 520 575 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="680" cy="420" r="10" fill="#0D6B68" /><rect x="680" y="320" width="340" height="200" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="850" y="432" text-anchor="middle" font-size="36" fill="#102A2B">후보 콘텐츠 생성</text><path d="M 1020 420 H 1080 M 1080 275 V 575 M 1080 275 H 1160 M 1080 575 H 1160" stroke="#0D6B68" stroke-width="9" fill="none" /><rect x="1160" y="200" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1335" y="287" text-anchor="middle" font-size="36" fill="#102A2B">사실 확인</text><rect x="1160" y="500" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1335" y="587" text-anchor="middle" font-size="36" fill="#102A2B">표현 검토</text><text x="800" y="780" text-anchor="middle" font-size="32" fill="#102A2B">초안의 사용 가능 여부는 작업과 근거로 판단</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도해 제작 2026</text></svg>
