<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">生成AIの図解 / Generative AI</title><desc id="desc">イベントの事実情報と変更可能なスタイルを二つの経路に分けて生成モデルへ入力し、出力を事実照合と見せ方の確認にそれぞれかけ、確認可能な草稿にする。</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">固定する事実と創作の余地を分けて入力</text><text x="60" y="84" fill="#5C6B6B" font-size="18">生成AI</text><rect x="100" y="200" width="420" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="310" y="287" text-anchor="middle" font-size="36" fill="#102A2B">固定：日付とルール</text><rect x="100" y="500" width="420" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="310" y="587" text-anchor="middle" font-size="36" fill="#102A2B">可変：スタイルと構図</text><path d="M 520 275 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="680" cy="420" r="10" fill="#0D6B68"></circle><path d="M 520 575 L 680 420" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="680" cy="420" r="10" fill="#0D6B68"></circle><rect x="680" y="320" width="340" height="200" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="850" y="432" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">候補コンテンツを生成</text><path d="M 1020 420 H 1080 M 1080 275 V 575 M 1080 275 H 1160 M 1080 575 H 1160" stroke="#0D6B68" stroke-width="9" fill="none"></path><rect x="1160" y="200" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1335" y="287" text-anchor="middle" font-size="36" fill="#102A2B">事実照合</text><rect x="1160" y="500" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1335" y="587" text-anchor="middle" font-size="36" fill="#102A2B">見せ方の確認</text><text x="800" y="780" text-anchor="middle" font-size="32" fill="#102A2B">草稿が使えるかは、作業の要件と根拠で決まる</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
