<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北到台中、日月潭的路線與日月潭環湖示意圖</title>
  <desc id="desc">左半部是路線：台北車站搭高鐵到高鐵臺中站約 50 分、NT$700；高鐵臺中站搭台鐵區間車到臺中車站約 15 分；台中干城站與臺中車站搭南投客運 6670（虛線）到日月潭水社約 90 分、NT$193，高鐵臺中站上車 NT$166；臺中車站搭 309 公車到高美濕地。右半部是日月潭：水社、向山、玄光寺、伊達邵四個點，遊湖船逆時針 09:00 到 17:00 每 15 到 20 分一班、一日票約 NT$300，環湖巴士 6669 一日券 NT$80，纜車從伊達邵到九族文化村 7 分鐘、來回 NT$420、每月第一個週三保養，向山段自行車道 09:00 到 17:00。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="64" font-size="36" font-weight="700" fill="#102A2B">台北 → 台中 → 日月潭　兩天一夜路線圖</text>
  <text x="60" y="98" font-size="20" font-weight="700" fill="#5C6B6B">Taipei → Taichung → Sun Moon Lake · 示意圖，非精確比例 · 票價為成人單程，2026 年 9 月查證</text>

