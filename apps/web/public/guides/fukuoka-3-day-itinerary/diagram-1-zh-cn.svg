<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">福冈三天路线示意图：福冈机场、博多、天神、太宰府、柳川、门司港 / 福冈 3 日路线图</title>
  <desc id="desc">地铁空港线从左到右串起大濠公园、天神、博多与福冈机场：大濠公园到天神 2 站 210 日元，天神到博多 3 站 210 日元，博多到福冈机场 2 站 260 日元，天神到福冈机场 260 日元。西铁天神大牟田线从天神往南到西铁二日市，换乘太宰府线约 6 分钟到太宰府，全程约 35 分钟、480 日元，二日市到太宰府有不加价的观光列车旅人；天神大牟田线继续往南到西铁柳川，960 日元。JR 鹿儿岛本线从博多往东北到小仓，再到门司港，博多出发约 1 小时 30 分钟，小仓到门司港约 15 分钟。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">福冈 3 日路线图　福冈机场・博多・天神・太宰府・柳川・门司港</text>
  <text x="80" y="120" font-size="22" fill="#5C6B6B">福冈 3 日路线图 · 2026 年 9 月据官网核实，西铁票价为 2026 年 4 月调整后价格，地铁采用 2026 年 4 月 1 日版票价表</text>


