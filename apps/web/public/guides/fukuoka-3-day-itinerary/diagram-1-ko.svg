<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">후쿠오카 사흘 코스 안내도: 후쿠오카 공항·하카타·텐진·다자이후·야나가와·모지코 / 후쿠오카 3일 노선도</title>
  <desc id="desc">지하철 공항선은 왼쪽에서 오른쪽으로 오호리 공원·텐진·하카타·후쿠오카 공항을 잇는다. 오호리 공원~텐진은 2정거장 210엔, 텐진~하카타는 3정거장 210엔, 하카타~후쿠오카 공항은 2정거장 260엔, 텐진~후쿠오카 공항은 260엔이다. 니시테쓰 텐진오무타선으로 텐진에서 남쪽 니시테쓰 후쓰카이치까지 간 뒤 다자이후선으로 갈아타면 약 6분 만에 다자이후에 도착한다. 전체 소요 시간은 약 35분, 요금은 480엔이며, 후쓰카이치~다자이후 구간에는 추가 요금 없는 관광열차 다비토(旅人)가 운행한다. 텐진오무타선을 따라 더 남쪽으로 가면 니시테쓰 야나가와이며, 요금은 960엔이다. JR 가고시마 본선은 하카타에서 북동쪽 고쿠라를 거쳐 모지코로 이어진다. 하카타에서 약 1시간 30분, 고쿠라~모지코는 약 15분이 걸린다.</desc>
