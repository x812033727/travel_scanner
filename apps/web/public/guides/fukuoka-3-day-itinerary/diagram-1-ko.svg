  <text x="80" y="120" font-size="22" fill="#5C6B6B">후쿠오카 3일 노선도 · 2026년 9월 공식 사이트 확인, 니시테쓰는 2026년 4월 개정 요금, 지하철은 2026년 4월 1일판 요금표 기준</text>


