<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">福岡三日間のルート図：福岡空港・博多・天神・太宰府・柳川・門司港／福岡3日間ルートマップ</title>
  <desc id="desc">地下鉄空港線は左から右へ大濠公園・天神・博多・福岡空港を結びます。大濠公園から天神は2駅210円、天神から博多は3駅210円、博多から福岡空港は2駅260円、天神から福岡空港は260円です。西鉄天神大牟田線で天神から南へ西鉄二日市に向かい、太宰府線に乗り換えて約6分で太宰府へ。全行程は約35分、480円です。二日市〜太宰府には追加料金なしの観光列車「旅人」が走ります。天神大牟田線をさらに南へ進むと西鉄柳川で、運賃は960円です。JR鹿児島本線は博多から北東へ小倉を経て門司港に向かい、博多から約1時間30分、小倉から門司港までは約15分です。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">福岡 3 日間ルート図　福岡空港・博多・天神・太宰府・柳川・門司港</text>
  <text x="80" y="120" font-size="22" fill="#5C6B6B">福岡 3 日間ルート図 · 2026 年 9 月に公式サイトで確認。西鉄は 2026 年 4 月改定後、地下鉄は 2026 年 4 月 1 日版運賃表</text>


