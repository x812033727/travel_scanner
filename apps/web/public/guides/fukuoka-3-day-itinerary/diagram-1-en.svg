<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Fukuoka three-day route map: Fukuoka Airport, Hakata, Tenjin, Dazaifu, Yanagawa and Mojiko / Fukuoka 3-day route map</title>
  <desc id="desc">From left to right, the subway Airport Line links Ohori Park, Tenjin, Hakata and Fukuoka Airport: Ohori Park to Tenjin is 2 stops and 210 yen; Tenjin to Hakata is 3 stops and 210 yen; Hakata to Fukuoka Airport is 2 stops and 260 yen; Tenjin to Fukuoka Airport costs 260 yen. The Nishitetsu Tenjin-Omuta Line runs south from Tenjin to Nishitetsu-Futsukaichi, where a transfer to the Dazaifu Line brings you to Dazaifu in about 6 minutes. The full journey takes about 35 minutes and costs 480 yen. The Tabito sightseeing train runs between Futsukaichi and Dazaifu at no extra charge. The Tenjin-Omuta Line continues south to Nishitetsu-Yanagawa, costing 960 yen. The JR Kagoshima Main Line runs northeast from Hakata to Kokura and onward to Mojiko, taking about 1 hour 30 minutes from Hakata and about 15 minutes from Kokura to Mojiko.</desc>
