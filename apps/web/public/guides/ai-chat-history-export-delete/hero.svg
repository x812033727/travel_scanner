  <path d="M 296 334 L 330 292 L 364 334 Z" fill="#0D6B68"/>

  <rect x="215" y="420" width="230" height="172" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="247" y="452" width="166" height="16" rx="8" fill="#E3F0EF"/>
