<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">匯出、刪除、保留期 / Export, delete, retention</title>
  <desc id="desc">一張幾何插圖：左邊一個白色圓角方盒，裡面有三條橫線代表對話記錄，一支粗箭頭從盒子往上送出一張文件，代表匯出；中間一條虛線連到一個圓，圓裡有一根粗橫桿，上方三顆由大到小的圓點正在淡出，代表刪除；右邊另一條虛線連到一個圓形時鐘，有刻度與兩根指針，代表刪除後官方寫的保留期。畫面四角散落幾顆彩色圓點，下方一行字寫著匯出、刪除、保留期。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <circle cx="140" cy="190" r="14" fill="#D97A2B"/>
  <circle cx="1460" cy="200" r="22" fill="#0D6B68" opacity="0.45"/>
