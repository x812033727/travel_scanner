<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">泰國上網決策樹：旅客 eSIM、台灣電信漫遊、WiFi 分享器或機場實體 SIM / How to get online in Thailand</title>
  <desc id="desc">三個問題。問題一：手機支援 eSIM 且已解鎖，想落地就能叫 Grab 嗎？是就買旅客 eSIM，AIS eSIM 399 泰銖起，True 與第三方以官網為準，出發前掃 QR Code 裝好、落地開數據漫遊。否就問題二：只待 5 天以內、流量不大，要用台灣門號收簡訊驗證碼嗎？是就開台灣電信漫遊，台灣大哥大東南亞型 129 元／日起、中華電信東南亞定量型 15 天 1GB 149 元起，原機原號不用換卡。否就問題三：3 人以上同行，或要開熱點給筆電嗎？是就租 WiFi 分享器，桃園機場取還、按天計費，或一張吃到飽 SIM 開熱點分給同伴；否就到機場櫃台買實體旅客 SIM，True 8 天 449 泰銖，AIS 有 5、8、15、30、60 天，櫃台 24 小時，帶護照本人登記。補充：NBTC 的 SIM 登記規定是護照本人到場、每家電信最多 3 張、旅客 SIM 最長 60 天且到期不能靠儲值延長，線上買 eSIM 也要上傳護照；流量估算是地圖與通訊一天幾百 MB、社群與傳照片一天 1GB 上下、影片與開熱點一天 3GB 以上就選吃到飽。價格為 2026 年 9 月 13 日官網查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">泰國上網怎麼選：三個問題選出方式（2026 年 9 月 13 日查證價格）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">How to get online in Thailand: tourist eSIM, Taiwan roaming, pocket WiFi or an airport SIM</text>

  <!-- Q1 -->
  <polygon points="800,120 1130,175 800,230 470,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="170" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　手機支援 eSIM 且已解鎖，</text>
  <text x="800" y="196" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">想落地開機就能叫 Grab 嗎？</text>
  <path d="M 1130 175 L 1156 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="165" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="122" width="410" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1365" y="152" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">旅客 eSIM　อีซิม eSIM</text>
  <text x="1365" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">AIS eSIM 399 泰銖起；True、第三方以官網為準</text>
  <text x="1365" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">出發前掃 QR Code 裝好，落地開數據漫遊</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="258" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,275 1130,330 800,385 470,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="325" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　只待 5 天以內、流量不大，</text>
  <text x="800" y="351" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">要用台灣門號收簡訊驗證碼？</text>
  <path d="M 1130 330 L 1156 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="320" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="277" width="410" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1365" y="307" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">台灣電信漫遊　โรมมิ่ง Roaming</text>
  <text x="1365" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">台灣大哥大 東南亞型 129 元／日起，原機原號</text>
  <text x="1365" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">中華電信 東南亞定量型 15 天 1GB 149 元起</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="413" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="800,430 1130,485 800,540 470,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="480" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　3 人以上一起走，</text>
  <text x="800" y="506" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">或要開熱點給筆電、平板？</text>
  <path d="M 1130 485 L 1156 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="475" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="432" width="410" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1365" y="462" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">WiFi 分享器　พ็อกเก็ตไวไฟ Pocket WiFi</text>
  <text x="1365" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">桃園機場取還，按天計費、要充電、要歸還</text>
  <text x="1365" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">或一張吃到飽 SIM 開熱點分給同伴</text>
  <path d="M 470 485 L 444 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="452" y="475" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="432" width="410" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="235" y="462" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">機場旅客 SIM　ซิมท่องเที่ยว Tourist SIM</text>
  <text x="235" y="488" font-size="15" fill="#4E3428" text-anchor="middle">True 8 天 449 泰銖；AIS 5／8／15／30／60 天</text>
  <text x="235" y="514" font-size="15" fill="#4E3428" text-anchor="middle">櫃台 24 小時，帶護照本人登記</text>

  <!-- notes -->
  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">SIM 實名登記　ลงทะเบียนซิม SIM registration（NBTC）</text>
  <text x="88" y="652" font-size="16" fill="#102A2B">護照本人到場；每家電信最多 3 張；旅客 SIM 最長 60 天</text>
  <text x="88" y="682" font-size="16" fill="#102A2B">到期不能靠儲值延長，要重新登記；線上買 eSIM 也要上傳護照</text>
  <text x="88" y="712" font-size="16" fill="#102A2B">7-Eleven 可儲值，買 SIM 一樣要登記；第一張卡在機場櫃台買最省事</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">流量估算　Data per day（經驗值，不是官方數字）</text>
  <text x="848" y="652" font-size="16" fill="#102A2B">只開地圖導航與通訊軟體：一天幾百 MB</text>
  <text x="848" y="682" font-size="16" fill="#102A2B">社群、傳照片、偶爾看影片：一天 1GB 上下</text>
  <text x="848" y="712" font-size="16" fill="#102A2B">整天看影片或開熱點給筆電：一天 3GB 以上，直接選吃到飽</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">價格為 2026 年 9 月 13 日在 True、AIS、中華電信、台灣大哥大官網查證；泰銖與新台幣價格都會變，出發前再看一次官網。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">素萬那普 สนามบินสุวรรณภูมิ Suvarnabhumi 入境大廳（主航廈 2 樓）與廊曼 ดอนเมือง Don Mueang 第 1 航廈入境大廳都有 AIS、True 櫃台。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
