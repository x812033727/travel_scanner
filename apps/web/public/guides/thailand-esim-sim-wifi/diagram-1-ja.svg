<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Yu Gothic',Arial,system-ui,sans-serif">
  <title id="title">タイの通信手段：3つの質問で選ぶ</title>
  <desc id="desc">3つの質問。質問1：SIMロック解除済みの端末がeSIMに対応し、到着後すぐGrabを呼びたいですか。はいなら旅行者eSIM。AIS eSIMは399バーツから、Trueと第三者は公式サイトで確認し、出発前にQRコードを読み込んで、到着後にデータローミングをオンにします。いいえなら質問2：滞在は5日以内で通信量は少なく、台湾の電話番号で認証SMSを受ける必要がありますか。はいなら台湾キャリアのローミング。台湾大哥大の東南アジアプランは1日129台湾ドルから、中華電信の東南アジア定量プランは15日間1GBが149台湾ドルからで、SIM交換なしで台湾番号を使えます。いいえなら質問3：3人以上の同行、またはノートPCへテザリングしますか。はいなら桃園空港で受け取り・返却する日額制WiFiルーター、または1枚のデータ無制限SIMをホットスポットとして共有します。いいえなら空港カウンターで物理旅行者SIM。Trueは8日間449バーツ、AISは5、8、15、30、60日。カウンターは24時間営業で、パスポート名義人本人が登録します。NBTC規則：本人がパスポートを持参し、1通信会社につき最大3回線、旅行者SIMの有効期間は最長60日で、期限後はチャージで延長できません。オンラインeSIMもパスポートのアップロードが必要です。通信量の目安は、地図とメッセージが1日数百MB、SNSと写真送信が1日あたり約1GB、動画視聴やテザリングが1日3GB以上なので無制限を選びます。料金は2026年9月13日に公式サイトで確認。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">タイの通信手段：3つの質問で選ぶ（料金は2026年9月13日確認）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">旅行者eSIM・台湾キャリアのローミング・WiFiルーター・空港の旅行者SIM</text>


  <polygon points="800,120 1130,175 800,230 470,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="170" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問1　ロック解除済みでeSIM対応、</text>
  <text x="800" y="196" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">かつ到着後すぐGrabを呼びたいですか？</text>
  <path d="M 1130 175 L 1156 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1134" y="165" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="1160" y="122" width="410" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1365" y="152" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">旅行者eSIM　อีซิม eSIM</text>
  <text x="1365" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">AIS eSIM 399バーツ～・True／第三者は公式サイトで確認</text>
  <text x="1365" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">出発前にQRで設定・到着後データローミングをオン</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="258" font-size="16" fill="#5C6B6B">いいえ</text>


  <polygon points="800,275 1130,330 800,385 470,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="325" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問2　5日以内で通信量が少なく、</text>
  <text x="800" y="351" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">かつ台湾番号で認証SMSが必要ですか？</text>
  <path d="M 1130 330 L 1134 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1133" y="320" font-size="16" fill="#5C6B6B" text-anchor="end">はい</text>
  <rect x="1138" y="277" width="460" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1369" y="307" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">台湾キャリアのローミング　โรมมิ่ง Roaming</text>
  <text x="1369" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">台湾大哥大・東南アジア：1日129台湾ドル～・同じ端末・番号</text>
  <text x="1369" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">中華電信・東南アジア定量プラン：15日1GB・149台湾ドル～</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="413" font-size="16" fill="#5C6B6B">いいえ</text>


  <polygon points="800,430 1130,485 800,540 470,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="480" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問3　3人以上ですか？それとも</text>
  <text x="800" y="506" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">ノートPC／タブレットにテザリング？</text>
  <path d="M 1130 485 L 1156 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1134" y="475" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="1160" y="432" width="410" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="1365" y="462" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">WiFiルーター　พ็อกเก็ตไวไฟ</text>
  <text x="1365" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">桃園空港で受取・返却・日額制・充電が必要</text>
  <text x="1365" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">またはデータ無制限SIMをホットスポットで共有</text>
  <path d="M 470 485 L 444 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="448" y="465" font-size="16" fill="#5C6B6B" text-anchor="start">いいえ</text>
  <rect x="30" y="432" width="410" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4" />
  <text x="235" y="462" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">空港の旅行者SIM　ซิมท่องเที่ยว</text>
  <text x="235" y="488" font-size="15" fill="#4E3428" text-anchor="middle">True：8日449バーツ・AIS：5／8／15／30／60日</text>
  <text x="235" y="514" font-size="15" fill="#4E3428" text-anchor="middle">カウンターは24時間・パスポート名義人本人が登録</text>


  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3" />
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">SIM実名登録　ลงทะเบียนซิม（NBTC）</text>
  <text x="88" y="652" font-size="16" fill="#102A2B">本人がパスポートを持参・1社最大3回線・旅行者SIMは最長60日</text>
  <text x="88" y="682" font-size="16" fill="#102A2B">期限後はチャージで延長不可・再登録・eSIMもパスポートをアップロード</text>
  <text x="88" y="712" font-size="16" fill="#102A2B">7-Elevenでチャージ可・SIMも要登録・最初のSIMは空港カウンターが簡単</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3" />
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">1日の通信量目安（経験値であり、公式の数値ではありません）</text>
  <text x="848" y="652" font-size="16" fill="#102A2B">地図とメッセージのみ：1日数百MB</text>
  <text x="848" y="682" font-size="16" fill="#102A2B">SNS・写真送信・時々の動画：1日あたり約1GB</text>
  <text x="848" y="712" font-size="16" fill="#102A2B">終日の動画視聴やノートPCへのテザリング：1日3GB以上・無制限を選ぶ</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">タイバーツ（THB）と台湾ドル（TWD）の料金は2026年9月13日にTrue・AIS・中華電信・台湾大哥大の公式サイトで確認。変動するため出発前に再確認。</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">スワンナプーム สนามบินสุวรรณภูมิ 到着：メインターミナル2階・ドンムアン ดอนเมือง 国際線到着：第1ターミナル・AIS／Trueカウンターあり。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製図 2026</text>
</svg>
