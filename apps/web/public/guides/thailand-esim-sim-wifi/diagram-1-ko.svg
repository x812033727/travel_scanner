<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic',Arial,system-ui,sans-serif">
  <title id="title">태국 인터넷: 세 가지 질문으로 선택</title>
  <desc id="desc">세 가지 질문. 질문 1: 잠금 해제된 휴대전화가 eSIM을 지원하고 도착 즉시 Grab을 부르고 싶나요? 그렇다면 여행자 eSIM을 고릅니다. AIS eSIM은 THB 399부터이며 True와 제3자 상품 가격은 공식 사이트에서 확인합니다. 출발 전에 QR 코드를 읽어 설치하고 도착 후 데이터 로밍을 켭니다. 아니라면 질문 2: 체류 기간이 5일 이내이고 데이터 사용량이 적으며 대만 전화번호로 인증 SMS를 받아야 하나요? 그렇다면 대만 통신사 로밍을 씁니다. 타이완 모바일 동남아 요금제는 하루 TWD 129부터, 중화전신 동남아 정량 요금제는 15일간 1GB가 TWD 149부터이며 SIM을 바꾸지 않고 대만 번호를 유지합니다. 아니라면 질문 3: 3명 이상이 함께 여행하거나 노트북에 테더링해야 하나요? 그렇다면 타오위안 공항에서 받아 반납하는 일일 요금제 포켓 WiFi를 빌리거나 데이터 무제한 SIM 한 장을 핫스폿으로 공유합니다. 아니라면 공항 카운터에서 물리 여행자 SIM을 삽니다. True는 8일 THB 449, AIS는 5·8·15·30·60일 상품이 있습니다. 카운터는 24시간 운영하며 여권 명의자 본인이 등록합니다. NBTC 규정: 본인이 여권을 지참하고, 통신사당 최대 3회선이며, 여행자 SIM 유효기간은 최대 60일로 만료 후 충전해 연장할 수 없습니다. 온라인 eSIM도 여권 업로드가 필요합니다. 데이터 예상량은 지도와 메시지가 하루 수백 MB, 소셜미디어와 사진 전송이 하루 약 1GB, 동영상 시청이나 핫스폿 사용이 하루 3GB 이상이므로 무제한 상품을 고릅니다. 가격은 2026년 9월 13일 공식 사이트에서 확인했습니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">태국 인터넷: 세 가지 질문으로 선택 (가격 확인 2026년 9월 13일)</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">여행자 eSIM · 대만 통신사 로밍 · 포켓 WiFi · 공항 여행자 SIM</text>


  <polygon points="800,120 1130,175 800,230 470,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="170" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 1 · 잠금 해제·eSIM 지원 휴대전화이고,</text>
  <text x="800" y="196" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">도착 즉시 Grab을 부르고 싶나요?</text>
  <path d="M 1130 175 L 1156 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1134" y="165" font-size="16" fill="#5C6B6B">예</text>
  <rect x="1160" y="122" width="410" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1365" y="152" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">여행자 eSIM · อีซิม eSIM</text>
  <text x="1365" y="178" font-size="15" fill="#8A2E1D" text-anchor="middle">AIS eSIM THB 399부터 · True와 제3자는 공식 사이트 확인</text>
  <text x="1365" y="204" font-size="15" fill="#8A2E1D" text-anchor="middle">출발 전 QR 코드로 설치 · 도착 후 데이터 로밍 켜기</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="258" font-size="16" fill="#5C6B6B">아니요</text>


  <polygon points="800,275 1130,330 800,385 470,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="325" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">질문 2 · 5일 이내이고 데이터를 적게 쓰며,</text>
  <text x="800" y="351" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">대만 번호로 인증 SMS를 받아야 하나요?</text>
  <path d="M 1130 330 L 1134 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1133" y="320" font-size="16" fill="#5C6B6B" text-anchor="end">예</text>
  <rect x="1138" y="277" width="460" height="106" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1369" y="307" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">대만 통신사 로밍 · โรมมิ่ง Roaming</text>
  <text x="1369" y="333" font-size="15" fill="#0B4F4D" text-anchor="middle">타이완 모바일 동남아: TWD129/일부터 · 기존 기기·번호</text>
  <text x="1369" y="359" font-size="15" fill="#0B4F4D" text-anchor="middle">중화전신 동남아 정량: 15일 1GB · TWD 149부터</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="413" font-size="16" fill="#5C6B6B">아니요</text>


  <polygon points="800,430 1130,485 800,540 470,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="480" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">질문 3 · 3명 이상인가요? 아니면</text>
  <text x="800" y="506" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">노트북·태블릿 테더링이 필요한가요?</text>
  <path d="M 1130 485 L 1156 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1134" y="475" font-size="16" fill="#5C6B6B">예</text>
  <rect x="1160" y="432" width="410" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="1365" y="462" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">포켓 WiFi · พ็อกเก็ตไวไฟ</text>
  <text x="1365" y="488" font-size="15" fill="#1F4E73" text-anchor="middle">타오위안 공항 수령·반납 · 일일 요금 · 충전 필요</text>
  <text x="1365" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">또는 데이터 무제한 SIM 한 장을 핫스폿으로 공유</text>
  <path d="M 470 485 L 444 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="448" y="465" font-size="16" fill="#5C6B6B" text-anchor="start">아니요</text>
  <rect x="30" y="432" width="410" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4" />
  <text x="235" y="462" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">공항 여행자 SIM · ซิมท่องเที่ยว</text>
  <text x="235" y="488" font-size="15" fill="#4E3428" text-anchor="middle">True 8일 THB 449 · AIS 5/8/15/30/60일</text>
  <text x="235" y="514" font-size="15" fill="#4E3428" text-anchor="middle">카운터 24시간 운영 · 여권 명의자 본인이 등록</text>


  <rect x="60" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3" />
  <text x="88" y="618" font-size="19" font-weight="700" fill="#102A2B">SIM 실명 등록 · ลงทะเบียนซิม · NBTC</text>
  <text x="88" y="652" font-size="16" fill="#102A2B">여권 명의자 본인 방문 · 통신사당 최대 3회선 · 여행자 SIM 최대 60일</text>
  <text x="88" y="682" font-size="16" fill="#102A2B">만료 후 충전 연장 불가 · 재등록 · eSIM도 여권 업로드 필요</text>
  <text x="88" y="712" font-size="16" fill="#102A2B">7-Eleven 충전 · SIM도 등록 · 첫 SIM은 공항 카운터가 간편</text>

  <rect x="820" y="585" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3" />
  <text x="848" y="618" font-size="19" font-weight="700" fill="#102A2B">일일 데이터 예상량 · 경험치이며 공식 수치가 아님</text>
  <text x="848" y="652" font-size="16" fill="#102A2B">지도와 메시지만 사용: 하루 수백 MB</text>
  <text x="848" y="682" font-size="16" fill="#102A2B">소셜미디어·사진 전송·가끔 동영상: 하루 약 1GB</text>
  <text x="848" y="712" font-size="16" fill="#102A2B">하루 종일 동영상 또는 노트북 테더링: 하루 3GB 이상 · 무제한 선택</text>

  <text x="60" y="778" font-size="15" fill="#5C6B6B">태국 바트(THB)와 대만 달러(TWD) 가격은 2026년 9월 13일 True·AIS·중화전신·타이완 모바일 공식 사이트에서 확인. 변동되므로 출발 전 재확인.</text>
  <text x="60" y="806" font-size="15" fill="#5C6B6B">수완나품 สนามบินสุวรรณภูมิ 도착: 메인 터미널 2층 · 돈므앙 ดอนเมือง 국제선 도착: 제1터미널 · AIS/True 카운터 운영.</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 제작 2026</text>
</svg>
