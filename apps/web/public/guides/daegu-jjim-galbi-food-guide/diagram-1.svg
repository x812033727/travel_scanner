<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Malgun Gothic',sans-serif">
  <title id="title">大邱辣燉排骨菜單解碼</title>
  <desc id="desc">左側列出菜單用語：찜갈비(한우)是韓牛燉排骨；찜갈비(수입)是進口牛燉排骨；찜갈비(국내산)是國產牛燉排骨；소고기찌개是另外點的牛肉鍋；갈비살찌개是排骨肉鍋。右側對照갈비찜與찜갈비：前者以醬油調味、有湯汁，後者在大邱東仁洞用辣椒粉、大蒜與生薑，收至幾乎沒有湯汁。底部顯示上桌後的順序：看見양은냄비薄金屬鍋，吃肉，再把白飯拌入剩餘醬汁；現在也有店改用不鏽鋼鍋。</desc>
  <rect width="1600" height="900" fill="#f5f1e8"/>
  <rect x="42" y="38" width="1516" height="824" rx="28" fill="#fffdf8" stroke="#d2c4af" stroke-width="3"/>
  <text x="82" y="98" font-size="34" font-weight="700" fill="#3b2419">大邱辣燉排骨：菜單上這些字怎麼選</text>
  <text x="82" y="133" font-size="19" fill="#685749">찜갈비 與 갈비찜 的差別，整理自大邱市及韓國觀光公社官方資料</text>
  <line x1="800" y1="165" x2="800" y2="710" stroke="#ddcdb8" stroke-width="3"/>

  <text x="82" y="192" font-size="25" font-weight="700" fill="#694226">菜單上會看到的字</text>
  <rect x="82" y="215" width="674" height="79" rx="13" fill="#f9eee1"/>
  <text x="104" y="249" font-size="22" font-weight="700" fill="#3b2419">찜갈비(한우)　韓牛燉排骨</text>
  <text x="104" y="277" font-size="18" fill="#685749">韓牛做的</text>
  <rect x="82" y="302" width="674" height="79" rx="13" fill="#f9eee1"/>
  <text x="104" y="336" font-size="22" font-weight="700" fill="#3b2419">찜갈비(수입)　進口牛燉排骨</text>
  <text x="104" y="364" font-size="18" fill="#685749">進口牛肉，作法相同</text>
  <rect x="82" y="389" width="674" height="79" rx="13" fill="#f9eee1"/>
  <text x="104" y="423" font-size="22" font-weight="700" fill="#3b2419">찜갈비(국내산)　國產牛燉排骨</text>
  <text x="104" y="451" font-size="18" fill="#685749">산호찜갈비식당的寫法，用國產肉牛</text>
  <rect x="82" y="476" width="674" height="79" rx="13" fill="#edf1e9"/>
  <text x="104" y="510" font-size="22" font-weight="700" fill="#3b2419">소고기찌개　牛肉鍋</text>
  <text x="104" y="538" font-size="18" fill="#685749">另外點的一鍋</text>
  <rect x="82" y="563" width="674" height="79" rx="13" fill="#edf1e9"/>
  <text x="104" y="597" font-size="22" font-weight="700" fill="#3b2419">갈비살찌개　排骨肉鍋</text>
  <text x="104" y="625" font-size="18" fill="#685749">봉산、월성的菜單寫法</text>

  <text x="842" y="192" font-size="25" font-weight="700" fill="#694226">兩道菜，名字順序不同</text>
  <rect x="842" y="215" width="330" height="381" rx="16" fill="#edf1e9" stroke="#9aaf8d" stroke-width="2"/>
  <text x="864" y="260" font-size="29" font-weight="700" fill="#294534">갈비찜</text>
  <text x="864" y="296" font-size="18" fill="#4d6352">首爾、京畿一帶</text>
  <text x="864" y="350" font-size="22" fill="#294534">간장　醬油調味</text>
  <text x="864" y="402" font-size="22" fill="#294534">有湯汁</text>
  <text x="864" y="454" font-size="22" fill="#294534">밤·대추</text>
  <text x="864" y="484" font-size="18" fill="#4d6352">栗子、紅棗</text>
  <rect x="1187" y="215" width="329" height="381" rx="16" fill="#faebe4" stroke="#c98e72" stroke-width="2"/>
  <text x="1209" y="260" font-size="29" font-weight="700" fill="#783d2c">찜갈비</text>
  <text x="1209" y="296" font-size="18" fill="#945848">大邱東仁洞</text>
  <text x="1209" y="350" font-size="22" fill="#783d2c">고춧가루　辣椒粉</text>
  <text x="1209" y="402" font-size="22" fill="#783d2c">다진 마늘　蒜末</text>
  <text x="1209" y="454" font-size="22" fill="#783d2c">생강　生薑</text>
  <text x="1209" y="506" font-size="22" fill="#783d2c">幾乎沒有湯汁</text>

  <text x="82" y="682" font-size="24" font-weight="700" fill="#694226">上桌之後</text>
  <rect x="82" y="706" width="1434" height="111" rx="15" fill="#e7e9df"/>
  <text x="112" y="751" font-size="22" font-weight="700" fill="#3b2419">양은냄비　薄金屬鍋</text>
  <text x="112" y="782" font-size="17" fill="#685749">也有店改用不鏽鋼鍋</text>
  <path d="M 500 759 L 580 759" stroke="#9b6746" stroke-width="5" fill="none"/>
  <path d="M 580 759 l -16 -11 m 16 11 l -16 11" stroke="#9b6746" stroke-width="5" fill="none"/>
  <text x="628" y="765" font-size="24" font-weight="700" fill="#3b2419">고기　吃肉</text>
  <path d="M 837 759 L 917 759" stroke="#9b6746" stroke-width="5" fill="none"/>
  <path d="M 917 759 l -16 -11 m 16 11 l -16 11" stroke="#9b6746" stroke-width="5" fill="none"/>
  <text x="966" y="751" font-size="23" font-weight="700" fill="#3b2419">밥　白飯拌入剩餘醬汁</text>
  <text x="966" y="782" font-size="17" fill="#685749">韓國觀光公社繁體中文料理頁介紹的吃法</text>
  <text x="1302" y="848" font-size="16" fill="#8b796b">© Mokaair 製圖 2026</text>
</svg>
