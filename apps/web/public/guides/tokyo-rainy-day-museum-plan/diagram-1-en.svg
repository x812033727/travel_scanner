<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Tokyo Museums on a Rainy Day: Choose Ueno or Roppongi and Check Permanent and Special Exhibitions Separately: Decision Process</title><desc>Check in order: choose exhibition interests, confirm opening details, plan your entrance route, and allow time for rest. Compiled by the editors; not a map or measured timing.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Order · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits you; no need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Choose a theme</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Pick a subject</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Main museum first</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="26" font-weight="700" style="font-size: 26px;">Check opening details</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Check the date</text><text x="473" y="573" fill="#f4dc9d" font-size="16" style="font-size: 16px;">Permanent / special: check separately</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Plan your entrance</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Plan the access</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Less walking in rain</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Allow time to rest</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Leave room</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Extras are optional</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editor-made diagram / Editorial diagram</text></g></svg>
