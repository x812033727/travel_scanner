<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>東京の雨の日の博物館プラン：上野か六本木に絞り、常設展と特別展は分けて考える：判断の流れ</title><desc>順番に確認：興味で展示を選ぶ、開館状況を確認する、入口までの経路を計画する、休憩を確保する。編集部による整理であり、地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順序 · 実用的な手順</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、一度に全部こなさなくてよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">興味で展示を選ぶ</text><text x="103" y="497" fill="#f4f0e5" font-size="23">テーマを選ぶ</text><text x="103" y="573" fill="#f4dc9d" font-size="26">メインの館を先に</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">開館状況を確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">日付を確認</text><text x="473" y="573" fill="#f4dc9d" font-size="26">常設・特別展は別に</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">入口への経路を計画</text><text x="843" y="497" fill="#f4f0e5" font-size="23">アクセスを計画</text><text x="843" y="573" fill="#f4dc9d" font-size="26">雨の中の移動を短く</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">休憩を確保</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">余裕を残す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">追加は任意</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図 / 編集部による図解</text></g></svg>
