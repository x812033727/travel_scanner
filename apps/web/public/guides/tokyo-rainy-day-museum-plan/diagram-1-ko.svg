<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>도쿄 비 오는 날 박물관 일정 짜기: 우에노·롯폰기 중 한 지역을 고르고 상설전과 특별전 구분하기: 판단 흐름</title><desc>관심 전시 선택, 개관 여부 확인, 입구 동선 계획, 휴식 시간 확보 순으로 점검한다. 편집부가 정리한 도식으로, 지도나 실측 시간을 나타내지 않는다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">여건에 맞게 고르고, 한 번에 다 할 필요는 없어요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">관심 전시 선택</text><text x="103" y="497" fill="#f4f0e5" font-size="23">주제 고르기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">주 관람지 먼저 결정</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">개관 여부 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">날짜 확인</text><text x="473" y="573" fill="#f4dc9d" font-size="26">상설·특별전 구분</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">입구 동선 계획</text><text x="843" y="497" fill="#f4f0e5" font-size="23">접근 경로 계획</text><text x="843" y="573" fill="#f4dc9d" font-size="26">빗속 이동 단축</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">휴식 확보</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">여유 두기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">추가 방문은 선택</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집부 도식</text></g></svg>
