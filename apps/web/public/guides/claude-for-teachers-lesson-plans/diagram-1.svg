<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一週備課流程：Claude 做什麼、老師做什麼 / A weekly lesson-prep loop: what Claude drafts, what the teacher decides</title>
  <desc id="desc">由上往下五個步驟，每一步分成左邊的「Claude 做什麼（草稿）」與右邊的「你做什麼（專業判斷）」。第一步專案設定，開學做一次：它讀你放進去的課綱、課本目錄與班級程度，之後每個對話都不必再講一次背景；你決定放哪些檔案，寫清楚教學風格與班級狀況，放進去之前先確認沒有學生姓名與成績。第二步教案：它產出 50 分鐘的流程、教學目標與時間分配，附上延伸任務與補救方式兩種差異化；你重估每段時間、換成手上的教材版本，把教學目標改寫成學生做得到的動作。第三步出題：它依難度分層出題，每題附解析與誤答設計理由，並標出它認為可能超綱的題目；你逐題自己算一次，確認答案與選項只有一個對，再對照課綱與教學進度刪掉不適用的題。第四步批改回饋：它依去識別化後的作答寫三句式回饋草稿，寫哪裡好、哪裡要改、下一步練什麼；你要先把姓名換成學生 A、B、C 並刪掉學號與班級，再把空泛的句子改成引用學生原句與具體練習。第五步家長聯絡與行政：它把要點寫成得體的通知、聯絡簿短文或公告，語氣依你在提示詞裡寫死的要求；你核對日期、金額與人名，換成學校既有格式，正式公文的格式以學校與上級機關規定為準。圖的底部有兩行提醒：學生的姓名、學號、成績、輔導紀錄與家庭狀況一律不上傳，要用先去識別化；Claude for Teachers 免費方案只開放美國經驗證的 K-12 教師，台灣老師用一般方案。方案與功能依 2026 年 9 月的官方頁面。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一週備課流程：它做什麼、你做什麼（2026 年 9 月依官網查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">A weekly lesson-prep loop: what Claude drafts, and what only the teacher can decide</text>

  <text x="210" y="124" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">每週五個步驟</text>
  <text x="415" y="124" font-size="18" font-weight="700" fill="#1F4E73">Claude 做什麼（草稿）</text>
  <text x="975" y="124" font-size="18" font-weight="700" fill="#0B4F4D">你做什麼（專業判斷）</text>

  <!-- row 1 -->
  <rect x="60" y="146" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="210" y="194" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">① 專案設定</text>
  <text x="210" y="226" font-size="16" fill="#5C6B6B" text-anchor="middle">開學做一次</text>
  <rect x="390" y="146" width="530" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="415" y="191" font-size="16" fill="#102A2B">讀你放進去的課綱、課本目錄與班級程度</text>
  <text x="415" y="225" font-size="16" fill="#102A2B">之後每個對話都不必再講一次背景</text>
  <rect x="950" y="146" width="590" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="975" y="191" font-size="16" fill="#102A2B">決定放哪些檔案，寫清楚教學風格與班級狀況</text>
  <text x="975" y="225" font-size="16" fill="#102A2B">放進去之前先確認沒有學生姓名與成績</text>
  <path d="M 210 258 L 210 278" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <rect x="60" y="282" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="210" y="345" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">② 教案</text>
  <rect x="390" y="282" width="530" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="415" y="327" font-size="16" fill="#102A2B">產出 50 分鐘的流程、教學目標與時間分配</text>
  <text x="415" y="361" font-size="16" fill="#102A2B">附上延伸任務與補救方式兩種差異化</text>
  <rect x="950" y="282" width="590" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="975" y="327" font-size="16" fill="#102A2B">重估每段時間、換成你手上的教材版本</text>
  <text x="975" y="361" font-size="16" fill="#102A2B">把教學目標改寫成學生做得到的動作</text>
  <path d="M 210 394 L 210 414" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <rect x="60" y="418" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="210" y="481" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">③ 出題</text>
  <rect x="390" y="418" width="530" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="415" y="463" font-size="16" fill="#102A2B">依難度分層出題，附解析與誤答設計理由</text>
  <text x="415" y="497" font-size="16" fill="#102A2B">標出它認為可能超綱的題目</text>
  <rect x="950" y="418" width="590" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="975" y="463" font-size="16" fill="#102A2B">逐題自己算一次，確認選項只有一個對</text>
  <text x="975" y="497" font-size="16" fill="#102A2B">對照課綱與教學進度，刪掉不適用的題</text>
  <path d="M 210 530 L 210 550" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row 4 -->
  <rect x="60" y="554" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="210" y="605" font-size="20" font-weight="700" fill="#A8571B" text-anchor="middle">④ 批改回饋</text>
  <text x="210" y="637" font-size="16" fill="#A8571B" text-anchor="middle">先去識別化再貼</text>
  <rect x="390" y="554" width="530" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="415" y="599" font-size="16" fill="#102A2B">依去識別化的作答寫三句式回饋草稿</text>
  <text x="415" y="633" font-size="16" fill="#102A2B">哪裡好、哪裡要改、下一步練什麼</text>
  <rect x="950" y="554" width="590" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="975" y="599" font-size="16" fill="#102A2B">姓名先換成學生 A、B、C，刪掉學號與班級</text>
  <text x="975" y="633" font-size="16" fill="#102A2B">空泛的句子改成引用學生原句與具體練習</text>
  <path d="M 210 666 L 210 686" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row 5 -->
  <rect x="60" y="690" width="300" height="112" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="210" y="741" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">⑤ 家長聯絡</text>
  <text x="210" y="773" font-size="16" fill="#5C6B6B" text-anchor="middle">與行政文書</text>
  <rect x="390" y="690" width="530" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="415" y="735" font-size="16" fill="#102A2B">把要點寫成得體的通知、短文或公告</text>
  <text x="415" y="769" font-size="16" fill="#102A2B">語氣依你在提示詞裡寫死的要求</text>
  <rect x="950" y="690" width="590" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="975" y="735" font-size="16" fill="#102A2B">核對日期、金額與人名，換成學校既有格式</text>
  <text x="975" y="769" font-size="16" fill="#102A2B">正式公文以學校與上級機關的規定為準</text>

  <text x="60" y="840" font-size="15" fill="#B8442D">底線：學生的姓名、學號、成績、輔導紀錄與家庭狀況一律不上傳；要用先去識別化。</text>
  <text x="60" y="868" font-size="15" fill="#5C6B6B">Claude for Teachers 免費方案只開放美國經驗證的 K-12 教師，台灣老師用一般方案。</text>
