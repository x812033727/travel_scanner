<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<title id="title">2026 韩国枫红高峰预测时间轴 / 韩国秋叶 2026：高峰预测</title>
<desc id="desc">横向时间轴从 10 月中旬到 11 月下旬，十个地点从上到下按枫树类的预测高峰日期排序。红色圆点表示枫树类、橙色菱形表示银杏。雪岳山枫树 10/20；智异山枫树 10/27、银杏 10/26；江原道立花木园（春川）枫树 10/28、银杏 10/27；俗离山枫树 10/28、银杏 10/23；国立树木园（抱川）枫树 10/29、银杏 10/31；八公山枫树 10/30；首尔植物园枫树 11/2；内藏山枫树 11/4；汉拏山 1100 道路枫树 11/6；汉拏树木园枫树 11/19、银杏 11/16。10/30 到 10/31 的竖向色带表示全国的预测高峰：银杏 10/30、枫树类与橡树类 10/31。高峰指叶子变色 50% 以上，日期为韩国山林厅 2026 年 9 月 22 日的预测。</desc>
