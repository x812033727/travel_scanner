<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<title id="title">2026 한국 단풍 절정 예측 시간축 / 한국 단풍 2026: 예상 절정일</title>
<desc id="desc">가로 시간축은 10월 중순부터 11월 하순까지이며, 열 곳을 단풍나무류의 예상 절정일 순서로 위에서 아래로 배치했습니다. 빨간 원은 단풍나무류, 주황색 마름모는 은행나무입니다. 설악산 단풍나무 10/20; 지리산 단풍나무 10/27, 은행나무 10/26; 강원도립화목원(춘천) 단풍나무 10/28, 은행나무 10/27; 속리산 단풍나무 10/28, 은행나무 10/23; 국립수목원(포천) 단풍나무 10/29, 은행나무 10/31; 팔공산 단풍나무 10/30; 서울식물원 단풍나무 11/2; 내장산 단풍나무 11/4; 한라산 1100도로 단풍나무 11/6; 한라수목원 단풍나무 11/19, 은행나무 11/16. 10/30부터 10/31까지의 세로 띠는 전국의 예상 절정일로, 은행나무 10/30, 단풍나무류와 참나무류 10/31입니다. 절정은 잎이 50% 이상 변색한 상태이며, 날짜는 한국 산림청이 2026년 9월 22일 발표한 예측입니다.</desc>
