<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<title id="title">2026年韓国の紅葉ピーク予測タイムライン / 韓国の紅葉2026：予測ピーク</title>
<desc id="desc">横向きの時間軸は10月半ばから11月下旬までで、十カ所を上から下へカエデ類の予測ピーク順に並べています。赤い丸はカエデ類、オレンジのひし形はイチョウです。雪岳山のカエデは10/20、智異山のカエデは10/27・イチョウは10/26、江原道立花木園（春川）のカエデは10/28・イチョウは10/27、俗離山のカエデは10/28・イチョウは10/23、国立樹木園（抱川）のカエデは10/29・イチョウは10/31、八公山のカエデは10/30、ソウル植物園のカエデは11/2、内蔵山のカエデは11/4、漢拏山1100道路のカエデは11/6、漢拏樹木園のカエデは11/19・イチョウは11/16です。10/30から10/31の縦帯は全国の予測ピークを示し、イチョウは10/30、カエデ類とナラ類は10/31です。ピークは葉の50%以上が色づいた状態で、日付は韓国山林庁が2026年9月22日に発表した予測です。</desc>
