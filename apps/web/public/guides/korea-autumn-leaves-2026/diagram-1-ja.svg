<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2026年韓国の紅葉ピーク予測：北から南へ、江原道から済州へ</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">2026年韓国の紅葉：場所別ピーク予測日（韓国山林庁）</text>
