<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<title id="title">2026 韓國楓紅高峰預測時間軸 / Korea autumn leaves 2026: predicted peaks</title>
<desc id="desc">橫向時間軸從 10 月中到 11 月下旬，十個地點由上到下依楓樹類的預測高峰排序。紅色圓點是楓樹類、橘色菱形是銀杏。雪嶽山楓樹 10/20；智異山楓樹 10/27、銀杏 10/26；江原道立花木園（春川）楓樹 10/28、銀杏 10/27；俗離山楓樹 10/28、銀杏 10/23；國立樹木園（抱川）楓樹 10/29、銀杏 10/31；八公山楓樹 10/30；首爾植物園楓樹 11/2；內藏山楓樹 11/4；漢拏山 1100 道路楓樹 11/6；漢拏樹木園楓樹 11/19、銀杏 11/16。10/30 到 10/31 的直帶是全國的預測高峰：銀杏 10/30、楓樹類與橡樹類 10/31。高峰是葉子變色 50% 以上，日期為韓國山林廳 2026 年 9 月 22 日的預測。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2026 韓國楓紅高峰預測：由北往南、由江原道到濟州</text>
