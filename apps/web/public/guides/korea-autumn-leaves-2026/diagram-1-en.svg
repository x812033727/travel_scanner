<title id="title">2026 Korea Autumn Foliage Peak Forecast Timeline / Korea autumn leaves 2026: predicted peaks</title>
<desc id="desc">The horizontal timeline runs from mid-October (10) to late November (11), with ten locations arranged from top to bottom by predicted maple peak date. Red circles mark maples; orange diamonds mark ginkgo. Seoraksan maples 10/20; Jirisan maples 10/27, ginkgo 10/26; Gangwon Provincial Arboretum (Chuncheon) maples 10/28, ginkgo 10/27; Songnisan maples 10/28, ginkgo 10/23; National Arboretum (Pocheon) maples 10/29, ginkgo 10/31; Palgongsan maples 10/30; Seoul Botanic Park maples 11/2; Naejangsan maples 11/4; Hallasan 1100 Road maples 11/6; Halla Arboretum maples 11/19, ginkgo 11/16. The vertical band from 10/30 to 10/31 marks the nationwide predicted peaks: ginkgo 10/30, maples and oaks 10/31. Peak means 50% or more of the leaves have changed color. Dates are Korea Forest Service forecasts issued on 2026/9/22.</desc>
