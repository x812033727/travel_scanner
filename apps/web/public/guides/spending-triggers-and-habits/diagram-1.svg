<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">消費觸發點的四個步驟 / Four steps to find a spending trigger</title>
<desc id="desc">由左而右三個步驟：第一步在每一筆支出上補記時間、地點、當下的狀態、和誰在一起、用什麼付款；第二步在兩週之後找出重複的形狀，可能是同一個時段、同一條動線或同一種狀態，讀的時候先遮住金額欄；第三步分辨兩種漏洞，一次性的有外部原因、不必設計，結構性的條件會重複、才值得處理。第三步往下接到第四步：讓摩擦對得上觸發點，例如移除一鍵付款與已存的卡號、把購物頁面移出首頁、換出口或路線避開必經的店、以及購物清單與冷卻期。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">補上情境，找出重複，再設計摩擦</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Spending triggers · 診斷在前，摩擦在後</text>

<path d="M490 315 L580 315" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1020 315 L1110 315" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1330 485 L1330 535" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="155" width="420" height="320" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="270" y="205" text-anchor="middle" font-size="17" fill="#5C6B6B">第一步</text>
<text x="270" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">每一筆補上情境</text>
<text x="270" y="296" text-anchor="middle" font-size="19" fill="#5C6B6B">時間</text>
<text x="270" y="330" text-anchor="middle" font-size="19" fill="#5C6B6B">地點</text>
<text x="270" y="364" text-anchor="middle" font-size="19" fill="#5C6B6B">當下的狀態</text>
<text x="270" y="398" text-anchor="middle" font-size="19" fill="#5C6B6B">和誰在一起</text>
<text x="270" y="432" text-anchor="middle" font-size="19" fill="#5C6B6B">用什麼付款</text>

<rect x="590" y="155" width="420" height="320" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="205" text-anchor="middle" font-size="17" fill="#5C6B6B">第二步</text>
<text x="800" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">兩週後找重複</text>
<text x="800" y="296" text-anchor="middle" font-size="19" fill="#5C6B6B">同一個時段</text>
<text x="800" y="330" text-anchor="middle" font-size="19" fill="#5C6B6B">同一條動線</text>
<text x="800" y="364" text-anchor="middle" font-size="19" fill="#5C6B6B">同一種狀態</text>
<text x="800" y="432" text-anchor="middle" font-size="19" fill="#2F6F9F">讀之前先遮住金額欄</text>

<rect x="1120" y="155" width="420" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1330" y="205" text-anchor="middle" font-size="17" fill="#5C6B6B">第三步</text>
<text x="1330" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">分辨兩種漏洞</text>
<text x="1330" y="300" text-anchor="middle" font-size="19" fill="#D97A2B">一次性：有外部原因</text>
<text x="1330" y="334" text-anchor="middle" font-size="19" fill="#5C6B6B">不會自己再來，不必設計</text>
<text x="1330" y="392" text-anchor="middle" font-size="19" fill="#0D6B68">結構性：條件會重複</text>
<text x="1330" y="426" text-anchor="middle" font-size="19" fill="#5C6B6B">下個月還會出現，才處理</text>

<rect x="60" y="545" width="1480" height="245" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">第四步　讓摩擦對得上觸發點</text>

<rect x="100" y="630" width="320" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="260" y="672" text-anchor="middle" font-size="19" fill="#102A2B">移除一鍵付款</text>
<text x="260" y="706" text-anchor="middle" font-size="19" fill="#5C6B6B">與已存的卡號</text>

<rect x="460" y="630" width="320" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="620" y="672" text-anchor="middle" font-size="19" fill="#102A2B">把購物頁面</text>
<text x="620" y="706" text-anchor="middle" font-size="19" fill="#5C6B6B">移出手機首頁</text>

<rect x="820" y="630" width="320" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="980" y="672" text-anchor="middle" font-size="19" fill="#102A2B">換出口或路線</text>
<text x="980" y="706" text-anchor="middle" font-size="19" fill="#5C6B6B">避開必經的店</text>

<rect x="1180" y="630" width="320" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1340" y="672" text-anchor="middle" font-size="19" fill="#102A2B">購物清單</text>
<text x="1340" y="706" text-anchor="middle" font-size="19" fill="#5C6B6B">與冷卻期</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
