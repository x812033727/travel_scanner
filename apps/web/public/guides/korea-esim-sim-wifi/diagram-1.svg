<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">韓國上網決策樹：WiFi 分享器、實體 SIM、含門號 eSIM、純上網 eSIM 或台灣電信漫遊 / How to stay connected in Korea</title>
  <desc id="desc">三個問題。問題一：三人以上同行、或要開熱點給筆電？是就租 WiFi 分享器，仁川機場第 1 航廈入境大廳 F 出口旁與第 2 航廈 3 號出口旁的 Wifi dosirak 櫃檯 06:00 到 22:00，深夜班機先備一張 eSIM。否就問題二：手機支援 eSIM 且已解鎖？否就到仁川機場的電信櫃檯買實體 SIM，第 1 航廈 1 樓入境大廳 F 出口旁有 24 小時櫃檯、A 出口旁 06:00 到 22:00，第 2 航廈 1 樓 4 號出口旁 KT 與 LG U+ 24 小時、7 號出口旁 SKT 24 小時。是就問題三：需要韓國門號接電話、收 app 驗證碼？是就買電信 eSIM 含韓國門號，KT Korea eSIM 的 DATA/CALL/SMS 方案或 SKT LTE eSIM，只賣外國人、最長 90 天、QR Code 要在購買後 90 天內安裝；否就買純上網 eSIM，出發前掃 QR 安裝、落地再開數據漫遊。手機檢查：iPhone XS、XR 之後有 eSIM，iPhone 13 之後可雙 eSIM，中國大陸版多數沒有 eSIM，綁約機先解鎖。第四選項是不換卡的台灣電信漫遊，2026 年 9 月官網價：中華電信韓國 5GB 388 元、多日型平均每日最低 199 元起；台灣大哥大計日型每日 199 元、官網限定南韓每日 129 元、計量型 1GB 149 元、共享包 499 元；遠傳以官網為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="54" font-size="32" font-weight="700" fill="#102A2B">韓國上網怎麼選：三個問題選出買法（2026 年 9 月查證）</text>
  <text x="60" y="86" font-size="18" fill="#5C6B6B">한국 인터넷 · eSIM, prepaid SIM, pocket WiFi or Taiwan roaming · 依 KT、SKT、仁川機場、Apple 與台灣電信官網</text>

  <!-- Q1 -->
  <polygon points="620,118 960,173 620,228 280,173" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="620" y="166" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　三人以上同行、或要開熱點</text>
  <text x="620" y="192" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">給筆電、平板一起用？</text>
  <path d="M 960 173 L 986 173" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="964" y="163" font-size="16" fill="#5C6B6B">是</text>
  <rect x="990" y="120" width="550" height="106" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1265" y="150" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">WiFi 分享器（포켓 와이파이 Pocket WiFi）</text>
  <text x="1265" y="176" font-size="15" fill="#1F4E73" text-anchor="middle">仁川 T1 入境大廳 F 出口旁、T2 3 號出口旁：Wifi dosirak 06:00～22:00</text>
  <text x="1265" y="202" font-size="15" fill="#1F4E73" text-anchor="middle">深夜班機領不到，先備一張 eSIM；還機箱在管制區外，過安檢前先還</text>
  <path d="M 620 230 L 620 268" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="632" y="256" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="620,272 960,327 620,382 280,327" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="620" y="320" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　手機支援 eSIM，</text>
  <text x="620" y="346" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">而且沒有電信鎖？</text>
  <path d="M 960 327 L 986 327" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="964" y="317" font-size="16" fill="#5C6B6B">否</text>
  <rect x="990" y="274" width="550" height="106" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="1265" y="304" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">實體 SIM（유심 USIM）：仁川機場電信櫃檯，帶護照</text>
  <text x="1265" y="330" font-size="15" fill="#4E3428" text-anchor="middle">T1 入境大廳：F 出口旁 24 小時、A 出口旁 06:00～22:00（三家都有）</text>
  <text x="1265" y="356" font-size="15" fill="#4E3428" text-anchor="middle">T2 入境層：4 號出口旁 KT、LG U+ 24 小時，7 號出口旁 SKT 24 小時</text>
  <path d="M 620 384 L 620 422" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="632" y="410" font-size="16" fill="#5C6B6B">是</text>

  <!-- Q3 -->
  <polygon points="620,426 960,481 620,536 280,481" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="620" y="474" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　需要韓國門號（010）</text>
  <text x="620" y="500" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">接電話、收 app 驗證簡訊？</text>
  <path d="M 960 481 L 986 481" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="964" y="471" font-size="16" fill="#5C6B6B">是</text>
  <rect x="990" y="428" width="550" height="106" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1265" y="458" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">電信 eSIM 含韓國門號（통화 가능 eSIM）</text>
  <text x="1265" y="484" font-size="15" fill="#8A2E1D" text-anchor="middle">KT Korea eSIM（DATA/CALL/SMS）、SKT LTE eSIM：只賣外國人、要護照</text>
  <text x="1265" y="510" font-size="15" fill="#8A2E1D" text-anchor="middle">KT：最長 90 天，QR Code 要在購買後 90 天內安裝，逾期作廢不退費</text>
  <path d="M 620 538 L 620 576" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="632" y="564" font-size="16" fill="#5C6B6B">否</text>
  <rect x="330" y="580" width="580" height="96" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="620" y="612" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">純上網 eSIM（데이터 전용 Data only）</text>
  <text x="620" y="638" font-size="15" fill="#0B4F4D" text-anchor="middle">第三方旅遊 eSIM 或電信純數據方案；出發前掃 QR 安裝，落地再開數據漫遊</text>
  <text x="620" y="662" font-size="15" fill="#0B4F4D" text-anchor="middle">沒有韓國門號，收不到韓國簡訊；台灣門號留著收驗證碼</text>

  <!-- phone check -->
  <rect x="990" y="580" width="550" height="96" rx="14" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/>
  <text x="1014" y="610" font-size="17" font-weight="700" fill="#102A2B">手機檢查（Apple 官網）</text>
  <text x="1014" y="636" font-size="15" fill="#102A2B">iPhone XS、XR 之後有 eSIM；iPhone 13 之後可同時兩個 eSIM</text>
  <text x="1014" y="660" font-size="15" fill="#102A2B">中國大陸版多數沒有 eSIM；要用兩家電信，手機必須已解鎖</text>

  <!-- Taiwan roaming -->
  <rect x="60" y="706" width="1480" height="118" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="88" y="738" font-size="18" font-weight="700" fill="#102A2B">第四選項：不換卡，開台灣電信的韓國漫遊（2026 年 9 月官網價，促銷會變，以官網為準）</text>
  <text x="88" y="768" font-size="16" fill="#102A2B">中華電信：韓國 5GB 388 元；多日型 5、7、9 天彈性選，平均每日最低 199 元起（網路門市、APP 或撥 123 申請）</text>
  <text x="88" y="796" font-size="16" fill="#102A2B">台灣大哥大：亞洲多國計日型每日 199 元、官網限定南韓每日 129 元、計量型 1GB 149 元起、同遊共享包 499 元 ｜ 遠傳：日租與多日方案，價格以官網為準</text>

  <text x="60" y="856" font-size="15" fill="#5C6B6B">雙卡設定：韓國 eSIM 設為行動數據主線並只在它開數據漫遊；台灣門號留通話簡訊、關數據漫遊。櫃檯時間依仁川機場官網，可能調整。</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
