<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣旅客入境越南六步流程：官網申請 e-visa、用申請碼查詢、列印與行前準備、入境前 PAI 申報、入境審查、海關（2026 年版）</title>
  <desc id="desc">六個步驟。一、出發前只用 evisa.gov.vn 或 thithucdientu.gov.vn 申請 e-visa：單次 25 美元、多次 50 美元，3 個工作天內核發，最長 90 天，白底照片 4×6 公分、jpeg、2 MB 內，填入境日期、口岸與越南住址。二、核發後用申請碼查詢結果並列印，核對姓名、護照號碼、出生日期，看清楚簽證生效日期，生效日之前不能入境，入境日期照機票填。三、紙本 e-visa 和護照放一起，護照效期要比簽證長 30 天以上，以免簽入境富國島的人不能在當地改辦 e-visa，機場買 SIM 要出示護照。四、入境前 3 天內到 prearrival.immigration.gov.vn 做 PAI 申報，填個人、簽證與航班資料，產生 QR 碼在入境審查時出示；目前不強制，領務局鼓勵申報，2026 年 4 月 15 日起在新山一機場試辦，其他機場以越南移民局公告為準。五、入境審查交護照、紙本 e-visa 與 PAI QR 碼，內排、新山一、峴港的國際線都在 T2 航廈，蓋章後去領行李；PAI 不是簽證，e-visa 要先辦好。六、海關：外幣現金超過 5,000 美元、越南盾現金超過 1,500 萬、金飾 300 公克以上要申報，香菸 200 支與 20 度以上酒類 1.5 公升免稅，電子菸與加熱菸 2025 年起禁止。底下註記台灣護照 2026 年仍需簽證，領務局名單把越南列在電子簽證；富國島免簽 30 天，原則上要從富國島離境。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">台灣旅客入境越南六步：e-visa 到海關（2026 年版）</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Entering Vietnam in six steps · 2026 年 9 月依越南公安部、越南政府、外交部領務局頁面查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="130" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="60" y="130" width="460" height="74" rx="22" fill="#0D6B68"/>
  <rect x="60" y="170" width="460" height="34" fill="#0D6B68"/>
  <text x="290" y="170" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　出發前：官網申請 e-visa</text>
  <text x="290" y="194" font-size="16" fill="#E3F0EF" text-anchor="middle">Apply online (evisa.gov.vn)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="238">● 只用 evisa.gov.vn 或</text>
    <text x="104" y="267">thithucdientu.gov.vn（.gov.vn 結尾）</text>
    <text x="86" y="296">● 單次 25 美元、多次 50 美元</text>
    <text x="86" y="325">● 3 個工作天內核發，最長 90 天</text>
    <text x="86" y="354">● 白底照片 4×6 公分、jpeg、2 MB 內</text>
    <text x="86" y="383">● 填入境日期、口岸、越南住址</text>
  </g>

  <!-- step 2 -->
  <rect x="570" y="130" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="570" y="130" width="460" height="74" rx="22" fill="#2F6F9F"/>
  <rect x="570" y="170" width="460" height="34" fill="#2F6F9F"/>
  <text x="800" y="170" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　核發：用申請碼查詢</text>
  <text x="800" y="194" font-size="16" fill="#E6F0F7" text-anchor="middle">e-Visa issued (check the result)</text>
  <g font-size="17" fill="#102A2B">
    <text x="596" y="238">● 用申請碼查詢結果、列印 e-visa</text>
    <text x="596" y="267">● 核對姓名、護照號碼、出生日期</text>
    <text x="596" y="296">● 看清楚簽證生效日期</text>
    <text x="596" y="325">● 生效日之前不能入境</text>
    <text x="596" y="354">● 入境日期照機票填</text>
  </g>

  <!-- step 3 -->
  <rect x="1080" y="130" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="1080" y="130" width="460" height="74" rx="22" fill="#6B4A3A"/>
  <rect x="1080" y="170" width="460" height="34" fill="#6B4A3A"/>
  <text x="1310" y="170" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　列印與行前準備</text>
  <text x="1310" y="194" font-size="16" fill="#F1E8E2" text-anchor="middle">Print and prepare</text>
  <g font-size="17" fill="#102A2B">
    <text x="1106" y="238">● 紙本 e-visa 和護照放一起</text>
    <text x="1106" y="267">● 護照效期要比簽證長 30 天以上</text>
    <text x="1106" y="296">● 免簽進富國島的人不能在當地辦 e-visa</text>
    <text x="1106" y="325">● 機場買 SIM 要出示護照</text>
  </g>

  <!-- step 4 -->
  <rect x="1080" y="480" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#7E57C2" stroke-width="6"/>
  <rect x="1080" y="480" width="460" height="74" rx="22" fill="#7E57C2"/>
  <rect x="1080" y="520" width="460" height="34" fill="#7E57C2"/>
  <text x="1310" y="520" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　入境前 3 天內：PAI 申報</text>
  <text x="1310" y="544" font-size="16" fill="#EFE9F8" text-anchor="middle">Pre-Arrival Information (optional)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1106" y="588">● prearrival.immigration.gov.vn</text>
    <text x="1106" y="617">● 填個人、簽證、航班資料</text>
    <text x="1106" y="646">● 產生 QR 碼，入境審查時出示</text>
    <text x="1106" y="675">● 目前不強制，領務局鼓勵申報</text>
    <text x="1106" y="704">● 2026 年 4 月 15 日新山一起試辦</text>
    <text x="1106" y="733">● 其他機場以越南移民局公告為準</text>
  </g>

  <!-- step 5 -->
  <rect x="570" y="480" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="570" y="480" width="460" height="74" rx="22" fill="#2E7D5B"/>
  <rect x="570" y="520" width="460" height="34" fill="#2E7D5B"/>
  <text x="800" y="520" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　入境審查</text>
  <text x="800" y="544" font-size="16" fill="#E7F2EC" text-anchor="middle">Immigration</text>
  <g font-size="17" fill="#102A2B">
    <text x="596" y="588">● 交護照＋紙本 e-visa＋PAI QR 碼</text>
    <text x="596" y="617">● 內排、新山一、峴港國際線都在 T2</text>
    <text x="596" y="646">● 護照蓋章後去領行李</text>
    <text x="596" y="675">● PAI 不是簽證，e-visa 要先辦好</text>
  </g>

  <!-- step 6 -->
  <rect x="60" y="480" width="460" height="300" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="60" y="480" width="460" height="74" rx="22" fill="#D97A2B"/>
  <rect x="60" y="520" width="460" height="34" fill="#D97A2B"/>
  <text x="290" y="520" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">6　海關</text>
  <text x="290" y="544" font-size="16" fill="#FBEFE4" text-anchor="middle">Customs</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="588">● 外幣現金超過 5,000 美元要申報</text>
    <text x="86" y="617">● 越南盾現金超過 1,500 萬要申報</text>
    <text x="86" y="646">● 金飾 300 公克以上要申報</text>
    <text x="86" y="675">● 免稅：香菸 200 支、20 度以上酒 1.5 公升</text>
    <text x="86" y="704">● 電子菸、加熱菸 2025 年起禁止</text>
  </g>

  <!-- arrows -->
  <path d="M 524 280 L 562 280" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1034 280 L 1072 280" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1310 434 L 1310 472" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1076 630 L 1038 630" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 566 630 L 528 630" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="826" font-size="18" fill="#5C6B6B">台灣護照 2026 年仍需簽證：領務局名單把越南列在電子簽證；富國島免簽 30 天，原則上要從富國島離境。</text>
  <text x="60" y="856" font-size="18" fill="#5C6B6B">依越南公安部、越南政府入口網、外交部領務局與駐越南辦事處頁面 2026 年 9 月查證；新制以越南移民局公告為準。</text>
  <text x="1590" y="888" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
