<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">臺灣付款方式決策圖</title>
  <desc id="desc">臺灣付款方式決策圖。夜市、小吃攤與傳統市場優先準備新臺幣現金，可先把 NT$1,000 鈔票換開。便利商店可用悠遊卡；悠遊卡在一般特約商店單筆上限 NT$1,500、每日 NT$3,000，7-ELEVEN 官方目前另列可感應支付的國外 Visa、Mastercard 與 JCB。百貨、連鎖餐廳與旅館通常可刷主要信用卡，旅館或餐廳可能加收 10% 服務費；結帳前確認金額與幣別。捷運、公車與 YouBike 可用悠遊卡；普通卡售價 NT$100、卡內不含可用金額，儲值上限 NT$10,000。臺北捷運閘門亦接受官方所列感應式銀行卡，按單程票價計費且沒有轉乘優惠。提款時先看 ATM 上的卡組織標誌並向發卡行確認手續費。統一發票六獎 NT$200、五獎 NT$1,000 可在指定超商兌領；非本國國籍人士依身分準備護照、居留證或入出境許可證。三獎 NT$10,000 起由發獎單位扣繳 20% 所得稅。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="54" y="66" font-size="38" font-weight="700" fill="#12383A">臺灣付款方式怎麼選？</text>
  <text x="54" y="104" font-size="20" fill="#536768">現金、悠遊卡與國際銀行卡｜2026/9/22 官方資料查核</text>

  <rect x="40" y="145" width="350" height="500" rx="24" fill="#FFF9F0" stroke="#C8783E" stroke-width="3"/>
  <circle cx="85" cy="195" r="26" fill="#C8783E"/><text x="85" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
  <text x="125" y="202" font-size="25" font-weight="700" fill="#713D1D">夜市、小吃攤、市場</text>
  <text x="68" y="255" font-size="28" font-weight="700" fill="#12383A">準備新臺幣現金</text>
  <text x="68" y="304" font-size="20" fill="#263D3E">• 攤商與小店常只收現金</text>
  <text x="68" y="342" font-size="20" fill="#263D3E">• 先把 NT$1,000 換成小鈔</text>
  <text x="68" y="380" font-size="20" fill="#263D3E">• 紙鈔：100／200／500／</text>
  <text x="88" y="414" font-size="20" fill="#263D3E">1,000／2,000</text>
  <text x="68" y="452" font-size="20" fill="#263D3E">• 硬幣：1／5／10／20／50</text>
  <rect x="68" y="512" width="294" height="92" rx="16" fill="#F6E2D0"/>
  <text x="88" y="548" font-size="19" font-weight="700" fill="#713D1D">不要只帶大面額鈔票</text>
  <text x="88" y="579" font-size="18" fill="#713D1D">排隊前先準備好零錢</text>

  <rect x="430" y="145" width="350" height="500" rx="24" fill="#F3FBF8" stroke="#238778" stroke-width="3"/>
  <circle cx="475" cy="195" r="26" fill="#238778"/><text x="475" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
  <text x="515" y="202" font-size="25" font-weight="700" fill="#15584F">便利商店</text>
  <text x="458" y="255" font-size="28" font-weight="700" fill="#12383A">悠遊卡最穩妥</text>
  <text x="458" y="304" font-size="20" fill="#263D3E">• 一般消費單筆 NT$1,500</text>
  <text x="458" y="342" font-size="20" fill="#263D3E">• 每卡每日 NT$3,000</text>
  <text x="458" y="380" font-size="20" fill="#263D3E">• 7-ELEVEN 國外卡：</text>
  <text x="478" y="414" font-size="20" fill="#263D3E">感應 Visa／Mastercard／JCB</text>
  <text x="458" y="452" font-size="20" fill="#263D3E">• 全家境外卡不要先假設可用</text>
  <rect x="458" y="512" width="294" height="92" rx="16" fill="#DCEFEA"/>
  <text x="478" y="548" font-size="19" font-weight="700" fill="#15584F">代收、票券可能另有限制</text>
  <text x="478" y="579" font-size="18" fill="#15584F">以收銀臺標誌為準</text>

  <rect x="820" y="145" width="350" height="500" rx="24" fill="#F5F3FC" stroke="#6B5AB4" stroke-width="3"/>
  <circle cx="865" cy="195" r="26" fill="#6B5AB4"/><text x="865" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
  <text x="905" y="202" font-size="25" font-weight="700" fill="#46377E">百貨、餐廳、旅館</text>
  <text x="848" y="255" font-size="28" font-weight="700" fill="#12383A">主要信用卡</text>
  <text x="848" y="304" font-size="20" fill="#263D3E">• 先看櫃檯受理標誌</text>
  <text x="848" y="342" font-size="20" fill="#263D3E">• 旅館或餐廳可能加收</text>
  <text x="868" y="376" font-size="20" fill="#263D3E">10% 服務費</text>
  <text x="848" y="414" font-size="20" fill="#263D3E">• 一般不要求小費</text>
  <text x="848" y="452" font-size="20" fill="#263D3E">• 結帳前確認金額與幣別</text>
  <rect x="848" y="512" width="294" height="92" rx="16" fill="#E5E0F5"/>
  <text x="868" y="548" font-size="19" font-weight="700" fill="#46377E">跨境錢包資格看註冊地區</text>
  <text x="868" y="579" font-size="18" fill="#46377E">不要由介面語言推定</text>

  <rect x="1210" y="145" width="350" height="500" rx="24" fill="#EFF7FC" stroke="#377DA0" stroke-width="3"/>
  <circle cx="1255" cy="195" r="26" fill="#377DA0"/><text x="1255" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text>
  <text x="1295" y="202" font-size="25" font-weight="700" fill="#24546D">捷運、公車、YouBike</text>
  <text x="1238" y="255" font-size="28" font-weight="700" fill="#12383A">悠遊卡</text>
  <text x="1238" y="304" font-size="20" fill="#263D3E">• 普通卡售價 NT$100</text>
  <text x="1238" y="342" font-size="20" fill="#263D3E">• 卡內不含可用金額</text>
  <text x="1238" y="380" font-size="20" fill="#263D3E">• 儲值上限 NT$10,000</text>
  <text x="1238" y="418" font-size="20" fill="#263D3E">• 臺北捷運可感應銀行卡</text>
  <text x="1238" y="456" font-size="20" fill="#263D3E">• 單程票價，無轉乘優惠</text>
  <rect x="1238" y="512" width="294" height="92" rx="16" fill="#DCEAF2"/>
  <text x="1258" y="548" font-size="19" font-weight="700" fill="#24546D">同一張卡或手機進出站</text>
  <text x="1258" y="579" font-size="18" fill="#24546D">避免票證不一致</text>

  <rect x="40" y="682" width="740" height="158" rx="22" fill="#FFFFFF" stroke="#9A886F" stroke-width="2"/>
  <text x="68" y="724" font-size="24" font-weight="700" fill="#12383A">ATM 提款</text>
  <text x="68" y="764" font-size="19" fill="#263D3E">看機臺卡組織標誌｜確認單筆限額｜向發卡行查海外提款費</text>
  <text x="68" y="802" font-size="18" fill="#5A6666">郵局 ATM 官方另列銀聯卡跨國提款；其他卡依機臺與發卡行</text>

  <rect x="820" y="682" width="740" height="158" rx="22" fill="#FFFFFF" stroke="#9A886F" stroke-width="2"/>
  <text x="848" y="724" font-size="24" font-weight="700" fill="#12383A">統一發票兌獎</text>
  <text x="848" y="764" font-size="19" fill="#263D3E">六獎 NT$200、五獎 NT$1,000 可到指定超商｜證件依身分準備</text>
  <text x="848" y="802" font-size="18" fill="#5A6666">三獎 NT$10,000（含）以上，由發獎單位扣繳 20% 所得稅</text>
  <text x="1545" y="875" text-anchor="end" font-size="16" fill="#687777">© Mokaair 2026</text>
</svg>
