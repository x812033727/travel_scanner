  <text x="230" y="254" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">夜市・小吃攤・傳統市場</text>
  <text x="230" y="282" font-size="15" fill="#FBE9E4" text-anchor="middle">Night markets, food stalls, markets</text>
  <path d="M 230 298 L 230 318" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="60" y="322" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="230" y="354" font-size="26" font-weight="700" fill="#B8442D" text-anchor="middle">現金</text>
  <text x="230" y="382" font-size="17" font-weight="700" fill="#B8442D" text-anchor="middle">Cash (NT$)</text>
  <rect x="60" y="410" width="340" height="322" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="2"/>
  <g font-size="16" fill="#102A2B">
    <text x="78" y="442">● 攤販、傳統市場多只收現金</text>
    <text x="96" y="464" fill="#5C6B6B">Stalls, markets: often cash only</text>
    <text x="78" y="500">● 先在超商把 NT$1,000 換開</text>
    <text x="96" y="522" fill="#5C6B6B">Break NT$1,000 notes at a store</text>
    <text x="78" y="558">● 紙鈔：100、200、500、1,000、2,000</text>
    <text x="96" y="580" fill="#5C6B6B">Notes: NT$100 to NT$2,000</text>
    <text x="78" y="616">● 硬幣：1、5、10、20、50</text>
    <text x="96" y="638" fill="#5C6B6B">Coins: NT$1 to NT$50</text>
    <text x="78" y="674">● 小咖啡店、小吃店也常只收現金</text>
    <text x="96" y="696" fill="#5C6B6B">Small cafés, eateries: often cash</text>
  </g>

  <!-- column 2: convenience stores -->
  <rect x="440" y="222" width="340" height="76" rx="16" fill="#0D6B68"/>
  <text x="610" y="254" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">便利商店　7-ELEVEN・全家</text>
  <text x="610" y="282" font-size="15" fill="#DCEFEE" text-anchor="middle">Convenience stores</text>
  <path d="M 610 298 L 610 318" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="440" y="322" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="610" y="354" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">悠遊卡・感應刷卡</text>
  <text x="610" y="382" font-size="17" font-weight="700" fill="#0D6B68" text-anchor="middle">EasyCard or a tapped card</text>
  <rect x="440" y="410" width="340" height="322" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="2"/>
  <g font-size="16" fill="#102A2B">
    <text x="458" y="442">● 悠遊卡單筆上限 NT$1,500、</text>
    <text x="476" y="464">每日上限 NT$3,000</text>
    <text x="476" y="486" fill="#5C6B6B">EasyCard: NT$1,500 a purchase,</text>
    <text x="476" y="508" fill="#5C6B6B">NT$3,000 a day</text>
    <text x="458" y="544">● 7-ELEVEN 信用卡限感應式：</text>
    <text x="476" y="566">國外 Visa、Mastercard、JCB、銀聯</text>
    <text x="476" y="588" fill="#5C6B6B">Tap only: foreign Visa, Mastercard,</text>
    <text x="476" y="610" fill="#5C6B6B">JCB and UnionPay</text>
    <text x="458" y="646">● 境外支付 PayPay、GLN；</text>
    <text x="476" y="668">支付寶、微信支付限中國大陸用戶</text>
    <text x="476" y="690" fill="#5C6B6B">Alipay and WeChat Pay: mainland</text>
    <text x="476" y="712" fill="#5C6B6B">China users only</text>
  </g>

  <!-- column 3: department stores, restaurants, hotels -->
  <rect x="820" y="222" width="340" height="76" rx="16" fill="#6B4A3A"/>
  <text x="990" y="254" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">百貨公司・連鎖餐廳・飯店</text>
  <text x="990" y="282" font-size="15" fill="#F1E8E2" text-anchor="middle">Department stores, restaurants, hotels</text>
  <path d="M 990 298 L 990 318" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="820" y="322" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="990" y="354" font-size="26" font-weight="700" fill="#6B4A3A" text-anchor="middle">信用卡</text>
  <text x="990" y="382" font-size="17" font-weight="700" fill="#6B4A3A" text-anchor="middle">Credit card</text>
  <rect x="820" y="410" width="340" height="322" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="2"/>
  <g font-size="16" fill="#102A2B">
    <text x="838" y="442">● 城市多數商店收主要信用卡</text>
    <text x="856" y="464" fill="#5C6B6B">Most city shops take major cards</text>
    <text x="838" y="500">● AMEX、Mastercard、Visa、</text>
    <text x="856" y="522">Diners Club、JCB</text>
    <text x="838" y="558">● 飯店、餐廳加收 10% 服務費</text>
    <text x="856" y="580" fill="#5C6B6B">10% service charge added</text>
    <text x="838" y="616">● 不必給小費</text>
    <text x="856" y="638" fill="#5C6B6B">No tipping needed</text>
    <text x="838" y="674">● 結帳請選新臺幣</text>
    <text x="856" y="696" fill="#5C6B6B">Choose NT$, not home currency</text>
  </g>

