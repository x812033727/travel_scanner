  <text x="800" y="141" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">你在哪裡付錢？</text>
  <text x="800" y="166" font-size="16" fill="#DCEFEE" text-anchor="middle">Where are you paying?</text>

  <!-- connectors -->
  <path d="M 800 178 L 800 196 M 230 196 L 1370 196" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 230 196 L 230 218" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 610 196 L 610 218" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 990 196 L 990 218" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1370 196 L 1370 218" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- column 1: night markets -->
