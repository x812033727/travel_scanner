<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">這個場合怎麼付？台灣付款決策樹 / How do I pay here? A payment decision tree for Taiwan</title>
  <desc id="desc">從「你在哪裡付錢」分成四條路。夜市、小吃攤、傳統市場：付現金，攤販與市場多只收現金，先在超商把 NT$1,000 鈔票換開；紙鈔有 100、200、500、1,000、2,000 元，硬幣有 1、5、10、20、50 元。便利商店 7-ELEVEN 與全家：用悠遊卡或感應刷卡，悠遊卡在商店單筆上限 NT$1,500、每日 NT$3,000；7-ELEVEN 信用卡限感應式，含國外 Visa、Mastercard、JCB 與銀聯；境外支付有 PayPay、GLN，支付寶與微信支付限中國大陸用戶。百貨公司、連鎖餐廳、飯店：刷信用卡，城市多數商店收主要信用卡（美國運通、萬事達、Visa、大來、JCB），飯店與餐廳加收 10% 服務費，不必給小費，結帳選新臺幣。捷運、公車、YouBike：用悠遊卡，交通扣款不受 NT$1,500 上限，卡片 NT$100、儲值上限 NT$10,000；台北捷運閘門也可感應 Visa、Mastercard、JCB、銀聯等銀行卡，按單程票價扣款、沒有轉乘優惠；台北市公車不收信用卡。底部：郵局 ATM 受理銀聯卡提領新臺幣，全家店內銀行 ATM 提供國際金融卡提款，手續費依卡片而定；統一發票六獎 NT$200 與五獎 NT$1,000 可在超商兌換，外國旅客帶護照，陸港澳居民帶入出境許可證，NT$10,000 以上獎金扣 20% 所得稅。Four branches from where you are paying: cash at night markets, stalls and traditional markets; EasyCard or a tapped card at convenience stores, with EasyCard capped at NT$1,500 per purchase and NT$3,000 a day, 7-ELEVEN taking contactless foreign Visa, Mastercard, JCB and UnionPay, and PayPay, GLN, Alipay and WeChat Pay (mainland users only) as cross-border options; credit cards at department stores, restaurants and hotels, where a 10% service charge replaces tipping; EasyCard on the MRT, buses and YouBike, where fares skip the NT$1,500 limit, the card costs NT$100 and balances stop at NT$10,000; Taipei MRT gates also take tapped bank cards at the single-journey fare with no transfer discount, and Taipei city buses take no credit cards. Footer notes on ATMs and the receipt lottery.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="58" font-size="32" font-weight="700" fill="#102A2B">這個場合怎麼付？　How do I pay here?</text>
  <text x="60" y="92" font-size="18" fill="#5C6B6B">2026 年 9 月依悠遊卡、7-ELEVEN、全家、中華郵政、台北捷運、觀光署與財政部官網查證 · Checked on official pages, September 2026</text>

