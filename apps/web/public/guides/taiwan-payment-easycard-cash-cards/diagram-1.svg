  <rect x="1200" y="222" width="340" height="76" rx="16" fill="#2F6F9F"/>
  <text x="1370" y="254" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">捷運・公車・YouBike</text>
  <text x="1370" y="282" font-size="15" fill="#E6F0F7" text-anchor="middle">MRT, city buses, YouBike</text>
  <path d="M 1370 298 L 1370 318" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1200" y="322" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1370" y="354" font-size="26" font-weight="700" fill="#2F6F9F" text-anchor="middle">悠遊卡</text>
  <text x="1370" y="382" font-size="17" font-weight="700" fill="#2F6F9F" text-anchor="middle">EasyCard</text>
  <rect x="1200" y="410" width="340" height="322" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="2"/>
  <g font-size="16" fill="#102A2B">
    <text x="1218" y="442">● 交通扣款不受 NT$1,500 上限</text>
    <text x="1236" y="464" fill="#5C6B6B">Fares skip the NT$1,500 limit</text>
    <text x="1218" y="500">● 卡片 NT$100，儲值上限 NT$10,000</text>
    <text x="1236" y="522" fill="#5C6B6B">Card NT$100; max balance NT$10,000</text>
    <text x="1218" y="558">● 台北捷運閘門也可感應銀行卡：</text>
    <text x="1236" y="580">單程票價，沒有轉乘優惠</text>
    <text x="1236" y="602" fill="#5C6B6B">Taipei MRT takes tapped bank cards:</text>
    <text x="1236" y="624" fill="#5C6B6B">single fare, no transfer discount</text>
    <text x="1218" y="660">● 台北市公車不收信用卡</text>
    <text x="1236" y="682" fill="#5C6B6B">Taipei city buses: no credit cards</text>
