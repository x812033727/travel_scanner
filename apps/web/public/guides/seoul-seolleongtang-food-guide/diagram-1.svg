  <rect x="555" y="108" width="490" height="60" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="145" font-size="23" font-weight="700" fill="#0B4F4D" text-anchor="middle">곰탕　牛骨湯</text>

  <rect x="1070" y="108" width="490" height="60" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1315" y="145" font-size="23" font-weight="700" fill="#0B4F4D" text-anchor="middle">꼬리곰탕　牛尾湯</text>

  <!-- row 1 label -->
  <text x="60" y="196" font-size="16" font-weight="700" fill="#5C6B6B">鍋裡下了什麼</text>

  <!-- row 1 boxes -->
  <rect x="40" y="206" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="66" y="242" font-size="17" fill="#102A2B">牛頭、牛腿骨、牛膝骨、</text>
  <text x="66" y="270" font-size="17" fill="#102A2B">牛腱肉、牛腩、內臟</text>

  <rect x="555" y="206" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="581" y="242" font-size="17" fill="#102A2B">牛腩、牛腱肉、胸腹肉、</text>
  <text x="581" y="270" font-size="17" fill="#102A2B">牛尾、牛腿肉（連著牛骨）</text>

  <rect x="1070" y="206" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1096" y="256" font-size="17" fill="#102A2B">整條牛尾切塊</text>

  <!-- row 2 label -->
  <text x="60" y="340" font-size="16" font-weight="700" fill="#5C6B6B">官方頁怎麼形容湯</text>

  <!-- row 2 boxes -->
  <rect x="40" y="350" width="490" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="66" y="388" font-size="18" font-weight="700" fill="#102A2B">熬製成乳白湯色</text>
  <text x="66" y="418" font-size="15" fill="#5C6B6B">（四條裡唯一寫到顏色的）</text>

  <rect x="555" y="350" width="490" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="581" y="388" font-size="18" font-weight="700" fill="#102A2B">官方頁沒寫湯色</text>
  <text x="581" y="418" font-size="15" fill="#5C6B6B">只寫濃郁湯頭、肉軟嫩清爽</text>

  <rect x="1070" y="350" width="490" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1096" y="388" font-size="18" font-weight="700" fill="#102A2B">官方頁沒寫湯色</text>
  <text x="1096" y="418" font-size="15" fill="#5C6B6B">只寫熬到肉一碰就掉</text>

  <!-- row 3 label -->
  <text x="60" y="504" font-size="16" font-weight="700" fill="#5C6B6B">怎麼配</text>

  <!-- row 3 boxes -->
  <rect x="40" y="514" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="66" y="562" font-size="17" fill="#102A2B">通常泡著飯吃</text>

  <rect x="555" y="514" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="581" y="562" font-size="17" fill="#102A2B">官方頁沒寫</text>

  <rect x="1070" y="514" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1096" y="562" font-size="17" fill="#102A2B">白飯泡進湯裡</text>

  <!-- bottom banner -->
  <rect x="40" y="632" width="1520" height="178" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="678" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">首爾這幾家店自己的官方頁，不分賣설렁탕還是곰탕，</text>
  <text x="800" y="712" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">都把湯寫成맑은・깔끔한・말간（清、乾淨、清澈）——</text>
  <text x="800" y="746" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">湯色是哪一家店的作法，不是哪一道菜的規則。</text>
  <text x="800" y="780" font-size="15" fill="#3B6E90" text-anchor="middle">湯色不是分辨的依據；能分得出來的是鍋裡下了牛的哪個部位</text>

  <!-- footer -->
  <text x="60" y="840" font-size="16" fill="#102A2B">圖上的官方定義出自韓國觀光公社（KTO）繁體中文料理辭典，逐字依據見正文與表格。</text>
