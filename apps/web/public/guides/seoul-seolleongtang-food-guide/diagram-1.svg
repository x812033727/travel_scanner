<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR',system-ui,sans-serif">
  <title id="title">首爾설렁탕・곰탕菜單解碼圖 / How to read a Seoul beef-bone soup menu</title>
  <desc id="desc">圖上的標題是「菜單上那排탕，差在鍋裡下了什麼部位」，副標是「Same menu, different cuts of beef — not different soup colours」。圖分三欄，欄頭分別是설렁탕（雪濃湯）、곰탕（牛骨湯）、꼬리곰탕（牛尾湯），每欄由上而下兩列。第一列的標題是「鍋裡下了什麼」：설렁탕下牛頭、牛腿骨、牛膝骨、牛腱肉、牛腩、內臟；곰탕下牛腩、牛腱肉、胸腹肉、牛尾、牛腿肉，連著牛骨；꼬리곰탕是整條牛尾切塊。第二列的標題是「熬出來是什麼樣子」：설렁탕長時間熬到湯色轉成乳白；곰탕湯頭濃郁、肉軟嫩清爽；꼬리곰탕大量清水熬到肉一碰就掉。再下面一排的標題是「上桌後怎麼吃」，三個方框寫：先喝一口原味的湯；用鹽與胡椒調味，再放蔥；泡菜不用另外點。最下面橫跨整張圖的橫幅寫「湯色不是分辨的依據，分得出來的是鍋裡下了牛的哪個部位」，下面一行寫「同一道湯，這家寫清爽乾淨、那家寫乳白；湯色是哪一家店的作法，不是哪一道菜的規則」。湯名照韓文寫，方便對照菜單。左下角是「資料：KTO 料理辭典」，右下角是「© Mokaair 製圖 2026」。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">菜單上那排탕，差在鍋裡下了什麼部位</text>
  <text x="60" y="88" font-size="18" fill="#5C6B6B">Same menu, different cuts of beef — not different soup colours</text>

  <!-- column headers -->
  <rect x="40" y="110" width="490" height="60" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="285" y="148" font-size="23" font-weight="700" fill="#0B4F4D" text-anchor="middle">설렁탕　雪濃湯</text>

  <rect x="555" y="110" width="490" height="60" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="148" font-size="23" font-weight="700" fill="#0B4F4D" text-anchor="middle">곰탕　牛骨湯</text>

  <rect x="1070" y="110" width="490" height="60" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1315" y="148" font-size="23" font-weight="700" fill="#0B4F4D" text-anchor="middle">꼬리곰탕　牛尾湯</text>

  <!-- row 1 label -->
  <text x="60" y="200" font-size="16" font-weight="700" fill="#5C6B6B">鍋裡下了什麼</text>

  <!-- row 1 boxes -->
  <rect x="40" y="212" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="66" y="252" font-size="17" fill="#102A2B">牛頭、牛腿骨、牛膝骨、</text>
  <text x="66" y="282" font-size="17" fill="#102A2B">牛腱肉、牛腩、內臟</text>

  <rect x="555" y="212" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="581" y="252" font-size="17" fill="#102A2B">牛腩、牛腱肉、胸腹肉、</text>
  <text x="581" y="282" font-size="17" fill="#102A2B">牛尾、牛腿肉（連著牛骨）</text>

  <rect x="1070" y="212" width="490" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1096" y="268" font-size="17" fill="#102A2B">整條牛尾切塊</text>

  <!-- row 2 label -->
  <text x="60" y="346" font-size="16" font-weight="700" fill="#5C6B6B">熬出來是什麼樣子</text>

  <!-- row 2 boxes -->
  <rect x="40" y="358" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="66" y="404" font-size="17" fill="#102A2B">長時間熬到湯色轉成乳白</text>

  <rect x="555" y="358" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="581" y="404" font-size="17" fill="#102A2B">湯頭濃郁、肉軟嫩清爽</text>

  <rect x="1070" y="358" width="490" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1096" y="404" font-size="17" fill="#102A2B">大量清水熬到肉一碰就掉</text>

  <!-- row 3 label: the same for all three bowls, so it is one band of three steps -->
  <text x="60" y="478" font-size="16" font-weight="700" fill="#5C6B6B">上桌後怎麼吃</text>

  <rect x="40" y="490" width="490" height="84" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
  <text x="285" y="538" font-size="17" fill="#102A2B" text-anchor="middle">先喝一口原味的湯</text>

  <rect x="555" y="490" width="490" height="84" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
  <text x="800" y="538" font-size="17" fill="#102A2B" text-anchor="middle">用鹽與胡椒調味，再放蔥</text>

  <rect x="1070" y="490" width="490" height="84" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
  <text x="1315" y="538" font-size="17" fill="#102A2B" text-anchor="middle">泡菜不用另外點</text>

  <!-- bottom banner -->
  <rect x="40" y="606" width="1520" height="174" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="682" font-size="24" font-weight="700" fill="#1F4E73" text-anchor="middle">湯色不是分辨的依據，分得出來的是鍋裡下了牛的哪個部位</text>
  <text x="800" y="726" font-size="18" fill="#3B6E90" text-anchor="middle">同一道湯，這家寫清爽乾淨、那家寫乳白；湯色是哪一家店的作法，不是哪一道菜的規則</text>

  <!-- footer -->
  <text x="60" y="845" font-size="16" fill="#5C6B6B">湯名照韓文寫，方便對照菜單　・　資料：KTO 料理辭典</text>
  <text x="1540" y="845" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
