<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR',system-ui,sans-serif">
  <title id="title">首爾설렁탕・곰탕菜單解碼圖 / How to read a Seoul beef-bone soup menu</title>
  <desc id="desc">圖解分三欄，每欄一碗湯，標題寫「菜單上那排탕，差在鍋裡下了什麼部位」，副標寫 Same menu, different cuts of beef — not different soup colours。三欄的欄頭分別是설렁탕（雪濃湯）、곰탕（牛骨湯）、꼬리곰탕（牛尾湯），每欄由上而下三列：鍋裡下了什麼、官方頁怎麼形容湯、怎麼配。설렁탕欄：鍋裡下牛頭、牛腿骨、牛膝骨、牛腱肉、牛腩、內臟；官方頁形容湯熬製成乳白湯色，是四條官方料理頁裡唯一寫到顏色的一條；通常泡著飯吃。곰탕欄：鍋裡下牛腩、牛腱肉、胸腹肉、牛尾、牛腿肉，連著牛骨燉；官方頁沒寫湯色，只寫濃郁湯頭、肉軟嫩清爽；怎麼配官方頁沒寫。꼬리곰탕欄：整條牛尾切塊；官方頁沒寫湯色，只寫熬到肉一碰就掉；白飯泡進湯裡。三欄底下的橫幅寫：首爾這幾家店自己的官方頁，不分賣설렁탕還是곰탕，都把湯寫成맑은・깔끔한・말간（清、乾淨、清澈）——湯色是哪一家店的作法，不是哪一道菜的規則；湯色不是分辨的依據，能分得出來的是鍋裡下了牛的哪個部位。圖上的官方定義出自韓國觀光公社（KTO）繁體中文料理辭典，逐字依據見正文與表格。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

