<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">只能訂一個：依用途走的決策樹 / Which AI subscription to pay for: a decision tree by use case</title>
  <desc id="desc">一張四列的決策樹。最左邊的起點問「你每週花最多時間做的是哪一件事」，往右分成四條路。第一條是生圖、生影片，該看影片生成在哪一層方案解鎖，官網結論是 Gemini 每月 NT$ 165 元起、Claude 官網寫明不生成圖片、ChatGPT 的 Sora 已結束。第二條是長文件、程式碼，該看上下文視窗與單檔上限，結論是 Gemini AI Pro 為 100 萬 token、Claude 新模型為 100 萬 token、ChatGPT 官網未公布數字。第三條是寫作、翻譯，該看額度怎麼算與重設週期，結論是 Claude 與 Gemini 每 5 小時重設、ChatGPT 日常文字對話不限量、先看免費版撐不撐得住。第四條是家人一起用，該看官網有沒有家庭共用方案，結論是 Gemini 最多與 5 位成員共用、ChatGPT 與 Claude 個人方案無、多人只能走商務方案。底部註明年繳只有 Claude 與 Google AI 方案有，ChatGPT 官網寫目前不支援年繳，價格與規格以 2026 年 9 月 15 日官網當天頁面為準。</desc>
