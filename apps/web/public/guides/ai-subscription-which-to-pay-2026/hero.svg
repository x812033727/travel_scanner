<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">只能訂一個：一個起點分成三條用途 / One subscription, three kinds of use</title>
  <desc id="desc">一張幾何插圖。左邊有一個深綠色的大圓圈代表起點，圓心是一個實心圓點。三條粗線從圓圈右側往外分岔，分別彎向右邊的三個圓角方框：上面的方框裡畫著一份有三行橫線的文件，中間的方框裡畫著程式碼的角括號與斜線，下面的方框裡畫著一段兩側有孔的影片膠捲。畫面左上角有一行字寫著「只能訂一個」，背景散落幾個橘色、藍色與綠色的圓點。整張圖沒有任何品牌標誌、介面或人物。</desc>
