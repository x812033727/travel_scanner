<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Fewer Search Clicks? Check Tasks First</title><desc id="desc">Four columns explain task categories, information syncing, in-depth content and outcome checks, reminding readers that platform actions are not sales and unresolved attribution remains unknown.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Fewer Search Clicks? Check Tasks First</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">From reader needs to actual service, assess evidence at each stage separately</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Classify tasks</text>
<text x="108.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Basics and comparisons</text>
<text x="108.0" y="423" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">Check requirements and book</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Is a site visit needed?</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Sync information</text>
<text x="477.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Address, hours and phone</text>
<text x="477.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Clear terms and exceptions</text>
<text x="477.0" y="475" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Record where errors occur</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Fill content gaps</text>
<text x="846.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Preparation lists and steps</text>
<text x="846.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Real evidence and limits</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Easy next steps</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Review results</text>
<text x="1215.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Clicks, interactions, intake</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Actions ≠ sales</text>
<text x="1215.0" y="475" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Keep unclear attribution open</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Assess content by task completion and information quality, not clicks alone for every outcome.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
