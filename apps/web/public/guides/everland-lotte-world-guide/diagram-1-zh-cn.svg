<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">爱宝乐园还是乐天世界：三个问题的决策树 / Everland 或 Lotte World Adventure</title>
  <desc id="desc">三个问题。问题一：只有半天或一个晚上，或者当天下雨、下雪、寒潮？是就去乐天世界：地铁 2 号线、8 号线蚕室站 4 号出口直通，周日到周四 10:00 到 21:00、周五周六 10:00 到 22:00，综合票成人 67,000 韩元。否就问题二：想玩木质过山车 T Express、看熊猫与野生动物、在花季赏花？是就去爱宝乐园：水仁盆唐线器兴站转龙仁轻电铁到前垈·爱宝乐园站，交通卡 1,550 韩元，首班 05:30、末班 23:30，门票按日期分级，以官网为准。否就问题三：带学龄前小孩、推婴儿车，想省交通时间？是就乐天世界，室内主馆游览路线短、婴儿车推行方便，傍晚入园玩到闭园也划算，Magic Pass 限量，入园先买；否就分两天都去，第一天爱宝乐园玩一整天，第二天乐天世界下午入园到闭园，住蚕室或江南最顺路。底下两个补充框：爱宝乐园开园就到、先去 T Express、Q-Pass 限量、下雨户外设施停运；乐天世界最后入场时间是闭园前 1 小时、Atlantis 与 Gyro Drop 节假日排一小时、Seoul Sky 在同一个街区。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">爱宝乐园还是乐天世界：三个问题决定（2026 年 9 月核实）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Everland 还是 Lotte World Adventure：三个问题的决策树</text>


  <polygon points="800,112 1140,172 800,232 460,172" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="166" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 1　只有半天或一个晚上，</text>
  <text x="800" y="192" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">或者当天下雨、下雪、寒潮？</text>
  <path d="M 1140 172 L 1166 172" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="162" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="117" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1370" y="146" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">乐天世界 롯데월드 Lotte World</text>
  <text x="1370" y="170" font-size="15" fill="#8A2E1D" text-anchor="middle">잠실역 蚕室站 Jamsil：2 号线、8 号线 4 号出口直通</text>
  <text x="1370" y="194" font-size="15" fill="#8A2E1D" text-anchor="middle">日～四 10:00 到 21:00・五六 10:00 到 22:00</text>
  <text x="1370" y="218" font-size="15" fill="#8A2E1D" text-anchor="middle">综合票成人 67,000 韩元（韩国观光公社页面）</text>
  <path d="M 800 234 L 800 268" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="256" font-size="16" fill="#5C6B6B">否</text>


  <polygon points="800,272 1140,332 800,392 460,332" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="326" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 2　想玩木质过山车 T Express、</text>
  <text x="800" y="352" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">看熊猫与野生动物、在花季赏花？</text>
  <path d="M 1140 332 L 1166 332" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="322" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="277" width="400" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1370" y="306" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">爱宝乐园 에버랜드 Everland</text>
  <text x="1370" y="330" font-size="15" fill="#0B4F4D" text-anchor="middle">水仁盆唐线 기흥 器兴转龙仁轻电铁到 전대·에버랜드</text>
  <text x="1370" y="354" font-size="15" fill="#0B4F4D" text-anchor="middle">交通卡 1,550 韩元・首班 05:30・末班 23:30</text>
  <text x="1370" y="378" font-size="15" fill="#0B4F4D" text-anchor="middle">门票按日期分级，金额以官网当天公告为准</text>
  <path d="M 800 394 L 800 428" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="416" font-size="16" fill="#5C6B6B">否</text>


  <polygon points="800,432 1140,492 800,552 460,492" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="486" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 3　带学龄前小孩、推婴儿车，</text>
  <text x="800" y="512" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">想省交通时间？</text>
  <path d="M 1140 492 L 1166 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="482" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="437" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1370" y="466" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">乐天世界（带幼儿版）</text>
  <text x="1370" y="490" font-size="15" fill="#8A2E1D" text-anchor="middle">室内主馆路线短、婴儿车好推</text>
  <text x="1370" y="514" font-size="15" fill="#8A2E1D" text-anchor="middle">傍晚入园玩到闭园也划算</text>
  <text x="1370" y="538" font-size="15" fill="#8A2E1D" text-anchor="middle">Magic Pass 限量，入园先买</text>
  <path d="M 460 492 L 434 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="446" y="482" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="437" width="400" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="230" y="466" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">分两天都去</text>
  <text x="230" y="490" font-size="15" fill="#1F4E73" text-anchor="middle">第一天爱宝乐园玩一整天</text>
  <text x="230" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">第二天乐天世界下午入园到闭园</text>
  <text x="230" y="538" font-size="15" fill="#1F4E73" text-anchor="middle">住蚕室或江南最顺路</text>


  <rect x="60" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3" />
  <text x="88" y="634" font-size="19" font-weight="700" fill="#102A2B">爱宝乐园 Everland：怎么玩才顺</text>
  <text x="88" y="666" font-size="16" fill="#102A2B">开园就到，先去 T Express；Q-Pass 付费限量，开园后很快卖完</text>
  <text x="88" y="694" font-size="16" fill="#102A2B">动物区（Lost Valley、熊猫世界）安排在中午，花季与万圣节活动留到傍晚</text>
  <text x="88" y="722" font-size="16" fill="#102A2B">下雨天户外设施会停运；轻电铁末班 23:30，玩到闭园要看好返程</text>

  <rect x="820" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3" />
  <text x="848" y="634" font-size="19" font-weight="700" fill="#102A2B">乐天世界 Lotte World：怎么玩才顺</text>
  <text x="848" y="666" font-size="16" fill="#102A2B">最后入场时间是闭园前 1 小时；Atlantis、Gyro Drop 节假日排一小时是常态</text>
  <text x="848" y="694" font-size="16" fill="#102A2B">Magic Pass Premium 限量；室内主馆雨天、冬天照玩</text>
  <text x="848" y="722" font-size="16" fill="#102A2B">Seoul Sky 观景台、乐天百货与超市在同一个街区，晚餐采购一起解决</text>

  <text x="60" y="800" font-size="15" fill="#5C6B6B">营业时间与票价于 2026 年 9 月核实：乐天世界依据韩国观光公社页面，爱宝乐园票价按日期分级、以官网当天公告为准；龙仁轻电铁票价与首末班依据官网。</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 制图 2026</text>
