<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">愛寶樂園還是樂天世界：三個問題的決策樹 / Everland or Lotte World Adventure</title>
  <desc id="desc">三個問題。問題一：只有半天或一個晚上，或者當天下雨、下雪、寒流？是就去樂天世界：地鐵 2 號線、8 號線蠶室站 4 號出口直通，週日到週四 10:00 到 21:00、週五週六 10:00 到 22:00，綜合券成人 67,000 韓元。否就問題二：想玩木造雲霄飛車 T Express、看熊貓與野生動物、賞花季？是就去愛寶樂園：水仁盆唐線器興站轉龍仁輕電鐵到前垈·愛寶樂園站，交通卡 1,550 韓元，首班 05:30、末班 23:30，門票依日期分級以官網為準。否就問題三：帶學齡前小孩、推推車，想省交通時間？是就樂天世界，室內主館動線短、推車好推，傍晚入園玩到打烊也划算，Magic Pass 限量入園先買；否就兩天都去，第一天愛寶樂園玩一整天，第二天樂天世界下午入園到打烊，住蠶室或江南最順。底下兩個補充框：愛寶樂園開園就到、T Express 先衝、Q-Pass 限量、下雨戶外設施停駛；樂天世界最後入場是打烊前 1 小時、Atlantis 與 Gyro Drop 假日排一小時、Seoul Sky 在同一個街區。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">愛寶樂園還是樂天世界：三個問題決定（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Everland or Lotte World Adventure: a three-question decision tree</text>

  <!-- Q1 -->
  <polygon points="800,112 1140,172 800,232 460,172" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="166" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　只有半天或一個晚上，</text>
  <text x="800" y="192" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">或者當天下雨、下雪、寒流？</text>
  <path d="M 1140 172 L 1166 172" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1144" y="162" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="117" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1370" y="146" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">樂天世界 롯데월드 Lotte World</text>
  <text x="1370" y="170" font-size="15" fill="#8A2E1D" text-anchor="middle">잠실역 蠶室站 Jamsil：2 號線、8 號線 4 號出口直通</text>
  <text x="1370" y="194" font-size="15" fill="#8A2E1D" text-anchor="middle">日～四 10:00 到 21:00・五六 10:00 到 22:00</text>
  <text x="1370" y="218" font-size="15" fill="#8A2E1D" text-anchor="middle">綜合券成人 67,000 韓元（韓國觀光公社頁面）</text>
  <path d="M 800 234 L 800 268" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="256" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,272 1140,332 800,392 460,332" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="326" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　想玩木造雲霄飛車 T Express、</text>
  <text x="800" y="352" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">看熊貓與野生動物、賞花季？</text>
  <path d="M 1140 332 L 1166 332" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1144" y="322" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="277" width="400" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1370" y="306" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">愛寶樂園 에버랜드 Everland</text>
  <text x="1370" y="330" font-size="15" fill="#0B4F4D" text-anchor="middle">水仁盆唐線 기흥 器興 轉龍仁輕電鐵到 전대·에버랜드</text>
  <text x="1370" y="354" font-size="15" fill="#0B4F4D" text-anchor="middle">交通卡 1,550 韓元・首班 05:30・末班 23:30</text>
  <text x="1370" y="378" font-size="15" fill="#0B4F4D" text-anchor="middle">門票依日期分級，金額以官網當日公告為準</text>
  <path d="M 800 394 L 800 428" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="416" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="800,432 1140,492 800,552 460,492" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="486" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　帶學齡前小孩、推推車，</text>
  <text x="800" y="512" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">想省交通時間？</text>
  <path d="M 1140 492 L 1166 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1144" y="482" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="437" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1370" y="466" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">樂天世界（帶幼兒版）</text>
  <text x="1370" y="490" font-size="15" fill="#8A2E1D" text-anchor="middle">室內主館動線短、推車好推</text>
  <text x="1370" y="514" font-size="15" fill="#8A2E1D" text-anchor="middle">傍晚入園玩到打烊也划算</text>
  <text x="1370" y="538" font-size="15" fill="#8A2E1D" text-anchor="middle">Magic Pass 限量，入園先買</text>
  <path d="M 460 492 L 434 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="446" y="482" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="437" width="400" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="230" y="466" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">兩天都去</text>
  <text x="230" y="490" font-size="15" fill="#1F4E73" text-anchor="middle">第一天愛寶樂園玩一整天</text>
  <text x="230" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">第二天樂天世界下午入園到打烊</text>
  <text x="230" y="538" font-size="15" fill="#1F4E73" text-anchor="middle">住蠶室或江南最順</text>

  <!-- notes -->
  <rect x="60" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="88" y="634" font-size="19" font-weight="700" fill="#102A2B">愛寶樂園 Everland：怎麼玩才順</text>
  <text x="88" y="666" font-size="16" fill="#102A2B">開園就到，T Express 先衝；Q-Pass 付費限量，開園後很快賣完</text>
  <text x="88" y="694" font-size="16" fill="#102A2B">動物區（Lost Valley、熊貓世界）排中午，花季與萬聖節活動留傍晚</text>
  <text x="88" y="722" font-size="16" fill="#102A2B">下雨天戶外設施會停駛；輕電鐵末班 23:30，玩到打烊要看好回程</text>

  <rect x="820" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="634" font-size="19" font-weight="700" fill="#102A2B">樂天世界 Lotte World：怎麼玩才順</text>
  <text x="848" y="666" font-size="16" fill="#102A2B">最後入場是打烊前 1 小時；Atlantis、Gyro Drop 假日排一小時是常態</text>
  <text x="848" y="694" font-size="16" fill="#102A2B">Magic Pass Premium 限量；室內主館雨天、冬天照玩</text>
  <text x="848" y="722" font-size="16" fill="#102A2B">Seoul Sky 觀景台、樂天百貨與超市在同一個街區，晚餐採買一起解決</text>

  <text x="60" y="800" font-size="15" fill="#5C6B6B">營業時間與票價 2026 年 9 月查證：樂天世界依韓國觀光公社頁面，愛寶樂園票價依日期分級、以官網當日公告為準；龍仁輕電鐵票價與首末班依官網。</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
