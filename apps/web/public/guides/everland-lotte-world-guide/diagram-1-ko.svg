<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">에버랜드와 롯데월드 중 어디로 갈까: 세 가지 질문으로 고르는 순서도 / Everland 또는 Lotte World Adventure</title>
  <desc id="desc">세 가지 질문. 첫째: 반나절이나 저녁 시간만 있거나, 당일 비·눈·한파가 있는가? 그렇다면 롯데월드: 지하철 2호선·8호선 잠실역 4번 출구 직결, 일요일~목요일 10:00~21:00, 금요일·토요일 10:00~22:00, 종합이용권 성인 67,000원. 아니라면 둘째: 목재 롤러코스터 T Express를 타고, 판다와 야생동물을 보고, 꽃축제를 즐기고 싶은가? 그렇다면 에버랜드: 수인분당선 기흥역에서 용인경전철로 환승해 전대·에버랜드역 하차, 교통카드 1,550원, 첫차 05:30·막차 23:30. 입장권은 날짜별 등급에 따라 달라지며 공식 사이트 기준. 아니라면 셋째: 미취학 아동과 유모차를 동반하며 이동시간을 줄이고 싶은가? 그렇다면 롯데월드: 실내 본관은 동선이 짧고 유모차를 밀기 편하며, 저녁에 입장해 폐장까지 즐겨도 알차다. Magic Pass는 한정 수량이므로 입장 후 먼저 구매. 아니라면 이틀에 걸쳐 두 곳 모두 방문: 첫날 에버랜드에서 하루 종일 즐기고, 둘째 날 롯데월드에 오후 입장해 폐장까지 이용. 잠실이나 강남에 숙박하면 동선이 가장 편하다. 하단 보충 상자 두 개: 에버랜드는 개장할 때 도착해 T Express부터 타고, Q-Pass는 한정 수량이며 비가 오면 야외 시설 운행 중단. 롯데월드는 폐장 1시간 전 입장 마감, Atlantis·Gyro Drop은 휴일에 한 시간 대기가 흔하며 Seoul Sky는 같은 구역에 있다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">에버랜드 vs 롯데월드: 세 가지 질문으로 선택(2026년 9월 확인)</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Everland 또는 Lotte World Adventure: 세 가지 질문으로 고르는 순서도</text>


  <polygon points="800,112 1140,172 800,232 460,172" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="166" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 1　반나절이나 저녁 시간만 있거나,</text>
  <text x="800" y="192" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">당일 비·눈·한파가 있나요?</text>
  <path d="M 1140 172 L 1166 172" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="162" font-size="16" fill="#5C6B6B">예</text>
  <rect x="1170" y="117" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1370" y="146" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">롯데월드 Lotte World</text>
  <text x="1370" y="170" font-size="15" fill="#8A2E1D" text-anchor="middle">잠실역 Jamsil: 2호선·8호선 4번 출구 직결</text>
  <text x="1370" y="194" font-size="15" fill="#8A2E1D" text-anchor="middle">일~목 10:00~21:00·금·토 10:00~22:00</text>
  <text x="1370" y="218" font-size="15" fill="#8A2E1D" text-anchor="middle">종합이용권 성인 67,000원(한국관광공사 페이지)</text>
  <path d="M 800 234 L 800 268" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="256" font-size="16" fill="#5C6B6B">아니요</text>


  <polygon points="800,272 1140,332 800,392 460,332" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="326" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 2　목재 롤러코스터 T Express를 타고,</text>
  <text x="800" y="352" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">판다·야생동물·꽃축제를 보고 싶나요?</text>
  <path d="M 1140 332 L 1166 332" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="322" font-size="16" fill="#5C6B6B">예</text>
  <rect x="1170" y="277" width="400" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="1370" y="306" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">에버랜드 Everland</text>
  <text x="1370" y="330" font-size="15" fill="#0B4F4D" text-anchor="middle">수인분당선 기흥에서 용인경전철 환승 → 전대·에버랜드</text>
  <text x="1370" y="354" font-size="15" fill="#0B4F4D" text-anchor="middle">교통카드 1,550원·첫차 05:30·막차 23:30</text>
  <text x="1370" y="378" font-size="15" fill="#0B4F4D" text-anchor="middle">입장권은 날짜별 등급제, 금액은 당일 공식 공지 기준</text>
  <path d="M 800 394 L 800 428" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="812" y="416" font-size="16" fill="#5C6B6B">아니요</text>


  <polygon points="800,432 1140,492 800,552 460,492" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="486" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 3　미취학 아동·유모차를 동반하며,</text>
  <text x="800" y="512" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">이동시간을 줄이고 싶나요?</text>
  <path d="M 1140 492 L 1166 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1144" y="482" font-size="16" fill="#5C6B6B">예</text>
  <rect x="1170" y="437" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1370" y="466" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">롯데월드(영유아 동반)</text>
  <text x="1370" y="490" font-size="15" fill="#8A2E1D" text-anchor="middle">실내 본관은 동선이 짧고 유모차 이동이 편함</text>
  <text x="1370" y="514" font-size="15" fill="#8A2E1D" text-anchor="middle">저녁에 입장해 폐장까지 즐겨도 알참</text>
  <text x="1370" y="538" font-size="15" fill="#8A2E1D" text-anchor="middle">Magic Pass는 한정 수량, 입장 후 먼저 구매</text>
  <path d="M 460 492 L 434 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="446" y="482" font-size="16" fill="#5C6B6B" text-anchor="end">아니요</text>
  <rect x="30" y="437" width="400" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="230" y="466" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">이틀에 걸쳐 두 곳 모두</text>
  <text x="230" y="490" font-size="15" fill="#1F4E73" text-anchor="middle">첫날은 에버랜드에서 하루 종일</text>
  <text x="230" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">둘째 날은 롯데월드 오후 입장 후 폐장까지</text>
  <text x="230" y="538" font-size="15" fill="#1F4E73" text-anchor="middle">잠실·강남 숙박이 가장 편한 동선</text>


  <rect x="60" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3" />
  <text x="88" y="634" font-size="19" font-weight="700" fill="#102A2B">에버랜드 Everland: 효율적으로 즐기는 법</text>
  <text x="88" y="666" font-size="16" fill="#102A2B">개장 때 도착해 T Express부터. Q-Pass는 유료·한정 수량으로 개장 후 빠르게 매진</text>
  <text x="88" y="694" font-size="16" fill="#102A2B">동물 구역(Lost Valley·판다월드)은 한낮, 꽃축제·핼러윈 행사는 저녁 무렵</text>
  <text x="88" y="722" font-size="16" fill="#102A2B">비 오면 야외 시설 운행 중단. 경전철 막차 23:30, 폐장까지 놀면 귀가편 확인</text>

  <rect x="820" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3" />
  <text x="848" y="634" font-size="19" font-weight="700" fill="#102A2B">롯데월드 Lotte World: 효율적으로 즐기는 법</text>
  <text x="848" y="666" font-size="16" fill="#102A2B">입장 마감은 폐장 1시간 전. Atlantis·Gyro Drop은 휴일에 한 시간 대기가 흔함</text>
  <text x="848" y="694" font-size="16" fill="#102A2B">Magic Pass Premium은 한정 수량. 실내 본관은 비 오는 날·겨울에도 즐길 수 있음</text>
  <text x="848" y="722" font-size="16" fill="#102A2B">Seoul Sky 전망대·롯데백화점·마트가 같은 구역에 있어 저녁 식사·장보기를 함께 해결</text>

  <text x="60" y="800" font-size="15" fill="#5C6B6B">운영시간·요금은 2026년 9월 확인. 롯데월드는 한국관광공사 페이지 기준. 에버랜드는 날짜별 등급 요금으로 당일 공식 공지 기준. 용인경전철 요금·첫차·막차는 공식 사이트 기준.</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 도표 제작 2026</text>
</svg>
