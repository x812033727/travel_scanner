<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">エバーランドとロッテワールド：三つの質問で選ぶフローチャート / EverlandとLotte World Adventure、どちらを選ぶ？</title>
  <desc id="desc">三つの質問。質問一：半日か夜しか時間がない、または当日が雨・雪・寒波？はいならロッテワールドへ。地下鉄2号線・8号線の蚕室駅4番出口直結。日〜木曜10:00〜21:00、金・土曜10:00〜22:00。総合利用券は大人67,000ウォン。いいえなら質問二：木製ジェットコースターT Expressに乗り、パンダや野生動物、季節の花を楽しみたい？はいならエバーランドへ。水仁・盆唐線の器興駅で龍仁軽電鉄に乗り換え、前垈・エバーランド駅へ。交通カード1,550ウォン、始発05:30、終電23:30。チケットは日付別の料金区分制で、公式サイトを確認。いいえなら質問三：未就学児やベビーカー連れで、移動時間を節約したい？はいならロッテワールドへ。屋内メインエリアは移動距離が短く、ベビーカーを押しやすい。夕方から閉園まで遊ぶのもお得。Magic Passは数量限定なので入園したらまず購入。いいえなら二日間で両方へ。初日はエバーランドで丸一日、二日目はロッテワールドに午後から閉園まで。蚕室か江南に泊まると最もスムーズ。下部の補足欄は二つ。エバーランドは開園時に到着し、まずT Expressへ。Q-Passは数量限定で、雨天は屋外アトラクションが運休。ロッテワールドの最終入場は閉園1時間前。AtlantisとGyro Dropは休日に一時間待ち。Seoul Skyは同じ街区にある。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">エバーランドとロッテワールド：三つの質問で選ぶ（2026年9月確認）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">EverlandとLotte World Adventure：三つの質問で選ぶフローチャート</text>


  <polygon points="800,112 1140,172 800,232 460,172" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="800" y="166" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問1　半日か夜しか時間がない、</text>
  <text x="800" y="192" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">または当日が雨・雪・寒波？</text>
  <path d="M 1140 172 L 1166 172" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="1144" y="162" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="1170" y="117" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="1370" y="146" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">ロッテワールド 롯데월드 Lotte World</text>
  <text x="1370" y="170" font-size="15" fill="#8A2E1D" text-anchor="middle">蚕室駅 Jamsil：2号線・8号線、4番出口直結</text>
  <text x="1370" y="194" font-size="15" fill="#8A2E1D" text-anchor="middle">日〜木10:00〜21:00・金土10:00〜22:00</text>
  <text x="1370" y="218" font-size="15" fill="#8A2E1D" text-anchor="middle">総合利用券 大人67,000ウォン（韓国観光公社掲載）</text>
  <path d="M 800 234 L 800 268" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="812" y="256" font-size="16" fill="#5C6B6B">いいえ</text>


  <polygon points="800,272 1140,332 800,392 460,332" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="800" y="326" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問2　木製コースターT Expressに乗り、</text>
  <text x="800" y="352" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">パンダ・野生動物・季節の花を楽しみたい？</text>
  <path d="M 1140 332 L 1166 332" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="1144" y="322" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="1170" y="277" width="400" height="112" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
  <text x="1370" y="306" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">エバーランド 에버랜드 Everland</text>
  <text x="1370" y="330" font-size="15" fill="#0B4F4D" text-anchor="middle">水仁・盆唐線→器興→龍仁軽電鉄→前垈・エバーランド</text>
  <text x="1370" y="354" font-size="15" fill="#0B4F4D" text-anchor="middle">交通カード1,550ウォン・始発05:30・終電23:30</text>
  <text x="1370" y="378" font-size="14" fill="#0B4F4D" text-anchor="middle" style="font-size: 14px;">チケットは日付別料金。金額は公式サイトの当日案内を確認</text>
  <path d="M 800 394 L 800 428" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="812" y="416" font-size="16" fill="#5C6B6B">いいえ</text>


  <polygon points="800,432 1140,492 800,552 460,492" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"></polygon>
  <text x="800" y="486" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問3　未就学児・ベビーカー連れで、</text>
  <text x="800" y="512" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">移動時間を節約したい？</text>
  <path d="M 1140 492 L 1166 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="1144" y="482" font-size="16" fill="#5C6B6B">はい</text>
  <rect x="1170" y="437" width="400" height="112" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"></rect>
  <text x="1370" y="466" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">ロッテワールド（幼児連れ向け）</text>
  <text x="1370" y="490" font-size="15" fill="#8A2E1D" text-anchor="middle">屋内メインエリアは移動が短く、ベビーカーも楽</text>
  <text x="1370" y="514" font-size="15" fill="#8A2E1D" text-anchor="middle">夕方から閉園まで遊ぶのもお得</text>
  <text x="1370" y="538" font-size="15" fill="#8A2E1D" text-anchor="middle">Magic Passは数量限定、入園したらまず購入</text>
  <path d="M 460 492 L 434 492" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"></path>
  <text x="446" y="482" font-size="16" fill="#5C6B6B" text-anchor="end">いいえ</text>
  <rect x="30" y="437" width="400" height="112" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="230" y="466" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">二日間で両方へ</text>
  <text x="230" y="490" font-size="15" fill="#1F4E73" text-anchor="middle">初日はエバーランドで丸一日</text>
  <text x="230" y="514" font-size="15" fill="#1F4E73" text-anchor="middle">二日目はロッテワールドで午後から閉園まで</text>
  <text x="230" y="538" font-size="15" fill="#1F4E73" text-anchor="middle">蚕室か江南に泊まると最もスムーズ</text>


  <rect x="60" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"></rect>
  <text x="88" y="634" font-size="19" font-weight="700" fill="#102A2B">エバーランド Everland：効率よく楽しむコツ</text>
  <text x="88" y="666" font-size="16" fill="#102A2B">開園時に到着し、まずT Expressへ。Q-Passは有料・数量限定で開園後すぐ完売</text>
  <text x="88" y="694" font-size="16" fill="#102A2B">動物エリア（Lost Valley・パンダワールド）は昼、花やハロウィーンのイベントは夕方に</text>
  <text x="88" y="722" font-size="16" fill="#102A2B">雨天は屋外アトラクション運休。軽電鉄の終電23:30、閉園まで遊ぶなら帰路を確認</text>

  <rect x="820" y="600" width="720" height="150" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"></rect>
  <text x="848" y="634" font-size="19" font-weight="700" fill="#102A2B">ロッテワールド Lotte World：効率よく楽しむコツ</text>
  <text x="848" y="666" font-size="16" fill="#102A2B">最終入場は閉園1時間前。Atlantis・Gyro Dropは休日に一時間待ちが普通</text>
  <text x="848" y="694" font-size="16" fill="#102A2B">Magic Pass Premiumは数量限定。屋内メインエリアは雨の日も冬も楽しめる</text>
  <text x="848" y="722" font-size="16" fill="#102A2B">Seoul Sky展望台・ロッテ百貨店・スーパーは同じ街区。夕食と買い物もまとめて</text>

  <text x="60" y="800" font-size="15" fill="#5C6B6B">営業時間・料金は2026年9月確認。ロッテワールドは韓国観光公社の掲載情報。エバーランドは日付別料金で公式サイトの当日案内に従う。龍仁軽電鉄の運賃・始発・終電は公式サイトによる。</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 図制作 2026</text>
</svg>
