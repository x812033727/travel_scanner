  <rect x="1000" y="200" width="500" height="240" rx="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <line x1="1230" y1="200" x2="1260" y2="200" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrowLoop)"/>
  <line x1="1500" y1="305" x2="1500" y2="335" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrowLoop)"/>
  <line x1="1300" y1="440" x2="1270" y2="440" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrowLoop)"/>

  <circle cx="1130" cy="200" r="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="1130" y="150" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">제3땅굴 第三地道</text>
  <text x="1130" y="172" font-size="15" fill="#5C6B6B" text-anchor="middle">3rd Tunnel</text>
  <rect x="1025" y="226" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1090" y="248" font-size="15" fill="#2F6F9F" text-anchor="middle">모노레일 單軌</text>
  <rect x="1165" y="226" width="100" height="32" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="1215" y="248" font-size="15" fill="#2E7D5B" text-anchor="middle">도보 步行</text>

  <circle cx="1370" cy="200" r="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="1370" y="150" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">도라전망대 都羅展望台</text>
  <text x="1370" y="172" font-size="15" fill="#5C6B6B" text-anchor="middle">Dora Observatory</text>

  <circle cx="1370" cy="440" r="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="1370" y="476" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">통일촌 統一村 Tongil Village</text>
  <text x="1010" y="476" font-size="15" fill="#5C6B6B">셔틀버스 接駁巴士環線</text>

  <text x="1250" y="304" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">약 3시간 約 3 小時 About 3 hours</text>
  <text x="1250" y="334" font-size="16" fill="#102A2B" text-anchor="middle">順序依場次：先地道或先展望台</text>
  <text x="1250" y="362" font-size="16" fill="#102A2B" text-anchor="middle">單軌 12,200 韓元、步行 9,200 韓元（一般票）</text>

