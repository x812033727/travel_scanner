  <text x="182" y="318" font-size="15" fill="#5C6B6B" text-anchor="end">Munsan</text>
  <line x1="220" y1="300" x2="240" y2="300" stroke="#D97A2B" stroke-width="3" stroke-dasharray="4 4"/>
  <rect x="242" y="274" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="392" y="299" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">看終點站，需要時轉乘</text>
