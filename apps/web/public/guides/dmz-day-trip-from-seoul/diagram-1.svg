<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾到坡州 DMZ 和平觀光路線與三種選擇 / Seoul to the Paju DMZ Peace Tour: route and options</title>
  <desc id="desc">上半是路線圖：從首爾弘大入口、孔德等站搭京義中央線往汶山，看清楚終點、需要時在汶山站轉乘，到臨津江站；臨津江站步行約 20 分鐘，或搭社區公車 058A、058B 到臨津閣 DMZ 售票處，售票處 09:00 到 14:30 售票發券，要帶護照正本。臨津閣在民統線外，售票處發券後搭接駁巴士進民統線，走第三地道、都羅展望台、統一村再回臨津閣，約 3 小時，順序依場次先地道或先展望台，一般票單軌 12,200 韓元、步行 9,200 韓元，路線內禁止拍照。下半比較三種選擇：自己去坡州 DMZ 和平觀光要護照正本、線上預約或 09:00 前到現場排、現場沒有導覽員、路線內禁止拍照、週一與平日國定假日休館；一日遊團一樣要護照正本、票由旅行社處理、多半有導遊、一樣禁止拍照、休館與停止營運時團也可能取消；板門店 JSA 外國人見學目前不受理，以統一部官網為準。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">首爾到坡州 DMZ 和平觀光：怎麼去、走哪條線、能不能自己去</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Seoul to the Paju DMZ Peace Tour · 2026 年 9 月查證</text>

