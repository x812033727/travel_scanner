    <text x="900" y="714">多半有導遊，依方案</text>
    <text x="900" y="772">走同一條路線，一樣禁止</text>
    <text x="900" y="830">可以，休館或停止營運時團也可能取消</text>
  </g>

  <!-- JSA column -->
  <rect x="1130" y="566" width="430" height="284" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1345" y="656" font-size="26" font-weight="700" fill="#B8442D" text-anchor="middle">外國人見學目前不受理</text>
