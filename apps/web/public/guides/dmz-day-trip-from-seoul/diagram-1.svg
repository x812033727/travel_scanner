  <text x="205" y="172" font-size="16" fill="#102A2B" text-anchor="middle">弘大入口、孔德等站</text>
  <text x="205" y="195" font-size="15" fill="#5C6B6B" text-anchor="middle">Hongik Univ. · Gongdeok</text>

  <!-- Gyeongui-Jungang line -->
  <line x1="205" y1="212" x2="205" y2="418" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round"/>
  <text x="228" y="238" font-size="17" font-weight="700" fill="#2F6F9F">경의중앙선 京義中央線</text>
  <text x="228" y="259" font-size="15" fill="#5C6B6B">Gyeongui–Jungang Line</text>

