<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Codex CLI 從安裝到檢查結果的五個步驟 / Codex CLI: install, sign in, first task, approval, review</title>
  <desc id="desc">由左到右五個步驟。第一步安裝：四種方式挑一種，標準安裝程式、npm、Homebrew，Windows 用 PowerShell 版，指令例如 npm install -g @openai/codex。第二步登入：第一次執行 codex 時選登入方式，ChatGPT 帳號走訂閱額度，API key 走 API 計費，指令是 codex login。第三步第一個任務：先請它說明專案，再給目標、背景、限制、完成條件這四件事，位置是在專案資料夾執行 codex。第四步核准：預設沒有網路，只能改工作區，要跨出邊界時它會停下來問你，指令是斜線 permissions。第五步檢查結果：看差異、請它自審、自己跑一次測試，任務前後各做一次 Git 檢查點，指令是斜線 diff 與斜線 review。結果不對就補一句話，回到第三步的同一輪對話裡繼續改。下方說明第四步的兩個旋鈕：沙盒模式決定它技術上做得到什麼，分成 read-only 只能讀檔、workspace-write 可讀可寫工作區、danger-full-access 拿掉所有邊界；核准政策決定它什麼時候停下來問你，on-request 在沙盒裡工作要跨出邊界才問，never 完全不跳提示只適合自動化，對話中隨時可以打斜線 permissions 換模式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#D97A2B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="47" y="52" font-size="30" font-weight="700" fill="#102A2B">Codex CLI：從安裝到第一個任務的五個步驟</text>
  <text x="47" y="84" font-size="18" fill="#5C6B6B">Codex CLI: install, sign in, first task, approval, review</text>

  <!-- step 1 -->
  <rect x="47" y="160" width="262" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="87" cy="202" r="22" fill="#0D6B68"/>
  <text x="87" y="210" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="121" y="210" font-size="20" font-weight="700" fill="#102A2B">安裝</text>
  <text x="69" y="256" font-size="16" fill="#102A2B">四種方式挑一種：</text>
  <text x="69" y="280" font-size="16" fill="#102A2B">標準安裝程式、npm、</text>
  <text x="69" y="304" font-size="16" fill="#102A2B">Homebrew，Windows</text>
  <text x="69" y="328" font-size="16" fill="#102A2B">用 PowerShell 版</text>
  <line x1="69" y1="354" x2="287" y2="354" stroke="#D8D2C6" stroke-width="2"/>
  <text x="69" y="384" font-size="15" fill="#5C6B6B">指令 / 位置</text>
  <text x="69" y="412" font-size="15" font-weight="700" fill="#0D6B68">npm install -g</text>
  <text x="69" y="434" font-size="15" font-weight="700" fill="#0D6B68">@openai/codex</text>

  <line x1="317" y1="300" x2="350" y2="300" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="358" y="160" width="262" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="398" cy="202" r="22" fill="#0D6B68"/>
  <text x="398" y="210" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="432" y="210" font-size="20" font-weight="700" fill="#102A2B">登入</text>
  <text x="380" y="256" font-size="16" fill="#102A2B">第一次執行 codex</text>
  <text x="380" y="280" font-size="16" fill="#102A2B">時選登入方式：</text>
  <text x="380" y="304" font-size="16" fill="#102A2B">ChatGPT 帳號走額度，</text>
  <text x="380" y="328" font-size="16" fill="#102A2B">API key 走 API 計費</text>
  <line x1="380" y1="354" x2="598" y2="354" stroke="#D8D2C6" stroke-width="2"/>
  <text x="380" y="384" font-size="15" fill="#5C6B6B">指令 / 位置</text>
  <text x="380" y="412" font-size="15" font-weight="700" fill="#0D6B68">codex login</text>

  <line x1="628" y1="300" x2="661" y2="300" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="669" y="160" width="262" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="709" cy="202" r="22" fill="#0D6B68"/>
  <text x="709" y="210" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="743" y="210" font-size="20" font-weight="700" fill="#102A2B">第一個任務</text>
  <text x="691" y="256" font-size="16" fill="#102A2B">先請它說明專案，</text>
  <text x="691" y="280" font-size="16" fill="#102A2B">再給目標、背景、</text>
  <text x="691" y="304" font-size="16" fill="#102A2B">限制、完成條件</text>
  <text x="691" y="328" font-size="16" fill="#102A2B">這四件事</text>
  <line x1="691" y1="354" x2="909" y2="354" stroke="#D8D2C6" stroke-width="2"/>
  <text x="691" y="384" font-size="15" fill="#5C6B6B">指令 / 位置</text>
  <text x="691" y="412" font-size="15" font-weight="700" fill="#0D6B68">在專案資料夾執行</text>
  <text x="691" y="434" font-size="15" font-weight="700" fill="#0D6B68">codex</text>

  <line x1="939" y1="300" x2="972" y2="300" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="980" y="160" width="262" height="320" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="1020" cy="202" r="22" fill="#2F6F9F"/>
  <text x="1020" y="210" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1054" y="210" font-size="20" font-weight="700" fill="#102A2B">核准</text>
  <text x="1002" y="256" font-size="16" fill="#102A2B">預設沒有網路，</text>
  <text x="1002" y="280" font-size="16" fill="#102A2B">只能改工作區；</text>
  <text x="1002" y="304" font-size="16" fill="#102A2B">要跨出邊界時，</text>
  <text x="1002" y="328" font-size="16" fill="#102A2B">它會停下來問你</text>
  <line x1="1002" y1="354" x2="1220" y2="354" stroke="#D8D2C6" stroke-width="2"/>
  <text x="1002" y="384" font-size="15" fill="#5C6B6B">指令 / 位置</text>
  <text x="1002" y="412" font-size="15" font-weight="700" fill="#2F6F9F">/permissions</text>

  <line x1="1250" y1="300" x2="1283" y2="300" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="1291" y="160" width="262" height="320" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="1331" cy="202" r="22" fill="#2E7D5B"/>
  <text x="1331" y="210" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1365" y="210" font-size="20" font-weight="700" fill="#102A2B">檢查結果</text>
  <text x="1313" y="256" font-size="16" fill="#102A2B">看差異、請它自審、</text>
  <text x="1313" y="280" font-size="16" fill="#102A2B">自己跑一次測試；</text>
  <text x="1313" y="304" font-size="16" fill="#102A2B">任務前後各做一次</text>
  <text x="1313" y="328" font-size="16" fill="#102A2B">Git 檢查點</text>
  <line x1="1313" y1="354" x2="1531" y2="354" stroke="#D8D2C6" stroke-width="2"/>
  <text x="1313" y="384" font-size="15" fill="#5C6B6B">指令 / 位置</text>
  <text x="1313" y="412" font-size="15" font-weight="700" fill="#2E7D5B">/diff 與 /review</text>

  <!-- feedback loop -->
  <path d="M 1422 486 L 1422 540 L 800 540 L 800 494" fill="none" stroke="#D97A2B" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrowOrange)"/>
  <text x="1111" y="574" font-size="16" fill="#D97A2B" text-anchor="middle">結果不對就補一句話，回到同一輪對話裡繼續改</text>

  <text x="47" y="630" font-size="20" font-weight="700" fill="#102A2B">第 4 步會用到的兩個旋鈕</text>

  <rect x="47" y="654" width="740" height="176" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="71" y="692" font-size="20" font-weight="700" fill="#102A2B">沙盒模式：它技術上做得到什麼</text>
  <text x="71" y="730" font-size="16" fill="#102A2B">read-only：只能讀檔，改檔或跑指令要先核准</text>
  <text x="71" y="766" font-size="16" fill="#102A2B">workspace-write：可讀可寫工作區，跑常用本機指令</text>
  <text x="71" y="802" font-size="16" fill="#102A2B">danger-full-access：拿掉所有邊界，非必要不要開</text>

  <rect x="813" y="654" width="740" height="176" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="837" y="692" font-size="20" font-weight="700" fill="#102A2B">核准政策：它什麼時候停下來問你</text>
  <text x="837" y="730" font-size="16" fill="#102A2B">on-request：在沙盒裡工作，要跨出邊界才問你</text>
  <text x="837" y="766" font-size="16" fill="#102A2B">never：完全不跳核准提示，只適合自動化</text>
  <text x="837" y="802" font-size="16" fill="#102A2B">對話中隨時可以打 /permissions 換模式</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
