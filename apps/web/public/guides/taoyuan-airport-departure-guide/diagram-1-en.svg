  <text x="1210" y="640" font-size="15" fill="#5C6B6B" text-anchor="middle">See airline</text>

  <circle cx="1440" cy="580" r="11" fill="#102A2B" />
  <text x="1440" y="556" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">0</text>
  <text x="1440" y="616" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">Takeoff</text>
  <text x="1440" y="640" font-size="16" fill="#5C6B6B" text-anchor="middle">Departure time</text>


  <rect x="50" y="672" width="485" height="180" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
  <text x="74" y="706" font-size="19" font-weight="700" fill="#102A2B">In-Town Check-in</text>
  <text x="74" y="738" font-size="15" fill="#0B4F4D">A1 06:00–21:30 · China/Mandarin/EVA/UNI/Cathay/STARLUX</text>
  <text x="74" y="766" font-size="15" fill="#4E3428">A3 09:00–16:00 · China/Mandarin/EVA/UNI/Tigerair</text>
