<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Arial',system-ui,sans-serif">
  <title id="title">Taoyuan Airport departure flow for ROC passport holders with household registration in Taiwan: A1/A3 or terminal check-in, security, e-Gate, boarding gate and countdown</title>
  <desc id="desc">The upper section shows two departure routes. Route A goes from home to in-town check-in at Airport MRT A1 Taipei Main Station (B1, 06:00–21:30) or A3 New Taipei Industrial Park (1F, 09:00–16:00), then by Airport MRT to the airport. Route B goes from home directly to check-in and bag drop at Terminal 1 or 2. The routes meet at security, continue through automated e-Gate immigration clearance and end at the boarding gate. The lower, not-to-scale countdown shows the in-town check-in cutoff three hours before departure and 0 for takeoff; airline-specific airport check-in and gate-closing cutoffs have no fixed numbers. Three information panels add these details: A1 serves China Airlines, Mandarin Airlines, EVA Air, UNI Air, Cathay Pacific and STARLUX; A3 serves China Airlines, Mandarin Airlines, EVA Air, UNI Air and Tigerair Taiwan; both close three hours before departure, so A1 is calculated to work only for flights at or after 09:00. At security, each liquid container is limited to 100 mL, all containers go in one transparent one-liter reclosable bag per passenger, and no more than two power banks are allowed in carry-on only; power banks may not be checked, used or charged in flight. e-Gate is available to ROC nationals with household registration in Taiwan using an ROC passport from age 10 and 120 cm in height; first-time users may enroll at the gate, enrollment plus clearance takes about 30 seconds, enrollment is permanent, and a new passport does not require reenrollment.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" /></marker>
  </defs>

