<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title id="title">대만 호적을 가진 중화민국 여권 소지자의 타오위안공항 출국 동선: A1/A3 또는 터미널 체크인, 보안검색, e-Gate, 탑승구와 출발 역산</title>
  <desc id="desc">위쪽은 두 갈래 출국 동선이다. 경로 A는 집에서 공항철도 A1 타이베이 메인역(B1, 06:00–21:30) 또는 A3 신베이 산업단지역(1F, 09:00–16:00)의 도심 체크인을 거쳐 공항철도로 공항에 간다. 경로 B는 집에서 제1·제2터미널로 바로 가서 체크인하고 수하물을 맡긴다. 두 경로는 보안검색에서 합쳐져 자동출입국심사 e-Gate를 지나 탑승구로 간다. 아래의 출발 역산 눈금은 비례하지 않으며 출발 3시간 전 도심 체크인 마감과 출발 시각 0을 표시한다. 공항 체크인 마감과 탑승구 마감은 항공사별이어서 숫자를 표시하지 않는다. 아래 세 정보 상자에는 다음 내용이 있다. A1은 China Airlines, Mandarin Airlines, EVA Air, UNI Air, Cathay Pacific, STARLUX를, A3는 China Airlines, Mandarin Airlines, EVA Air, UNI Air, Tigerair Taiwan을 취급한다. 두 역 모두 출발 3시간 전 마감하므로 계산상 A1은 09:00 이후 출발편부터 이용할 수 있다. 보안검색에서는 액체 용기 하나당 100mL 이하, 1인당 1L 투명 지퍼백 1개이며 보조배터리는 최대 2개만 기내 반입할 수 있다. 보조배터리는 위탁할 수 없고 기내에서 사용하거나 충전할 수 없다. e-Gate는 대만에 호적이 있고 중화민국 여권을 사용하는 중화민국 국민 중 만 10세 이상, 키 120cm 이상이 이용할 수 있다. 첫 이용 때 게이트에서 직접 등록할 수 있고 등록과 출국심사에 약 30초가 걸리며 등록은 영구적으로 유효하고 여권을 바꿔도 다시 등록할 필요가 없다.</desc>
