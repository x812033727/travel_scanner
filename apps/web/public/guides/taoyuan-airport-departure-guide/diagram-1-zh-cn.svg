<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <title id="title">桃园机场出境流程图：适用于在台湾设有户籍并持中华民国护照的国民，经 A1/A3 或航站楼值机、安检、e-Gate、登机口及起飞倒推</title>
  <desc id="desc">上半部分是两条出境路线。路线 A：从家前往机场捷运 A1 台北车站（B1，06:00–21:30）或 A3 新北产业园区站（1F，09:00–16:00）办理市区值机，再搭机场捷运去机场。路线 B：从家直接前往第一或第二航站楼值机并托运行李。两条路线在安检处汇合，接着通过自动通关 e-Gate，最后到登机口。下半部分是起飞前倒计时，刻度不按比例：起飞前 3 小时停止办理市区值机，0 为起飞；机场值机截止和登机口关闭时间依航空公司而定，不标具体数字。下方三个信息框：A1 可办理中华航空、华信航空、长荣航空、立荣航空、国泰航空、星宇航空，A3 可办理中华航空、华信航空、长荣航空、立荣航空、台湾虎航；两站都在起飞前 3 小时停止受理，推算 A1 只适用于 09:00 以后起飞。安检液体每个容器不超过 100 毫升，装入 1 升透明密封拉链袋，每人 1 袋；充电宝最多 2 个且只能随身携带，不得托运，机上不得使用或充电。e-Gate 适用于在台湾设有户籍、持中华民国护照的中华民国国民，须年满 10 岁且身高 120 厘米以上；第一次可以在闸门自助注册，注册加通关约 30 秒，注册后永久有效，更换护照也不必重新办理。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" /></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">桃园机场出境流程与时间倒推</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">市区值机 · 安检 · e-Gate · 登机口</text>


