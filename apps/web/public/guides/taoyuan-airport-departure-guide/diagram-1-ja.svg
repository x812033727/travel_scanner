<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',system-ui,sans-serif">
  <title id="title">桃園空港での出国動線図。自宅から空港MRT A1・A3でインタウンチェックインする経路と、ターミナルで直接チェックインする経路が、保安検査・e-Gate・搭乗口へつながる。下段には出発までのカウントダウンを表示</title>
  <desc id="desc">上段は出国の動線で、2つの経路があります。経路Aは自宅から空港MRT A1台北車站（B1、06:00–21:30）またはA3新北産業園区駅（1F、09:00–16:00）でインタウンチェックインを済ませ、空港MRTで空港へ向かう経路です。経路Bは自宅から第1または第2ターミナルへ直接向かい、チェックインと荷物の預け入れを行う経路です。両経路は保安検査で合流し、その後、自動出入国審査e-Gateを通って搭乗口へ進みます。下段は出発前のカウントダウンで、目盛りの間隔は時間に比例していません。出発3時間前にインタウンチェックインの受付が終了し、0が出発です。空港チェックイン締め切りと搭乗口閉鎖は航空会社によって異なるため、数値を示していません。下部には3つの情報枠があります。インタウンチェックインはA1でChina Airlines、Mandarin Airlines、EVA Air、UNI Air、Cathay Pacific、STARLUX Airlines、A3でChina Airlines、Mandarin Airlines、EVA Air、UNI Air、Tigerair Taiwanが利用でき、両駅とも出発3時間前に受付終了です。計算上、A1を利用できるのは09:00以降の出発便です。保安検査では液体を100ml以下の容器に入れ、1Lの透明な再封可能袋にまとめ、1人1袋までとします。モバイルバッテリーは2個までで機内持ち込みのみ、預け入れ不可、機内での使用と充電も禁止です。e-Gateのこの登録案内は、台湾に戸籍を持ち中華民国旅券を使う中華民国国民が対象で、10歳以上・身長120cm以上なら初回からゲートでセルフ登録でき、登録から審査通過まで約30秒です。登録は永久に有効です。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" /></marker>
  </defs>

