  <path d="M 630 317 L 686 317" fill="none" stroke="#6B4A3A" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="690" y="138" width="200" height="234" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
  <text x="790" y="236" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">空港MRTで空港へ</text>
  <text x="790" y="266" font-size="17" fill="#5C6B6B" text-anchor="middle">桃園空港MRT</text>
  <text x="790" y="294" font-size="16" fill="#5C6B6B" text-anchor="middle">機内持込手荷物だけ</text>


  <rect x="250" y="400" width="640" height="90" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="570" y="438" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">ルートB　直接T1/T2でチェックイン</text>
  <text x="570" y="470" font-size="17" fill="#1F4E73" text-anchor="middle">チェックイン・手荷物預け</text>


