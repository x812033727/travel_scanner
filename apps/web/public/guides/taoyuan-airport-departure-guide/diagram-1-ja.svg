  <text x="1045" y="328" font-size="18" fill="#8A2E1D" text-anchor="middle">セキュリティ</text>

  <path d="M 1140 305 L 1186 305" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1190" y="230" width="170" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="1275" y="296" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">自動化ゲート</text>
  <text x="1275" y="328" font-size="20" fill="#1F4E73" text-anchor="middle">e-Gate</text>

  <path d="M 1360 305 L 1406 305" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1410" y="230" width="150" height="150" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4" />
  <text x="1485" y="296" font-size="24" font-weight="700" fill="#1E5A40" text-anchor="middle">搭乗口</text>
  <text x="1485" y="328" font-size="18" fill="#1E5A40" text-anchor="middle">ゲート</text>

  <text x="1290" y="430" font-size="16" fill="#5C6B6B" text-anchor="middle">2ルートは保安検査で合流し、e-Gateへ</text>


  <text x="60" y="524" font-size="20" font-weight="700" fill="#102A2B">出発時刻から逆算</text>
  <text x="1540" y="524" font-size="15" fill="#5C6B6B" text-anchor="end">縮尺どおりではありません</text>
  <path d="M 160 580 L 1510 580" fill="none" stroke="#102A2B" stroke-width="4" marker-end="url(#arrowdark)" />

  <circle cx="520" cy="580" r="11" fill="#0D6B68" />
  <text x="520" y="556" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">3時間</text>
  <text x="520" y="616" font-size="17" font-weight="700" fill="#0D6B68" text-anchor="middle">市内チェックイン締切</text>
  <text x="520" y="640" font-size="16" fill="#0B4F4D" text-anchor="middle">出発3時間前</text>

  <path d="M 960 562 L 960 598" fill="none" stroke="#8A8F8F" stroke-width="3" stroke-dasharray="6 5" />
  <text x="960" y="616" font-size="16" fill="#5C6B6B" text-anchor="middle">チェックイン締切：航空会社ごと</text>
  <text x="960" y="640" font-size="15" fill="#5C6B6B" text-anchor="middle">航空会社で確認</text>

  <path d="M 1210 562 L 1210 598" fill="none" stroke="#8A8F8F" stroke-width="3" stroke-dasharray="6 5" />
  <text x="1210" y="616" font-size="16" fill="#5C6B6B" text-anchor="middle">搭乗口締切：航空会社ごと</text>
  <text x="1210" y="640" font-size="15" fill="#5C6B6B" text-anchor="middle">航空会社で確認</text>

  <circle cx="1440" cy="580" r="11" fill="#102A2B" />
  <text x="1440" y="556" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">0</text>
  <text x="1440" y="616" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">出発</text>
  <text x="1440" y="640" font-size="16" fill="#5C6B6B" text-anchor="middle">搭乗券の時刻</text>


  <rect x="50" y="672" width="485" height="180" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
  <text x="74" y="706" font-size="19" font-weight="700" fill="#102A2B">市内チェックイン</text>
  <text x="74" y="738" font-size="15" fill="#0B4F4D">A1 06:00–21:30 · 中華/マンダリン/EVA/UNI/キャセイ/STARLUX</text>
  <text x="74" y="766" font-size="15" fill="#4E3428">A3 09:00–16:00 · 中華/マンダリン/EVA/UNI/タイガーエア台湾</text>
  <text x="74" y="794" font-size="17" fill="#102A2B">両駅とも出発3時間前に受付終了</text>
  <text x="74" y="822" font-size="17" font-weight="700" fill="#0D6B68">A1：09:00以降の出発便（逆算）</text>

  <rect x="557" y="672" width="485" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4" />
  <text x="581" y="706" font-size="19" font-weight="700" fill="#102A2B">保安検査</text>
  <text x="581" y="738" font-size="17" fill="#102A2B">液体は1容器100mL以下</text>
  <text x="581" y="766" font-size="17" fill="#102A2B">1L透明再封袋・1人1袋</text>
  <text x="581" y="794" font-size="17" font-weight="700" fill="#8A2E1D">モバイルバッテリー2個まで・機内持込のみ</text>
  <text x="581" y="822" font-size="17" fill="#102A2B">預入不可・機内使用と充電も不可</text>

  <rect x="1064" y="672" width="485" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" />
  <text x="1088" y="698" font-size="15" font-weight="700" fill="#102A2B">e-Gate（初回はゲートで登録）</text>
  <text x="1088" y="725" font-size="15" fill="#102A2B">台湾に戸籍を持つ中華民国国民</text>
  <text x="1088" y="748" font-size="15" fill="#102A2B">中華民国旅券を使用</text>
  <text x="1088" y="772" font-size="15" fill="#102A2B">10歳以上・身長120cm以上</text>
  <text x="1088" y="797" font-size="16" font-weight="700" fill="#1F4E73">登録＋審査：約30秒</text>
  <text x="1088" y="822" font-size="15" fill="#102A2B">登録は永久有効・旅券更新後も再登録不要</text>

