<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本上網決策樹：eSIM、實體 SIM 或 WiFi 分享器 / eSIM, physical SIM or pocket WiFi for Japan</title>
  <desc id="desc">兩個問題。問題一：3 人以上同行，或要開熱點給筆電、平板嗎？是就租 WiFi 分享器，出發前預約、在機場櫃檯或 24 小時自助取機領取、回程在安檢前的還機箱歸還。否就問題二：手機支援 eSIM 而且沒有電信鎖嗎？iPhone XS 以後、Pixel 4 以後支援，中國大陸版與港澳版另查。是就買 eSIM，出發前線上買、掃 QR Code 安裝、落地打開該線路的數據漫遊，多為資料專用、沒有日本門號。否就買實體 SIM，在機場販賣機或櫃檯買，資料專用、要設 APN，櫃檯多為 06:00 到 23:00，關西機場的販賣機 24 小時。補充：EID 在 iPhone 設定、一般、關於本機裡；雙卡設定是日本線路開數據漫遊、台灣門號關漫遊但保留簡訊、台灣 SIM 別拔掉。免費 WiFi：成田 FreeWiFi-NARITA、羽田 HANEDA-FREE-WIFI、關西 AirportFreeWiFi-Kansai、Lawson 一次 60 分鐘一天 5 次。2026 年 5 月修法把資料專用 SIM 納入本人確認，公布後一年內施行。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">日本上網三選一：eSIM、實體 SIM、WiFi 分享器（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">eSIM / Physical SIM / Pocket WiFi: two questions, checked against Apple, Google and the three airports</text>

  <!-- Q1 -->
  <polygon points="800,125 1140,185 800,245 460,185" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="180" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　3 人以上同行，或要開熱點給筆電、平板？</text>
  <text x="800" y="206" font-size="15" fill="#5C6B6B" text-anchor="middle">（一台分給全家，但走散就斷線、要充電、要記得還）</text>
  <path d="M 1140 185 L 1166 185" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1144" y="175" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="130" width="400" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1370" y="161" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">WiFi 分享器　ポケットWiFi Pocket WiFi</text>
  <text x="1370" y="188" font-size="15" fill="#0B4F4D" text-anchor="middle">出發前預約，機場櫃檯或 24 小時自助取機領取</text>
  <text x="1370" y="214" font-size="15" fill="#0B4F4D" text-anchor="middle">回程還機箱在安檢前；逾期依合約計費</text>
  <path d="M 800 247 L 800 287" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="273" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,290 1140,350 800,410 460,350" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="345" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　手機支援 eSIM，而且沒有電信鎖？</text>
  <text x="800" y="371" font-size="15" fill="#5C6B6B" text-anchor="middle">（iPhone XS 以後、Pixel 4 以後；陸版、港澳版另查）</text>
  <path d="M 1140 350 L 1166 350" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1144" y="340" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1170" y="295" width="400" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1370" y="326" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">eSIM　出發前裝好，落地就上網</text>
  <text x="1370" y="353" font-size="15" fill="#1F4E73" text-anchor="middle">線上買、掃 QR Code 安裝，落地開該線路的數據漫遊</text>
  <text x="1370" y="379" font-size="15" fill="#1F4E73" text-anchor="middle">多為資料專用、沒有日本門號；QR Code 先截圖備份</text>
  <path d="M 460 350 L 434 350" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="442" y="340" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="295" width="400" height="110" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="230" y="326" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">實體 SIM　物理SIM Physical SIM</text>
  <text x="230" y="353" font-size="15" fill="#4E3428" text-anchor="middle">機場販賣機或櫃檯買，資料專用、要設 APN</text>
  <text x="230" y="379" font-size="15" fill="#4E3428" text-anchor="middle">櫃檯多為 06:00〜23:00；關西機場販賣機 24 小時</text>

  <!-- notes -->
  <rect x="60" y="470" width="720" height="176" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="88" y="503" font-size="19" font-weight="700" fill="#102A2B">手機先檢查　Check your phone first</text>
  <text x="88" y="536" font-size="16" fill="#102A2B">・EID 欄位：iPhone 在 設定 → 一般 → 關於本機；有 EID 才有 eSIM 晶片</text>
  <text x="88" y="564" font-size="16" fill="#102A2B">・雙卡設定：日本線路開數據漫遊，台灣門號關漫遊、保留通話與簡訊</text>
  <text x="88" y="592" font-size="16" fill="#102A2B">・台灣 SIM 別拔掉：租車、訂位、免稅 App 的驗證碼會傳到台灣門號</text>
  <text x="88" y="620" font-size="16" fill="#102A2B">・綁約機先向電信解鎖；陸版、港澳版 iPhone 的 eSIM 支援不同</text>

  <rect x="820" y="470" width="720" height="176" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="848" y="503" font-size="19" font-weight="700" fill="#102A2B">免費 WiFi　Free Wi-Fi（不用註冊，未加密）</text>
  <text x="848" y="536" font-size="16" fill="#102A2B">・成田 Narita：FreeWiFi-NARITA，航廈全區與航廈間接駁巴士</text>
  <text x="848" y="564" font-size="16" fill="#102A2B">・羽田 Haneda：HANEDA-FREE-WIFI，三個航廈，商店內不提供</text>
  <text x="848" y="592" font-size="16" fill="#102A2B">・關西 Kansai：#AirportFreeWiFi-Kansai，第 1、第 2 航廈與車站</text>
  <text x="848" y="620" font-size="16" fill="#102A2B">・Lawson：LAWSON Free Wi-Fi，一次 60 分鐘、一天 5 次，首次填 Email</text>

  <text x="60" y="700" font-size="15" fill="#5C6B6B">2026 年 5 月日本修法：資料專用 SIM 也納入本人確認義務，公布後一年內施行；施行後販賣機、線上購買可能多一道護照驗證，以總務省與業者公告為準。</text>
  <text x="60" y="728" font-size="15" fill="#5C6B6B">流量經驗值（非官方數字）：只開地圖導航一天幾百 MB；社群、傳照片約 1 GB；開熱點或整天看影片 3 GB 以上，直接選吃到飽。</text>
  <text x="60" y="756" font-size="15" fill="#5C6B6B">櫃檯時間：成田多為 07:00〜21:00，羽田第 3 航廈 06:00〜23:00 左右，關西第 1 航廈 06:00〜23:00；各機場官網 2026 年 9 月查證。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
