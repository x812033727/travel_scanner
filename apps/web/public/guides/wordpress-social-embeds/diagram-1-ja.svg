<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Malgun Gothic','Microsoft JhengHei',sans-serif">
<ns0:title id="title">SNS埋め込みの不具合を調べる順序</ns0:title><ns0:desc id="desc">SNS投稿の元データ、アカウント接続、閲覧側の読み込み、代替コンテンツを順に確認する4コマ図。</ns0:desc>
<ns0:rect width="1600" height="900" fill="#F7F1E8" />
<ns0:text x="80" y="94" font-size="45" fill="#102A2B" text-anchor="start" font-weight="bold">SNS埋め込みの不具合を調べる順序</ns0:text>
<ns0:text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">影響範囲を確認してから、問題の箇所を探す</ns0:text>
<ns0:rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">元の投稿</ns0:text>
<ns0:text x="108.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">投稿は残っている？</ns0:text>
<ns0:text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">公開範囲は変わった？</ns0:text>
<ns0:rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">接続</ns0:text>
<ns0:text x="477.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">正しいアカウント</ns0:text>
<ns0:text x="477.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">認証は有効？</ns0:text>
<ns0:rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">読み込み</ns0:text>
<ns0:text x="846.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">キャッシュを確認</ns0:text>
<ns0:text x="846.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">同意の状態を確認</ns0:text>
<ns0:rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">代替策</ns0:text>
<ns0:text x="1215.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">元のリンクを残す</ns0:text>
<ns0:text x="1215.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">必要な本文を補う</ns0:text>
<ns0:text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">SNSで内容を補い、サイト自体の読みやすさを保つ。</ns0:text>
<ns0:text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図</ns0:text>
</ns0:svg>