<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Malgun Gothic','Microsoft JhengHei',sans-serif">
<ns0:title id="title">소셜 임베드 오류 점검 순서</ns0:title><ns0:desc id="desc">소셜 원본, 계정 연결, 방문자 화면의 로딩, 대체 콘텐츠를 순서대로 점검하는 네 칸 도식.</ns0:desc>
<ns0:rect width="1600" height="900" fill="#F7F1E8" />
<ns0:text x="80" y="94" font-size="45" fill="#102A2B" text-anchor="start" font-weight="bold">소셜 임베드 오류 점검 순서</ns0:text>
<ns0:text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">영향 범위를 찾은 뒤 오류 단계를 확인</ns0:text>
<ns0:rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">원본</ns0:text>
<ns0:text x="108.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">게시물이 남아 있나?</ns0:text>
<ns0:text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">공개 범위가 바뀌었나?</ns0:text>
<ns0:rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">연결</ns0:text>
<ns0:text x="477.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">계정 확인</ns0:text>
<ns0:text x="477.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">승인이 유효한가?</ns0:text>
<ns0:rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">로딩</ns0:text>
<ns0:text x="846.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">캐시·스크립트</ns0:text>
<ns0:text x="846.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">동의 상태 테스트</ns0:text>
<ns0:rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">대체</ns0:text>
<ns0:text x="1215.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">원본 링크 유지</ns0:text>
<ns0:text x="1215.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">필수 본문 보완</ns0:text>
<ns0:text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">소셜 게시물로 보충하고 사이트 자체의 사용성을 유지합니다.</ns0:text>
<ns0:text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도식</ns0:text>
</ns0:svg>