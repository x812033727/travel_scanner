<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Malgun Gothic','Microsoft JhengHei',sans-serif">
<ns0:title id="title">Troubleshooting social embeds</ns0:title><ns0:desc id="desc">Four-panel diagram checking the social source, account connection, visitor-side loading, and fallback content in order.</ns0:desc>
<ns0:rect width="1600" height="900" fill="#F7F1E8" />
<ns0:text x="80" y="94" font-size="43" fill="#102A2B" text-anchor="start" font-weight="bold">Troubleshooting social embeds</ns0:text>
<ns0:text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">Check the scope, then find the failing step.</ns0:text>
<ns0:rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Source</ns0:text>
<ns0:text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Is the post still there?</ns0:text>
<ns0:text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Is it publicly visible?</ns0:text>
<ns0:rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Connection</ns0:text>
<ns0:text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Correct account?</ns0:text>
<ns0:text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Authorization valid?</ns0:text>
<ns0:rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Loading</ns0:text>
<ns0:text x="846.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Check cache/scripts</ns0:text>
<ns0:text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Test consent status</ns0:text>
<ns0:rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Fallback</ns0:text>
<ns0:text x="1215.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Keep a source link</ns0:text>
<ns0:text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Add essential site text</ns0:text>
<ns0:text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Let social posts add context while the site stays usable.</ns0:text>
<ns0:text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair diagram</ns0:text>
</ns0:svg>