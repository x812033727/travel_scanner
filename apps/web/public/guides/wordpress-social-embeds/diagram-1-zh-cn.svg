<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Malgun Gothic','Microsoft JhengHei',sans-serif">
<ns0:title id="title">社交内容嵌入失效的排查顺序</ns0:title><ns0:desc id="desc">四格图解依次检查社交内容来源、账号连接、访客端加载和备用内容。</ns0:desc>
<ns0:rect width="1600" height="900" fill="#F7F1E8" />
<ns0:text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">社交内容嵌入失效的排查顺序</ns0:text>
<ns0:text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">先确定影响范围，再定位故障环节</ns0:text>
<ns0:rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">来源</ns0:text>
<ns0:text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">原帖是否还在</ns0:text>
<ns0:text x="108.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">可见性是否改变</ns0:text>
<ns0:rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="477.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">连接</ns0:text>
<ns0:text x="477.0" y="371" font-size="38" fill="#102A2B" text-anchor="start" font-weight="normal">账号是否正确</ns0:text>
<ns0:text x="477.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">授权是否有效</ns0:text>
<ns0:rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">加载</ns0:text>
<ns0:text x="846.0" y="371" font-size="38" fill="#102A2B" text-anchor="start" font-weight="normal">检查缓存和脚本</ns0:text>
<ns0:text x="846.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">测试同意状态</ns0:text>
<ns0:rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<ns0:text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">备用</ns0:text>
<ns0:text x="1215.0" y="371" font-size="38" fill="#102A2B" text-anchor="start" font-weight="normal">保留来源链接</ns0:text>
<ns0:text x="1215.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">补齐必要正文</ns0:text>
<ns0:text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">让社交内容作为补充，同时保持网站易读、可用。</ns0:text>
<ns0:text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</ns0:text>
</ns0:svg>