<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>싱가포르 호커 센터 첫 방문: 자리 찾기부터 주문, 식판 반납까지 실용적인 순서: 판단 흐름</title><desc>순서대로 확인하세요: 공간 살피기, 메뉴 확인, 결제와 음식 받기, 정리와 반납. 편집팀이 정리한 도식이며, 지도나 실측 시간을 나타내지 않습니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하세요. 한 번에 다 할 필요는 없어요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">공간 살피기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">공간 파악하기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">만날 곳부터 정하기</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">메뉴 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">주문할 메뉴 고르기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">양·가격 먼저 묻기</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">결제·음식 받기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">결제하고 음식 받기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">가게 절차 따르기</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">정리·반납</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">치우고 반납하기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">현장 분류 따르기</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집팀 자체 제작 도식 / 편집팀 도식</text></g></svg>
