<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Your First Singapore Hawker Centre Visit: Finding Seats, Ordering and Returning Trays — Decision Flow</title><desc>Check in order: look around, confirm your order, pay and collect, then clear and return. Compiled by the editors; not a map or measured timing.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Step by step · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits your situation; no need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Look around</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Read the space</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Pick a meeting point first</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">Confirm your order</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Choose the order</text><text x="473" y="573" fill="#f4dc9d" font-size="23" style="font-size: 23px;">Ask about size and price first</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Pay and collect</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Pay and collect</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Follow the stall's process</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Clear and return</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Clear and return</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Follow sorting signs</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Diagram by the editors / Editorial diagram</text></g></svg>
