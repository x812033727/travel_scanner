<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>初めてのシンガポール・ホーカーセンター：席探し、注文、トレー返却の実用的な手順と判断の流れ</title><desc>順に確認：場内を確認、料理を確認、支払いと受け取り、片付けと返却。編集部がまとめたもので、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順 · 実用的な流れ</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、一度に全部済ませる必要はありません</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">場内を確認</text><text x="103" y="497" fill="#f4f0e5" font-size="23">配置を把握</text><text x="103" y="573" fill="#f4dc9d" font-size="26">集合場所を先に決める</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">料理を確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">注文するものを選ぶ</text><text x="473" y="573" fill="#f4dc9d" font-size="26">量と価格を先に聞く</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">支払い・受け取り</text><text x="843" y="497" fill="#f4f0e5" font-size="23">支払って受け取る</text><text x="843" y="573" fill="#f4dc9d" font-size="26">店の手順に従う</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">片付け・返却</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">片付けて返す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">現地の表示で分別</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部自作の模式図 / 編集部作成の図</text></g></svg>
