<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic','Arial',sans-serif">
  <title id="title">신치토세 공항–삿포로–오타루 JR 노선도</title>
  <desc id="desc">오른쪽 아래 신치토세 공항에서 삿포로를 거쳐 왼쪽 위 오타루로 이어지는 JR 노선 그림. 공항에서 삿포로까지 쾌속 에어포트는 최단 37분, 특별쾌속은 33분이며 성인 1,230엔, 낮에는 시간당 6편입니다. u시트 지정석은 1,000엔 추가됩니다. 삿포로에서 오타루까지 약 35분, 800엔이고 일부 열차는 오타루와 공항을 최단 73분에 직통합니다. 삿포로 시내 패널에는 오도리 공원, 시계탑, 다누키코지, 스스키노가 삿포로역에서 지하철 한 정거장 210엔, 시계탑은 350엔에 8:45~17:10이라고 나옵니다. 모이와산 로프웨이는 노면전차 로프웨이이리구치 정류장에서 무료 셔틀로 갈아타며 왕복 2,100엔입니다. 시로이 고이비토 파크 유료 구역은 도자이선 미야노사와역 근처로 1,200엔, 10:00~18:00 운영합니다. 홋카이도 신궁은 도자이선 마루야마코엔역에서 갑니다. 2027년 삿포로 눈축제는 2월 4~11일 오도리, 쓰도무, 스스키노에서 열립니다. 오타루역에서 운하와 사카이마치 거리까지 걸을 수 있고 2월에는 눈빛거리 축제가 있습니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">신치토세 공항 · 삿포로 · 오타루: JR 쾌속 에어포트</text>
  <text x="80" y="120" font-size="22" fill="#5C6B6B">2026년 9월 공식 확인 · JR 운임은 2025년 4월 1일 개정 후</text>


