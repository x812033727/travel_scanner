<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','Microsoft YaHei','Arial',sans-serif">
  <title id="title">新千岁机场、札幌、小樽的 JR 线路示意图</title>
  <desc id="desc">一条 JR 线由右下的新千岁机场往左上经札幌到小樽。新千岁机场到札幌搭快速 Airport 最快 37 分钟、特别快速 33 分钟，大人 1,230 日元，白天每小时 6 班，u 席指定席加 1,000 日元；札幌到小樽约 35 分钟、800 日元，部分班次从小樽直通新千岁机场，最快 73 分钟。札幌市内面板列出：大通公园、钟楼、狸小路、薄野从札幌站搭地铁一站 210 日元，钟楼 350 日元、8:45 到 17:10；藻岩山缆车搭市电到ロープウェイ入口再转免费接驳车，往复 2,100 日元；白色恋人公园在地铁东西线宫之泽站，1,200 日元、10:00 到 18:00；北海道神宫在东西线圆山公园站；2027 年札幌雪祭 2 月 4 日到 11 日，大通、つどーむ、薄野三会场。小樽站步行可到小樽运河与堺町通，二月有雪あかりの路。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">新千岁机场・札幌・小樽：JR 快速 Airport 一线串起</text>
  <text x="80" y="120" font-size="22" fill="#5C6B6B">2026 年 9 月官网核对；JR 票价按 2025 年 4 月 1 日调整</text>


  <path d="M 260 300 L 700 420 L 1120 670" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />


  <g>
    <rect x="1120" y="620" width="280" height="100" rx="24" fill="#0D6B68" />
    <text x="1260" y="662" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">新千岁机场</text>
    <text x="1260" y="696" font-size="18" fill="#E6F2F1" text-anchor="middle">New Chitose Airport · CTS</text>
    <text x="1260" y="760" font-size="17" fill="#5C6B6B" text-anchor="middle">小樽 ⇄ 新千岁机场：部分直达，最快 73 分钟</text>
  </g>


  <g>
    <circle cx="700" cy="420" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="700" y="378" font-size="32" font-weight="700" fill="#102A2B" text-anchor="middle">札幌 Sapporo</text>
    <text x="680" y="470" font-size="17" fill="#5C6B6B" text-anchor="end">JR 札幌站 · 地铁札幌站</text>
  </g>


  <g>
    <circle cx="260" cy="300" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="260" y="258" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">小樽 Otaru</text>
    <text x="80" y="400" font-size="18" fill="#5C6B6B">小樽运河 Otaru Canal</text>
    <text x="80" y="426" font-size="17" fill="#5C6B6B">堺町通：从车站步行</text>
    <text x="80" y="452" font-size="17" fill="#5C6B6B">2 月有雪灯之路，日期以官网为准</text>
  </g>


  <g>
    <text x="560" y="290" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">JR 函馆本线 · 快速 Airport 直通</text>
    <text x="560" y="320" font-size="20" fill="#0D6B68" text-anchor="middle">约 35 分钟 · 800 日元</text>
    <text x="960" y="470" font-size="22" font-weight="700" fill="#0D6B68">快速 Airport</text>
    <text x="960" y="500" font-size="19" fill="#0D6B68">最快 37 分钟（特别快速 33 分钟）· 1,230 日元</text>
    <text x="960" y="524" font-size="17" fill="#5C6B6B">白天每小时 6 班 · u シート指定席 +1,000 日元</text>
  </g>


  <g>
    <rect x="80" y="520" width="680" height="300" rx="20" fill="#FFFFFF" stroke="#D8CCBE" stroke-width="2" />
    <text x="104" y="556" font-size="22" font-weight="700" fill="#102A2B">札幌市内：地铁、市电、步行</text>
    <g font-size="17" fill="#102A2B">
      <text x="104" y="596">● 大通公园、钟楼、狸小路、薄野：地铁一站 210 日元</text>
      <text x="104" y="628">● 札幌钟楼：成人 350 日元 · 8:45–17:10 · 1 月 1–3 日闭馆</text>
      <text x="104" y="660">● 藻岩山：市电转免费接驳车，缆车往返 2,100 日元</text>
      <text x="104" y="692">● 白色恋人公园：宫之泽站 · 1,200 日元 · 10:00–18:00</text>
      <text x="104" y="724">● 北海道神宫：圆山公园站，开放时间查官网</text>
      <text x="104" y="756">● 2027 札幌雪祭：2 月 4–11 日 · 大通、つどーむ、薄野</text>
      <text x="104" y="788" fill="#5C6B6B">市电 230 日元 · 地铁一日票 830 日元 · 周末票 520 日元</text>
    </g>
  </g>


