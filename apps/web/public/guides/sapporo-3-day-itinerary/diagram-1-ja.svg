<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <title id="title">新千歳空港・札幌・小樽のJR路線図</title>
  <desc id="desc">右下の新千歳空港から札幌を経て左上の小樽へJRの線を描いた図。新千歳空港―札幌は快速エアポートで最速37分、特別快速なら33分。大人1,230円、日中は毎時6本で、uシート指定席は1,000円追加。札幌―小樽は約35分、800円。一部列車は小樽と新千歳空港を直通し、最速73分。札幌市内のパネルには大通公園、時計台、狸小路、すすきのが札幌駅から地下鉄1駅、210円、時計台は350円で8:45～17:10と示す。藻岩山ロープウェイは市電のロープウェイ入口から無料シャトルバスに乗り継ぎ、往復2,100円。白い恋人パークは地下鉄東西線宮の沢駅近くで有料エリア1,200円、10:00～18:00。北海道神宮は東西線円山公園駅から。2027年さっぽろ雪まつりは2月4～11日に大通、つどーむ、すすきので開催。小樽運河と堺町通りは小樽駅から徒歩で回れ、2月には雪あかりの路がある。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">新千歳空港・札幌・小樽　JR快速エアポートで移動</text>
  <text x="80" y="120" font-size="22" fill="#5C6B6B">2026年9月公式確認・JR運賃は2025年4月1日改定後</text>

  
  <path d="M 260 300 L 700 420 L 1120 670" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  
  <g>
    <rect x="1120" y="620" width="280" height="100" rx="24" fill="#0D6B68" />
    <text x="1260" y="662" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">新千歳空港</text>
    <text x="1260" y="696" font-size="18" fill="#E6F2F1" text-anchor="middle">New Chitose Airport · CTS</text>
    <text x="1260" y="760" font-size="17" fill="#5C6B6B" text-anchor="middle">小樽 ⇄ 新千歳空港　直通列車あり・最速73分</text>
  </g>

  
  <g>
    <circle cx="700" cy="420" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="700" y="378" font-size="32" font-weight="700" fill="#102A2B" text-anchor="middle">札幌 Sapporo</text>
    <text x="680" y="470" font-size="17" fill="#5C6B6B" text-anchor="end">JR札幌駅・地下鉄さっぽろ駅</text>
  </g>

  
  <g>
    <circle cx="260" cy="300" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="260" y="258" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">小樽 Otaru</text>
    <text x="80" y="400" font-size="18" fill="#5C6B6B">小樽運河</text>
    <text x="80" y="426" font-size="17" fill="#5C6B6B">堺町通り・駅から徒歩</text>
    <text x="80" y="452" font-size="17" fill="#5C6B6B">2月の雪あかりの路・日程は公式で</text>
  </g>

  
  <g>
    <text x="560" y="290" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">JR函館本線・快速エアポート直通</text>
    <text x="560" y="320" font-size="20" fill="#0D6B68" text-anchor="middle">約35分・800円</text>
    <text x="960" y="470" font-size="22" font-weight="700" fill="#0D6B68">快速エアポート</text>
    <text x="960" y="500" font-size="19" fill="#0D6B68">最速37分（特別快速33分）・1,230円</text>
    <text x="960" y="524" font-size="17" fill="#5C6B6B">日中毎時6本・uシート指定席 +1,000円</text>
  </g>

  
  <g>
    <rect x="80" y="520" width="680" height="300" rx="20" fill="#FFFFFF" stroke="#D8CCBE" stroke-width="2" />
    <text x="104" y="556" font-size="22" font-weight="700" fill="#102A2B">札幌市内・地下鉄、市電、徒歩</text>
    <g font-size="17" fill="#102A2B">
      <text x="104" y="596">● 大通公園、時計台、狸小路、すすきの：地下鉄1駅210円</text>
      <text x="104" y="628">● 時計台：大人350円・8:45～17:10・1/1～1/3休館</text>
      <text x="104" y="660">● 藻岩山：市電から無料シャトル・往復2,100円</text>
      <text x="104" y="692">● 白い恋人パーク：宮の沢・1,200円・10:00～18:00</text>
      <text x="104" y="724">● 北海道神宮：円山公園駅・開門時間は公式サイトへ</text>
      <text x="104" y="756">● 雪まつり2027：2/4～11・大通、つどーむ、すすきの</text>
      <text x="104" y="788" fill="#5C6B6B">市電230円・地下鉄1日券830円・ドニチカキップ520円</text>
    </g>
  </g>

  
