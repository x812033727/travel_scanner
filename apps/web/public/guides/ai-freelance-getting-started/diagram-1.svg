<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">這個案子適合用 AI 嗎 / Should this freelance job use AI?</title>
<desc id="desc">由左到右的四個問題。第一問：客戶有沒有說不要用 AI？有的話就不用 AI，照客戶要求全程人工完成；沒有就往下一問。第二問：成品要拿去主張著作權嗎，例如 logo 或插畫？要的話 AI 只做發想，成品要有你的實際創作；不用就往下一問。第三問：事實與數字能對照原始資料查證嗎？不能的話先別讓 AI 起草，補齊原始資料再重新判斷；可以就往下一問。第四問：資料裡有個資或營業秘密嗎？有的話先確認工具的資料政策並取得客戶同意，確認後才用；沒有就可以用 AI：AI 起草、你逐項檢查後再交付。最下方提醒：每一條路最後都一樣，交付前由你人工檢查事實、需求、權利與機密。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#102A2B"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D6B68"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8442D"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97A2B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">這個案子適合用 AI 嗎？</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Should this freelance job use AI? Answer four questions before you start</text>
<rect x="40" y="160" width="240" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="160" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#2F6F9F">第一問</text>
<text x="160" y="274" text-anchor="middle" font-size="21" fill="#102A2B">客戶有沒有說</text>
<text x="160" y="308" text-anchor="middle" font-size="21" fill="#102A2B">不要用 AI？</text>
<rect x="360" y="160" width="240" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="480" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#2F6F9F">第二問</text>
<text x="480" y="257" text-anchor="middle" font-size="21" fill="#102A2B">成品要拿去</text>
<text x="480" y="291" text-anchor="middle" font-size="21" fill="#102A2B">主張著作權嗎？</text>
<text x="480" y="325" text-anchor="middle" font-size="21" fill="#102A2B">（logo、插畫）</text>
<rect x="680" y="160" width="240" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#2F6F9F">第三問</text>
<text x="800" y="257" text-anchor="middle" font-size="21" fill="#102A2B">事實與數字能</text>
<text x="800" y="291" text-anchor="middle" font-size="21" fill="#102A2B">對照原始資料</text>
<text x="800" y="325" text-anchor="middle" font-size="21" fill="#102A2B">查證嗎？</text>
<rect x="1000" y="160" width="240" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1120" y="228" text-anchor="middle" font-size="24" font-weight="700" fill="#2F6F9F">第四問</text>
<text x="1120" y="274" text-anchor="middle" font-size="21" fill="#102A2B">資料裡有個資</text>
<text x="1120" y="308" text-anchor="middle" font-size="21" fill="#102A2B">或營業秘密嗎？</text>
<rect x="1320" y="160" width="240" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1440" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#0D6B68">可以用 AI</text>
<text x="1440" y="257" text-anchor="middle" font-size="21" fill="#102A2B">AI 起草</text>
<text x="1440" y="291" text-anchor="middle" font-size="21" fill="#102A2B">你逐項檢查</text>
<text x="1440" y="325" text-anchor="middle" font-size="21" fill="#102A2B">再交付</text>
<rect x="40" y="480" width="240" height="190" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="160" y="543" text-anchor="middle" font-size="24" font-weight="700" fill="#B8442D">不用 AI</text>
<text x="160" y="589" text-anchor="middle" font-size="21" fill="#102A2B">照客戶要求</text>
<text x="160" y="623" text-anchor="middle" font-size="21" fill="#102A2B">全程人工完成</text>
<rect x="360" y="480" width="240" height="190" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="480" y="543" text-anchor="middle" font-size="24" font-weight="700" fill="#D97A2B">AI 只做發想</text>
<text x="480" y="589" text-anchor="middle" font-size="21" fill="#102A2B">成品要有你的</text>
<text x="480" y="623" text-anchor="middle" font-size="21" fill="#102A2B">實際創作</text>
<rect x="680" y="480" width="240" height="190" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="543" text-anchor="middle" font-size="24" font-weight="700" fill="#B8442D">先別讓 AI 起草</text>
<text x="800" y="589" text-anchor="middle" font-size="21" fill="#102A2B">補齊原始資料</text>
<text x="800" y="623" text-anchor="middle" font-size="21" fill="#102A2B">再重新判斷</text>
<rect x="1000" y="480" width="240" height="190" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1120" y="543" text-anchor="middle" font-size="24" font-weight="700" fill="#D97A2B">確認後再用</text>
<text x="1120" y="589" text-anchor="middle" font-size="21" fill="#102A2B">工具資料政策</text>
<text x="1120" y="623" text-anchor="middle" font-size="21" fill="#102A2B">與客戶同意</text>
<line x1="284" y1="270" x2="354" y2="270" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="319" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">沒有</text>
<line x1="604" y1="270" x2="674" y2="270" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="639" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">不用</text>
<line x1="924" y1="270" x2="994" y2="270" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="959" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">可以</text>
<line x1="1244" y1="270" x2="1314" y2="270" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="1279" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">沒有</text>
<line x1="160" y1="364" x2="160" y2="474" stroke="#B8442D" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-red)"/>
<text x="176" y="426" font-size="20" font-weight="700" fill="#B8442D">有</text>
<line x1="480" y1="364" x2="480" y2="474" stroke="#D97A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-orange)"/>
<text x="496" y="426" font-size="20" font-weight="700" fill="#D97A2B">要</text>
<line x1="800" y1="364" x2="800" y2="474" stroke="#B8442D" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-red)"/>
<text x="816" y="426" font-size="20" font-weight="700" fill="#B8442D">不能</text>
<line x1="1120" y1="364" x2="1120" y2="474" stroke="#D97A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-orange)"/>
<text x="1136" y="426" font-size="20" font-weight="700" fill="#D97A2B">有</text>
<path d="M 1244 575 L 1440 575 L 1440 368" fill="none" stroke="#0D6B68" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="butt" marker-end="url(#arrow-teal)"/>
<text x="1456" y="474" font-size="20" font-weight="700" fill="#0D6B68">確認後</text>
<rect x="40" y="716" width="1520" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="763" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">每一條路最後都一樣：交付前由你人工檢查事實、需求、權利與機密</text>
