<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Noto Sans TC',system-ui,sans-serif">
  <title id="title">シンガポール3泊4日のエリア別模式図</title>
  <desc id="desc">簡略化したシンガポールの輪郭に4日間の訪問エリアを表示。1日目マリーナベイ：植物園の温室9:00–21:00、Garden Rhapsody 19:45・20:45。2日目チャイナタウンとタンジョン・パガー：スリ・マリアマン寺院6:00–12:00、18:00–21:00。3日目は二者択一：A案の北のマンダイ（実線）はバードパラダイス9:00–18:00とナイトサファリ18:00–24:00、B案は南のセントーサ（破線）。4日目カンポン・グラム、リトル・インディア、オーチャード：サルタン・モスクは金曜の見学不可。最後に東のチャンギJewelのレイン・ボルテックス10:00–22:00。灰色の線はMRTの模式図。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">シンガポール3泊4日：日ごとの訪問エリア</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">エリア別4日間コース · 模式図、縮尺不正確</text>

  <!-- island outlines -->
  <path d="M 70 440 C 90 340, 200 250, 340 215 C 470 180, 640 175, 760 200 C 880 225, 1000 290, 1060 380 C 1090 430, 1070 490, 1010 520 C 900 580, 780 650, 640 680 C 520 700, 380 690, 260 650 C 160 615, 60 540, 70 440 Z" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <ellipse cx="545" cy="770" rx="120" ry="36" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>

  <!-- MRT schematic skeleton -->
  <g fill="none" stroke="#B9B1A5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 520 270 L 520 590 L 545 770"/>
    <path d="M 520 520 L 840 520 L 940 420"/>
  </g>

  <!-- Day 3 routes: A solid to Mandai, B dashed to Sentosa -->
  <path d="M 520 520 L 520 270" fill="none" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M 520 520 L 520 590 L 545 770" fill="none" stroke="#6B4A3A" stroke-width="10" stroke-dasharray="20 14" stroke-linejoin="round"/>

  <!-- markers -->
  <g font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="520" cy="270" r="22" fill="#6B4A3A"/>
    <text x="520" y="276">3A</text>
    <circle cx="545" cy="770" r="22" fill="#6B4A3A"/>
    <text x="545" y="776">3B</text>
    <circle cx="520" cy="450" r="22" fill="#2F6F9F"/>
    <text x="520" y="456">4</text>
    <circle cx="660" cy="440" r="22" fill="#2F6F9F"/>
    <text x="660" y="446">4</text>
    <circle cx="940" cy="420" r="22" fill="#2F6F9F"/>
    <text x="940" y="426">4</text>
    <circle cx="520" cy="590" r="22" fill="#B8442D"/>
    <text x="520" y="596">2</text>
    <circle cx="660" cy="580" r="22" fill="#0D6B68"/>
    <text x="660" y="586">1</text>
  </g>

  <!-- map labels -->
  <g font-size="17" font-weight="700">
    <text x="492" y="266" text-anchor="end" fill="#6B4A3A">マンダイ Mandai</text>
    <text x="492" y="292" text-anchor="end" font-weight="400" fill="#5C6B6B">バードパラダイス・ナイトサファリ</text>
    <text x="492" y="457" text-anchor="end" fill="#2F6F9F">オーチャード</text>
    <text x="692" y="432" fill="#2F6F9F">カンポン・グラム</text>
    <text x="692" y="458" fill="#2F6F9F">リトル・インディア</text>
    <text x="940" y="384" text-anchor="middle" fill="#2F6F9F">チャンギ・Jewel</text>
    <text x="492" y="584" text-anchor="end" fill="#B8442D">チャイナタウン</text>
    <text x="492" y="610" text-anchor="end" fill="#B8442D">タンジョン・パガー</text>
    <text x="692" y="587" fill="#0D6B68">マリーナベイ</text>
    <text x="410" y="777" text-anchor="end" fill="#6B4A3A">セントーサ</text>
  </g>

  <!-- right panel: times per day -->
  <g font-size="17" fill="#102A2B">
    <rect x="1120" y="120" width="440" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="1144" y="160" font-size="20" font-weight="700" fill="#0D6B68">1日目 マリーナベイ</text>
    <text x="1144" y="192">温室 9:00–21:00</text>
    <text x="1144" y="220">Garden Rhapsody 19:45／20:45</text>

    <rect x="1120" y="258" width="440" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
    <text x="1144" y="298" font-size="20" font-weight="700" fill="#B8442D">2日目 チャイナタウン・タンジョンパガー</text>
    <text x="1144" y="330">スリ・マリアマン寺院</text>
    <text x="1144" y="358">6:00–12:00、18:00–21:00</text>

    <rect x="1120" y="396" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
    <text x="1144" y="436" font-size="20" font-weight="700" fill="#6B4A3A">3日目 マンダイかセントーサ</text>
    <text x="1144" y="468">A バードパラダイス 9:00–18:00</text>
    <text x="1144" y="496">A ナイトサファリ 18:00–24:00</text>
    <text x="1144" y="524">B セントーサのビーチ</text>

    <rect x="1120" y="564" width="440" height="124" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
    <text x="1144" y="604" font-size="18" font-weight="700" fill="#2F6F9F">4日目 Kampong Glam・Little India・Orchard</text>
    <text x="1144" y="636">サルタン・モスクは金曜見学不可</text>
    <text x="1144" y="664">Jewelレイン・ボルテックス 10:00–22:00</text>
  </g>

  <!-- legend -->
  <g font-size="17" fill="#102A2B">
    <line x1="1130" y1="734" x2="1190" y2="734" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="1206" y="740">A案 マンダイ（実線）</text>
    <line x1="1130" y1="768" x2="1190" y2="768" stroke="#6B4A3A" stroke-width="10" stroke-dasharray="20 14"/>
    <text x="1206" y="774">B案 セントーサ（破線）</text>
    <line x1="1130" y1="802" x2="1190" y2="802" stroke="#B9B1A5" stroke-width="7" stroke-linecap="round"/>
    <text x="1206" y="808">MRTの模式路線</text>
  </g>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text>
</svg>
