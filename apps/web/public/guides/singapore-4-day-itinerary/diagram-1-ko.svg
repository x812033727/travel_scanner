<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic','Noto Sans TC',system-ui,sans-serif">
  <title id="title">싱가포르 3박 4일 지역별 개략도</title>
  <desc id="desc">단순화한 싱가포르 섬 윤곽에 4일 지역을 표시합니다. 1일 차 마리나 베이: 가든스 바이 더 베이 온실 9:00–21:00, Garden Rhapsody 19:45·20:45. 2일 차 차이나타운·탄종파가르: 스리 마리암만 사원 6:00–12:00, 18:00–21:00. 3일 차는 둘 중 하나: A안 북쪽 만다이(실선)에는 버드 파라다이스 9:00–18:00, 나이트 사파리 18:00–24:00, B안은 남쪽 센토사(점선). 4일 차 캄퐁 글램·리틀 인디아·오차드 로드: 술탄 모스크는 금요일 예약 없는 자유 방문 불가, 마지막으로 동쪽 창이 Jewel 레인 보텍스 10:00–22:00. 회색 선은 MRT 개략도입니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">싱가포르 3박 4일: 날짜별 방문 지역</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">지역별 4일 일정 · 축척과 다른 개략도</text>

  <!-- island outlines -->
  <path d="M 70 440 C 90 340, 200 250, 340 215 C 470 180, 640 175, 760 200 C 880 225, 1000 290, 1060 380 C 1090 430, 1070 490, 1010 520 C 900 580, 780 650, 640 680 C 520 700, 380 690, 260 650 C 160 615, 60 540, 70 440 Z" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <ellipse cx="545" cy="770" rx="120" ry="36" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>

  <!-- MRT schematic skeleton -->
  <g fill="none" stroke="#B9B1A5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 520 270 L 520 590 L 545 770"/>
    <path d="M 520 520 L 840 520 L 940 420"/>
  </g>

  <!-- Day 3 routes: A solid to Mandai, B dashed to Sentosa -->
  <path d="M 520 520 L 520 270" fill="none" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M 520 520 L 520 590 L 545 770" fill="none" stroke="#6B4A3A" stroke-width="10" stroke-dasharray="20 14" stroke-linejoin="round"/>

  <!-- markers -->
  <g font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="520" cy="270" r="22" fill="#6B4A3A"/>
    <text x="520" y="276">3A</text>
    <circle cx="545" cy="770" r="22" fill="#6B4A3A"/>
    <text x="545" y="776">3B</text>
    <circle cx="520" cy="450" r="22" fill="#2F6F9F"/>
    <text x="520" y="456">4</text>
    <circle cx="660" cy="440" r="22" fill="#2F6F9F"/>
    <text x="660" y="446">4</text>
    <circle cx="940" cy="420" r="22" fill="#2F6F9F"/>
    <text x="940" y="426">4</text>
    <circle cx="520" cy="590" r="22" fill="#B8442D"/>
    <text x="520" y="596">2</text>
    <circle cx="660" cy="580" r="22" fill="#0D6B68"/>
    <text x="660" y="586">1</text>
  </g>

  <!-- map labels -->
  <g font-size="17" font-weight="700">
    <text x="492" y="266" text-anchor="end" fill="#6B4A3A">만다이 Mandai</text>
    <text x="492" y="292" text-anchor="end" font-weight="400" fill="#5C6B6B">버드 파라다이스·나이트 사파리</text>
    <text x="492" y="457" text-anchor="end" fill="#2F6F9F">오차드 로드</text>
    <text x="692" y="432" fill="#2F6F9F">캄퐁 글램</text>
    <text x="692" y="458" fill="#2F6F9F">리틀 인디아</text>
    <text x="940" y="384" text-anchor="middle" fill="#2F6F9F">창이·Jewel</text>
    <text x="492" y="584" text-anchor="end" fill="#B8442D">차이나타운</text>
    <text x="492" y="610" text-anchor="end" fill="#B8442D">탄종파가르</text>
    <text x="692" y="587" fill="#0D6B68">마리나 베이</text>
    <text x="410" y="777" text-anchor="end" fill="#6B4A3A">센토사</text>
  </g>

  <!-- right panel: times per day -->
  <g font-size="17" fill="#102A2B">
    <rect x="1120" y="120" width="440" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="1144" y="160" font-size="20" font-weight="700" fill="#0D6B68">1일 차 마리나 베이</text>
    <text x="1144" y="192">온실 9:00–21:00</text>
    <text x="1144" y="220">Garden Rhapsody 19:45／20:45</text>

    <rect x="1120" y="258" width="440" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
    <text x="1144" y="298" font-size="20" font-weight="700" fill="#B8442D">2일 차 차이나타운·탄종파가르</text>
    <text x="1144" y="330">스리 마리암만 사원</text>
    <text x="1144" y="358">6:00–12:00、18:00–21:00</text>

    <rect x="1120" y="396" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
    <text x="1144" y="436" font-size="20" font-weight="700" fill="#6B4A3A">3일 차 만다이 또는 센토사</text>
    <text x="1144" y="468">A 버드 파라다이스 9:00–18:00</text>
    <text x="1144" y="496">A 나이트 사파리 18:00–24:00</text>
    <text x="1144" y="524">B 센토사 해변</text>

    <rect x="1120" y="564" width="440" height="124" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
    <text x="1144" y="604" font-size="20" font-weight="700" fill="#2F6F9F">4일 차 캄퐁 글램·리틀 인디아·오차드</text>
    <text x="1144" y="636">술탄 모스크: 금요일 자유 방문 불가</text>
    <text x="1144" y="664">Jewel 레인 보텍스 10:00–22:00</text>
  </g>

  <!-- legend -->
  <g font-size="17" fill="#102A2B">
    <line x1="1130" y1="734" x2="1190" y2="734" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="1206" y="740">A안 만다이(실선)</text>
    <line x1="1130" y1="768" x2="1190" y2="768" stroke="#6B4A3A" stroke-width="10" stroke-dasharray="20 14"/>
    <text x="1206" y="774">B안 센토사(점선)</text>
    <line x1="1130" y1="802" x2="1190" y2="802" stroke="#B9B1A5" stroke-width="7" stroke-linecap="round"/>
    <text x="1206" y="808">MRT 개략 노선</text>
  </g>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text>
</svg>
