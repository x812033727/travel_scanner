<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Four-step process: state the purpose, separate statuses, confirm ownership, and track outcomes</title>
<desc id="desc">Check in order: state the purpose, separate statuses, confirm ownership, and track outcomes. Editorial summary, not a map or measured duration.</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">Practical sequence</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">Adapt to your needs; you do not have to finish every step at once</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="30" text-anchor="middle" font-weight="700">State the purpose</text>
<text x="245" y="497" fill="#f4f0e5" font-size="18" text-anchor="middle">Define what must be decided</text>
<text x="245" y="573" fill="#f4dc9d" font-size="17" text-anchor="middle">What must this meeting decide?</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="30" text-anchor="middle" font-weight="700">Separate statuses</text>
<text x="615" y="497" fill="#f4f0e5" font-size="20" text-anchor="middle">Keep each status distinct</text>
<text x="615" y="573" fill="#f4dc9d" font-size="17" text-anchor="middle">Decided, action, or to confirm</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="30" text-anchor="middle" font-weight="700">Confirm ownership</text>
<text x="985" y="497" fill="#f4f0e5" font-size="21" text-anchor="middle">Verify who owns the work</text>
<text x="985" y="573" fill="#f4dc9d" font-size="18" text-anchor="middle">Make results and dates clear</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">Track outcomes</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="20" text-anchor="middle">Follow what happened next</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="19" text-anchor="middle">Continue from it next time</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair · Original editorial diagram</text>
</g>
</svg>
