<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從歌詞到成品 / From lyrics to a finished track</title>
  <desc id="desc">一張幾何插圖：左邊是一張白色卡片，上面有三組短標記與長短不一的橫線，代表分成段落的歌詞；一個箭頭指向中央的圓形，圓內是九根高低起伏的直條，代表生成中的聲波；另一個箭頭指向右邊的白色卡片，卡片裡是一組由兩個音符頭、兩根符桿與一道斜的符樑組成的音符，代表完成的歌曲。畫面下方有一行字「從歌詞到成品」。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#0D6B68"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- lyrics sheet -->
  <rect x="150" y="270" width="330" height="380" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="190" y="302" width="72" height="13" rx="6" fill="#0D6B68"/>
  <rect x="190" y="330" width="250" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="358" width="214" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="386" width="238" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="420" width="88" height="13" rx="6" fill="#0D6B68"/>
  <rect x="190" y="448" width="232" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="476" width="250" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="504" width="196" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="538" width="64" height="13" rx="6" fill="#0D6B68"/>
  <rect x="190" y="566" width="244" height="13" rx="6" fill="#5C6B6B"/>
  <rect x="190" y="594" width="208" height="13" rx="6" fill="#5C6B6B"/>

  <line x1="500" y1="460" x2="612" y2="460" stroke="#0D6B68" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- generating: waveform in a circle -->
  <circle cx="800" cy="460" r="170" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="639" y="426" width="18" height="68" rx="9" fill="#0D6B68"/>
  <rect x="677" y="398" width="18" height="124" rx="9" fill="#2E7D5B"/>
  <rect x="715" y="364" width="18" height="192" rx="9" fill="#0D6B68"/>
  <rect x="753" y="336" width="18" height="248" rx="9" fill="#2E7D5B"/>
  <rect x="791" y="320" width="18" height="280" rx="9" fill="#D97A2B"/>
  <rect x="829" y="336" width="18" height="248" rx="9" fill="#2E7D5B"/>
  <rect x="867" y="364" width="18" height="192" rx="9" fill="#0D6B68"/>
  <rect x="905" y="398" width="18" height="124" rx="9" fill="#2E7D5B"/>
  <rect x="943" y="426" width="18" height="68" rx="9" fill="#0D6B68"/>

  <line x1="990" y1="460" x2="1102" y2="460" stroke="#0D6B68" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- finished track: a pair of beamed notes -->
  <rect x="1120" y="270" width="330" height="380" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <polygon points="1240,350 1374,320 1374,352 1240,382" fill="#2F6F9F"/>
  <rect x="1240" y="350" width="14" height="196" fill="#2F6F9F"/>
  <rect x="1360" y="320" width="14" height="196" fill="#2F6F9F"/>
  <ellipse cx="1213" cy="548" rx="44" ry="32" fill="#2F6F9F" transform="rotate(-20 1213 548)"/>
  <ellipse cx="1333" cy="518" rx="44" ry="32" fill="#2F6F9F" transform="rotate(-20 1333 518)"/>

  <text x="800" y="792" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">從歌詞到成品</text>
</svg>
