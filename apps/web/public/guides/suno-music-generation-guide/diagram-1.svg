<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Suno 做一首歌的流程 / How a song is made in Suno</title>
  <desc id="desc">由左到右五個步驟：選模式（Simple 寫描述、Custom 貼歌詞）、填欄位（歌詞 Lyrics、風格 Styles、排除 Exclude）、生成（每次 10 點、一次出兩首、最長 8 分鐘、模型 v6 與 v6-wild、v6-mini）、延長與修改（Extend 延長、Cover 翻唱、Persona、換段落 Replace Section）、輸出（MP3 全方案、WAV 付費方案、分軌與影片）。下方一條橫幅說明商用權的閘門：新版條款自 2026 年 9 月 3 日生效，只有下載過的檔案才能商用；免費方案最多 7 次終身試用下載、不附商用權，Pro 每月 20 次下載附商用權，Premier 每月 60 次下載附商用權。額度不滾存、每個帳單日重設；未下載的作品，以及用錄音或側錄取得的檔案不得商用。歌詞若由你自己寫，不論方案都由你保有所有權。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#0D6B68"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="30" y="52" font-size="30" font-weight="700" fill="#102A2B">Suno 做一首歌的流程</text>
  <text x="30" y="84" font-size="18" fill="#5C6B6B">From lyrics to a finished, downloadable track</text>

  <!-- step 1 -->
  <rect x="30" y="150" width="260" height="250" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="160" y="197" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">選模式</text>
  <text x="160" y="248" font-size="17" fill="#102A2B" text-anchor="middle">Simple：寫描述</text>
  <text x="160" y="288" font-size="17" fill="#102A2B" text-anchor="middle">Custom：貼歌詞</text>
  <text x="160" y="340" font-size="17" fill="#5C6B6B" text-anchor="middle">建立頁只有</text>
  <text x="160" y="368" font-size="17" fill="#5C6B6B" text-anchor="middle">這兩個模式</text>

  <!-- step 2 -->
  <rect x="350" y="150" width="260" height="250" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="480" y="197" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">填欄位</text>
  <text x="480" y="248" font-size="17" fill="#102A2B" text-anchor="middle">歌詞 Lyrics</text>
  <text x="480" y="288" font-size="17" fill="#102A2B" text-anchor="middle">風格 Styles</text>
  <text x="480" y="328" font-size="17" fill="#102A2B" text-anchor="middle">排除 Exclude</text>
  <text x="480" y="368" font-size="17" fill="#5C6B6B" text-anchor="middle">標題 Title</text>

  <!-- step 3 -->
  <rect x="670" y="150" width="260" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="197" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">生成</text>
  <text x="800" y="248" font-size="17" fill="#102A2B" text-anchor="middle">每次 10 點</text>
  <text x="800" y="288" font-size="17" fill="#102A2B" text-anchor="middle">一次出兩首</text>
  <text x="800" y="328" font-size="17" fill="#102A2B" text-anchor="middle">最長 8 分鐘</text>
  <text x="800" y="368" font-size="17" fill="#5C6B6B" text-anchor="middle">v6／v6-wild／v6-mini</text>

  <!-- step 4 -->
  <rect x="990" y="150" width="260" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1120" y="197" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">延長與修改</text>
  <text x="1120" y="248" font-size="17" fill="#102A2B" text-anchor="middle">Extend 延長</text>
  <text x="1120" y="288" font-size="17" fill="#102A2B" text-anchor="middle">Cover 翻唱</text>
  <text x="1120" y="328" font-size="17" fill="#102A2B" text-anchor="middle">Persona 風格</text>
  <text x="1120" y="368" font-size="17" fill="#102A2B" text-anchor="middle">換段落 Replace</text>

  <!-- step 5 -->
  <rect x="1310" y="150" width="260" height="250" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1440" y="197" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">輸出</text>
  <text x="1440" y="248" font-size="17" fill="#102A2B" text-anchor="middle">MP3 全方案</text>
  <text x="1440" y="288" font-size="17" fill="#102A2B" text-anchor="middle">WAV 付費方案</text>
  <text x="1440" y="328" font-size="17" fill="#102A2B" text-anchor="middle">分軌與影片</text>
  <text x="1440" y="368" font-size="17" fill="#5C6B6B" text-anchor="middle">MIDI 限 Studio</text>

  <line x1="298" y1="275" x2="342" y2="275" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="618" y1="275" x2="662" y2="275" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="938" y1="275" x2="982" y2="275" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1258" y1="275" x2="1302" y2="275" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1440" y1="406" x2="1440" y2="462" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- commercial-use gate -->
  <rect x="30" y="470" width="1540" height="290" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="60" y="518" font-size="20" font-weight="700" fill="#B8442D">商用權的閘門：只有下載過的檔案才能商用（新版條款 2026 年 9 月 3 日生效）</text>

  <rect x="60" y="548" width="470" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="295" y="592" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">免費方案</text>
  <text x="295" y="636" font-size="17" fill="#102A2B" text-anchor="middle">最多 7 次終身試用下載</text>
  <text x="295" y="676" font-size="17" fill="#B8442D" text-anchor="middle">不附商用權</text>

  <rect x="565" y="548" width="470" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="592" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Pro</text>
  <text x="800" y="636" font-size="17" fill="#102A2B" text-anchor="middle">每月 20 次下載</text>
  <text x="800" y="676" font-size="17" fill="#0D6B68" text-anchor="middle">附商用權</text>

  <rect x="1070" y="548" width="470" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1305" y="592" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Premier</text>
  <text x="1305" y="636" font-size="17" fill="#102A2B" text-anchor="middle">每月 60 次下載</text>
  <text x="1305" y="676" font-size="17" fill="#0D6B68" text-anchor="middle">附商用權</text>

  <text x="30" y="800" font-size="17" fill="#5C6B6B">下載額度不滾存、每個帳單日重設；沒有下載過的作品，以及用錄音或側錄取得的檔案，都不得商用。</text>
  <text x="30" y="832" font-size="17" fill="#5C6B6B">歌詞若由你自己寫，不論用哪一個方案，所有權都還是你的。</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
