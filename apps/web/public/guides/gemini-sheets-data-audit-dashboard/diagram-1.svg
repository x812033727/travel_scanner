<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">保留原表，分幣別核對金額</title><desc id="desc">原始：五十列合成交易：來源列號可追查；採用：四十三列可計算：退款與大額保留；隔離：七列待查或重複：空白金額不補零；總數：TWD 45340：USD 50 分開列</desc>
<rect width="1600" height="900" fill="#fbf1e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">保留原表，分幣別核對金額</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#875b3e" font-weight="800">原始</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">五十列合成交易</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">來源列號可追查</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#875b3e" font-weight="800">採用</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">四十三列可計算</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">退款與大額保留</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#875b3e" font-weight="800">隔離</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">七列待查或重複</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">空白金額不補零</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#875b3e" font-weight="800">總數</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">TWD 45340</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">USD 50 分開列</text><text x="85" y="818" font-size="47" fill="#775b45" font-weight="500">本機公式已測；Sheets 匯入待驗</text></g></svg>