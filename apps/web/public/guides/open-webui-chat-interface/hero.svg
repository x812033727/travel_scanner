<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">自架網頁介面連到雲端與本機模型 / A self-hosted web chat window wired to a cloud service and a local machine</title>
  <desc id="desc">插圖。畫面中央偏左是一個白色的瀏覽器視窗，上方有三個圓點的視窗列，裡面有三個對話框：右側兩個淺藍色的是使用者發問，左側一個淺綠色的是助理回答，框裡用短橫條代表文字。視窗底部是一條輸入列，左邊有一個橘色的小方塊代表上傳檔案，右邊有一個綠色圓形的送出鈕。視窗右側拉出兩條線：上面一條藍線連到一朵藍色的雲，代表雲端的相容 API；下面一條綠線連到一台綠色的桌機，螢幕中央有一顆晶片，代表跑在自己機器上的本機模型。畫面上方一行字寫著「一個介面，接住所有模型」。整張圖只有幾何形狀，沒有任何品牌標誌或介面截圖。</desc>
