<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用講的做出小工具 / Describe it, and a small app appears</title>
  <desc id="desc">插圖：米色底上，左邊有一個深青色的圓角對話泡泡，泡泡裡有三個白點，尾巴朝下，代表一則對話。泡泡右上方有三顆由小變大的青色圓點往右上浮，連到右邊一個白色的圓角小視窗。視窗上緣有三個灰色小圓點當作視窗列，視窗裡畫著一條灰色基準線與五根長條，由左到右分別是藍色、青色、藍色、橘色最高、青色，長條下方有一顆橘色的圓角按鈕，按鈕上有一條淺色的短線當作文字。畫面下方只有一行字：用講的做出小工具。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="140" cy="160" r="120" fill="#E6F0F7"/>
  <circle cx="1490" cy="770" r="110" fill="#E3F0EF"/>
  <circle cx="1510" cy="170" r="64" fill="#E3F0EF"/>

  <!-- ground shadow -->
  <ellipse cx="820" cy="736" rx="540" ry="28" fill="#E3DDD2"/>

  <!-- speech bubble -->
  <path d="M 224 250 H 616 Q 660 250 660 294 V 486 Q 660 530 616 530 H 520 L 458 594 L 478 530 H 224 Q 180 530 180 486 V 294 Q 180 250 224 250 Z" fill="#0D6B68" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="300" cy="390" r="26" fill="#FFFFFF"/>
  <circle cx="400" cy="390" r="26" fill="#FFFFFF"/>
  <circle cx="500" cy="390" r="26" fill="#FFFFFF"/>

  <!-- the window floating out of the bubble -->
  <circle cx="686" cy="296" r="16" fill="#0D6B68"/>
  <circle cx="714" cy="252" r="11" fill="#0D6B68"/>
  <circle cx="736" cy="216" r="7" fill="#0D6B68"/>

  <rect x="760" y="150" width="680" height="530" rx="28" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
  <circle cx="802" cy="194" r="11" fill="#5C6B6B"/>
  <circle cx="838" cy="194" r="11" fill="#5C6B6B"/>
  <circle cx="874" cy="194" r="11" fill="#5C6B6B"/>
  <rect x="760" y="230" width="680" height="5" fill="#E3DDD2"/>

  <!-- bar chart inside the window -->
  <rect x="810" y="470" width="80" height="110" rx="10" fill="#2F6F9F"/>
  <rect x="920" y="400" width="80" height="180" rx="10" fill="#0D6B68"/>
  <rect x="1030" y="440" width="80" height="140" rx="10" fill="#2F6F9F"/>
  <rect x="1140" y="350" width="80" height="230" rx="10" fill="#D97A2B"/>
  <rect x="1250" y="415" width="80" height="165" rx="10" fill="#0D6B68"/>
  <rect x="800" y="580" width="600" height="6" rx="3" fill="#5C6B6B"/>

  <!-- the button -->
  <rect x="810" y="608" width="230" height="52" rx="16" fill="#D97A2B"/>
  <rect x="848" y="628" width="154" height="12" rx="6" fill="#F7F1E8"/>

  <!-- small accents -->
  <circle cx="120" cy="628" r="20" fill="#D97A2B"/>
  <circle cx="196" cy="700" r="12" fill="#0D6B68"/>
  <circle cx="1520" cy="452" r="14" fill="#0D6B68"/>

  <!-- single line of text -->
  <text x="800" y="844" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">用講的做出小工具</text>
</svg>
