<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dtitle ddesc" font-family="'Noto Sans TC','Noto Sans KR',system-ui,sans-serif">
  <title id="dtitle">聖水洞咖啡店兩站示意圖 / Seongsu-dong cafés by nearest station</title>
  <desc id="ddesc">圖上的標題是「聖水洞咖啡店兩站示意圖」，副標是「示意圖，非比例・Seongsu-dong cafés by nearest station」。圖分左右兩塊，中間留白，留白處放一個獨立的說明框，兩塊之間沒有任何連接線或箭頭。左塊標題「성수역（Seongsu）一帶」，中央是성수역站點，站點下方標出街道名「연무장길」並註明這條街上沒有下列的店；再下方沿路名標出店家點，全部是橘色的網美類型：성수이로旁是대림창고與카페씨떼、성수일로6길旁是앤더슨씨、연무장5길旁是쎈느 Scene、아차산로9길旁是어니언。右塊標題「뚝섬역（Ttukseom）一帶」，中央是뚝섬역站點，下方沿路名標出店家點，全部是藍綠色的咖啡品質類型：왕십리로5길旁是에빠、뚝섬로1나길旁是로우키。中間的說明框寫「兩站都在同一條地鐵線上」與「本圖不表示兩站的前後順序、方向或距離。」下方圖例只有兩個類型色塊：橘色的網美與藍綠色的咖啡品質，並註明店名與路名照韓文寫，方便對照招牌與地圖。右下角是「© Mokaair 製圖 2026」。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- title -->
  <text x="800" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#102A2B">聖水洞咖啡店兩站示意圖</text>
  <text x="800" y="84" text-anchor="middle" font-size="18" fill="#5C6B6B">示意圖，非比例・Seongsu-dong cafés by nearest station</text>

  <!-- left panel: 성수역 side -->
  <rect x="30" y="110" width="600" height="670" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="#5C6B6B" stroke-width="3"/>
  <text x="330" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#102A2B">성수역（Seongsu）一帶</text>

  <circle cx="330" cy="225" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="330" y="287" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">성수역</text>

  <!-- left: the street the area is named for, with no shop dots on it -->
  <text x="330" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">연무장길</text>
  <text x="330" y="376" text-anchor="middle" font-size="15" fill="#5C6B6B">這條街上沒有下列的店</text>

  <!-- left: shop dots by road name -->
  <text x="140" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">성수이로</text>
  <circle cx="105" cy="515" r="12" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="105" y="552" text-anchor="middle" font-size="15" fill="#102A2B">대림창고</text>
  <circle cx="175" cy="515" r="12" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="175" y="552" text-anchor="middle" font-size="15" fill="#102A2B">카페씨떼</text>

  <text x="300" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">성수일로6길</text>
  <circle cx="300" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="300" y="552" text-anchor="middle" font-size="15" fill="#102A2B">앤더슨씨</text>

  <text x="440" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">연무장5길</text>
  <circle cx="440" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="440" y="552" text-anchor="middle" font-size="15" fill="#102A2B">쎈느 Scene</text>

  <text x="570" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">아차산로9길</text>
  <circle cx="570" cy="515" r="15" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="570" y="552" text-anchor="middle" font-size="15" fill="#102A2B">어니언</text>

  <!-- right panel: 뚝섬역 side -->
  <rect x="970" y="110" width="600" height="670" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="#5C6B6B" stroke-width="3"/>
  <text x="1270" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#102A2B">뚝섬역（Ttukseom）一帶</text>

  <circle cx="1270" cy="225" r="38" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1270" y="287" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">뚝섬역</text>

  <!-- right: shop dots by road name -->
  <text x="1120" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">왕십리로5길</text>
  <circle cx="1120" cy="515" r="15" fill="#0D6B68" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1120" y="552" text-anchor="middle" font-size="15" fill="#102A2B">에빠</text>

  <text x="1420" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#102A2B">뚝섬로1나길</text>
  <circle cx="1420" cy="515" r="15" fill="#0D6B68" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1420" y="552" text-anchor="middle" font-size="15" fill="#102A2B">로우키</text>

  <!-- floating note in the gap: no connection implied between the two blocks -->
  <rect x="655" y="540" width="290" height="140" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
  <text x="800" y="586" text-anchor="middle" font-size="16" fill="#102A2B">兩站都在同一條地鐵線上</text>
  <text x="800" y="622" text-anchor="middle" font-size="16" fill="#5C6B6B">本圖不表示兩站的</text>
  <text x="800" y="650" text-anchor="middle" font-size="16" fill="#5C6B6B">前後順序、方向或距離。</text>

  <!-- legend: only the two types this article actually uses -->
  <rect x="330" y="797" width="24" height="24" fill="#D97A2B"/>
  <text x="362" y="816" font-size="17" fill="#102A2B">網美</text>

  <rect x="500" y="797" width="24" height="24" fill="#0D6B68"/>
  <text x="532" y="816" font-size="17" fill="#102A2B">咖啡品質</text>

  <text x="720" y="816" font-size="16" fill="#5C6B6B">店名與路名照韓文寫，方便對照招牌與地圖</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
