<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026-27 日本冬季燈飾時間軸：東京、大阪、京都、神戶九個場地的已公布檔期與 2025 年參考檔期</title>
  <desc id="desc">橫向時間軸從 2026 年 11 月到 2027 年 2 月。實心橫條是官網已公布的 2026 到 2027 檔期：讀賣樂園 10 月 29 日到 2027 年 4 月 4 日、京都車站大階梯全年、神戶光雕 2027 年 1 月 29 日到 2 月 7 日。虛框橫條是 2026 年尚未公布、以 2025 年檔期示意的場地：丸之內 11 月 13 日到 2 月 15 日、六本木欅坂 11 月 4 日到 12 月 25 日、東京中城 11 月 13 日到 12 月 25 日、澀谷青之洞窟 12 月 4 日到 12 月 25 日、御堂筋到 12 月 31 日、OSAKA 光之文藝復興 12 月 14 日到 12 月 25 日。12 月 25 日有一條紅色虛線標示多數場地結束。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="70" font-size="36" font-weight="700" fill="#102A2B">2026-27 冬季燈飾時間軸　已公布檔期 vs 2025 檔期參考</text>
  <text x="60" y="106" font-size="20" fill="#5C6B6B">Winter illumination timeline · 2026-09-13 查證：只有讀賣樂園與神戶光雕公布新檔期，其餘以 2025 年示意，出發前再查官網</text>

  <!-- month grid: 1 Nov 2026 = x 420, 9.1667 px per day, 28 Feb 2027 ends at x 1520 -->
  <g stroke="#C9C2B8" stroke-width="2">
    <line x1="420" y1="150" x2="420" y2="780"/>
    <line x1="695" y1="150" x2="695" y2="780"/>
    <line x1="979" y1="150" x2="979" y2="780"/>
    <line x1="1263" y1="150" x2="1263" y2="780"/>
    <line x1="1520" y1="150" x2="1520" y2="780"/>
  </g>
  <g stroke="#DAD3C8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="548" y1="170" x2="548" y2="780"/>
    <line x1="823" y1="170" x2="823" y2="780"/>
    <line x1="1107" y1="170" x2="1107" y2="780"/>
    <line x1="1392" y1="170" x2="1392" y2="780"/>
  </g>
  <g font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="557" y="140">2026 年 11 月 Nov</text>
    <text x="837" y="140">12 月 Dec</text>
    <text x="1121" y="140">2027 年 1 月 Jan</text>
    <text x="1391" y="140">2 月 Feb</text>
  </g>
