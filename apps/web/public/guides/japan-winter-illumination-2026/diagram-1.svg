  <line x1="915" y1="150" x2="915" y2="780" stroke="#B8442D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="915" y="170" font-size="15" font-weight="700" fill="#B8442D" text-anchor="middle">12/25 多數場地結束</text>

