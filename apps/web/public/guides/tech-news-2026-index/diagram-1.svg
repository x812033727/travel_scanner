<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">讀科技新聞，先分四種說法</title><desc id="desc">讀科技新聞的第一步是分清楚說法的種類：已經適用或開賣、已經發表而且有日期、只有預告或預覽版，或是研討會發言與廠商自己的推估；四種可以依賴的程度不同。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">讀科技新聞，先分四種說法</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">已適用或開賣</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">看適用日、對象與地區</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">已發表有日期</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">看日期屬於哪個地區</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">預告與預覽版</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">看有沒有確切日期</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">研討與推估</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">看誰說的、條件是什麼</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text></svg>