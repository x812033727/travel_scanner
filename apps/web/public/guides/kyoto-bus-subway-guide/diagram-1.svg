<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">京都站出發的五條觀光走廊 / Kyoto sightseeing corridors from Kyoto Station</title>
  <desc id="desc">簡化的京都示意地圖。京都站往東：觀光特急巴士 EX100、EX101（500 日圓，週六日假日）和市巴士 206（230 日圓）沿東山通到清水寺的五条坂、祇園、岡崎、銀閣寺；往西北：市巴士 205 沿西大路通到金閣寺；往西：JR 嵯峨野線到嵯峨嵐山，走 13 分鐘到天龍寺，市巴士 28 會塞車；往南：JR 奈良線 3 分鐘到東福寺、5 分鐘到伏見稻荷，京阪本線也到這兩站；市中心有地鐵烏丸線（京都到北大路、國際會館）和東西線（二条城前、烏丸御池、三条京阪、蹴上），220 到 360 日圓；京阪本線沿鴨川東岸經祇園四条、清水五条，阪急沿四条通從京都河原町往大阪梅田與嵐山。地下鐵・巴士一日券 1,100 日圓。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="60" font-size="34" font-weight="700" fill="#102A2B">京都站出發的五條觀光走廊　實線搭電車、虛線搭巴士</text>
  <text x="60" y="94" font-size="19" fill="#5C6B6B">Kyoto sightseeing corridors from Kyoto Station · 示意圖，非精確比例 · 票價為 2026 年 9 月查證</text>

