  <text x="1200" y="84" font-size="16" font-weight="700" fill="#102A2B">地下鉄 220 到 360 日圓 ｜ 地下鉄・バス1日券 1,100</text>
  <text x="1200" y="112" font-size="15" fill="#5C6B6B">JR、京阪、阪急不在一日券內，用 ICOCA 逐次付</text>

