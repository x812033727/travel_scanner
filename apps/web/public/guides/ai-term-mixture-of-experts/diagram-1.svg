<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">混合專家模型圖解 / Mixture of Experts</title><desc id="desc">輸入表示進入路由器，亮色線通往被選中的專家，灰色專家未參與這次運算，結果再回到共同後續層。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">路由只啟用部分專家子網路</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Mixture of Experts</text><rect x="70" y="350" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="220" y="447" text-anchor="middle" font-size="36" fill="#102A2B">輸入表示</text><path d="M 370 435 L 500 435" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="500" cy="435" r="10" fill="#0D6B68"/><rect x="500" y="350" width="300" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="650" y="447" text-anchor="middle" font-size="36" fill="#102A2B">路由器</text><path d="M 800 435 L 940 200" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="940" cy="200" r="10" fill="#0D6B68"/><path d="M 800 435 L 940 600" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="940" cy="600" r="10" fill="#0D6B68"/><rect x="940" y="140" width="280" height="110" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1080" y="207" text-anchor="middle" font-size="36" fill="#102A2B">專家甲</text><rect x="940" y="340" width="280" height="110" rx="24" fill="#ECEAE6" stroke="#8C9997" stroke-width="4"/><text x="1080" y="407" text-anchor="middle" font-size="36" fill="#102A2B">專家乙</text><rect x="940" y="540" width="280" height="110" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1080" y="607" text-anchor="middle" font-size="36" fill="#102A2B">專家丙</text><path d="M 1220 195 L 1350 430" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1350" cy="430" r="10" fill="#0D6B68"/><path d="M 1220 595 L 1350 430" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1350" cy="430" r="10" fill="#0D6B68"/><rect x="1310" y="350" width="230" height="170" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1425" y="447" text-anchor="middle" font-size="36" fill="#102A2B">後續層</text><text x="800" y="760" text-anchor="middle" font-size="32" fill="#102A2B">灰色：本次未啟用；權重仍屬於模型</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
