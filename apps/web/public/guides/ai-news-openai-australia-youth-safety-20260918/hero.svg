<title id="title">OpenAI 發布澳洲青少年安全藍圖：六項支柱寫給澳洲，台灣家長現在有什麼</title><desc id="desc">原創插圖：一份攤開的文件幾何圖樣正中央，右側立著一個簡化的地標輪廓並有一枚圖釘釘在上面，文件左側另有一個較淡、以虛線描邊的地標輪廓，兩個地標之間用一條虛線連著，象徵這份文件先把一根釘子釘在一個地方，另一個地方目前只有虛線。</desc>
