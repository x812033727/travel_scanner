<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">藍圖、產品與台灣的距離</title><desc id="desc">OpenAI 於 2026 年 9 月 18 日發布的澳洲青少年安全藍圖：六項支柱是給澳洲政策制定者的建議，ChatGPT for Teens 自 8 月起在澳洲推出，台灣帳號現有的是既有家長控制。查核日 2026 年 9 月 20 日。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">藍圖、產品與台灣的距離</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">六項支柱</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">給澳洲政策的建議</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">澳洲先推出</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">13 至 17 歲預設體驗</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">台灣能對照的</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">家長控制與年齡預測</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">藍圖沒寫的</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">台灣時程查核日未見</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text></svg>