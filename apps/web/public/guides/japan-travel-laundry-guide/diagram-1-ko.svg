<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 여행 중 빨래 일정 짜기: 호텔 세탁실·셀프 세탁소와 체크아웃 전 건조 시간: 판단 절차</title><desc>기계 확인, 의류 라벨 확인, 세제 확인, 제때 찾아오기 순으로 점검하세요. 편집부가 정리한 내용이며, 지도나 실측 시간을 나타내지 않습니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하세요. 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">기계 확인</text><text x="103" y="497" fill="#f4f0e5" font-size="23">기계 점검</text><text x="103" y="573" fill="#f4dc9d" font-size="26">세탁·건조 따로 확인</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">의류 라벨 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">세탁 라벨 읽기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">분류한 뒤 넣기</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">세제 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">세제 점검</text><text x="843" y="573" fill="#f4dc9d" font-size="26">중복 투입 금지</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">제때 찾아오기</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">바로 찾아가기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">완전히 말린 뒤 수납</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집 도식</text></g></svg>
