<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本旅行洗衣怎麼安排：飯店洗衣房、自助店與退房前的乾衣時間：判斷流程</title><desc>依序檢查：確認裝置、看衣物標籤、確認洗劑、及時取回。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">確認裝置</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Check machines</text><text x="103" y="573" fill="#f4dc9d" font-size="26">洗烘分開看</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">看衣物標籤</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Read care labels</text><text x="473" y="573" fill="#f4dc9d" font-size="26">分類再投入</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">確認洗劑</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Check detergent</text><text x="843" y="573" fill="#f4dc9d" font-size="26">不要重複加</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">及時取回</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Collect promptly</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">乾透再收納</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>