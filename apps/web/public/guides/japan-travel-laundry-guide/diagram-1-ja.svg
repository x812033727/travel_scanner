<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本旅行の洗濯計画：ホテルのランドリー、コインランドリーとチェックアウト前の乾燥時間：判断の流れ</title><desc>設備の確認、洗濯表示の確認、洗剤の確認、時間どおりの回収の順にチェック。編集部がまとめたもので、地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順 · 実用的な進め方</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、一度にすべて済ませなくて大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">設備を確認</text><text x="103" y="497" fill="#f4f0e5" font-size="23">機械を確認</text><text x="103" y="573" fill="#f4dc9d" font-size="26">洗濯と乾燥は別に確認</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">洗濯表示を見る</text><text x="473" y="497" fill="#f4f0e5" font-size="23">お手入れ表示を読む</text><text x="473" y="573" fill="#f4dc9d" font-size="26">仕分けてから投入</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">洗剤を確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">洗剤を確認</text><text x="843" y="573" fill="#f4dc9d" font-size="26">重複して加えない</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">時間どおりに回収</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">速やかに回収</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">完全に乾いてから収納</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図 / 編集部による図解</text></g></svg>
