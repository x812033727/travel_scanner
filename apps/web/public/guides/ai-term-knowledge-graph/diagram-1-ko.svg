<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">같은 행사, 다른 역할</title><desc id="desc">산청책방이 독서 모임을 주최하고 허판협회가 협력 주최하며, 모임은 칭허교실에서 열립니다. 장소를 자동으로 공동 주최자로 간주해서는 안 됩니다</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">같은 행사, 다른 역할</text><text x="60" y="84" font-size="18" fill="#5C6B6B">지식 그래프</text><path d="M 430 270 L 640 390" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 430 650 L 640 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 980 440 L 1160 440" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="190" width="350" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="255" y="264" font-size="28" fill="#102A2B" text-anchor="middle">산청책방</text><text x="255" y="307" font-size="22" fill="#5C6B6B" text-anchor="middle">주최</text><rect x="80" y="570" width="350" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="255" y="644" font-size="28" fill="#102A2B" text-anchor="middle">허판협회</text><text x="255" y="687" font-size="22" fill="#5C6B6B" text-anchor="middle">협력 주최</text><rect x="650" y="350" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="815" y="434" font-size="28" fill="#102A2B" text-anchor="middle">독서 모임</text><text x="815" y="477" font-size="22" fill="#5C6B6B" text-anchor="middle">행사 기록</text><rect x="1170" y="350" width="340" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1340" y="434" font-size="28" fill="#102A2B" text-anchor="middle">칭허교실</text><text x="1340" y="477" font-size="22" fill="#5C6B6B" text-anchor="middle">장소</text><text x="1060" y="405" font-size="22" fill="#102A2B" text-anchor="middle">개최 장소</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도표 제작 2026</text></svg>
