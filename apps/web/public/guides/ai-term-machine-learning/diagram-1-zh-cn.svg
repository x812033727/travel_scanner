<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">机器学习图解 / Machine Learning</title><desc id="desc">历史数据分为训练数据与预留测试数据；训练时调整参数，固定后对测试输入做预测，再与真实结果比较。</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">训练数据与未见数据必须分开</text><text x="60" y="84" fill="#5C6B6B" font-size="18">机器学习</text><rect x="90" y="180" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="275" y="262" text-anchor="middle" font-size="36" fill="#102A2B">历史数据</text><path d="M 460 250 L 650 250" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="650" cy="250" r="10" fill="#0D6B68" /><rect x="650" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="825" y="257" text-anchor="middle" font-size="36" fill="#102A2B">训练：调整模型</text><path d="M 1000 245 L 1150 245" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1150" cy="245" r="10" fill="#0D6B68" /><rect x="1150" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1325" y="257" text-anchor="middle" font-size="36" fill="#102A2B">固定模型</text><path d="M 275 320 L 275 590" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="275" cy="590" r="10" fill="#0D6B68" /><rect x="90" y="590" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="275" y="672" text-anchor="middle" font-size="36" fill="#102A2B">预留测试输入</text><path d="M 460 660 L 650 660" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="650" cy="660" r="10" fill="#0D6B68" /><rect x="650" y="590" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="825" y="672" text-anchor="middle" font-size="36" fill="#102A2B">生成预测</text><path d="M 1325 320 L 1325 450 L 825 450 L 825 590" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="825" cy="590" r="10" fill="#0D6B68" /><path d="M 1000 660 L 1150 660" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1150" cy="660" r="10" fill="#0D6B68" /><rect x="1150" y="590" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1325" y="672" text-anchor="middle" font-size="36" fill="#102A2B">对照真实结果</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 制图 2026</text></svg>
