<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Machine Learning Diagram / Machine Learning</title><desc id="desc">Historical data is split into training and held-out test data. Training adjusts parameters; once fixed, the model makes predictions from test inputs, which are then compared with actual outcomes.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">Keep Training and Unseen Data Separate</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Machine Learning</text><rect x="90" y="180" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="275" y="262" text-anchor="middle" font-size="36" fill="#102A2B">Historical Data</text><path d="M 460 250 L 650 250" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="250" r="10" fill="#0D6B68"></circle><rect x="650" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="257" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">Training: Adjust Model</text><path d="M 1000 245 L 1150 245" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1150" cy="245" r="10" fill="#0D6B68"></circle><rect x="1150" y="170" width="350" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1325" y="257" text-anchor="middle" font-size="36" fill="#102A2B">Fixed Model</text><path d="M 275 320 L 275 590" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="275" cy="590" r="10" fill="#0D6B68"></circle><rect x="90" y="590" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="275" y="672" text-anchor="middle" font-size="36" fill="#102A2B">Held-out Test Inputs</text><path d="M 460 660 L 650 660" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="660" r="10" fill="#0D6B68"></circle><rect x="650" y="590" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="672" text-anchor="middle" font-size="36" fill="#102A2B">Make Predictions</text><path d="M 1325 320 L 1325 450 L 825 450 L 825 590" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="825" cy="590" r="10" fill="#0D6B68"></circle><path d="M 1000 660 L 1150 660" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1150" cy="660" r="10" fill="#0D6B68"></circle><rect x="1150" y="590" width="350" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1325" y="672" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">Compare with Actuals</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphic 2026</text></svg>
