<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Four Checks for Influencer Partnerships</title><desc id="desc">Four cards show audience fit, work scope, publication checks and results reviews, separating partnership deliverables from subsequent observation.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Four Checks for Influencer Partnerships</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Keep comparable, traceable evidence from selection to wrap-up</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Audience Fit</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Review content data</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Flag unknown data</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Work Scope</text>
<text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Scope, fees, deadlines</text>
<text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Agree rights separately</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Publication Check</text>
<text x="846.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Facts, links, disclosures</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Keep delivery proof</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Results Review</text>
<text x="1215.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Match dates &amp; metrics</text>
<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Explain tracking limits</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">First confirm what the partnership can deliver, then use data to plan the next one.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
