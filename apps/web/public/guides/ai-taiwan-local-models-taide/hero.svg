<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">把模型權重下載回自己的電腦 / Downloading model weights to your own machine</title>
  <desc id="desc">左邊是一個綠色圓角方塊，裡面疊著三條白色橫條，代表分片的模型權重檔案。中間是一個橘色的鎖，鎖身上有一個鑰匙孔，代表要先同意授權條款、通過驗證才能取得檔案。右邊是一台藍框的筆記型電腦，螢幕裡有三條淺藍色的文字列與一個綠色圓點。三個圖形之間用虛線與箭頭由左往右連起來。畫面下方有一行字：下載回自己的電腦。四周散落幾個彩色圓點與短線條。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <circle cx="210" cy="170" r="16" fill="#D97A2B"/>
  <circle cx="1420" cy="180" r="13" fill="#2E7D5B"/>
  <circle cx="980" cy="196" r="10" fill="#5C6B6B"/>
  <circle cx="640" cy="706" r="13" fill="#0D6B68"/>
  <circle cx="1330" cy="688" r="10" fill="#D97A2B"/>
  <circle cx="300" cy="712" r="10" fill="#2F6F9F"/>
  <line x1="1080" y1="196" x2="1180" y2="196" stroke="#5C6B6B" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="170" x2="470" y2="170" stroke="#D97A2B" stroke-width="6" stroke-linecap="round"/>

  <rect x="150" y="270" width="344" height="340" rx="36" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="204" y="340" width="236" height="48" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="204" y="420" width="236" height="48" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="204" y="500" width="236" height="48" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>

  <line x1="510" y1="440" x2="712" y2="440" stroke="#5C6B6B" stroke-width="7" stroke-dasharray="18 14" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M 762 385 V 358 A 38 38 0 0 1 838 358 V 385" fill="none" stroke="#D97A2B" stroke-width="14" stroke-linecap="round"/>
  <rect x="738" y="385" width="124" height="112" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <circle cx="800" cy="425" r="15" fill="#D97A2B"/>
  <rect x="793" y="433" width="14" height="30" rx="7" fill="#D97A2B"/>

  <line x1="888" y1="440" x2="1114" y2="440" stroke="#5C6B6B" stroke-width="7" stroke-dasharray="18 14" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="1140" y="300" width="344" height="230" rx="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="1186" y="348" width="240" height="20" rx="10" fill="#E6F0F7"/>
  <rect x="1186" y="390" width="180" height="20" rx="10" fill="#E6F0F7"/>
  <rect x="1186" y="432" width="214" height="20" rx="10" fill="#E6F0F7"/>
  <circle cx="1406" cy="478" r="17" fill="#0D6B68"/>
  <rect x="1098" y="546" width="428" height="28" rx="14" fill="#2F6F9F"/>

  <text x="800" y="768" text-anchor="middle" font-size="54" font-weight="bold" fill="#102A2B">下載回自己的電腦</text>
