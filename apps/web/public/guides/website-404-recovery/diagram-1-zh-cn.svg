<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">遇到不存在的网址，先决定处理方向</title><desc id="desc">三张卡片区分内容应存在、内容已迁移及没有替代内容，分别对应修复、重定向及清楚的找不到页面。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">遇到不存在的网址，先决定处理方向</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">原创展览信息站：依内容状态安排响应，再提供可用的下一步</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">应该存在</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">查路由与服务问题</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">修复真正的内容</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">复查原网址响应</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">已经迁移</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">找到相对应的新页</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">安排永久重定向</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">更新站内旧链接</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">没有替代</text>
<text x="1092.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">正确的不存在响应</text>
<text x="1092.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">清楚说明当前状况</text>
<text x="1092.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">提供分类搜索入口</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先分清内容状态；不要把每一个中断都送到同一个无关页面。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
