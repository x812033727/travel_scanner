<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">聖淘沙：四種上島方式與島內三區 / Getting to Sentosa and around the island</title>
  <desc id="desc">左邊是新加坡本島的港灣站，VivoCity 三樓是聖淘沙捷運、一樓是跨海步道，港灣塔二號是纜車站。中間四條虛線箭頭指向右邊的聖淘沙島，由上到下分別是聖淘沙捷運四新幣、跨海步道免費（部分路段施工，改走有頂連通道）、纜車的 Mount Faber 線成人三十五新幣與兒童二十五新幣、公車一二三路只付車資。右邊的島上，聖淘沙捷運把名勝世界站、英比奧站、海灘站三站串成一線，站與站之間免費：名勝世界站有環球影城與新加坡海洋館，英比奧站是纜車轉乘與山頂步道，海灘站有三個海灘、西樂索炮台與 Wings of Time。海灘站再往下用免費的海灘電車串起西樂索、巴拉灣、丹戎三個海灘。這是示意圖，方向與距離非比例，開放時間與票價見內文表格。</desc>
