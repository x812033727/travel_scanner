<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">從口述到可交接的步驟 / From a spoken walkthrough to handover-ready steps</title>
<desc id="desc">米色底插圖：左邊是一個青綠色對話框，裡面是三條長短不一的波浪線，代表口述；中間三個並排、同樣大小的橘色箭頭符號指向右邊的藍框寫字板。寫字板夾著深藍色夾子，上面是四列同樣長度的步驟，每列左邊有一個青綠色圓點，第一、二、四列右邊是綠色勾，第三列右邊是橘色菱形的判斷點並分出一條短支線。下方一行字寫著從口述到可交接的步驟。</desc>
