<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 的記憶與隱私：對話泡泡裡的記憶卡片與鑰匙 / A memory card and a key inside a speech bubble</title>
  <desc id="desc">插圖：米色底上有一個深綠色的大對話泡泡，泡泡左邊放著一張白色的記憶卡片，卡片頂端有淡綠色的標題列與一個綠色圓點，卡片上有三條代表文字的灰色橫線與一個綠色小標籤；泡泡右邊是一把橘色的鑰匙，圓形的鑰匙頭朝上、齒朝右下。泡泡右上方散布三個淡藍與淡綠的圓點，泡泡下方一行字「記憶與隱私」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <circle cx="1310" cy="210" r="120" fill="#E6F0F7"/>
  <circle cx="1450" cy="400" r="72" fill="#E3F0EF"/>
  <circle cx="1350" cy="570" r="46" fill="#E6F0F7"/>
  <circle cx="1470" cy="700" r="28" fill="#E3F0EF"/>
  <!-- speech bubble -->
  <rect x="240" y="130" width="940" height="500" rx="64" fill="#0D6B68"/>
  <polygon points="380,626 500,626 320,740" fill="#0D6B68"/>
  <!-- memory card -->
  <rect x="340" y="220" width="430" height="320" rx="26" fill="#FFFFFF"/>
  <rect x="340" y="220" width="430" height="70" rx="26" fill="#E3F0EF"/>
  <rect x="340" y="256" width="430" height="34" fill="#E3F0EF"/>
  <circle cx="386" cy="255" r="15" fill="#0D6B68"/>
  <rect x="418" y="244" width="210" height="22" rx="11" fill="#0D6B68"/>
  <rect x="380" y="326" width="350" height="24" rx="12" fill="#5C6B6B" fill-opacity="0.35"/>
  <rect x="380" y="378" width="280" height="24" rx="12" fill="#5C6B6B" fill-opacity="0.35"/>
  <rect x="380" y="430" width="310" height="24" rx="12" fill="#5C6B6B" fill-opacity="0.35"/>
  <rect x="380" y="484" width="150" height="34" rx="17" fill="#2E7D5B"/>
  <circle cx="404" cy="501" r="8" fill="#FFFFFF"/>
  <rect x="424" y="495" width="84" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- key -->
  <circle cx="980" cy="330" r="86" fill="#D97A2B"/>
  <circle cx="980" cy="318" r="32" fill="#0D6B68"/>
  <rect x="950" y="400" width="60" height="196" rx="16" fill="#D97A2B"/>
  <rect x="1004" y="500" width="54" height="28" rx="8" fill="#D97A2B"/>
  <rect x="1004" y="548" width="40" height="28" rx="8" fill="#D97A2B"/>
  <!-- one line of text -->
  <text x="710" y="822" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">記憶與隱私</text>
</svg>
