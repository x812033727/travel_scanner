<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">補全、Chat、代理：三種用法怎麼分 / Copilot completions, chat and agents compared</title>
<desc id="desc">一張比較矩陣。三個直欄分別是補全、Chat 與代理，四個橫列分別是在哪裡執行、誰在動手、額度怎麼算、什麼時候用。補全在你的編輯器裡，由你自己按 Tab 採用，不扣 AI credits，免費方案每月上限 2,000 次，適合補完你已經知道要寫什麼的那幾行。Chat 在編輯器側邊欄，你問它答或改，會扣 AI credits，免費方案每月 50 次，適合看不懂、要修錯或要補測試的時候。代理在你的電腦或 GitHub 上執行，由它自己規劃與執行，會扣額度且跑得多扣得快，雲端代理限付費方案，適合一件說得清楚的完整任務。圖的下方說明代理有兩種：代理模式在你的電腦，在 VS Code 裡改檔案、提出終端機指令，每一步你都看得到也擋得下來；Copilot cloud agent 在 GitHub 上，在 GitHub Actions 提供的臨時環境裡工作，最後開一個草稿拉取請求給你審。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

