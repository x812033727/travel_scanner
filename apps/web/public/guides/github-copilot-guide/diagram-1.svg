<text x="290" y="244" font-size="18" fill="#102A2B" text-anchor="end">在哪裡執行</text>
<rect x="320" y="186" width="400" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
