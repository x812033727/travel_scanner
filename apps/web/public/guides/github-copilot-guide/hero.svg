<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">補全、Chat 與代理 / Completions, chat and agents</title>
<desc id="desc">一張以幾何形狀構成的插圖。左邊是一個白底圓角矩形的螢幕，裡面有幾條深綠色與藍色的橫條代表程式碼，其中一條是灰色虛線外框，代表還沒被採用的補全建議，末端有一個游標。一條綠色虛線箭頭從螢幕指向右上方的藍色對話框，對話框裡有三條橫條，代表在 Chat 裡問與答。另一條綠色虛線箭頭從對話框指向右下方的橘色循環箭頭，圓圈中央是一個橘色圓角方塊，代表代理自己反覆執行任務。畫面下方有一行文字：補全 · Chat · 代理。</desc>
