<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">全州拌飯菜單解碼</title>
<desc id="desc">全州市官方料理頁寫牛骨湯煮飯、全州豆芽、黃涼粉、熟成辣椒醬與醬油，是城市料理介紹，不代表每店相同。店家菜單有전주비빔밥全州拌飯、육회비빔밥生牛肉拌飯；고궁店可選놋그릇銅碗或돌솥石鍋。© Mokaair 製圖 2026。</desc>
<rect width="1600" height="900" fill="#fcfaf2"/>
<text x="90" y="105" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="54" font-weight="700" fill="#37432b">全州拌飯：城市料理與店家菜單分開看</text>
<rect x="70" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#b8c9a9" stroke-width="3"/>
<rect x="840" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#b8c9a9" stroke-width="3"/>
<g font-family="'Noto Sans TC','Noto Sans KR',sans-serif" fill="#37432b">
<text x="110" y="255" font-size="35" font-weight="700">全州市官方料理介紹</text>
<text x="110" y="340" font-size="27">牛骨湯煮飯</text><text x="110" y="405" font-size="27">全州豆芽｜콩나물</text>
<text x="110" y="470" font-size="27">黃涼粉｜황포묵</text><text x="110" y="535" font-size="27">熟成辣椒醬與醬油</text>
<text x="110" y="675" font-size="22">城市料理介紹，不保證每家配料相同</text>
<text x="880" y="255" font-size="35" font-weight="700">店家菜單要另看</text>
<text x="880" y="340" font-size="28">전주비빔밥｜全州拌飯</text>
<text x="880" y="410" font-size="28">육회비빔밥｜生牛肉拌飯</text>
<text x="880" y="505" font-size="28">고궁店的器皿選項</text>
<text x="880" y="565" font-size="26">놋그릇｜銅碗　돌솥｜石鍋</text>
<text x="880" y="675" font-size="22">器皿選項只來自該店官方頁</text>
</g>
<text x="90" y="835" fill="#68765d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：全州市官方觀光網、韓國觀光公社店家頁</text>
<text x="1240" y="835" fill="#68765d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">© Mokaair 製圖 2026</text>
</svg>
