<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">全州拌飯菜單解碼</title>
<desc id="desc">圖上的標題是「全州拌飯：傳統做法與店家菜單分開看」。圖分左右兩個白色方框。左框的標題是「全州拌飯的傳統做法」，下面四行：牛骨湯煮飯、콩나물（全州豆芽）、황포묵（黃涼粉），黃涼粉那一行下面寫「想吃先問：拌在飯裡、另外一道，還是沒有」，最後一行是熟成的糯米辣椒醬與醬油；框的下方寫「各店當天放什麼、附什麼湯，以那家的菜單為準」。右框的標題是「店家菜單要另看」，下面三組：전주비빔밥（全州拌飯），下面寫「基本菜名；配料與器皿看各店菜單」；육회비빔밥（生牛肉拌飯），下面寫「육회是生牛肉，不吃生肉先說清楚」；놋그릇（銅碗）與돌솥（石鍋），下面寫「有的店讓你挑，例如 고궁 전주본점」；框的下方寫「沒寫可選的，端上來就是店家配好的碗」。最下面三行是「菜名與店名照韓文寫，方便對照菜單與地圖」、「資料：全州市觀光網・韓國觀光公社」與「© Mokaair 製圖 2026」。</desc>
<rect width="1600" height="900" fill="#fcfaf2"/>
<text x="90" y="105" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="54" font-weight="700" fill="#37432b">全州拌飯：傳統做法與店家菜單分開看</text>
<rect x="70" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#b8c9a9" stroke-width="3"/>
<rect x="840" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#b8c9a9" stroke-width="3"/>
<g font-family="'Noto Sans TC','Noto Sans KR',sans-serif" fill="#37432b">
<text x="110" y="255" font-size="35" font-weight="700">全州拌飯的傳統做法</text>
<text x="110" y="340" font-size="27">牛骨湯煮飯</text>
<text x="110" y="400" font-size="27">콩나물｜全州豆芽</text>
<text x="110" y="460" font-size="27">황포묵｜黃涼粉</text>
<text x="110" y="496" font-size="21">想吃先問：拌在飯裡、另外一道，還是沒有</text>
<text x="110" y="556" font-size="27">熟成的糯米辣椒醬與醬油</text>
<text x="110" y="660" font-size="22">各店當天放什麼、附什麼湯，以那家的菜單為準</text>
<text x="880" y="255" font-size="35" font-weight="700">店家菜單要另看</text>
<text x="880" y="340" font-size="28">전주비빔밥｜全州拌飯</text>
<text x="880" y="378" font-size="22">基本菜名；配料與器皿看各店菜單</text>
<text x="880" y="448" font-size="28">육회비빔밥｜生牛肉拌飯</text>
<text x="880" y="486" font-size="22">육회是生牛肉，不吃生肉先說清楚</text>
<text x="880" y="566" font-size="28">놋그릇｜銅碗　돌솥｜石鍋</text>
<text x="880" y="604" font-size="22">有的店讓你挑，例如 고궁 전주본점</text>
<text x="880" y="660" font-size="22">沒寫可選的，端上來就是店家配好的碗</text>
</g>
<text x="90" y="800" fill="#68765d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="20">菜名與店名照韓文寫，方便對照菜單與地圖</text>
<text x="90" y="838" fill="#68765d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：全州市觀光網・韓國觀光公社</text>
