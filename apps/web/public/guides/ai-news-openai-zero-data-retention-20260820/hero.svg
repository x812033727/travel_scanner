<title id="title">OpenAI 為前沿模型提供零資料保留：內容留在客戶自己的雲端，只回傳訊號</title><desc id="desc">原創插圖：左側一個方形代表客戶自己的雲端儲存，內部畫滿排列整齊的小方塊代表加密紀錄；一條細線從方形延伸到右側一個小菱形，代表只有範圍受限的安全訊號流向外部，方形與菱形之間沒有其他連線，畫面不含任何商標或人像。</desc>
