<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">臺灣旅遊禮儀與安全八項速查</title>
  <desc id="desc">八格臺灣禮儀與安全速查。第一格：臺北捷運黃色標線內禁止飲食，包含喝水、嚼口香糖與檳榔，違者可罰 NT$1,500 至 7,500；身體不適先找站務人員。第二格：依月臺排隊線候車、先下後上，搭電扶梯握好扶手並站穩，深藍色座位為優先席。第三格：沒有固定給小費習慣，帳單若已列 10% 服務費不用重複支付。第四格：住家或住宿門口有鞋架、拖鞋或標示時脫鞋。第五格：艋舺龍山寺依官方指引由龍門進、虎門出，參拜時稟報姓名、生日、現居地址與所求之事，依序參拜。第六格：街邊清潔箱不是家戶垃圾收集點；臺北市違規投入家戶垃圾可罰 NT$3,600 至 6,000，飲料杯可交給有回收標示的店家。第七格：地震時趴下、掩護、穩住，遠離玻璃，不往外衝，搖晃停止後不用電梯。第八格：緊急電話為 110 警察、119 消防與救護、112 手機緊急救難；觀光署 24 小時旅遊諮詢熱線為 0800-011-765。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="36" font-weight="700" fill="#102A2B">臺灣旅遊禮儀與安全八項速查</text>
  <text x="60" y="98" font-size="20" fill="#506362">罰鍰、程序與電話於 2026 年 9 月 22 日依官方資料查證</text>

  <g transform="translate(60 128)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#0D6B68"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">1　捷運禁食</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112">黃色標線內禁止飲食</text>
      <text x="24" y="150">喝水、口香糖、檳榔都算</text>
      <text x="24" y="188">身體不適先找站務人員</text>
      <text x="24" y="240" font-size="25" font-weight="700" fill="#B8442D">NT$1,500–7,500</text>
      <text x="24" y="278" font-size="16" fill="#506362">其他捷運依現場標線與公告</text>
    </g>
  </g>

  <g transform="translate(436 128)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#2F6F9F"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">2　排隊與座位</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112">依月臺線排隊，先下後上</text>
      <text x="24" y="150">電扶梯握好扶手、站穩</text>
      <text x="24" y="188">大型行李改搭電梯</text>
      <text x="24" y="226">深藍色座位是優先席</text>
      <text x="24" y="264">有需要就能使用</text>
      <text x="24" y="300" font-size="16" fill="#506362">不要只按外觀判斷需求</text>
    </g>
  </g>

  <g transform="translate(812 128)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#6B4A3A"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">3　小費</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112">沒有固定給小費習慣</text>
      <text x="24" y="150">先看帳單是否列服務費</text>
      <text x="24" y="202" font-size="25" font-weight="700" fill="#6B4A3A">常見服務費 10%</text>
      <text x="24" y="244">已列出就不用重複支付</text>
      <text x="24" y="284" font-size="16" fill="#506362">私人服務依說明與個人意願</text>
    </g>
  </g>

  <g transform="translate(1188 128)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#2E7D5B"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">4　進門脫鞋</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112">住家、民宿或部分溫泉空間</text>
      <text x="24" y="150">看到鞋架、拖鞋或標示就脫</text>
      <text x="24" y="202">飯店大廳、商店、餐廳</text>
      <text x="24" y="240">一般不需脫鞋</text>
      <text x="24" y="284" font-size="16" fill="#506362">拿不準就先問工作人員</text>
    </g>
  </g>

  <g transform="translate(60 490)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#B8442D"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">5　寺廟參拜</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112">龍山寺：龍門進、虎門出</text>
      <text x="24" y="150">稟報姓名、生日、現居地址</text>
      <text x="24" y="188">說明所求之事，鞠躬三次</text>
      <text x="24" y="226">依寺方順序參拜</text>
      <text x="24" y="274" font-size="16" fill="#506362">各廟規矩不同，看現場標示</text>
    </g>
  </g>

  <g transform="translate(436 490)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#D97A2B"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">6　垃圾回收</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="108">街邊清潔箱不能丟家戶垃圾</text>
      <text x="24" y="146">飲料杯找有回收標示的店家</text>
      <text x="24" y="184">住宿處先問分類與清運時間</text>
      <text x="24" y="234" font-size="23" font-weight="700" fill="#B8442D">臺北罰 NT$3,600–6,000</text>
      <text x="24" y="276" font-size="16" fill="#506362">14 公升專用袋每個 NT$5</text>
    </g>
  </g>

  <g transform="translate(812 490)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#7E57C2" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#7E57C2"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">7　地震</text>
    <g font-size="18" fill="#102A2B">
      <text x="24" y="112" font-size="23" font-weight="700" fill="#7E57C2">趴下、掩護、穩住</text>
      <text x="24" y="158">保護頭頸，遠離玻璃</text>
      <text x="24" y="196">搖晃時不要往外衝</text>
      <text x="24" y="234">停止後走樓梯、不搭電梯</text>
      <text x="24" y="278" font-size="16" fill="#506362">手機警報不保證一定收到</text>
    </g>
  </g>

  <g transform="translate(1188 490)">
    <rect width="352" height="334" rx="20" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
    <path d="M20 0 H332 A20 20 0 0 1 352 20 V70 H0 V20 A20 20 0 0 1 20 0Z" fill="#102A2B"/>
    <text x="24" y="45" font-size="25" font-weight="700" fill="#FFFFFF">8　緊急電話</text>
    <g fill="#102A2B">
      <text x="24" y="120" font-size="31" font-weight="700" fill="#B8442D">110</text><text x="126" y="118" font-size="18">警察、報案</text>
      <text x="24" y="174" font-size="31" font-weight="700" fill="#B8442D">119</text><text x="126" y="172" font-size="18">消防、緊急救護</text>
      <text x="24" y="228" font-size="31" font-weight="700" fill="#B8442D">112</text><text x="126" y="226" font-size="18">手機緊急救難</text>
      <text x="24" y="278" font-size="24" font-weight="700" fill="#0D6B68">0800-011-765</text>
      <text x="24" y="306" font-size="16" fill="#506362">觀光署 24 小時旅遊諮詢</text>
    </g>
  </g>

  <text x="60" y="864" font-size="17" fill="#102A2B">颱風停班課由各縣市政府決定；交通、景點與商店是否營運，請分別向業者確認。</text>
  <text x="1540" y="884" font-size="15" fill="#506362" text-anchor="end">© Mokaair 2026</text>
</svg>
