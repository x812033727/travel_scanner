<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣禮儀與安全速查 / Taiwan etiquette and safety at a glance</title>
  <desc id="desc">八格速查：一、捷運黃線內禁止飲食，連喝水、口香糖、檳榔都算，罰鍰新臺幣 1,500 至 7,500 元；二、依月台排隊線排隊、先下後上、電扶梯握扶手站穩、深藍色座位是優先席；三、不用給小費，飯店餐廳常加 10% 服務費；四、門口有鞋架或拖鞋就脫鞋；五、寺廟由龍門進、虎門出，報上姓名生日地址，依序參拜；六、街上垃圾桶少，空杯交給超商或連鎖飲料店，臺北家戶垃圾丟清潔箱罰 3,600 元起；七、地震時趴下、掩護、穩住，震後不搭電梯；八、緊急電話 110 警察、119 消防與救護車、112 收訊不良時、觀光署 24 小時旅遊諮詢熱線 0800-011-765。Eight cells: no eating or drinking past the MRT yellow line, not even water, fine NT$1,500 to 7,500; queue on platform lines, let people off, hold the escalator rail, dark blue seats are priority seats; no tipping, hotels and restaurants often add 10%; take shoes off where you see a shoe rack or slippers; temples: in at the Dragon Gate, out at the Tiger Gate, tell the deity your name, birthday and address; few bins, return cups to shops, Taipei fines household rubbish in street bins from NT$3,600; earthquakes: drop, cover, hold on, no lifts afterwards; emergency numbers 110 police, 119 fire and ambulance, 112 with poor reception, 0800-011-765 tourist hotline.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">台灣禮儀與安全速查　Taiwan etiquette and safety at a glance</text>
  <text x="60" y="100" font-size="19" fill="#5C6B6B">罰款與電話號碼皆依官方資料查證（2026 年 9 月）· Fines and numbers checked on official pages, September 2026</text>

  <!-- 1 MRT -->
  <rect x="60" y="128" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="60" y="128" width="352" height="70" rx="18" fill="#0D6B68"/>
  <rect x="60" y="168" width="352" height="30" fill="#0D6B68"/>
  <text x="82" y="164" font-size="24" font-weight="700" fill="#FFFFFF">1　捷運</text>
  <text x="82" y="188" font-size="15" fill="#DDF0EE">MRT</text>
  <text x="82" y="234" font-size="17" fill="#102A2B">黃線內禁止飲食</text>
  <text x="82" y="256" font-size="15" fill="#5C6B6B">No food or drink past the yellow line</text>
  <text x="82" y="294" font-size="17" fill="#102A2B">喝水、口香糖、檳榔都算</text>
  <text x="82" y="316" font-size="15" fill="#5C6B6B">Water, gum and betel nut count too</text>
  <text x="82" y="354" font-size="17" fill="#102A2B">身體不適要喝水吃藥，先找站務員</text>
  <text x="82" y="376" font-size="15" fill="#5C6B6B">Unwell? Ask station staff first</text>
  <text x="82" y="418" font-size="22" font-weight="700" fill="#B8442D">罰鍰 NT$1,500–7,500</text>
  <text x="82" y="442" font-size="15" fill="#5C6B6B">Fine: NT$1,500 to 7,500</text>

  <!-- 2 Queues and seats -->
  <rect x="436" y="128" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="436" y="128" width="352" height="70" rx="18" fill="#2F6F9F"/>
  <rect x="436" y="168" width="352" height="30" fill="#2F6F9F"/>
  <text x="458" y="164" font-size="24" font-weight="700" fill="#FFFFFF">2　排隊與座位</text>
  <text x="458" y="188" font-size="15" fill="#E3EEF6">Queues and seats</text>
  <text x="458" y="234" font-size="17" fill="#102A2B">依月台排隊線排隊</text>
  <text x="458" y="256" font-size="15" fill="#5C6B6B">Queue on the platform lines</text>
  <text x="458" y="294" font-size="17" fill="#102A2B">先下後上</text>
  <text x="458" y="316" font-size="15" fill="#5C6B6B">Let people off first</text>
  <text x="458" y="354" font-size="17" fill="#102A2B">電扶梯握扶手、站穩</text>
  <text x="458" y="376" font-size="15" fill="#5C6B6B">Escalators: hold the rail, stand still</text>
  <text x="458" y="414" font-size="17" fill="#102A2B">深藍色座位＝優先席</text>
  <text x="458" y="436" font-size="15" fill="#5C6B6B">Dark blue seats are priority seats</text>

  <!-- 3 Tipping -->
  <rect x="812" y="128" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <rect x="812" y="128" width="352" height="70" rx="18" fill="#6B4A3A"/>
  <rect x="812" y="168" width="352" height="30" fill="#6B4A3A"/>
  <text x="834" y="164" font-size="24" font-weight="700" fill="#FFFFFF">3　小費</text>
  <text x="834" y="188" font-size="15" fill="#F1E6DF">Tipping</text>
  <text x="834" y="234" font-size="17" fill="#102A2B">不用給小費</text>
  <text x="834" y="256" font-size="15" fill="#5C6B6B">No tipping</text>
  <text x="834" y="294" font-size="17" fill="#102A2B">飯店、餐廳常加 10% 服務費</text>
  <text x="834" y="316" font-size="15" fill="#5C6B6B">Hotels and restaurants often add 10%</text>
  <text x="834" y="354" font-size="17" fill="#102A2B">夜市、小吃店不另外收</text>
  <text x="834" y="376" font-size="15" fill="#5C6B6B">Night markets, noodle shops: nothing</text>
  <text x="834" y="414" font-size="17" fill="#102A2B">說聲「謝謝」就好</text>
  <text x="834" y="436" font-size="15" fill="#5C6B6B">A thank-you is enough</text>

  <!-- 4 Shoes -->
  <rect x="1188" y="128" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <rect x="1188" y="128" width="352" height="70" rx="18" fill="#2E7D5B"/>
  <rect x="1188" y="168" width="352" height="30" fill="#2E7D5B"/>
  <text x="1210" y="164" font-size="24" font-weight="700" fill="#FFFFFF">4　脫鞋</text>
  <text x="1210" y="188" font-size="15" fill="#E2F0E9">Shoes</text>
  <text x="1210" y="234" font-size="17" fill="#102A2B">門口有鞋架或拖鞋就脫鞋</text>
  <text x="1210" y="256" font-size="15" fill="#5C6B6B">Shoe rack or slippers? Shoes off</text>
  <text x="1210" y="294" font-size="17" fill="#102A2B">住家、民宿、溫泉房常見</text>
  <text x="1210" y="316" font-size="15" fill="#5C6B6B">Homes, guesthouses, hot-spring rooms</text>
  <text x="1210" y="354" font-size="17" fill="#102A2B">飯店、商店、餐廳不用脫</text>
  <text x="1210" y="376" font-size="15" fill="#5C6B6B">Not in hotels, shops or restaurants</text>
  <text x="1210" y="414" font-size="17" fill="#102A2B">寺廟看現場標示</text>
  <text x="1210" y="436" font-size="15" fill="#5C6B6B">Temples: follow the signs</text>

  <!-- 5 Temples -->
  <rect x="60" y="492" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <rect x="60" y="492" width="352" height="70" rx="18" fill="#B8442D"/>
  <rect x="60" y="532" width="352" height="30" fill="#B8442D"/>
  <text x="82" y="528" font-size="24" font-weight="700" fill="#FFFFFF">5　寺廟</text>
  <text x="82" y="552" font-size="15" fill="#F8E3DE">Temples</text>
  <text x="82" y="598" font-size="17" fill="#102A2B">右側龍門進、虎門出</text>
  <text x="82" y="620" font-size="15" fill="#5C6B6B">Dragon Gate in, Tiger Gate out</text>
  <text x="82" y="658" font-size="17" fill="#102A2B">合掌報上姓名、生日、地址</text>
  <text x="82" y="680" font-size="15" fill="#5C6B6B">Name, birthday, address, then bow</text>
  <text x="82" y="718" font-size="17" fill="#102A2B">依序參拜，不跳過神明</text>
  <text x="82" y="740" font-size="15" fill="#5C6B6B">Pay respects in order</text>
  <text x="82" y="778" font-size="17" fill="#102A2B">輕聲，讓拜拜的人優先</text>
  <text x="82" y="800" font-size="15" fill="#5C6B6B">Speak quietly; worshippers first</text>

  <!-- 6 Rubbish -->
  <rect x="436" y="492" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="436" y="492" width="352" height="70" rx="18" fill="#D97A2B"/>
  <rect x="436" y="532" width="352" height="30" fill="#D97A2B"/>
  <text x="458" y="528" font-size="24" font-weight="700" fill="#FFFFFF">6　垃圾</text>
  <text x="458" y="552" font-size="15" fill="#FBEBDD">Rubbish</text>
  <text x="458" y="598" font-size="17" fill="#102A2B">街上垃圾桶少，帶著走</text>
  <text x="458" y="620" font-size="15" fill="#5C6B6B">Few street bins: carry it with you</text>
  <text x="458" y="658" font-size="17" fill="#102A2B">空杯交給超商、連鎖飲料店</text>
  <text x="458" y="680" font-size="15" fill="#5C6B6B">Cups back to shops and drink chains</text>
  <text x="458" y="718" font-size="17" fill="#102A2B">家戶垃圾丟街邊清潔箱</text>
  <text x="458" y="740" font-size="15" fill="#5C6B6B">Household rubbish in a street bin</text>
  <text x="458" y="782" font-size="22" font-weight="700" fill="#B8442D">臺北罰 NT$3,600 起</text>
  <text x="458" y="806" font-size="15" fill="#5C6B6B">Taipei fine: from NT$3,600</text>

  <!-- 7 Earthquakes -->
  <rect x="812" y="492" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#7E57C2" stroke-width="4"/>
  <rect x="812" y="492" width="352" height="70" rx="18" fill="#7E57C2"/>
  <rect x="812" y="532" width="352" height="30" fill="#7E57C2"/>
  <text x="834" y="528" font-size="24" font-weight="700" fill="#FFFFFF">7　地震</text>
  <text x="834" y="552" font-size="15" fill="#EEE8F8">Earthquakes</text>
  <text x="834" y="598" font-size="17" fill="#102A2B">趴下、掩護、穩住</text>
  <text x="834" y="620" font-size="15" fill="#5C6B6B">Drop, cover, hold on</text>
  <text x="834" y="658" font-size="17" fill="#102A2B">遠離窗戶，不要往外衝</text>
  <text x="834" y="680" font-size="15" fill="#5C6B6B">Away from windows; don't run out</text>
  <text x="834" y="718" font-size="17" fill="#102A2B">手機可能響起國家級警報</text>
  <text x="834" y="740" font-size="15" fill="#5C6B6B">A loud phone alert may sound</text>
  <text x="834" y="778" font-size="17" fill="#102A2B">震後走樓梯，不搭電梯</text>
  <text x="834" y="800" font-size="15" fill="#5C6B6B">Afterwards: stairs, not lifts</text>

  <!-- 8 Emergency numbers -->
  <rect x="1188" y="492" width="352" height="340" rx="18" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <rect x="1188" y="492" width="352" height="70" rx="18" fill="#102A2B"/>
  <rect x="1188" y="532" width="352" height="30" fill="#102A2B"/>
  <text x="1210" y="528" font-size="24" font-weight="700" fill="#FFFFFF">8　緊急電話</text>
  <text x="1210" y="552" font-size="15" fill="#D8E2E2">Emergency numbers</text>
  <text x="1210" y="608" font-size="34" font-weight="700" fill="#B8442D">110</text>
  <text x="1300" y="598" font-size="17" fill="#102A2B">警察</text>
  <text x="1300" y="618" font-size="15" fill="#5C6B6B">Police</text>
  <text x="1210" y="662" font-size="34" font-weight="700" fill="#B8442D">119</text>
  <text x="1300" y="652" font-size="17" fill="#102A2B">消防、救護車</text>
  <text x="1300" y="672" font-size="15" fill="#5C6B6B">Fire and ambulance</text>
  <text x="1210" y="716" font-size="34" font-weight="700" fill="#B8442D">112</text>
  <text x="1300" y="706" font-size="17" fill="#102A2B">手機收訊不良時</text>
  <text x="1300" y="726" font-size="15" fill="#5C6B6B">Poor mobile reception</text>
  <text x="1210" y="768" font-size="28" font-weight="700" fill="#0D6B68">0800-011-765</text>
  <text x="1210" y="794" font-size="17" fill="#102A2B">觀光署旅遊諮詢熱線・24 小時</text>
  <text x="1210" y="816" font-size="15" fill="#5C6B6B">Tourist hotline, 24 h, four languages</text>

  <text x="60" y="872" font-size="17" fill="#102A2B">颱風：停班停課由各縣市政府宣布　Typhoons: closures are announced by each city and county</text>
  <text x="1560" y="886" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
</svg>
