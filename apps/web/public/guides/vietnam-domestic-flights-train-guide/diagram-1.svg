<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">越南南北：飛機與統一鐵路 / Vietnam domestic: flights and the Reunification Express</title>
<desc id="desc">越南主要城市由北到南排成一條線，統一鐵路把河內、順化、峴港與胡志明市（西貢）串起來。鐵路區段：河內到順化 688 公里，順化到峴港約 2 小時半到 2 小時 45 分，河內到峴港 791 公里，河內到西貢 1,726 公里。同樣這幾段的國內線班機：河內到順化飛 1 小時 15 分、一天 3 班；河內到峴港飛 1 小時 20 分、一天 20 班；河內到胡志明市飛 2 小時 10 分起、一天 26 到 32 班；胡志明市到大叻飛約 1 小時、一天 5 到 10 班，大叻是從胡志明市往西南拉出的一條支線，只有飛機和公路到得了。火車的代表班次是 SE1：河內 21:45 發、隔天 13:14 到峴港，第三天 06:30 到西貢。臥鋪巴士也走同樣路線，票價與班次以各車公司官網為準。時刻與票價 2026 年 9 月查證。</desc>
