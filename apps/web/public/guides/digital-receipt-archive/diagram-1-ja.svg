<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>撮ったレシートが見つからない？購入証明と保証情報を探せるフォルダーを作る: 判断の流れ</title><desc>順に確認します：商品に結び付ける、証明を保存する、開いて確認する、原本の場所を記録する。編集による整理図であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践しやすい進め方</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、すべてを一度に終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">商品に結び付ける</text><text x="103" y="497" fill="#f4f0e5" font-size="23">対象の物を特定</text><text x="103" y="573" fill="#f4dc9d" font-size="26">用途と型番を明確に</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">証明を保存する</text><text x="473" y="497" fill="#f4f0e5" font-size="23">購入の証拠を残す</text><text x="473" y="573" fill="#f4dc9d" font-size="26">書類の違いを区別</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">開いて確認する</text><text x="843" y="497" fill="#f4f0e5" font-size="23">スキャンを点検</text><text x="843" y="573" fill="#f4dc9d" font-size="26">文字とページに欠けなし</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">原本の場所を記録</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">元の書類を探せるように</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">サポート時に取り出せる</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集制作の説明図</text></g></svg>
