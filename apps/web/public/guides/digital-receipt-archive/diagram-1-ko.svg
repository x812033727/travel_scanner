<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>찍어 둔 영수증을 찾을 수 없나요? 구매 증빙과 보증 정보를 검색할 수 있는 폴더 만들기: 판단 순서</title><desc>상품 연결하기, 증빙 저장하기, 열어서 확인하기, 원본 위치 기록하기 순으로 확인합니다. 편집자가 정리한 도식이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실용적인 진행 순서</text><text x="100" y="175" fill="#576968" font-size="25">자신의 상황에 맞게 선택하세요. 한 번에 모두 마칠 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">상품 연결하기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">대상 물건 확인</text><text x="103" y="573" fill="#f4dc9d" font-size="26">용도와 모델명 명확히</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">증빙 저장하기</text><text x="473" y="497" fill="#f4f0e5" font-size="23">구매 증거 보관</text><text x="473" y="573" fill="#f4dc9d" font-size="26">서로 다른 자료 구분</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">열어서 확인하기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">스캔 결과 점검</text><text x="843" y="573" fill="#f4dc9d" font-size="26">글자와 페이지 빠짐없이</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">원본 위치 기록</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">종이 원본 찾기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">사후 서비스 때 꺼내기</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집 제작 설명 도식</text></g></svg>
