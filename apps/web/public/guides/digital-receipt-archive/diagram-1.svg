<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>收據拍完就找不到？建立購買憑證的搜尋與保固資料夾：判斷流程</title><desc>依序檢查：連結商品、儲存憑證、開啟檢查、記原件位置。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">連結商品</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Identify the item</text><text x="103" y="573" fill="#f4dc9d" font-size="26">用途型號清楚</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">儲存憑證</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Save the evidence</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不同檔案分清</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">開啟檢查</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Inspect the scan</text><text x="843" y="573" fill="#f4dc9d" font-size="26">文字頁面完整</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">記原件位置</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Locate the original</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">售後時能取得</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>