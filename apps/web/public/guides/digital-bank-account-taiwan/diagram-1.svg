<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">數位存款帳戶的三種類型 / Three classes of digital deposit account</title>
<desc id="desc">比較矩陣。三欄由左到右是第一類、第二類、第三類，左側標示驗證強度由強到弱。第一列「怎麼證明本人」：第一類是臨櫃查驗雙證件正本，或最高信賴等級機制搭配載具認證與視訊；第二類是經臨櫃查驗身分的自行舊戶，線上以中信賴等級以上或一次性密碼驗證；第三類是最低信賴等級以上的安全設計，不得用知識詢問或固定密碼。第二列「使用範圍」：第一類為非電子轉帳交易指示類，加高風險與低風險的電子轉帳交易指示；第二類與第三類都是非電子轉帳交易指示類加低風險交易。第三列「轉出對象」：第一類與第二類，範本未另設對象限制，第二類只到低風險那一段；第三類原則不含非同一統一編號的約定與非約定轉入帳戶，另行驗證後才可辦理，並設每筆、每日與每月上限。圖下方註明三類的差別寫在銀行公會的作業範本，限額金額與可辦項目以各銀行公告與約定條款為準。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">數位存款帳戶的三種類型：驗證強度決定使用範圍</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Three classes of digital deposit account: the verification level sets the scope</text>
<text x="248" y="150" font-size="18" text-anchor="end" fill="#5C6B6B">驗證強度</text>
<text x="248" y="178" font-size="18" text-anchor="end" fill="#5C6B6B">由強到弱 →</text>
<rect x="280" y="120" width="406" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="483" y="172" font-size="28" font-weight="700" text-anchor="middle" fill="#102A2B">第一類</text>
<rect x="706" y="120" width="406" height="76" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="909" y="172" font-size="28" font-weight="700" text-anchor="middle" fill="#102A2B">第二類</text>
<rect x="1132" y="120" width="406" height="76" rx="14" fill="#FDF0E3" stroke="#D97A2B" stroke-width="4"/>
<text x="1335" y="172" font-size="28" font-weight="700" text-anchor="middle" fill="#102A2B">第三類</text>
<text x="248" y="302" font-size="20" font-weight="700" text-anchor="end" fill="#102A2B">怎麼證明本人</text>
<rect x="280" y="210" width="406" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="483" y="273" font-size="17" text-anchor="middle" fill="#102A2B">臨櫃查驗雙證件正本，</text>
<text x="483" y="301" font-size="17" text-anchor="middle" fill="#102A2B">或最高信賴等級機制</text>
<text x="483" y="329" font-size="17" text-anchor="middle" fill="#102A2B">搭配載具認證與視訊</text>
<rect x="706" y="210" width="406" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="909" y="259" font-size="17" text-anchor="middle" fill="#102A2B">經臨櫃查驗身分的</text>
<text x="909" y="287" font-size="17" text-anchor="middle" fill="#102A2B">自行舊戶，線上以</text>
<text x="909" y="315" font-size="17" text-anchor="middle" fill="#102A2B">中信賴等級以上或</text>
<text x="909" y="343" font-size="17" text-anchor="middle" fill="#102A2B">一次性密碼驗證</text>
<rect x="1132" y="210" width="406" height="170" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1335" y="273" font-size="17" text-anchor="middle" fill="#102A2B">最低信賴等級以上的</text>
<text x="1335" y="301" font-size="17" text-anchor="middle" fill="#102A2B">安全設計，不得用</text>
<text x="1335" y="329" font-size="17" text-anchor="middle" fill="#102A2B">知識詢問或固定密碼</text>
<text x="248" y="471" font-size="20" font-weight="700" text-anchor="end" fill="#102A2B">使用範圍</text>
<rect x="280" y="394" width="406" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="483" y="442" font-size="17" text-anchor="middle" fill="#102A2B">非電子轉帳交易指示類，</text>
<text x="483" y="470" font-size="17" text-anchor="middle" fill="#102A2B">加高風險與低風險的</text>
<text x="483" y="498" font-size="17" text-anchor="middle" fill="#102A2B">電子轉帳交易指示</text>
<rect x="706" y="394" width="406" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="909" y="456" font-size="17" text-anchor="middle" fill="#102A2B">非電子轉帳交易指示類，</text>
<text x="909" y="484" font-size="17" text-anchor="middle" fill="#102A2B">加低風險交易</text>
<rect x="1132" y="394" width="406" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1335" y="456" font-size="17" text-anchor="middle" fill="#102A2B">非電子轉帳交易指示類，</text>
<text x="1335" y="484" font-size="17" text-anchor="middle" fill="#102A2B">加低風險交易</text>
<text x="248" y="653" font-size="20" font-weight="700" text-anchor="end" fill="#102A2B">轉出對象</text>
<rect x="280" y="548" width="406" height="196" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="483" y="638" font-size="17" text-anchor="middle" fill="#102A2B">範本未另設對象限制，</text>
<text x="483" y="666" font-size="17" text-anchor="middle" fill="#102A2B">依各行約定辦理</text>
<rect x="706" y="548" width="406" height="196" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="909" y="638" font-size="17" text-anchor="middle" fill="#102A2B">範本未另設對象限制，</text>
<text x="909" y="666" font-size="17" text-anchor="middle" fill="#102A2B">但只到低風險那一段</text>
<rect x="1132" y="548" width="406" height="196" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1335" y="596" font-size="17" text-anchor="middle" fill="#102A2B">原則不含非同一統一</text>
<text x="1335" y="624" font-size="17" text-anchor="middle" fill="#102A2B">編號的約定與非約定</text>
<text x="1335" y="652" font-size="17" text-anchor="middle" fill="#102A2B">轉入帳戶；另行驗證</text>
<text x="1335" y="680" font-size="17" text-anchor="middle" fill="#102A2B">後才可辦理，並設每</text>
<text x="1335" y="708" font-size="17" text-anchor="middle" fill="#102A2B">筆、每日與每月上限</text>
<text x="60" y="792" font-size="18" fill="#5C6B6B">三類的差別寫在銀行公會的作業範本；限額金額與可辦項目以各銀行公告與約定條款為準。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
