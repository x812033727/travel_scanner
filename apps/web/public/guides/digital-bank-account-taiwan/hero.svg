<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同一家銀行的三種開戶驗證 / One bank, three ways to verify</title>
<desc id="desc">插圖。一個圓角大框代表同一家銀行，框內排著三個同樣大小的方塊，每個方塊中央畫一個鎖，由左到右鎖環從完全扣上、半開到整個掀起，代表開戶時的身分驗證由強到弱。三個方塊底下各有一支箭頭往下，匯入同一個存摺形狀，表示三條路開出來的都是同一家銀行的存款帳戶。圖下方一行字：一家銀行，三種驗證。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/></marker></defs>
