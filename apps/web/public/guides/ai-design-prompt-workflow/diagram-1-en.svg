<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">From Prompts to UI Validation</title><desc id="desc">Four cards connect requirements input, generated drafts, design assumptions and interaction evidence, reminding readers to retain unresolved questions and verification limits.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">From Prompts to UI Validation</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Original laundry tracker example: checkable outputs at every stage</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Requirements</text>
<text x="108.0" y="371" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Task and completion criteria</text>
<text x="108.0" y="423" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Separate facts and unknowns</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Draft</text>
<text x="477.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Cover all screen states</text>
<text x="477.0" y="423" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">Check each item against needs</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Assumptions</text>
<text x="846.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Record basis and risks</text>
<text x="846.0" y="423" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">Simulated views need checking</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Validation</text>
<text x="1215.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Observe use to find issues</text>
<text x="1215.0" y="423" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Flag unfinished work at handoff</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Prompts guide; working outputs and real observations ground design decisions.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
