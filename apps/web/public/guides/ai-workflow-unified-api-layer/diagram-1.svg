<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">OpenAI 相容端點怎麼接</title><desc id="desc">由左到右：程式先選好要用哪一支用戶端或函式庫，接著只換 base_url、金鑰與 model 字串；第三、四格是兩種常見的中介做法，OpenRouter 是別人已經架好的託管閘道，LiteLLM 可以在自己程序裡呼叫、也能自架成閘道；最後都送到供應商自己的伺服器。查證於 2026 年 9 月。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">OpenAI 相容端點怎麼接</text><rect x="80.0" y="300" width="232.0" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="130.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="196.0" y="450" font-size="34" font-weight="600" fill="#102A2B" text-anchor="middle">你的程式</text><text x="196.0" y="540" font-size="22.5" font-weight="600" fill="#5C6B6B" text-anchor="middle">openai／litellm</text><path d="M320.0 465.0 L360.0 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M338.0 435.0 L374.0 465.0 L338.0 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="382.0" y="300" width="232.0" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="432.0" cy="354" r="20" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="498.0" y="450" font-size="34" font-weight="600" fill="#102A2B" text-anchor="middle">換三個值</text><text x="498.0" y="540" font-size="16.6" font-weight="600" fill="#5C6B6B" text-anchor="middle">base_url、金鑰、model</text><path d="M622.0 465.0 L662.0 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M640.0 435.0 L676.0 465.0 L640.0 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="684.0" y="300" width="232.0" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="734.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="800.0" y="450" font-size="34" font-weight="600" fill="#102A2B" text-anchor="middle">託管閘道</text><text x="800.0" y="540" font-size="21.8" font-weight="600" fill="#5C6B6B" text-anchor="middle">OpenRouter架好的</text><path d="M924.0 465.0 L964.0 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M942.0 435.0 L978.0 465.0 L942.0 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="986.0" y="300" width="232.0" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="1036.0" cy="354" r="20" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1102.0" y="450" font-size="34" font-weight="600" fill="#102A2B" text-anchor="middle">自架閘道</text><text x="1102.0" y="540" font-size="24" font-weight="600" fill="#5C6B6B" text-anchor="middle">LiteLLM自己接</text><path d="M1226.0 465.0 L1266.0 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M1244.0 435.0 L1280.0 465.0 L1244.0 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1288.0" y="300" width="232.0" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="1338.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1404.0" y="450" font-size="34" font-weight="600" fill="#102A2B" text-anchor="middle">到供應商</text><text x="1404.0" y="540" font-size="24" font-weight="600" fill="#5C6B6B" text-anchor="middle">各家自己的伺服器</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text></svg>