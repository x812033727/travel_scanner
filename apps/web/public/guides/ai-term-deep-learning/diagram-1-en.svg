<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Deep Learning Illustrated / Deep Learning</title><desc id="desc">A photo passes through multilayer representations to a classification result. A reminder below suggests testing photos with different backgrounds to check whether the model relies only on tabletop color.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">Two paths: multilayer representations and background shortcuts</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Deep Learning</text><rect x="80" y="250" width="300" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="230" y="342" text-anchor="middle" font-size="36" fill="#102A2B">Photo input</text><path d="M 380 330 L 470 330" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="470" cy="330" r="10" fill="#0D6B68"></circle><rect x="470" y="250" width="320" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="630" y="342" text-anchor="middle" font-size="36" fill="#102A2B">Feature layers</text><path d="M 790 330 L 890 330" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="890" cy="330" r="10" fill="#0D6B68"></circle><rect x="890" y="250" width="300" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1040" y="342" text-anchor="middle" font-size="36" fill="#102A2B">Category scores</text><path d="M 1190 330 L 1280 330" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1280" cy="330" r="10" fill="#0D6B68"></circle><rect x="1280" y="250" width="240" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1400" y="342" text-anchor="middle" font-size="36" fill="#102A2B">Class output</text><rect x="200" y="590" width="1200" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="800" y="672" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">Retest with a new background: did it learn objects or background color?</text><path d="M 230 410 L 230 590" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="230" cy="590" r="10" fill="#0D6B68"></circle><path d="M 1400 410 L 1400 590" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1400" cy="590" r="10" fill="#0D6B68"></circle><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphics 2026</text></svg>
