<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">딥러닝 도해 / Deep Learning</title><desc id="desc">사진이 여러 층의 표현을 거쳐 분류 결과로 이어진다. 아래에서는 배경을 바꾼 사진으로 모델이 탁자 색깔에만 의존하는지 확인하도록 안내한다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">다층 표현과 배경 지름길, 두 경로</text><text x="60" y="84" fill="#5C6B6B" font-size="18">딥러닝</text><rect x="80" y="250" width="300" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="230" y="342" text-anchor="middle" font-size="36" fill="#102A2B">사진 입력</text><path d="M 380 330 L 470 330" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="470" cy="330" r="10" fill="#0D6B68" /><rect x="470" y="250" width="320" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="630" y="342" text-anchor="middle" font-size="36" fill="#102A2B">다층 표현</text><path d="M 790 330 L 890 330" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="890" cy="330" r="10" fill="#0D6B68" /><rect x="890" y="250" width="300" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1040" y="342" text-anchor="middle" font-size="36" fill="#102A2B">범주별 점수</text><path d="M 1190 330 L 1280 330" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1280" cy="330" r="10" fill="#0D6B68" /><rect x="1280" y="250" width="240" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1400" y="342" text-anchor="middle" font-size="36" fill="#102A2B">분류 결과</text><rect x="200" y="590" width="1200" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="800" y="672" text-anchor="middle" font-size="36" fill="#102A2B">배경을 바꿔 재시험: 물건을 배웠을까, 배경색을 배웠을까?</text><path d="M 230 410 L 230 590" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="230" cy="590" r="10" fill="#0D6B68" /><path d="M 1400 410 L 1400 590" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1400" cy="590" r="10" fill="#0D6B68" /><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
