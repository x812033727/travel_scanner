<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">跟自己的文件聊天 / Chatting with your own documents</title>
  <desc id="desc">插圖：畫面左邊是三張疊在一起的白色文件，最上面那張畫著幾條橫線代表文字。文件右邊是六個彩色的小方塊，排成兩排，代表文件被切成一段一段的片段。中間有一個橘色的放大鏡罩住其中兩個方塊，代表從片段裡挑出最相關的幾段。放大鏡右邊有一個箭頭指向一個深綠色邊框的大對話框，對話框裡有三條長短不一的橫線與一個打勾的記號，代表模型根據撿回來的片段作答並附上依據。畫面下方是一行短標題「跟自己的文件聊天」。整張圖用米色底搭配深綠、藍與橘色的幾何形狀，沒有任何品牌標誌、介面或人臉。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- 文件堆 -->
  <g transform="rotate(-8 300 420)">
    <rect x="190" y="290" width="215" height="285" rx="18" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="6"/>
  </g>
  <g transform="rotate(-3 300 420)">
    <rect x="215" y="285" width="215" height="285" rx="18" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="6"/>
  </g>
  <rect x="240" y="280" width="215" height="285" rx="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="276" y="330" width="144" height="14" rx="7" fill="#2F6F9F"/>
  <rect x="276" y="372" width="120" height="12" rx="6" fill="#5C6B6B"/>
  <rect x="276" y="410" width="144" height="12" rx="6" fill="#5C6B6B"/>
  <rect x="276" y="448" width="96" height="12" rx="6" fill="#5C6B6B"/>
  <rect x="276" y="486" width="132" height="12" rx="6" fill="#5C6B6B"/>

  <!-- 片段 -->
  <rect x="530" y="300" width="80" height="80" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>
  <rect x="640" y="300" width="80" height="80" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>
  <rect x="750" y="300" width="80" height="80" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>
  <rect x="530" y="420" width="80" height="80" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>
  <rect x="640" y="420" width="80" height="80" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>
  <rect x="750" y="420" width="80" height="80" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>

  <!-- 放大鏡 -->
  <circle cx="735" cy="455" r="130" fill="none" stroke="#D97A2B" stroke-width="14"/>
  <line x1="828" y1="548" x2="905" y2="625" stroke="#D97A2B" stroke-width="18" stroke-linecap="round"/>

  <!-- 連線 -->
  <line x1="462" y1="400" x2="498" y2="400" stroke="#0D6B68" stroke-width="8" stroke-linecap="round"/>
  <path d="M 490 382 L 524 400 L 490 418 z" fill="#0D6B68"/>
  <line x1="900" y1="400" x2="980" y2="400" stroke="#0D6B68" stroke-width="8" stroke-linecap="round"/>
  <path d="M 972 380 L 1010 400 L 972 420 z" fill="#0D6B68"/>

  <!-- 對話框 -->
  <rect x="1020" y="255" width="440" height="300" rx="34" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <path d="M 1080 555 L 1080 638 L 1166 555" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/>
  <rect x="1087" y="548" width="78" height="13" fill="#E3F0EF"/>
  <rect x="1070" y="320" width="300" height="16" rx="8" fill="#0D6B68"/>
  <rect x="1070" y="368" width="240" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="1070" y="412" width="288" height="14" rx="7" fill="#5C6B6B"/>
  <path d="M 1072 480 L 1104 512 L 1170 446" fill="none" stroke="#2E7D5B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="360" y1="700" x2="1240" y2="700" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="800" text-anchor="middle" font-size="54" font-weight="bold" fill="#102A2B">跟自己的文件聊天</text>
</svg>
