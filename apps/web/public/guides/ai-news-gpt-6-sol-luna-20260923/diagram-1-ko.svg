<title id="title">GPT-6 Sol과 Luna 어디서 쓰나</title><desc id="desc">GPT-6 Sol과 Luna가 ChatGPT, Codex, API에서 제공되는 범위(&#x27;Plus, Pro 등 플랜&#x27;은 Plus, Pro, Business, Enterprise, Edu를 뜻함). OpenAI의 미국 시간 9월 22일 발표문과 changelog를 바탕으로 정리. 확인일 2026년 9월 26일.</desc>
