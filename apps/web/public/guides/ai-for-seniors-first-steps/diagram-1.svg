<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">長輩第一次用 AI 的四步 / Four steps for a senior's first AI session</title>
  <desc id="desc">四個步驟由左到右用箭頭串起，字大、字少。第 1 步子女設定好：字放大、語言設中文，帳號先登入好，常用句子貼冰箱。第 2 步按麥克風講話：按輸入框的語音圖示，像跟家人講話一樣，講錯了再講一次。第 3 步聽回答：它會用中文唸出來，聽不清楚就說再說一次，站名、藥名要再核對。第 4 步有疑問問家人：錢、藥、法律先問人，接到借錢電話先掛掉，回撥家人或打 165。下方兩格提醒：左邊是錢、藥、法律的事先問人，AI 的回答可能錯，匯款、吃藥、簽文件之前先問子女、藥師或機關的官方電話；右邊是可疑電話先掛掉、回撥家人、打 165，聲音再像也不能當證據，身分證字號、帳號、密碼不唸給任何人。最下面補充：按鈕名稱依各 App 的官方說明，更新後可能移動，以官網為準。2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">長輩第一次用 AI 的四步（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Four steps for a senior's first AI session: set up, talk, listen, ask family</text>

  <!-- step 1 子女設定好 -->
  <rect x="48" y="130" width="336" height="390" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="92" cy="176" r="26" fill="#0D6B68"/>
  <text x="92" y="185" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="132" y="186" font-size="28" font-weight="700" fill="#0B4F4D">子女設定好</text>
  <text x="132" y="214" font-size="16" fill="#5C6B6B">Set up first</text>
  <!-- icon: phone with a big A -->
  <rect x="176" y="240" width="64" height="100" rx="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <line x1="196" y1="252" x2="220" y2="252" stroke="#0D6B68" stroke-width="4" stroke-linecap="round"/>
  <text x="208" y="318" font-size="40" font-weight="700" fill="#0D6B68" text-anchor="middle">A</text>
  <text x="216" y="384" font-size="20" fill="#102A2B" text-anchor="middle">字放大、語言設中文</text>
  <text x="216" y="424" font-size="20" fill="#102A2B" text-anchor="middle">帳號先登入好</text>
  <text x="216" y="464" font-size="20" fill="#102A2B" text-anchor="middle">常用句子貼冰箱</text>
  <path d="M 388 325 L 428 325" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 按麥克風講話 -->
  <rect x="434" y="130" width="336" height="390" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="478" cy="176" r="26" fill="#2F6F9F"/>
  <text x="478" y="185" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="518" y="186" font-size="28" font-weight="700" fill="#1F4E73">按麥克風講話</text>
  <text x="518" y="214" font-size="16" fill="#5C6B6B">Tap and talk</text>
  <!-- icon: microphone -->
  <rect x="580" y="238" width="44" height="72" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <path d="M 566 290 A 36 36 0 0 0 638 290" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round"/>
  <line x1="602" y1="326" x2="602" y2="344" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round"/>
  <line x1="582" y1="344" x2="622" y2="344" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round"/>
  <text x="602" y="384" font-size="20" fill="#102A2B" text-anchor="middle">按輸入框的語音圖示</text>
  <text x="602" y="424" font-size="20" fill="#102A2B" text-anchor="middle">像跟家人講話一樣</text>
  <text x="602" y="464" font-size="20" fill="#102A2B" text-anchor="middle">講錯了再講一次</text>
  <path d="M 774 325 L 814 325" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 聽回答 -->
  <rect x="820" y="130" width="336" height="390" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="864" cy="176" r="26" fill="#2E7D5B"/>
  <text x="864" y="185" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="904" y="186" font-size="28" font-weight="700" fill="#1F5A40">聽回答</text>
  <text x="904" y="214" font-size="16" fill="#5C6B6B">Listen</text>
  <!-- icon: speaker with sound waves -->
  <path d="M 940 270 L 966 270 L 996 244 L 996 336 L 966 310 L 940 310 Z" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 1016 268 A 30 30 0 0 1 1016 312" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1034 250 A 54 54 0 0 1 1034 330" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round"/>
  <text x="988" y="384" font-size="20" fill="#102A2B" text-anchor="middle">它會用中文唸出來</text>
  <text x="988" y="424" font-size="20" fill="#102A2B" text-anchor="middle">聽不清楚就說「再說一次」</text>
  <text x="988" y="464" font-size="20" fill="#102A2B" text-anchor="middle">站名、藥名再核對</text>
  <path d="M 1160 325 L 1200 325" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 有疑問問家人 -->
  <rect x="1206" y="130" width="336" height="390" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="1250" cy="176" r="26" fill="#D97A2B"/>
  <text x="1250" y="185" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1290" y="186" font-size="28" font-weight="700" fill="#8A4A16">有疑問問家人</text>
  <text x="1290" y="214" font-size="16" fill="#5C6B6B">Ask family</text>
  <!-- icon: speech bubble with a question mark -->
  <path d="M 1324 240 H 1424 A 14 14 0 0 1 1438 254 V 310 A 14 14 0 0 1 1424 324 H 1372 L 1346 346 V 324 H 1324 A 14 14 0 0 1 1310 310 V 254 A 14 14 0 0 1 1324 240 Z" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" stroke-linejoin="round"/>
  <text x="1374" y="300" font-size="40" font-weight="700" fill="#D97A2B" text-anchor="middle">?</text>
  <text x="1374" y="384" font-size="20" fill="#B8442D" text-anchor="middle">錢、藥、法律先問人</text>
  <text x="1374" y="424" font-size="20" fill="#102A2B" text-anchor="middle">接到借錢電話先掛掉</text>
  <text x="1374" y="464" font-size="20" fill="#102A2B" text-anchor="middle">回撥家人或打 165</text>

  <!-- bottom reminders -->
  <rect x="48" y="580" width="740" height="130" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="76" y="620" font-size="24" font-weight="700" fill="#B8442D">錢、藥、法律的事，先問人　Money, medicine, law</text>
  <text x="76" y="656" font-size="17" fill="#102A2B">AI 的回答可能錯。匯款、吃多少藥、簽什麼文件之前，</text>
  <text x="76" y="686" font-size="17" fill="#102A2B">先問子女、藥師，或那個機關的官方電話。</text>

  <rect x="812" y="580" width="730" height="130" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="840" y="620" font-size="24" font-weight="700" fill="#1F4E73">可疑電話：先掛掉 → 回撥家人 → 打 165</text>
  <text x="840" y="656" font-size="17" fill="#102A2B">AI 可以做出很像親人的聲音，聲音再像也不能當證據。</text>
  <text x="840" y="686" font-size="17" fill="#102A2B">身分證字號、帳號、密碼不唸給 AI，也不唸給任何打來的人。</text>

  <text x="48" y="770" font-size="16" fill="#5C6B6B">按鈕名稱依 OpenAI、Google、Anthropic 的官方說明；App 更新後按鈕可能移動，以官網為準。</text>
  <text x="48" y="800" font-size="16" fill="#5C6B6B">字體放大的路徑依 Apple 與 Google 支援頁，詐騙防範依內政部警政署與刑事警察局的官方頁面。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
