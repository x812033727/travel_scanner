<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">客服機器人的分流 / Routing a customer message</title>
  <desc id="desc">一張幾何插圖。左邊是一個白底深綠框的對話框，裡面有三條長短不一的橫線代表顧客打的字；一條線把對話框連到中央的圓形，圓裡有一面盾牌與一個勾，代表簽章驗證與規則檢查。圓形再分出三條曲線通到右邊三個方塊：橘框方塊裡有兩條橫線，代表關鍵字自動回應；藍框方塊中間有一條直線與兩側短線，像一本攤開的書，代表知識庫；紅框方塊裡有一個圓形與一個梯形，是抽象的人形剪影，代表轉真人。底部有一行字：客服機器人怎麼分流。整張圖不含任何品牌標誌或產品介面。</desc>
