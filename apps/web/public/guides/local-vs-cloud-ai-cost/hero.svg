<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">兩種付錢方式的意象 / Two ways of paying for AI</title>
  <desc id="desc">插圖。畫面被一條垂直虛線分成兩半。左半邊上方是一朵藍色的雲，雲下面排著四條長度一樣的藍色橫條，一條疊一條，代表每個月重複付一樣的錢。右半邊上方是一個綠色的圓角方塊，方塊中央有一個實心圓，代表一台自己的機器；方塊下面是一整塊等高的綠色長方形，被三條虛線橫向切成四份，代表一次付清之後攤到每個月。畫面下方一行字寫著「每個月付 vs 一次付清」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <line x1="800" y1="150" x2="800" y2="720" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="14 14"/>

  <!-- left: a cloud, and four identical monthly payments -->
  <circle cx="372" cy="296" r="58" fill="#2F6F9F"/>
  <circle cx="448" cy="250" r="80" fill="#2F6F9F"/>
  <circle cx="524" cy="294" r="56" fill="#2F6F9F"/>
  <rect x="308" y="300" width="284" height="62" rx="31" fill="#2F6F9F"/>

  <rect x="320" y="432" width="260" height="46" rx="23" fill="#2F6F9F"/>
  <rect x="320" y="497" width="260" height="46" rx="23" fill="#2F6F9F"/>
  <rect x="320" y="562" width="260" height="46" rx="23" fill="#2F6F9F"/>
  <rect x="320" y="627" width="260" height="46" rx="23" fill="#2F6F9F"/>

  <!-- right: one machine, one payment sliced across the months -->
  <rect x="1025" y="212" width="250" height="150" rx="26" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9"/>
  <circle cx="1150" cy="287" r="42" fill="#0D6B68"/>

  <rect x="1025" y="432" width="250" height="241" rx="22" fill="#0D6B68"/>
  <line x1="1025" y1="492" x2="1275" y2="492" stroke="#F7F1E8" stroke-width="5" stroke-dasharray="12 12"/>
  <line x1="1025" y1="552" x2="1275" y2="552" stroke="#F7F1E8" stroke-width="5" stroke-dasharray="12 12"/>
  <line x1="1025" y1="612" x2="1275" y2="612" stroke="#F7F1E8" stroke-width="5" stroke-dasharray="12 12"/>

  <text x="800" y="806" font-size="52" font-weight="bold" fill="#102A2B" text-anchor="middle">每個月付 vs 一次付清</text>
</svg>
