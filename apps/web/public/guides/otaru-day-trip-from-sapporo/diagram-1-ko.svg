<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title id="title">삿포로·오타루·요이치 JR 노선과 오타루 도보 코스</title>
  <desc id="desc">위: JR 하코다테 본선이 삿포로에서 오타루칫코와 미나미오타루를 거쳐 오타루까지 이어집니다. 쾌속 에어포트 최단 32분, 800엔. 고속버스 약 60분, 730엔. 오타루에서 요이치는 일반열차로 약 25분. 아래: 오타루역에서 삼각시장 도보 1분, 오타루 운하 중앙교까지 10분(크루즈 약 40분), 사카이마치 거리까지 5분. 오르골당 본관을 거쳐 미나미오타루역까지 5분. 오타루역 앞에서 텐구산 로프웨이까지 버스로 약 20분, 240엔.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="76" font-size="38" font-weight="700" fill="#102A2B">삿포로 → 오타루 → 요이치 JR 노선·오타루 당일치기 도보 코스</text>
  <text x="80" y="112" font-size="20" fill="#5C6B6B">2026년 9월 확인·소요 시간은 참고치. 공식 시간표 확인</text>

  
  <text x="80" y="170" font-size="24" font-weight="700" fill="#0D6B68">삿포로 ⇄ 오타루 ⇄ 요이치(JR 하코다테 본선)</text>
  <line x1="200" y1="290" x2="1400" y2="290" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" />
  <path d="M 200 290 C 320 400, 800 400, 940 300" fill="none" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" stroke-linecap="round" />
  <text x="560" y="212" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">쾌속 에어포트 최단 32분·800엔·낮 약 30분 간격</text>
  <text x="560" y="242" font-size="18" fill="#5C6B6B" text-anchor="middle">일반열차 약 45분</text>
  <text x="560" y="410" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">고속 오타루호 약 60분·730엔</text>
  <text x="1180" y="242" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">일반열차 약 25분·편수 적음</text>

  <g font-size="22" font-weight="700" fill="#102A2B">
    <circle cx="200" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="200" y="336" text-anchor="middle">삿포로</text>
    <text x="200" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Sapporo</text>
    <circle cx="640" cy="290" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7" />
    <text x="640" y="336" text-anchor="middle">오타루칫코</text>
    <text x="640" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru-Chikko</text>
    <circle cx="800" cy="290" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7" />
    <text x="800" y="278" text-anchor="middle">미나미오타루</text>
    <text x="800" y="242" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Minami-Otaru</text>
    <circle cx="960" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="960" y="336" text-anchor="middle">오타루</text>
    <text x="960" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru</text>
    <circle cx="1400" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="1400" y="336" text-anchor="middle">요이치</text>
    <text x="1400" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Yoichi·니카 증류소 도보 5분</text>
  </g>

  <line x1="80" y1="430" x2="1520" y2="430" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="6 8" />

  
  <text x="80" y="480" font-size="24" font-weight="700" fill="#6B4A3A">오타루: 역 → 삼각시장 → 운하 → 사카이마치 거리 → 미나미오타루역</text>
  <line x1="200" y1="620" x2="1400" y2="620" stroke="#6B4A3A" stroke-width="7" stroke-linecap="round" />
  <path d="M 210 630 C 330 700, 280 790, 330 790" fill="none" stroke="#B8442D" stroke-width="7" stroke-dasharray="18 12" stroke-linecap="round" />

  <g font-size="18" fill="#6B4A3A" text-anchor="middle">
    <text x="320" y="598">도보 1분</text>
    <text x="580" y="598">도보 10분</text>
    <text x="860" y="598">도보 5분</text>
    <text x="1120" y="598">상점 구경</text>
    <text x="1330" y="598">도보 5분</text>
  </g>

  <g font-size="22" font-weight="700" fill="#102A2B">
    <circle cx="200" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="200" y="664" text-anchor="middle">오타루역</text>
    <text x="200" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru Station</text>
    <circle cx="440" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="440" y="664" text-anchor="middle">삼각시장</text>
    <text x="440" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">해산물 덮밥</text>
    <circle cx="720" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="720" y="664" text-anchor="middle">오타루 운하·중앙교</text>
    <text x="720" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">운하 크루즈 약 40분</text>
    <circle cx="1000" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1000" y="664" text-anchor="middle">사카이마치 거리</text>
    <text x="1000" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">기타이치 글라스</text>
    <circle cx="1240" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1240" y="664" text-anchor="middle">오타루 오르골당</text>
    <text x="1240" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">본관</text>
    <circle cx="1400" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1440" y="664" text-anchor="middle">미나미오타루역</text>
    <text x="1440" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Minami-Otaru Sta.</text>
    <circle cx="330" cy="790" r="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="7" />
    <text x="360" y="784">텐구산 로프웨이</text>
    <text x="360" y="810" font-size="18" font-weight="400" fill="#B8442D">9번 버스 약 20분·240엔, 정상 야경</text>
  </g>

  <g font-size="18" fill="#102A2B">
    <line x1="80" y1="868" x2="140" y2="868" stroke="#0D6B68" stroke-width="10" stroke-linecap="round" />
    <text x="152" y="875">JR 하코다테 본선</text>
    <line x1="330" y1="868" x2="390" y2="868" stroke="#6B4A3A" stroke-width="7" stroke-linecap="round" />
    <text x="402" y="875">도보</text>
    <line x1="560" y1="868" x2="620" y2="868" stroke="#B8442D" stroke-width="7" stroke-dasharray="16 10" stroke-linecap="round" />
    <text x="632" y="875">버스</text>
    <text x="1290" y="875" fill="#5C6B6B">© Mokaair 2026</text>
  </g>
</svg>