<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',system-ui,sans-serif">
  <title id="title">Sapporo, Otaru and Yoichi by JR; walking route through Otaru</title>
  <desc id="desc">Upper half: the JR Hakodate Line runs from Sapporo through Otaru-Chikko and Minami-Otaru to Otaru; Rapid Airport takes as little as 32 minutes for ¥800, the express bus about 60 minutes for ¥730, and a local train from Otaru to Yoichi about 25 minutes. Lower half: walk one minute from Otaru Station to Sankaku Market, ten minutes to Chuo Bridge on Otaru Canal (about 40 minutes for a cruise), five minutes to Sakaimachi Street, onward to the Music Box Museum, and five minutes more to Minami-Otaru Station. A bus from Otaru Station Front also reaches Mt. Tengu Ropeway in about 20 minutes for ¥240.</desc>
