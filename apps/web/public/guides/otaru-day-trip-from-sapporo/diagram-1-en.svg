  <text x="560" y="242" font-size="18" fill="#5C6B6B" text-anchor="middle">Local train: about 45 min</text>
  <text x="560" y="410" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">Kosoku Otaru-go bus: about 60 min · ¥730</text>
  <text x="1180" y="242" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">Local train: about 25 min · limited service</text>

