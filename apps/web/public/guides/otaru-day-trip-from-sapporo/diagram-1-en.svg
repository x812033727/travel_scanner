  <text x="80" y="76" font-size="38" font-weight="700" fill="#102A2B">Sapporo → Otaru → Yoichi by JR · Otaru walking route</text>
  <text x="80" y="112" font-size="20" fill="#5C6B6B">Checked September 2026 · times are approximate; verify the official timetable</text>

  
  <text x="80" y="170" font-size="24" font-weight="700" fill="#0D6B68">Sapporo ⇄ Otaru ⇄ Yoichi (JR Hakodate Line)</text>
  <line x1="200" y1="290" x2="1400" y2="290" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" />
  <path d="M 200 290 C 320 400, 800 400, 940 300" fill="none" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" stroke-linecap="round" />
