<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','Microsoft YaHei','Arial',sans-serif">
  <title id="title">札幌到小樽、余市的 JR 线路与小樽步行路线</title>
  <desc id="desc">上半部：JR 函馆本线从札幌经小樽筑港、南小樽到小樽，快速エアポート最快 32 分、800 日元，高速巴士约 60 分、730 日元；小樽再到余市普通列车约 25 分。下半部：小樽駅走 1 分到三角市场，走 10 分到小樽运河中央桥（游船约 40 分），走 5 分到堺町通，再步行到音乐盒堂本馆，5 分到南小樽駅；小樽駅前另有巴士约 20 分、240 日元到天狗山缆车。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="76" font-size="38" font-weight="700" fill="#102A2B">札幌 → 小樽 → 余市：JR 线路与小樽一日步行路线</text>
  <text x="80" y="112" font-size="20" fill="#5C6B6B">2026 年 9 月核对；车程为约数，出发前看官网时刻表</text>

  
  <text x="80" y="170" font-size="24" font-weight="700" fill="#0D6B68">札幌 ⇄ 小樽 ⇄ 余市（JR 函馆本线）</text>
  <line x1="200" y1="290" x2="1400" y2="290" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" />
  <path d="M 200 290 C 320 400, 800 400, 940 300" fill="none" stroke="#B8442D" stroke-width="9" stroke-dasharray="20 14" stroke-linecap="round" />
  <text x="560" y="209" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">快速 Airport 最快 32 分钟 · 800 日元 · 白天约每 30 分钟一班</text>
  <text x="560" y="242" font-size="18" fill="#5C6B6B" text-anchor="middle">普通列车约 45 分钟</text>
  <text x="560" y="410" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">高速おたる号巴士约 60 分钟 · 730 日元</text>
  <text x="1180" y="242" font-size="22" font-weight="700" fill="#0D6B68" text-anchor="middle">普通列车约 25 分钟 · 班次少</text>

  <g font-size="22" font-weight="700" fill="#102A2B">
    <circle cx="200" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="200" y="336" text-anchor="middle">札幌</text>
    <text x="200" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Sapporo</text>
    <circle cx="640" cy="290" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7" />
    <text x="640" y="336" text-anchor="middle">小樽筑港</text>
    <text x="640" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru-Chikko</text>
    <circle cx="800" cy="290" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7" />
    <text x="800" y="271" text-anchor="middle">南小樽</text>
    <text x="800" y="240" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Minami-Otaru</text>
    <circle cx="960" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="960" y="336" text-anchor="middle">小樽</text>
    <text x="960" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru</text>
    <circle cx="1400" cy="290" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" />
    <text x="1400" y="336" text-anchor="middle">余市</text>
    <text x="1400" y="362" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Yoichi · Nikka 蒸馏所步行 5 分钟</text>
  </g>

  <line x1="80" y1="430" x2="1520" y2="430" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="6 8" />

  
  <text x="80" y="480" font-size="24" font-weight="700" fill="#6B4A3A">小樽市内：小樽站 → 三角市场 → 运河 → 堺町通 → 南小樽站（步行）</text>
  <line x1="200" y1="620" x2="1400" y2="620" stroke="#6B4A3A" stroke-width="7" stroke-linecap="round" />
  <path d="M 210 630 C 330 700, 280 790, 330 790" fill="none" stroke="#B8442D" stroke-width="7" stroke-dasharray="18 12" stroke-linecap="round" />

  <g font-size="18" fill="#6B4A3A" text-anchor="middle">
    <text x="320" y="598">步行 1 分钟</text>
    <text x="580" y="598">步行 10 分钟</text>
    <text x="860" y="598">步行 5 分钟</text>
    <text x="1120" y="598">沿街游逛</text>
    <text x="1330" y="598">步行 5 分钟</text>
  </g>

  <g font-size="22" font-weight="700" fill="#102A2B">
    <circle cx="200" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="200" y="664" text-anchor="middle">小樽站</text>
    <text x="200" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru Station</text>
    <circle cx="440" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="440" y="664" text-anchor="middle">三角市场</text>
    <text x="440" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Sankaku Market · 海鲜盖饭</text>
    <circle cx="720" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="720" y="664" text-anchor="middle">小樽运河 · 中央桥</text>
    <text x="720" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Otaru Canal · 游船约 40 分钟</text>
    <circle cx="1000" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1000" y="664" text-anchor="middle">堺町通</text>
    <text x="1000" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Sakaimachi-dori · 北一硝子</text>
    <circle cx="1240" cy="620" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1240" y="664" text-anchor="middle">音乐盒堂本馆</text>
    <text x="1240" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Music Box Museum</text>
    <circle cx="1400" cy="620" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="7" />
    <text x="1440" y="664" text-anchor="middle">南小樽站</text>
    <text x="1440" y="690" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="middle">Minami-Otaru Sta.</text>
    <circle cx="330" cy="790" r="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="7" />
    <text x="360" y="784">天狗山缆车 Tenguyama</text>
    <text x="360" y="814" font-size="18" font-weight="400" fill="#B8442D">9 路巴士约 20 分钟 · 240 日元；缆车看夜景</text>
  </g>

  <g font-size="18" fill="#102A2B">
    <line x1="80" y1="868" x2="140" y2="868" stroke="#0D6B68" stroke-width="10" stroke-linecap="round" />
    <text x="152" y="875">JR 函馆本线</text>
    <line x1="330" y1="868" x2="390" y2="868" stroke="#6B4A3A" stroke-width="7" stroke-linecap="round" />
    <text x="402" y="875">步行</text>
    <line x1="560" y1="868" x2="620" y2="868" stroke="#B8442D" stroke-width="7" stroke-dasharray="16 10" stroke-linecap="round" />
    <text x="632" y="875">巴士</text>
    <text x="1290" y="875" fill="#5C6B6B">© Mokaair 绘制 2026</text>
  </g>
</svg>