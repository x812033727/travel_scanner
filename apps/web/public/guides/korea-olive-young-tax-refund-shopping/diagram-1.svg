<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">韓國退稅兩條路：店內即時退稅 vs 仁川機場退稅 / Immediate refund vs airport refund in Korea</title>
  <desc id="desc">上面一條是即時退稅：結帳時出示護照正本，單筆 15,000 到 1,000,000 韓元的消費當場扣稅，同一趟旅程累計上限 5,000,000 韓元，商品要在 3 個月內帶出境、停留未滿 6 個月的外國旅客適用。下面一條是機場退稅：結帳時拿退稅單（單筆 15,000 韓元以上），報到託運前到出境大廳的 KIOSK 掃護照與退稅單、必要時到海關驗貨（商品未拆封），過安檢後到退稅櫃檯領錢：第 1 航廈 28 號登機門旁 07:00 到 22:00，第 2 航廈 253 號登機門旁、250 號門對面 07:00 到 21:30，24 小時 KIOSK 在第 1 航廈 28 號與 115 號登機門附近、第 2 航廈 253 號登機門附近；領現金或退信用卡，信用卡 1 到 2 個月入帳。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">韓國退稅兩條路：店內即時退稅 vs 仁川機場退稅（2026 年 9 月查證）</text>
  <text x="60" y="90" font-size="19" fill="#5C6B6B">즉시환급 vs 공항 환급 · Immediate refund vs airport refund · 依韓國觀光公社、首爾觀光財團、仁川機場官網</text>

  <!-- lane A: immediate refund -->
  <rect x="60" y="130" width="230" height="270" rx="18" fill="#0D6B68"/>
  <text x="175" y="215" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">即時退稅</text>
  <text x="175" y="250" font-size="17" fill="#E3F0EF" text-anchor="middle">즉시환급</text>
  <text x="175" y="278" font-size="16" fill="#E3F0EF" text-anchor="middle">Immediate refund</text>
  <text x="175" y="330" font-size="16" fill="#E3F0EF" text-anchor="middle">Olive Young、百貨、</text>
  <text x="175" y="356" font-size="16" fill="#E3F0EF" text-anchor="middle">樂天超市、emart、Daiso</text>

  <g stroke="#0D6B68" stroke-width="4" fill="#FFFFFF">
    <rect x="320" y="130" width="280" height="270" rx="16"/>
    <rect x="630" y="130" width="280" height="270" rx="16"/>
    <rect x="940" y="130" width="280" height="270" rx="16"/>
    <rect x="1250" y="130" width="290" height="270" rx="16"/>
  </g>
  <g font-size="17" fill="#102A2B">
    <text x="460" y="172" font-size="19" font-weight="700" text-anchor="middle">1　結帳出示護照正本</text>
    <text x="460" y="200" font-size="16" fill="#5C6B6B" text-anchor="middle">여권 원본 · Physical passport</text>
    <text x="344" y="246">● 手機照片、影本不收</text>
    <text x="344" y="282">● 店員在收銀機登錄護照</text>
    <text x="344" y="318">● 同一家店一次結清</text>
    <text x="344" y="354">● 湊到門檻才有稅可退</text>

    <text x="770" y="172" font-size="19" font-weight="700" text-anchor="middle">2　單筆 15,000～1,000,000</text>
    <text x="770" y="200" font-size="16" fill="#5C6B6B" text-anchor="middle">韓元 · 1건 15,000～1,000,000원</text>
    <text x="654" y="246">● 稅金當場從帳單扣掉</text>
    <text x="654" y="282">● 只付稅後金額，不用拿單子</text>
    <text x="654" y="318">● 退的是稅額扣掉手續費</text>
    <text x="654" y="354">● 超過 1,000,000 改開退稅單</text>

    <text x="1080" y="172" font-size="19" font-weight="700" text-anchor="middle">3　全程累計 5,000,000 韓元</text>
    <text x="1080" y="200" font-size="16" fill="#5C6B6B" text-anchor="middle">1회 여행 합계 5,000,000원</text>
    <text x="964" y="246">● 跨店累計，掃很大先算</text>
    <text x="964" y="282">● 用完後改走機場退稅</text>
    <text x="964" y="318">● 停留未滿 6 個月的外國旅客</text>
    <text x="964" y="354">● 商品 3 個月內帶出境</text>

    <text x="1395" y="172" font-size="19" font-weight="700" text-anchor="middle">4　帶出境</text>
    <text x="1395" y="200" font-size="16" fill="#5C6B6B" text-anchor="middle">출국 · Take the goods out</text>
    <text x="1274" y="246">● 海關抽查拿不出來會被追回</text>
    <text x="1274" y="282">● 不用再去退稅櫃檯</text>
    <text x="1274" y="318">● 液體保養品放託運</text>
    <text x="1274" y="354">● 回台灣免稅額 3 萬 5 千元</text>
  </g>
  <path d="M 292 265 L 316 265" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 602 265 L 626 265" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 912 265 L 936 265" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1222 265 L 1246 265" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- lane B: airport refund -->
  <rect x="60" y="450" width="230" height="300" rx="18" fill="#B8442D"/>
  <text x="175" y="545" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">機場退稅</text>
  <text x="175" y="580" font-size="17" fill="#FBE9E4" text-anchor="middle">공항 환급</text>
  <text x="175" y="608" font-size="16" fill="#FBE9E4" text-anchor="middle">Airport refund</text>
  <text x="175" y="660" font-size="16" fill="#FBE9E4" text-anchor="middle">單筆超過 1,000,000</text>
  <text x="175" y="686" font-size="16" fill="#FBE9E4" text-anchor="middle">或額度用滿的人</text>

  <g stroke="#B8442D" stroke-width="4" fill="#FFFFFF">
    <rect x="320" y="450" width="280" height="300" rx="16"/>
    <rect x="630" y="450" width="280" height="300" rx="16"/>
    <rect x="940" y="450" width="280" height="300" rx="16"/>
    <rect x="1250" y="450" width="290" height="300" rx="16"/>
  </g>
  <g font-size="17" fill="#102A2B">
    <text x="460" y="492" font-size="19" font-weight="700" text-anchor="middle">1　結帳拿退稅單</text>
    <text x="460" y="520" font-size="16" fill="#5C6B6B" text-anchor="middle">환급전표 · Refund slip</text>
    <text x="344" y="566">● 單筆 15,000 韓元以上</text>
    <text x="344" y="602">● 沒有單筆上限</text>
    <text x="344" y="638">● 收據與退稅單留到出境</text>
    <text x="344" y="674">● 商品不拆封、不使用</text>

    <text x="770" y="492" font-size="19" font-weight="700" text-anchor="middle">2　報到託運前：KIOSK</text>
    <text x="770" y="520" font-size="16" fill="#5C6B6B" text-anchor="middle">출국장 키오스크 · Before check-in</text>
    <text x="654" y="566">● 掃護照、掃退稅單</text>
    <text x="654" y="602">● 需要時到海關（세관）驗貨</text>
    <text x="654" y="638">● 退稅商品放手提行李</text>
    <text x="654" y="674">● 驗貨門檻以現場指示為準</text>
    <text x="654" y="710">● 第 2 航廈：D、E 報到櫃檯附近</text>

    <text x="1080" y="492" font-size="19" font-weight="700" text-anchor="middle">3　過安檢後：退稅櫃檯</text>
    <text x="1080" y="520" font-size="16" fill="#5C6B6B" text-anchor="middle">면세구역 환급창구 · Refund counter</text>
    <text x="964" y="566">● 第 1 航廈：28 號登機門旁</text>
    <text x="982" y="594">07:00～22:00</text>
    <text x="964" y="622">● 第 2 航廈：253 號門旁</text>
    <text x="982" y="650">250 號門對面，07:00～21:30</text>
    <text x="964" y="678">● 24 小時 KIOSK：</text>
    <text x="982" y="706">第 1 航廈 28、115 號門</text>
    <text x="982" y="734">第 2 航廈 253 號門附近</text>

    <text x="1395" y="492" font-size="19" font-weight="700" text-anchor="middle">4　領錢</text>
    <text x="1395" y="520" font-size="16" fill="#5C6B6B" text-anchor="middle">현금 또는 카드 · Cash or card</text>
    <text x="1274" y="566">● 現金當場拿（韓元）</text>
    <text x="1274" y="594">● 退信用卡：1 到 2 個月入帳</text>
    <text x="1274" y="622">● 退稅公司：Global Blue、</text>
    <text x="1292" y="650">Global Tax Free、</text>
    <text x="1292" y="678">Easy Tax Refund、Cube Refund、</text>
    <text x="1292" y="706">eTax Free（機場櫃檯合併處理）</text>
    <text x="1274" y="734">● 市區退稅點只處理自家單子</text>
  </g>
  <path d="M 292 600 L 316 600" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 602 600 L 626 600" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 912 600 L 936 600" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1222 600 L 1246 600" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="800" font-size="16" fill="#5C6B6B">兩條路的門檻都是單筆 15,000 韓元；退的是附加價值稅與個別消費稅扣掉退稅公司手續費後的金額，費率依各公司。</text>
  <text x="60" y="830" font-size="16" fill="#5C6B6B">2026 年 9 月依韓國觀光公社、首爾觀光財團、仁川機場官網查證；櫃檯時間與位置可能調整，出發前再看一次機場官網。</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
