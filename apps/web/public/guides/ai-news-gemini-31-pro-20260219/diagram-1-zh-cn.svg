<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">把推理变成检查点</title><desc id="desc">列出条件：保留未知信息、比较选项：说明取舍理由、回查来源：日期与单位、自己决定：核对关键假设。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">把推理变成检查点</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">列出条件</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">保留未知信息</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">比较选项</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">说明取舍理由</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">回查来源</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">日期与单位</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">自己决定</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">核对关键假设</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 制图 2026</text></svg>