<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">曼谷市區交通骨幹示意圖：BTS 兩線、MRT 藍線、機場快線、金線與昭披耶河船 / Bangkok rail and river backbone</title>
  <desc id="desc">示意圖，不照比例。昭披耶河由上而下流過畫面左側，河上的船停靠 Phra Arthit（考山路）、Tha Chang（大皇宮）、Rajinee（臥佛寺）、Ratchawong（唐人街）、ICONSIAM 與 Sathorn 碼頭。BTS Sukhumvit 線從 Mo Chit 往南經 Phaya Thai 到 Siam，再往東經 Asok 到 On Nut，往東是延伸段；BTS Silom 線從 National Stadium 經 Siam、Sala Daeng 到 Saphan Taksin，過河到 Krung Thon Buri 轉金線往 Charoen Nakhon（ICONSIAM）。MRT 藍線從 Tao Poon（轉紫線）經 Bang Sue（3 號出口往中央車站）、Chatuchak Park（與 BTS Mo Chit 轉乘）、Phetchaburi（與機場快線 Makkasan 轉乘）、Sukhumvit（與 BTS Asok 轉乘）、Si Lom（與 BTS Sala Daeng 轉乘），再經唐人街 Wat Mangkon 到舊城 Sanam Chai。機場快線 ARL 從 Phaya Thai 經 Makkasan 到蘇凡納布機場。灰色虛線是步行轉乘：Sanam Chai 到 Rajinee 碼頭、Wat Mangkon 到 Ratchawong 碼頭、Saphan Taksin 到 Sathorn 碼頭。右下角票價：BTS 核心段 17 到 47 泰銖、MRT 藍線 17 到 44 泰銖、藍旗觀光船單程 40 泰銖一日 150 泰銖、橘旗快船 18 泰銖只剩平日尖峰；BTS 與 MRT 分開收費，轉乘要出站。</desc>
