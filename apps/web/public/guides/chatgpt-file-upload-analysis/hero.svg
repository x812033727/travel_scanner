<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">把檔案交給對話 / A document and a spreadsheet handed to a chat bubble</title>
  <desc id="desc">米色底的插圖。左側是一份白色的文件，右上角摺角，裡面有幾行深色的文字線；文件的右下方疊著一張白色試算表，第一列是淡綠色的標題列，下面是綠色格線畫成的儲存格。一條橘色的虛線箭頭從兩份檔案往右上方彎，指進右側一個大的墨綠色對話泡泡；泡泡左下角有一個小尾巴朝向檔案，泡泡裡有三條由長到短的淺綠色文字線與一顆橘色的小圓點，代表正在回答。畫面下方置中一行深色的字：把檔案交給對話。沒有任何品牌標誌或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
  </defs>

  <!-- soft background shapes -->
  <circle cx="300" cy="180" r="90" fill="#E3F0EF"/>
  <circle cx="1380" cy="700" r="120" fill="#E6F0F7"/>

  <!-- document -->
  <path d="M 200 220 H 470 L 540 290 V 620 a 24 24 0 0 1 -24 24 H 224 a 24 24 0 0 1 -24 -24 V 244 a 24 24 0 0 1 24 -24 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 470 220 V 266 a 24 24 0 0 0 24 24 H 540 Z" fill="#E3F0EF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <rect x="244" y="330" width="240" height="18" rx="9" fill="#0D6B68"/>
  <rect x="244" y="374" width="200" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="244" y="410" width="228" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="244" y="446" width="170" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="244" y="482" width="212" height="14" rx="7" fill="#5C6B6B"/>

  <!-- spreadsheet -->
  <rect x="400" y="470" width="360" height="270" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <path d="M 420 470 H 740 a 20 20 0 0 1 20 20 V 530 H 400 V 490 a 20 20 0 0 1 20 -20 Z" fill="#E6F2EC"/>
  <path d="M 400 530 H 760 M 400 600 H 760 M 400 670 H 760 M 520 470 V 740 M 640 470 V 740" stroke="#2E7D5B" stroke-width="4" fill="none"/>
  <rect x="428" y="556" width="64" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="548" y="556" width="64" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="668" y="556" width="64" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="428" y="626" width="64" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="548" y="626" width="48" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="668" y="626" width="72" height="14" rx="7" fill="#D97A2B"/>
  <rect x="428" y="696" width="64" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="548" y="696" width="72" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="668" y="696" width="56" height="14" rx="7" fill="#5C6B6B"/>

  <!-- dashed arrow into the bubble -->
  <path d="M 700 420 C 770 330, 820 330, 900 400" stroke="#D97A2B" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="26 20" marker-end="url(#arrow)"/>

  <!-- chat bubble -->
  <path d="M 990 200 H 1400 a 48 48 0 0 1 48 48 V 540 a 48 48 0 0 1 -48 48 H 1060 L 950 660 L 972 588 a 48 48 0 0 1 -30 -48 V 248 a 48 48 0 0 1 48 -48 Z" fill="#0D6B68"/>
  <rect x="1030" y="290" width="330" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="1030" y="360" width="260" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="1030" y="430" width="190" height="26" rx="13" fill="#E3F0EF"/>
  <circle cx="1250" cy="443" r="14" fill="#D97A2B"/>

  <text x="800" y="800" text-anchor="middle" font-size="52" font-weight="700" fill="#102A2B">把檔案交給對話</text>
</svg>
