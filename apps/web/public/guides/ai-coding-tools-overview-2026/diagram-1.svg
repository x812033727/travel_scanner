  <text x="1102" y="492" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">Codex CLI</text>
  <text x="1102" y="528" font-size="17" fill="#5C6B6B" text-anchor="middle">終端機代理</text>
