  <text x="1404" y="492" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">Claude Code</text>
  <text x="1404" y="528" font-size="17" fill="#5C6B6B" text-anchor="middle">終端機代理</text>
  <text x="1404" y="560" font-size="17" fill="#5C6B6B" text-anchor="middle">Anthropic 付費方案</text>
  <text x="1404" y="598" font-size="19" font-weight="700" fill="#B8442D" text-anchor="middle">Pro 月繳 20 美元</text>

  <rect x="56" y="666" width="1488" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="712" font-size="20" fill="#102A2B" text-anchor="middle">五個都能在 Windows、macOS 與 Linux 上用；價格是官網美元標價，額度與方案以官網為準。</text>
  <text x="800" y="750" font-size="19" fill="#B8442D" text-anchor="middle">代理會直接改你電腦上的檔案：第一次請用練習專案，並讓它每一步都先問過你。</text>

