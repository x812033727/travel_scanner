<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">你是哪種人，就先裝哪個 / Pick your first AI coding tool</title>
  <desc id="desc">一張兩層的決策樹。第一個問題是你會不會寫程式。答「幾乎沒寫過程式」的人往左，第二個問題是想在哪裡工作：想在一個視窗裡做完就選 Cursor，獨立編輯器，用 Cursor 帳號，Hobby 方案免費；已經在用 VS Code 就選 GitHub Copilot，編輯器擴充，用個人 GitHub 帳號，Free 方案每月兩千次補全。答「已經會寫一點程式」的人往右，同樣問想在哪裡工作，三個終端機代理依手上的帳號分：有 Google 帳號選 Gemini CLI，免費額度每天一千次請求；有 ChatGPT 帳號選 Codex CLI，Free 方案就能試；已在付費方案選 Claude Code，Pro 月繳二十美元。最底下提醒：五個都能在 Windows、macOS 與 Linux 上用，價格是官網美元標價，額度與方案以官網為準；代理會直接改你電腦上的檔案，第一次請用練習專案，並讓它每一步都先問過你。</desc>
