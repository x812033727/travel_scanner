<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 寫程式工具跑在哪裡 / Where AI coding tools run</title>
  <desc id="desc">一張幾何插圖，用三個並排的圖形表示 AI 寫程式工具的三種執行位置。左邊是深色的終端機視窗，上面有一個提示符號與幾行文字；中間是一個淺色的編輯器視窗，左側有窄窄的檔案列，右側有幾行長短不一的程式碼，其中一行以橘色與虛線表示由 AI 補上；右邊是一朵圓弧組成的雲，雲裡有一個圓角方塊，代表在雲端執行的任務。三個圖形下方有一條帶箭頭的水平線把它們串起來，線上有三個圓點。畫面下半部只有一行中文字：先裝哪一個？</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
