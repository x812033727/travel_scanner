<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台南兩天一夜四區示意圖：高鐵台南站與沙崙線、台南車站與赤崁樓孔廟區、國華街與神農街、安平 / Tainan in two days: THSR Tainan and the Shalun Line, Tainan Station and the Chihkan Tower and Confucius Temple area, Guohua and Shennong streets, and Anping</title>
  <desc id="desc">示意圖，非精確比例，由東到西排列。東邊的台南車站以台鐵連接：沙崙線區間車從高鐵台南站旁的沙崙站到台南車站 約 20 到 25 分、NT$25，沙崙往台南首班 06:25、末班 23:39，高鐵台南站在歸仁，走 2 樓連通道到沙崙站；往南到高雄，區間車 NT$102、58 分到 1 小時 14 分，自強號與普悠瑪號 NT$158、32 到 38 分；H31 高鐵快捷公車到台南市政府約 50 分，僅限高鐵旅客於高鐵站上下車免費，並應保留當日、當站票證。第一天的赤崁樓／孔廟區離台南車站步行 15 到 25 分：赤崁樓 08:30 到 21:30、NT$70，往南步行 15 分到 1665 年建立的孔廟，林百貨 11:00 到 21:00 免費。往西是國華街小吃（牛肉湯一早吃，擔仔麵、碗粿、蝦捲，攤位多只收現金）與傍晚的神農街，兩者步行 10 分。最西邊的安平離台南車站約 5 公里：安平古堡、安平樹屋、億載金城（部分區域開放）08:30 到 17:30，各 NT$70、半票 NT$35（資格依身分，見正文），三處 NT$210，另有安平老街。2 路公車從台南車站到安平古堡，上下車都刷卡。台灣好行 98 府城台江線依序停台南車站、延平郡王祠、建興國中（步行到孔廟）、林百貨、赤崁樓、億載金城、安平古堡、安平樹屋、四草、七股鹽山，每段 NT$18，現行時刻表列台南車站 7 班（09:20 到 17:20），網站未標示每日行駛，七股鹽山回程末班 17:30，18:30 班次從大員皇冠假日酒店（安北路）起駛。Schematic, not to scale, east to west. Tainan Station connects by TRA: the Shalun Line local train from Shalun Station next to THSR Tainan takes about 20 to 25 minutes for NT$25, first Shalun departure 06:25 and last 23:39, reached from the THSR station through a 2F corridor; south to Kaohsiung the local train costs NT$102 and takes 58 minutes to 1 hour 14 minutes, Tze-Chiang and Puyuma trains NT$158 in 32 to 38 minutes; the H31 THSR shuttle reaches Tainan City Government in about 50 minutes and is free only for THSR passengers boarding or alighting at the THSR station, who should retain a same-day ticket for that station. Day one's Chihkan Tower and Confucius Temple area is a 15 to 25 minute walk from Tainan Station: Chihkan Tower 08:30 to 21:30 for NT$70, a 15 minute walk south to the Confucius Temple founded in 1665, and Hayashi Department Store 11:00 to 21:00, free. West of it are Guohua Street for street food (beef soup early, danzai noodles, rice cakes, shrimp rolls, mostly cash) and Shennong Street at dusk, 10 minutes apart on foot. Anping, about 5 km west, has Anping Old Fort, the Tree House and Eternal Golden Castle (partly open), 08:30 to 17:30, NT$70 each or NT$35 concession for eligible visitors as detailed in the body, NT$210 for all three, plus Anping Old Street. Bus 2 runs from Tainan Station to Anping Old Fort, tap on and off. Tourist Shuttle 98 stops at Tainan Station, the Koxinga Shrine, the Confucius Temple, Hayashi, Chihkan Tower, Eternal Golden Castle, Anping Old Fort, the Tree House, Sicao and Qigu Salt Mountain for NT$18 a section, with 7 listed departures from Tainan Station between 09:20 and 17:20; the site does not label them as daily service and a last return from Qigu at 17:30; the 18:30 short working starts near Anping.</desc>
