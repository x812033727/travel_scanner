  <circle cx="100" cy="154" r="22" fill="#102A2B"/>
  <text x="100" y="162" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="134" y="162" font-size="20" font-weight="700" fill="#102A2B">Free</text>
  <text x="134" y="188" font-size="15" fill="#5C6B6B">免費版</text>
  <text x="84" y="232" font-size="17" font-weight="700" fill="#102A2B">0 美元</text>
  <text x="84" y="262" font-size="16" fill="#102A2B">5 小時工作階段重置</text>
  <text x="84" y="292" font-size="16" fill="#102A2B">訊息數隨流量變動</text>
  <text x="84" y="322" font-size="16" fill="#102A2B">沒有每週上限</text>
  <text x="84" y="352" font-size="16" fill="#102A2B">模型以選單為準</text>
  <text x="84" y="382" font-size="16" fill="#102A2B">沒有 Fable 系列</text>
  <text x="84" y="412" font-size="16" fill="#102A2B">Projects 最多 5 個</text>
  <text x="84" y="470" font-size="16" fill="#5C6B6B">給：偶爾用的人</text>
  <path d="M 402 312 L 428 312" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 2 Pro -->
  <rect x="430" y="112" width="340" height="400" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="470" cy="154" r="22" fill="#0D6B68"/>
  <text x="470" y="162" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="504" y="162" font-size="20" font-weight="700" fill="#0B4F4D">Pro</text>
  <rect x="656" y="136" width="92" height="30" rx="15" fill="#0D6B68"/>
  <text x="702" y="157" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">甜蜜點</text>
  <text x="504" y="188" font-size="15" fill="#5C6B6B">多數人的選擇</text>
  <text x="454" y="232" font-size="17" font-weight="700" fill="#102A2B">20 美元／月</text>
  <text x="454" y="262" font-size="16" fill="#102A2B">年繳 200 美元（每月 17）</text>
  <text x="454" y="292" font-size="16" fill="#102A2B">至少免費版 5 倍／工作階段</text>
  <text x="454" y="322" font-size="16" fill="#102A2B">加每週上限</text>
  <text x="454" y="352" font-size="16" fill="#102A2B">Claude Code、Research</text>
  <text x="454" y="382" font-size="16" fill="#102A2B">Fable 用加購額度計費</text>
  <text x="454" y="412" font-size="16" fill="#102A2B">1M token 上下文視窗</text>
  <text x="454" y="470" font-size="16" fill="#5C6B6B">給：每天用的人</text>
  <path d="M 772 312 L 798 312" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 3 Max 5x -->
  <rect x="800" y="112" width="340" height="400" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="840" cy="154" r="22" fill="#2F6F9F"/>
  <text x="840" y="162" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="874" y="162" font-size="20" font-weight="700" fill="#1F4E73">Max 5x</text>
  <text x="874" y="188" font-size="15" fill="#5C6B6B">重度使用</text>
  <text x="824" y="232" font-size="17" font-weight="700" fill="#102A2B">100 美元／月，只有月繳</text>
  <text x="824" y="262" font-size="16" fill="#102A2B">Pro 的 5 倍／工作階段</text>
  <text x="824" y="292" font-size="16" fill="#102A2B">加每週上限</text>
  <text x="824" y="322" font-size="16" fill="#102A2B">Fable 在每週額度 50% 內</text>
  <text x="824" y="352" font-size="16" fill="#102A2B">更高輸出上限</text>
  <text x="824" y="382" font-size="16" fill="#102A2B">高峰優先、早期功能</text>
  <text x="824" y="470" font-size="16" fill="#5C6B6B">給：每週撞上限的人</text>
  <path d="M 1142 312 L 1168 312" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 4 Max 20x -->
  <rect x="1170" y="112" width="340" height="400" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="1210" cy="154" r="22" fill="#D97A2B"/>
  <text x="1210" y="162" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1244" y="162" font-size="20" font-weight="700" fill="#8A4A15">Max 20x</text>
  <text x="1244" y="188" font-size="15" fill="#5C6B6B">整天都在用</text>
  <text x="1194" y="232" font-size="17" font-weight="700" fill="#102A2B">200 美元／月，只有月繳</text>
  <text x="1194" y="262" font-size="16" fill="#102A2B">Pro 的 20 倍／工作階段</text>
  <text x="1194" y="292" font-size="16" fill="#102A2B">加每週上限</text>
  <text x="1194" y="322" font-size="16" fill="#102A2B">其餘同 Max 5x</text>
  <text x="1194" y="352" font-size="16" fill="#102A2B">撞上限可加購額度</text>
  <text x="1194" y="442" font-size="16" fill="#5C6B6B">給：整天跑 Claude Code、</text>
  <text x="1194" y="470" font-size="16" fill="#5C6B6B">Research 的人</text>

  <!-- rolling window panel -->
  <rect x="60" y="548" width="1480" height="282" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="90" y="590" font-size="19" font-weight="700" fill="#102A2B">滾動的 5 小時視窗怎麼算（免費與付費都有這一層）</text>
  <text x="800" y="628" font-size="16" fill="#5C6B6B" text-anchor="middle">每則訊息都扣一點：長對話、大附件、高階模型、Research 扣得多</text>
  <rect x="110" y="644" width="1380" height="16" rx="8" fill="#E3DDD2"/>
  <rect x="110" y="644" width="920" height="16" rx="8" fill="#0D6B68"/>
  <circle cx="110" cy="652" r="12" fill="#0D6B68" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1490" cy="652" r="12" fill="#B8442D" stroke="#FFFFFF" stroke-width="3"/>
  <text x="110" y="692" font-size="16" fill="#102A2B">0 小時：第一則訊息，視窗開始</text>
  <text x="1490" y="692" font-size="16" fill="#B8442D" text-anchor="end">5 小時後重置，額度回來</text>
  <text x="90" y="742" font-size="16" fill="#102A2B">付費方案再套一層每週上限：跨所有模型，在帳號指定的固定時間重置；Claude Code、Cowork 共用同一份</text>
  <text x="90" y="782" font-size="16" fill="#2E7D5B">用完：等重置 → 換輕一階的模型、開新對話 → 加購額度（API 費率）→ 最後才升一階</text>
  <text x="90" y="814" font-size="15" fill="#5C6B6B">價格為美國網頁版定價、不含稅；App 內購與各地幣別以官網為準</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
