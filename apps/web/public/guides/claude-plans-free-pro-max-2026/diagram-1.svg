<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 方案階梯：價格、額度、模型，加上 5 小時滾動視窗 / The Claude plan ladder and the five-hour window</title>
  <desc id="desc">四個方案由左到右用箭頭串起，價格與額度遞增。第一格 Free：0 美元，5 小時工作階段重置，訊息數隨流量變動，沒有每週上限，模型以選單為準、沒有 Fable 系列，Projects 最多 5 個，給偶爾用的人。第二格 Pro，標示甜蜜點：每月 20 美元，年繳 200 美元換算每月 17 美元，每個工作階段至少是免費版的 5 倍，再加每週上限，有 Claude Code 與 Research，Fable 用加購額度計費，上下文視窗 1M token，給每天用的人。第三格 Max 5x：每月 100 美元、只有月繳，每個工作階段是 Pro 的 5 倍，加每週上限，Fable 在每週額度的 50% 內不另收費，更高輸出上限，高峰優先與早期功能，給每週撞上限的人。第四格 Max 20x：每月 200 美元、只有月繳，Pro 的 20 倍，加每週上限，其餘同 Max 5x，撞上限可加購額度，給整天跑 Claude Code 與 Research 的人。下方是滾動的 5 小時視窗怎麼算：從第一則訊息開始起算，一條進度條從 0 小時走到 5 小時後重置，每則訊息都扣一點，長對話、大附件、高階模型與 Research 扣得多；付費方案再套一層每週上限，跨所有模型，在帳號指定的固定時間重置，Claude Code 與 Cowork 共用同一份；用完的順序是等重置、換輕一階的模型或開新對話、加購額度、最後才升一階。價格為美國網頁版定價、不含稅，2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Claude 方案階梯：價格、額度、模型（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">The Claude plan ladder: Free, Pro, Max 5x, Max 20x, and how the five-hour window works</text>

