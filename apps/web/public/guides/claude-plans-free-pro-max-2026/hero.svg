<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 方案怎麼選 / Choosing a Claude plan</title>
  <desc id="desc">插圖：米色底上有三級由左往右升高的階梯，第一級是白色、第二級是淡藍色、第三級是淡綠色。每一級上方各站著一個對話泡泡，左邊的最小、白底，中間的中等、藍色，右邊的最大、深綠色，泡泡裡都有三個點，代表免費、Pro、Max 三階方案的額度一階比一階多。左上角有一個小小的藍色圓點當作亮點。下方只有一行字：Claude 方案怎麼選。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft ground shadow -->
  <ellipse cx="800" cy="748" rx="600" ry="30" fill="#E3DDD2"/>

  <!-- step 1 -->
  <rect x="230" y="560" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
  <!-- step 2 -->
  <rect x="620" y="440" width="360" height="300" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>
  <!-- step 3 -->
  <rect x="1010" y="320" width="360" height="420" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>

  <!-- step edge accents -->
  <rect x="260" y="590" width="300" height="12" rx="6" fill="#E3DDD2"/>
  <rect x="650" y="470" width="300" height="12" rx="6" fill="#C9DCEA"/>
  <rect x="1040" y="350" width="300" height="12" rx="6" fill="#BFDAD6"/>

  <!-- bubble 1: small, white -->
  <path d="M 340 430 Q 340 410 360 410 L 480 410 Q 500 410 500 430 L 500 500 Q 500 520 480 520 L 400 520 L 372 548 L 380 520 L 360 520 Q 340 520 340 500 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="392" cy="465" r="9" fill="#5C6B6B"/>
  <circle cx="420" cy="465" r="9" fill="#5C6B6B"/>
  <circle cx="448" cy="465" r="9" fill="#5C6B6B"/>

  <!-- bubble 2: medium, blue -->
  <path d="M 690 250 Q 690 230 710 230 L 890 230 Q 910 230 910 250 L 910 370 Q 910 390 890 390 L 790 390 L 752 426 L 762 390 L 710 390 Q 690 390 690 370 Z" fill="#2F6F9F" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="760" cy="310" r="13" fill="#FFFFFF"/>
  <circle cx="800" cy="310" r="13" fill="#FFFFFF"/>
  <circle cx="840" cy="310" r="13" fill="#FFFFFF"/>

  <!-- bubble 3: large, teal -->
  <path d="M 1050 70 Q 1050 50 1070 50 L 1310 50 Q 1330 50 1330 70 L 1330 240 Q 1330 260 1310 260 L 1180 260 L 1130 306 L 1146 260 L 1070 260 Q 1050 260 1050 240 Z" fill="#0D6B68" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="1136" cy="155" r="18" fill="#FFFFFF"/>
  <circle cx="1190" cy="155" r="18" fill="#FFFFFF"/>
  <circle cx="1244" cy="155" r="18" fill="#FFFFFF"/>

  <!-- small accent: idea spark top-left -->
  <circle cx="200" cy="200" r="34" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="200" cy="200" r="10" fill="#2F6F9F"/>

  <!-- rising path hint -->
  <path d="M 130 700 L 210 700" stroke="#D97A2B" stroke-width="10" stroke-linecap="round"/>
  <path d="M 1390 300 L 1470 300" stroke="#D97A2B" stroke-width="10" stroke-linecap="round"/>

  <!-- single line of text -->
  <text x="800" y="840" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">Claude 方案怎麼選</text>
</svg>
