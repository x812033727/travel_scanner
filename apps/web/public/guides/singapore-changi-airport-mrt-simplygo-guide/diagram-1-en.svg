<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Arial','Noto Sans TC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">Changi Airport terminals, MRT and city transfers</title>
  <desc id="desc">Changi Airport MRT station CG2 directly connects to T2 and T3. T1 connects to T2/T3 through Jewel’s level-3 bridge or free Skytrain (5:00–2:00). T4 has no MRT link: take the free shuttle from T4 Arrival Bus Lounge to T2 Arrival Pick-up Door 1, about every 5 minutes from 6:00–24:00 with a roughly 10-minute journey; from 00:00–6:00, a loop runs about every 19 minutes. From CG2, the MRT passes Expo (CG1/DT35, transfer to the Downtown Line towards Bukit Panjang) and Tanah Merah (EW4, transfer to the East West Line towards Tuas Link via Bugis, City Hall and Raffles Place). First train from the airport: 5:31 Monday–Saturday, 5:59 Sundays and public holidays. Last connections: 23:18 towards Tuas Link, 00:06 towards Pasir Ris. Last trains back to the airport: 23:50 from Tanah Merah and 23:53 from Expo. Foreign-issued Visa and Mastercard payments add SGD 0.60 per day of use.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#102A2B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F6F9F"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="30" font-weight="700" fill="#102A2B">Changi Airport: terminals, MRT and city routes</text>
  <text x="55" y="84" font-size="18" fill="#5C6B6B">Changi Airport terminals, MRT CG2 and trains to the city · checked Sep 2026</text>

  <!-- ===== Left: terminals ===== -->
  <text x="55" y="140" font-size="20" font-weight="700" fill="#0D6B68">Terminals → MRT station</text>

  <!-- connectors (drawn first, under boxes) -->
  <path d="M160 244 V420 M160 330 H680 V420" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <path d="M265 202 H315" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M420 244 V410" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M265 465 H315 M525 465 H575" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M680 670 V514" fill="none" stroke="#D97A2B" stroke-width="6" stroke-dasharray="18 12" marker-end="url(#arrow)"/>

  <text x="445" y="315" font-size="17" font-weight="700" fill="#2F6F9F">Free Skytrain 5:00–2:00</text>

  <!-- T1 -->
  <rect x="55" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="196" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T1</text>
  <text x="160" y="226" font-size="17" fill="#5C6B6B" text-anchor="middle">Terminal 1</text>

  <!-- Jewel -->
  <rect x="315" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="420" y="196" font-size="24" font-weight="700" fill="#2E7D5B" text-anchor="middle">Jewel</text>
  <text x="420" y="226" font-size="17" fill="#102A2B" text-anchor="middle">Level-3 bridge to T2/T3</text>

  <!-- T3 -->
  <rect x="55" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T3</text>
  <text x="160" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">Terminal 3</text>

  <!-- CG2 -->
  <rect x="315" y="410" width="210" height="110" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
  <text x="420" y="446" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Changi Airport CG2</text>
  <text x="420" y="474" font-size="17" fill="#E3F0EF" text-anchor="middle">Changi Airport</text>
  <text x="420" y="502" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Direct to T2/T3</text>

  <!-- T2 -->
  <rect x="575" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="680" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T2</text>
  <text x="680" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">Terminal 2</text>

  <!-- T4 shuttle labels -->
  <g text-anchor="end">
    <text x="655" y="580" font-size="18" font-weight="700" fill="#D97A2B">Free shuttle T4 → T2</text>
    <text x="655" y="608" font-size="17" fill="#102A2B">6:00–24:00 ~every 5 min</text>
    <text x="655" y="634" font-size="17" fill="#102A2B">Ride ~10 min</text>
  </g>
  <g text-anchor="end">
    <text x="550" y="700" font-size="16" fill="#5C6B6B">00:00–6:00 terminal loop</text>
    <text x="550" y="724" font-size="16" fill="#5C6B6B">~every 19 min</text>
  </g>

  <!-- T4 -->
  <rect x="575" y="670" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="680" y="708" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T4</text>
  <text x="680" y="740" font-size="17" fill="#5C6B6B" text-anchor="middle">No direct MRT link</text>

  <text x="55" y="806" font-size="16" fill="#5C6B6B">Board at T4 Arrival Bus Lounge; alight at T2 Arrival Pick-up Door 1</text>
  <text x="55" y="834" font-size="16" fill="#5C6B6B">Confirm your airline’s terminal with the airline</text>

  <!-- ===== Right: rail ===== -->
  <text x="850" y="140" font-size="20" font-weight="700" fill="#0D6B68">MRT: Changi Airport → city</text>

  <path d="M1000 196 V386" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M1000 286 H1500" fill="none" stroke="#2F6F9F" stroke-width="10" marker-end="url(#arrowBlue)"/>
  <path d="M1000 386 H1500" fill="none" stroke="#0D6B68" stroke-width="10" marker-end="url(#arrowTeal)"/>

  <text x="1030" y="266" font-size="17" font-weight="700" fill="#2F6F9F">Downtown Line → Bukit Panjang</text>
  <text x="1030" y="360" font-size="17" font-weight="700" fill="#0D6B68">East West Line → Tuas Link</text>

  <g fill="#FFFFFF" stroke-width="6">
    <circle cx="1000" cy="196" r="13" stroke="#0D6B68"/>
    <circle cx="1000" cy="286" r="13" stroke="#2F6F9F"/>
    <circle cx="1000" cy="386" r="13" stroke="#0D6B68"/>
    <circle cx="1170" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1300" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1430" cy="386" r="9" stroke="#0D6B68"/>
  </g>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">
    <text x="975" y="202">Changi Airport CG2</text>
    <text x="975" y="292">Expo CG1／DT35</text>
    <text x="975" y="392">Tanah Merah EW4</text>
  </g>
  <g font-size="16" fill="#102A2B" text-anchor="middle">
    <text x="1170" y="424">Bugis</text>
    <text x="1300" y="424">City Hall</text>
    <text x="1430" y="424">Raffles Place</text>
  </g>

  <!-- time boxes -->
  <rect x="840" y="470" width="340" height="206" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1010" y="508" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">From airport (CG2)</text>
  <g font-size="17" fill="#102A2B">
    <text x="865" y="546">First 5:31 Mon–Sat</text>
    <text x="865" y="576">First 5:59 Sun/holidays</text>
    <text x="865" y="618" font-weight="700" fill="#B8442D">Last to Tuas Link 23:18</text>
    <text x="865" y="650">Last to Pasir Ris 00:06</text>
  </g>

  <rect x="1210" y="470" width="340" height="206" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1380" y="508" font-size="20" font-weight="700" fill="#2F6F9F" text-anchor="middle">To airport (CG2)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1235" y="546">Last train daily</text>
    <text x="1235" y="584" font-weight="700" fill="#B8442D">Tanah Merah 23:50</text>
    <text x="1235" y="618" font-weight="700" fill="#B8442D">Expo 23:53</text>
  </g>

  <rect x="840" y="706" width="710" height="76" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1195" y="752" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">Foreign-issued Visa/Mastercard: +SGD 0.60 per day of use</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair diagram 2026</text>
</svg>
