<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Noto Sans TC',system-ui,sans-serif">
  <title id="title">チャンギ空港のターミナルからMRT・市内への模式図</title>
  <desc id="desc">チャンギ空港MRT駅CG2はT2とT3に直結。T1からはJewelの3階連絡橋か無料Skytrain（5:00–2:00）でT2・T3へ。T4はMRTに直結せず、T4 Arrival Bus Loungeから無料シャトルでT2 Arrival Pick-up Door 1へ。6:00–24:00は約5分間隔、所要約10分。00:00–6:00は循環便で約19分間隔。CG2からExpo（CG1／DT35、Downtown LineのBukit Panjang方面へ乗換）を経てTanah Merah（EW4、Bugis、City Hall、Raffles Placeを通るEast West LineのTuas Link方面へ乗換）。空港発の始発は月〜土5:31、日曜・祝日5:59。Tuas Link接続の終電23:18、Pasir Ris接続の終電00:06。空港行き終電はTanah Merah発23:50、Expo発23:53。外国発行のVisa・Mastercardでの乗車は利用日ごとに0.60 SGDが加算される。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#102A2B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F6F9F"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="30" font-weight="700" fill="#102A2B">チャンギ空港：各ターミナルからMRT・市内へ</text>
  <text x="55" y="84" font-size="18" fill="#5C6B6B">チャンギ空港ターミナル・MRT CG2・市内行き電車 · 2026年9月確認</text>

  <!-- ===== Left: terminals ===== -->
  <text x="55" y="140" font-size="20" font-weight="700" fill="#0D6B68">ターミナル → MRT駅</text>

  <!-- connectors (drawn first, under boxes) -->
  <path d="M160 244 V420 M160 330 H680 V420" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <path d="M265 202 H315" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M420 244 V410" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M265 465 H315 M525 465 H575" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M680 670 V514" fill="none" stroke="#D97A2B" stroke-width="6" stroke-dasharray="18 12" marker-end="url(#arrow)"/>

  <text x="445" y="315" font-size="17" font-weight="700" fill="#2F6F9F">無料Skytrain 5:00–2:00</text>

  <!-- T1 -->
  <rect x="55" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="196" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T1</text>
  <text x="160" y="226" font-size="17" fill="#5C6B6B" text-anchor="middle">ターミナル1</text>

  <!-- Jewel -->
  <rect x="315" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="420" y="196" font-size="24" font-weight="700" fill="#2E7D5B" text-anchor="middle">Jewel</text>
  <text x="420" y="226" font-size="17" fill="#102A2B" text-anchor="middle">3階連絡橋 → T2/T3</text>

  <!-- T3 -->
  <rect x="55" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T3</text>
  <text x="160" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">ターミナル3</text>

  <!-- CG2 -->
  <rect x="315" y="410" width="210" height="110" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
  <text x="420" y="446" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">チャンギ空港駅 CG2</text>
  <text x="420" y="474" font-size="17" fill="#E3F0EF" text-anchor="middle">Changi Airport</text>
  <text x="420" y="502" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">T2/T3直結</text>

  <!-- T2 -->
  <rect x="575" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="680" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T2</text>
  <text x="680" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">ターミナル2</text>

  <!-- T4 shuttle labels -->
  <g text-anchor="end">
    <text x="655" y="580" font-size="18" font-weight="700" fill="#D97A2B">無料シャトル T4 → T2</text>
    <text x="655" y="608" font-size="17" fill="#102A2B">6:00–24:00 約5分間隔</text>
    <text x="655" y="634" font-size="17" fill="#102A2B">所要約10分</text>
  </g>
  <g text-anchor="end">
    <text x="550" y="700" font-size="16" fill="#5C6B6B">00:00–6:00 循環便</text>
    <text x="550" y="724" font-size="16" fill="#5C6B6B">約19分間隔</text>
  </g>

  <!-- T4 -->
  <rect x="575" y="670" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="680" y="708" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T4</text>
  <text x="680" y="740" font-size="17" fill="#5C6B6B" text-anchor="middle">MRT直結なし</text>

  <text x="55" y="806" font-size="16" fill="#5C6B6B">T4 Arrival Bus Lounge乗車、T2 Arrival Pick-up Door 1下車</text>
  <text x="55" y="834" font-size="16" fill="#5C6B6B">利用ターミナルは航空会社の案内を確認</text>

  <!-- ===== Right: rail ===== -->
  <text x="850" y="140" font-size="20" font-weight="700" fill="#0D6B68">MRT：チャンギ空港 → 市内</text>

  <path d="M1000 196 V386" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M1000 286 H1500" fill="none" stroke="#2F6F9F" stroke-width="10" marker-end="url(#arrowBlue)"/>
  <path d="M1000 386 H1500" fill="none" stroke="#0D6B68" stroke-width="10" marker-end="url(#arrowTeal)"/>

  <text x="1030" y="266" font-size="17" font-weight="700" fill="#2F6F9F">Downtown Line → Bukit Panjang</text>
  <text x="1030" y="360" font-size="17" font-weight="700" fill="#0D6B68">East West Line → Tuas Link</text>

  <g fill="#FFFFFF" stroke-width="6">
    <circle cx="1000" cy="196" r="13" stroke="#0D6B68"/>
    <circle cx="1000" cy="286" r="13" stroke="#2F6F9F"/>
    <circle cx="1000" cy="386" r="13" stroke="#0D6B68"/>
    <circle cx="1170" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1300" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1430" cy="386" r="9" stroke="#0D6B68"/>
  </g>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">
    <text x="975" y="202">チャンギ空港 CG2</text>
    <text x="975" y="292">Expo CG1／DT35</text>
    <text x="975" y="392">Tanah Merah EW4</text>
  </g>
  <g font-size="16" fill="#102A2B" text-anchor="middle">
    <text x="1170" y="424">Bugis</text>
    <text x="1300" y="424">City Hall</text>
    <text x="1430" y="424">Raffles Place</text>
  </g>

  <!-- time boxes -->
  <rect x="840" y="470" width="340" height="206" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1010" y="508" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">空港発（CG2）</text>
  <g font-size="17" fill="#102A2B">
    <text x="865" y="546">始発5:31 月〜土</text>
    <text x="865" y="576">始発5:59 日・祝日</text>
    <text x="865" y="618" font-weight="700" fill="#B8442D">Tuas Link接続 終電23:18</text>
    <text x="865" y="650">Pasir Ris接続 終電00:06</text>
  </g>

  <rect x="1210" y="470" width="340" height="206" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1380" y="508" font-size="20" font-weight="700" fill="#2F6F9F" text-anchor="middle">空港行き（CG2）</text>
  <g font-size="17" fill="#102A2B">
    <text x="1235" y="546">毎日の終電</text>
    <text x="1235" y="584" font-weight="700" fill="#B8442D">Tanah Merah発23:50</text>
    <text x="1235" y="618" font-weight="700" fill="#B8442D">Expo発23:53</text>
  </g>

  <rect x="840" y="706" width="710" height="76" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1195" y="752" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">外国発行Visa・Mastercard：利用日ごとに＋0.60 SGD</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text>
</svg>
