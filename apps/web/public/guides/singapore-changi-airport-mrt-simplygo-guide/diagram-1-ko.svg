<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic','Noto Sans TC',system-ui,sans-serif">
  <title id="title">창이공항 터미널에서 MRT·시내 이동 개략도</title>
  <desc id="desc">창이공항 MRT역 CG2는 T2와 T3에 바로 연결됩니다. T1에서는 Jewel 3층 연결 통로나 무료 Skytrain(5:00–2:00)으로 T2·T3에 갑니다. T4는 MRT 연결이 없어 T4 Arrival Bus Lounge에서 무료 셔틀을 타고 T2 Arrival Pick-up Door 1까지 이동합니다. 6:00–24:00 약 5분 간격, 이동 약 10분이며 00:00–6:00에는 순환 노선이 약 19분 간격입니다. MRT는 CG2에서 Expo(CG1/DT35, Bukit Panjang 방면 Downtown Line 환승)를 거쳐 Tanah Merah(EW4, Bugis·City Hall·Raffles Place를 지나는 Tuas Link 방면 East West Line 환승)로 갑니다. 공항 출발 첫차는 월~토 5:31, 일요일·공휴일 5:59. Tuas Link 연결 막차 23:18, Pasir Ris 연결 막차 00:06. 공항행 막차는 Tanah Merah 23:50, Expo 23:53. 외국 발행 Visa·Mastercard 사용 시 사용일마다 0.60 SGD가 추가됩니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#102A2B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F6F9F"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="30" font-weight="700" fill="#102A2B">창이공항: 터미널에서 MRT·시내로</text>
  <text x="55" y="84" font-size="18" fill="#5C6B6B">창이공항·MRT CG2 · 2026년 9월 확인</text>

  <!-- ===== Left: terminals ===== -->
  <text x="55" y="140" font-size="20" font-weight="700" fill="#0D6B68">터미널 → MRT역</text>

  <!-- connectors (drawn first, under boxes) -->
  <path d="M160 244 V420 M160 330 H680 V420" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <path d="M265 202 H315" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M420 244 V410" fill="none" stroke="#0D6B68" stroke-width="6"/>
  <path d="M265 465 H315 M525 465 H575" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M680 670 V514" fill="none" stroke="#D97A2B" stroke-width="6" stroke-dasharray="18 12" marker-end="url(#arrow)"/>

  <text x="445" y="315" font-size="17" font-weight="700" fill="#2F6F9F">무료 Skytrain 5:00–2:00</text>

  <!-- T1 -->
  <rect x="55" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="196" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T1</text>
  <text x="160" y="226" font-size="17" fill="#5C6B6B" text-anchor="middle">터미널 1</text>

  <!-- Jewel -->
  <rect x="315" y="160" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="420" y="196" font-size="24" font-weight="700" fill="#2E7D5B" text-anchor="middle">Jewel</text>
  <text x="420" y="226" font-size="17" fill="#102A2B" text-anchor="middle">3층 연결 통로 → T2/T3</text>

  <!-- T3 -->
  <rect x="55" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="160" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T3</text>
  <text x="160" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">터미널 3</text>

  <!-- CG2 -->
  <rect x="315" y="410" width="210" height="110" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
  <text x="420" y="446" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">창이공항역 CG2</text>
  <text x="420" y="474" font-size="17" fill="#E3F0EF" text-anchor="middle">Changi Airport</text>
  <text x="420" y="502" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">T2/T3 직결</text>

  <!-- T2 -->
  <rect x="575" y="420" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="680" y="458" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T2</text>
  <text x="680" y="490" font-size="17" fill="#5C6B6B" text-anchor="middle">터미널 2</text>

  <!-- T4 shuttle labels -->
  <g text-anchor="end">
    <text x="655" y="580" font-size="18" font-weight="700" fill="#D97A2B">무료 셔틀 T4 → T2</text>
    <text x="655" y="608" font-size="17" fill="#102A2B">6:00–24:00 약 5분 간격</text>
    <text x="655" y="634" font-size="17" fill="#102A2B">약 10분 소요</text>
  </g>
  <g text-anchor="end">
    <text x="550" y="700" font-size="16" fill="#5C6B6B">00:00–6:00 순환 노선</text>
    <text x="550" y="724" font-size="16" fill="#5C6B6B">약 19분 간격</text>
  </g>

  <!-- T4 -->
  <rect x="575" y="670" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="680" y="708" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">T4</text>
  <text x="680" y="740" font-size="17" fill="#5C6B6B" text-anchor="middle">MRT 직접 연결 없음</text>

  <text x="55" y="806" font-size="16" fill="#5C6B6B">T4 Arrival Bus Lounge 승차, T2 Arrival Pick-up Door 1 하차</text>
  <text x="55" y="834" font-size="16" fill="#5C6B6B">이용 터미널은 항공사 안내를 확인</text>

  <!-- ===== Right: rail ===== -->
  <text x="850" y="140" font-size="20" font-weight="700" fill="#0D6B68">MRT: 창이공항 → 시내</text>

  <path d="M1000 196 V386" fill="none" stroke="#0D6B68" stroke-width="10"/>
  <path d="M1000 286 H1500" fill="none" stroke="#2F6F9F" stroke-width="10" marker-end="url(#arrowBlue)"/>
  <path d="M1000 386 H1500" fill="none" stroke="#0D6B68" stroke-width="10" marker-end="url(#arrowTeal)"/>

  <text x="1030" y="266" font-size="17" font-weight="700" fill="#2F6F9F">Downtown Line → Bukit Panjang</text>
  <text x="1030" y="360" font-size="17" font-weight="700" fill="#0D6B68">East West Line → Tuas Link</text>

  <g fill="#FFFFFF" stroke-width="6">
    <circle cx="1000" cy="196" r="13" stroke="#0D6B68"/>
    <circle cx="1000" cy="286" r="13" stroke="#2F6F9F"/>
    <circle cx="1000" cy="386" r="13" stroke="#0D6B68"/>
    <circle cx="1170" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1300" cy="386" r="9" stroke="#0D6B68"/>
    <circle cx="1430" cy="386" r="9" stroke="#0D6B68"/>
  </g>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">
    <text x="975" y="202">창이공항 CG2</text>
    <text x="975" y="292">Expo CG1／DT35</text>
    <text x="975" y="392">Tanah Merah EW4</text>
  </g>
  <g font-size="16" fill="#102A2B" text-anchor="middle">
    <text x="1170" y="424">Bugis</text>
    <text x="1300" y="424">City Hall</text>
    <text x="1430" y="424">Raffles Place</text>
  </g>

  <!-- time boxes -->
  <rect x="840" y="470" width="340" height="206" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1010" y="508" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">공항 출발(CG2)</text>
  <g font-size="17" fill="#102A2B">
    <text x="865" y="546">첫차 5:31 월~토</text>
    <text x="865" y="576">첫차 5:59 일·공휴일</text>
    <text x="865" y="618" font-weight="700" fill="#B8442D">Tuas Link 연결 막차 23:18</text>
    <text x="865" y="650">Pasir Ris 연결 막차 00:06</text>
  </g>

  <rect x="1210" y="470" width="340" height="206" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1380" y="508" font-size="20" font-weight="700" fill="#2F6F9F" text-anchor="middle">공항행(CG2)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1235" y="546">매일 막차</text>
    <text x="1235" y="584" font-weight="700" fill="#B8442D">Tanah Merah 출발 23:50</text>
    <text x="1235" y="618" font-weight="700" fill="#B8442D">Expo 출발 23:53</text>
  </g>

  <rect x="840" y="706" width="710" height="76" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1195" y="752" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">외국 발행 Visa·Mastercard: 사용일마다 ＋0.60 SGD</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text>
</svg>
