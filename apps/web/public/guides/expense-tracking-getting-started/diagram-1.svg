<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一筆支出到兩個數字 / From one entry to two numbers</title>
<desc id="desc">由左到右四段：先在固定的時段記下一筆，只分固定支出與變動支出兩類，累積滿一個口徑不變的完整月，月底才算得出每月結餘與固定支出佔比這兩個數字。下方兩行提醒：年繳項目要攤進每個月，現金對不起來時補一筆調整項結平。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一筆支出到兩個數字：記帳的最短路徑</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Expense tracking · 記什麼、分幾類、記多久、月底看什麼</text>

<path d="M335 420 L410 320" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M335 470 L410 500" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M725 350 L800 400" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M725 510 L800 460" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1115 400 L1190 330" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1115 460 L1190 530" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="50" y="280" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="190" y="328" text-anchor="middle" font-size="17" fill="#5C6B6B">每天</text>
<text x="190" y="372" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">記下一筆</text>
<text x="190" y="420" text-anchor="middle" font-size="18" fill="#5C6B6B">當下記</text>
<text x="190" y="458" text-anchor="middle" font-size="18" fill="#5C6B6B">每晚補</text>
<text x="190" y="496" text-anchor="middle" font-size="18" fill="#5C6B6B">每週補</text>
<text x="190" y="546" text-anchor="middle" font-size="17" fill="#5C6B6B">挑一個固定時段</text>

<rect x="420" y="230" width="300" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="570" y="274" text-anchor="middle" font-size="17" fill="#5C6B6B">每月金額幾乎一樣</text>
<text x="570" y="318" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">固定支出</text>
<text x="570" y="358" text-anchor="middle" font-size="18" fill="#5C6B6B">房租、保險、電信、訂閱</text>

<rect x="420" y="430" width="300" height="160" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="570" y="474" text-anchor="middle" font-size="17" fill="#5C6B6B">其餘全部丟這裡</text>
<text x="570" y="518" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">變動支出</text>
<text x="570" y="558" text-anchor="middle" font-size="18" fill="#5C6B6B">飲食、交通、娛樂</text>

<rect x="810" y="300" width="300" height="260" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="960" y="348" text-anchor="middle" font-size="17" fill="#5C6B6B">口徑先定好</text>
<text x="960" y="394" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">記滿一個完整月</text>
<text x="960" y="440" text-anchor="middle" font-size="18" fill="#5C6B6B">發薪日到發薪日</text>
<text x="960" y="478" text-anchor="middle" font-size="18" fill="#5C6B6B">或月初到月底</text>
<text x="960" y="526" text-anchor="middle" font-size="17" fill="#5C6B6B">中途不要改口徑</text>

<rect x="1200" y="230" width="340" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1370" y="278" text-anchor="middle" font-size="17" fill="#5C6B6B">數字一</text>
<text x="1370" y="328" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">每月結餘</text>
<text x="1370" y="370" text-anchor="middle" font-size="18" fill="#5C6B6B">收入減掉支出</text>

<rect x="1200" y="440" width="340" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1370" y="488" text-anchor="middle" font-size="17" fill="#5C6B6B">數字二</text>
<text x="1370" y="538" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">固定支出佔比</text>
<text x="1370" y="580" text-anchor="middle" font-size="18" fill="#5C6B6B">固定支出除以收入</text>

<text x="60" y="720" font-size="20" fill="#5C6B6B">年繳的項目除以 12，每個月放一筆進固定支出，否則固定支出佔比會被低估。</text>
<text x="60" y="756" font-size="20" fill="#5C6B6B">現金對不起來的時候，補一筆「調整項」把差額結平，不要整個月重記。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
