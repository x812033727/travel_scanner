<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">OpenAI, Habitat 스토리지 아키텍처 공개: 매주 10억 명 넘게 사용하는 규모와 한계</title><desc id="desc">오리지널 일러스트: 왼쪽은 옅은 회색 가는 선들이 사방에서 원통형 데이터베이스로 모여들어 대량의 요청이 한 스토리지 시스템에 몰리는 모습이다. 오른쪽 위는 점선이 실선으로 바뀌는 화살표로 구버전에서 신버전으로의 재작성을, 오른쪽 아래는 낮은 순서에서 높은 순서로 늘어선 막대 4개로 OpenAI가 설명하는 연간 성장을 나타낸다.</desc>
