<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從模型檔案大小算到跑在哪裡 / From model file size to where it runs</title>
  <desc id="desc">三步驟決策圖。第一步查官方檔案大小：Ollama 模型庫標示 gemma3:12b 為 8.1GB、gpt-oss:20b 為 14GB、gpt-oss:120b 為 65GB，這是記憶體需求的下限；同一個模型換量化會變尺寸，gemma3:12b 的 q4_K_M 是 8.1GB、q8_0 是 13GB、fp16 是 24GB。第二步加餘裕與上下文：官方例子是 14GB 檔案配 16GB 記憶體、65GB 檔案配單張 80GB 的 GPU，上下文預設 4096 個 token，長上下文任務建議 64000；Ollama 依顯示記憶體給預設上下文，低於 24 GiB 給 4k、24 至 48 GiB 給 32k、48 GiB 以上給 256k。第三步看總需求塞得進哪裡：塞進顯示記憶體就是 100% GPU 最快，只塞得進系統或統一記憶體就是 CPU 或混合模式、llama.cpp 官方對照是每秒 1.7 對每秒 9.1 個 token，兩邊都塞不下就降量化或換小模型。最下方是硬體上限：單張 GeForce RTX 50 系列顯示記憶體 8GB 至 32GB，Apple Mac 統一記憶體 16GB 至 512GB，NVIDIA 需要運算能力 5.0 以上與驅動 550 以上，macOS 需要 14 以上。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">跑不跑得動：從檔案大小算到跑在哪裡</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">From model file size to where the model actually runs</text>

  <!-- Column A -->
  <rect x="40" y="120" width="440" height="252" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="66" y="162" font-size="20" font-weight="700" fill="#0D6B68">① 查官方檔案大小</text>
  <text x="66" y="200" font-size="17" fill="#102A2B">Ollama 模型庫直接標出大小</text>
  <text x="66" y="236" font-size="17" fill="#102A2B">gemma3:12b　8.1GB</text>
  <text x="66" y="272" font-size="17" fill="#102A2B">gpt-oss:20b　14GB</text>
  <text x="66" y="308" font-size="17" fill="#102A2B">gpt-oss:120b　65GB</text>
  <text x="66" y="348" font-size="17" font-weight="700" fill="#B8442D">這是需求下限，不是答案</text>

  <rect x="40" y="400" width="440" height="190" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="66" y="442" font-size="19" font-weight="700" fill="#2F6F9F">量化決定同一模型的尺寸</text>
  <text x="66" y="480" font-size="17" fill="#102A2B">gemma3:12b　q4_K_M　8.1GB</text>
  <text x="66" y="516" font-size="17" fill="#102A2B">q8_0　13GB　／　fp16　24GB</text>
  <text x="66" y="558" font-size="17" font-weight="700" fill="#2E7D5B">記憶體不夠，先降一階量化</text>

  <!-- Column B -->
  <rect x="560" y="120" width="440" height="252" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="586" y="162" font-size="20" font-weight="700" fill="#0D6B68">② 加餘裕與上下文</text>
  <text x="586" y="200" font-size="17" fill="#102A2B">官方例：14GB 檔 → 16GB 記憶體</text>
  <text x="586" y="236" font-size="17" fill="#102A2B">官方例：65GB 檔 → 單張 80GB GPU</text>
  <text x="586" y="272" font-size="17" fill="#102A2B">上下文預設 4096 個 token</text>
  <text x="586" y="308" font-size="17" fill="#102A2B">長上下文任務建議 64000</text>
  <text x="586" y="348" font-size="17" font-weight="700" fill="#D97A2B">兩者相加＝這次的總需求</text>

  <rect x="560" y="400" width="440" height="190" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="586" y="442" font-size="19" font-weight="700" fill="#2F6F9F">Ollama 依顯示記憶體給預設</text>
  <text x="586" y="480" font-size="17" fill="#102A2B">低於 24 GiB　→　4k 上下文</text>
  <text x="586" y="516" font-size="17" fill="#102A2B">24 至 48 GiB　→　32k 上下文</text>
  <text x="586" y="552" font-size="17" fill="#102A2B">48 GiB 以上　→　256k 上下文</text>

  <!-- Column C -->
  <rect x="1080" y="120" width="480" height="70" rx="14" fill="#0D6B68"/>
  <text x="1320" y="165" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">③ 總需求塞得進哪裡？</text>

  <rect x="1080" y="216" width="480" height="116" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1106" y="256" font-size="18" font-weight="700" fill="#2E7D5B">塞得進顯示記憶體</text>
  <text x="1106" y="294" font-size="17" fill="#102A2B">整個跑在顯示卡上，100% GPU</text>

  <rect x="1080" y="356" width="480" height="152" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1106" y="396" font-size="18" font-weight="700" fill="#D97A2B">只塞得進系統或統一記憶體</text>
  <text x="1106" y="434" font-size="17" fill="#102A2B">退成 CPU 或 CPU／GPU 混合</text>
  <text x="1106" y="472" font-size="17" fill="#102A2B">官方同機對照：1.7 → 9.1 token／秒</text>

  <rect x="1080" y="532" width="480" height="116" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1106" y="572" font-size="18" font-weight="700" fill="#B8442D">兩邊都塞不下</text>
  <text x="1106" y="610" font-size="17" fill="#102A2B">降量化，或換更小的模型</text>

  <!-- arrows -->
  <line x1="490" y1="246" x2="548" y2="246" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1010" y1="246" x2="1068" y2="246" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="260" y1="376" x2="260" y2="394" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="780" y1="376" x2="780" y2="394" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- bottom band -->
  <rect x="40" y="664" width="1520" height="172" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="66" y="706" font-size="20" font-weight="700" fill="#0D6B68">硬體天花板（官方規格頁，2026 年 9 月 14 日）</text>
  <text x="66" y="746" font-size="17" fill="#102A2B">單張 GeForce RTX 50 系列的顯示記憶體：8GB 至 32GB，插再多系統記憶體也不會變成顯示記憶體</text>
  <text x="66" y="784" font-size="17" fill="#102A2B">Apple Mac 的統一記憶體：16GB 至 512GB，CPU 與 GPU 共用同一份</text>
  <text x="66" y="820" font-size="17" fill="#5C6B6B">入門門檻：NVIDIA 運算能力 5.0 以上、驅動 550 以上；macOS 需 14 以上</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
