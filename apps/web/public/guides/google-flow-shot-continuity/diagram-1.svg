<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">不只一格，檢查前後一秒</title><desc id="desc">主體：外形・位置・光線：兩段都要對照；影格：使用真正影片末幀：不能用示意圖充當；重做：先核對模式支援：一次修正一個問題；比較：基準與修訂並存：整段與聲音也查</desc>
<rect width="1600" height="900" fill="#fbf1e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">不只一格，檢查前後一秒</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#875b3e" font-weight="800">主體</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">外形・位置・光線</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">兩段都要對照</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#875b3e" font-weight="800">影格</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">使用真正影片末幀</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">不能用示意圖充當</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#875b3e" font-weight="800">重做</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">先核對模式支援</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">一次修正一個問題</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#875b3e" font-weight="800">比較</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">基準與修訂並存</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">整段與聲音也查</text><text x="85" y="818" font-size="47" fill="#775b45" font-weight="500">接點示例已備；實際片段待驗</text></g></svg>