<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">不開車的沖繩：三圈走到哪裡 / Okinawa without a car</title>
  <desc id="desc">三條路線由南往北：第一圈是沖繩都市單軌ゆいレール，從那覇空港經旭橋、県庁前、美栄橋、牧志、おもろまち、首里到てだこ浦西，全線 19 站、17 公里、37 分；第二圈是那覇空港直達記念公園前的高速巴士，經恩納、名護、本部，官方時刻表 2 小時上下、單程 2,000 日圓起，記念公園前到水族館入口要再走 10 分；第三圈從記念公園前到今帰仁村役場轉三島線去古宇利島，單程 3 小時 15 分。回程末班是記念公園前 17:22 發、那霸機場 19:34 到。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">不開車的沖繩：三圈走到哪裡</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Okinawa without a car: how far each ring gets you</text>
  <text x="60" y="112" font-size="15" fill="#5C6B6B">示意圖，距離非比例</text>

  <!-- ring 1: monorail -->
  <rect x="60" y="175" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="180" y="208" font-size="18" font-weight="bold" text-anchor="middle" fill="#102A2B">第一圈　那霸市區</text>
  <text x="180" y="236" font-size="16" text-anchor="middle" fill="#5C6B6B">ゆいレール 單軌</text>
  <line x1="340" y1="220" x2="1200" y2="220" stroke="#0D6B68" stroke-width="5"/>
  <circle cx="340" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="463" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="586" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="709" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="832" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="955" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="1078" cy="220" r="8" fill="#0D6B68"/>
  <circle cx="1200" cy="220" r="8" fill="#0D6B68"/>
  <text x="340" y="196" font-size="16" text-anchor="middle" fill="#102A2B">那覇空港</text>
  <text x="463" y="256" font-size="16" text-anchor="middle" fill="#102A2B">旭橋</text>
  <text x="586" y="196" font-size="16" text-anchor="middle" fill="#102A2B">県庁前</text>
  <text x="709" y="256" font-size="16" text-anchor="middle" fill="#102A2B">美栄橋</text>
  <text x="832" y="196" font-size="16" text-anchor="middle" fill="#102A2B">牧志</text>
  <text x="955" y="256" font-size="16" text-anchor="middle" fill="#102A2B">おもろまち</text>
  <text x="1078" y="196" font-size="16" text-anchor="middle" fill="#102A2B">首里</text>
  <text x="1200" y="256" font-size="16" text-anchor="middle" fill="#102A2B">てだこ浦西</text>
  <text x="1250" y="226" font-size="17" fill="#0D6B68">19 站．17 公里．37 分</text>

  <!-- ring 2: express bus -->
  <rect x="60" y="405" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="180" y="438" font-size="18" font-weight="bold" text-anchor="middle" fill="#102A2B">第二圈　北部主線</text>
  <text x="180" y="466" font-size="16" text-anchor="middle" fill="#5C6B6B">高速巴士直達</text>
  <line x1="340" y1="450" x2="1108" y2="450" stroke="#D97A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="340" cy="450" r="8" fill="#D97A2B"/>
  <circle cx="600" cy="450" r="8" fill="#D97A2B"/>
  <circle cx="800" cy="450" r="8" fill="#D97A2B"/>
  <circle cx="960" cy="450" r="8" fill="#D97A2B"/>
  <circle cx="1130" cy="450" r="8" fill="#D97A2B"/>
  <text x="340" y="486" font-size="16" text-anchor="middle" fill="#102A2B">那覇空港</text>
  <text x="600" y="486" font-size="16" text-anchor="middle" fill="#102A2B">恩納</text>
  <text x="800" y="486" font-size="16" text-anchor="middle" fill="#102A2B">名護</text>
  <text x="960" y="486" font-size="16" text-anchor="middle" fill="#102A2B">本部</text>
  <text x="1130" y="486" font-size="16" text-anchor="middle" fill="#102A2B">記念公園前</text>
  <text x="700" y="414" font-size="17" text-anchor="middle" fill="#D97A2B">官方時刻表 2 小時上下．單程 2,000 日圓起</text>
  <line x1="1150" y1="450" x2="1300" y2="450" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="11 9"/>
  <circle cx="1300" cy="450" r="8" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1300" y="486" font-size="16" text-anchor="middle" fill="#102A2B">水族館入口</text>
  <text x="1225" y="422" font-size="16" text-anchor="middle" fill="#5C6B6B">步行 10 分</text>

  <!-- ring 3: Kouri -->
  <rect x="60" y="635" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="180" y="668" font-size="18" font-weight="bold" text-anchor="middle" fill="#102A2B">第三圈　古宇利島</text>
  <text x="180" y="696" font-size="16" text-anchor="middle" fill="#5C6B6B">要轉一次車</text>
  <line x1="360" y1="680" x2="1078" y2="680" stroke="#2F6F9F" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="360" cy="680" r="8" fill="#2F6F9F"/>
  <circle cx="740" cy="680" r="14" fill="#2F6F9F"/>
  <circle cx="1100" cy="680" r="8" fill="#2F6F9F"/>
  <text x="360" y="716" font-size="16" text-anchor="middle" fill="#102A2B">記念公園前</text>
  <text x="740" y="716" font-size="16" text-anchor="middle" fill="#102A2B">今帰仁村役場</text>
  <text x="1100" y="716" font-size="16" text-anchor="middle" fill="#102A2B">古宇利島</text>
  <text x="740" y="644" font-size="17" text-anchor="middle" fill="#2F6F9F">轉三島線</text>
  <text x="1150" y="686" font-size="17" fill="#2F6F9F">單程 3 小時 15 分</text>

  <!-- legend -->
  <line x1="70" y1="800" x2="130" y2="800" stroke="#102A2B" stroke-width="5"/>
  <text x="145" y="806" font-size="16" fill="#5C6B6B">實線＝單軌或直達巴士</text>
  <line x1="390" y1="800" x2="450" y2="800" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="11 9"/>
  <text x="465" y="806" font-size="16" fill="#5C6B6B">虛線＝走路</text>
  <circle cx="660" cy="800" r="12" fill="#2F6F9F"/>
  <text x="685" y="806" font-size="16" fill="#5C6B6B">實心圈＝要轉車</text>

  <!-- last bus back -->
  <rect x="960" y="762" width="580" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1250" y="796" font-size="17" font-weight="bold" text-anchor="middle" fill="#102A2B">回程末班</text>
  <text x="1250" y="822" font-size="17" text-anchor="middle" fill="#102A2B">記念公園前 17:22 → 那霸機場 19:34</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
