<title id="title">英国FCAが暗号資産の監督範囲に関する最終指針PS26/18を公表：申請は9月30日開始、新制度は2027年10月に施行</title><desc id="desc">オリジナルイラスト：左は書類のアイコン、右は時間軸。軸の上には4つの点があり、前の2つは塗りつぶした丸ですでに起きた議会通過と指針の公表を、後の2つは破線の丸でまだ来ていない申請開始と新制度の施行を表す</desc>
