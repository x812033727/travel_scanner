<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北車站到北投、新北投與烏來的溫泉路線圖</title>
  <desc id="desc">上方：淡水信義線從台北車站到北投（30 元、約 22 分），北投站轉新北投支線到新北投（全程 35 元、約 28 分）；新北投站周邊有免費的溫泉博物館與地熱谷，公共露天浴池整修中。下方：淡水信義線一站到中正紀念堂轉松山新店線到新店（30 元、約 21 分），再轉 849 公車（虛線，05:30 到 21:40，每 15 到 20 分一班）到烏來；烏來有老街、約 1.6 公里的台車與雲仙樂園纜車。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="62" font-size="36" font-weight="700" fill="#102A2B">台北車站 → 北投・新北投 ／ 新店 → 烏來　溫泉路線圖</text>
  <text x="60" y="96" font-size="20" fill="#5C6B6B">示意圖，非精確比例 · 票價為單程全票，2026 年 9 月查證</text>


  <path d="M 300 460 C 420 460, 470 300, 620 300" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round" />
  <path d="M 620 300 L 880 300" fill="none" stroke="#B8442D" stroke-width="7" stroke-linecap="round" />

  <path d="M 300 500 C 380 500, 380 640, 460 640" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round" />
  <path d="M 460 640 L 780 640" fill="none" stroke="#2E7D5B" stroke-width="12" stroke-linecap="round" />

  <path d="M 780 640 L 1120 640" fill="none" stroke="#D97A2B" stroke-width="8" stroke-dasharray="20 14" stroke-linecap="round" />


  <rect x="60" y="430" width="240" height="100" rx="20" fill="#0D6B68" />
  <text x="180" y="492" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">台北車站</text>


  <circle cx="620" cy="300" r="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="7" />
  <text x="620" y="345" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">北投</text>
  <text x="620" y="372" font-size="17" fill="#5C6B6B" text-anchor="middle">30 元 · 約 22 分 · 同月台轉支線</text>
  <circle cx="880" cy="300" r="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="7" />
  <text x="880" y="255" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">新北投</text>
  <text x="750" y="284" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">新北投支線</text>
  <text x="880" y="345" font-size="17" fill="#5C6B6B" text-anchor="middle">全程 35 元 · 約 28 分</text>
  <text x="480" y="422" font-size="19" font-weight="700" fill="#B8442D">淡水信義線</text>


  <circle cx="460" cy="640" r="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6" />
  <text x="460" y="690" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">中正紀念堂 轉乘</text>
  <text x="80" y="656" font-size="19" font-weight="700" fill="#2E7D5B">松山新店線</text>
  <circle cx="780" cy="640" r="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="7" />
  <text x="780" y="572" font-size="17" fill="#5C6B6B" text-anchor="middle">30 元 · 約 21 分</text>
  <text x="780" y="602" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">新店</text>
  <text x="960" y="692" font-size="17" font-weight="700" fill="#9A4F12" text-anchor="middle">849 公車 · 05:30–21:40 · 每 15–20 分一班</text>
  <circle cx="1120" cy="640" r="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7" />
  <text x="1120" y="602" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">烏來</text>
  <text x="1120" y="572" font-size="16" fill="#5C6B6B" text-anchor="middle">849 總站 · 老街口</text>


  <rect x="980" y="140" width="580" height="270" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
  <text x="1010" y="180" font-size="21" font-weight="700" fill="#0D6B68">新北投站周邊</text>
  <text x="1010" y="216" font-size="17" fill="#102A2B">溫泉博物館：免費 · 週二至日 10:00–18:00</text>
  <text x="1010" y="242" font-size="16" fill="#5C6B6B">步行約 5 分 · 週一休 · 17:45 停止入館</text>
  <text x="1010" y="278" font-size="17" fill="#102A2B">地熱谷：免費 · 週二至日 09:00–17:00</text>
  <text x="1010" y="304" font-size="16" fill="#5C6B6B">週一休 · 只能參觀</text>
  <text x="1010" y="340" font-size="17" fill="#B8442D">露天浴池：整修中</text>
  <text x="1010" y="366" font-size="16" fill="#5C6B6B">預計 2026 年 9 月 26 日完工 · 整修前 60 元 · 須泳裝＋泳帽</text>
  <text x="1010" y="394" font-size="16" fill="#5C6B6B">私人湯屋：以各家為準</text>


  <rect x="760" y="730" width="800" height="118" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" />
  <text x="790" y="768" font-size="21" font-weight="700" fill="#9A4F12">烏來</text>
  <text x="790" y="798" font-size="16" fill="#102A2B">老街 週一至五 10:00–17:00 · 週末 10:00–18:00　台車 約 1.6 公里 · 平日 08:00–17:00</text>
  <text x="790" y="826" font-size="16" fill="#102A2B">纜車 平日 250 元 · 假日 300 元 · 09:00–17:00（假日至 17:30）　瀑布免費</text>


  <g font-size="16" fill="#102A2B">
    <line x1="60" y1="876" x2="110" y2="876" stroke="#B8442D" stroke-width="10" stroke-linecap="round" />
    <text x="120" y="882">淡水信義線</text>
    <line x1="360" y1="876" x2="410" y2="876" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" />
