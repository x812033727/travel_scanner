    <line x1="700" y1="876" x2="750" y2="876" stroke="#D97A2B" stroke-width="7" stroke-dasharray="16 10" stroke-linecap="round" />
    <text x="760" y="882">849 公車（虛線）</text>
    <text x="1540" y="882" fill="#8A8F8F" text-anchor="end">© Mokaair 2026</text>
