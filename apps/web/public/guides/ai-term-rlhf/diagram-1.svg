<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">偏好資料如何影響回答策略</title><desc id="desc">人工比較回答形成偏好資料，用來訓練獎勵模型，再透過強化學習更新回答策略，最後以獨立評估核對</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">偏好資料如何影響回答策略</text><text x="60" y="84" font-size="18" fill="#5C6B6B">RLHF</text><path d="M 370 395 L 480 395" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 790 395 L 900 395" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1060 490 L 1060 630" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="300" width="300" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="220" y="389" font-size="28" fill="#102A2B" text-anchor="middle">比較回答</text><text x="220" y="432" font-size="22" fill="#5C6B6B" text-anchor="middle">依明確準則</text><rect x="490" y="300" width="300" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="640" y="389" font-size="28" fill="#102A2B" text-anchor="middle">獎勵模型</text><text x="640" y="432" font-size="22" fill="#5C6B6B" text-anchor="middle">預測偏好</text><rect x="910" y="300" width="300" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1060" y="389" font-size="28" fill="#102A2B" text-anchor="middle">強化學習</text><text x="1060" y="432" font-size="22" fill="#5C6B6B" text-anchor="middle">更新回答策略</text><rect x="910" y="640" width="480" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1150" y="704" font-s