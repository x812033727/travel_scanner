<title id="title">金融審議会の報告書：暗号資産を金融商品取引法へ移すよう提言、関連法案は成立済み・施行日は見当たらず</title><desc id="desc">オリジナルの図：左に大きな円とそれを囲む六つの小さな円を置き、審議会のワーキング・グループを表します。矢印は中央の実線枠の報告書を指し、そこから破線の矢印が右の破線枠の文書に向かいます。右の文書は、成立はしたものの施行日が見当たらない法律を表します。</desc>
