<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">일본 금융심의회 보고서: 암호자산을 금융상품거래법으로 옮기자는 제언, 관련 법안은 성립, 시행일은 보이지 않음</title><desc id="desc">오리지널 일러스트: 왼쪽에 큰 원과 그것을 둘러싼 여섯 개의 작은 원을 두어 심의회의 워킹그룹을 나타냅니다. 화살표는 가운데의 실선 테두리 보고서를 가리키고, 거기서 점선 화살표가 오른쪽의 점선 테두리 문서로 향합니다. 오른쪽 문서는 성립했지만 시행일이 보이지 않는 법률을 뜻합니다.</desc>
