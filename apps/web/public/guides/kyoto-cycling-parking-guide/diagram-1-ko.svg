<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>교토에서 자전거를 빌리기 전에: 주차 지점으로 동선을 짜고, 자전거를 만능 지름길로 여기지 말자: 판단 흐름</title><desc>순서대로 확인: 자신의 여건 확인, 주차 장소 먼저 찾기, 대여 계약 확인, 반납 여유 확보. 편집부가 정리한 자료이며 지도나 실측 시간이 아니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">자신의 여건에 맞게 선택하고, 한 번에 모두 마칠 필요는 없다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">내 여건 확인</text><text x="103" y="497" fill="#f4f0e5" font-size="23">나에게 맞는지 확인</text><text x="103" y="573" fill="#f4dc9d" font-size="26">무리해서 타지 않기</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">주차 장소 먼저</text><text x="473" y="497" fill="#f4f0e5" font-size="23">주차 장소 찾기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">입구 확실히 확인</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">대여 계약 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">대여 조건 읽기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">고장 시 연락할 곳 확인</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">반납 여유 확보</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">반납 계획 세우기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">비 오면 일찍 반납 가능</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집부 도식</text></g></svg>
