<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>京都で自転車を借りる前に：駐輪場所を軸にルートを計画し、自転車ならどこでも近道できると思わない：判断の流れ</title><desc>順に確認：自分の条件を確認、駐輪場所を先に探す、レンタル契約を確認、返却に余裕を確保。編集部による整理で、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順序 · 実践的な手順</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度に全部終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">自分の条件を確認</text><text x="103" y="497" fill="#f4f0e5" font-size="23">自分に合うか確認</text><text x="103" y="573" fill="#f4dc9d" font-size="26">無理して乗らない</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">駐輪場所を先に探す</text><text x="473" y="497" fill="#f4f0e5" font-size="23">駐輪場所を探す</text><text x="473" y="573" fill="#f4dc9d" font-size="26">入口を明確に</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">レンタル契約を確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">レンタル条件を読む</text><text x="843" y="573" fill="#f4dc9d" font-size="26">故障時の連絡先を把握</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">返却に余裕を確保</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">返却を計画</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">雨天は早めの返却も可</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部作成の模式図 / 編集部による図解</text></g></svg>
