<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>京都租腳踏車之前：用停車點規劃路線，別把騎車當成萬用捷徑：判斷流程</title><desc>依序檢查：看自身條件、先找停車、核對租約、預留歸還。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">看自身條件</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Check your fit</text><text x="103" y="573" fill="#f4dc9d" font-size="26">不勉強騎乘</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">先找停車</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Locate parking</text><text x="473" y="573" fill="#f4dc9d" font-size="26">入口要明確</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">核對租約</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Read rental terms</text><text x="843" y="573" fill="#f4dc9d" font-size="26">故障知道找誰</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">預留歸還</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Plan the return</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">雨天可提早</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>