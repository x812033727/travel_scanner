<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ChatGPT 手機 App 十個技巧 / Ten ChatGPT mobile app tips</title>
  <desc id="desc">十個技巧分成兩排五格，照正文順序編號。1 拍照提問：按加號拍照或選相簿，藥袋、菜單、公告直接問，免費版可用但有額度上限。2 多張照片一起問：同一則訊息加好幾張，租約三頁、說明書前後頁一起問，出錯就減少張數。3 語音與聽寫：聲波圖示是語音模式，麥克風圖示是聽寫，走路、做菜時用講的。4 鎖定畫面（只有 iPhone 有官方說明）：設定的 Voice 裡開背景對話，Live 語音會顯示在鎖定畫面，有動態島的機型也會顯示。5 Siri 提問（只有 iPhone 有官方說明）：在 iPhone 設定裡啟用，說 Ask ChatGPT 直接送出，視覺智慧可以問眼前的東西。6 CarPlay（只有 iPhone 有官方說明）：iOS 26.4 以上、所有方案，選 New voice chat 開始講，拿不到地圖與車輛資料。7 暫時對話：不進紀錄、不建立記憶、不用來訓練模型，最多保留 30 天後刪除。8 排程任務：用講的建任務，時間到推播，免費版同時最多 3 個，推播或 Email 在設定裡選。9 位置分享：在設定的 Data controls 打開，可以問附近藥局、今天會不會下雨，預設關閉，可以只關精確位置。10 長按選模型：付費方案才有，長按送出鍵只改這一則，算錢、看合約時選會多想的選項。底部註解：有 iPhone 標記的技巧目前只有 iPhone 有官方說明，Android 也有背景對話開關，鎖定畫面顯示以官網為準；功能名稱與開關位置依 OpenAI help center 與發布記錄查證，App 介面常改版，設定名稱以手上的版本為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ChatGPT 手機 App 十個技巧（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Ten ChatGPT mobile app tips: photos, voice, Lock Screen, Siri, CarPlay, Temporary Chat, tasks, location, model picker</text>

