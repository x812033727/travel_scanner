  <circle cx="392" cy="158" r="22" fill="#2F6F9F"/>
  <text x="392" y="166" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="426" y="166" font-size="20" font-weight="700" fill="#1F4E73">多張照片一起問</text>
  <text x="426" y="190" font-size="15" fill="#5C6B6B">Several photos</text>
  <rect x="476" y="210" width="64" height="48" rx="6" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><rect x="466" y="218" width="64" height="48" rx="6" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><rect x="456" y="226" width="64" height="48" rx="6" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><circle cx="472" cy="240" r="5" fill="#2F6F9F"/><path d="M 462 268 L 480 248 L 492 260 L 502 250 L 514 268 Z" fill="#2F6F9F"/>
  <text x="498" y="323" font-size="16" fill="#102A2B" text-anchor="middle">同一則訊息加好幾張</text>
  <text x="498" y="351" font-size="16" fill="#102A2B" text-anchor="middle">租約三頁、說明書前後頁</text>
  <text x="498" y="379" font-size="16" fill="#102A2B" text-anchor="middle">出錯就減少張數</text>

