  <text x="730" y="190" font-size="15" fill="#5C6B6B">Voice and dictation</text>
  <rect x="757" y="234" width="10" height="24" rx="5" fill="#102A2B"/><rect x="777" y="222" width="10" height="48" rx="5" fill="#102A2B"/><rect x="797" y="210" width="10" height="72" rx="5" fill="#102A2B"/><rect x="817" y="222" width="10" height="48" rx="5" fill="#102A2B"/><rect x="837" y="234" width="10" height="24" rx="5" fill="#102A2B"/>
  <text x="802" y="323" font-size="16" fill="#102A2B" text-anchor="middle">聲波圖示是語音模式</text>
  <text x="802" y="351" font-size="16" fill="#102A2B" text-anchor="middle">麥克風圖示是聽寫</text>
