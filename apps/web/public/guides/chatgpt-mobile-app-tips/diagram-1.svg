  <circle cx="88" cy="158" r="22" fill="#0D6B68"/>
  <text x="88" y="166" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="122" y="166" font-size="20" font-weight="700" fill="#0B4F4D">拍照提問</text>
  <text x="122" y="190" font-size="15" fill="#5C6B6B">Ask with a photo</text>
  <rect x="154" y="222" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><rect x="180" y="212" width="28" height="12" rx="4" fill="#0D6B68"/><circle cx="194" cy="248" r="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><circle cx="194" cy="248" r="6" fill="#0D6B68"/>
  <text x="194" y="323" font-size="16" fill="#102A2B" text-anchor="middle">按加號拍照或選相簿</text>
  <text x="194" y="351" font-size="16" fill="#102A2B" text-anchor="middle">藥袋、菜單、公告直接問</text>
  <text x="194" y="379" font-size="16" fill="#102A2B" text-anchor="middle">免費版可用，有額度上限</text>

