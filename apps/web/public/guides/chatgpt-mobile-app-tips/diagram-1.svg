  <rect x="1080" y="206" width="52" height="80" rx="8" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><rect x="1096" y="214" width="20" height="4" rx="2" fill="#D97A2B"/><path d="M 1097 248 v -8 a 9 9 0 0 1 18 0 v 8" fill="none" stroke="#D97A2B" stroke-width="4"/><rect x="1092" y="248" width="28" height="22" rx="4" fill="#D97A2B"/>
  <text x="1106" y="323" font-size="16" fill="#102A2B" text-anchor="middle">設定 → Voice 開背景對話</text>
  <text x="1106" y="351" font-size="16" fill="#102A2B" text-anchor="middle">Live 語音顯示在鎖定畫面</text>
  <text x="1106" y="379" font-size="16" fill="#102A2B" text-anchor="middle">有動態島的機型也會顯示</text>

  <!-- 5 Siri 提問 -->
  <rect x="1264" y="118" width="292" height="300" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
