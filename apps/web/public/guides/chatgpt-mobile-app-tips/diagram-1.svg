  <rect x="1364" y="212" width="60" height="44" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><path d="M 1376 256 L 1380 270 L 1390 256 Z" fill="#2E7D5B"/><circle cx="1380" cy="234" r="4" fill="#2E7D5B"/><circle cx="1394" cy="234" r="4" fill="#2E7D5B"/><circle cx="1408" cy="234" r="4" fill="#2E7D5B"/><rect x="1428" y="212" width="22" height="40" rx="11" fill="#2E7D5B"/><path d="M 1420 240 a 19 19 0 0 0 38 0" fill="none" stroke="#2E7D5B" stroke-width="4"/><line x1="1439" y1="259" x2="1439" y2="272" stroke="#2E7D5B" stroke-width="4"/><line x1="1427" y1="272" x2="1451" y2="272" stroke="#2E7D5B" stroke-width="4"/>
