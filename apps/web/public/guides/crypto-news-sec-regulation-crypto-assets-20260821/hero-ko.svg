<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">SEC, Regulation Crypto Assets 제안: 모집 면제 둘과 세이프 하버 하나, 아직 미확정</title><desc id="desc">오리지널 일러스트: 왼쪽의 봉투 두 개가 각각 화살표로 가운데 점선 테두리 문서를 가리키며, 모으고 있는 공개 의견과 아직 확정되지 않은 초안을 나타낸다. 문서 오른쪽에서는 점선 화살표가 달력으로 이어져 의견 기간을 나타낸다</desc>
