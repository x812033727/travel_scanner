<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">暗号資産募集規則案の四つの要点</title><desc id="desc">Regulation Crypto Assets草案の四つの要点：文書の性質が提案規則であること、証券法第5条の登録義務を免除する二つの免除、Rule 103の十類型の開示、そして条件を満たしたときだけ適用される投資契約のセーフハーバー。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">暗号資産募集規則案の四つの要点</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">文書の性質</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">提案規則で、最終規則ではない</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">二つの免除</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">500万ドルと7,500万ドル</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Rule 103</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">十類型の開示、リスクは具体的に</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">セーフハーバー</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">条件を満たしたときだけ</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 作図 2026</text></svg>