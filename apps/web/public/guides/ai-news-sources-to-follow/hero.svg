<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一手來源匯集成一份清單 / First-party sources gathered into one list</title>
<desc id="desc">左邊是七條長短不一的彩色橫線，每條左端各有一個圓點，代表分散的官方來源；七條細線往右收攏，匯進畫面中央一個深綠色的粗圓環，圓環右上有一段橘色弧線，環內是三條藍色短橫線；圓環右側再分出三條線，連到右邊三張白底藍框的卡片，每張卡片裡有兩條灰線。畫面下方置中寫著「一手來源清單」六個字。整張圖用圓、線與圓角矩形構成，沒有任何標誌、介面或人物。</desc>
