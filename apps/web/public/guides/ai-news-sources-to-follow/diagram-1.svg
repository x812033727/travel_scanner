<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一週 30 分鐘追 AI 新聞的流程 / A 30-minute weekly routine for first-party AI news</title>
<desc id="desc">四個步驟由左到右：第一步掃標題，用 10 分鐘把 10 個官方 RSS 的新標題看過一遍，只看標題與日期；第二步讀原文，用 10 分鐘挑 3 則跟自己有關的，開官方那一頁讀完；第三步查規格，用 5 分鐘到模型卡、system card 與釋出說明上對一次日期；第四步記一行，用 5 分鐘寫下日期、官方網域與對自己的影響，一則只寫一行，合計 30 分鐘。下方列出每一則都要能填的三格：發布日期、官方網址、原文那一句，填不出來就先不要記。最下面一排提醒：媒體轉述、創作者摘要與第三方電子報一律不列；官網查不到對應頁面的消息先當成還沒確認。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs>
<text x="50" y="52" font-size="30" font-weight="700" fill="#102A2B">一週 30 分鐘追 AI 新聞</text>
<text x="50" y="84" font-size="18" fill="#5C6B6B">A 30-minute weekly routine for first-party AI news</text>
<rect x="50" y="125" width="320" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="210" y="163" font-size="16" fill="#5C6B6B" text-anchor="middle">第一步</text>
<text x="210" y="208" font-size="27" font-weight="700" fill="#102A2B" text-anchor="middle">掃標題</text>
<text x="210" y="252" font-size="25" font-weight="700" fill="#0D6B68" text-anchor="middle">10 分鐘</text>
<text x="210" y="296" font-size="16" fill="#5C6B6B" text-anchor="middle">打開閱讀器</text>
<text x="210" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">只看標題與日期</text>
<line x1="76" y1="344" x2="344" y2="344" stroke="#E3F0EF" stroke-width="3"/>
<text x="210" y="380" font-size="17" fill="#2F6F9F" text-anchor="middle">10 個官方 RSS</text>
<line x1="380" y1="270" x2="427" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="443" y="125" width="320" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="603" y="163" font-size="16" fill="#5C6B6B" text-anchor="middle">第二步</text>
<text x="603" y="208" font-size="27" font-weight="700" fill="#102A2B" text-anchor="middle">讀原文</text>
<text x="603" y="252" font-size="25" font-weight="700" fill="#0D6B68" text-anchor="middle">10 分鐘</text>
<text x="603" y="296" font-size="16" fill="#5C6B6B" text-anchor="middle">挑 3 則跟自己有關的</text>
<text x="603" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">開官方那一頁讀完</text>
<line x1="469" y1="344" x2="737" y2="344" stroke="#E3F0EF" stroke-width="3"/>
<text x="603" y="380" font-size="17" fill="#2F6F9F" text-anchor="middle">官方新聞頁原文</text>
<line x1="773" y1="270" x2="820" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="836" y="125" width="320" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="996" y="163" font-size="16" fill="#5C6B6B" text-anchor="middle">第三步</text>
<text x="996" y="208" font-size="27" font-weight="700" fill="#102A2B" text-anchor="middle">查規格</text>
<text x="996" y="252" font-size="25" font-weight="700" fill="#0D6B68" text-anchor="middle">5 分鐘</text>
<text x="996" y="296" font-size="16" fill="#5C6B6B" text-anchor="middle">模型卡與 system card</text>
<text x="996" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">釋出說明對一次日期</text>
<line x1="862" y1="344" x2="1130" y2="344" stroke="#E3F0EF" stroke-width="3"/>
<text x="996" y="380" font-size="17" fill="#2F6F9F" text-anchor="middle">模型卡、釋出說明</text>
<line x1="1166" y1="270" x2="1213" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1229" y="125" width="320" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1389" y="163" font-size="16" fill="#5C6B6B" text-anchor="middle">第四步</text>
<text x="1389" y="208" font-size="27" font-weight="700" fill="#102A2B" text-anchor="middle">記一行</text>
<text x="1389" y="252" font-size="25" font-weight="700" fill="#0D6B68" text-anchor="middle">5 分鐘</text>
<text x="1389" y="296" font-size="16" fill="#5C6B6B" text-anchor="middle">日期、官方網域、影響</text>
<text x="1389" y="322" font-size="16" fill="#5C6B6B" text-anchor="middle">一則只寫一行</text>
<line x1="1255" y1="344" x2="1523" y2="344" stroke="#E3F0EF" stroke-width="3"/>
<text x="1389" y="380" font-size="17" fill="#2F6F9F" text-anchor="middle">自己的一行筆記</text>
<text x="50" y="446" font-size="19" fill="#102A2B">每一則都要能填的三格，填不出來就先不要記</text>
<rect x="50" y="475" width="473" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="286" y="527" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">發布日期</text>
<text x="286" y="570" font-size="17" fill="#5C6B6B" text-anchor="middle">官方頁上標的那一天</text>
<rect x="563" y="475" width="473" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="799" y="527" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">官方網址</text>
<text x="799" y="570" font-size="17" fill="#5C6B6B" text-anchor="middle">發布者自己的網域</text>
<rect x="1076" y="475" width="473" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1312" y="527" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">原文那一句</text>
<text x="1312" y="570" font-size="17" fill="#5C6B6B" text-anchor="middle">規格與限制的原話</text>
<rect x="50" y="660" width="1500" height="130" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="80" y="704" font-size="20" font-weight="700" fill="#B8442D">不列進清單的東西</text>
<text x="80" y="740" font-size="18" fill="#102A2B">媒體轉述、創作者摘要、第三方電子報一律不列，清單上只放發布者自己的網域。</text>
<text x="80" y="770" font-size="18" fill="#5C6B6B">官網查不到對應頁面的消息，先當成還沒確認，不要因為很多人轉發就當真。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
