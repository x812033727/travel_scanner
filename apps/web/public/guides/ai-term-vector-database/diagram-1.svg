<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">向量與條件要一起查</title><desc id="desc">器材原文和向量存入資料庫，查詢向量搭配可借狀態與權限篩選，回傳可追查的候選器材</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">向量與條件要一起查</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Vector Database</text><path d="M 410 300 L 615 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 410 650 L 615 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 965 435 L 1160 435" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="220" width="330" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="294" font-size="28" fill="#102A2B" text-anchor="middle">器材資料</text><text x="245" y="337" font-size="22" fill="#5C6B6B" text-anchor="middle">原文、向量、版本</text><rect x="80" y="570" width="330" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="644" font-size="28" fill="#102A2B" text-anchor="middle">查詢條件</text><text x="245" y="687" font-size="22" fill="#5C6B6B" text-anchor="middle">語意與借用權限</text><rect x="625" y="335" width="340" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="429" font-size="28" fill="#102A2B" text-anchor="middle">向量資料庫</text><text x="795" y="472" font-size="22" fill="#5C6B6B" text-anchor="middle">索引及篩選</text><rect x="1170" y="350" width="330" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="429" font