<svg xmlns="http://www.w3.org/2000/svg" lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <title id="title">ハノイからハロン湾へ：2つの旅客港と8航路の観光料 / Hanoi to Ha Long Bay: the two cruise ports and the eight route fees</title>
  <desc id="desc">左側にハノイがあり、東へ向かう矢印がハロン市とバイチャイへ伸び、途中にバスまたは船会社送迎と記されています。ハロン市の枠内には乗船港が2か所あり、トゥアンチャウ国際旅客港と、バイチャイ海岸通り沿いでSun Worldハロンから500mに位置するハロン国際クルーズ港が並んでいます。右側にはハロン湾の石灰岩の島々と遊覧船が描かれ、湾の南側にはハイフォン市のランハ湾・カットバ島・Gia Luận桟橋が示されており、破線はVHL5とVHL6の終点方向を表します（料金や規定はハイフォン市の公式発表に準拠）。画面右半分は8航路の観光料一覧で、単位は1人1回あたりのベトナムドンです。VHL1が250,000、VHL2が250,000、VHL3が200,000、VHL4が200,000、VHL5が250,000、VHL6が1日あたり150,000、VHL7が探検型クルーズ限定で600,000、VHL8が70,000です。その下の枠には宿泊券の料金として、航路2が1泊550,000・2泊750,000、航路3・4が1泊500,000・2泊650,000と記載されています。最下段には出港時間帯として、夏期は05:00出港・20:00帰港、冬期は05:30出港・19:00帰港と示されています。方角と距離は模式的なもので縮尺は正確ではありません。</desc>
