<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans',Arial,sans-serif">
  <title id="title">Hanoi to Ha Long Bay: Two Cruise Ports and Eight Route Sightseeing Fees</title>
  <desc id="desc">On the left is Hanoi, with an arrow pointing east to Ha Long City and Bai Chay labeled Bus or cruise operator transfer. Inside the Ha Long City box are the two embarkation ports: Tuan Chau International Cruise Port and HaLong International Cruise Port, with the latter located on the Bai Chay coastal road 500 m from Sun World Ha Long. To the right is Ha Long Bay with limestone karsts and a cruise boat; south of the bay is Hai Phong, showing Lan Ha Bay, Cat Ba Island, and Gia Luan Pier, with a dashed arrow indicating the direction of VHL5 and VHL6 endpoints and noting that Hai Phong City sets its own fees and rules. The right half compares sightseeing fees across all eight routes in VND per person per visit: VHL1 250,000, VHL2 250,000, VHL3 200,000, VHL4 200,000, VHL5 250,000, VHL6 150,000 per day, VHL7 600,000 for explorer cruises only, and VHL8 70,000 for the coastal route. Below it, a smaller box lists overnight tickets: Route 2 is 550,000 for 1 night and 750,000 for 2 nights; Routes 3 and 4 are 500,000 for 1 night and 650,000 for 2 nights. A bottom banner shows port departure windows: summer 05:00 departure and 20:00 return, winter 05:30 departure and 19:00 return. Directions and distances are schematic and not to scale.</desc>
