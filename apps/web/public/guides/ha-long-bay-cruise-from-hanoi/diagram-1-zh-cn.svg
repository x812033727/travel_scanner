<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="title">河内到下龙湾：两个港口与八条航线的观光费 / Hanoi to Ha Long Bay: the two cruise ports and the eight route fees</title>
  <desc id="desc">左侧是河内，往东一支箭头指向下龙市与拜寨，途中标明大巴或游船公司接送。下龙市方框内有两个登船港口：巡洲国际客船港与下龙国际客船港，后者位于拜寨海岸路上，距 Sun World 下龙 500 米。右侧是下龙湾的石灰岩岛群与游船，海湾南侧标出海防市的兰下湾、吉婆岛与 Gia Luận 码头，虚线表示 VHL5 与 VHL6 的终点方向，费用与规定以海防市公告为准。画面右半部分是八条航线的观光费对照，单位为越南盾每人每次：VHL1 为 250,000、VHL2 为 250,000、VHL3 为 200,000、VHL4 为 200,000、VHL5 为 250,000、VHL6 为 150,000 并按每日计、VHL7 为 600,000 且仅适用探索型游船、VHL8 为 70,000。下方小框列出过夜票：航线 2 一晚 550,000、两晚 750,000；航线 3、4 一晚 500,000、两晚 650,000。底部一行标明出港时段：夏季 05:00 出港、20:00 回港；冬季 05:30 出港、19:00 回港。方向与距离均为示意，不按比例。</desc>
  <defs>
