<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="title">하노이에서 하롱베이까지: 두 여객항과 8개 항로 관광비 / Hanoi to Ha Long Bay: the two cruise ports and the eight route fees</title>
  <desc id="desc">왼쪽에는 하노이가 있고 동쪽으로 향하는 화살표가 하롱시·바이짜이로 이어지며, 경로 위에 버스 또는 선사 픽업이 표시되어 있습니다. 하롱시 구역 안에는 두 곳의 승선 항구가 있습니다. 뚜언쩌우 국제 여객항과 하롱 국제 크루즈항이며, 하롱 국제 크루즈항은 바이짜이 해안도로에 있고 Sun World 하롱에서 500m 떨어져 있습니다. 오른쪽에는 하롱베이의 석회암 섬 군락과 유람선이 그려져 있고, 만 남쪽에는 하이퐁시의 란하베이, 깟바섬, Gia Luận 선착장이 표시되어 있습니다. 주황색 점선은 VHL5와 VHL6의 종점 방향을 뜻하며 요금과 규정은 하이퐁시 공고 기준입니다. 화면 오른쪽 절반은 8개 항로의 관광비 비교표로, 단위는 1인 1회 베트남 동(VND)입니다. VHL1 250,000, VHL2 250,000, VHL3 200,000, VHL4 200,000, VHL5 250,000, VHL6 150,000(1일 기준), VHL7 600,000(탐험형 크루즈), VHL8 70,000(연안 노선)입니다. 아래 상자에는 숙박권 요금이 정리되어 있습니다. 항로 2는 1박 550,000·2박 750,000, 항로 3·4는 1박 500,000·2박 650,000입니다. 하단 바에는 출항 시간대가 적혀 있습니다. 하절기 05:00 출항·20:00 귀항, 동절기 05:30 출항·19:00 귀항입니다. 방향과 거리는 안내용 개념도이며 실제 축척과 다릅니다.</desc>
