  <text x="145" y="398" text-anchor="middle" font-size="17" fill="#5C6B6B">Hà Nội</text>

  <line x1="234" y1="377" x2="392" y2="377" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="313" y="358" text-anchor="middle" font-size="15" fill="#5C6B6B">巴士或遊船公司接送</text>

  <rect x="400" y="280" width="350" height="215" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="575" y="313" text-anchor="middle" font-size="19" font-weight="700" fill="#102A2B">下龍市／拜寨 Bãi Cháy</text>
  <rect x="414" y="327" width="322" height="58" rx="10" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
