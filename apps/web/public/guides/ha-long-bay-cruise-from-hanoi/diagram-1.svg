    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="48" y="52" font-size="30" font-weight="700" fill="#102A2B">河內到下龍灣：兩個港口與八條航線的觀光費</text>
  <text x="48" y="84" font-size="18" fill="#5C6B6B">Hanoi to Ha Long Bay: two cruise ports and the eight route fees</text>
