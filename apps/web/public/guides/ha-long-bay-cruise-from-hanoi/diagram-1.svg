  <text x="798" y="666" font-size="16" fill="#5C6B6B">蘭下灣 vịnh Lan Hạ</text>
  <text x="798" y="694" font-size="16" fill="#5C6B6B">吉婆島 Cát Bà、Gia Luận 碼頭</text>
  <text x="798" y="722" font-size="15" fill="#5C6B6B">費用與規定以海防市公告為準</text>

