<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">河內到下龍灣：兩個港口與八條航線的觀光費 / Hanoi to Ha Long Bay: the two cruise ports and the eight route fees</title>
  <desc id="desc">左側是河內，往東一支箭頭到下龍市與拜寨，路上寫著巴士或遊船公司接送。下龍市方塊裡有兩個上船的港口：巡州國際客船港，以及下龍國際客船港，後者在拜寨海岸路上、離 Sun World 下龍 500 公尺。右邊是下龍灣的石灰岩島群與遊船，灣的南側標出海防市的蘭下灣、吉婆島與 Gia Luận 碼頭，虛線表示 VHL5 與 VHL6 的終點方向，費用與規定以海防市公告為準。畫面右半是八條航線的觀光費對照，單位是越南盾每人每次：VHL1 是 250,000、VHL2 是 250,000、VHL3 是 200,000、VHL4 是 200,000、VHL5 是 250,000、VHL6 是 150,000 並按每日計、VHL7 是 600,000 且只適用探索型遊船、VHL8 是 70,000。下面一個小框寫過夜票：航線 2 一晚 550,000、兩晚 750,000；航線 3、4 一晚 500,000、兩晚 650,000。底部一行寫出港時段：夏季 05:00 出港、20:00 回港；冬季 05:30 出港、19:00 回港。方向與距離為示意，不按比例。</desc>
