  <line x1="1116" y1="266" x2="1540" y2="266" stroke="#E3F0EF" stroke-width="2"/>

  <text x="1120" y="294" font-size="18" fill="#102A2B">VHL2</text>
  <text x="1380" y="294" text-anchor="end" font-size="18" font-weight="700" fill="#102A2B">250,000</text>
  <line x1="1116" y1="310" x2="1540" y2="310" stroke="#E3F0EF" stroke-width="2"/>

  <text x="1120" y="338" font-size="18" fill="#102A2B">VHL3</text>
  <text x="1380" y="338" text-anchor="end" font-size="18" font-weight="700" fill="#102A2B">200,000</text>
  <line x1="1116" y1="354" x2="1540" y2="354" stroke="#E3F0EF" stroke-width="2"/>

  <text x="1120" y="382" font-size="18" fill="#102A2B">VHL4</text>
  <text x="1380" y="382" text-anchor="end" font-size="18" font-weight="700" fill="#102A2B">200,000</text>
  <line x1="1116" y1="398" x2="1540" y2="398" stroke="#E3F0EF" stroke-width="2"/>

  <text x="1120" y="426" font-size="18" fill="#102A2B">VHL5</text>
  <text x="1380" y="426" text-anchor="end" font-size="18" font-weight="700" fill="#102A2B">250,000</text>
  <line x1="1116" y1="442" x2="1540" y2="442" stroke="#E3F0EF" stroke-width="2"/>

  <text x="1120" y="470" font-size="18" fill="#102A2B">VHL6</text>
  <text x="1380" y="470" text-anchor="end" font-size="18" font-weight="700" fill="#102A2B">150,000</text>
  <text x="1396" y="470" font-size="15" fill="#5C6B6B">每日</text>
