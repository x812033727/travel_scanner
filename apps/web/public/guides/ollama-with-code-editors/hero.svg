<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一台電腦裡的補全、聊天與檢索 / One machine, three model roles</title>
  <desc id="desc">簡單幾何插圖。畫面中央有一圈深綠色的虛線圓角外框，代表同一台電腦，裡面的東西都不出這個框。框內左邊是一個淺綠底的圓角方塊，像一片螢幕，方塊裡只有一根直立的深綠色游標與一條短橫線，螢幕下方有短短的支架與底座。一條粗灰線從螢幕往右接到中間一個藍框方塊，方塊中央是實心的藍色正方形、四邊有短接腳，代表在自己電腦上執行的模型服務。方塊右側再分出三條線，接到右邊上中下三個實心圓，由上而下分別是綠色、橘色與藍色，代表聊天、補全與檢索三種角色各用一個模型。畫面底部有一行字：模型就在這台電腦裡。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- the machine boundary: everything inside stays local -->
  <rect x="80" y="120" width="1440" height="530" rx="44" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" stroke-dasharray="26 18"/>

  <!-- screen on a stand -->
  <rect x="170" y="218" width="400" height="270" rx="26" fill="#E3F0EF" stroke="#0D6B68" stroke-width="12"/>
  <rect x="256" y="308" width="20" height="90" rx="10" fill="#0D6B68"/>
  <rect x="300" y="343" width="180" height="20" rx="10" fill="#5C6B6B"/>
  <rect x="326" y="488" width="88" height="42" fill="#102A2B"/>
  <rect x="268" y="530" width="204" height="22" rx="11" fill="#102A2B"/>

  <!-- link from the screen to the local runtime -->
  <rect x="612" y="374" width="112" height="22" rx="11" fill="#5C6B6B"/>
  <path d="M 716 360 L 768 385 L 716 410 z" fill="#5C6B6B"/>

  <!-- local runtime: a chip -->
  <rect x="750" y="320" width="38" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="750" y="376" width="38" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="750" y="432" width="38" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="876" y="239" width="18" height="38" rx="9" fill="#5C6B6B"/>
  <rect x="876" y="493" width="18" height="38" rx="9" fill="#5C6B6B"/>
  <rect x="786" y="275" width="220" height="220" rx="26" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="12"/>
  <rect x="846" y="335" width="100" height="100" rx="14" fill="#2F6F9F"/>

  <!-- fan out to three model roles -->
  <path d="M 1006 385 L 1120 385 L 1120 228 L 1248 228" fill="none" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1006 385 L 1248 385" fill="none" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 1006 385 L 1120 385 L 1120 542 L 1248 542" fill="none" stroke="#5C6B6B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="1322" cy="228" r="74" fill="#2E7D5B"/>
  <circle cx="1322" cy="385" r="74" fill="#D97A2B"/>
  <circle cx="1322" cy="542" r="74" fill="#2F6F9F"/>

  <text x="800" y="792" text-anchor="middle" font-size="58" font-weight="700" fill="#102A2B">模型就在這台電腦裡</text>
</svg>
