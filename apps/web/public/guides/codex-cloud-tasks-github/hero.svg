<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">雲端平行跑任務 / Parallel work in the cloud</title>
  <desc id="desc">抽象插圖。畫面上半部是一朵由圓角形狀組成的雲，雲裡並排放著三張圓角任務卡，每張卡上有幾條代表程式碼的短線，其中一張卡右上角有一個進行中的圓形記號。雲的下方有三條線往下匯流成一條，接到一個圓角方框，方框裡有一個打勾記號，代表審查過後才合併。畫面左右兩側各有一個淡色圓形點綴，底部有一行短標題文字。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <circle cx="180" cy="210" r="70" fill="#E3F0EF"/>
  <circle cx="1430" cy="250" r="52" fill="#E6F0F7"/>
  <circle cx="1490" cy="640" r="34" fill="#E3F0EF"/>
  <circle cx="120" cy="640" r="26" fill="#E6F0F7"/>

  <!-- cloud -->
  <g fill="#FFFFFF" stroke="#0D6B68" stroke-width="8">
    <rect x="330" y="180" width="940" height="300" rx="150"/>
  </g>
  <g fill="#FFFFFF" stroke="#0D6B68" stroke-width="8">
    <circle cx="560" cy="200" r="110"/>
    <circle cx="800" cy="160" r="140"/>
    <circle cx="1040" cy="205" r="105"/>
  </g>
  <rect x="346" y="196" width="908" height="268" rx="134" fill="#FFFFFF"/>

  <!-- three task cards inside the cloud -->
  <g stroke-width="6">
    <rect x="420" y="252" width="240" height="164" rx="20" fill="#E3F0EF" stroke="#0D6B68"/>
    <rect x="680" y="252" width="240" height="164" rx="20" fill="#E6F0F7" stroke="#2F6F9F"/>
    <rect x="940" y="252" width="240" height="164" rx="20" fill="#E3F0EF" stroke="#0D6B68"/>
  </g>
  <g stroke="#5C6B6B" stroke-width="8" stroke-linecap="round">
    <line x1="452" y1="296" x2="600" y2="296"/>
    <line x1="452" y1="334" x2="556" y2="334"/>
    <line x1="452" y1="372" x2="620" y2="372"/>
    <line x1="712" y1="296" x2="860" y2="296"/>
    <line x1="712" y1="334" x2="800" y2="334"/>
    <line x1="712" y1="372" x2="836" y2="372"/>
    <line x1="972" y1="296" x2="1120" y2="296"/>
    <line x1="972" y1="334" x2="1060" y2="334"/>
    <line x1="972" y1="372" x2="1136" y2="372"/>
  </g>
  <circle cx="1156" cy="276" r="18" fill="#D97A2B"/>

  <!-- three streams merging into one -->
  <g fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round">
    <path d="M 540 480 L 540 540 Q 540 580 620 580 L 800 580"/>
    <path d="M 800 480 L 800 580"/>
    <path d="M 1060 480 L 1060 540 Q 1060 580 980 580 L 800 580"/>
    <path d="M 800 580 L 800 660"/>
  </g>
  <circle cx="540" cy="480" r="16" fill="#2E7D5B"/>
  <circle cx="800" cy="480" r="16" fill="#2E7D5B"/>
  <circle cx="1060" cy="480" r="16" fill="#2E7D5B"/>

  <!-- merged result: a reviewed change -->
  <rect x="640" y="660" width="320" height="120" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="8"/>
  <path d="M 752 722 L 788 756 L 856 686" fill="none" stroke="#2E7D5B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="800" y="856" text-anchor="middle" font-size="52" font-weight="bold" fill="#102A2B">雲端平行跑任務</text>
</svg>
