<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Codex 雲端任務流程 / Codex cloud task flow</title>
  <desc id="desc">六個步驟的流程圖。上排由左到右是連 GitHub（挑 Codex 能存取的 repo，私有 repo 也可以）、設定環境（容器 universal，設定腳本裝相依）、丟任務（選環境，描述你要的結果）。中間是平行區塊：同時開幾個雲端聊天，各自一個容器與一份檢出，例如聊天 A 修錯誤、聊天 B 小重構、聊天 C 更新文件。下排由左到右是看 diff（摘要、改過的檔案、工作記錄）、開 PR（在留言寫 review 指令，只標 P0 與 P1 問題）、本機驗證（用 codex apply 套用 diff，合併前跑測試）。最下方三個提醒：代理階段預設沒有網路，設定腳本那段才裝得了套件；密鑰只給設定腳本，代理階段開始前移除；容器快取最多 12 小時，改設定會自動失效。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">Codex 雲端任務：從連 GitHub 到合併前驗證</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Codex cloud: connect, configure, delegate, review, ship</text>

  <!-- Row 1 -->
  <rect x="60" y="120" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="167" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">1 連 GitHub</text>
  <text x="290" y="198" font-size="16" fill="#5C6B6B" text-anchor="middle">挑 Codex 能存取的 repo</text>
  <text x="290" y="224" font-size="16" fill="#5C6B6B" text-anchor="middle">私有 repo 也可以</text>

  <rect x="570" y="120" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="167" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">2 設定環境</text>
  <text x="800" y="198" font-size="16" fill="#5C6B6B" text-anchor="middle">容器映像 universal</text>
  <text x="800" y="224" font-size="16" fill="#5C6B6B" text-anchor="middle">設定腳本裝相依套件</text>

  <rect x="1080" y="120" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1310" y="167" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">3 丟任務</text>
  <text x="1310" y="198" font-size="16" fill="#5C6B6B" text-anchor="middle">選環境，描述要的結果</text>
  <text x="1310" y="224" font-size="16" fill="#5C6B6B" text-anchor="middle">也能從 PR 留言開始</text>

  <line x1="524" y1="185" x2="562" y2="185" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1034" y1="185" x2="1072" y2="185" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1310" y1="254" x2="1310" y2="294" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Parallel band -->
  <rect x="60" y="300" width="1480" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="800" y="336" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">平行：同時開幾個雲端聊天，各自一個容器與一份檢出</text>

  <rect x="90" y="356" width="440" height="90" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="310" y="392" font-size="18" font-weight="bold" fill="#102A2B" text-anchor="middle">聊天 A</text>
  <text x="310" y="422" font-size="16" fill="#5C6B6B" text-anchor="middle">修錯誤並補測試</text>

  <rect x="580" y="356" width="440" height="90" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="392" font-size="18" font-weight="bold" fill="#102A2B" text-anchor="middle">聊天 B</text>
  <text x="800" y="422" font-size="16" fill="#5C6B6B" text-anchor="middle">小範圍重構</text>

  <rect x="1070" y="356" width="440" height="90" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1290" y="392" font-size="18" font-weight="bold" fill="#102A2B" text-anchor="middle">聊天 C</text>
  <text x="1290" y="422" font-size="16" fill="#5C6B6B" text-anchor="middle">更新文件</text>

  <path d="M 800 474 L 800 496 L 290 496 L 290 516" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Row 3 -->
  <rect x="60" y="520" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="290" y="567" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">4 看 diff</text>
  <text x="290" y="598" font-size="16" fill="#5C6B6B" text-anchor="middle">摘要與改過的檔案</text>
  <text x="290" y="624" font-size="16" fill="#5C6B6B" text-anchor="middle">工作記錄可以展開</text>

  <rect x="570" y="520" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="567" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">5 開 PR</text>
  <text x="800" y="598" font-size="16" fill="#5C6B6B" text-anchor="middle">在留言寫 review 指令</text>
  <text x="800" y="624" font-size="16" fill="#5C6B6B" text-anchor="middle">只標 P0 與 P1 問題</text>

  <rect x="1080" y="520" width="460" height="130" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1310" y="567" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">6 本機驗證</text>
  <text x="1310" y="598" font-size="16" fill="#5C6B6B" text-anchor="middle">codex apply 套用 diff</text>
  <text x="1310" y="624" font-size="16" fill="#5C6B6B" text-anchor="middle">合併前自己跑測試</text>

  <line x1="524" y1="585" x2="562" y2="585" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1034" y1="585" x2="1072" y2="585" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <rect x="60" y="700" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="290" y="743" font-size="18" font-weight="bold" fill="#B8442D" text-anchor="middle">代理階段預設沒有網路</text>
  <text x="290" y="775" font-size="16" fill="#5C6B6B" text-anchor="middle">設定腳本那段才裝得了套件</text>
  <text x="290" y="801" font-size="16" fill="#5C6B6B" text-anchor="middle">要連外的測試會失敗</text>

  <rect x="570" y="700" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="743" font-size="18" font-weight="bold" fill="#D97A2B" text-anchor="middle">密鑰只給設定腳本</text>
  <text x="800" y="775" font-size="16" fill="#5C6B6B" text-anchor="middle">代理階段開始前會被移除</text>
  <text x="800" y="801" font-size="16" fill="#5C6B6B" text-anchor="middle">不要把金鑰貼進提示詞</text>

  <rect x="1080" y="700" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1310" y="743" font-size="18" font-weight="bold" fill="#2E7D5B" text-anchor="middle">容器快取最多 12 小時</text>
  <text x="1310" y="775" font-size="16" fill="#5C6B6B" text-anchor="middle">改設定或密鑰會自動失效</text>
  <text x="1310" y="801" font-size="16" fill="#5C6B6B" text-anchor="middle">也可以手動重設快取</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
