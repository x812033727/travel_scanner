<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">大阪、京都、神戶到姬路的三種鐵路方式與姬路駅到城、好古園的步行路線 / Rail routes to Himeji and the walk from the station</title>
  <desc id="desc">三條路線由左往右會合在姬路：山陽新幹線從新大阪約 28 分；JR 新快速從京都約 1 小時 25 分、大阪約 57 分、三ノ宮約 37 分；阪神・山陽直通特急從阪神大阪梅田與神戶三宮開到山陽姫路，一日券 2,350 與 1,590 日圓。右側是姬路駅走到姬路城 20 分、好古園 15 分、大手門前到好古園 5 分，以及 210 日圓的觀光迴圈巴士。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#102A2B">大阪・京都・神戸 → 姫路　三種方式と駅からの歩き方</text>
  <text x="80" y="122" font-size="22" fill="#5C6B6B">Osaka / Kyoto / Kobe → Himeji · 車程為官網概略時間 · 運賃以官網為準</text>

  <!-- Lane 1: Shinkansen -->
  <line x1="380" y1="260" x2="930" y2="260" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round"/>
  <text x="655" y="238" font-size="24" font-weight="700" fill="#6B4A3A" text-anchor="middle">山陽新幹線 Shinkansen 約 28 分</text>
  <circle cx="380" cy="260" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"/>
  <text x="380" y="305" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">新大阪 Shin-Osaka</text>
  <text x="705" y="292" font-size="18" fill="#5C6B6B" text-anchor="middle">運賃之外要加特急料金 · 關西廣域周遊券可搭</text>

  <!-- Lane 2: JR Special Rapid -->
  <line x1="150" y1="420" x2="930" y2="420" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <text x="540" y="395" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">JR 新快速 Special Rapid · 免特急料金・不用預約</text>
  <circle cx="150" cy="420" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="380" cy="420" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="720" cy="420" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <text x="150" y="465" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">京都 Kyoto</text>
  <text x="150" y="493" font-size="20" fill="#5C6B6B" text-anchor="middle">→ 姫路 約 1 小時 25 分</text>
  <text x="380" y="465" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">大阪 Osaka</text>
  <text x="380" y="493" font-size="20" fill="#5C6B6B" text-anchor="middle">→ 姫路 約 57 分</text>
  <text x="720" y="465" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">三ノ宮 Sannomiya</text>
  <text x="720" y="493" font-size="20" fill="#5C6B6B" text-anchor="middle">→ 姫路 約 37 分</text>

  <!-- Lane 3: Hanshin / Sanyo direct limited express -->
  <line x1="380" y1="590" x2="930" y2="590" stroke="#B8442D" stroke-width="12" stroke-linecap="round"/>
  <text x="655" y="565" font-size="24" font-weight="700" fill="#B8442D" text-anchor="middle">阪神・山陽 直通特急 · 免特急料金</text>
  <circle cx="380" cy="590" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <circle cx="720" cy="590" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <text x="380" y="635" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">阪神大阪梅田 Osaka-Umeda</text>
  <text x="380" y="663" font-size="20" fill="#5C6B6B" text-anchor="middle">1day 券 2,350 日圓</text>
  <text x="720" y="635" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">神戸三宮 Kobe-Sannomiya</text>
  <text x="720" y="663" font-size="20" fill="#5C6B6B" text-anchor="middle">1day 券 1,590 日圓</text>
  <text x="655" y="705" font-size="18" fill="#5C6B6B" text-anchor="middle">車程比 JR 久 · 時間以官網時刻表為準 · 終點山陽姫路駅在 JR 站旁</text>

  <!-- Himeji box -->
  <rect x="930" y="215" width="140" height="425" rx="24" fill="#0D6B68"/>
  <text x="1000" y="410" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">姫路</text>
  <text x="1000" y="446" font-size="22" fill="#E6F2F1" text-anchor="middle">Himeji</text>
  <text x="1000" y="500" font-size="18" fill="#E6F2F1" text-anchor="middle">JR 姫路駅</text>
  <text x="1000" y="528" font-size="18" fill="#E6F2F1" text-anchor="middle">山陽姫路駅</text>

  <!-- Station-area panel -->
  <rect x="1110" y="215" width="450" height="525" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1335" y="258" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">姫路駅から歩く From the station</text>
  <line x1="1230" y1="346" x2="1230" y2="664" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
  <line x1="1230" y1="330" x2="1470" y2="470" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
  <line x1="1230" y1="680" x2="1470" y2="470" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1230" cy="330" r="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <circle cx="1470" cy="470" r="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="1230" cy="680" r="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="1230" y="305" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">姫路城 Himeji Castle</text>
  <text x="1470" y="440" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">好古園 Koko-en</text>
  <text x="1255" y="688" font-size="22" font-weight="700" fill="#102A2B">姫路駅 Himeji Sta.</text>
  <text x="1150" y="520" font-size="20" fill="#5C6B6B">大手前通り</text>
  <text x="1150" y="548" font-size="20" fill="#5C6B6B">徒歩 20 分</text>
  <text x="1400" y="372" font-size="18" fill="#5C6B6B" text-anchor="middle">大手門前 → 徒歩 5 分</text>
  <text x="1420" y="610" font-size="20" fill="#5C6B6B" text-anchor="middle">徒歩 15 分</text>
  <text x="1335" y="722" font-size="18" fill="#5C6B6B" text-anchor="middle">ループバス 210 日圓（土日祝 15 分毎）</text>

  <!-- Legend -->
  <g font-size="20" fill="#102A2B">
    <line x1="80" y1="830" x2="140" y2="830" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="152" y="837">JR 新快速</text>
    <line x1="320" y1="830" x2="380" y2="830" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="392" y="837">新幹線 Shinkansen</text>
    <line x1="640" y1="830" x2="700" y2="830" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
    <text x="712" y="837">山陽電鉄・阪神 直通特急</text>
    <line x1="1000" y1="830" x2="1060" y2="830" stroke="#0D6B68" stroke-width="5" stroke-linecap="round"/>
    <text x="1072" y="837">徒歩 Walk</text>
    <text x="1250" y="837" fill="#5C6B6B">© Mokaair 製圖 2026</text>
  </g>
</svg>
