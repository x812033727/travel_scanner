<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">跨系統也要分清任務狀態</title>
<desc id="desc">委派代理先讀能力卡，再交辦查詢；遠端代理要求補人數，補齊後回傳場地清單並標示任務完成。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">跨系統也要分清任務狀態</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Agent2Agent Protocol · 場地詢問</text><path d="M460 260 H590" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 260 H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1315 360 V690 H1000" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M790 590 V360" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="170" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="265" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">能力發現</text><text x="265" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">場地服務 Agent Card</text><rect x="600" y="170" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">建立查詢</text><text x="795" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">日期、用途與時間</text><rect x="1120" y="170" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1315" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">需要輸入</text><text x="1315" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">補參加人數</text><rect x="600" y="600" width="390" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="682" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">任務完成</text><text x="795" y="732" text-anchor="middle" font-size="25" fill="#5C6B6B">候選表與限制條件</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
