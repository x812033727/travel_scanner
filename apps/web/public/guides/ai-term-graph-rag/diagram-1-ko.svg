<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">같은 그래프, 두 가지 질문 범위</title><desc id="desc">원문에서 엔터티와 관계를 추출한 뒤, 한 경로는 특정 엔터티를 따라 로컬 검색을 하고 다른 경로는 커뮤니티 요약을 만들어 전체 주제에 답하는 흐름</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">같은 그래프, 두 가지 질문 범위</text><text x="60" y="84" font-size="18" fill="#5C6B6B">GraphRAG — Microsoft 방식</text><path d="M 360 425 L 470 425" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 770 390 L 930 265" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 770 470 L 930 635" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="90" y="350" width="270" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="225" y="421.5" font-size="28" fill="#102A2B" text-anchor="middle">원본 기록</text><text x="225" y="464.5" font-size="22" fill="#5C6B6B" text-anchor="middle">추적 가능한 문단 보존</text><rect x="480" y="350" width="290" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="625" y="421.5" font-size="28" fill="#102A2B" text-anchor="middle">엔터티와 관계</text><text x="625" y="464.5" font-size="22" fill="#5C6B6B" text-anchor="middle">추출·식별·연결</text><rect x="940" y="180" width="340" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1110" y="249" font-size="28" fill="#102A2B" text-anchor="middle">로컬 검색</text><text x="1110" y="292" font-size="22" fill="#5C6B6B" text-anchor="middle">특정 단체 중심</text><rect x="940" y="570" width="340" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1110" y="639" font-size="28" fill="#102A2B" text-anchor="middle">커뮤니티 요약</text><text x="1110" y="682" font-size="22" fill="#5C6B6B" text-anchor="middle">전체 주제 지원</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
