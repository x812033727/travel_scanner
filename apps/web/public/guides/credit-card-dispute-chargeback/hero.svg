<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">刷卡爭議款 / Disputing a charge on a card statement</title>
  <desc id="desc">一張白色的對帳單卡片立在米色底上，卡片上有幾條深淺不一的橫線代表帳目，其中一列被一個淺綠色的框標示出來，框內有一條深綠色的粗線與一個紅色圓點。一支紅色的放大鏡罩在那一列的右端，鏡柄往右下延伸。右側上方是一個藍框的日曆，兩個掛耳、一片頁首色帶與十二個圓點，其中一個圓點是紅色；右側下方是一個綠框的資料夾，資料夾裡有三條灰色橫線。左上角寫著「刷卡爭議款」五個字。</desc>
