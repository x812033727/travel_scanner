<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">刷卡爭議款的處理路徑 / How a credit card billing dispute is handled</title>
  <desc id="desc">左欄是三種常見情境：盜刷或未經授權、商品未收到或不符、重複扣款或已取消仍請款。三者都匯入中欄同一個動作：向發卡機構提出帳款疑義，要檢具理由與證明文件，可能負擔調單手續費（查明是盜刷則由發卡機構負擔），要不要暫停付款必須另外主張並獲得受理，提出時限以發卡機構公告與契約約定為準，商家有權提出反證，爭議可能來回數月。右欄是兩種結果：爭議成立時該筆帳款沖回、原交易的回饋通常一併收回；爭議不成立時帳款仍須繳付，接著是兩階段——第一階段向金融服務業申訴，業者應於收受申訴之日起三十日內處理並回覆；第二階段向爭議處理機構申請評議，須在收受結果或期限屆滿起六十日內提出，平行途徑還有消保法的申訴與調解以及刑事報案。最下方是整張圖最容易出事的地方：爭議期間不要自行停繳整張帳單。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">刷卡爭議款：三種情境、一個提出動作、兩個出口</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Credit card disputes: what to prepare and where it goes next</text>

  <text x="60" y="136" font-size="20" fill="#5C6B6B">三種常見情境</text>
  <text x="510" y="136" font-size="20" fill="#5C6B6B">共同的提出動作</text>
  <text x="970" y="136" font-size="20" fill="#5C6B6B">兩種結果</text>

  <rect x="60" y="156" width="380" height="142" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="86" y="198" font-size="18" font-weight="700" fill="#102A2B">一、盜刷或未經授權</text>
  <text x="86" y="232" font-size="16" fill="#5C6B6B">卡在身上卻有陌生消費</text>
  <text x="86" y="262" font-size="16" fill="#5C6B6B">先掛失停用，再報案</text>

  <rect x="60" y="322" width="380" height="142" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="86" y="364" font-size="18" font-weight="700" fill="#102A2B">二、商品未收到或不符</text>
  <text x="86" y="398" font-size="16" fill="#5C6B6B">未到貨、貨不對版</text>
  <text x="86" y="428" font-size="16" fill="#5C6B6B">先向商家反映並留紀錄</text>

  <rect x="60" y="488" width="380" height="142" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="86" y="530" font-size="18" font-weight="700" fill="#102A2B">三、重複扣款或已取消</text>
  <text x="86" y="564" font-size="16" fill="#5C6B6B">同一筆消費出現兩次</text>
  <text x="86" y="594" font-size="16" fill="#5C6B6B">取消後仍持續請款</text>

  <line x1="444" y1="227" x2="494" y2="227" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="444" y1="393" x2="494" y2="393" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="444" y1="559" x2="494" y2="559" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="510" y="156" width="390" height="474" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="536" y="204" font-size="20" font-weight="700" fill="#0D6B68">向發卡機構提出帳款疑義</text>
  <text x="536" y="258" font-size="17" fill="#102A2B">・檢具理由與證明文件</text>
  <text x="536" y="300" font-size="17" fill="#102A2B">・可能負擔調單手續費；查明</text>
  <text x="536" y="328" font-size="17" fill="#102A2B">　是盜刷則由發卡機構負擔</text>
  <text x="536" y="372" font-size="17" fill="#102A2B">・要不要暫停付款，要另外</text>
  <text x="536" y="400" font-size="17" fill="#102A2B">　主張並獲得受理</text>
  <text x="536" y="444" font-size="17" fill="#102A2B">・提出時限以發卡機構公告</text>
  <text x="536" y="472" font-size="17" fill="#102A2B">　與契約約定為準</text>
  <text x="536" y="516" font-size="17" fill="#102A2B">・商家有權提出反證，爭議</text>
  <text x="536" y="544" font-size="17" fill="#102A2B">　可能來回數月</text>
  <text x="536" y="588" font-size="17" fill="#5C6B6B">・全程留下書面與日期</text>

  <polyline points="904,393 935,393 935,218 962,218" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <polyline points="904,393 935,393 935,400 962,400" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="970" y="156" width="570" height="124" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="996" y="198" font-size="20" font-weight="700" fill="#2E7D5B">爭議成立</text>
  <text x="996" y="238" font-size="17" fill="#102A2B">該筆帳款沖回；原交易的回饋通常一併收回</text>

  <rect x="970" y="304" width="570" height="326" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="996" y="350" font-size="20" font-weight="700" fill="#B8442D">爭議不成立：帳款仍須繳付</text>

  <rect x="1000" y="378" width="510" height="90" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1026" y="412" font-size="18" font-weight="700" fill="#2F6F9F">第一階段：向金融服務業申訴</text>
  <text x="1026" y="444" font-size="16" fill="#102A2B">業者應於收受申訴之日起三十日內處理並回覆</text>

  <line x1="1255" y1="470" x2="1255" y2="488" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="1000" y="494" width="510" height="90" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1026" y="528" font-size="18" font-weight="700" fill="#2F6F9F">第二階段：向爭議處理機構申請評議</text>
  <text x="1026" y="560" font-size="16" fill="#102A2B">收受結果或期限屆滿起六十日內提出</text>

  <text x="996" y="612" font-size="16" fill="#5C6B6B">平行途徑：消保法的申訴與調解、刑事報案</text>

  <rect x="60" y="672" width="1480" height="134" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="92" y="716" font-size="20" font-weight="700" fill="#B8442D">最容易出事的地方：爭議期間不要自行停繳整張帳單</text>
  <text x="92" y="752" font-size="17" fill="#102A2B">應記載事項要求持卡人於當期繳款截止日前繳付應付帳款或最低應繳金額以上；那一筆要不要暫停付款，要另外主張並獲發卡機構受理。</text>
  <text x="92" y="782" font-size="17" fill="#5C6B6B">自行停繳整張帳單可能被降額度、暫停用卡，並在聯徵中心留下信用不良紀錄。</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
