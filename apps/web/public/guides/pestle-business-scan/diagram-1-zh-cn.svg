<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">PESTLE 六维度观察</title><desc id="desc">六张卡片分别列出政治、经济、社会、科技、法律与环境的核查方向，提醒读者将信号转成具体影响与观察条件。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">PESTLE 六维度观察</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">同一个经营决策，检查不同外部条件与资料限制</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">P 政治</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">政策方向与地区安排</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">核对原始公告状态</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">E 经济</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">物价背景与供应报价</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">不直接代替店家成本</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">S 社会</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">任务习惯与使用限制</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">需求仍要另外研究</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">T 科技</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">新工具与集成条件</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先确认要解决的工作</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">L 法律</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">适用对象及生效时间</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">草案和现行规则分开</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">E 环境</text>
<text x="1088" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">气候资源与服务周转</text>
<text x="1088" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">观测不是未来预报</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">外部信号 → 经营影响 → 待查问题 → 观察与行动条件。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
