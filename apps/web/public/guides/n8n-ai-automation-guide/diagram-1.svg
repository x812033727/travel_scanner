<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">n8n 的一條 AI 工作流 / How an n8n AI workflow fits together</title>
<desc id="desc">流程由左至右分成三段。左邊是觸發節點，可選 n8n Form Trigger、Webhook、Schedule Trigger 或 Chat Trigger，工作流從這裡開始。中間是 AI Agent 節點，它決定要呼叫哪個工具、用什麼順序，官方文件規定至少要接一個工具 sub-node。AI Agent 下方掛著三組 sub-node：模型（chat model）可選 OpenAI Chat Model、Anthropic Chat Model、Google Gemini Chat Model 或本機的 Ollama Chat Model；記憶（memory）最容易上手的是 Simple Memory，也可換成 Redis、Postgres 或 MongoDB 的 Chat Memory 存久一點；工具（tools）包含 Call n8n Workflow Tool、Custom Code Tool、HTTP Request Tool，以及連外部伺服器的 MCP Client Tool。右邊是輸出節點，寄信用 Gmail、通知用 Slack、寫紀錄用 Google Sheets，LINE 則用 HTTP Request 節點。圖下方提醒：金鑰一律建成憑證，不要打在節點欄位裡；AI 節點讀到的外部內容當成不可信輸入，先用測試資料手動執行、看過執行紀錄再發布。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
</marker>
</defs>
