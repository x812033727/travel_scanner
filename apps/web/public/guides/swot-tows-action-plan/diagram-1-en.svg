<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">From SWOT Evidence to TOWS Action</title><desc id="desc">Four columns show question scoping, factor checks, TOWS pairings and completion checks, explaining why priorities and execution responsibilities are still needed after the four-box analysis.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">From SWOT Evidence to TOWS Action</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Separate internal and external factors, then pair, choose and verify</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 30px;">Scope the question</text>
<text x="108.0" y="371" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Decision subject and time frame</text>
<text x="108.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">What to answer?</text>
<text x="108.0" y="475" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Exclude unrelated matters</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Check the factors</text>
<text x="477.0" y="371" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Internal strengths &amp; weaknesses</text>
<text x="477.0" y="423" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">External opportunities &amp; threats</text>
<text x="477.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Each: evidence and date</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Pair for strategy</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">SO and WO</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">ST and WT</text>
<text x="846.0" y="475" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Explain factor connections</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Verify completion</text>
<text x="1215.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Prerequisites and priorities</text>
<text x="1215.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Owners and deadlines</text>
<text x="1215.0" y="475" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Completion and stop conditions</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">The model structures discussion; a plan's feasibility still depends on evidence and the ability to deliver.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
