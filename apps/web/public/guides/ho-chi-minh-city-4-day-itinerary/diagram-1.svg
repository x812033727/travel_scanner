<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">胡志明市四天路線與分區示意圖 / Ho Chi Minh City 4-day route map</title>
  <desc id="desc">北側是新山一機場，國際線在 T2 航廈，T3 是國內線。機場往南到市中心 8 公里，塞車時 50 分鐘以上，搭 Grab 或計程車，計程車參考 120,000 到 180,000 越南盾另加進場費 10,000；公車路線以現場公告為準。市中心分兩區：Day 1 是統一宮、中央郵局、阮惠街與 Bạch Đằng 碼頭，Day 2 是 Phường Xuân Hòa 的戰爭遺跡博物館、濱城市場與 Bùi Viện。地鐵 1 號線從 Bến Thành 往東北到 Suối Tiên，共 14 站，Bến Thành、Nhà hát Thành phố、Ba Son 三站在地下；單程現金 7,000 到 20,000、非現金 6,000 到 19,000，一日票 40,000、三日票 90,000，營運時間與班距以車站公告為準。西貢河上的 Saigon Waterbus 從 Bạch Đằng 到 Thảo Điền 20 分鐘、到 Linh Đông 52 分鐘，是 Day 4 的路線。Day 3 往西北是古芝地道，往西南是湄公河三角洲，二選一。</desc>
