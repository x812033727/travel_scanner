<title id="title">Astra for Law 발표: OpenAI의 법률 도구, 추가된 것은 색인이지 새 모델이 아님</title><desc id="desc">오리지널 일러스트: 돋보기가 짙기가 다른 문서 더미 위에 떠 있어 열어서 확인할 수 있는 출처를 상징한다. 아래쪽 네 개의 사각형은 왼쪽부터 순서대로 모델, 색인, 선정된 로펌, 데이터 조항을 나타낸다. 상표나 인터페이스 화면은 그리지 않았다.</desc>
