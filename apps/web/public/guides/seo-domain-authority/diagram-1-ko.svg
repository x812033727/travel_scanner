<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">사이트 점수의 세 단계 해석</title><desc id="desc">세 구역에 타사 도구, 검색 성과와 자체 사업 데이터를 차례로 제시하고 각각의 용도, 한계와 실행 가능한 조치를 설명합니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">사이트 점수의 세 단계 해석</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">자료마다 답하는 질문이 다릅니다. 도구 단서부터 이용 결과까지 확인하세요</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">도구 단서</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">지표 이름과 날짜</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">같은 도구·범위로 비교</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">변동은 근거 확인 필요</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">검색 성과</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">중요 페이지와 검색어</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">노출·클릭 비교 조건 통일</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">매출을 바로 뜻하지 않음</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">이용 결과</text>
<text x="1092.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">문의·주문의 정의</text>
<text x="1092.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">추적 변경 기록 필요</text>
<text x="1092.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">실제 문제에 맞는 조치</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">점수는 방향을 제시할 수 있지만, 판단을 마무리하려면 같은 조건과 실제 증거가 필요합니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 그래픽</text>
</svg>
