  <line x1="248" y1="170" x2="248" y2="730" stroke="#2F6F9F" stroke-width="16" stroke-linecap="round"/>
  <line x1="282" y1="170" x2="282" y2="730" stroke="#2F6F9F" stroke-width="16" stroke-linecap="round"/>
  <line x1="282" y1="170" x2="282" y2="730" stroke="#E6F0F7" stroke-width="8" stroke-linecap="round"/>
