<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一次對話送出去的 token 組成 / What one chat turn actually sends</title>
<desc id="desc">三張卡片代表同一通對話的第 1 到第 3 輪。每張卡片由上而下是系統提示詞 2,000 個 token、歷史、本輪提問 100 個 token，再往下是該輪的輸入合計與輸出 300 個 token。第 1 輪尚無歷史，輸入合計 2,100；第 2 輪歷史 400，輸入合計 2,500；第 3 輪歷史 800，輸入合計 2,900。右側面板寫三輪合計輸入 7,500 個 token、輸出 900 個 token，使用者實際打出來的只有 300 個 token，輸入是它的二十五倍。圖例說明系統提示詞每一輪都重送，歷史是前面每一輪的提問與回答，本輪提問是使用者真正打的字，輸出是這一輪的回答，下一輪會變成歷史。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#5C6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一次對話送出去的 token 組成</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">What one chat turn actually sends</text>
<rect x="70" y="140" width="300" height="565" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<text x="220" y="180" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">第 1 輪</text>
<rect x="90" y="195" width="260" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="220" y="234" font-size="17" fill="#0D6B68" text-anchor="middle">系統提示詞</text>
<text x="220" y="268" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">2,000</text>
<rect x="90" y="311" width="260" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="220" y="350" font-size="18" fill="#2F6F9F" text-anchor="middle">尚無歷史</text>
<rect x="90" y="387" width="260" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="220" y="426" font-size="18" fill="#D97A2B" text-anchor="middle">本輪提問 100</text>
<rect x="90" y="471" width="260" height="60" rx="14" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="2"/>
<text x="220" y="509" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">輸入合計 2,100</text>
<line x1="220" y1="533" x2="220" y2="561" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="563" width="260" height="60" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="220" y="601" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">輸出 300</text>
<rect x="410" y="140" width="300" height="565" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<text x="560" y="180" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">第 2 輪</text>
<rect x="430" y="195" width="260" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="560" y="234" font-size="17" fill="#0D6B68" text-anchor="middle">系統提示詞</text>
<text x="560" y="268" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">2,000</text>
<rect x="430" y="311" width="260" height="84" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="560" y="360" font-size="18" fill="#2F6F9F" text-anchor="middle">歷史 400</text>
<rect x="430" y="407" width="260" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="560" y="446" font-size="18" fill="#D97A2B" text-anchor="middle">本輪提問 100</text>
<rect x="430" y="491" width="260" height="60" rx="14" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="2"/>
<text x="560" y="529" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">輸入合計 2,500</text>
<line x1="560" y1="553" x2="560" y2="581" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="583" width="260" height="60" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="560" y="621" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">輸出 300</text>
<rect x="750" y="140" width="300" height="565" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<text x="900" y="180" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">第 3 輪</text>
<rect x="770" y="195" width="260" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="900" y="234" font-size="17" fill="#0D6B68" text-anchor="middle">系統提示詞</text>
<text x="900" y="268" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">2,000</text>
<rect x="770" y="311" width="260" height="124" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="900" y="380" font-size="18" fill="#2F6F9F" text-anchor="middle">歷史 800</text>
<rect x="770" y="447" width="260" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="900" y="486" font-size="18" fill="#D97A2B" text-anchor="middle">本輪提問 100</text>
<rect x="770" y="531" width="260" height="60" rx="14" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="2"/>
<text x="900" y="569" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">輸入合計 2,900</text>
<line x1="900" y1="593" x2="900" y2="621" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="623" width="260" height="60" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="900" y="661" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">輸出 300</text>
<rect x="1090" y="140" width="450" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1120" y="188" font-size="20" font-weight="700" fill="#102A2B">三輪合計</text>
<text x="1120" y="244" font-size="26" font-weight="700" fill="#0D6B68">輸入 7,500 個 token</text>
<text x="1120" y="296" font-size="26" font-weight="700" fill="#2E7D5B">輸出 900 個 token</text>
<line x1="1120" y1="328" x2="1510" y2="328" stroke="#5C6B6B" stroke-width="2"/>
<text x="1120" y="366" font-size="18" fill="#102A2B">使用者實際打出來的只有 300 個 token，</text>
<text x="1120" y="400" font-size="18" fill="#102A2B">帳單上的輸入是它的二十五倍。</text>
<rect x="1090" y="470" width="450" height="235" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<rect x="1120" y="488" width="28" height="28" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1164" y="508" font-size="17" fill="#102A2B">系統提示詞：每一輪都重送</text>
<rect x="1120" y="540" width="28" height="28" rx="6" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1164" y="560" font-size="17" fill="#102A2B">歷史：前面每一輪的提問與回答</text>
<rect x="1120" y="592" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1164" y="612" font-size="17" fill="#102A2B">本輪提問：使用者真正打的字</text>
<rect x="1120" y="644" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1164" y="664" font-size="17" fill="#102A2B">輸出：下一輪會變成歷史</text>
<rect x="70" y="725" width="980" height="90" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="100" y="762" font-size="18" fill="#102A2B">每一輪都重送系統提示詞，前面的提問與回答會變成下一輪的歷史。</text>
<text x="100" y="792" font-size="18" fill="#102A2B">使用者只打了 300 個 token，帳單上的輸入卻是 7,500 個 token。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
