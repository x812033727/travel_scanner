<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">先數 token，再算費用 / Count the tokens, then do the math</title>
<desc id="desc">一張抽象插圖。左邊是三張由小到大疊起來的圓角卡片，分別用青綠、藍與橘色描邊，卡片裡是幾條長短不一的粗橫線，代表一通對話裡愈來愈長的輸入。中間一條虛線箭頭往右指，右邊是一個半圓形的量表：灰色的外弧、青綠色的已用區段、幾根刻度與一根紅色指針，量表下方是一條實心的青綠色圓角橫條，代表算出來的費用。畫面四周散著幾顆大小不同的圓點。上方一行字寫著「先數 token，再算費用」。</desc>
