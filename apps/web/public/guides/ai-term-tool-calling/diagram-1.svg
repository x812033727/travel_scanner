<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">請求、執行與結果分開看</title>
<desc id="desc">使用者查詢由模型轉成工具請求，程式驗證後向器材服務執行，再把實際狀態回傳模型與使用者。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">請求、執行與結果分開看</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Tool Calling · 社區器材借用查詢</text><path d="M420 295 H590" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M940 295 H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1300 400 V695 H950" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M590 695 H250 V400" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="200" width="340" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="250" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">模型請求</text><text x="250" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">日期、時段、器材</text><rect x="600" y="200" width="340" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="770" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">程式驗證</text><text x="770" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">格式、權限、規則</text><rect x="1120" y="200" width="360" height="190" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1300" y="287" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">器材服務</text><text x="1300" y="337" text-anchor="middle" font-size="25" fill="#5C6B6B">查詢目前可用狀態</text><rect x="600" y="610" width="340" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="770" y="687" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">結果回傳</text><text x="770" y="737" text-anchor="middle" font-size="25" fill="#5C6B6B">識別碼與申請狀態</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
