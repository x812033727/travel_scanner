<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ChatGPT 分享連結與隱私 / ChatGPT shared links and privacy</title>
  <desc id="desc">插圖：米色底上有一個深綠色的大對話泡泡，泡泡尾巴指向左下方，泡泡裡有三條淺色的文字線代表對話內容；泡泡右上角掛著一個橘色的鎖頭，鎖環扣在泡泡邊緣，鎖身上有鑰匙孔。泡泡右側是一條藍色的鏈結圖示，兩個鏈環之間斷開，中間有兩道紅色的斷裂線。下方只有一行字：分享連結等於公開。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <ellipse cx="780" cy="700" rx="600" ry="34" fill="#E3DDD2"/>
  <!-- speech bubble, tail to the lower left -->
  <path d="M 250 190 Q 250 160 280 160 L 960 160 Q 990 160 990 190 L 990 560 Q 990 590 960 590 L 440 590 L 310 680 L 350 590 L 280 590 Q 250 590 250 560 Z" fill="#0D6B68" stroke="#102A2B" stroke-width="8" stroke-linejoin="round"/>
  <rect x="330" y="290" width="380" height="20" rx="10" fill="#E3F0EF"/>
  <rect x="330" y="360" width="300" height="20" rx="10" fill="#E3F0EF"/>
  <rect x="330" y="430" width="340" height="20" rx="10" fill="#E3F0EF"/>
  <!-- padlock hanging on the bubble's top-right corner -->
  <path d="M 860 260 L 860 200 Q 860 120 940 120 Q 1020 120 1020 200 L 1020 260" fill="none" stroke="#102A2B" stroke-width="30" stroke-linecap="round"/>
  <path d="M 860 260 L 860 200 Q 860 120 940 120 Q 1020 120 1020 200 L 1020 260" fill="none" stroke="#F7F1E8" stroke-width="16" stroke-linecap="round"/>
  <rect x="810" y="245" width="260" height="190" rx="28" fill="#D97A2B" stroke="#102A2B" stroke-width="8"/>
  <circle cx="940" cy="320" r="24" fill="#102A2B"/>
  <rect x="926" y="330" width="28" height="56" rx="10" fill="#102A2B"/>
  <!-- broken chain link -->
  <rect x="1080" y="275" width="200" height="110" rx="55" fill="none" stroke="#2F6F9F" stroke-width="26" transform="rotate(35 1180 330)"/>
  <rect x="1293" y="424" width="200" height="110" rx="55" fill="none" stroke="#2F6F9F" stroke-width="26" transform="rotate(35 1393 479)"/>
  <path d="M 1268 398 L 1296 376" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
  <path d="M 1280 432 L 1308 410" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
  <!-- single line of text -->
  <text x="800" y="810" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">分享連結等於公開</text>
</svg>
