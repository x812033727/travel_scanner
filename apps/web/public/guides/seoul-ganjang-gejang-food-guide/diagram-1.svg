<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">首爾醬蟹菜單解碼</title>
<desc id="desc">간장게장是醬油醃蟹，양념게장是辣味醃蟹，간장게장 정식是醬蟹定食，꽃게탕是蟹湯，게장비빔밥是醬蟹拌飯，새우장是醬油蝦。菜色依店家供應。© Mokaair 製圖 2026。</desc>
<rect width="1600" height="900" fill="#f6fbfa"/>
<text x="90" y="110" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="55" font-weight="700" fill="#183e44">醬蟹菜單：先看調味，再看套餐</text>
<rect x="70" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#a4c3c4" stroke-width="3"/>
<rect x="840" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#a4c3c4" stroke-width="3"/>
<g font-family="'Noto Sans TC','Noto Sans KR',sans-serif" fill="#183e44">
<text x="110" y="260" font-size="35" font-weight="700">醃蟹，看醬汁</text>
<text x="110" y="345" font-size="31" font-weight="700">간장게장｜醬蟹</text><text x="110" y="390" font-size="24">生蟹以醬油調味液醃製</text>
<text x="110" y="490" font-size="31" font-weight="700">양념게장｜辣味醃蟹</text><text x="110" y="535" font-size="24">辣味調味，與醬油版分開點</text>
<text x="880" y="260" font-size="35" font-weight="700">套餐與其他蟹料理</text>
<text x="880" y="345" font-size="29">간장게장 정식｜醬蟹定食</text>
<text x="880" y="420" font-size="29">꽃게탕｜蟹湯</text>
<text x="880" y="495" font-size="29">게장비빔밥｜醬蟹拌飯</text>
<text x="880" y="570" font-size="29">새우장｜醬油蝦</text>
<text x="110" y="700" font-size="23">各店菜色與套餐內容不同，以當天菜單為準</text>
</g>
<text x="90" y="838" fill="#456a70" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：韓國觀光公社 VISITKOREA 官方料理與店家頁</text>
<text x="1240" y="838" fill="#456a70" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">© Mokaair 製圖 2026</text>
</svg>
