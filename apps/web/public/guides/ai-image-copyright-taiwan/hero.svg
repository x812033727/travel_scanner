<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">生成之後先查權利再商用 / Check the rights before you use it</title>
  <desc id="desc">抽象幾何插圖。左邊是一個白色圓角畫框，框裡放著一個淺綠圓形、一個橘色三角形與一條藍色波浪線，代表一張生成出來的圖片。中間一條粗箭頭由左指向右。右邊是一面淺藍盾牌，盾牌中間有一個綠色勾號，代表把著作權、平台條款與素材授權都檢查過。畫面下方一行字寫著「生成之後，先查再用」。整張圖沒有任何產品標誌、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- the generated picture -->
  <rect x="190" y="230" width="400" height="320" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <circle cx="285" cy="325" r="52" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5"/>
  <path d="M 370 450 L 500 450 L 435 340 Z" fill="#D97A2B"/>
  <path d="M 215 500 Q 302 470 390 500 T 565 500" fill="none" stroke="#2F6F9F" stroke-width="9" stroke-linecap="round"/>

  <!-- the check -->
  <path d="M 650 390 L 898 390" stroke="#0D6B68" stroke-width="14" stroke-linecap="round"/>
  <path d="M 894 360 L 962 390 L 894 420 Z" fill="#0D6B68"/>

  <path d="M 1010 230 L 1390 230 L 1390 400 C 1390 502 1292 554 1200 582 C 1108 554 1010 502 1010 400 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <path d="M 1118 388 L 1180 450 L 1292 334" fill="none" stroke="#2E7D5B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- record trail -->
  <rect x="678" y="470" width="244" height="16" rx="8" fill="#5C6B6B"/>
  <rect x="678" y="512" width="180" height="16" rx="8" fill="#D97A2B"/>
  <rect x="678" y="554" width="116" height="16" rx="8" fill="#5C6B6B"/>

  <text x="800" y="712" font-size="54" font-weight="700" fill="#102A2B" text-anchor="middle">生成之後，先查再用</text>
</svg>
