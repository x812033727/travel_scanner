<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 生成圖片商用前的 5 個檢查關卡 / Five checks before commercial use</title>
  <desc id="desc">由上往下的五個關卡。第一關問有沒有人類實際的創意投入：選圖、修改、編排等實際投入，完成的部分才可能受保護；完全由演算法獨立完成的產出無法享有著作權，依著作權法第 10 條。第二關看平台條款怎麼寫：誰擁有輸出、有沒有營收門檻、免費與付費方案的條件差在哪；條款只約束你與平台之間，不等於著作權法上的著作權。第三關看素材來源乾不乾淨：上傳的參考圖、照片、字型自己要先有授權；拿別人的圖去放大或改圖，原作者的權利不會消失。第四關看會不會撞到既有著作：與訓練資料裡的原始著作構成實質近似，商用可能有侵權問題，避免指名在世創作者當風格，也避開別人的商標與肖像。第五關問要不要標示：看投放平台的規範，以及人工智慧基本法第 4 條第 5 款的標記原則，並留下提示詞、參考圖來源、修改步驟與版本紀錄。最底下提醒：這是查條款與留紀錄的順序，不是法律意見，個案有爭議仍由司法機關認定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0D6B68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="80" y="52" font-size="30" font-weight="700" fill="#102A2B">AI 生成圖片商用前的 5 個檢查關卡</text>
  <text x="80" y="84" font-size="18" fill="#5C6B6B">Five checks before you sell or publish an AI-generated image</text>

  <!-- gate 1 -->
  <rect x="80" y="128" width="480" height="98" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="140" cy="177" r="24" fill="#0D6B68"/>
  <text x="140" y="186" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="182" y="172" font-size="21" font-weight="700" fill="#102A2B">有人類創意投入嗎</text>
  <text x="182" y="201" font-size="16" fill="#5C6B6B">Human creative input?</text>
  <rect x="592" y="128" width="928" height="98" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="622" y="170" font-size="17" fill="#102A2B">選圖、修改、編排等實際的創意投入，完成的部分才可能受保護</text>
  <text x="622" y="201" font-size="17" fill="#102A2B">完全由演算法獨立完成的產出無法享有著作權（著作權法第 10 條）</text>
  <path d="M 140 230 L 140 252" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- gate 2 -->
  <rect x="80" y="256" width="480" height="98" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="140" cy="305" r="24" fill="#2F6F9F"/>
  <text x="140" y="314" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="182" y="300" font-size="21" font-weight="700" fill="#102A2B">平台條款怎麼寫</text>
  <text x="182" y="329" font-size="16" fill="#5C6B6B">What do the terms say?</text>
  <rect x="592" y="256" width="928" height="98" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="622" y="298" font-size="17" fill="#102A2B">誰擁有輸出、有沒有營收門檻、免費與付費方案的條件差在哪</text>
  <text x="622" y="329" font-size="17" fill="#102A2B">條款只約束你與平台之間，不等於著作權法上的著作權</text>
  <path d="M 140 358 L 140 380" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- gate 3 -->
  <rect x="80" y="384" width="480" height="98" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="140" cy="433" r="24" fill="#0D6B68"/>
  <text x="140" y="442" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="182" y="428" font-size="21" font-weight="700" fill="#102A2B">素材來源乾淨嗎</text>
  <text x="182" y="457" font-size="16" fill="#5C6B6B">Are your inputs licensed?</text>
  <rect x="592" y="384" width="928" height="98" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="622" y="426" font-size="17" fill="#102A2B">上傳的參考圖、照片、字型，自己要先有授權</text>
  <text x="622" y="457" font-size="17" fill="#102A2B">拿別人的圖去放大或改圖，原作者的權利不會消失</text>
  <path d="M 140 486 L 140 508" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- gate 4 -->
  <rect x="80" y="512" width="480" height="98" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <circle cx="140" cy="561" r="24" fill="#B8442D"/>
  <text x="140" y="570" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="182" y="556" font-size="21" font-weight="700" fill="#102A2B">會撞到既有著作嗎</text>
  <text x="182" y="585" font-size="16" fill="#5C6B6B">Substantially similar?</text>
  <rect x="592" y="512" width="928" height="98" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="622" y="554" font-size="17" fill="#102A2B">與訓練資料裡的原始著作構成實質近似，商用可能有侵權問題</text>
  <text x="622" y="585" font-size="17" fill="#102A2B">避免指名在世創作者當風格，也避開別人的商標與肖像</text>
  <path d="M 140 614 L 140 636" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- gate 5 -->
  <rect x="80" y="640" width="480" height="98" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="140" cy="689" r="24" fill="#2E7D5B"/>
  <text x="140" y="698" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="182" y="684" font-size="21" font-weight="700" fill="#102A2B">要不要標示</text>
  <text x="182" y="713" font-size="16" fill="#5C6B6B">Do you need to disclose?</text>
  <rect x="592" y="640" width="928" height="98" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="622" y="682" font-size="17" fill="#102A2B">看投放平台的規範，與人工智慧基本法第 4 條第 5 款的標記原則</text>
  <text x="622" y="713" font-size="17" fill="#102A2B">留下提示詞、參考圖來源、修改步驟與版本紀錄</text>

  <rect x="80" y="768" width="1440" height="70" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="810" font-size="19" fill="#102A2B" text-anchor="middle">這是查條款與留紀錄的順序，不是法律意見；個案有爭議仍由司法機關認定</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
