<title id="title">OpenAI, 1,220억 달러 자금 조달 완료: 발표가 약속한 것과 약속하지 않은 것</title><desc id="desc">오리지널 일러스트: 왼쪽의 둥근 토큰 세 개가 가는 선을 따라 중앙의 크고 둥근 사각형으로 모여들어 여러 투자자가 한 라운드에 출자했음을 나타냅니다. 오른쪽 타임라인의 세 지점 중 앞의 두 곳은 체크, 마지막 한 곳은 점선 원으로 표시되어 약정 자본이 분할 납입되며 마지막 회차는 아직 기한이 되지 않았음을 보여줍니다.</desc>
