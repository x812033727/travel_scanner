<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 在你正看的那一頁上 / Claude riding along in the tab you are on</title>
  <desc id="desc">自繪插圖。畫面中央偏下是一個白底深色邊框的瀏覽器視窗，左上角有橘、綠、藍三個小圓點，旁邊是一條淺綠色的網址列。視窗裡的頁面上有三條長短不一的淺綠色橫線代表文字，左下方有一個淺藍色、藍框的長方形按鈕，一個深色的滑鼠游標正停在按鈕上，代表有人替你按下去。視窗的右上角浮著一個白底深綠色邊框的大對話泡泡，泡泡裡有三條淺綠色的橫線，左下角伸出一個朝左下的尖角，指進瀏覽器的頁面裡。畫面下緣有一行深色文字：它看得到你這一頁。畫面沒有任何品牌標誌、介面截圖或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- browser window -->
  <rect x="160" y="230" width="1080" height="470" rx="28" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
  <path d="M 160 310 L 1240 310" fill="none" stroke="#102A2B" stroke-width="8"/>
  <circle cx="212" cy="270" r="13" fill="#D97A2B"/>
  <circle cx="252" cy="270" r="13" fill="#2E7D5B"/>
  <circle cx="292" cy="270" r="13" fill="#2F6F9F"/>
  <rect x="340" y="252" width="600" height="36" rx="18" fill="#E3F0EF"/>

  <!-- page content -->
  <rect x="220" y="360" width="540" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="220" y="414" width="660" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="220" y="468" width="420" height="26" rx="13" fill="#E3F0EF"/>

  <!-- a button on the page, with a cursor resting on it -->
  <rect x="220" y="546" width="320" height="92" rx="20" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="268" y="580" width="180" height="24" rx="12" fill="#2F6F9F"/>
  <path d="M 470 576 L 470 640 L 487 623 L 498 646 L 514 638 L 503 616 L 526 614 Z" fill="#102A2B" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

  <!-- speech bubble floating over the top-right corner -->
  <path d="M 1084 330 L 1084 452 L 1196 340 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>
  <rect x="1010" y="110" width="440" height="250" rx="56" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
  <rect x="1070" y="168" width="300" height="24" rx="12" fill="#E3F0EF"/>
  <rect x="1070" y="222" width="248" height="24" rx="12" fill="#E3F0EF"/>
  <rect x="1070" y="276" width="176" height="24" rx="12" fill="#E3F0EF"/>

  <text x="800" y="838" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">它看得到你這一頁</text>
</svg>
