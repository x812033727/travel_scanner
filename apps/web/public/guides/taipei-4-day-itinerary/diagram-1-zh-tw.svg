<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北四天三夜：四天行程在捷運線上的位置</title>
  <desc id="desc">簡化的台北捷運示意圖，畫出淡水信義線（紅）、板南線（藍）、松山新店線（綠）與文湖線（棕），並用編號標出四天的區域。第 1 天：中正紀念堂、東門（永康街）、西門，晚上可改去中山站附近的寧夏夜市；紀念堂 09:00 到 18:00，衛兵交接 09:00 到 17:00 每個整點。第 2 天：士林站轉公車或計程車到國立故宮博物院（週二至週日 09:00 到 17:00，NT$350），晚上在劍潭站的士林夜市；替代方案是北投、新北投溫泉。第 3 天：從忠孝復興站附近搭基隆客運 1062 到九份、金瓜石，或搭台鐵到瑞芳再轉公車；也可以搭紅線到終點淡水。第 4 天：國父紀念館站旁的松山文創園區、台北101/世貿站的觀景台（10:00 到 21:00，成人 NT$600）、象山站的步道，最後到松山站的饒河街夜市；上午的替代方案是北門站附近的大稻埕。捷運單程 NT$20 到 65，悠遊卡捷運轉公車折 NT$8。</desc>
