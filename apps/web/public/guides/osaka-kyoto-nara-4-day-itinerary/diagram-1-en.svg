<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Inter','Noto Sans','Liberation Sans','DejaVu Sans',system-ui,sans-serif">
  <title id="title">Osaka, Kyoto, and Nara Triangle Travel Times</title>
  <desc id="desc">Between Osaka and Kyoto, JR Special Rapid takes about 30 min and Hankyu takes about 45 min; from Osaka-Namba to Nara, Kintetsu takes about 40 min; between Kyoto and Nara, Kintetsu takes about 35 to 50 min and JR takes about 45 min; from Kansai Airport to Namba, Nankai takes about 40 min; Universal Studios Japan (USJ) sits on the western side of Osaka near Nishikujo.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="84" font-size="38" font-weight="700" fill="#102A2B">Osaka · Kyoto · Nara Triangle Travel Times</text>
  <text x="60" y="122" font-size="20" fill="#5C6B6B">Approximate rail times between Kansai’s three hubs — check official timetables before departure</text>

  <!-- triangle edges -->
  <line x1="560" y1="635" x2="1090" y2="245" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round"/>
  <line x1="560" y1="635" x2="1250" y2="695" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <line x1="1090" y1="245" x2="1250" y2="695" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <!-- airport dotted curve -->
  <path d="M 380 775 C 445 775, 480 715, 520 668" fill="none" stroke="#0D6B68" stroke-width="10" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- USJ dotted connector -->
  <line x1="560" y1="635" x2="310" y2="520" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- nodes -->
  <g font-weight="700" fill="#102A2B">
    <circle cx="560" cy="635" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="560" y="644" font-size="26" text-anchor="middle">Osaka</text>
    <text x="562" y="724" font-size="20" text-anchor="start">Namba · Umeda</text>

    <circle cx="1090" cy="245" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="1090" y="254" font-size="26" text-anchor="middle">Kyoto</text>
    <text x="1090" y="176" font-size="20" text-anchor="middle">Kyoto Station / Kawaramachi</text>

    <circle cx="1250" cy="695" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="1250" y="704" font-size="26" text-anchor="middle">Nara</text>
    <text x="1250" y="778" font-size="20" text-anchor="middle">Kintetsu-Nara / JR Nara</text>

    <circle cx="310" cy="520" r="30" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"/>
    <text x="310" y="527" font-size="18" fill="#6B4A3A" text-anchor="middle">USJ</text>
    <text x="310" y="438" font-size="21" text-anchor="middle">Universal Studios Japan (USJ)</text>
    <text x="310" y="466" font-size="16" font-weight="400" fill="#5C6B6B" text-anchor="middle">Osaka Loop Line &amp; JR Yumesaki Line</text>

    <rect x="60" y="732" width="320" height="86" rx="20" fill="#0D6B68"/>
    <text x="220" y="768" font-size="22" fill="#FFFFFF" text-anchor="middle">Kansai Airport</text>
    <text x="220" y="798" font-size="16" fill="#E6F2F1" text-anchor="middle">KIX · Nankai to Namba 34–45 min</text>
  </g>

  <!-- edge labels -->
  <g font-weight="700">
    <rect x="520" y="348" width="490" height="92" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
    <text x="765" y="385" font-size="20" fill="#6B4A3A" text-anchor="middle">JR Special Rapid ~30 min</text>
    <text x="765" y="418" font-size="18" fill="#6B4A3A" text-anchor="middle">Hankyu Kyoto Line ~45 min (Umeda ⇄ Kawaramachi)</text>

    <rect x="725" y="688" width="400" height="92" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
    <text x="925" y="725" font-size="18" fill="#0D6B68" text-anchor="middle">Kintetsu Rapid Express / Express ~35 min</text>
    <text x="925" y="758" font-size="18" fill="#0D6B68" text-anchor="middle">Osaka-Namba ⇄ Kintetsu-Nara</text>

    <rect x="1203" y="405" width="365" height="92" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
    <text x="1385" y="442" font-size="20" fill="#0D6B68" text-anchor="middle">Kintetsu Limited Express ~35 min</text>
    <text x="1385" y="475" font-size="18" fill="#0D6B68" text-anchor="middle">JR Miyakoji Rapid ~47 min</text>
  </g>

  <g font-size="19" fill="#102A2B">
    <line x1="60" y1="860" x2="120" y2="860" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="134" y="867">JR / Hankyu</text>
    <line x1="310" y1="860" x2="370" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="384" y="867">Kintetsu / Nankai</text>
    <text x="1540" y="867" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
  </g>
</svg>
