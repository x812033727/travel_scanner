<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">오사카·교토·나라 삼각 이동 시간 도표</title>
  <desc id="desc">오사카와 교토 사이는 JR 신쾌속 약 30분, 한큐 약 45분, 오사카 난바에서 나라까지는 긴테쓰 약 40분, 교토에서 나라까지는 긴테쓰 약 35~50분, JR 약 45분이에요. 간사이공항에서 난바까지는 난카이 약 40분이며, 유니버설 스튜디오 재팬(USJ)은 오사카 서쪽 니시쿠조 인근에 있어요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="80" y="86" font-size="38" font-weight="700" fill="#102A2B">오사카 · 교토 · 나라 삼각 이동 시간</text>
  <text x="80" y="126" font-size="21" fill="#5C6B6B">세 도시 간 대략적인 전철 소요 시간(공식 시간표 기준)</text>

  <!-- triangle edges -->
  <line x1="520" y1="640" x2="1080" y2="250" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round"/>
  <line x1="520" y1="640" x2="1230" y2="700" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <line x1="1080" y1="250" x2="1230" y2="700" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <!-- airport (connects cleanly from right edge of widened KIX pill to lower-left of Osaka node) -->
  <path d="M 372 764 C 425 752, 446 690, 474 656" fill="none" stroke="#0D6B68" stroke-width="10" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- USJ -->
  <line x1="520" y1="640" x2="330" y2="520" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- nodes -->
  <g font-weight="700" fill="#102A2B">
    <circle cx="520" cy="640" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="520" y="649" font-size="25" text-anchor="middle">오사카</text>
    <text x="515" y="728" font-size="21" text-anchor="start">난바 · 우메다</text>

    <circle cx="1080" cy="250" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="1080" y="259" font-size="25" text-anchor="middle">교토</text>
    <text x="1080" y="184" font-size="21" text-anchor="middle">교토역 · 가와라마치</text>

    <circle cx="1230" cy="700" r="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
    <text x="1230" y="709" font-size="25" text-anchor="middle">나라</text>
    <text x="1230" y="786" font-size="21" text-anchor="middle">긴테쓰나라 · JR 나라</text>

    <circle cx="330" cy="520" r="30" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"/>
    <text x="330" y="436" font-size="21" text-anchor="middle">유니버설 스튜디오 재팬(USJ)</text>
    <text x="330" y="465" font-size="17" font-weight="400" fill="#5C6B6B" text-anchor="middle">오사카역 → 오사카 순환선 · JR 유메사키선</text>

    <rect x="60" y="728" width="310" height="86" rx="20" fill="#0D6B68"/>
    <text x="215" y="764" font-size="24" fill="#FFFFFF" text-anchor="middle">간사이공항</text>
    <text x="215" y="796" font-size="18" font-weight="400" fill="#E6F2F1" text-anchor="middle">KIX · 난카이 → 난바 34~45분</text>
  </g>

  <!-- edge labels -->
  <g font-weight="700">
    <rect x="550" y="376" width="450" height="92" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
    <text x="775" y="413" font-size="21" fill="#6B4A3A" text-anchor="middle">JR 신쾌속 약 30분</text>
    <text x="775" y="448" font-size="20" fill="#6B4A3A" text-anchor="middle">한큐 교토선 약 45분(우메다 ⇄ 가와라마치)</text>

    <rect x="715" y="690" width="360" height="92" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
    <text x="895" y="727" font-size="21" fill="#0D6B68" text-anchor="middle">긴테쓰 쾌속급행·급행 약 35분</text>
    <text x="895" y="762" font-size="20" fill="#0D6B68" text-anchor="middle">오사카난바 ⇄ 긴테쓰나라</text>

    <rect x="1185" y="410" width="355" height="92" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
    <text x="1362" y="447" font-size="21" fill="#0D6B68" text-anchor="middle">긴테쓰 특급 약 35분</text>
    <text x="1362" y="482" font-size="20" fill="#0D6B68" text-anchor="middle">JR 미야코지 쾌속 약 47분</text>
  </g>

  <g font-size="20" fill="#102A2B">
    <line x1="60" y1="862" x2="120" y2="862" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="134" y="869">JR / 한큐</text>
    <line x1="276" y1="862" x2="336" y2="862" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="350" y="869">긴테쓰 / 난카이</text>
    <text x="1540" y="869" fill="#5C6B6B" text-anchor="end">© Mokaair 제작 2026</text>
  </g>
</svg>
