<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Malgun Gothic',sans-serif">
<title id="title">필요에 맞춰 검색과 광고 배분</title><desc id="desc">수요와 기한, 공동 진입 페이지, 자원 배분, 같은 기준의 검토를 네 구역으로 보여 주며 SEO와 광고의 역할을 나누는 도식.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">필요에 맞춰 검색과 광고 배분</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">기한과 신청 페이지를 먼저 확인하고 투입과 검토를 결정</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">수요와 기한</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">독자가 찾는 것</text>
<text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">행사에 사람이 필요할 때</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="35" fill="#102A2B" text-anchor="start" font-weight="bold">공동 진입 페이지</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">조건과 진입점</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">문의 응대 담당</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">자원 배분</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">매체·콘텐츠·시간</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">시험별 확인 질문</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">같은 기준으로 검토</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">기간·목표·비용</text>
<text x="1215.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">성과 중복 계산 방지</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">고정 비율이 아닌 독자의 필요와 팀의 역량에 맞춰 채널 역할을 정합니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도식</text>
</svg>