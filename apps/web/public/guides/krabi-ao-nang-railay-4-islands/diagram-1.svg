<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">奧南出發的三天四個方向 / Island hopping from Ao Nang</title>
  <desc id="desc">以奧南為中心的示意圖。陸路兩條：往西到諾帕拉塔拉海灘開車約 15 分，往東到喀比鎮與 Klong Jilad 碼頭開車約 30 分。船的方向四條：東南到萊雷與帕南，長尾船約 30 分、帕南約 30 到 40 分；南到四島，波達島約 30 到 45 分，雞島旁的 Thalae Waek 是退潮才出現的沙洲；東北到鴻島，門票 300 泰銖；從 Klong Jilad 碼頭往西南到皮皮島，渡輪約 2 小時、成人 450 泰銖，瑪雅灣每年 8 月 1 日到 9 月 30 日封閉。實線是陸路、虛線是船，乾季 11 到 3 月是跳島季。示意圖，方向與距離非比例。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#2E7D5B"/>
    </marker>
    <marker id="arrow-mocha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#6B4A3A"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#2F6F9F"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">奧南出發：三天四個方向</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Island hopping from Ao Nang</text>
  <text x="1540" y="48" text-anchor="end" font-size="16" fill="#5C6B6B">乾季 11–3 月是跳島季</text>
  <text x="1540" y="76" text-anchor="end" font-size="16" fill="#5C6B6B">示意圖，方向與距離非比例</text>

  <path d="M 616 432 L 436 360" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow-grey)"/>
  <path d="M 904 420 L 1154 360" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow-grey)"/>
  <path d="M 890 386 L 1144 178" stroke="#6B4A3A" stroke-width="4" stroke-dasharray="14 10" fill="none" marker-end="url(#arrow-mocha)"/>
  <path d="M 892 474 L 1074 582" stroke="#0D6B68" stroke-width="4" stroke-dasharray="14 10" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M 740 490 L 740 652" stroke="#2E7D5B" stroke-width="4" stroke-dasharray="14 10" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 1250 424 L 1080 520 L 510 646" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 10" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="620" y="380" width="280" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="760" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">奧南 Ao Nang</text>
  <text x="760" y="456" text-anchor="middle" font-size="17" fill="#5C6B6B">อ่าวนาง・基地</text>

  <rect x="90" y="296" width="340" height="124" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="260" y="338" text-anchor="middle" font-size="19" font-weight="bold" fill="#102A2B">諾帕拉塔拉海灘</text>
  <text x="260" y="368" text-anchor="middle" font-size="16" fill="#5C6B6B">หาดนพรัตน์ธารา Nopparat Thara</text>
  <text x="260" y="398" text-anchor="middle" font-size="17" fill="#102A2B">開車約 15 分</text>

  <rect x="1160" y="296" width="360" height="124" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1340" y="338" text-anchor="middle" font-size="19" font-weight="bold" fill="#102A2B">喀比鎮 Krabi Town</text>
  <text x="1340" y="368" text-anchor="middle" font-size="17" fill="#5C6B6B">Klong Jilad 碼頭</text>
  <text x="1340" y="398" text-anchor="middle" font-size="17" fill="#102A2B">開車約 30 分</text>

  <rect x="1150" y="90" width="380" height="130" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="1340" y="132" text-anchor="middle" font-size="19" font-weight="bold" fill="#102A2B">Day 2 替代・鴻島 Ko Hong</text>
  <text x="1340" y="162" text-anchor="middle" font-size="16" fill="#5C6B6B">หมู่เกาะห้อง</text>
  <text x="1340" y="196" text-anchor="middle" font-size="18" fill="#6B4A3A">門票 300 泰銖</text>

  <rect x="1080" y="560" width="450" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1305" y="604" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">Day 1・萊雷 Railay</text>
  <text x="1305" y="636" text-anchor="middle" font-size="17" fill="#0D6B68">อ่าวไร่เลย์・長尾船約 30 分</text>
  <text x="1305" y="670" text-anchor="middle" font-size="18" fill="#102A2B">帕南 Phra Nang</text>
  <text x="1305" y="702" text-anchor="middle" font-size="17" fill="#5C6B6B">約 30–40 分</text>

  <rect x="560" y="660" width="470" height="180" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="795" y="704" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">Day 2・四島</text>
  <text x="795" y="738" text-anchor="middle" font-size="17" fill="#2E7D5B">波達島 เกาะปอดะ・約 30–45 分</text>
  <text x="795" y="772" text-anchor="middle" font-size="17" fill="#102A2B">雞島 เกาะไก่・退潮才出現的沙洲</text>
  <text x="795" y="804" text-anchor="middle" font-size="16" fill="#5C6B6B">ทะเลแหวก Thalae Waek</text>

  <rect x="70" y="580" width="440" height="190" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="290" y="624" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">Day 3・皮皮島 Phi Phi</text>
  <text x="290" y="654" text-anchor="middle" font-size="16" fill="#5C6B6B">เกาะพีพี</text>
  <text x="290" y="690" text-anchor="middle" font-size="18" fill="#2F6F9F">渡輪約 2 小時・成人 450 泰銖</text>
  <text x="290" y="722" text-anchor="middle" font-size="16" fill="#102A2B">瑪雅灣 อ่าวมาหยา</text>
  <text x="290" y="750" text-anchor="middle" font-size="16" fill="#B8442D">8/1–9/30 封閉</text>

  <rect x="1150" y="756" width="380" height="88" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <path d="M 1176 790 L 1246 790" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <text x="1262" y="796" font-size="17" fill="#102A2B">實線＝陸路</text>
  <path d="M 1176 822 L 1246 822" stroke="#0D6B68" stroke-width="4" stroke-dasharray="14 10" fill="none"/>
  <text x="1262" y="828" font-size="17" fill="#102A2B">虛線＝船</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
