<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本订房方案怎么看：床型、人数、餐食与取消条件逐项核对：判断流程</title><desc>依次检查：固定条件、确认床型、核对餐食、保存条款。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用流程</text><text x="100" y="175" fill="#576968" font-size="25">依你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">固定条件</text><text x="103" y="497" fill="#f4f0e5" font-size="23">同行人员相同</text><text x="103" y="573" fill="#f4dc9d" font-size="26">日期人数一致</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">确认床型</text><text x="473" y="497" fill="#f4f0e5" font-size="23">床铺与空间</text><text x="473" y="573" fill="#f4dc9d" font-size="26">看实际房型</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">核对餐食</text><text x="843" y="497" fill="#f4f0e5" font-size="23">餐食与时间</text><text x="843" y="573" fill="#f4dc9d" font-size="26">行程吃得到</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">保存条款</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">保存条款</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">确认信再比对</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意 / 编辑示意图</text></g></svg>
