<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本の宿泊プランの読み方：ベッドタイプ・人数・食事・キャンセル条件を一つずつ確認：判断の流れ</title><desc>順番に確認：条件をそろえる、ベッドタイプを確認する、食事を確認する、規約を保存する。編集部作成。地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">確認の順序 · 実用的な手順</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">条件をそろえる</text><text x="103" y="497" fill="#f4f0e5" font-size="23">同じ同行者</text><text x="103" y="573" fill="#f4dc9d" font-size="26">日付・人数を統一</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">ベッドを確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">ベッドと空間</text><text x="473" y="573" fill="#f4dc9d" font-size="26">実際の客室タイプを見る</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">食事を確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">食事と時間</text><text x="843" y="573" fill="#f4dc9d" font-size="26">旅程内で食べられるか</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">規約を保存</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">規約を保存する</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">確認メールで再照合</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部自作のイメージ図 / 編集部による解説図</text></g></svg>
