<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 숙박 예약 상품 읽는 법: 침대 유형·인원·식사·취소 조건 항목별 확인: 판단 절차</title><desc>조건 통일, 침대 유형 확인, 식사 확인, 약관 저장 순으로 점검합니다. 편집부가 정리한 도식이며 지도나 실측 시간을 나타내지 않습니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 절차</text><text x="100" y="175" fill="#576968" font-size="25">조건에 맞게 선택, 한 번에 모두 끝낼 필요는 없음</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">조건 통일</text><text x="103" y="497" fill="#f4f0e5" font-size="23">동일한 일행</text><text x="103" y="573" fill="#f4dc9d" font-size="26">날짜·인원 통일</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">침대 유형 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">침대와 공간</text><text x="473" y="573" fill="#f4dc9d" font-size="26">실제 객실 유형 확인</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">식사 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">식사와 시간</text><text x="843" y="573" fill="#f4dc9d" font-size="26">일정상 식사 가능 여부</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">약관 저장</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">약관 보관</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">확인 메일과 재대조</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집 도식</text></g></svg>
