<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 전철 운행 중단 시 일정 변경법: 공식 정보 확인, 승차권 보관과 대안 검토 순서: 판단 흐름도</title><desc>순서대로 확인하세요: 운영 회사 확인, 필수 일정 확보, 대체 노선 확인, 원래 승차권과 증빙 보관. 편집부가 정리한 자료로, 지도나 실제 측정 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">대응 순서 · 실용적인 절차</text><text x="100" y="175" fill="#576968" font-size="25">자신의 여건에 맞게 선택하세요. 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">운영 회사 확인</text><text x="103" y="497" fill="#f4f0e5" font-size="23">운영 회사 찾기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">영향 구간 확인</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">필수 일정 확보</text><text x="473" y="497" fill="#f4f0e5" font-size="23">우선순위 정하기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">숙소에 먼저 연락</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">대체 노선 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">대안 확인</text><text x="843" y="573" fill="#f4dc9d" font-size="26">이용 가능하면 구매</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">원래 표·증빙 보관</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">기록 보관</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">원래 구매처에서 처리</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도해 / 편집 도해</text></g></svg>
