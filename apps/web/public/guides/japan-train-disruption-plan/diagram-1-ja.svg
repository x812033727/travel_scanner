<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本の電車が運休したときの予定変更：公式情報の確認、乗車券の保管、代替案の検討順序：判断の流れ</title><desc>順に確認：運行会社を特定、必須の予定を守る、代替路線を確認、元の切符と領収書を保管。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">対応の順序 · 実用的な手順</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、一度にすべて行う必要はありません</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">運行会社を特定</text><text x="103" y="497" fill="#f4f0e5" font-size="23">運行会社を調べる</text><text x="103" y="573" fill="#f4dc9d" font-size="26">影響区間を確認</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">必須の予定を守る</text><text x="473" y="497" fill="#f4f0e5" font-size="23">優先順位を決める</text><text x="473" y="573" fill="#f4dc9d" font-size="26">まず宿泊先へ連絡</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">代替路線を確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">代替案を確認</text><text x="843" y="573" fill="#f4dc9d" font-size="26">利用可能なら切符購入</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="26" font-weight="700" style="font-size: 26px;">元の切符・領収書を保管</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">記録を残す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">購入元で手続き</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図 / 編集部による図解</text></g></svg>
