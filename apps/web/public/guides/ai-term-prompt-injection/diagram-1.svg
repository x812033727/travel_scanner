<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">提示詞注入圖解 / Prompt Injection</title><desc id="desc">郵件先進入資料擷取，產生待確認名單；郵件中的變更要求另行標示，沒有授權便不能通往修改場次工具。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">資料要求，不應直接變成管理權限</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Prompt Injection</text><rect x="70" y="160" width="400" height="180" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="270" y="262" text-anchor="middle" font-size="36" fill="#102A2B">外部報名郵件</text><path d="M 470 250 L 600 250" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="600" cy="250" r="10" fill="#0D6B68"/><rect x="600" y="160" width="400" height="180" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="262" text-anchor="middle" font-size="36" fill="#102A2B">擷取指定欄位</text><path d="M 1000 250 L 1130 250" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1130" cy="250" r="10" fill="#0D6B68"/><rect x="1130" y="160" width="400" height="180" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1330" y="262" text-anchor="middle" font-size="36" fill="#102A2B">待確認名單</text><path d="M 270 340 L 270 545" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="270" cy="545" r="10" fill="#0D6B68"/><rect x="70" y="545" width="400" height="160" rx="24" fill="#F9E7DA" stroke="#D97A2B" stroke-width="4"/><text x="270" y="637" text-anchor="middle" font-size="36" fill="#102A2B">額外變更要求</text><path d="M 470 625 L 600 625" stroke="#D97A2B" stroke-width="9" fill="none"/><circle cx="600" cy="625" r="10" fill="#D97A2B"/><rect x="600" y="545" width="400" height="160" rx="24" fill="#F9E7DA" stroke="#D97A2B" stroke-width="4"/><text x="800" y="637" text-anchor="middle" font-size="36" fill="#102A2B">授權檢查</text><path d="M1070 560v130" stroke="#B8442D" stroke-width="17"/><rect x="1130" y="545" width="400" height="160" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1330" y="637" text-anchor="middle" font-size="36" fill="#102A2B">修改場次工具</text><text x="805" y="475" text-anchor="middle" font-size="34" fill="#102A2B">摘要任務沒有修改權限</text><text x="800" y="790" text-anchor="middle" font-size="32" fill="#102A2B">沒有權限，即使模型誤判也不執行</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
