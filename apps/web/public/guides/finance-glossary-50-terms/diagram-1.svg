<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">六類財經名詞，各自回答不同的問題 / Six groups of finance terms</title>
<desc id="desc">六張並排的分類卡。由左到右依序是收支與預算，回答錢從哪裡來又流到哪裡去，常見詞有可支配所得、非消費支出、結餘、儲蓄率、緊急預備金；銀行與信用，回答利息怎麼算、紀錄怎麼留，常見詞有本金、複利、定期存款、循環利息、信用評分；保險，回答誰付錢、誰領錢、最多賠多少，常見詞有要保人、受益人、保險金額、實支實付、自負額；稅，回答先減掉什麼、再乘上什麼，常見詞有綜合所得淨額、免稅額、扣除額、邊際稅率、股利所得；投資基礎，回答報酬從哪裡來、成本扣在哪裡，常見詞有標的、年化報酬率、淨值、內扣費用、殖利率；風險，回答哪些事可能不如預期，常見詞有波動、分散、流動性、匯率風險、通膨風險。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">六類名詞，六種不同的問題</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Finance glossary, grouped · 先判斷分類，再看定義</text>
<text x="60" y="126" font-size="20" fill="#5C6B6B">一個詞屬於哪一類，就知道它在回答什麼問題。</text>

