<title id="title">Firefox Smart Window に Mistral のモデルが追加：2社の発表、市場の説明はそれぞれ別</title><desc id="desc">オリジナルイラスト：ブラウザウィンドウの幾何学的な枠の右側にスロット状の切り込みがあり、六角形の図形が1つ差し込まれていく様子。隣にはさらに2つの六角形が並び、差し替え可能で選択できる AI モデルを象徴している。ロゴや実際の画面は描いていない</desc>
