<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同一份薪水，三張分級表 / One salary, three statutory bases</title>
<desc id="desc">左邊是薪資單上的月薪資總額，往右分成三條線。第一條進勞保月投保薪資，依勞工保險投保薪資分級表對應，最高一級四萬五千八百元，普通事故保險費率百分之十一點五加上就業保險費率百分之一，由勞工負擔兩成、雇主負擔七成、政府補助一成，職業災害保險費則由雇主全額負擔。第二條進健保月投保金額，最高一級三十一萬三千元，一般保險費率百分之五點一七，由本人與眷屬自付三成、雇主六成、政府一成，眷屬超過三口以三口計。第三條進勞退月提繳工資，最高一級十五萬元，雇主提繳不低於工資百分之六且不從薪水扣，只有自願提繳才從薪水扣。圖下方註明所得稅是預扣，隔年結算申報多退少補；二代健保補充保費不在固定扣款欄，達門檻時才就源扣取。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一份薪水，三張分級表，三個不一樣的數字</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Taiwanese payslip · 基準怎麼來、誰負擔多少</text>

<path d="M360 420 L430 245" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M360 450 L430 450" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M360 480 L430 655" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M860 240 L920 240" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M860 450 L920 450" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M860 660 L920 660" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="380" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
<text x="210" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">薪資單上的</text>
<text x="210" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">月薪資總額</text>
<text x="210" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">本薪與各項給與</text>

<rect x="430" y="170" width="430" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="645" y="208" text-anchor="middle" font-size="17" fill="#5C6B6B">依勞工保險投保薪資分級表</text>
<text x="645" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">勞保月投保薪資</text>
<text x="645" y="284" text-anchor="middle" font-size="18" fill="#5C6B6B">最高一級 45,800 元</text>

<rect x="920" y="170" width="620" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1230" y="208" text-anchor="middle" font-size="17" fill="#5C6B6B">普通事故 11.5%，就業保險 1%</text>
<text x="1230" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">你 20%、雇主 70%、政府 10%</text>
<text x="1230" y="284" text-anchor="middle" font-size="18" fill="#5C6B6B">職災保險費由雇主全額負擔</text>

<rect x="430" y="380" width="430" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="645" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">依健保投保金額分級表</text>
<text x="645" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">健保月投保金額</text>
<text x="645" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">最高一級 313,000 元</text>

<rect x="920" y="380" width="620" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1230" y="418" text-anchor="middle" font-size="17" fill="#5C6B6B">一般保險費率 5.17%</text>
<text x="1230" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">你與眷屬 30%、雇主 60%、政府 10%</text>
<text x="1230" y="494" text-anchor="middle" font-size="18" fill="#5C6B6B">眷屬超過三口以三口計</text>

<rect x="430" y="590" width="430" height="140" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="645" y="628" text-anchor="middle" font-size="17" fill="#5C6B6B">依勞工退休金月提繳分級表</text>
<text x="645" y="668" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">勞退月提繳工資</text>
<text x="645" y="704" text-anchor="middle" font-size="18" fill="#5C6B6B">最高一級 150,000 元</text>

<rect x="920" y="590" width="620" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1230" y="628" text-anchor="middle" font-size="17" fill="#5C6B6B">雇主為勞工負擔提繳</text>
<text x="1230" y="668" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">雇主 6%，不從薪水扣</text>
<text x="1230" y="704" text-anchor="middle" font-size="18" fill="#5C6B6B">自願提繳才從薪水扣</text>

<text x="60" y="794" font-size="20" fill="#5C6B6B">所得稅那一欄是預扣，不是當年度的應納稅額，隔年結算申報時多退少補。</text>
<text x="60" y="828" font-size="20" fill="#5C6B6B">二代健保補充保費不在固定扣款欄，只有特定所得達門檻時才就源扣取。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
