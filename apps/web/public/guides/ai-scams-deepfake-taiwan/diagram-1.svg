<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">收到可疑訊息的查證順序 / Verifying a suspicious message step by step</title>
  <desc id="desc">由上而下五個步驟。第一步先停住，不點擊、不填輸、不匯款、不轉傳。第二步回撥確認，掛斷後用自己通訊錄裡的舊號碼撥回去，不回撥對方給的號碼。第三步查廣告主，從廣告開啟廣告資訊公開中心，或從粉絲專頁前往廣告檔案庫。第四步查網址，複製網址貼到 165 全民防騙 LINE 官方帳號查有無通報紀錄。第五步撥打 165 查證，要下架廣告則到數位發展部的通報網。圖下方列出三個官方管道：撥打 165、165 全民防騙 LINE 官方帳號、數位發展部網路詐騙通報查詢網。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">收到可疑訊息，這樣查證</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Verifying a suspicious message, step by step</text>

  <!-- step 1 -->
  <rect x="180" y="128" width="1240" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <rect x="204" y="152" width="122" height="52" rx="12" fill="#B8442D"/>
  <text x="265" y="186" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">第一步</text>
  <text x="352" y="172" font-size="24" font-weight="bold" fill="#102A2B">先停住</text>
  <text x="352" y="204" font-size="18" fill="#5C6B6B">不點擊、不填輸、不匯款、不轉傳</text>

  <line x1="800" y1="232" x2="800" y2="262" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="180" y="266" width="1240" height="100" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="204" y="290" width="122" height="52" rx="12" fill="#D97A2B"/>
  <text x="265" y="324" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">第二步</text>
  <text x="352" y="310" font-size="24" font-weight="bold" fill="#102A2B">回撥確認</text>
  <text x="352" y="342" font-size="18" fill="#5C6B6B">掛斷後用自己通訊錄裡的舊號碼撥回去，不回撥對方給的號碼</text>

  <line x1="800" y1="370" x2="800" y2="400" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="180" y="404" width="1240" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="204" y="428" width="122" height="52" rx="12" fill="#2F6F9F"/>
  <text x="265" y="462" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">第三步</text>
  <text x="352" y="448" font-size="24" font-weight="bold" fill="#102A2B">查廣告是誰出的</text>
  <text x="352" y="480" font-size="18" fill="#5C6B6B">從廣告開啟廣告資訊公開中心，或從粉絲專頁前往廣告檔案庫</text>

  <line x1="800" y1="508" x2="800" y2="538" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="180" y="542" width="1240" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="204" y="566" width="122" height="52" rx="12" fill="#2F6F9F"/>
  <text x="265" y="600" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">第四步</text>
  <text x="352" y="586" font-size="24" font-weight="bold" fill="#102A2B">查網址有沒有被通報過</text>
  <text x="352" y="618" font-size="18" fill="#5C6B6B">複製網址貼到 165 全民防騙 LINE 官方帳號，查有無通報紀錄</text>

  <line x1="800" y1="646" x2="800" y2="676" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="180" y="680" width="1240" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="204" y="704" width="122" height="52" rx="12" fill="#0D6B68"/>
  <text x="265" y="738" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">第五步</text>
  <text x="352" y="724" font-size="24" font-weight="bold" fill="#102A2B">撥打 165 查證</text>
  <text x="352" y="756" font-size="18" fill="#5C6B6B">仍不確定就撥 165；要把廣告下架，到數位發展部的通報網</text>

  <text x="1396" y="192" text-anchor="end" font-size="20" font-weight="bold" fill="#B8442D">自己做得到</text>
  <text x="1396" y="330" text-anchor="end" font-size="20" font-weight="bold" fill="#D97A2B">自己做得到</text>
  <text x="1396" y="468" text-anchor="end" font-size="20" font-weight="bold" fill="#2F6F9F">官方查詢管道</text>
  <text x="1396" y="606" text-anchor="end" font-size="20" font-weight="bold" fill="#2F6F9F">官方查詢管道</text>
  <text x="1396" y="744" text-anchor="end" font-size="20" font-weight="bold" fill="#0D6B68">官方專線與通報</text>

  <text x="800" y="826" text-anchor="middle" font-size="18" fill="#5C6B6B">官方管道：撥打 165、165 全民防騙 LINE 官方帳號、數位發展部網路詐騙通報查詢網</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
