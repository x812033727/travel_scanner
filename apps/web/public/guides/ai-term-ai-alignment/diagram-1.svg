<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">對齊要分層看 / Alignment as layers</title><desc id="desc">上半是模型本身的訓練與評估：先決定對齊到什麼目標（使用者意圖、有幫助誠實無害、更廣的人類價值），再選手段（指令微調、人類回饋強化學習、憲法式 AI），最後用量測看結果（標註者偏好評分、真實性與毒性資料集、紅隊測試）。下半是部署後模型之外的兩層：安全防護在模型呼叫前後檢查輸入與輸出，內容政策規定使用者與服務能做什麼並由供應商執行。三者作用的位置不同，不能互相取代。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">對齊要分層看：目標、手段、量測與模型之外的規則</text><text x="60" y="84" font-size="18" fill="#5C6B6B">AI alignment: target, method, measurement, and what sits outside the model</text><rect x="60" y="108" width="1480" height="362" rx="14" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="14 10"/><text x="90" y="142" font-size="20" font-weight="700" fill="#5C6B6B">模型本身：訓練與評估</text><rect x="90" y="165" width="400" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="290" y="220" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">目標：對齊到什麼</text><text x="290" y="280" font-size="22" fill="#102A2B" text-anchor="middle">依使用者的意圖</text><text x="290" y="324" font-size="22" fill="#102A2B" text-anchor="middle">有幫助、誠實、無害</text><text x="290" y="368" font-size="22" fill="#102A2B" text-anchor="middle">更廣的人類價值</text><path d="M 495 290 L 595 290" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="600" y="165" width="400" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="220" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">手段：怎麼訓練</text><text x="800" y="280" font-size="22" fill="#102A2B" text-anchor="middle">指令微調</text><text x="800" y="324" font-size="22" fill="#102A2B" text-anchor="middle">人類回饋強化學習（RLHF）</text><text x="800" y="368" font-size="22" fill="#102A2B" text-anchor="middle">憲法式 AI</text><path d="M 1005 290 L 1105 290" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="1110" y="165" width="400" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="220" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">量測：怎麼知道</text><text x="1310" y="280" font-size="22" fill="#102A2B" text-anchor="middle">標註者的偏好評分</text><text x="1310" y="324" font-size="22" fill="#102A2B" text-anchor="middle">真實性與毒性資料集</text><text x="1310" y="368" font-size="22" fill="#102A2B" text-anchor="middle">紅隊測試</text><path d="M 800 475 L 800 515" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><text x="826" y="502" font-size="18" fill="#5C6B6B">部署之後</text><rect x="60" y="520" width="1480" height="280" rx="14" fill="none" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="14 10"/><text x="90" y="554" font-size="20" font-weight="700" fill="#5C6B6B">模型之外：使用階段</text><rect x="110" y="575" width="640" height="170" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="430" y="625" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">安全防護（Guardrails）</text><text x="430" y="676" font-size="22" fill="#102A2B" text-anchor="middle">在模型呼叫前後做檢查</text><text x="430" y="714" font-size="22" fill="#5C6B6B" text-anchor="middle">可設在輸入、檢索到輸出各階段</text><rect x="850" y="575" width="640" height="170" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1170" y="625" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">內容政策</text><text x="1170" y="676" font-size="22" fill="#102A2B" text-anchor="middle">規定使用者與服務能做什麼</text><text x="1170" y="714" font-size="22" fill="#5C6B6B" text-anchor="middle">由供應商執行</text><text x="800" y="840" font-size="22" font-weight="700" fill="#B8442D" text-anchor="middle">說「已對齊」時，先問是哪一層、對到誰的什麼、怎麼量</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
