<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">三種記帳方式的取捨 / Three ways to track spending</title>
<desc id="desc">三欄並排比較。左欄手動輸入：自動化程度最低，每一筆都自己打，幾乎不必交出資料，資料留在自己的裝置或帳號，最大的風險是忘記記或記到一半放棄。中欄發票載具與簡訊：半自動，只涵蓋有開電子發票或有簡訊通知的消費，要交出手機條碼與驗證碼或讀取簡訊的權限，而且資料有時間差，翌日起算兩日內才上傳存證。右欄連結金融帳戶：自動化程度最高，帳戶往來自己跑進帳本，要授權讀取範圍內的帳戶餘額與交易明細，必須先問清楚怎麼撤銷授權、撤銷後資料會不會刪掉。下方橫幅寫著三種都要問同一件事：能不能把完整紀錄匯出成 CSV 或試算表；匯不出來就換不掉。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">三種記帳方式的取捨</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Three ways to track spending · 自動化程度與你交出去的資料</text>

<rect x="60" y="130" width="440" height="530" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<rect x="60" y="130" width="440" height="110" rx="14" fill="#0D6B68"/>
<rect x="60" y="218" width="440" height="22" fill="#0D6B68"/>
<text x="280" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">手動輸入</text>
<text x="280" y="214" text-anchor="middle" font-size="17" fill="#F7F1E8">自己動手，最花時間</text>
<text x="280" y="282" text-anchor="middle" font-size="17" fill="#5C6B6B">自動化程度</text>
<text x="280" y="318" text-anchor="middle" font-size="19" fill="#102A2B">最低，每一筆消費都要</text>
<text x="280" y="350" text-anchor="middle" font-size="19" fill="#102A2B">自己打進帳本</text>
<text x="280" y="420" text-anchor="middle" font-size="17" fill="#5C6B6B">你交出去的資料</text>
<text x="280" y="456" text-anchor="middle" font-size="19" fill="#102A2B">幾乎沒有，資料留在</text>
<text x="280" y="488" text-anchor="middle" font-size="19" fill="#102A2B">你的裝置或你的帳號</text>
<text x="280" y="558" text-anchor="middle" font-size="17" fill="#5C6B6B">最大的風險</text>
<text x="280" y="594" text-anchor="middle" font-size="19" fill="#102A2B">忘記記，或記到一半</text>
<text x="280" y="626" text-anchor="middle" font-size="19" fill="#102A2B">就整個放棄</text>

<rect x="580" y="130" width="440" height="530" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<rect x="580" y="130" width="440" height="110" rx="14" fill="#D97A2B"/>
<rect x="580" y="218" width="440" height="22" fill="#D97A2B"/>
<text x="800" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">發票載具與簡訊</text>
<text x="800" y="214" text-anchor="middle" font-size="17" fill="#F7F1E8">半自動，只看得到一部分</text>
<text x="800" y="282" text-anchor="middle" font-size="17" fill="#5C6B6B">自動化程度</text>
<text x="800" y="318" text-anchor="middle" font-size="19" fill="#102A2B">中等，只涵蓋有開電子</text>
<text x="800" y="350" text-anchor="middle" font-size="19" fill="#102A2B">發票或有簡訊的消費</text>
<text x="800" y="420" text-anchor="middle" font-size="17" fill="#5C6B6B">你交出去的資料</text>
<text x="800" y="456" text-anchor="middle" font-size="19" fill="#102A2B">手機條碼與驗證碼，或</text>
<text x="800" y="488" text-anchor="middle" font-size="19" fill="#102A2B">讀取簡訊的權限</text>
<text x="800" y="558" text-anchor="middle" font-size="17" fill="#5C6B6B">要注意的事</text>
<text x="800" y="594" text-anchor="middle" font-size="19" fill="#102A2B">有時間差，翌日起算</text>
<text x="800" y="626" text-anchor="middle" font-size="19" fill="#102A2B">兩日內才上傳存證</text>

<rect x="1100" y="130" width="440" height="530" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<rect x="1100" y="130" width="440" height="110" rx="14" fill="#2F6F9F"/>
<rect x="1100" y="218" width="440" height="22" fill="#2F6F9F"/>
<text x="1320" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">連結金融帳戶</text>
<text x="1320" y="214" text-anchor="middle" font-size="17" fill="#F7F1E8">最省力，授權範圍最大</text>
<text x="1320" y="282" text-anchor="middle" font-size="17" fill="#5C6B6B">自動化程度</text>
<text x="1320" y="318" text-anchor="middle" font-size="19" fill="#102A2B">最高，帳戶往來自己</text>
<text x="1320" y="350" text-anchor="middle" font-size="19" fill="#102A2B">跑進帳本裡</text>
<text x="1320" y="420" text-anchor="middle" font-size="17" fill="#5C6B6B">你交出去的資料</text>
<text x="1320" y="456" text-anchor="middle" font-size="19" fill="#102A2B">授權範圍內的帳戶餘額</text>
<text x="1320" y="488" text-anchor="middle" font-size="19" fill="#102A2B">與交易明細</text>
<text x="1320" y="558" text-anchor="middle" font-size="17" fill="#5C6B6B">要先問清楚</text>
<text x="1320" y="594" text-anchor="middle" font-size="19" fill="#102A2B">怎麼撤銷授權，撤銷後</text>
<text x="1320" y="626" text-anchor="middle" font-size="19" fill="#102A2B">資料會不會刪掉</text>

<rect x="60" y="690" width="1480" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="746" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">三種都要問同一件事：能不能把完整紀錄匯出成 CSV 或試算表</text>
<text x="800" y="786" text-anchor="middle" font-size="19" fill="#5C6B6B">匯不出來，就換不掉；換不掉的時候，漲價與停止服務都由對方決定</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
