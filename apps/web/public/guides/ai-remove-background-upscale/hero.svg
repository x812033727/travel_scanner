  <title id="title">去背與放大的示意插圖 / Cutting out and upscaling an image</title>
  <desc id="desc">米色底的幾何插圖。左邊是一塊灰白相間的透明格底板，一個深綠色的圓頭方身剪影被抬起、浮在格子上方，下面留著淡淡的影子，代表把主體從背景中去掉。右邊先是一個小方框，裡面只有九個大圓點，一支箭頭指向右邊較大的方框，裡面排著三十六個小圓點，代表放大後像素變多、細節變細。畫面下方有一行字：去背與放大。</desc>
