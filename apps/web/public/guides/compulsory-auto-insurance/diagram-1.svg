<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一場事故裡的四個對象：強制險覆蓋哪一格 / The four parties in one crash and the single cell compulsory cover reaches</title>
<desc id="desc">一張四格對照表。直排分成對方那一側（車外第三人）與本車這一側，橫排分成人身（體傷、失能、死亡）與車輛財物。左上格是對方的駕駛人、乘客與路人，由強制險以三類人身給付覆蓋，也就是傷害醫療費用給付、失能給付與死亡給付，不論加害人有無過失都給付，可直接向保險公司請求，超過上限的部分落在第三人責任保險的傷害責任。右上格分成兩塊：本車乘客也是受害人，由強制險給付，超過上限的部分落在乘客體傷責任附加條款；本車駕駛人自己則不在強制險的保障範圍，要靠第三人責任保險附加駕駛人傷害保險。左下格是對方的車與其他財物，右下格是自己的車，兩格強制險都不給付財物損失，分別落在第三人責任保險的財損責任與車體損失保險、竊盜損失保險，沒有加保就自行承擔。圖的下方註明給付項目出自強制汽車責任保險法第二十七條，保障對象出自第十三條，合計上限出自給付標準第七條。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一場事故裡的四個對象：強制險覆蓋哪一格</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">The four parties in one crash and the single cell compulsory cover reaches</text>

<rect x="316" y="110" width="608" height="52" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="620" y="145" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">對方那一側（車外第三人）</text>
<rect x="944" y="110" width="596" height="52" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1242" y="145" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">本車這一側</text>

<rect x="60" y="178" width="236" height="340" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="178" y="322" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">人身</text>
<text x="178" y="360" font-size="17" fill="#5C6B6B" text-anchor="middle">體傷、失能、死亡</text>

<rect x="316" y="178" width="608" height="340" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="620" y="222" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">對方的駕駛人、乘客與路人</text>
<line x1="340" y1="242" x2="900" y2="242" stroke="#0D6B68" stroke-width="2"/>
<text x="620" y="278" font-size="19" font-weight="700" fill="#0D6B68" text-anchor="middle">強制險的三類人身給付</text>
<text x="620" y="312" font-size="18" fill="#102A2B" text-anchor="middle">傷害醫療費用給付</text>
<text x="620" y="342" font-size="18" fill="#102A2B" text-anchor="middle">失能給付</text>
<text x="620" y="372" font-size="18" fill="#102A2B" text-anchor="middle">死亡給付</text>
<text x="620" y="412" font-size="17" fill="#5C6B6B" text-anchor="middle">不論加害人有無過失，可直接向保險公司請求</text>
<text x="620" y="452" font-size="17" fill="#5C6B6B" text-anchor="middle">超過上限落在</text>
<text x="620" y="482" font-size="18" fill="#102A2B" text-anchor="middle">第三人責任保險的傷害責任</text>

<rect x="944" y="178" width="596" height="340" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<rect x="966" y="200" width="552" height="142" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
<text x="1242" y="240" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">本車乘客</text>
<text x="1242" y="274" font-size="17" font-weight="700" fill="#0D6B68" text-anchor="middle">也是受害人，強制險給付</text>
<text x="1242" y="306" font-size="17" fill="#5C6B6B" text-anchor="middle">超過上限：乘客體傷責任附加條款</text>
<rect x="966" y="356" width="552" height="140" rx="10" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
<text x="1242" y="396" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">本車駕駛人自己</text>
<text x="1242" y="430" font-size="17" font-weight="700" fill="#B8442D" text-anchor="middle">不在強制險的保障範圍</text>
<text x="1242" y="462" font-size="17" fill="#102A2B" text-anchor="middle">第三人責任保險附加駕駛人傷害保險</text>

<rect x="60" y="536" width="236" height="224" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="178" y="632" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">車輛與財物</text>
<text x="178" y="670" font-size="17" fill="#B8442D" text-anchor="middle">強制險不給付</text>

<rect x="316" y="536" width="608" height="224" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="620" y="580" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">對方的車與其他財物</text>
<line x1="340" y1="600" x2="900" y2="600" stroke="#D97A2B" stroke-width="2"/>
<text x="620" y="638" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">強制險不給付財物損失</text>
<text x="620" y="676" font-size="18" fill="#102A2B" text-anchor="middle">第三人責任保險的財損責任</text>
<text x="620" y="714" font-size="17" fill="#5C6B6B" text-anchor="middle">沒有加保就自行承擔</text>

<rect x="944" y="536" width="596" height="224" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1242" y="580" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">自己的車</text>
<line x1="968" y1="600" x2="1516" y2="600" stroke="#D97A2B" stroke-width="2"/>
<text x="1242" y="638" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">強制險不給付財物損失</text>
<text x="1242" y="676" font-size="18" fill="#102A2B" text-anchor="middle">車體損失保險、竊盜損失保險</text>
<text x="1242" y="714" font-size="17" fill="#5C6B6B" text-anchor="middle">沒有加保就自行承擔</text>

<rect x="60" y="790" width="1480" height="52" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<text x="800" y="823" font-size="17" fill="#5C6B6B" text-anchor="middle">給付項目：強制汽車責任保險法第二十七條　保障對象：第十三條　合計上限：給付標準第七條</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
