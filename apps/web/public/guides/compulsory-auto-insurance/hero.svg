<path d="M 950 292 Q 950 248 984 248 Q 1018 248 1018 292 Z" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/>

<rect x="456" y="408" width="320" height="240" rx="28" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
<path d="M 556 502 L 572 472 L 660 472 L 676 502 Z" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/>
<circle cx="562" cy="560" r="22" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
<circle cx="670" cy="560" r="22" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
