<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">四格裡只有一格被罩住 / One of four squares is under the shield</title>
<desc id="desc">一張插圖。四個同樣大小的圓角方格排成兩排兩列。左上那一格是淡綠底、深綠框，格子中央畫著一面盾牌，盾牌裡有一個沒有五官的抽象人形，代表被罩住的那一格。右上格是白底灰框，裡面只有一個灰色線條的人形，沒有盾牌。下面兩格也是白底灰框，各畫一部同樣大小、同樣朝向的灰色線條汽車，一樣沒有盾牌。方格下方置中寫著一行短字：只保障其中一格。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<rect x="456" y="120" width="320" height="240" rx="28" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
<path d="M 616 160 L 676 186 L 676 248 Q 676 298 616 320 Q 556 298 556 248 L 556 186 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/>
<circle cx="616" cy="218" r="20" fill="#0D6B68"/>
<path d="M 592 282 Q 592 250 616 250 Q 640 250 640 282 Z" fill="#0D6B68"/>

