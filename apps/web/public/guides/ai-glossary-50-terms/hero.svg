<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 名詞速查：一本打開的字典與彩色標籤 / An open dictionary with coloured tabs</title>
  <desc id="desc">米色底上畫著一本攤開的深青色硬皮字典，左右兩頁是白色，頁面上用灰色長條表示文字，左頁有一個青色的詞頭與一段藍色的解釋區塊。右頁外緣伸出五個顏色不同的標籤：青、藍、綠、橘、紅。書的左後方疊著兩張略微歪斜的白色索引卡，卡片上也有灰色的字行。畫面上方置中寫著「AI 名詞速查」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="800" y="150" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">AI 名詞速查</text>

  <!-- index cards behind the book -->
