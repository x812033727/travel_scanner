<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ChatGPT 搜尋 vs Google：先開哪一個 / ChatGPT search vs Google: which to open first</title>
  <desc id="desc">米色底的插圖。左邊是一支藍色粗框的放大鏡，鏡片裡有三條灰藍色橫線，象徵搜尋結果清單；右邊是一個綠框的對話泡泡，裡面有三個綠色圓點，象徵 AI 正在回答；中間是一座深色的天平，橘色的支點與兩個橘色秤盤，左盤朝放大鏡、右盤朝對話泡泡，秤桿水平，表示兩者各有適合的問題而不是誰取代誰。下方一行字「先開哪一個」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft backdrops -->
  <circle cx="360" cy="400" r="250" fill="#E6F0F7"/>
  <rect x="1000" y="200" width="500" height="400" rx="120" fill="#E3F0EF"/>

  <!-- magnifying glass -->
  <circle cx="360" cy="400" r="170" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="28"/>
  <rect x="270" y="340" width="180" height="22" rx="11" fill="#2F6F9F" opacity="0.55"/>
  <rect x="270" y="390" width="140" height="22" rx="11" fill="#2F6F9F" opacity="0.4"/>
  <rect x="270" y="440" width="160" height="22" rx="11" fill="#2F6F9F" opacity="0.25"/>
  <line x1="484" y1="524" x2="600" y2="640" stroke="#2F6F9F" stroke-width="46" stroke-linecap="round"/>

  <!-- speech bubble -->
  <rect x="1050" y="250" width="400" height="280" rx="64" fill="#FFFFFF" stroke="#0D6B68" stroke-width="24"/>
  <path d="M 1130 520 L 1090 620 L 1210 522 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="24" stroke-linejoin="round"/>
  <rect x="1132" y="512" width="90" height="26" fill="#FFFFFF"/>
  <circle cx="1170" cy="390" r="24" fill="#0D6B68"/>
  <circle cx="1250" cy="390" r="24" fill="#0D6B68" opacity="0.7"/>
  <circle cx="1330" cy="390" r="24" fill="#0D6B68" opacity="0.4"/>

  <!-- balance scale -->
  <rect x="720" y="640" width="160" height="30" rx="15" fill="#102A2B"/>
  <rect x="788" y="330" width="24" height="320" fill="#102A2B"/>
  <rect x="610" y="326" width="380" height="20" rx="10" fill="#102A2B"/>
  <circle cx="800" cy="336" r="22" fill="#D97A2B"/>
  <line x1="630" y1="346" x2="630" y2="470" stroke="#102A2B" stroke-width="6"/>
  <line x1="970" y1="346" x2="970" y2="470" stroke="#102A2B" stroke-width="6"/>
  <path d="M 560 470 A 70 34 0 0 0 700 470 Z" fill="#D97A2B"/>
  <path d="M 900 470 A 70 34 0 0 0 1040 470 Z" fill="#D97A2B"/>
  <rect x="560" y="466" width="140" height="8" rx="4" fill="#102A2B"/>
  <rect x="900" y="466" width="140" height="8" rx="4" fill="#102A2B"/>

  <!-- one line of text -->
  <text x="800" y="810" font-size="60" font-weight="700" fill="#102A2B" text-anchor="middle">先開哪一個</text>
</svg>
