<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">六類問題先開哪一個：ChatGPT 搜尋還是 Google / Which to open first, by question type</title>
  <desc id="desc">這是一張由左往右走的決策樹。起點是「你要找的是什麼？」：一個當下正確的數字或地點，還是一段解釋或整理。從起點分出六條分支，每條先列問題類型與例子，再指出先開哪個，最後給交叉驗證的動作。第一條，即時資訊（匯率、天氣、新聞）：先開 Google 一般搜尋，資料卡片的數字不經 AI 改寫；驗證是點引用看是哪一家、幾點更新，要換錢看銀行牌告。第二條，在地與地圖（店家、營業時間、路線）：先開 Google 或 Google 地圖，看商家卡片與大眾運輸路線；驗證是把店名丟回 Google 地圖看今天的營業時間，出門前再看一次。第三條，購物比價（商品卡片、各通路價格）：先 Google 看價，再 ChatGPT 比規格，兩邊的卡片都不是下單的地方；驗證是點到品牌台灣官網或電商頁看含運價格與保固。第四條，官方規定（政府、銀行、醫療）：兩邊都可起頭，目的是找到官方頁面的網址，以官方頁為準；驗證是讀官方頁原文並看日期，醫療與用藥問醫師或藥師。第五條，學新東西與解釋（名詞、原理、一段程式）：先開 ChatGPT 搜尋或 Google 的 AI 模式，可以追問、換例子、講簡單點；驗證是把關鍵詞拿去找教科書或官方文件，確認沒把兩個概念混在一起。第六條，多來源研究（比較幾家、正反意見）：先開 ChatGPT 搜尋或 Deep Research，讓 AI 先讀十幾頁、你再抽查；驗證是看 Sources 清單的網域、抽查三個引用，有一個對不上就整份重讀。圖下方註明：藍框是先開 Google、綠框是先開 ChatGPT 搜尋、橘框是兩邊都可起頭但以官方頁為準；功能名稱以 OpenAI 與 Google 的說明中心為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
