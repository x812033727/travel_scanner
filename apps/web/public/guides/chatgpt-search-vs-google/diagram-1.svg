  <rect x="1180" y="248" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/>
  <text x="1360" y="286" font-size="16" fill="#102A2B" text-anchor="middle">店名丟回 Google 地圖看今天</text>
