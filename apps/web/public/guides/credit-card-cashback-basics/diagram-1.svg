<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">三種回饋的兌換路徑 / Cashback, points and miles</title>
<desc id="desc">三欄並排比較信用卡回饋的三種形式。左欄現金回饋：路徑最短，金額確定；兌換路徑是折抵當期應付帳款，或入到指定帳戶；價值在取得的當下就是確定金額；最常見的限制是單月回饋上限、指定通路與最低折抵金額。中欄紅利點數：多一段兌換，價值會變；兌換路徑是累積點數後，依公告的方式換商品或折抵；價值由發卡機構的兌換條件決定，而條件會調整；最常見的限制是有效期限、兌換門檻與可換品項供應狀況。右欄哩程：換得到票才有價值；兌換路徑是累積哩程，湊到門檻，還要有開放的機位；價值取決於你實際換到的艙等與航線；最常見的限制是有效期限、兌換門檻、票位與淡旺季限制。下方橫幅寫著三種形式的回饋率不能直接相比，因為那個比例乘的是哪一段消費並不相同；上限、門檻、指定通路與有效期限逐家不同，以發卡機構公告為準。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

