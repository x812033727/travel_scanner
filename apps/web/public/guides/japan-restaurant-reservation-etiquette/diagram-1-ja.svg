<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本のレストラン予約の前後にすること：予約確定・遅刻・キャンセルへの対応：判断の手順</title><desc>順に確認：公式窓口を探す、キャンセル条件を読む、予約確認を保存する、変更時はまず連絡する。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順番 · 実用的な手順</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、すべてを一度に済ませなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">公式窓口を探す</text><text x="103" y="497" fill="#f4f0e5" font-size="23">公式予約</text><text x="103" y="573" fill="#f4dc9d" font-size="26">支店を先に確認</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">取消条件を読む</text><text x="473" y="497" fill="#f4f0e5" font-size="23">規定を読む</text><text x="473" y="573" fill="#f4dc9d" font-size="26">費用を別々に確認</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">予約確認を保存</text><text x="843" y="497" fill="#f4f0e5" font-size="23">確認記録を保管</text><text x="843" y="573" fill="#f4dc9d" font-size="26">確定後に予定を組む</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">変更はまず連絡</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">早めに連絡</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">変更の返答を待つ</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の図解 / 編集図解</text></g></svg>
