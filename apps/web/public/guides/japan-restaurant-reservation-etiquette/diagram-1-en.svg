<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Before and After Booking a Restaurant in Japan: Confirmations, Late Arrivals, and Cancellations — Decision Flow</title><desc>Check in order: find the official booking channel, read cancellation terms, save confirmation, and contact the restaurant before changes. Compiled by the editors; not a map or measured timing.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Step order · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits your needs; no need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="29" font-weight="700" style="font-size: 29px;">Find official booking</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Official booking</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Check the branch first</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="24" font-weight="700" style="font-size: 24px;">Read cancellation terms</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Read the policy</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Check each fee separately</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Save confirmation</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Keep confirmation</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Plan once confirmed</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="25" font-weight="700" style="font-size: 25px;">Contact before changes</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Contact early</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Wait for a change reply</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editor-created illustration / Editorial diagram</text></g></svg>
