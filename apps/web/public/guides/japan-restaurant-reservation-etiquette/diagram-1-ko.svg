<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 식당 예약 전후에 할 일: 예약 확정, 지각과 취소에 대처하는 방법: 판단 흐름도</title><desc>순서대로 확인: 공식 예약 경로 찾기, 취소 조건 읽기, 예약 확인 자료 저장하기, 변경 시 먼저 연락하기. 편집부가 정리한 내용이며, 지도나 실제 측정 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 절차</text><text x="100" y="175" fill="#576968" font-size="25">조건에 맞춰 선택, 한 번에 모두 끝낼 필요 없음</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">공식 예약 경로 찾기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">공식 예약</text><text x="103" y="573" fill="#f4dc9d" font-size="26">먼저 지점 확인</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">취소 조건 읽기</text><text x="473" y="497" fill="#f4f0e5" font-size="23">규정 읽기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">비용별로 확인</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">예약 확인 자료 저장</text><text x="843" y="497" fill="#f4f0e5" font-size="23">예약 확인 자료 보관</text><text x="843" y="573" fill="#f4dc9d" font-size="26">확정 후 일정 잡기</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">변경 시 먼저 연락</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">일찍 연락하기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">변경 답변 기다리기</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집부 도식</text></g></svg>
