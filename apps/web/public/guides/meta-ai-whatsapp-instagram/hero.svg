<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">訊息的兩條路 / One message, two destinations</title>
  <desc id="desc">抽象插圖。畫面左邊是一個白色的對話框，裡面有三個灰色圓點代表正在輸入的訊息。對話框右側分出兩條粗線：上面那條綠色的線通往一個淺綠色方框，方框裡畫著一把上鎖的掛鎖，代表端對端加密的個人聊天；下面那條藍色的線通往一個淺藍色方框，方框裡畫著一個齒輪，代表交給 AI 服務處理的對話。畫面下方有一行字：訊息的兩條路。整張圖只用圓、圓角矩形與線條，沒有任何品牌標誌或介面截圖。</desc>
