<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">普吉跳島：四個方向怎麼選 / Island hopping from Phuket: four directions</title>
  <desc id="desc">以普吉島為中心的示意圖。島上標出三個出發點：普吉機場 HKT、島東側的拉莎達碼頭、島南的查龍港。往北是斯米蘭，先一段陸路從芭東到攀牙府的 Thap Lamu 港、開車約 3 小時、接送點以旅行社為準，再一段船程從 Thap Lamu 到 Ko Miang、快艇約 1 小時半，門票 500 泰銖，只開 10 月 15 日到 5 月 15 日，而且不能個人入島。往東北是攀牙灣與 James Bond 島，從普吉機場開車約 45 分到 1 小時，門票 300 泰銖。往東南是皮皮島，從拉莎達碼頭搭渡輪約 2 小時，成人 700 泰銖起，瑪雅灣 8 月 1 日到 9 月 30 日封閉。往南是珊瑚島，從查龍港搭快艇約 20 分，再往南是拉差島，搭船約 1 小時半。實線代表陸路、虛線代表船。乾季 11 月到 3 月是跳島季。方向與距離非比例。</desc>
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
    <marker id="arrowMocha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B4A3A"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="40" y="52" font-size="30" font-weight="bold" fill="#102A2B">普吉跳島：四個方向怎麼選</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Island hopping from Phuket: four directions</text>
  <text x="1560" y="52" font-size="17" text-anchor="end" fill="#5C6B6B">乾季 11–3 月是跳島季</text>
  <text x="1560" y="80" font-size="15" text-anchor="end" fill="#5C6B6B">示意圖，方向與距離非比例</text>

  <!-- Phuket -->
  <rect x="260" y="400" width="200" height="280" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="360" y="447" font-size="20" font-weight="bold" text-anchor="middle" fill="#102A2B">普吉島</text>
  <text x="360" y="472" font-size="16" text-anchor="middle" fill="#5C6B6B">ภูเก็ต Phuket</text>
  <line x1="254" y1="527" x2="290" y2="527" stroke="#5C6B6B" stroke-width="2"/>
  <circle cx="300" cy="527" r="7" fill="#102A2B"/>
  <text x="246" y="517" font-size="16" text-anchor="end" fill="#102A2B">普吉機場 HKT</text>
  <text x="246" y="539" font-size="15" text-anchor="end" fill="#5C6B6B">สนามบินภูเก็ต</text>
  <line x1="254" y1="592" x2="290" y2="592" stroke="#5C6B6B" stroke-width="2"/>
  <circle cx="300" cy="592" r="7" fill="#102A2B"/>
  <text x="246" y="582" font-size="16" text-anchor="end" fill="#102A2B">拉莎達碼頭 Rassada</text>
  <text x="246" y="604" font-size="15" text-anchor="end" fill="#5C6B6B">ท่าเรือรัษฎา</text>
  <line x1="254" y1="657" x2="290" y2="657" stroke="#5C6B6B" stroke-width="2"/>
  <circle cx="300" cy="657" r="7" fill="#102A2B"/>
  <text x="246" y="647" font-size="16" text-anchor="end" fill="#102A2B">查龍港 Chalong</text>
  <text x="246" y="669" font-size="15" text-anchor="end" fill="#5C6B6B">อ่าวฉลอง</text>

  <!-- north: Similan, leg 1 road (solid) -->
  <line x1="368" y1="394" x2="534" y2="258" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <text x="350" y="310" font-size="17" text-anchor="end" fill="#102A2B">芭東 → Thap Lamu 港</text>
  <text x="350" y="334" font-size="17" font-weight="bold" text-anchor="end" fill="#2F6F9F">開車約 3 小時</text>
  <text x="350" y="356" font-size="15" text-anchor="end" fill="#5C6B6B">接送點以旅行社為準</text>

  <rect x="545" y="206" width="250" height="84" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="670" y="240" font-size="17" text-anchor="middle" fill="#102A2B">Thap Lamu 港</text>
  <text x="670" y="266" font-size="15" text-anchor="middle" fill="#5C6B6B">ท่าเรือทับละมุ</text>

  <!-- north: Similan, leg 2 boat (dashed) -->
  <line x1="800" y1="246" x2="950" y2="228" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrowNavy)"/>
  <text x="802" y="212" font-size="17" font-weight="bold" fill="#2F6F9F">快艇約 1 小時半</text>
  <text x="802" y="276" font-size="15" fill="#5C6B6B">到 Ko Miang</text>

  <rect x="960" y="130" width="480" height="185" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="990" y="172" font-size="20" font-weight="bold" fill="#102A2B">斯米蘭 Similan</text>
  <text x="990" y="198" font-size="16" fill="#5C6B6B">หมู่เกาะสิมิลัน</text>
  <text x="990" y="226" font-size="17" fill="#102A2B">門票 500 泰銖</text>
  <text x="990" y="254" font-size="17" font-weight="bold" fill="#B8442D">只開 10/15–5/15</text>
  <text x="990" y="282" font-size="15" fill="#5C6B6B">不能個人入島，一定要跟團</text>

  <!-- northeast: Phang Nga (solid = road) -->
  <line x1="464" y1="452" x2="950" y2="408" stroke="#6B4A3A" stroke-width="4" marker-end="url(#arrowMocha)"/>
  <rect x="960" y="340" width="480" height="180" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="990" y="381" font-size="20" font-weight="bold" fill="#102A2B">攀牙灣 Ao Phang-nga</text>
  <text x="990" y="407" font-size="16" fill="#5C6B6B">อ่าวพังงา</text>
  <text x="990" y="434" font-size="17" fill="#102A2B">James Bond 島 เกาะตะปู</text>
  <text x="990" y="462" font-size="17" fill="#102A2B">機場開車約 45 分–1 小時</text>
  <text x="990" y="490" font-size="17" font-weight="bold" fill="#6B4A3A">門票 300 泰銖</text>

  <!-- southeast: Phi Phi (dashed = boat) -->
  <line x1="464" y1="600" x2="950" y2="628" stroke="#0D6B68" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrowTeal)"/>
  <rect x="960" y="540" width="480" height="185" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="990" y="582" font-size="20" font-weight="bold" fill="#102A2B">皮皮島 Phi Phi</text>
  <text x="990" y="608" font-size="16" fill="#5C6B6B">เกาะพีพี</text>
  <text x="990" y="636" font-size="17" fill="#102A2B">拉莎達碼頭 渡輪約 2 小時</text>
  <text x="990" y="664" font-size="17" font-weight="bold" fill="#0D6B68">成人 700 泰銖起</text>
  <text x="990" y="692" font-size="15" fill="#B8442D">瑪雅灣 อ่าวมาหยา 8/1–9/30 封閉</text>

  <!-- south: Coral Island and Racha (dashed = boat) -->
  <line x1="378" y1="686" x2="400" y2="737" stroke="#2E7D5B" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrowGreen)"/>
  <rect x="300" y="745" width="380" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="490" y="787" font-size="18" font-weight="bold" text-anchor="middle" fill="#102A2B">珊瑚島 Coral Island</text>
  <text x="490" y="813" font-size="15" text-anchor="middle" fill="#5C6B6B">เกาะเฮ</text>
  <text x="490" y="839" font-size="17" text-anchor="middle" fill="#2E7D5B">查龍港 快艇約 20 分</text>

  <line x1="686" y1="805" x2="752" y2="805" stroke="#2E7D5B" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrowGreen)"/>
  <text x="719" y="784" font-size="15" text-anchor="middle" fill="#5C6B6B">再往南</text>

  <rect x="760" y="745" width="380" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="950" y="787" font-size="18" font-weight="bold" text-anchor="middle" fill="#102A2B">拉差島 Racha</text>
  <text x="950" y="813" font-size="15" text-anchor="middle" fill="#5C6B6B">เกาะราชา</text>
  <text x="950" y="839" font-size="17" text-anchor="middle" fill="#2E7D5B">船約 1 小時半</text>

  <!-- legend -->
  <text x="1200" y="745" font-size="16" font-weight="bold" fill="#102A2B">圖例</text>
  <line x1="1200" y1="768" x2="1250" y2="768" stroke="#102A2B" stroke-width="4"/>
  <text x="1262" y="774" font-size="16" fill="#102A2B">實線＝陸路</text>
  <line x1="1200" y1="796" x2="1250" y2="796" stroke="#102A2B" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="1262" y="802" font-size="16" fill="#102A2B">虛線＝船</text>
  <text x="1200" y="830" font-size="15" fill="#5C6B6B">箭頭換線型就是換交通工具</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
