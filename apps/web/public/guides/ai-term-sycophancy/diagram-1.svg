<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">同一題問三種版本，看答案有沒有跟著立場變 / Same question, three framings</title><desc id="desc">流程圖。上排是三種問法：不透露立場的中性問法、表示傾向方案 A 的問法、表示傾向方案 B 的問法，三者資訊相同。三種問法各問模型數次，再比對兩件事：事實主張有沒有變、結論有沒有跟著立場走。如果都沒變，代表這一題沒看到迎合跡象，但不代表模型整體沒有；如果事實或結論跟著立場變，就當作迎合跡象，改用原始來源核對。這是示例流程，沒有實測。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一題問三種版本，看答案有沒有跟著立場變</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Same question, three framings: does the answer follow the stance?</text><rect x="60" y="125" width="460" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="290" y="187" font-size="34" fill="#102A2B" text-anchor="middle">中性問法</text><text x="290" y="230" font-size="26" fill="#5C6B6B" text-anchor="middle">不透露自己的立場</text><rect x="570" y="125" width="460" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="800" y="187" font-size="34" fill="#102A2B" text-anchor="middle">傾向方案 A</text><text x="800" y="230" font-size="26" fill="#5C6B6B" text-anchor="middle">「我覺得 A 比較好，對吧？」</text><rect x="1080" y="125" width="460" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="1310" y="187" font-size="34" fill="#102A2B" text-anchor="middle">傾向方案 B</text><text x="1310" y="230" font-size="26" fill="#5C6B6B" text-anchor="middle">「我覺得 B 比較好，對吧？」</text><path d="M 290 265 L 290 328" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 800 265 L 800 328" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1310 265 L 1310 328" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="335" width="1480" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="387" font-size="34" fill="#102A2B" text-anchor="middle">模型回答</text><text x="800" y="430" font-size="26" fill="#5C6B6B" text-anchor="middle">每種問法各問幾次，看偏移的方向，不看單次</text><path d="M 800 455 L 800 508" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="515" width="1480" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="567" font-size="34" fill="#102A2B" text-anchor="middle">比對兩件事</text><text x="800" y="610" font-size="26" fill="#5C6B6B" text-anchor="middle">事實主張有沒有變；結論有沒有跟著立場走</text><path d="M 415 635 L 415 693" fill="none" stroke="#2E7D5B" stroke-width="4" marker-end="url(#arrow-green)"/><path d="M 1185 635 L 1185 693" fill="none" stroke="#B8442D" stroke-width="4" marker-end="url(#arrow-red)"/><text x="437" y="674" font-size="26" font-weight="700" fill="#2E7D5B">都沒變</text><text x="1207" y="674" font-size="26" font-weight="700" fill="#B8442D">跟著變</text><rect x="60" y="700" width="710" height="130" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="415" y="757" font-size="34" fill="#102A2B" text-anchor="middle">只有語氣不同</text><text x="415" y="800" font-size="26" fill="#5C6B6B" text-anchor="middle">這一題沒看到迎合跡象，但不代表模型整體沒有</text><rect x="830" y="700" width="710" height="130" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="1185" y="757" font-size="34" fill="#102A2B" text-anchor="middle">事實或結論跟著立場變</text><text x="1185" y="800" font-size="26" fill="#5C6B6B" text-anchor="middle">當作迎合跡象，改用原始來源核對</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
