<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">迎合（Sycophancy）：答案像回聲一樣照著提問的人說</title><desc id="desc">兩個對話框隔著一條虛線左右對稱。左邊對話框發出一條弧形箭頭，指向右邊一模一樣的對話框，像回聲；下方有一個虛線輪廓的空對話框，代表沒有說出口的另一種答案。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker></defs><path d="M 800 200 L 800 640" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="16 16"/><rect x="200" y="260" width="420" height="280" rx="60" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/><path d="M 268 540 L 246 640 L 372 540" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8" stroke-linejoin="round"/><path d="M 271 540 L 369 540" fill="none" stroke="#FFFFFF" stroke-width="10"/><rect x="260" y="318" width="300" height="30" rx="15" fill="#2F6F9F"/><rect x="260" y="378" width="260" height="30" rx="15" fill="#2F6F9F"/><rect x="260" y="438" width="200" height="30" rx="15" fill="#2F6F9F"/><rect x="980" y="260" width="420" height="280" rx="60" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/><path d="M 1332 540 L 1354 640 L 1228 540" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/><path d="M 1329 540 L 1231 540" fill="none" stroke="#E3F0EF" stroke-width="10"/><rect x="1040" y="318" width="300" height="30" rx="15" fill="#0D6B68"/><rect x="1080" y="378" width="260" height="30" rx="15" fill="#0D6B68"/><rect x="1140" y="438" width="200" height="30" rx="15" fill="#0D6B68"/><path d="M 664 400 L 930 400" fill="none" stroke="#D97A2B" stroke-width="10" marker-end="url(#arrow)"/><rect x="660" y="660" width="280" height="150" rx="40" fill="none" stroke="#D97A2B" stroke-width="6" stroke-dasharray="14 12"/></svg>
