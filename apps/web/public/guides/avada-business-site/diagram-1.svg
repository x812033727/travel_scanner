<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Avada 版型轉成形象網站</title><desc id="desc">原創流程圖將 Avada 版型處理分成匯入、替換、共用設定及驗收四階段，提醒各階段的保留和檢查項目。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Avada 版型轉成形象網站</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">先釐清匯入範圍，再完成內容與設定</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">匯入</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">整站或單頁</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">備份與草稿</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">外掛依賴</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">替換</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">服務資訊</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">自有圖片</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">正確收件</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">設定</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">共用樣式</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Layout 條件</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">局部例外</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">驗收</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">手機導覽</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">詢問流程</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">效能精簡</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">模板提供排列起點；服務資訊、資料流與維護方式仍需自己完成。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
