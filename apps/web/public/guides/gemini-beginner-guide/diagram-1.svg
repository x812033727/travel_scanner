<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Gemini 入口地圖：同一個 Google 帳號的 7 個入口 / Where Gemini lives across Google products</title>
  <desc id="desc">中央是同一個 Google 帳號：網頁、App、側邊欄、Chrome 看到的是同一個 Gemini，對話集中在「Gemini 系列應用程式活動記錄」。方案三級：免費每月 NT$0，含 3.6 Flash、Gemini Live、Deep Research、Canvas；Google AI Plus 每月 NT$165，用量 2 倍、Gmail 與 Vids 側邊欄、400 GB；Google AI Pro 每月 NT$650，用量 4 倍、3.1 Pro、文件側邊欄、5 TB；Ultra 每月 NT$3,300 或 NT$6,500，一般使用者不用考慮。左側三個綠框是免費就能用的入口：1 網頁版 gemini.google.com，電腦瀏覽器登入 Google 帳號，底部文字框就是對話框，點模型名稱切換 Flash-Lite、Flash、Pro；2 手機 App（Android、iPhone），Google Play 或 App Store 安裝，底部「Live」圖示，Android 9 以上、至少 2 GB RAM，支援中文（繁體）；3 Android 的主要助理，按住電源鍵、說「Ok Google」或從底部角落上滑，取代 Google 助理，還做不到的事要用 Google 助理，設定裡可改回。右側三個藍框需要 Google AI 方案：4 Gmail 側邊欄「詢問 Gemini」，電腦版右上角按鈕，手機 Gmail 在搜尋列旁，摘要會話群組、建議回覆、草擬郵件，Plus 以上；5 Google 文件「詢問 Gemini」與「幫我寫」，需要 Google AI Pro 以上，以官網為準；6 Google 試算表「詢問 Gemini」，建表格、寫公式、畫圖表、分析資料，只支援原生試算表檔，需 Google AI 方案，以官網為準。下方綠框 7 是 Chrome 工具列「問問 Gemini」，摘要網頁、比較多個分頁，「啟用 Live 模式」用講的，電腦版、台灣可用、無痕不支援，說明頁未要求方案。2026 年 9 月 13 日依 Google 官網查證。</desc>
