<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">先有同意，才有分身 / Consent first, then the avatar</title>
<desc id="desc">一張幾何插圖。左邊是一張白色卡片，卡片上有一個綠色圓形與白色勾選符號，下方三條短橫線，代表同意與驗證。中間是一張白色的腳本紙，頂端有一條橘色標籤，紙上有五條長短不一的橫線，代表要念的腳本。右邊是一個圓角螢幕，螢幕裡的淺綠面板上有一個深綠色的圓形頭部與圓弧肩線組成的抽象人形，旁邊兩道橘色弧線代表正在說話，螢幕下方有支架與底座。三個元素由左至右用箭頭串起來，下方一行字寫著「先有同意，才有分身」。</desc>
