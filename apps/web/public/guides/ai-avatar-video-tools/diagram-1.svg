<text x="61" y="358" font-size="16" fill="#102A2B">建議 1080p、30fps</text>
<text x="61" y="396" font-size="16" fill="#102A2B">眼睛看鏡頭</text>
<text x="61" y="434" font-size="16" fill="#102A2B">手不高過胸口</text>
<line x1="315" y1="315" x2="340" y2="315" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="354" y="150" width="266" height="330" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<circle cx="398" cy="196" r="24" fill="#2F6F9F"/>
<text x="398" y="204" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="434" y="204" font-size="20" font-weight="700" fill="#102A2B">同意與驗證</text>
<line x1="374" y1="238" x2="600" y2="238" stroke="#D8D2C8" stroke-width="2"/>
<text x="374" y="282" font-size="16" fill="#102A2B">本人錄，念指定文字</text>
<text x="374" y="320" font-size="16" fill="#102A2B">長度 30 秒以內</text>
<text x="374" y="358" font-size="16" fill="#102A2B">結尾念 4 個英文字母</text>
<text x="374" y="396" font-size="16" fill="#102A2B">兩段影片同一人</text>
<line x1="628" y1="315" x2="653" y2="315" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="667" y="150" width="266" height="330" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<circle cx="711" cy="196" r="24" fill="#2F6F9F"/>
<text x="711" y="204" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="747" y="204" font-size="20" font-weight="700" fill="#102A2B">寫腳本</text>
<line x1="687" y1="238" x2="913" y2="238" stroke="#D8D2C8" stroke-width="2"/>
<text x="687" y="282" font-size="16" fill="#102A2B">照片轉影片腳本</text>
<text x="687" y="320" font-size="16" fill="#102A2B">上限 5000 字元</text>
<text x="687" y="358" font-size="16" fill="#102A2B">政治、詐騙會被退</text>
<line x1="941" y1="315" x2="966" y2="315" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="980" y="150" width="266" height="330" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
