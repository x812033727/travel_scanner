<text x="1060" y="204" font-size="20" font-weight="700" fill="#102A2B">生成影片</text>
<line x1="1000" y1="238" x2="1226" y2="238" stroke="#D8D2C8" stroke-width="2"/>
<text x="1000" y="282" font-size="16" fill="#102A2B">Avatar IV 照片 16 點</text>
<text x="1000" y="320" font-size="16" fill="#102A2B">Avatar IV 影片 31 點</text>
<text x="1000" y="358" font-size="16" fill="#102A2B">Avatar V 48 點</text>
<text x="1000" y="396" font-size="16" fill="#102A2B">每分鐘，算實際秒數</text>
<line x1="1254" y1="315" x2="1279" y2="315" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1293" y="150" width="266" height="330" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1337" cy="196" r="24" fill="#D97A2B"/>
<text x="1337" y="204" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1373" y="204" font-size="20" font-weight="700" fill="#102A2B">輸出與標示</text>
<line x1="1313" y1="238" x2="1539" y2="238" stroke="#D8D2C8" stroke-width="2"/>
<text x="1313" y="282" font-size="16" fill="#102A2B">720p、1080p 或 4K</text>
<text x="1313" y="320" font-size="16" fill="#102A2B">可下載 SRT 字幕</text>
<text x="1313" y="358" font-size="16" fill="#102A2B">可見標示由你決定</text>
<rect x="41" y="515" width="1518" height="115" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="560" font-size="22" font-weight="700" fill="#B8442D" text-anchor="middle">同意影片與分身素材要同一人、同一種光線</text>
<text x="800" y="600" font-size="18" fill="#102A2B" text-anchor="middle">結尾的 4 個英文字母分開念；替別人做分身時，同意影片一定要本人錄</text>
<rect x="41" y="660" width="1518" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="712" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">免費方案：每月 3 支、每支 1 分鐘、最高 1080p，浮水印無法移除</text>
<text x="800" y="754" font-size="19" fill="#5C6B6B" text-anchor="middle">去浮水印與 30 分鐘長度從 Creator 起，4K 輸出從 Pro 起</text>
