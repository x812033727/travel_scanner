<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">數位分身影片的五個步驟 / Five steps of an AI avatar video</title>
<desc id="desc">由左到右五個步驟。第一步錄製素材：一鏡到底不剪接，至少 2 分鐘，建議 1080p、30fps，眼睛看鏡頭，手不高過胸口。第二步同意與驗證：本人錄並念指定文字，長度 30 秒以內，結尾念 4 個英文字母，兩段影片必須是同一人。第三步寫腳本：照片轉影片的腳本上限 5000 字元，政治與詐騙題材會被退。第四步生成影片：Avatar IV 照片外觀每分鐘 16 點、影片外觀 31 點，Avatar V 每分鐘 48 點，只算實際生成的秒數。第五步輸出與標示：可選 720p、1080p 或 4K，可下載 SRT 字幕，觀眾看得到的標示由你自己決定。下方兩條提醒：同意影片與分身素材要同一人、同一種光線，結尾的 4 個英文字母要分開念，替別人做分身時同意影片一定要本人錄；免費方案每月 3 支、每支 1 分鐘、最高 1080p，浮水印無法移除，去浮水印與 30 分鐘長度從 Creator 起，4K 輸出從 Pro 起。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">數位分身影片：從錄製到標示的五個步驟</text>
<text x="40" y="84" font-size="18" fill="#5C6B6B">Digital twin video: record, consent, script, generate, label</text>
<rect x="41" y="150" width="266" height="330" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="85" cy="196" r="24" fill="#0D6B68"/>
<text x="85" y="204" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="121" y="204" font-size="20" font-weight="700" fill="#102A2B">錄製素材</text>
<line x1="61" y1="238" x2="287" y2="238" stroke="#D8D2C8" stroke-width="2"/>
<text x="61" y="282" font-size="16" fill="#102A2B">一鏡到底，不剪接</text>
