<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">風格樣本與提示詞 / Style swatches and a prompt</title>
  <desc id="desc">一張插圖。左邊是一張白色樣本紙，上面排著六個抽象的風格色塊：暈染的圓形、規則的網點、方格像素、等距立方體、斜線排線，以及一道漸層光。一支箭頭從樣本紙指向右邊的白色提示詞卡片，卡片上有四行代表文字的圓角色條，其中幾條用不同顏色標出，代表被換掉的風格描述詞，最後一行結尾有一個游標。畫面下方寫著「把風格寫成描述詞」。</desc>
