<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">兩張卡，兩條錢的路徑</title>
<desc id="desc">一條垂直的灰色虛線把畫面分成左右兩半。兩半的上方各有一張同樣大小的抽象卡片：圓角矩形、白底、一條橫過卡面的粗色帶和一個橘色小方塊代表晶片，左邊的卡片是綠色邊框，右邊的是藍色邊框，卡面上沒有任何文字或標誌。左半部從卡片下緣直直落下一條綠色粗線，末端是一個綠色三角形箭頭，中間沒有任何阻隔。右半部從卡片下緣落下一條同樣粗的藍色線，但途中被兩個白底藍框的橫條擋住，過了兩道橫條之後才接到藍色三角形箭頭。兩個箭頭下方各有一個同樣大小的白色圓角方塊，左邊綠框、右邊藍框，代表錢最後到達的地方。整張圖沒有文字、沒有任何金融機構的標誌，也沒有曲線或柱狀圖。</desc>
