<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同一個動作，兩條錢的路徑 / Where the money sits after you tap the card</title>
<desc id="desc">畫面分成左右兩欄，左欄是簽帳金融卡，右欄是信用卡，兩欄的最上面都是刷卡授權。左欄往下走到一個綠框：款項當下離開存款帳戶，授權成功即扣款，餘額不足交易就不成立，沒有帳單、也沒有繳款截止日這個環節。右欄往下走到一個藍框：發卡機構先為持卡人墊款，入帳日就是它負擔墊款義務之日，帳款在結帳日結算，由持卡人在繳款截止日前清償。兩欄最下方各有一個爭議發生時的方塊：左邊是紅框，款項已經離開帳戶，契約未設暫停付款程序，方向從暫停變成事後追回；右邊是綠框，帳款尚未清償，繳款截止日前得主張暫停付款，並得請發卡機構向收單機構進行扣款。圖的最下方兩行寫著：兩張卡的差別不在誰比較有保障，而在爭議發生時款項還在不在持卡人這一側；事後救濟兩者相同，先向業者申訴，不接受處理結果者得再申請評議。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一個動作，兩條錢的路徑</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Where the money sits after you tap the card · 依定型化契約應記載事項與範本</text>

<rect x="100" y="120" width="640" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="159" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">簽帳金融卡</text>
<rect x="860" y="120" width="640" height="58" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1180" y="159" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">信用卡</text>

<rect x="100" y="214" width="640" height="78" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="262" text-anchor="middle" font-size="23" fill="#102A2B">刷卡授權</text>
<rect x="860" y="214" width="640" height="78" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1180" y="262" text-anchor="middle" font-size="23" fill="#102A2B">刷卡授權</text>

<path d="M420 296 V344" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1180 296 V344" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="100" y="348" width="640" height="138" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="392" text-anchor="middle" font-size="25" font-weight="700" fill="#102A2B">款項當下離開存款帳戶</text>
<text x="420" y="426" text-anchor="middle" font-size="18" fill="#5C6B6B">授權成功即扣款，餘額不足交易就不成立</text>
<text x="420" y="458" text-anchor="middle" font-size="18" fill="#5C6B6B">沒有帳單、也沒有繳款截止日這個環節</text>

<rect x="860" y="348" width="640" height="138" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1180" y="392" text-anchor="middle" font-size="25" font-weight="700" fill="#102A2B">發卡機構先為持卡人墊款</text>
<text x="1180" y="426" text-anchor="middle" font-size="18" fill="#5C6B6B">入帳日就是它負擔墊款義務之日</text>
<text x="1180" y="458" text-anchor="middle" font-size="18" fill="#5C6B6B">結帳日結算，繳款截止日前由持卡人清償</text>

<path d="M420 490 V538" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1180 490 V538" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="100" y="542" width="640" height="170" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="420" y="580" text-anchor="middle" font-size="18" fill="#5C6B6B">爭議發生時</text>
<text x="420" y="622" text-anchor="middle" font-size="25" font-weight="700" fill="#102A2B">款項已經離開帳戶</text>
<text x="420" y="656" text-anchor="middle" font-size="18" fill="#5C6B6B">契約未設暫停付款程序</text>
<text x="420" y="688" text-anchor="middle" font-size="18" fill="#5C6B6B">方向從暫停變成事後追回</text>

<rect x="860" y="542" width="640" height="170" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1180" y="580" text-anchor="middle" font-size="18" fill="#5C6B6B">爭議發生時</text>
<text x="1180" y="622" text-anchor="middle" font-size="25" font-weight="700" fill="#102A2B">帳款尚未清償</text>
<text x="1180" y="656" text-anchor="middle" font-size="18" fill="#5C6B6B">繳款截止日前得主張暫停付款</text>
<text x="1180" y="688" text-anchor="middle" font-size="18" fill="#5C6B6B">並得請發卡機構向收單機構扣款</text>

<text x="100" y="764" font-size="19" fill="#5C6B6B">兩張卡的差別不在誰比較有保障，而在爭議發生時款項還在不在持卡人這一側。</text>
<text x="100" y="798" font-size="19" fill="#5C6B6B">事後救濟兩者相同：先向業者申訴，不接受處理結果者得再申請評議。</text>
