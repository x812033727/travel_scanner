<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">AI 能縮短哪一段：三種內容的製作步驟 / Which production steps AI can shorten</title>
<desc id="desc">三列流程圖，每列由左到右是一種內容的五個製作步驟。部落格：找資料與實測（自己做）、大綱與初稿（AI 能縮短）、查證與改寫（自己做）、標題與摘要（AI 能縮短）、發布與回覆（自己做）。電子報：挑選素材（自己做）、段落初稿（AI 能縮短）、編輯與查證（自己做）、標題與摘要（AI 能縮短）、回覆讀者（自己做）。短影音：腳本初稿（AI 能縮短）、拍攝或錄音（自己做）、剪輯判斷（自己做）、字幕初稿（AI 能縮短）、校對與揭露（自己做）。青綠色格是 AI 能縮短的步驟，橘框白底格是要自己做的步驟；每一列都是起草交給 AI、判斷與查證留給自己。</desc>
