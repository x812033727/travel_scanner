<title id="title">OpenAI 프런티어 거버넌스 프레임워크 공개: &#x27;50명·10억 달러&#x27; 기준은 어디서 왔고, 누가 추적할 수 있나</title><desc id="desc">오리지널 일러스트. 왼쪽은 이 프레임워크를 나타내는 문서, 가운데는 동시에 대응하는 두 규정을 나타내는 겹친 원 두 개, 오른쪽은 아래에서 위로 낮은 위험에서 높은 위험 순으로 놓인 세 칸 막대이며, 맨 위 칸만 점선으로 문서가 스스로 탐색적이라고 밝힌 등급임을 나타냅니다.</desc>
