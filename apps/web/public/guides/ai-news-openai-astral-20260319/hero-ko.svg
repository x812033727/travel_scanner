<title id="title">OpenAI, Astral 인수 발표: 오픈소스 도구 uv·Ruff·ty의 향방</title><desc id="desc">오리지널 일러스트: 왼쪽에 나란히 놓인 세 개의 작은 사각형은 uv, Ruff, ty 세 도구를 나타내고, 점선 화살표가 점선 원을 지나 오른쪽을 가리킵니다. 오른쪽에는 점선 테두리 안의 화면이 있으며, 거래가 발표되었으나 완료 조건이 갖춰져야 비로소 합쳐짐을 나타냅니다.</desc>
