<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">清邁怎麼進城：機場、火車站與阿凱巴士站 / Getting into Chiang Mai</title>
  <desc id="desc">示意圖，方向與距離非比例。中間是古城方框，四邊畫成護城河，東側標塔佩門 ประตูท่าแพ，湄平河畫成一條帶狀，在古城東側，只畫到湄平河畔那一段。左下是清邁國際機場，旁邊小字寫 AOT 機場接駁巴士在國際航廈 12 號門上車。青綠色實線代表有固定路線的巴士：A1 從機場經尼曼區再經 Huay Kaew 路到古城護城河，標 40 泰銖；A2 從機場經 Mahidol 路到夜市周邊的長康路一帶各飯店，標 40 泰銖；較細的青綠色線是市區公車黃線與紅線，連機場、夜市與塔佩門，小字寫末班以現場站牌為準。棕色實線是 A3，經二環路到體育場，標 60 泰銖。珊瑚紅虛線代表叫車或雙條車：機場到古城叫車約 15 分；上方的阿凱巴士站到古城，標離市中心約 3 公里，小字寫往曼谷、清萊的長途車；從古城往上方圖外的箭頭是往清邁火車站，不標方位，標到瓦洛洛市場雙條車約 20 分。古城、尼曼區、夜市周邊與湄平河畔各是一個色塊，夜市周邊色塊內小字寫長康路 Chang Klan，從古城搭雙條車約 10 分。右下角圖例：實線是有固定路線的巴士，虛線是叫車或雙條車。</desc>
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D6B68"/></marker>
    <marker id="arrowMocha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4A3A"/></marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8442D"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">清邁怎麼進城：機場、火車站與阿凱巴士站</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Getting into Chiang Mai: airport, train station and Arcade bus terminal</text>

  <!-- Mae Ping river band -->
  <path d="M1196,345 C1214,440 1222,545 1195,640 C1175,720 1195,760 1190,800" fill="none" stroke="#A9CDE4" stroke-width="34" stroke-linecap="round"/>
  <text x="1236" y="376" font-size="18" font-weight="700" fill="#2F6F9F">湄平河</text>

  <!-- Old city with moat -->
  <rect x="600" y="300" width="280" height="280" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="12"/>
  <rect x="616" y="316" width="248" height="248" rx="8" fill="#FFFFFF" stroke="#C7DCEB" stroke-width="3"/>
  <text x="740" y="402" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">古城</text>
  <text x="740" y="436" font-size="16" fill="#5C6B6B" text-anchor="middle">四邊是護城河</text>
  <circle cx="880" cy="450" r="9" fill="#0D6B68"/>
  <text x="850" y="494" font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">塔佩門</text>
  <text x="850" y="518" font-size="16" fill="#102A2B" text-anchor="end">ประตูท่าแพ</text>

  <!-- Nimman -->
  <rect x="270" y="330" width="180" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="360" y="388" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">尼曼區</text>

  <!-- Night Bazaar area -->
  <rect x="900" y="555" width="240" height="135" rx="14" fill="#FBEBD9" stroke="#D97A2B" stroke-width="4"/>
  <text x="1020" y="595" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">夜市周邊</text>
  <text x="1020" y="627" font-size="16" fill="#102A2B" text-anchor="middle">長康路 Chang Klan</text>
  <text x="1020" y="657" font-size="15" fill="#5C6B6B" text-anchor="middle">古城搭雙條車約 10 分</text>

  <!-- Mae Ping riverside -->
  <rect x="1216" y="400" width="250" height="100" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1341" y="448" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">湄平河畔</text>
  <text x="1341" y="480" font-size="16" fill="#5C6B6B" text-anchor="middle">河的東岸一帶</text>

  <!-- Stadium -->
  <rect x="40" y="300" width="200" height="90" rx="14" fill="#F3E7DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="140" y="354" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">體育場</text>

  <!-- Arcade bus terminal -->
  <rect x="540" y="110" width="400" height="90" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="740" y="148" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">阿凱巴士站</text>
  <text x="740" y="178" font-size="16" fill="#5C6B6B" text-anchor="middle">Arcade Bus Terminal・往曼谷、清萊的長途車</text>
  <path d="M740,202 L740,296" fill="none" stroke="#B8442D" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowCoral)"/>
  <text x="762" y="256" font-size="17" font-weight="700" fill="#B8442D">離市中心約 3 公里</text>

  <!-- Airport -->
  <rect x="60" y="630" width="280" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="200" y="702" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">清邁國際機場</text>
  <text x="200" y="734" font-size="18" fill="#5C6B6B" text-anchor="middle">CNX</text>
  <text x="200" y="826" font-size="16" fill="#102A2B" text-anchor="middle">AOT 機場接駁巴士：</text>
  <text x="200" y="850" font-size="16" fill="#102A2B" text-anchor="middle">國際航廈 12 號門上車</text>

  <!-- A1: airport -> Nimman -> Huay Kaew Rd -> moat -->
  <path d="M200,628 L358,436" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <path d="M452,380 L596,380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="292" y="552" font-size="18" font-weight="700" fill="#0D6B68">A1 40 泰銖</text>
  <text x="524" y="366" font-size="16" fill="#102A2B" text-anchor="middle">Huay Kaew 路</text>
  <text x="524" y="408" font-size="16" fill="#102A2B" text-anchor="middle">到古城護城河</text>

  <!-- A3: airport -> ring road -> stadium -->
  <path d="M100,628 L100,394" fill="none" stroke="#6B4A3A" stroke-width="5" marker-end="url(#arrowMocha)"/>
  <text x="116" y="508" font-size="18" font-weight="700" fill="#6B4A3A">A3 60 泰銖</text>
  <text x="116" y="534" font-size="16" fill="#102A2B">經二環路</text>

  <!-- A2: airport -> Mahidol Rd -> Night Bazaar / Chang Klan hotels -->
  <path d="M342,770 L1020,770 L1020,694" fill="none" stroke="#0D6B68" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrowTeal)"/>
  <text x="560" y="804" font-size="18" font-weight="700" fill="#0D6B68">A2 40 泰銖：經 Mahidol 路到長康路一帶各飯店</text>

  <!-- City bus yellow / red line -->
  <path d="M342,705 L860,705 L922,650" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linejoin="round" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <path d="M934,553 L888,458" fill="none" stroke="#0D6B68" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="380" y="692" font-size="16" font-weight="700" fill="#0D6B68">市區公車 黃線／紅線</text>
  <text x="380" y="732" font-size="15" fill="#5C6B6B">末班以現場站牌為準</text>

  <!-- Taxi / Grab airport -> old city -->
  <path d="M342,652 L636,580" fill="none" stroke="#B8442D" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowCoral)"/>
  <text x="372" y="594" font-size="17" font-weight="700" fill="#B8442D">叫車約 15 分</text>

  <!-- Train station (outside the drawing) -->
  <path d="M884,322 L1060,26" fill="none" stroke="#B8442D" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowCoral)"/>
  <text x="1078" y="62" font-size="18" font-weight="700" fill="#B8442D">往清邁火車站（圖外）</text>
  <text x="1078" y="90" font-size="16" fill="#102A2B">到瓦洛洛市場 雙條車約 20 分</text>

  <!-- Legend -->
  <rect x="1250" y="640" width="330" height="200" rx="14" fill="#FFFFFF" stroke="#C9C2B4" stroke-width="3"/>
  <text x="1270" y="672" font-size="18" font-weight="700" fill="#102A2B">圖例</text>
  <path d="M1270,702 L1330,702" stroke="#0D6B68" stroke-width="5"/>
  <text x="1346" y="708" font-size="16" fill="#102A2B">實線＝有固定路線的巴士</text>
  <path d="M1270,744 L1330,744" stroke="#B8442D" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="1346" y="750" font-size="16" fill="#102A2B">虛線＝叫車或雙條車</text>
  <text x="1270" y="796" font-size="16" fill="#5C6B6B">示意圖，方向與距離非比例</text>
  <text x="1270" y="822" font-size="15" fill="#5C6B6B">火車站畫在圖外，不標方位</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
