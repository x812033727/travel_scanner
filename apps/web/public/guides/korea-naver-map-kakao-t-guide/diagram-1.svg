<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">韓國該用哪個 App：查路線、叫車、路邊攔車 / Which app to use in Korea</title>
  <desc id="desc">決策樹，根節點是「你現在要做什麼？」，分三支。第一支查路線、轉乘：用 Naver Map（네이버 지도）或 KakaoMap（카카오맵），貼上韓文店名或地址搜尋，看搭哪一線、幾號出口與即時公車，出發前先收藏目的地。第二支叫計程車：先問有沒有 Kakao 帳號、而且確定收得到驗證；否或不確定就用 k.ride（케이라이드），輸入電話號碼再用 Google、Apple 或 Email 驗證，App 內綁海外卡；是就用 Kakao T（카카오 T），要 Kakao 帳號，自動付款或下車付司機現金、卡、T-money。兩條路都要在叫車前看預估車資，上車前核對車牌；備案是 TADA 與 TABA。第三支路邊攔車：給司機看韓文地址，下車付現金、刷卡或 T-money。首爾計程車費與深夜加成見正文表格，功能與付款選項以 App 當下為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">韓國該用哪個 App：查路線、叫車、路邊攔車</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which app in Korea: route search, ride-hailing or a street hail</text>

  <!-- root -->
  <rect x="560" y="104" width="480" height="72" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="137" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">你現在要做什麼？</text>
  <text x="800" y="164" font-size="16" fill="#5C6B6B" text-anchor="middle">What do you need right now?</text>
  <path d="M 800 176 L 800 198" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 260 198 L 1385 198" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 260 196 L 260 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 840 196 L 840 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1385 196 L 1385 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- branch headers -->
  <rect x="40" y="222" width="440" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="260" y="252" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">查路線、轉乘</text>
  <text x="260" y="279" font-size="16" fill="#0B4F4D" text-anchor="middle">Routes and transfers</text>

  <rect x="520" y="222" width="640" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="840" y="252" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">叫計程車</text>
  <text x="840" y="279" font-size="16" fill="#1F4E73" text-anchor="middle">Call a taxi with an app</text>

  <rect x="1200" y="222" width="370" height="70" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="252" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">路邊攔車</text>
  <text x="1385" y="279" font-size="16" fill="#8A4A14" text-anchor="middle">Hail one on the street</text>

  <!-- left branch: maps -->
  <path d="M 260 292 L 260 316" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="322" width="440" height="128" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="260" y="374" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">네이버 지도 Naver Map</text>
  <text x="260" y="416" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">카카오맵 KakaoMap</text>
  <path d="M 260 450 L 260 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="492" width="440" height="278" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="536" font-size="19" font-weight="700" fill="#102A2B">貼上韓文店名或地址搜尋</text>
  <text x="70" y="562" font-size="16" fill="#5C6B6B">Paste the Korean name or address</text>
  <text x="70" y="616" font-size="19" font-weight="700" fill="#102A2B">看搭哪一線、幾號出口、即時公車</text>
  <text x="70" y="642" font-size="16" fill="#5C6B6B">Line, exit and live bus arrivals</text>
  <text x="70" y="696" font-size="19" font-weight="700" fill="#102A2B">出發前先收藏目的地</text>
  <text x="70" y="722" font-size="16" fill="#5C6B6B">Save places before you go</text>

  <!-- middle branch: ride-hailing -->
  <path d="M 840 292 L 840 320" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <polygon points="840,324 1120,386 840,448 560,386" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="840" y="376" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">有 Kakao 帳號、而且</text>
  <text x="840" y="401" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">確定收得到驗證嗎？</text>
  <text x="840" y="422" font-size="15" fill="#5C6B6B" text-anchor="middle">Kakao account ready?</text>
  <path d="M 840 448 L 840 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 460 L 1005 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 458 L 675 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1005 458 L 1005 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="699" y="487" font-size="16" fill="#5C6B6B">否或不確定 No / not sure</text>
  <text x="1029" y="487" font-size="16" fill="#5C6B6B">是 Yes</text>

  <rect x="520" y="500" width="310" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="675" y="536" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">케이라이드 k.ride</text>
  <text x="675" y="568" font-size="16" fill="#1F4E73" text-anchor="middle">電話號碼＋Google、Apple</text>
  <text x="675" y="594" font-size="16" fill="#1F4E73" text-anchor="middle">或 Email 驗證</text>
  <text x="675" y="620" font-size="16" fill="#1F4E73" text-anchor="middle">App 內綁海外卡</text>

  <rect x="850" y="500" width="310" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1005" y="536" font-size="21" font-weight="700" fill="#0B4F4D" text-anchor="middle">카카오 T Kakao T</text>
  <text x="1005" y="568" font-size="16" fill="#0B4F4D" text-anchor="middle">要 Kakao 帳號</text>
  <text x="1005" y="594" font-size="16" fill="#0B4F4D" text-anchor="middle">自動付款，或下車付司機</text>
  <text x="1005" y="620" font-size="16" fill="#0B4F4D" text-anchor="middle">現金、卡、T-money</text>

  <path d="M 675 650 L 675 686" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1005 650 L 1005 686" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="520" y="692" width="640" height="80" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="840" y="724" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">叫車前看預估車資，上車前核對車牌</text>
  <text x="840" y="754" font-size="16" fill="#5C6B6B" text-anchor="middle">Check the fare estimate, then match the plate</text>
  <text x="840" y="804" font-size="17" fill="#5C6B6B" text-anchor="middle">備案 Backups：TADA、TABA</text>

  <!-- right branch: street hail -->
  <path d="M 1385 292 L 1385 316" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1200" y="322" width="370" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="378" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">給司機看韓文地址</text>
  <text x="1385" y="410" font-size="16" fill="#5C6B6B" text-anchor="middle">Show the driver the Korean address</text>
  <path d="M 1385 450 L 1385 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1200" y="500" width="370" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="548" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">下車付現金、刷卡</text>
  <text x="1385" y="580" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">或 T-money</text>
  <text x="1385" y="618" font-size="16" fill="#5C6B6B" text-anchor="middle">Pay cash, card or T-money</text>

  <!-- footer -->
  <text x="60" y="846" font-size="17" fill="#102A2B">首爾計程車費與深夜加成見正文表格；功能與付款選項以 App 當下為準。</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
