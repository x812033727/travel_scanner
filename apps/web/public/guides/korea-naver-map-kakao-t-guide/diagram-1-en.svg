<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Noto Sans JP','Noto Sans KR','Noto Sans SC','Yu Gothic','Malgun Gothic','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">Which app in Korea: routes, taxi booking or a street hail</title>
  <desc id="desc">A decision tree beginning with “What do you need right now?” and splitting into three branches. For routes and transfers, use Naver Map (네이버 지도) or KakaoMap (카카오맵), paste the Korean business name or address, check the line, exit and live bus arrivals, and save places before departure. To book a taxi, first ask whether you have a Kakao account and are certain verification will work. If not or unsure, use k.ride (케이라이드): enter a phone number, verify through Google, Apple or email, and register an overseas-issued card in the app. If yes, use Kakao T (카카오 T), which requires a Kakao account and supports automatic payment or paying the driver with cash, card or T-money at the end of the ride. On either branch, check the fare estimate before booking and the license plate before boarding. TADA and TABA are backups. For a street hail, show the driver the Korean address and pay cash, card or T-money at the end. See the article’s table for Seoul taxi fares and late-night surcharges; features and payment options depend on the app at the time.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Which app in Korea: routes, taxi booking or a street hail</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Choose a map app, a taxi app, or a taxi on the street</text>

  <!-- root -->
  <rect x="560" y="104" width="480" height="72" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="137" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">What do you need right now?</text>
  <text x="800" y="164" font-size="16" fill="#5C6B6B" text-anchor="middle">Choose the task you need</text>
  <path d="M 800 176 L 800 198" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 260 198 L 1385 198" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 260 196 L 260 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 840 196 L 840 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1385 196 L 1385 216" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- branch headers -->
  <rect x="40" y="222" width="440" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="260" y="252" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">Routes and transfers</text>
  <text x="260" y="279" font-size="16" fill="#0B4F4D" text-anchor="middle">Find your route and connections</text>

  <rect x="520" y="222" width="640" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="840" y="252" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">Book a taxi</text>
  <text x="840" y="279" font-size="16" fill="#1F4E73" text-anchor="middle">Call a taxi with an app</text>

  <rect x="1200" y="222" width="370" height="70" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="252" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">Street hail</text>
  <text x="1385" y="279" font-size="16" fill="#8A4A14" text-anchor="middle">Hail a taxi on the street</text>

  <!-- left branch: maps -->
  <path d="M 260 292 L 260 316" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="322" width="440" height="128" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="260" y="374" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">네이버 지도 Naver Map</text>
  <text x="260" y="416" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">카카오맵 KakaoMap</text>
  <path d="M 260 450 L 260 486" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="492" width="440" height="278" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="536" font-size="18" font-weight="700" fill="#102A2B">Search with a Korean name or address</text>
  <text x="70" y="562" font-size="16" fill="#5C6B6B">Paste the Korean business name or address</text>
  <text x="70" y="616" font-size="18" font-weight="700" fill="#102A2B">Check line, exit and live bus arrivals</text>
  <text x="70" y="642" font-size="16" fill="#5C6B6B">Which line, which exit, when the bus arrives</text>
  <text x="70" y="696" font-size="19" font-weight="700" fill="#102A2B">Save places before departure</text>
  <text x="70" y="722" font-size="16" fill="#5C6B6B">Add your destinations to saved places</text>

  <!-- middle branch: ride-hailing -->
  <path d="M 840 292 L 840 320" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <polygon points="840,324 1120,386 840,448 560,386" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="840" y="376" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Have a Kakao account, and</text>
  <text x="840" y="401" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">sure verification will work?</text>
  <text x="840" y="422" font-size="15" fill="#5C6B6B" text-anchor="middle">Account verified?</text>
  <path d="M 840 448 L 840 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 460 L 1005 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 458 L 675 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1005 458 L 1005 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="699" y="487" font-size="16" fill="#5C6B6B">No / not sure</text>
  <text x="1029" y="487" font-size="16" fill="#5C6B6B">Yes</text>

  <rect x="520" y="500" width="310" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="675" y="536" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">케이라이드 k.ride</text>
  <text x="675" y="568" font-size="16" fill="#1F4E73" text-anchor="middle">Phone number + Google, Apple</text>
  <text x="675" y="594" font-size="16" fill="#1F4E73" text-anchor="middle">or email verification</text>
  <text x="675" y="620" font-size="15" fill="#1F4E73" text-anchor="middle">Register an overseas card in-app</text>

  <rect x="850" y="500" width="310" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1005" y="536" font-size="21" font-weight="700" fill="#0B4F4D" text-anchor="middle">카카오 T Kakao T</text>
  <text x="1005" y="568" font-size="16" fill="#0B4F4D" text-anchor="middle">Kakao account required</text>
  <text x="1005" y="594" font-size="16" fill="#0B4F4D" text-anchor="middle">Auto-pay, or pay the driver</text>
  <text x="1005" y="620" font-size="16" fill="#0B4F4D" text-anchor="middle">Cash, card or T-money</text>

  <path d="M 675 650 L 675 686" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1005 650 L 1005 686" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="520" y="692" width="640" height="80" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="840" y="724" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Check fare before booking; match plate before boarding</text>
  <text x="840" y="754" font-size="16" fill="#5C6B6B" text-anchor="middle">Read the estimate, then check the license plate</text>
  <text x="840" y="804" font-size="17" fill="#5C6B6B" text-anchor="middle">Backups: TADA, TABA</text>

  <!-- right branch: street hail -->
  <path d="M 1385 292 L 1385 316" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1200" y="322" width="370" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="378" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Show the Korean address</text>
  <text x="1385" y="410" font-size="16" fill="#5C6B6B" text-anchor="middle">Show the driver the address in Korean</text>
  <path d="M 1385 450 L 1385 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1200" y="500" width="370" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1385" y="548" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Pay cash or card at the end</text>
  <text x="1385" y="580" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">or use T-money</text>
  <text x="1385" y="618" font-size="16" fill="#5C6B6B" text-anchor="middle">Pay cash, card or T-money</text>

  <!-- footer -->
  <text x="60" y="846" font-size="17" fill="#102A2B">Seoul fares and night surcharges: see the article. Check current app features and payment options.</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair illustration 2026</text>
</svg>
