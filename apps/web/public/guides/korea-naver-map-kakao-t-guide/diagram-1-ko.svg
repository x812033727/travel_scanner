<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Noto Sans JP','Noto Sans KR','Noto Sans SC','Yu Gothic','Malgun Gothic','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">한국에서 쓸 앱: 길 찾기·택시 호출·길에서 택시 잡기</title>
  <desc id="desc">“지금 무엇을 하려는가?”를 시작점으로 하는 세 갈래 결정 트리다. 첫째, 길 찾기와 환승에는 네이버 지도(네이버 지도) 또는 카카오맵(카카오맵)을 사용한다. 한국어 상호나 주소를 붙여 넣어 검색하고, 이용 노선·출구 번호·실시간 버스를 확인하며 출발 전에 목적지를 저장한다. 둘째, 택시를 호출할 때는 카카오 계정이 있고 인증을 확실히 받을 수 있는지 먼저 묻는다. 아니거나 불확실하면 k.ride(케이라이드)를 사용해 전화번호를 입력한 뒤 Google·Apple 또는 이메일로 인증하고 앱에 해외 카드를 등록한다. 카카오 계정이 있고 인증도 확실히 받을 수 있다면 카카오 T(카카오 T)를 사용한다. 카카오 계정이 필요하며 자동결제하거나 하차할 때 기사에게 현금·카드·T-money로 결제한다. 두 경로 모두 호출 전에 예상 요금을 확인하고 탑승 전에 차량 번호를 대조한다. 예비 앱은 TADA와 TABA다. 셋째, 길에서 택시를 잡을 때는 기사에게 한국어 주소를 보여 주고 하차 시 현금·신용카드·T-money로 결제한다. 서울 택시 요금과 심야 할증은 본문의 표를 참고하고, 기능과 결제 선택지는 앱의 최신 표시를 따른다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">한국에서 쓸 앱: 길 찾기·택시 호출·길에서 택시 잡기</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">지도 앱으로 경로 검색, 앱으로 호출, 길에서 승차</text>

