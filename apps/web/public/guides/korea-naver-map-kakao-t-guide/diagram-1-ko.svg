  <polygon points="840,324 1120,386 840,448 560,386" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="840" y="376" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Kakao 계정이 있고,</text>
  <text x="840" y="401" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">인증도 확실히 받을 수 있나요?</text>
  <text x="840" y="422" font-size="15" fill="#5C6B6B" text-anchor="middle">계정·인증 준비 완료?</text>
  <path d="M 840 448 L 840 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 460 L 1005 460" stroke="#5C6B6B" stroke-width="4" fill="none"/>
  <path d="M 675 458 L 675 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1005 458 L 1005 494" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="699" y="487" font-size="16" fill="#5C6B6B">아니요 / 불확실</text>
  <text x="1029" y="487" font-size="16" fill="#5C6B6B">예</text>

  <rect x="520" y="500" width="310" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="675" y="536" font-size="21" font-weight="700" fill="#1F4E73" text-anchor="middle">케이라이드 k.ride</text>
  <text x="675" y="568" font-size="16" fill="#1F4E73" text-anchor="middle">전화번호 + Google·Apple</text>
  <text x="675" y="594" font-size="16" fill="#1F4E73" text-anchor="middle">또는 이메일로 인증</text>
  <text x="675" y="620" font-size="16" fill="#1F4E73" text-anchor="middle">앱에 해외 발행 카드 등록</text>

  <rect x="850" y="500" width="310" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1005" y="536" font-size="21" font-weight="700" fill="#0B4F4D" text-anchor="middle">카카오 T Kakao T</text>
  <text x="1005" y="568" font-size="16" fill="#0B4F4D" text-anchor="middle">Kakao 계정 필요</text>
  <text x="1005" y="594" font-size="16" fill="#0B4F4D" text-anchor="middle">자동결제 또는 하차 시 기사에게</text>
  <text x="1005" y="620" font-size="16" fill="#0B4F4D" text-anchor="middle">현금·카드·T-money로 결제</text>

