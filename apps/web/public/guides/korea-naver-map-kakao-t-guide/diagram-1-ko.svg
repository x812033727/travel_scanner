  <rect x="560" y="104" width="480" height="72" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="137" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">지금 무엇을 하려 하나요?</text>
  <text x="800" y="164" font-size="16" fill="#5C6B6B" text-anchor="middle">필요한 기능을 골라 보세요</text>
