  <text x="260" y="252" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">길 찾기·환승</text>
  <text x="260" y="279" font-size="16" fill="#0B4F4D" text-anchor="middle">이동 경로와 환승 확인</text>

