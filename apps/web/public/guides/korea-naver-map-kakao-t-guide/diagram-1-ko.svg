  <text x="70" y="562" font-size="16" fill="#5C6B6B">한국어 이름 또는 주소로 찾기</text>
  <text x="70" y="616" font-size="19" font-weight="700" fill="#102A2B">노선·출구·실시간 버스 도착 확인</text>
  <text x="70" y="642" font-size="16" fill="#5C6B6B">탈 노선, 나갈 출구, 버스 도착 시간</text>
  <text x="70" y="696" font-size="19" font-weight="700" fill="#102A2B">출발 전에 목적지 저장</text>
  <text x="70" y="722" font-size="16" fill="#5C6B6B">갈 곳을 미리 즐겨찾기에 추가</text>

