<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Foundation Model Diagram</title><desc id="desc">One foundation model connects to classification, summarization and search. Each feature has its own task data and acceptance checks; a single evaluation does not cover them all.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">Shared model, separate adaptation and checks</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Foundation Model</text><rect x="80" y="330" width="400" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="280" y="452" text-anchor="middle" font-size="24" fill="#102A2B" style="font-size: 24px;">Broadly trained foundation model</text><path d="M 480 440 L 650 230" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="230" r="10" fill="#0D6B68"></circle><path d="M 480 440 L 650 440" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="440" r="10" fill="#0D6B68"></circle><path d="M 480 440 L 650 650" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="650" r="10" fill="#0D6B68"></circle><rect x="650" y="160" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="815" y="237" text-anchor="middle" font-size="36" fill="#102A2B">Adapt to classify</text><rect x="650" y="375" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="815" y="452" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">Adapt to summarize</text><rect x="650" y="590" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="815" y="667" text-anchor="middle" font-size="36" fill="#102A2B">Adapt to search</text><path d="M 980 225 L 1150 225" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1150" cy="225" r="10" fill="#0D6B68"></circle><path d="M 980 440 L 1150 440" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1150" cy="440" r="10" fill="#0D6B68"></circle><path d="M 980 655 L 1150 655" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1150" cy="655" r="10" fill="#0D6B68"></circle><rect x="1150" y="160" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="1325" y="237" text-anchor="middle" font-size="36" fill="#102A2B">Category checks</text><rect x="1150" y="375" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="1325" y="452" text-anchor="middle" font-size="36" fill="#102A2B">Fidelity checks</text><rect x="1150" y="590" width="350" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="1325" y="667" text-anchor="middle" font-size="36" fill="#102A2B">Relevance checks</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">Graphic © Mokaair 2026</text></svg>
