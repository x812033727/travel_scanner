<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">파운데이션 모델 도해 / Foundation Model</title><desc id="desc">같은 파운데이션 모델이 분류·요약·검색 기능에 각각 연결된다. 각 기능에는 자체 작업 데이터와 검증이 필요하며, 한 번의 평가로 전부를 검증하지는 않는다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">공유 모델도 개별 조정·검증 필요</text><text x="60" y="84" fill="#5C6B6B" font-size="18">파운데이션 모델</text><rect x="80" y="330" width="400" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="280" y="452" text-anchor="middle" font-size="36" fill="#102A2B">폭넓게 학습한 기반 모델</text><path d="M 480 440 L 650 230" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="650" cy="230" r="10" fill="#0D6B68" /><path d="M 480 440 L 650 440" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="650" cy="440" r="10" fill="#0D6B68" /><path d="M 480 440 L 650 650" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="650" cy="650" r="10" fill="#0D6B68" /><rect x="650" y="160" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="815" y="237" text-anchor="middle" font-size="36" fill="#102A2B">분류용 조정</text><rect x="650" y="375" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="815" y="452" text-anchor="middle" font-size="36" fill="#102A2B">요약용 조정</text><rect x="650" y="590" width="330" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="815" y="667" text-anchor="middle" font-size="36" fill="#102A2B">검색용 조정</text><path d="M 980 225 L 1150 225" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1150" cy="225" r="10" fill="#0D6B68" /><path d="M 980 440 L 1150 440" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1150