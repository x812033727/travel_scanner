<text x="800" y="172" text-anchor="middle" font-size="16" fill="#102A2B">케이블카 왕복 14,000원・6–11월 9:00–18:00</text>
<text x="800" y="200" text-anchor="middle" font-size="15" fill="#5C6B6B">동화사 桐華寺・정상 820m</text>
<text x="800" y="228" text-anchor="middle" font-size="15" fill="#5C6B6B">동대구역에서 약 20km・25분（승용차）</text>
<path d="M 800 328 L 800 258" stroke="#2E7D5B" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

<rect x="540" y="330" width="520" height="260" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
