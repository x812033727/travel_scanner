<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">大邱市中心與三個出城方向 / Downtown Daegu and the half-day trips out of town</title>
<desc id="desc">示意圖。中央是市中心色塊，裡面有三個地鐵站方框：3 號線的西門市場站、1 號線與 2 號線轉乘的半月堂站、1 號線的中央路站；色塊裡列出 Day 1 的四個點西門市場、近代文化胡同、慶尚監營公園、東城路，以及南邊大鳳洞的金光石街。往北一支實線箭頭指向八公山，標纜車大人往返一萬四千韓元、六月到十一月九點到十八點，旁邊小字是桐華寺、山頂海拔八百二十公尺，以及從東大邱站開車約二十公里、二十五分。往南一支實線箭頭指向前山，標纜車大人往返一萬四千韓元、九月的週五六日末班九點半，小字是前山公園站經過三百號與四百一十號公車。往東南一支實線箭頭指向壽城池，標三號線壽城池站、免費。往西一支虛線箭頭指向八十三塔與伊月世界，標二號線頭流站，是下雨或帶小孩的備案。右上角另標西門市場九點到十八點、夜市週五六晚上七點到十一點半。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#5C6B6B"/>
</marker>
</defs>

<text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">大邱市中心與三個出城方向</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Downtown Daegu and the half-day trips out of town</text>
<text x="1560" y="46" text-anchor="end" font-size="16" fill="#5C6B6B">示意圖，方向與距離非比例</text>
<text x="1560" y="74" text-anchor="end" font-size="16" fill="#5C6B6B">서문시장 9:00–18:00 ／ 야시장 금·토 19:00–23:30</text>

