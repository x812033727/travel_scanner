<text x="1395" y="604" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">동남 수성못 壽城池</text>
<text x="1395" y="634" text-anchor="middle" font-size="16" fill="#102A2B">3 號線 수성못역・무료</text>

