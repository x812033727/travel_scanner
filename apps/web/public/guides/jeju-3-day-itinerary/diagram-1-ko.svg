  <text x="1510" y="298" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">우도 Udo</text>
  <text x="1510" y="320" font-size="15" fill="#5C6B6B" text-anchor="middle">배편 공식 사이트 확인</text>

