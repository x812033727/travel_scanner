  <text x="1054" y="632" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">서귀포 Seogwipo</text>
  <text x="1054" y="658" font-size="15" fill="#5C6B6B" text-anchor="middle">정방폭포 2,000원 · 09:00~17:50</text>
  <text x="1054" y="682" font-size="15" fill="#5C6B6B" text-anchor="middle">천지연폭포 2,000원 · 09:00~22:00</text>
