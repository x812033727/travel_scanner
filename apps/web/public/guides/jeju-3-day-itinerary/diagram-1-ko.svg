  <text x="1272" y="460" font-size="15" fill="#5C6B6B" text-anchor="middle">입장료 공식 사이트 기준 · 음식 반입 금지</text>

  <path d="M 1390 348 C 1408 308, 1430 278, 1460 258" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <path d="M 1296 480 L 1306 520" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
