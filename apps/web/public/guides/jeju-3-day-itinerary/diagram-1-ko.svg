<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">제주도 2박 3일 여행 동선도: 동부 코스, 서귀포·한라산</title>
  <desc id="desc">비율을 단순화한 제주도 여행 동선도예요. 북쪽에는 제주국제공항과 제주시(Day 1 용두암, 동문시장)가 있어요. Day 2는 동부 코스로, 동해안을 따라 성산일출봉(9·10월 05:00~19:00, 18:00 매표 마감, 매월 첫째 월요일 휴무)에 오른 뒤 배를 타고 우도(섬 마을버스 950원)를 둘러보고 섭지코지로 이어져요. Day 3은 남쪽 서귀포에서 정방폭포(성인 2,000원, 09:00~17:50)와 천지연폭포(2,000원, 09:00~22:00)를 보거나, 중앙의 한라산(성판악 9.6km·관음사 8.7km 상단 구간 예약제, 어리목 6.8km·영실 5.8km 정상 미등정)을 올라요. 공항리무진 600번은 공항 5번 게이트에서 출발해 중문관광단지를 거쳐 서귀포로 가며, 구간 요금 1,300~5,500원, 배차 간격 16~40분이에요. 서쪽 애월·협재는 대체 코스로 활용할 수 있어요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <rect x="0" y="130" width="1600" height="770" fill="#DDE9EE"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">제주도 2박 3일 · 동부 코스 중심, 3일차 서귀포 또는 한라산</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Jeju 3-Day Itinerary · 간략 동선도(비율 상이) · 입장료·버스 요금 2026년 9월 공식 사이트 확인</text>
