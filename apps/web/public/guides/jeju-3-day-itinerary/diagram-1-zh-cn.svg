<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">济州岛三天两晚路线示意图 / Jeju three-day itinerary: east loop, Seogwipo or Hallasan</title>
  <desc id="desc">简化的济州岛示意地图，非精确比例。北边是济州机场与济州市区（Day 1 龙头岩、东门市场）。Day 2 走东线：沿东海岸到城山日出峰（9、10 月 05:00 到 19:00、18:00 停止售票，每月第一个周一休息），乘船到牛岛（岛上公交 950 韩元），再到涉地可支。Day 3 到南边的西归浦看正房瀑布（成人 2,000 韩元、09:00 到 17:50）与天地渊瀑布（2,000 韩元、09:00 到 22:00），或改爬中央的汉拿山（城板岳 9.6 公里、观音寺 8.7 公里，上半段需预约，御里牧 6.8 公里、灵室 5.8 公里不登顶）。600 路机场大巴从机场 5 号门出发，经中文旅游区到西归浦，票价按区间 1,300 到 5,500 韩元、16 到 40 分钟一班。西线的涯月、挟才为替代路线。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <rect x="0" y="130" width="1600" height="770" fill="#DDE9EE"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">济州岛三天两晚　东线为主，第三天西归浦或汉拿山</text>
  <text x="60" y="100" font-size="18" fill="#5C6B6B">Jeju in three days · 示意图，非精确比例 · 门票与票价 2026 年 9 月据官网核实</text>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
  </defs>

  <!-- island and Udo -->
  <path d="M 300 470 C 320 330, 560 220, 820 215 C 1080 210, 1300 300, 1390 440 C 1440 530, 1300 690, 1040 730 C 780 765, 460 720, 340 620 C 290 575, 285 520, 300 470 Z" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <ellipse cx="1510" cy="242" rx="44" ry="24" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <text x="1510" y="204" font-size="15" fill="#5C6B6B" text-anchor="middle">岛上公交 950 韩元</text>
  <text x="1510" y="290" font-size="15" font-weight="700" fill="#102A2B" text-anchor="middle">牛岛 Udo</text>
  <text x="1508" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">船班以官网为准</text>

  <!-- Hallasan -->
  <path d="M 755 505 L 800 425 L 845 505 Z" fill="#6B4A3A"/>
  <text x="800" y="530" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">汉拿山 Hallasan</text>
  <circle cx="895" cy="502" r="7" fill="#2E7D5B"/>
  <text x="910" y="508" font-size="15" fill="#102A2B">城板岳 9.6 km · 预约制</text>
  <circle cx="825" cy="368" r="7" fill="#2E7D5B"/>
  <text x="840" y="374" font-size="15" fill="#102A2B">观音寺 8.7 km · 预约制</text>
  <circle cx="695" cy="408" r="7" fill="#2E7D5B"/>
  <text x="710" y="413" font-size="15" fill="#102A2B">御里牧 6.8 km · 约 2 小时</text>
  <circle cx="690" cy="550" r="7" fill="#2E7D5B"/>
  <text x="705" y="556" font-size="15" fill="#102A2B">灵室 5.8 km · 约 1.5 小时</text>

  <!-- airport and Jeju city (Day 1) -->
  <rect x="555" y="178" width="290" height="78" rx="18" fill="#0D6B68"/>
  <text x="700" y="210" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">济州国际机场 CJU</text>
  <text x="700" y="238" font-size="15" fill="#E6F2F1" text-anchor="middle">600 路 5 号门 · 06:00–22:40</text>

  <rect x="880" y="168" width="270" height="98" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="880" cy="168" r="27" fill="#2F6F9F"/>
  <text x="880" y="174" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <text x="1015" y="202" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">济州市区</text>
  <text x="1015" y="227" font-size="15" fill="#5C6B6B" text-anchor="middle">龙头岩 · 东门市场</text>
  <text x="1015" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">落地日住这里最方便</text>

  <!-- Day 2 east loop (label lifted cleanly above the dashed curve) -->
  <path d="M 1150 226 C 1205 240, 1235 286, 1245 348" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <text x="1185" y="212" font-size="15" font-weight="700" fill="#B8442D">急行 101／干线 201 沿东海岸</text>

  <rect x="1085" y="354" width="350" height="128" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="1085" cy="354" r="27" fill="#B8442D"/>
  <text x="1085" y="360" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 2</text>
  <text x="1260" y="392" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">城山日出峰</text>
  <text x="1260" y="417" font-size="15" fill="#5C6B6B" text-anchor="middle">9、10 月 05:00–19:00 · 18:00 停售票</text>
  <text x="1260" y="440" font-size="15" fill="#5C6B6B" text-anchor="middle">每月第一个周一休 · 登顶约 30–40 分</text>
  <text x="1260" y="463" font-size="15" fill="#5C6B6B" text-anchor="middle">门票以官网为准 · 禁带食物</text>

  <path d="M 1375 352 C 1385 288, 1412 254, 1460 245" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <path d="M 1295 484 L 1303 526" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <circle cx="1305" cy="536" r="9" fill="#B8442D"/>
  <text x="1322" y="542" font-size="15" font-weight="700" fill="#102A2B">涉地可支 · 免费</text>

  <!-- Day 3 Seogwipo -->
  <rect x="875" y="596" width="375" height="128" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="875" cy="596" r="27" fill="#2E7D5B"/>
  <text x="875" y="602" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1062" y="634" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">西归浦 Seogwipo</text>
  <text x="1062" y="659" font-size="15" fill="#5C6B6B" text-anchor="middle">正房瀑布 2,000 韩元 · 09:00–17:50</text>
  <text x="1062" y="682" font-size="15" fill="#5C6B6B" text-anchor="middle">天地渊瀑布 2,000 韩元 · 09:00–22:00</text>
  <text x="1062" y="705" font-size="15" fill="#5C6B6B" text-anchor="middle">回机场：600 路经中文 · 800 路不经中文</text>

  <!-- 600 limousine (2 crisp lines cleanly LEFT of the red dashed arc) -->
  <path d="M 695 256 C 585 380, 600 600, 740 690" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 740 690 C 800 700, 840 690, 873 672" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="582" y="486" font-size="16" font-weight="700" fill="#B8442D" text-anchor="end">600 路机场大巴</text>
  <text x="582" y="510" font-size="15" font-weight="700" fill="#B8442D" text-anchor="end">1,300–5,500 韩元 · 16–40 分一班</text>

  <circle cx="740" cy="690" r="9" fill="#2E7D5B"/>
  <text x="740" y="724" font-size="15" fill="#102A2B" text-anchor="middle">中文旅游区 Jungmun</text>

  <!-- west alternative -->
  <rect x="245" y="294" width="305" height="84" rx="18" fill="#FFFFFF" stroke="#B9B2A8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="397" y="328" font-size="15" font-weight="700" fill="#8A8F8F" text-anchor="middle">西线替代：涯月 · 挟才</text>
  <text x="397" y="356" font-size="15" fill="#8A8F8F" text-anchor="middle">急行 102／干线 202 走西海岸</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <circle cx="70" cy="866" r="9" fill="#2F6F9F"/><text x="88" y="872">Day 1</text>
    <circle cx="165" cy="866" r="9" fill="#B8442D"/><text x="183" y="872">Day 2 东线</text>
    <circle cx="305" cy="866" r="9" fill="#2E7D5B"/><text x="323" y="872">Day 3</text>
    <line x1="415" y1="866" x2="465" y2="866" stroke="#B8442D" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text x="478" y="872">公交（600 路、急行、干线）</text>
    <circle cx="735" cy="866" r="7" fill="#2E7D5B"/><text x="752" y="872">汉拿山登山口</text>
