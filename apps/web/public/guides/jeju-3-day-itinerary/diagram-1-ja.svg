<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif">
  <title id="title">済州島2泊3日モデルコース概念図</title>
  <desc id="desc">簡略化した済州島の概念マップ（縮尺不正確）。北部に済州国際空港と済州市街（Day 1：龍頭岩・東門市場）。Day 2は東海岸ルート：東岸沿いに城山日出峰（9・10月05:00〜19:00、18:00発券終了、毎月第1月曜休）へ行き、フェリーで牛島（島内バス950ウォン）を渡り、ソプチコジへ。Day 3は南部の西帰浦で正房瀑布（大人2,000ウォン、09:00〜17:50）と天地淵瀑布（2,000ウォン、09:00〜22:00）を巡るか、中央のハルラ山へ（城板岳9.6km・観音寺8.7kmは上半分が要予約、御里牧6.8km・霊室5.8kmは登頂不可）。600番リムジンバスは空港5番出口発、中文観光団地経由で西帰浦へ（区間運賃1,300〜5,500ウォン、16〜40分間隔）。西海岸の涯月・挟才は代替ルート。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <rect x="0" y="130" width="1600" height="770" fill="#DDE9EE"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">済州島2泊3日モデルコース　東海岸メイン・3日目は西帰浦かハルラ山</text>
  <text x="60" y="100" font-size="18" fill="#5C6B6B">Jeju 3-day itinerary・概念図（縮尺不正確）・入場料と運賃は2026年9月公式サイト確認</text>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
  </defs>

  <!-- island and Udo -->
  <path d="M 300 470 C 320 330, 560 220, 820 215 C 1080 210, 1300 300, 1390 440 C 1440 530, 1300 690, 1040 730 C 780 765, 460 720, 340 620 C 290 575, 285 520, 300 470 Z" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <ellipse cx="1510" cy="242" rx="44" ry="24" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <text x="1510" y="204" font-size="15" fill="#5C6B6B" text-anchor="middle">島内バス 950ウォン</text>
  <text x="1510" y="290" font-size="15" font-weight="700" fill="#102A2B" text-anchor="middle">牛島（ウド）</text>
  <text x="1508" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">船便は公式サイト基準</text>

  <!-- Hallasan -->
  <path d="M 755 505 L 800 425 L 845 505 Z" fill="#6B4A3A"/>
  <text x="800" y="530" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">ハルラ山（Hallasan）</text>
  <circle cx="895" cy="502" r="7" fill="#2E7D5B"/>
  <text x="910" y="508" font-size="15" fill="#102A2B">城板岳 9.6 km・要予約</text>
  <circle cx="825" cy="368" r="7" fill="#2E7D5B"/>
  <text x="840" y="374" font-size="15" fill="#102A2B">観音寺 8.7 km・要予約</text>
  <circle cx="695" cy="408" r="7" fill="#2E7D5B"/>
  <text x="710" y="413" font-size="15" fill="#102A2B">御里牧 6.8 km・約2時間</text>
  <circle cx="690" cy="560" r="7" fill="#2E7D5B"/>
  <text x="705" y="566" font-size="15" fill="#102A2B">霊室 5.8 km・約1.5時間</text>

  <!-- airport and Jeju city (Day 1) -->
  <rect x="555" y="178" width="290" height="78" rx="18" fill="#0D6B68"/>
  <text x="700" y="210" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">済州国際空港（CJU）</text>
  <text x="700" y="238" font-size="15" fill="#E6F2F1" text-anchor="middle">600番 5番出口・06:00〜22:40</text>

  <rect x="880" y="168" width="270" height="98" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="880" cy="168" r="27" fill="#2F6F9F"/>
  <text x="880" y="174" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <text x="1015" y="202" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">済州市街</text>
  <text x="1015" y="227" font-size="15" fill="#5C6B6B" text-anchor="middle">龍頭岩・東門市場</text>
  <text x="1015" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">到着日の宿泊に最も便利</text>

  <!-- Day 2 east loop (label lifted cleanly above the dashed curve) -->
  <path d="M 1150 226 C 1205 240, 1235 286, 1245 348" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <text x="1185" y="212" font-size="15" font-weight="700" fill="#B8442D">急行101・幹線201（東海岸）</text>

  <rect x="1085" y="354" width="350" height="128" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="1085" cy="354" r="27" fill="#B8442D"/>
  <text x="1085" y="360" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 2</text>
  <text x="1260" y="392" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">城山日出峰</text>
  <text x="1260" y="417" font-size="15" fill="#5C6B6B" text-anchor="middle">9・10月 05:00〜19:00（発券18:00迄）</text>
  <text x="1260" y="440" font-size="15" fill="#5C6B6B" text-anchor="middle">毎月第1月曜休・登頂約30〜40分</text>
  <text x="1260" y="463" font-size="15" fill="#5C6B6B" text-anchor="middle">入場料は公式サイト基準・食べ物持込不可</text>

  <path d="M 1375 352 C 1385 288, 1412 254, 1460 245" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <path d="M 1295 484 L 1303 526" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <circle cx="1305" cy="536" r="9" fill="#B8442D"/>
  <text x="1322" y="542" font-size="15" font-weight="700" fill="#102A2B">ソプチコジ・無料</text>

  <!-- Day 3 Seogwipo -->
  <rect x="875" y="596" width="375" height="128" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="875" cy="596" r="27" fill="#2E7D5B"/>
  <text x="875" y="602" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1062" y="634" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">西帰浦（ソグィポ）</text>
  <text x="1062" y="659" font-size="15" fill="#5C6B6B" text-anchor="middle">正房瀑布 2,000ウォン・09:00〜17:50</text>
  <text x="1062" y="682" font-size="15" fill="#5C6B6B" text-anchor="middle">天地淵瀑布 2,000ウォン・09:00〜22:00</text>
  <text x="1062" y="705" font-size="15" fill="#5C6B6B" text-anchor="middle">空港へ：600番（中文経由）・800番（直行）</text>

  <!-- 600 limousine (2 crisp lines cleanly LEFT of the red dashed arc) -->
  <path d="M 695 256 C 585 380, 600 600, 740 690" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 740 690 C 800 700, 840 690, 873 672" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="582" y="486" font-size="16" font-weight="700" fill="#B8442D" text-anchor="end">600番リムジンバス</text>
  <text x="582" y="510" font-size="15" font-weight="700" fill="#B8442D" text-anchor="end">1,300〜5,500ウォン・16〜40分間隔</text>

  <circle cx="740" cy="690" r="9" fill="#2E7D5B"/>
  <text x="740" y="724" font-size="15" fill="#102A2B" text-anchor="middle">中文観光団地（Jungmun）</text>

  <!-- west alternative -->
  <rect x="245" y="294" width="305" height="84" rx="18" fill="#FFFFFF" stroke="#B9B2A8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="397" y="328" font-size="15" font-weight="700" fill="#8A8F8F" text-anchor="middle">西海岸代替：涯月・挟才エリア</text>
  <text x="397" y="356" font-size="15" fill="#8A8F8F" text-anchor="middle">急行102・幹線202が西海岸を運行</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <circle cx="70" cy="866" r="9" fill="#2F6F9F"/><text x="88" y="872">Day 1</text>
    <circle cx="165" cy="866" r="9" fill="#B8442D"/><text x="183" y="872">Day 2 東海岸</text>
    <circle cx="320" cy="866" r="9" fill="#2E7D5B"/><text x="338" y="872">Day 3</text>
    <line x1="425" y1="866" x2="475" y2="866" stroke="#B8442D" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text x="488" y="872">バス（600・急行・幹線）</text>
    <circle cx="735" cy="866" r="7" fill="#2E7D5B"/><text x="752" y="872">ハルラ山登山口</text>
    <text x="1540" y="872" fill="#5C6B6B" text-anchor="end">© Mokaair 制作 2026</text>
  </g>
</svg>
