<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Inter','Helvetica Neue','Segoe UI',system-ui,sans-serif">
  <title id="title">Jeju 3-Day Itinerary Route Map: East Coast Loop, Seogwipo or Hallasan</title>
  <desc id="desc">Simplified schematic map of Jeju Island, not to scale. In the north sit Jeju International Airport and Jeju City (Day 1: Yongduam Rock and Dongmun Market). Day 2 follows the east coast to Seongsan Ilchulbong (5:00 AM–7:00 PM in September and October, ticket sales close at 6:00 PM, closed the first Monday of each month), then takes a ferry to Udo Island (island bus ₩950) and continues to Seopjikoji. Day 3 heads south to Seogwipo for Jeongbang Falls (adult ₩2,000, 9:00 AM–5:50 PM) and Cheonjiyeon Falls (₩2,000, 9:00 AM–10:00 PM), or hikes central Hallasan (Seongpanak 9.6 km and Gwanumsa 8.7 km require reservations for their upper sections; Eorimok 6.8 km and Yeongsil 5.8 km do not reach the summit). Airport Limousine 600 departs Gate 5 at the airport and runs via Jungmun Tourist Complex to Seogwipo for ₩1,300–₩5,500 by distance, every 16–40 minutes. Aewol and Hyeopjae on the west coast offer an alternate route.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <rect x="0" y="124" width="1600" height="776" fill="#DDE9EE"/>
  <text x="60" y="56" font-size="34" font-weight="700" fill="#102A2B">Jeju 3-Day Itinerary: East Coast Loop, Plus Seogwipo or Hallasan</text>
  <text x="60" y="92" font-size="18" fill="#5C6B6B">Schematic map, not to scale · Admission and bus fares verified September 2026</text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
  </defs>

  <!-- island and Udo -->
  <path d="M 280 470 C 300 320, 540 215, 810 210 C 1070 205, 1290 295, 1380 440 C 1430 530, 1290 695, 1030 735 C 770 770, 440 725, 320 620 C 270 575, 265 520, 280 470 Z" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <ellipse cx="1505" cy="260" rx="46" ry="26" fill="#F3EBDD" stroke="#C8B8A2" stroke-width="3"/>
  <text x="1505" y="174" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">Udo Island</text>
  <text x="1505" y="196" font-size="15" fill="#5C6B6B" text-anchor="middle">Island bus ₩950</text>
  <text x="1505" y="218" font-size="15" fill="#5C6B6B" text-anchor="middle">Check ferry site</text>

  <!-- Hallasan -->
  <path d="M 755 505 L 800 425 L 845 505 Z" fill="#6B4A3A"/>
  <text x="800" y="530" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">Hallasan</text>

  <circle cx="902" cy="470" r="7" fill="#2E7D5B"/>
  <text x="917" y="468" font-size="15" font-weight="600" fill="#102A2B">Seongpanak 9.6 km</text>
  <text x="917" y="488" font-size="15" fill="#5C6B6B">Reservation req.</text>

  <circle cx="825" cy="378" r="7" fill="#2E7D5B"/>
  <text x="840" y="376" font-size="15" font-weight="600" fill="#102A2B">Gwanumsa 8.7 km</text>
  <text x="840" y="396" font-size="15" fill="#5C6B6B">Reservation req.</text>

  <circle cx="725" cy="415" r="7" fill="#2E7D5B"/>
  <text x="710" y="413" font-size="15" font-weight="600" fill="#102A2B" text-anchor="end">Eorimok 6.8 km</text>
  <text x="710" y="433" font-size="15" fill="#5C6B6B" text-anchor="end">~2 hr (no summit)</text>

  <circle cx="678" cy="566" r="7" fill="#2E7D5B"/>
  <text x="693" y="564" font-size="15" font-weight="600" fill="#102A2B">Yeongsil 5.8 km</text>
  <text x="693" y="584" font-size="15" fill="#5C6B6B">~1.5 hr (no summit)</text>

  <!-- Airport and Jeju City (Day 1) -->
  <rect x="520" y="164" width="315" height="78" rx="18" fill="#0D6B68"/>
  <text x="678" y="196" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jeju Airport (CJU)</text>
  <text x="678" y="224" font-size="15" fill="#E6F2F1" text-anchor="middle">Bus 600 Gate 5 · 6:00 AM–10:40 PM</text>

  <rect x="865" y="154" width="325" height="100" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="865" cy="154" r="28" fill="#2F6F9F"/>
  <text x="865" y="160" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <text x="1028" y="190" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Jeju City</text>
  <text x="1028" y="216" font-size="15" fill="#5C6B6B" text-anchor="middle">Yongduam Rock · Dongmun Market</text>
  <text x="1028" y="240" font-size="15" fill="#5C6B6B" text-anchor="middle">Best base for arrival night</text>

  <!-- Day 2 east coast loop -->
  <path d="M 1190 228 C 1245 242, 1272 282, 1278 342" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <text x="1220" y="196" font-size="15" font-weight="700" fill="#B8442D">Express 101 / Trunk 201</text>
  <text x="1220" y="218" font-size="15" fill="#B8442D">East coast bus route</text>

  <rect x="1105" y="348" width="425" height="134" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="1105" cy="348" r="28" fill="#B8442D"/>
  <text x="1105" y="354" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 2</text>
  <text x="1318" y="384" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Seongsan Ilchulbong</text>
  <text x="1318" y="410" font-size="15" fill="#5C6B6B" text-anchor="middle">Sep–Oct: 5:00 AM–7:00 PM (last ticket 6:00 PM)</text>
  <text x="1318" y="434" font-size="15" fill="#5C6B6B" text-anchor="middle">Closed 1st Monday · 30–40 min summit climb</text>
  <text x="1318" y="458" font-size="15" fill="#5C6B6B" text-anchor="middle">Check site for fee · No food on summit trail</text>

  <!-- ferry to Udo and route to Seopjikoji -->
  <path d="M 1455 344 C 1465 318, 1474 302, 1488 288" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <path d="M 1318 484 L 1318 526" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <circle cx="1318" cy="538" r="9" fill="#B8442D"/>
  <text x="1336" y="544" font-size="15" font-weight="700" fill="#102A2B">Seopjikoji · Free</text>

  <!-- Day 3 Seogwipo -->
  <rect x="880" y="610" width="430" height="134" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="880" cy="610" r="28" fill="#2E7D5B"/>
  <text x="880" y="616" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1095" y="646" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Seogwipo</text>
  <text x="1095" y="672" font-size="15" fill="#5C6B6B" text-anchor="middle">Jeongbang Falls ₩2,000 · 9:00 AM–5:50 PM</text>
  <text x="1095" y="696" font-size="15" fill="#5C6B6B" text-anchor="middle">Cheonjiyeon Falls ₩2,000 · 9:00 AM–10:00 PM</text>
  <text x="1095" y="720" font-size="15" fill="#5C6B6B" text-anchor="middle">To airport: Bus 600 (via Jungmun) or Bus 800</text>

  <!-- Airport Limousine 600 arc and cleanly separated label -->
  <path d="M 625 244 C 470 375, 480 605, 700 702" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 700 702 C 770 712, 825 702, 875 684" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="482" y="504" font-size="16" font-weight="700" fill="#B8442D" text-anchor="end">Airport Limousine 600</text>
  <text x="482" y="528" font-size="15" fill="#B8442D" text-anchor="end">₩1,300–₩5,500 · Every 16–40 min</text>

  <circle cx="700" cy="702" r="9" fill="#2E7D5B"/>
  <text x="700" y="750" font-size="15" font-weight="600" fill="#102A2B" text-anchor="middle">Jungmun Tourist Complex</text>

  <!-- west coast alternative -->
  <rect x="95" y="295" width="380" height="84" rx="18" fill="#FFFFFF" stroke="#B9B2A8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="285" y="330" font-size="16" font-weight="700" fill="#6E7474" text-anchor="middle">West Coast Option: Aewol · Hyeopjae</text>
  <text x="285" y="356" font-size="15" fill="#6E7474" text-anchor="middle">Express 102 / Trunk 202 along west coast</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <circle cx="64" cy="866" r="9" fill="#2F6F9F"/><text x="82" y="872">Day 1</text>
    <circle cx="164" cy="866" r="9" fill="#B8442D"/><text x="182" y="872">Day 2 East Coast</text>
    <circle cx="352" cy="866" r="9" fill="#2E7D5B"/><text x="370" y="872">Day 3</text>
    <line x1="452" y1="866" x2="502" y2="866" stroke="#B8442D" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text x="514" y="872">Bus (600, Express, Trunk)</text>
    <circle cx="792" cy="866" r="7" fill="#2E7D5B"/><text x="808" y="872">Hallasan trailhead</text>
    <text x="1540" y="872" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
  </g>
</svg>
