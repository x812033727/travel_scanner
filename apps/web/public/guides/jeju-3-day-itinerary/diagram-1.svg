<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">濟州島三天兩夜路線示意圖 / Jeju three-day itinerary: east loop, Seogwipo or Hallasan</title>
  <desc id="desc">簡化的濟州島示意地圖，非精確比例。北邊是濟州機場與濟州市區（Day 1 龍頭岩、東門市場）。Day 2 走東線：沿東海岸到城山日出峰（9、10 月 05:00 到 19:00、18:00 停止售票，每月第一個週一休），搭船到牛島（島上公車 950 韓元），再到涉地可支。Day 3 到南邊的西歸浦看正房瀑布（成人 2,000 韓元、09:00 到 17:50）與天地淵瀑布（2,000 韓元、09:00 到 22:00），或改爬中央的漢拿山（城板岳 9.6 公里、觀音寺 8.7 公里採預約制，御里牧 6.8 公里、靈室 5.8 公里不登頂）。600 利木津從機場 5 號門出發，經中文觀光區到西歸浦，票價依區間 1,300 到 5,500 韓元、16 到 40 分一班。西線的涯月、挾才為替代路線。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <rect x="0" y="130" width="1600" height="770" fill="#DDE9EE"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">제주 濟州三天兩夜　東線為主，第三天西歸浦或漢拿山</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Jeju in three days · 示意圖，非精確比例 · 門票與票價 2026 年 9 月依官網查證</text>
