  <text x="1530" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">船班以官網為準</text>

  <!-- Hallasan -->
  <path d="M 755 505 L 800 425 L 845 505 Z" fill="#6B4A3A"/>
  <text x="800" y="530" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">한라산 漢拿山 Hallasan</text>
  <circle cx="935" cy="470" r="7" fill="#2E7D5B"/>
  <text x="950" y="476" font-size="15" fill="#102A2B">성판악 城板岳 9.6 km · 預約制</text>
  <circle cx="830" cy="380" r="7" fill="#2E7D5B"/>
  <text x="845" y="385" font-size="15" fill="#102A2B">관음사 觀音寺 8.7 km · 預約制</text>
