<title id="title">미국 OCC 스테이블코인 발행 규칙안: 1대1 준비자산, 2영업일 상환, 정기 보고</title><desc id="desc">오리지널 일러스트: 왼쪽에는 박공과 기둥 4개가 있는 은행 건물이 있고 화살표가 가운데 점선 테두리의 규칙안 문서를 가리킵니다. 오른쪽에는 코인이 있고 그 아래 등호와 3단 막대가 놓여 토큰 액면과 준비자산이 1대1임을 나타냅니다</desc>
