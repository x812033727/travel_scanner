<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Arial',sans-serif">
<title id="title">Four Checks for Article Titles</title><desc id="desc">Four cards check purpose, scope, evidence and display consistency before publishing a title.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Four Checks for Article Titles</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Check content first, then refine wording and display</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Purpose</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Reader's next step</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">What the page gives</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Avoid repetition</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Scope</text>
<text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Audience and setting</text>
<text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Version or date</text>
<text x="477.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Key limitations</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Evidence</text>
<text x="846.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Numbers line up</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Show test methods</text>
<text x="846.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Avoid overclaiming</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Display matches</text>
<text x="1215.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Heading and settings</text>
<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Readable on mobile</text>
<text x="1215.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Review after changes</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Let the title promise what the article can deliver, and fulfill it in the body.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
