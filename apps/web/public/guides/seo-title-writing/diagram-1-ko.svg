<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<title id="title">글 제목의 네 가지 약속 점검</title><desc id="desc">주제와 목적, 적용 범위, 근거, 화면 표시의 일관성을 네 칸으로 확인합니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">글 제목의 네 가지 약속 점검</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">내용을 먼저 확인한 뒤 문구와 화면 표시를 다듬으세요</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">주제와 목적</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">독자의 다음 행동</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">본문의 결과</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">표현 반복 피하기</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">적용 범위</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">대상과 상황</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">버전 또는 날짜</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">필수 제한</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">근거와 약속</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">수치가 맞는지</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">실측 방법 제시</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">과장하지 않기</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">표시 일관성</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">제목과 설정</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">모바일 가독성</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">수정 후 관찰</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">제목은 본문이 줄 수 있는 것을 분명히 말하고, 본문은 그 약속을 지켜야 합니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도표</text>
</svg>
