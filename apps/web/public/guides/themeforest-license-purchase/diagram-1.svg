<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">ThemeForest 採購的四個確認點</title><desc id="desc">原創四欄圖解，依序整理網站用途、授權支援、下載憑證與安裝驗收，提醒支援到期和更新權利應分開確認。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">ThemeForest 採購的四個確認點</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">用途先行，憑證與維護一起交接</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">用途</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">單一成品</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">免費或付費</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">核對例外</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">範圍</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">授權數量</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">作者支援</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">附贈外掛</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">保存</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">原始檔案</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">購買憑證</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">素材授權</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">驗收</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">相依版本</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">核心流程</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">維護交接</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">購買前確認需求，購買後保存證據，更新前先在測試站驗證。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
