<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">外幣帳戶開戶與用途：換匯、存款與領現金</title>
<desc id="desc">左邊一個圓角方框裡畫著一本翻開的存摺，中間一條書脊線，右頁有三條長短不一的橫線，代表帳戶裡的外幣。右邊一個圓角方框裡畫著一張抽象的紙鈔，票面中央是一個空心橢圓，右下角疊著一枚同樣抽象的硬幣，代表手上的外幣現鈔。兩個方框之間是一條左右各有箭頭的橫線，線的正中間留了一道缺口，缺口處有兩道短豎線，表示現鈔與帳戶之間往返時要付的那一段差額。下方一行字寫著同一種外幣，兩個價格。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="tipgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
</defs>

<path d="M780 380 H666" fill="none" stroke="#5C6B6B" stroke-width="22" stroke-linecap="butt" marker-end="url(#tipgrey)"/>
<path d="M820 380 H934" fill="none" stroke="#5C6B6B" stroke-width="22" stroke-linecap="butt" marker-end="url(#tipgrey)"/>
<path d="M790 350 V410 M810 350 V410" stroke="#B8442D" stroke-width="12" stroke-linecap="round"/>

<rect x="180" y="210" width="460" height="340" rx="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="18"/>
<rect x="280" y="280" width="260" height="200" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="16"/>
<path d="M345 280 V480" stroke="#0D6B68" stroke-width="16"/>
<path d="M385 340 H505 M385 380 H505 M385 420 H465" stroke="#0D6B68" stroke-width="14" stroke-linecap="round"/>

<rect x="960" y="210" width="460" height="340" rx="40" fill="#FFFFFF" stroke="#D97A2B" stroke-width="18"/>
<rect x="1036" y="288" width="300" height="164" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="16"/>
<ellipse cx="1186" cy="370" rx="46" ry="36" fill="none" stroke="#D97A2B" stroke-width="14"/>
<circle cx="1308" cy="470" r="50" fill="#F7F1E8" stroke="#2E7D5B" stroke-width="16"/>
<circle cx="1308" cy="470" r="20" fill="none" stroke="#2E7D5B" stroke-width="12"/>

<text x="800" y="690" text-anchor="middle" font-size="56" font-weight="700" fill="#102A2B">同一種外幣，兩個價格</text>
</svg>
