<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">回答由哪些依据组成</title><desc id="desc">问题送入检索器，文档索引提供适用段落，再交给模型生成带有条件与出处的答案</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">回答由哪些依据组成</text><text x="60" y="84" font-size="18" fill="#5C6B6B">检索增强生成</text><path d="M 390 380 L 550 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 710 590 L 710 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 380 L 1110 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="90" y="300" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="240" y="374" font-size="28" fill="#102A2B" text-anchor="middle">读者问题</text><text x="240" y="417" font-size="22" fill="#5C6B6B" text-anchor="middle">取消陶艺班</text><rect x="560" y="300" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="374" font-size="28" fill="#102A2B" text-anchor="middle">检索器</text><text x="710" y="417" font-size="22" fill="#5C6B6B" text-anchor="middle">找适用条文</text><rect x="560" y="590" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="664" font-size="28" fill="#102A2B" text-anchor="middle">文档索引</text><text x="710" y="707" font-size="22" fill="#5C6B6B" text-anchor="middle">版本与权限</text><rect x="1120" y="300" width="330" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1285" y="374" font-size="28