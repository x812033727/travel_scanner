<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">The Evidence Behind an Answer</title><desc id="desc">A question enters the retriever; a document index supplies applicable passages, which the model uses to produce an answer with conditions and sources.</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">The Evidence Behind an Answer</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Retrieval-Augmented Generation</text><path d="M 390 380 L 550 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 710 590 L 710 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 860 380 L 1110 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="90" y="300" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="240" y="374" font-size="28" fill="#102A2B" text-anchor="middle">Reader's Question</text><text x="240" y="417" font-size="22" fill="#5C6B6B" text-anchor="middle">Cancel Pottery Class</text><rect x="560" y="300" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="374" font-size="28" fill="#102A2B" text-anchor="middle">Retriever</text><text x="710" y="417" font-size="22" fill="#5C6B6B" text-anchor="middle">Find Applicable Rules</text><rect x="560" y="590" width="300" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="710" y="664" font-size="28" fill="#102A2B" text-anchor="middle">Document Index</text><text x="710" y="707" font-size="22" fill="#5C6B6B" text-anchor="middle">Versions &amp; Permissions</text><rect x="1120" y="300" width="330" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1285" y="374" font-size="28" fill="#102A2B" text-anchor="middle">Generate Answer</text><text x="1285" y="417" font-size="22" fill="#5C6B6B" text-anchor="middle">Conditions &amp; Sources</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphic 2026</text></svg>
