<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">WordPress.com 与自行托管 WordPress 怎么选：维护、费用与控制权比较 — WordPress 选择的四份清单</title><desc id="desc">从功能需求、维护责任、总成本与资料迁移比较 WordPress.com 与自行托管。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">WordPress 选择的四份清单</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">先明确功能、责任、费用与资料</text>
