<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>家にある日用品をまた買ってしまう？簡単な在庫表で場所・数量・補充状況を記録する: 判断の流れ</title><desc>少数の用品を選ぶ、保管場所を記録する、補充状況を示す、買い物前に確認する、の順に確認します。編集部が整理した図であり、地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順の順番 · 実用的な流れ</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">少数の用品を選ぶ</text><text x="103" y="497" fill="#f4f0e5" font-size="23">よく使う物から始める</text><text x="103" y="573" fill="#f4dc9d" font-size="26">数える単位を統一</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">保管場所を記録</text><text x="473" y="497" fill="#f4f0e5" font-size="23">どこにあるかを残す</text><text x="473" y="573" fill="#f4dc9d" font-size="26">実物を見つけやすく</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">補充状況を示す</text><text x="843" y="497" fill="#f4f0e5" font-size="23">補充の進み具合を記録</text><text x="843" y="573" fill="#f4dc9d" font-size="26">買った物は収納まで</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">買い物前に確認</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">買う前に照合する</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">古い数量は再確認</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の説明図</text></g></svg>
