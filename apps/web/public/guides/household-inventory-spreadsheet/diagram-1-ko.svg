<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>집에 있는 생활용품을 또 사나요? 간단한 재고표에 보관 위치, 수량, 보충 상태를 기록하세요: 판단 흐름</title><desc>소수의 용품 고르기, 보관 위치 기록하기, 보충 상태 표시하기, 장보기 전에 확인하기 순서로 점검합니다. 편집부가 정리한 안내이며 지도나 실측 시간을 나타내지 않습니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 흐름</text><text x="100" y="175" fill="#576968" font-size="25">자신의 상황에 맞게 선택하세요. 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">소수의 용품 고르기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">자주 쓰는 것부터 시작</text><text x="103" y="573" fill="#f4dc9d" font-size="26">수량 단위 통일</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">보관 위치 기록</text><text x="473" y="497" fill="#f4f0e5" font-size="23">어디에 있는지 기록</text><text x="473" y="573" fill="#f4dc9d" font-size="26">실물을 찾기 쉽게</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">보충 상태 표시</text><text x="843" y="497" fill="#f4f0e5" font-size="23">보충 진행 상태 기록</text><text x="843" y="573" fill="#f4dc9d" font-size="26">샀다면 제자리에</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">장보기 전 확인</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">구매 전에 대조하기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">오래된 수량 재확인</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 설명도</text></g></svg>
