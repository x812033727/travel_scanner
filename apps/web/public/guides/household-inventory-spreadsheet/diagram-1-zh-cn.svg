<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>家里用品总是重复买？用简单库存表记录位置、数量与补货状态: 判断流程</title><desc>依次检查：选少量用品、记存放位置、标补货状态、采购前核对。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用流程</text><text x="100" y="175" fill="#576968" font-size="25">依你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">选少量用品</text><text x="103" y="497" fill="#f4f0e5" font-size="23">从常用物品开始</text><text x="103" y="573" fill="#f4dc9d" font-size="26">固定计数单位</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">记存放位置</text><text x="473" y="497" fill="#f4f0e5" font-size="23">记录物品位置</text><text x="473" y="573" fill="#f4dc9d" font-size="26">实物找得到</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">标补货状态</text><text x="843" y="497" fill="#f4f0e5" font-size="23">跟踪补货进度</text><text x="843" y="573" fill="#f4dc9d" font-size="26">已买也要归位</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">采购前核对</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">购买前检查</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">过时数字再查</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意图</text></g></svg>
