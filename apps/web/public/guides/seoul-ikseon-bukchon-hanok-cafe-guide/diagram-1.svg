<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">益善洞與北村韓屋咖啡店示意圖</title><desc id="d">非比例示意圖，依官方頁將北村與益善洞店家分組。</desc><rect width="1600" height="900" fill="#fffaf4"/><text x="100" y="100" font-size="48" font-family="sans-serif" fill="#34251e">益善洞・北村韓屋咖啡店</text><text x="100" y="145" font-size="25" font-family="sans-serif" fill="#705f55">示意圖，非比例・類型依官方頁文字</text><rect x="100" y="210" width="610" height="520" rx="30" fill="#f4e9da"/><rect x="890" y="210" width="610" height="520" rx="30" fill="#eee4dc"/><text x="330" y="280" font-size="42" font-family="sans-serif">北村</text><text x="1090" y="280" font-size="42" font-family="sans-serif">益善洞</text><g font-family="sans-serif" font-size="30" fill="#34251e"><text x="170" y="370">어니언 안국　韓屋・網美</text><text x="170" y="450">오설록 북촌　網美（洋樓）</text><text x="170" y="530">차 마시는 뜰　網美</text><text x="170" y="610">이채 카페　網美</text><text x="960" y="390">서울커피 익선점　網美</text><text x="960" y="490">레인리포트 레인보우　韓屋・網美</text><text x="960" y="590">하이웨이스트 익선점　韓屋・網美</text></g><rect x="100" y="790" width="34" height="34" fill="#745138"/><text x="150" y="819" font-size="25" font-family="sans-serif">韓屋：官方明示 hanok</text><rect x="430" y="790" width="34" height="34" fill="#c67447"/><text x="480" y="819" font-size="25" font-family="sans-serif">網美：官方描述空間</text><text x="1220" y="820" font-size="22" font-family="sans-serif">© Mokaair 2026</text></svg>
