<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">益善洞與北村韓屋咖啡店示意圖</title><desc id="d">圖上的標題是「益善洞・北村韓屋咖啡店」，副標是「示意圖，非比例・兩塊之間不表示距離或方向」。圖分左右兩塊，中間沒有連接線。左塊標題「北村」，由上而下列出四家店與各自的類型標記：어니언 안국標「韓屋・網美」、오설록 북촌標「網美（洋樓）」、차 마시는 뜰標「網美」、이채 카페標「網美」。右塊標題「益善洞」，同樣由上而下列出：서울커피 익선점標「網美」、레인리포트 레인보우標「韓屋・網美」、하이웨이스트 익선점標「韓屋・網美」。圖的下方是圖例，深棕色色塊寫「韓屋：店開在韓屋建物裡」，橘色色塊寫「網美：空間有特色」，旁邊一行小字寫「店名照韓文寫，方便對照招牌與地圖」，右下角是「© Mokaair 2026」。</desc><rect width="1600" height="900" fill="#fffaf4"/><text x="100" y="100" font-size="48" font-family="sans-serif" fill="#34251e">益善洞・北村韓屋咖啡店</text><text x="100" y="145" font-size="25" font-family="sans-serif" fill="#705f55">示意圖，非比例・兩塊之間不表示距離或方向</text><rect x="100" y="210" width="610" height="520" rx="30" fill="#f4e9da"/><rect x="890" y="210" width="610" height="520" rx="30" fill="#eee4dc"/><text x="330" y="280" font-size="42" font-family="sans-serif">北村</text><text x="1090" y="280" font-size="42" font-family="sans-serif">益善洞</text><g font-family="sans-serif" font-size="30" fill="#34251e"><text x="170" y="370">어니언 안국　韓屋・網美</text><text x="170" y="450">오설록 북촌　網美（洋樓）</text><text x="170" y="530">차 마시는 뜰　網美</text><text x="170" y="610">이채 카페　網美</text><text x="960" y="390">서울커피 익선점　網美</text><text x="960" y="490">레인리포트 레인보우　韓屋・網美</text><text x="960" y="590">하이웨이스트 익선점　韓屋・網美</text></g><rect x="100" y="790" width="34" height="34" fill="#745138"/><text x="150" y="819" font-size="25" font-family="sans-serif">韓屋：店開在韓屋建物裡</text><rect x="470" y="790" width="34" height="34" fill="#c67447"/><text x="520" y="819" font-size="25" font-family="sans-serif">網美：空間有特色</text><text x="780" y="819" font-size="25" font-family="sans-serif" fill="#705f55">店名照韓文寫，方便對照招牌與地圖</text><text x="1220" y="860" font-size="22" font-family="sans-serif" fill="#705f55">© Mokaair 2026</text></svg>
