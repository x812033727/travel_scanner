<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">曼谷住哪一區：六區與四條線 / Where to stay in Bangkok</title>
<desc id="desc">曼谷六個住宿區與四條軌道的關係示意圖。橫向淺綠色是 BTS Sukhumvit 線，由左至右為蒙奇、帕亞泰、暹羅、奇隆、那那、阿索克、澎蓬、通羅；深綠色 BTS Silom 線從暹羅站往下，經拉差丹里、沙拉當、沙潘塔克辛到空鐵吞武里，再以金線接 Charoen Nakhon 的 ICONSIAM，國家體育場站在暹羅站西側。藍色 MRT 藍線從恰圖恰公園經碧武里、蘇坤蔚、是隆、Wat Mangkon 到 Sanam Chai。橘色機場快線從右下角的蘇凡納布機場經瑪卡山、拉差帕洛到帕亞泰，營運時間 05:30 到 24:00。紅色 SRT 紅線從左上角的廊曼機場到中央車站，票價 33 泰銖，再轉 MRT 藍線。虛線是巴士：廊曼到 BTS 蒙奇的 A1 為 30 泰銖、廊曼到考山路的 A4 為 50 泰銖、蘇凡納布到考山路的 S1 為 60 泰銖。六個區域色塊分別是蘇坤蔚、暹羅與奇隆、是隆與沙吞、河岸、考山路與舊城、唐人街耀華力；考山路與舊城沒有捷運站，最近的是 MRT Sanam Chai。暹羅站是 BTS 兩線站內換月台，蒙奇、阿索克、沙拉當三處與 MRT 之間要出站再進站。右上角註明 BTS 服務時間 05:00 到 01:00、暹羅站末班 00:02。</desc>
