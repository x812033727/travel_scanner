<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">旅行從限制開始排</title><desc id="desc">固定條件：保留返程與休息；候選與路線：查日期、區域與交通；出發前核對：確認天氣及預約</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">旅行從限制開始排</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#32765B" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#32765B" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">固定條件</text><text x="245" y="333" font-size="76" fill="#32765B">保留返程與休息</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#32765B" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#32765B" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">候選與路線</text><text x="245" y="558" font-size="76" fill="#32765B">查日期、區域與交通</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#32765B" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#32765B" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">出發前核對</text><text x="245" y="783" font-size="76" fill="#32765B">確認天氣及預約</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>