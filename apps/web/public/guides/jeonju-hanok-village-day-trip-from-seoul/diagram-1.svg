<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾到全州韓屋村怎麼走 / From Seoul to Jeonju Hanok Village</title>
  <desc id="desc">左半是兩段車程：龍山站搭 KTX 全羅線到全州站，一天二十五班、最快一小時二十八分，末班回程二十三點十一分發車；水西站搭 SRT 到全州站，一天四班、一般室三萬零三百韓元。全州站再搭一一二、七九、九九九等公車到韓屋村的殿洞聖堂前，約二十五分，計程車官網預估七千到八千韓元。右半是村裡的步行順序：慶基殿（成人三千韓元）、殿洞聖堂、梧木台、豐南門、南部市場，南部市場的夜市只有週五與週六的十七點到二十三點。示意圖，方向與距離非比例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">首爾到全州韓屋村怎麼走</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">From Seoul to Jeonju Hanok Village</text>

  <line x1="800" y1="110" x2="800" y2="840" stroke="#D8CDBC" stroke-width="2"/>

  <text x="60" y="124" font-size="18" fill="#5C6B6B">怎麼來：兩段車程</text>
  <text x="940" y="124" font-size="18" fill="#5C6B6B">村裡怎麼走：步行順序</text>

  <rect x="60" y="146" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="210" y="186" font-size="20" fill="#102A2B" text-anchor="middle">龍山站 용산역</text>
  <text x="210" y="213" font-size="15" fill="#5C6B6B" text-anchor="middle">Yongsan</text>

  <rect x="420" y="146" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="570" y="186" font-size="20" fill="#102A2B" text-anchor="middle">水西站 수서역</text>
  <text x="570" y="213" font-size="15" fill="#5C6B6B" text-anchor="middle">Suseo</text>

  <line x1="210" y1="232" x2="210" y2="442" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="228" y="288" font-size="17" fill="#102A2B">KTX 全羅線・一天 25 班</text>
  <text x="228" y="314" font-size="17" fill="#102A2B">最快 1 小時 28 分</text>
  <text x="228" y="340" font-size="15" fill="#5C6B6B">末班回程 23:11 發</text>

  <line x1="570" y1="232" x2="570" y2="442" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="552" y="392" font-size="17" fill="#102A2B" text-anchor="end">SRT・一天 4 班</text>
  <text x="552" y="418" font-size="17" fill="#102A2B" text-anchor="end">一般室 30,300 韓元</text>

  <rect x="200" y="450" width="380" height="86" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="390" y="490" font-size="20" fill="#102A2B" text-anchor="middle">全州站 전주역</text>
  <text x="390" y="517" font-size="15" fill="#5C6B6B" text-anchor="middle">Jeonju</text>

  <line x1="390" y1="536" x2="390" y2="642" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="412" y="578" font-size="17" fill="#102A2B">公車 112／79／999 等・約 25 分</text>
  <text x="412" y="604" font-size="15" fill="#5C6B6B">計程車 7,000 到 8,000 韓元</text>

  <rect x="120" y="650" width="540" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="390" y="694" font-size="20" fill="#102A2B" text-anchor="middle">韓屋村（殿洞聖堂前）</text>
  <text x="390" y="722" font-size="17" fill="#5C6B6B" text-anchor="middle">전동성당</text>

  <text x="60" y="800" font-size="15" fill="#5C6B6B">示意圖，方向與距離非比例。</text>

  <rect x="940" y="146" width="440" height="88" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1160" y="186" font-size="20" fill="#102A2B" text-anchor="middle">1. 慶基殿 경기전</text>
  <text x="1160" y="214" font-size="16" fill="#0D6B68" text-anchor="middle">一般票成人 3,000 韓元</text>
  <line x1="1160" y1="234" x2="1160" y2="268" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="940" y="272" width="440" height="78" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1160" y="318" font-size="20" fill="#102A2B" text-anchor="middle">2. 殿洞聖堂 전동성당</text>
  <line x1="1160" y1="350" x2="1160" y2="380" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="940" y="384" width="440" height="78" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1160" y="430" font-size="20" fill="#102A2B" text-anchor="middle">3. 梧木台 오목대</text>
  <line x1="1160" y1="462" x2="1160" y2="492" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="940" y="496" width="440" height="78" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1160" y="542" font-size="20" fill="#102A2B" text-anchor="middle">4. 豐南門 풍남문</text>
  <line x1="1160" y1="574" x2="1160" y2="604" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="940" y="608" width="440" height="92" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1160" y="650" font-size="20" fill="#102A2B" text-anchor="middle">5. 南部市場 남부시장</text>
  <text x="1160" y="679" font-size="16" fill="#5C6B6B" text-anchor="middle">夜市 週五、週六 17:00 到 23:00</text>

  <line x1="940" y1="756" x2="1000" y2="756" stroke="#102A2B" stroke-width="4"/>
  <text x="1016" y="762" font-size="15" fill="#5C6B6B">實線：KTX 與公車</text>
  <line x1="940" y1="790" x2="1000" y2="790" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="1016" y="796" font-size="15" fill="#5C6B6B">虛線：SRT</text>
  <text x="940" y="830" font-size="15" fill="#5C6B6B">編號：村裡的步行順序</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
