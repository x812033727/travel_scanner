<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif">
  <title id="title">関西の交通パス選び方フローチャート：JR周遊パス、大阪周遊パス、KANSAI RAILWAY PASS LITE、各社1日券、ICOCA</title>
  <desc id="desc">2つの質問と8つの結論。質問1：大阪・京都市内から外へ出ますか？「いいえ」の方は質問2へ。市内滞在での1日の乗車回数と有料施設数で判断します。大阪の地下鉄に平日4回以上・土日祝3回以上乗るならOsaka Metro エンジョイエコカード（平日820円・土日祝620円）。大阪で1日に3か所以上の有料施設へ入るなら大阪周遊パス（1日3,500円・2日5,000円、約40施設が無料入場）。京都でバスに1日5回以上乗るなら京都市交通局の地下鉄・バス1日券（1,100円、市バス1回230円）。いずれにも当てはまらず1日2〜3回の乗車ならパスは買わずICOCAで都度精算（訪日外国人向け2,000円、デポジット500円含む）。「はい」の方は質問3へ。市外移動でJRか私鉄か、どこまで行くかで判断します。5日以内に岡山・倉敷・城崎温泉・白浜へ行くならJR西日本 関西ワイドエリアパス（5日12,000円、山陽新幹線の新大阪〜岡山指定席と特急はるか・くろしお・こうのとりを含む）。関西空港から特急はるか（HARUKA）に乗り、連続する数日間JRで神戸・姫路・奈良へ行くならJR西日本 関西エリアパス（1日2,800円・2日4,800円・3日5,800円・4日7,000円、HARUKA指定席2回まで、新幹線と他特急は不可）。2〜3日間を私鉄のみで大阪・京都・奈良・神戸と巡るならKANSAI RAILWAY PASS LITE（2日5,200円・3日6,500円、JR・京都市営地下鉄・バス不可、Klook・KKday・WAUG・Trip.com限定オンライン販売）。1路線のみで日帰り往復するなら単一路線の1日券（阪急1,300円・阪急阪神1,600円・京阪1,650円・近鉄1,900円）。料金は大人運賃・単位は円で2026年9月に各社公式サイトで確認。KANSAI RAILWAY PASS LITEは2026年10月5日確認の10月版で、2027年3月31日までに利用開始が必要です。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="45" y="50" font-size="28" font-weight="700" fill="#102A2B">関西の交通パス選び方：2つの質問・8つの結論（2026年9月確認料金）</text>
  <text x="45" y="80" font-size="17" fill="#5C6B6B">JR西日本周遊パス・大阪周遊パス・KANSAI RAILWAY PASS LITE・各社1日券・ICOCAの判断フロー</text>

  <!-- Q1 -->
  <polygon points="800,102 1170,164 800,226 430,164" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="158" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問1　大阪・京都市内から外へ出る？</text>
  <text x="800" y="186" font-size="16" fill="#5C6B6B" text-anchor="middle">神戸・奈良・姫路・和歌山・岡山・城崎・白浜</text>
  <path d="M 430 164 L 390 164 L 390 262" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="374" y="236" font-size="16" font-weight="700" fill="#5C6B6B" text-anchor="end">いいえ　大阪・京都市内のみ</text>
  <path d="M 1170 164 L 1210 164 L 1210 262" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1226" y="236" font-size="16" font-weight="700" fill="#5C6B6B">はい　神戸・奈良・姫路や遠方へ</text>

  <!-- Q2 (stay in the city) -->
  <polygon points="390,267 745,323 390,379 35,323" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="390" y="317" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問2　市内のみ：乗車回数と施設数は？</text>
  <text x="390" y="344" font-size="15" fill="#5C6B6B" text-anchor="middle">地下鉄の回数・有料施設数・京都バス回数</text>
  <path d="M 390 381 L 390 406 L 68 406 L 68 790" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 68 478 L 96 478" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 68 582 L 96 582" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 68 686 L 96 686" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 68 790 L 96 790" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="100" y="432" width="660" height="92" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="120" y="460" font-size="16" font-weight="700" fill="#0B4F4D">大阪の地下鉄に平日4回以上・土日祝3回以上乗る</text>
  <text x="120" y="487" font-size="18" font-weight="700" fill="#102A2B">エンジョイエコカード　平日 820円・土日祝 620円</text>
  <text x="120" y="511" font-size="15" fill="#5C6B6B">地下鉄駅の券売機で購入、当日Osaka Metro全線乗り放題（夢洲駅除く）</text>

  <rect x="100" y="536" width="660" height="92" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="120" y="564" font-size="16" font-weight="700" fill="#8A2E1D">大阪で1日に3か所以上の有料施設へ入る</text>
  <text x="120" y="591" font-size="18" font-weight="700" fill="#102A2B">大阪周遊パス　1日 3,500円・2日 5,000円</text>
  <text x="120" y="615" font-size="15" fill="#5C6B6B">約40施設が無料入場、Osaka Metroと大阪市内私鉄の指定区間付き</text>

  <rect x="100" y="640" width="660" height="92" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="120" y="668" font-size="16" font-weight="700" fill="#4E3428">京都でバスに1日5回以上乗る</text>
  <text x="120" y="695" font-size="18" font-weight="700" fill="#102A2B">京都市交通局 地下鉄・バス1日券　1,100円</text>
  <text x="120" y="719" font-size="15" fill="#5C6B6B">市バス均一区間は1回230円。JR・京阪・阪急・嵐電は対象外</text>

  <rect x="100" y="744" width="660" height="92" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="120" y="772" font-size="16" font-weight="700" fill="#2E7D5B">いずれにも当てはまらない（1日2〜3回の乗車）</text>
  <text x="120" y="799" font-size="18" font-weight="700" fill="#102A2B">パスは買わず、ICOCAで都度精算</text>
  <text x="120" y="823" font-size="15" fill="#5C6B6B">訪日外国人向け2,000円（デポジット500円含む）、関西空港駅JR窓口</text>

  <!-- Q3 (leave the city) -->
  <polygon points="1210,267 1565,323 1210,379 855,323" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1210" y="317" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">質問3　市外へ：JRか私鉄か・距離は？</text>
  <text x="1210" y="344" font-size="15" fill="#5C6B6B" text-anchor="middle">空港からHARUKA利用ならJRが基本</text>
  <path d="M 1210 381 L 1210 406 L 808 406 L 808 790" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 808 478 L 836 478" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 808 582 L 836 582" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 808 686 L 836 686" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 808 790 L 836 790" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="840" y="432" width="715" height="92" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="860" y="460" font-size="16" font-weight="700" fill="#1F4E73">5日以内に岡山・倉敷・城崎温泉・白浜へ行く</text>
  <text x="860" y="487" font-size="18" font-weight="700" fill="#102A2B">JR西日本 関西ワイドエリアパス　5日 12,000円</text>
  <text x="860" y="511" font-size="15" fill="#5C6B6B">山陽新幹線（新大阪〜岡山）指定席、特急はるか・くろしお・こうのとり対応</text>

  <rect x="840" y="536" width="715" height="92" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="860" y="564" font-size="16" font-weight="700" fill="#0B4F4D">空港からHARUKAに乗り、連続する数日JRで神戸・姫路・奈良へ</text>
  <text x="860" y="591" font-size="17" font-weight="700" fill="#102A2B">JR関西エリアパス　1日2,800・2日4,800・3日5,800・4日7,000円</text>
  <text x="860" y="615" font-size="15" fill="#5C6B6B">HARUKA普通車指定席2回まで。新幹線と他の特急は不可、連続使用</text>

  <rect x="840" y="640" width="715" height="92" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="860" y="668" font-size="16" font-weight="700" fill="#8A2E1D">2〜3日間を私鉄のみで大阪・京都・奈良・神戸と巡る</text>
  <text x="860" y="695" font-size="17" font-weight="700" fill="#102A2B">KANSAI RAILWAY PASS LITE　2日 5,200円・3日 6,500円</text>
  <text x="860" y="719" font-size="15" fill="#5C6B6B">JR・京都市営地下鉄・バス不可。Klook・KKday・WAUG・Trip.com限定</text>

  <rect x="840" y="744" width="715" height="92" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="860" y="772" font-size="16" font-weight="700" fill="#4E3428">1つの私鉄路線だけで日帰り往復する</text>
  <text x="860" y="799" font-size="17" font-weight="700" fill="#102A2B">阪急 1,300・阪急阪神 1,600・京阪 1,650・近鉄 1,900円</text>
  <text x="860" y="823" font-size="15" fill="#5C6B6B">デジタルQR乗車券。近鉄特急に乗る場合は別途特急券が必要</text>

  <text x="45" y="874" font-size="15" fill="#5C6B6B">大人料金・単位は円（2026年9月各社公式確認）。LITEは2026年10月5日確認の10月版、2027年3月31日までに利用開始。</text>
  <text x="1555" y="874" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 制作 2026</text>
</svg>
