<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">關西交通票券決策樹：JR 周遊券、大阪周遊パス、KANSAI RAILWAY PASS LITE、各家一日券或只用 ICOCA / Which Kansai rail pass to buy</title>
  <desc id="desc">兩個問題、八個出口。問題一：行程會跨出大阪、京都市區嗎？答否的人看問題二，留在市區一天搭幾趟、進幾個景點：大阪地鐵平日搭 4 趟以上、假日 3 趟以上，買 Osaka Metro Enjoy Eco Card 平日 820、假日 620 日圓；大阪一天要進 3 個以上付費景點，買大阪周遊パス 1 日 3,500、2 日 5,000 日圓，約 40 處景點免費入場；京都巴士日一天搭 5 趟以上，買京都地下鉄・バス1日券 1,100 日圓，市巴士單程 230；以上都不是、一天只搭兩三趟，就不買票，用 ICOCA 逐趟刷，訪日旅客版 2,000 日圓含 500 押金。答是的人看問題三，跨出市區走 JR 還是私鐵、去多遠：5 天內會去岡山、倉敷、城崎溫泉、白濱，買 JR 關西廣域鐵路周遊券 5 日 12,000 日圓，含新幹線新大阪到岡山指定席與 HARUKA、くろしお、こうのとり；從機場搭 HARUKA 再連續幾天搭 JR 去神戶、姬路、奈良，買 JR 關西地區鐵路周遊券 1 日 2,800、2 日 4,800、3 日 5,800、4 日 7,000 日圓，HARUKA 指定席 2 次，不含新幹線與其他特急；2 到 3 天全靠私鐵跑大阪、京都、奈良、神戶，買 KANSAI RAILWAY PASS LITE 2 日 5,200、3 日 6,500 日圓，不含 JR、京都市營地鐵與巴士，只在 Klook、KKday、WAUG 線上販售；只跑一條私鐵、當天來回，買單線一日券：阪急 1,300、阪急阪神 1,600、京阪 1,650、近鐵 1,900 日圓。票價為大人票、單位日圓，2026 年 9 月查證各公司官網；LITE 要在 2026 年 9 月 30 日前啟用，之後的版本以官網為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">關西交通票券怎麼選：兩個問題、八個出口（2026 年 9 月查證票價）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which Kansai rail pass: JR passes, Osaka Amazing Pass, KANSAI RAILWAY PASS LITE, one-line day passes or just ICOCA</text>

  <!-- Q1 -->
  <polygon points="800,107 1130,165 800,223 470,165" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="160" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　行程會跨出大阪、京都市區嗎？</text>
  <text x="800" y="188" font-size="16" fill="#5C6B6B" text-anchor="middle">神戶、奈良、姬路、和歌山、岡山、城崎、白濱</text>
  <path d="M 470 165 L 400 165 L 400 271" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="388" y="245" font-size="16" fill="#5C6B6B" text-anchor="end">否　只在大阪、京都市內活動</text>
  <path d="M 1130 165 L 1200 165 L 1200 271" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1212" y="245" font-size="16" fill="#5C6B6B">是　會去神戶、奈良、姬路或更遠</text>

  <!-- Q2 (stay in the city) -->
  <polygon points="400,275 720,325 400,375 80,325" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="400" y="320" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　留在市區：一天搭幾趟、進幾個景點？</text>
  <text x="400" y="346" font-size="16" fill="#5C6B6B" text-anchor="middle">地鐵趟數、付費景點數、京都巴士趟數</text>
  <path d="M 400 377 L 400 405 L 95 405 L 95 798" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 95 489 L 126 489" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 95 592 L 126 592" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 95 695 L 126 695" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 95 798 L 126 798" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="130" y="445" width="610" height="88" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="150" y="472" font-size="17" font-weight="700" fill="#0B4F4D">大阪地鐵平日搭 4 趟以上、假日 3 趟以上</text>
  <text x="150" y="498" font-size="18" font-weight="700" fill="#102A2B">Enjoy Eco Card　平日 820・假日 620 日圓</text>
  <text x="150" y="521" font-size="15" fill="#5C6B6B">地鐵站售票機購買，當天 Osaka Metro 全線無限搭（夢洲站除外）</text>

  <rect x="130" y="548" width="610" height="88" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="150" y="575" font-size="17" font-weight="700" fill="#8A2E1D">大阪一天要進 3 個以上付費景點</text>
  <text x="150" y="601" font-size="18" font-weight="700" fill="#102A2B">大阪周遊パス　1 日 3,500・2 日 5,000 日圓</text>
  <text x="150" y="624" font-size="15" fill="#5C6B6B">約 40 處景點免費入場，含 Osaka Metro 與市內私鐵指定區間</text>

  <rect x="130" y="651" width="610" height="88" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="150" y="678" font-size="17" font-weight="700" fill="#4E3428">京都巴士日一天搭 5 趟以上</text>
  <text x="150" y="704" font-size="18" font-weight="700" fill="#102A2B">京都 地下鉄・バス1日券　1,100 日圓</text>
  <text x="150" y="727" font-size="15" fill="#5C6B6B">市巴士單程 230；不含 JR、京阪、阪急、嵐電</text>

  <rect x="130" y="754" width="610" height="88" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="150" y="781" font-size="17" font-weight="700" fill="#2E7D5B">以上都不是：一天只搭兩三趟</text>
  <text x="150" y="807" font-size="18" font-weight="700" fill="#102A2B">不買票，ICOCA 逐趟刷</text>
  <text x="150" y="830" font-size="15" fill="#5C6B6B">訪日旅客版 2,000 日圓含 500 押金，關西機場站 JR 綠色窗口</text>

  <!-- Q3 (leave the city) -->
  <polygon points="1200,275 1520,325 1200,375 880,325" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1200" y="320" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　跨出市區：走 JR 還是私鐵、去多遠？</text>
  <text x="1200" y="346" font-size="16" fill="#5C6B6B" text-anchor="middle">從機場搭 HARUKA 的人多半是 JR</text>
  <path d="M 1200 377 L 1200 405 L 855 405 L 855 798" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 855 489 L 886 489" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 855 592 L 886 592" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 855 695 L 886 695" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 855 798 L 886 798" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="890" y="445" width="650" height="88" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="910" y="472" font-size="17" font-weight="700" fill="#1F4E73">5 天內會去岡山、倉敷、城崎溫泉、白濱</text>
  <text x="910" y="498" font-size="18" font-weight="700" fill="#102A2B">JR 關西廣域鐵路周遊券　5 日 12,000 日圓</text>
  <text x="910" y="521" font-size="15" fill="#5C6B6B">含新幹線新大阪—岡山指定席與 HARUKA、くろしお、こうのとり</text>

  <rect x="890" y="548" width="650" height="88" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="910" y="575" font-size="17" font-weight="700" fill="#0B4F4D">從機場搭 HARUKA，再連續幾天搭 JR 去神戶、姬路、奈良</text>
  <text x="910" y="601" font-size="18" font-weight="700" fill="#102A2B">JR 關西地區鐵路周遊券　1 日 2,800・2 日 4,800・3 日 5,800・4 日 7,000</text>
  <text x="910" y="624" font-size="15" fill="#5C6B6B">HARUKA 指定席 2 次；不含新幹線與其他特急，天數要連續</text>

  <rect x="890" y="651" width="650" height="88" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="910" y="678" font-size="17" font-weight="700" fill="#8A2E1D">2 到 3 天全靠私鐵跑大阪、京都、奈良、神戶</text>
  <text x="910" y="704" font-size="18" font-weight="700" fill="#102A2B">KANSAI RAILWAY PASS LITE　2 日 5,200・3 日 6,500 日圓</text>
  <text x="910" y="727" font-size="15" fill="#5C6B6B">不含 JR、京都市營地鐵、巴士；只在 Klook、KKday、WAUG 線上販售</text>

  <rect x="890" y="754" width="650" height="88" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="910" y="781" font-size="17" font-weight="700" fill="#4E3428">只跑一條私鐵、當天來回</text>
  <text x="910" y="807" font-size="18" font-weight="700" fill="#102A2B">阪急 1,300・阪急阪神 1,600・京阪 1,650・近鐵 1,900 日圓</text>
  <text x="910" y="830" font-size="15" fill="#5C6B6B">數位 QR 票；近鐵特急要另買特急券</text>

  <text x="60" y="874" font-size="15" fill="#5C6B6B">大人票、單位日圓，2026 年 9 月查證各公司官網；LITE 2026 年 9 月 30 日前啟用，之後版本以官網為準。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
