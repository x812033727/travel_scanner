<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">关西交通通票决策树：JR 周游券、大阪周游卡、KANSAI RAILWAY PASS LITE、各家一日券或只用 ICOCA</title>
  <desc id="desc">两个问题、八个出口。问题一：行程会跨出大阪、京都市区吗？答否的看问题二，留在市区一天坐几趟、逛几个景点：大阪地铁平日坐 4 趟以上、周末及节假日 3 趟以上，买 Osaka Metro Enjoy Eco Card（平日 820、周末及节假日 620 日元）；大阪一天要逛 3 个以上收费景点，买大阪周游卡（1 日 3,500、2 日 5,000 日元，约 40 处景点免费入场）；京都巴士日一天坐 5 趟以上，买京都地铁·巴士一日券（1,100 日元，市巴士均一区间单程 230 日元）；以上都不是、一天只坐两三趟，就不买通票，用 ICOCA 按次刷卡（访日旅客版 2,000 日元含 500 日元押金）。答是的看问题三，跨出市区坐 JR 还是私铁、去多远：5 天内会去冈山、仓敷、城崎温泉、白滨，买 JR 关西广域铁路周游券（5 日 12,000 日元，含山阳新干线新大阪到冈山指定席以及 HARUKA、黑潮号、东方白鹳号）；从机场坐 HARUKA 再连续几天坐 JR 去神户、姬路、奈良，买 JR 关西地区铁路周游券（1 日 2,800、2 日 4,800、3 日 5,800、4 日 7,000 日元，含 HARUKA 指定席 2 次，不含新干线与其他特急）；2 到 3 天全靠私铁玩大阪、京都、奈良、神户，买 KANSAI RAILWAY PASS LITE（2 日 5,200、3 日 6,500 日元，不含 JR、京都市营地铁与巴士，仅在 Klook、KKday、WAUG、Trip.com 线上发售）；只坐一条私铁、当天往返，买单线一日券（阪急 1,300、阪急阪神 1,600、京阪 1,650、近铁 1,900 日元）。票价均为成人票、单位日元，2026 年 9 月查证各公司官网；LITE 为 2026 年 10 月 5 日查证的 10 月版，须在 2027 年 3 月 31 日前启用。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="52" y="48" font-size="29" font-weight="700" fill="#102A2B">关西交通通票怎么选：两个问题、八个出口（2026 年 9 月查证票价）</text>
  <text x="52" y="78" font-size="17" fill="#5C6B6B">Which Kansai rail pass: JR passes, Osaka Amazing Pass, KANSAI RAILWAY PASS LITE, one-line day passes or just ICOCA</text>

  <!-- Q1 -->
  <polygon points="800,96 1160,158 800,220 440,158" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="153" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 1　行程会跨出大阪、京都市区吗？</text>
  <text x="800" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">神户、奈良、姬路、和歌山、冈山、城崎、白滨</text>
  <path d="M 440 158 L 400 158 L 400 258" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="386" y="232" font-size="16" fill="#5C6B6B" text-anchor="end">否　只在大阪、京都市区内活动</text>
  <path d="M 1160 158 L 1200 158 L 1200 258" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1214" y="232" font-size="16" fill="#5C6B6B">是　前往神户、奈良、姬路或更远</text>

  <!-- Q2 (stay in the city) -->
  <polygon points="400,262 765,320 400,378 35,320" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="400" y="315" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 2　留在市区：坐几趟、逛几个景点？</text>
  <text x="400" y="342" font-size="15" fill="#5C6B6B" text-anchor="middle">地铁次数、收费景点数量、京都巴士次数</text>
  <path d="M 400 380 L 400 402 L 54 402 L 54 782" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 54 470 L 84 470" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 54 574 L 84 574" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 54 678 L 84 678" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 54 782 L 84 782" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="88" y="424" width="680" height="92" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="108" y="452" font-size="16" font-weight="700" fill="#0B4F4D">大阪地铁平日坐 4 趟以上、周末及节假日 3 趟以上</text>
  <text x="108" y="479" font-size="18" font-weight="700" fill="#102A2B">Enjoy Eco Card　平日 820 · 周末及节假日 620 日元</text>
  <text x="108" y="503" font-size="15" fill="#5C6B6B">地铁站自动售票机购买，当天 Osaka Metro 全线无限次乘坐（梦洲站除外）</text>

  <rect x="88" y="528" width="680" height="92" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="108" y="556" font-size="16" font-weight="700" fill="#8A2E1D">大阪一天要逛 3 个以上收费景点</text>
  <text x="108" y="583" font-size="18" font-weight="700" fill="#102A2B">大阪周游卡　1 日 3,500 · 2 日 5,000 日元</text>
  <text x="108" y="607" font-size="15" fill="#5C6B6B">约 40 处景点免费入场，含 Osaka Metro 与市内私铁指定区间</text>

  <rect x="88" y="632" width="680" height="92" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="108" y="660" font-size="16" font-weight="700" fill="#4E3428">京都巴士日一天坐 5 趟以上</text>
  <text x="108" y="687" font-size="18" font-weight="700" fill="#102A2B">京都地铁·巴士一日券　1,100 日元</text>
  <text x="108" y="711" font-size="15" fill="#5C6B6B">市巴士均一区间单程 230 日元；不含 JR、京阪、阪急、岚电</text>

  <rect x="88" y="736" width="680" height="92" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="108" y="764" font-size="16" font-weight="700" fill="#2E7D5B">以上都不是：一天只坐两三趟</text>
  <text x="108" y="791" font-size="18" font-weight="700" fill="#102A2B">不买通票，用 ICOCA 按次刷卡</text>
  <text x="108" y="815" font-size="15" fill="#5C6B6B">访日旅客版 2,000 日元含 500 押金，关西机场站 JR 绿色窗口购买</text>

  <!-- Q3 (leave the city) -->
  <polygon points="1200,262 1565,320 1200,378 835,320" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1200" y="315" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">问题 3　跨出市区：坐 JR 还是私铁、去多远？</text>
  <text x="1200" y="342" font-size="15" fill="#5C6B6B" text-anchor="middle">从机场坐 HARUKA 的旅客多半选 JR</text>
  <path d="M 1200 380 L 1200 402 L 820 402 L 820 782" fill="none" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 820 470 L 850 470" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 820 574 L 850 574" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 820 678 L 850 678" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 820 782 L 850 782" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="854" y="424" width="706" height="92" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="874" y="452" font-size="16" font-weight="700" fill="#1F4E73">5 天内会去冈山、仓敷、城崎温泉、白滨</text>
  <text x="874" y="479" font-size="18" font-weight="700" fill="#102A2B">JR 关西广域铁路周游券　5 日 12,000 日元</text>
  <text x="874" y="503" font-size="15" fill="#5C6B6B">含山阳新干线新大阪—冈山指定席，以及 HARUKA、黑潮号、东方白鹳号</text>

  <rect x="854" y="528" width="706" height="92" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="874" y="556" font-size="16" font-weight="700" fill="#0B4F4D">从机场坐 HARUKA，再连续几天坐 JR 去神户、姬路、奈良</text>
  <text x="874" y="583" font-size="17" font-weight="700" fill="#102A2B">JR 关西地区铁路周游券　1 日 2,800 · 2 日 4,800 · 3 日 5,800 · 4 日 7,000 日元</text>
  <text x="874" y="607" font-size="15" fill="#5C6B6B">含 HARUKA 指定席 2 次；不含新干线与其他特急，天数须连续使用</text>

  <rect x="854" y="632" width="706" height="92" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="874" y="660" font-size="16" font-weight="700" fill="#8A2E1D">2 到 3 天全靠私铁玩大阪、京都、奈良、神户</text>
  <text x="874" y="687" font-size="17" font-weight="700" fill="#102A2B">KANSAI RAILWAY PASS LITE　2 日 5,200 · 3 日 6,500 日元</text>
  <text x="874" y="711" font-size="15" fill="#5C6B6B">不含 JR、京都市营地铁与巴士；仅在 Klook、KKday、WAUG、Trip.com 线上发售</text>

  <rect x="854" y="736" width="706" height="92" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="874" y="764" font-size="16" font-weight="700" fill="#4E3428">只坐一条私铁、当天往返</text>
  <text x="874" y="791" font-size="17" font-weight="700" fill="#102A2B">阪急 1,300 · 阪急阪神 1,600 · 京阪 1,650 · 近铁 1,900 日元</text>
  <text x="874" y="815" font-size="15" fill="#5C6B6B">电子二维码票；乘坐近铁特急需另购特急券</text>

  <text x="52" y="868" font-size="15" fill="#5C6B6B">成人票、单位日元，2026 年 9 月查证各公司官网；LITE 为 2026 年 10 月 5 日查证的 10 月版，须在 2027 年 3 月 31 日前启用。</text>
