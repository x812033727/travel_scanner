<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">濟州租車六步流程：行前、濟州機場、租車村、保險、取車驗車、還車 / Renting a car in Jeju in six steps</title>
  <desc id="desc">六個步驟。行前：到監理站辦台灣國際駕照正本，線上預約時填國際駕照號碼，樂天的年齡下限 21 歲，選含自車損害免責的方案。濟州機場：1 樓 2 號門旁的樂天櫃檯先報到，往 3、5 號門走、過馬路、走遮雨棚步道，接駁站在 5 號門外，接駁車 06:00 到 22:40，每 7 到 15 分鐘一班。租車村：樂天 Auto House 06:00 到 23:00，出示護照、國際駕照正本、台灣駕照、信用卡，簽租約與信用卡授權。保險：基本險對物 2,000 萬韓元、人身 1,500 萬韓元，自車損害免責對國際客戶零自負額，樂天費用與保險頁列濟州韓國品牌及進口車 CDW 零自負額；濟州 Auto House 全免責頁列輪胎、輪圈保障，但另一官方頁將停駛損失費減免限於已加入零自負額 CDW 的韓國品牌車（Hyundai Solati 除外）；一般 FAQ 另列車內損傷等除外項目，依車型與合約逐項確認。取車驗車：繞車拍刮痕記在驗車單，確認油量與油種，導航改用 Naver Map 或 Kakao Map，兒童座椅裝好。還車：油量加到跟取車一樣，還車區停好、驗車、接駁回機場，取消政策是 24 小時前全退、之後扣 3,000 韓元，罰單事後從信用卡扣。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">濟州租車六步：台灣國際駕照就能開（2026 年 9 月查證）</text>
  <text x="60" y="90" font-size="19" fill="#5C6B6B">제주 렌터카 6단계 · Renting a car in Jeju in six steps · 依樂天租車、濟州機場、道路交通公團官網</text>

  <!-- step 1 行前 -->
  <rect x="60" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="60" y="120" width="470" height="70" rx="20" fill="#2F6F9F"/>
  <text x="295" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="295" y="178" font-size="16" fill="#E6F0F7" text-anchor="middle">출발 전 · Before departure</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="226">● 監理站辦台灣國際駕照，只收正本</text>
    <text x="84" y="262">● 線上預約時填國際駕照號碼</text>
    <text x="84" y="298">● 樂天年齡下限 21 歲</text>
    <text x="84" y="334">● 選含自車損害免責（자차 CDW）的方案</text>
    <text x="84" y="370">● 台灣駕照、護照、信用卡一起帶</text>
  </g>
  <rect x="84" y="384" width="180" height="26" rx="8" fill="#2E7D5B"/><text x="174" y="403" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2022 年備忘錄生效</text>

  <!-- step 2 濟州機場 -->
  <rect x="565" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#6E7A7A" stroke-width="5"/>
  <rect x="565" y="120" width="470" height="70" rx="20" fill="#6E7A7A"/>
  <text x="800" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　濟州機場</text>
  <text x="800" y="178" font-size="16" fill="#EEF1F1" text-anchor="middle">제주공항 · Jeju Airport</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="226">● 1 樓 2 號門旁：樂天櫃檯先報到</text>
    <text x="589" y="262">● 往 3、5 號門 → 過馬路 → 遮雨棚步道</text>
    <text x="589" y="298">● 5 號門外：租車接駁站（Zone 1 的 4 號）</text>
    <text x="589" y="334">● 接駁 06:00～22:40，每 7～15 分鐘一班</text>
    <text x="589" y="370">● 07:30～19:30 每 7 分鐘一班</text>
  </g>

  <!-- step 3 租車村 -->
  <rect x="1070" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="1070" y="120" width="470" height="70" rx="20" fill="#0D6B68"/>
  <text x="1305" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　租車村</text>
  <text x="1305" y="178" font-size="16" fill="#E3F0EF" text-anchor="middle">렌터카하우스 · Rental Car House</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="226">● 樂天 Auto House 06:00～23:00</text>
    <text x="1094" y="262">● 出示：護照、國際駕照正本、</text>
    <text x="1112" y="288">台灣駕照、信用卡</text>
    <text x="1094" y="324">● 簽租約與信用卡授權書</text>
    <text x="1094" y="360">● 濟州市龍海路 92（용해로 92）</text>
  </g>

  <!-- step 4 保險 -->
  <rect x="60" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="60" y="480" width="470" height="70" rx="20" fill="#D97A2B"/>
  <text x="295" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　保險</text>
  <text x="295" y="538" font-size="16" fill="#FBEFE4" text-anchor="middle">보험 · Insurance</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="586">● 基本險：對物 2,000 萬、人身 1,500 萬韓元</text>
    <text x="84" y="622">● 自車損害免責（자차 CDW）：</text>
    <text x="102" y="648">樂天國際客戶零自負額</text>
    <text x="84" y="684">● 濟州不適用進口車 30 萬自負額</text>
    <text x="84" y="720">● 零自負額CDW＋國產車：免停駛費</text>
    <text x="84" y="756">● Solati除外；含輪胎輪圈，其餘看合約</text>
  </g>

  <!-- step 5 取車驗車 -->
  <rect x="565" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="565" y="480" width="470" height="70" rx="20" fill="#2E7D5B"/>
  <text x="800" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　取車驗車</text>
  <text x="800" y="538" font-size="16" fill="#E7F2EC" text-anchor="middle">차량 인수 · Pick-up</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="586">● 繞車一圈拍刮痕，記在驗車單</text>
    <text x="589" y="622">● 確認油表與油種：휘발유 汽油／경유 柴油</text>
    <text x="589" y="658">● 導航用 Naver Map 或 Kakao Map</text>
    <text x="589" y="694">● 兒童座椅裝好、每位駕駛都登記</text>
    <text x="589" y="730">● 靠右行駛、限速看標誌、測速相機多</text>
  </g>

  <!-- step 6 還車 -->
  <rect x="1070" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <rect x="1070" y="480" width="470" height="70" rx="20" fill="#B8442D"/>
  <text x="1305" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">6　還車</text>
  <text x="1305" y="538" font-size="16" fill="#FBE9E4" text-anchor="middle">반납 · Return</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="586">● 油量加到跟取車時一樣，留收據</text>
    <text x="1094" y="622">● 還車區停好 → 驗車 → 接駁回機場</text>
    <text x="1094" y="658">● 取消：24 小時前全退，之後扣 3,000 韓元</text>
    <text x="1094" y="694">● 罰單事後從信用卡扣並加手續費</text>
    <text x="1094" y="730">● 國際線起飛前三小時到營業所</text>
  </g>

  <!-- arrows -->
  <path d="M 532 270 L 560 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 270 L 1065 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1305 422 L 1305 450 L 295 450 L 295 476" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 532 630 L 560 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 630 L 1065 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="820" font-size="16" fill="#5C6B6B">台灣國際駕照：2022 年 2 月臺韓國際駕照相互承認備忘錄生效；韓國道路交通公團規定國際駕照從入境日起一年內有效，與本國駕照、護照同行。</text>
  <text x="60" y="850" font-size="16" fill="#5C6B6B">數字為 2026 年 9 月依樂天租車與濟州機場官網查證；SK 租車與在地公司的接駁、保險條款以各公司官網為準。</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
