<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">대만 발급 국제운전면허증으로 제주 렌터카 여행: 6단계</title>
  <desc id="desc">여섯 단계입니다. 출국 전: 대만 감리소에서 국제운전면허증 원본을 발급받고 온라인 예약 시 번호를 입력합니다. 롯데의 최저 연령은 만 21세이며 자차손해면책제도(CDW)가 포함된 상품을 고릅니다. 제주공항: 1층 2번 게이트 옆 롯데 카운터에 도착을 알린 뒤 3번·5번 게이트 방향으로 가서 길을 건너 지붕 있는 통로를 따라 5번 게이트 밖 셔틀 승차장으로 갑니다. 셔틀은 06:00~22:40에 7~15분 간격으로 운행합니다. 렌터카 영업소: 롯데 Auto House는 06:00~23:00 운영하며 여권, 국제운전면허증 원본, 대만 면허증, 카드 제시 후 계약과 카드 승인에 서명합니다. 보험: 기본 대물 보장은 2,000만 원, 인적 피해 보장은 1,500만 원입니다. 롯데는 해외 고객과 제주에서 빌리는 한국 브랜드 차·수입차의 CDW 자기부담금을 0원으로 안내합니다. 제주 Auto House 완전면책 페이지는 타이어·휠 손상도 포함하지만, 별도 공식 페이지는 휴차보상료 면제를 자기부담금 0원 CDW에 가입한 한국 브랜드 차(Hyundai Solati 제외)로 제한합니다. 일반 FAQ에는 실내 손상 같은 제외 항목도 있으므로 차종별 계약을 확인하세요. 차량 인수: 흠집을 촬영해 점검표에 기록하고 연료량과 유종, Naver Map 또는 Kakao Map, 유아용 카시트를 확인합니다. 반납: 인수 때와 같은 연료량으로 채우고 반납 구역에서 점검한 뒤 공항 셔틀을 탑니다. 롯데는 인수 24시간 전까지 취소하면 전액 환불하고 이후에는 3,000원을 차감합니다. 교통 과태료는 나중에 카드로 청구될 수 있습니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">제주 렌터카 6단계: 대만 발급 국제운전면허증</text>
  <text x="60" y="90" font-size="19" fill="#5C6B6B">롯데렌터카 · 제주공항 · 한국도로교통공단 (2026년 9월 확인)</text>

  <!-- step 1 行前 -->
  <rect x="60" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="60" y="120" width="470" height="70" rx="20" fill="#2F6F9F"/>
  <text x="295" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1  출발 전</text>
  <text x="295" y="178" font-size="16" fill="#E6F0F7" text-anchor="middle">출국 준비</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="226">● 대만 감리소에서 국제면허증 원본 발급</text>
    <text x="84" y="262">● 온라인 예약 때 국제면허증 번호 입력</text>
    <text x="84" y="298">● 롯데의 최저 연령: 만 21세</text>
    <text x="84" y="334">● 자차손해면책제도(CDW) 상품 선택</text>
    <text x="84" y="370">● 대만 면허증·여권·카드도 지참</text>
  </g>
  <rect x="84" y="384" width="180" height="26" rx="8" fill="#2E7D5B"/><text x="174" y="403" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2022년 상호 인정</text>

  <!-- step 2 濟州機場 -->
  <rect x="565" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#6E7A7A" stroke-width="5"/>
  <rect x="565" y="120" width="470" height="70" rx="20" fill="#6E7A7A"/>
  <text x="800" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2  제주공항</text>
  <text x="800" y="178" font-size="16" fill="#EEF1F1" text-anchor="middle">제주공항에서</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="226">● 1층 2번 게이트 옆 롯데 카운터 확인</text>
    <text x="589" y="262">● 3·5번 게이트→횡단보도→지붕 통로</text>
    <text x="589" y="298">● 5번 게이트 밖 셔틀: Zone 1·4번</text>
    <text x="589" y="334">● 셔틀 06:00~22:40, 7~15분 간격</text>
    <text x="589" y="370">● 07:30~19:30에는 7분 간격</text>
  </g>

  <!-- step 3 租車村 -->
  <rect x="1070" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="1070" y="120" width="470" height="70" rx="20" fill="#0D6B68"/>
  <text x="1305" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3  렌터카 영업소</text>
  <text x="1305" y="178" font-size="16" fill="#E3F0EF" text-anchor="middle">렌터카 영업소에서</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="226">● 롯데 Auto House 06:00~23:00</text>
    <text x="1094" y="262">● 여권·국제면허증 원본·</text>
    <text x="1112" y="288">대만 면허증·결제 카드 제시</text>
    <text x="1094" y="324">● 계약서와 카드 승인서 서명</text>
    <text x="1094" y="360">● 제주시 용해로 92</text>
  </g>

  <!-- step 4 保險 -->
  <rect x="60" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="60" y="480" width="470" height="70" rx="20" fill="#D97A2B"/>
  <text x="295" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4  보험</text>
  <text x="295" y="538" font-size="16" fill="#FBEFE4" text-anchor="middle">보험 · CDW</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="586">● 대물 2,000만 · 인적 피해 1,500만 원</text>
    <text x="84" y="622">● 자차손해면책제도(자차 CDW):</text>
    <text x="102" y="648">해외 고객 자기부담금 0원</text>
    <text x="84" y="684">● 제주 완전면책: 타이어·휠 포함</text>
    <text x="84" y="720">● 휴차료 면제: 자기부담금 0원 CDW</text>
    <text x="84" y="756">가입 한국 브랜드 차만(Solati 제외)</text>
  </g>

  <!-- step 5 取車驗車 -->
  <rect x="565" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="565" y="480" width="470" height="70" rx="20" fill="#2E7D5B"/>
  <text x="800" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5  차량 점검</text>
  <text x="800" y="538" font-size="16" fill="#E7F2EC" text-anchor="middle">차량 인수</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="586">● 기존 흠집 촬영·점검표 기록</text>
    <text x="589" y="622">● 연료 확인: 휘발유 또는 경유</text>
    <text x="589" y="658">● Naver Map·Kakao Map 내비 사용</text>
    <text x="589" y="694">● 카시트 장착, 모든 운전자 등록</text>
    <text x="589" y="730">● 우측통행·속도 표지·카메라 주의</text>
  </g>

  <!-- step 6 還車 -->
  <rect x="1070" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <rect x="1070" y="480" width="470" height="70" rx="20" fill="#B8442D"/>
  <text x="1305" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">6  반납</text>
  <text x="1305" y="538" font-size="16" fill="#FBE9E4" text-anchor="middle">차량 반납</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="586">● 인수 때와 같은 연료량, 영수증 보관</text>
    <text x="1094" y="622">● 반납 구역→점검→공항 셔틀</text>
    <text x="1094" y="658">● 24시간 전 전액 환불, 이후 3,000원 차감</text>
    <text x="1094" y="694">● 과태료와 수수료는 나중에 카드 청구</text>
    <text x="1094" y="730">● 국제선 출발 약 3시간 전 영업소 도착</text>
  </g>

  <!-- arrows -->
  <path d="M 532 270 L 560 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 270 L 1065 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1305 422 L 1305 450 L 295 450 L 295 476" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 532 630 L 560 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 630 L 1065 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="820" font-size="16" fill="#5C6B6B">대만 발급 국제운전면허증은 2022년 양자 양해각서로 인정됩니다. 원본과 대만 면허증·여권을 소지하고 입국일로부터 1년 조건을 확인하세요.</text>
  <text x="60" y="850" font-size="16" fill="#5C6B6B">수치는 2026년 9월 롯데렌터카와 제주공항 공식 자료 확인. SK와 현지 업체의 셔틀·보험 조건은 각 업체의 공식 안내를 보세요.</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 제작 2026</text>
