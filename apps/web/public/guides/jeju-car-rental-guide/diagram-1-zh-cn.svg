<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">济州租车六步流程：行前、济州机场、租车村、保险、取车验车、还车</title>
  <desc id="desc">六个步骤。行前：到监理站办台湾国际驾照正本，网上预约时填国际驾照号码，乐天的年龄下限 21 岁，选含自车损害免责的方案。济州机场：1 楼 2 号门旁的乐天柜台先报到，往 3、5 号门走、过马路、走遮雨棚步道，接驳站在 5 号门外，接驳车 06:00 到 22:40，每 7 到 15 分钟一班。租车村：乐天 Auto House 06:00 到 23:00，出示护照、国际驾照正本、台湾驾照、信用卡，签租约与信用卡授权。保险：基本险对物 2,000 万韩元、人身 1,500 万韩元，自车损害免责对国际客户零自负额，乐天费用与保险页列济州韩国品牌及进口车 CDW 零自负额；济州 Auto House 全免责页列轮胎、轮圈保障，但另一官方页将停驶损失费减免限于已加入零自负额 CDW 的韩国品牌车（Hyundai Solati 除外）；一般 FAQ 另列车内损伤等除外项目，依车型与合约逐项确认。取车验车：绕车拍刮痕记在验车单，确认油量与油种，导航改用 Naver Map 或 Kakao Map，儿童座椅装好。还车：油量加到跟取车一样，还车区停好、验车、接驳回机场，取消政策是 24 小时前全退、之后扣 3,000 韩元，罚单事后从信用卡扣。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">济州租车六步：台湾国际驾照就能开（2026 年 9 月查证）</text>
  <text x="60" y="90" font-size="19" fill="#5C6B6B">资料来源：乐天租车、济州机场、韩国道路交通公团官网</text>

  <!-- step 1 行前 -->
  <rect x="60" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="60" y="120" width="470" height="70" rx="20" fill="#2F6F9F"/>
  <text x="295" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="295" y="178" font-size="16" fill="#E6F0F7" text-anchor="middle">出发前准备</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="226">● 监理站办台湾国际驾照，只收正本</text>
    <text x="84" y="262">● 网上预约时填国际驾照号码</text>
    <text x="84" y="298">● 乐天年龄下限 21 岁</text>
    <text x="84" y="334">● 选含自车损害免责（자차 CDW）的方案</text>
    <text x="84" y="370">● 台湾驾照、护照、信用卡一起带</text>
  </g>
  <rect x="84" y="384" width="180" height="26" rx="8" fill="#2E7D5B"/><text x="174" y="403" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2022 年备忘录生效</text>

  <!-- step 2 济州机场 -->
  <rect x="565" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#6E7A7A" stroke-width="5"/>
  <rect x="565" y="120" width="470" height="70" rx="20" fill="#6E7A7A"/>
  <text x="800" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　济州机场</text>
  <text x="800" y="178" font-size="16" fill="#EEF1F1" text-anchor="middle">抵达济州机场</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="226">● 1 楼 2 号门旁：乐天柜台先报到</text>
    <text x="589" y="262">● 往 3、5 号门 → 过马路 → 遮雨棚步道</text>
    <text x="589" y="298">● 5 号门外：租车接驳站（Zone 1 的 4 号）</text>
    <text x="589" y="334">● 接驳 06:00～22:40，每 7～15 分钟一班</text>
    <text x="589" y="370">● 07:30～19:30 每 7 分钟一班</text>
  </g>

  <!-- step 3 租车村 -->
  <rect x="1070" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="1070" y="120" width="470" height="70" rx="20" fill="#0D6B68"/>
  <text x="1305" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　租车村</text>
  <text x="1305" y="178" font-size="16" fill="#E3F0EF" text-anchor="middle">租车营业所</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="226">● 乐天 Auto House 06:00～23:00</text>
    <text x="1094" y="262">● 出示：护照、国际驾照正本、</text>
    <text x="1112" y="288">台湾驾照、信用卡</text>
    <text x="1094" y="324">● 签租约与信用卡授权书</text>
    <text x="1094" y="360">● 济州市龙海路 92（용해로 92）</text>
  </g>

  <!-- step 4 保险 -->
  <rect x="60" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="60" y="480" width="470" height="70" rx="20" fill="#D97A2B"/>
  <text x="295" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　保险</text>
  <text x="295" y="538" font-size="16" fill="#FBEFE4" text-anchor="middle">保险与 CDW</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="586">● 基本险：对物 2,000 万、人身 1,500 万韩元</text>
    <text x="84" y="622">● 自车损害免责（자차 CDW）：</text>
    <text x="102" y="648">乐天国际客户零自负额</text>
    <text x="84" y="684">● 济州不适用进口车 30 万自负额</text>
    <text x="84" y="720">● 零自负额CDW＋韩国品牌车：免停驶费</text>
    <text x="84" y="756">● Solati除外；含轮胎轮圈，其余看合约</text>
  </g>

  <!-- step 5 取车验车 -->
  <rect x="565" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="565" y="480" width="470" height="70" rx="20" fill="#2E7D5B"/>
  <text x="800" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　取车验车</text>
  <text x="800" y="538" font-size="16" fill="#E7F2EC" text-anchor="middle">取车检查</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="586">● 绕车一圈拍刮痕，记在验车单</text>
    <text x="589" y="622">● 确认油表与油种：휘발유 汽油／경유 柴油</text>
    <text x="589" y="658">● 导航用 Naver Map 或 Kakao Map</text>
    <text x="589" y="694">● 儿童座椅装好、每位驾驶都登记</text>
    <text x="589" y="730">● 靠右行驶、限速看标志、测速相机多</text>
  </g>

  <!-- step 6 还车 -->
  <rect x="1070" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <rect x="1070" y="480" width="470" height="70" rx="20" fill="#B8442D"/>
  <text x="1305" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">6　还车</text>
  <text x="1305" y="538" font-size="16" fill="#FBE9E4" text-anchor="middle">还车步骤</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="586">● 油量加到跟取车时一样，留收据</text>
    <text x="1094" y="622">● 还车区停好 → 验车 → 接驳回机场</text>
    <text x="1094" y="658">● 取消：24 小时前全退，之后扣 3,000 韩元</text>
    <text x="1094" y="694">● 罚单事后从信用卡扣并加手续费</text>
    <text x="1094" y="730">● 国际线起飞前三小时到营业所</text>
  </g>

  <!-- arrows -->
  <path d="M 532 270 L 560 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 270 L 1065 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1305 422 L 1305 450 L 295 450 L 295 476" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 532 630 L 560 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 630 L 1065 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="820" font-size="16" fill="#5C6B6B">台湾国际驾照：2022 年 2 月台韩国际驾照相互承认备忘录生效；韩国道路交通公团规定国际驾照从入境日起一年内有效，与本国驾照、护照同行。</text>
  <text x="60" y="850" font-size="16" fill="#5C6B6B">数字为 2026 年 9 月依乐天租车与济州机场官网查证；SK 租车与当地公司的接驳、保险条款以各公司官网为准。</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 制图 2026</text>
</svg>
