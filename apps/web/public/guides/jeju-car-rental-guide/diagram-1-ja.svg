<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">台湾発行の国際運転免許証で済州島をレンタカー旅行：6段階</title>
  <desc id="desc">6段階の流れ。出発前：台湾の監理所で国際運転免許証の原本を取得し、オンライン予約時に番号を入力。LOTTEの最低年齢は21歳で、車両損害免責（CDW）付きプランを選びます。済州空港：1階2番ゲート横のLOTTEカウンターに到着を伝え、3番・5番ゲート方面へ歩き、道路を渡って屋根付き通路を進み、5番ゲート外の送迎乗り場へ。送迎は06:00～22:40、7～15分間隔です。レンタカー営業所：LOTTE Auto Houseは06:00～23:00営業。パスポート、国際運転免許証の原本、台湾の免許証、カードを提示し、契約書とカード利用同意書に署名します。補償：基本保険は物損最大2,000万ウォン、人身傷害最大1,500万ウォン。LOTTEは国際顧客および済州の韓国ブランド車・輸入車に自己負担額ゼロのCDWを案内しています。済州Auto Houseの完全免責ページはタイヤ・ホイールの損傷を含みますが、別の公式ページは休業補償料の免除を、自己負担額ゼロのCDWに加入した韓国ブランド車（Hyundai Solatiを除く）に限定しています。一般FAQには車内損傷などの除外項目もあるため、車種別の契約書を確認してください。受取：傷を撮影して点検票に記録し、燃料の量と種類、Naver MapまたはKakao Map、チャイルドシートを確認。返却：受取時と同じ燃料量にし、返却エリアで点検後、空港行き送迎車へ。LOTTEは受取24時間前までの取消を全額返金し、それ以降は3,000ウォンを差し引きます。交通違反金は後日カード請求される場合があります。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">済州島レンタカー6段階：台湾発行の国際運転免許証（2026年9月確認）</text>
  <text x="60" y="90" font-size="19" fill="#5C6B6B">出典：LOTTEレンタカー・済州空港・韓国道路交通公団</text>

  <!-- step 1 行前 -->
  <rect x="60" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="60" y="120" width="470" height="70" rx="20" fill="#2F6F9F"/>
  <text x="295" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1  出発前</text>
  <text x="295" y="178" font-size="16" fill="#E6F0F7" text-anchor="middle">出発前の準備</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="226">● 台湾の監理所で国際運転免許証の原本を取得</text>
    <text x="84" y="262">● 予約時に国際運転免許証番号を入力</text>
    <text x="84" y="298">● LOTTEの最低年齢は21歳</text>
    <text x="84" y="334">● 車両損害免責（CDW）付きプランを選ぶ</text>
    <text x="84" y="370">● 台湾の免許証・パスポート・カードも持参</text>
  </g>
  <rect x="84" y="384" width="180" height="26" rx="8" fill="#2E7D5B"/><text x="174" y="403" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2022年の相互承認</text>

  <!-- step 2 濟州機場 -->
  <rect x="565" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#6E7A7A" stroke-width="5"/>
  <rect x="565" y="120" width="470" height="70" rx="20" fill="#6E7A7A"/>
  <text x="800" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2  済州空港</text>
  <text x="800" y="178" font-size="16" fill="#EEF1F1" text-anchor="middle">済州空港で</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="226">● 1階2番ゲート横：LOTTE窓口へ</text>
    <text x="589" y="262">● 3・5番ゲート→道路を渡る→屋根付き通路</text>
    <text x="589" y="298">● 5番ゲート外の送迎：Zone 1・4番</text>
    <text x="589" y="334">● 送迎06:00～22:40、7～15分間隔</text>
    <text x="589" y="370">● 07:30～19:30は7分間隔</text>
  </g>

  <!-- step 3 租車村 -->
  <rect x="1070" y="120" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="1070" y="120" width="470" height="70" rx="20" fill="#0D6B68"/>
  <text x="1305" y="152" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3  レンタカー営業所</text>
  <text x="1305" y="178" font-size="16" fill="#E3F0EF" text-anchor="middle">レンタカー営業所で</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="226">● LOTTE Auto House 06:00～23:00</text>
    <text x="1094" y="262">● パスポート・国際免許証原本・</text>
    <text x="1112" y="288">台湾の免許証・カードを提示</text>
    <text x="1094" y="324">● 契約書とカード利用同意書に署名</text>
    <text x="1094" y="360">● 済州市龍海路92</text>
  </g>

  <!-- step 4 保險 -->
  <rect x="60" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="60" y="480" width="470" height="70" rx="20" fill="#D97A2B"/>
  <text x="295" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4  補償</text>
  <text x="295" y="538" font-size="16" fill="#FBEFE4" text-anchor="middle">補償 · CDW</text>
  <g font-size="17" fill="#102A2B">
    <text x="84" y="586">● 基本：物損2,000万／人身1,500万ウォン</text>
    <text x="84" y="622">● 車両損害免責（자차 CDW）：</text>
    <text x="102" y="648">LOTTEの国際顧客は自己負担額ゼロ</text>
    <text x="84" y="684">● 済州完全免責はタイヤ・ホイール込み</text>
    <text x="84" y="720">● 休業料免除：ゼロ免責CDW加入の</text>
    <text x="84" y="756">韓国ブランド車のみ（Solati除外・契約確認）</text>
  </g>

  <!-- step 5 取車驗車 -->
  <rect x="565" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="565" y="480" width="470" height="70" rx="20" fill="#2E7D5B"/>
  <text x="800" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5  車両点検</text>
  <text x="800" y="538" font-size="16" fill="#E7F2EC" text-anchor="middle">車両の受取</text>
  <g font-size="17" fill="#102A2B">
    <text x="589" y="586">● 傷を撮影し、点検票に記録</text>
    <text x="589" y="622">● 燃料を確認：ガソリン／軽油</text>
    <text x="589" y="658">● Naver MapかKakao Mapでナビ</text>
    <text x="589" y="694">● 子ども用シート・運転者登録を確認</text>
    <text x="589" y="730">● 右側通行。標識と速度取締りに注意</text>
  </g>

  <!-- step 6 還車 -->
  <rect x="1070" y="480" width="470" height="300" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <rect x="1070" y="480" width="470" height="70" rx="20" fill="#B8442D"/>
  <text x="1305" y="512" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">6  返却</text>
  <text x="1305" y="538" font-size="16" fill="#FBE9E4" text-anchor="middle">車両の返却</text>
  <g font-size="17" fill="#102A2B">
    <text x="1094" y="586">● 受取時と同じ燃料量に。レシート保管</text>
    <text x="1094" y="622">● 返却エリア→点検→空港行き送迎車</text>
    <text x="1094" y="658">● 24時間前まで全額返金、以降3,000ウォン</text>
    <text x="1094" y="694">● 違反金と事務手数料は後日カード請求も</text>
    <text x="1094" y="730">● 国際線の約3時間前に営業所へ</text>
  </g>

  <!-- arrows -->
  <path d="M 532 270 L 560 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 270 L 1065 270" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1305 422 L 1305 450 L 295 450 L 295 476" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 532 630 L 560 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1037 630 L 1065 630" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="60" y="820" font-size="16" fill="#5C6B6B">台湾発行の国際運転免許証は2022年の二者間覚書により承認。原本、台湾の免許証とパスポートを携行し、入国日から1年間が利用資格の目安です。</text>
  <text x="60" y="850" font-size="16" fill="#5C6B6B">数字は2026年9月にLOTTEと済州空港で確認。SKや地元会社の送迎・補償条件は各社の公式案内を確認してください。</text>
  <text x="1380" y="884" font-size="15" fill="#8A8F8F">© Mokaair 作図 2026</text>
</svg>
