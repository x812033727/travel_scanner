<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">Chrome 分頁分享界線</title><desc id="desc">目前分頁：確認正在分享哪頁；新增分頁：從清單選所需來源；停止分享：再核對面板狀態</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">Chrome 分頁分享界線</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#176A66" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#176A66" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">目前分頁</text><text x="245" y="333" font-size="76" fill="#176A66">確認正在分享哪頁</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#176A66" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#176A66" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">新增分頁</text><text x="245" y="558" font-size="76" fill="#176A66">從清單選所需來源</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#176A66" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#176A66" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">停止分享</text><text x="245" y="783" font-size="76" fill="#176A66">再核對面板狀態</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>