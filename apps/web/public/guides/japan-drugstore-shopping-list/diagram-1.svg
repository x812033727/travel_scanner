<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">免稅新制下的藥妝購物四步驟：挑店、結帳、機場自助機台、退款 / Drugstore shopping under Japan's refund-type tax-free system</title>
  <desc id="desc">四個步驟，2026 年 11 月 1 日起適用。一、挑店：門口有 Tax-Free 標誌才能辦；第1類藥例如 ロキソニンS 要到藥師櫃檯，架上只有空盒；含指定六種成分的感冒藥、止咳藥一人一盒、多買要說明理由，2026 年 5 月 1 日起；同一家店同一天未稅 5,000 日圓以上。二、結帳：出示護照正本，影本與照片不收；付含稅價並登記退款方式；消耗品不再密封包裝，但在日本拆用就退不到錢；收據與商品一起保管到出境。三、機場自助機台：託運行李之前辦，商品帶在身上；掃護照或用 Visit Japan Web；綠燈通過，紅燈到海關櫃檯受檢；購買日起 90 天內完成。四、退款與回台灣：店家或退款業者退還消費稅相當額；退款方式依店家，信用卡、匯款或機場現金；回台灣非處方藥每種 12 盒、合計 36 盒；口罩 250 片、日拋隱形眼鏡每種度數 60 片。註記：2026 年 10 月 31 日前為舊制，出示護照直接以免稅價結帳，消耗品密封包裝、上限 50 萬日圓；處方藥無處方箋 2 個月量、有處方箋最多 6 個月量，管制藥品須處方箋且不能郵寄。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">免稅新制下的藥妝購物四步驟（2026 年 11 月 1 日起）</text>
  <text x="60" y="98" font-size="18" fill="#5C6B6B">Drugstore shopping under the refund-type tax-free system · 2026 年 9 月依觀光廳、厚生勞動省、台灣食藥署查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="140" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#0D6B68"/>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　挑店</text>
  <text x="230" y="208" font-size="16" fill="#E3F0EF" text-anchor="middle">店選び (Choose the store)</text>
  <g font-size="17" fill="#102A2B">
    <text x="88" y="270">● 門口有 Tax-Free 標誌才能辦</text>
    <text x="88" y="314">● 第1類藥（例：ロキソニンS）</text>
    <text x="106" y="340">要到藥師櫃檯，架上只有空盒</text>
    <text x="88" y="384">● 含指定六成分的感冒藥、止咳藥</text>
    <text x="106" y="410">一人一盒，多買要說明理由</text>
    <text x="106" y="436">（2026 年 5 月 1 日起）</text>
    <text x="88" y="480">● 同店同日未稅 5,000 日圓以上</text>
  </g>
  <rect x="80" y="596" width="300" height="80" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <text x="230" y="628" font-size="16" font-weight="700" fill="#0B4F4D" text-anchor="middle">第2、3類自己拿去結帳</text>
  <text x="230" y="654" font-size="15" fill="#0B4F4D" text-anchor="middle">登錄販售者也能賣</text>

  <!-- step 2 -->
  <rect x="440" y="140" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　結帳</text>
  <text x="610" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">レジ (Checkout)</text>
  <g font-size="17" fill="#102A2B">
    <text x="468" y="270">● 出示護照正本</text>
    <text x="486" y="296">（影本、照片不收）</text>
    <text x="468" y="340">● 付含稅價，登記退款方式</text>
    <text x="468" y="384">● 消耗品不再密封包裝，</text>
    <text x="486" y="410">但在日本拆用就退不到錢</text>
    <text x="468" y="454">● 收據與商品一起保管到出境</text>
  </g>
  <rect x="460" y="596" width="300" height="80" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="610" y="628" font-size="16" font-weight="700" fill="#1F4E73" text-anchor="middle">想在日本先用的另外買</text>
  <text x="610" y="654" font-size="15" fill="#1F4E73" text-anchor="middle">用含稅價、不辦免稅</text>

  <!-- step 3 -->
  <rect x="820" y="140" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　機場自助機台</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">空港で税関確認 (Customs check)</text>
  <g font-size="17" fill="#102A2B">
    <text x="848" y="270">● 託運行李之前辦，商品帶在身上</text>
    <text x="848" y="314">● 掃護照，或用 Visit Japan Web</text>
    <text x="848" y="358">● 綠燈通過，紅燈到海關櫃檯受檢</text>
    <text x="848" y="402">● 購買日起 90 天內完成</text>
  </g>
  <g fill="none" stroke="#2E7D5B" stroke-width="5" stroke-linecap="round">
    <rect x="940" y="450" width="100" height="120" rx="10"/>
    <path d="M 960 500 L 985 525 L 1025 475"/>
  </g>
  <rect x="840" y="596" width="300" height="80" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="3"/>
  <text x="990" y="628" font-size="16" font-weight="700" fill="#1F5C42" text-anchor="middle">改制初期機台會排隊</text>
  <text x="990" y="654" font-size="15" fill="#1F5C42" text-anchor="middle">比平常提早 30 分鐘到機場</text>

  <!-- step 4 -->
  <rect x="1200" y="140" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　退款、回台灣</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">返金 (Refund) · 台灣海關</text>
  <g font-size="17" fill="#102A2B">
    <text x="1228" y="270">● 店家或退款業者退消費稅相當額</text>
    <text x="1228" y="314">● 退款方式依店家：</text>
    <text x="1246" y="340">信用卡、匯款、機場現金</text>
    <text x="1228" y="384">● 回台灣：非處方藥每種 12 盒、</text>
    <text x="1246" y="410">合計 36 盒（自用）</text>
    <text x="1228" y="454">● 口罩 250 片、日拋隱形眼鏡</text>
    <text x="1246" y="480">每種度數 60 片</text>
  </g>
  <rect x="1220" y="596" width="300" height="80" rx="14" fill="#FBEFE4" stroke="#D97A2B" stroke-width="3"/>
  <text x="1370" y="628" font-size="16" font-weight="700" fill="#8A4A14" text-anchor="middle">超過限量要先申請</text>
  <text x="1370" y="654" font-size="15" fill="#8A4A14" text-anchor="middle">食藥署專案進口許可</text>

  <!-- arrows -->
  <path d="M 402 420 L 436 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 420 L 816 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 420 L 1196 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="760" font-size="18" fill="#5C6B6B">2026 年 10 月 31 日前為舊制：出示護照直接以免稅價結帳，消耗品密封包裝、上限 50 萬日圓，日本境內不能拆用。</text>
  <text x="60" y="792" font-size="18" fill="#5C6B6B">處方藥：無處方箋 2 個月量、有處方箋最多 6 個月量；管制藥品須處方箋且不能郵寄。中藥材每種 1 公斤、最多 12 種。</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
