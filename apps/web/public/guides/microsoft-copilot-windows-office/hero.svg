<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一個助理，四個落點 / One assistant, four places</title>
<desc id="desc">自繪幾何插圖。畫面中央是一個白底深色外框的對話框，裡面有三條文字橫線和一顆橘色的四角星，代表 AI 助理。對話框以四條虛線連向四個方向：左上是藍色外框的電腦螢幕與底座，右上是橘色外框的晶片，四邊各有三根接腳，代表裝置上的運算；左下是墨綠色外框的手機，畫面裡有一個小對話框；右下是綠色外框的方框，裡面是左右兩個角括號，代表程式編輯器。畫面下方有一行字：一個名字，四種工具。全圖只用圓、圓角矩形與線條，沒有任何產品標誌、介面截圖或人物。</desc>
