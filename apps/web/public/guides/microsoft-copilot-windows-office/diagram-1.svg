<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">Copilot 家族地圖 / Map of the Microsoft Copilot family</title>
<desc id="desc">一張分成四格的對照圖。左上是免費 Copilot：可在網頁、Windows 與 Mac、iOS 與 Android 與 Edge 使用，網址 copilot.microsoft.com，免費且官方寫登入不是必要的，能聊天、寫作、摘要、依網頁搜尋回答與生成影像。右上是 Microsoft 365 裡的 Copilot：在 Word、Excel、PowerPoint、Outlook 桌面版使用，個人版 NT$309 一個月起且 AI 只有訂閱擁有者能用，商務版 Copilot Business 為 NT$675 使用者每月年付，Microsoft 365 基本版不提供 AI 功能。左下是 Copilot+ PC：符合條件的 Windows 11 電腦在裝置上執行，硬體門檻為 40+ TOPS NPU、16 GB 記憶體與 256 GB 儲存空間，代表功能是回顧預覽版、即時字幕翻譯與小畫家 Cocreator，不需要訂閱。右下是 GitHub Copilot：在程式編輯器裡寫程式，屬於獨立產品與訂閱，不含在 Microsoft 365 裡，本篇只點名。圖的下方一條橫幅說明：同一個應用程式，登入的帳號決定你拿到哪一種，個人 Microsoft 帳戶是個人體驗，公司或學校帳戶也就是 Microsoft Entra ID 才有企業資料保護。</desc>
