<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一個問題，兩條回答路線 / One question, two routes to an answer</title>
  <desc id="desc">抽象插圖。左邊是一個白底的對話框，代表你送出的問題。從對話框出發有兩條路線：上面一條是筆直的綠色線，直接抵達一張綠框的答案卡，代表一般對話直接給答案；下面一條是青綠色的折線，先經過三個圓點再抵達一張淺綠底的答案卡，三個圓點代表深度思考先跑出來的推理步驟。畫面下方有一行字「開不開深度思考」。整張圖不含任何產品標誌、介面或人物。</desc>
  <defs>
    <marker id="tipA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/>
    </marker>
    <marker id="tipB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- the question, drawn as a speech bubble -->
  <path d="M 205 462 L 268 462 L 198 578 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="9" stroke-linejoin="round"/>
  <rect x="110" y="290" width="340" height="215" rx="46" fill="#FFFFFF" stroke="#102A2B" stroke-width="9"/>
  <rect x="163" y="352" width="234" height="20" rx="10" fill="#102A2B" opacity="0.32"/>
  <rect x="163" y="404" width="186" height="20" rx="10" fill="#102A2B" opacity="0.32"/>
  <rect x="163" y="456" width="120" height="20" rx="10" fill="#D97A2B"/>

  <!-- route A: straight to the answer -->
  <path d="M 478 362 C 660 292 840 258 1062 250" fill="none" stroke="#2E7D5B" stroke-width="11" stroke-linecap="round" marker-end="url(#tipA)"/>

  <!-- route B: through three thinking steps -->
  <path d="M 478 452 L 616 528 L 778 600 L 934 638 L 1062 646" fill="none" stroke="#0D6B68" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tipB)"/>
  <circle cx="616" cy="528" r="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="778" cy="600" r="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="934" cy="638" r="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>

  <!-- answer card A -->
  <rect x="1092" y="172" width="404" height="158" rx="30" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="9"/>
  <rect x="1136" y="216" width="316" height="18" rx="9" fill="#2E7D5B" opacity="0.45"/>
  <rect x="1136" y="254" width="264" height="18" rx="9" fill="#2E7D5B" opacity="0.45"/>
  <rect x="1136" y="292" width="180" height="18" rx="9" fill="#2E7D5B" opacity="0.45"/>

  <!-- answer card B -->
  <rect x="1092" y="568" width="404" height="158" rx="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9"/>
  <rect x="1136" y="612" width="316" height="18" rx="9" fill="#0D6B68" opacity="0.5"/>
  <rect x="1136" y="650" width="264" height="18" rx="9" fill="#0D6B68" opacity="0.5"/>
  <rect x="1136" y="688" width="180" height="18" rx="9" fill="#0D6B68" opacity="0.5"/>

  <text x="800" y="836" text-anchor="middle" font-size="58" font-weight="700" fill="#102A2B">開不開深度思考</text>
</svg>
