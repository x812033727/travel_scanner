<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">有終點的一段，與沒有終點的一段</title>
<desc id="desc">畫面左右各有一組同樣大小的圖形。兩邊上方都是一個白底的盾牌外框，左邊的盾牌是綠色邊，右邊的是藍色邊，盾面上沒有任何文字或標誌。盾牌下方各有一條同樣粗細的水平線段：左邊那條的兩端各有一道豎線把它封起來，是一段有起點也有終點的期間；右邊那條只有左端有豎線封口，往右走到一半改成等寬的虛線繼續延伸出去，沒有收尾。兩條線段的下方各有一個同樣大小的白色圓角方框，左邊的方框是空的，右邊的方框底部有一條填滿的橫帶，代表逐年累積起來的部分。整張圖沒有文字、沒有任何金融機構的標誌、沒有人臉，也沒有任何上升的曲線或高低不一的長條。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
