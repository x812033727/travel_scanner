<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同樣的風險成本，兩種收法 / Natural premium and level premium: where the cost sits</title>
<desc id="desc">左右兩欄的結構對照。左欄標題是自然保費制、多見於定期險，右欄標題是平準保費制、多見於終身險。兩欄由上往下各有四格。第一格講保費怎麼算：左欄是每一段保險期間依當年年齡計算，保險費率隨年齡逐年升高；右欄是把繳費年期內的成本攤平，固定金額持續到繳費期滿。第二格標著前期：左欄的繳的保費大致對應當年的危險費率，每一段期間各自計算，不預收後面的成本；右欄的繳的保費高於當時年齡所應收，超出的部分累積為保單價值準備金。第三格標著後期：左欄的費率隨年齡調高，繳的金額跟著上去，成本留在當年，沒有前期累積可以補；右欄的繳的保費低於當年風險成本，由前期累積的部分補上。第四格講期滿之後：左欄是保險期間屆滿，續保須經雙方議定，一年期通常沒有可累積的部分；右欄是繳費期滿，保障不因此結束，終止契約時依條款償付解約金。圖的最下方橫貫一條色帶，寫著保費差額不是多繳的浪費，也不是多賺的報酬：它被放進保單價值準備金，解約時依條款結算。整張圖沒有任何折線、柱狀或績效走勢，只有並排的文字色塊。</desc>
