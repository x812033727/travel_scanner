<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">濟州黑豬肉菜單解碼圖 / How to read a Jeju heukdwaeji menu</title>
  <desc id="desc">左欄是菜單上六個常見的韓文詞：흑돼지（黑豬肉）是濟州本地的豬品種，不是部位；근고기（斤肉）是按重量賣、不分部位的厚切肉；오겹살／삼겹살統稱五花肉，官方介紹強調油脂與香氣；목살（梅花肉）比五花瘦一點；항정살（松阪肉）是和목살、오겹살分開算的另一個部位；갈비（排骨）瘦肉肥肉比例居中。右欄是黑豬肉從烤盤到入口的四個階段：先用활화（活火）、연탄（煤球）或숯불（炭火）烤，官方頁提到活火燒烤；有的店由店員代烤，官方頁寫明店員會從頭烤到尾；桌上那一小鍋멜젓（鯷魚醬）是放在烤盤上一起煮滾；最後夾肉沾멜젓吃，是濟州傳統吃法。右側另外一個獨立方框標示，고사리（蕨菜）、전복（鮑魚）、새우（蝦子）這類食材，有的店會放進同一個烤盤一起烤。部位用語與吃法整理自 Visit Jeju 濟州觀光公社的黑豬肉主題頁與濟州島傳統美食頁，逐店依據見正文表格。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">菜單上的한글是什麼，黑豬肉從烤盤到入口的幾個關卡</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Jeju heukdwaeji: menu labels and the grill-to-mouth steps</text>

  <!-- left column header -->
  <rect x="40" y="104" width="740" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="132" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">菜單上的字 On the menu</text>
  <text x="410" y="156" font-size="15" fill="#0B4F4D" text-anchor="middle">品種、部位還是重量，六個詞先認熟</text>

  <!-- right column header -->
  <rect x="820" y="104" width="740" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1190" y="132" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">從烤盤到入口 From the grill to your mouth</text>
  <text x="1190" y="156" font-size="15" fill="#1F4E73" text-anchor="middle">一份黑豬肉端上桌前的幾個步驟</text>

  <!-- left column: 6 menu boxes -->
  <rect x="40" y="184" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="224" font-size="23" font-weight="700" fill="#102A2B">흑돼지　黑豬肉</text>
  <text x="70" y="256" font-size="16" fill="#5C6B6B">濟州本地的豬品種，不是部位</text>

  <rect x="40" y="290" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="330" font-size="23" font-weight="700" fill="#102A2B">근고기　斤肉</text>
  <text x="70" y="362" font-size="16" fill="#5C6B6B">按重量賣，不分部位</text>

  <rect x="40" y="396" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="436" font-size="23" font-weight="700" fill="#102A2B">오겹살／삼겹살　五花肉</text>
  <text x="70" y="468" font-size="16" fill="#5C6B6B">官方介紹強調油脂與香氣</text>

  <rect x="40" y="502" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="542" font-size="23" font-weight="700" fill="#102A2B">목살　梅花肉</text>
  <text x="70" y="574" font-size="16" fill="#5C6B6B">比五花瘦一點</text>

  <rect x="40" y="608" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="648" font-size="23" font-weight="700" fill="#102A2B">항정살　松阪肉</text>
  <text x="70" y="680" font-size="16" fill="#5C6B6B">和목살、오겹살分開算的部位</text>

  <rect x="40" y="714" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="754" font-size="23" font-weight="700" fill="#102A2B">갈비　排骨</text>
  <text x="70" y="786" font-size="16" fill="#5C6B6B">瘦肉肥肉比例居中</text>

  <!-- right column: grill-to-mouth chain, 4 steps -->
  <rect x="820" y="184" width="460" height="122" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="236" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">활화·연탄·숯불　活火・煤球・炭火</text>
  <text x="1050" y="270" font-size="16" fill="#5C6B6B" text-anchor="middle">官方頁提到活火燒烤</text>

  <path d="M 1050 306 L 1050 342" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="342" width="460" height="122" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="394" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">직원이 구워준다（有的店）</text>
  <text x="1050" y="428" font-size="16" fill="#5C6B6B" text-anchor="middle">官方頁寫店員從頭烤到尾</text>

  <path d="M 1050 464 L 1050 500" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="500" width="460" height="122" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="552" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">멜젓　鯷魚醬</text>
  <text x="1050" y="586" font-size="16" fill="#5C6B6B" text-anchor="middle">在烤盤上一起煮滾</text>

  <path d="M 1050 622 L 1050 658" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="658" width="460" height="122" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="710" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">찍어 먹는다　夾著蘸醬吃</text>
  <text x="1050" y="744" font-size="16" fill="#5C6B6B" text-anchor="middle">濟州傳統吃法</text>

  <!-- side box: seafood/ferns grilled alongside, independent of the chain -->
  <rect x="1300" y="184" width="260" height="596" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="1430" y="250" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">고사리・전복・새우</text>
  <text x="1430" y="284" font-size="16" fill="#8A4A14" text-anchor="middle">蕨菜・鮑魚・蝦子</text>
  <text x="1430" y="332" font-size="16" fill="#8A4A14" text-anchor="middle">有的店會放進</text>
  <text x="1430" y="358" font-size="16" fill="#8A4A14" text-anchor="middle">同一個烤盤一起烤</text>

  <!-- footer -->
  <text x="60" y="840" font-size="16" fill="#102A2B">部位用語與吃法整理自 Visit Jeju 濟州觀光公社的黑豬肉主題頁與濟州島傳統美食頁，逐店依據見正文表格。</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
