<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">線上結匯的兩條路：現鈔與外幣帳戶 / Two paths of an online forex settlement in Taiwan</title>
  <desc id="desc">圖分成上下兩排。上排是換成外幣現鈔的路線，四個步驟依序是：在銀行 App 選幣別與金額並指定換成現鈔、適用牌告的現金賣出價、到指定分行或預約機場分行取件、回國後以現金買入價回換，硬幣多半不收。下排是存入外幣存款帳戶的路線，四個步驟依序是：在銀行 App 選幣別與金額並指定存入外幣帳戶、適用牌告的即期賣出價、不必取件錢留在帳戶、之後以即期買入價換回新臺幣，價差通常比現金窄。圖的下方有兩個提醒：換匯的成本是價差，出國前買進一次、回國賣回再一次，手續費是不是零跟這段成本無關；以及單筆達新臺幣五十萬元等值外匯時，應填申報書並經由銀行業向中央銀行申報。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">線上結匯的兩條路：下單、匯率、取件、回換</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Online forex settlement: order, rate, pickup and buy-back</text>

  <text x="60" y="152" font-size="20" font-weight="bold" fill="#0D6B68">路線一　換成外幣現鈔，適用現金匯率</text>

  <rect x="60" y="172" width="330" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="225" y="222" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">第一步　下單</text>
  <text x="225" y="262" font-size="17" fill="#102A2B" text-anchor="middle">在 App 選幣別與金額</text>
  <text x="225" y="302" font-size="17" fill="#102A2B" text-anchor="middle">指定換成外幣現鈔</text>

  <rect x="430" y="172" width="330" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="595" y="222" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">第二步　適用價格</text>
  <text x="595" y="262" font-size="17" fill="#102A2B" text-anchor="middle">牌告的「現金賣出」</text>
  <text x="595" y="302" font-size="17" fill="#5C6B6B" text-anchor="middle">押運與保管成本較高</text>

  <rect x="800" y="172" width="330" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="965" y="222" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">第三步　取件</text>
  <text x="965" y="262" font-size="17" fill="#102A2B" text-anchor="middle">到指定分行領現鈔</text>
  <text x="965" y="302" font-size="17" fill="#102A2B" text-anchor="middle">或預約機場分行取件</text>

  <rect x="1170" y="172" width="370" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1355" y="222" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">第四步　回國回換</text>
  <text x="1355" y="262" font-size="17" fill="#102A2B" text-anchor="middle">牌告的「現金買入」</text>
  <text x="1355" y="302" font-size="17" fill="#5C6B6B" text-anchor="middle">硬幣多半不收</text>

  <line x1="394" y1="257" x2="420" y2="257" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="764" y1="257" x2="790" y2="257" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1134" y1="257" x2="1160" y2="257" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <text x="60" y="412" font-size="20" font-weight="bold" fill="#2F6F9F">路線二　存入外幣存款帳戶，適用即期匯率</text>

  <rect x="60" y="432" width="330" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="225" y="482" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">第一步　下單</text>
  <text x="225" y="522" font-size="17" fill="#102A2B" text-anchor="middle">在 App 選幣別與金額</text>
  <text x="225" y="562" font-size="17" fill="#102A2B" text-anchor="middle">指定存入外幣帳戶</text>

  <rect x="430" y="432" width="330" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="595" y="482" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">第二步　適用價格</text>
  <text x="595" y="522" font-size="17" fill="#102A2B" text-anchor="middle">牌告的「即期賣出」</text>
  <text x="595" y="562" font-size="17" fill="#5C6B6B" text-anchor="middle">帳戶之間的記帳</text>

  <rect x="800" y="432" width="330" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="965" y="482" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">第三步　不必取件</text>
  <text x="965" y="522" font-size="17" fill="#102A2B" text-anchor="middle">錢留在外幣存款帳戶</text>
  <text x="965" y="562" font-size="17" fill="#102A2B" text-anchor="middle">之後匯出或再換回</text>

  <rect x="1170" y="432" width="370" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1355" y="482" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">第四步　換回新臺幣</text>
  <text x="1355" y="522" font-size="17" fill="#102A2B" text-anchor="middle">牌告的「即期買入」</text>
  <text x="1355" y="562" font-size="17" fill="#5C6B6B" text-anchor="middle">價差通常比現金窄</text>

  <line x1="394" y1="517" x2="420" y2="517" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="764" y1="517" x2="790" y2="517" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1134" y1="517" x2="1160" y2="517" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="60" y="655" width="720" height="145" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="420" y="701" font-size="20" font-weight="bold" fill="#B8442D" text-anchor="middle">一來一回付兩次價差</text>
  <text x="420" y="739" font-size="17" fill="#102A2B" text-anchor="middle">出國前買進外幣一次，回國賣回新臺幣再一次；</text>
  <text x="420" y="773" font-size="17" fill="#102A2B" text-anchor="middle">手續費是不是零，跟這一段成本沒有關係</text>

  <rect x="820" y="655" width="720" height="145" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="701" font-size="20" font-weight="bold" fill="#0D6B68" text-anchor="middle">新臺幣 50 萬元的申報線</text>
  <text x="1180" y="739" font-size="17" fill="#102A2B" text-anchor="middle">單筆達新臺幣 50 萬元等值外匯，應填申報書，</text>
  <text x="1180" y="773" font-size="17" fill="#102A2B" text-anchor="middle">經由銀行業向中央銀行申報</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
