<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">線上結匯的兩種去向 / Two destinations of an online forex settlement</title>
  <desc id="desc">插圖。左側是一支圓角長方形的手機，畫面上有一條深綠色的頁首色塊與兩個同樣大小的圓角列，下方有一個圓形按鈕。手機右側有一個圓形節點，從節點分出兩條同樣粗細的曲線：上面一條通往一張抽象的長方形紙鈔，紙鈔中央是一個圓形，紙鈔右邊有一個行李箱輪廓；下面一條通往一本圓角存摺，存摺左側有書脊線，內頁有三條等長的橫線。畫面下方有一行字「線上結匯，兩條路」。整張圖只用簡單幾何形狀，沒有任何機構標誌、真實鈔券圖樣或走勢曲線。</desc>
