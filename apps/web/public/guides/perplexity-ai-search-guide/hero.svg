<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">附引用的 AI 搜尋 / An AI search answer that carries its sources</title>
<desc id="desc">插圖：左邊是一個圓角搜尋框，裡面有一個放大鏡與兩條代表輸入文字的橫條；一個箭頭指向中間三張顏色不同的文件卡片，藍、綠、橘各一張，代表搜尋到的來源網頁；另一個箭頭指向右邊的答案面板，面板裡有數條代表文字的橫條，旁邊排著藍、綠、橘三個小圓點，顏色對應左邊那三張來源卡片，表示答案的每一段都連回它引用的來源。下方有一行字：答案附上出處。</desc>
