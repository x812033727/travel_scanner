<text x="390" y="161" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">第一步　排大綱</text>
<line x1="544" y1="153" x2="563" y2="153" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="572" y="124" width="300" height="58" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
<text x="722" y="161" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">第二步　補數字</text>
