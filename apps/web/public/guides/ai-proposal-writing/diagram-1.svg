<rect x="904" y="124" width="300" height="58" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
<text x="1054" y="161" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">第三步　找反方</text>
<line x1="1208" y1="153" x2="1227" y2="153" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1236" y="124" width="300" height="58" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
<text x="1386" y="161" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">第四步　寫摘要</text>
