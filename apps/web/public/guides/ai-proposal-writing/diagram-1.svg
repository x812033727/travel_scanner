<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">用 AI 寫企劃書的分工 / Who does what when writing a proposal with AI</title>
<desc id="desc">用 AI 寫企劃書的分工泳道圖。由左到右是四個步驟，由上到下是 AI 做、人確認、留紀錄三列。第一步排大綱：AI 依骨架排出大綱、缺資料處標成待補；人補上背景與限制、目標值由人來訂；紀錄是草稿版本，檔名寫日期與狀態。第二步補數字：AI 列出需要數字的位置、提供可能的出處線索；人親自打開原始資料、核對期間與單位；紀錄是數字清單，記出處、期間、單位與取得日。第三步找反方：AI 扮演審查者逐段提出反對意見；人判斷哪些意見成立，成立的寫進風險段；紀錄是決策紀錄，不採納的也寫理由。第四步寫摘要：AI 只用全文內容壓縮成一頁摘要；人把摘要的每個數字逐一回全文比對；紀錄是命名版本，附修正內容對照表。每一欄都由 AI 往下經過人工確認，才寫進紀錄。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/></marker></defs>
