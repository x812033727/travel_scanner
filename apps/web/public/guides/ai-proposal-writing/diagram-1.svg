<text x="48" y="84" font-size="18" fill="#5C6B6B">Writing a proposal with AI: who does what, and what gets recorded</text>
<text x="130" y="160" font-size="17" fill="#5C6B6B" text-anchor="middle">分工 ＼ 步驟</text>
