<text x="1386" y="468" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">摘要的每個數字</text>
<text x="1386" y="506" font-size="17" fill="#102A2B" text-anchor="middle">逐一回全文比對</text>
