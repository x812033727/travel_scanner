<rect x="572" y="594" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="722" y="658" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">數字清單</text>
<text x="722" y="696" font-size="17" fill="#102A2B" text-anchor="middle">出處、期間、單位、取得日</text>
<rect x="904" y="594" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1054" y="658" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">決策紀錄</text>
