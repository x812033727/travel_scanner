<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">企劃書的數字回到原始資料 / Every figure in a proposal traced to its source</title>
<desc id="desc">米色底的插圖。中間是一份三層疊起的企劃書，後面兩層露出橘色與藍色的版本標籤，最前面一層有深綠色頁首與四組文字行，其中一行是橘色的數字標記；一條橘色虛線從這個標記連到右邊藍框的資料表，連線中間是綠色打勾圓章，資料表裡對應的格子也是橘色。左上是一個藍框的對話框，裡面是一條藍色標題列與兩條縮排的條列，像一份大綱；左下是一張橘框的決策清單，三列都有綠色勾號。下方寫著企劃書的每個數字都有出處。</desc>
