<title id="title">兩個人的錢怎麼管：共同帳戶、分攤比例與定期對帳</title>
<desc id="desc">左右上方各有一個圓點代表兩個人的收入，各以一條粗線匯入中央的圓角容器，容器內並排放著兩個圓；同時各有一條較細的線往下通往左右兩個小方塊，方塊內各有一個圓，代表留在自己名下的部分。</desc>
