<text x="293" y="543" text-anchor="middle" font-size="19" fill="#102A2B">支出都從這裡出</text>
<text x="100" y="624" font-size="15" fill="#5C6B6B">最先鬆掉的是</text>
<text x="100" y="658" font-size="18" fill="#102A2B">自主：每一筆都被對方看到</text>
<text x="100" y="706" font-size="15" fill="#5C6B6B">要先講好的是</text>
<text x="100" y="740" font-size="18" fill="#102A2B">可以自由處分的金額</text>

