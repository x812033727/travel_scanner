<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="title">联盟营销：从内容到收款</title><desc id="desc">四张卡片呈现合作选择、内容披露、链接跟踪与核销收款，说明点击后佣金并不会立即确定。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">联盟营销：从内容到收款</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">合作条款、读者披露与交易核销都要衔接</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">合作选择</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">先看需求与条款</text>
<text x="108.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">逐项记录渠道费率</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">内容披露</text>
<text x="477.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">自己写有用的信息</text>
<text x="477.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">清楚说明合作关系</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">链接跟踪</text>
<text x="846.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">用官方工具核对编号</text>
<text x="846.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">分清期限与归因</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">核销收款</text>
<text x="1215.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">再次确认取消退货</text>
<text x="1215.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">分别核算佣金成本</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">点击、有效交易、确认佣金和实际到账，是四种不同的结果。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair原创制图</text>
</svg>
