<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<title id="title">제휴 마케팅: 콘텐츠에서 정산까지</title><desc id="desc">네 카드에 제휴 선택, 관계 고지, 링크 추적, 거래 확인과 입금을 담아 클릭만으로 수수료가 확정되지 않음을 설명합니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">제휴 마케팅: 콘텐츠에서 정산까지</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">제휴 조건, 독자 고지, 거래 확인을 끝까지 연결</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">제휴 선택</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">수요·약관 확인</text>
<text x="108.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">채널별 수수료 기록</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">관계 고지</text>
<text x="477.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">유용한 정보 직접 작성</text>
<text x="477.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">제휴 관계 명시</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">링크 추적</text>
<text x="846.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">공식 도구로 ID 확인</text>
<text x="846.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">기한·기여 구분</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">정산·입금</text>
<text x="1215.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">취소·반품 재확인</text>
<text x="1215.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">수수료·비용 별도 계산</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">클릭, 유효 거래, 확정 수수료, 실제 입금은 서로 다른 결과입니다.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도표</text>
</svg>
