<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title id="title">アフィリエイト：発信から入金まで</title><desc id="desc">四つのカードで提携先の選択、関係の開示、リンク追跡、成果と入金の確認を示し、クリックだけでは報酬が確定しないことを伝えます。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">アフィリエイト：発信から入金まで</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">提携条件、開示、成果の承認を一連の流れで確認</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">提携先の選択</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">需要と条件を確認</text>
<text x="108.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">媒体別の料率を記録</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">関係の開示</text>
<text x="477.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">役立つ情報を自作</text>
<text x="477.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">提携関係を明示</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">リンクの追跡</text>
<text x="846.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">公式ツールでID確認</text>
<text x="846.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">期限と帰属を区別</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">成果と入金</text>
<text x="1215.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">取消・返品を再確認</text>
<text x="1215.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">報酬と費用を別計算</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">クリック、有効な購入、確定報酬、実際の入金は別の結果です。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaairオリジナル図解</text>
</svg>
