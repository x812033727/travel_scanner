<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">Affiliate Marketing: Content to Payout</title><desc id="desc">Four cards cover partner choice, disclosure, link tracking and payout verification; a click does not confirm a commission.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="46" fill="#102A2B" text-anchor="start" font-weight="bold">Affiliate Marketing: Content to Payout</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Fit, disclosure, tracking and approved commissions all matter</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">Choose partners</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Check fit and terms</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Track channel fees</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">Disclose ties</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Write useful content</text>
<text x="477.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Make ties clear</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">Track links</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Check IDs in tools</text>
<text x="846.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Separate attribution</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">Verify payout</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Check returns first</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Count fees and costs</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Clicks, valid orders, approved commissions and cash received are different results.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair graphic</text>
</svg>
