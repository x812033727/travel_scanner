<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">三類行動支付的差別 / Mobile payments in Taiwan, grouped by where the money leaves</title>
  <desc id="desc">一張三欄五列的比較表，三欄依序是綁信用卡、綁帳戶扣款、先儲值再花。第一列「錢什麼時候離開你」：綁信用卡是付款時先成立帳款、帳單結算後才付出去，綁帳戶扣款是交易成立時就從帳戶扣走，先儲值再花是儲值當下就離開、之後花的是餘額。第二列「主要規範依據」：綁信用卡是信用卡業務機構管理辦法，另外兩類都是電子支付機構管理條例。第三列「款項靠什麼保障」：綁信用卡依信用卡契約處理帳款疑義；綁帳戶扣款的款項存入專用存款帳戶、業者原則上不得動用、使用者債權優先受償；先儲值再花靠準備金加信託或銀行十足履約保證，不是存款保險標的。第四列「扣款有爭議先找誰」：依序是發卡機構、電子支付機構或開戶行、發行的電子支付機構。第五列「手機遺失第一步」：依序是停用裝置上的卡片再向發卡機構掛失、停用帳戶並改密碼並檢查自動扣款設定、記名式才掛得了失而無記名拿不回餘額。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">按「錢從哪裡出」比較三類行動支付</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three kinds of mobile payment, compared by where the money leaves</text>
  <rect x="280" y="120" width="400" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="480" y="161" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">綁信用卡</text>
  <rect x="700" y="120" width="400" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="900" y="161" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">綁帳戶扣款</text>
  <rect x="1120" y="120" width="400" height="64" rx="14" fill="#F7E8D8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1320" y="161" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">先儲值再花</text>
  <text x="250" y="262" text-anchor="end" font-size="17" fill="#5C6B6B">錢什麼時候離開你</text>
  <rect x="280" y="200" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="480" y="250" text-anchor="middle" font-size="17" fill="#102A2B">付款時先成立帳款</text>
  <text x="480" y="274" text-anchor="middle" font-size="17" fill="#102A2B">帳單結算後才付出去</text>
  <rect x="700" y="200" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="900" y="250" text-anchor="middle" font-size="17" fill="#102A2B">交易成立時</text>
  <text x="900" y="274" text-anchor="middle" font-size="17" fill="#102A2B">就從帳戶扣走</text>
  <rect x="1120" y="200" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="1320" y="250" text-anchor="middle" font-size="17" fill="#102A2B">儲值當下就離開</text>
  <text x="1320" y="274" text-anchor="middle" font-size="17" fill="#102A2B">之後花的是餘額</text>
  <text x="250" y="388" text-anchor="end" font-size="17" fill="#5C6B6B">主要規範依據</text>
  <rect x="280" y="326" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="480" y="376" text-anchor="middle" font-size="17" fill="#102A2B">信用卡業務機構</text>
  <text x="480" y="400" text-anchor="middle" font-size="17" fill="#102A2B">管理辦法</text>
  <rect x="700" y="326" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="900" y="376" text-anchor="middle" font-size="17" fill="#102A2B">電子支付機構</text>
  <text x="900" y="400" text-anchor="middle" font-size="17" fill="#102A2B">管理條例</text>
  <rect x="1120" y="326" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="1320" y="376" text-anchor="middle" font-size="17" fill="#102A2B">電子支付機構</text>
  <text x="1320" y="400" text-anchor="middle" font-size="17" fill="#102A2B">管理條例</text>
  <text x="250" y="514" text-anchor="end" font-size="17" fill="#5C6B6B">款項靠什麼保障</text>
  <rect x="280" y="452" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="480" y="502" text-anchor="middle" font-size="17" fill="#102A2B">依信用卡契約</text>
  <text x="480" y="526" text-anchor="middle" font-size="17" fill="#102A2B">處理帳款疑義</text>
  <rect x="700" y="452" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="900" y="489" text-anchor="middle" font-size="17" fill="#102A2B">存入專用存款帳戶</text>
  <text x="900" y="514" text-anchor="middle" font-size="17" fill="#102A2B">業者原則上不得動用</text>
  <text x="900" y="539" text-anchor="middle" font-size="17" fill="#102A2B">使用者債權優先受償</text>
  <rect x="1120" y="452" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="1320" y="489" text-anchor="middle" font-size="17" fill="#102A2B">準備金加信託或</text>
  <text x="1320" y="514" text-anchor="middle" font-size="17" fill="#102A2B">銀行十足履約保證</text>
  <text x="1320" y="539" text-anchor="middle" font-size="17" fill="#102A2B">非存款保險標的</text>
  <text x="250" y="640" text-anchor="end" font-size="17" fill="#5C6B6B">扣款有爭議先找誰</text>
  <rect x="280" y="578" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="480" y="640" text-anchor="middle" font-size="17" fill="#102A2B">發卡機構</text>
  <rect x="700" y="578" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="900" y="628" text-anchor="middle" font-size="17" fill="#102A2B">電子支付機構</text>
  <text x="900" y="652" text-anchor="middle" font-size="17" fill="#102A2B">或開戶行</text>
  <rect x="1120" y="578" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="1320" y="628" text-anchor="middle" font-size="17" fill="#102A2B">發行的</text>
  <text x="1320" y="652" text-anchor="middle" font-size="17" fill="#102A2B">電子支付機構</text>
  <text x="250" y="766" text-anchor="end" font-size="17" fill="#5C6B6B">手機遺失第一步</text>
  <rect x="280" y="704" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="480" y="754" text-anchor="middle" font-size="17" fill="#102A2B">停用裝置上的卡片</text>
  <text x="480" y="778" text-anchor="middle" font-size="17" fill="#102A2B">再向發卡機構掛失</text>
  <rect x="700" y="704" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="900" y="754" text-anchor="middle" font-size="17" fill="#102A2B">停用帳戶並改密碼</text>
  <text x="900" y="778" text-anchor="middle" font-size="17" fill="#102A2B">檢查自動扣款設定</text>
  <rect x="1120" y="704" width="400" height="112" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="1320" y="754" text-anchor="middle" font-size="17" fill="#102A2B">記名式才掛得了失</text>
  <text x="1320" y="778" text-anchor="middle" font-size="17" fill="#102A2B">無記名拿不回餘額</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
