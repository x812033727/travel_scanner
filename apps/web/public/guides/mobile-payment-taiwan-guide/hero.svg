<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">台灣行動支付總整理：綁定方式、回饋與適用場景</title>
<desc id="desc">插圖。左側是一支直立的手機，螢幕上半是三道由小到大的感應波紋與一個圓點，下半是九個同樣大小的方格排成三乘三，像一張掃描用的圖形碼。手機右側伸出三條粗箭頭，分別指向右邊三個同樣寬度、上下排列的物件：最上面是一張卡片，卡面有一塊晶片與兩道橫條；中間是一本簿冊，左緣有一道深色書背，內頁畫著三條長短不一的橫線；最下面是一個方框，框裡的長條只填滿左半邊，代表還剩一半的儲值餘額。畫面下方一行短標題寫著錢從哪裡出。</desc>
