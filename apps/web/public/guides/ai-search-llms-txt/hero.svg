<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一個網站，三條路徑 / One site, three paths</title>
  <desc id="desc">抽象插圖。左邊是一個代表網站的白色圓角方塊，裡面並排兩張檔案卡片：一張實線邊框，代表已經部署的 robots.txt；一張虛線邊框，代表還是提案的 llms.txt。從網站右側伸出三條粗線，分別彎向右邊三個不同形狀的終點：一疊橫條代表訓練用的內容堆積、一個帶項目符號的清單方塊代表搜尋索引、一個對話框裡有一小段連結記號代表代使用者取用並附上出處。圖中央下方有一行字：三條路徑，三個名字。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- the site, holding one deployed file and one proposed file -->
  <rect x="120" y="300" width="320" height="300" rx="28" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
  <rect x="158" y="348" width="122" height="168" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <path d="M 182 392 H 256 M 182 424 H 256 M 182 456 H 232" stroke="#0D6B68" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="300" y="348" width="122" height="168" rx="12" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="16 12"/>
  <path d="M 324 392 H 398 M 324 424 H 398 M 324 456 H 374" stroke="#5C6B6B" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" fill="none"/>

  <!-- three paths out of the same site -->
  <path d="M 452 398 C 640 380, 760 246, 976 240" stroke="#D97A2B" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 452 450 C 660 450, 790 450, 976 450" stroke="#2F6F9F" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 452 502 C 640 520, 760 654, 976 660" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- a pile of collected pages -->
  <rect x="1000" y="170" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
  <rect x="1000" y="224" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
  <rect x="1000" y="278" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>

  <!-- an index -->
  <rect x="1000" y="386" width="300" height="130" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>
  <circle cx="1040" cy="420" r="9" fill="#2F6F9F"/>
  <circle cx="1040" cy="452" r="9" fill="#2F6F9F"/>
  <circle cx="1040" cy="484" r="9" fill="#2F6F9F"/>
  <path d="M 1070 420 H 1262 M 1070 452 H 1262 M 1070 484 H 1214" stroke="#2F6F9F" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- an answer that carries its source -->
  <rect x="1000" y="596" width="300" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>
  <path d="M 1040 726 L 1040 772 L 1090 726 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 1036 634 H 1264 M 1036 668 H 1190" stroke="#0D6B68" stroke-width="7" stroke-linecap="round" fill="none"/>
  <rect x="1036" y="686" width="110" height="22" rx="11" fill="#0D6B68"/>

  <text x="800" y="846" text-anchor="middle" font-size="46" font-weight="700" fill="#102A2B">三條路徑，三個名字</text>
</svg>
