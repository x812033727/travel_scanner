<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">大邱地鐵三條線與高鐵站、機場的相對位置 / Daegu subway lines with the KTX station and the airport</title>
<desc id="desc">示意圖。1 號線畫成橫向主線，由左到右是設化明谷方向、明德、半月堂、中央路、東大邱、東區廳、峨洋橋（大邱國際機場），再往河陽方向。2 號線斜向穿過，在半月堂與 1 號線交會，兩端是汶陽與嶺南大方向。3 號線縱向，在青蘿丘與 2 號線交會、在明德與 1 號線交會，線上有西門市場與壽城池。東大邱站標示為 KTX 與 SRT 停靠的複合轉運中心，到半月堂 9 分鐘，並有一支往圖外的箭頭寫往首爾 KTX 1 小時 38 分、SRT 1 小時 31 分，往釜山 41 分。大邱國際機場畫在峨洋橋站右上角，兩者之間是虛線，標步行 1.8 公里、約 28 分，也可以從峨洋橋站 2 號出口轉公車或搭計程車。東城路商圈貼在中央路與半月堂之間。</desc>
