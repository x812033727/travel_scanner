<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">題材標籤與公開資料 / A theme tag and the filed data behind it</title>
  <desc id="desc">米色底的插圖。左邊是一張略微傾斜的橘色吊牌，上面寫著 AI，吊牌的孔穿著一條深色細線，線往右上繞過去，接到右邊一份白色的報表。報表頂端有一條青綠色標題列，下面是六列長度相同的灰色欄位，其中一列用淺青綠底與青綠框標出，欄位也改成青綠色。一支藍色框的放大鏡從右下方正對著那一列，鏡柄是深色的粗線。報表後方襯著一個淡藍色的大圓。意思是：題材標籤只是起點，要對照公司申報的資料。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- backdrop -->
  <circle cx="1010" cy="450" r="340" fill="#E6F0F7"/>

  <!-- report sheet -->
  <rect x="800" y="170" width="420" height="560" rx="18" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/>
  <rect x="836" y="206" width="210" height="28" rx="10" fill="#0D6B68"/>
  <g fill="#CBD5D4">
    <rect x="840" y="286" width="190" height="20" rx="10"/>
    <rect x="1070" y="286" width="110" height="20" rx="10"/>
    <rect x="840" y="356" width="190" height="20" rx="10"/>
    <rect x="1070" y="356" width="110" height="20" rx="10"/>
    <rect x="840" y="426" width="190" height="20" rx="10"/>
    <rect x="1070" y="426" width="110" height="20" rx="10"/>
    <rect x="840" y="566" width="190" height="20" rx="10"/>
    <rect x="1070" y="566" width="110" height="20" rx="10"/>
    <rect x="840" y="636" width="190" height="20" rx="10"/>
    <rect x="1070" y="636" width="110" height="20" rx="10"/>
  </g>
  <!-- highlighted row -->
  <rect x="820" y="472" width="380" height="68" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="840" y="496" width="190" height="20" rx="10" fill="#0D6B68"/>
  <rect x="1070" y="496" width="110" height="20" rx="10" fill="#0D6B68"/>

  <!-- magnifier -->
  <line x1="1255" y1="585" x2="1392" y2="722" stroke="#102A2B" stroke-width="40" stroke-linecap="butt"/>
  <circle cx="1392" cy="722" r="20" fill="#102A2B"/>
  <circle cx="1176" cy="506" r="118" fill="#FFFFFF" fill-opacity="0.28" stroke="#2F6F9F" stroke-width="24"/>

  <!-- tag -->
  <g transform="translate(430 450) rotate(-12)">
    <path d="M -150 -95 L 170 -95 Q 190 -95 190 -75 L 190 75 Q 190 95 170 95 L -150 95 L -232 0 Z" fill="#D97A2B" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="-160" cy="0" r="20" fill="#F7F1E8" stroke="#102A2B" stroke-width="5"/>
    <text x="35" y="48" font-size="140" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
  </g>

  <!-- string from the tag hole to the report -->
  <path d="M 277 501 L 274 483 C 200 320, 500 190, 800 250" fill="none" stroke="#102A2B" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- lower rim of the hole drawn again so the string disappears behind the tag -->
  <g transform="translate(430 450) rotate(-12)">
    <path d="M -180 0 A 20 20 0 0 0 -140 0" fill="none" stroke="#102A2B" stroke-width="5"/>
  </g>
  <!-- eyelet where the string meets the report -->
  <circle cx="800" cy="250" r="10" fill="#102A2B"/>
</svg>
