<title id="title">일본 금융청, 온체인 금융 포럼 신설: 스테이블코인·토큰화 예금·국채 토큰화를 부처 횡단 검토 대상에</title><desc id="desc">오리지널 일러스트: 좌석 6개짜리 원탁과 그 위에 블록 두 개가 이어진 짧은 사슬 그림입니다. 아래에는 좌석 3개짜리 작은 테이블 두 개가 있고, 점선으로 원탁과 연결되어 있습니다. 상표나 실존 인물은 포함되어 있지 않습니다.</desc>
