<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 網頁、桌面版與手機 App 功能對照 / Claude on web, desktop and mobile: what each one is for</title>
  <desc id="desc">上半部是三欄對照。左欄網頁版：系統需求只要有瀏覽器，不用安裝；最順手的是坐著打字問、貼長文整理，借別人的電腦登入就接著用，對話、專案、記憶都在；碰不到的是本機檔案、全域快捷鍵與相機。中欄桌面版：系統需求是 macOS 11 以上或 Windows 10 以上；最順手的是 Mac 連點兩下 Option 把 Claude 叫出來、拖一塊螢幕直接問、用擴充功能接本機 MCP，付費方案的 Cowork 還能讀寫本機檔案；碰不到的是相機，而且 Windows 目前沒有這組快捷鍵。右欄手機 App：系統需求是 iOS 18.0 或 Android 8.0 以上；最順手的是小工具的對話、拍照、聽寫三顆鍵，語音模式官方說最適合手機，iPhone 還有鎖定畫面與分享選單入口；碰不到的是本機檔案與桌面擴充功能。下半部是四個情境的建議：坐在電腦前打字問、查資料整理長文，網頁版就夠；邊看畫面邊問，或要碰電腦裡的檔案，裝桌面版，Mac 最有感；手上有東西要拍，或路上想用講的，裝手機 App；換一台裝置接著做同一件事，三個都可以，因為是同一個帳號。系統需求與功能依 2026 年 9 月的官方說明。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">三個版本各自最順手的事（2026 年 9 月依官網查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Claude on web, desktop and mobile: strengths, limits, and which one to open</text>

  <!-- column 1: web -->
  <rect x="60" y="120" width="480" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="300" y="161" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">網頁版</text>
  <rect x="60" y="192" width="480" height="318" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="84" y="232" font-size="15" fill="#5C6B6B">系統需求</text>
  <text x="84" y="262" font-size="17" fill="#102A2B">有瀏覽器就好，不用安裝</text>
  <text x="84" y="306" font-size="15" fill="#5C6B6B">最順手的事</text>
  <text x="84" y="336" font-size="17" fill="#102A2B">坐著打字問、貼長文整理</text>
  <text x="84" y="370" font-size="17" fill="#102A2B">借別人的電腦登入就接著用</text>
  <text x="84" y="404" font-size="17" fill="#102A2B">對話、專案、記憶都在</text>
  <text x="84" y="448" font-size="15" fill="#5C6B6B">碰不到</text>
  <text x="84" y="478" font-size="17" fill="#B8442D">本機檔案、快捷鍵、相機</text>

  <!-- column 2: desktop -->
  <rect x="560" y="120" width="480" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="161" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">桌面版</text>
  <rect x="560" y="192" width="480" height="318" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="584" y="232" font-size="15" fill="#5C6B6B">系統需求</text>
  <text x="584" y="262" font-size="17" fill="#102A2B">macOS 11 以上、Windows 10 以上</text>
  <text x="584" y="306" font-size="15" fill="#5C6B6B">最順手的事</text>
  <text x="584" y="336" font-size="17" fill="#102A2B">Mac 連點兩下 Option 叫出來</text>
  <text x="584" y="370" font-size="17" fill="#102A2B">拖一塊螢幕直接問、擴充功能</text>
  <text x="584" y="404" font-size="17" fill="#102A2B">Cowork 讀寫本機檔案（付費）</text>
  <text x="584" y="448" font-size="15" fill="#5C6B6B">碰不到</text>
  <text x="584" y="478" font-size="17" fill="#B8442D">相機；Windows 沒有這組快捷鍵</text>

  <!-- column 3: mobile -->
  <rect x="1060" y="120" width="480" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1300" y="161" font-size="22" font-weight="700" fill="#A8571B" text-anchor="middle">手機 App</text>
  <rect x="1060" y="192" width="480" height="318" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1084" y="232" font-size="15" fill="#5C6B6B">系統需求</text>
  <text x="1084" y="262" font-size="17" fill="#102A2B">iOS 18.0、Android 8.0 以上</text>
  <text x="1084" y="306" font-size="15" fill="#5C6B6B">最順手的事</text>
  <text x="1084" y="336" font-size="17" fill="#102A2B">小工具：對話、拍照、聽寫</text>
  <text x="1084" y="370" font-size="17" fill="#102A2B">語音模式，官方說最適合手機</text>
  <text x="1084" y="404" font-size="17" fill="#102A2B">iPhone 鎖定畫面與分享選單</text>
  <text x="1084" y="448" font-size="15" fill="#5C6B6B">碰不到</text>
  <text x="1084" y="478" font-size="17" fill="#B8442D">本機檔案、桌面擴充功能</text>

  <!-- bottom band: which one to open -->
  <text x="60" y="566" font-size="20" font-weight="700" fill="#102A2B">什麼情境用哪一個</text>

  <rect x="60" y="590" width="358" height="200" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="239" y="626" font-size="15" fill="#5C6B6B" text-anchor="middle">情境一</text>
  <text x="239" y="660" font-size="17" fill="#102A2B" text-anchor="middle">坐在電腦前打字問，</text>
  <text x="239" y="692" font-size="17" fill="#102A2B" text-anchor="middle">查資料、整理長文</text>
  <text x="239" y="744" font-size="20" font-weight="700" fill="#1F4E73" text-anchor="middle">網頁版就夠</text>

  <rect x="434" y="590" width="358" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="613" y="626" font-size="15" fill="#5C6B6B" text-anchor="middle">情境二</text>
  <text x="613" y="660" font-size="17" fill="#102A2B" text-anchor="middle">邊看畫面邊問，或要</text>
  <text x="613" y="692" font-size="17" fill="#102A2B" text-anchor="middle">碰電腦裡的檔案</text>
  <text x="613" y="744" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">裝桌面版，Mac 最有感</text>

  <rect x="808" y="590" width="358" height="200" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="987" y="626" font-size="15" fill="#5C6B6B" text-anchor="middle">情境三</text>
  <text x="987" y="660" font-size="17" fill="#102A2B" text-anchor="middle">手上有東西要拍，或</text>
  <text x="987" y="692" font-size="17" fill="#102A2B" text-anchor="middle">路上想用講的</text>
  <text x="987" y="744" font-size="20" font-weight="700" fill="#A8571B" text-anchor="middle">裝手機 App</text>

  <rect x="1182" y="590" width="358" height="200" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1361" y="626" font-size="15" fill="#5C6B6B" text-anchor="middle">情境四</text>
  <text x="1361" y="660" font-size="17" fill="#102A2B" text-anchor="middle">換一台裝置，</text>
  <text x="1361" y="692" font-size="17" fill="#102A2B" text-anchor="middle">接著做同一件事</text>
  <text x="1361" y="744" font-size="20" font-weight="700" fill="#245E45" text-anchor="middle">都可以，同一個帳號</text>

  <text x="60" y="832" font-size="15" fill="#5C6B6B">聊天本身免費方案在三個版本都能用；Cowork 與電腦操作要付費方案。系統需求與功能以官網為準。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
