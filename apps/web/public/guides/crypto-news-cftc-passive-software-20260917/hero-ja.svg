<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">米CFTCのノーアクションレター、すべての受動的ソフトウェア提供者に拡大 十の条件が引く境界線</title><desc id="desc">オリジナルイラストです。左側は円形の印章が押された書簡の図で、無異議の書簡を表します。右側はスマートフォンの幾何学的な輪郭で、画面は一本の区切り線によって通常表示領域と別の色調の規制対象領域に分かれており、スマートフォンの下に並ぶ3つの四角形がそれぞれ線でスマートフォンとつながって3種類の登録業者を表します。商標やインターフェース画面は一切含みません。</desc>
