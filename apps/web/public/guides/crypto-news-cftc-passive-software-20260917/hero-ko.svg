<title id="title">미국 CFTC 비조치의견서, 모든 수동적 소프트웨어 제공자로 확대: 열 가지 조건이 긋는 경계선</title><desc id="desc">오리지널 일러스트입니다. 왼쪽은 인장이 찍힌 서한으로 비조치의견서를, 오른쪽은 구분선으로 일반 영역과 규제 대상 영역이 나뉜 스마트폰 윤곽을 나타내며, 아래 세 개의 사각형은 세 종류의 등록 기관을 뜻합니다. 상표나 인터페이스 화면은 포함하지 않습니다.</desc>
