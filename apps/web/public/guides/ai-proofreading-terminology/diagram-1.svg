<rect x="485" y="504" width="144" height="64" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
<text x="557" y="547" font-size="30" fill="#102A2B" text-anchor="middle">軟體</text>
<line x1="557" y1="312" x2="557" y2="368" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowblue)"/>
<line x1="557" y1="442" x2="557" y2="498" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowblue)"/>
<text x="645" y="346" font-size="17" fill="#5C6B6B" text-anchor="start">只換字形</text>
<text x="645" y="470" font-size="17" fill="#5C6B6B" text-anchor="start">加上</text>
<text x="645" y="494" font-size="17" fill="#5C6B6B" text-anchor="start">台灣用語</text>
<rect x="465" y="630" width="290" height="150" rx="12" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
<text x="610" y="670" font-size="18" fill="#B8442D" text-anchor="middle" font-weight="700">容易出錯</text>
<text x="610" y="710" font-size="17" fill="#102A2B" text-anchor="middle">數據要不要換成資料，</text>
<text x="610" y="744" font-size="17" fill="#102A2B" text-anchor="middle">得看上下文</text>
<rect x="825" y="122" width="330" height="686" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<rect x="843" y="140" width="294" height="78" rx="10" fill="#E3F0EF" stroke="#E3F0EF" stroke-width="0"/>
<text x="990" y="177" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="700">第三關：AI 校稿</text>
<text x="990" y="205" font-size="16" fill="#5C6B6B" text-anchor="middle">AI proofreading</text>
<text x="925" y="254" font-size="16" fill="#5C6B6B" text-anchor="middle">原文</text>
<text x="1063" y="254" font-size="16" fill="#5C6B6B" text-anchor="middle">建議</text>
<rect x="851" y="268" width="278" height="54" rx="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
<text x="925" y="305" font-size="24" fill="#102A2B" text-anchor="middle">再</text>
<line x1="975" y1="295" x2="1011" y2="295" stroke="#0D6B68" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrowteal)"/>
<text x="1063" y="305" font-size="24" fill="#102A2B" text-anchor="middle">在</text>
<rect x="851" y="338" width="278" height="54" rx="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
<text x="925" y="375" font-size="24" fill="#102A2B" text-anchor="middle">以經</text>
<line x1="975" y1="365" x2="1011" y2="365" stroke="#0D6B68" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrowteal)"/>
