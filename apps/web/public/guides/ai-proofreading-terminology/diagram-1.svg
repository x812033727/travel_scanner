<text x="230" y="710" font-size="17" fill="#102A2B" text-anchor="middle">詞庫沒收的詞，</text>
<text x="230" y="744" font-size="17" fill="#102A2B" text-anchor="middle">只能用單字的預設對應</text>
<rect x="445" y="122" width="330" height="686" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
