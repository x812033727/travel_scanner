<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">簡體稿變成台灣繁體稿的四道關 / Four checkpoints from a Simplified draft to Taiwan Traditional</title>
<desc id="desc">簡體稿變成台灣繁體稿要過四道關，由左到右排成四欄。第一關字形轉換：簡體的发可以對到發與髮兩個繁體字，發展用發、頭髮用髮，靠詞庫決定；容易出錯的是詞庫沒收的詞，只能用單字的預設對應。第二關詞彙轉換：软件只換字形會變成軟件，加上台灣用語才變成軟體；容易出錯的是數據該不該換成資料，要看上下文。第三關 AI 校稿：依術語表與風格表列出原文與建議，例如再改成在、以經改成已經、后來改成後來，由人決定收不收；容易出錯的是 AI 順手改寫句子，原意可能被改掉。第四關人工終校：逐一核對數字與日期、人名與機關名稱、引文與法規條文、一對多的字、兩岸意思不同的詞，做法是用追蹤修訂或建議模式逐條接受或拒絕，最後讀完全文。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/></marker><marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6F9F"/></marker><marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D6B68"/></marker></defs>
<text x="60" y="52" font-size="30" fill="#102A2B" text-anchor="start" font-weight="700">簡體稿變成台灣繁體稿：要過的四道關</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B" text-anchor="start">From a Simplified draft to Taiwan Traditional Chinese: four checkpoints</text>
