<line x1="1161" y1="465" x2="1199" y2="465" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="65" y="122" width="330" height="686" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<rect x="83" y="140" width="294" height="78" rx="10" fill="#E6F0F7" stroke="#E6F0F7" stroke-width="0"/>
<text x="230" y="177" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="700">第一關：字形轉換</text>
<text x="230" y="205" font-size="16" fill="#5C6B6B" text-anchor="middle">Characters</text>
<rect x="182" y="245" width="96" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="230" y="311" font-size="52" fill="#102A2B" text-anchor="middle">发</text>
<line x1="208" y1="345" x2="164" y2="398" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowblue)"/>
<line x1="252" y1="345" x2="296" y2="398" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowblue)"/>
<rect x="106" y="404" width="88" height="88" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="150" y="466" font-size="48" fill="#102A2B" text-anchor="middle">發</text>
<text x="150" y="528" font-size="18" fill="#5C6B6B" text-anchor="middle">發展</text>
<rect x="266" y="404" width="88" height="88" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="310" y="466" font-size="48" fill="#102A2B" text-anchor="middle">髮</text>
<text x="310" y="528" font-size="18" fill="#5C6B6B" text-anchor="middle">頭髮</text>
<text x="230" y="584" font-size="17" fill="#102A2B" text-anchor="middle">靠詞庫決定選哪個字</text>
