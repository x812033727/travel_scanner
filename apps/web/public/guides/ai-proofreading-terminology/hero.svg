<title id="title">用 AI 校稿：字對了，詞也要對 / Proofreading with AI: right characters, right words</title>
<desc id="desc">米色底上，左邊是一張白色文件，排著多行灰色文字線條：第一行末端有綠色打勾；第二行中間一段被紅線劃掉，上方有一塊綠色的替換標記，用小箭頭指向劃掉的地方；第五行有一段文字下面畫著紅色波浪底線；第三行末端一段標成橘色，從那裡拉出一條藍色虛線，連到右邊的藍框小卡片。卡片裡是三條文字線條、中間一段標成藍色；從它分出兩個箭頭，上方指向中間一段標成綠色、角上打勾的綠框卡片，下方指向中間一段標成紅色、角上打叉的紅框卡片，表示同一段文字轉換時要從多個候選裡挑對。下方一行字：字對了，詞也要對。</desc>
