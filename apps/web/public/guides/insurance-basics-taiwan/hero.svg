<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">三支箭被一面盾牌擋下，盾牌裡有一棟房子 / Three arrows stopped by a shield with a house inside</title>
<desc id="desc">插圖。畫面中央是一面深綠色邊框、淺綠底的盾牌，盾牌裡畫著一棟簡化的房子，由三角形屋頂、方形牆面與一扇門組成，代表被保護的生活。畫面左側有三支等長的粗箭頭由左往右射向盾牌，三支箭尖都停在盾牌左緣之前同樣的距離，被盾牌擋住。盾牌右側有一行字寫著「保險是風險移轉」。圖上沒有任何機構標誌、人臉、金額或曲線。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#B8442D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<path d="M 800 190 L 1010 258 L 1010 470 C 1010 590, 915 655, 800 700 C 685 655, 590 590, 590 470 L 590 258 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>
<path d="M 800 330 L 706 400 L 894 400 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/>
<rect x="726" y="400" width="148" height="110" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
<rect x="782" y="458" width="36" height="52" rx="4" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
<line x1="200" y1="294" x2="545" y2="294" stroke="#B8442D" stroke-width="14" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="200" y1="364" x2="545" y2="364" stroke="#B8442D" stroke-width="14" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="200" y1="434" x2="545" y2="434" stroke="#B8442D" stroke-width="14" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="1070" y="462" font-size="52" text-anchor="start" font-weight="700" fill="#102A2B">保險是風險移轉</text>
</svg>
