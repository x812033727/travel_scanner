<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">模型與代理評測圖解 / Evals</title><desc id="desc">案例包含人員時段和限制，執行後分別檢查班表約束、說明品質及系統中儲存的狀態，再彙整不同失敗型別。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">排班評測同時核對限制與實際結果</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Evals</text><rect x="80" y="300" width="360" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="260" y="417" text-anchor="middle" font-size="36" fill="#102A2B">任務與案例條件</text><path d="M 440 405 L 590 405" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="590" cy="405" r="10" fill="#0D6B68"/><rect x="590" y="300" width="350" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="765" y="417" text-anchor="middle" font-size="36" fill="#102A2B">一次執行嘗試</text><path d="M 940 405 L 1090 220" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1090" cy="220" r="10" fill="#0D6B68"/><path d="M 940 405 L 1090 440" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1090" cy="440" r="10" fill="#0D6B68"/><path d="M 940 405 L 1090 660" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1090" cy="660" r="10" fill="#0D6B68"/><rect x="1090" y="150" width="420" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1300" y="227" text-anchor="middle" font-size="36" fill="#102A2B">程式：班表限制</text><rect x="1090" y="370" width="420" height="130" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1300" y="447" text-anchor="middle" font-size="36" fill="#102A2B">評審：說明品質</text><rect x="1090" y="590" width="420" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1300" y="667" text-anchor="middle" font-size="