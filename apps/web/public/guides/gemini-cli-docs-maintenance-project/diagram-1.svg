<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">先核對候選，再決定是否套用</title><desc id="desc">原稿：十份互連文件：保留初始內容；候選：只改允許範圍：沒有來源就停下；檢查：檔案・定位點：拒絕不存在的目標；差異：報告 ＋ patch：交給人工審閱</desc>
<rect width="1600" height="900" fill="#f3f5ee"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#173445" font-weight="800">先核對候選，再決定是否套用</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#2b6577" font-weight="800">原稿</text><text x="120" y="311" font-size="54" fill="#173445" font-weight="500">十份互連文件</text><text x="120" y="379" font-size="54" fill="#173445" font-weight="500">保留初始內容</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#2b6577" font-weight="800">候選</text><text x="855" y="311" font-size="54" fill="#173445" font-weight="500">只改允許範圍</text><text x="855" y="379" font-size="54" fill="#173445" font-weight="500">沒有來源就停下</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#2b6577" font-weight="800">檢查</text><text x="120" y="601" font-size="54" fill="#173445" font-weight="500">檔案・定位點</text><text x="120" y="669" font-size="54" fill="#173445" font-weight="500">拒絕不存在的目標</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#2b6577" font-weight="800">差異</text><text x="855" y="601" font-size="54" fill="#173445" font-weight="500">報告 ＋ patch</text><text x="855" y="669" font-size="54" fill="#173445" font-weight="500">交給人工審閱</text><text x="85" y="818" font-size="47" fill="#476574" font-weight="500">參考修正已測；尚未套用或發布</text></g></svg>