<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Cache Checks After Site Updates</title><desc id="desc">Four steps cover checking old and new content, verifying the site origin, purging relevant CDN resources and rechecking as a reader, rather than relying on a success message.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Cache Checks After Site Updates</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Locate the resource and origin version, then check the site, CDN and reader's device</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Locate content</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Text or images</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Full resource URL</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Expected new version</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Check the site</text>
<text x="477.0" y="371" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Live in the right environment</text>
<text x="477.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Plugin and host caches</text>
<text x="477.0" y="475" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Ensure origin is correct first</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Handle CDN</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Actual cache rules</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Targeted purge scope</text>
<text x="846.0" y="475" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Check custom variants separately</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 29px;">Recheck as a reader</text>
<text x="1215.0" y="371" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Fresh browsing environment</text>
<text x="1215.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Check response and content</text>
<text x="1215.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Record time and results</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Check each layer separately to identify where the old version is being served from.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
