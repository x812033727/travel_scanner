<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">循環利息與最低應繳：只繳最低到底會付多少</title>
<desc id="desc">畫面左側是一張白色圓角帳單，頂端有一條淺綠色的標題帶，下方三條長短不一的灰色橫線，再下面一條較粗的橘色橫線代表最低應繳金額那一列。帳單右緣有一條短灰線連向右側。右側是一個綠色邊框的橢圓形開關，撥桿是一個實心綠色圓形，停在右端。開關外圍有一圈橘色的粗弧線繞了將近一整圈，弧線末端是一個橘色三角形箭頭，缺口留在正上方，代表帳款一期一期循環下去。</desc>
