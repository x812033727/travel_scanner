<rect x="60" y="665" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="230" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">薪轉帳戶、定期存款</text>
<text x="230" y="748" text-anchor="middle" font-size="17" fill="#5C6B6B">入帳連續性與財力佐證</text>

<rect x="550" y="665" width="450" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="775" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">銀行自家的往來資料</text>
<text x="775" y="748" text-anchor="middle" font-size="17" fill="#5C6B6B">核卡審核時看得到</text>

<rect x="1150" y="665" width="390" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1345" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">財力與還款能力</text>
<text x="1345" y="748" text-anchor="middle" font-size="17" fill="#5C6B6B">不在信用報告五大類裡</text>

