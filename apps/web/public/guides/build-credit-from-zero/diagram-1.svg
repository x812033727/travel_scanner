<text x="190" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">信用卡</text>
<text x="190" y="342" text-anchor="middle" font-size="17" fill="#5C6B6B">正卡與附卡</text>

<rect x="60" y="390" width="260" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="190" y="432" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">票據信用</text>
<text x="190" y="462" text-anchor="middle" font-size="17" fill="#5C6B6B">退票與拒絕往來</text>

