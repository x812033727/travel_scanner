<text x="1260" y="430" text-anchor="middle" font-size="17" fill="#5C6B6B">逾期、催收、呆帳或強制停卡</text>
<text x="1260" y="464" text-anchor="middle" font-size="17" fill="#5C6B6B">要等揭露期限走完才會消失</text>

<text x="980" y="545" font-size="19" fill="#102A2B">兩種原因不同，在申請端都可能被拒</text>

<path d="M60 596 H1540" fill="none" stroke="#5C6B6B" stroke-width="2"/>

<text x="60" y="640" font-size="20" font-weight="700" fill="#102A2B">不會進信用報告，但往來銀行看得到</text>

