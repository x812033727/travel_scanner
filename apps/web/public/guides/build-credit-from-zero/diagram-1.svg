<text x="1260" y="240" text-anchor="middle" font-size="17" fill="#5C6B6B">信用歷史未滿三個月、最近一年內沒有信用交易</text>
<text x="1260" y="274" text-anchor="middle" font-size="17" fill="#5C6B6B">資料太少，沒有東西可以算</text>

