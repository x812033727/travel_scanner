<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">信用紀錄從哪裡來、會落到哪兩種狀態 / Where a credit record comes from</title>
<desc id="desc">圖分上下兩半。上半：左邊三個往來來源，授信往來（貸款與就學貸款）、信用卡（正卡與附卡）、票據信用（退票與拒絕往來），箭頭指向中間的當事人綜合信用報告；報告由會員金融機構報送，分成借款資訊、信用卡資訊、票信資訊、查詢紀錄與其他五大類。報告再指向右邊兩種狀態：無紀錄可評分，原因是信用歷史未滿三個月、最近一年內沒有信用交易；有不良紀錄，原因是逾期、催收、呆帳或強制停卡，要等揭露期限走完才會消失。兩種原因不同，但在申請端都可能被拒。下半：薪轉帳戶與定期存款不會進信用報告，它們是銀行自家的往來資料，核卡審核時看得到，用來佐證財力與還款能力，但不在信用報告的五大類裡。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
</marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">信用紀錄從哪裡來、會落到哪兩種狀態</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Where a credit record comes from · 五大類與兩種狀態</text>

