<title id="title">대만 중앙은행, 스테이블코인·예금토큰·CBDC의 차이를 설명: 계층적으로 공존 가능, 소매형 CBDC 발행에 시급성 없어</title><desc id="desc">오리지널 일러스트: 위아래로 쌓인 가로띠 세 개입니다. 맨 위 띠에는 동전 두 개, 가운데 띠에는 은행 건물 두 개, 맨 아래 띠에는 둥근 도장 두 개가 그려져 있고, 세 띠를 점선 하나가 세로로 관통합니다. 상표나 실존 인물은 포함되어 있지 않습니다.</desc>
