  <title id="title">用同一套欄位比較五家 AI / Five AI makers on one set of fields</title>
  <desc id="desc">一張抽象插圖：五張等高的白色圓角卡片並排，每張卡片上方有一條不同顏色的標題色塊，下方有三條長短不一的灰色橫條，代表同樣的三個欄位。三條虛線橫向貫穿所有卡片，表示五張卡片量的是同一組欄位。圖下方有一行字「五家放進同一張表」。插圖沒有任何品牌標誌、文字標或介面截圖。</desc>
