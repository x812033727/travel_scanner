<title id="title">NVIDIA 開源 CUDA-Q Logical：估算容錯量子電腦規模，不是量子電腦本身</title><desc id="desc">原創插圖：左邊虛線框裡排著十二個小圓點，其中幾個是虛線輪廓，代表容易出錯的物理量子位元；箭頭指向一個工整的同心大圓，代表一個邏輯量子位元；右邊是一份文件，下方橫著一把帶刻度的尺，代表這是估算工具，而不是實際運轉的機器</desc>
