<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">NVIDIA, CUDA-Q Logical 오픈소스 공개 — 결함 허용 양자컴퓨터 규모를 추정하는 도구, 양자컴퓨터 자체는 아니다</title><desc id="desc">오리지널 일러스트: 왼쪽 점선 상자 안에 작은 원 여러 개가 늘어서 있고 일부는 점선 윤곽으로 그려져 오류가 나기 쉬운 물리 큐비트를 나타낸다. 화살표는 가지런한 동심원 모양의 큰 원을 가리키며 이는 하나의 논리 큐비트를 나타낸다. 오른쪽에는 문서가 있고 그 아래에 눈금 달린 자가 가로놓여, 실제로 작동하는 기계가 아니라 추정 도구임을 나타낸다</desc>
