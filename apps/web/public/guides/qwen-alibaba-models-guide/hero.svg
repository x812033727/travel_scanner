<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">開放權重的模型家族 / A family of open-weight models you can download</title>
  <desc id="desc">插圖：上方一個圓角方塊裡疊著三條粗線，代表一整套模型的權重；四條斜線從它往下分到四個方塊，方塊裡分別是三條文字線、一張含太陽與山的圖片框、一組聲音波形，以及一對程式用的角括號。四個方塊下方各有一個向下箭頭指向一條粗橫條，代表把權重下載回自己的機器。最下面一行字寫著開放權重的模型家族。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- hub: the model weights -->
  <rect x="560" y="120" width="480" height="170" rx="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9"/>
  <rect x="612" y="160" width="376" height="20" rx="10" fill="#0D6B68"/>
  <rect x="612" y="196" width="310" height="20" rx="10" fill="#2F6F9F"/>
  <rect x="612" y="232" width="232" height="20" rx="10" fill="#5C6B6B"/>

  <!-- fan lines from hub to the four cards -->
  <path d="M 760 290 L 260 440" fill="none" stroke="#5C6B6B" stroke-width="5"/>
  <path d="M 780 290 L 620 440" fill="none" stroke="#5C6B6B" stroke-width="5"/>
  <path d="M 820 290 L 980 440" fill="none" stroke="#5C6B6B" stroke-width="5"/>
  <path d="M 840 290 L 1340 440" fill="none" stroke="#5C6B6B" stroke-width="5"/>

  <!-- card 1: text -->
  <rect x="140" y="440" width="240" height="200" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="185" y="498" width="150" height="18" rx="9" fill="#0D6B68"/>
  <rect x="185" y="532" width="118" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="185" y="566" width="88" height="18" rx="9" fill="#5C6B6B"/>

  <!-- card 2: image -->
  <rect x="500" y="440" width="240" height="200" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="545" y="490" width="150" height="112" rx="14" fill="none" stroke="#D97A2B" stroke-width="7"/>
  <circle cx="582" cy="524" r="14" fill="#D97A2B"/>
  <path d="M 558 594 L 604 538 L 650 594 Z" fill="#D97A2B"/>

  <!-- card 3: sound -->
  <rect x="860" y="440" width="240" height="200" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="908" y="522" width="20" height="40" rx="10" fill="#2E7D5B"/>
  <rect x="944" y="502" width="20" height="80" rx="10" fill="#2E7D5B"/>
  <rect x="980" y="486" width="20" height="112" rx="10" fill="#2E7D5B"/>
  <rect x="1016" y="506" width="20" height="72" rx="10" fill="#2E7D5B"/>
  <rect x="1052" y="524" width="20" height="36" rx="10" fill="#2E7D5B"/>

  <!-- card 4: code -->
  <rect x="1220" y="440" width="240" height="200" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <path d="M 1310 502 L 1276 542 L 1310 582" fill="none" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1370 502 L 1404 542 L 1370 582" fill="none" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1352 494 L 1328 590" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round"/>

  <!-- download arrows into the base bar -->
  <path d="M 260 650 L 260 692" fill="none" stroke="#5C6B6B" stroke-width="8"/>
  <path d="M 244 690 L 276 690 L 260 714 Z" fill="#5C6B6B"/>
  <path d="M 620 650 L 620 692" fill="none" stroke="#5C6B6B" stroke-width="8"/>
  <path d="M 604 690 L 636 690 L 620 714 Z" fill="#5C6B6B"/>
  <path d="M 980 650 L 980 692" fill="none" stroke="#5C6B6B" stroke-width="8"/>
  <path d="M 964 690 L 996 690 L 980 714 Z" fill="#5C6B6B"/>
  <path d="M 1340 650 L 1340 692" fill="none" stroke="#5C6B6B" stroke-width="8"/>
  <path d="M 1324 690 L 1356 690 L 1340 714 Z" fill="#5C6B6B"/>

  <rect x="180" y="722" width="1240" height="34" rx="17" fill="#102A2B"/>

  <text x="800" y="836" text-anchor="middle" font-size="54" font-weight="bold" fill="#102A2B">開放權重的模型家族</text>
</svg>
