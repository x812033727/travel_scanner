<text x="902" y="728" font-size="15" fill="#5C6B6B" text-anchor="middle">圖片生成模型</text>

<line x1="1100" y1="132" x2="1100" y2="772" stroke="#D8CFC2" stroke-width="3"/>

<rect x="1120" y="132" width="440" height="208" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
