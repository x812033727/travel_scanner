<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">豆包、Seed 模型與火山方舟的關係 / How Doubao, ByteDance Seed models and Volcengine Ark fit together</title>
<desc id="desc">左側由上往下是一條主流程：使用者入口有網頁版（doubao.com 對話頁）、手機 App（iOS 與 Android）、桌面客戶端與瀏覽器外掛；四個入口都指向豆包帳號，註冊與登入方式為手機號、營運商一鍵登入、Apple ID 與抖音帳號，同一組帳號的體系內產品包含豆包、飛書、PICO、火山引擎與豆包輸入法；帳號之下是 Seed 模型，代號分成 doubao-seed（語言）、doubao-seedance（影片）、doubao-seedream（圖片）三條線；最下方是火山方舟 API，線上推理常規第一段單價的單位為元每百萬 token，doubao-seed-2.1-pro 輸入 6.00、輸出 30.00。右側是三個提醒欄：隱私政策寫境內營運收集的個人資料存放在中華人民共和國境內，個人版預設可能用於模型訓練，可在設定的隱私與權限關閉；台灣可用性當天實查的結果是 App Store 台灣區以官方 App ID 查詢回傳零筆，Google Play 用台灣語系參數讀得到頁面但搜尋前排沒有它，網頁版本站從台灣以外讀得到；最後提醒自己驗一次，看開發者名稱與 App ID，不要只看名字和圖示。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
<path d="M1 1 L11 6 L1 11 z" fill="#5C6B6B"/>
</marker>
</defs>

