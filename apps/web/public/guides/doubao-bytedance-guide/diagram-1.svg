<text x="1340" y="212" font-size="15" fill="#102A2B" text-anchor="middle">境內營運收集的個人資料，</text>
<text x="1340" y="240" font-size="15" fill="#102A2B" text-anchor="middle">存放在中華人民共和國境內</text>
<text x="1340" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">個人版預設可能用於模型訓練，</text>
<text x="1340" y="302" font-size="15" fill="#5C6B6B" text-anchor="middle">設定→隱私與權限可關閉</text>

<rect x="1120" y="372" width="440" height="228" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1340" y="414" font-size="20" font-weight="bold" fill="#B8442D" text-anchor="middle">台灣可用性（當天實查）</text>
<text x="1340" y="452" font-size="15" fill="#102A2B" text-anchor="middle">App Store 台灣區：以官方</text>
<text x="1340" y="480" font-size="15" fill="#102A2B" text-anchor="middle">App ID 查詢回傳零筆</text>
