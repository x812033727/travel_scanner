<rect x="412" y="676" width="316" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="570" y="704" font-size="15" fill="#102A2B" text-anchor="middle">doubao-seedance</text>
