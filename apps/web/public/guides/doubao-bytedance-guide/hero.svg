<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">先查可用性，再註冊 / Check availability before signing up</title>
<desc id="desc">抽象插圖。左側是一個大型對話框，裡面有三條代表文字的圓角橫線。對話框右方有一條連接線越過一條橘色虛線邊界，接到一支直立的手機外形，手機再以一條短線接到一台筆記型電腦的螢幕與底座。虛線邊界代表不同地區的商店與網路環境；邊界下方畫了一個橘色放大鏡，鏡片正好罩住虛線，代表使用前先自己查一次可不可用。左下角有一行文字「先查可用性，再註冊」。整張圖沒有任何品牌標誌、文字標或介面截圖。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

