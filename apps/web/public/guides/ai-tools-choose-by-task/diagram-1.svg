  <text x="430" y="136" font-size="17" font-weight="700" fill="#102A2B">首選（綠框）</text>
  <text x="830" y="136" font-size="17" font-weight="700" fill="#102A2B">備選（藍框）</text>
  <text x="1220" y="136" font-size="17" font-weight="700" fill="#102A2B">免費版能不能做</text>

  <!-- row 1 y=160 -->
