<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">依任務選 AI 工具：八種任務的首選與備選 / Which AI to open for each task: first choice and backup</title>
  <desc id="desc">八列八個任務、三個面向的矩陣：首選（綠框）、備選（藍框）、免費版能不能做。中文寫作與潤稿：首選 Claude，Artifacts 面板逐段改；備選 Gemini，Canvas 可匯出 Google 文件；免費可以。中英日翻譯：首選 Gemini，上傳檔案翻完匯出；備選 Claude，翻完直接產出 .docx；免費可以。讀長文件與摘要：首選 Claude，PDF 100 頁內含圖表、每對話 20 個檔案；備選 Gemini，10 個檔案，可丟影片與音訊；免費可以，有頁數與長度限制。寫程式與做小工具：首選 Claude，Artifacts 免費、Claude Code 要 Pro；備選 Codex，Free 只夠試、Plus 每月 20 美元；小工具免費可以，整個專案要付費。做圖片與修圖：首選 Gemini，Nano Banana 2，可上傳照片修；備選 ChatGPT，能生成與編輯，免費額度以官網為準；Gemini 免費可以，下載 1K。做研究與查資料：首選 Gemini Deep Research，免費、18 歲以上、每日有上限；備選 Claude Research，Pro 以上付費方案；Gemini 免費可以。語音對話與口說練習：首選 Gemini Live，手機 App，網頁版沒有；備選 Claude 語音模式，beta，含免費版，全平台；免費可以。在 Gmail、文件、試算表裡直接用：首選 Gemini，要 Google AI 方案，Plus 每月 165 元起；備選 Claude 連接器，免費，在 Claude 視窗裡做；Gemini 要付費，Claude 免費可以。底注：免費版指 2026 年 9 月 13 日各家官網與說明中心的內容，價格為官網幣別，之後以官網為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">依任務選 AI 工具：八種任務的首選與備選（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which AI to open for each task: first choice (green), backup (blue), and whether the free tier can do it</text>

