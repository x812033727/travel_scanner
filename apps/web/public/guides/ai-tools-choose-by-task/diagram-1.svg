  <text x="80" y="808" font-size="18" font-weight="700" fill="#102A2B">試算表裡直接用</text>
  <rect x="410" y="756" width="380" height="60" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <text x="430" y="780" font-size="17" font-weight="700" fill="#0B4F4D">Gemini</text>
  <text x="430" y="804" font-size="15" fill="#5C6B6B">要 Google AI 方案；Plus 每月 165 元起</text>
  <rect x="810" y="756" width="380" height="60" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="830" y="780" font-size="17" font-weight="700" fill="#1F4E73">Claude 連接器</text>
  <text x="830" y="804" font-size="15" fill="#5C6B6B">免費；在 Claude 視窗裡做</text>
  <text x="1220" y="784" font-size="16" fill="#D97A2B" font-weight="700">Gemini 要付費</text>
