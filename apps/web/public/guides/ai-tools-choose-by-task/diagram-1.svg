  <text x="430" y="444" font-size="17" font-weight="700" fill="#0B4F4D">Claude</text>
  <text x="430" y="468" font-size="15" fill="#5C6B6B">Artifacts 免費；Claude Code 要 Pro</text>
  <rect x="810" y="420" width="380" height="60" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="830" y="444" font-size="17" font-weight="700" fill="#1F4E73">Codex</text>
  <text x="830" y="468" font-size="15" fill="#5C6B6B">Free 只夠試；Plus 每月 20 美元</text>
  <text x="1220" y="448" font-size="16" fill="#2E7D5B" font-weight="700">小工具免費可以</text>
  <text x="1220" y="472" font-size="15" fill="#D97A2B">整個專案要付費</text>

  <!-- row 5 y=496 -->
  <rect x="60" y="496" width="1480" height="76" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
  <text x="80" y="541" font-size="18" font-weight="700" fill="#102A2B">做圖片與修圖</text>
  <rect x="410" y="504" width="380" height="60" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <text x="430" y="528" font-size="17" font-weight="700" fill="#0B4F4D">Gemini</text>
  <text x="430" y="552" font-size="15" fill="#5C6B6B">Nano Banana 2，可上傳照片修</text>
  <rect x="810" y="504" width="380" height="60" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="830" y="528" font-size="17" font-weight="700" fill="#1F4E73">ChatGPT</text>
  <text x="830" y="552" font-size="15" fill="#5C6B6B">能生成與編輯；免費額度以官網為準</text>
  <text x="1220" y="532" font-size="16" fill="#2E7D5B" font-weight="700">Gemini 免費可以</text>
