<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">依任務選 AI 工具 / Pick the AI tool by task</title>
  <desc id="desc">米色底上畫著一根深色的路標柱立在畫面中央，柱子上掛著四塊箭頭形狀的方向牌，分別是青綠色、藍色、橘色與綠色，兩塊指向左、兩塊指向右。每塊牌子指到的地方有一個圓形圖示：左上是一支筆，右上是一個有三個點的對話框，左下是一張有山與太陽的圖片，右下是程式碼的角括號符號。柱子底下有一圈淡淡的陰影，畫面上方寫著「依任務選 AI 工具」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft ground -->
  <ellipse cx="800" cy="800" rx="360" ry="34" fill="#E3F0EF"/>
  <ellipse cx="800" cy="800" rx="360" ry="34" fill="none" stroke="#0D6B68" stroke-width="3" opacity="0.4"/>

  <!-- post -->
  <rect x="776" y="220" width="48" height="580" rx="12" fill="#102A2B"/>
  <circle cx="800" cy="214" r="34" fill="#102A2B"/>
  <circle cx="800" cy="214" r="14" fill="#F7F1E8"/>

  <!-- board 1: teal, points left, y 270-350 -->
  <polygon points="800,270 800,350 470,350 420,310 470,270" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/>
  <line x1="530" y1="310" x2="740" y2="310" stroke="#0D6B68" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 26" opacity="0.6"/>
  <!-- pen icon in circle (left top) -->
  <circle cx="300" cy="310" r="78" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <g transform="translate(300 310) rotate(-45)">
    <rect x="-16" y="-52" width="32" height="76" rx="6" fill="#0D6B68"/>
    <polygon points="-16,24 16,24 0,56" fill="#0D6B68"/>
    <rect x="-16" y="-52" width="32" height="14" rx="4" fill="#F7F1E8" opacity="0.6"/>
  </g>

  <!-- board 2: blue, points right, y 380-460 -->
  <polygon points="800,380 800,460 1130,460 1180,420 1130,380" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8" stroke-linejoin="round"/>
  <line x1="860" y1="420" x2="1070" y2="420" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 26" opacity="0.6"/>
  <!-- chat bubble icon in circle (right top) -->
  <circle cx="1300" cy="420" r="78" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="1250" y="382" width="100" height="62" rx="20" fill="#2F6F9F"/>
  <polygon points="1268,440 1262,468 1296,442" fill="#2F6F9F"/>
  <circle cx="1278" cy="413" r="8" fill="#F7F1E8"/>
  <circle cx="1300" cy="413" r="8" fill="#F7F1E8"/>
  <circle cx="1322" cy="413" r="8" fill="#F7F1E8"/>

  <!-- board 3: orange, points left, y 490-570 -->
  <polygon points="800,490 800,570 470,570 420,530 470,490" fill="#FBEBDD" stroke="#D97A2B" stroke-width="8" stroke-linejoin="round"/>
  <line x1="530" y1="530" x2="740" y2="530" stroke="#D97A2B" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 26" opacity="0.6"/>
  <!-- image icon in circle (left bottom) -->
  <circle cx="300" cy="530" r="78" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <rect x="252" y="490" width="96" height="80" rx="10" fill="none" stroke="#D97A2B" stroke-width="8"/>
  <polygon points="262,562 296,520 318,546 334,532 340,562" fill="#D97A2B"/>
  <circle cx="322" cy="510" r="9" fill="#D97A2B"/>

  <!-- board 4: green, points right, y 600-680 -->
  <polygon points="800,600 800,680 1130,680 1180,640 1130,600" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8" stroke-linejoin="round"/>
  <line x1="860" y1="640" x2="1070" y2="640" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 26" opacity="0.6"/>
  <!-- code icon in circle (right bottom) -->
  <circle cx="1300" cy="640" r="78" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="8"/>
  <polyline points="1272,610 1242,640 1272,670" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1328,610 1358,640 1328,670" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1312" y1="602" x2="1288" y2="678" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round"/>

  <!-- bolts on post where boards attach -->
  <circle cx="800" cy="310" r="9" fill="#F7F1E8"/>
  <circle cx="800" cy="420" r="9" fill="#F7F1E8"/>
  <circle cx="800" cy="530" r="9" fill="#F7F1E8"/>
  <circle cx="800" cy="640" r="9" fill="#F7F1E8"/>

  <text x="800" y="130" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">依任務選 AI 工具</text>
</svg>
