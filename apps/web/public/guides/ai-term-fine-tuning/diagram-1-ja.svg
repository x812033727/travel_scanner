<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">タスクを定めて汎化を検証</title><desc id="desc">既存のモデルを学習用の例でファインチューニングし、別に確保したメール群は評価だけに使う。合格して初めてデプロイ可能なバージョンになる</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">タスクを定めて汎化を検証</text><text x="60" y="84" font-size="18" fill="#5C6B6B">ファインチューニング</text><path d="M 400 305 L 590 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 400 655 L 590 485" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 930 390 L 1120 310" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 1310 390 L 1310 570" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="70" y="230" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="235" y="299" font-size="28" fill="#102A2B" text-anchor="middle">既存のモデル</text><text x="235" y="342" font-size="22" fill="#5C6B6B" text-anchor="middle">基礎能力を継承</text><rect x="70" y="580" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="235" y="649" font-size="28" fill="#102A2B" text-anchor="middle">学習用の例</text><text x="235" y="692" font-size="22" fill="#5C6B6B" text-anchor="middle">一貫した分類規則</text><rect x="600" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="765" y="424" font-size="28" fill="#102A2B" text-anchor="middle">ファインチューニング</text><text x="765" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">学習可能パラメータを更新</text><rect x="1130" y="230" width="360" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1310" y="299" font-size="28" fill="#102A2B" text-anchor="middle">テスト用メールを確保</text><text x="1310" y="342" font-size="22" fill="#5C6B6B" text-anchor="middle">新しい事例を確認</text><rect x="1130" y="580" width="360" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1310" y="649" font-size="28" fill="#102A2B" text-anchor="middle">デプロイ版</text><text x="1310" y="692" font-size="22" fill="#5C6B6B" text-anchor="middle">設定と切り戻し方法を保存</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
