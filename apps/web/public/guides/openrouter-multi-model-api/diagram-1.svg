<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一個請求怎麼走到模型 / How a request travels through OpenRouter</title>
  <desc id="desc">左邊是你的應用程式，用 OpenAI SDK 或 curl，base URL 指向 openrouter.ai 的 API 網址，金鑰放進 Authorization 標頭當 Bearer token。中間是 OpenRouter：預設路由是價格優先的負載平衡，先排掉最近 30 秒內明顯故障的供應商，再從價格最低的幾家裡依價格平方的倒數加權挑一家，其餘當備援；請求裡的 provider 物件可以覆寫這些規則，order、only 與 ignore 指定哪幾家，allow_fallbacks 關掉就不換人，data_collection 與 zdr 控制資料留存。中間下方註明儲值時收百分之五點五手續費、token 價格不加價。右邊是三家代管同一個模型的供應商：A 每百萬 token 一美元，價格最低所以先送，機率是 C 的九倍；C 每百萬 token 三美元，A 失敗時接手；B 每百萬 token 兩美元，因為三十秒內出過錯被排到最後。底下寫啟用路由或 fallback 時只有成功跑完的那一次會計費，失敗與備援的嘗試不收錢。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#102A2B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#2E7D5B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#D97A2B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#B8442D"/>
    </marker>
  </defs>

  <text x="50" y="52" font-size="30" font-weight="bold" fill="#102A2B">一個請求怎麼從你的程式走到模型</text>
  <text x="50" y="84" font-size="18" fill="#5C6B6B">Your app to OpenRouter to the providers hosting the model</text>

  <!-- column 1: the app -->
  <rect x="50" y="250" width="340" height="260" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="220" y="298" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">你的應用程式</text>
  <text x="72" y="340" font-size="15" fill="#102A2B">OpenAI SDK 或 curl 都可以</text>
  <text x="72" y="375" font-size="15" fill="#5C6B6B">base URL 指向</text>
  <text x="72" y="403" font-size="15" fill="#102A2B">openrouter.ai/api/v1</text>
  <text x="72" y="443" font-size="15" fill="#5C6B6B">金鑰放進 Authorization</text>
  <text x="72" y="471" font-size="15" fill="#102A2B">標頭當 Bearer token</text>

  <line x1="398" y1="380" x2="440" y2="380" stroke="#102A2B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- column 2: OpenRouter -->
  <rect x="450" y="150" width="580" height="560" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="740" y="200" font-size="28" font-weight="bold" fill="#102A2B" text-anchor="middle">OpenRouter</text>
  <text x="740" y="230" font-size="17" fill="#5C6B6B" text-anchor="middle">一個端點、一把金鑰</text>

  <rect x="480" y="260" width="520" height="175" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="505" y="298" font-size="18" font-weight="bold" fill="#0D6B68">預設路由：價格優先的負載平衡</text>
  <text x="505" y="336" font-size="15" fill="#102A2B">1. 先排掉最近 30 秒內明顯故障的供應商</text>
  <text x="505" y="368" font-size="15" fill="#102A2B">2. 在價格最低的幾家裡，依價格平方</text>
  <text x="529" y="396" font-size="15" fill="#102A2B">的倒數加權挑一家，其餘當備援</text>

  <rect x="480" y="460" width="520" height="175" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="505" y="498" font-size="18" font-weight="bold" fill="#2F6F9F">provider 物件可以覆寫</text>
  <text x="505" y="536" font-size="15" fill="#102A2B">order／only／ignore：指定哪幾家</text>
  <text x="505" y="568" font-size="15" fill="#102A2B">allow_fallbacks：關掉就不換人</text>
  <text x="505" y="600" font-size="15" fill="#102A2B">data_collection／zdr：資料留存</text>

  <text x="740" y="678" font-size="17" fill="#5C6B6B" text-anchor="middle">儲值時收 5.5% 手續費，token 價格不加價</text>

  <line x1="1038" y1="237" x2="1112" y2="237" stroke="#2E7D5B" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1038" y1="432" x2="1112" y2="432" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>
  <line x1="1038" y1="627" x2="1112" y2="627" stroke="#B8442D" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>

  <!-- column 3: providers -->
  <rect x="1120" y="155" width="430" height="165" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1152" y="195" font-size="20" font-weight="bold" fill="#2E7D5B">供應商 A</text>
  <text x="1152" y="228" font-size="17" fill="#102A2B">$1／百萬 token</text>
  <text x="1152" y="260" font-size="15" fill="#102A2B">價格最低，先送這家</text>
  <text x="1152" y="288" font-size="15" fill="#5C6B6B">（機率是 C 的 9 倍）</text>

  <rect x="1120" y="350" width="430" height="165" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1152" y="390" font-size="20" font-weight="bold" fill="#D97A2B">供應商 C</text>
  <text x="1152" y="423" font-size="17" fill="#102A2B">$3／百萬 token</text>
  <text x="1152" y="455" font-size="15" fill="#102A2B">A 失敗時接手</text>
  <text x="1152" y="483" font-size="15" fill="#5C6B6B">（第二順位）</text>

  <rect x="1120" y="545" width="430" height="165" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1152" y="585" font-size="20" font-weight="bold" fill="#B8442D">供應商 B</text>
  <text x="1152" y="618" font-size="17" fill="#102A2B">$2／百萬 token</text>
  <text x="1152" y="650" font-size="15" fill="#102A2B">30 秒內出過錯，排最後</text>
  <text x="1152" y="678" font-size="15" fill="#5C6B6B">（A 與 C 都失敗才輪到）</text>

  <!-- bottom note -->
  <rect x="450" y="745" width="1100" height="75" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1000" y="790" font-size="17" fill="#102A2B" text-anchor="middle">啟用路由或 fallback 時，只有成功跑完的那一次會計費；失敗與備援的嘗試不收錢</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
