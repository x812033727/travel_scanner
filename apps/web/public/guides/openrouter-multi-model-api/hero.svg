<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一把金鑰，多家模型 / One key, many models</title>
  <desc id="desc">插圖：畫面左邊是一把用圓環與長條組成的鑰匙，鑰匙尖端延伸出一條線，接到中央的圓形節點；節點再散出五條顏色不同的線，分別連向右側五個顏色不同的圓角方塊，每個方塊裡有兩條短橫條與一個小圓點，代表由不同公司代管的不同模型。畫面下方有一行字：一把金鑰，多家模型。整張圖不含任何產品介面、標誌或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- fan lines from the hub to each model card -->
  <line x1="800" y1="420" x2="1082" y2="158" stroke="#2F6F9F" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="420" x2="1082" y2="284" stroke="#2E7D5B" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="420" x2="1082" y2="410" stroke="#0D6B68" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="420" x2="1082" y2="536" stroke="#D97A2B" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="420" x2="1082" y2="662" stroke="#B8442D" stroke-width="7" stroke-linecap="round"/>

  <!-- the key -->
  <circle cx="230" cy="420" r="72" fill="none" stroke="#0D6B68" stroke-width="24"/>
  <circle cx="230" cy="420" r="26" fill="#F7F1E8"/>
  <rect x="296" y="404" width="160" height="32" rx="14" fill="#0D6B68"/>
  <rect x="388" y="436" width="24" height="46" rx="10" fill="#0D6B68"/>
  <rect x="432" y="436" width="24" height="34" rx="10" fill="#0D6B68"/>
  <line x1="470" y1="420" x2="632" y2="420" stroke="#0D6B68" stroke-width="9" stroke-linecap="round"/>

  <!-- the hub -->
  <circle cx="720" cy="420" r="86" fill="#E3F0EF" stroke="#0D6B68" stroke-width="11"/>
  <circle cx="720" cy="420" r="32" fill="#0D6B68"/>

  <!-- five model cards -->
  <rect x="1082" y="110" width="352" height="96" rx="22" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="1114" y="136" width="186" height="16" rx="8" fill="#2F6F9F"/>
  <rect x="1114" y="166" width="118" height="14" rx="7" fill="#5C6B6B" opacity="0.45"/>
  <circle cx="1390" cy="158" r="20" fill="#2F6F9F" opacity="0.35"/>

  <rect x="1082" y="236" width="352" height="96" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="1114" y="262" width="148" height="16" rx="8" fill="#2E7D5B"/>
  <rect x="1114" y="292" width="196" height="14" rx="7" fill="#5C6B6B" opacity="0.45"/>
  <circle cx="1390" cy="284" r="20" fill="#2E7D5B" opacity="0.35"/>

  <rect x="1082" y="362" width="352" height="96" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="1114" y="388" width="206" height="16" rx="8" fill="#0D6B68"/>
  <rect x="1114" y="418" width="132" height="14" rx="7" fill="#5C6B6B" opacity="0.45"/>
  <circle cx="1390" cy="410" r="20" fill="#0D6B68" opacity="0.35"/>

  <rect x="1082" y="488" width="352" height="96" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1114" y="514" width="164" height="16" rx="8" fill="#D97A2B"/>
  <rect x="1114" y="544" width="106" height="14" rx="7" fill="#5C6B6B" opacity="0.45"/>
  <circle cx="1390" cy="536" r="20" fill="#D97A2B" opacity="0.35"/>

  <rect x="1082" y="614" width="352" height="96" rx="22" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <rect x="1114" y="640" width="178" height="16" rx="8" fill="#B8442D"/>
  <rect x="1114" y="670" width="150" height="14" rx="7" fill="#5C6B6B" opacity="0.45"/>
  <circle cx="1390" cy="662" r="20" fill="#B8442D" opacity="0.35"/>

  <text x="800" y="816" font-size="64" font-weight="bold" fill="#102A2B" text-anchor="middle">一把金鑰，多家模型</text>
</svg>
