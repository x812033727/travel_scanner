<title id="title">EU EBA 의견서: 전자화폐토큰의 PSD2 경과기간 종료, 세 가지 시나리오와 네 가지 조건</title><desc id="desc">자체 제작 일러스트: 일부가 겹친 두 개의 둥근 사각형으로, 왼쪽 사각형 안에는 결제 카드가, 오른쪽 사각형 안에는 서로 연결된 두 개의 블록이 있고 겹친 부분에 동전 하나가 놓여 지급결제서비스 규정과 암호자산 규정에 동시에 걸리는 전자화폐토큰을 나타냅니다</desc>
