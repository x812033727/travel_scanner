<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">Three scenarios once the transition ends</title><desc id="desc">The three scenarios in paragraphs 8, 9 and 13 of the Opinion: already authorised or already partnered with a payment service provider; an application pending with all four conditions met; and, for those that fall short, stopping the services and offboarding clients from March 2, 2026.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">Three scenarios once the transition ends</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Scenario one</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Authorised or already partnered</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Scenario two</text><text x="1170" y="348" font-size="31.3" font-weight="600" fill="#5C6B6B" text-anchor="middle">Applied, all four conditions met</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Two restrictions</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">No marketing, no new clients</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Scenario three</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Stop services, offboard clients</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair Illustration 2026</text></svg>