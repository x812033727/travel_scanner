<title id="title">Apple 公布 iPhone Duo 開發資源：Xcode 26 以前建置的 App 用不滿螢幕</title><desc id="desc">原創插圖：左側是一個直立矩形代表工具圖示，中央一個大矩形被一條虛線分成左右兩半代表摺疊螢幕的摺痕，右側排列四個小方框各放一個簡化符號，分別代表程式碼、畫筆、文件與人形，對應開發資源的四個項目；不呈現實際機身外觀或商標</desc>
