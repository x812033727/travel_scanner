<title id="title">Sonnet 5.5の4つの注目点</title><desc id="desc">Claude Sonnet 5.5の定価、Claude.aiでの利用、開発者向けプラットフォーム、System Cardによる安全性しきい値の判定。Anthropicの発表、モデルページ、製品ページ、System Cardに基づいて整理。確認日は2026年9月30日。</desc>
