<title id="title">Claude Sonnet 5.5 推出：标价与 Sonnet 5 相同，API、云平台与 Claude.ai 都能用</title><desc id="desc">原创插图：左边一张虚线卡片代表前一版 Sonnet，等号接着一张实线卡片代表 Sonnet 5.5，表示标价相同；右边一台屏幕、一部手机与一朵云，代表网页、应用与 API 平台；不含商标或真实人物。</desc>
