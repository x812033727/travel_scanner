<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">清邁市集在古城哪一邊、哪幾天開 / Chiang Mai markets around the old city</title>
<desc id="desc">示意圖，方向與距離非比例。中央是古城的護城河方塊，東邊是塔佩門、南邊是清邁門、北邊是 Chang Phueak 門。古城內一條橫線從塔佩門到帕辛寺，是週日步行街，沿 Ratchadamnoen 路約 1.5 公里；縱線是 Phra Pokklao 路，兩線在古城正中央交叉。古城南邊外從清邁門往南是週六步行街 Wualai 路。古城東邊外是 Night Bazaar，在長康路一帶，每天開。東北邊是瓦洛洛市場，每天開。北邊是 Jing Jai 市集，每天開，農夫市集只有週六日。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">清邁市集：古城哪一邊、哪幾天開</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Chiang Mai markets by day · 示意圖，方向與距離非比例</text>
<text x="1540" y="60" font-size="16" text-anchor="end" fill="#5C6B6B">營業日與時間見內文表格</text>

<!-- north arrow -->
<line x1="120" y1="330" x2="120" y2="230" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<text x="120" y="360" font-size="18" text-anchor="middle" fill="#5C6B6B">北</text>

<!-- Jing Jai (north) -->
<rect x="410" y="115" width="460" height="86" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4" stroke-dasharray="12 8"/>
<text x="640" y="152" font-size="22" font-weight="700" text-anchor="middle" fill="#102A2B">Jing Jai 市集</text>
<text x="640" y="182" font-size="17" text-anchor="middle" fill="#5C6B6B">Atsadathon 路｜每天，農夫市集週六日</text>

<!-- old city: moat and inside -->
<rect x="340" y="260" width="600" height="440" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="12"/>
<rect x="354" y="274" width="572" height="412" fill="#E3F0EF"/>
<text x="372" y="312" font-size="22" font-weight="700" fill="#102A2B">古城（護城河內）</text>

<!-- Phra Pokklao (vertical) -->
<line x1="640" y1="274" x2="640" y2="686" stroke="#0D6B68" stroke-width="6"/>
<text x="656" y="340" font-size="17" fill="#102A2B">Phra Pokklao 路</text>

<!-- Sunday street (horizontal) -->
<line x1="380" y1="480" x2="926" y2="480" stroke="#0D6B68" stroke-width="12"/>
<circle cx="640" cy="480" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
<text x="618" y="456" font-size="16" text-anchor="end" fill="#102A2B">สี่แยกกลางเวียง</text>
<circle cx="380" cy="480" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
<text x="380" y="520" font-size="17" text-anchor="middle" fill="#102A2B">帕辛寺</text>
<rect x="662" y="500" width="262" height="66" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="793" y="526" font-size="19" font-weight="700" text-anchor="middle" fill="#0D6B68">週日步行街</text>
<text x="793" y="552" font-size="17" text-anchor="middle" fill="#102A2B">Ratchadamnoen 路｜1.5 公里</text>

<!-- gates -->
<rect x="927" y="467" width="26" height="26" fill="#D97A2B"/>
<text x="920" y="452" font-size="17" text-anchor="end" fill="#102A2B">塔佩門</text>
<rect x="627" y="687" width="26" height="26" fill="#D97A2B"/>
<text x="610" y="676" font-size="17" text-anchor="end" fill="#102A2B">清邁門</text>
<rect x="627" y="247" width="26" height="26" fill="#D97A2B"/>
<text x="610" y="240" font-size="17" text-anchor="end" fill="#102A2B">Chang Phueak 門</text>

<!-- Saturday street (south) -->
<line x1="640" y1="713" x2="640" y2="800" stroke="#D97A2B" stroke-width="12"/>
<rect x="670" y="748" width="262" height="66" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="801" y="774" font-size="19" font-weight="700" text-anchor="middle" fill="#B8442D">週六步行街</text>
<text x="801" y="800" font-size="17" text-anchor="middle" fill="#102A2B">Wualai 路</text>

<!-- Night Bazaar (east) -->
<rect x="1020" y="420" width="400" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="1220" y="466" font-size="24" font-weight="700" text-anchor="middle" fill="#102A2B">Night Bazaar</text>
<text x="1220" y="500" font-size="17" text-anchor="middle" fill="#5C6B6B">長康路 Chang Klan｜每天</text>

<!-- Warorot (north-east) -->
<rect x="1020" y="215" width="400" height="120" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="1220" y="261" font-size="24" font-weight="700" text-anchor="middle" fill="#102A2B">瓦洛洛市場</text>
<text x="1220" y="295" font-size="17" text-anchor="middle" fill="#5C6B6B">Wichayanon 路｜每天</text>

<!-- legend -->
<rect x="1020" y="660" width="520" height="150" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2"/>
<line x1="1050" y1="705" x2="1120" y2="705" stroke="#5C6B6B" stroke-width="10"/>
<text x="1140" y="711" font-size="17" fill="#102A2B">實線＝封街的週末步行街</text>
<rect x="1050" y="745" width="70" height="36" rx="8" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1140" y="770" font-size="17" fill="#102A2B">虛線框＝一般街區的市集</text>

<text x="1540" y="870" font-size="15" text-anchor="end" fill="#5C6B6B">© Mokaair 製圖 2026</text>
