<title id="title">Opus 5.5 上線後先看這四件事</title><desc id="desc">Anthropic 2026 年 9 月 22 日推出 Claude Opus 5.5：成本估計、牌價降幅、付費方案用量與還沒推出的部分，查核日 2026 年 9 月 26 日。</desc>
