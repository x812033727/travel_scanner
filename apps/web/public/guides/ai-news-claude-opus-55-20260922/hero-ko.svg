<title id="title">Claude Opus 5.5 출시: 정가 20% 인하, 유료 플랜 5시간 한도 상향, 40%는 Anthropic의 비용 추정치</title><desc id="desc">오리지널 일러스트: 색이 칠해진 호가 보통보다 더 멀리 도는 시계입니다. 오른쪽에는 점선으로 나뉜 상자 세 개가 있고, 각각 길이가 다른 아래쪽 화살표가 있으며, 세 번째 상자는 점선 테두리로 되어 있습니다. 상표나 실존 인물은 포함되어 있지 않습니다.</desc>
