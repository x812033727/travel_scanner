    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect x="600" y="120" width="400" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
