<title id="title">台马四号海缆与马祖微波站：数位发展部称“近期完工”，马祖通信备援现况</title><desc id="desc">原创插图：左边一块圆角长方形代表台湾本岛的岸边，三条弧线跨海连到右边——两条实线，其中一条中段有一个警示三角形代表断缆，第三条是虚线，代表尚未启用的海缆；右边四个圆点排成菱形、以虚线相连，代表四乡之间的微波备援</desc>
