<title id="title">臺馬四號海纜與馬祖微波站：數發部稱「近期完工」，馬祖通訊備援現況</title><desc id="desc">原創插圖：左邊一塊圓角長方形代表臺灣本島的岸邊，三條弧線跨海連到右邊——兩條實線，其中一條中段有一個警示三角形代表斷纜，第三條是虛線，代表尚未啟用的海纜；右邊四個圓點排成菱形、以虛線相連，代表四鄉之間的微波備援</desc>
