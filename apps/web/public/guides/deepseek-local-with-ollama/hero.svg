<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">模型住在你的電腦裡 / A distilled model running on your own machine</title>
  <desc id="desc">插圖：一圈虛線的圓角邊界代表你自己的電腦。邊界裡左邊是一台打開的筆記型電腦，螢幕上有一個對話框與三條代表文字的線；右邊是三個由大到小、用箭頭往下相連的方塊，代表大模型被蒸餾成越來越小的版本。邊界下方寫著一行字：模型住在你的電腦裡。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect x="180" y="130" width="1240" height="560" rx="44" fill="none" stroke="#0D6B68" stroke-width="7" stroke-dasharray="22 16"/>

  <rect x="300" y="230" width="520" height="330" rx="20" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
  <rect x="258" y="572" width="604" height="30" rx="15" fill="#102A2B"/>

  <rect x="352" y="282" width="330" height="152" rx="26" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <path d="M 396 432 L 396 488 L 452 432 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6" stroke-linejoin="round"/>
  <rect x="400" y="424" width="48" height="14" fill="#E3F0EF"/>
  <rect x="388" y="318" width="258" height="16" rx="8" fill="#0D6B68"/>
  <rect x="388" y="352" width="214" height="16" rx="8" fill="#5C6B6B"/>
  <rect x="388" y="386" width="160" height="16" rx="8" fill="#5C6B6B"/>

  <rect x="980" y="212" width="300" height="122" rx="20" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <line x1="1130" y1="344" x2="1130" y2="392" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1020" y="402" width="220" height="102" rx="18" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <line x1="1130" y1="514" x2="1130" y2="558" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1060" y="568" width="140" height="82" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>

  <text x="800" y="808" text-anchor="middle" font-size="54" font-weight="bold" fill="#102A2B">模型住在你的電腦裡</text>
</svg>
