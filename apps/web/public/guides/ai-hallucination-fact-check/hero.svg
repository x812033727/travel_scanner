<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 幻覺與查證：對話泡泡、放大鏡、打勾與打叉 / AI hallucination and fact-checking: a speech bubble, a magnifier, a check and a cross</title>
  <desc id="desc">米色底上，左側是一個白色的大對話泡泡，泡泡裡有四條代表文字的灰色橫條，其中第三條是橘色，一支藍框的放大鏡從右下方伸進泡泡，鏡片剛好罩住那條橘色的字。泡泡右側浮著兩個圓形徽章：上面一個綠色圓裡是白色打勾，下面一個紅色圓裡是白色打叉。畫面下方置中有一行短字「先查證，再相信」。整體用簡單幾何形狀表達「AI 說的話要用放大鏡看過，再決定是真是假」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background blobs -->
  <circle cx="300" cy="180" r="150" fill="#E3F0EF"/>
  <circle cx="1350" cy="700" r="190" fill="#E6F0F7"/>

  <!-- speech bubble -->
  <path d="M 200 200 H 940 a 40 40 0 0 1 40 40 V 560 a 40 40 0 0 1 -40 40 H 470 L 370 680 L 390 600 H 240 a 40 40 0 0 1 -40 -40 V 240 a 40 40 0 0 1 40 -40 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>

  <!-- text bars inside the bubble -->
  <rect x="270" y="270" width="520" height="34" rx="17" fill="#5C6B6B" opacity="0.55"/>
  <rect x="270" y="340" width="600" height="34" rx="17" fill="#5C6B6B" opacity="0.55"/>
  <rect x="270" y="410" width="450" height="34" rx="17" fill="#D97A2B"/>
  <rect x="270" y="480" width="560" height="34" rx="17" fill="#5C6B6B" opacity="0.55"/>

  <!-- magnifier -->
  <line x1="880" y1="560" x2="1080" y2="760" stroke="#2F6F9F" stroke-width="44" stroke-linecap="round"/>
  <line x1="880" y1="560" x2="1080" y2="760" stroke="#E6F0F7" stroke-width="16" stroke-linecap="round"/>
  <circle cx="760" cy="430" r="190" fill="#E6F0F7" opacity="0.6"/>
  <circle cx="760" cy="430" r="190" fill="none" stroke="#2F6F9F" stroke-width="26"/>
  <circle cx="760" cy="430" r="150" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>

  <!-- check badge -->
  <circle cx="1240" cy="290" r="110" fill="#2E7D5B"/>
  <path d="M 1180 295 L 1225 340 L 1305 245" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cross badge -->
  <circle cx="1340" cy="560" r="90" fill="#B8442D"/>
  <path d="M 1300 520 L 1380 600 M 1380 520 L 1300 600" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- one line of text -->
  <text x="800" y="830" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">先查證，再相信</text>
</svg>
