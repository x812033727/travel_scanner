<title id="title">失能程度表與保障 / A graded table under a shield</title>
<desc id="desc">插圖：畫面中央是一面深綠色的盾牌，盾牌裡放著一張三乘三的等大方格表，方格的顏色由左到右從深到淺，代表分級。盾牌左右各有一份大小相同、對稱擺放的文件，文件上以橫線代表條文，兩份文件被盾牌遮住的寬度一樣。畫面下方有一條水平基線。整張圖沒有文字。</desc>
