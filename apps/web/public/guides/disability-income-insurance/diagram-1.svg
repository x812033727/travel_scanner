<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">失能扶助險補的是哪一塊 / What disability cover pays for</title>
<desc id="desc">左右對照兩類保險：醫療險的給付綁在已經發生的醫療費用，失能扶助險的給付綁在身體狀況是否達到保單條款所列的失能程度。中央是判準：保單條款所附的失能程度表，並註明意外與疾病兩條路的分級依據不同。下方以十一個等大方塊代表分級，最左邊是第一級、中間標出第六級、最右邊是第十一級，顏色由深到淺表示失能程度由重到輕。兩條橫線標出一張保單條款裡的給付範圍：一次金對應第一級至第十一級，扶助金對應第一級至第六級，各自往下連到一個說明框：左下角是扶助金，按期給付並有免責期間與保證給付期間等約定；右下角是一次金，診斷確定後給一筆。底部提醒圖中的級距只是一張保單的例子，實際認定看個案，勞保與國民年金另有各自的失能等級表。</desc>
<defs><marker id="arrowg" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#2E7D5B"/></marker><marker id="arrowo" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#D97A2B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">失能扶助險補的是哪一塊</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B" text-anchor="start">What disability cover actually pays for</text>
<rect x="60" y="112" width="720" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="100" y="152" font-size="20" fill="#2F6F9F" text-anchor="start" font-weight="bold">醫療險：補花掉的錢</text>
<text x="100" y="192" font-size="17" fill="#102A2B" text-anchor="start">給付綁在已經發生的醫療費用</text>
<text x="100" y="222" font-size="17" fill="#102A2B" text-anchor="start">示範條款按住院期間內所發生、健保對象</text>
<text x="100" y="252" font-size="17" fill="#102A2B" text-anchor="start">應自行負擔或不屬健保給付範圍的費用核付</text>
<rect x="820" y="112" width="720" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="860" y="152" font-size="20" fill="#0D6B68" text-anchor="start" font-weight="bold">失能扶助險：補賺不到的錢</text>
<text x="860" y="192" font-size="17" fill="#102A2B" text-anchor="start">給付綁在身體狀況是否達到條款所列的</text>
<text x="860" y="222" font-size="17" fill="#102A2B" text-anchor="start">失能程度，與這一期花了多少錢無關</text>
<text x="860" y="252" font-size="17" fill="#102A2B" text-anchor="start">保險法把失能的內容交回契約約定</text>
<rect x="60" y="306" width="1480" height="56" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="343" font-size="20" fill="#0D6B68" text-anchor="middle" font-weight="bold">判準：保單條款所附的失能程度表（意外與疾病兩條路的分級依據不同）</text>
<rect x="372" y="396" width="56" height="54" rx="6" fill="#0D6B68" stroke="#0D6B68" stroke-width="2"/>
<rect x="452" y="396" width="56" height="54" rx="6" fill="#227876" stroke="#0D6B68" stroke-width="2"/>
<rect x="532" y="396" width="56" height="54" rx="6" fill="#388683" stroke="#0D6B68" stroke-width="2"/>
<rect x="612" y="396" width="56" height="54" rx="6" fill="#4D9391" stroke="#0D6B68" stroke-width="2"/>
<rect x="692" y="396" width="56" height="54" rx="6" fill="#63A09E" stroke="#0D6B68" stroke-width="2"/>
<rect x="772" y="396" width="56" height="54" rx="6" fill="#78AEAC" stroke="#0D6B68" stroke-width="2"/>
<rect x="852" y="396" width="56" height="54" rx="6" fill="#8DBBB9" stroke="#0D6B68" stroke-width="2"/>
<rect x="932" y="396" width="56" height="54" rx="6" fill="#A3C8C7" stroke="#0D6B68" stroke-width="2"/>
<rect x="1012" y="396" width="56" height="54" rx="6" fill="#B8D5D4" stroke="#0D6B68" stroke-width="2"/>
<rect x="1092" y="396" width="56" height="54" rx="6" fill="#CEE3E2" stroke="#0D6B68" stroke-width="2"/>
<rect x="1172" y="396" width="56" height="54" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="2"/>
<text x="400" y="386" font-size="16" fill="#102A2B" text-anchor="middle">第一級</text>
<text x="800" y="386" font-size="16" fill="#102A2B" text-anchor="middle">第六級</text>
<text x="1200" y="386" font-size="16" fill="#102A2B" text-anchor="middle">第十一級</text>
<text x="60" y="430" font-size="16" fill="#5C6B6B" text-anchor="start">較重的失能程度</text>
<text x="1540" y="430" font-size="16" fill="#5C6B6B" text-anchor="end">較輕的失能程度</text>
<line x1="372" y1="472" x2="1228" y2="472" stroke="#2E7D5B" stroke-width="6" stroke-linecap="butt"/>
<text x="1242" y="478" font-size="16" fill="#2E7D5B" text-anchor="start">一次金：第一級至第十一級</text>
<line x1="372" y1="500" x2="828" y2="500" stroke="#D97A2B" stroke-width="6" stroke-linecap="butt"/>
<text x="60" y="506" font-size="16" fill="#D97A2B" text-anchor="start">扶助金：第一級至第六級</text>
<line x1="420" y1="514" x2="420" y2="558" stroke="#D97A2B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrowo)"/>
<line x1="1180" y1="478" x2="1180" y2="558" stroke="#2E7D5B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrowg)"/>
<rect x="60" y="562" width="720" height="176" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="100" y="602" font-size="20" fill="#D97A2B" text-anchor="start" font-weight="bold">扶助金（分期給付）</text>
<text x="100" y="642" font-size="17" fill="#102A2B" text-anchor="start">按期給付，續期要仍生存並持續符合</text>
<text x="100" y="672" font-size="17" fill="#102A2B" text-anchor="start">等級門檻通常比一次金嚴</text>
<text x="100" y="702" font-size="17" fill="#102A2B" text-anchor="start">另有免責期間、保證給付期間等約定</text>
<rect x="820" y="562" width="720" height="176" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="860" y="602" font-size="20" fill="#2E7D5B" text-anchor="start" font-weight="bold">一次金</text>
<text x="860" y="642" font-size="17" fill="#102A2B" text-anchor="start">診斷確定符合條款所列的失能程度後給一筆</text>
<text x="860" y="672" font-size="17" fill="#102A2B" text-anchor="start">金額按附表所列的給付比例計算</text>
<text x="860" y="702" font-size="17" fill="#102A2B" text-anchor="start">同一事故兩項以上時以保險金額為限</text>
<text x="800" y="786" font-size="17" fill="#5C6B6B" text-anchor="middle">圖中的級距是一張保單條款的例子；實際認定看個案，勞保與國民年金另有各自的失能等級表</text>
<text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
