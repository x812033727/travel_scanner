<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">高雄三天兩夜路線示意圖：捷運紅線、橘線、環狀輕軌、渡輪與公車 / Kaohsiung 3-day route map on the metro, light rail, ferry and buses</title>
  <desc id="desc">示意圖，非實際比例。高鐵從台北到左營最快 1 小時 34 分、標準車廂對號座 NT$1,490。第一天在港區：捷運美麗島站到哈瑪星站 6 分、NT$20；環狀輕軌 06:30 到 22:30、NT$20 到 35，駁二藝術特區在輕軌 C12、C13 站，駁二塔 NT$10；打狗英國領事館 NT$99、週三休館（國定假日例外，以公告為準）；鼓山輪渡站坐渡輪到旗津 5 到 10 分、NT$30，05:15 到 02:00。第二天在左營：左營站到生態園區站走到蓮池潭與龍虎塔，附近有台鐵左營（舊城）站與鳳山縣舊城；巨蛋站 1 號出口是瑞豐夜市，17:00 到 24:00、週一週三休；左營到美麗島 13 分、NT$25；美麗島站 1 號出口是六合夜市，17:00 到 02:00。第三天從高鐵左營站坐 E02 哈佛快線到佛陀紀念館約 35 分、NT$70，佛陀紀念館通常週二休館（特殊公告例外），末班 18:30 從佛光山開、19:04 回到左營；或坐 E25 到旗山約 45 分、美濃約 1 小時。機場站到美麗島 16 分、NT$30。Schematic, not to scale. THSR Taipei to Zuoying in 1 h 34 min at NT$1,490. Day 1 on the harbour: Formosa Boulevard to Hamasen 6 min NT$20; circular light rail 06:30 to 22:30, NT$20 to 35, Pier-2 at C12 and C13, Pier-2 Tower NT$10; British Consulate NT$99, closed Wednesdays except when a national holiday falls on Wednesday; ferry from Gushan to Cijin 5 to 10 min, NT$30, 05:15 to 02:00. Day 2 in Zuoying: Ecological District station for Lotus Pond, TRA Zuoying (Jiucheng) and the old city gates; Ruifeng Night Market at Kaohsiung Arena exit 1, 17:00 to 24:00, closed Mondays and Wednesdays; Zuoying to Formosa Boulevard 13 min NT$25; Liuhe Night Market at Formosa Boulevard exit 1, 17:00 to 02:00. Day 3 from HSR Zuoying: bus E02 to the Buddha Museum in about 35 min for NT$70; the museum is normally closed Tuesdays unless a special opening is announced; last bus 18:30 from Fo Guang Shan reaching Zuoying 19:04; or bus E25 to Qishan in about 45 min and Meinong in about an hour. Airport to Formosa Boulevard 16 min NT$30.</desc>
