<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">把需求寫成可驗收提示</title><desc id="desc">目標與背景：說明要解決的問題；限制與格式：給範例和缺漏規則；檢查結果：對照條件逐項修正</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">把需求寫成可驗收提示</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">目標與背景</text><text x="245" y="333" font-size="76" fill="#315F91">說明要解決的問題</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">限制與格式</text><text x="245" y="558" font-size="76" fill="#315F91">給範例和缺漏規則</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">檢查結果</text><text x="245" y="783" font-size="76" fill="#315F91">對照條件逐項修正</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>