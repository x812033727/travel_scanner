<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">서울 3박 4일 권역별 동선 안내도 / Seoul four-day itinerary by area</title>
  <desc id="desc">실제 축척이 아닌 서울 주요 권역 동선 약도예요. 왼쪽 인천국제공항(ICN)에서 공항철도 AREX 직통열차로 43–51분이면 서울역에 닿고, 일반열차는 홍대입구역까지 바로 이어져요. Day 1은 명동과 남산(N서울타워 야경, 남산순환버스 01A/01B, 충무로역), Day 2는 서쪽에서 동쪽으로 걷는 동선으로 경복궁·북촌한옥마을(10:00–17:00)·인사동·광장시장(지하철 3호선 안국역·1호선 종로5가역)을 묶었어요. Day 3는 경춘선(상봉·청량리)·ITX-청춘(용산역)으로 가평 당일치기 코스를 다녀오거나(김유정역 레일바이크 → 가평나루 → 남이섬), 선택 B로 지하철 1호선 수원역에서 수원화성으로 이동해요. Day 4는 선택 A로 홍대·연남동(홍대입구역 AREX 일반열차) 또는 선택 B로 성수·한강공원(2호선 성수역)을 둘러본 뒤 공항으로 향해요. 한강 이남의 강남은 이번 일정에 포함하지 않았어요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#102A2B">서울 3박 4일: 하루 한 권역씩, 시내 이동 최소화</text>
  <text x="60" y="100" font-size="19" fill="#5C6B6B">Seoul in 4 days · 권역 약도 (실제 축척 아님)</text>

