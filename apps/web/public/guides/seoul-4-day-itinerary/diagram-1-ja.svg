<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Noto Sans KR','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ソウル3泊4日モデルコース エリア別ルート図 / Seoul four-day itinerary by area</title>
  <desc id="desc">簡略化したソウルのエリア模式図（非縮尺）。仁川空港からはAREX直通列車（43〜51分）でソウル駅へ、普通列車で弘大入口駅へ結ばれています。Day 1は明洞と南山（Nソウルタワー夜景・南山循環バス01A／01B・忠武路駅）。Day 2は西から東へ徒歩で景福宮、北村韓屋村（10:00〜17:00）、仁寺洞、広蔵市場を巡ります（地下鉄3号線安国駅・1号線鐘路5街駅）。Day 3は郊外の加平へ日帰りし、金裕貞駅の江村レールバイクから加平船着場を経て南怡島へ（京春線／龍山駅発着ITX-青春）、または代替プランとして地下鉄1号線水原駅からバス・タクシーで水原華城へ向かいます。Day 4はプランA（弘大・延南洞、弘大入口駅からAREX普通列車）またはプランB（聖水・漢江公園、地下鉄2号線聖水駅）を楽しんでから空港へ移動します。江南は漢江の南側に位置するため、今回のモデルコースには組み込んでいません。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">ソウル3泊4日　1日1エリア、市内の往復を最小限に</text>
  <text x="60" y="102" font-size="20" fill="#5C6B6B">Seoul in four days · イメージ図（非縮尺）</text>

