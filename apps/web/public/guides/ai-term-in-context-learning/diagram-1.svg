<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">當場適應，不等於永久改寫模型</title>
<desc id="desc">規則與示範進入當次上下文，用來判斷新書描述；參數保留原狀，另用反例檢查是否只模仿表面。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">當場適應，不等於永久改寫模型</text><text x="60" y="84" font-size="18" fill="#5C6B6B">In-context Learning · 自訂書籍標籤</text><path d="M500 270 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1030 270 H1150" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M825 370 V570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="90" y="180" width="410" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="295" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">規則與示範</text><text x="295" y="312" text-anchor="middle" font-size="25" fill="#5C6B6B">葉：短讀／山：連讀</text><rect x="620" y="180" width="410" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="825" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">新書描述</text><text x="825" y="312" text-anchor="middle" font-size="25" fill="#5C6B6B">依上下文判斷</text><rect x="1160" y="180" width="350" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">分類結果</text><text x="1335" y="312" text-anchor="middle" font-size="25" fill="#5C6B6B">葉、山或不足</text><rect x="620" y="580" width="410" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="825" y="662" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">反例測試</text><text x="825" y="712" text-anchor="middle" font-size="25" fill="#5C6B6B">長描述也可能短讀</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
