  <text x="410" y="150" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">돼지국밥　豬肉湯飯・濃湯版</text>

  <!-- right column header: 돼지곰탕 -->
  <rect x="820" y="110" width="740" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1190" y="150" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">돼지곰탕　豬骨清湯・清湯版</text>

