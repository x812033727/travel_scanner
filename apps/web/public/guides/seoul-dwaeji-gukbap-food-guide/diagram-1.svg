<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾돼지국밥與돼지곰탕：菜單上兩種碗怎麼分 / Seoul menus: dwaeji-gukbap vs. dwaeji-gomtang</title>
  <desc id="desc">圖的標題是「首爾菜單上兩種碗，怎麼分」。左欄是돼지국밥（豬肉湯飯），標「濃湯版」：湯是豬骨熬成的濃湯，出自 KTO 繁體中文料理頁；碗裡是飯＋切成薄片的豬肉，同樣出自 KTO 繁體中文料理頁；官方把它算成釜山的地方美食，出自 KTO 繁中／英文料理頁。右欄是돼지곰탕（豬骨清湯），標「清湯版」：湯是清的豬湯，出自 VisitKorea 옥동식頁與 Visit Seoul 하우頁；碗裡是切成薄片的肉，出自 VisitKorea 옥동식頁；湯只用前腿與後腿的肉熬，同樣出自 VisitKorea 옥동식頁。下方橫排「菜單上還會看到」三格：수육（白切肉）是整塊煮熟後切成入口大小的肉；피순대（紅血腸）是豬皺胃裡塞豬血塊，血腸的一種；만두（餃子）是湯以外另外點的。圖下方寫：菜單用語整理自韓國觀光公社（KTO）與首爾觀光財團（Visit Seoul）官方頁，逐店依據見正文表格。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">首爾菜單上兩種碗，怎麼分</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Seoul menus: dwaeji-gukbap vs. dwaeji-gomtang</text>

  <!-- left column header: 돼지국밥 -->
  <rect x="40" y="104" width="740" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="132" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">돼지국밥　豬肉湯飯</text>
  <text x="410" y="156" font-size="15" fill="#0B4F4D" text-anchor="middle">濃湯版</text>

  <!-- right column header: 돼지곰탕 -->
  <rect x="820" y="104" width="740" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1190" y="132" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">돼지곰탕　豬骨清湯</text>
  <text x="1190" y="156" font-size="15" fill="#1F4E73" text-anchor="middle">清湯版</text>

  <!-- center divider -->
  <line x1="800" y1="104" x2="800" y2="560" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- left column: 3 boxes -->
  <rect x="40" y="188" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="232" font-size="23" font-weight="700" fill="#102A2B">湯：豬骨熬成的濃湯</text>
  <text x="70" y="264" font-size="15" fill="#5C6B6B">KTO 繁體中文料理頁</text>

  <rect x="40" y="316" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="360" font-size="23" font-weight="700" fill="#102A2B">碗裡：飯＋切成薄片的豬肉</text>
  <text x="70" y="392" font-size="15" fill="#5C6B6B">KTO 繁體中文料理頁</text>

  <rect x="40" y="444" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="488" font-size="23" font-weight="700" fill="#102A2B">官方把它算成：釜山的地方美食</text>
  <text x="70" y="520" font-size="15" fill="#5C6B6B">KTO 繁中／英文料理頁</text>

  <!-- right column: 3 boxes -->
  <rect x="820" y="188" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="232" font-size="23" font-weight="700" fill="#102A2B">湯：清的豬湯</text>
  <text x="850" y="264" font-size="15" fill="#5C6B6B">VisitKorea 옥동식頁、Visit Seoul 하우頁</text>

  <rect x="820" y="316" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="360" font-size="23" font-weight="700" fill="#102A2B">碗裡：切成薄片的肉</text>
  <text x="850" y="392" font-size="15" fill="#5C6B6B">VisitKorea 옥동식頁</text>

  <rect x="820" y="444" width="740" height="110" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="488" font-size="23" font-weight="700" fill="#102A2B">湯只用前腿與後腿的肉熬</text>
  <text x="850" y="520" font-size="15" fill="#5C6B6B">VisitKorea 옥동식頁</text>

  <!-- bottom band label -->
  <text x="40" y="600" font-size="20" font-weight="700" fill="#102A2B">菜單上還會看到</text>

  <!-- bottom band: 3 boxes, no arrows -->
  <rect x="40" y="616" width="480" height="150" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="280" y="668" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">수육　白切肉</text>
  <text x="280" y="702" font-size="16" fill="#5C6B6B" text-anchor="middle">整塊煮熟後切成入口大小的肉</text>

  <rect x="540" y="616" width="480" height="150" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="780" y="668" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">피순대　紅血腸</text>
  <text x="780" y="702" font-size="16" fill="#5C6B6B" text-anchor="middle">豬皺胃裡塞豬血塊，血腸的一種</text>

  <rect x="1040" y="616" width="480" height="150" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="1280" y="668" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">만두　餃子</text>
  <text x="1280" y="702" font-size="16" fill="#5C6B6B" text-anchor="middle">湯以外另外點的</text>

  <!-- footer -->
  <text x="60" y="820" font-size="16" fill="#102A2B">菜單用語整理自韓國觀光公社（KTO）與首爾觀光財團（Visit Seoul）官方頁，逐店依據見正文表格。</text>
