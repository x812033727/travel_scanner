  <text x="780" y="732" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">피순대　紅血腸</text>
  <text x="780" y="770" font-size="16" fill="#5C6B6B" text-anchor="middle">豬皺胃裡塞豬血塊，血腸的一種</text>

  <rect x="1040" y="672" width="480" height="138" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="1280" y="732" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">만두　餃子</text>
