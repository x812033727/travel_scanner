<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾돼지국밥與돼지곰탕：菜單上兩種碗怎麼分 / Seoul menus: dwaeji-gukbap vs. dwaeji-gomtang</title>
  <desc id="desc">圖上的標題是「首爾菜單上兩種碗，怎麼分」，副標是「Seoul menus: dwaeji-gukbap vs. dwaeji-gomtang」。圖分左右兩欄，中間一條虛線隔開。左欄的欄頭寫「돼지국밥　豬肉湯飯・濃湯版」，下面三個方框由上而下寫：湯是豬骨熬六個小時以上的濃湯；碗裡是飯加切成薄片的豬肉；本來是釜山的地方美食。右欄的欄頭寫「돼지곰탕　豬骨清湯・清湯版」，下面三個方框由上而下寫：湯是清的豬湯；碗裡是切成薄片的肉；首爾菜單上多出來的寫法。兩欄下方橫跨整張圖的一個長條寫「一家店的招牌只會是其中一種：先決定要濃湯還是清湯，再挑店」。再下面一排的標題是「菜單上還會看到」，三個方框：수육（白切肉）是整塊煮熟後切成入口大小的肉；피순대（紅血腸）是豬皺胃裡塞豬血塊，血腸的一種；만두（餃子）是湯以外另外點的。菜名照韓文寫，方便對照菜單。左下角是「資料：KTO・Visit Seoul」，右下角是「© Mokaair 製圖 2026」。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

