  <rect x="40" y="192" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="250" font-size="23" font-weight="700" fill="#102A2B">湯：豬骨熬六個小時以上的濃湯</text>

  <rect x="40" y="302" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="360" font-size="23" font-weight="700" fill="#102A2B">碗裡：飯＋切成薄片的豬肉</text>

  <rect x="40" y="412" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="470" font-size="23" font-weight="700" fill="#102A2B">本來是釜山的地方美食</text>

  <!-- right column: 3 boxes -->
  <rect x="820" y="192" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="250" font-size="23" font-weight="700" fill="#102A2B">湯：清的豬湯</text>

  <rect x="820" y="302" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="360" font-size="23" font-weight="700" fill="#102A2B">碗裡：切成薄片的肉</text>

  <rect x="820" y="412" width="740" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="850" y="470" font-size="23" font-weight="700" fill="#102A2B">首爾菜單上多出來的寫法</text>

  <!-- what the two columns add up to, across the whole width -->
