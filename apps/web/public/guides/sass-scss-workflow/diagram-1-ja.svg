<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Sass のソース、コンパイル、出力</title><desc id="desc">四枚のカードで SCSS ソース、モジュールの読み込み、Dart Sass のコンパイル、CSS のページ確認を説明し、日常の編集はソースに戻って行うよう促しています。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Sass のソース、コンパイル、出力</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">独自のボードゲームイベントサイトの流れ：共通設定から実際のページまで追跡可能に</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">ソース</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">SCSS と共通設定</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">命名の説明を残す</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">モジュール</text>
<text x="477.0" y="371" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">use で必要なメンバーを読み込む</text>
<text x="477.0" y="423" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">forward で公開入口を整理</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">コンパイル</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Dart Sass で出力</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">警告・エラーに対応</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">検証</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">CSS の URL と規則</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">実際のページも確認</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">ソースを編集し、再コンパイルし、ページを確認する。この三つを終えて初めて、変更がサイトに実際に反映されます。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
