<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">FCA, 런던의 불법 개인 간 가상자산 거래 단속: 조치일 9월 10일, 발표일 9월 17일</title><desc id="desc">오리지널 일러스트: 왼쪽에는 금지 기호(원에 사선)가 표시된 통지서가 있고, 오른쪽에는 두 개의 기하학적 인물 형상이 점선 양방향 화살표로 연결되어 개인 간 거래를 나타냅니다. 아래쪽 타임라인에는 두 개의 채워진 점이 있으며, 왼쪽은 조치일, 오른쪽은 발표일을 나타냅니다. 상표나 실존 인물은 포함되어 있지 않습니다.</desc>
