<title id="title">FCAがロンドンの違法なピアツーピア暗号資産取引を摘発：行動日は9月10日、公表日は9月17日</title><desc id="desc">オリジナルイラスト：左側に禁止マーク（円に斜線）の付いた通知書、右側に2つの幾何学的な人型が点線の双方向矢印でつながれ、ピアツーピア取引を表す。下部の時間軸には2つの実点があり、左が行動日、右が公表日を表す。商標や実在の人物は含まない。</desc>
