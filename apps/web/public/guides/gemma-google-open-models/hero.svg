<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">開放權重下載到自己的裝置 / Open weights downloaded to your own devices</title>
<desc id="desc">一張幾何插圖。畫面上方是一個圓角方塊，像一個檔案夾，裡面有三條長短不一的色條，代表可以下載的模型權重檔案。方塊下方分出三支箭頭，分別指向左邊的手機、中間的筆記型電腦與右邊的直立機殼，代表同一包權重可以在手機、筆電與工作站上執行。畫面下方寫著「下載權重，離線自己跑」。</desc>
