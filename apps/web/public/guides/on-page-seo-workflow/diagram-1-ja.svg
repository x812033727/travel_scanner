<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">記事単位のSEO編集手順</title><desc id="desc">読者の目的、本文の構成、ページ設定、操作確認の四段階と、各段階の三つの確認点を示す。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">記事単位のSEO編集手順</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">内容と実際の表示を整え、公開前に操作を確認する</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">読者の目的</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">状況と制約</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">達成すること</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">既存記事と照合</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">本文の構成</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">手順を順序立てる</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">比較に根拠を</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">例外を説明する</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">ページ設定</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">タイトルとURL</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">要約を別途確認</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">画像とリンク</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">操作を確認</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">スマホで読む</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">実行できるか</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">更新理由を記録</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">まず読者の疑問に答え、ページ設定が正しく表示されるか確かめる。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
