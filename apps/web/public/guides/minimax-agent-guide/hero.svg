<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一句話交給代理，長出網頁、報告與簡報 / One sentence in, three deliverables out</title>
  <desc id="desc">插圖：畫面左邊是一個大的白色對話框，裡面有四條長短不一的橫線，代表你打進去的一句話。對話框往右接出一條虛線路徑，路徑上有三個圓形節點，分別放著一個實心圓點、一個十字工具符號與一個綠色勾號，代表規劃、呼叫工具與檢查。路徑末端有一個箭頭指向右側三張斜向疊放的卡片：上面一張是淺藍色的網頁版面，中間一張是白色的文件，上面有四條文字線，下面一張是白色的簡報，裡面有三根高低不同的長條圖。畫面下方中央有一行字「一句話，交出成品」。整張圖使用米色底、深綠與藍色線條。</desc>
