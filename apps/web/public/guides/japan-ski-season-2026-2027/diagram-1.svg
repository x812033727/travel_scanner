<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026–27 日本雪季時間軸：2026 年 11 月到 2027 年 5 月 / Japan ski season 2026-27 timeline</title>
  <desc id="desc">橫向時間軸從 2026 年 11 月到 2027 年 5 月，每列一座雪場。實心橫條是官網已公告的 2026–27 期間：Niseko Grand Hirafu 與 Annupuri 11 月 28 日到 5 月 5 日、Niseko Village 到 4 月 4 日、Hanazono 到 4 月 11 日、留壽都 11 月 28 日到 3 月 31 日、富良野 11 月 28 日到 5 月 5 日、札幌國際 11 月 20 日到 5 月 5 日、手稻 11 月 21 日開放、結束日未公告。斜紋是上一季日期：手稻上季到 3 月 29 日，GALA 湯澤上季 12 月 20 日到 4 月 5 日。Niseko 全山券成人一日依日期分五個價格：初滑 8,800、一般 12,600、旺季 13,500、春滑 8,800、最後 6,300 日圓。白馬 Valley 開放日未公告，全山一日券 11,100 日圓。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <pattern id="hatchBlue" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2F6F9F" stroke-width="3"/></pattern>
    <pattern id="hatchPurple" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7E57C2" stroke-width="3"/></pattern>
  </defs>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">2026–27 日本雪季時間軸　11 月到 5 月</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Japan ski season 2026-27 · 實心＝官網已公告 2026–27 期間，斜紋＝上一季日期 · 2026 年 9 月 13 日查證</text>

