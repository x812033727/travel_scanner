<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<title id="title">인터뷰에서 목표 고객까지</title><desc id="desc">인터뷰 기록, 필요에 따른 고객군 분류, 목표 선택, 포지셔닝 검증을 네 칸에 보여 주며 페르소나에 근거의 출처와 미확인 가설을 남기라고 알리는 도해.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">인터뷰에서 목표 고객까지</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">과업과 장애물을 이해하고 근거로 세분화·선택·포지셔닝하기</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">인터뷰 기록</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">최근의 실제 사건</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">요약과 해석 분리</text>
<text x="108.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">익명 출처 남기기</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">필요별 분류</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">공통 과업과 제약</text>
<text x="477.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">반대 사례 찾기</text>
<text x="477.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">나이로만 나누지 않기</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">목표 선택</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">필요와 접점</text>
<text x="846.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">제공 역량과 시간</text>
<text x="846.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">당장의 우선순위</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">포지셔닝 검증</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">서비스와 경계 설명</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">이해한 내용 되묻기</text>
<text x="1215.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">가설 업데이트</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">페르소나는 경험을 이해하는 데 도움을 준다. 시장 규모와 지불 의사는 별도 검증이 필요하다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 제작 도해</text>
</svg>
