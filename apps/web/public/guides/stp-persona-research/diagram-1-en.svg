<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">From Interviews to a Target Customer</title><desc id="desc">Four columns show interview records, needs-based segments, target selection, and positioning tests, with a reminder to retain evidence sources and unverified assumptions in a persona.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">From Interviews to a Target Customer</text>
<text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">Understand tasks and barriers; use evidence to segment, target, and position</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Interview records</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Recent real event</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Facts versus views</text>
<text x="108.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Anonymous source ID</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Needs segments</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Shared tasks and limits</text>
<text x="477.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Seek counterexamples</text>
<text x="477.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Age is not enough</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Target selection</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Needs and reach</text>
<text x="846.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Capacity and time</text>
<text x="846.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Near-term priority</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Positioning test</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Offer and boundaries</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Ask for a retelling</text>
<text x="1215.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Revise assumptions</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Personas explain experience; validate market size and willingness to pay separately.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair graphic</text>
</svg>
