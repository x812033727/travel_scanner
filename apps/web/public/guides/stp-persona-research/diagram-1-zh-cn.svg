<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="title">从访谈到服务对象</title><desc id="desc">四栏呈现访谈记录、需求分群、目标选择及定位验证，并提醒用户画像保留证据来源与未确认假设。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">从访谈到服务对象</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">先理解任务与阻碍，再把证据带入分群、选择与定位</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">访谈记录</text>
<text x="108.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">最近的真实事件</text>
<text x="108.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">分开摘要与解读</text>
<text x="108.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">保留匿名来源</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">需求分群</text>
<text x="477.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">共同任务与限制</text>
<text x="477.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">找出相反情况</text>
<text x="477.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">不只依年龄分类</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">目标选择</text>
<text x="846.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">需求与接触方式</text>
<text x="846.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">交付能力及工时</text>
<text x="846.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">决定近期优先群</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">定位验证</text>
<text x="1215.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">说明服务与界线</text>
<text x="1215.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">请对方理解重述</text>
<text x="1215.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">更新用户画像假设</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">用户画像帮助理解经验；市场规模与付费意愿仍需另外验证。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
