<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">先規劃、再實作、最後驗證 / Plan, implement, verify</title>
  <desc id="desc">插圖：三個大圓角方塊由左至右排成一列，之間有粗箭頭相連。左邊的方塊裡有三條長短不一的橫條，代表一份計畫；中間的方塊裡有一對面對面的角括號，代表寫程式；右邊的方塊裡有一個大勾號，代表通過驗證。一條橘色的粗曲線從右邊方塊底部繞到左邊方塊底部並向上指，代表驗證沒過時退回前面重來。下方一行大字寫著「先規劃 再實作 最後驗證」。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
    </marker>
    <marker id="tipback" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- stage one: a plan -->
  <rect x="290" y="200" width="260" height="260" rx="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10"/>
  <rect x="330" y="288" width="180" height="22" rx="11" fill="#0D6B68"/>
  <rect x="330" y="320" width="150" height="22" rx="11" fill="#0D6B68"/>
  <rect x="330" y="352" width="110" height="22" rx="11" fill="#0D6B68"/>

  <!-- stage two: writing code -->
  <rect x="670" y="200" width="260" height="260" rx="40" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10"/>
  <polyline points="768,286 722,330 768,374" fill="none" stroke="#2F6F9F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="832,286 878,330 832,374" fill="none" stroke="#2F6F9F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stage three: it passes -->
  <rect x="1050" y="200" width="260" height="260" rx="40" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="10"/>
  <polyline points="1108,336 1160,388 1252,278" fill="none" stroke="#2E7D5B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- forward -->
  <line x1="566" y1="330" x2="648" y2="330" stroke="#5C6B6B" stroke-width="10" marker-end="url(#tip)"/>
  <line x1="946" y1="330" x2="1028" y2="330" stroke="#5C6B6B" stroke-width="10" marker-end="url(#tip)"/>

  <!-- back to the start when the check fails -->
  <path d="M 1180 468 Q 1180 592 1060 592 L 540 592 Q 420 592 420 486" fill="none" stroke="#D97A2B" stroke-width="10" stroke-linecap="round" marker-end="url(#tipback)"/>

  <text x="800" y="775" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">先規劃　再實作　最後驗證</text>
</svg>
