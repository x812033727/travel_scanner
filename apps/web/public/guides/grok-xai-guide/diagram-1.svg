<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Grok 的三個入口對照 / Three ways in to Grok</title>
  <desc id="desc">三欄對照。左欄是 X 裡的 Grok：用 X 帳號，適用 X 隱私政策與 X 服務條款，方案是 X Premium，台灣月費 Basic 新台幣 91.88 元、Premium 新台幣 245 元、Premium+ 新台幣 1,309 元，訓練開關在 X 設定的隱私與安全、資料分享與個人化、Grok 與第三方協作者。中欄是 grok.com 網頁：用 Grok 自己的帳號，可連 X 登入，適用 Grok 的隱私政策與服務條款，方案每月美元 Free 0 元、SuperGrok 30 元、SuperGrok Plus 100 元，訓練開關在個人檔案、設定、Data Controls，比較表的模型那列寫 Grok 4.6。右欄是 iOS 與 Android App：與網頁同一個帳號與同一份訂閱，訂閱綁在購買時的登入方式，開關同樣在 Data Controls，台灣的 App Store 與 Google Play 都查得到。最下方一列提醒：刪除對話或帳號後官方寫 30 天內從系統刪除，法律、法遵或安全需要除外，X 那側與 Grok 那側要分別刪。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="56" y="52" font-size="30" font-weight="bold" fill="#102A2B">Grok 的三個入口：帳號、條款與開關各走各的</text>
  <text x="56" y="84" font-size="18" fill="#5C6B6B">Three ways in to Grok: account, terms, plan and the training switch</text>

  <!-- column A -->
  <rect x="56" y="118" width="460" height="578" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="84" y="166" font-size="24" font-weight="bold" fill="#0D6B68">X 裡的 Grok</text>
  <rect x="84" y="182" width="404" height="3" fill="#0D6B68"/>
  <text x="84" y="210" font-size="17" fill="#5C6B6B">帳號</text>
  <text x="84" y="238" font-size="17" fill="#102A2B">X 帳號</text>
  <text x="84" y="282" font-size="17" fill="#5C6B6B">適用條款</text>
  <text x="84" y="310" font-size="17" fill="#102A2B">X 隱私政策與 X 服務條款</text>
  <text x="84" y="354" font-size="17" fill="#5C6B6B">方案（X Premium，台灣月費）</text>
  <text x="84" y="382" font-size="17" fill="#102A2B">Basic NT$91.88、Premium NT$245</text>
  <text x="84" y="408" font-size="17" fill="#102A2B">Premium+ NT$1,309</text>
  <text x="84" y="452" font-size="17" fill="#5C6B6B">訓練開關</text>
  <text x="84" y="480" font-size="17" fill="#102A2B">X 設定 → 隱私與安全</text>
  <text x="84" y="506" font-size="17" fill="#102A2B">→ 資料分享與個人化</text>
  <text x="84" y="532" font-size="17" fill="#102A2B">→ Grok 與第三方協作者</text>
  <text x="84" y="576" font-size="17" fill="#5C6B6B">供應範圍</text>
  <text x="84" y="604" font-size="17" fill="#102A2B">X 有上線的國家就有</text>

  <!-- column B -->
  <rect x="570" y="118" width="460" height="578" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="598" y="166" font-size="24" font-weight="bold" fill="#2F6F9F">grok.com 網頁</text>
  <rect x="598" y="182" width="404" height="3" fill="#2F6F9F"/>
  <text x="598" y="210" font-size="17" fill="#5C6B6B">帳號</text>
  <text x="598" y="238" font-size="17" fill="#102A2B">Grok 自己的帳號（可連 X 登入）</text>
  <text x="598" y="282" font-size="17" fill="#5C6B6B">適用條款</text>
  <text x="598" y="310" font-size="17" fill="#102A2B">Grok 隱私政策與服務條款</text>
  <text x="598" y="354" font-size="17" fill="#5C6B6B">方案（每月，美元）</text>
  <text x="598" y="382" font-size="17" fill="#102A2B">Free $0、SuperGrok $30</text>
  <text x="598" y="408" font-size="17" fill="#102A2B">SuperGrok Plus $100</text>
  <text x="598" y="452" font-size="17" fill="#5C6B6B">訓練開關</text>
  <text x="598" y="480" font-size="17" fill="#102A2B">個人檔案 → 設定</text>
  <text x="598" y="506" font-size="17" fill="#102A2B">→ Data Controls</text>
  <text x="598" y="532" font-size="17" fill="#102A2B">（登入之後才選得到）</text>
  <text x="598" y="576" font-size="17" fill="#5C6B6B">模型</text>
  <text x="598" y="604" font-size="17" fill="#102A2B">比較表那一列寫 Grok 4.6</text>

  <!-- column C -->
  <rect x="1084" y="118" width="460" height="578" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1112" y="166" font-size="24" font-weight="bold" fill="#D97A2B">iOS／Android App</text>
  <rect x="1112" y="182" width="404" height="3" fill="#D97A2B"/>
  <text x="1112" y="210" font-size="17" fill="#5C6B6B">帳號</text>
  <text x="1112" y="238" font-size="17" fill="#102A2B">與網頁同一個帳號</text>
  <text x="1112" y="282" font-size="17" fill="#5C6B6B">適用條款</text>
  <text x="1112" y="310" font-size="17" fill="#102A2B">同 grok.com 那一份</text>
  <text x="1112" y="354" font-size="17" fill="#5C6B6B">方案</text>
  <text x="1112" y="382" font-size="17" fill="#102A2B">與網頁同一份訂閱</text>
  <text x="1112" y="408" font-size="17" fill="#102A2B">訂閱綁在購買時的登入方式</text>
  <text x="1112" y="452" font-size="17" fill="#5C6B6B">訓練開關</text>
  <text x="1112" y="480" font-size="17" fill="#102A2B">同樣在 Data Controls</text>
  <text x="1112" y="506" font-size="17" fill="#102A2B">（設定跨平台同步）</text>
  <text x="1112" y="576" font-size="17" fill="#5C6B6B">台灣</text>
  <text x="1112" y="604" font-size="17" fill="#102A2B">App Store 與 Google Play</text>
  <text x="1112" y="630" font-size="17" fill="#102A2B">台灣區都查得到</text>

  <path d="M286 700 L286 738" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 700 L800 738" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1314 700 L1314 738" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="56" y="754" width="1488" height="86" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="800" y="790" font-size="19" font-weight="bold" fill="#B8442D" text-anchor="middle">刪除與留存：官方寫刪掉的對話或帳號在 30 天內從系統刪除（法律、法遵或安全需要除外）</text>
  <text x="800" y="818" font-size="17" fill="#102A2B" text-anchor="middle">X 那側刪的是 Grok on X 的紀錄，Grok 那側刪的是自己帳號的紀錄，要分別刪</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
