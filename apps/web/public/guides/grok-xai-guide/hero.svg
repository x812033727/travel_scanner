<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">三個入口通往同一個助手 / Three doors, one assistant</title>
  <desc id="desc">插圖。左側由上到下有三塊圓角方塊，分別是綠色、藍色與橘色，代表三個入口；三條粗曲線從方塊出發，一起匯進畫面中央的一個大對話框，對話框裡有三條代表文字的橫條。對話框右邊上下各有一個開關符號，上面那個是開啟狀態、下面那個是關閉狀態，代表兩個入口的資料開關要分別設定。畫面下方有一行標題文字「三個入口，一個帳號」。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <path d="M250 260 C 430 260 470 380 620 390" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <path d="M250 450 C 430 450 470 430 620 428" fill="none" stroke="#2F6F9F" stroke-width="12" stroke-linecap="round"/>
  <path d="M250 640 C 430 640 470 480 620 466" fill="none" stroke="#D97A2B" stroke-width="12" stroke-linecap="round"/>

  <rect x="110" y="200" width="150" height="120" rx="26" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10"/>
  <circle cx="185" cy="260" r="26" fill="#0D6B68"/>
  <rect x="110" y="390" width="150" height="120" rx="26" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10"/>
  <rect x="159" y="424" width="52" height="52" rx="12" fill="#2F6F9F"/>
  <rect x="110" y="580" width="150" height="120" rx="26" fill="#FFFFFF" stroke="#D97A2B" stroke-width="10"/>
  <rect x="163" y="606" width="44" height="68" rx="14" fill="#D97A2B"/>

  <path d="M620 250 L1030 250 A 40 40 0 0 1 1070 290 L1070 530 A 40 40 0 0 1 1030 570 L740 570 L664 648 L676 570 L620 570 A 40 40 0 0 1 580 530 L580 290 A 40 40 0 0 1 620 250 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="10" stroke-linejoin="round"/>
  <rect x="640" y="318" width="360" height="26" rx="13" fill="#0D6B68"/>
  <rect x="640" y="388" width="300" height="26" rx="13" fill="#5C6B6B"/>
  <rect x="640" y="458" width="230" height="26" rx="13" fill="#5C6B6B"/>

  <rect x="1200" y="286" width="210" height="96" rx="48" fill="#2E7D5B" stroke="#102A2B" stroke-width="8"/>
  <circle cx="1362" cy="334" r="30" fill="#FFFFFF"/>
  <rect x="1200" y="446" width="210" height="96" rx="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
  <circle cx="1248" cy="494" r="30" fill="#B8442D"/>

  <text x="800" y="800" text-anchor="middle" font-size="58" font-weight="bold" fill="#102A2B">三個入口，一個帳號</text>
</svg>
