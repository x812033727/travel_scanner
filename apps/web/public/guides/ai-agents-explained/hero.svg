<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 代理：從回答到動手 / An AI agent: from answering to acting</title>
  <desc id="desc">米色底上有一個白色的大對話泡泡，泡泡裡寫著「從回答到動手」。泡泡長出三隻深色的手臂：左邊一隻舉著藍色的放大鏡，代表搜尋與閱讀；右邊一隻握著橘色的扳手，代表動手修改與執行；右下一隻扶著綠色的日曆，代表行事曆與排程。背景有幾個淡色的圓形做裝飾。整張圖用簡單幾何表達 AI 代理從只會回答問題，變成拿著工具替你做事。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <circle cx="150" cy="720" r="110" fill="#E3F0EF"/>
  <circle cx="1440" cy="150" r="130" fill="#E6F0F7"/>
  <circle cx="1330" cy="820" r="60" fill="#FBEEE2"/>
  <circle cx="330" cy="120" r="46" fill="#FBEEE2"/>

  <!-- arms (drawn under the bubble so the joints are hidden) -->
  <path d="M 450 400 L 330 430 L 300 330" fill="none" stroke="#102A2B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1150 400 L 1290 440 L 1350 330" fill="none" stroke="#102A2B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1060 580 L 1140 690 L 1215 725" fill="none" stroke="#102A2B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- magnifying glass (left hand) -->
  <path d="M 300 330 L 245 275" stroke="#2F6F9F" stroke-width="22" stroke-linecap="round"/>
  <circle cx="205" cy="235" r="62" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="20"/>
  <path d="M 170 205 A 46 46 0 0 1 220 190" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- wrench (right hand) -->
  <g transform="translate(1350,330) rotate(-35)">
    <rect x="-24" y="-190" width="48" height="230" rx="24" fill="#D97A2B"/>
    <circle cx="0" cy="-210" r="64" fill="#D97A2B"/>
    <rect x="-20" y="-300" width="40" height="86" rx="6" fill="#F7F1E8"/>
  </g>

  <!-- calendar (lower right hand) -->
  <rect x="1220" y="640" width="210" height="190" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="14"/>
  <path d="M 1240 640 H 1410 A 20 20 0 0 1 1430 660 V 700 H 1220 V 660 A 20 20 0 0 1 1240 640 Z" fill="#2E7D5B"/>
  <rect x="1262" y="618" width="18" height="46" rx="9" fill="#102A2B"/>
  <rect x="1370" y="618" width="18" height="46" rx="9" fill="#102A2B"/>
  <circle cx="1262" cy="740" r="11" fill="#2E7D5B"/>
  <circle cx="1325" cy="740" r="11" fill="#2E7D5B"/>
  <circle cx="1388" cy="740" r="11" fill="#2E7D5B"/>
  <circle cx="1262" cy="790" r="11" fill="#2E7D5B"/>
  <circle cx="1325" cy="790" r="11" fill="#D97A2B"/>

  <!-- speech bubble -->
  <path d="M 490 170 H 1110 A 60 60 0 0 1 1170 230 V 530 A 60 60 0 0 1 1110 590 H 700 L 570 700 L 610 590 H 490 A 60 60 0 0 1 430 530 V 230 A 60 60 0 0 1 490 170 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="14" stroke-linejoin="round"/>
  <circle cx="560" cy="260" r="16" fill="#0D6B68"/>
  <circle cx="610" cy="260" r="16" fill="#D97A2B"/>
  <circle cx="660" cy="260" r="16" fill="#2F6F9F"/>
  <text x="800" y="410" font-size="64" font-weight="700" fill="#102A2B" text-anchor="middle">從回答到動手</text>
  <path d="M 560 480 H 1040" stroke="#E3F0EF" stroke-width="18" stroke-linecap="round"/>
  <path d="M 560 525 H 900" stroke="#E3F0EF" stroke-width="18" stroke-linecap="round"/>
</svg>
