<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">長照保障的三種認定判準，與政府長照服務這個底層 / Three benefit tests for long-term care cover, and the public service beneath them</title>
  <desc id="desc">上排三個並排的方框，比較三種商業保險結構的認定方式。左框是長期照顧保險：依據保單條款定義的「長期照顧狀態」，由醫院專科醫師診斷判定、保險公司依條款核定，常見門檻是六項日常生活自理能力持續存有三項含以上障礙，或臨床失智量表評估達中度以上。中框是失能保險：依據條款附表所列的失能程度與等級，由醫院專科醫師出具失能診斷書、保險公司依條款核定，常見門檻是對得上附表的某一等級，再按該等級的給付比例計算。右框是特定傷病保險：依據條款列舉的疾病項目與嚴重程度定義，由醫院專科醫師診斷確定、保險公司依條款核定，常見門檻是病名在清單內且達條款寫明的嚴重程度。三個方框下方各有一條向下的箭頭，連到橫貫全圖的底層橫欄：政府長照服務，依長期照顧服務法與長期照顧服務申請及給付辦法，由照管中心評估後核定長照需要等級與給付額度，使用者依身分別自行負擔一定比率，超過核定額度的部分自行負擔，並依公告期間複評後重新核定。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">三種結構的判準對照，與底下共用的政府長照服務</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three different benefit tests, over one shared public long-term care service</text>

  <rect x="60" y="125" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="300" y="168" font-size="22" font-weight="bold" fill="#0D6B68" text-anchor="middle">長期照顧保險</text>
  <line x1="88" y1="190" x2="512" y2="190" stroke="#0D6B68" stroke-width="2"/>
  <text x="88" y="226" font-size="17" fill="#5C6B6B">依據什麼認定</text>
  <text x="88" y="254" font-size="19" fill="#102A2B">保單條款定義的</text>
  <text x="88" y="278" font-size="19" fill="#102A2B">「長期照顧狀態」</text>
  <text x="88" y="322" font-size="17" fill="#5C6B6B">誰認定</text>
  <text x="88" y="350" font-size="19" fill="#102A2B">醫院專科醫師診斷判定</text>
  <text x="88" y="374" font-size="19" fill="#102A2B">保險公司依條款核定</text>
  <text x="88" y="418" font-size="17" fill="#5C6B6B">常見門檻</text>
  <text x="88" y="446" font-size="19" fill="#102A2B">六項日常生活自理能力</text>
  <text x="88" y="470" font-size="19" fill="#102A2B">持續存有三項含以上障礙</text>
  <text x="88" y="494" font-size="19" fill="#102A2B">或失智量表達中度以上</text>

  <rect x="560" y="125" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="168" font-size="22" font-weight="bold" fill="#2F6F9F" text-anchor="middle">失能保險</text>
  <line x1="588" y1="190" x2="1012" y2="190" stroke="#2F6F9F" stroke-width="2"/>
  <text x="588" y="226" font-size="17" fill="#5C6B6B">依據什麼認定</text>
  <text x="588" y="254" font-size="19" fill="#102A2B">條款附表所列的</text>
  <text x="588" y="278" font-size="19" fill="#102A2B">失能程度與等級</text>
  <text x="588" y="322" font-size="17" fill="#5C6B6B">誰認定</text>
  <text x="588" y="350" font-size="19" fill="#102A2B">醫院專科醫師出具</text>
  <text x="588" y="374" font-size="19" fill="#102A2B">失能診斷書</text>
  <text x="588" y="418" font-size="17" fill="#5C6B6B">常見門檻</text>
  <text x="588" y="446" font-size="19" fill="#102A2B">對得上附表的某一等級</text>
  <text x="588" y="470" font-size="19" fill="#102A2B">再按該等級的給付比例</text>
  <text x="588" y="494" font-size="19" fill="#102A2B">計算保險金</text>

  <rect x="1060" y="125" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1300" y="168" font-size="22" font-weight="bold" fill="#D97A2B" text-anchor="middle">特定傷病保險</text>
  <line x1="1088" y1="190" x2="1512" y2="190" stroke="#D97A2B" stroke-width="2"/>
  <text x="1088" y="226" font-size="17" fill="#5C6B6B">依據什麼認定</text>
  <text x="1088" y="254" font-size="19" fill="#102A2B">條款列舉的疾病項目</text>
  <text x="1088" y="278" font-size="19" fill="#102A2B">與嚴重程度定義</text>
  <text x="1088" y="322" font-size="17" fill="#5C6B6B">誰認定</text>
  <text x="1088" y="350" font-size="19" fill="#102A2B">醫院專科醫師診斷確定</text>
  <text x="1088" y="374" font-size="19" fill="#102A2B">保險公司依條款核定</text>
  <text x="1088" y="418" font-size="17" fill="#5C6B6B">常見門檻</text>
  <text x="1088" y="446" font-size="19" fill="#102A2B">病名在條款清單內</text>
  <text x="1088" y="470" font-size="19" fill="#102A2B">且達條款寫明的</text>
  <text x="1088" y="494" font-size="19" fill="#102A2B">嚴重程度</text>

  <line x1="300" y1="549" x2="300" y2="618" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="800" y1="549" x2="800" y2="618" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1300" y1="549" x2="1300" y2="618" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="60" y="632" width="1480" height="190" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="678" font-size="24" font-weight="bold" fill="#2E7D5B" text-anchor="middle">底層：政府長照服務（所有人共用）</text>
  <line x1="88" y1="700" x2="1512" y2="700" stroke="#2E7D5B" stroke-width="2"/>
  <text x="800" y="734" font-size="17" fill="#5C6B6B" text-anchor="middle">依長期照顧服務法與長期照顧服務申請及給付辦法</text>
  <text x="800" y="766" font-size="19" fill="#102A2B" text-anchor="middle">照管中心評估　→　核定長照需要等級與給付額度　→　依身分別自行負擔一定比率</text>
  <text x="800" y="798" font-size="19" fill="#B8442D" text-anchor="middle">超過核定額度的部分自行負擔；依公告期間複評後重新核定</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
