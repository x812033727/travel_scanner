<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">三種門檻與一個共用底層 / Three thresholds over one shared base</title>
  <desc id="desc">抽象插圖。上方置中一行短標題「三種門檻」。下面三個大小相同的白底圓角方塊並排，各有一種顏色的外框，方塊裡各畫一個抽象符號：左邊是排成兩列的六個圓點，上列三個實心、下列三個空心；中間是一條水平量尺，下方有五個等高刻度，上方一個小方塊標示落在中央刻度的位置；右邊是一張夾板清單，夾板上方有一個小夾片，板面上有三條等長的橫線。三個方塊底部各有一條短垂直線向下，連到下方的底座；底座由一個較厚的圓角長條與其後方一個更寬的薄長條疊成，薄長條在左右兩側對稱露出。全圖沒有人物、沒有折線圖，也沒有任何機構標誌。</desc>
