<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">生成波形之後，還要確認聽眾收到的意思</title>
<desc id="desc">文字到語音的示意流程，並將發音、韻律與實際播放分成三種驗收</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">生成波形之後，還要確認聽眾收到的意思</text><text x="60" y="84" font-size="18" fill="#5C6B6B">TTS｜以文字、頻譜、聲碼器為架構示例</text><path d="M470 240H605" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M995 240H1130" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1325 315V440H275V585" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M800 440V585" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1325 440V585" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="165" width="390" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="232" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">文字表示</text><text x="275" y="282" text-anchor="middle" font-size="25" fill="#5C6B6B">確認朗讀方式</text><rect x="605" y="165" width="390" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="232" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">聲學表示</text><text x="800" y="282" text-anchor="middle" font-size="25" fill="#5C6B6B">例如梅爾頻譜</text><rect x="1130" y="165" width="390" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="232" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">聲碼器輸出</text><text x="1325" y="282" text-anchor="middle" font-size="25" fill="#5C6B6B">可播放的波形</text><rect x="80" y="585" width="390" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="275" y="649.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">發音</text><text x="275" y="699.5" text-anchor="middle" font-size="25" fill="#5C6B6B">地名、編號與多音字</text><rect x="605" y="585" width="390" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="649.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">韻律</text><text x="800" y="699.5" text-anchor="middle" font-size="25" fill="#5C6B6B">轉折、重音與停頓</text><rect x="1130" y="585" width="390" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1325" y="649.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">實際播放</text><text x="1325" y="699.5" text-anchor="middle" font-size="25" fill="#5C6B6B">設備、音量與版本</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
