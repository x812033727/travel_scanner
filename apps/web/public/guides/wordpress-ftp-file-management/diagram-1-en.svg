<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Four checks for SFTP changes</title><desc id="desc">Four boxes show host verification, downloading the original file, a limited upload and public-site testing.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Four checks for SFTP changes</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">For a single-file replacement, keep recovery clues at every step</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Host</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Protocol and directory</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Key fingerprint</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Original</text>
<text x="477.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Download and retain</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Full backup</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Change</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Check target path</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Check failed transfers</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Verify</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">Site and admin tests</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Restore if needed</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">File transfers handle files; posts, orders and settings still need a database backup.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
