  <rect x="356" y="286" width="272" height="196" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="492" y="316" font-size="18" font-weight="700" fill="#8A4A16" text-anchor="middle">免費版卡到了嗎？</text>
  <text x="380" y="346" font-size="16" fill="#B8442D">常卡</text>
  <text x="380" y="372" font-size="16" fill="#102A2B">Claude 免費版 5 小時內</text>
  <text x="380" y="398" font-size="16" fill="#102A2B">的訊息額度先用完</text>
  <text x="380" y="424" font-size="16" fill="#102A2B">ChatGPT 每天 3 個檔案</text>
  <text x="380" y="450" font-size="16" fill="#102A2B">改稿要長上下文</text>
  <path d="M 492 484 L 492 508" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="356" y="514" width="272" height="200" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="492" y="544" font-size="18" font-weight="700" fill="#1F5A40" text-anchor="middle">建議</text>
  <text x="380" y="574" font-size="16" fill="#102A2B">預算最低：ChatGPT Go</text>
  <text x="380" y="600" font-size="16" fill="#102A2B">美國 8 美元，或 AI Plus</text>
  <text x="380" y="626" font-size="16" fill="#102A2B">台幣 165 元</text>
