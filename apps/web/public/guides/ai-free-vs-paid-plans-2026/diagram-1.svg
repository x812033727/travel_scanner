  <text x="72" y="600" font-size="16" fill="#102A2B">三家都開帳號試一輪</text>
  <text x="72" y="626" font-size="16" fill="#102A2B">留最順手的一家</text>
  <text x="72" y="652" font-size="16" fill="#102A2B">偶爾要旗艦模型再看</text>
