  <!-- notes -->
  <text x="48" y="756" font-size="15" fill="#5C6B6B">上一階給每天大量使用的人：ChatGPT Pro 每月 100 或 200 美元、Claude Max 100 或 200 美元、Google AI Ultra 台幣 3,300 或 6,500 元；一般使用者先從入門方案開始。</text>
