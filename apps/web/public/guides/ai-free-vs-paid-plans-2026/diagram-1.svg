<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">要不要付費、付哪一家：五種使用者的決策圖 / Free or paid, and which one: a decision tree for five kinds of users</title>
  <desc id="desc">決策樹由上往下分三層。最上面一格：先用滿免費版兩週，再看你最常做什麼。第二層是五種情境，每種下面先問免費版卡到了嗎，再給建議。一、偶爾問問題：通常不會卡，ChatGPT 文字對話不限次數，Claude 與 Gemini 每 5 小時重置，三家免費版都能問；建議免費版就好，三家都開帳號試一輪，留最順手的一家，偶爾要旗艦模型再看月繳、隨時可取消的入門方案。二、每天寫作與翻譯：常卡，Claude 免費版 5 小時內的訊息額度先用完，ChatGPT 每天 3 個檔案，改稿要長上下文；建議預算最低選 ChatGPT Go 美國 8 美元或 Google AI Plus 台幣 165 元，重視改稿品質選 Claude Pro 20 美元、年繳折算 17 美元。三、大量讀文件：看上下文視窗與檔案數，Gemini 免費版上下文視窗只有 32k token，ChatGPT 每天 3 個檔案，長 PDF 讀不完就是卡了；建議 Google AI Pro 台幣 650 元，上下文放大到 100 萬 token，或 Claude Pro 20 美元，上下文 200k token，一個對話最多 20 個檔案、單檔 500 MB。四、寫程式：代理工具都在付費版，Claude Code 只在付費版，ChatGPT Plus 才有 Sol 與 Codex，旗艦模型都要付費；建議 Claude Pro 20 美元含 Claude Code 與 Cowork，或 ChatGPT Plus 20 美元有 GPT-5.6 Sol 與 Codex，先買一個月看額度夠不夠。五、做圖做影片：免費版產圖有上限，影片生成要付費，Gemini 的影片生成從 Google AI Plus 開始，數字以官網為準；建議 AI Plus 台幣 165 元有影片生成與 Flow 200 點，AI Pro 台幣 650 元有 Flow 1,000 點、用量 4 倍，ChatGPT Go 產圖 10 倍。最下面三行補充：上一階給每天大量使用的人，ChatGPT Pro 每月 100 或 200 美元、Claude Max 100 或 200 美元、Google AI Ultra 台幣 3,300 或 6,500 元，一般使用者先從入門方案開始；美元為美國定價，台幣為 Gemini 台灣訂閱頁，ChatGPT 與 Claude 的台幣價格以登入後看到的為準，App 內購以當地貨幣計價；三家都可月繳、隨時取消，只有 Claude Pro 有年繳折扣，方案與價格依 2026 年 9 月官網查證，之後可能變動。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
