  <path d="M 800 256 L 800 280" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="664" y="286" width="272" height="196" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
