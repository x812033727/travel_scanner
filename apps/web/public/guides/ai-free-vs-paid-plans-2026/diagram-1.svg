  <text x="688" y="450" font-size="16" fill="#102A2B">長 PDF 讀不完就是卡了</text>
  <path d="M 800 484 L 800 508" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="664" y="514" width="272" height="200" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="544" font-size="18" font-weight="700" fill="#1F5A40" text-anchor="middle">建議</text>
  <text x="688" y="574" font-size="16" fill="#102A2B">Google AI Pro 台幣 650 元</text>
  <text x="688" y="600" font-size="16" fill="#102A2B">上下文放大到 100 萬 token</text>
