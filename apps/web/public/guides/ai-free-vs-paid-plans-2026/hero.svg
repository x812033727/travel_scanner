<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">免費版夠不夠用 / Is the free plan enough?</title>
  <desc id="desc">米色底的插圖。畫面下方中央有一條淺色的路往上走，走到一半分成左右兩條：左邊那條通往一扇青綠色的門，門上掛著一個白色的空心圓環，代表免費、零元；右邊那條通往一扇橘色的門，門前有一疊三枚硬幣，代表付費。兩扇門之間上方有一顆小小的黃色燈泡形狀，表示要先想清楚再選。底部一行字寫著「免費版夠不夠用」。沒有任何產品標誌或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- ground -->
  <ellipse cx="800" cy="720" rx="640" ry="70" fill="#EFE6D8"/>

  <!-- path: one road splitting into two -->
  <path d="M 760 800 L 840 800 L 840 600 Q 840 560 880 540 L 1090 430 L 1050 380 L 880 470 Q 800 500 720 470 L 550 380 L 510 430 L 720 540 Q 760 560 760 600 Z" fill="#E3DACB" stroke="#D8CDBB" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 800 790 L 800 600" stroke="#F7F1E8" stroke-width="8" stroke-dasharray="24 22" stroke-linecap="round"/>

  <!-- left door: free -->
  <rect x="330" y="150" width="280" height="330" rx="140" fill="#0D6B68"/>
  <rect x="330" y="290" width="280" height="190" fill="#0D6B68"/>
  <rect x="330" y="150" width="280" height="330" rx="140" fill="none" stroke="#0B4F4D" stroke-width="10"/>
  <rect x="330" y="470" width="280" height="14" fill="#0B4F4D"/>
  <circle cx="470" cy="300" r="70" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <circle cx="470" cy="300" r="70" fill="none" stroke="#E3F0EF" stroke-width="6"/>

  <!-- right door: paid -->
  <rect x="990" y="150" width="280" height="330" rx="140" fill="#D97A2B"/>
  <rect x="990" y="290" width="280" height="190" fill="#D97A2B"/>
  <rect x="990" y="150" width="280" height="330" rx="140" fill="none" stroke="#8A4A16" stroke-width="10"/>
  <rect x="990" y="470" width="280" height="14" fill="#8A4A16"/>
  <!-- coin stack on the door -->
  <ellipse cx="1130" cy="372" rx="84" ry="24" fill="#8A4A16"/>
  <rect x="1046" y="332" width="168" height="40" fill="#F2C94C"/>
  <ellipse cx="1130" cy="332" rx="84" ry="24" fill="#F7DC7A"/>
  <rect x="1046" y="292" width="168" height="40" fill="#F2C94C"/>
  <ellipse cx="1130" cy="292" rx="84" ry="24" fill="#F7DC7A"/>
  <rect x="1046" y="252" width="168" height="40" fill="#F2C94C"/>
  <ellipse cx="1130" cy="252" rx="84" ry="24" fill="#FBE9A6"/>
  <ellipse cx="1130" cy="252" rx="44" ry="12" fill="none" stroke="#D9A93A" stroke-width="6"/>

  <!-- lightbulb between the doors -->
  <circle cx="800" cy="250" r="54" fill="#F7DC7A" stroke="#D9A93A" stroke-width="8"/>
  <rect x="774" y="298" width="52" height="30" rx="8" fill="#5C6B6B"/>
  <rect x="782" y="332" width="36" height="12" rx="6" fill="#5C6B6B"/>
  <path d="M 800 172 L 800 140" stroke="#D9A93A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 738 195 L 712 172" stroke="#D9A93A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 862 195 L 888 172" stroke="#D9A93A" stroke-width="8" stroke-linecap="round"/>

  <!-- one line of text -->
  <text x="800" y="860" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">免費版夠不夠用</text>
</svg>
