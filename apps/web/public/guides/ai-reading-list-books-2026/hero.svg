<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 入門書單插圖 / An AI reading list illustration</title>
  <desc id="desc">一張用幾何圖形畫成的插圖。畫面下方有三疊由左往右愈疊愈高的書，書本用圓角長方形表示，顏色分別是白色、淺綠與淺藍，外框是深綠、深藍與橘色。三疊書上方有一條由左下往右上的折線，折線在每一疊書的上方各有一個圓點，末端是箭頭，指向右上角一個橘色圓形，代表一條由淺入深的閱讀路線。畫面上方置中寫著「AI 入門書單」六個字。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="228" text-anchor="middle" font-size="76" font-weight="bold" fill="#102A2B">AI 入門書單</text>

  <circle cx="1424" cy="344" r="46" fill="#D97A2B"/>

  <!-- reading path -->
  <polyline points="330,624 800,562 1270,438 1320,416" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
  <polygon points="1352,407 1322,440 1308,403" fill="#0D6B68"/>
  <circle cx="330" cy="624" r="14" fill="#0D6B68"/>
  <circle cx="800" cy="562" r="14" fill="#0D6B68"/>
  <circle cx="1270" cy="438" r="14" fill="#0D6B68"/>

  <!-- stack A: two books -->
  <rect x="170" y="720" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="170" y="658" width="320" height="52" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>

  <!-- stack B: three books -->
  <rect x="640" y="720" width="320" height="52" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="640" y="658" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="640" y="596" width="320" height="52" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>

  <!-- stack C: five books -->
  <rect x="1110" y="720" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="1110" y="658" width="320" height="52" rx="14" fill="#E3F0EF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="1110" y="596" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="1110" y="534" width="320" height="52" rx="14" fill="#E6F0F7" stroke="#D97A2B" stroke-width="4"/>
  <rect x="1110" y="472" width="320" height="52" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>

  <line x1="120" y1="800" x2="1480" y2="800" stroke="#5C6B6B" stroke-width="6" stroke-linecap="round"/>
</svg>
