<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 入門書單的閱讀路線 / Reading route for 10 AI books</title>
  <desc id="desc">一張分成三欄的閱讀路線圖。左欄是第一類「先懂原理與來歷」共 3 本：大演算 2016、Life 3.0 2018、AI科學家李飛飛的視界之旅 2023。中欄是第二類「再看社會與工作的影響」共 5 本：超智慧 2023、AI世代與我們的未來 2022、人工智慧最後的祕密 2022、控制邊緣 2024、連結 2024。右欄是第三類「最後動手與工作方法」共 2 本：工作者的AI共智模式 2026、AI 提問 X 學習 X 應用 2025。三欄之間有箭頭表示建議的閱讀順序由左往右。最下方的橫幅寫著讀完一章先用自己的話寫 5 到 8 行，再把筆記貼給 AI 出 3 題複習，書名與結論一律回原文核對。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">AI 入門書單：十本書的閱讀路線</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Reading route: 10 books in 3 tracks</text>

  <!-- column A -->
  <rect x="60" y="126" width="450" height="70" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="285" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">第一類　先懂原理與來歷</text>
  <text x="285" y="182" text-anchor="middle" font-size="16" fill="#5C6B6B">3 本</text>

  <rect x="76" y="220" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="285" y="254" text-anchor="middle" font-size="17" fill="#102A2B">大演算</text>
  <text x="285" y="282" text-anchor="middle" font-size="15" fill="#5C6B6B">三采文化　2016</text>

  <rect x="76" y="316" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="285" y="350" text-anchor="middle" font-size="17" fill="#102A2B">Life 3.0</text>
  <text x="285" y="378" text-anchor="middle" font-size="15" fill="#5C6B6B">天下文化　2018</text>

  <rect x="76" y="412" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="285" y="446" text-anchor="middle" font-size="17" fill="#102A2B">AI科學家李飛飛的視界之旅</text>
  <text x="285" y="474" text-anchor="middle" font-size="15" fill="#5C6B6B">天下文化　2023</text>

  <!-- column B -->
  <rect x="575" y="126" width="450" height="70" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">第二類　再看社會與工作</text>
  <text x="800" y="182" text-anchor="middle" font-size="16" fill="#5C6B6B">5 本</text>

  <rect x="591" y="220" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="254" text-anchor="middle" font-size="17" fill="#102A2B">超智慧</text>
  <text x="800" y="282" text-anchor="middle" font-size="15" fill="#5C6B6B">感電出版　2023</text>

  <rect x="591" y="316" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="350" text-anchor="middle" font-size="17" fill="#102A2B">AI世代與我們的未來</text>
  <text x="800" y="378" text-anchor="middle" font-size="15" fill="#5C6B6B">聯經　2022</text>

  <rect x="591" y="412" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="446" text-anchor="middle" font-size="17" fill="#102A2B">人工智慧最後的祕密</text>
  <text x="800" y="474" text-anchor="middle" font-size="15" fill="#5C6B6B">臉譜　2022</text>

  <rect x="591" y="508" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="542" text-anchor="middle" font-size="17" fill="#102A2B">控制邊緣</text>
  <text x="800" y="570" text-anchor="middle" font-size="15" fill="#5C6B6B">感電出版　2024</text>

  <rect x="591" y="604" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="638" text-anchor="middle" font-size="17" fill="#102A2B">連結</text>
  <text x="800" y="666" text-anchor="middle" font-size="15" fill="#5C6B6B">天下文化　2024</text>

  <!-- column C -->
  <rect x="1090" y="126" width="450" height="70" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1315" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#102A2B">第三類　最後動手與方法</text>
  <text x="1315" y="182" text-anchor="middle" font-size="16" fill="#5C6B6B">2 本</text>

  <rect x="1106" y="220" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1315" y="254" text-anchor="middle" font-size="17" fill="#102A2B">工作者的AI共智模式</text>
  <text x="1315" y="282" text-anchor="middle" font-size="15" fill="#5C6B6B">天下雜誌　2026</text>

  <rect x="1106" y="316" width="418" height="82" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1315" y="350" text-anchor="middle" font-size="17" fill="#102A2B">AI 提問 X 學習 X 應用</text>
  <text x="1315" y="378" text-anchor="middle" font-size="15" fill="#5C6B6B">碁峰資訊　2025</text>

  <!-- arrows -->
  <line x1="518" y1="261" x2="566" y2="261" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1033" y1="261" x2="1081" y2="261" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- bottom band -->
  <rect x="60" y="726" width="1480" height="110" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="772" text-anchor="middle" font-size="18" fill="#102A2B">讀完一章，先用自己的話寫 5 到 8 行</text>
  <text x="800" y="806" text-anchor="middle" font-size="18" fill="#102A2B">再把筆記貼給 AI 出 3 題複習；書名與結論一律回原文核對</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
