<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一句要求的三條去向 / Three destinations for one request</title>
<desc id="desc">插圖。左邊一個實心圓外圍一圈虛線，代表你提出的一句要求；從圓上分出三條粗線往右，分別通向三個幾何圖形：上方是一枚有接腳的方形晶片，代表在裝置上處理；中間是一朵雲，代表送到伺服器處理；下方是一個有尾巴的對話框，代表交給裝置以外的服務。畫面左上角有一行標題文字「資料走到哪一層」。全圖只有幾何形狀，沒有任何產品外形、標誌或介面。</desc>
<defs>
<marker id="tip" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="130" y="196" font-size="56" font-weight="bold" fill="#102A2B">資料走到哪一層</text>

<circle cx="300" cy="490" r="80" fill="#0D6B68"/>
