<path d="M 422 490 C 620 506, 800 546, 1014 558" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round" marker-end="url(#tip)"/>
<path d="M 418 518 C 620 572, 800 712, 1006 756" fill="none" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round" marker-end="url(#tip)"/>

