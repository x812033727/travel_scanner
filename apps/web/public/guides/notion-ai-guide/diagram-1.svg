<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一頁 Notion 從空白到完成的四步 / Four steps from a blank Notion page</title>
  <desc id="desc">一張四步流程圖。第一步先自己寫：開新頁，先貼上已知的重點、待辦與連結，AI 只補沒寫的。第二步叫出 AI：選取文字或按空白鍵用行內 AI 改寫、摘要、翻譯，快速鍵預設是 shift 加 cmd 或 ctrl 加 J。第三步轉成資料庫：讓 AI 建資料庫與屬性，再用 Autofill 自動填摘要與關鍵字，公式也能請它寫。第四步問與追：用 Agent 問工作區與連接器，AI Meeting Notes 接會議，每人每天上限 10 小時，摘要至少要 300 字元逐字稿。下方第一條是方案門檻：完整 Notion AI 只在 Business 與 Enterprise 方案，Business 年繳每位成員每月 20 美元、月繳 24 美元，免費版與 Plus 只有體驗回覆，新團隊可試用 Business 30 天。下方第二條是權限提醒：代理的權限跟你本人一樣，先只連真的要搜尋的應用程式，能唯讀就唯讀；它讀進來的網頁與郵件可能藏著指令，會寫入或對外發送的動作要保留人工確認。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">一頁 Notion 從空白到完成的四步</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Notion AI: four steps from a blank page</text>

  <rect x="65" y="120" width="330" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="111" cy="168" r="22" fill="#0D6B68"/>
  <text x="111" y="176" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="147" y="176" font-size="20" font-weight="bold" fill="#102A2B">先自己寫</text>
  <text x="89" y="232" font-size="17" fill="#102A2B">開新頁，先貼上已知的重點、</text>
  <text x="89" y="262" font-size="17" fill="#102A2B">待辦與連結</text>
  <text x="89" y="300" font-size="17" fill="#102A2B">AI 只補你沒寫的部分</text>
  <text x="89" y="366" font-size="15" fill="#5C6B6B">範圍講清楚，來回次數會變少</text>

  <rect x="445" y="120" width="330" height="300" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="491" cy="168" r="22" fill="#0D6B68"/>
  <text x="491" y="176" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="527" y="176" font-size="20" font-weight="bold" fill="#102A2B">叫出 AI</text>
  <text x="469" y="232" font-size="17" fill="#102A2B">選取文字或按空白鍵，用行</text>
  <text x="469" y="262" font-size="17" fill="#102A2B">內 AI 改寫、摘要、翻譯</text>
  <text x="469" y="300" font-size="16" fill="#102A2B">快速鍵 shift + cmd/ctrl + J</text>
  <text x="469" y="366" font-size="15" fill="#5C6B6B">重試一次就多算一次回覆</text>

  <rect x="825" y="120" width="330" height="300" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="871" cy="168" r="22" fill="#2F6F9F"/>
  <text x="871" y="176" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="907" y="176" font-size="20" font-weight="bold" fill="#102A2B">轉成資料庫</text>
  <text x="849" y="232" font-size="17" fill="#102A2B">讓 AI 建資料庫與屬性，再</text>
  <text x="849" y="262" font-size="17" fill="#102A2B">用 Autofill 自動填摘要</text>
  <text x="849" y="300" font-size="17" fill="#102A2B">與關鍵字，也能請它寫公式</text>
  <text x="849" y="366" font-size="15" fill="#5C6B6B">整欄自動填，記得抽查</text>

  <rect x="1205" y="120" width="330" height="300" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="1251" cy="168" r="22" fill="#2F6F9F"/>
  <text x="1251" y="176" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1287" y="176" font-size="20" font-weight="bold" fill="#102A2B">問與追</text>
  <text x="1229" y="232" font-size="17" fill="#102A2B">用 Agent 問工作區與連</text>
  <text x="1229" y="262" font-size="17" fill="#102A2B">接器，AI Meeting Notes</text>
  <text x="1229" y="300" font-size="17" fill="#102A2B">接會議，每人每天 10 小時</text>
  <text x="1229" y="366" font-size="15" fill="#5C6B6B">摘要至少要 300 字元逐字稿</text>

  <line x1="403" y1="270" x2="437" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="783" y1="270" x2="817" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1163" y1="270" x2="1197" y2="270" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="65" y="460" width="1470" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="95" y="502" font-size="20" font-weight="bold" fill="#0D6B68">方案門檻</text>
  <text x="95" y="540" font-size="17" fill="#102A2B">完整 Notion AI 只在 Business 與 Enterprise：Business 年繳每位成員每月 US$20，月繳 US$24</text>
  <text x="95" y="574" font-size="17" fill="#102A2B">免費版與 Plus 只有體驗回覆，次數官網未公布；新團隊可試用 Business 30 天</text>

  <rect x="65" y="645" width="1470" height="150" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="95" y="690" font-size="20" font-weight="bold" fill="#B8442D">先給讀取，再談自動化</text>
  <text x="95" y="728" font-size="17" fill="#102A2B">代理的權限跟你本人一樣：先只連真的要搜尋的應用程式，能唯讀就唯讀，在測試頁面跑過再開給全公司</text>
  <text x="95" y="762" font-size="17" fill="#102A2B">它讀進來的網頁與郵件可能藏著指令；會寫入或會對外發送的動作，都要保留人工確認</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
