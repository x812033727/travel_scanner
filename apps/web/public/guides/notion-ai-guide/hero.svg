<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從一頁空白長出清單、表格與摘要 / From a blank page to lists, tables and a summary</title>
  <desc id="desc">一張幾何插圖。左邊是一張白色圓角頁面卡片，上半部有一條深色標題橫條與三條淺色文字橫條，下半部留白，代表還沒寫完的空白頁。頁面右側有一條粗線連到一個深綠色圓形節點，圓形中間是一個白色四角星，代表 AI。圓形再分出三條線，接到右邊三張卡片：上面一張是三列圓點加橫條的清單，中間一張是三欄兩列的表格格線，下面一張淺綠色卡片上有一個勾號與兩條橫條，代表整理好的摘要。畫面下方置中有一行字：從空白到完成。整張圖只有幾何圖形與線條，沒有任何產品標誌、介面截圖或人物。</desc>
