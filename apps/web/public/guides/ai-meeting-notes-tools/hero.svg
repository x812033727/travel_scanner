<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">會議聲音變成一頁決議 / From meeting audio to a page of decisions</title>
  <desc id="desc">抽象幾何插圖。左邊一個圓角矩形代表線上會議畫面，裡面有三個大小不同的圓圈代表與會者，沒有五官。中間一排高低不同的圓角直條代表聲音波形，由左往右漸漸變成整齊的橫線。右邊一張白色卡片代表整理好的會議筆記，上面有標題線、三行文字線與兩個打勾的方框，代表決議與待辦。下方有一行短標語「聽完，留下決議」。整張圖沒有任何產品標誌、介面截圖或人臉。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- left: the meeting screen -->
  <rect x="120" y="190" width="420" height="300" rx="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
  <rect x="120" y="190" width="420" height="52" rx="28" fill="#E3F0EF"/>
  <rect x="120" y="222" width="420" height="20" fill="#E3F0EF"/>
  <line x1="120" y1="242" x2="540" y2="242" stroke="#0D6B68" stroke-width="6"/>
  <circle cx="232" cy="336" r="54" fill="#0D6B68"/>
  <circle cx="366" cy="322" r="42" fill="#2F6F9F"/>
  <circle cx="300" cy="432" r="38" fill="#D97A2B"/>
  <rect x="236" y="500" width="188" height="20" rx="10" fill="#5C6B6B"/>
  <rect x="290" y="520" width="80" height="44" rx="10" fill="#5C6B6B"/>

  <!-- middle: waveform turning into lines -->
  <rect x="612" y="290" width="22" height="120" rx="11" fill="#0D6B68"/>
  <rect x="656" y="250" width="22" height="200" rx="11" fill="#0D6B68"/>
  <rect x="700" y="310" width="22" height="80" rx="11" fill="#2F6F9F"/>
  <rect x="744" y="230" width="22" height="240" rx="11" fill="#0D6B68"/>
  <rect x="788" y="300" width="22" height="100" rx="11" fill="#2F6F9F"/>
  <rect x="832" y="268" width="22" height="164" rx="11" fill="#2E7D5B"/>
  <rect x="876" y="318" width="22" height="64" rx="11" fill="#2E7D5B"/>
  <rect x="920" y="330" width="22" height="40" rx="11" fill="#2E7D5B"/>
  <path d="M 604 560 L 960 560" stroke="#5C6B6B" stroke-width="8" stroke-linecap="round" stroke-dasharray="26 22"/>

  <!-- right: the finished note card -->
  <rect x="1020" y="160" width="450" height="500" rx="28" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="10"/>
  <rect x="1074" y="222" width="250" height="26" rx="13" fill="#102A2B"/>
  <rect x="1074" y="282" width="342" height="16" rx="8" fill="#C8D2D2"/>
  <rect x="1074" y="322" width="300" height="16" rx="8" fill="#C8D2D2"/>
  <rect x="1074" y="362" width="330" height="16" rx="8" fill="#C8D2D2"/>
  <rect x="1074" y="430" width="52" height="52" rx="12" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="7"/>
  <path d="M 1086 456 L 1099 470 L 1116 440" fill="none" stroke="#2E7D5B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1150" y="444" width="266" height="20" rx="10" fill="#C8D2D2"/>
  <rect x="1074" y="528" width="52" height="52" rx="12" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="7"/>
  <path d="M 1086 554 L 1099 568 L 1116 538" fill="none" stroke="#2E7D5B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1150" y="542" width="208" height="20" rx="10" fill="#C8D2D2"/>

  <text x="800" y="800" text-anchor="middle" font-size="62" font-weight="bold" fill="#102A2B">聽完，留下決議</text>
</svg>
