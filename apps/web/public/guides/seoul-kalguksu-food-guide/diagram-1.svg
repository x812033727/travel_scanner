  <text x="84" y="540" font-size="16" fill="#5C6B6B">比蔘雞湯清淡</text>
  <ellipse cx="230" cy="610" rx="55" ry="14" fill="#D97A2B" opacity="0.18"/>
  <ellipse cx="230" cy="616" rx="70" ry="20" fill="none" stroke="#D97A2B" stroke-width="3"/>

  <rect x="440" y="386" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="464" y="442" font-size="24" font-weight="700" fill="#102A2B">멸치　鯷魚</text>
  <text x="464" y="516" font-size="16" fill="#5C6B6B">小魚乾熬的清湯，口味乾淨</text>
  <ellipse cx="610" cy="610" rx="55" ry="14" fill="#2F6F9F" opacity="0.18"/>
  <ellipse cx="610" cy="616" rx="70" ry="20" fill="none" stroke="#2F6F9F" stroke-width="3"/>

  <rect x="820" y="386" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="844" y="442" font-size="24" font-weight="700" fill="#102A2B">바지락　蛤蜊</text>
  <text x="844" y="472" font-size="16" fill="#5C6B6B">바지락칼국수</text>
  <text x="844" y="516" font-size="16" fill="#5C6B6B">蛤蜊熬的湯，放櫛瓜與洋蔥，</text>
  <text x="844" y="540" font-size="16" fill="#5C6B6B">爽口清淡</text>
  <ellipse cx="990" cy="610" rx="55" ry="14" fill="#0D6B68" opacity="0.18"/>
  <ellipse cx="990" cy="616" rx="70" ry="20" fill="none" stroke="#0D6B68" stroke-width="3"/>

  <rect x="1200" y="386" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1224" y="442" font-size="24" font-weight="700" fill="#102A2B">사골　牛骨</text>
  <text x="1224" y="472" font-size="16" fill="#5C6B6B">사골칼국수</text>
  <text x="1224" y="516" font-size="16" fill="#5C6B6B">牛骨熬的湯，濃</text>
  <ellipse cx="1370" cy="610" rx="55" ry="14" fill="#2E7D5B" opacity="0.18"/>
  <ellipse cx="1370" cy="616" rx="70" ry="20" fill="none" stroke="#2E7D5B" stroke-width="3"/>

  <!-- bonus: spicy paste version -->
  <rect x="60" y="742" width="1480" height="86" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="90" y="778" font-size="19" font-weight="700" fill="#8A4A14">加了醬的那一種：장칼국수　辣醬刀切麵</text>
