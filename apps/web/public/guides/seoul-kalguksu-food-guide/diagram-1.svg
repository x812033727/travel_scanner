  <text x="1150" y="188" font-size="25" font-weight="700" fill="#102A2B">칼로 썰다　用刀切</text>
  <text x="1150" y="233" font-size="17" fill="#5C6B6B">以刀切成細條狀——名字就是這個意思</text>
  <line x1="1285" y1="274" x2="1285" y2="302" stroke="#8A4A14" stroke-width="3"/>
  <line x1="1305" y1="274" x2="1305" y2="302" stroke="#8A4A14" stroke-width="3"/>
  <line x1="1325" y1="274" x2="1325" y2="302" stroke="#8A4A14" stroke-width="3"/>
  <line x1="1345" y1="274" x2="1345" y2="302" stroke="#8A4A14" stroke-width="3"/>
  <line x1="1400" y1="266" x2="1425" y2="310" stroke="#5C6B6B" stroke-width="5" stroke-linecap="round"/>

