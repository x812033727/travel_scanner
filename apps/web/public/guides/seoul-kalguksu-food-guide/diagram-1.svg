  <text x="90" y="188" font-size="25" font-weight="700" fill="#102A2B">반죽　麵團</text>
  <text x="90" y="233" font-size="17" fill="#5C6B6B">手工揉製</text>
  <circle cx="270" cy="288" r="24" fill="#E8D9BD" stroke="#8A4A14" stroke-width="3"/>

  <path d="M 480 233 L 590 233" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="590" y="138" width="420" height="190" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="620" y="188" font-size="25" font-weight="700" fill="#102A2B">밀다　擀薄</text>
  <text x="620" y="233" font-size="17" fill="#5C6B6B">用擀麵棍擀成薄片</text>
  <rect x="725" y="280" width="150" height="16" rx="8" fill="#E8D9BD" stroke="#8A4A14" stroke-width="2"/>
  <circle cx="725" cy="288" r="13" fill="#E8D9BD" stroke="#8A4A14" stroke-width="2"/>
  <circle cx="875" cy="288" r="13" fill="#E8D9BD" stroke="#8A4A14" stroke-width="2"/>

  <path d="M 1010 233 L 1120 233" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

