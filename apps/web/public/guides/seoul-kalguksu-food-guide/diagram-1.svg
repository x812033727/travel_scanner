<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Malgun Gothic',system-ui,sans-serif">
  <title id="title">刀切麵怎麼來、湯底怎麼分 / How kalguksu is made and its broth types</title>
  <desc id="desc">圖上的標題是「刀切麵怎麼來、湯底怎麼分」，副標是「How kalguksu is made, and its broth types」。上半部的小標是「麵怎麼來的：揉 → 擀 → 切」，三個方框由左到右用箭頭串起來：반죽 麵團，下面寫「手工揉製」，框裡畫一顆圓麵團；밀다 擀薄，下面寫「用擀麵棍擀成薄片」，框裡畫一支擀麵棍；칼로 썰다 用刀切，下面寫「以刀切成細條狀——名字就是這個意思」，框裡畫四條細麵與一把斜放的刀。下半部的小標是「湯底對照：同樣칼국수，湯差在哪」，四張卡片並排，每張下方畫一只碗，框線顏色各不相同：닭 雞（닭칼국수）寫「雞肉與白蘿蔔絲熬的湯，比蔘雞湯清淡」；멸치 鯷魚寫「小魚乾熬的清湯，口味乾淨」；바지락 蛤蜊（바지락칼국수）寫「蛤蜊熬的湯，放櫛瓜與洋蔥，爽口清淡」；사골 牛骨（사골칼국수）寫「牛骨熬的湯，濃」。最下面一條橘色虛線橫幅寫「加了醬的那一種：장칼국수 辣醬刀切麵」與「辣椒醬與大醬溶進鯷魚湯，江原道的風味料理」。左下角是「資料：韓國觀光公社、Visit Seoul」，右下角是「© Mokaair 製圖 2026」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="50" font-size="30" font-weight="700" fill="#102A2B">刀切麵怎麼來、湯底怎麼分</text>
  <text x="60" y="80" font-size="18" fill="#5C6B6B">How kalguksu is made, and its broth types</text>

  <!-- top section: how the noodles are made -->
  <text x="60" y="118" font-size="21" font-weight="700" fill="#102A2B">麵怎麼來的：揉 → 擀 → 切</text>

