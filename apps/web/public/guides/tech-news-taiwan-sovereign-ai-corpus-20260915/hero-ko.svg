<title id="title">Taiwan Sovereign AI Training Corpus(臺灣主權AI訓練語料庫), 민간 언어자료 제공 모집 시작: 라이선스 약관과 하카어 데이터 현황</title><desc id="desc">원작 삽화: 왼쪽에는 쌓여 있는 책 세 권, 가운데에는 원형 도장이 찍힌 라이선스 문서로 화살표가 이어지고, 오른쪽에는 작은 사각형 아홉 개가 담긴 큰 사각형으로 다시 화살표가 이어진다. 출판물이 라이선스를 거쳐 코퍼스로 들어가는 과정을 나타낸다</desc>
