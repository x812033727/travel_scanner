<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">本機去識別化、雲端收尾</title><desc id="desc">由左到右：原始文字先在本機去識別化，只有代號版本送進雲端模型收尾，回覆再由本機把代號換回原文；本機端點呼叫的是 11434 埠（2026 年 9 月查證 Ollama 官方文件）。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">本機去識別化、雲端收尾</text><rect x="80.0" y="300" width="307.5" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="130.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="233.75" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">使用者輸入</text><text x="233.75" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">含個資的原始文字</text><path d="M395.5 465.0 L435.5 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M413.5 435.0 L449.5 465.0 L413.5 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="457.5" y="300" width="307.5" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="507.5" cy="354" r="20" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="611.25" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">本機去識別化</text><text x="611.25" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">呼叫 11434 埠</text><path d="M773.0 465.0 L813.0 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M791.0 435.0 L827.0 465.0 L791.0 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="835.0" y="300" width="307.5" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="885.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="988.75" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">雲端模型收尾</text><text x="988.75" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">只看得到代號文字</text><path d="M1150.5 465.0 L1190.5 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M1168.5 435.0 L1204.5 465.0 L1168.5 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1212.5" y="300" width="307.5" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="1262.5" cy="354" r="20" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1366.25" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">本機還原</text><text x="1366.25" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">對照表留在本機</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text></svg>