<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Codex 的三種形態與代理迴圈 / Three ways to run Codex and the agent loop they share</title>
  <desc id="desc">上排三個框是 Codex 的三種形態。Codex cloud：ChatGPT 裡的雲端代理，在 chatgpt.com/codex、ChatGPT 側欄與手機 App，連 GitHub 或 GitLab 後在 OpenAI 的容器裡改程式，交出摘要與 diff 或直接開 PR，在 PR 留言 @codex review 可以請它審。Codex CLI：在自己的電腦終端機跑，支援 macOS、Linux、Windows，用 ChatGPT 方案登入或用 API key 計費，沙盒預設只能改工作區、不連網，開源、Apache-2.0 授權。IDE 擴充：裝在 VS Code、Cursor、Windsurf、JetBrains、Xcode，把開著的檔案與選取的行帶進提示，diff 直接顯示在原始碼旁邊，長任務可以丟到雲端環境。中間是三種形態共用的五步代理迴圈：1 任務（目標、脈絡、限制、完成定義），2 讀程式（看專案結構與 AGENTS.md），3 改程式（新增或修改檔案、補測試），4 跑測試（執行測試、讀輸出），5 交出 PR（摘要與 diff，雲端版開 PR）；測試沒過就從第 4 步回到第 3 步。下排左邊是方案：Free US$0、Go US$8／月、Plus US$20／月，所有方案都含 Codex；Pro US$100／月起是 Plus 的 5 倍，US$200／月是 20 倍；Business 每人每月 US$20（年繳）；額度每 5 小時一個區間，本機訊息與雲端任務共用，Plus 與 Pro 用完可加購 credits；API key 走 OpenAI Platform 用量計費，不吃方案額度。下排右邊是安全底線：看 diff、跑自己的檢查再合併；本機沙盒預設 workspace-write，只改工作區、不連網；雲端安裝腳本可連網、代理階段預設斷網、Secrets 先移除；不要給正式環境的金鑰，先開分支、git status 乾淨再交辦；第一次用先從自己的小專案開始。2026 年 9 月依官方文件查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Codex 的三種形態與代理迴圈（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three ways to run Codex, and the loop they share: task, read, edit, test, pull request</text>
