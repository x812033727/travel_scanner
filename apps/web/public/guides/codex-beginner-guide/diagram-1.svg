  <text x="795" y="263" font-size="16" fill="#1F4E73" text-anchor="middle">開源，Apache-2.0 授權</text>
  <rect x="1060" y="110" width="470" height="190" rx="14" fill="#FBEEE2" stroke="#D97A2B" stroke-width="4"/>
  <text x="1295" y="146" font-size="19" font-weight="700" fill="#7A4415" text-anchor="middle">IDE 擴充　VS Code 等編輯器</text>
  <text x="1295" y="182" font-size="16" fill="#7A4415" text-anchor="middle">VS Code、Cursor、Windsurf、JetBrains、Xcode</text>
  <text x="1295" y="209" font-size="16" fill="#7A4415" text-anchor="middle">把開著的檔案與選取的行帶進提示</text>
  <text x="1295" y="236" font-size="16" fill="#7A4415" text-anchor="middle">diff 直接顯示在原始碼旁邊</text>
  <text x="1295" y="263" font-size="16" fill="#7A4415" text-anchor="middle">長任務可以丟到雲端環境</text>
  <!-- agent loop -->
  <text x="60" y="334" font-size="18" font-weight="700" fill="#102A2B">三種形態共用的代理迴圈　Agent loop</text>
  <text x="190" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">目標、脈絡、限制、完成定義</text>
  <rect x="60" y="374" width="260" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="100" cy="414" r="17" fill="#0D6B68"/>
  <text x="100" y="420" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
