  <text x="295" y="146" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">Codex cloud　ChatGPT 裡的雲端代理</text>
  <text x="295" y="182" font-size="16" fill="#0B4F4D" text-anchor="middle">在 chatgpt.com/codex、ChatGPT 側欄與手機 App</text>
  <text x="295" y="209" font-size="16" fill="#0B4F4D" text-anchor="middle">連 GitHub 或 GitLab，在 OpenAI 的容器裡改</text>
