  <text x="88" y="630" font-size="16" fill="#102A2B">・Free US$0、Go US$8／月、Plus US$20／月：所有方案都含 Codex</text>
  <text x="88" y="659" font-size="16" fill="#102A2B">・Pro US$100／月起是 Plus 的 5 倍，US$200／月是 20 倍</text>
  <text x="88" y="688" font-size="16" fill="#102A2B">・Business 每人每月 US$20（年繳）；額度每 5 小時一個區間</text>
  <text x="88" y="717" font-size="16" fill="#102A2B">・本機訊息與雲端任務共用額度；Plus、Pro 用完可加購 credits</text>
  <text x="88" y="746" font-size="16" fill="#102A2B">・API key：走 OpenAI Platform 用量計費，不吃方案額度</text>
  <!-- safety -->
  <rect x="820" y="560" width="720" height="210" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="596" font-size="19" font-weight="700" fill="#102A2B">安全底線　Before you merge</text>
  <text x="848" y="630" font-size="16" fill="#102A2B">・看 diff、跑自己的檢查再合併，把它當同事的 PR 審</text>
