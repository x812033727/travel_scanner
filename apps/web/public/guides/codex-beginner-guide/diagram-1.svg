  <circle cx="410" cy="414" r="17" fill="#0D6B68"/>
  <text x="410" y="420" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="520" y="421" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">讀程式</text>
  <path d="M 632 414 L 676 414" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="810" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">新增或修改檔案、補測試</text>
  <rect x="680" y="374" width="260" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="720" cy="414" r="17" fill="#0D6B68"/>
  <text x="720" y="420" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="830" y="421" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">改程式</text>
  <path d="M 942 414 L 986 414" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1120" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">執行測試、讀輸出</text>
  <rect x="990" y="374" width="260" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="1030" cy="414" r="17" fill="#0D6B68"/>
  <text x="1030" y="420" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1140" y="421" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">跑測試</text>
  <path d="M 1252 414 L 1296 414" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1430" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">摘要與 diff，雲端版開 PR</text>
