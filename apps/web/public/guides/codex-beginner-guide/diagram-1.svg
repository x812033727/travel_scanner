  <text x="848" y="688" font-size="16" fill="#102A2B">・雲端：安裝腳本可連網，代理階段預設斷網、Secrets 先移除</text>
  <text x="848" y="717" font-size="16" fill="#102A2B">・不要給正式環境的金鑰；先開分支，git status 乾淨再交辦</text>
  <text x="848" y="746" font-size="16" fill="#102A2B">・第一次用，先從自己的小專案開始</text>
