  <text x="795" y="146" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">Codex CLI　終端機</text>
  <text x="795" y="182" font-size="16" fill="#1F4E73" text-anchor="middle">在自己的電腦跑，macOS、Linux、Windows</text>
  <text x="795" y="209" font-size="16" fill="#1F4E73" text-anchor="middle">用 ChatGPT 方案登入，或用 API key 計費</text>
