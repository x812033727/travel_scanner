<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">兩疊高度差很多的方塊 / Two stacks of blocks, one much shorter</title>
  <desc id="desc">一張抽象插圖。畫面中央有一條水平的地面線，線上放著兩疊圓角方塊。左邊那疊是藍邊淺藍底的方塊，疊了七層，高得快要碰到畫面上緣，代表原本的帳單。右邊那疊是綠邊淺綠底的方塊，只有兩層，矮很多，代表省下來之後的帳單。矮的那疊右邊有一個粗的綠色箭頭由上往下指，強調費用往下掉。畫面下方有一行字寫著「API 帳單瘦身」。沒有任何品牌標誌、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
  </defs>

  <line x1="260" y1="690" x2="1340" y2="690" stroke="#5C6B6B" stroke-width="6" stroke-linecap="round"/>

  <rect x="400" y="634" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="568" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="502" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="436" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="370" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="304" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="400" y="238" width="300" height="56" rx="16" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>

  <rect x="900" y="634" width="300" height="56" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="900" y="568" width="300" height="56" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>

  <path d="M 1272 300 L 1272 540" stroke="#2E7D5B" stroke-width="12" stroke-linecap="round" marker-end="url(#down)"/>

  <text x="800" y="812" font-size="60" font-weight="700" fill="#102A2B" text-anchor="middle">API 帳單瘦身</text>
</svg>
