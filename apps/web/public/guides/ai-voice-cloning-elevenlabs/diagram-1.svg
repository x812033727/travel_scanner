<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">語音克隆的四個關卡 / Voice cloning: record, clone, generate, disclose</title>
  <desc id="desc">由左至右四個步驟。第一步錄音：安靜空間、同一支麥克風，即時克隆建議 1 到 2 分鐘、至少 1 分鐘、超過 3 分鐘幫助不大，專業克隆至少 30 分鐘、建議 2 到 3 小時，上傳前先自己聽過。第二步克隆與驗證：勾選同意聲明，專業克隆要當場錄驗證句，官方以 voice-captcha 確認本人在場，失敗等 24 小時再試，微調通常 3 到 6 小時，方案要 Creator 以上才有名額。第三步生成：文字轉語音 1 個字元扣 1 credit，配音翻譯 90 種以上語言，音效最長 30 秒，最便宜的自動配音含浮水印、無浮水印的檔次較貴。第四步標示與同意：免費層不可商用，發布時標題要加 elevenlabs.io，即時克隆從每月 6 美元起，專業克隆從每月 22 美元起，付費訂閱期間以外做的內容不可商用。下方第一條橫幅寫同意規則：克隆別人的聲音要有同意或法律權利，使用政策禁止未經同意複製他人聲音、造成騷擾或傷害，也禁止讓人誤以為不是人工智慧生成，並禁止冒充政治候選人與民選官員。第二條橫幅寫標示與偵測：免費方案或未登入時發布要在標題加上 elevenlabs.io 或 11.ai，音樂功能要註明 Eleven Music；官方的偵測工具只估計是否由該公司模型生成，無法可靠辨識較新的模型，也偵測不到其他供應商。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">語音克隆的四個關卡：錄音、克隆、生成、標示</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Voice cloning: record, clone, generate, disclose</text>

  <!-- step 1 -->
  <rect x="60" y="120" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="102" cy="166" r="22" fill="#0D6B68"/>
  <text x="102" y="174" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="138" y="175" font-size="22" font-weight="700" fill="#102A2B">錄音</text>
  <text x="84" y="230" font-size="17" fill="#102A2B">安靜空間、同一支麥克風</text>
  <text x="84" y="264" font-size="17" fill="#102A2B">即時克隆：1-2 分鐘</text>
  <text x="84" y="298" font-size="17" fill="#5C6B6B">至少 1 分鐘，別超過 3 分鐘</text>
  <text x="84" y="332" font-size="17" fill="#102A2B">專業克隆：30 分鐘起</text>
  <text x="84" y="366" font-size="17" fill="#5C6B6B">建議接近 2-3 小時</text>
  <text x="84" y="400" font-size="17" fill="#5C6B6B">上傳前先自己聽一遍</text>

  <line x1="390" y1="285" x2="432" y2="285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="446" y="120" width="320" height="330" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="488" cy="166" r="22" fill="#0D6B68"/>
  <text x="488" y="174" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="524" y="175" font-size="22" font-weight="700" fill="#102A2B">克隆與驗證</text>
  <text x="470" y="230" font-size="17" fill="#102A2B">勾選同意聲明</text>
  <text x="470" y="264" font-size="17" fill="#102A2B">專業克隆要錄驗證句</text>
  <text x="470" y="298" font-size="17" fill="#5C6B6B">voice-captcha 確認本人</text>
  <text x="470" y="332" font-size="17" fill="#B8442D">失敗等 24 小時再試</text>
  <text x="470" y="366" font-size="17" fill="#5C6B6B">微調通常 3-6 小時</text>
  <text x="470" y="400" font-size="17" fill="#5C6B6B">名額要 Creator 以上</text>

  <line x1="776" y1="285" x2="818" y2="285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="832" y="120" width="320" height="330" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="874" cy="166" r="22" fill="#2F6F9F"/>
  <text x="874" y="174" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="910" y="175" font-size="22" font-weight="700" fill="#102A2B">生成</text>
  <text x="856" y="230" font-size="17" fill="#102A2B">文字轉語音</text>
  <text x="856" y="264" font-size="17" fill="#5C6B6B">1 個字元扣 1 credit</text>
  <text x="856" y="298" font-size="17" fill="#102A2B">配音翻譯 90 種以上語言</text>
  <text x="856" y="332" font-size="17" fill="#102A2B">音效最長 30 秒</text>
  <text x="856" y="366" font-size="17" fill="#D97A2B">最便宜的自動配音含浮水印</text>

  <line x1="1162" y1="285" x2="1204" y2="285" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="1218" y="120" width="320" height="330" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="1260" cy="166" r="22" fill="#D97A2B"/>
  <text x="1260" y="174" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1296" y="175" font-size="22" font-weight="700" fill="#102A2B">標示與同意</text>
  <text x="1242" y="230" font-size="17" fill="#B8442D">免費層不可商用</text>
  <text x="1242" y="264" font-size="17" fill="#102A2B">標題加 elevenlabs.io</text>
  <text x="1242" y="298" font-size="17" fill="#5C6B6B">即時克隆每月 6 美元起</text>
  <text x="1242" y="332" font-size="17" fill="#5C6B6B">專業克隆每月 22 美元起</text>
  <text x="1242" y="366" font-size="17" fill="#B8442D">付費期間外做的不可商用</text>

  <!-- band 1: consent -->
  <rect x="60" y="500" width="1478" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="84" y="542" font-size="20" font-weight="700" fill="#102A2B">從頭到尾都要成立的一：同意</text>
  <text x="84" y="578" font-size="17" fill="#102A2B">克隆別人的聲音要有同意或法律權利。使用政策禁止未經同意複製他人聲音、對當事人造成騷擾或傷害，</text>
  <text x="84" y="610" font-size="17" fill="#102A2B">也禁止以讓人誤以為不是人工智慧生成的方式使用，並禁止冒充政治候選人與民選官員。</text>

  <!-- band 2: disclosure -->
  <rect x="60" y="666" width="1478" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="84" y="708" font-size="20" font-weight="700" fill="#102A2B">從頭到尾都要成立的二：標示與偵測</text>
  <text x="84" y="744" font-size="17" fill="#102A2B">免費方案或未登入時發布，標題要加上 elevenlabs.io 或 11.ai；用音樂功能產生的要註明 Eleven Music。</text>
  <text x="84" y="776" font-size="17" fill="#5C6B6B">官方偵測工具只估計是否由自家模型生成，無法可靠辨識最新模型，也偵測不到其他供應商。</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
