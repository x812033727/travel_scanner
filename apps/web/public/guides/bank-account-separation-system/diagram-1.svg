<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">帳戶分離的金流 / How the accounts split the money</title>
<desc id="desc">薪水先進入第一個帳戶，房租、保險費、電信與訂閱的自動扣款都設在這裡，帳戶裡另外留一筆緩衝。發薪日之後，這個帳戶一次把錢分流到第二個帳戶生活費、第三個帳戶儲蓄，以及選配的第四個帳戶年度大額支出。圖的下方提醒：同一家銀行開幾個帳戶都一樣，存款保險按每一存款人與同一要保機構合計計算，最高保額新臺幣三百萬元。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">帳戶分離的金流：錢在發薪日就分好</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Separating accounts · 一個月分一次，之後不必每天決定</text>

<path d="M268 375 H322" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M710 330 H790 V195 H862" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M710 375 H862" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M710 420 H790 V555 H862" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="315" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="160" y="360" text-anchor="middle" font-size="17" fill="#5C6B6B">每個月</text>
<text x="160" y="398" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">薪水入帳</text>

<rect x="330" y="245" width="380" height="260" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="520" y="312" text-anchor="middle" font-size="17" fill="#5C6B6B">薪水從這裡進來</text>
<text x="520" y="360" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">帳戶一：薪轉與固定支出</text>
<text x="520" y="410" text-anchor="middle" font-size="18" fill="#5C6B6B">房租、保險費、電信、訂閱自動扣款</text>
<text x="520" y="448" text-anchor="middle" font-size="18" fill="#5C6B6B">帳戶裡留一筆緩衝</text>

<rect x="880" y="120" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1160" y="161" text-anchor="middle" font-size="17" fill="#5C6B6B">每月轉一筆進去</text>
<text x="1160" y="201" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">帳戶二：生活費</text>
<text x="1160" y="239" text-anchor="middle" font-size="18" fill="#5C6B6B">綁提款卡與行動支付，花完就是花完</text>

<rect x="880" y="300" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1160" y="341" text-anchor="middle" font-size="17" fill="#5C6B6B">只進不出，不綁提款卡</text>
<text x="1160" y="381" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">帳戶三：儲蓄</text>
<text x="1160" y="419" text-anchor="middle" font-size="18" fill="#5C6B6B">要動用得再轉一次，多一個步驟</text>

<rect x="880" y="480" width="560" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" stroke-dasharray="12 9"/>
<text x="1160" y="521" text-anchor="middle" font-size="17" fill="#5C6B6B">不是每個人都需要</text>
<text x="1160" y="561" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">帳戶四（選配）：年度大額支出</text>
<text x="1160" y="599" text-anchor="middle" font-size="18" fill="#5C6B6B">年繳保費、稅款、旅費先存起來</text>

<text x="60" y="566" font-size="20" fill="#5C6B6B">發薪日之後固定做一次分配，之後不再逐筆決定。</text>
<text x="60" y="602" font-size="20" fill="#5C6B6B">扣款日不由你決定，所以緩衝放在帳戶一。</text>

<rect x="60" y="690" width="1480" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="730" text-anchor="middle" font-size="20" fill="#102A2B">同一家銀行開幾個帳戶都一樣：存款保險按每一存款人與同一要保機構合計計算</text>
<text x="800" y="766" text-anchor="middle" font-size="20" fill="#5C6B6B">最高保額新臺幣 300 萬元，要分開計算的是機構，不是帳戶</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
