<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">帳戶分離法：用三到四個帳戶把錢分開管</title>
<desc id="desc">左側一個圓角方框裡有三條等長的橫線，像一張薪資明細；方框右邊伸出一條粗線，接上一條直立的幹線，再由幹線分出四道等長的橫向分流，分別指向四個同樣大小的圓角方塊。四個方塊由上而下畫著房子、卡片、鎖與日曆，代表固定支出、生活費、儲蓄與年度大額支出；最下面那個方塊的外框與通往它的分流都是虛線，表示它是選配的第四個帳戶。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="tipteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
<marker id="tipblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
<marker id="tipgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
<marker id="tiporange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
</defs>

