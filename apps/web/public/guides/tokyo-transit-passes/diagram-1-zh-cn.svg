<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1890" viewBox="0 0 1600 1890" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">东京交通票券决策树 / 如何选择东京交通票券</title><desc id="desc">先买一张 IC 卡。问题一：这趟会离开东京吗？不会就不买 JR Pass；会的话，七天内从东京到关西再回东京且还有其他长途才考虑 JR Pass，否则买单程新干线票或 JR TOKYO Wide Pass。问题二：在东京一天搭四趟以上地铁吗？不会就用 IC 卡逐次付费。会的话，问题三：景点大多在东京 Metro 与都营地铁沿线吗？是就买 Tokyo Subway Ticket 24、48、72 小时券；不是而且只有一天行程密集就买東京フリーきっぷ或都区内 Pass，多天的话用 IC 卡逐次付费、行程密集的那几天再买 24 小时券。</desc><rect width="1600" height="1890" fill="#F7F1E8"/><path d="M 305 366.79999999999995 V 456.79999999999995" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 311.5 H 710" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1100 366.79999999999995 V 461.79999999999995" fill="none" stroke="#B8442D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1490 311.5 H 1530 V 811 H 1470" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 570 1000.1 H 760" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 310 1055.4 V 1150.4" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1205.7 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1261 V 1376" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1412.8 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1449.6 V 1618.6" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="ic-banner-to-question-1" d="M 305 216.2 V 256.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="skip-jr-pass-to-question-2" d="M 305 530.4 V 944.8" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="750" y="461.79999999999995" width="720" height="175.39999999999998" rx="16" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="50" y="134.6" width="1500" height="81.6" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="750" y="737.1999999999999" width="720" height="147.60000000000002" rx="16" fill="#E3EEF4" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1376" width="620" height="147.5999999999999" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="710" y="256.2" width="780" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="944.8" width="730" height="110.60000000000014" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1150.4" width="680" height="110.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1618.6" width="680" height="110.59999999999991" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1150.4" width="620" height="110.59999999999991" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="944.8" width="520" height="110.60000000000014" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="256.2" width="510" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1376" width="680" height="73.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="456.79999999999995" width="510" height="73.60000000000002" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="70" y="1281" width="620" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="220" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1050" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1075.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1170.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1396" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1469.6" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1415" y="657.1999999999999" width="125" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="600" y="964.8" width="115" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="580" y="291.2" width="110" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">东京交通票券：回答三个问题选车票（价格于 2026 年 9 月核实）</tspan></text><text data-source-index="1" x="74" y="182.6" font-size="24" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="74" y="182.6">先买一张 IC 卡：Welcome Suica／TOURIST PASMO／iPhone 钱包 Suica</tspan></text><text data-source-index="2" x="70" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="300.2">问题 1　这次会离开东京，</tspan></text><text data-source-index="3" x="70" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="338.79999999999995">去大阪、京都或更远的地方吗？</tspan></text><text data-source-index="5" x="70" y="500.79999999999995" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="500.79999999999995">✕ 不买 JR Pass</tspan></text><text data-source-index="4" x="230" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="230" y="411.79999999999995">否</tspan></text><text data-source-index="7" x="730" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="730" y="300.2">7 天内 东京→关西→返回东京，</tspan></text><text data-source-index="8" x="730" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="730" y="338.79999999999995">途中还有其他长途行程？</tspan></text><text data-source-index="6" x="590" y="316.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="590" y="316.2">是</tspan></text><text data-source-index="10" x="780" y="503.79999999999995" font-size="22" font-weight="700" fill="#B8442D" xml:space="preserve"><tspan x="780" y="503.79999999999995">JR Pass 7 天普通车（成人）</tspan><tspan x="780" y="534.5999999999999">官网暂维持 50,000 日元</tspan><tspan x="780" y="565.4">海外代理店 2026/10/1 起 53,000 日元</tspan></text><text data-source-index="11" x="780" y="609.1999999999999" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="780" y="609.1999999999999">先用官网票价试算再买</tspan></text><text data-source-index="9" x="1060" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1060" y="411.79999999999995">是</tspan></text><text data-source-index="13" x="770" y="781.1999999999999" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="781.1999999999999">单程新干线票，或 JR TOKYO Wide Pass</tspan></text><text data-source-index="14" x="770" y="819.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="819.8">3 天 16,000 日元（日光、河口湖、轻井泽）</tspan></text><text data-source-index="15" x="770" y="856.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="856.8">在东京市内游玩时，接着看问题 2</tspan></text><text data-source-index="12" x="1425" y="682.1999999999999" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1425" y="682.1999999999999">否</tspan></text><text data-source-index="16" x="70" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="988.8">问题 2　在东京的日子，</tspan></text><text data-source-index="17" x="70" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1027.4">一天会搭 4 趟以上地铁吗？</tspan></text><text data-source-index="19" x="780" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="780" y="988.8">IC 卡按次付费</tspan></text><text data-source-index="20" x="780" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="780" y="1027.4">逐次刷卡最省事</tspan></text><text data-source-index="18" x="610" y="989.8" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="610" y="989.8">否</tspan></text><text data-source-index="22" x="70" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1194.4">问题 3　景点大多在 Metro／都营地铁沿线？</tspan></text><text data-source-index="23" x="70" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1233">（JR 山手线、百合海鸥号、小田急、东急不算）</tspan></text><text data-source-index="21" x="280" y="1100.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1100.4">是</tspan></text><text data-source-index="25" x="950" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1194.4">Tokyo Subway Ticket 东京地铁通票</tspan></text><text data-source-index="26" x="950" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1233">24h 1,000／48h 1,500／72h 2,000 日元，从首次进站起算</tspan></text><text data-source-index="24" x="770" y="1195.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1195.4">是</tspan></text><text data-source-index="28" x="70" y="1420" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1420">只有一天乘车这么密集？</tspan></text><text data-source-index="27" x="80" y="1306" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="80" y="1306">否，JR 也搭很多</tspan></text><text data-source-index="30" x="950" y="1420" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1420">東京フリーきっぷ 1,720 日元</tspan></text><text data-source-index="31" x="950" y="1458.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1458.6">JR 23 区＋地铁＋都营巴士</tspan></text><text data-source-index="32" x="950" y="1495.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1495.6">或 都区内 Pass 870（只搭 JR）</tspan></text><text data-source-index="29" x="770" y="1421" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1421">是</tspan></text><text data-source-index="34" x="70" y="1662.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1662.6">IC 卡按次付费</tspan></text><text data-source-index="35" x="70" y="1701.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1701.1999999999998">地铁搭得多的那几天再买 24h 券</tspan></text><text data-source-index="33" x="280" y="1494.6" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1494.6">否</tspan></text><text data-source-index="36" x="50" y="1784.1999999999998" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1784.1999999999998">按小时计（首次进站起算）：Tokyo Subway Ticket、Metro 24 小时券 700　｜　按日历天计：Metro・都营共通一日券 1,100、東京フリーきっぷ 1,720</tspan></text><text data-source-index="37" x="50" y="1840.1999999999998" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1840.1999999999998">© Mokaair 制图 2026</tspan></text></svg>
