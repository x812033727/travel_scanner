<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1930" viewBox="0 0 1600 1930" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">도쿄 교통권 결정도 / 어떤 도쿄 교통권을 살까</title><desc id="desc">먼저 IC 카드 한 장을 산다. 질문 하나: 이번 여행에서 도쿄를 벗어나는가? 아니라면 JR Pass를 사지 않는다. 그렇다면 일주일 안에 도쿄에서 간사이까지 갔다가 도쿄로 돌아오고 다른 장거리 이동도 있을 때에만 JR Pass를 고려한다. 그 외에는 편도 신칸센 승차권이나 JR TOKYO Wide Pass를 산다. 질문 둘: 도쿄에서 하루에 지하철을 네 번 이상 타는가? 아니라면 IC 카드로 탈 때마다 요금을 낸다. 그렇다면 질문 셋: 관광지 대부분이 도쿄 Metro와 도에이 지하철 노선 주변에 있는가? 그렇다면 Tokyo Subway Ticket 24, 48, 72시간권을 산다. 그렇지 않고 이동이 집중된 날이 하루뿐이라면 東京フリーきっぷ 또는 도쿄 도구나이 Pass를 산다. 여러 날이라면 IC 카드로 탈 때마다 요금을 내고, 이동이 집중된 날에만 24시간권을 산다.</desc><rect width="1600" height="1930" fill="#F7F1E8"/><path d="M 305 366.79999999999995 V 456.79999999999995" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 311.5 H 710" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1100 366.79999999999995 V 461.79999999999995" fill="none" stroke="#B8442D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1490 311.5 H 1530 V 811 H 1470" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 570 1000.1 H 760" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 310 1055.4 V 1150.4" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1222.5 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1294.6000000000001 V 1409.6000000000001" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1446.4 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1483.2 V 1652.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="ic-banner-to-question-1" d="M 305 216.2 V 256.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="skip-jr-pass-to-question-2" d="M 305 530.4 V 944.8" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="750" y="461.79999999999995" width="720" height="175.39999999999998" rx="16" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="50" y="134.6" width="1500" height="81.6" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="750" y="737.1999999999999" width="720" height="147.60000000000002" rx="16" fill="#E3EEF4" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1150.4" width="680" height="144.20000000000005" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1409.6000000000001" width="620" height="147.5999999999999" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="710" y="256.2" width="780" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="944.8" width="730" height="110.60000000000014" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1652.2" width="680" height="110.59999999999991" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1150.4" width="620" height="110.59999999999991" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="944.8" width="520" height="110.60000000000014" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="256.2" width="510" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1409.6000000000001" width="680" height="73.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="456.79999999999995" width="510" height="73.60000000000002" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="70" y="1314.6000000000001" width="620" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="220" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1050" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1075.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1170.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1429.6000000000001" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1503.2" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1415" y="657.1999999999999" width="125" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="600" y="964.8" width="115" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="580" y="291.2" width="110" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">도쿄 교통권: 질문 세 가지로 고르기(2026년 9월 확인 가격)</tspan></text><text data-source-index="1" x="74" y="182.6" font-size="24" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="74" y="182.6">먼저 IC 카드: Welcome Suica／TOURIST PASMO／iPhone Wallet Suica</tspan></text><text data-source-index="2" x="70" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="300.2">질문 1  이번 여행에서 도쿄를 떠나</tspan></text><text data-source-index="3" x="70" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="338.79999999999995">오사카·교토 또는 더 먼 곳에 가나?</tspan></text><text data-source-index="5" x="70" y="500.79999999999995" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="500.79999999999995">✕ JR Pass 사지 않기</tspan></text><text data-source-index="4" x="230" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="230" y="411.79999999999995">아니요</tspan></text><text data-source-index="7" x="730" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="730" y="300.2">7일 안에 도쿄→간사이→도쿄,</tspan></text><text data-source-index="8" x="730" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="730" y="338.79999999999995">그사이 다른 장거리 이동도 있나?</tspan></text><text data-source-index="6" x="590" y="316.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="590" y="316.2">예</tspan></text><text data-source-index="10" x="780" y="503.79999999999995" font-size="22" font-weight="700" fill="#B8442D" xml:space="preserve"><tspan x="780" y="503.79999999999995">JR Pass 7일 일반석(성인)</tspan><tspan x="780" y="534.5999999999999">공식 사이트는 당분간 50,000엔 유지</tspan><tspan x="780" y="565.4">해외 대리점은 2026/10/1부터 53,000엔</tspan></text><text data-source-index="11" x="780" y="609.1999999999999" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="780" y="609.1999999999999">공식 운임을 계산한 뒤 구매</tspan></text><text data-source-index="9" x="1060" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1060" y="411.79999999999995">예</tspan></text><text data-source-index="13" x="770" y="781.1999999999999" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="781.1999999999999">신칸센 편도표 또는 JR TOKYO Wide Pass</tspan></text><text data-source-index="14" x="770" y="819.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="819.8">3일 16,000엔(닛코·가와구치코·가루이자와)</tspan></text><text data-source-index="15" x="770" y="856.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="856.8">도쿄에 머무는 날은 질문 2로</tspan></text><text data-source-index="12" x="1425" y="682.1999999999999" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1425" y="682.1999999999999">아니요</tspan></text><text data-source-index="16" x="70" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="988.8">질문 2  도쿄에서 지내는 동안</tspan></text><text data-source-index="17" x="70" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1027.4">하루 지하철 4번 이상 타나?</tspan></text><text data-source-index="19" x="780" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="780" y="988.8">IC 카드로 탈 때마다 결제</tspan></text><text data-source-index="20" x="780" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="780" y="1027.4">탈 때마다 IC 카드를 태그하면 간편합니다</tspan></text><text data-source-index="18" x="610" y="989.8" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="610" y="989.8">아니요</tspan></text><text data-source-index="22" x="70" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1194.4">질문 3  관광지가 대부분 Metro／도에이 지하철 노선에 </tspan><tspan x="70" y="1228">있나?</tspan></text><text data-source-index="23" x="70" y="1266.6000000000001" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1266.6000000000001">(JR 야마노테선·유리카모메·오다큐·도큐 제외)</tspan></text><text data-source-index="21" x="280" y="1100.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1100.4">예</tspan></text><text data-source-index="25" x="950" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1194.4">Tokyo Subway Ticket 도쿄 지하철 패스</tspan></text><text data-source-index="26" x="950" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1233">24h 1,000／48h 1,500／72h 2,000엔, 첫 개찰부터 계산</tspan></text><text data-source-index="24" x="770" y="1195.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1195.4">예</tspan></text><text data-source-index="28" x="70" y="1453.6000000000001" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1453.6000000000001">이렇게 많이 타는 날이 하루뿐인가?</tspan></text><text data-source-index="27" x="80" y="1339.6000000000001" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="80" y="1339.6000000000001">아니요, JR도 자주 이용</tspan></text><text data-source-index="30" x="950" y="1453.6000000000001" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1453.6000000000001">東京フリーきっぷ 1,720엔</tspan></text><text data-source-index="31" x="950" y="1492.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1492.2">JR 23구＋지하철＋도에이 버스</tspan></text><text data-source-index="32" x="950" y="1529.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1529.2">또는 도구내 Pass 870(JR만 이용)</tspan></text><text data-source-index="29" x="770" y="1454.6000000000001" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1454.6000000000001">예</tspan></text><text data-source-index="34" x="70" y="1696.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1696.2">IC 카드로 탈 때마다 결제</tspan></text><text data-source-index="35" x="70" y="1734.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1734.8">지하철을 자주 타는 날에만 24h권 구매</tspan></text><text data-source-index="33" x="280" y="1528.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1528.2">아니요</tspan></text><text data-source-index="36" x="50" y="1817.8" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1817.8">시간제(첫 개찰부터): Tokyo Subway Ticket, Metro 24시간권 700엔 ｜ 날짜 기준: Metro·도에이 공통 하루권 1,100엔, 東京フリーきっぷ 1,720엔</tspan></text><text data-source-index="37" x="50" y="1873.8" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1873.8">© Mokaair 제작 2026</tspan></text></svg>
