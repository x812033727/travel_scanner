<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1950" viewBox="0 0 1600 1950" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">Tokyo transit ticket decision tree / Which Tokyo transit ticket to buy</title><desc id="desc">First, buy an IC card. Question one: Will you leave Tokyo on this trip? If no, do not buy a JR Pass. If yes, consider a JR Pass only if you travel from Tokyo to Kansai and back to Tokyo within seven days and also have other long-distance trips; otherwise, buy a one-way Shinkansen ticket or a JR TOKYO Wide Pass. Question two: Will you take the subway four or more times in one day in Tokyo? If no, pay for each ride with your IC card. If yes, question three: Are most of your sights along Tokyo Metro and Toei Subway lines? If yes, buy a Tokyo Subway Ticket for 24、48、72 hours. If no and you have only one day of intensive travel, buy a Tokyo Free Kippu or a Tokunai Pass. For multiple days, pay for each ride with your IC card and buy a 24-hour ticket for the intensive travel days.</desc><rect width="1600" height="1950" fill="#F7F1E8"/><path d="M 305 366.79999999999995 V 456.79999999999995" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 311.5 H 710" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1100 366.79999999999995 V 461.79999999999995" fill="none" stroke="#B8442D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1490 311.5 H 1530 V 811 H 1470" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 570 1000.1 H 760" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 310 1055.4 V 1150.4" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1222.5 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1294.6000000000001 V 1409.6000000000001" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1446.4 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1483.2 V 1652.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="ic-banner-to-question-1" d="M 305 216.2 V 256.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="skip-jr-pass-to-question-2" d="M 305 530.4 V 944.8" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="750" y="461.79999999999995" width="720" height="175.39999999999998" rx="16" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="50" y="134.6" width="1500" height="81.6" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="750" y="737.1999999999999" width="720" height="147.60000000000002" rx="16" fill="#E3EEF4" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1150.4" width="680" height="144.20000000000005" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1409.6000000000001" width="620" height="147.5999999999999" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="710" y="256.2" width="780" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="944.8" width="730" height="110.60000000000014" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1652.2" width="680" height="110.59999999999991" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1150.4" width="620" height="110.59999999999991" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="944.8" width="520" height="110.60000000000014" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="256.2" width="510" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1409.6000000000001" width="680" height="73.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="456.79999999999995" width="510" height="73.60000000000002" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="70" y="1314.6000000000001" width="620" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="220" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1050" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1075.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1170.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1429.6000000000001" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1503.2" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1415" y="657.1999999999999" width="125" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="600" y="964.8" width="115" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="580" y="291.2" width="110" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">Tokyo transit passes: choose yours with three questions (prices verified in 2026/9)</tspan></text><text data-source-index="1" x="74" y="182.6" font-size="24" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="74" y="182.6">First get an IC card: Welcome Suica／TOURIST PASMO／Suica in iPhone Wallet</tspan></text><text data-source-index="2" x="70" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="300.2">Question 1  Will you leave Tokyo</tspan></text><text data-source-index="3" x="70" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="338.79999999999995">for Osaka, Kyoto, or farther?</tspan></text><text data-source-index="5" x="70" y="500.79999999999995" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="500.79999999999995">✕ Skip the JR Pass</tspan></text><text data-source-index="4" x="230" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="230" y="411.79999999999995">No</tspan></text><text data-source-index="7" x="730" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="730" y="300.2">Within 7 days: Tokyo → Kansai → Tokyo,</tspan></text><text data-source-index="8" x="730" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="730" y="338.79999999999995">plus other long-distance trips?</tspan></text><text data-source-index="6" x="590" y="316.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="590" y="316.2">Yes</tspan></text><text data-source-index="10" x="780" y="503.79999999999995" font-size="22" font-weight="700" fill="#B8442D" xml:space="preserve"><tspan x="780" y="503.79999999999995">JR Pass 7-day ordinary class (adult)</tspan><tspan x="780" y="534.5999999999999">Official site temporarily stays at 50,000 yen</tspan><tspan x="780" y="565.4">Overseas agencies: 53,000 yen from 2026/10/1</tspan></text><text data-source-index="11" x="780" y="609.1999999999999" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="780" y="609.1999999999999">Check fares on the official site before buying</tspan></text><text data-source-index="9" x="1060" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1060" y="411.79999999999995">Yes</tspan></text><text data-source-index="13" x="770" y="781.1999999999999" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="781.1999999999999">One-way Shinkansen ticket or JR TOKYO Wide Pass</tspan></text><text data-source-index="14" x="770" y="819.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="819.8">3 days, 16,000 yen (Nikko, Lake Kawaguchi, Karuizawa)</tspan></text><text data-source-index="15" x="770" y="856.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="856.8">For days in Tokyo, go to question 2</tspan></text><text data-source-index="12" x="1425" y="682.1999999999999" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1425" y="682.1999999999999">No</tspan></text><text data-source-index="16" x="70" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="988.8">Question 2  On days in Tokyo,</tspan></text><text data-source-index="17" x="70" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1027.4">will you take 4+ subway rides a day?</tspan></text><text data-source-index="19" x="780" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="780" y="988.8">Pay per ride with an IC card</tspan></text><text data-source-index="20" x="780" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="780" y="1027.4">Tap for each ride to keep things simple.</tspan></text><text data-source-index="18" x="610" y="989.8" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="610" y="989.8">No</tspan></text><text data-source-index="22" x="70" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1194.4">Question 3  Are most sights along Metro／Toei </tspan><tspan x="70" y="1228">Subway lines?</tspan></text><text data-source-index="23" x="70" y="1266.6000000000001" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1266.6000000000001">(JR Yamanote, Yurikamome, Odakyu, Tokyu do not count)</tspan></text><text data-source-index="21" x="280" y="1100.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1100.4">Yes</tspan></text><text data-source-index="25" x="950" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1194.4">Tokyo Subway Ticket</tspan></text><text data-source-index="26" x="950" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1233">24h 1,000／48h 1,500／72h 2,000 yen; starts at first entry</tspan></text><text data-source-index="24" x="770" y="1195.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1195.4">Yes</tspan></text><text data-source-index="28" x="70" y="1453.6000000000001" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1453.6000000000001">Just one busy day?</tspan></text><text data-source-index="27" x="80" y="1339.6000000000001" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="80" y="1339.6000000000001">No; also taking JR often</tspan></text><text data-source-index="30" x="950" y="1453.6000000000001" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1453.6000000000001">Tokyo Free Ticket (東京フリーきっぷ): 1,720 yen</tspan></text><text data-source-index="31" x="950" y="1492.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1492.2">JR in 23 wards + subway + Toei buses</tspan></text><text data-source-index="32" x="950" y="1529.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1529.2">Or Tokunai Pass: 870 (JR only)</tspan></text><text data-source-index="29" x="770" y="1454.6000000000001" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1454.6000000000001">Yes</tspan></text><text data-source-index="34" x="70" y="1696.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1696.2">Pay per ride with an IC card</tspan></text><text data-source-index="35" x="70" y="1734.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1734.8">Add a 24h pass on subway-heavy days</tspan></text><text data-source-index="33" x="280" y="1528.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1528.2">No</tspan></text><text data-source-index="36" x="50" y="1817.8" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1817.8">Hourly validity (from first entry): Tokyo Subway Ticket, Metro 24-hour pass 700  ｜  Calendar-day validity: Metro–Toei Common Day Pass 1,100, Tokyo Free Ticket </tspan><tspan x="50" y="1845.8">1,720</tspan></text><text data-source-index="37" x="50" y="1901.8" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1901.8">© Mokaair illustration 2026</tspan></text></svg>
