<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">東京交通票券決策樹 / Which Tokyo transit ticket to buy</title>
  <desc id="desc">先買一張 IC 卡。問題一：這趟會離開東京嗎？不會就不買 JR Pass；會的話，七天內東京到關西再回東京且還有其他長途才考慮 JR Pass，否則買單程新幹線票或 JR TOKYO Wide Pass。問題二：在東京一天搭四趟以上地鐵嗎？不會就 IC 卡逐次付。會的話問題三：景點大多在東京 Metro 與都營地鐵沿線嗎？是就買 Tokyo Subway Ticket 24、48、72 小時券；不是而且只有一天密集就買東京フリーきっぷ或都區內 Pass，多天的話 IC 卡逐次付、密集那幾天再買 24 小時券。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">東京交通票券：三個問題選出你的票（2026 年 9 月查證價格）</text>

  <!-- start -->
  <rect x="470" y="70" width="660" height="60" rx="30" fill="#2E7D5B"/>
  <text x="800" y="108" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">先買一張 IC 卡：Welcome Suica／TOURIST PASMO／iPhone 錢包 Suica</text>
  <path d="M 800 132 L 800 168" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <polygon points="800,172 1070,232 800,292 530,232" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="226" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　這趟會離開東京，</text>
  <text x="800" y="252" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">去大阪、京都或更遠嗎？</text>
  <!-- Q1 no -->
  <path d="M 530 232 L 470 232 L 470 300" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="226" font-size="18" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="320" y="304" width="300" height="56" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="470" y="339" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">✕ 不買 JR Pass</text>
  <path d="M 470 362 L 470 400 L 800 400 L 800 428" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <!-- Q1 yes -->
  <path d="M 1070 232 L 1120 232 L 1120 300" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1090" y="226" font-size="18" fill="#5C6B6B">是</text>
  <polygon points="1290,304 1560,354 1290,404 1020,354" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1290" y="348" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">7 天內 東京→關西→回東京，</text>
  <text x="1290" y="372" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">中間還有其他長途？</text>
  <path d="M 1560 354 L 1580 354 L 1580 430 L 1520 430" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1565" y="346" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1100" y="410" width="420" height="64" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1310" y="437" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">JR Pass 7 天普通車 50,000 日圓（10/1 起 53,000）</text>
  <text x="1310" y="461" font-size="15" fill="#8A2E1D" text-anchor="middle">用官網票價試算過再買</text>
  <path d="M 1020 354 L 1000 354 L 1000 520 L 1100 520" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1006" y="346" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="1100" y="490" width="420" height="64" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1310" y="517" font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">單程新幹線票，或 JR TOKYO Wide Pass</text>
  <text x="1310" y="541" font-size="15" fill="#8A2E1D" text-anchor="middle">3 天 16,000 日圓（日光、河口湖、輕井澤）</text>
  <path d="M 1310 556 L 1310 580 L 1080 580" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text x="1200" y="600" font-size="14" fill="#5C6B6B" text-anchor="middle">東京市內的日子回到問題 2</text>

  <!-- Q2 -->
  <polygon points="800,432 1060,492 800,552 540,492" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="486" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　在東京的日子，</text>
  <text x="800" y="512" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">一天會搭 4 趟以上地鐵嗎？</text>
  <path d="M 540 492 L 470 492 L 470 560" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="486" font-size="18" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="300" y="564" width="340" height="64" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"/>
  <text x="470" y="591" font-size="18" font-weight="700" fill="#1F5C42" text-anchor="middle">IC 卡逐次付</text>
  <text x="470" y="615" font-size="15" fill="#1F5C42" text-anchor="middle">地鐵一趟 180–330 日圓</text>
  <path d="M 800 554 L 800 594" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="580" font-size="18" fill="#5C6B6B">是</text>

  <!-- Q3 -->
  <polygon points="800,598 1090,662 800,726 510,662" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="648" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　景點大多在 Metro／都營地鐵沿線？</text>
  <text x="800" y="674" font-size="15" fill="#5C6B6B" text-anchor="middle">（JR 山手線、百合海鷗號、小田急、東急都不算）</text>
  <path d="M 510 662 L 470 662 L 470 740" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="656" font-size="18" fill="#5C6B6B" text-anchor="end">是</text>
  <rect x="240" y="744" width="460" height="76" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="470" y="774" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">Tokyo Subway Ticket 東京地鐵通票</text>
  <text x="470" y="800" font-size="15" fill="#1F4E73" text-anchor="middle">24h 1,000／48h 1,500／72h 2,000 日圓，從首次進站起算</text>
  <path d="M 1090 662 L 1130 662 L 1130 720" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1100" y="656" font-size="18" fill="#5C6B6B">否，JR 也搭很多</text>
  <polygon points="1130,724 1290,780 1130,836 970,780" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1130" y="786" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">只有一天這樣密集？</text>
  <path d="M 1290 780 L 1310 780 L 1310 750 L 1330 750" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1296" y="770" font-size="15" fill="#5C6B6B">是</text>
  <rect x="1334" y="712" width="240" height="76" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1454" y="738" font-size="15" font-weight="700" fill="#1F4E73" text-anchor="middle">東京フリーきっぷ 1,720 日圓</text>
  <text x="1454" y="758" font-size="13" fill="#1F4E73" text-anchor="middle">JR 23 區＋地鐵＋都營巴士</text>
  <text x="1454" y="778" font-size="13" fill="#1F4E73" text-anchor="middle">或 都區內 Pass 870（只搭 JR）</text>
  <path d="M 1290 780 L 1310 780 L 1310 830 L 1330 830" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1296" y="822" font-size="15" fill="#5C6B6B">否</text>
  <rect x="1334" y="800" width="240" height="70" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1454" y="826" font-size="15" font-weight="700" fill="#1F5C42" text-anchor="middle">IC 卡逐次付</text>
  <text x="1454" y="848" font-size="13" fill="#1F5C42" text-anchor="middle">地鐵密集的那幾天再買 24h 券</text>

  <!-- note -->
  <text x="60" y="866" font-size="15" fill="#5C6B6B">小時制（首次進站起算）：Tokyo Subway Ticket、Metro 24 小時券 700　｜　日曆天制：Metro・都營共通一日券 1,100、東京フリーきっぷ 1,720</text>
  <text x="60" y="890" font-size="14" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
