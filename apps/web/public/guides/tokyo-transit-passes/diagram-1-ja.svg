<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1890" viewBox="0 0 1600 1890" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">東京の交通きっぷ決定チャート / どのきっぷを買う？</title><desc id="desc">まず IC カードを一枚買う。質問一：この旅で東京を離れるか？離れないなら JR Pass は買わない。離れる場合、七日以内に東京から関西へ行って東京に戻り、さらにほかの長距離移動もあるときだけ JR Pass を検討する。それ以外は新幹線の片道切符か JR TOKYO Wide Pass を買う。質問二：東京で一日に地下鉄に四回以上乗るか？乗らないなら IC カードで乗るたびに支払う。乗る場合は質問三：観光スポットの大半は東京 Metro と都営地下鉄の沿線にあるか？あるなら Tokyo Subway Ticket の 24、48、72 時間券を買う。そうでなく、移動が集中するのが一日だけなら東京フリーきっぷか都区内 Pass を買う。複数日なら IC カードで乗るたびに支払い、移動が集中する日だけ 24 時間券を買う。</desc><rect width="1600" height="1890" fill="#F7F1E8"/><path d="M 305 366.79999999999995 V 456.79999999999995" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 311.5 H 710" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1100 366.79999999999995 V 461.79999999999995" fill="none" stroke="#B8442D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1490 311.5 H 1530 V 811 H 1470" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 570 1000.1 H 760" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 310 1055.4 V 1150.4" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1205.7 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1261 V 1376" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 730 1412.8 H 930" fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 1449.6 V 1618.6" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="ic-banner-to-question-1" d="M 305 216.2 V 256.2" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path data-restored-flow="skip-jr-pass-to-question-2" d="M 305 530.4 V 944.8" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="750" y="461.79999999999995" width="720" height="175.39999999999998" rx="16" fill="#FCE8DF" stroke="#B8442D" stroke-width="3"/><rect x="50" y="134.6" width="1500" height="81.6" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="750" y="737.1999999999999" width="720" height="147.60000000000002" rx="16" fill="#E3EEF4" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1376" width="620" height="147.5999999999999" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="710" y="256.2" width="780" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="944.8" width="730" height="110.60000000000014" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1150.4" width="680" height="110.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1618.6" width="680" height="110.59999999999991" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="930" y="1150.4" width="620" height="110.59999999999991" rx="16" fill="#DDEEE7" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="944.8" width="520" height="110.60000000000014" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="256.2" width="510" height="110.59999999999997" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="1376" width="680" height="73.59999999999991" rx="16" fill="#FFF1CB" stroke="#0D6B68" stroke-width="3"/><rect x="50" y="456.79999999999995" width="510" height="73.60000000000002" rx="16" fill="#EFE6DD" stroke="#0D6B68" stroke-width="3"/><rect x="70" y="1281" width="620" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="220" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1050" y="386.79999999999995" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1075.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1170.4" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="760" y="1396" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="270" y="1469.6" width="130" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="1415" y="657.1999999999999" width="125" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="600" y="964.8" width="115" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><rect x="580" y="291.2" width="110" height="38" rx="10" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">東京の交通きっぷ：三つの質問で選ぶ（価格は2026年9月に確認）</tspan></text><text data-source-index="1" x="74" y="182.6" font-size="24" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="74" y="182.6">まずICカードを一枚：Welcome Suica／TOURIST PASMO／iPhoneのウォレットのSuica</tspan></text><text data-source-index="2" x="70" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="300.2">質問 1　東京を離れて、</tspan></text><text data-source-index="3" x="70" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="338.79999999999995">大阪・京都やさらに遠くへ行く？</tspan></text><text data-source-index="5" x="70" y="500.79999999999995" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="500.79999999999995">✕ JR Passは買わない</tspan></text><text data-source-index="4" x="230" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="230" y="411.79999999999995">いいえ</tspan></text><text data-source-index="7" x="730" y="300.2" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="730" y="300.2">7日以内に東京→関西→東京へ戻り、</tspan></text><text data-source-index="8" x="730" y="338.79999999999995" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="730" y="338.79999999999995">ほかの長距離移動もある？</tspan></text><text data-source-index="6" x="590" y="316.2" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="590" y="316.2">はい</tspan></text><text data-source-index="10" x="780" y="503.79999999999995" font-size="22" font-weight="700" fill="#B8442D" xml:space="preserve"><tspan x="780" y="503.79999999999995">JR Pass 7日間 普通車（大人）</tspan><tspan x="780" y="534.5999999999999">公式サイトは当面50,000円を維持</tspan><tspan x="780" y="565.4">海外代理店は2026/10/1から53,000円</tspan></text><text data-source-index="11" x="780" y="609.1999999999999" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="780" y="609.1999999999999">公式運賃で試算してから購入</tspan></text><text data-source-index="9" x="1060" y="411.79999999999995" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1060" y="411.79999999999995">はい</tspan></text><text data-source-index="13" x="770" y="781.1999999999999" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="781.1999999999999">新幹線の片道券、またはJR TOKYO Wide Pass</tspan></text><text data-source-index="14" x="770" y="819.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="819.8">3日間16,000円（日光・河口湖・軽井沢）</tspan></text><text data-source-index="15" x="770" y="856.8" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="770" y="856.8">東京市内の日程は質問 2へ</tspan></text><text data-source-index="12" x="1425" y="682.1999999999999" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1425" y="682.1999999999999">いいえ</tspan></text><text data-source-index="16" x="70" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="988.8">質問 2　東京にいる日は、</tspan></text><text data-source-index="17" x="70" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1027.4">一日に地下鉄を4回以上利用する？</tspan></text><text data-source-index="19" x="780" y="988.8" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="780" y="988.8">ICカードで都度払い</tspan></text><text data-source-index="20" x="780" y="1027.4" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="780" y="1027.4">乗るたびにICカードをタッチするのが手軽</tspan></text><text data-source-index="18" x="610" y="989.8" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="610" y="989.8">いいえ</tspan></text><text data-source-index="22" x="70" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1194.4">質問 3　行き先は主にメトロ／都営地下鉄沿線？</tspan></text><text data-source-index="23" x="70" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1233">（JR山手線、ゆりかもめ、小田急、東急は対象外）</tspan></text><text data-source-index="21" x="280" y="1100.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1100.4">はい</tspan></text><text data-source-index="25" x="950" y="1194.4" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1194.4">Tokyo Subway Ticket 地下鉄乗り放題券</tspan></text><text data-source-index="26" x="950" y="1233" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1233">24h 1,000／48h 1,500／72h 2,000円、初回入場時から</tspan></text><text data-source-index="24" x="770" y="1195.4" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1195.4">はい</tspan></text><text data-source-index="28" x="70" y="1420" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1420">移動が集中するのは一日だけ？</tspan></text><text data-source-index="27" x="80" y="1306" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="80" y="1306">いいえ、JRにも多く乗る</tspan></text><text data-source-index="30" x="950" y="1420" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="950" y="1420">東京フリーきっぷ1,720円</tspan></text><text data-source-index="31" x="950" y="1458.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1458.6">JRの23区内＋地下鉄＋都営バス</tspan></text><text data-source-index="32" x="950" y="1495.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="950" y="1495.6">または都区内パス870（JRのみ）</tspan></text><text data-source-index="29" x="770" y="1421" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="770" y="1421">はい</tspan></text><text data-source-index="34" x="70" y="1662.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="1662.6">ICカードで都度払い</tspan></text><text data-source-index="35" x="70" y="1701.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1701.1999999999998">地下鉄を多く使う日に24h券を追加</tspan></text><text data-source-index="33" x="280" y="1494.6" font-size="20" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="280" y="1494.6">いいえ</tspan></text><text data-source-index="36" x="50" y="1784.1999999999998" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1784.1999999999998">時間制（最初の改札入場から）：Tokyo Subway Ticket、メトロ24時間券700　｜　暦日制：メトロ・都営共通一日券1,100、東京フリーきっぷ1,720</tspan></text><text data-source-index="37" x="50" y="1840.1999999999998" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1840.1999999999998">© Mokaair 作図 2026</tspan></text></svg>
