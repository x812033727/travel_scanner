<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">理財的五個步驟與完成判準</title>
<desc id="desc">五個階梯由左下往右上排列：記錄收支、緊急預備金、清理高利負債、補足保障、開始投資。每一階標示做到什麼程度算完成，前四階完成後才進入最後一階的投資。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">理財的五個步驟與完成判準</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Personal finance, in order · 前一階完成才往上走</text>

<path d="M300 760 L350 660" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M610 660 L660 560" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M920 560 L970 460" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1230 460 L1280 360" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

<rect x="40" y="690" width="260" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="170" y="728" text-anchor="middle" font-size="17" fill="#5C6B6B">第一步</text>
<text x="170" y="768" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">記錄收支</text>
<text x="170" y="804" text-anchor="middle" font-size="18" fill="#5C6B6B">算得出結餘</text>

<rect x="350" y="590" width="260" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="480" y="628" text-anchor="middle" font-size="17" fill="#5C6B6B">第二步</text>
<text x="480" y="668" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">緊急預備金</text>
<text x="480" y="704" text-anchor="middle" font-size="18" fill="#5C6B6B">三到六個月必要支出</text>

<rect x="660" y="490" width="260" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="790" y="528" text-anchor="middle" font-size="17" fill="#5C6B6B">第三步</text>
<text x="790" y="568" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">清理高利負債</text>
<text x="790" y="604" text-anchor="middle" font-size="18" fill="#5C6B6B">利率高的先還</text>

<rect x="970" y="390" width="260" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1100" y="428" text-anchor="middle" font-size="17" fill="#5C6B6B">第四步</text>
<text x="1100" y="468" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">補足保障</text>
<text x="1100" y="504" text-anchor="middle" font-size="18" fill="#5C6B6B">確認缺口在哪</text>

<rect x="1280" y="290" width="260" height="140" rx="22" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1410" y="328" text-anchor="middle" font-size="17" fill="#5C6B6B">第五步</text>
<text x="1410" y="368" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">開始投資</text>
<text x="1410" y="404" text-anchor="middle" font-size="18" fill="#5C6B6B">投入長期用不到的錢</text>

<text x="40" y="252" font-size="20" fill="#5C6B6B">每一階的標示是「做到什麼算完成」，不是金額建議。</text>
<text x="40" y="286" font-size="20" fill="#5C6B6B">卡住的時候往下找第一個沒完成的階段，只做那一階。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
