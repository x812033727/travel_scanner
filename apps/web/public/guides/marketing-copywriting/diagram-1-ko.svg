<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">가치에서 다음 단계로 이끄는 문구</title><desc id="desc">네 장의 카드로 대상 독자의 상황, 구체적인 가치, 근거와 조건, 행동 경로를 제시하며 문구가 실제 제공 내용과 일치해야 함을 강조한 그림.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">가치에서 다음 단계로 이끄는 문구</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">단계마다 독자의 질문에 답하고 실제 서비스로 뒷받침</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">독자의 상황</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">누구에게, 언제 적합한가</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">서비스 핵심부터 설명</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">구체적인 가치</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">특징을 쓰임과 연결</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">보장으로 확대 금지</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">근거와 조건</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">주장·가격·범위</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">중요 제한은 잘 보이게</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">다음 단계</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">버튼에 동작 설명</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">실제 절차 확인</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">매력은 이해·검증·실제 제공이 가능한 정보에서 나옵니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 직접 제작</text>
</svg>
