<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Copy: From Value to Next Steps</title><desc id="desc">Four cards show audience context, specific value, evidence and conditions, and ways to act, reminding writers that copy must match what is delivered.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Copy: From Value to Next Steps</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Each layer answers readers' questions and is backed by the service</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Audience Context</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Who it suits and when</text>
<text x="108.0" y="423" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">Start with the core service</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Specific Value</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Features to uses</text>
<text x="477.0" y="423" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Do not turn them into guarantees</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="23" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 23px;">Evidence and Conditions</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Claims, prices, and scope</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Keep key limits visible</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Next Step</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Buttons describe actions</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Check the actual process</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Appeal rests on information people can understand, verify, and expect to be delivered.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
