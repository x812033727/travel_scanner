<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">主題指數的規則篩出 ETF 的持股 / Index rules filter a theme into holdings</title>
<desc id="desc">米色底的插圖。左邊散落十幾個青綠、藍、橘、綠、灰色的圓點，代表主題範圍裡的候選公司。中間是一個橫放的藍色漏斗，寬口朝左、窄口朝右，漏斗裡只剩幾個圓點，一個圓點正從窄口出去，代表依編製規則篩選。漏斗右邊一條箭頭指進右邊的白色方框，框裡排成三乘三、大小相同的九個色塊，代表最後的持股。</desc>
