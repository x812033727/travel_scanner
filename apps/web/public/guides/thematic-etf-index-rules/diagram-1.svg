<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">主題指數的規則怎麼變成 ETF 的持股 / From index methodology to ETF holdings</title>
<desc id="desc">上排四個青綠色方框由左到右排成一列，代表指數編製規則決定的事：第一框採樣範圍，寫著產業分類或母指數、產業價值鏈上中下游、營收占比門檻；第二框篩選與排序，寫著市值與成交金額、財務與股利條件、殖利率、動能等因子排序；第三框加權與上限，寫著市值加權或等權重、單一成分股上限、前五大合計上限；第四框定期審核，寫著每季或每半年、緩衝區與替換上限、調整過渡期。四框下方匯成一條線，往下指到中間的藍色 ETF 方框，寫著依規則買進並定期調整。ETF 方框左邊是橘色的集中度上限方框，寫著一般基金投資單一公司不超過淨資產 10%，指數型 ETF 原則上以指數權重為限；右邊是綠色的規則修改與審核結果方框，寫著公布在指數公司的技術通知頁，重大修改原則上提前公告。ETF 方框往下分成四個箭頭，指到下排四個白底藍框，代表 ETF 運作後看得到的結果：持股明細每個營業日公布，含申購買回清單；內扣費用看經理費、保管費與年度費用率；追蹤差距是 ETF 報酬減指數報酬，追蹤誤差是它的標準差；淨值與折溢價是市價與淨值的差，連結海外指數時受時差與匯率影響，可在證交所 ETF e添富查。持股框另寫月前十大看集中度，內扣費用框另寫各項費用比率按月更新，追蹤差距框另寫公開說明書載明公式。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A2B"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">主題指數的規則，怎麼變成 ETF 的持股</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">From index methodology to what an ETF actually holds</text>

<text x="65" y="135" font-size="20" font-weight="700" fill="#0D6B68">指數編製規則決定的事</text>

<rect x="65" y="152" width="330" height="168" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="230" y="194" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">採樣範圍</text>
<text x="230" y="232" font-size="16" fill="#102A2B" text-anchor="middle">產業分類或母指數</text>
<text x="230" y="262" font-size="16" fill="#102A2B" text-anchor="middle">產業價值鏈上中下游</text>
<text x="230" y="292" font-size="16" fill="#102A2B" text-anchor="middle">營收占比門檻</text>

<rect x="445" y="152" width="330" height="168" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="610" y="194" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">篩選與排序</text>
<text x="610" y="232" font-size="16" fill="#102A2B" text-anchor="middle">市值、成交金額</text>
<text x="610" y="262" font-size="16" fill="#102A2B" text-anchor="middle">財務與股利條件</text>
<text x="610" y="292" font-size="16" fill="#102A2B" text-anchor="middle">殖利率、動能等因子排序</text>

<rect x="825" y="152" width="330" height="168" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="990" y="194" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">加權與上限</text>
<text x="990" y="232" font-size="16" fill="#102A2B" text-anchor="middle">市值加權或等權重</text>
<text x="990" y="262" font-size="16" fill="#102A2B" text-anchor="middle">單一成分股上限</text>
<text x="990" y="292" font-size="16" fill="#102A2B" text-anchor="middle">前五大合計上限</text>

<rect x="1205" y="152" width="330" height="168" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1370" y="194" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">定期審核</text>
<text x="1370" y="232" font-size="16" fill="#102A2B" text-anchor="middle">每季或每半年</text>
<text x="1370" y="262" font-size="16" fill="#102A2B" text-anchor="middle">緩衝區、替換上限</text>
<text x="1370" y="292" font-size="16" fill="#102A2B" text-anchor="middle">調整過渡期</text>

<line x1="399" y1="236" x2="441" y2="236" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="779" y1="236" x2="821" y2="236" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="1159" y1="236" x2="1201" y2="236" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

<path d="M230 322 V350 M610 322 V350 M990 322 V350 M1370 322 V350 M230 350 H1370" fill="none" stroke="#102A2B" stroke-width="3" stroke-linecap="butt"/>
<line x1="800" y1="350" x2="800" y2="384" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="65" y="388" width="470" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="300" y="424" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">集中度上限</text>
<text x="300" y="456" font-size="16" fill="#102A2B" text-anchor="middle">一般基金投資單一公司不超過淨資產 10%</text>
<text x="300" y="486" font-size="16" fill="#102A2B" text-anchor="middle">指數型 ETF 原則上以指數權重為限</text>

<rect x="600" y="388" width="400" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="438" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">ETF</text>
<text x="800" y="476" font-size="18" fill="#102A2B" text-anchor="middle">依規則買進，定期調整</text>

<rect x="1065" y="388" width="470" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1300" y="424" font-size="18" font-weight="700" fill="#2E7D5B" text-anchor="middle">規則修改與審核結果</text>
<text x="1300" y="456" font-size="16" fill="#102A2B" text-anchor="middle">公布在指數公司的技術通知頁</text>
<text x="1300" y="486" font-size="16" fill="#102A2B" text-anchor="middle">重大修改原則上提前公告</text>

<line x1="800" y1="510" x2="800" y2="538" stroke="#102A2B" stroke-width="3" stroke-linecap="butt"/>
<line x1="230" y1="538" x2="1370" y2="538" stroke="#102A2B" stroke-width="3" stroke-linecap="butt"/>
<line x1="230" y1="537" x2="230" y2="568" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="610" y1="537" x2="610" y2="568" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="990" y1="537" x2="990" y2="568" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="1370" y1="537" x2="1370" y2="568" stroke="#102A2B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="65" y="576" width="330" height="168" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="230" y="618" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">持股明細</text>
<text x="230" y="658" font-size="16" fill="#102A2B" text-anchor="middle">每個營業日公布</text>
<text x="230" y="688" font-size="16" fill="#102A2B" text-anchor="middle">含申購買回清單</text>
<text x="230" y="718" font-size="16" fill="#102A2B" text-anchor="middle">月前十大看集中度</text>

<rect x="445" y="576" width="330" height="168" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="610" y="618" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">內扣費用</text>
<text x="610" y="658" font-size="16" fill="#102A2B" text-anchor="middle">經理費、保管費</text>
<text x="610" y="688" font-size="16" fill="#102A2B" text-anchor="middle">年度費用率</text>
<text x="610" y="718" font-size="16" fill="#102A2B" text-anchor="middle">各項費用比率按月更新</text>

<rect x="825" y="576" width="330" height="168" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="990" y="618" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">追蹤差距</text>
<text x="990" y="658" font-size="16" fill="#102A2B" text-anchor="middle">ETF 報酬減指數報酬</text>
<text x="990" y="688" font-size="16" fill="#102A2B" text-anchor="middle">追蹤誤差是它的標準差</text>
<text x="990" y="718" font-size="16" fill="#102A2B" text-anchor="middle">公開說明書載明公式</text>

<rect x="1205" y="576" width="330" height="168" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1370" y="618" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">淨值與折溢價</text>
<text x="1370" y="658" font-size="16" fill="#102A2B" text-anchor="middle">市價與淨值的差</text>
<text x="1370" y="688" font-size="16" fill="#102A2B" text-anchor="middle">海外指數受時差與匯率影響</text>
<text x="1370" y="718" font-size="16" fill="#102A2B" text-anchor="middle">證交所 e添富可查</text>

<text x="65" y="792" font-size="20" font-weight="700" fill="#2F6F9F">ETF 運作後看得到的結果</text>
