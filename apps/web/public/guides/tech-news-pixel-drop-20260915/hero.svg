<title id="title">Google 9 月 Pixel Drop 更新：機型、地區語言與 Pixel Watch 5 的條件</title><desc id="desc">原創插圖：左邊一支手機，螢幕上有四個小方格代表這次更新的功能；一支箭頭向右穿過四道上下兩截、中間留有缺口的直線關卡，盡頭是一個被虛線圈住的圓形，代表只有特定手錶適用的功能；不呈現實際機身外觀或任何商標</desc>
