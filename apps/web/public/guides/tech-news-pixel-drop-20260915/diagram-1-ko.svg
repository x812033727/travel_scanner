<title id="title">Pixel Drop의 네 관문</title><desc id="desc">Google 9월 Pixel Drop의 포럼 게시물과 Pixel Watch 업데이트 안내를 바탕으로 정리: 기종·지역·언어·페어링이라는 네 가지 관문. 확인일 2026년 9월 17일.</desc>
