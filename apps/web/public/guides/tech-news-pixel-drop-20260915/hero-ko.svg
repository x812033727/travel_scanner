<title id="title">Google 9월 Pixel Drop 업데이트: 기종·지역·언어와 Pixel Watch 5의 조건</title><desc id="desc">오리지널 일러스트: 왼쪽에 이번 업데이트 기능을 나타내는 작은 사각형 네 개가 화면에 있는 스마트폰. 오른쪽 화살표가 위아래로 나뉘고 가운데가 빈 관문 네 개를 지나 점선 원에 닿는다. 특정 스마트워치에만 적용되는 기능을 뜻하며, 실제 기기 외관이나 상표는 그리지 않았다.</desc>
