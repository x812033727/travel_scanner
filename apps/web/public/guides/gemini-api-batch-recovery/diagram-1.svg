<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">工作完成後，仍要逐題核對</title><desc id="desc">送件：固定題目識別碼：逾時先核對原工作；分類：缺項與故障分開：已成功題目不重送；重試：引用父工作紀錄：驗雜湊與次數上限；採用：每題只採用一次：保留未解決項目</desc><rect width="1600" height="900" fill="#edf3f6"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="61" fill="#263b38" font-weight="800">工作完成後，仍要逐題核對</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">送件</text><text x="120" y="311" font-size="52" fill="#263b38" font-weight="500">固定題目識別碼</text><text x="120" y="379" font-size="52" fill="#263b38" font-weight="500">逾時先核對原工作</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">分類</text><text x="855" y="311" font-size="52" fill="#263b38" font-weight="500">缺項與故障分開</text><text x="855" y="379" font-size="52" fill="#263b38" font-weight="500">已成功題目不重送</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">重試</text><text x="120" y="601" font-size="52" fill="#263b38" font-weight="500">引用父工作紀錄</text><text x="120" y="669" font-size="52" fill="#263b38" font-weight="500">驗雜湊與次數上限</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">採用</text><text x="855" y="601" font-size="52" fill="#263b38" font-weight="500">每題只採用一次</text><text x="855" y="669" font-size="52" fill="#263b38" font-weight="500">保留未解決項目</text><text x="85" y="818" font-size="47" fill="#365477" font-weight="500">二十題合成故障已測；Batch 待驗</text></g></svg>