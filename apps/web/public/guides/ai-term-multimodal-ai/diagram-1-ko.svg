<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">자료는 서로 보완하고, 관찰과 추측은 구분</title>
<desc id="desc">부품 전체 모습, 라벨 근접 사진, 설명문이 함께 단서를 제공하고, 모델의 답변은 눈에 보이는 사실과 확인이 필요한 판단으로 나뉩니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">자료는 서로 보완하고, 관찰과 추측은 구분</text><text x="60" y="84" font-size="18" fill="#5C6B6B">멀티모달 AI · 수납 선반 부품 식별</text><path d="M470 240 H570 V390 H650" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M470 500 H650" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M470 735 H570 V480 H650" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M1050 430 H1180" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><rect x="70" y="150" width="400" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="232" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">부품 사진</text><text x="270" y="282" text-anchor="middle" font-size="25" fill="#5C6B6B">외관과 위치</text><rect x="70" y="410" width="400" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="492" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">라벨 근접 사진</text><text x="270" y="542" text-anchor="middle" font-size="25" fill="#5C6B6B">읽을 수 있는 글자</text><rect x="70" y="670" width="400" height="130" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="270" y="727" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">설명서</text><text x="270" y="777" text-anchor="middle" font-size="25" fill="#5C6B6B">제품 규칙</text><rect x="660" y="330" width="390" height="200" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="855" y="422" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">종합 판독</text><text x="855" y="472" text-anchor="middle" font-size="25" fill="#5C6B6B">출처 간 관계 대조</text><rect x="1190" y="330" width="340" height="200" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1360" y="422" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">결과 확인</text><text x="1360" y="472" text-anchor="middle" font-size="25" fill="#5C6B6B">관찰됨／확인 필요</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text>
