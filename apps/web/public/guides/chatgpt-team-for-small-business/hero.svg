<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">三個對話泡泡圍著一張放了鎖頭的會議桌 / Three speech bubbles around a meeting table with a padlock on it</title>
  <desc id="desc">米色底上畫著一張圓形會議桌，桌面中央放著一個深綠色的鎖頭，代表公司工作區裡的資料受到保護。三個顏色不同的對話泡泡從左上、正上方與右上三個方向圍著桌子，泡泡裡是幾條代表文字的橫線，代表三位同事在同一個工作區裡各自對話。下方一行字「一張帳單，資料不訓練」。沒有任何品牌標誌或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- table pedestal and top -->
  <ellipse cx="800" cy="748" rx="150" ry="28" fill="#102A2B"/>
  <rect x="766" y="620" width="68" height="130" rx="10" fill="#102A2B"/>
  <ellipse cx="800" cy="560" rx="360" ry="135" fill="#E8DCC6" stroke="#102A2B" stroke-width="6"/>
  <ellipse cx="800" cy="540" rx="300" ry="100" fill="none" stroke="#102A2B" stroke-width="3" stroke-dasharray="14 12" opacity="0.35"/>

  <!-- padlock -->
  <path d="M 758 478 V 430 A 42 42 0 0 1 842 430 V 478" fill="none" stroke="#102A2B" stroke-width="16" stroke-linecap="round"/>
  <rect x="728" y="472" width="144" height="118" rx="20" fill="#0D6B68" stroke="#102A2B" stroke-width="6"/>
  <circle cx="800" cy="518" r="15" fill="#F7F1E8"/>
  <rect x="792" y="524" width="16" height="34" rx="6" fill="#F7F1E8"/>

  <!-- left bubble -->
  <path d="M 190 250 h 330 a 40 40 0 0 1 40 40 v 110 a 40 40 0 0 1 -40 40 h -140 l -50 60 v -60 h -140 a 40 40 0 0 1 -40 -40 v -110 a 40 40 0 0 1 40 -40 z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6" stroke-linejoin="round"/>
  <rect x="230" y="292" width="210" height="18" rx="9" fill="#2F6F9F"/>
  <rect x="230" y="330" width="260" height="18" rx="9" fill="#2F6F9F"/>
  <rect x="230" y="368" width="160" height="18" rx="9" fill="#2F6F9F"/>

  <!-- top bubble -->
  <path d="M 635 100 h 330 a 40 40 0 0 1 40 40 v 110 a 40 40 0 0 1 -40 40 h -135 l -30 50 l -30 -50 h -135 a 40 40 0 0 1 -40 -40 v -110 a 40 40 0 0 1 40 -40 z" fill="#FCEFE4" stroke="#D97A2B" stroke-width="6" stroke-linejoin="round"/>
  <rect x="675" y="142" width="230" height="18" rx="9" fill="#D97A2B"/>
  <rect x="675" y="180" width="180" height="18" rx="9" fill="#D97A2B"/>
  <rect x="675" y="218" width="250" height="18" rx="9" fill="#D97A2B"/>

  <!-- right bubble -->
  <path d="M 1080 250 h 330 a 40 40 0 0 1 40 40 v 110 a 40 40 0 0 1 -40 40 h -140 v 60 l -50 -60 h -140 a 40 40 0 0 1 -40 -40 v -110 a 40 40 0 0 1 40 -40 z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6" stroke-linejoin="round"/>
  <rect x="1120" y="292" width="250" height="18" rx="9" fill="#0D6B68"/>
  <rect x="1120" y="330" width="170" height="18" rx="9" fill="#0D6B68"/>
  <rect x="1120" y="368" width="220" height="18" rx="9" fill="#0D6B68"/>

  <text x="800" y="850" font-size="46" font-weight="700" fill="#102A2B" text-anchor="middle">一張帳單，資料不訓練</text>
</svg>
