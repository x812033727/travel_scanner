<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Screen out unmet needs, then explain trade-offs with evidence</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Requirements</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Essential features</text>
<text x="108.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">Maintenance duties</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Confirm gaps first</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Testing</text>
