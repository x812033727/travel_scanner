<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">越南落地三件事：出發前、機場、市區 / Vietnam arrival: get online, get VND, get a ride</title>
  <desc id="desc">三列三欄的流程圖。上網：出發前用 eSIM 或 Viettel 旅客網站線上購卡，要上傳護照照片與人像照；機場到 Viettel、Vinaphone、Mobifone 電信櫃台買 SIM，出示護照；市區店家也能買卡與儲值。錢：出發前在台灣換美金，越南盾只換少量；機場到銀行櫃台或 ATM 領第一天的越南盾；市區到銀行櫃台換錢，刷卡一律選 VND。警示：未獲准的換匯處（含無授權金店）、個人之間換錢：未滿 1,000 美元警告，1,000 到未滿 10,000 美元罰 10,000,000 到 20,000,000 越南盾。叫車：出發前裝 Grab、Xanh SM、Be 並綁卡；機場照 App 指示走到上車點，計程車選 Vinasun、Mai Linh 並跳表；市區上車前核對車牌。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">越南落地三件事：出發前 → 機場 → 市區</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Get online, get VND, get a ride: before you go → arrival hall → in the city</text>

  <!-- column headers -->
  <text x="475" y="138" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">出發前 Before you go</text>
  <text x="925" y="138" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">機場入境大廳 Arrival hall</text>
  <text x="1375" y="138" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">市區 In the city</text>

  <!-- row 1: internet (teal) -->
  <rect x="40" y="160" width="200" height="120" rx="14" fill="#0D6B68" stroke="#0D6B68" stroke-width="4"/>
  <text x="140" y="212" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">上網</text>
  <text x="140" y="248" font-size="17" fill="#FFFFFF" text-anchor="middle">Internet</text>

  <rect x="280" y="160" width="390" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="475" y="210" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">eSIM 或線上購卡 Online</text>
  <text x="475" y="246" font-size="17" fill="#0B4F4D" text-anchor="middle">上傳護照照片＋人像照</text>
  <path d="M 670 220 L 726 220" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="730" y="160" width="390" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="925" y="210" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">Viettel／Vinaphone／Mobifone</text>
  <text x="925" y="246" font-size="17" fill="#0B4F4D" text-anchor="middle">電信櫃台買 SIM，出示護照</text>
  <path d="M 1120 220 L 1176 220" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1180" y="160" width="390" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1375" y="210" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">市區店家買卡、儲值</text>
  <text x="1375" y="246" font-size="17" fill="#0B4F4D" text-anchor="middle">Nạp thẻ 儲值卡加值</text>

  <!-- row 2: money (mocha) -->
  <rect x="40" y="310" width="200" height="120" rx="14" fill="#6B4A3A" stroke="#6B4A3A" stroke-width="4"/>
  <text x="140" y="362" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">錢</text>
  <text x="140" y="398" font-size="17" fill="#FFFFFF" text-anchor="middle">Money · Tiền</text>

  <rect x="280" y="310" width="390" height="120" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="475" y="360" font-size="19" font-weight="700" fill="#4E3428" text-anchor="middle">在台灣換美金 USD</text>
  <text x="475" y="396" font-size="17" fill="#4E3428" text-anchor="middle">越南盾 VND 只換少量</text>
  <path d="M 670 370 L 726 370" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="730" y="310" width="390" height="120" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="925" y="360" font-size="19" font-weight="700" fill="#4E3428" text-anchor="middle">銀行櫃台或 ATM</text>
  <text x="925" y="396" font-size="17" fill="#4E3428" text-anchor="middle">領第一天要用的 VND</text>
  <path d="M 1120 370 L 1176 370" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1180" y="310" width="390" height="120" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="1375" y="360" font-size="19" font-weight="700" fill="#4E3428" text-anchor="middle">Đổi tiền 換錢：銀行櫃台</text>
  <text x="1375" y="396" font-size="17" fill="#4E3428" text-anchor="middle">刷卡一律選 VND 結帳</text>

  <!-- warning bar under the money row -->
  <rect x="730" y="448" width="840" height="96" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <circle cx="772" cy="496" r="22" fill="#B8442D"/>
  <text x="772" y="504" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="1175" y="486" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">未獲准的換匯處（含無授權金店）、個人之間換錢：</text>
  <text x="1175" y="522" font-size="17" fill="#8A2E1D" text-anchor="middle">未滿 1,000 美元警告，1,000 到未滿 10,000 美元罰 10,000,000 到 20,000,000 越南盾</text>

  <!-- row 3: ride (coral), dashed arrows -->
  <rect x="40" y="580" width="200" height="120" rx="14" fill="#B8442D" stroke="#B8442D" stroke-width="4"/>
  <text x="140" y="632" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">叫車</text>
  <text x="140" y="668" font-size="17" fill="#FFFFFF" text-anchor="middle">Ride · Gọi xe</text>

  <rect x="280" y="580" width="390" height="120" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="475" y="630" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">裝 Grab、Xanh SM、Be</text>
  <text x="475" y="666" font-size="17" fill="#8A2E1D" text-anchor="middle">在台灣先註冊、綁卡</text>
  <path d="M 670 640 L 726 640" stroke="#B8442D" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <rect x="730" y="580" width="390" height="120" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="925" y="630" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">照 App 指示走到上車點</text>
  <text x="925" y="666" font-size="17" fill="#8A2E1D" text-anchor="middle">計程車選 Vinasun、Mai Linh 跳表</text>
  <path d="M 1120 640 L 1176 640" stroke="#B8442D" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <rect x="1180" y="580" width="390" height="120" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1375" y="630" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">上車前核對車牌</text>
  <text x="1375" y="666" font-size="17" fill="#8A2E1D" text-anchor="middle">Check the plate 對照 App</text>

  <!-- notes -->
  <text x="60" y="760" font-size="16" fill="#5C6B6B">虛線箭頭是叫車動線。換匯罰則依越南政府電子報整理的第 340/2025/NĐ-CP 號議定；</text>
  <text x="60" y="790" font-size="16" fill="#5C6B6B">其餘依越南國家旅遊局、越南政府入口網、峴港觀光局、Grab 越南官網，2026 年 9 月查證。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
