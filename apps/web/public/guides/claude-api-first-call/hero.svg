<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一把鑰匙插進終端機視窗 / A key turning in a terminal window</title>
  <desc id="desc">米色底上有一個白色的終端機視窗，圓角矩形，上緣有一條淺綠色的標題列與三個彩色小圓點。視窗左緣有一個深色的鎖孔面板，一把橘色的鑰匙從左邊插進去：鑰匙的圓環在畫面左側，中間留一個圓孔，鑰匙桿往右伸進面板，桿下方有兩個齒。視窗裡用六行長短不一的圓角色條代表幾行程式碼，顏色有深綠、藍、灰、橘與綠，最後一行後面有一個深色的游標方塊。視窗下方一行大字寫著「第一次呼叫 API」。整張圖沒有任何品牌標誌或文字介面截圖。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- terminal window -->
  <rect x="420" y="180" width="860" height="440" rx="24" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/>
  <rect x="420" y="180" width="860" height="56" rx="24" fill="#E3F0EF"/>
  <rect x="420" y="212" width="860" height="24" fill="#E3F0EF"/>
  <path d="M 420 236 L 1280 236" stroke="#102A2B" stroke-width="6"/>
  <circle cx="466" cy="208" r="12" fill="#B8442D"/>
  <circle cx="506" cy="208" r="12" fill="#D97A2B"/>
  <circle cx="546" cy="208" r="12" fill="#2E7D5B"/>

  <!-- lines of code -->
  <rect x="480" y="292" width="120" height="18" rx="9" fill="#0D6B68"/>
  <rect x="620" y="292" width="230" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="870" y="292" width="140" height="18" rx="9" fill="#2F6F9F"/>

  <rect x="520" y="342" width="180" height="18" rx="9" fill="#2F6F9F"/>
  <rect x="720" y="342" width="300" height="18" rx="9" fill="#5C6B6B"/>

  <rect x="520" y="392" width="140" height="18" rx="9" fill="#D97A2B"/>
  <rect x="680" y="392" width="260" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="960" y="392" width="90" height="18" rx="9" fill="#0D6B68"/>

  <rect x="480" y="442" width="200" height="18" rx="9" fill="#0D6B68"/>
  <rect x="700" y="442" width="160" height="18" rx="9" fill="#5C6B6B"/>

  <rect x="520" y="492" width="120" height="18" rx="9" fill="#2E7D5B"/>
  <rect x="660" y="492" width="340" height="18" rx="9" fill="#5C6B6B"/>

  <rect x="480" y="542" width="90" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="592" y="536" width="26" height="30" rx="4" fill="#102A2B"/>

  <!-- keyhole plate on the window edge -->
  <rect x="394" y="374" width="52" height="92" rx="12" fill="#E3F0EF" stroke="#102A2B" stroke-width="5"/>

  <!-- the key -->
  <circle cx="212" cy="420" r="86" fill="#D97A2B" stroke="#A85B18" stroke-width="8"/>
  <circle cx="212" cy="420" r="34" fill="#F7F1E8"/>
  <rect x="296" y="402" width="150" height="36" rx="8" fill="#D97A2B" stroke="#A85B18" stroke-width="5"/>
  <rect x="330" y="436" width="26" height="30" rx="5" fill="#D97A2B" stroke="#A85B18" stroke-width="5"/>
  <rect x="376" y="436" width="26" height="22" rx="5" fill="#D97A2B" stroke="#A85B18" stroke-width="5"/>

  <text x="800" y="760" text-anchor="middle" font-size="56" font-weight="700" fill="#102A2B">第一次呼叫 API</text>
</svg>
