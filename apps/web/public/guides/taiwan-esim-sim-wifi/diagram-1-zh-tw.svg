<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">臺灣旅遊上網決策圖：eSIM、實體 SIM 卡或 WiFi 分享器</title>
  <desc id="desc">臺灣旅遊上網決策圖。第一題：是否三人以上整天一起行動？是，可在桃園機場代辦據點租 WiFi 分享器，或使用 5G 旅客卡熱點，但要查分享額度；否，進入第二題。第二題：手機是否支援 eSIM 且沒有電信業者鎖？是，可攜雙證件到櫃檯辦 eSIM，或在出發前線上買；否，攜雙證件購買實體旅客 SIM 卡。官方方案範例：中華與遠傳 5G 3 日約 NT$500、4G 3 日有 NT$300 方案；臺哥大 2026 年純數據 5G 3 日促銷為 NT$500，不含一般通話與簡訊。遠傳桃園機場櫃檯目前最晚列至 21:00，臺哥大部分代辦據點列至 23:00。深夜抵達時可先用 Airport Free WiFi；iTaiwan 與 Taipei Free 可當市區備用網路。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="64" y="70" font-size="38" font-weight="700" fill="#102A2B">臺灣旅遊上網怎麼選？</text>
  <text x="64" y="108" font-size="20" fill="#5C6B6B">eSIM、實體 SIM 卡與 WiFi 分享器；價格與時間於 2026/9/22 查核</text>

  <polygon points="360,154 650,228 360,302 70,228" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="360" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">三人以上整天一起行動？</text>
  <text x="360" y="251" text-anchor="middle" font-size="18" fill="#5C6B6B">還是每個人需要獨立網路？</text>
  <path d="M650 228h76m-18-15 18 15-18 15" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="205" font-size="18" fill="#5C6B6B">是</text>
  <rect x="742" y="158" width="794" height="142" rx="24" fill="#E3F1EF" stroke="#0D6B68" stroke-width="5"/>
  <text x="778" y="205" font-size="27" font-weight="700" fill="#0D6B68">WiFi 分享器或 5G 熱點</text>
  <text x="778" y="246" font-size="20" fill="#102A2B">適合多台裝置，但走散或主機沒電就全部斷線</text>
  <text x="778" y="277" font-size="18" fill="#5C6B6B">先查熱點分享額度、押金與歸還地點</text>
  <path d="M360 302v48m-15-18 15 18 15-18" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="385" y="333" font-size="18" fill="#5C6B6B">否</text>

  <polygon points="360,358 650,432 360,506 70,432" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="360" y="422" text-anchor="middle" font-size="23" font-weight="700" fill="#102A2B">手機支援 eSIM 而且無鎖？</text>
  <text x="360" y="455" text-anchor="middle" font-size="18" fill="#5C6B6B">依機型、購買地區與業者清單確認</text>
  <path d="M650 432h76m-18-15 18 15-18 15" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="409" font-size="18" fill="#5C6B6B">是</text>
  <rect x="742" y="362" width="794" height="142" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="5"/>
  <text x="778" y="409" font-size="27" font-weight="700" fill="#2F6F9F">選 eSIM</text>
  <text x="778" y="450" font-size="20" fill="#102A2B">雙證件到櫃檯辦，或出發前線上購買</text>
  <text x="778" y="481" font-size="18" fill="#5C6B6B">先看開通時點、是否有臺灣門號、能否分享熱點</text>
  <path d="M360 506v44m-15-18 15 18 15-18" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="385" y="537" font-size="18" fill="#5C6B6B">否</text>
  <rect x="70" y="564" width="580" height="154" rx="24" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="5"/>
  <text x="106" y="611" font-size="27" font-weight="700" fill="#6B4A3A">選實體旅客 SIM 卡</text>
  <text x="106" y="652" font-size="20" fill="#102A2B">帶雙證件正本與已解鎖手機</text>
  <text x="106" y="685" font-size="18" fill="#5C6B6B">4G 3 日有 NT$300 方案；逐家確認通話與熱點</text>

  <rect x="742" y="536" width="794" height="182" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <text x="778" y="582" font-size="25" font-weight="700" fill="#9A4F12">方案內容不能只看「吃到飽」</text>
  <text x="778" y="623" font-size="20" fill="#102A2B">中華、遠傳 5G 3 日範例：NT$500</text>
  <text x="778" y="658" font-size="20" fill="#102A2B">臺哥大 5G 3 日純數據促銷：NT$500</text>
  <text x="778" y="692" font-size="18" fill="#5C6B6B">純數據方案不含一般通話與簡訊；價格以購買日為準</text>

  <rect x="70" y="754" width="1466" height="92" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="102" y="791" font-size="21" font-weight="700" fill="#2E7D5B">晚到備案</text>
  <text x="244" y="791" font-size="19" fill="#102A2B">遠傳官方頁列至 21:00；臺哥大部分代辦據點列至 23:00。錯過櫃檯先用 Airport Free WiFi</text>
  <text x="102" y="824" font-size="18" fill="#5C6B6B">iTaiwan 與 Taipei Free 可備用；iTaiwan 連續 4 小時或閒置 15 分鐘後中斷，可再連線</text>
  <text x="1536" y="878" text-anchor="end" font-size="16" fill="#5C6B6B">© Mokaair 2026</text>

</svg>
