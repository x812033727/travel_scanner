<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>手機掃描檔案怎麼更清楚：光線、裁切、頁序與送出前檢查：判斷流程</title><desc>依序檢查：整理紙面、逐頁拍攝、核對頁序、驗證附件。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">整理紙面</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Prepare the page</text><text x="103" y="573" fill="#f4dc9d" font-size="26">光線均勻</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">逐頁拍攝</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Capture each page</text><text x="473" y="573" fill="#f4dc9d" font-size="26">四角小字都看</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">核對頁序</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Check order</text><text x="843" y="573" fill="#f4dc9d" font-size="26">辨識回對原圖</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">驗證附件</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Open the output</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">再交給收件者</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>