<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>휴대폰 문서 스캔을 선명하게: 조명, 자르기, 페이지 순서와 전송 전 확인: 판단 흐름</title><desc>순서대로 확인: 종이 준비, 페이지별 촬영, 페이지 순서 대조, 첨부 파일 검증. 편집부가 정리한 안내이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">작업 순서 · 실용적인 절차</text><text x="100" y="175" fill="#576968" font-size="25">자신의 조건에 맞게 선택하고 한 번에 모두 끝내려 하지 마세요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">종이 준비</text><text x="103" y="497" fill="#f4f0e5" font-size="23">페이지를 준비</text><text x="103" y="573" fill="#f4dc9d" font-size="26">고른 조명</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">페이지별 촬영</text><text x="473" y="497" fill="#f4f0e5" font-size="23">각 페이지를 촬영</text><text x="473" y="573" fill="#f4dc9d" font-size="26">네 모서리와 작은 글자 확인</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">페이지 순서 대조</text><text x="843" y="497" fill="#f4f0e5" font-size="23">순서를 확인</text><text x="843" y="573" fill="#f4dc9d" font-size="26">인식 결과를 원본과 대조</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">첨부 파일 검증</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">출력 파일을 열기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">그런 다음 수신자에게 전달</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 설명도</text></g></svg>
