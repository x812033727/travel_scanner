<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>スマホで書類を鮮明にスキャンするには：照明、切り抜き、ページ順、送信前の確認: 判断の流れ</title><desc>順に確認：紙面を整える、一枚ずつ撮影する、ページ順を照合する、添付ファイルを確認する。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順 · 実践的な進め方</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせ、すべてを一度に終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">紙面を整える</text><text x="103" y="497" fill="#f4f0e5" font-size="23">ページを準備する</text><text x="103" y="573" fill="#f4dc9d" font-size="26">光を均一に当てる</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">一枚ずつ撮影</text><text x="473" y="497" fill="#f4f0e5" font-size="23">各ページを撮影する</text><text x="473" y="573" fill="#f4dc9d" font-size="26">四隅も小さい文字も確認</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">ページ順を照合</text><text x="843" y="497" fill="#f4f0e5" font-size="23">順序を確認する</text><text x="843" y="573" fill="#f4dc9d" font-size="26">認識結果を元画像と照合</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">添付ファイルを確認</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">出力ファイルを開く</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">確認してから相手へ送る</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の説明図</text></g></svg>
