<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Transformer アーキテクチャ図解 / Transformer</title><desc id="desc">文字単位に位置情報を加え、自己アテンションとフィードフォワード処理を経て、タスクの出力を生成します。生成時は参照が許可された文脈だけを使います。</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">位置と文脈が系列表現を形成</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Transformer</text><rect x="70" y="200" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="255" y="282" text-anchor="middle" font-size="36" fill="#102A2B">文字単位</text><rect x="70" y="470" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="255" y="552" text-anchor="middle" font-size="36" fill="#102A2B">位置情報</text><path d="M 440 270 L 590 410" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="590" cy="410" r="10" fill="#0D6B68"></circle><path d="M 440 540 L 590 410" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="590" cy="410" r="10" fill="#0D6B68"></circle><rect x="590" y="300" width="390" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="785" y="417" text-anchor="middle" font-size="36" fill="#102A2B">自己アテンション</text><path d="M 980 405 L 1080 405" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1080" cy="405" r="10" fill="#0D6B68"></circle><rect x="1080" y="300" width="440" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1300" y="417" text-anchor="middle" font-size="30" fill="#102A2B" style="font-size: 30px;">フィードフォワードと他の処理</text><text x="800" y="675" text-anchor="middle" font-size="32" fill="#102A2B">生成時：許可された文脈のみ参照</text><text x="800" y="740" text-anchor="middle" font-size="32" fill="#102A2B">「誰が誰に注意を促すか」は語順で変わる</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
