<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Transformer 아키텍처 도해 / Transformer</title><desc id="desc">텍스트 단위에 위치 정보를 더한 뒤 셀프 어텐션과 피드포워드 처리를 거쳐 작업 출력을 만든다. 생성할 때는 볼 수 있도록 허용된 컨텍스트만 사용한다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">위치와 컨텍스트가 함께 시퀀스 표현을 구성</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Transformer</text><rect x="70" y="200" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="255" y="282" text-anchor="middle" font-size="36" fill="#102A2B">텍스트 단위</text><rect x="70" y="470" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="255" y="552" text-anchor="middle" font-size="36" fill="#102A2B">위치 정보</text><path d="M 440 270 L 590 410" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="590" cy="410" r="10" fill="#0D6B68" /><path d="M 440 540 L 590 410" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="590" cy="410" r="10" fill="#0D6B68" /><rect x="590" y="300" width="390" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="785" y="417" text-anchor="middle" font-size="36" fill="#102A2B">셀프 어텐션</text><path d="M 980 405 L 1080 405" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1080" cy="405" r="10" fill="#0D6B68" /><rect x="1080" y="300" width="440" height="210" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1300" y="417" text-anchor="middle" font-size="36" fill="#102A2B">피드포워드 및 기타 처리</text><text x="800" y="675" text-anchor="middle" font-size="32" fill="#102A2B">생성 시: 허용된 컨텍스트만 참조</text><text x="800" y="740" text-anchor="middle" font-size="32" fill="#102A2B">‘누가 누구에게 알리는가’는 어순에 따라 달라짐</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
