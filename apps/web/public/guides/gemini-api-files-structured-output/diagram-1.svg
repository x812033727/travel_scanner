<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">JSON 正確不等於事實正確</title><desc id="desc">文件輸入：確認原始內容可讀；結構驗證：檢查欄位與型別；事實驗證：回查引用與缺值</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">JSON 正確不等於事實正確</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#286778" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#286778" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">文件輸入</text><text x="245" y="333" font-size="76" fill="#286778">確認原始內容可讀</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#286778" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#286778" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">結構驗證</text><text x="245" y="558" font-size="76" fill="#286778">檢查欄位與型別</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#286778" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#286778" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">事實驗證</text><text x="245" y="783" font-size="76" fill="#286778">回查引用與缺值</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>