<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">基準測試圖解 / Benchmark</title><desc id="desc">公開基準先核對題型、設定和指標，再與實際任務匹配；最後以自己的資料驗收，而非直接依排名採用。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">公開基準與自己的任務需要兩道判讀</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Benchmark</text><rect x="80" y="200" width="420" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="290" y="292" text-anchor="middle" font-size="36" fill="#102A2B">公開基準結果</text><path d="M 500 280 L 630 280" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="630" cy="280" r="10" fill="#0D6B68"/><rect x="630" y="200" width="400" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="830" y="292" text-anchor="middle" font-size="36" fill="#102A2B">題型與設定核對</text><path d="M 1030 280 L 1160 280" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1160" cy="280" r="10" fill="#0D6B68"/><rect x="1160" y="200" width="360" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1340" y="292" text-anchor="middle" font-size="36" fill="#102A2B">適用範圍</text><path d="M 1340 360 L 1340 640" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1340" cy="640" r="10" fill="#0D6B68"/><rect x="1050" y="570" width="470" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="1285" y="657" text-anchor="middle" font-size="36" fill="#102A2B">自己的館藏任務驗收</text><path d="M 1050 645 L 540 645" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="540" cy="645" r="10" fill="#0D6B68"/><rect x="80" y="570" width="460" height="150" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="310" y="657" text-anchor="middle" font-size="36" fill="#102A2B">品質、速度與限制一起判斷</text><text x="800" y="450" text-anchor="middle" font-size="32" fill="#102A2B">總分不能代替分項失敗分析</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
