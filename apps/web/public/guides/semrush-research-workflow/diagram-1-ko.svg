<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Malgun Gothic','Noto Sans TC',sans-serif">
<title id="title">Semrush로 콘텐츠 계획하기: 키워드, 경쟁 페이지와 추적 목록</title><desc id="desc">네 칸에 키워드 확장과 독자 요구 선별, 경쟁 페이지와 차이 분류 확인, 글과 담당자 결정, 조건을 고정한 지속적 추적을 차례로 보여 준다.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">Semrush 콘텐츠 계획과 추적</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">키워드 조사부터 고정 조건의 관찰까지 결정 근거를 남기기</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">질문 찾기</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">국가 데이터 일치</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">시작 단어와 의도</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">단어를 질문으로</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">차이 확인</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">페이지와 갱신일</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">누락과 낮은 순위</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">안 할 이유도 기록</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">콘텐츠 계획</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">수정 또는 새 페이지</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">관점·출처·이미지</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">담당자와 점검일</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">조건 고정</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">지역·기기 확인</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">고정 단어 유지</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">변경 기록 후 비교</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">조사 단서를 글 제작으로 연결하고 같은 조건에서 이후 성과를 평가합니다.</text>
<text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
