<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Yu Gothic','Meiryo','Noto Sans TC',sans-serif">
<title id="title">Semrush で内容を計画する：キーワード、競合ページ、追跡リスト</title><desc id="desc">四列で、キーワードと読者の需要、競合ページと差の分類、記事と担当者の決定、条件を固定した追跡を順に示す。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">Semrush の内容計画と追跡</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">語群の調査から条件を固定した観察まで、判断の根拠を残す</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">問いを探す</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">国のデータを揃える</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">最初の語と検索意図</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">語を質問に直す</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">差を確かめる</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">ページと更新日</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">不足と低順位を区別</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">追わない理由も残す</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">内容を計画</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">既存を直すか新規か</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">切り口・出典・画像</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">担当者と確認日</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">条件を固定</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">地域と端末を確認</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">固定した語群を保つ</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">変更を記録し比較</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">調査の手掛かりを記事制作につなぎ、同じ条件で後の成果を評価します。</text>
<text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
