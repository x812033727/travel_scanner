<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Taiwan winter events timeline, November 2026 to March 2027 / 台灣冬季活動時間軸：2026 年 11 月到 2027 年 3 月</title>
  <desc id="desc">Horizontal timeline from November 2026 to March 2027, one row per event. Solid bars are dates already published for 2026-27: Christmasland in New Taipei City 13 November to 27 December 2026 (Tourism Administration calendar), the long weekends of 25 to 27 December, 1 to 3 January and 27 February to 1 March, the Lunar New Year holiday 4 to 10 February 2027, the Taiwan Lantern Festival in Miaoli 20 February to 7 March 2027 (tentative) and the hot spring carnival running to 30 June 2027. A diamond marks the Taipei New Year's Eve party and Taipei 101 fireworks on 31 December. Hatched bars are last season's dates because 2026-27 is not yet announced: Yangmingshan Flower Festival 5 February to 15 March, Kaohsiung Lantern Festival 7 February to 1 March, Wuling Farm cherry blossoms 13 February to 1 March, Taipei Lantern Festival 25 February to 15 March, Pingxi Sky Lantern Festival nights on 27 February and 3 March, and Alishan cherry blossoms in March. A dashed line marks Lantern Festival day, 20 February 2027. 橫向時間軸從 2026 年 11 月到 2027 年 3 月。實心為已公告日期：新北歡樂耶誕城 2026/11/13–12/27（觀光署行事曆）、連假 12/25–27、1/1–3、2/27–3/1、春節連假 2027/2/4–2/10、苗栗台灣燈會 2027/2/20–3/7（暫定）、溫泉美食嘉年華至 2027/6/30；菱形為 12/31 臺北跨年與 101 煙火。斜紋為上一季日期（2026-27 待公告）：陽明山花季 2/5–3/15、高雄燈會 2/7–3/1、武陵農場櫻花季 2/13–3/1、台北燈節 2/25–3/15、平溪天燈節 2/27 與 3/3、阿里山櫻花 3 月。虛線為 2027 年元宵節 2/20。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <pattern id="hatchTeal" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#0D6B68" stroke-width="3"/></pattern>
    <pattern id="hatchGreen" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2E7D5B" stroke-width="3"/></pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  </defs>

