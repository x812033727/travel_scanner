<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">每月收支回顧的七個步驟 / A fixed monthly money-review agenda</title>
<desc id="desc">七個步驟依序排成兩列：對帳、分類確認、算兩個數字、和上月比、找一個異常、決定一個調整、記下一行，每一步都標示時間上限，依序為八分鐘、五分鐘、三分鐘、四分鐘、五分鐘、三分鐘、兩分鐘，合計三十分鐘。最後一格是這個月唯一的產出：一個調整加一行紀錄。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">每月收支回顧的七個步驟</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Monthly money review · 每一步有時間上限，合計 30 分鐘</text>

<path d="M380 257 H440" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M760 257 H820" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1140 257 H1200" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1360 345 V398 H220 V447" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M380 542 H440" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M760 542 H820" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1140 542 H1200" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="60" y="170" width="320" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="220" y="218" text-anchor="middle" font-size="17" fill="#5C6B6B">第一步</text>
<text x="220" y="266" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">對帳</text>
<text x="220" y="310" text-anchor="middle" font-size="18" fill="#5C6B6B">8 分鐘</text>

<rect x="440" y="170" width="320" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="600" y="218" text-anchor="middle" font-size="17" fill="#5C6B6B">第二步</text>
<text x="600" y="266" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">分類確認</text>
<text x="600" y="310" text-anchor="middle" font-size="18" fill="#5C6B6B">5 分鐘</text>

<rect x="820" y="170" width="320" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="980" y="218" text-anchor="middle" font-size="17" fill="#5C6B6B">第三步</text>
<text x="980" y="266" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">算兩個數字</text>
<text x="980" y="310" text-anchor="middle" font-size="18" fill="#5C6B6B">3 分鐘</text>

<rect x="1200" y="170" width="320" height="175" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1360" y="218" text-anchor="middle" font-size="17" fill="#5C6B6B">第四步</text>
<text x="1360" y="266" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">和上月比</text>
<text x="1360" y="310" text-anchor="middle" font-size="18" fill="#5C6B6B">4 分鐘</text>

<rect x="60" y="455" width="320" height="175" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="220" y="503" text-anchor="middle" font-size="17" fill="#5C6B6B">第五步</text>
<text x="220" y="551" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">找一個異常</text>
<text x="220" y="595" text-anchor="middle" font-size="18" fill="#5C6B6B">5 分鐘</text>

<rect x="440" y="455" width="320" height="175" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="600" y="503" text-anchor="middle" font-size="17" fill="#5C6B6B">第六步</text>
<text x="600" y="551" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">決定一個調整</text>
<text x="600" y="595" text-anchor="middle" font-size="18" fill="#5C6B6B">3 分鐘</text>

<rect x="820" y="455" width="320" height="175" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="980" y="503" text-anchor="middle" font-size="17" fill="#5C6B6B">第七步</text>
<text x="980" y="551" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">記下一行</text>
<text x="980" y="595" text-anchor="middle" font-size="18" fill="#5C6B6B">2 分鐘</text>

<rect x="1200" y="455" width="320" height="175" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1360" y="503" text-anchor="middle" font-size="17" fill="#5C6B6B">這個月的產出</text>
<text x="1360" y="551" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">一個調整</text>
<text x="1360" y="595" text-anchor="middle" font-size="18" fill="#5C6B6B">加一行紀錄</text>

<text x="60" y="722" font-size="20" fill="#5C6B6B">時間到就往下一步，沒做完的留到下個月；議程的價值在於每個月都跑得完。</text>
<text x="60" y="762" font-size="20" fill="#5C6B6B">一次性的超支只要註記，結構性的超支才改預算；走鐘的月份用攤提或註記處理。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
