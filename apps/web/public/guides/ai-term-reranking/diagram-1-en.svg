<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Same Candidates, Reassessed Order</title><desc id="desc">First-pass retrieval finds general renewal, hold-queue, and ID-expiration passages; scoring the question with each candidate moves expiration conditions to the front</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Same Candidates, Reassessed Order</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Reranking</text><path d="M 440 280 L 625 365" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 440 490 L 625 420" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 440 700 L 625 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 965 420 L 1150 420" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="210" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="276.5" font-size="28" fill="#102A2B" text-anchor="middle">Initial Candidates</text><text x="260" y="319.5" font-size="22" fill="#5C6B6B" text-anchor="middle">General Renewal</text><rect x="80" y="420" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="486.5" font-size="28" fill="#102A2B" text-anchor="middle">Initial Candidates</text><text x="260" y="529.5" font-size="22" fill="#5C6B6B" text-anchor="middle">ID Expiration</text><rect x="80" y="630" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="696.5" font-size="28" fill="#102A2B" text-anchor="middle">Initial Candidates</text><text x="260" y="739.5" font-size="22" fill="#5C6B6B" text-anchor="middle">Hold Queue</text><rect x="635" y="330" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="800" y="414" font-size="28" fill="#102A2B" text-anchor="middle">Question + Candidate</text><text x="800" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">Assess Each Pair's Relevance</text><rect x="1160" y="330" width="350" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1335" y="414" font-size="28" fill="#102A2B" text-anchor="middle">New Ranking</text><text x="1335" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">Expiration Rules First</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">Graphic © Mokaair 2026</text></svg>
