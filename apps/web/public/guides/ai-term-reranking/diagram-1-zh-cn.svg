<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">候选不变，顺序重新判断</title><desc id="desc">第一轮找到一般续借、预约排队和证件到期段落，将问题与各候选配对评分后把到期条件排到前面</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">候选不变，顺序重新判断</text><text x="60" y="84" font-size="18" fill="#5C6B6B">重新排序</text><path d="M 440 280 L 625 365" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 440 490 L 625 420" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 440 700 L 625 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 965 420 L 1150 420" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="210" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="276.5" font-size="28" fill="#102A2B" text-anchor="middle">第一轮候选</text><text x="260" y="319.5" font-size="22" fill="#5C6B6B" text-anchor="middle">一般续借</text><rect x="80" y="420" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="486.5" font-size="28" fill="#102A2B" text-anchor="middle">第一轮候选</text><text x="260" y="529.5" font-size="22" fill="#5C6B6B" text-anchor="middle">证件到期</text><rect x="80" y="630" width="360" height="145" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="696.5" font-size="28" fill="#102A2B" text-anchor="middle">第一轮候选</text><text x="260" y="739.5" font-size="22" fill="#5C6B6B" text-anchor="middle">预约排队</text><rect x="635" y="330" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="800" y="414" font-size="28" fill="#102A2B" text-anchor="middle">问题＋候选</text><text x="800" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">逐对评估相关性</text><rect x="1160" y="330" width="350" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1335" y="414" font-size="28" fill="#102A2B" text-anchor="middle">新的排序</text><text x="1335" y="457" font-size="22" fill="#5C6B6B" text-anchor="middle">到期条件优先</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 制图 2026</text></svg>
