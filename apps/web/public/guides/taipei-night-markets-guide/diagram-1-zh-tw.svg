  <rect x="900" y="725" width="640" height="130" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <rect x="900" y="725" width="12" height="130" rx="6" fill="#B8442D"/>
  <text x="930" y="757" font-size="23" font-weight="700" fill="#0D6B68">臨江街觀光夜市（通化街夜市）</text>
  <text x="930" y="784" font-size="17" fill="#5C6B6B">靠近台北 101 的小吃夜市</text>
  <text x="930" y="811" font-size="17" fill="#102A2B">信義安和站 4 號出口・步行約 10 分鐘</text>
  <text x="930" y="839" font-size="17" fill="#102A2B">六張犁站步行約 15 分鐘・<tspan font-weight="700">18:00–24:00</tspan></text>

  <!-- Nanjichang card -->
  <rect x="60" y="640" width="580" height="210" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <rect x="60" y="640" width="12" height="210" rx="6" fill="#6B4A3A"/>
  <text x="90" y="673" font-size="23" font-weight="700" fill="#0D6B68">南機場夜市</text>
  <text x="90" y="703" font-size="17" fill="#B8442D" font-weight="700">附近沒有捷運站</text>
  <text x="90" y="731" font-size="17" fill="#102A2B">中正紀念堂站・步行約 20 分鐘</text>
  <text x="90" y="759" font-size="17" fill="#102A2B">西門站・步行約 25 分鐘</text>
  <text x="90" y="787" font-size="17" fill="#102A2B">搭公車至「南機場公寓」站</text>
  <text x="90" y="820" font-size="17" fill="#102A2B"><tspan font-weight="700">05:00–24:00</tspan> 許可時段；各攤時間不同</text>

