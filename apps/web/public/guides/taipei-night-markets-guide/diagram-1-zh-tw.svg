  <!-- Songshan-Xindian Line (green) -->
  <path d="M 1330 400 L 700 400 L 520 500 L 700 650 L 700 790" fill="none" stroke="#2E7D5B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tamsui-Xinyi Line (red) -->
