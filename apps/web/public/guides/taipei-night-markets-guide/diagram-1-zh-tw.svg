  <text x="1000" y="183" font-size="23" font-weight="700" fill="#0D6B68">饒河街觀光夜市</text>
  <text x="1000" y="214" font-size="17" fill="#102A2B">松山站 1、2、5 號出口・步行約 3 分鐘</text>
