<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北夜市攻略：士林、饒河街、寧夏、臨江街與南機場怎麼逛</title>
  <desc id="desc">簡化的台北捷運圖：淡水信義線（紅）由士林、劍潭往南經雙連、中山、台北車站到中正紀念堂，再往東到信義安和與台北101／世貿；松山新店線（綠）由松山往西到中山，再經西門到中正紀念堂；板南線（藍）經西門與台北車站。士林夜市在劍潭站，營業 17:00–24:00；寧夏夜市從雙連站 1 號出口步行約 10 分、中山站 5 號出口約 8 分，18:00–24:00；饒河街觀光夜市從松山站 1、2、5 號出口步行約 3 分，全長約 600 公尺，17:00–24:00；臨江街觀光夜市（通化街夜市）從信義安和站 4 號出口步行約 10 分、六張犁站約 15 分，18:00–24:00；南機場夜市沒有捷運站，從中正紀念堂站步行約 20 分、西門站約 25 分，或搭公車到南機場公寓站，許可時段 05:00–24:00，各攤營業時間不同。時間為台北市市場處與台北捷運公司公告，2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="36" font-weight="700" fill="#102A2B">台北五大夜市與捷運位置示意圖</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">示意圖，非實際比例・營業時段依臺北市市場處公告・2026 年 9 月查證</text>

