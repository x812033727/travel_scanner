<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">水原華城城牆步行路線與華城御車環線 / Suwon Hwaseong Fortress wall walk and Hwaseong Eocha loop</title>
  <desc id="desc">示意圖，不按比例。水原華城城牆是一個不規則的環，周長 5,744 公尺：北邊長安門，東北側華虹門、訪花隨柳亭與練武台，東邊蒼龍門，南邊八達門，西邊八達山上的西將台，西北華西門，華城行宮在城內中央偏西。華城御車從練武台出發，走練武台、華虹門、長安門、華西門、梅香橋再回練武台的環線，約 30 分，成人 6,000 韓元，每週一休，華虹門、華西門、梅香橋可下車但不能再上，不經過行宮與八達門。練武台旁有國弓射箭，10 支 3,000 韓元。左上角：從首爾搭地鐵 1 號線或水仁盆唐線到水原站，再轉市內公車到行宮或八達門；或從江南站搭 3000 路直行巴士到八達門。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">水原華城：城牆步行路線與華城御車環線</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Suwon Hwaseong Fortress · wall walk and Hwaseong Eocha loop · 示意圖，不按比例</text>

  <!-- From Seoul inset -->
  <rect x="30" y="108" width="480" height="270" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="54" y="144" font-size="20" font-weight="700" fill="#102A2B">從首爾怎麼來 From Seoul</text>
  <line x1="60" y1="166" x2="60" y2="240" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
  <text x="80" y="180" font-size="17" fill="#102A2B">首爾 → 地鐵 1 號線或水仁盆唐線</text>
  <text x="80" y="208" font-size="17" fill="#102A2B">→ 水原站 수원역 Suwon Station</text>
  <text x="80" y="236" font-size="17" fill="#102A2B">→ 市內公車 → 行宮或八達門</text>
  <line x1="60" y1="272" x2="60" y2="346" stroke="#2F6F9F" stroke-width="6" stroke-dasharray="12 9" stroke-linecap="round"/>
  <text x="80" y="286" font-size="17" fill="#102A2B">江南站 강남역 Gangnam Station</text>
  <text x="80" y="314" font-size="17" fill="#102A2B">→ 直行巴士 3000 路</text>
  <text x="80" y="342" font-size="17" fill="#102A2B">→ 八達門 팔달문 Paldalmun</text>

  <!-- Suwoncheon stream -->
  <path d="M 1070 140 L 1070 222 Q 1066 350 1060 480 Q 1085 640 1120 800 L 1130 880" fill="none" stroke="#9CC3DE" stroke-width="10" stroke-linecap="round"/>
  <text x="1112" y="664" font-size="16" fill="#2F6F9F">水原川 수원천</text>

  <!-- Fortress wall walking route -->
  <path d="M 900 180 Q 990 190 1070 222 Q 1120 240 1160 262 Q 1240 300 1290 370 Q 1330 450 1320 540 C 1310 640 1270 720 1200 765 C 1100 815 1000 822 920 820 Q 790 800 700 740 Q 620 670 600 560 Q 620 400 720 290 Q 800 200 900 180 Z" fill="none" stroke="#0D6B68" stroke-width="9" stroke-linejoin="round"/>

  <!-- Eocha loop -->
  <path d="M 1262 392 Q 1180 300 1070 258 Q 990 225 900 218 Q 810 230 752 318 L 1060 480 Q 1180 470 1262 392 Z" fill="none" stroke="#D97A2B" stroke-width="7" stroke-dasharray="18 12" stroke-linejoin="round"/>

