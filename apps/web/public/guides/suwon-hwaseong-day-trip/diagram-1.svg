    <text x="900" y="148" font-size="16" text-anchor="middle">장안문 Janganmun</text>

    <text x="1088" y="172" font-size="20" font-weight="700">華虹門 화홍문</text>
    <text x="1088" y="196" font-size="16">Hwahongmun</text>

    <text x="1192" y="232" font-size="18" font-weight="700">訪花隨柳亭</text>
    <text x="1192" y="254" font-size="16">방화수류정 Banghwasuryujeong</text>

    <text x="1312" y="366" font-size="20" font-weight="700">練武台 연무대</text>
    <text x="1312" y="390" font-size="16">Yeonmudae</text>

    <text x="1342" y="536" font-size="20" font-weight="700">蒼龍門（東）창룡문</text>
    <text x="1342" y="560" font-size="16">Changnyongmun</text>

    <text x="920" y="866" font-size="18" font-weight="700" text-anchor="middle">八達門（南）팔달문 Paldalmun</text>

    <text x="578" y="552" font-size="20" font-weight="700" text-anchor="end">西將台 서장대</text>
    <text x="578" y="576" font-size="16" text-anchor="end">Seojangdae</text>
    <text x="578" y="598" font-size="16" fill="#B8442D" text-anchor="end">八達山上，要爬坡</text>

    <text x="692" y="284" font-size="20" font-weight="700" text-anchor="end">華西門 화서문</text>
    <text x="692" y="308" font-size="16" text-anchor="end">Hwaseomun</text>

    <text x="800" y="648" font-size="20" font-weight="700" text-anchor="middle">華城行宮 화성행궁</text>
    <text x="800" y="672" font-size="16" text-anchor="middle">Hwaseong Haenggung</text>

    <text x="1040" y="522" font-size="18" font-weight="700" text-anchor="end">梅香橋 매향교</text>
    <text x="1040" y="544" font-size="16" text-anchor="end">Maehyanggyo</text>
  </g>

  <!-- Archery -->
  <g>
    <circle cx="1354" cy="446" r="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
    <circle cx="1354" cy="446" r="9" fill="none" stroke="#B8442D" stroke-width="4"/>
    <circle cx="1354" cy="446" r="3" fill="#B8442D"/>
    <text x="1384" y="442" font-size="18" font-weight="700" fill="#102A2B">國弓射箭 국궁</text>
    <text x="1384" y="466" font-size="16" fill="#102A2B">10 支 3,000 韓元</text>
  </g>

  <!-- Eocha info box -->
  <rect x="1346" y="600" width="236" height="160" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1366" y="634" font-size="20" font-weight="700" fill="#102A2B">華城御車 화성어차</text>
  <text x="1366" y="660" font-size="16" fill="#5C6B6B">Hwaseong Eocha</text>
  <text x="1366" y="690" font-size="16" fill="#102A2B">練武台出發，約 30 分</text>
  <text x="1366" y="716" font-size="16" fill="#102A2B">成人 6,000 韓元</text>
  <text x="1366" y="742" font-size="16" fill="#B8442D">週一休，雨雪停駛</text>

  <!-- Legend -->
  <rect x="30" y="700" width="500" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
