  <g fill="#FFFFFF" stroke="#0D6B68" stroke-width="6">
    <circle cx="900" cy="180" r="12"/>
    <circle cx="1070" cy="222" r="12"/>
    <circle cx="1160" cy="262" r="12"/>
    <circle cx="1290" cy="370" r="12"/>
    <circle cx="1320" cy="540" r="12"/>
    <circle cx="920" cy="820" r="12"/>
