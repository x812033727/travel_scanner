  <text x="132" y="742" font-size="17" fill="#102A2B">城牆步行路線，周長 5,744 m</text>
  <line x1="54" y1="776" x2="114" y2="776" stroke="#D97A2B" stroke-width="7" stroke-dasharray="18 12"/>
  <text x="132" y="782" font-size="17" fill="#102A2B">華城御車環線，不經過行宮與八達門</text>
  <circle cx="84" cy="822" r="14" fill="#D97A2B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="84" y="828" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">下</text>
  <text x="132" y="818" font-size="17" fill="#102A2B">可下車：華虹門、華西門、梅香橋</text>
