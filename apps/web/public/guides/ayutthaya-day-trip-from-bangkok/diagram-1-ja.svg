<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">バンコク発アユタヤ日帰りルート図</title>
  <desc id="desc">左側はバンコクからアユタヤへの三つの行き方。クルンテープ・アピワット中央駅から特急・急行・快速でアユタヤ駅まで約 50 分～1 時間 20 分。中央駅へは MRT ブルーラインのバンスー駅 BL11 の 3 番出口を利用。フアランポーンから普通列車・通勤列車で約 1 時間 35 分～2 時間、途中でバンパインに停車。ミニバンの出発場所、便数、運賃は現地で確認。左下は帰りの夜の便で、19:45 発の特別通勤列車は中央駅 21:00 着、最終の 21:22 発特急は中央駅 22:15 着。右側はアユタヤ旧市街の島の周遊ルート。アユタヤ駅から出発し、ワット・ヤイチャイモンコン、ワット・マハタート、ワット・ラーチャブラナ、ワット・プラシーサンペットの順に巡り、最後に島外南西のワット・チャイワッタナーラームへ。右上は芸術局管理施設の入場料で、外国人は一寺 80 バーツ、7 か所共通券 300 バーツ。毎日 08:00 から 18:00 まで開園。</desc>
