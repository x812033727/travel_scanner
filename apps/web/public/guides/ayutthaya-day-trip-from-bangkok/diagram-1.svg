<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">曼谷到大城一日路線圖 / Bangkok to Ayutthaya day-trip route map</title>
  <desc id="desc">左半邊是曼谷到大城的三種去法：從 Krung Thep Aphiwat 中央站搭特快、快車或快速車到大城車站約 50 分到 1 小時 20 分，中央站在 MRT 藍線 Bang Sue 站 BL11 的 3 號出口；從華藍蓬搭普通車或通勤車約 1 小時 35 分到 2 小時，途中停 Bang Pa-In；小巴的發車點、班次與票價以現場為準。左下是回程晚班：19:45 特別通勤車到中央站 21:00，最後一班 21:22 特快到中央站 22:15。右半邊是大城古城島的環線：從大城車站出發，依序是崖差蒙空寺、瑪哈泰寺、拉查布拉那寺、帕席桑碧寺，最後到島外西南的柴瓦塔那蘭寺。右上是藝術廳門票：外國人單寺 80 泰銖、7 處聯票 300 泰銖，每天 08:00 到 18:00 開放。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="70" font-size="36" font-weight="700" fill="#102A2B">曼谷 → 大城 อยุธยา Ayutthaya 一日路線</text>
  <text x="60" y="106" font-size="19" fill="#5C6B6B">示意圖非比例 · 2026 年 9 月查證 · 時刻與票價以泰國國鐵、藝術廳公告為準</text>

  <line x1="662" y1="150" x2="662" y2="860" stroke="#5C6B6B" stroke-opacity="0.3" stroke-width="2"/>

  <!-- panel 1: Bangkok to Ayutthaya -->
  <text x="60" y="172" font-size="24" font-weight="700" fill="#0D6B68">① 曼谷怎麼去 Getting there</text>

  <!-- row 1: Krung Thep Aphiwat -->
  <rect x="60" y="204" width="250" height="76" rx="14" fill="#0D6B68"/>
  <text x="185" y="236" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">กรุงเทพอภิวัฒน์</text>
  <text x="185" y="264" font-size="17" fill="#FFFFFF" text-anchor="middle">Krung Thep Aphiwat 中央站</text>
  <line x1="310" y1="242" x2="452" y2="242" stroke="#0D6B68" stroke-width="8"/>
  <polygon points="450,230 474,242 450,254" fill="#0D6B68"/>
  <rect x="478" y="214" width="160" height="56" rx="28" fill="#102A2B"/>
  <text x="558" y="249" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">大城車站</text>
  <text x="60" y="314" font-size="19" font-weight="700" fill="#0D6B68">特快、快車、快速車 · 約 50 分到 1 小時 20 分</text>
  <text x="60" y="340" font-size="17" fill="#5C6B6B">MRT 藍線 Bang Sue 站（BL11）3 號出口 · 可線上訂位</text>

  <!-- row 2: Hua Lamphong -->
  <rect x="60" y="374" width="250" height="76" rx="14" fill="#2E7D5B"/>
  <text x="185" y="406" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">หัวลำโพง</text>
  <text x="185" y="434" font-size="17" fill="#FFFFFF" text-anchor="middle">Hua Lamphong 華藍蓬</text>
  <line x1="310" y1="412" x2="452" y2="412" stroke="#2E7D5B" stroke-width="8"/>
  <polygon points="450,400 474,412 450,424" fill="#2E7D5B"/>
  <circle cx="382" cy="412" r="9" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="382" y="390" font-size="15" fill="#2E7D5B" text-anchor="middle">บางปะอิน</text>
  <rect x="478" y="384" width="160" height="56" rx="28" fill="#102A2B"/>
  <text x="558" y="419" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">大城車站</text>
  <text x="60" y="484" font-size="19" font-weight="700" fill="#2E7D5B">普通車、通勤車 · 約 1 小時 35 分到 2 小時</text>
  <text x="60" y="510" font-size="17" fill="#5C6B6B">途中停 บางปะอิน Bang Pa-In · 車站窗口買票</text>

  <!-- row 3: minivan -->
  <rect x="60" y="544" width="250" height="76" rx="14" fill="#B8442D"/>
  <text x="185" y="576" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">รถตู้ 小巴</text>
  <text x="185" y="604" font-size="17" fill="#FFFFFF" text-anchor="middle">Minivan</text>
  <line x1="310" y1="582" x2="448" y2="582" stroke="#B8442D" stroke-width="7" stroke-dasharray="16 11"/>
  <polygon points="450,570 474,582 450,594" fill="#B8442D"/>
  <rect x="478" y="554" width="160" height="56" rx="28" fill="#102A2B"/>
  <text x="558" y="589" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">大城市區</text>
  <text x="60" y="654" font-size="19" font-weight="700" fill="#B8442D">小巴 · 發車點、班次與票價以現場為準</text>

  <!-- last trains -->
  <rect x="60" y="690" width="580" height="162" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="84" y="728" font-size="21" font-weight="700" fill="#B8442D">回程晚班 Last trains</text>
  <text x="84" y="762" font-size="19" fill="#102A2B">19:45 特別通勤車 大城 → 中央站 21:00</text>
  <text x="84" y="794" font-size="19" fill="#102A2B">21:22 特快 大城 → 中央站 22:15（最後一班）</text>
  <text x="84" y="828" font-size="17" fill="#5C6B6B">長途車可能誤點，出發前看列車追蹤系統</text>

  <!-- panel 2: island loop -->
  <text x="700" y="172" font-size="24" font-weight="700" fill="#6B4A3A">② 大城島內環線 Island loop</text>

  <rect x="1150" y="146" width="410" height="112" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="1174" y="180" font-size="20" font-weight="700" fill="#B8442D">藝術廳門票 ค่าเข้าชม</text>
  <text x="1174" y="212" font-size="19" fill="#102A2B">外國人單寺 80 泰銖 · 7 處聯票 300 泰銖</text>
  <text x="1174" y="242" font-size="17" fill="#5C6B6B">每天 08:00 到 18:00 開放</text>

  <ellipse cx="1070" cy="480" rx="340" ry="190" fill="#EFE6D6" stroke="#2F6F9F" stroke-width="10"/>
  <text x="1070" y="640" font-size="18" fill="#2F6F9F" text-anchor="middle">เกาะเมือง 古城島（三條河圍住）</text>

  <path d="M 1490 470 L 1400 730 L 1180 560 L 1180 420 L 920 440 L 800 770" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- station -->
  <circle cx="1490" cy="470" r="15" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
  <text x="1490" y="408" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">สถานีอยุธยา</text>
  <text x="1490" y="434" font-size="18" fill="#102A2B" text-anchor="middle">大城車站 Station</text>

  <!-- 1 Wat Yai Chai Mongkhon -->
  <circle cx="1400" cy="730" r="15" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="1400" y="736" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">1</text>
  <text x="1400" y="772" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">วัดใหญ่ชัยมงคล</text>
  <text x="1400" y="798" font-size="18" fill="#102A2B" text-anchor="middle">Wat Yai Chai Mongkhon</text>
  <text x="1400" y="824" font-size="17" fill="#5C6B6B" text-anchor="middle">崖差蒙空寺 · 臥佛 · 第一站</text>

  <!-- 2 Wat Mahathat -->
  <circle cx="1180" cy="560" r="15" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="1180" y="566" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">2</text>
  <text x="1154" y="556" font-size="19" font-weight="700" fill="#102A2B" text-anchor="end">วัดมหาธาตุ Wat Mahathat</text>
  <text x="1154" y="582" font-size="17" fill="#5C6B6B" text-anchor="end">瑪哈泰寺 · 樹根佛頭</text>

  <!-- 3 Wat Ratchaburana -->
  <circle cx="1180" cy="420" r="15" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="1180" y="426" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">3</text>
  <text x="1206" y="416" font-size="19" font-weight="700" fill="#102A2B">วัดราชบูรณะ</text>
  <text x="1206" y="442" font-size="17" fill="#102A2B">Wat Ratchaburana</text>
  <text x="1206" y="466" font-size="17" fill="#5C6B6B">拉查布拉那寺 · 地宮</text>

  <!-- 4 Wat Phra Si Sanphet -->
  <circle cx="920" cy="440" r="15" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="920" y="446" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">4</text>
  <text x="920" y="380" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">วัดพระศรีสรรเพชญ์</text>
  <text x="920" y="406" font-size="17" fill="#102A2B" text-anchor="middle">Wat Phra Si Sanphet 帕席桑碧寺</text>

  <!-- 5 Wat Chaiwatthanaram -->
  <circle cx="800" cy="770" r="15" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="800" y="776" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">5</text>
  <text x="828" y="768" font-size="19" font-weight="700" fill="#102A2B">วัดไชยวัฒนาราม</text>
  <text x="828" y="794" font-size="17" fill="#102A2B">Wat Chaiwatthanaram 柴瓦塔那蘭寺</text>
  <text x="828" y="820" font-size="17" fill="#5C6B6B">傍晚最美 · 看完包車回車站</text>

