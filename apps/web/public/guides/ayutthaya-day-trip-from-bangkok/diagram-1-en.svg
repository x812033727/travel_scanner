<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Bangkok to Ayutthaya Day-Trip Route Map</title>
  <desc id="desc">The left half shows three ways from Bangkok to Ayutthaya: Special Express, Express or Rapid trains from Krung Thep Aphiwat Central Station to Ayutthaya Station take about 50 minutes to 1 hour 20 minutes. Central Station is at Exit 3 of MRT Blue Line Bang Sue Station, BL11. Ordinary or Commuter trains from Hua Lamphong take about 1 hour 35 minutes to 2 hours, stopping at Bang Pa-In. Confirm minivan departure points, schedules and fares locally. Lower left: evening return trains—the 19:45 Special Commuter reaches Central Station at 21:00; the last train, the 21:22 Special Express, arrives at 22:15. The right half shows the old city island loop: start at Ayutthaya Station, then visit Wat Yai Chai Mongkhon, Wat Mahathat, Wat Ratchaburana, Wat Phra Si Sanphet and finally Wat Chaiwatthanaram southwest of the island. Upper right: Fine Arts Department admission for foreigners is 80 baht per temple or 300 baht for a 7-site pass. Open daily 08:00 to 18:00.</desc>
