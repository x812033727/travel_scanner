<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">방콕에서 아유타야로 가는 당일 여행 노선도</title>
  <desc id="desc">왼쪽은 방콕에서 아유타야로 가는 세 가지 방법입니다. Krung Thep Aphiwat 중앙역에서 특급·급행·쾌속열차를 타면 아유타야역까지 약 50분~1시간 20분이 걸립니다. 중앙역은 MRT 블루라인 Bang Sue역 BL11의 3번 출구에 있습니다. 후아람퐁에서 보통·통근열차를 타면 약 1시간 35분~2시간이 걸리며, 도중에 Bang Pa-In에 정차합니다. 미니밴의 출발지·운행편·요금은 현장에서 확인해야 합니다. 왼쪽 아래는 귀환 저녁 열차입니다. 19:45 특별 통근열차는 중앙역에 21:00 도착하며, 마지막 21:22 특급열차는 중앙역에 22:15 도착합니다. 오른쪽은 아유타야 옛 도심 섬의 순환 코스입니다. 아유타야역에서 출발해 왓 야이차이몽콘, 왓 마하탓, 왓 랏차부라나, 왓 프라시산펫을 차례로 방문한 뒤, 마지막에 섬 밖 남서쪽의 왓 차이왓타나람으로 갑니다. 오른쪽 위는 예술국 관리 유적 입장료입니다. 외국인은 사원별 80바트, 7곳 통합권 300바트이며, 매일 08:00부터 18:00까지 개방합니다.</desc>
