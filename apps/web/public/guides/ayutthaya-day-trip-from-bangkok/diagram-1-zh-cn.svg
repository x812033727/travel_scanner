<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">曼谷到大城一日游路线图</title>
  <desc id="desc">左半边是曼谷到大城的三种去法：从 Krung Thep Aphiwat 中央站乘特快、快车或快速车到大城车站约 50 分钟到 1 小时 20 分钟，中央站在 MRT 蓝线 Bang Sue 站 BL11 的 3 号出口；从华蓝蓬乘普通车或通勤车约 1 小时 35 分钟到 2 小时，途中停 Bang Pa-In；小巴的发车点、班次与票价以现场为准。左下是返程晚班：19:45 特别通勤车到中央站 21:00，最后一班 21:22 特快到中央站 22:15。右半边是大城古城岛的环线：从大城车站出发，依次是崖差蒙空寺、玛哈泰寺、拉查布拉那寺、帕席桑碧寺，最后到岛外西南的柴瓦塔那兰寺。右上是艺术厅门票：外国人单寺 80 泰铢、7 处联票 300 泰铢，每天 08:00 到 18:00 开放。</desc>
