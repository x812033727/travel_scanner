<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Bluehost のドメインと請求の疑問：追加購入・支払い・更新を項目ごとに確認 — 請求の問題は三つの情報を照合</title><desc id="desc">商品の状態、販売者の注文、銀行取引を三つの列に分け、照合してから請求の問題に対応する図。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">請求の問題は三つの情報を照合</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">商品・注文・決済手段の状態は一致しない場合もある</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">商品の状態</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">ドメインまたはサーバー</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">有効期限と更新</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">特典の対象条件</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">販売者の注文</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">注文番号</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">項目と利用期間</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">処理・キャンセル結果</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">支払い記録</text>
<text x="1092.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">取引時刻と金額</text>
<text x="1092.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">通貨と決済手段</text>
<text x="1092.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">承認または完了の状態</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">同じ取引かを確かめてから、再試行やキャンセルを判断します。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
