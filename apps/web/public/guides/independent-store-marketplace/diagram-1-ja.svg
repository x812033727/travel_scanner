<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title id="title">三つの販売経路と運営責任</title><desc id="desc">自社運営に必要な技術保守、ホスト型店舗のプランと連携、モールの露出と取引規則を三列で比較します。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">三つの販売経路と運営責任</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">今解くべき課題を見つけ、費用とデータを確認</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">自社運営の店舗</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">サイトと導線を管理</text>
<text x="108.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">更新とバックアップ</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">自力で集客を計画</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="600.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">ホスト型店舗</text>
<text x="600.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">料金プランと連携を確認</text>
<text x="600.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">ブランドと商品を運営</text>
<text x="600.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">データ出力と費用を確認</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1092.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">モール出店</text>
<text x="1092.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">検索流入と注文を試す</text>
<text x="1092.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">取引と販促の規則を守る</text>
<text x="1092.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">注文ごとの費用を計算</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">一つの経路で受注と照合を安定させてから、多経路へ広げます。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaairオリジナル図解</text>
</svg>
