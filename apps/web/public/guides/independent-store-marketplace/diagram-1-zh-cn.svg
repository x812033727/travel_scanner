<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="title">商店渠道的三种责任分工</title><desc id="desc">三栏比较自建商店的技术维护、托管店铺的方案与集成、平台商城的曝光和交易规则。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">商店渠道的三种责任分工</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">先找出当前最要紧的问题，再核对成本与数据</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">自建商店</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">掌控网站与流程</text>
<text x="108.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">安排更新与备份</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">规划自己的客源</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="600.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">托管店铺</text>
<text x="600.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">核对方案与集成</text>
<text x="600.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">经营品牌和商品</text>
<text x="600.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">确认导出与费用</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1092.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">平台商城</text>
<text x="1092.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">测试搜索与成交</text>
<text x="1092.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">遵循交易和活动规则</text>
<text x="1092.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">核算每笔订单成本</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">先让一个渠道稳定接单和对账，再考虑扩展多个渠道。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair原创制图</text>
</svg>
