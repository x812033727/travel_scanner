<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">Store Channels and Responsibilities</title><desc id="desc">Three columns compare maintenance for a self-hosted store, plan and integration checks for a hosted storefront, and discovery and transaction rules for a marketplace.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="46" fill="#102A2B" text-anchor="start" font-weight="bold">Store Channels and Responsibilities</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Start with the problem, then check costs and data</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Self-hosted store</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Own site and flows</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Maintain and back up</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Bring your own traffic</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="600.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Hosted storefront</text>
<text x="600.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Check plans and tools</text>
<text x="600.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Manage brand and items</text>
<text x="600.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Confirm export and fees</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1092.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Marketplace</text>
<text x="1092.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Test search and orders</text>
<text x="1092.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Follow platform rules</text>
<text x="1092.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Count cost per order</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Get one channel taking orders and reconciling reliably before expanding.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair graphic</text>
</svg>
