<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>スマホ写真の整理順序：まず残し、重複を減らし、見返したくなるアルバムを作る：判断の流れ</title><desc>コピーを確認する、写真の種類を分ける、物語を選ぶ、共有を確認する、の順に点検します。編集部による整理案であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践の順序</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせ、一度にすべて終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">コピーを確認する</text><text x="103" y="497" fill="#f4f0e5" font-size="23">控えを確かめる</text><text x="103" y="573" fill="#f4dc9d" font-size="26">開けてから整理する</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="32.5" font-weight="700">写真の種類を分ける</text><text x="473" y="497" fill="#f4f0e5" font-size="23">用途で整理する</text><text x="473" y="573" fill="#f4dc9d" font-size="26">重複と類似は別</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">物語を選ぶ</text><text x="843" y="497" fill="#f4f0e5" font-size="23">伝えたい話を選ぶ</text><text x="843" y="573" fill="#f4dc9d" font-size="26">少数でも話は伝わる</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">共有を確認する</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">共有設定を見直す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">原本は別に残す</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部作成の図解</text></g></svg>
