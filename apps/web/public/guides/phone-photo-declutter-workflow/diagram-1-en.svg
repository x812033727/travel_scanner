<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Organize phone photos: preserve them first, remove duplicates, then make albums you will revisit: decision sequence</title><desc>Check in order: verify a copy, sort photo types, choose a story, then review sharing. An editorial guide, not a map or measured timings.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Arial, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Adapt it to your needs; you do not have to finish everything at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Verify a copy first</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Check a copy</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Open it before organizing</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">Sort photo types</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Sort by purpose</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Duplicates ≠ similar shots</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Choose a story</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Pick a story</text><text x="843" y="573" fill="#f4dc9d" font-size="22.5">A few can tell the whole story</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Review sharing</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Check sharing</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Keep originals separately</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editorial diagram</text></g></svg>
