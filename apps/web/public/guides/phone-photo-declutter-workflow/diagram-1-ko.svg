<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>휴대폰 사진 정리 순서: 먼저 보존하고, 중복을 줄인 뒤, 다시 보고 싶은 앨범 만들기: 판단 순서</title><desc>사본부터 확인하기, 사진 종류 나누기, 이야기 고르기, 공유 확인하기 순서로 점검합니다. 편집부의 정리 제안이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실천 순서</text><text x="100" y="175" fill="#576968" font-size="25">자신의 상황에 맞게 선택하고, 한 번에 전부 끝내려 하지 마세요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">사본부터 확인하기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">사본 점검하기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">열 수 있는지 먼저 확인</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">사진 종류 나누기</text><text x="473" y="497" fill="#f4f0e5" font-size="23">용도별로 분류하기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">중복과 비슷함은 다름</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">이야기 고르기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">전할 이야기 선택</text><text x="843" y="573" fill="#f4dc9d" font-size="25">적은 사진으로도 완결되게</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">공유 확인하기</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">공유 설정 살피기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">원본은 따로 보관하기</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 도식</text></g></svg>
