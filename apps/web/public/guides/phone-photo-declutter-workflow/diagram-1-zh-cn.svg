<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>手机照片整理顺序：先保留，再删重复，最后做真正会翻的相册：判断流程</title><desc>依次检查：先确认副本、分照片类型、选一段故事、检查分享。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">实用处理顺序</text><text x="100" y="175" fill="#576968" font-size="25">根据你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">先确认副本</text><text x="103" y="497" fill="#f4f0e5" font-size="23">核验副本</text><text x="103" y="573" fill="#f4dc9d" font-size="26">能打开再整理</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">分照片类型</text><text x="473" y="497" fill="#f4f0e5" font-size="23">按用途分类</text><text x="473" y="573" fill="#f4dc9d" font-size="26">重复不等于相似</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">选一段故事</text><text x="843" y="497" fill="#f4f0e5" font-size="23">选择故事</text><text x="843" y="573" fill="#f4dc9d" font-size="26">少量也完整</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">检查分享</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">核对分享设置</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">原文件另行保留</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意图</text></g></svg>
