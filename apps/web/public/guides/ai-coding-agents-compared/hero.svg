<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一個需求，三條路 / One task, three coding agents</title>
  <desc id="desc">扁平插圖。左邊是一個裝著三行文字的對話框，代表一份寫好的提示詞，從它分出三條線往右走。每一條線中間都有一個白色圓形關卡，圓內是一個綠色勾號，代表代理動手前要先取得你的核准。三條線分別通往右邊三個圓角的終端機視窗，視窗邊框分別是綠色、藍色與橘色，畫面裡各有兩行程式碼與一個完成的勾號，代表同一個需求在三個工具上各自跑完。下方有一行標題文字：一個需求，三條路。</desc>
