<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">ジャーニーとファネルを併せて見る</title><desc id="desc">接点、イベント条件、ファネルの分母、改善の検証を四つの列で区分し、Web サイトでの送信は修理サービスのジャーニーの一部にすぎないことを示す。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">ジャーニーとファネルを併せて見る</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">顧客のタスクを描き、確実に識別できるステップを測定</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">ジャーニー範囲</text>
<text x="108.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">検索から引き取り確認まで</text>
<text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">オンライン・電話・店頭</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">タスクと障壁を記録</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">イベント条件</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">閲覧・確認・入力</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">送信成功で完了</text>
<text x="477.0" y="475" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">イベントとパラメータをテスト</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">ファネルの割合</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">入口と期間を固定</text>
<text x="846.0" y="423" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">各ステップの分母を明確に</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">送信は成約とは別</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">改善の検証</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">データと調査の根拠</text>
<text x="1215.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">具体的な仮説を一つ選ぶ</text>
<text x="1215.0" y="475" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">その後のサービスを振り返る</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">ファネルは調べるべき箇所を示し、ジャーニーの調査は原因とその後の影響を理解する助けになります。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
