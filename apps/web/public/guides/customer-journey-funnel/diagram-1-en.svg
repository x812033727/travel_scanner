<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">View Journeys and Funnels Together</title><desc id="desc">Four columns distinguish touchpoints, event criteria, funnel denominators, and improvement testing, showing that website submission is only part of the repair service journey.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">View Journeys and Funnels Together</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Map customer tasks first, then measure reliably identifiable steps</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Journey scope</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Search → pickup ✓</text>
<text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Online, phone, in person</text>
<text x="108.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Log tasks and obstacles</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Event criteria</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Read, view, fill in</text>
<text x="477.0" y="423" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Done = successful submission</text>
<text x="477.0" y="475" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Test events and parameters</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Funnel rates</text>
<text x="846.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Fix entry and date range</text>
<text x="846.0" y="423" font-size="18" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 18px;">Clarify each step's denominator</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Submission ≠ sale</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 30px;">Test improvements</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Data + research evidence</text>
<text x="1215.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Pick one specific hypothesis</text>
<text x="1215.0" y="475" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Review subsequent service</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Funnels flag where to investigate; journey research helps explain causes and downstream effects.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
