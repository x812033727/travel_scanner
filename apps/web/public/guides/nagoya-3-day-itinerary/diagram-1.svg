<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">名古屋三天路線圖與中部國際機場名鐵線 / Nagoya three-day route map with the Meitetsu airport line</title>
  <desc id="desc">中部國際機場搭名鐵 μ-SKY 28 分或特急 36 分到名鐵名古屋，運賃 980 日圓，μ-SKY 另加 μ 票 450 日圓。第一天從名古屋站搭地下鐵到名古屋城、榮與大須；第二天搭名鐵到神宮前的熱田神宮，再搭あおなみ線 24 分、360 日圓到金城ふ頭的磁浮鐵道館，或搭名港線到名古屋港水族館；第三天可搭名鐵犬山線到犬山，再回名古屋站搭名鐵回機場。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="80" y="82" font-size="40" font-weight="700" fill="#102A2B">名古屋 三日路線と空港アクセス</text>
  <text x="80" y="122" font-size="22" fill="#5C6B6B">Nagoya 3-day route map · 分鐘與票價為名鐵、あおなみ線官網數字，以時刻表為準</text>

  <!-- Airport line: Centrair -> Meitetsu Nagoya -->
  <path d="M 1240 810 C 1050 810, 780 830, 640 570" fill="none" stroke="#0D6B68" stroke-width="14" stroke-linecap="round"/>
  <rect x="1240" y="720" width="280" height="120" rx="24" fill="#0D6B68"/>
  <text x="1380" y="770" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">中部国際空港</text>
  <text x="1380" y="808" font-size="20" fill="#E6F2F1" text-anchor="middle">Centrair · セントレア</text>
  <text x="880" y="690" font-size="22" font-weight="700" fill="#0D6B68">名鉄 μ-SKY 最速 28 分 · 特急 36 分</text>
  <text x="880" y="720" font-size="18" fill="#5C6B6B">運賃 980 円 · μ-SKY はミューチケット 450 円追加</text>

  <!-- Nagoya station hub -->
  <rect x="430" y="470" width="200" height="100" rx="24" fill="#102A2B"/>
  <text x="530" y="512" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">名古屋駅</text>
  <text x="530" y="546" font-size="20" fill="#E6F2F1" text-anchor="middle">Nagoya / 名鉄名古屋</text>

  <!-- Day 1: Nagoya station -> Sakae -> Nagoya Castle; Sakae -> Osu -->
  <path d="M 630 500 L 900 500" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round"/>
  <path d="M 900 500 L 900 300" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round"/>
  <path d="M 900 500 L 1000 620" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round"/>
  <circle cx="900" cy="500" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <text x="925" y="492" font-size="24" font-weight="700" fill="#102A2B">栄 Sakae</text>
  <text x="925" y="520" font-size="18" fill="#5C6B6B">Oasis 21 · MIRAI TOWER</text>
  <circle cx="900" cy="300" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <text x="925" y="292" font-size="24" font-weight="700" fill="#102A2B">名古屋城 Nagoya Castle</text>
  <text x="925" y="320" font-size="18" fill="#5C6B6B">本丸御殿 Honmaru Palace · 名城線</text>
  <circle cx="1000" cy="620" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
  <text x="1025" y="612" font-size="24" font-weight="700" fill="#102A2B">大須 Osu</text>
  <text x="1025" y="640" font-size="18" fill="#5C6B6B">大須観音 · 商店街 · 上前津</text>
  <text x="660" y="484" font-size="20" font-weight="700" fill="#B8442D">Day 1 地下鉄 東山線・名城線</text>

  <!-- Day 2: Nagoya -> Jingu-mae (Meitetsu); Nagoya -> Kinjo-futo (Aonami); Nagoya port -->
  <path d="M 560 570 C 560 700, 520 760, 520 820" fill="none" stroke="#2E7D5B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 500 570 C 420 680, 300 720, 200 780" fill="none" stroke="#2E7D5B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 520 858 L 700 878" fill="none" stroke="#2E7D5B" stroke-width="8" stroke-dasharray="4 12" stroke-linecap="round"/>
  <circle cx="520" cy="820" r="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="8"/>
  <text x="545" y="812" font-size="24" font-weight="700" fill="#102A2B">熱田神宮 Atsuta Jingu</text>
  <text x="545" y="840" font-size="18" fill="#5C6B6B">名鉄 神宮前 · 蓬莱軒 ひつまぶし</text>
  <circle cx="200" cy="780" r="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="8"/>
  <text x="80" y="826" font-size="24" font-weight="700" fill="#102A2B">金城ふ頭 Kinjo-futo</text>
  <text x="80" y="854" font-size="18" fill="#5C6B6B">リニア・鉄道館 SCMAGLEV and Railway Park</text>
  <text x="60" y="600" font-size="20" font-weight="700" fill="#2E7D5B">Day 2 あおなみ線 24 分 · 360 円</text>
  <text x="590" y="700" font-size="20" font-weight="700" fill="#2E7D5B">Day 2 名鉄 → 神宮前</text>
  <text x="720" y="884" font-size="18" fill="#5C6B6B">地下鉄 名港線 → 名古屋港水族館（二選一）</text>

  <!-- Day 3: Inuyama (optional) -->
  <path d="M 500 470 C 420 380, 300 300, 200 220" fill="none" stroke="#7E57C2" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"/>
  <circle cx="200" cy="220" r="16" fill="#FFFFFF" stroke="#7E57C2" stroke-width="8"/>
  <text x="80" y="188" font-size="24" font-weight="700" fill="#102A2B">犬山 Inuyama（可選）</text>
  <text x="230" y="240" font-size="18" fill="#5C6B6B">国宝 犬山城 · 城下町</text>
  <text x="260" y="360" font-size="20" font-weight="700" fill="#7E57C2">Day 3 名鉄 犬山線</text>

  <!-- Legend -->
  <g font-size="20" fill="#102A2B">
    <line x1="1000" y1="160" x2="1060" y2="160" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
    <text x="1072" y="167">名鉄 空港線 Meitetsu</text>
    <line x1="1000" y1="200" x2="1060" y2="200" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
    <text x="1072" y="207">Day 1 地下鉄 Subway</text>
    <line x1="1300" y1="160" x2="1360" y2="160" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round"/>
    <text x="1372" y="167">Day 2 名鉄・あおなみ線</text>
    <line x1="1300" y1="200" x2="1360" y2="200" stroke="#7E57C2" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
    <text x="1372" y="207">Day 3 犬山（可選）</text>
    <text x="1330" y="867" fill="#5C6B6B">© Mokaair 製圖 2026</text>
  </g>
</svg>
