<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ChatGPT 語音模式的四步流程與三種情境 / ChatGPT Voice: four steps and three use cases</title>
  <desc id="desc">上排四個步驟由左到右用箭頭串起。步驟 1 開啟語音：按輸入框右側的語音圖示，手機 App 與 chatgpt.com 都有，第一次要允許麥克風並挑一個聲音。步驟 2 設定語言與角色：用第一句話把規則講清楚，主要語言在設定、Voice、Language 選，三種情境的開場句見下方分支。步驟 3 對話：Live 能同時聽與講，可以打斷它，建議戴耳機、一次講一句，講到一半也能打字或加照片。步驟 4 看逐字稿：結束後自動加進對話，不是逐字記錄，吵雜時會漏字，語音片段保留 30 天。步驟 2 往下分成三條分支。練英文口說：開場句是請只用英文回答、講慢一點，我講錯時先糾正我再繼續聊；三種練法是自由聊天、角色扮演點餐訂房、請它糾正並重複一次讓你跟讀；結束後看逐字稿抄下被糾正的句子；糾正發音與文法可以，考試評分不行。旅行口譯：開場句是請當中文和日文的雙向口譯，我講中文翻成日文，對方講日文翻成中文，只翻譯不加意見；做法是一次一句、輪流講、不講時按靜音；限制是噪音大會誤判、全程要網路；對方的聲音也會保存，先徵得同意，證件與卡號不要用講的。免手打：麥克風圖示是聽寫，講完轉成文字可修改再送出，回覆是文字；聲波圖示是語音模式，你講它也講；長內容、要修改、要精確文字用聽寫；討論、邊做事邊問、練口說、口譯用語音；密碼、身分證字號、卡號兩種都不要講。最下方三行補充：額度是 Go 每天最多 3 小時 GPT-Live-1 mini、Plus 3 小時 GPT-Live-1、Pro 15 小時或不限時，免費版用 GPT-Live-1 mini，數字以官網為準；單次語音對話最長 2 小時，語音片段與逐字稿一起保留 30 天，關訓練在 Settings、Data Controls，不想留紀錄先開暫時對話；鏡頭與螢幕分享只有 Advanced 模式的付費訂閱者能用，Live 暫不支援，功能與額度常改，以官網為準。2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ChatGPT 語音模式的四步流程與三種情境（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">ChatGPT Voice: open, set language and role, talk, then review the transcript</text>

  <!-- step 1 開啟語音 -->
  <rect x="54" y="120" width="340" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="94" cy="160" r="22" fill="#0D6B68"/>
  <text x="94" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="128" y="168" font-size="20" font-weight="700" fill="#0B4F4D">開啟語音</text>
  <text x="128" y="194" font-size="15" fill="#5C6B6B">Open Voice</text>
  <text x="78" y="236" font-size="16" fill="#102A2B">按輸入框右側的語音圖示</text>
  <text x="78" y="264" font-size="16" fill="#102A2B">手機 App 與 chatgpt.com 都有</text>
  <text x="78" y="292" font-size="16" fill="#102A2B">第一次要允許麥克風、挑聲音</text>
  <path d="M 396 220 L 430 220" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 設定語言與角色 -->
  <rect x="438" y="120" width="340" height="200" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="478" cy="160" r="22" fill="#2F6F9F"/>
  <text x="478" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="512" y="168" font-size="20" font-weight="700" fill="#1F4E73">設定語言與角色</text>
  <text x="512" y="194" font-size="15" fill="#5C6B6B">Set language and role</text>
  <text x="462" y="236" font-size="16" fill="#102A2B">用第一句話把規則講清楚</text>
  <text x="462" y="264" font-size="16" fill="#102A2B">主要語言：設定 → Voice → Language</text>
  <text x="462" y="292" font-size="16" fill="#102A2B">三種情境的開場句見下方分支</text>
  <path d="M 780 220 L 814 220" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 對話 -->
  <rect x="822" y="120" width="340" height="200" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <circle cx="862" cy="160" r="22" fill="#102A2B"/>
  <text x="862" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="896" y="168" font-size="20" font-weight="700" fill="#102A2B">對話</text>
  <text x="896" y="194" font-size="15" fill="#5C6B6B">Talk</text>
  <text x="846" y="236" font-size="16" fill="#102A2B">Live 同時聽與講，可以打斷它</text>
  <text x="846" y="264" font-size="16" fill="#102A2B">戴耳機、一次講一句</text>
  <text x="846" y="292" font-size="16" fill="#102A2B">講到一半也能打字或加照片</text>
  <path d="M 1164 220 L 1198 220" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 看逐字稿 -->
  <rect x="1206" y="120" width="340" height="200" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="1246" cy="160" r="22" fill="#2E7D5B"/>
  <text x="1246" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1280" y="168" font-size="20" font-weight="700" fill="#1F5A40">看逐字稿</text>
  <text x="1280" y="194" font-size="15" fill="#5C6B6B">Review the transcript</text>
  <text x="1230" y="236" font-size="16" fill="#102A2B">結束後自動加進對話</text>
  <text x="1230" y="264" font-size="16" fill="#102A2B">不是逐字記錄，吵雜時會漏字</text>
  <text x="1230" y="292" font-size="16" fill="#102A2B">語音片段保留 30 天</text>

  <!-- branches from step 2 -->
  <path d="M 608 322 L 608 362" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 294 362 L 1306 362" stroke="#5C6B6B" stroke-width="4"/>
  <path d="M 294 362 L 294 394" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 800 362 L 800 394" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1306 362 L 1306 394" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- branch A 練英文口說 -->
  <rect x="54" y="400" width="480" height="290" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <text x="78" y="436" font-size="20" font-weight="700" fill="#8A4A16">練英文口說</text>
  <text x="196" y="436" font-size="15" fill="#5C6B6B">Practice speaking</text>
  <text x="78" y="472" font-size="16" font-weight="700" fill="#102A2B">開場句（用中文講也可以）</text>
  <text x="78" y="498" font-size="16" fill="#102A2B">「請只用英文回答，講慢一點；</text>
  <text x="78" y="524" font-size="16" fill="#102A2B">我講錯時先糾正我，再繼續聊。」</text>
  <text x="78" y="560" font-size="16" fill="#102A2B">三種練法：自由聊天、角色扮演點餐訂房、</text>
  <text x="78" y="586" font-size="16" fill="#102A2B">請它糾正並重複一次讓你跟讀</text>
  <text x="78" y="622" font-size="16" fill="#102A2B">結束後看逐字稿，抄下被糾正的句子</text>
  <text x="78" y="658" font-size="16" fill="#B8442D">糾正發音與文法可以，考試評分不行</text>

  <!-- branch B 旅行口譯 -->
  <rect x="560" y="400" width="480" height="290" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="584" y="436" font-size="20" font-weight="700" fill="#1F4E73">旅行口譯</text>
  <text x="682" y="436" font-size="15" fill="#5C6B6B">Live interpreting</text>
  <text x="584" y="472" font-size="16" font-weight="700" fill="#102A2B">開場句</text>
  <text x="584" y="498" font-size="16" fill="#102A2B">「請當中文和日文的雙向口譯：我講中文</text>
  <text x="584" y="524" font-size="16" fill="#102A2B">翻成日文，對方講日文翻成中文，只翻譯。」</text>
  <text x="584" y="560" font-size="16" fill="#102A2B">做法：一次一句、輪流講、不講時按靜音</text>
  <text x="584" y="586" font-size="16" fill="#102A2B">限制：噪音大會誤判、全程要網路</text>
  <text x="584" y="622" font-size="16" fill="#102A2B">對方的聲音也會保存，先徵得同意</text>
  <text x="584" y="658" font-size="16" fill="#B8442D">證件號碼與卡號不要用講的</text>

  <!-- branch C 免手打 -->
  <rect x="1066" y="400" width="480" height="290" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1090" y="436" font-size="20" font-weight="700" fill="#1F5A40">免手打</text>
  <text x="1168" y="436" font-size="15" fill="#5C6B6B">Dictation vs Voice</text>
  <text x="1090" y="472" font-size="16" font-weight="700" fill="#102A2B">兩種圖示都在輸入框右側</text>
  <text x="1090" y="498" font-size="16" fill="#102A2B">麥克風＝聽寫：講完轉成文字，</text>
  <text x="1090" y="524" font-size="16" fill="#102A2B">可修改再送出，回覆是文字</text>
  <text x="1090" y="560" font-size="16" fill="#102A2B">聲波＝語音模式：你講它也講</text>
  <text x="1090" y="596" font-size="16" fill="#102A2B">用聽寫：長內容、要修改、要精確文字</text>
  <text x="1090" y="622" font-size="16" fill="#102A2B">用語音：討論、邊做事邊問、練口說、口譯</text>
  <text x="1090" y="658" font-size="16" fill="#B8442D">密碼、身分證字號、卡號兩種都不要講</text>

  <!-- notes -->
  <text x="54" y="740" font-size="15" fill="#5C6B6B">額度：Go 每天最多 3 小時 GPT-Live-1 mini、Plus 3 小時 GPT-Live-1、Pro 15 小時或不限時；免費版用 GPT-Live-1 mini，數字以官網為準。</text>
  <text x="54" y="768" font-size="15" fill="#5C6B6B">單次語音對話最長 2 小時；語音片段與逐字稿一起保留 30 天，關訓練在 Settings → Data Controls，不想留紀錄先開暫時對話。</text>
  <text x="54" y="796" font-size="15" fill="#5C6B6B">鏡頭與螢幕分享只有 Advanced 模式的付費訂閱者能用，Live 暫不支援；功能與額度常改，以官網為準。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
