  <circle cx="346" cy="396" r="7" fill="#D97A2B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="60" y="560" font-size="16" font-weight="700" fill="#D97A2B">เรือด่วนธงส้ม 橘旗快船</text>
