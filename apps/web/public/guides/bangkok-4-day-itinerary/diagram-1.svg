<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">曼谷四天三夜分區路線示意圖：舊城區、暹羅、恰圖恰與唐人街、水上市場</title>
  <desc id="desc">示意圖，昭披耶河由上而下流過畫面左側。第 1 天舊城區在河的東岸：大皇宮門票 500 泰銖、08:30 到 16:30 開放、售票到 15:30；臥佛寺門票 300 泰銖、08:00 到 19:30；碼頭 Tha Chang N9 與 Tha Tien N8，MRT Sanam Chai 站；河西岸的鄭王廟用渡船過河。橘旗快船沿河連接舊城碼頭與南邊的 Sathorn 中央碼頭，18 泰銖均一、週一到週五；Sathorn 碼頭旁是 BTS Saphan Taksin 站，2 號出口走到碼頭。河西岸南邊的 ICONSIAM 以接駁船與 BTS 金線 Charoen Nakhon 站連接。第 2 天暹羅在畫面中央偏右：Siam Paragon、Siam Square、MBK、四面佛、Jim Thompson House（門票以官網為準，BTS National Stadium 站），晚餐搭 BTS 往東到通羅；BTS 服務時間 05:00 到 01:00、暹羅站末班 00:02。第 3 天恰圖恰在右上：週六日開市，BTS Mo Chit 站或 MRT Chatuchak Park 站，平日改去 ICONSIAM；晚上 MRT 藍線到 Wat Mangkon 站的唐人街耀華力路。第 4 天在右下：水上市場半日遊，丹能莎朵、美功鐵道市場、安帕瓦，跟團清晨出發中午回市區，再退房去機場。圖例：實線 BTS 綠、MRT 藍、快船橘；虛線為渡船與接駁船。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="32" font-weight="700" fill="#102A2B">曼谷四天三夜分區路線：舊城、暹羅、恰圖恰與唐人街、水上市場</text>
  <text x="60" y="98" font-size="18" fill="#5C6B6B">Bangkok in 4 days by zone · 票價與時間 2026 年 9 月依官網查證</text>

