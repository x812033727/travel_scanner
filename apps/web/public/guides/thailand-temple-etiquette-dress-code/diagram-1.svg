<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">進泰國寺廟的七個關卡：從出門前到走出寺門 / Thai temple visit, step by step</title>
<desc id="desc">由左到右、由上到下的七格流程。出門前：有袖上衣加長褲或過膝裙，穿好脫的鞋。門口：大皇宮列了十一條不能穿的衣服，腰布不一定租得到。買票：外國人付費，身高 120 公分以下兒童免費。脫鞋：進殿要脫鞋、放到鞋架上。請四點組：花、線香、蠟燭、金箔，常見約 20 泰銖。大殿：跪坐、腳底不朝佛像，最慎重的禮拜叩三次，旁邊的標籤寫玉佛寺大殿內不能拍照。離開前：不碰壁畫與塑像、不踩上佛像、全寺禁菸。右側小欄是兩件隨時適用的事：女性不碰觸僧侶的身體、僧衣與隨身物品；每天 08:00 與 18:00 國歌響起就站好。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
