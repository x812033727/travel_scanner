<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">保留基礎計算，加上任務更新</title><desc id="desc">輸入同時走凍結的基礎權重與可訓練低秩更新兩條路徑，合成輸出；訓練改變小型更新而非全部基礎權重</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">保留基礎計算，加上任務更新</text><text x="60" y="84" font-size="18" fill="#5C6B6B">LoRA — Low-Rank Adaptation</text><path d="M 360 400 L 560 250" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 360 465 L 560 640" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 990 250 L 1200 395" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 990 640 L 1200 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="345" width="280" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="220" y="424" font-size="28" fill="#102A2B" text-anchor="middle">輸入</text><text x="220" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">客服來信</text><rect x="570" y="160" width="420" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="780" y="239" font-size="28" fill="#102A2B" text-anchor="middle">基礎權重</text><text x="780" y="282" font-size="22" fill="#5C6B6B" text-anchor="middle">保持凍結</text><rect x="570" y="555" width="420" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="780" y="634" font-size="28" fill="#102A2B" text-anchor="middle">低秩更新</text><text x="780" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">訓練較小矩陣</text><rect x="121