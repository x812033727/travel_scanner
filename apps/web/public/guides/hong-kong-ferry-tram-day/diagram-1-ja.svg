<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>香港の天星小輪とチンチン電車：海を渡り、香港島の街並みをゆっくり楽しむ一日：判断の流れ</title><desc>順に確認：海を渡る方向を選ぶ、徒歩の接続を調べる、トラムの終点を見る、帰路を別に計画する。編集部による整理で、地図や実測時間を示すものではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順 · 実践的な進め方</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選び、全部を一度にこなさなくて大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">海を渡る方向を選ぶ</text><text x="103" y="497" fill="#f4f0e5" font-size="23">埠頭を選ぶ</text><text x="103" y="573" fill="#f4dc9d" font-size="26">中環か湾仔</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">徒歩の接続を調べる</text><text x="473" y="497" fill="#f4f0e5" font-size="23">徒歩で乗り継ぐ</text><text x="473" y="573" fill="#f4dc9d" font-size="26">同じホームではない</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">トラムの終点を見る</text><text x="843" y="497" fill="#f4f0e5" font-size="23">行き先を確認</text><text x="843" y="573" fill="#f4dc9d" font-size="26">同じ方向でも確認</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">帰路は別に計画</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">帰りを計画する</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">同じ道で戻らなくてよい</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部自作の模式図 / 編集部作成図</text></g></svg>
