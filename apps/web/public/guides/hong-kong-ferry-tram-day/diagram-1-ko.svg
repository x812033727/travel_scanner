<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>홍콩 스타 페리와 딩딩 트램: 바다 건너기와 홍콩섬 거리 풍경으로 채우는 느긋한 하루: 판단 흐름</title><desc>순서대로 확인: 도항 방향 선택, 도보 연결 확인, 트램 종점 확인, 돌아오는 길 별도 계획. 편집부가 정리한 것으로, 지도나 실측 소요 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 고르고, 한 번에 다 끝내려 하지 마세요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">도항 방향 선택</text><text x="103" y="497" fill="#f4f0e5" font-size="23">선착장 고르기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">센트럴 또는 완차이</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">도보 연결 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">걸어서 연결하기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">같은 승강장이 아님</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">트램 종점 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">목적지 표시 읽기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">같은 방향도 확인</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">복귀편 별도 계획</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">돌아오는 길 계획</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">왔던 길로 돌아갈 필요 없음</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집 도식</text></g></svg>
