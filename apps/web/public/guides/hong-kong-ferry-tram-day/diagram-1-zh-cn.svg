<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>香港天星小轮加叮叮车：把过海与港岛街景排成慢游一天：判断流程</title><desc>依序检查：选过海方向、查步行衔接、看电车终点、另排回程。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用步骤</text><text x="100" y="175" fill="#576968" font-size="25">依你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">选过海方向</text><text x="103" y="497" fill="#f4f0e5" font-size="23">选择码头</text><text x="103" y="573" fill="#f4dc9d" font-size="26">中环或湾仔</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">查步行衔接</text><text x="473" y="497" fill="#f4f0e5" font-size="23">步行衔接</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不是同一站台</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">看电车终点</text><text x="843" y="497" fill="#f4f0e5" font-size="23">查看目的地</text><text x="843" y="573" fill="#f4dc9d" font-size="26">同向也要确认</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">另排回程</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">规划回程</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">不必原路折返</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意 / 编辑示意图</text></g></svg>
