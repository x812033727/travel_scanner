<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Hong Kong's Star Ferry and Ding Ding Trams: A Leisurely Day of Harbour Crossings and Hong Kong Island Streets: Decision Process</title><desc>Check in order: choose your harbour-crossing direction, check the walking connection, check the tram's destination, and plan the return separately. Compiled by the editors; not a map or measured journey times.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Order of steps · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits your needs; no need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="23" font-weight="700" style="font-size: 23px;">Choose crossing direction</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Choose the pier</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Central or Wan Chai</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="26" font-weight="700" style="font-size: 26px;">Check the walking link</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Connect on foot</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Not the same platform</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="25" font-weight="700" style="font-size: 25px;">Check tram destination</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Read destination</text><text x="843" y="573" fill="#f4dc9d" font-size="18" style="font-size: 18px;">Check even in the same direction</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="26" font-weight="700" style="font-size: 26px;">Plan return separately</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Plan the return</text><text x="1213" y="573" fill="#f4dc9d" font-size="20" style="font-size: 20px;">No need to retrace your route</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · In-house editorial diagram / Editorial diagram</text></g></svg>
