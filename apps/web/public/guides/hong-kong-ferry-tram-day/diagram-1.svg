<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>香港天星小輪加叮叮車：把過海與港島街景排成慢遊一天：判斷流程</title><desc>依序檢查：選過海方向、查步行銜接、看電車終點、另排回程。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · 慢遊一日這樣排</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">選過海方向</text><text x="103" y="497" fill="#f4f0e5" font-size="23">選定上船碼頭</text><text x="103" y="573" fill="#f4dc9d" font-size="26">中環或灣仔</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">查步行銜接</text><text x="473" y="497" fill="#f4f0e5" font-size="23">下船後步行轉乘</text><text x="473" y="573" fill="#f4dc9d" font-size="26">不是同一月臺</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">看電車終點</text><text x="843" y="497" fill="#f4f0e5" font-size="23">看清目的地牌</text><text x="843" y="573" fill="#f4dc9d" font-size="26">同向也要確認</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">另排回程</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">預先安排回程</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">不必原路折返</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意圖</text></g></svg>