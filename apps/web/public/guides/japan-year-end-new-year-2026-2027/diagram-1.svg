<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026 年 12 月 25 日到 2027 年 1 月 5 日日本年末年始時間軸 / Japan year-end and New Year timeline</title>
  <desc id="desc">橫向時間軸從 2026 年 12 月 25 日到 2027 年 1 月 5 日，每列一件事。實心橫條是官方已公告的日期：東海道山陽新幹線のぞみ全席指定席 12 月 25 日到 1 月 5 日；官公廳休 12 月 29 日到 1 月 3 日；銀行休 12 月 31 日到 1 月 3 日，最後營業日 12 月 30 日；東京國立博物館休館 12 月 26 日到 12 月 31 日、1 月 1 日開館；大阪城天守閣休館 12 月 28 日到 1 月 1 日；豐洲市場休市 12 月 31 日與 1 月 1 日到 4 日，1 月 5 日開市；八坂神社をけら詣り 12 月 31 日 19:30 到 1 月 1 日 5:00，1 月 3 日初能奉納 9:00 與かるた始め式 13:00；東京迪士尼 12 月 31 日不辦跨年活動、照常營業。斜紋橫條是往年慣例、2027 年尚未公布：百貨 1 月 1 日休業、1 月 2 日初売り；初詣人潮 12 月 31 日深夜到 1 月 3 日。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <pattern id="hatchCoral" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B8442D" stroke-width="3"/></pattern>
    <pattern id="hatchPurple" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7E57C2" stroke-width="3"/></pattern>
  </defs>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本年末年始時間軸　2026 年 12 月 25 日到 2027 年 1 月 5 日</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Japan year-end and New Year · 實心＝官方已公告，斜紋＝往年慣例、2027 年待公布 · 2026 年 9 月 13 日查證</text>

  <!-- article window 12/26 to 1/4 -->
  <rect x="400" y="166" width="1000" height="530" fill="#FFFFFF" opacity="0.55"/>
  <!-- day grid: 12/25 = 300, 100 px per day, 1/5 ends at 1500 -->
  <g stroke="#D6CEC2" stroke-width="1">
    <line x1="300" y1="166" x2="300" y2="696"/>
    <line x1="400" y1="166" x2="400" y2="696"/>
    <line x1="500" y1="166" x2="500" y2="696"/>
    <line x1="600" y1="166" x2="600" y2="696"/>
    <line x1="700" y1="166" x2="700" y2="696"/>
    <line x1="800" y1="166" x2="800" y2="696"/>
    <line x1="900" y1="166" x2="900" y2="696"/>
    <line x1="1000" y1="166" x2="1000" y2="696"/>
    <line x1="1100" y1="166" x2="1100" y2="696"/>
    <line x1="1200" y1="166" x2="1200" y2="696"/>
    <line x1="1300" y1="166" x2="1300" y2="696"/>
    <line x1="1400" y1="166" x2="1400" y2="696"/>
    <line x1="1500" y1="166" x2="1500" y2="696"/>
  </g>
  <line x1="1000" y1="160" x2="1000" y2="700" stroke="#B8442D" stroke-width="3" stroke-dasharray="8 6"/>
  <g font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="350" y="150">12/25 五</text>
    <text x="450" y="150">12/26 六</text>
    <text x="550" y="150">12/27 日</text>
    <text x="650" y="150">12/28 一</text>
    <text x="750" y="150">12/29 二</text>
    <text x="850" y="150">12/30 三</text>
    <text x="950" y="150">12/31 四</text>
    <text x="1050" y="150" fill="#B8442D">1/1 五・祝</text>
    <text x="1150" y="150">1/2 六</text>
    <text x="1250" y="150">1/3 日</text>
    <text x="1350" y="150">1/4 一</text>
    <text x="1450" y="150">1/5 二</text>
  </g>

  <!-- 1 Nozomi -->
  <text x="60" y="218" font-size="18" font-weight="700" fill="#102A2B">のぞみ全席指定席 Nozomi</text>
  <text x="60" y="238" font-size="15" fill="#5C6B6B">12/25 ～ 1/5・東京～博多全列車，ひかり・こだま有自由席</text>
  <rect x="300" y="204" width="1200" height="22" rx="11" fill="#0D6B68"/>
  <!-- 2 Government -->
  <text x="60" y="268" font-size="18" font-weight="700" fill="#102A2B">官公廳休 Government offices</text>
  <text x="60" y="288" font-size="15" fill="#5C6B6B">12/29 ～ 1/3（行政機関の休日に関する法律）</text>
  <rect x="700" y="254" width="600" height="22" rx="11" fill="#2F6F9F"/>
  <!-- 3 Banks -->
  <text x="60" y="318" font-size="18" font-weight="700" fill="#102A2B">銀行窗口休 Banks</text>
  <text x="60" y="338" font-size="15" fill="#5C6B6B">12/31 ～ 1/3，週六也休；最後營業日 12/30 三</text>
  <rect x="900" y="304" width="400" height="22" rx="11" fill="#2F6F9F"/>
  <!-- 4 TNM -->
  <text x="60" y="368" font-size="18" font-weight="700" fill="#102A2B">東京国立博物館 Tokyo Natl Museum</text>
  <text x="60" y="388" font-size="15" fill="#5C6B6B">休館 12/26 ～ 12/31，1/1 開館</text>
  <rect x="400" y="354" width="600" height="22" rx="11" fill="#6B4A3A"/>
  <!-- 5 Osaka Castle -->
  <text x="60" y="418" font-size="18" font-weight="700" fill="#102A2B">大阪城天守閣 Osaka Castle</text>
  <text x="60" y="438" font-size="15" fill="#5C6B6B">休館 12/28 ～ 1/1</text>
  <rect x="600" y="404" width="500" height="22" rx="11" fill="#6B4A3A"/>
  <!-- 6 Toyosu -->
  <text x="60" y="468" font-size="18" font-weight="700" fill="#102A2B">豐洲市場 Toyosu Market</text>
  <text x="60" y="488" font-size="15" fill="#5C6B6B">休市 12/31、1/1 ～ 1/4；12/27 ～ 12/30 連日開市，1/5 開市</text>
  <rect x="900" y="454" width="500" height="22" rx="11" fill="#2E7D5B"/>
  <!-- 7 Department stores -->
  <text x="60" y="518" font-size="18" font-weight="700" fill="#102A2B">百貨 Department stores</text>
  <text x="60" y="538" font-size="15" fill="#5C6B6B">往年 1/1 休業、1/2 初売り福袋；2027 年日期以官網為準</text>
  <rect x="1000" y="504" width="100" height="22" rx="11" fill="url(#hatchCoral)" stroke="#B8442D" stroke-width="2"/>
  <polygon points="1150,503 1162,515 1150,527 1138,515" fill="#B8442D"/>
  <text x="1172" y="520" font-size="15" fill="#B8442D">初売り</text>
  <!-- 8 Hatsumode -->
  <text x="60" y="568" font-size="18" font-weight="700" fill="#102A2B">初詣人潮 Hatsumode</text>
  <text x="60" y="588" font-size="15" fill="#5C6B6B">12/31 深夜 ～ 1/3；明治神宮、淺草寺夜間開門時間以官網為準</text>
  <rect x="950" y="554" width="350" height="22" rx="11" fill="url(#hatchPurple)" stroke="#7E57C2" stroke-width="2"/>
  <!-- 9 Yasaka -->
  <text x="60" y="618" font-size="18" font-weight="700" fill="#102A2B">八坂神社 をけら詣り Yasaka Shrine</text>
  <text x="60" y="638" font-size="15" fill="#5C6B6B">12/31 19:30 ～ 1/1 5:00；1/3 初能奉納 9:00、かるた始め式 13:00</text>
  <rect x="981" y="604" width="40" height="22" rx="11" fill="#B8442D"/>
  <polygon points="1250,603 1262,615 1250,627 1238,615" fill="#B8442D"/>
  <!-- 10 Disney -->
  <text x="60" y="668" font-size="18" font-weight="700" fill="#102A2B">東京迪士尼 Tokyo Disney Resort</text>
  <text x="60" y="688" font-size="15" fill="#5C6B6B">12/31 不辦跨年活動，兩園照常營業；USJ 以官網為準</text>
  <polygon points="950,653 962,665 950,677 938,665" fill="#5C6B6B"/>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <rect x="60" y="742" width="60" height="18" rx="9" fill="#0D6B68"/>
    <text x="132" y="757">實心＝官方已公告的日期</text>
    <rect x="380" y="742" width="60" height="18" rx="9" fill="url(#hatchCoral)" stroke="#B8442D" stroke-width="2"/>
    <text x="452" y="757">斜紋＝往年慣例，2027 年尚未公布，以官網為準</text>
    <polygon points="860,742 872,754 860,766 848,754" fill="#102A2B"/>
    <text x="884" y="757">菱形＝單日活動或公告</text>
    <text x="60" y="792" fill="#5C6B6B">青綠＝新幹線　藍＝官公廳與銀行　咖啡＝博物館　綠＝市場　紅＝百貨與神社　紫＝初詣　紅虛線＝元旦</text>
    <text x="60" y="822" fill="#5C6B6B">來源：JR 東海・JR 西日本、e-Gov 法令検索、東京国立博物館、大阪城天守閣、東京都中央卸売市場、八坂神社、東京ディズニーリゾート</text>
    <text x="1540" y="880" fill="#8A8F8F" font-size="15" text-anchor="end">© Mokaair 製圖 2026</text>
  </g>
</svg>
