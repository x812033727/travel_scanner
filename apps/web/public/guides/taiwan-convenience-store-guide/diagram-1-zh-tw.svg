<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣便利商店能幫你做的八件事</title>
  <desc id="desc">八格示意圖，2026 年 9 月依官方網站查證。一、高鐵與台鐵取票：高鐵每張手續費 NT$10、台鐵每張 NT$8，繳費單 10 分鐘內到櫃檯付現金。二、悠遊卡：四家超商都能買卡、現金儲值，卡內上限 NT$10,000，一般卡消費單筆 NT$1,500、單日 NT$3,000。三、ATM：每家 7-ELEVEN 都有英文介面 ATM，全家為台新、國泰世華、玉山銀行，國際提款另收手續費。四、列印掃描傳真：A4 黑白 NT$3、彩色 NT$10，ibon 4x6 相片 NT$6，全家國際傳真每頁 NT$85。五、熱食與咖啡：茶葉蛋、地瓜、關東煮，自備杯至少便宜 NT$5，全家友善食光 17:00 起 7 折。六、廁所與 Wi-Fi：部分 7-ELEVEN 有免費廁所，Fami-WiFi 每次 30 分鐘、免註冊、不限次數。七、垃圾：街上垃圾桶少，帶到店內分類，亂丟垃圾罰 NT$1,200 起。八、統一發票：單月 25 日開獎，NT$200 與 NT$1,000 可在超商領，帶護照與發票正本，現金 09:00 至 23:00。底部列出付款方式：現金、悠遊卡與一卡通、感應式信用卡（7-ELEVEN 收國外 Visa、Mastercard、JCB）、PayPay、GLN、支付寶與微信支付（7-ELEVEN 標示限中國大陸用戶）。</desc>
