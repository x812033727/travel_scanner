<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣便利商店能幫你做的八件事</title>
  <desc id="desc">八格示意圖，2026 年 9 月依官方網站查證。一、高鐵與台鐵取票：高鐵每張手續費 10 元、台鐵每張 8 元，繳費單 10 分鐘內到櫃檯付現金。二、悠遊卡：四家超商都能買卡、現金儲值，卡內上限 10,000 元，一般卡消費單筆 1,500 元、單日 3,000 元。三、ATM：每家 7-ELEVEN 都有銀行 ATM，全家為台新、國泰世華、玉山銀行。四、列印掃描傳真：A4 黑白 3 元、彩色 10 元，ibon 4x6 相片 6 元，全家傳真到國外每頁 85 元。五、熱食與咖啡：茶葉蛋、地瓜、關東煮，自備杯至少便宜 5 元，全家友善食光 17:00 起 7 折。六、廁所與 Wi-Fi：部分 7-ELEVEN 有免費廁所，Fami-WiFi 每次 30 分鐘、免註冊、不限次數。七、垃圾：街上垃圾桶少，帶到店內分類，亂丟垃圾罰 1,200 元起。八、統一發票：單月 25 日開獎，200 元與 1,000 元可在超商領，帶發票正本，現金兌領 09:00 到 23:00。底部列出付款方式：現金、悠遊卡與一卡通、感應式信用卡。</desc>
