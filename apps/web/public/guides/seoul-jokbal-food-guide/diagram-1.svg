<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">韓式豬腳菜單解碼</title>
<desc id="desc">圖上的標題是「站在豬腳店菜單前，先看懂這些字」，副標是「菜名對應的是什麼？實際供應仍要看各店菜單」。圖分左右兩個白色方框。左框的標題是「菜單上的豬腳」，三組：족발（韓式豬腳），下面寫「滷好去骨，切片整盤端上」；오향족발（五香豬腳），下面寫「用五種香味的醬料調味」；勁辣豬腳，下面寫「菜單上沒有韓文寫法，指著菜單問店員」。右框的標題是「一起點、一起端上桌」，四組：보쌈（菜包肉），下面寫「菜單上有菜包肉加豬腳的雙拼套餐」；쟁반국수（大盤麵），下面寫「和豬腳寫成套餐的麵」；녹두빈대떡（綠豆煎餅）與파전（蔥煎餅），下面寫「獎忠洞豬腳街上配著吃的煎餅」；순댓국（血腸湯），下面寫「孔德市場那條街上，和豬腳一起當下酒菜」。最下面兩行是「資料：韓國觀光公社・首爾觀光財團」與「© Mokaair 製圖 2026」。</desc>
<rect width="1600" height="900" fill="#fffaf2"/>
<text x="90" y="105" fill="#38251e" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="55" font-weight="700">站在豬腳店菜單前，先看懂這些字</text>
<text x="90" y="160" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="27">菜名對應的是什麼？實際供應仍要看各店菜單</text>
<rect x="75" y="205" width="680" height="585" rx="28" fill="#fff" stroke="#d7b3a1" stroke-width="3"/>
<rect x="845" y="205" width="680" height="585" rx="28" fill="#fff" stroke="#b9c8ae" stroke-width="3"/>
<text x="115" y="267" fill="#883e24" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="35" font-weight="700">菜單上的豬腳</text>
<text x="885" y="267" fill="#416444" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="35" font-weight="700">一起點、一起端上桌</text>
<g fill="#38251e" font-family="'Noto Sans TC','Noto Sans KR',sans-serif">
<text x="115" y="345" font-size="30" font-weight="700">족발｜韓式豬腳</text><text x="115" y="388" font-size="23">滷好去骨，切片整盤端上</text>
<text x="115" y="475" font-size="30" font-weight="700">오향족발｜五香豬腳</text><text x="115" y="518" font-size="23">用五種香味的醬料調味</text>
<text x="115" y="605" font-size="30" font-weight="700">勁辣豬腳</text><text x="115" y="648" font-size="23">菜單上沒有韓文寫法，指著菜單問店員</text>
<text x="885" y="345" font-size="28" font-weight="700">보쌈｜菜包肉</text><text x="885" y="382" font-size="21">菜單上有菜包肉加豬腳的雙拼套餐</text>
<text x="885" y="445" font-size="28" font-weight="700">쟁반국수｜大盤麵</text><text x="885" y="482" font-size="21">和豬腳寫成套餐的麵</text>
<text x="885" y="545" font-size="28" font-weight="700">녹두빈대떡｜綠豆煎餅　파전｜蔥煎餅</text><text x="885" y="582" font-size="21">獎忠洞豬腳街上配著吃的煎餅</text>
<text x="885" y="645" font-size="28" font-weight="700">순댓국｜血腸湯</text><text x="885" y="682" font-size="21">孔德市場那條街上，和豬腳一起當下酒菜</text>
</g>
<text x="90" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：韓國觀光公社・首爾觀光財團</text>
