<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">韓式豬腳菜單解碼</title>
<desc id="desc">左欄菜單上的豬腳：족발，韓式豬腳，滷好去骨、切片整盤端上；오향족발，五香豬腳，用五種香味的醬料調味；勁辣豬腳，官方頁只有中文名。右欄一起端上桌：보쌈，菜包肉，跟豬腳併成雙拼；쟁반국수，大盤麵，跟豬腳組成套餐；녹두빈대떡與파전，綠豆煎餅與蔥煎餅，在豬腳街一起吃；순댓국，血腸湯，孔德市場街區的搭配。示意圖，菜單依店而異。© Mokaair 製圖 2026。</desc>
<rect width="1600" height="900" fill="#fffaf2"/>
<text x="90" y="105" fill="#38251e" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="55" font-weight="700">站在豬腳店菜單前，先看懂這些字</text>
<text x="90" y="151" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="27">菜名對應的是什麼？實際供應仍要看各店菜單</text>
<rect x="75" y="205" width="680" height="585" rx="28" fill="#fff" stroke="#d7b3a1" stroke-width="3"/>
<rect x="845" y="205" width="680" height="585" rx="28" fill="#fff" stroke="#b9c8ae" stroke-width="3"/>
<text x="115" y="267" fill="#883e24" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="35" font-weight="700">菜單上的豬腳</text>
<text x="885" y="267" fill="#416444" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="35" font-weight="700">一起點、一起端上桌</text>
<g fill="#38251e" font-family="'Noto Sans TC','Noto Sans KR',sans-serif">
<text x="115" y="345" font-size="30" font-weight="700">족발｜韓式豬腳</text><text x="115" y="388" font-size="23">滷好去骨，切片整盤端上</text>
<text x="115" y="475" font-size="30" font-weight="700">오향족발｜五香豬腳</text><text x="115" y="518" font-size="23">用五種香味的醬料調味</text>
<text x="115" y="605" font-size="30" font-weight="700">勁辣豬腳</text><text x="115" y="648" font-size="23">官方頁只有中文名，不反譯韓文</text>
<text x="885" y="345" font-size="28" font-weight="700">보쌈｜菜包肉</text><text x="885" y="382" font-size="21">跟豬腳併成雙拼套餐</text>
<text x="885" y="445" font-size="28" font-weight="700">쟁반국수｜大盤麵</text><text x="885" y="482" font-size="21">跟豬腳組成套餐</text>
<text x="885" y="545" font-size="28" font-weight="700">녹두빈대떡 / 파전</text><text x="885" y="582" font-size="21">綠豆煎餅／蔥煎餅，豬腳街的搭配</text>
<text x="885" y="645" font-size="28" font-weight="700">순댓국｜血腸湯</text><text x="885" y="682" font-size="21">孔德市場街區的搭配</text>
</g>
<text x="90" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：韓國觀光公社 VISITKOREA、Visit Seoul 官方料理與店家頁</text>
