<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">商品原圖通過檢查關卡變成上架圖 / From a raw product shot to a listing image</title>
  <desc id="desc">插圖由左到右三個部分。左邊是一個灰底的方框，裡面有一個橘色瓶子形狀的商品剪影，旁邊散著兩塊灰色雜物，代表沒有整理過的商品原圖。中間是一個青綠色的圓形關卡，圓裡有一個大勾號，代表上架前的檢查。右邊是一張白底卡片，上半部是同一個橘色瓶子放在乾淨的白色方框裡，下半部有三條深色橫線代表商品資訊，卡片左上角有一個青綠色小標籤。兩個箭頭把左邊的方框、中間的圓形與右邊的卡片串起來。畫面下方有一行字：AI 商品圖的上架關卡。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <rect x="130" y="280" width="340" height="340" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <rect x="154" y="304" width="292" height="292" rx="10" fill="#E6E0D6"/>
  <circle cx="200" cy="350" r="34" fill="#D6CEBF"/>
  <rect x="370" y="510" width="60" height="80" rx="10" fill="#D6CEBF"/>
  <rect x="255" y="430" width="90" height="150" rx="14" fill="#D97A2B"/>
  <rect x="285" y="388" width="30" height="44" fill="#D97A2B"/>
  <rect x="278" y="370" width="44" height="22" rx="6" fill="#B8442D"/>

  <line x1="490" y1="450" x2="678" y2="450" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrow)"/>

  <circle cx="800" cy="450" r="110" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <path d="M 745 450 L 785 492 L 860 408" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="920" y1="450" x2="1118" y2="450" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="1130" y="260" width="340" height="380" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="1160" y="290" width="280" height="220" rx="10" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <rect x="1255" y="355" width="90" height="140" rx="14" fill="#D97A2B"/>
  <rect x="1285" y="317" width="30" height="38" fill="#D97A2B"/>
  <rect x="1278" y="299" width="44" height="22" rx="6" fill="#B8442D"/>
  <rect x="1160" y="536" width="280" height="14" rx="7" fill="#102A2B"/>
  <rect x="1160" y="566" width="200" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="1160" y="596" width="240" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="1152" y="236" width="86" height="34" rx="10" fill="#0D6B68"/>

  <text x="800" y="790" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">AI 商品圖的上架關卡</text>
</svg>
