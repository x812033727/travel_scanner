<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">商品圖從原圖到上架的流程與檢查點 / AI product photo workflow for sellers</title>
  <desc id="desc">流程圖分成三層。上層由左到右五個步驟：步驟一拍原圖，留一張未修過的原檔；步驟二去背換底，主圖統一白底或單色；步驟三生成情境，做情境圖與虛擬模特兒；步驟四三重比對，把成品、原檔與實際商品放在一起；步驟五輸出命名，依通路輸出並在檔名標出來源。中層是兩個檢查點，左邊檢查點一是商品外觀不能改，顏色、材質、尺寸與配件數量要和實品一致，放大與生成都會補出原圖沒有的紋理，任何一項對不上就退回上一步重做；右邊檢查點二是 AI 生成要標示，蝦皮條款要求應於適當處揭露並可合理辨識，第三方 AI 生成內容必須被標記，檔名帶 ai 且商品描述也寫清楚。下層是底線與規格三行：公平交易法第 21 條規定不得對足以影響交易決定之事項為虛偽不實或引人錯誤之表示；蝦皮在新增或編輯商品後自動審核，2 個工作天內不含假日完成；Shopify 生成圖預設 1 MP，Photoroom 匯出額度適用 2K 以內的素材。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="50" y="52" font-size="30" font-weight="bold" fill="#102A2B">商品圖從原圖到上架：五個步驟與兩個檢查點</text>
  <text x="50" y="84" font-size="18" fill="#5C6B6B">Raw shot to listing image: five steps and two checkpoints</text>

  <rect x="50" y="130" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="180" y="172" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟一</text>
  <text x="180" y="212" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">拍原圖</text>
  <text x="180" y="250" font-size="19" fill="#5C6B6B" text-anchor="middle">留一張未修過的原檔</text>

  <rect x="360" y="130" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="490" y="172" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟二</text>
  <text x="490" y="212" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">去背換底</text>
  <text x="490" y="250" font-size="19" fill="#5C6B6B" text-anchor="middle">主圖統一白底或單色</text>

  <rect x="670" y="130" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="172" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟三</text>
  <text x="800" y="212" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">生成情境</text>
  <text x="800" y="250" font-size="19" fill="#5C6B6B" text-anchor="middle">情境圖與虛擬模特兒</text>

  <rect x="980" y="130" width="260" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1110" y="172" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟四</text>
  <text x="1110" y="212" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">三重比對</text>
  <text x="1110" y="250" font-size="19" fill="#5C6B6B" text-anchor="middle">成品、原檔、實際商品</text>

  <rect x="1290" y="130" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1420" y="172" font-size="18" fill="#5C6B6B" text-anchor="middle">步驟五</text>
  <text x="1420" y="212" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">輸出命名</text>
  <text x="1420" y="250" font-size="19" fill="#5C6B6B" text-anchor="middle">依通路輸出並標來源</text>

  <line x1="316" y1="210" x2="352" y2="210" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="626" y1="210" x2="662" y2="210" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="936" y1="210" x2="972" y2="210" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1246" y1="210" x2="1282" y2="210" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="50" y="340" width="740" height="210" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="80" y="386" font-size="22" font-weight="bold" fill="#0D6B68">檢查點一（步驟四）　商品外觀不能改</text>
  <text x="80" y="432" font-size="19" fill="#102A2B">顏色、材質、尺寸與配件數量要和實品一致</text>
  <text x="80" y="470" font-size="19" fill="#102A2B">放大與生成都會補出原圖沒有的紋理</text>
  <text x="80" y="508" font-size="19" fill="#B8442D">任何一項對不上就退回上一步重做</text>

  <rect x="810" y="340" width="740" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="840" y="386" font-size="22" font-weight="bold" fill="#2F6F9F">檢查點二（步驟五）　AI 生成要標示</text>
  <text x="840" y="432" font-size="19" fill="#102A2B">蝦皮條款：應於適當處揭露並可合理辨識</text>
  <text x="840" y="470" font-size="19" fill="#102A2B">第三方 AI 生成內容必須被標記</text>
  <text x="840" y="508" font-size="19" fill="#102A2B">檔名帶 ai，商品描述也寫清楚</text>

  <line x1="1110" y1="296" x2="1110" y2="320" stroke="#5C6B6B" stroke-width="4"/>
  <line x1="1110" y1="318" x2="424" y2="318" stroke="#5C6B6B" stroke-width="4"/>
  <line x1="426" y1="318" x2="426" y2="334" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1420" y1="296" x2="1420" y2="334" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="50" y="580" width="1500" height="210" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="80" y="626" font-size="22" font-weight="bold" fill="#102A2B">底線與規格</text>
  <text x="80" y="672" font-size="19" fill="#102A2B">公平交易法第 21 條：不得對足以影響交易決定之事項為虛偽不實或引人錯誤之表示</text>
  <text x="80" y="710" font-size="19" fill="#102A2B">蝦皮：新增或編輯商品後自動審核，2 個工作天內（不含假日）完成</text>
  <text x="80" y="748" font-size="19" fill="#102A2B">Shopify 生成圖預設 1 MP；Photoroom 匯出額度適用 2K 以內的素材</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
