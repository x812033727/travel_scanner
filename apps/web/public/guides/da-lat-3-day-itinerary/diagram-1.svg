<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">大叻三天：三個方向，一天一個 / Da Lat in three days, one direction a day</title>
  <desc id="desc">示意圖。中央是大叻市區，塊內標春香湖、大叻市場與舊法國區，市區裡的瘋狂屋排在 Day 1，1 公尺 40 以上 80,000 越南盾、08:30 到 18:00。往北一支箭頭是 Day 3 的 LangBiang，成人 50,000 越南盾、07:30 到 17:00，Radar 峰 1,950 公尺要加買上山的車。往南一支箭頭是 Day 2：先是大叻纜車，全長 2,267 公尺、從 Robin 丘 1,517 公尺出發、最後收客 16:45，上站就是竹林禪院；再往南是 Datanla 瀑布，成人 80,000 越南盾、07:30 到 16:30。同一支南向箭頭再往下就是蓮姜機場 DLI，在市區以南約 30 公里，和 Day 2 同一個方向。往東一支細箭頭是 Trại Mát 觀光列車與終點站旁的靈福寺，不標票價與班次。方向非比例，除機場外不標距離。</desc>
  <defs>
    <marker id="arrowN" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2E7D5B"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2F6F9F"/>
    </marker>
    <marker id="arrowE" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#D97A2B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">大叻三天：三個方向，一天一個</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Da Lat in three days, one direction a day</text>
  <text x="1540" y="56" font-size="17" text-anchor="end" fill="#5C6B6B">門票與加購項目見內文表格</text>

  <rect x="300" y="118" width="440" height="114" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <rect x="646" y="130" width="76" height="28" rx="8" fill="#2E7D5B"/>
  <text x="684" y="150" font-size="16" text-anchor="middle" fill="#FFFFFF">Day 3</text>
  <text x="324" y="152" font-size="19" font-weight="bold" fill="#102A2B">LangBiang（市區以北）</text>
  <text x="324" y="182" font-size="16" fill="#102A2B">成人 50,000 越南盾・07:30–17:00</text>
  <text x="324" y="210" font-size="15" fill="#5C6B6B">Radar 峰 1,950 公尺（加買上山的車）</text>

  <line x1="520" y1="338" x2="520" y2="244" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrowN)"/>
  <text x="544" y="298" font-size="17" fill="#2E7D5B">往北</text>

  <rect x="250" y="340" width="540" height="182" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="274" y="376" font-size="20" font-weight="bold" fill="#102A2B">大叻市區 Đà Lạt</text>
  <text x="274" y="403" font-size="15" fill="#5C6B6B">春香湖 Xuân Hương・大叻市場 Chợ Đà Lạt・舊法國區</text>
  <rect x="274" y="418" width="492" height="86" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <rect x="678" y="428" width="76" height="28" rx="8" fill="#0D6B68"/>
  <text x="716" y="448" font-size="16" text-anchor="middle" fill="#FFFFFF">Day 1</text>
  <text x="296" y="450" font-size="17" font-weight="bold" fill="#102A2B">瘋狂屋 Crazy House</text>
  <text x="296" y="480" font-size="15" fill="#102A2B">1 公尺 40 以上 80,000 越南盾・08:30–18:00</text>

  <line x1="520" y1="524" x2="520" y2="580" stroke="#2F6F9F" stroke-width="5" marker-end="url(#arrowS)"/>
  <text x="544" y="562" font-size="17" fill="#2F6F9F">往南</text>

  <rect x="250" y="586" width="540" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="678" y="596" width="76" height="28" rx="8" fill="#2F6F9F"/>
  <text x="716" y="616" font-size="16" text-anchor="middle" fill="#FFFFFF">Day 2</text>
  <text x="274" y="620" font-size="18" font-weight="bold" fill="#102A2B">大叻纜車 Cáp Treo</text>
  <text x="274" y="648" font-size="16" fill="#102A2B">2,267 公尺・Robin 丘 1,517 公尺・最後收客 16:45</text>
  <text x="274" y="676" font-size="15" fill="#5C6B6B">上站：竹林禪院 Thiền Viện Trúc Lâm（泉林湖一帶）</text>

  <line x1="520" y1="698" x2="520" y2="722" stroke="#2F6F9F" stroke-width="5" marker-end="url(#arrowS)"/>

  <rect x="250" y="728" width="540" height="80" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="274" y="760" font-size="18" font-weight="bold" fill="#102A2B">Datanla 瀑布</text>
  <text x="274" y="788" font-size="16" fill="#102A2B">成人 80,000 越南盾・07:30–16:30</text>

  <line x1="520" y1="810" x2="520" y2="838" stroke="#2F6F9F" stroke-width="5" marker-end="url(#arrowS)"/>
  <text x="520" y="862" font-size="16" text-anchor="middle" fill="#102A2B">蓮姜機場 DLI：市區以南約 30 公里</text>
  <text x="520" y="886" font-size="15" text-anchor="middle" fill="#5C6B6B">和 Day 2 同一個方向</text>

  <line x1="794" y1="432" x2="900" y2="432" stroke="#D97A2B" stroke-width="4" marker-end="url(#arrowE)"/>
  <text x="846" y="418" font-size="15" text-anchor="middle" fill="#D97A2B">往東</text>
  <rect x="908" y="394" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="932" y="426" font-size="17" font-weight="bold" fill="#102A2B">Trại Mát 觀光列車</text>
  <text x="932" y="454" font-size="15" fill="#5C6B6B">終點站旁：靈福寺（不標票價與班次）</text>

  <rect x="900" y="130" width="660" height="222" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="930" y="168" font-size="18" font-weight="bold" fill="#102A2B">三天怎麼分</text>
  <text x="930" y="206" font-size="16" fill="#102A2B">Day 1　市區：春香湖、大叻市場、舊法國區＋瘋狂屋</text>
  <text x="930" y="242" font-size="16" fill="#102A2B">Day 2　往南：纜車上竹林禪院，下午 Datanla</text>
  <text x="930" y="278" font-size="16" fill="#102A2B">Day 3　往北：LangBiang，或往東的 Trại Mát</text>
  <text x="930" y="316" font-size="15" fill="#5C6B6B">最後一天要飛：把南邊那半天挪到 Day 3</text>

  <rect x="900" y="600" width="660" height="168" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="930" y="638" font-size="17" font-weight="bold" fill="#102A2B">圖例</text>
  <text x="930" y="674" font-size="15" fill="#5C6B6B">實線箭頭＝開車或纜車方向</text>
  <text x="930" y="704" font-size="15" fill="#5C6B6B">色塊＝大叻市區</text>
  <text x="930" y="736" font-size="15" fill="#5C6B6B">示意圖，方向非比例；除機場外不標距離</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
