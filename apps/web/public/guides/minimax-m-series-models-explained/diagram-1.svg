  <rect x="820" y="146" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="990" y="196" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">語音</text>
  <text x="990" y="234" font-size="17" fill="#102A2B" text-anchor="middle">speech-2.8</text>
  <text x="990" y="268" font-size="16" fill="#5C6B6B" text-anchor="middle">語音合成</text>

  <rect x="1200" y="146" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1370" y="196" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">音樂</text>
  <text x="1370" y="234" font-size="17" fill="#102A2B" text-anchor="middle">music-3.0</text>
  <text x="1370" y="268" font-size="16" fill="#5C6B6B" text-anchor="middle">音樂生成</text>

  <text x="60" y="352" font-size="20" font-weight="bold" fill="#102A2B">M 系列版本時序：模型庫建立年月與授權條款</text>

