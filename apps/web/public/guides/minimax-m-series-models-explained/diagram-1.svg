  <line x1="1340" y1="442" x2="1340" y2="470" stroke="#5C6B6B" stroke-width="3"/>
  <rect x="1235" y="470" width="210" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1340" y="520" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">M3</text>
  <text x="1340" y="558" font-size="17" fill="#5C6B6B" text-anchor="middle">2026-06</text>
  <text x="1340" y="594" font-size="16" fill="#D97A2B" text-anchor="middle">社群授權</text>

  <rect x="60" y="660" width="1480" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="706" font-size="18" fill="#102A2B">上下文視窗：M2 到 M2.7 為 204,800 token，M3 為 1,000,000 token</text>
  <text x="90" y="750" font-size="18" fill="#102A2B">API 價格（每百萬 token）：M3 與 M2.7 都是輸入 0.3 美元、輸出 1.2 美元</text>
