<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">M 系列在 MiniMax 產品線裡的位置與版本時序 / MiniMax M series: product line and versions</title>
  <desc id="desc">上半部把 MiniMax 的模型分成四條線：文字是 M 系列，代表版本 M3 與 M2.7，權重可下載；影片是 MiniMax H3 與海螺 Hailuo 2.3、02；語音是 speech-2.8-hd 與 turbo；音樂是 music-3.0。下半部是 M 系列的版本時序，依官方 Hugging Face 組織上模型庫的建立年月排列：M1-80k 在 2025-06、授權 Apache 2.0；M2 在 2025-10、改過的 MIT；M2.1 在 2025-12、改過的 MIT；M2.5 在 2026-02、標示 modified-mit；M2.7 在 2026-04、非商業授權；M3 在 2026-06、MiniMax 社群授權。最下方的說明條寫：上下文視窗 M2 到 M2.7 為 204,800 token，M3 為 1,000,000 token；API 價格每百萬 token，M3 與 M2.7 都是輸入 0.3 美元、輸出 1.2 美元；本機執行方面，M2.7 部署指南寫權重需 220 GB 記憶體，單一序列最長 196K token。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

