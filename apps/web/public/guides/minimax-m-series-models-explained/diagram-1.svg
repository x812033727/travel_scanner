  <line x1="870" y1="442" x2="870" y2="470" stroke="#5C6B6B" stroke-width="3"/>
  <rect x="765" y="470" width="210" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="870" y="520" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">M2.5</text>
  <text x="870" y="558" font-size="17" fill="#5C6B6B" text-anchor="middle">2026-02</text>
