<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">開放權重與 API 兩條路 / Open weights and API, two ways to use a model</title>
  <desc id="desc">插圖：畫面左邊是一個方形的模型方塊，裡面疊著幾條代表權重檔的橫條。方塊右側分出兩條粗線：上面那條往右上通到一朵雲，代表透過官方 API 呼叫；下面那條往右下通到一台螢幕與底座組成的主機，代表把權重下載到自己的機器上執行。畫面左下方寫著「開放權重與 API」一行字。整張圖用米色底、墨綠與藍色的幾何形狀，沒有任何品牌標誌或介面截圖。</desc>
