<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">歐盟與台灣的 AI 規範 / AI rules in the EU and Taiwan</title>
  <desc id="desc">一張抽象插圖。左半邊是一座由四條彩色圓角橫條堆成的階梯，最上面一條最短、顏色最深紅，往下依序是橘、青綠與綠色，愈往下愈寬，代表由嚴到寬的分層。中間一條灰色虛線把畫面分成兩半。右半邊是一個藍色圓環，圓心是一顆實心圓點，四條線從圓心向上下左右伸出，各連到一個白底圓角方塊，像一個中心框架把規則分送到四個單位。畫面下方有一條橫線串起五顆大小相同的圓點，代表分批上路的時間軸。畫面上方寫著「歐盟與台灣的 AI 規範」。</desc>
