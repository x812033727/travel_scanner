<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">歐盟四層風險分級與台灣現況對照 / EU AI Act risk tiers versus Taiwan's AI Basic Act</title>
<desc id="desc">左欄是歐盟 AI 法案 Regulation (EU) 2024/1689 的四層風險：最上層是第 5 條的禁止實務，九項禁止實務前八項 2025 年 2 月 2 日起適用、第九項 2026 年 12 月 2 日起適用；第二層是第 6 條的高風險，附件三所列用途 2027 年 12 月 2 日起適用、附件一所列產品 2028 年 8 月 2 日起適用；第三層是第 50 條的透明度風險，2026 年 8 月 2 日起適用，要求告知使用者在跟 AI 對話、加上機器可讀標記、揭露深偽；最下層是最小或無風險，法案未新增規則。右欄是台灣人工智慧基本法全文 20 條裡對應的條文：第 4 條七項原則主詞是政府，第 5 款寫產出應做適當資訊揭露或標記；第 5 條的標示要求限於經中央目的事業主管機關會商數位發展部認定為高風險的應用；第 16 條由數位發展部推動與國際介接的風險分類框架，再由各目的事業主管機關訂管理規範；第 17 條寫政府應明確高風險應用的責任歸屬並建立救濟、補償或保險機制。最下方一列寫使用者的管道：歐盟第 85 條向市場監督機關申訴、第 86 條要求說明，在台灣則回到個人資料保護法第 3 條等既有法律。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">歐盟四層風險分級與台灣現況對照</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">EU AI Act risk tiers versus Taiwan's AI Basic Act</text>
<rect x="60" y="106" width="720" height="50" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="139" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">歐盟 AI 法案　Regulation (EU) 2024/1689</text>
<rect x="820" y="106" width="720" height="50" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1180" y="139" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">台灣　人工智慧基本法（全文 20 條）</text>
<rect x="60" y="178" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<rect x="60" y="178" width="14" height="136" rx="7" fill="#B8442D"/>
<text x="98" y="218" font-size="20" font-weight="700" fill="#102A2B">最上層　不可接受風險：禁止（第 5 條）</text>
<text x="98" y="252" font-size="17" fill="#102A2B">九項禁止實務，例如社會評分、無差別建人臉辨識資料庫</text>
<text x="98" y="284" font-size="17" fill="#B8442D">前八項 2025 年 2 月 2 日起，第九項 2026 年 12 月 2 日起</text>
<rect x="820" y="178" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="852" y="218" font-size="20" font-weight="700" fill="#102A2B">第 4 條：七項原則</text>
<text x="852" y="252" font-size="17" fill="#102A2B">主詞是「政府推動人工智慧之研發與應用」</text>
<text x="852" y="284" font-size="17" fill="#5C6B6B">第 5 款：產出應做適當資訊揭露或標記</text>
<line x1="784" y1="246" x2="816" y2="246" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="60" y="328" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<rect x="60" y="328" width="14" height="136" rx="7" fill="#D97A2B"/>
<text x="98" y="368" font-size="20" font-weight="700" fill="#102A2B">第二層　高風險（第 6 條）</text>
<text x="98" y="402" font-size="17" fill="#102A2B">受管制產品的安全元件，或附件三列舉的用途</text>
<text x="98" y="434" font-size="17" fill="#D97A2B">附件三 2027 年 12 月 2 日起，附件一 2028 年 8 月 2 日起</text>
<rect x="820" y="328" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="852" y="368" font-size="20" font-weight="700" fill="#102A2B">第 5 條：高風險應用的標示</text>
<text x="852" y="402" font-size="17" fill="#102A2B">經中央目的事業主管機關會商數位發展部認定者</text>
<text x="852" y="434" font-size="17" fill="#5C6B6B">應明確標示注意事項或警語</text>
<line x1="784" y1="396" x2="816" y2="396" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="60" y="478" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<rect x="60" y="478" width="14" height="136" rx="7" fill="#0D6B68"/>
<text x="98" y="518" font-size="20" font-weight="700" fill="#102A2B">第三層　透明度風險（第 50 條）</text>
<text x="98" y="552" font-size="17" fill="#102A2B">告知你在跟 AI 對話、機器可讀標記、深偽揭露</text>
<text x="98" y="584" font-size="17" fill="#0D6B68">2026 年 8 月 2 日起適用</text>
<rect x="820" y="478" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="852" y="518" font-size="20" font-weight="700" fill="#102A2B">第 16 條：風險分類框架</text>
<text x="852" y="552" font-size="17" fill="#102A2B">數位發展部推動與國際介接的框架</text>
<text x="852" y="584" font-size="17" fill="#5C6B6B">由各目的事業主管機關訂管理規範</text>
<line x1="784" y1="546" x2="816" y2="546" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="60" y="628" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<rect x="60" y="628" width="14" height="136" rx="7" fill="#2E7D5B"/>
<text x="98" y="668" font-size="20" font-weight="700" fill="#102A2B">最下層　最小或無風險</text>
<text x="98" y="702" font-size="17" fill="#102A2B">AI 電玩、垃圾信過濾這類，法案未新增規則</text>
<text x="98" y="734" font-size="17" fill="#2E7D5B">沒有新增的義務</text>
<rect x="820" y="628" width="720" height="136" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="852" y="668" font-size="20" font-weight="700" fill="#102A2B">第 17 條：責任與救濟</text>
<text x="852" y="702" font-size="17" fill="#102A2B">政府應明確高風險應用的責任歸屬</text>
<text x="852" y="734" font-size="17" fill="#5C6B6B">並建立救濟、補償或保險機制</text>
<line x1="784" y1="696" x2="816" y2="696" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="60" y="782" width="1480" height="58" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="800" y="818" font-size="18" fill="#102A2B" text-anchor="middle">使用者的管道：歐盟第 85 條向市場監督機關申訴、第 86 條要求說明；在台灣回到個人資料保護法第 3 條等既有法律</text>
