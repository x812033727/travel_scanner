<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">旅程路徑上只有中間一段被盾牌罩住 / A trip path where only the middle leg sits under a shield</title>
<desc id="desc">一張沒有文字的插圖。畫面中央是一面很大的盾牌，淺綠色底、深綠色粗外框，上緣平直、下緣收成一個尖端。盾牌中段橫過一條左右貫穿畫面的路徑，代表一趟旅程；路徑上等距排著四個圓形節點。路徑落在盾牌裡的那一段是一條深綠色的實線，沒有碰到盾牌的左右邊；露在盾牌外面的兩端是灰色虛線。中間兩個節點落在盾牌內，畫成深綠色實線外框的白色圓；左右兩端的節點落在盾牌外，畫成灰色虛線外框的白色圓，表示附贈保障只覆蓋旅程中的一段，兩頭留在保障之外。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<line x1="120" y1="420" x2="1480" y2="420" stroke="#5C6B6B" stroke-width="8" stroke-linecap="butt" stroke-dasharray="26 20"/>
<path d="M 494 150 A 14 14 0 0 0 480 164 L 480 470 Q 480 660 800 760 Q 1120 660 1120 470 L 1120 164 A 14 14 0 0 0 1106 150 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"/>
<line x1="540" y1="420" x2="1060" y2="420" stroke="#0D6B68" stroke-width="12" stroke-linecap="butt"/>
<circle cx="200" cy="420" r="40" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="14 12"/>
<circle cx="1400" cy="420" r="40" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="14 12"/>
<circle cx="600" cy="420" r="40" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
<circle cx="1000" cy="420" r="40" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
</svg>
