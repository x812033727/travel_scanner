<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">刷卡附贈保障：保障期間覆蓋到旅程的哪一段 / Card-linked travel cover: which leg of the trip the coverage period spans</title>
<desc id="desc">圖的最上方是一個生效條件框，寫著保障要啟動的前提：以承保信用卡支付公共運輸工具全部票款，或一定比例以上的團費，條件不成立就不啟動。中間一排四個框，是一趟旅程的四個階段，由左到右依序為：出發前，做的是訂票與刷卡付款；搭乘公共運輸工具，場景是機場、車站與船班；當地自行活動，包含租車自駕、登山與水上活動；回程公共運輸工具，終點是返抵原出發地。四個階段下方有一條指向右方的時間箭頭。下方是兩條保障期間的帶子，分別對應條款常見的兩種寫法。較窄的一種以搭乘或上下公共運輸工具期間為界，深色區段只落在第二段與第四段，第一段的出發前與第三段的當地自行活動都標示為通常在保障期間外。較寬的一種以境外期間為界，深色區段從第一段中途一路延伸到最後，起點是預定起程時間前一段時間，終點是返抵原出發地後一段時間，並另訂最長天數上限，只有出發前較早的那一小段落在外面。圖的最下方提醒：哪一段算數，看那一張的條款怎麼定義保障期間與承保範圍；評議書引述的保險證寫著，承保範圍依信用卡各卡別實際之約定為準。</desc>
