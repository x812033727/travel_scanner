<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">看到 AI 選股或交易機器人的宣傳，依序問四件事 / Four questions before trusting an AI trading claim</title>
  <desc id="desc">由上往下的判斷流程，每一題答「是」往右，答「否」往下。第一題：有沒有保證獲利、要你匯款到指定帳戶或交出帳號密碼，出金前要你先補繳保證金也算；是的話屬於詐騙徵兆，先停下來不要付款，撥 165 或（02）2737-3434。第二題：是不是只分享經驗、教理論，不報個股買賣點；是的話屬於一般性投資資訊，不屬投顧業務；收費報個股買賣點或賣報價位軟體的往下走。第三題：在投信投顧公會名錄與證期局名冊是否都查不到這家公司；查不到的可能涉及非法經營投顧業務，不付款，可向證期局檢舉。第四題：績效是否只有回測或模擬、沒扣成本，只挑好年份好參數也算；是的話只是假設性績效，要追問期間、成本與下市公司。四題都是否，再看契約：書面契約，七日內可以書面終止，投顧不得收受你的資金或代你下單。右下角是查詢與檢舉電話：查人員資格撥投信投顧公會（02）2581-7288 分機 110，檢舉非法業者撥證期局（02）8773-4136。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#102A2B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">看到 AI 選股或交易機器人的宣傳，依序問四件事</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Four questions before trusting an AI stock-picking or trading-bot claim</text>
  <text x="1540" y="84" font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">答「是」往右，答「否」往下</text>

  <!-- Q1 -->
  <rect x="60" y="116" width="760" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="440" y="158" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">保證獲利、要你匯款到指定帳戶或交出帳號密碼？</text>
  <text x="440" y="192" font-size="16" fill="#5C6B6B" text-anchor="middle">出金前要你先補繳保證金，也算在內</text>
  <line x1="824" y1="166" x2="972" y2="166" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="898" y="152" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">是</text>
  <rect x="980" y="116" width="560" height="100" rx="14" fill="#F9E6E1" stroke="#B8442D" stroke-width="4"/>
  <text x="1260" y="158" font-size="22" font-weight="700" fill="#B8442D" text-anchor="middle">詐騙徵兆：先停下來，不要付款</text>
  <text x="1260" y="192" font-size="18" fill="#102A2B" text-anchor="middle">撥 165 或（02）2737-3434</text>
  <line x1="440" y1="218" x2="440" y2="258" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="460" y="245" font-size="18" font-weight="700" fill="#102A2B">否</text>

  <!-- Q2 -->
  <rect x="60" y="262" width="760" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="440" y="304" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">只分享經驗、教理論，不報個股買賣點？</text>
  <text x="440" y="338" font-size="16" fill="#5C6B6B" text-anchor="middle">收費報個股買賣點、賣報價位的選股軟體，選「否」</text>
  <line x1="824" y1="312" x2="972" y2="312" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="898" y="298" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">是</text>
  <rect x="980" y="262" width="560" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1260" y="304" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">一般性投資資訊</text>
  <text x="1260" y="338" font-size="17" fill="#5C6B6B" text-anchor="middle">不屬投顧業務，仍依個案判斷</text>
  <line x1="440" y1="364" x2="440" y2="404" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="460" y="391" font-size="18" font-weight="700" fill="#102A2B">否</text>

  <!-- Q3 -->
  <rect x="60" y="408" width="760" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="440" y="450" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">投信投顧公會名錄、證期局名冊都查不到？</text>
  <text x="440" y="484" font-size="16" fill="#5C6B6B" text-anchor="middle">用公司登記名稱查，打名錄上的電話確認</text>
  <line x1="824" y1="458" x2="972" y2="458" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="898" y="444" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">是</text>
  <rect x="980" y="408" width="560" height="100" rx="14" fill="#FBEEDF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1260" y="450" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">可能涉及非法經營投顧業務</text>
  <text x="1260" y="484" font-size="17" fill="#5C6B6B" text-anchor="middle">不付款，可向證期局檢舉</text>
  <line x1="440" y1="510" x2="440" y2="550" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="460" y="537" font-size="18" font-weight="700" fill="#102A2B">否</text>

  <!-- Q4 -->
  <rect x="60" y="554" width="760" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="440" y="596" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">績效只有回測或模擬，沒扣成本？</text>
  <text x="440" y="630" font-size="16" fill="#5C6B6B" text-anchor="middle">只挑好年份、好參數的紀錄，也算「是」</text>
  <line x1="824" y1="604" x2="972" y2="604" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="898" y="590" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">是</text>
  <rect x="980" y="554" width="560" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1260" y="596" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">只是假設性績效</text>
  <text x="1260" y="630" font-size="17" fill="#5C6B6B" text-anchor="middle">追問期間、成本與下市公司</text>
  <line x1="440" y1="656" x2="440" y2="696" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="460" y="683" font-size="18" font-weight="700" fill="#102A2B">否</text>

  <!-- final -->
  <rect x="60" y="700" width="760" height="100" rx="14" fill="#E8F3EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="440" y="742" font-size="22" font-weight="700" fill="#2E7D5B" text-anchor="middle">再看契約：書面契約，七日內可書面終止</text>
  <text x="440" y="776" font-size="16" fill="#5C6B6B" text-anchor="middle">投顧不得收受你的資金，也不得代你下單</text>

  <!-- contacts -->
  <rect x="980" y="700" width="560" height="100" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1260" y="740" font-size="19" fill="#102A2B" text-anchor="middle">查人員資格：投信投顧公會（02）2581-7288 分機 110</text>
  <text x="1260" y="776" font-size="19" fill="#102A2B" text-anchor="middle">檢舉非法業者：證期局（02）8773-4136</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
