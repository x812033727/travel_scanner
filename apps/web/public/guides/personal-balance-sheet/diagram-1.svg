<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">個人資產負債表的結構 / A personal balance sheet</title>
<desc id="desc">左欄是資產，列出現金與存款、勞退個人專戶累積金額、壽險保單的解約金、投資部位、自住房與車子等大件；右欄是負債，列出信用卡未繳與循環信用、分期付款的剩餘期數、就學貸款、車貸與信用貸款、房貸與親友借款。兩欄各有一個箭頭指向下方的算式：資產總額減負債總額等於淨值。圖下兩行說明記帳看的是流量，這張表看的是存量，並提醒每季更新一次。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">資產負債表：左邊資產、右邊負債，相減是淨值</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Personal balance sheet · 記帳看的是流量，這張表看的是存量</text>

<rect x="60" y="120" width="700" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">資產：現在能變成錢的</text>

<rect x="840" y="120" width="700" height="76" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1190" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">負債：還沒還完的錢</text>

<rect x="60" y="212" width="700" height="340" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="104" y="264" font-size="22" fill="#102A2B">現金、活期與定期存款</text>
<text x="104" y="316" font-size="22" fill="#102A2B">勞退個人專戶累積金額</text>
<text x="104" y="368" font-size="22" fill="#102A2B">壽險保單的解約金</text>
<text x="104" y="420" font-size="22" fill="#102A2B">投資部位（現在的市值）</text>
<text x="104" y="472" font-size="22" fill="#102A2B">自住房（可實現金額）</text>
<text x="104" y="524" font-size="22" fill="#102A2B">車子與其他大件</text>

<rect x="840" y="212" width="700" height="340" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="884" y="264" font-size="22" fill="#102A2B">信用卡未繳與循環信用</text>
<text x="884" y="316" font-size="22" fill="#102A2B">分期付款的剩餘期數</text>
<text x="884" y="368" font-size="22" fill="#102A2B">就學貸款餘額</text>
<text x="884" y="420" font-size="22" fill="#102A2B">車貸與信用貸款餘額</text>
<text x="884" y="472" font-size="22" fill="#102A2B">房貸餘額</text>
<text x="884" y="524" font-size="22" fill="#102A2B">親友借款、標會</text>

<path d="M410 562 L540 600" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1190 562 L1060 600" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="420" y="610" width="760" height="100" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="674" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">資產總額 − 負債總額 ＝ 淨值</text>

<text x="60" y="772" font-size="20" fill="#5C6B6B">記帳看的是流量：一個月進出多少。這張表看的是存量：此刻總共有多少。</text>
<text x="60" y="808" font-size="20" fill="#5C6B6B">每季更新一次，每次用同樣的算法；月月有結餘而淨值不動，通常是負債在吃掉它。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
