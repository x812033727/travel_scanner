<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">美山聖地半日遊：怎麼去、園區怎麼走 / My Son Sanctuary: access and on-site route</title>
  <desc id="desc">左半邊是怎麼到美山的示意圖。左邊是美山 Mỹ Sơn，右上是峴港市中心 Đà Nẵng，右下是會安古城 Hội An，兩條虛線公路指向美山。峴港那條標管理處 68 公里、觀光推廣中心 45 到 50 公里、車程 1 小時 15 分到 1 小時 30 分；會安那條標管理處 45 公里、觀光推廣中心 35 公里、車程 45 分到 1 小時、最近的出發點。美山那一格裡寫 06:00 開園、建議 06:30 到 09:00 進場、至少留 3 到 4 小時、在峴港市區西南方。三格下面兩行小字寫兩個官方單位的距離不同、排時間看車程，以及峴港端的機場交通看峴港會安篇；再下面的票價框寫外國旅客 150,000、5 到 15 歲 30,000、未滿 5 歲免費。右半邊是園區動線，由上到下三格：先是售票口與美山博物館，標門票已含、博物館在 Khe Thẻ 溪邊、離遺址約 2 公里；再搭電瓶車走 2 公里，標費用已包含在門票裡；最後是塔群與四個表演場地：表演廳 09:45、10:30、11:15、14:00、16:00，G 群塔 khu tháp G 09:00 與 14:45、戶外，BCD 群塔 khu tháp BCD 陽曆 15 日、09:00 與 14:45，H 群塔坡道 dốc Tháp H 週一三五、09:00 與 14:45。那一格下方一條細虛線標荷花池岔路到占族歌舞表演區可租腳踏車，一輛 30,000 越南盾，並註明各群塔之間是露天步道、雨季濕滑。圖末一行小字寫四個節目在四個場地，時刻相同不代表是同一場。</desc>
