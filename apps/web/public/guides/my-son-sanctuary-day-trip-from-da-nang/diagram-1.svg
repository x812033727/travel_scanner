  <text x="205" y="242" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">美山 Mỹ Sơn</text>
  <text x="205" y="288" text-anchor="middle" font-size="17" fill="#102A2B">06:00 開園</text>
  <text x="205" y="326" text-anchor="middle" font-size="16" fill="#102A2B">建議 06:30 到 09:00 進場</text>
  <text x="205" y="362" text-anchor="middle" font-size="16" fill="#102A2B">至少留 3 到 4 小時</text>
  <text x="205" y="406" text-anchor="middle" font-size="15" fill="#5C6B6B">在峴港市區西南方</text>

