  <text x="858" y="524" font-size="16" font-weight="bold" fill="#0D6B68">表演廳</text>
  <text x="1070" y="524" font-size="16" fill="#102A2B">09:45・10:30・11:15・14:00・16:00</text>

  <text x="858" y="562" font-size="16" font-weight="bold" fill="#0D6B68">G 群塔 khu tháp G</text>
