<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title id="title">取引の分類からサービスの流れへ</title><desc id="desc">四つのカードで取引相手、販売経路、購買上の役割、サイトの仕事を示し、D2CがB2Cに含まれることを明記。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">取引の分類からサービスの流れへ</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">誰が買うかを見てから、経路と各段階の仕事を確認</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">取引相手</text>
<text x="108.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">企業か消費者か</text>
<text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">購入目的を確認</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">販売経路</text>
<text x="477.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">ブランドが直販</text>
<text x="477.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">D2CはB2Cに含む</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">購買上の役割</text>
<text x="846.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">利用・購買・承認</text>
<text x="846.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">一人が兼任も</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="32" fill="#102A2B" text-anchor="start" font-weight="bold">サイトの仕事</text>
<text x="1215.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">仕様・見積・注文</text>
<text x="1215.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">納品・支援の分担</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">一つのブランドに複数の取引。実際の需要から情報と手順を決める。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaairオリジナル図解</text>
</svg>
