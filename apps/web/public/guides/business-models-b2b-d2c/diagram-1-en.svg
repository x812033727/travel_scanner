<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">From Transactions to Service Steps</title><desc id="desc">Four cards show buyer type, channel relationship, buying roles and website tasks; D2C falls within B2C.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="46" fill="#102A2B" text-anchor="start" font-weight="bold">From Transactions to Service Steps</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Ask who buys, then trace channels and work at each step</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Buyer type</text>
<text x="108.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Firms or shoppers</text>
<text x="108.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Check purpose</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Sales channel</text>
<text x="477.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Brand sells direct</text>
<text x="477.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">D2C is within B2C</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Buying roles</text>
<text x="846.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Use, buy, approve</text>
<text x="846.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Roles may overlap</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Website tasks</text>
<text x="1215.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Specs, quote, order</text>
<text x="1215.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal">Delivery &amp; after-sales</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">One brand can have several transaction types; let real needs shape the process.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair graphic</text>
</svg>
