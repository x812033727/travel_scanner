<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">네 단계 흐름: 방해 원인 확인, 예외 유지, 짧게 테스트, 확인 시간 정하기</title>
<desc id="desc">방해 원인 확인, 예외 유지, 짧게 테스트, 확인 시간 정하기 순으로 점검합니다. 편집상 정리한 내용이며 지도나 측정 시간 자료가 아닙니다.</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">실행 순서</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">상황에 맞게 선택하며 한 번에 모두 끝낼 필요는 없습니다</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">방해 원인 확인</text>
<text x="245" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">집중을 끊는 원인 파악</text>
<text x="245" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">사람 연락과 추천 구분</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">예외 유지</text>
<text x="615" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">필수 연락 경로 유지</text>
<text x="615" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">책임을 우선하기</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">짧은 시간 테스트</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">규칙을 잠시 시험</text>
<text x="985" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">긴급하지 않은 메시지</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">확인 시간 정하기</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">확인할 때를 정하기</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">생활에 맞게 조정</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair · 편집부 제작 도식</text>
</g>
</svg>
