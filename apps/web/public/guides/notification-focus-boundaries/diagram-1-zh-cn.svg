<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">四步流程：查看打断来源、保留例外、短时段测试、约定查看时间</title>
<desc id="desc">依次检查：查看打断来源、保留例外、短时段测试、约定查看时间。编辑整理，非地图或实测时间。</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">实用顺序</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">按自身条件取舍，不必一次全部完成</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">查看打断来源</text>
<text x="245" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">找出打断专注的来源</text>
<text x="245" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">分开真人联系和推荐</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">保留例外</text>
<text x="615" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">保留必要联系渠道</text>
<text x="615" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">责任优先</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">短时段测试</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">短时间试用规则</text>
<text x="985" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">使用非紧急消息</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">约定查看时间</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">决定何时查看</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">按生活情况调整</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair · 编辑自制示意图</text>
</g>
</svg>
