<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Four-step process: identify interruption sources, keep exceptions, test briefly, and schedule reviews</title>
<desc id="desc">Check in order: identify interruption sources, keep exceptions, test briefly, and schedule reviews. Editorial summary, not a map or measured duration.</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">Practical sequence</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">Adapt to your needs; you do not have to finish every step at once</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="23" text-anchor="middle" font-weight="700">Identify interruptions</text>
<text x="245" y="497" fill="#f4f0e5" font-size="19" text-anchor="middle">See what breaks your focus</text>
<text x="245" y="573" fill="#f4dc9d" font-size="15" text-anchor="middle">Separate contacts from recommendations</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">Keep exceptions</text>
<text x="615" y="497" fill="#f4f0e5" font-size="20" text-anchor="middle">Preserve essential access</text>
<text x="615" y="573" fill="#f4dc9d" font-size="19" text-anchor="middle">Put responsibilities first</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="26" text-anchor="middle" font-weight="700">Test a short period</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">Try the rule briefly</text>
<text x="985" y="573" fill="#f4dc9d" font-size="21" text-anchor="middle">Use a non-urgent message</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">Schedule reviews</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">Choose when to check</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">Adapt it to your life</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair · Original editorial diagram</text>
</g>
</svg>
