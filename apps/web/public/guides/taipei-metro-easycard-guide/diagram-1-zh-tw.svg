<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北捷運與悠遊卡攻略 2026：票價、旅遊票、信用卡、公車與 YouBike</title>
  <desc id="desc">台北捷運付款方式決策圖。會搭公車可買悠遊卡，常見卡片售價 NT$100 起，公車每段 NT$15，上下車都要刷卡，成人票證在一小時內轉乘捷運與公車可折 NT$8；密集搭乘可比較北北基好玩卡。北北基好玩卡交通暢遊券為 1 日 NT$210、2 日 NT$340、3 日 NT$470、5 日 NT$730。只搭捷運時，若單日車資超過 NT$150，可選一日票 NT$150，或 24 小時 NT$180、48 小時 NT$280、72 小時 NT$380；其他情況可刷感應式信用卡或買 NT$20–65 的單程票。從台北車站出發，西門 NT$20、台北 101／世貿 NT$25、松山機場 NT$25、北投 NT$30、動物園 NT$35、淡水 NT$50。台北捷運大致於 06:00–24:00 營運；未滿 6 歲或身高未滿 115 公分兒童由已購票旅客陪同可免費搭乘。捷運禁飲食區與車廂內不得飲食或嚼口香糖，違規可處 NT$1,500–7,500 罰鍰；同站進出限 15 分鐘，不同站限 2 小時，逾時加收最低單程票價。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="40" y="54" font-size="32" font-weight="700" fill="#102A2B">台北捷運與悠遊卡：三個問題選付款方式</text>
  <text x="40" y="88" font-size="19" fill="#5C6B6B">悠遊卡・感應式信用卡・捷運旅遊票・北北基好玩卡｜成人票價查證於 2026 年 9 月</text>

  <!-- Q1 -->
  <polygon points="340,117 640,175 340,233 40,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="340" y="168" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　會搭市區公車嗎？</text>
  <text x="340" y="195" font-size="17" fill="#102A2B" text-anchor="middle">成人電子票證可享捷運公車轉乘優惠</text>
  <path d="M 640 175 L 706 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="673" y="155" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="712" y="105" width="858" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="734" y="134" font-size="19" font-weight="700" fill="#0B4F4D">悠遊卡：常見卡片售價 NT$100 起，卡片不是押金，使用前須加值</text>
  <text x="734" y="160" font-size="16" fill="#0B4F4D">市區公車每段 NT$15；上車、下車都要刷卡</text>
  <text x="734" y="185" font-size="16" fill="#0B4F4D">成人票證在 1 小時內轉乘捷運與公車，第二段折 NT$8</text>
  <text x="734" y="212" font-size="16" font-weight="700" fill="#9A5418">整天搭公車加捷運？可比較北北基好玩卡交通暢遊券</text>
  <text x="734" y="236" font-size="16" fill="#9A5418">1 日 NT$210・2 日 NT$340・3 日 NT$470・5 日 NT$730（含北北基市區公車及指定台灣好行）</text>
  <path d="M 340 233 L 340 266" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="366" y="256" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="340,272 640,330 340,388 40,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="340" y="323" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　一天捷運車資會超過 NT$150？</text>
  <text x="340" y="350" font-size="17" fill="#102A2B" text-anchor="middle">可把預估單程票價加總後再比較</text>
  <path d="M 640 330 L 706 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="673" y="310" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="712" y="262" width="858" height="136" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="734" y="292" font-size="19" font-weight="700" fill="#8A2E1D">捷運一日票 NT$150：首次感應後到當日營運結束</text>
  <text x="734" y="320" font-size="16" fill="#8A2E1D">24 小時 NT$180・48 小時 NT$280・72 小時 NT$380（從首次感應起算）</text>
  <text x="734" y="346" font-size="16" fill="#8A2E1D">可在各站詢問處購買</text>
  <text x="734" y="372" font-size="16" fill="#8A2E1D">限一人使用，可搭台北捷運與新北捷運環狀線</text>
  <path d="M 340 388 L 340 421" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="366" y="411" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q3 -->
  <polygon points="340,427 640,485 340,543 40,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="340" y="478" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　有感應式信用卡／簽帳金融卡嗎？</text>
  <text x="340" y="505" font-size="17" fill="#102A2B" text-anchor="middle">也可使用支援的手機行動支付</text>
  <path d="M 640 485 L 706 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="673" y="465" font-size="15" fill="#5C6B6B" text-anchor="middle">是</text>
  <rect x="712" y="418" width="858" height="134" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="734" y="447" font-size="19" font-weight="700" fill="#1F4E73">刷同一張信用卡／簽帳金融卡進、出站</text>
  <text x="734" y="475" font-size="16" fill="#1F4E73">收取成人單程票價 NT$20–65</text>
  <text x="734" y="501" font-size="16" fill="#1F4E73">沒有轉乘優惠；市區公車不能直接刷一般信用卡／簽帳金融卡</text>
  <text x="734" y="527" font-size="16" fill="#1F4E73">Visa・Mastercard・JCB・銀聯・Diners Club・Discover・Apple Pay・Google Pay・Samsung Pay</text>
  <path d="M 340 543 L 340 584" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="366" y="570" font-size="16" fill="#5C6B6B">否</text>
  <rect x="40" y="590" width="600" height="110" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="62" y="620" font-size="19" font-weight="700" fill="#4E3428">單程票 NT$20–65</text>
  <text x="62" y="651" font-size="16" fill="#4E3428">售票機或詢問處購買，限購買當日使用</text>
  <text x="62" y="680" font-size="16" fill="#4E3428">停留較久或會搭公車，可改買悠遊卡</text>

  <!-- sample fares -->
  <rect x="712" y="585" width="858" height="115" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="734" y="614" font-size="18" font-weight="700" fill="#102A2B">從台北車站出發的成人單程票價</text>
  <text x="734" y="645" font-size="16" fill="#102A2B">西門 NT$20・台北 101／世貿 NT$25・松山機場 NT$25</text>
  <text x="734" y="673" font-size="16" fill="#102A2B">北投 NT$30・動物園 NT$35・淡水 NT$50・全線最高 NT$65</text>

  <!-- rules -->
  <rect x="40" y="720" width="1530" height="98" rx="14" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/>
  <text x="62" y="749" font-size="18" font-weight="700" fill="#102A2B">搭捷運的重要規定</text>
  <text x="62" y="777" font-size="16" fill="#102A2B">約 06:00–24:00 營運・禁飲食區與車廂內不得飲食或嚼口香糖・罰鍰 NT$1,500–7,500</text>
  <text x="62" y="804" font-size="16" fill="#102A2B">同站進出限 15 分鐘、不同站限 2 小時，逾時加收最低單程票價・未滿 6 歲或身高未滿 115 公分兒童免費</text>

  <text x="40" y="850" font-size="15" fill="#5C6B6B">資料：台北捷運、悠遊卡公司、台北市公共運輸處、北北基好玩卡官網｜2026 年 9 月查證</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 2026</text>
</svg>
