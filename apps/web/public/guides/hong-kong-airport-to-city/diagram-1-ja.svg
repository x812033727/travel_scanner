<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif">
  <title id="title">香港国際空港から市内への4つの移動手段 / Hong Kong International Airport to the city: four ways</title>
  <desc id="desc">左側に香港国際空港を配置し、T1第1ターミナル（エアポート・エクスプレス空港駅）、T2出発施設、暢達路T1南・北バス停（S1）、地上交通センター（A系統バス）を示しています。紫色の実線はエアポート・エクスプレスで、空港から青衣73、九龍105、香港120香港ドル（カード決済運賃）。香港駅まで約24分、運行時間は05:54〜00:48、約10分間隔です。オレンジ色の破線は東涌駅行きS1バス（3.7香港ドル）で、オレンジ色の実線の東涌線に乗り継ぎ、ライキン（尖沙咀・旺角方面のチュンワン線へ乗り換え）経由で九龍駅18.7、香港駅24.3香港ドル（東涌駅発のオクトパス大人運賃）です。赤色の破線はA21バスで、旺角・尖沙咀を経由してホンハムまで34.6香港ドル。青色の破線はA11バスで、中環・ワンチャイ・銅鑼湾を経由して北角まで41.9香港ドルです。右下は3色タクシーの初乗り2km運賃で、赤（市街地）29、緑（新界）25.5、青（ランタオ島）24香港ドル。空港からの目安は尖沙咀まで約290、中環まで約375香港ドル（トンネル通行料込み）。2026年9月にMTR・香港運輸署・香港空港管理局の公式資料をもとに確認。バスの所要時間は道路状況により変動します。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">香港国際空港から市内へ：4つの移動手段と大人運賃（香港ドル）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Hong Kong International Airport to the city: Airport Express, S1 + Tung Chung Line, buses A21 / A11, taxis</text>

  <!-- airport block -->
  <rect x="40" y="110" width="310" height="654" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="195" y="148" font-size="25" font-weight="700" fill="#102A2B" text-anchor="middle">香港国際空港</text>
  <text x="195" y="173" font-size="15" fill="#5C6B6B" text-anchor="middle">Hong Kong International Airport</text>

  <rect x="60" y="198" width="270" height="92" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="195" y="234" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">T1 第1ターミナル</text>
  <text x="195" y="264" font-size="15" fill="#5C6B6B" text-anchor="middle">エアポート・エクスプレス空港駅</text>

  <rect x="60" y="305" width="270" height="72" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="195" y="336" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">T2 出発 Departures</text>
  <text x="195" y="362" font-size="15" fill="#5C6B6B" text-anchor="middle">新出発施設</text>

  <rect x="60" y="395" width="270" height="72" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="195" y="426" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">S1 バス乗り場</text>
  <text x="195" y="452" font-size="15" fill="#5C6B6B" text-anchor="middle">暢達路 T1（南）・（北）</text>

  <rect x="60" y="560" width="270" height="184" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="195" y="600" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">地上交通センター</text>
  <text x="195" y="630" font-size="16" fill="#5C6B6B" text-anchor="middle">Ground Transportation</text>
  <text x="195" y="652" font-size="16" fill="#5C6B6B" text-anchor="middle">Centre</text>
  <text x="195" y="706" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">A系統バス 市内行き乗り場</text>

  <!-- Airport Express -->
  <line x1="330" y1="244" x2="1120" y2="244" stroke="#6B3FA0" stroke-width="12" stroke-linecap="round"/>
  <text x="368" y="218" font-size="19" font-weight="700" fill="#6B3FA0">エアポート・エクスプレス Airport Express（IC・タッチ決済運賃）</text>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="610" cy="244" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="865" cy="244" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="1120" cy="244" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <text x="610" y="286">青衣 Tsing Yi</text>
    <text x="865" y="286">九龍 Kowloon</text>
    <text x="1120" y="286">香港 Hong Kong</text>
  </g>
  <g font-size="17" fill="#6B3FA0" text-anchor="middle" font-weight="700">
    <text x="610" y="314">73香港ドル</text>
    <text x="865" y="314">105香港ドル</text>
    <text x="1120" y="314">120香港ドル</text>
  </g>
  <rect x="1216" y="186" width="344" height="114" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="1388" y="232" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">香港駅まで約24分</text>
  <text x="1388" y="268" font-size="17" fill="#102A2B" text-anchor="middle">05:54〜00:48・約10分間隔</text>

  <!-- S1 + Tung Chung Line -->
  <line x1="330" y1="430" x2="520" y2="430" stroke="#D97A2B" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <line x1="520" y1="430" x2="1120" y2="430" stroke="#D97A2B" stroke-width="12" stroke-linecap="round"/>
  <text x="362" y="472" font-size="16" font-weight="700" fill="#B35F1A">S1バス 3.7香港ドル</text>
  <g text-anchor="middle">
    <circle cx="520" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="710" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="910" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="1120" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <text x="520" y="382" font-size="17" font-weight="700" fill="#102A2B">東涌</text>
    <text x="520" y="402" font-size="15" fill="#5C6B6B">Tung Chung</text>
    <text x="710" y="382" font-size="17" font-weight="700" fill="#102A2B">ライキン</text>
    <text x="710" y="402" font-size="15" fill="#5C6B6B">Lai King</text>
    <text x="910" y="382" font-size="17" font-weight="700" fill="#102A2B">九龍</text>
    <text x="910" y="402" font-size="15" fill="#5C6B6B">Kowloon</text>
    <text x="1120" y="382" font-size="17" font-weight="700" fill="#102A2B">香港</text>
    <text x="1120" y="402" font-size="15" fill="#5C6B6B">Hong Kong</text>
  </g>
  <rect x="575" y="456" width="270" height="40" rx="10" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="710" y="482" font-size="15" fill="#102A2B" text-anchor="middle">チュンワン線へ乗換（尖沙咀・旺角）</text>
  <g font-size="17" font-weight="700" fill="#B35F1A" text-anchor="middle">
    <text x="910" y="476">18.7香港ドル</text>
    <text x="1120" y="476">24.3香港ドル</text>
  </g>
  <rect x="1216" y="382" width="344" height="96" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1388" y="420" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">東涌線 Tung Chung Line</text>
  <text x="1388" y="454" font-size="15" fill="#5C6B6B" text-anchor="middle">オクトパス大人運賃（東涌駅発）</text>

  <!-- A21 -->
  <line x1="330" y1="596" x2="1060" y2="596" stroke="#B8442D" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="362" y="636" font-size="17" font-weight="700" fill="#B8442D">A21バス 34.6香港ドル</text>
  <g text-anchor="middle">
    <circle cx="600" cy="596" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="830" cy="596" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="1060" cy="596" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <text x="600" y="550" font-size="17" font-weight="700" fill="#102A2B">旺角</text>
    <text x="600" y="570" font-size="15" fill="#5C6B6B">Mong Kok</text>
    <text x="830" y="550" font-size="17" font-weight="700" fill="#102A2B">尖沙咀</text>
    <text x="830" y="570" font-size="15" fill="#5C6B6B">Tsim Sha Tsui</text>
    <text x="1060" y="550" font-size="17" font-weight="700" fill="#102A2B">ホンハム</text>
    <text x="1060" y="570" font-size="15" fill="#5C6B6B">Hung Hom</text>
  </g>

  <!-- A11 -->
  <line x1="330" y1="714" x2="1115" y2="714" stroke="#2F6F9F" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="362" y="754" font-size="17" font-weight="700" fill="#2F6F9F">A11バス 41.9香港ドル</text>
  <g text-anchor="middle">
    <circle cx="545" cy="714" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="735" cy="714" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="925" cy="714" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="1115" cy="714" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <text x="545" y="668" font-size="17" font-weight="700" fill="#102A2B">中環</text>
    <text x="545" y="688" font-size="15" fill="#5C6B6B">Central</text>
    <text x="735" y="668" font-size="17" font-weight="700" fill="#102A2B">ワンチャイ</text>
    <text x="735" y="688" font-size="15" fill="#5C6B6B">Wan Chai</text>
    <text x="925" y="668" font-size="17" font-weight="700" fill="#102A2B">銅鑼湾</text>
    <text x="925" y="688" font-size="15" fill="#5C6B6B">Causeway Bay</text>
    <text x="1115" y="668" font-size="17" font-weight="700" fill="#102A2B">北角</text>
    <text x="1115" y="688" font-size="15" fill="#5C6B6B">North Point</text>
  </g>

  <!-- taxis -->
  <rect x="1216" y="516" width="344" height="252" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1388" y="552" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">3色タクシー 初乗り2km運賃</text>
  <rect x="1240" y="570" width="26" height="18" rx="4" fill="#C8372D"/>
  <text x="1278" y="586" font-size="16" fill="#102A2B">赤（市街地） 29香港ドル</text>
  <rect x="1240" y="602" width="26" height="18" rx="4" fill="#2E7D5B"/>
  <text x="1278" y="618" font-size="16" fill="#102A2B">緑（新界） 25.5香港ドル</text>
  <rect x="1240" y="634" width="26" height="18" rx="4" fill="#2F6F9F"/>
  <text x="1278" y="650" font-size="16" fill="#102A2B">青（ランタオ島） 24香港ドル</text>
  <line x1="1238" y1="670" x2="1538" y2="670" stroke="#D8CFC2" stroke-width="2"/>
  <text x="1240" y="698" font-size="16" font-weight="700" fill="#102A2B">空港〜尖沙咀：約290香港ドル</text>
  <text x="1240" y="726" font-size="16" font-weight="700" fill="#102A2B">空港〜中環：約375香港ドル</text>
  <text x="1240" y="752" font-size="15" fill="#5C6B6B">（トンネル通行料込み・荷物代別）</text>

  <!-- legend and notes -->
  <line x1="60" y1="816" x2="120" y2="816" stroke="#5C6B6B" stroke-width="10" stroke-linecap="round"/>
  <text x="132" y="822" font-size="16" fill="#102A2B">鉄道</text>
  <line x1="200" y1="816" x2="260" y2="816" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round"/>
  <text x="272" y="822" font-size="16" fill="#102A2B">バス</text>
  <text x="348" y="822" font-size="15" fill="#5C6B6B">2026年9月にMTR・香港運輸署・香港空港管理局資料で確認。バス所要時間は道路状況により変動、最新ダイヤは各社案内参照。</text>
  <text x="1560" y="872" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 制作 2026</text>
</svg>
