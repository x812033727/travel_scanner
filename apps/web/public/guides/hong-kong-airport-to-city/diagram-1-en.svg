  <line x1="320" y1="705" x2="1110" y2="705" stroke="#2F6F9F" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="352" y="745" font-size="18" font-weight="700" fill="#2F6F9F">Bus A11 · HK$41.9</text>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="555" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="730" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
