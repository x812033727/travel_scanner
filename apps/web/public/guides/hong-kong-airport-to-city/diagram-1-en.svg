<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Inter','Helvetica Neue',Arial,'Noto Sans',system-ui,sans-serif">
  <title id="title">Hong Kong International Airport to the City: Four Ways &amp; Adult Fares (HK$)</title>
  <desc id="desc">On the left is Hong Kong International Airport, marking Terminal 1 (Airport Express Airport Station), Terminal 2 new departure facilities, S1 bus stops on Cheong Tat Road at T1 South and North, and the Ground Transportation Centre for citybound A-route buses. The solid purple line shows the Airport Express from the Airport via Tsing Yi (HK$73) and Kowloon (HK$105) to Hong Kong Station (HK$120 tap-to-pay adult fare), taking about 24 minutes from 5:54 AM to 12:48 AM about every 10 minutes. The dashed orange line shows the S1 bus to Tung Chung Station (HK$3.7), connecting to the solid orange Tung Chung Line via Lai King (transfer to the Tsuen Wan Line for Tsim Sha Tsui and Mong Kok) to Kowloon (HK$18.7) and Hong Kong Station (HK$24.3, adult Octopus fare from Tung Chung, HK$28 total to Central). The dashed red line shows bus A21 via Mong Kok and Tsim Sha Tsui to Hung Hom (HK$34.6); the dashed blue line shows bus A11 via Central, Wan Chai, and Causeway Bay to North Point (HK$41.9). The bottom-right box lists taxi flagfall fares for the first 2 km: red Urban HK$29, green New Territories HK$25.5, and blue Lantau HK$24, with approximate fares from the airport of HK$290 to Tsim Sha Tsui and HK$375 to Central including tunnel tolls. Checked September 2026 via MTR, the Transport Department, and the Airport Authority Hong Kong; bus travel times depend on traffic; trunk bags cost HK$6 each.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="48" y="52" font-size="30" font-weight="700" fill="#102A2B">Hong Kong Airport to the City: Four Ways &amp; Adult Fares (HK$)</text>
  <text x="48" y="84" font-size="18" fill="#5C6B6B">Airport Express, S1 Bus + MTR Tung Chung Line, Buses A21 / A11, and Red / Green / Blue Taxis</text>

  <!-- airport block -->
