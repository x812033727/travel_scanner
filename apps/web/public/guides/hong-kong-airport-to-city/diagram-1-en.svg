  <text x="190" y="176" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">International Airport</text>

  <rect x="60" y="198" width="260" height="86" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="190" y="232" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Terminal 1 (T1)</text>
