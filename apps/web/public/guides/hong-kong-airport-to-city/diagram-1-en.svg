    <circle cx="840" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="1080" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <text x="600" y="566">Mong Kok</text>
    <text x="840" y="566">Tsim Sha Tsui</text>
    <text x="1080" y="566">Hung Hom</text>
  </g>

