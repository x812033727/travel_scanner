  <text x="1385" y="442" font-size="15" fill="#5C6B6B" text-anchor="middle">Adult Octopus fare from Tung Chung</text>
  <text x="1385" y="468" font-size="15" font-weight="700" fill="#B35F1A" text-anchor="middle">HK$28 total to Central (incl. S1)</text>

  <!-- A21 -->
  <line x1="320" y1="595" x2="1080" y2="595" stroke="#B8442D" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
