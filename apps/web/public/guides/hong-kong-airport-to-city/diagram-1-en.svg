  <rect x="60" y="298" width="260" height="72" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="190" y="328" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Terminal 2 (T2)</text>
  <text x="190" y="354" font-size="15" fill="#5C6B6B" text-anchor="middle">New Departure Facilities</text>

  <rect x="60" y="388" width="260" height="76" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="190" y="420" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">S1 Bus Stops</text>
  <text x="190" y="446" font-size="15" fill="#5C6B6B" text-anchor="middle">Cheong Tat Rd T1 (S &amp; N)</text>

  <rect x="60" y="555" width="260" height="180" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="190" y="602" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Ground Transportation</text>
  <text x="190" y="628" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">Centre</text>
  <text x="190" y="676" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">Citybound A-Route</text>
  <text x="190" y="700" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">Bus Boarding</text>

