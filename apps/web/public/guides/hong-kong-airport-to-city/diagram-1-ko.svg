<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">홍콩 공항에서 시내까지 4가지 이동 수단 / Hong Kong International Airport to the city: four ways</title>
  <desc id="desc">왼쪽은 홍콩 국제공항으로, T1 제1터미널(공항철도 공항역), T2 신규 출국 시설, 청탓 로드 T1(남)·(북) S1 버스 정류장, 지상교통센터(A 노선 버스 탑승장)를 표시해요. 보라색 실선은 공항철도(AEL)로 공항에서 칭이 73, 구룡 105, 홍콩역 120 HKD(카드·옥토퍼스 기준)이며 홍콩역까지 약 24분, 05:54~00:48, 약 10분 간격으로 운행해요. 주황색 점선은 S1 버스로 퉁청역까지 3.7 HKD이며, 이어지는 주황색 실선 퉁청선을 타고 라이킹(라이킹에서 췬완선 환승 시 침사추이·몽콕 방면)을 거쳐 구룡역 18.7, 홍콩역 24.3 HKD예요(옥토퍼스 성인 기준, 퉁청역 출발). 빨간색 점선은 A21 버스로 몽콕·침사추이를 거쳐 홍함까지 34.6 HKD, 파란색 점선은 A11 버스로 센트럴·완차이·코즈웨이베이를 거쳐 노스포인트까지 41.9 HKD예요. 오른쪽 아래는 3색 택시 첫 2km 기본요금으로 빨간색 시내 29, 초록색 신계 25.5, 파란색 란타우 24 HKD이며 공항에서 침사추이 약 290, 센트럴 약 375 HKD예요(터널비 포함). 2026년 9월 MTR·홍콩 운수서·공항관리국 자료 기준이며 버스 소요 시간은 도로 상황에 따라 달라져요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">홍콩 공항에서 시내까지: 4가지 이동 수단과 성인 요금(HKD)</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Hong Kong International Airport to the city: Airport Express, S1 + Tung Chung Line, buses A21 / A11, taxis</text>

