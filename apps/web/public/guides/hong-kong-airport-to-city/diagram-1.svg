<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">香港機場到市區的四種走法 / Hong Kong International Airport to the city: four ways</title>
  <desc id="desc">左邊是香港國際機場，標出 T1 一號客運大樓（機場快綫機場站）、T2 離境設施、暢達路 T1 南與北巴士站（S1）、地面運輸中心（A 線巴士）。紫色實線是機場快綫，從機場經青衣 73、九龍 105 到香港 120 港元（刷卡價），到香港站約 24 分鐘，05:54 到 00:48，約 10 分鐘一班。橘色虛線是 S1 巴士到東涌站 3.7 港元，再接橘色實線東涌綫經荔景（在荔景轉荃灣綫往尖沙咀、旺角）到九龍站 18.7、香港站 24.3 港元（八達通成人車資，從東涌站起算）。紅色虛線是 A21 巴士，經旺角、尖沙咀到紅磡，34.6 港元；藍色虛線是 A11 巴士，經中環、灣仔、銅鑼灣到北角，41.9 港元。右下是三色計程車首 2 公里起錶價：紅色市區 29、綠色新界 25.5、藍色大嶼山 24 港元；機場到尖沙咀約 290、到中環約 375 港元，含隧道費。2026 年 9 月依港鐵、運輸署、機管局資料查證，巴士車程受路況影響。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">香港機場到市區：四種走法與成人票價（港元）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Hong Kong International Airport to the city: Airport Express, S1 + Tung Chung Line, buses A21 / A11, taxis</text>

  <!-- airport block -->
  <rect x="40" y="110" width="300" height="640" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="190" y="148" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">香港國際機場</text>
  <text x="190" y="173" font-size="16" fill="#5C6B6B" text-anchor="middle">Hong Kong International Airport</text>

  <rect x="60" y="200" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="190" y="236" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">T1 一號客運大樓</text>
  <text x="190" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">機場快綫機場站</text>

  <rect x="60" y="305" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="190" y="336" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">T2 離境 Departures</text>
  <text x="190" y="361" font-size="15" fill="#5C6B6B" text-anchor="middle">新離港設施</text>

  <rect x="60" y="395" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="190" y="426" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">S1 巴士站</text>
  <text x="190" y="451" font-size="15" fill="#5C6B6B" text-anchor="middle">暢達路 T1（南）、（北）</text>

  <rect x="60" y="560" width="260" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="190" y="600" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">地面運輸中心</text>
  <text x="190" y="628" font-size="16" fill="#5C6B6B" text-anchor="middle">Ground Transportation</text>
  <text x="190" y="650" font-size="16" fill="#5C6B6B" text-anchor="middle">Centre</text>
  <text x="190" y="700" font-size="16" fill="#0D6B68" text-anchor="middle">A 線巴士往市區上車處</text>

  <!-- Airport Express -->
  <line x1="320" y1="245" x2="1120" y2="245" stroke="#6B3FA0" stroke-width="12" stroke-linecap="round"/>
  <text x="365" y="222" font-size="20" font-weight="700" fill="#6B3FA0">機場快綫 Airport Express（刷卡價）</text>
  <g font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="620" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="880" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="1120" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <text x="620" y="290">青衣 Tsing Yi</text>
    <text x="880" y="290">九龍 Kowloon</text>
    <text x="1120" y="290">香港 Hong Kong</text>
  </g>
  <g font-size="17" fill="#6B3FA0" text-anchor="middle" font-weight="700">
    <text x="620" y="316">73 港元</text>
    <text x="880" y="316">105 港元</text>
    <text x="1120" y="316">120 港元</text>
  </g>
  <rect x="1230" y="190" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="1395" y="232" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">到香港站約 24 分鐘</text>
  <text x="1395" y="266" font-size="17" fill="#102A2B" text-anchor="middle">05:54 到 00:48，約 10 分鐘一班</text>

  <!-- S1 + Tung Chung Line -->
  <line x1="320" y1="430" x2="520" y2="430" stroke="#D97A2B" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <line x1="520" y1="430" x2="1120" y2="430" stroke="#D97A2B" stroke-width="12" stroke-linecap="round"/>
  <text x="352" y="472" font-size="17" font-weight="700" fill="#B35F1A">S1 巴士 3.7 港元</text>
  <g font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="520" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="700" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="880" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="1120" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <text x="520" y="398">東涌 Tung Chung</text>
    <text x="700" y="398">荔景 Lai King</text>
    <text x="880" y="398">九龍 Kowloon</text>
    <text x="1120" y="398">香港 Hong Kong</text>
  </g>
  <rect x="598" y="455" width="204" height="40" rx="10" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="700" y="481" font-size="15" fill="#102A2B" text-anchor="middle">轉荃灣綫往尖沙咀、旺角</text>
  <g font-size="17" font-weight="700" fill="#B35F1A" text-anchor="middle">
    <text x="880" y="474">18.7 港元</text>
    <text x="1120" y="474">24.3 港元</text>
  </g>
  <rect x="1230" y="385" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1395" y="421" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">東涌綫 Tung Chung Line</text>
  <text x="1395" y="453" font-size="15" fill="#5C6B6B" text-anchor="middle">八達通成人車資，從東涌站起算</text>

  <!-- A21 -->
  <line x1="320" y1="595" x2="1020" y2="595" stroke="#B8442D" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="352" y="635" font-size="18" font-weight="700" fill="#B8442D">A21 巴士 34.6 港元</text>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="620" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="820" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="1020" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <text x="620" y="566">旺角 Mong Kok</text>
    <text x="820" y="566">尖沙咀 Tsim Sha Tsui</text>
    <text x="1020" y="566">紅磡 Hung Hom</text>
  </g>

  <!-- A11 -->
  <line x1="320" y1="705" x2="1100" y2="705" stroke="#2F6F9F" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="352" y="745" font-size="18" font-weight="700" fill="#2F6F9F">A11 巴士 41.9 港元</text>
  <g font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="580" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="755" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="930" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="1100" cy="705" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <text x="580" y="676">中環 Central</text>
    <text x="755" y="676">灣仔 Wan Chai</text>
    <text x="930" y="676">銅鑼灣 Causeway Bay</text>
    <text x="1100" y="676">北角 North Point</text>
  </g>

  <!-- taxis -->
  <rect x="1230" y="530" width="330" height="230" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1395" y="566" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">三色計程車 首 2 公里起錶價</text>
  <rect x="1254" y="584" width="26" height="18" rx="4" fill="#C8372D"/>
  <text x="1292" y="600" font-size="17" fill="#102A2B">紅色市區 29 港元</text>
  <rect x="1254" y="616" width="26" height="18" rx="4" fill="#2E7D5B"/>
  <text x="1292" y="632" font-size="17" fill="#102A2B">綠色新界 25.5 港元</text>
  <rect x="1254" y="648" width="26" height="18" rx="4" fill="#2F6F9F"/>
  <text x="1292" y="664" font-size="17" fill="#102A2B">藍色大嶼山 24 港元</text>
  <line x1="1250" y1="682" x2="1540" y2="682" stroke="#D8CFC2" stroke-width="2"/>
  <text x="1254" y="710" font-size="17" font-weight="700" fill="#102A2B">機場到尖沙咀約 290 港元</text>
  <text x="1254" y="740" font-size="17" font-weight="700" fill="#102A2B">機場到中環約 375 港元（含隧道費）</text>

  <!-- legend and notes -->
  <line x1="60" y1="808" x2="120" y2="808" stroke="#5C6B6B" stroke-width="10" stroke-linecap="round"/>
  <text x="132" y="814" font-size="16" fill="#102A2B">鐵路</text>
  <line x1="200" y1="808" x2="260" y2="808" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round"/>
  <text x="272" y="814" font-size="16" fill="#102A2B">巴士</text>
  <text x="360" y="814" font-size="16" fill="#5C6B6B">2026 年 9 月依港鐵、運輸署、機管局資料查證；巴士車程受路況影響，服務時間以巴士公司公告為準</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
