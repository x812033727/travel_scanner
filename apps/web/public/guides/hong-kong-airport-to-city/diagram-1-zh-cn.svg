<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">香港机场到市区的四种走法 / Hong Kong International Airport to the city: four ways</title>
  <desc id="desc">左侧为香港国际机场，标出 T1 一号客运大楼（机场快线机场站）、T2 离境设施、畅达路 T1 南与北巴士站（S1）、地面运输中心（A 线巴士）。紫色实线为机场快线，从机场经青衣 73、九龙 105 到香港 120 港元（刷卡价），到香港站约 24 分钟，05:54 至 00:48，约 10 分钟一班。橙色虚线为 S1 巴士到东涌站 3.7 港元，再接橙色实线东涌线经荔景（在荔景换乘荃湾线往尖沙咀、旺角）到九龙站 18.7、香港站 24.3 港元（八达通成人车费，从东涌站起算）。红色虚线为 A21 巴士，经旺角、尖沙咀到红磡，34.6 港元；蓝色虚线为 A11 巴士，经中环、湾仔、铜锣湾到北角，41.9 港元。右下为三色出租车（的士）首 2 公里起步价：红色市区 29、绿色新界 25.5、蓝色大屿山 24 港元；机场到尖沙咀约 290、到中环约 375 港元，含隧道费。2026 年 9 月依港铁、运输署、机管局资料查证，巴士车程受路况影响。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">香港机场到市区：四种走法与成人票价（港元）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Hong Kong International Airport to the city: Airport Express, S1 + Tung Chung Line, buses A21 / A11, taxis</text>

  <!-- airport block -->
  <rect x="40" y="110" width="300" height="650" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="190" y="148" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">香港国际机场</text>
  <text x="190" y="173" font-size="16" fill="#5C6B6B" text-anchor="middle">Hong Kong International Airport</text>

  <rect x="60" y="200" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="190" y="236" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">T1 一号客运大楼</text>
  <text x="190" y="266" font-size="16" fill="#5C6B6B" text-anchor="middle">机场快线机场站</text>

  <rect x="60" y="305" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="190" y="336" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">T2 离境 Departures</text>
  <text x="190" y="361" font-size="15" fill="#5C6B6B" text-anchor="middle">新离港设施</text>

  <rect x="60" y="395" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="190" y="426" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">S1 巴士站</text>
  <text x="190" y="451" font-size="15" fill="#5C6B6B" text-anchor="middle">畅达路 T1（南）、（北）</text>

  <rect x="60" y="560" width="260" height="180" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="190" y="604" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">地面运输中心</text>
  <text x="190" y="632" font-size="16" fill="#5C6B6B" text-anchor="middle">Ground Transportation</text>
  <text x="190" y="654" font-size="16" fill="#5C6B6B" text-anchor="middle">Centre</text>
  <text x="190" y="704" font-size="16" fill="#0D6B68" text-anchor="middle">A 线巴士往市区上车点</text>

  <!-- Airport Express -->
  <line x1="320" y1="245" x2="1120" y2="245" stroke="#6B3FA0" stroke-width="12" stroke-linecap="round"/>
  <text x="365" y="220" font-size="20" font-weight="700" fill="#6B3FA0">机场快线 Airport Express（刷卡价）</text>
  <g font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="620" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="880" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <circle cx="1120" cy="245" r="15" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="7"/>
    <text x="620" y="290">青衣 Tsing Yi</text>
    <text x="880" y="290">九龙 Kowloon</text>
    <text x="1120" y="290">香港 Hong Kong</text>
  </g>
  <g font-size="17" fill="#6B3FA0" text-anchor="middle" font-weight="700">
    <text x="620" y="316">73 港元</text>
    <text x="880" y="316">105 港元</text>
    <text x="1120" y="316">120 港元</text>
  </g>
  <rect x="1230" y="190" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="4"/>
  <text x="1395" y="232" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">到香港站约 24 分钟</text>
  <text x="1395" y="266" font-size="17" fill="#102A2B" text-anchor="middle">05:54 至 00:48，约 10 分钟一班</text>

  <!-- S1 + Tung Chung Line -->
  <line x1="320" y1="430" x2="520" y2="430" stroke="#D97A2B" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <line x1="520" y1="430" x2="1120" y2="430" stroke="#D97A2B" stroke-width="12" stroke-linecap="round"/>
  <text x="352" y="472" font-size="17" font-weight="700" fill="#B35F1A">S1 巴士 3.7 港元</text>
  <g font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">
    <circle cx="520" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="700" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="880" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <circle cx="1120" cy="430" r="15" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
    <text x="520" y="398">东涌 Tung Chung</text>
    <text x="700" y="398">荔景 Lai King</text>
    <text x="880" y="398">九龙 Kowloon</text>
    <text x="1120" y="398">香港 Hong Kong</text>
  </g>
  <rect x="596" y="455" width="208" height="40" rx="10" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="700" y="481" font-size="15" fill="#102A2B" text-anchor="middle">换乘荃湾线往尖沙咀、旺角</text>
  <g font-size="17" font-weight="700" fill="#B35F1A" text-anchor="middle">
    <text x="880" y="474">18.7 港元</text>
    <text x="1120" y="474">24.3 港元</text>
  </g>
  <rect x="1230" y="385" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1395" y="421" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">东涌线 Tung Chung Line</text>
  <text x="1395" y="453" font-size="15" fill="#5C6B6B" text-anchor="middle">八达通成人车费，从东涌站起算</text>

  <!-- A21 -->
  <line x1="320" y1="595" x2="1090" y2="595" stroke="#B8442D" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="352" y="633" font-size="18" font-weight="700" fill="#B8442D">A21 巴士 34.6 港元</text>
  <g text-anchor="middle">
    <circle cx="600" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="845" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <circle cx="1090" cy="595" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
    <text x="600" y="550" font-size="18" font-weight="700" fill="#102A2B">旺角</text>
    <text x="600" y="571" font-size="15" fill="#5C6B6B">Mong Kok</text>
    <text x="845" y="550" font-size="18" font-weight="700" fill="#102A2B">尖沙咀</text>
    <text x="845" y="571" font-size="15" fill="#5C6B6B">Tsim Sha Tsui</text>
    <text x="1090" y="550" font-size="18" font-weight="700" fill="#102A2B">红磡</text>
    <text x="1090" y="571" font-size="15" fill="#5C6B6B">Hung Hom</text>
  </g>

  <!-- A11 -->
  <line x1="320" y1="715" x2="1110" y2="715" stroke="#2F6F9F" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
  <text x="352" y="753" font-size="18" font-weight="700" fill="#2F6F9F">A11 巴士 41.9 港元</text>
  <g text-anchor="middle">
    <circle cx="540" cy="715" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="730" cy="715" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="920" cy="715" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <circle cx="1110" cy="715" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
    <text x="540" y="670" font-size="18" font-weight="700" fill="#102A2B">中环</text>
    <text x="540" y="691" font-size="15" fill="#5C6B6B">Central</text>
    <text x="730" y="670" font-size="18" font-weight="700" fill="#102A2B">湾仔</text>
    <text x="730" y="691" font-size="15" fill="#5C6B6B">Wan Chai</text>
    <text x="920" y="670" font-size="18" font-weight="700" fill="#102A2B">铜锣湾</text>
    <text x="920" y="691" font-size="15" fill="#5C6B6B">Causeway Bay</text>
    <text x="1110" y="670" font-size="18" font-weight="700" fill="#102A2B">北角</text>
    <text x="1110" y="691" font-size="15" fill="#5C6B6B">North Point</text>
  </g>

  <!-- taxis -->
  <rect x="1230" y="530" width="330" height="230" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1395" y="566" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">三色出租车 首 2 公里起步价</text>
  <rect x="1254" y="584" width="26" height="18" rx="4" fill="#C8372D"/>
  <text x="1292" y="600" font-size="17" fill="#102A2B">红色市区 29 港元</text>
  <rect x="1254" y="616" width="26" height="18" rx="4" fill="#2E7D5B"/>
  <text x="1292" y="632" font-size="17" fill="#102A2B">绿色新界 25.5 港元</text>
  <rect x="1254" y="648" width="26" height="18" rx="4" fill="#2F6F9F"/>
  <text x="1292" y="664" font-size="17" fill="#102A2B">蓝色大屿山 24 港元</text>
  <line x1="1250" y1="682" x2="1540" y2="682" stroke="#D8CFC2" stroke-width="2"/>
  <text x="1254" y="710" font-size="16" font-weight="700" fill="#102A2B">机场到尖沙咀约 290 港元</text>
  <text x="1254" y="740" font-size="16" font-weight="700" fill="#102A2B">机场到中环约 375 港元（含隧道费）</text>

  <!-- legend and notes -->
  <line x1="60" y1="812" x2="120" y2="812" stroke="#5C6B6B" stroke-width="10" stroke-linecap="round"/>
  <text x="132" y="818" font-size="16" fill="#102A2B">铁路</text>
  <line x1="200" y1="812" x2="260" y2="812" stroke="#5C6B6B" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round"/>
  <text x="272" y="818" font-size="16" fill="#102A2B">巴士</text>
  <text x="360" y="818" font-size="16" fill="#5C6B6B">2026 年 9 月依港铁、运输署、机管局资料查证；巴士车程受路况影响，服务时间以巴士公司公告为准</text>
  <text x="1560" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 制图 2026</text>
</svg>
