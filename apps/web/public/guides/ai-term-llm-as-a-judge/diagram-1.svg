<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">以語言模型擔任評審圖解 / LLM-as-a-Judge</title><desc id="desc">原始任務、參考資料和評分準則進入模型評審，候選答案作為待評內容；評語與人工樣本對照後才能用於比較。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">評審也需要準則、來源與校準</text><text x="60" y="84" fill="#5C6B6B" font-size="18">LLM-as-a-Judge</text><rect x="80" y="170" width="440" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="300" y="252" text-anchor="middle" font-size="36" fill="#102A2B">任務、來源與準則</text><rect x="80" y="490" width="440" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="300" y="572" text-anchor="middle" font-size="36" fill="#102A2B">候選甲與候選乙</text><path d="M 520 240 L 690 410" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="690" cy="410" r="10" fill="#0D6B68"/><path d="M 520 560 L 690 410" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="690" cy="410" r="10" fill="#0D6B68"/><rect x="690" y="300" width="350" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="865" y="422" text-anchor="middle" font-size="36" fill="#102A2B">模型評審</text><path d="M 1040 410 L 1160 410" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1160" cy="410" r="10" fill="#0D6B68"/><rect x="1160" y="300" width="350" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="422" text-anchor="middle" font-size="36" fill="#102A2B">逐項評語與依據</text><rect x="640" y="670" width="870" height="100" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1075" y="732" text-anchor="middle" font-size="36" fill="#102A2B">交換順序、人工樣本與版本校準</text><path d="M 1335 520 L 1335 670" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1335" cy="670" r="10" fill="#0D6B68"/><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
