<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">四段階の流れ：リマインダーを集める、一件ずつ決める、余力を配分する、次の行動を書く</title>
<desc id="desc">リマインダーを集める、一件ずつ決める、余力を配分する、次の行動を書く、の順で確認します。編集上の整理であり、地図や実測時間ではありません。</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">実践の順序</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">状況に合わせて選び、一度にすべて終える必要はありません</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="28" text-anchor="middle" font-weight="700">リマインダーを集める</text>
<text x="245" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">約束を先に集める</text>
<text x="245" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">始めずに一か所へ集める</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">一件ずつ決める</text>
<text x="615" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">各項目の置き場所を決める</text>
<text x="615" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">実行・待機・保留・完了</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">余力を配分する</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">使える時間に合わせる</text>
<text x="985" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">固定の約束を優先する</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">次の行動を書く</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">再開する行動を残す</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">次回すぐ始められる</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair・編集部制作の図</text>
</g>
</svg>
