<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">內容品質從證據到維護</title><desc id="desc">四個區塊依序為核對證據、補足用途、校對呈現及安排維護，說明文章品質檢查流程。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">內容品質從證據到維護</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">每一層都能回到讀者問題，並留下可追溯的完成紀錄</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">核對證據</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">主張有來源</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">範圍與日期</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">測試推論分開</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">補足用途</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">步驟可執行</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">比較有條件</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">例外可處理</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">校對呈現</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">圖文資訊一致</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">授權可追溯</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">摘要連結正確</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">安排維護</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">責任人與狀態</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">變動觸發檢查</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">更正留下紀錄</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">完成文章，代表證據、用途與呈現都已對齊，且有人維護。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
