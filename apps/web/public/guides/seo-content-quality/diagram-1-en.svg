<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Arial',sans-serif">
<title id="title">Content quality: evidence to upkeep</title><desc id="desc">Four stages of an article quality review: verify evidence, make it usable, check its presentation and plan maintenance.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Content quality: evidence to upkeep</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Connect every layer to the reader's question and keep a traceable record</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">Verify evidence</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Source each claim</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Scope and date</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Tests vs. inference</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Make it useful</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Actionable steps</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Fair comparison</text>
<text x="477.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Handle exceptions</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="27" fill="#102A2B" text-anchor="start" font-weight="bold">Check presentation</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Image-text match</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Traceable rights</text>
<text x="846.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Accurate summaries</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Plan upkeep</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Owner and status</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Change triggers</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Log corrections</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">An article is done when evidence, use and presentation align—and someone maintains it.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original illustration by Mokaair</text>
</svg>