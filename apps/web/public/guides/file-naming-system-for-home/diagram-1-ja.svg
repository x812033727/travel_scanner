<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>ファイルが見つからないときに：用途・日付・状態で作るシンプルな命名ルール：判断の流れ</title><desc>検索語を考える、名前の順序を決める、少量ずつ整理する、実際に探す、の順に確認します。編集部による整理案であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践の順序</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせ、一度にすべて終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">検索語を考える</text><text x="103" y="497" fill="#f4f0e5" font-size="23">探し方を想像する</text><text x="103" y="573" fill="#f4dc9d" font-size="26">用途を明確に</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="32.5" font-weight="700">名前の順序を決める</text><text x="473" y="497" fill="#f4f0e5" font-size="23">並び方を選ぶ</text><text x="473" y="573" fill="#f4dc9d" font-size="26">同じ種類はそろえる</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">少量ずつ整理する</text><text x="843" y="497" fill="#f4f0e5" font-size="23">小さく始める</text><text x="843" y="573" fill="#f4dc9d" font-size="26">試してから広げる</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">実際に探す</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">検索を試す</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">開いて内容を確認</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部作成の図解</text></g></svg>
