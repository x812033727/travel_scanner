<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>파일을 자꾸 못 찾는다면: 용도·날짜·상태로 만드는 간단한 이름 규칙: 판단 순서</title><desc>검색어 생각하기, 이름 순서 정하기, 조금씩 정리하기, 실제로 찾아보기 순서로 확인합니다. 편집부의 정리 제안이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실천 순서</text><text x="100" y="175" fill="#576968" font-size="25">자신의 상황에 맞게 선택하고, 한 번에 전부 끝내려 하지 마세요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">검색어 생각하기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">찾는 방법 떠올리기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">용도부터 명확하게</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">이름 순서 정하기</text><text x="473" y="497" fill="#f4f0e5" font-size="23">순서 선택하기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">같은 종류는 일관되게</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">조금씩 정리하기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">작게 시작하기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">시험한 뒤 범위 넓히기</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">실제로 찾아보기</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">검색해 보기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">열어서 내용 확인하기</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 도식</text></g></svg>
