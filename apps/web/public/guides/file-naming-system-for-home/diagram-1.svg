<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>檔案總是找不到？用用途、日期與狀態建立簡單命名規則：判斷流程</title><desc>依序檢查：想搜尋詞、定名稱順序、小批次整理、實際找一次。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">想搜尋詞</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Think retrieval</text><text x="103" y="573" fill="#f4dc9d" font-size="26">用途先說清</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">定名稱順序</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Choose an order</text><text x="473" y="573" fill="#f4dc9d" font-size="26">同類保持一致</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">小批次整理</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Start small</text><text x="843" y="573" fill="#f4dc9d" font-size="26">先測再擴大</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">實際找一次</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Try to retrieve</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">開啟確認內容</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>