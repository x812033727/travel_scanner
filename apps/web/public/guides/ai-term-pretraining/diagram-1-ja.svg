<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">学習目標がモデルの練習内容を決める</title><desc id="desc">元のテキストは次の token の予測やマスク部分の復元という練習に変換でき、予測の誤差を使ってパラメータを更新することで基盤モデルが形成される</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">学習目標がモデルの練習内容を決める</text><text x="60" y="84" font-size="18" fill="#5C6B6B">事前学習</text><path d="M 350 400 L 550 250" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 350 450 L 550 640" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 930 240 L 1130 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 930 640 L 1130 480" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="70" y="340" width="280" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="210" y="419" font-size="28" fill="#102A2B" text-anchor="middle">テキストデータ</text><text x="210" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">整理と分割</text><rect x="560" y="160" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="745" y="234" font-size="28" fill="#102A2B" text-anchor="middle">次の token を予測</text><text x="745" y="277" font-size="22" fill="#5C6B6B" text-anchor="middle">前の内容を利用</text><rect x="560" y="560" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="745" y="634" font-size="28" fill="#102A2B" text-anchor="middle">マスク部分を復元</text><text x="745" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">見えている文脈を利用</text><rect x="1140" y="325" width="370" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1325" y="419" font-size="28" fill="#102A2B" text-anchor="middle">パラメータ更新</text><text x="1325" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">再利用できる表現を形成</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 図版制作 2026</text></svg>
