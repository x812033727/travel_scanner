  <circle cx="1190" cy="304" r="22" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="3"/>
  <text x="1190" y="312" font-size="22" font-weight="700" fill="#5C6B6B" text-anchor="middle">≠</text>

