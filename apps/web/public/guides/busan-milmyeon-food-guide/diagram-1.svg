<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">釜山小麥冷麵菜單解碼圖 / How to read a Busan milmyeon menu</title>
  <desc id="desc">圖上的標題是「菜單怎麼分？밀면跟냉면是兩道菜」，副標是「Busan milmyeon: menu guide and how it differs from naengmyeon」。圖分左右兩塊。左塊的欄頭寫「菜單上只有兩種：물밀면跟비빔밀면」，下面三個方框：물밀면是有湯的，冰鎮的湯裡放麵，湯用牛骨、豬骨或雞骨熬；비빔밀면是辣拌的，不加湯，拌辣醬，拌的是辣的양념장；밀면是菜單只寫兩個字時的寫法，菜單並排寫著밀면、비빔밀면，前者就是有湯的那一碗。右塊的欄頭寫「밀면與냉면：麵跟湯都不一樣」，下面兩個方框並排、中間隔著一個不等於符號：밀면（小麥冷麵）的麵是小麥粉＋澱粉、嚼勁強，湯是牛骨、豬骨或雞骨熬的冷湯；냉면（韓式冷麵）的麵是蕎麥，湯是牛胸肉或牛腱熬的冷湯。兩個方框下方的橫幅寫「不是同一道菜的兩種口味」，下面兩行寫밀면的麵是小麥粉＋澱粉、냉면的麵是蕎麥，湯的骨頭也不一樣。最下面一排的標題是「碗裡常見的幾樣」，三個方框：삶은 계란（水煮蛋）一般先吃掉，蛋有保護胃的作用；무채（蘿蔔絲）跟麵一起吃，吃得到爽脆的口感；다대기(양념장)（辣醬）加多加少自己決定，決定辣、甜、酸的程度。菜名與配料名照韓文寫，方便對照菜單。左下角是「資料：Visit Busan・KTO」，右下角是「© Mokaair 製圖 2026」。</desc>

