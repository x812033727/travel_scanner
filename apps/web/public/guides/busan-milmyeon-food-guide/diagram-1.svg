  <text x="70" y="236" font-size="23" font-weight="700" fill="#102A2B">물밀면　有湯的</text>
  <text x="70" y="270" font-size="16" fill="#5C6B6B">冰鎮的湯裡放麵</text>
  <text x="70" y="302" font-size="15" fill="#5C6B6B">湯用牛骨、豬骨或雞骨熬</text>

  <rect x="40" y="342" width="740" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
