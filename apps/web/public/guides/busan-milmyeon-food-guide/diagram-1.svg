  <text x="800" y="784" font-size="16" fill="#5C6B6B" text-anchor="middle">跟麵一起吃</text>
  <text x="800" y="814" font-size="15" fill="#5C6B6B" text-anchor="middle">吃得到爽脆的口感</text>

  <rect x="1080" y="700" width="480" height="136" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
