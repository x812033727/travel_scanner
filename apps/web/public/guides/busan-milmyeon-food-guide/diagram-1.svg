  <text x="70" y="464" font-size="15" fill="#5C6B6B">拌的是辣的양념장</text>

  <rect x="40" y="504" width="740" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="560" font-size="23" font-weight="700" fill="#102A2B">밀면　菜單只寫兩個字時</text>
