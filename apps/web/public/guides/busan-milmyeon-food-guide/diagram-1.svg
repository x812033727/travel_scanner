  <text x="1385" y="304" font-size="17" fill="#5C6B6B" text-anchor="middle">麵：蕎麥</text>
  <text x="1385" y="344" font-size="17" fill="#5C6B6B" text-anchor="middle">湯：牛胸肉或牛腱熬的冷湯</text>

  <line x1="1190" y1="180" x2="1190" y2="395" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="1190" cy="287" r="22" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="3"/>
  <text x="1190" y="295" font-size="22" font-weight="700" fill="#5C6B6B" text-anchor="middle">≠</text>

  <!-- emphasis banner -->
  <rect x="820" y="430" width="740" height="224" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1190" y="513" font-size="28" font-weight="700" fill="#0B4F4D" text-anchor="middle">不是同一道菜的兩種口味</text>
  <text x="1190" y="561" font-size="18" fill="#0B4F4D" text-anchor="middle">밀면的麵是小麥粉＋澱粉，냉면的麵是蕎麥</text>
  <text x="1190" y="597" font-size="18" fill="#0B4F4D" text-anchor="middle">湯的骨頭也不一樣</text>

  <!-- bottom row: what's usually in the bowl -->
  <text x="60" y="684" font-size="20" font-weight="700" fill="#102A2B">碗裡常見的幾樣</text>

  <rect x="40" y="700" width="480" height="136" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
  <text x="280" y="748" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">삶은 계란　水煮蛋</text>
