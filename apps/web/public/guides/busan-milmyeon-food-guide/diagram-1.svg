<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">釜山小麥冷麵菜單解碼圖 / How to read a Busan milmyeon menu</title>
  <desc id="desc">圖的標題是「菜單怎麼分？밀면跟냉면是兩道菜」，副標 Busan milmyeon: menu guide and how it differs from naengmyeon。左欄標題「菜單上只有兩種 What's on the menu」，下面一行「물밀면跟비빔밀면怎麼分」，再下面三格：물밀면是有湯的，冰鎮的湯裡放麵，湯用牛骨、豬骨或雞骨熬（KTO 料理頁）；비빔밀면是辣拌的，不加湯，拌辣醬，拌的是辣的양념장（KTO 料理頁、Visit Busan 專題）；밀면是菜單只寫兩個字時，旁邊有비빔밀면，這碗就是有湯的，常見於官方店家頁的菜單欄。右欄標題「밀면與냉면：官方分開列的兩道菜 Two different dishes, not one」，下面兩格並排、中間隔著一個不等於符號：밀면（小麥冷麵）的麵是小麥粉＋澱粉、嚼勁強，湯是牛骨、豬骨或雞骨熬的冷湯，出處寫 KTO 料理辭典 부산밀면頁；냉면（韓式冷麵）的麵是蕎麥，湯是牛胸肉或牛腱熬的冷湯，出處寫 KTO 料理辭典 냉면頁。兩格下方的橫幅寫「不是同一道菜的兩種口味」，밀면的麵是小麥粉＋澱粉，냉면的麵是蕎麥，湯的骨頭也不一樣，這是韓國觀光公社 KTO 料理辭典兩頁並列的結論。最下面一排標題「碗裡常見的幾樣 What's usually in the bowl」，三格：삶은 계란（水煮蛋）一般先吃掉，官方寫蛋能保護胃；무채（蘿蔔絲）跟麵一起吃，官方寫吃起來更爽脆；다대기(양념장)（辣醬）加多加少決定辣度，官方寫決定辣甜酸的程度。圖的最下方寫「菜單用語與碗裡配料整理自 Visit Busan 與韓國觀光公社（KTO）官方頁，逐店依據見正文表格。」，右下角標著 © Mokaair 製圖 2026。</desc>
