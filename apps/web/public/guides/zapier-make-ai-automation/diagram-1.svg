<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">同一條表單到試算表的流程，兩家各扣幾個單位 / Same form-to-spreadsheet flow: Zapier tasks vs Make credits</title>
  <desc id="desc">左右兩欄對照同一條自動化。左欄是 Zapier，計價單位是 task：觸發（表單有新回覆）0 個 task，AI by Zapier 摘要步驟用標準模型 1 個 task，試算表新增一列 1 個 task，每筆回覆合計 2 個 task；免費方案每月 100 個 task，而且 Zap 只能兩步。右欄是 Make，計價單位是 credits：觸發節點每次檢查 1 個 operation 等於 1 個 credit，AI 節點 1 個 credit 再加 token 換算的 credits，試算表節點 1 個 credit，每筆回覆合計 3 個 credits 起；免費方案每月最多 1,000 credits。結論是差別不在步數，而在觸發與 AI 步驟各家算不算、算幾個單位。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">同一條流程，兩家各扣幾個單位</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Same form-to-spreadsheet flow: Zapier tasks vs Make credits</text>

  <!-- column headers -->
  <rect x="160" y="112" width="520" height="58" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="420" y="150" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">Zapier：計價單位是 task</text>

  <rect x="920" y="112" width="520" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="150" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">Make：計價單位是 credits</text>

  <!-- Zapier steps -->
  <rect x="160" y="196" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="420" y="236" font-size="19" fill="#102A2B" text-anchor="middle">步驟一　觸發：表單有新回覆</text>
  <text x="420" y="268" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">0 個 task</text>

  <line x1="420" y1="300" x2="420" y2="326" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="160" y="330" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="420" y="370" font-size="19" fill="#102A2B" text-anchor="middle">步驟二　AI by Zapier 摘要與分類</text>
  <text x="420" y="402" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">1 個 task（標準模型）</text>

  <line x1="420" y1="434" x2="420" y2="460" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="160" y="464" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="420" y="504" font-size="19" fill="#102A2B" text-anchor="middle">步驟三　試算表新增一列</text>
  <text x="420" y="536" font-size="18" font-weight="bold" fill="#2F6F9F" text-anchor="middle">1 個 task</text>

  <line x1="420" y1="568" x2="420" y2="594" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="160" y="598" width="520" height="88" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="420" y="650" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">每筆回覆合計 2 個 task</text>

  <text x="420" y="722" font-size="17" fill="#5C6B6B" text-anchor="middle">免費方案每月 100 個 task</text>
  <text x="420" y="750" font-size="17" fill="#5C6B6B" text-anchor="middle">而且 Zap 只能兩步、沒有 AI by Zapier</text>

  <!-- Make steps -->
  <rect x="920" y="196" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="236" font-size="19" fill="#102A2B" text-anchor="middle">節點一　觸發：檢查表單新回覆</text>
  <text x="1180" y="268" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">1 個 operation 等於 1 個 credit</text>

  <line x1="1180" y1="300" x2="1180" y2="326" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="330" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="370" font-size="19" fill="#102A2B" text-anchor="middle">節點二　AI 節點摘要與分類</text>
  <text x="1180" y="402" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">1 個 credit 再加 token 換算</text>

  <line x1="1180" y1="434" x2="1180" y2="460" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="464" width="520" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="504" font-size="19" fill="#102A2B" text-anchor="middle">節點三　試算表新增一列</text>
  <text x="1180" y="536" font-size="18" font-weight="bold" fill="#0D6B68" text-anchor="middle">1 個 credit</text>

  <line x1="1180" y1="568" x2="1180" y2="594" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="598" width="520" height="88" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1180" y="650" font-size="22" font-weight="bold" fill="#102A2B" text-anchor="middle">每筆回覆合計 3 個 credits 起</text>

  <text x="1180" y="722" font-size="17" fill="#5C6B6B" text-anchor="middle">免費方案每月最多 1,000 credits</text>
  <text x="1180" y="750" font-size="17" fill="#5C6B6B" text-anchor="middle">最多 2 個啟用中的 scenario</text>

  <!-- takeaway band -->
  <rect x="160" y="778" width="1280" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="818" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">差別不在步數，在觸發與 AI 步驟各家算不算、算幾個單位</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
