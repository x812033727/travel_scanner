<title id="title">CISA 把 Zyxel GS1900 交換器漏洞列入已遭利用清單：先對型號，再對韌體版本</title><desc id="desc">原創插畫：畫面中央是一個代表交換器的簡化長方形幾何圖案，上面排著一列小圓點代表連接埠；長方形右側有一個放大鏡圖示疊在一段條碼狀色塊上，代表核對型號與版本；畫面左上角有一個時鐘圖示，指向兩個不同的刻度，代表兩個不同的日期；不呈現任何品牌標誌、商標或實際機身外觀</desc>
