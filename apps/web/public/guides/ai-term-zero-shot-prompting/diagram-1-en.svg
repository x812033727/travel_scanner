<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Clear Instructions, Even Without Examples</title>
<desc id="desc">Task instructions and a manual are given to the model without solved examples. Conditions and formatting are checked separately after output.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Clear Instructions, Even Without Examples</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Zero-shot Prompting · Manual Summary</text><path d="M530 280 H610 V410 H690" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><path d="M530 600 H610 V470 H690" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><path d="M1040 440 H1160" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"></path><rect x="90" y="190" width="440" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="310" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">Task instructions</text><text x="310" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">Keep order and warnings</text><rect x="90" y="510" width="440" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="310" y="592" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">Source document</text><text x="310" y="642" text-anchor="middle" font-size="25" fill="#5C6B6B">Machine instructions</text><rect x="700" y="350" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="870" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">Model summarizes</text><text x="870" y="482" text-anchor="middle" font-size="25" fill="#5C6B6B">No examples provided</text><rect x="1170" y="350" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1340" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">Human cross-check</text><text x="1340" y="482" text-anchor="middle" font-size="22" fill="#5C6B6B" style="font-size: 22px;">Check omissions and additions</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphic 2026</text>
</svg>
