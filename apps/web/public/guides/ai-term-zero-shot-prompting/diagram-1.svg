<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">沒有示範，也要有明確要求</title>
<desc id="desc">任務指示與說明書一起交給模型，沒有附已解答示範；輸出後分別檢查條件與格式。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">沒有示範，也要有明確要求</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Zero-shot Prompting · 說明書摘要</text><path d="M530 280 H610 V410 H690" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M530 600 H610 V470 H690" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1040 440 H1160" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="90" y="190" width="440" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="310" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">任務指示</text><text x="310" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">保留順序與警示</text><rect x="90" y="510" width="440" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="310" y="592" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">原始文件</text><text x="310" y="642" text-anchor="middle" font-size="25" fill="#5C6B6B">機器使用說明</text><rect x="700" y="350" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="870" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">模型整理</text><text x="870" y="482" text-anchor="middle" font-size="25" fill="#5C6B6B">未提供示範</text><rect x="1170" y="350" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1340" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">人工對照</text><text x="1340" y="482" text-anchor="middle" font-size="25" fill="#5C6B6B">檢查漏失與新增</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
