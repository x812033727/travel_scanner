<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本溫泉泡湯五步驟流程：脫衣、沖洗、入池、休息、更衣 / Onsen bathing in five steps</title>
  <desc id="desc">五個並排的步驟方框，由左到右用箭頭連接。第一步脫衣所：衣服放籃子或置物櫃，全裸進浴場，不能穿泳衣，長髮綁起來，只帶小毛巾。第二步洗い場沖洗：坐在小凳子上把全身洗乾淨、沖掉泡沫，蓮蓬頭朝下不要噴到別人。第三步入池：小毛巾摺好放頭上或池邊、不入池，頭不泡進水裡，不游泳、不跳水、不喧嘩、不拍照，一次大約 30 分鐘以內。第四步休息：起來喝水、休息再泡第二回，喝了酒不泡，身體不舒服就停。第五步更衣：進脫衣所前先把身體擦乾，換回浴衣，貴重品自己保管。下方的註記是刺青的三種做法：遮貼蓋住、錯開時段、貸切風呂，來自觀光廳 2016 年的事務連絡；規矩來源是 JNTO 與觀光廳。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">泡湯五步驟：脫衣 → 沖洗 → 入池 → 休息 → 更衣</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Onsen bathing in five steps · 規矩依 JNTO 與觀光廳的說明 · 2026 年 9 月 13 日查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 undress -->
  <rect x="60" y="140" width="272" height="540" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="140" width="272" height="86" rx="22" fill="#2F6F9F"/>
  <text x="196" y="178" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　脫衣</text>
  <text x="196" y="207" font-size="16" fill="#E6F0F7" text-anchor="middle">脱衣所 (Changing room)</text>
  <g font-size="17" fill="#102A2B">
    <text x="82" y="266">● 看暖簾的字：男湯／女湯</text>
    <text x="82" y="306">● 衣服放籃子或置物櫃</text>
    <text x="82" y="346">● 全裸進浴場，泳衣不能穿</text>
    <text x="82" y="386">● 長髮綁起來</text>
    <text x="82" y="426">● 只帶一條小毛巾進去</text>
    <text x="82" y="466">● 手機留在置物櫃，浴場不拍照</text>
  </g>

  <!-- step 2 wash -->
  <rect x="376" y="140" width="272" height="540" rx="22" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="376" y="140" width="272" height="86" rx="22" fill="#6B4A3A"/>
  <text x="512" y="178" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　沖洗</text>
  <text x="512" y="207" font-size="16" fill="#F1E8E2" text-anchor="middle">洗い場 (Wash first)</text>
  <g font-size="17" fill="#102A2B">
    <text x="398" y="266">● 坐在小凳子上洗</text>
    <text x="398" y="306">● 全身洗乾淨、沖掉泡沫</text>
    <text x="398" y="346">● 蓮蓬頭朝下，別噴到隔壁</text>
    <text x="398" y="386">● 用完把凳子、水桶沖乾淨</text>
    <text x="398" y="426">● 洗完才下池，這步不能跳</text>
  </g>

  <!-- step 3 soak -->
  <rect x="692" y="140" width="272" height="540" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="692" y="140" width="272" height="86" rx="22" fill="#0D6B68"/>
  <text x="828" y="178" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入池</text>
  <text x="828" y="207" font-size="16" fill="#E3F0EF" text-anchor="middle">入浴 (Soak)</text>
  <g font-size="17" fill="#102A2B">
    <text x="714" y="266">● 毛巾不入池：摺好放頭上</text>
    <text x="732" y="292">或池邊</text>
    <text x="714" y="332">● 頭不泡進水裡</text>
    <text x="714" y="372">● 不游泳、不跳水、不喧嘩</text>
    <text x="714" y="412">● 一次大約 30 分鐘以內</text>
    <text x="714" y="452">● 露天風呂一樣先洗再泡</text>
  </g>

  <!-- step 4 rest -->
  <rect x="1008" y="140" width="272" height="540" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="1008" y="140" width="272" height="86" rx="22" fill="#2E7D5B"/>
  <text x="1144" y="178" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　休息</text>
  <text x="1144" y="207" font-size="16" fill="#E7F2EC" text-anchor="middle">休憩 (Rest)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1030" y="266">● 起來坐著休息、喝水</text>
    <text x="1030" y="306">● 再泡第二回</text>
    <text x="1030" y="346">● 喝了酒不泡</text>
    <text x="1030" y="386">● 頭暈、不舒服就停</text>
    <text x="1030" y="426">● 小孩由家長陪同看好</text>
  </g>

  <!-- step 5 dress -->
  <rect x="1324" y="140" width="216" height="540" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1324" y="140" width="216" height="86" rx="22" fill="#D97A2B"/>
  <text x="1432" y="178" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　更衣</text>
  <text x="1432" y="207" font-size="16" fill="#FBEFE4" text-anchor="middle">更衣 (Dry and dress)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1344" y="266">● 進脫衣所前</text>
    <text x="1362" y="292">先擦乾身體</text>
    <text x="1344" y="332">● 換回浴衣：</text>
    <text x="1362" y="358">左襟在外</text>
    <text x="1344" y="398">● 補充水分</text>
    <text x="1344" y="438">● 貴重品自己保管</text>
  </g>

  <!-- arrows -->
  <path d="M 336 420 L 372 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 652 420 L 688 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 968 420 L 1004 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1284 420 L 1320 420" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- towel icon in step 3 -->
  <g fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="round">
    <rect x="770" y="520" width="116" height="60" rx="10"/>
    <line x1="790" y1="540" x2="866" y2="540"/>
    <line x1="790" y1="560" x2="866" y2="560"/>
  </g>
  <text x="828" y="612" font-size="16" fill="#0D6B68" text-anchor="middle">小毛巾放頭上，不下水</text>

  <!-- tattoo note -->
  <rect x="60" y="712" width="1480" height="118" rx="16" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="84" y="750" font-size="18" font-weight="700" fill="#B8442D">有刺青：觀光廳 2016 年給浴場的三種做法 (Tattoos)</text>
  <text x="84" y="782" font-size="17" fill="#8A2E1D">① 用遮貼蓋住，手掌大小的小刺青不用特別處理　② 錯開親子多的時段　③ 引導到貸切風呂或房內附浴池的客房</text>
  <text x="84" y="812" font-size="17" fill="#8A2E1D">訂房前先問旅館能不能進大浴場；不行就訂貸切風呂或部屋付露天，別賭現場。</text>

  <text x="1540" y="880" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
