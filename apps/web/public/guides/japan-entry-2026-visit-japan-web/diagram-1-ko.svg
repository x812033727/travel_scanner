<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">일본 입국 네 단계: 출발 전, 도착, 입국 심사, 세관(2026년 대만 여행자용)</title>
  <desc id="desc">네 단계. 출발 전: 신분증 번호가 기재된 대만 여권으로 무비자 90일 체류 가능. Visit Japan Web은 무료이며 계정, 여권, 입국 예정, 입국 심사 및 세관 신고, QR 코드의 다섯 단계로 진행. 2024년 1월 25일부터 QR 코드 하나로 두 절차를 함께 처리. 육류 제품과 신선한 과일은 가져오지 않기. 현금이 100만 엔을 초과하면 신고. digital.go.jp의 공식 웹사이트만 이용. 도착: 휴대폰에 QR 코드 표시. 일부 공항의 공용 KIOSK에서 여권 칩과 QR 코드를 읽어 한 번에 처리. VJW 미사용자는 종이 입국신고서와 세관신고서 작성. 하네다, 후쿠오카, 나하에서는 수하물을 기다리는 동안 전자신고 기기 이용 가능. 입국 심사: 여권과 QR 코드 또는 종이 입국신고서 제출. 법령에 따른 면제 대상 외에는 지문과 얼굴 사진 제공. 여권에 상륙 허가 스티커 부착. VJW 면세 쇼핑 QR 코드를 사용할 때만 스티커 스캔 필요. 세관: 모두 신고해야 하며 종이 신고서는 한 사람당 한 장, 가족은 한 장. 또는 QR 코드로 전자신고 통로 이용. 면세 한도는 주류 3병, 궐련 200개비, 향수 2온스, 기타 물품 20만 엔. 20세 미만은 주류·담배 면세 한도 없음. 육류 제품과 과일은 동물검역·식물검역 창구로 이동. 하단에는 JESTA가 아직 시행되지 않았으며 2028년도 도입이 목표이고, 면세 구매 QR 코드도 Visit Japan Web에서 이용한다는 안내가 있음.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">일본 입국 네 단계: 대만 여행자 2026년판</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">일본 입국 네 단계 · 2026년 9월 디지털청·출입국재류관리청·외무성·세관·동물검역소 공식 사이트 확인</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>


  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"></rect>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"></rect>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　출발 전</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">출발 전(Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● 신분증 번호가 기재된 여권</text>
    <text x="104" y="296">→ 무비자 90일 체류</text>
    <text x="86" y="340">● Visit Japan Web 무료:</text>
    <text x="104" y="366">계정 → 여권 → 입국 예정</text>
    <text x="104" y="392">→ 입국 심사·세관 신고 → QR</text>
    <text x="86" y="436">● QR 코드 하나로 두 절차 처리</text>
    <text x="104" y="462">(2024년 1월 25일부터)</text>
    <text x="86" y="506">● 육류 제품·신선한 과일 금지</text>
    <text x="86" y="550">● 현금 100만 엔 초과 시 신고</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"></rect>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">digital.go.jp 공식 사이트만 이용</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">QR 발급에 돈을 요구하면 가짜</text>


  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"></rect>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"></rect>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　도착</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">도착(Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● 휴대폰으로 Visit Japan Web 열기</text>
    <text x="484" y="296">QR 코드 표시(컴퓨터로 등록해도</text>
    <text x="484" y="322">휴대폰이나 태블릿에 표시)</text>
    <text x="466" y="366">● 일부 공항에 공용 KIOSK:</text>
    <text x="484" y="392">여권 칩＋QR 코드로 한 번에 처리</text>
    <text x="466" y="436">● VJW 미사용: 기내에서 종이</text>
    <text x="484" y="462">입국신고서·세관신고서 작성</text>
    <text x="466" y="506">● 하네다·후쿠오카·나하:</text>
    <text x="484" y="532">수하물 대기 중 전자신고 기기 이용</text>
  </g>

  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12"></rect>
    <rect x="590" y="620" width="40" height="40" rx="4"></rect>
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round"></line>
  </g>


  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"></rect>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"></rect>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　입국 심사</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">입국 심사(Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● 여권＋QR 코드 제출</text>
    <text x="864" y="296">또는 종이 입국신고서</text>
    <text x="846" y="340">● 지문과 얼굴 사진 제공</text>
    <text x="864" y="366">(법령에 따른 면제 대상 제외)</text>
    <text x="846" y="410">● 여권에 상륙 허가 스티커 부착,</text>
    <text x="864" y="436">VJW로 스캔해 면세 QR 발급 가능</text>
    <text x="846" y="480">● 이후 → 수하물 찾기</text>
  </g>

  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34"></path>
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52"></path>
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68"></path>
  </g>


  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"></rect>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"></rect>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　세관</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">세관(Customs)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● 모두 신고: 종이 신고서는</text>
    <text x="1244" y="296">1인 1장(가족 1장),</text>
    <text x="1244" y="322">또는 QR로 전자신고 통로 이용</text>
    <text x="1226" y="366">● 면세 한도: 주류 3병,</text>
    <text x="1244" y="392">궐련 200개비, 향수 2온스,</text>
    <text x="1244" y="418">기타 물품 20만 엔</text>
    <text x="1226" y="462">● 20세 미만은 주류·담배 한도 없음</text>
    <text x="1226" y="506">● 육류 제품·과일:</text>
    <text x="1244" y="532">동물검역·식물검역 창구</text>
    <text x="1226" y="576">● 세관 통과 → 공항 교통</text>
  </g>


  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>

  <text x="60" y="790" font-size="16" fill="#5C6B6B" style="font-size: 16px;">JESTA 전자여행인증은 아직 미시행: 법무성은 2028년도 내 도입을 목표로 하며, 대만 여행자는 현재 어떤 전자 허가도 신청할 필요가 없습니다. 공식 일정은 출입국재류관리청 공지를 기준으로 합니다.</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">면세 구매 QR 코드도 Visit Japan Web에서 이용하며, 입국 후 여권의 상륙 허가 스티커를 스캔해야 발급할 수 있습니다. 종이 입국신고서와 세관신고서도 여전히 사용할 수 있습니다.</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 도표 제작 2026</text>
</svg>
