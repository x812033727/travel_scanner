<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">入境日本四步流程：行前、落地、入境审查、海关（2026 年台湾旅客版）</title>
  <desc id="desc">四个步骤。行前：护照载有身份证号码可免签 90 天；Visit Japan Web 免费，账号、护照、预计入境信息、入境审查及海关申报、QR 码五步，2024 年 1 月 25 日起一个 QR 码同时办理两项手续；肉制品与新鲜水果不要携带；现金超过 100 万日元要申报；只使用 digital.go.jp 的官方网站。落地：手机显示 QR 码；部分机场有共用 KIOSK，读取护照芯片与 QR 码一次完成；未使用 VJW 的人填写纸质入境卡与海关申报书；羽田、福冈、那霸可以在等行李时先使用电子申报设备。入境审查：提交护照与 QR 码或纸质入境卡，提供指纹与面部照片，法律规定的豁免对象除外，护照贴上登陆许可，只有使用 VJW 免税购物 QR 码时才需要扫描贴纸。海关：每个人都要申报，纸质表格每人一张、家庭一张，或用 QR 码走电子申报通道；免税范围为酒 3 瓶、卷烟 200 支、香水 2 盎司、其他物品 20 万日元，未满 20 岁没有酒烟额度；肉制品与水果需到动物检疫、植物检疫柜台。下方注明 JESTA 尚未实施，目标为 2028 年度，免税购物的 QR 码也在 Visit Japan Web。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">入境日本四步：台湾旅客 2026 年版</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">入境日本四步流程 · 2026 年 9 月依据数字厅、出入国在留管理厅、外务省、海关、动物检疫所官网查证</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>


  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6" />
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F" />
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">行前 (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● 护照载有身份证号码</text>
    <text x="104" y="296">→ 免签停留 90 天</text>
    <text x="86" y="340">● Visit Japan Web 免费：</text>
    <text x="104" y="366">账号 → 护照 → 预计入境</text>
    <text x="104" y="392">→ 入境审查及海关申报 → QR</text>
    <text x="86" y="436">● 一个 QR 码同时办两项手续</text>
    <text x="104" y="462">（2024 年 1 月 25 日起）</text>
    <text x="86" y="506">● 肉制品、新鲜水果不要带</text>
    <text x="86" y="550">● 现金超过 100 万日元要申报</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3" />
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">只用 digital.go.jp 的官方网站</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">要求付费生成 QR 码的都是假的</text>


  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6" />
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A" />
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　落地</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">到达 (Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● 手机打开 Visit Japan Web</text>
    <text x="484" y="296">显示 QR 码（电脑登记也要</text>
    <text x="484" y="322">在手机或平板上显示）</text>
    <text x="466" y="366">● 部分机场有共用 KIOSK：</text>
    <text x="484" y="392">护照芯片＋QR 码一次完成</text>
    <text x="466" y="436">● 未用 VJW：机上填写纸质</text>
    <text x="484" y="462">入境卡与海关申报书</text>
    <text x="466" y="506">● 羽田、福冈、那霸：</text>
    <text x="484" y="532">等行李时先用电子申报设备</text>
  </g>

  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12" />
    <rect x="590" y="620" width="40" height="40" rx="4" />
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round" />
  </g>


  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6" />
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B" />
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入境审查</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">入境审查 (Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● 提交护照＋QR 码</text>
    <text x="864" y="296">或纸质入境卡</text>
    <text x="846" y="340">● 提供指纹与面部照片</text>
    <text x="864" y="366">（法律规定的豁免对象除外）</text>
    <text x="846" y="410">● 护照贴上登陆许可贴纸，</text>
    <text x="864" y="436">可用 VJW 扫描生成免税 QR</text>
    <text x="846" y="480">● 之后 → 领取行李</text>
  </g>

  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34" />
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52" />
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68" />
  </g>


  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6" />
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B" />
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　海关</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">海关 (Customs)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● 每个人都要申报：纸质</text>
    <text x="1244" y="296">1 人 1 张（家庭 1 张），</text>
    <text x="1244" y="322">或用 QR 码走电子申报通道</text>
    <text x="1226" y="366">● 免税范围：酒 3 瓶、</text>
    <text x="1244" y="392">卷烟 200 支、香水 2 盎司、</text>
    <text x="1244" y="418">其他物品 20 万日元</text>
    <text x="1226" y="462">● 未满 20 岁没有酒烟额度</text>
    <text x="1226" y="506">● 肉制品、水果：</text>
    <text x="1244" y="532">动物检疫、植物检疫柜台</text>
    <text x="1226" y="576">● 通关 → 机场交通</text>
  </g>


  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)" />

  <text x="60" y="790" font-size="18" fill="#5C6B6B">JESTA 电子旅行认证尚未实施：法务省目标为 2028 年度内引入，台湾旅客目前不用申请任何电子许可，正式时间安排以出入国在留管理厅公告为准。</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">免税购物的 QR 码也在 Visit Japan Web，入境后扫描护照上的登陆许可贴纸才能生成；纸质入境卡与申报书仍可使用。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 制图 2026</text>
</svg>
