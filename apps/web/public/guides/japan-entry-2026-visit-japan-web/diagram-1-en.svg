<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Entering Japan in four steps: before departure, arrival, immigration and customs (2026 edition for Taiwan travelers)</title>
  <desc id="desc">Four steps. Pre-departure: Taiwan passport with national ID number: 90 days visa-free. Visit Japan Web is free; five steps: account, passport, planned entry, immigration/customs declaration, QR code. One QR covers both from 2024/1/25. No meat products or fresh fruit. Declare cash over 100 ten-thousand yen. Use only the official digital.go.jp site. Arrival: show QR on phone. Shared KIOSKs at some airports read passport chip + QR in one go. Without VJW, fill in paper arrival and customs forms. At Haneda, Fukuoka and Naha, use electronic declaration terminals while waiting for bags. Immigration: present passport + QR or paper arrival card; provide fingerprints and a facial photo unless legally exempt. Passport gets a landing permission sticker; scan it only to use VJW's tax-free shopping QR. Customs: all must declare; one paper form per person or family, or QR via electronic declaration lanes. Duty-free: 3 alcohol bottles, 200 cigarettes, 2 ounces of perfume, other goods up to 20 ten-thousand yen; no alcohol/tobacco allowance under 20. Take meat products/fruit to animal/plant quarantine counters. Notes: JESTA is not yet in force; target: fiscal 2028. Tax-free shopping QR is also in Visit Japan Web.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">Japan entry in four steps: Taiwan travelers, 2026 edition</text>
  <text x="60" y="98" font-size="17" fill="#5C6B6B" style="font-size: 17px;">Entering Japan in four steps · Verified in 2026/9 against official Digital Agency, Immigration Services Agency, Foreign Ministry, Customs and Animal Quarantine Service websites</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>


  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"></rect>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"></rect>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　Before departure</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">Before departure</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● Passport with national ID number</text>
    <text x="104" y="296">→ 90 days visa-free</text>
    <text x="86" y="340">● Visit Japan Web is free:</text>
    <text x="104" y="366">Account → Passport → Entry plan</text>
    <text x="104" y="392">→ Immigration/customs form → QR</text>
    <text x="86" y="436">● One QR covers both procedures</text>
    <text x="104" y="462">(Since 2024/1/25)</text>
    <text x="86" y="506">● No meat products or fresh fruit</text>
    <text x="86" y="550" font-size="15" style="font-size: 15px;">● Declare cash over 100 ten-thousand yen</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"></rect>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">Only the official digital.go.jp site</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">Paid VJW QR-code sites are fake</text>


  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"></rect>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"></rect>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　Arrival</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">Arrival</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● Open Visit Japan Web on phone</text>
    <text x="484" y="296">Show QR (even if registered on a PC,</text>
    <text x="484" y="322">display it on a phone or tablet)</text>
    <text x="466" y="366">● Shared KIOSKs at some airports:</text>
    <text x="484" y="392">Passport chip + QR: both in one go</text>
    <text x="466" y="436">● No VJW: fill in paper forms on board</text>
    <text x="484" y="462">Arrival card + customs form</text>
    <text x="466" y="506">● Haneda, Fukuoka, Naha:</text>
    <text x="484" y="532">Baggage wait: e-declaration kiosk</text>
  </g>

  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12"></rect>
    <rect x="590" y="620" width="40" height="40" rx="4"></rect>
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round"></line>
  </g>


  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"></rect>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"></rect>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　Immigration</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">Immigration</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● Present passport + QR code</text>
    <text x="864" y="296">or paper arrival card</text>
    <text x="846" y="340" font-size="15" style="font-size: 15px;">● Provide fingerprints and a facial photo</text>
    <text x="864" y="366">(Unless legally exempt)</text>
    <text x="846" y="410">● Passport: landing permit sticker;</text>
    <text x="864" y="436" font-size="15" style="font-size: 15px;">scan in VJW for a tax-free shopping QR</text>
    <text x="846" y="480">● Next → Collect baggage</text>
  </g>

  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34"></path>
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52"></path>
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68"></path>
  </g>


  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"></rect>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"></rect>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　Customs</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">Customs</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● Everyone declares: paper form,</text>
    <text x="1244" y="296">1 person, 1 form (1 per family),</text>
    <text x="1244" y="322">or QR via electronic declaration lane</text>
    <text x="1226" y="366">● Duty-free: 3 alcohol bottles,</text>
    <text x="1244" y="392">200 cigarettes, 2 ounces of perfume,</text>
    <text x="1244" y="418">other goods: 20 ten-thousand yen</text>
    <text x="1226" y="462" font-size="15" style="font-size: 15px;">● Under 20: no alcohol/tobacco allowance</text>
    <text x="1226" y="506">● Meat products and fruit:</text>
    <text x="1244" y="532">Animal/plant quarantine counters</text>
    <text x="1226" y="576">● Clear customs → Airport transport</text>
  </g>


  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>

  <text x="60" y="790" font-size="16" fill="#5C6B6B" style="font-size: 16px;">JESTA electronic travel authorization is not in force. Justice Ministry target: fiscal 2028. Taiwan travelers need no electronic permit now. Timing follows Immigration Services Agency announcements.</text>
  <text x="60" y="822" font-size="16" fill="#5C6B6B" style="font-size: 16px;">The tax-free shopping QR code is also in Visit Japan Web; generate it after entry by scanning your passport's landing permission sticker. Paper arrival cards and customs forms remain valid.</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair diagram 2026</text>
</svg>
