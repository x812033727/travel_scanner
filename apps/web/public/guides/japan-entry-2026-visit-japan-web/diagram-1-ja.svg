<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本入国の四つの手順：出発前、到着、入国審査、税関（2026 年・台湾からの旅行者向け）</title>
  <desc id="desc">四つの手順。出発前：台湾の身分証番号が記載されたパスポートなら 90 日間ビザ免除。Visit Japan Web は無料で、アカウント、パスポート、入国予定、入国審査および税関申告、QR コードの五段階。2024 年 1 月 25 日から一つの QR コードが両方の手続きに対応。肉製品と生鮮果物は持ち込まない。100 万円を超える現金は申告が必要。digital.go.jp の公式サイトだけを利用。到着：スマートフォンで QR コードを表示。一部の空港には共同利用 KIOSK があり、パスポートの IC チップと QR コードを読み取って一度に手続き。VJW を使わない人は紙の入国カードと税関申告書を記入。羽田、福岡、那覇では荷物を待つ間に電子申告端末を利用可能。入国審査：パスポートと QR コードか紙の入国カードを提出し、指紋と顔写真を提供。法令上の免除対象者は除外。パスポートに上陸許可のシールが貼られ、VJW の免税購入用 QR コードを使う場合にのみシールの読み取りが必要。税関：全員が申告。紙は一人一枚、家族で一枚、または QR コードを使って電子申告ゲートへ。免税範囲は酒類 3 本、紙巻きたばこ 200 本、香水 2 オンス、その他の物品 20 万円。20 歳未満は酒類とたばこの免税枠なし。肉製品と果物は動物検疫・植物検疫カウンターへ。下部には、JESTA は未導入で 2028 年度が目標であることと、免税購入用 QR コードも Visit Japan Web にあることを記載。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本入国の四つの手順：台湾からの旅行者向け 2026 年版</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">日本入国の四つの手順 · 2026 年 9 月、デジタル庁、出入国在留管理庁、外務省、税関、動物検疫所の公式サイトで確認</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"></path></marker>
  </defs>


  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"></rect>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"></rect>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　出発前</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">出発前 (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● 身分証番号記載のパスポート</text>
    <text x="104" y="296">→ ビザなしで 90 日間滞在</text>
    <text x="86" y="340">● Visit Japan Web は無料：</text>
    <text x="104" y="366">アカウント → パスポート → 入国予定</text>
    <text x="104" y="392">→ 入国審査・税関申告 → QR</text>
    <text x="86" y="436">● 一つの QR で両方の手続き</text>
    <text x="104" y="462">（2024 年 1 月 25 日から）</text>
    <text x="86" y="506">● 肉製品・生鮮果物は持ち込まない</text>
    <text x="86" y="550">● 現金 100 万円超は申告が必要</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"></rect>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">digital.go.jp の公式サイトのみ利用</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">QR 発行に料金を求めるものは全て偽物</text>


  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"></rect>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"></rect>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　到着</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">到着 (Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● スマホで Visit Japan Web を開く</text>
    <text x="484" y="296">QR コードを表示（PC 登録でも</text>
    <text x="484" y="322">スマホかタブレットで表示）</text>
    <text x="466" y="366">● 一部空港に共同利用 KIOSK：</text>
    <text x="484" y="392" font-size="15" style="font-size: 15px;">パスポート IC チップ＋QR で一度に手続き</text>
    <text x="466" y="436">● VJW 未利用：機内で紙に記入</text>
    <text x="484" y="462">入国カードと税関申告書</text>
    <text x="466" y="506">● 羽田・福岡・那覇：</text>
    <text x="484" y="532">荷物待ちの間に電子申告端末を利用</text>
  </g>

  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12"></rect>
    <rect x="590" y="620" width="40" height="40" rx="4"></rect>
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round"></line>
  </g>


  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"></rect>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"></rect>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入国審査</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">入国審査 (Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● パスポート＋QR コードを提示</text>
    <text x="864" y="296">または紙の入国カード</text>
    <text x="846" y="340">● 指紋と顔写真を提供</text>
    <text x="864" y="366">（法令上の免除対象者を除く）</text>
    <text x="846" y="410">● パスポートに上陸許可シール、</text>
    <text x="864" y="436">VJW で読み取り免税 QR を作成可能</text>
    <text x="846" y="480">● その後 → 荷物受け取り</text>
  </g>

  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34"></path>
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52"></path>
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68"></path>
  </g>


  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"></rect>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"></rect>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　税関</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">税関 (Customs)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● 全員が申告：紙は</text>
    <text x="1244" y="296">1 人 1 枚（家族で 1 枚）、</text>
    <text x="1244" y="322">または QR で電子申告ゲートへ</text>
    <text x="1226" y="366">● 免税範囲：酒類 3 本、</text>
    <text x="1244" y="392">紙巻きたばこ 200 本、香水 2 オンス、</text>
    <text x="1244" y="418">その他の物品 20 万円</text>
    <text x="1226" y="462">● 20 歳未満は酒・たばこの免税枠なし</text>
    <text x="1226" y="506">● 肉製品・果物：</text>
    <text x="1244" y="532">動物検疫・植物検疫カウンターへ</text>
    <text x="1226" y="576">● 税関通過 → 空港からの交通</text>
  </g>


  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"></path>

  <text x="60" y="790" font-size="16" fill="#5C6B6B" style="font-size: 16px;">電子渡航認証 JESTA は未導入。法務省は 2028 年度内の導入を目指しており、台湾からの旅行者は現在、電子渡航許可の申請は不要です。正式な日程は出入国在留管理庁の発表に従ってください。</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">免税購入用 QR コードも Visit Japan Web にあります。入国後、パスポートの上陸許可シールを読み取って作成します。紙の入国カードと申告書も引き続き使用できます。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 作図 2026</text>
</svg>
