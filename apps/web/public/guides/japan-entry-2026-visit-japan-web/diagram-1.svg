<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">入境日本四步流程：行前、落地、入境審查、海關（2026 年台灣旅客版）</title>
  <desc id="desc">四個步驟。行前：護照載有身分證字號可免簽 90 天；Visit Japan Web 免費，帳號、護照、入境預定、入境審查及海關申報、QR 碼五步，2024 年 1 月 25 日起一個 QR 碼同時辦兩件事；肉製品與新鮮水果不要帶；現金超過 100 萬日圓要申報；只用 digital.go.jp 的官方網站。落地：手機顯示 QR 碼；部分機場有共用 KIOSK 讀護照晶片與 QR 碼一次完成；沒用 VJW 的人填紙本入境卡與海關申告書；羽田、福岡、那霸可以在等行李時先用電子申報裝置。入境審查：交護照與 QR 碼或紙本入境卡，提供指紋與臉部照片，法令免除者除外，護照貼上陸許可之後免稅要掃。海關：每個人都要申報，紙本一人一張、家族一張，或 QR 碼走電子申報通道；免稅範圍酒 3 瓶、紙菸 200 支、香水 2 盎司、其他物品 20 萬日圓，未滿 20 歲沒有酒菸額度；肉製品與水果到動物檢疫、植物檢疫櫃台。底下註記 JESTA 尚未實施、目標 2028 年度，免稅購買的 QR 碼也在 Visit Japan Web。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">入境日本四步：台灣旅客 2026 年版</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">Entering Japan in four steps · 2026 年 9 月依數位廳、出入國在留管理廳、外務省、海關、動物檢疫所官網查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="140" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="230" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="230" y="208" font-size="16" fill="#E6F0F7" text-anchor="middle">出発前 (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="86" y="270">● 護照載有身分證字號</text>
    <text x="104" y="296">→ 免簽停留 90 天</text>
    <text x="86" y="340">● Visit Japan Web 免費：</text>
    <text x="104" y="366">帳號 → 護照 → 入境預定</text>
    <text x="104" y="392">→ 入境審查及海關申報 → QR</text>
    <text x="86" y="436">● 一個 QR 碼同時辦兩件事</text>
    <text x="104" y="462">（2024 年 1 月 25 日起）</text>
    <text x="86" y="506">● 肉製品、新鮮水果不要帶</text>
    <text x="86" y="550">● 現金超過 100 萬日圓要申報</text>
  </g>
  <rect x="82" y="600" width="296" height="90" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="636" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">只用 digital.go.jp 的官方網站</text>
  <text x="230" y="664" font-size="15" fill="#8A2E1D" text-anchor="middle">要求付費產生 QR 碼的都是假的</text>

  <!-- step 2 -->
  <rect x="440" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <rect x="440" y="140" width="340" height="88" rx="24" fill="#6B4A3A"/>
  <text x="610" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　落地</text>
  <text x="610" y="208" font-size="16" fill="#F1E8E2" text-anchor="middle">到着 (Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="466" y="270">● 手機開 Visit Japan Web</text>
    <text x="484" y="296">顯示 QR 碼（電腦登錄也要</text>
    <text x="484" y="322">在手機或平板上顯示）</text>
    <text x="466" y="366">● 部分機場有共用 KIOSK：</text>
    <text x="484" y="392">護照晶片＋QR 碼一次完成</text>
    <text x="466" y="436">● 沒用 VJW：機上填紙本</text>
    <text x="484" y="462">入境卡與海關申告書</text>
    <text x="466" y="506">● 羽田、福岡、那霸：</text>
    <text x="484" y="532">等行李時先用電子申報裝置</text>
  </g>
  <!-- phone icon -->
  <g fill="none" stroke="#6B4A3A" stroke-width="4">
    <rect x="570" y="590" width="80" height="120" rx="12"/>
    <rect x="590" y="620" width="40" height="40" rx="4"/>
    <line x1="600" y1="690" x2="620" y2="690" stroke-linecap="round"/>
  </g>

  <!-- step 3 -->
  <rect x="820" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="140" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入境審查</text>
  <text x="990" y="208" font-size="16" fill="#E7F2EC" text-anchor="middle">入国審査 (Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="846" y="270">● 交護照＋QR 碼</text>
    <text x="864" y="296">或紙本入境卡</text>
    <text x="846" y="340">● 提供指紋與臉部照片</text>
    <text x="864" y="366">（法令免除對象除外）</text>
    <text x="846" y="410">● 護照貼上陸許可貼紙，</text>
    <text x="864" y="436">之後免稅購物要用 VJW 掃</text>
    <text x="846" y="480">● 之後 → 領行李</text>
  </g>
  <!-- fingerprint icon -->
  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 600 m -44 0 a 44 44 0 0 1 88 0 v 34"/>
    <path d="M 990 600 m -28 0 a 28 28 0 0 1 56 0 v 52"/>
    <path d="M 990 600 m -12 0 a 12 12 0 0 1 24 0 v 68"/>
  </g>

  <!-- step 4 -->
  <rect x="1200" y="140" width="340" height="590" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="140" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="178" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　海關</text>
  <text x="1370" y="208" font-size="16" fill="#FBEFE4" text-anchor="middle">税関 (Customs)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1226" y="270">● 每個人都要申報：紙本</text>
    <text x="1244" y="296">1 人 1 張（家族 1 張），</text>
    <text x="1244" y="322">或 QR 碼走電子申報通道</text>
    <text x="1226" y="366">● 免稅範圍：酒 3 瓶、</text>
    <text x="1244" y="392">紙菸 200 支、香水 2 盎司、</text>
    <text x="1244" y="418">其他物品 20 萬日圓</text>
    <text x="1226" y="462">● 未滿 20 歲沒有酒菸額度</text>
    <text x="1226" y="506">● 肉製品、水果：</text>
    <text x="1244" y="532">動物檢疫、植物檢疫櫃台</text>
    <text x="1226" y="576">● 出關 → 機場交通</text>
  </g>

  <!-- arrows -->
  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="790" font-size="18" fill="#5C6B6B">JESTA 電子渡航認證尚未實施：法務省目標 2028 年度內導入，台灣旅客現在不用申請任何電子許可，正式時程以出入國在留管理廳公告為準。</text>
  <text x="60" y="822" font-size="18" fill="#5C6B6B">免稅購買的 QR 碼也在 Visit Japan Web，入境後掃護照上的上陸許可貼紙才能產生；紙本入境卡與申告書仍然可用。</text>
  <text x="1590" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
