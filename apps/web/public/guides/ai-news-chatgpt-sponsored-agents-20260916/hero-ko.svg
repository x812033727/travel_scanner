<title id="title">ChatGPT 광고에 Sponsored Agents 추가: 미국에서 테스트 중, 대만은 공식 시장 목록에 미포함</title><desc id="desc">오리지널 일러스트: 왼쪽은 말풍선 아이콘 안에 한층 작은 말풍선이 겹쳐 있어 따로 열린 스폰서 대화를 나타내며, 점선이 두 말풍선을 나누고 있다. 오른쪽은 크기가 큰 것에서 작은 것 순으로 배열된 3단 깔때기 모양으로, 요금제와 지역이 누가 광고를 보는지를 걸러낸다는 것을 나타낸다.</desc>
