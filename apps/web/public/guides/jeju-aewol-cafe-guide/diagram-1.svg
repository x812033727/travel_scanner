<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif"><title id="t">涯月咖啡店官方特色示意圖</title><desc id="d">示意圖，非比例。四家涯月咖啡店以官方地址道路與官方文字支持的海景與網美類型排列。</desc><rect width="1600" height="900" fill="#f5f1e9"/><text x="800" y="70" text-anchor="middle" font-size="36" font-weight="bold" fill="#173a4a">涯月咖啡店官方特色示意圖</text><text x="800" y="105" text-anchor="middle" font-size="20" fill="#526671">示意圖，非比例・只標官方頁寫得出的特色</text><path d="M120 470 C400 390 520 520 780 430 S1200 370 1480 470" fill="none" stroke="#4b9cc1" stroke-width="35"/><text x="800" y="490" text-anchor="middle" font-size="25" fill="#183d4b">濟州海岸</text><g fill="#fff" stroke="#173a4a" stroke-width="3"><rect x="110" y="210" width="300" height="150" rx="20"/><rect x="470" y="210" width="300" height="150" rx="20"/><rect x="830" y="210" width="300" height="150" rx="20"/><rect x="1190" y="210" width="300" height="150" rx="20"/></g><g text-anchor="middle" fill="#173a4a"><text x="260" y="260" font-size="27" font-weight="bold">애월더선셋</text><text x="260" y="300" font-size="20">애월읍 일주서로</text><text x="260" y="335" font-size="19">海景・網美</text><text x="620" y="260" font-size="27" font-weight="bold">봄날</text><text x="620" y="300" font-size="20">애월읍 애월로1길</text><text x="620" y="335" font-size="19">海景</text><text x="980" y="260" font-size="27" font-weight="bold">애월 전당포</text><text x="980" y="300" font-size="20">애월읍 애월로</text><text x="980" y="335" font-size="19">網美・手沖選豆*</text><text x="1340" y="260" font-size="27" font-weight="bold">노을리</text><text x="1340" y="300" font-size="20">애월읍 애월해안로</text><text x="1340" y="335" font-size="19">海景・網美</text></g><g fill="#173a4a"><text x="110" y="630" font-size="25" font-weight="bold">圖例</text><circle cx="145" cy="680" r="13" fill="#3e8fb2"/><text x="175" y="688" font-size="22">海景：官方寫明看得到海</text><circle cx="610" cy="680" r="13" fill="#db7e42"/><text x="640" y="688" font-size="22">網美：官方描述具體空間特色</text><circle cx="1110" cy="680" r="13" fill="#3b7c66"/><text x="1140" y="688" font-size="22">手沖選豆：個別店家特色</text><text x="110" y="760" font-size="21">* 手沖選豆不等於本批咖啡品質標籤；官方沒有寫自家烘焙或賽事資歷。</text><text x="110" y="820" font-size="19">資料：Visit Jeju 官方頁，2026 年 9 月查證。 © Mokaair</text></g></svg>
