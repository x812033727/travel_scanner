<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','Noto Sans KR',sans-serif"><title id="t">涯月咖啡店特色示意圖</title><desc id="d">圖上的標題是「涯月咖啡店特色示意圖」，副標是「示意圖，非比例・照地址的路名排」。一條標著「濟州海岸」的藍色海岸線橫過圖面，四家店在線的上方排成四張卡片，每張寫店名、地址的路名與類型：애월더선셋（애월읍 일주서로）標「海景・網美」，봄날（애월읍 애월로1길）標「海景」，애월 전당포（애월읍 애월로）標「網美・手沖選豆」，노을리（애월읍 애월해안로）標「海景・網美」。左下角的圖例列出三個類型：藍色的海景、橘色的網美與綠色的手沖選豆，下面一行註明店名與路名照韓文寫，方便對照招牌與地圖。最下面一行是「資料：Visit Jeju・© Mokaair 製圖 2026」。</desc><rect width="1600" height="900" fill="#f5f1e9"/><text x="800" y="70" text-anchor="middle" font-size="36" font-weight="bold" fill="#173a4a">涯月咖啡店特色示意圖</text><text x="800" y="105" text-anchor="middle" font-size="20" fill="#526671">示意圖，非比例・照地址的路名排</text><path d="M120 470 C400 390 520 520 780 430 S1200 370 1480 470" fill="none" stroke="#4b9cc1" stroke-width="35"/><text x="800" y="490" text-anchor="middle" font-size="25" fill="#183d4b">濟州海岸</text><g fill="#fff" stroke="#173a4a" stroke-width="3"><rect x="110" y="210" width="300" height="150" rx="20"/><rect x="470" y="210" width="300" height="150" rx="20"/><rect x="830" y="210" width="300" height="150" rx="20"/><rect x="1190" y="210" width="300" height="150" rx="20"/></g><g text-anchor="middle" fill="#173a4a"><text x="260" y="260" font-size="27" font-weight="bold">애월더선셋</text><text x="260" y="300" font-size="20">애월읍 일주서로</text><text x="260" y="335" font-size="19">海景・網美</text><text x="620" y="260" font-size="27" font-weight="bold">봄날</text><text x="620" y="300" font-size="20">애월읍 애월로1길</text><text x="620" y="335" font-size="19">海景</text><text x="980" y="260" font-size="27" font-weight="bold">애월 전당포</text><text x="980" y="300" font-size="20">애월읍 애월로</text><text x="980" y="335" font-size="19">網美・手沖選豆</text><text x="1340" y="260" font-size="27" font-weight="bold">노을리</text><text x="1340" y="300" font-size="20">애월읍 애월해안로</text><text x="1340" y="335" font-size="19">海景・網美</text></g><g fill="#173a4a"><text x="110" y="630" font-size="25" font-weight="bold">圖例</text><circle cx="145" cy="680" r="13" fill="#3e8fb2"/><text x="175" y="688" font-size="22">海景</text><circle cx="330" cy="680" r="13" fill="#db7e42"/><text x="360" y="688" font-size="22">網美</text><circle cx="520" cy="680" r="13" fill="#3b7c66"/><text x="550" y="688" font-size="22">手沖選豆</text><text x="110" y="760" font-size="21">店名與路名照韓文寫，方便對照招牌與地圖</text><text x="110" y="820" font-size="19">資料：Visit Jeju・© Mokaair 製圖 2026</text></g></svg>
