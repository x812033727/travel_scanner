<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>청차우에서 천천히 걷는 하루: 부두에서 해안과 골목까지, 돌아갈 배편부터 정하고 추가 코스 고르기: 판단 절차</title><desc>순서대로 확인하세요: 왕복 배편 확인, 부두를 기준으로 위치 파악, 추가 코스 하나 선택, 해안으로 일찍 돌아오기. 편집부가 정리한 안내이며, 지도나 실측 시간 정보가 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">여건에 맞춰 선택하고, 한 번에 모두 할 필요는 없어요</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">왕복 배편 확인</text><text x="103" y="497" fill="#f4f0e5" font-size="23">가는 편·오는 편 확인</text><text x="103" y="573" fill="#f4dc9d" font-size="26">귀환 일정 먼저 확보</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">부두 기준 위치 파악</text><text x="473" y="497" fill="#f4f0e5" font-size="23">부두에서 출발</text><text x="473" y="573" fill="#f4dc9d" font-size="26">집합 장소 명확히</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">추가 코스 하나 선택</text><text x="843" y="497" fill="#f4f0e5" font-size="23">추가 코스 고르기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">날씨·체력에 맞게</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">일찍 해안으로 복귀</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">여유 있게 돌아오기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">쇼핑은 마지막에</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집 도식</text></g></svg>
