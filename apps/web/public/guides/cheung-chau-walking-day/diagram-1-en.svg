<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>A Leisurely Day Walking Cheung Chau: Pier, Waterfront and Lanes—Plan Your Return Before Choosing a Side Route: Decision Flow</title><desc>Check in order: outbound and return sailings, the pier as your reference point, one side route, and an early return to the waterfront. Compiled by the editors; not a map or measured travel times.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Order of steps · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what suits your circumstances; no need to do it all</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="29" font-weight="700" style="font-size: 29px;">Check both sailings</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Check both ways</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Plan your return first</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="29" font-weight="700" style="font-size: 29px;">Use the pier as a base</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Start at the pier</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Set a clear meeting point</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Pick one side route</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Choose a branch</text><text x="843" y="573" fill="#f4dc9d" font-size="26">By weather and energy</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="24" font-weight="700" style="font-size: 24px;">Back to waterfront early</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Return with room</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Save shopping for last</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editor-created diagram / Editorial diagram</text></g></svg>
