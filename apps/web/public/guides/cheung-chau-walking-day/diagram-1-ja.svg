<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>長洲を一日ゆっくり歩く：埠頭から海沿い、路地へ。帰りの予定を確保してから寄り道を選ぶ：判断の流れ</title><desc>順に確認：往復便を確認、埠頭を基点にする、寄り道ルートを一つ選ぶ、早めに海沿いへ戻る。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順序 · 実践の手順</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選ぶ。一度に全部こなさなくてよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">往復便を確認</text><text x="103" y="497" fill="#f4f0e5" font-size="23">往路・復路を確認</text><text x="103" y="573" fill="#f4dc9d" font-size="26">帰りを先に確保</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">埠頭を基点に</text><text x="473" y="497" fill="#f4f0e5" font-size="23">埠頭から出発</text><text x="473" y="573" fill="#f4dc9d" font-size="26">集合場所を明確に</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">寄り道は一つ</text><text x="843" y="497" fill="#f4f0e5" font-size="23">寄り道を選ぶ</text><text x="843" y="573" fill="#f4dc9d" font-size="26">天候・体力に合わせる</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">早めに海沿いへ</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">余裕を持って戻る</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">買い物は最後に</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部自作の模式図 / 編集部による図解</text></g></svg>
