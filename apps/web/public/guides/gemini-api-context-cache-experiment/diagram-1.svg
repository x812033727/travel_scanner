<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">不同 API 家族，分開記錄成本</title><desc id="desc">隱含：Interactions：命中沒有保證；手動：generateContent：保存名稱與到期；比較：同文件與問題：缺值不改填為零；清理：到期與刪除各查：命中不等於省錢</desc><rect width="1600" height="900" fill="#edf3f6"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="61" fill="#263b38" font-weight="800">不同 API 家族，分開記錄成本</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">隱含</text><text x="120" y="311" font-size="52" fill="#263b38" font-weight="500">Interactions</text><text x="120" y="379" font-size="52" fill="#263b38" font-weight="500">命中沒有保證</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">手動</text><text x="855" y="311" font-size="52" fill="#263b38" font-weight="500">generateContent</text><text x="855" y="379" font-size="52" fill="#263b38" font-weight="500">保存名稱與到期</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">比較</text><text x="120" y="601" font-size="52" fill="#263b38" font-weight="500">同文件與問題</text><text x="120" y="669" font-size="52" fill="#263b38" font-weight="500">缺值不改填為零</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">清理</text><text x="855" y="601" font-size="52" fill="#263b38" font-weight="500">到期與刪除各查</text><text x="855" y="669" font-size="52" fill="#263b38" font-weight="500">命中不等於省錢</text><text x="85" y="818" font-size="47" fill="#365477" font-weight="500">本機序列化已測；實際費用待驗</text></g></svg>