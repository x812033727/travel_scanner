<title id="title">溫度（Temperature）：調整取樣集中或分散的旋鈕 / Temperature dial</title>
<desc id="desc">畫面中央是一個旋鈕，外圈左半是藍色、右半是橘色，指針朝上。左邊是一根高、兩根矮的藍色長條，代表集中；右邊是三根高度相近的橘色長條，代表分散，上方有幾個大小不同的圓點。</desc>
