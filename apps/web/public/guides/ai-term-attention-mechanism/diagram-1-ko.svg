<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">어텐션: 비교, 가중, 혼합 / Attention: 비교, 가중, 혼합</title>
<desc id="desc">‘그것’을 query로 삼아 샤오야, 캐리어, 트렁크, 나머지 단어의 key와 비교하고 softmax로 가중치로 바꾼다. 예시 가중치는 순서대로 0.10, 0.55, 0.25, 0.10이며 합은 1이다. 이어서 가중치에 따라 각 위치의 value를 혼합해 ‘그것’의 새로운 표현을 얻으며, 캐리어의 내용이 가장 큰 비중을 차지한다. 가중치는 교육용 예시이며 실측값이 아니다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">어텐션: 비교, 가중, 혼합</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Attention: 비교, 가중, 혼합(가중치는 교육용 예시, 실측 아님)</text>
