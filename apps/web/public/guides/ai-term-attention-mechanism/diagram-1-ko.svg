<text x="380" y="158" font-size="22" font-weight="700" fill="#102A2B">비교 대상 위치</text>
<text x="740" y="158" font-size="22" font-weight="700" fill="#102A2B">softmax 후 가중치</text>
<text x="1250" y="158" font-size="22" font-weight="700" fill="#102A2B">출력</text>
