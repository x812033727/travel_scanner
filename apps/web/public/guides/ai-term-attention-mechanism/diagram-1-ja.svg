<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">アテンション：照合・重み付け・混合 / アテンション：照合・重み付け・混合</title>
<desc id="desc">「それ」を query として、小雅、スーツケース、トランク、残りの単語の key と照合し、softmax で重みに変換する。例示の重みは順に 0.10、0.55、0.25、0.10 で、合計は 1。その重みに従って各位置の value を混ぜ、「それ」の新しい表現を得る。スーツケースの内容が最も大きな割合を占める。重みは学習用の例であり、実測値ではない。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">アテンション：照合・重み付け・混合</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">アテンション：照合・重み付け・混合（重みは学習用の例、実測ではない）</text>
<text x="60" y="158" font-size="22" font-weight="700" fill="#102A2B">処理する位置</text>
<text x="380" y="158" font-size="22" font-weight="700" fill="#102A2B">照合先の位置</text>
<text x="740" y="158" font-size="22" font-weight="700" fill="#102A2B">softmax 後の重み</text>
<text x="1250" y="158" font-size="22" font-weight="700" fill="#102A2B">出力</text>
<rect x="60" y="194" width="240" height="496" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" />
<text x="180" y="420" font-size="36" font-weight="700" fill="#102A2B" text-anchor="middle">「それ」</text>
<text x="180" y="468" font-size="26" fill="#102A2B" text-anchor="middle">query</text>
<text x="180" y="506" font-size="22" fill="#5C6B6B" text-anchor="middle">何を探すか</text>
<rect x="1250" y="194" width="290" height="496" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1395" y="384" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">「それ」の新しい表現</text>
<text x="1395" y="436" font-size="24" fill="#102A2B" text-anchor="middle">＝各位置の value を</text>
<text x="1395" y="472" font-size="24" fill="#102A2B" text-anchor="middle">重みに従い加重平均</text>
<text x="1395" y="540" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">スーツケースの内容が</text>
<text x="1395" y="576" font-size="24" font-weight="700" fill="#0D6B68" text-anchor="middle">最大の割合を占める</text>
