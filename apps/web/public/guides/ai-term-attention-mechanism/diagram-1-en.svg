<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">Attention: match, weigh, mix / Attention: match, weigh, mix</title>
<desc id="desc">Using “it” as the query, compare it with the keys for Xiaoya, suitcase, trunk and other words, then apply softmax to obtain weights. The example weights are 0.10, 0.55, 0.25 and 0.10 respectively, summing to 1. Mix the values at each position according to these weights to obtain a new representation of “it,” with the suitcase's content contributing the most. The weights are a teaching example, not measurements.</desc>
