<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">Canvas 作品驗收</title><desc id="desc">建立草稿：決定文件或小工具；逐段編輯：保留已確認內容；預覽匯出：打開實際成果檢查</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">Canvas 作品驗收</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">建立草稿</text><text x="245" y="333" font-size="76" fill="#315F91">決定文件或小工具</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">逐段編輯</text><text x="245" y="558" font-size="76" fill="#315F91">保留已確認內容</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#315F91" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#315F91" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">預覽匯出</text><text x="245" y="783" font-size="76" fill="#315F91">打開實際成果檢查</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>