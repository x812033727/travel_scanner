<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">SiteGround에서 사이트를 만들거나 이전하기 전에 확인할 사항 — SiteGround 이전의 데이터 점검 단계</title><desc id="desc">SiteGround 이전을 원본 백업, 도구로 복사, 미리보기 테스트, 정식 전환 순서로 진행하며 각 단계에서 검증 자료를 보존하는 도해.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">SiteGround 이전의 데이터 점검 단계</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">복사, 미리보기와 정식 전환을 구분해 완료하기</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">원본 백업</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">파일과 데이터베이스</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">이메일과 연동</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">새 데이터의 출처</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">도구로 복사</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">올바른 대상 경로</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">이전 토큰</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">완료 상태</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">미리보기</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">이미지와 글</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">폼과 로그인</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">테스트 환경 제한</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">정식 전환</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">최종 데이터 동기화</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">DNS와 HTTPS</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">복구 방법 보존</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">복사가 성공한 뒤에도 최신 데이터와 실제 기능을 확인하세요.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 오리지널 도해</text>
</svg>
