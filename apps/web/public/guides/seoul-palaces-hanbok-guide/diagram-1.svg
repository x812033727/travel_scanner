<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾五大宮與韓屋區的相對位置與步行分鐘 / Seoul palaces and hanok quarters</title>
  <desc id="desc">簡化的鐘路區示意地圖，北在上。左邊是景福宮，週二休，守門將交接 10:00 與 14:00，3 號線景福宮站 5 號出口走 2 分、5 號線光化門站 2 號出口走 6 分。景福宮東北方是三清洞，往東是北村韓屋村，紅區 10:00 到 17:00 才能進入。北村南邊是昌德宮，週一休，後苑要預約、集合點從敦化門走 15 分；3 號線安國站 1 號出口到景福宮 6 分、3 號出口到昌德宮 5 分。昌德宮東邊經咸陽門直通昌慶宮，週一休、開到 21:00，4 號線惠化站 4 號出口約 12 分；昌慶宮往南走宮牆步道約 10 分到宗廟，週二休，平日限時導覽、週六與假日自由參觀。昌德宮南邊是仁寺洞，再往東約 5 分是益善洞，益善洞東邊約 5 分是宗廟；鐘路 3 街站 11 號出口到宗廟 5 分、7 號出口到昌德宮 10 分。最南邊是德壽宮，週一休、開到 21:00，守門將交接 11:00 與 14:00，市廳站 2 號出口走 2 分，從景福宮走過來約 15 分。點線是步行估算：景福宮到三清洞約 10 分、三清洞到北村約 10 分、北村到昌德宮約 10 分、昌德宮到仁寺洞約 10 分。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">首爾五大宮與韓屋區　相對位置與步行分鐘</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Seoul palaces and hanok quarters · 示意圖，非精確比例，北在上 · 步行分鐘為估算，地鐵出口分鐘為官網數字，2026 年 9 月查證</text>

