  <text x="1415" y="436" font-size="15" fill="#5C6B6B" text-anchor="middle">週一休 · 開到 21:00</text>
  <text x="1415" y="462" font-size="15" fill="#5C6B6B" text-anchor="middle">從昌德宮咸陽門直通</text>

