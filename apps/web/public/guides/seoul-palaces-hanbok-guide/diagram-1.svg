  <text x="1125" y="408" font-size="17" fill="#5C6B6B" text-anchor="middle">창덕궁 Changdeokgung</text>
  <text x="1125" y="436" font-size="15" fill="#5C6B6B" text-anchor="middle">週一休 · 後苑要預約</text>
