<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">香港四天分區路線圖 / Hong Kong 4-day route by district</title>
  <desc id="desc">香港四天行程依區域排：Day 1 港島，機場快綫從機場到香港站約 24 分鐘，中環搭山頂纜車上太平山；Day 2 九龍，東涌綫到九龍站，步行 10 到 15 分鐘到西九的故宮與 M+，傍晚到尖沙咀海濱與星光大道看 20:00 幻彩詠香江，港島出發可搭中環到尖沙咀的天星小輪；Day 3 大嶼山，東涌綫到東涌站，轉昂坪 360 纜車約 25 分鐘到昂坪與天壇大佛；Day 4 荃灣綫上的旺角與深水埗，傍晚回機場。荔景是荃灣綫與東涌綫的轉乘站。Day 2 碰到週一 M+ 休館、週二故宮休館（公眾假期兩館照開），就跟 Day 3 或 Day 4 對調。長洲不排在回程日。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">香港四天分區路線：一天一區，不來回過海</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Hong Kong in 4 days · Lantau, Kowloon, Hong Kong Island · MTR Tung Chung Line and Tsuen Wan Line</text>

  <!-- zones -->
  <rect x="40" y="120" width="470" height="500" rx="14" fill="#EAF4EE" stroke="#2E7D5B" stroke-width="4"/>
  <text x="64" y="158" font-size="22" font-weight="700" fill="#2E7D5B">Day 3 大嶼山 Lantau</text>

  <rect x="640" y="120" width="610" height="170" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"/>
  <text x="664" y="158" font-size="20" font-weight="700" fill="#D97A2B">Day 4 旺角・深水埗，傍晚回機場</text>

  <rect x="540" y="400" width="710" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="720" y="436" font-size="20" font-weight="700" fill="#2F6F9F">Day 2 九龍：西九・尖沙咀</text>

  <rect x="540" y="585" width="710" height="50" fill="#D6E6EE"/>
  <text x="780" y="617" font-size="16" fill="#2F6F9F" text-anchor="middle">維多利亞港 Victoria Harbour</text>

  <rect x="540" y="650" width="710" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="560" y="686" font-size="20" font-weight="700" fill="#0D6B68">Day 1 港島：中環・太平山</text>

  <!-- Airport Express -->
  <path d="M 150 300 L 490 300 L 530 364 L 590 364 L 690 494 L 976 494 L 976 714" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tung Chung Line -->
  <path d="M 320 340 L 600 340 L 700 470 L 1000 470 L 1000 714" fill="none" stroke="#102A2B" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tsuen Wan Line -->
  <path d="M 600 340 L 680 220 L 1040 220 L 1040 714" fill="none" stroke="#102A2B" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Ngong Ping 360 -->
  <line x1="320" y1="352" x2="320" y2="508" stroke="#2E7D5B" stroke-width="5"/>
  <!-- Star Ferry -->
  <line x1="1160" y1="536" x2="1160" y2="684" stroke="#5C6B6B" stroke-width="5" stroke-dasharray="14 10"/>
  <rect x="1152" y="524" width="16" height="16" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <rect x="1152" y="680" width="16" height="16" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1176" y="606" font-size="15" font-weight="700" fill="#5C6B6B">天星小輪</text>
  <text x="1176" y="626" font-size="15" fill="#5C6B6B">Star Ferry</text>
  <!-- Peak Tram -->
  <line x1="1040" y1="726" x2="1040" y2="772" stroke="#0D6B68" stroke-width="5"/>
  <!-- walk to West Kowloon -->
  <path d="M 820 510 L 820 548 L 704 548" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-dasharray="4 6" marker-end="url(#arrow)"/>

  <!-- line names -->
  <text x="250" y="288" font-size="15" font-weight="700" fill="#6B4A3A">機場快綫 Airport Express</text>
  <text x="340" y="374" font-size="15" font-weight="700" fill="#102A2B">東涌綫</text>
  <text x="340" y="394" font-size="15" font-weight="700" fill="#102A2B">Tung Chung Line</text>
  <text x="1062" y="352" font-size="15" font-weight="700" fill="#102A2B">荃灣綫 Tsuen Wan Line</text>

  <!-- Lantau nodes -->
  <circle cx="150" cy="300" r="13" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="150" y="266" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">香港國際機場 Airport</text>
  <circle cx="320" cy="340" r="13" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/>
  <text x="298" y="347" font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">東涌 Tung Chung</text>
  <text x="340" y="440" font-size="17" font-weight="700" fill="#2E7D5B">昂坪 360 Cable Car</text>
  <text x="340" y="466" font-size="17" fill="#2E7D5B">纜車 約 25 分</text>
  <circle cx="320" cy="520" r="13" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <text x="320" y="564" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">昂坪 Ngong Ping・天壇大佛</text>
  <text x="320" y="590" font-size="15" fill="#5C6B6B" text-anchor="middle">Big Buddha</text>

  <!-- interchange -->
  <circle cx="600" cy="340" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="6"/>
  <text x="626" y="348" font-size="17" font-weight="700" fill="#102A2B">荔景 Lai King（轉乘站）</text>

  <!-- Day 4 nodes -->
  <circle cx="800" cy="220" r="13" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <text x="800" y="262" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">深水埗 Sham Shui Po</text>
  <circle cx="960" cy="220" r="13" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <text x="960" y="262" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">旺角 Mong Kok</text>

  <!-- Day 2 nodes -->
  <rect x="806" y="456" width="28" height="52" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="836" y="540" font-size="16" font-weight="700" fill="#102A2B">九龍站 Kowloon</text>
  <text x="556" y="530" font-size="17" font-weight="700" fill="#2F6F9F">西九：故宮・M+</text>
  <text x="556" y="556" font-size="16" fill="#2F6F9F">步行 10–15 分</text>
  <circle cx="1040" cy="470" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <text x="1062" y="464" font-size="17" font-weight="700" fill="#102A2B">尖沙咀 Tsim Sha Tsui</text>
  <text x="1062" y="488" font-size="16" fill="#102A2B">海濱・星光大道</text>
  <text x="1062" y="512" font-size="16" font-weight="700" fill="#2F6F9F">20:00 幻彩詠香江</text>

  <!-- Day 1 nodes -->
  <rect x="962" y="700" width="50" height="28" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <text x="950" y="721" font-size="17" font-weight="700" fill="#102A2B" text-anchor="end">香港站 Hong Kong</text>
  <circle cx="1040" cy="714" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="1062" y="721" font-size="17" font-weight="700" fill="#102A2B">中環 Central</text>
  <path d="M 1040 766 L 1052 786 L 1028 786 Z" fill="#0D6B68"/>
  <text x="1062" y="770" font-size="17" font-weight="700" fill="#0D6B68">山頂纜車 → 太平山</text>
  <text x="1062" y="794" font-size="15" fill="#0D6B68">Peak Tram · The Peak</text>
  <text x="560" y="770" font-size="17" font-weight="700" fill="#6B4A3A">機場快綫：機場 → 香港站</text>
  <text x="560" y="794" font-size="16" fill="#6B4A3A">Airport Express 約 24 分</text>

  <!-- Cheung Chau note -->
  <rect x="40" y="650" width="470" height="130" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="64" y="690" font-size="20" font-weight="700" fill="#D97A2B">長洲 Cheung Chau</text>
  <text x="64" y="724" font-size="17" fill="#102A2B">想看離島漁村：把 Day 3 換成長洲</text>
  <text x="64" y="756" font-size="17" font-weight="700" fill="#B8442D">長洲不排在回程日（Day 4）</text>

  <!-- legend -->
  <rect x="1280" y="120" width="280" height="330" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1300" y="158" font-size="20" font-weight="700" fill="#102A2B">圖例 Legend</text>
  <line x1="1300" y1="190" x2="1360" y2="190" stroke="#102A2B" stroke-width="10" stroke-linecap="round"/>
  <text x="1376" y="196" font-size="17" fill="#102A2B">港鐵 MTR</text>
  <line x1="1300" y1="228" x2="1360" y2="228" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round"/>
  <text x="1376" y="234" font-size="17" fill="#102A2B">機場快綫</text>
  <line x1="1300" y1="266" x2="1360" y2="266" stroke="#5C6B6B" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="1376" y="272" font-size="17" fill="#102A2B">天星小輪</text>
  <line x1="1300" y1="304" x2="1360" y2="304" stroke="#2E7D5B" stroke-width="5"/>
  <text x="1376" y="310" font-size="17" fill="#102A2B">昂坪 360 纜車</text>
  <line x1="1300" y1="342" x2="1360" y2="342" stroke="#2F6F9F" stroke-width="3" stroke-dasharray="4 6"/>
  <text x="1376" y="348" font-size="17" fill="#102A2B">步行</text>
  <rect x="1300" y="372" width="20" height="20" rx="4" fill="#0D6B68"/>
  <text x="1328" y="389" font-size="16" fill="#102A2B">Day 1</text>
  <rect x="1420" y="372" width="20" height="20" rx="4" fill="#2F6F9F"/>
  <text x="1448" y="389" font-size="16" fill="#102A2B">Day 2</text>
  <rect x="1300" y="408" width="20" height="20" rx="4" fill="#2E7D5B"/>
  <text x="1328" y="425" font-size="16" fill="#102A2B">Day 3</text>
  <rect x="1420" y="408" width="20" height="20" rx="4" fill="#D97A2B"/>
  <text x="1448" y="425" font-size="16" fill="#102A2B">Day 4</text>

  <!-- decision box -->
  <rect x="1280" y="480" width="280" height="220" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1300" y="518" font-size="20" font-weight="700" fill="#B8442D">Day 2 碰到休館日</text>
  <text x="1300" y="556" font-size="17" fill="#102A2B">週一：M+ 休館</text>
  <text x="1300" y="586" font-size="17" fill="#102A2B">週二：故宮休館</text>
  <text x="1300" y="616" font-size="17" fill="#5C6B6B">公眾假期兩館照開</text>
  <text x="1300" y="664" font-size="17" font-weight="700" fill="#B8442D">→ 跟 Day 3 或 Day 4 對調</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
