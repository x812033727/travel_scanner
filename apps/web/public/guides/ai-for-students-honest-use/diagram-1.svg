<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">學生用 AI 的三類用法，與標示怎麼寫 / Three kinds of student AI use, and how to disclose it</title>
  <desc id="desc">上半部是三欄分類。左欄「放心用」，學到東西的是你：解釋觀念並用白話再講一次、出練習題並在作答後講解、檢查自己寫的文法、整理自己抄的筆記、規劃讀書進度；欄底註明產出不交出去，通常不用標示。中欄「看老師規定」，因為 AI 碰到了你要交的東西：潤稿與修改句子、翻譯、寫大綱與想題目、修改段落結構；欄底註明先看課程大綱，沒寫就問，用了一律標示。右欄「通常不行」，交出去的是 AI 的，不是你的：整份作業代寫、考試與線上測驗作答、請 AI 列參考文獻（常是捏造的）、把 AI 列為作者；欄底註明標示了也不能用，責任在你。一條箭頭從中欄指向下半部的「標示怎麼寫」，說明用了中欄的用法就要寫這一條。下半部分兩層：引用格式依 APA 官方寫法，參考文獻寫成 OpenAI、年、ChatGPT、版本日期、方括號 Large language model、網址，內文引用寫成 OpenAI 加年；使用聲明要寫四件事：一、用了哪個工具與版本，二、做了什麼，三、哪些是自己寫的，四、有沒有查證。最後註明使用聲明寫在作業最前面或最後面，一段就夠，未標註的作業老師可以重新評分或不計分；分類依據是做完之後學到東西的是你還是 AI，一切以各校與各課程規定為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">學生用 AI 的三類用法，與標示怎麼寫</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Three kinds of student AI use, and how to disclose it</text>

  <!-- column 1: safe to use -->
  <rect x="60" y="110" width="480" height="450" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="300" y="152" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">放心用</text>
  <text x="300" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">學到東西的是你 / Safe to use</text>
  <line x1="84" y1="200" x2="516" y2="200" stroke="#0D6B68" stroke-width="2"/>
  <text x="92" y="240" font-size="17" fill="#102A2B">・解釋觀念，用白話再講一次</text>
  <text x="92" y="278" font-size="17" fill="#102A2B">・出練習題，作答後再講解</text>
  <text x="92" y="316" font-size="17" fill="#102A2B">・檢查自己寫的文法</text>
  <text x="92" y="354" font-size="17" fill="#102A2B">・整理自己抄的筆記</text>
  <text x="92" y="392" font-size="17" fill="#102A2B">・規劃讀書進度</text>
  <text x="300" y="524" font-size="15" fill="#5C6B6B" text-anchor="middle">產出不交出去，通常不用標示</text>

  <!-- column 2: check the course rules -->
  <rect x="580" y="110" width="480" height="450" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="820" y="152" font-size="20" font-weight="700" fill="#D97A2B" text-anchor="middle">看老師規定</text>
  <text x="820" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">AI 碰到了你要交的東西 / Check the course rules</text>
  <line x1="604" y1="200" x2="1036" y2="200" stroke="#D97A2B" stroke-width="2"/>
  <text x="612" y="240" font-size="17" fill="#102A2B">・潤稿、修改句子</text>
  <text x="612" y="278" font-size="17" fill="#102A2B">・翻譯</text>
  <text x="612" y="316" font-size="17" fill="#102A2B">・寫大綱、想題目</text>
  <text x="612" y="354" font-size="17" fill="#102A2B">・修改段落結構</text>
  <text x="820" y="524" font-size="15" fill="#5C6B6B" text-anchor="middle">先看課程大綱，沒寫就問；用了一律標示</text>

  <!-- column 3: usually not allowed -->
  <rect x="1100" y="110" width="440" height="450" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1320" y="152" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">通常不行</text>
  <text x="1320" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">交出去的是 AI 的，不是你的 / Usually not allowed</text>
  <line x1="1124" y1="200" x2="1516" y2="200" stroke="#B8442D" stroke-width="2"/>
  <text x="1132" y="240" font-size="17" fill="#102A2B">・整份作業代寫</text>
  <text x="1132" y="278" font-size="17" fill="#102A2B">・考試、線上測驗作答</text>
  <text x="1132" y="316" font-size="17" fill="#102A2B">・請 AI 列參考文獻（常是捏造的）</text>
  <text x="1132" y="354" font-size="17" fill="#102A2B">・把 AI 列為作者</text>
  <text x="1320" y="524" font-size="15" fill="#5C6B6B" text-anchor="middle">標示了也不能用；責任在你</text>

  <!-- arrow from column 2 to the disclosure strip -->
  <path d="M 820 562 L 820 594" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="836" y="584" font-size="15" fill="#5C6B6B">用了中欄的用法，就要寫這一條</text>

  <!-- disclosure strip -->
  <rect x="60" y="598" width="1480" height="212" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="84" y="634" font-size="20" font-weight="700" fill="#1F4E73">標示怎麼寫：引用格式 ＋ 使用聲明</text>
  <text x="84" y="668" font-size="16" fill="#102A2B">引用格式（APA 官方寫法）：OpenAI.（年）. ChatGPT（版本日期）[Large language model]. 網址　　內文：（OpenAI, 年）</text>
  <rect x="84" y="690" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="254" y="725" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">一、用了哪個工具與版本</text>
  <rect x="444" y="690" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="614" y="725" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">二、做了什麼</text>
  <rect x="804" y="690" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="974" y="725" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">三、哪些是自己寫的</text>
  <rect x="1164" y="690" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1334" y="725" font-size="17" font-weight="700" fill="#1F4E73" text-anchor="middle">四、有沒有查證</text>
  <text x="84" y="784" font-size="15" fill="#5C6B6B">使用聲明寫在作業最前面或最後面，一段就夠；未標註的作業，老師可以重新評分或不計分</text>

  <text x="60" y="848" font-size="15" fill="#5C6B6B">分類依據：做完之後學到東西的是你，還是 AI；一切以各校與各課程規定為準。</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
