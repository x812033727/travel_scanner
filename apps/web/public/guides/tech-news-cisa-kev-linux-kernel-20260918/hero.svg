<title id="title">CISA 同一天兩則公告：三個 Linux 核心漏洞列入「已遭利用」清單</title><desc id="desc">原創插畫：畫面中央是一個代表「核心」的齒輪圖案，齒輪外圍分別連著三個簡化的幾何輪廓，分別代表手機、方形機箱與路由器天線，都只用線條與色塊表示；齒輪上方有一圈弧形箭頭，指向一個問號逐漸變成打勾符號的小圖示，代表查看更新；畫面不呈現任何品牌標誌、商標或實際機身外觀</desc>
