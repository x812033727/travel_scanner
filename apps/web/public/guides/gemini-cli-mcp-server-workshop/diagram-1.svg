<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">固定資料來源，逐項驗證連線</title><desc id="desc">輸入：只接受商品編號：拒絕路徑與錯誤型別；查詢：唯讀合成 CSV：不開放任意檔案；結果：找到・查無資料：資料文字不是指令；連線：啟動・握手・中斷：分開記錄錯誤</desc>
<rect width="1600" height="900" fill="#f3f5ee"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#173445" font-weight="800">固定資料來源，逐項驗證連線</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#2b6577" font-weight="800">輸入</text><text x="120" y="311" font-size="54" fill="#173445" font-weight="500">只接受商品編號</text><text x="120" y="379" font-size="54" fill="#173445" font-weight="500">拒絕路徑與錯誤型別</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#2b6577" font-weight="800">查詢</text><text x="855" y="311" font-size="54" fill="#173445" font-weight="500">唯讀合成 CSV</text><text x="855" y="379" font-size="54" fill="#173445" font-weight="500">不開放任意檔案</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#2b6577" font-weight="800">結果</text><text x="120" y="601" font-size="54" fill="#173445" font-weight="500">找到・查無資料</text><text x="120" y="669" font-size="54" fill="#173445" font-weight="500">資料文字不是指令</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#2b6577" font-weight="800">連線</text><text x="855" y="601" font-size="54" fill="#173445" font-weight="500">啟動・握手・中斷</text><text x="855" y="669" font-size="54" fill="#173445" font-weight="500">分開記錄錯誤</text><text x="85" y="818" font-size="47" fill="#476574" font-weight="500">本機 stdio 已測；模型選工具待驗</text></g></svg>