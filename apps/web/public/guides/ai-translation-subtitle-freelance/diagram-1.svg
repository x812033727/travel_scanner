<text x="148.0" y="350" font-size="16" fill="#102A2B" text-anchor="middle">完整或輕度</text>
<text x="148.0" y="384" font-size="16" fill="#102A2B" text-anchor="middle">術語表與格式</text>
<line x1="260" y1="305.0" x2="296" y2="305.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="300" y="160" width="216" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="408.0" cy="210" r="26" fill="#0D6B68"/>
<text x="408.0" y="218" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">二</text>
<text x="408.0" y="276" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">試編樣本</text>
<text x="408.0" y="316" font-size="16" fill="#102A2B" text-anchor="middle">抽一小段實測</text>
<text x="408.0" y="350" font-size="16" fill="#102A2B" text-anchor="middle">量出編修速度</text>
<text x="408.0" y="384" font-size="16" fill="#102A2B" text-anchor="middle">估工時與報價</text>
<line x1="520" y1="305.0" x2="556" y2="305.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="560" y="160" width="216" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="668.0" cy="210" r="26" fill="#0D6B68"/>
<text x="668.0" y="218" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">三</text>
<text x="668.0" y="276" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">產出初稿</text>
<text x="668.0" y="316" font-size="16" fill="#102A2B" text-anchor="middle">文件：機器翻譯</text>
<text x="668.0" y="350" font-size="16" fill="#102A2B" text-anchor="middle">影片：語音辨識</text>
<text x="668.0" y="384" font-size="16" fill="#102A2B" text-anchor="middle">逐字稿先校對</text>
<line x1="780" y1="305.0" x2="816" y2="305.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="820" y="160" width="216" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="928.0" cy="210" r="26" fill="#0D6B68"/>
<text x="928.0" y="218" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">四</text>
<text x="928.0" y="276" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">逐句譯後編修</text>
<text x="928.0" y="316" font-size="16" fill="#102A2B" text-anchor="middle">對照原文改意思</text>
<text x="928.0" y="350" font-size="16" fill="#102A2B" text-anchor="middle">統一術語與語氣</text>
<text x="928.0" y="384" font-size="16" fill="#102A2B" text-anchor="middle">改成台灣用語</text>
<line x1="1040" y1="305.0" x2="1076" y2="305.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1080" y="160" width="216" height="290" rx="14" fill="#FCEFE3" stroke="#D97A2B" stroke-width="4"/>
<circle cx="1188.0" cy="210" r="26" fill="#D97A2B"/>
<text x="1188.0" y="218" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">五</text>
<text x="1188.0" y="276" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">斷行與時間軸</text>
<text x="1188.0" y="310" font-size="16" fill="#102A2B" text-anchor="middle">每行最多 16 字</text>
<text x="1188.0" y="340" font-size="16" fill="#102A2B" text-anchor="middle">最多兩行</text>
<text x="1188.0" y="370" font-size="16" fill="#102A2B" text-anchor="middle">成人每秒最多 9 字</text>
<text x="1188.0" y="400" font-size="16" fill="#102A2B" text-anchor="middle">每則最長 7 秒</text>
<line x1="1300" y1="305.0" x2="1336" y2="305.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1340" y="160" width="216" height="290" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="1448.0" cy="210" r="26" fill="#0D6B68"/>
<text x="1448.0" y="218" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">六</text>
<text x="1448.0" y="276" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">品質檢查與交付</text>
<text x="1448.0" y="316" font-size="16" fill="#102A2B" text-anchor="middle">照清單逐項查</text>
<text x="1448.0" y="350" font-size="16" fill="#102A2B" text-anchor="middle">整片回看一遍</text>
<text x="1448.0" y="384" font-size="16" fill="#102A2B" text-anchor="middle">說明用了哪些工具</text>
<rect x="1108" y="114" width="160" height="34" rx="17" fill="#D97A2B"/>
<text x="1188.0" y="137" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">字幕案才有</text>
<path d="M928.0 454 L928.0 506 L1448.0 506 L1448.0 460" fill="none" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="butt" marker-end="url(#arrowb)"/>
<text x="1188.0" y="542" font-size="17" fill="#2F6F9F" text-anchor="middle">文件翻譯：從第四步直接接到第六步</text>
<rect x="40" y="584" width="740" height="216" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="410" y="634" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">計價</text>
<text x="410" y="680" font-size="18" fill="#102A2B" text-anchor="middle">單價 ＝ 工時 × 目標時薪 ÷ 字數或片長</text>
<text x="410" y="723" font-size="17" fill="#102A2B" text-anchor="middle"><tspan font-weight="700" fill="#0D6B68">按字（假設）：</tspan>7 小時 × 900 元 ÷ 3,000 字 ＝ 每字 2.1 元</text>
<text x="410" y="766" font-size="17" fill="#102A2B" text-anchor="middle"><tspan font-weight="700" fill="#0D6B68">按分鐘（假設）：</tspan>9 小時 × 900 元 ÷ 30 分鐘 ＝ 每分鐘 270 元</text>
<rect x="820" y="584" width="740" height="216" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1190" y="634" font-size="20" font-weight="700" fill="#2F6F9F" text-anchor="middle">向客戶說明</text>
<text x="1190" y="680" font-size="17" fill="#102A2B" text-anchor="middle"><tspan font-weight="700" fill="#2F6F9F">開工前先問：</tspan>用不用機器翻譯或 AI、用在哪一步</text>
<text x="1190" y="723" font-size="17" fill="#102A2B" text-anchor="middle"><tspan font-weight="700" fill="#2F6F9F">寫進合約：</tspan>完整或輕度、可上傳哪些工具、著作財產權歸誰</text>
<text x="1190" y="766" font-size="17" fill="#102A2B" text-anchor="middle"><tspan font-weight="700" fill="#2F6F9F">取得同意前：</tspan>不把客戶資料上傳到免費翻譯工具</text>
