<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">AI 翻譯與字幕接案的六個步驟 / Six steps of AI-assisted translation and subtitling work</title>
<desc id="desc">由左到右六個步驟：一、確認需求，包括用途與交期、完整或輕度譯後編修、術語表與格式；二、試編樣本，抽一小段實測、量出編修速度、估工時與報價；三、產出初稿，文件用機器翻譯，影片先用語音辨識並校對逐字稿；四、逐句譯後編修，對照原文改意思、統一術語與語氣、改成台灣用語；五、斷行與時間軸，只有字幕案需要，以 Netflix 繁體中文規範為例是每行最多 16 字、最多兩行、成人節目每秒最多 9 字、每則最長 7 秒；六、品質檢查與交付，照清單逐項查、整片回看一遍、說明用了哪些工具。文件翻譯從第四步直接接到第六步。下方兩欄：左欄是計價，單價等於工時乘上目標時薪，再除以字數或片長，附兩個假設算例，按字是 7 小時乘 900 元除以 3,000 字，每字 2.1 元，按分鐘是 9 小時乘 900 元除以 30 分鐘，每分鐘 270 元；右欄是向客戶說明，開工前先問用不用機器翻譯或 AI、用在哪一步，完整或輕度、可上傳哪些工具、著作財產權歸誰都寫進合約，取得同意前不把客戶資料上傳到免費翻譯工具。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D6B68"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6F9F"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
