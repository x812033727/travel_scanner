<title id="title">譯後編修與字幕 / Post-editing and subtitles</title>
<desc id="desc">米色底上，左邊是一個深青色的影片畫面，畫面底部有上短下長兩條白色字幕；畫面下方是一條時間軸，上面排著幾段青綠色與橘色的字幕區塊；右邊是一張白色文件，其中一行被標成橘色，一支橘色鉛筆正在修改這一行，文件右下角有一個綠色圓形勾號；畫面與文件之間有一條虛線箭頭；最下方寫著「譯後編修與字幕」。</desc>
