<circle cx="610" cy="560" r="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="11"/>
<circle cx="1140" cy="560" r="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="11"/>

<circle cx="800" cy="420" r="26" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="11"/>
<circle cx="950" cy="420" r="26" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="11"/>

<circle cx="800" cy="740" r="26" fill="#FFFFFF" stroke="#D97A2B" stroke-width="11"/>
<circle cx="950" cy="740" r="26" fill="#FFFFFF" stroke="#D97A2B" stroke-width="11"/>

