<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">分支與還原 / Branch, commit, undo</title>
<desc id="desc">一張抽象插圖。畫面中央有一條粗的深綠色主線，線上有幾個白色圓點代表提交。主線中段有一個插著小旗子的提交，代表動手之前做的檢查點，從這裡分出兩條支線：上面那條藍色支線繞了一圈之後回到主線，代表合併；下面那條橘色支線走到盡頭，末端畫了一個紅色叉號，代表整條分支被丟掉。主線右端是一個綠色圓圈裡的打勾記號，代表回得去的安全狀態。畫面上方有一行字：改壞了，回得去。</desc>

<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="800" y="228" font-size="62" font-weight="700" fill="#102A2B" text-anchor="middle">改壞了，回得去</text>

<path d="M 170 560 L 1330 560" fill="none" stroke="#0D6B68" stroke-width="16" stroke-linecap="round"/>

<path d="M 610 560 C 660 560 680 420 760 420 L 990 420 C 1070 420 1090 560 1140 560" fill="none" stroke="#2F6F9F" stroke-width="14" stroke-linecap="round"/>

