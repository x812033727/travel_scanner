<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">搜索链接、页面选项与数据标记应描述同一款商品。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
