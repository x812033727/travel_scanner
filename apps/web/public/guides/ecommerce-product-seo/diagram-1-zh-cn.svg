<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">商品页 SEO 一致性检查</title><desc id="desc">四栏呈现商品内容、变体网址、数据标记与持续验收，提醒不同版式需采用合适网址策略且不保证特殊展示。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">商品页 SEO 一致性检查</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">从搜索落地页一路核对到款式选择与商品数据</text>
