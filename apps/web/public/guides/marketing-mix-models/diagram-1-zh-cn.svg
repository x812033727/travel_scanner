<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','Noto Sans TC',sans-serif">
<title id="title">把营销模型转成改进行动</title><desc id="desc">四栏呈现 4P、7P、4C 与行动验收，协助使用者在同一案例下比较模型，而不是把不同模型排成高低等级。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">把营销模型转成改进行动</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">同一个顾客问题，从安排、交付与使用负担逐层检查</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">4P 安排</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">产品与价格</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">渠道与推广</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">承诺条件一致</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">7P 交付</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">加入人员流程</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">可见的服务线索</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">检查实际体验</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">4C 需求</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">需求与总成本</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">便利性及沟通</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">找到顾客障碍</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">行动验收</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">选一项具体改善</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">负责人和完成日</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">用实际任务确认</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">模型帮助看全问题，证据与执行决定下一步。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
