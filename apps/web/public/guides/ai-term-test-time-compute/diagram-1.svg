<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">同一題，計算可分配到不同路徑</title><desc id="desc">當前問題可以順序修正或平行產生候選，兩者透過檢查器驗證，再交付答案或指出無解</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一題，計算可分配到不同路徑</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Test-time Compute</text><path d="M 360 375 L 550 225" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 360 455 L 550 635" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 930 220 L 1130 365" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 930 635 L 1130 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="320" width="290" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="215" y="409" font-size="28" fill="#102A2B" text-anchor="middle">當前問題</text><text x="215" y="452" font-size="22" fill="#5C6B6B" text-anchor="middle">條件與預算</text><rect x="560" y="140" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="745" y="214" font-size="28" fill="#102A2B" text-anchor="middle">順序修正</text><text x="745" y="257" font-size="22" fill="#5C6B6B" text-anchor="middle">提案、檢查、調整</text><rect x="560" y="555" width="370" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="745" y="629" font-size="28" fill="#102A2B" text-anchor="middle">平行探索</text><text x="745" y="672" font-size="22" fill="#5C6B6B" text-anchor="middle">不同起點與候選</text><rect x="1140" y="305" width="390" height="215" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="406.5" font-size="28" fill="#102A2B" text-anchor="middle">檢查與選擇</text><text x="1335" y="449.5" font-size="22" fill="#5C6B6B" text-anchor="middle">可行、未知或無解</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
