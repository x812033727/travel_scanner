<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">同樣的平滑進步，換個指標就像突然躍升 / Same smooth gain, different metric</title><desc id="desc">兩組示例長條圖，數字為假設，未實測。模型由小到大時，逐位答對率依序為 50%、70%、90%、95%，穩定上升；同樣的進步若改用「5 位全對才算對」的指標，答對率依序為 3%、17%、59%、77%，前段很低、中段陡升，看起來像能力突然出現。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同樣的平滑進步，換個指標就像突然躍升</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Same smooth gain, different metric (illustrative numbers, not measured)</text><rect x="60" y="120" width="720" height="660" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/><text x="100" y="172" font-size="24" font-weight="700" fill="#102A2B">逐位答對率</text><text x="100" y="204" font-size="18" fill="#5C6B6B">每一位各自計分，穩定上升</text><line x1="100" y1="640" x2="740" y2="640" stroke="#5C6B6B" stroke-width="2"/><rect x="135" y="460" width="90" height="180" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="295" y="388" width="90" height="252" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="455" y="316" width="90" height="324" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><rect x="615" y="298" width="90" height="342" rx="6" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="180" y="446" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">50%</text><text x="340" y="374" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">70%</text><text x="500" y="302" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">90%</text><text x="660" y="284" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">95%</text><text x="180" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">小模型</text><text x="340" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">中型</text><text x="500" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">大型</text><text x="660" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">更大</text><text x="420" y="720" font-size="18" fill="#5C6B6B" text-anchor="middle">模型規模愈來愈大</text><path d="M 120 746 L 720 746" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="120" width="720" height="660" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="860" y="172" font-size="24" font-weight="700" fill="#102A2B">整串 5 位全對率</text><text x="860" y="204" font-size="18" fill="#5C6B6B">5 位都對才算對，曲線變陡</text><line x1="860" y1="640" x2="1500" y2="640" stroke="#5C6B6B" stroke-width="2"/><rect x="895" y="629" width="90" height="11" rx="4" fill="#D97A2B" fill-opacity="0.2" stroke="#D97A2B" stroke-width="4"/><rect x="1055" y="579" width="90" height="61" rx="6" fill="#D97A2B" fill-opacity="0.2" stroke="#D97A2B" stroke-width="4"/><rect x="1215" y="428" width="90" height="212" rx="6" fill="#D97A2B" fill-opacity="0.2" stroke="#D97A2B" stroke-width="4"/><rect x="1375" y="363" width="90" height="277" rx="6" fill="#D97A2B" fill-opacity="0.2" stroke="#D97A2B" stroke-width="4"/><text x="940" y="612" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">3%</text><text x="1100" y="562" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">17%</text><text x="1260" y="411" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">59%</text><text x="1420" y="346" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">77%</text><text x="940" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">小模型</text><text x="1100" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">中型</text><text x="1260" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">大型</text><text x="1420" y="676" font-size="18" fill="#5C6B6B" text-anchor="middle">更大</text><text x="1180" y="720" font-size="18" fill="#5C6B6B" text-anchor="middle">模型規模愈來愈大</text><path d="M 880 746 L 1480 746" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/><text x="1540" y="84" font-size="18" fill="#B8442D" text-anchor="end">示例：假設各位彼此獨立，數字為假設，未實測</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
