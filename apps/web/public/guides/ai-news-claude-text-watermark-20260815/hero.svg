<title id="title">Claude 文字浮水印上路：改的是選字的隨機來源，不是在文字裡藏東西</title><desc id="desc">原創插圖：一整排代表文字的直條裡，其中幾條被替換成極小的鑰匙圖案，象徵浮水印藏在選字的隨機性裡而不是額外加上的符號，畫面不含任何商標或人像。</desc>
