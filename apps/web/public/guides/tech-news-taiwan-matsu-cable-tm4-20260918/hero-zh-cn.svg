<title id="title">中华电信宣布台马第四海缆完工：近 14 亿元、三路由备援与 1.9 Tbps</title><desc id="desc">原创插图：左边一块圆角长方形代表台湾本岛海岸，三条实线弧线跨海连到右边代表马祖的小方块；其中一条线旁多画一个小型天线符号代表微波备援，上方再画三个小圆点排成弧形代表卫星轨道</desc>
