<title id="title">중화전신, 마쭈 제4 해저케이블 완공 발표: 약 NT$14억, 3중 경로 백업과 1.9 Tbps</title><desc id="desc">오리지널 일러스트: 왼쪽의 둥근 사각형은 대만 본섬 해안, 오른쪽의 작은 사각형은 마쭈를 나타내며 바다를 건너는 실선 3개로 이어져 있습니다. 그중 한 선 옆에는 마이크로파 백업을 뜻하는 작은 안테나 기호가, 위쪽에는 위성 궤도를 나타내는 호 모양의 작은 점 3개가 있습니다.</desc>
