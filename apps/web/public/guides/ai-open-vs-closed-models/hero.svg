<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">開放權重與閉源 API 的差別 / Open weights versus a closed API</title>
  <desc id="desc">左右兩組對照的幾何插圖。左邊是一個蓋子掀開的圓角方盒，盒裡看得見一個綠色圓形、一個橘色圓角方塊與一個小綠圓，盒子下方有一條實線箭頭指向一台筆記型電腦的外形，代表權重檔下載到自己的機器。右邊是一個蓋子蓋緊、整塊填滿藍色、看不見內容的同尺寸方盒，下方有一條虛線箭頭穿過三個小圓點指向同樣的筆記型電腦外形，代表模型留在對方那裡、你透過網路連過去。畫面下方有一行字：開放權重 vs 閉源 API。</desc>
  <defs>
    <marker id="arrowteal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#2F6F9F"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- left: an open box, contents visible, file comes down to your machine -->
  <rect x="220" y="150" width="440" height="44" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" transform="rotate(-7 440 172)"/>
  <rect x="240" y="230" width="400" height="250" rx="26" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="340" cy="350" r="48" fill="#0D6B68"/>
  <rect x="410" y="302" width="96" height="96" rx="18" fill="#D97A2B"/>
  <circle cx="560" cy="380" r="36" fill="#2E7D5B"/>
  <line x1="440" y1="496" x2="440" y2="568" stroke="#0D6B68" stroke-width="8" marker-end="url(#arrowteal)"/>
  <rect x="330" y="590" width="220" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
  <rect x="300" y="738" width="280" height="22" rx="11" fill="#102A2B"/>

  <!-- right: a sealed box, nothing visible, you reach it over the network -->
  <rect x="940" y="192" width="440" height="44" rx="22" fill="#2F6F9F"/>
  <rect x="960" y="230" width="400" height="250" rx="26" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="8"/>
  <line x1="1160" y1="496" x2="1160" y2="568" stroke="#2F6F9F" stroke-width="8" stroke-dasharray="16 12" marker-end="url(#arrowblue)"/>
  <circle cx="1060" cy="532" r="9" fill="#2F6F9F"/>
  <circle cx="1260" cy="532" r="9" fill="#2F6F9F"/>
  <rect x="1050" y="590" width="220" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
  <rect x="1020" y="738" width="280" height="22" rx="11" fill="#102A2B"/>

  <text x="800" y="848" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">開放權重 vs 閉源 API</text>
</svg>
