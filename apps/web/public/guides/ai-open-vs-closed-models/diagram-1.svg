<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">開放權重還是閉源 API：決策樹 / Open weights or closed API: a decision tree</title>
  <desc id="desc">由上而下四個問題，每個問題答「是」就往右走到一個做法。第一題問要送進去的內容可不可以離開你的電腦，答不可以就自架開放權重模型，權重下載到自己的機器，資料流向由整個應用程式的設定決定。答可以往下到第二題，問要不要把模型包進自己的產品或服務裡賣，答要就先讀那個版本的 LICENSE 檔：Apache 2.0 與 MIT 只要保留聲明，Llama 4 要標 Built with Llama，Qwen 兩份自訂授權在 1 億月活躍使用者或 2,000 萬美元月營收時要標模型名稱。答不賣往下到第三題，問需不需要同一個版本穩定用上好幾年，答需要就比較版本壽命：開放權重的檔案留著就能繼續載入，閉源要看退場公告，OpenAI 一般可用的模型至少 6 個月、Anthropic 至少 60 天。答不必往下到第四題，問願不願意自己準備硬體與後續維護，答不願意就走閉源 API，或把開放權重放到雲端託管，此時資料條款回到那家：商用通道預設不訓練，濫用紀錄多半保留 30 天。最下方一條提醒：兩邊都用也可以，不能外流的內容自架，其餘的走 API。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">開放權重還是閉源 API：決策樹</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Open weights or closed API: a decision tree</text>

  <!-- row 1 -->
  <rect x="60" y="120" width="560" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="340" y="176" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">你要送進去的內容，</text>
  <text x="340" y="208" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">可以離開你的電腦嗎？</text>
  <line x1="620" y1="186" x2="768" y2="186" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="695" y="172" font-size="17" fill="#B8442D" text-anchor="middle">不可以</text>
  <rect x="780" y="120" width="760" height="132" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="810" y="172" font-size="20" font-weight="700" fill="#102A2B">自架開放權重模型</text>
  <text x="810" y="210" font-size="17" fill="#5C6B6B">權重下載到自己的機器，資料流向由整個應用程式的設定決定</text>
  <line x1="340" y1="252" x2="340" y2="278" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="358" y="274" font-size="17" fill="#5C6B6B">可以</text>

  <!-- row 2 -->
  <rect x="60" y="288" width="560" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="340" y="344" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">要把模型包進自己的</text>
  <text x="340" y="376" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">產品或服務裡賣嗎？</text>
  <line x1="620" y1="354" x2="768" y2="354" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="695" y="340" font-size="17" fill="#D97A2B" text-anchor="middle">要</text>
  <rect x="780" y="288" width="760" height="132" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="810" y="332" font-size="20" font-weight="700" fill="#102A2B">先讀那個版本的 LICENSE 檔</text>
  <text x="810" y="366" font-size="17" fill="#5C6B6B">Apache 2.0 與 MIT 只要保留聲明；Llama 4 要標 Built with Llama</text>
  <text x="810" y="394" font-size="17" fill="#5C6B6B">Qwen 兩份自訂授權在 1 億月活躍使用者或 2,000 萬美元月營收時要標模型名稱</text>
  <line x1="340" y1="420" x2="340" y2="446" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="358" y="442" font-size="17" fill="#5C6B6B">不賣</text>

  <!-- row 3 -->
  <rect x="60" y="456" width="560" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="340" y="512" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">需要同一個版本</text>
  <text x="340" y="544" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">穩定用上好幾年嗎？</text>
  <line x1="620" y1="522" x2="768" y2="522" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="695" y="508" font-size="17" fill="#2E7D5B" text-anchor="middle">需要</text>
  <rect x="780" y="456" width="760" height="132" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="810" y="500" font-size="20" font-weight="700" fill="#102A2B">版本壽命：兩邊的算法不一樣</text>
  <text x="810" y="534" font-size="17" fill="#5C6B6B">開放權重：檔案留著就能繼續載入</text>
  <text x="810" y="562" font-size="17" fill="#5C6B6B">閉源：看退場公告，OpenAI 一般模型至少 6 個月、Anthropic 至少 60 天</text>
  <line x1="340" y1="588" x2="340" y2="614" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="358" y="610" font-size="17" fill="#5C6B6B">不必</text>

  <!-- row 4 -->
  <rect x="60" y="624" width="560" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="340" y="680" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">願意自己準備硬體</text>
  <text x="340" y="712" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">與後續的維護嗎？</text>
  <line x1="620" y1="690" x2="768" y2="690" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="695" y="676" font-size="17" fill="#B8442D" text-anchor="middle">不願意</text>
  <rect x="780" y="624" width="760" height="132" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="810" y="676" font-size="20" font-weight="700" fill="#102A2B">閉源 API，或把開放權重放到雲端託管</text>
  <text x="810" y="714" font-size="17" fill="#5C6B6B">資料條款回到那家：商用通道預設不訓練，濫用紀錄多半保留 30 天</text>

  <!-- footer note -->
  <rect x="60" y="782" width="1480" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="822" font-size="20" fill="#102A2B" text-anchor="middle">兩邊都用也可以：不能外流的內容自架，其餘的走 API</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
