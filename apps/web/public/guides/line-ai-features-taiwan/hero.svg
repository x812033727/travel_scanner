<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">聊天室裡的 AI / AI inside a chat app</title>
  <desc id="desc">抽象插圖。左邊一個大的圓角對話框，裡面三條長短不一的訊息線條，右上角有一顆橘色四角星，代表生成式 AI。三條曲線從對話框往右延伸，分別連到三個小圖形：一個小對話框代表聊天室、一個帶標題列的方框代表店家後台、一個撥到開啟位置的開關代表設定裡的資料使用選項。畫面下方一行字寫著「聊天室裡的 AI」。全圖只用圓形、圓角矩形與線條，沒有任何品牌標誌或介面截圖。</desc>

