<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">LINE 內的 AI 功能地圖 / Where LINE's AI lives</title>
  <desc id="desc">左上方是聊天室裡台灣可用的 AI：社群主聊天室右下角的訊息摘要按鈕，免費但需要 LINE 應用程式 13.16.0 以上版本而且沒有開關；以及社群上方選單裡的翻譯自動程式，需要管理權限，可以套用給所有成員。左下方是官方帳號端：店家在後台的回應設定裡開 AI 聊天機器人測試版，屬於聊天進階方案，訂閱制新台幣 100 元，測試版有每月回覆上限，官方建議好友數低於 25,000 的商家使用，上傳的資訊不會使用於 AI 學習。兩個左方區塊各有一個箭頭指向右方的設定區塊：使用者之間的聊天、以及與官方帳號的對話。右方寫的是設定裡唯一能自己動的一格，路徑是設定、隱私設定、提供使用資料、聊天室資訊，關掉的是拿你的資訊改善服務，不是關掉某一個 AI 功能；與官方帳號的對話內容可能被使用，使用者之間的聊天內容不會被使用。底部整條說明 Agent i、AI Friends 與 LINE AI 服務吃到飽方案只在日本版查得到，支援中心的 AI 分類只有日文頁，同一個分類網址換成繁體中文語系會被導回首頁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">LINE 內的 AI 功能地圖：聊天室、官方帳號、設定</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Where LINE's AI lives: chat rooms, official accounts and one settings switch</text>

  <rect x="60" y="120" width="640" height="230" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="165" font-size="20" font-weight="700" fill="#102A2B">聊天室裡・台灣可用</text>
  <text x="90" y="205" font-size="16" fill="#102A2B">訊息摘要：社群主聊天室右下角的按鈕</text>
  <text x="90" y="235" font-size="16" fill="#5C6B6B">免費；需 13.16.0 以上版本，沒有開關</text>
  <text x="90" y="278" font-size="16" fill="#102A2B">翻譯自動程式：社群上方選單的自動程式</text>
  <text x="90" y="308" font-size="16" fill="#5C6B6B">需管理權限；可套用給所有成員</text>

  <rect x="60" y="375" width="640" height="230" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="90" y="420" font-size="20" font-weight="700" fill="#102A2B">官方帳號端・店家付費</text>
  <text x="90" y="460" font-size="16" fill="#102A2B">AI 聊天機器人測試版：後台的回應設定</text>
  <text x="90" y="490" font-size="16" fill="#5C6B6B">聊天進階方案 NT$100；測試版有回覆上限</text>
  <text x="90" y="533" font-size="16" fill="#5C6B6B">建議好友數低於 25,000 的商家使用</text>
  <text x="90" y="563" font-size="16" fill="#5C6B6B">上傳的資訊不會使用於 AI 學習</text>

  <path d="M 700 245 L 878 292" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="790" y="228" font-size="15" fill="#5C6B6B" text-anchor="middle">使用者間的聊天</text>
  <path d="M 700 485 L 878 438" fill="none" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="790" y="522" font-size="15" fill="#5C6B6B" text-anchor="middle">與官方帳號的對話</text>

  <rect x="900" y="190" width="640" height="340" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="930" y="238" font-size="20" font-weight="700" fill="#102A2B">設定裡・你能自己動的一格</text>
  <text x="930" y="282" font-size="16" fill="#102A2B">設定 &gt; 隱私設定 &gt; 提供使用資料</text>
  <text x="930" y="312" font-size="16" fill="#102A2B">&gt; 聊天室資訊</text>
  <text x="930" y="356" font-size="16" fill="#B8442D">關掉的是「拿你的資訊改善服務」，</text>
  <text x="930" y="386" font-size="16" fill="#B8442D">不是關掉某一個 AI 功能</text>
  <text x="930" y="430" font-size="16" fill="#5C6B6B">與官方帳號的對話內容可能被使用</text>
  <text x="930" y="460" font-size="16" fill="#5C6B6B">使用者之間的聊天內容不會被使用</text>

  <rect x="60" y="640" width="1480" height="160" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="90" y="688" font-size="20" font-weight="700" fill="#102A2B">只在日本版查得到：支援中心的 AI 分類只有日文頁</text>
  <text x="90" y="728" font-size="16" fill="#102A2B">Agent i：主頁的圖示</text>
  <text x="560" y="728" font-size="16" fill="#102A2B">AI Friends：聊天畫面上方</text>
  <text x="1040" y="728" font-size="16" fill="#102A2B">吃到飽方案：主頁的設定</text>
  <text x="90" y="768" font-size="16" fill="#5C6B6B">同一個分類網址換成繁體中文語系，標題會變成「首頁」，等於這個語系沒有這個分類</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
