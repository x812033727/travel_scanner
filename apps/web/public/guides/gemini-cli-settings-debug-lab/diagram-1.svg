<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">八組實驗，先找來源再改值</title><desc id="desc">來源：使用者 → 專案：再看系統強制設定；格式：JSON 與資料型別：是不同的檢查；使用：未知鍵可能保留：不代表功能存在；環境：信任・版本・引數：每次只變一項</desc>
<rect width="1600" height="900" fill="#f7f3e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#122e39" font-weight="800">八組實驗，先找來源再改值</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#286657" font-weight="800">來源</text><text x="120" y="311" font-size="54" fill="#122e39" font-weight="500">使用者 → 專案</text><text x="120" y="379" font-size="54" fill="#122e39" font-weight="500">再看系統強制設定</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#286657" font-weight="800">格式</text><text x="855" y="311" font-size="54" fill="#122e39" font-weight="500">JSON 與資料型別</text><text x="855" y="379" font-size="54" fill="#122e39" font-weight="500">是不同的檢查</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#286657" font-weight="800">使用</text><text x="120" y="601" font-size="54" fill="#122e39" font-weight="500">未知鍵可能保留</text><text x="120" y="669" font-size="54" fill="#122e39" font-weight="500">不代表功能存在</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#c3d5ca" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#286657" font-weight="800">環境</text><text x="855" y="601" font-size="54" fill="#122e39" font-weight="500">信任・版本・引數</text><text x="855" y="669" font-size="54" fill="#122e39" font-weight="500">每次只變一項</text><text x="85" y="818" font-size="47" fill="#48615c" font-weight="500">實測：CLI 0.59.0；其他版本需重做</text></g></svg>