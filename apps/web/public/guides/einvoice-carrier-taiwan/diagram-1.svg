<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">手機條碼的一次性設定與每次結帳的選擇 / E-invoice carrier setup</title>
<desc id="desc">左欄是只做一次的三個設定：申請手機條碼並回信箱點驗證信開通、把儲值卡與會員載具歸戶到條碼底下、設定本人的領獎帳戶。中欄是每次結帳的三選一：存入載具、索取紙本、指定捐贈，只有未列印證明聯的才算雲端發票。右欄是開獎之後由平台自動對獎，獎金扣稅後匯入帳戶。底部時間軸依序為單月二十五日開獎、次日公告中獎號碼、次月六日起三個月內領獎，設定必須趕在開獎日之前完成。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一次設定，之後每次結帳只做一件事</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">E-invoice carrier · set up once, then just show the barcode</text>

<text x="60" y="162" font-size="20" font-weight="700" fill="#5C6B6B">只做一次的設定</text>
<rect x="60" y="180" width="400" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="260" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">申請手機條碼</text>
<text x="260" y="268" text-anchor="middle" font-size="17" fill="#5C6B6B">回信箱點驗證信開通</text>
<rect x="60" y="320" width="400" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="260" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">載具歸戶</text>
<text x="260" y="408" text-anchor="middle" font-size="17" fill="#5C6B6B">儲值卡、會員載具掛到條碼下</text>
<rect x="60" y="460" width="400" height="120" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="260" y="512" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">設定領獎帳戶</text>
<text x="260" y="548" text-anchor="middle" font-size="17" fill="#5C6B6B">填本人金融或郵政帳號</text>

<path d="M472 380 L545 380" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<text x="560" y="162" font-size="20" font-weight="700" fill="#5C6B6B">每次結帳：三選一</text>
<rect x="560" y="180" width="420" height="400" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<rect x="590" y="215" width="360" height="100" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
<text x="770" y="258" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">存入載具</text>
<text x="770" y="292" text-anchor="middle" font-size="16" fill="#5C6B6B">未列印證明聯才算雲端發票</text>
<rect x="590" y="330" width="360" height="100" rx="12" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
<text x="770" y="373" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">索取紙本</text>
<text x="770" y="407" text-anchor="middle" font-size="16" fill="#5C6B6B">電子發票證明聯列印一次為限</text>
<rect x="590" y="445" width="360" height="100" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
<text x="770" y="488" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">指定捐贈</text>
<text x="770" y="522" text-anchor="middle" font-size="16" fill="#5C6B6B">由受捐贈機關團體領獎</text>

<path d="M992 380 L1115 380" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<text x="1130" y="162" font-size="20" font-weight="700" fill="#5C6B6B">開獎之後</text>
<rect x="1130" y="180" width="410" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1335" y="252" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">平台自動對獎</text>
<text x="1335" y="292" text-anchor="middle" font-size="17" fill="#5C6B6B">歸戶後集中在同一處</text>
<path d="M1335 356 L1335 402" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1130" y="410" width="410" height="170" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1335" y="482" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">獎金扣稅後匯入帳戶</text>
<text x="1335" y="522" text-anchor="middle" font-size="17" fill="#5C6B6B">帳戶須在開獎日前設好</text>

<text x="60" y="690" font-size="20" fill="#B8442D">設定要在開獎日之前完成；開獎之後才補，那一期就來不及。</text>
<path d="M140 790 L1460 790" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<circle cx="260" cy="790" r="10" fill="#0D6B68"/>
<circle cx="700" cy="790" r="10" fill="#0D6B68"/>
<circle cx="1180" cy="790" r="10" fill="#D97A2B"/>
<text x="260" y="762" text-anchor="middle" font-size="18" fill="#102A2B">單月二十五日開獎</text>
<text x="700" y="762" text-anchor="middle" font-size="18" fill="#102A2B">次日公告中獎號碼</text>
<text x="1180" y="762" text-anchor="middle" font-size="18" fill="#102A2B">次月六日起三個月內領獎</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
