<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>読んでも忘れてしまうときのノート整理：問い、自分の説明、出典で使える内容を残す：判断の流れ</title><desc>問いを立てる、自分で説明する、出典を残す、振り返って修正する、の順に確認します。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践の順序</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくてもよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">問いを立てる</text><text x="103" y="497" fill="#f4f0e5" font-size="23">問いから始める</text><text x="103" y="573" fill="#f4dc9d" font-size="26">何を理解したいか</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">自分で説明する</text><text x="473" y="497" fill="#f4f0e5" font-size="23">自分の言葉で説明</text><text x="473" y="573" fill="#f4dc9d" font-size="26">引用は別に示す</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">出典を残す</text><text x="843" y="497" fill="#f4f0e5" font-size="23">出典を保存する</text><text x="843" y="573" fill="#f4dc9d" font-size="26">版を確認し直せる</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">振り返って修正</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">思い出して修正</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">試して限界を追記</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の図解</text></g></svg>
