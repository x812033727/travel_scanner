<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>读完就忘怎么整理笔记：用问题、自己的解释与来源留下可用内容：判断流程</title><desc>依次检查：提出问题、自己解释、留下来源、回顾后修正。编辑整理，非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">实用的先后顺序</text><text x="100" y="175" fill="#576968" font-size="25">按你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">提出问题</text><text x="103" y="497" fill="#f4f0e5" font-size="23">从问题开始</text><text x="103" y="573" fill="#f4dc9d" font-size="26">想理解什么</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">自己解释</text><text x="473" y="497" fill="#f4f0e5" font-size="23">用自己的话说明</text><text x="473" y="573" fill="#f4dc9d" font-size="26">引文另外标记</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">留下来源</text><text x="843" y="497" fill="#f4f0e5" font-size="23">保留来源</text><text x="843" y="573" fill="#f4dc9d" font-size="26">版本可以回查</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">回顾后修正</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">回想并修正</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">试用后补上边界</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意图</text></g></svg>
