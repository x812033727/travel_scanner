<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>읽고도 잊어버린다면: 질문, 자신의 설명, 출처로 다시 쓸 수 있는 독서 노트 만들기: 판단 순서</title><desc>질문하기, 스스로 설명하기, 출처 남기기, 복습하고 수정하기 순서로 확인합니다. 편집부가 정리한 안내이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실천 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하며 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">질문하기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">질문부터 시작</text><text x="103" y="573" fill="#f4dc9d" font-size="26">무엇을 이해할까</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">스스로 설명</text><text x="473" y="497" fill="#f4f0e5" font-size="23">자신의 말로 설명</text><text x="473" y="573" fill="#f4dc9d" font-size="26">인용은 따로 표시</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">출처 남기기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">출처 보관</text><text x="843" y="573" fill="#f4dc9d" font-size="26">판본을 다시 확인</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">복습하고 수정</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">떠올린 뒤 수정</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">시도 후 한계 추가</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 도해</text></g></svg>
