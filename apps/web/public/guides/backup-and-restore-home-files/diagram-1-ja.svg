<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>家庭のファイルは同期完了だけで安心しない：復元を試して、取り戻せるか確かめる: 判断の流れ</title><desc>順に確認：重要なデータを挙げる、コピーを確認する、サンプルを復元する、定期的に再確認する。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">手順 · 実践的な進め方</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせ、すべてを一度に終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="29" font-weight="700" style="font-size: 29px;">重要なデータを挙げる</text><text x="103" y="497" fill="#f4f0e5" font-size="23">大切なものを一覧に</text><text x="103" y="573" fill="#f4dc9d" font-size="26">元ファイルの場所を明確に</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">コピーを確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">コピーを点検する</text><text x="473" y="573" fill="#f4dc9d" font-size="26">版と場所を分けて確認</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">サンプルを復元</text><text x="843" y="497" fill="#f4f0e5" font-size="23">復元を試す</text><text x="843" y="573" fill="#f4dc9d" font-size="26">別に保存し、上書きしない</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">定期的に再確認</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">変更を点検する</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">新しい端末も対象に</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の説明図</text></g></svg>
