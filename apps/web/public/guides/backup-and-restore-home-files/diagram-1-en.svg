<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Home File Backups Need More Than a Sync Check: Test a Restore to Know You Can Recover: Decision process</title><desc>Check in order: list important data, check copies, test a sample restore, and check again regularly. An editorial guide, not a map or measured timing.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Order of steps · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Adapt to your situation; you need not finish everything at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">List important data</text><text x="103" y="497" fill="#f4f0e5" font-size="23">List what matters</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Locate the originals</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">Check copies</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Check the copies</text><text x="473" y="573" fill="#f4dc9d" font-size="23" style="font-size: 23px;">Separate versions / locations</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Test a restore</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Test a restore</text><text x="843" y="573" fill="#f4dc9d" font-size="23" style="font-size: 23px;">Save a copy; don't overwrite</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Check regularly</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Review changes</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Include new devices</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editorial diagram</text></g></svg>
