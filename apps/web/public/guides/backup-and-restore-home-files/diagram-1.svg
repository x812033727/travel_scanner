<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>家庭檔案備份別只看同步完成：做一次還原，才知道能不能找回：判斷流程</title><desc>依序檢查：列重要資料、確認副本、還原抽查、定期再查。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">列重要資料</text><text x="103" y="497" fill="#f4f0e5" font-size="23">List what matters</text><text x="103" y="573" fill="#f4dc9d" font-size="26">原檔位置清楚</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">確認副本</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Check the copies</text><text x="473" y="573" fill="#f4dc9d" font-size="26">版本位置分開</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">還原抽查</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Test a restore</text><text x="843" y="573" fill="#f4dc9d" font-size="26">另存不覆蓋</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">定期再查</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Review changes</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">新裝置要納入</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>