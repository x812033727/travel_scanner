    <circle cx="1000" cy="370" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1000" y="330" text-anchor="middle">天王寺</text>
    <circle cx="1250" cy="370" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1285" y="362">新大阪</text>
    <text x="1285" y="390" font-size="18" font-weight="400" fill="#5C6B6B">はるか 約51分 · 新幹線に乗り換え</text>
    <text x="80" y="190" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="start">天王寺：はるか約33分・関空快速約45分</text>
    <circle cx="1250" cy="520" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1285" y="528">京都</text>
    <text x="1285" y="556" font-size="18" font-weight="400" fill="#5C6B6B">はるか 約78分</text>
    <circle cx="1210" cy="690" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="698">京都駅（バス）</text>
    <circle cx="1230" cy="800" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="808">大阪・梅田</text>
