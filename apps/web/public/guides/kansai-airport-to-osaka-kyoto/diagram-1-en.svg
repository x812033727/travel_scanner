<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Kansai Airport to Osaka and Kyoto Route Map / Kansai Airport rail and bus routes to Osaka and Kyoto</title>
  <desc id="desc">Nankai Rapi:t and Airport Express serve Namba; JR Limited Express HARUKA serves Tennoji, Shin-Osaka, and Kyoto; JR Kansai Airport Rapid serves Tennoji and Osaka; limousine buses serve Umeda, Namba, and Kyoto Station.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="80" y="88" font-size="40" font-weight="700" fill="#102A2B">Kansai Airport → Osaka / Kyoto Main Routes</text>
  <text x="80" y="128" font-size="22" fill="#5C6B6B">Kansai Airport → Osaka / Kyoto · Approx. travel times; check official timetables</text>


