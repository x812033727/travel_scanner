<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">关西机场至大阪、京都的铁路与巴士路线图</title>
  <desc id="desc">南海电铁 Rapi:t 与机场急行前往难波；JR 特急 HARUKA 前往天王寺、新大阪、京都；JR 关空快速前往天王寺、大阪；利木津巴士前往梅田、难波与京都站。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="80" y="88" font-size="40" font-weight="700" fill="#102A2B">关西机场 → 大阪·京都　主要路线</text>
  <text x="80" y="128" font-size="22" fill="#5C6B6B">关西机场 → 大阪／京都 · 时间为大致车程，以官网时刻表为准</text>


  <path d="M 300 480 C 620 480, 760 230, 1250 230" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"></path>

  <path d="M 300 480 C 620 480, 760 370, 1000 370 L 1250 370 L 1250 520 L 1250 690" fill="none" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M 1000 370 C 1100 370, 1140 800, 1250 800" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="4 14" stroke-linecap="round"></path>

  <path d="M 300 480 C 620 560, 900 800, 1210 800" fill="none" stroke="#B8442D" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"></path>
  <path d="M 300 480 C 700 620, 1000 690, 1210 690" fill="none" stroke="#B8442D" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"></path>

  <g>
    <rect x="80" y="420" width="220" height="120" rx="24" fill="#0D6B68"></rect>
    <text x="190" y="470" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">关西机场</text>
    <text x="190" y="508" font-size="20" fill="#E6F2F1" text-anchor="middle">关西机场 · KIX</text>
  </g>

  <g font-size="26" font-weight="700" fill="#102A2B">
    <circle cx="1250" cy="230" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"></circle>
    <text x="1285" y="222">难波 Namba</text>
    <text x="1285" y="250" font-size="18" font-weight="400" fill="#5C6B6B">Rapi:t 约 38 分钟 · 机场急行约 45 分钟</text>
    <circle cx="1000" cy="370" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1000" y="330" text-anchor="middle">天王寺 Tennoji</text>
    <circle cx="1250" cy="370" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1285" y="362">新大阪 Shin-Osaka</text>
    <text x="1285" y="390" font-size="18" font-weight="400" fill="#5C6B6B">HARUKA 约 51 分钟 · 换乘新干线</text>
    <text x="80" y="190" font-size="18" font-weight="400" fill="#5C6B6B" text-anchor="start">天王寺：HARUKA 约 33 分钟 · 关空快速约 45 分钟</text>
    <circle cx="1250" cy="520" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1285" y="528">京都 Kyoto</text>
    <text x="1285" y="556" font-size="18" font-weight="400" fill="#5C6B6B">HARUKA 约 78 分钟</text>
    <circle cx="1210" cy="690" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="698" font-size="20" style="font-size: 20px;">京都站 Kyoto Station（巴士）</text>
    <circle cx="1230" cy="800" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="808" font-size="23" style="font-size: 23px;">大阪·梅田 Osaka / Umeda</text>
    <text x="1285" y="836" font-size="18" font-weight="400" fill="#5C6B6B">快速 70 · HARUKA 45 · 巴士 60 分钟</text>
  </g>

  <g font-size="22" font-weight="700">
    <text x="650" y="190" fill="#0D6B68">南海电铁 Nankai · Rapi:t／机场急行</text>
    <text x="320" y="320" fill="#6B4A3A">JR 特急 HARUKA</text>
    <text x="750" y="555" fill="#6B4A3A">JR 关空快速</text>
    <text x="80" y="700" fill="#B8442D">利木津巴士 Airport Limousine</text>
  </g>

  <g font-size="20" fill="#102A2B">
    <line x1="80" y1="860" x2="140" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"></line>
    <text x="152" y="867">南海电铁 Nankai</text>
    <line x1="400" y1="860" x2="460" y2="860" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"></line>
    <text x="472" y="867">JR 西日本 JR West</text>
    <line x1="760" y1="860" x2="820" y2="860" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"></line>
    <text x="832" y="867">巴士 Bus</text>
    <text x="1180" y="867" fill="#5C6B6B">© Mokaair 制图 2026</text>
  </g>
</svg>
