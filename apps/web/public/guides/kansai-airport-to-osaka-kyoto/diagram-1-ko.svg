<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">간사이공항에서 오사카·교토까지 철도 및 버스 노선</title>
  <desc id="desc">난카이 전철 Rapi:t와 공항급행은 난바로, JR 특급 HARUKA는 덴노지·신오사카·교토로, JR 간쿠 쾌속은 덴노지·오사카로, 리무진버스는 우메다·난바·교토역으로 갑니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="88" font-size="40" font-weight="700" fill="#102A2B">간사이공항 → 오사카·교토 주요 노선</text>
  <text x="80" y="128" font-size="22" fill="#5C6B6B">간사이공항 → 오사카 / 교토 · 시간은 대략적인 소요 시간이며 공식 시간표 기준</text>


