<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">三種預算方法的切割單位與失效點 / Three budgeting methods compared</title>
<desc id="desc">三欄並列比較：50/30/20 切的是比例，分成必要、想要、儲蓄與還債，適合月收入穩定且固定支出佔比不高的人，固定支出本來就超過比例上限時就對不上；信封法切的是類別與額度，只管變動支出，適合變動支出筆數多的人，年繳與季繳項目不會出現在當月信封裡；零基預算切的是每一筆用途，把餘額分配到零，適合收入不固定的人，代價是每個月都要重做一次。圖下方提醒：年繳與季繳的項目先除以十二，攤提到每個月。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">三種預算方法的切割單位與失效點</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Three budgeting methods · 先看假設，再挑方法</text>

<rect x="60" y="130" width="440" height="96" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="280" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#102A2B">50/30/20</text>

<rect x="580" y="130" width="440" height="96" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#102A2B">信封法</text>

<rect x="1100" y="130" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1320" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#102A2B">零基預算</text>

<rect x="60" y="250" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="280" y="288" text-anchor="middle" font-size="17" fill="#5C6B6B">切割的單位</text>
<text x="280" y="326" text-anchor="middle" font-size="20" fill="#102A2B">比例</text>
<text x="280" y="360" text-anchor="middle" font-size="20" fill="#102A2B">必要、想要、儲蓄與還債</text>

<rect x="580" y="250" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="288" text-anchor="middle" font-size="17" fill="#5C6B6B">切割的單位</text>
<text x="800" y="326" text-anchor="middle" font-size="20" fill="#102A2B">類別與額度</text>
<text x="800" y="360" text-anchor="middle" font-size="20" fill="#102A2B">只管變動支出</text>

<rect x="1100" y="250" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1320" y="288" text-anchor="middle" font-size="17" fill="#5C6B6B">切割的單位</text>
<text x="1320" y="326" text-anchor="middle" font-size="20" fill="#102A2B">每一筆用途</text>
<text x="1320" y="360" text-anchor="middle" font-size="20" fill="#102A2B">餘額分配到零</text>

<rect x="60" y="410" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="280" y="448" text-anchor="middle" font-size="17" fill="#5C6B6B">適合的現金流</text>
<text x="280" y="486" text-anchor="middle" font-size="20" fill="#102A2B">月收入穩定</text>
<text x="280" y="520" text-anchor="middle" font-size="20" fill="#102A2B">固定支出佔比不高</text>

<rect x="580" y="410" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="448" text-anchor="middle" font-size="17" fill="#5C6B6B">適合的現金流</text>
<text x="800" y="486" text-anchor="middle" font-size="20" fill="#102A2B">變動支出筆數多</text>
<text x="800" y="520" text-anchor="middle" font-size="20" fill="#102A2B">想隨時看到還剩多少</text>

<rect x="1100" y="410" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1320" y="448" text-anchor="middle" font-size="17" fill="#5C6B6B">適合的現金流</text>
<text x="1320" y="486" text-anchor="middle" font-size="20" fill="#102A2B">收入不固定</text>
<text x="1320" y="520" text-anchor="middle" font-size="20" fill="#102A2B">每個月金額都不同</text>

<rect x="60" y="570" width="440" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="280" y="610" text-anchor="middle" font-size="17" fill="#B8442D">最容易失效的地方</text>
<text x="280" y="652" text-anchor="middle" font-size="20" fill="#102A2B">固定支出本來就</text>
<text x="280" y="686" text-anchor="middle" font-size="20" fill="#102A2B">超過比例上限時，</text>
<text x="280" y="720" text-anchor="middle" font-size="20" fill="#102A2B">對不上也改不動</text>

<rect x="580" y="570" width="440" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="610" text-anchor="middle" font-size="17" fill="#B8442D">最容易失效的地方</text>
<text x="800" y="652" text-anchor="middle" font-size="20" fill="#102A2B">年繳與季繳的項目</text>
<text x="800" y="686" text-anchor="middle" font-size="20" fill="#102A2B">不會出現在</text>
<text x="800" y="720" text-anchor="middle" font-size="20" fill="#102A2B">當月的信封裡</text>

<rect x="1100" y="570" width="440" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1320" y="610" text-anchor="middle" font-size="17" fill="#B8442D">最容易失效的地方</text>
<text x="1320" y="652" text-anchor="middle" font-size="20" fill="#102A2B">每個月要重做一次，</text>
<text x="1320" y="686" text-anchor="middle" font-size="20" fill="#102A2B">沒有實際紀錄</text>
<text x="1320" y="720" text-anchor="middle" font-size="20" fill="#102A2B">就只是填願望</text>

<text x="60" y="800" font-size="20" fill="#5C6B6B">年繳與季繳的項目先除以十二，攤提到每個月，三種方法才都撐得住。</text>
<text x="60" y="834" font-size="20" fill="#5C6B6B">比例是別人的經驗值，不是規則；對不上的時候先看假設，不是先改數字。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
