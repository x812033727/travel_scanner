<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">預算怎麼抓：50/30/20、信封法與零基預算的差別</title>
<desc id="desc">左側一個圓角方塊裡有一枚圓形錢幣，代表一個月可動用的錢。三道粗箭頭從方塊往右分岔，通往右側三個同樣大小的方塊：第一個方塊裡是一條被兩道線分成三段的橫條，代表按比例分配；第二個是一個有翻蓋的信封，代表信封法；第三個是十二個小方格排成的格子，代表每一筆用途都先指定去處的零基預算。三個方塊大小相同，沒有高低之分。</desc>
