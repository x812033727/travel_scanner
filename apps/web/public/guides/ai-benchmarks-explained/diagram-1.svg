<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">你的任務對到哪個榜 / Match your task to the right leaderboard</title>
<desc id="desc">一張三欄對照表。左欄「你的任務」由上到下五列：日常問答與寫作、寫程式與修 bug、代理跑多步任務、專業知識與數學、長文件與長對話。中欄「該看哪個榜」依序對應：Arena 文字榜與子分類，由人類盲測投票以 Bradley-Terry 算分；SWE-bench Verified 的 Bash Only 榜，500 題放在同一個極簡環境；Arena 代理榜，2026 年 8 月 14 日起依任務分類並標出成本；各家 model card 裡的 GPQA 與 AIME，由廠商自己跑、自己寫條件；長上下文題庫，官方會寫測的是哪個長度。右欄「看數字前先確認」依序對應：分數旁的 95% 信賴區間與有沒有標 AutoEval；是不是同一個子集、外框與嘗試次數對不對；任務類別對不對、一次任務要花多少錢；有沒有給工具、跑幾次取平均；測的是多長的內容、是累積分還是單點分。最下方一條橫帶寫著三個陷阱：題目外洩與過擬合、廠商自報數字的測試條件、榜單更新速度與方法都會變；並提醒三個都對不上時，自己出五題，同一份提示詞讓兩個候選各跑一次。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#5C6B6B"/>
</marker>
</defs>

