<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">跑分怎麼看 / How to read a model leaderboard</title>
<desc id="desc">一張幾何插圖。畫面左半是一個白色圓角面板，代表一張排行榜，面板裡由上到下排著四條長短不一的圓角橫條，顏色依序是深綠、藍、橘、綠，長度一條比一條短。畫面右半是一個大放大鏡：一個粗黑邊的圓形鏡片，鏡片裡有三條更短的橫條，鏡片右下方接著一根粗斜線當握把。四周散落幾個彩色圓點。畫面下方寫著「跑分怎麼看」。圖中沒有任何產品標誌、介面截圖或人物。</desc>
