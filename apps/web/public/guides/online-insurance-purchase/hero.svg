<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">螢幕裡的線上要保書，箭頭指向一個帶鎖的信封 / An online application on a screen, an arrow pointing to a sealed envelope</title>
<desc id="desc">插圖。畫面左側是一台簡化的螢幕，深綠色邊框、白色機身，螢幕內是淺綠底的頁面，頁面上有三條代表文字的粗橫線，底下有一個綠色的勾選框，框內打了一個勾，勾選框右側再一條橫線，代表線上要保書與告知事項的勾選。螢幕下方有一個深綠色的底座。螢幕右側有一支粗箭頭由左往右指向畫面右側的信封。信封是白色、藍色邊框，上緣有一道向下的摺線形成信封蓋，信封下半部畫著一把藍色的鎖，鎖身是圓角方形、上方有一個半圓形鎖環，代表送達的電子保單。畫面下方中央有一行字寫著「網路投保」。圖上沒有任何機構標誌、人臉、金額、曲線或由低到高的長條。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0D6B68"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

<rect x="180" y="180" width="520" height="400" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10"/>
<rect x="220" y="220" width="440" height="290" rx="10" fill="#E3F0EF"/>
<line x1="270" y1="270" x2="610" y2="270" stroke="#5C6B6B" stroke-width="10" stroke-linecap="butt"/>
<line x1="270" y1="315" x2="610" y2="315" stroke="#5C6B6B" stroke-width="10" stroke-linecap="butt"/>
<line x1="270" y1="360" x2="530" y2="360" stroke="#5C6B6B" stroke-width="10" stroke-linecap="butt"/>
<rect x="270" y="410" width="46" height="46" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
<path d="M 281 433 L 292 445 L 307 421" fill="none" stroke="#2E7D5B" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
<line x1="345" y1="433" x2="610" y2="433" stroke="#5C6B6B" stroke-width="10" stroke-linecap="butt"/>
<rect x="300" y="580" width="280" height="24" rx="12" fill="#0D6B68"/>

<line x1="740" y1="380" x2="930" y2="380" stroke="#0D6B68" stroke-width="16" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="980" y="250" width="420" height="290" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="10"/>
