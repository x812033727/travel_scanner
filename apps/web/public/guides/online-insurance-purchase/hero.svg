<rect x="1145" y="450" width="90" height="76" rx="10" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8"/>

<text x="800" y="730" font-size="60" font-weight="700" text-anchor="middle" fill="#102A2B">網路投保</text>
</svg>
