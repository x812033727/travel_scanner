<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">網路投保流程：哪一步在臨櫃是別人做、線上是自己做 / Online insurance purchase: who does each step</title>
<desc id="desc">流程對照圖。最上面一列是線上投保的五個步驟，由左往右依序為第一步身分驗證與註冊、第二步線上要保書與告知、第三步繳交保險費、第四步電子保單送達、第五步契約撤銷權，步驟之間以箭頭相連。中間一列標出同一步在臨櫃或業務員通路由誰做：業務員核對身分並見證簽名、業務員說明商品並填寫招攬報告書、現場收費或約定轉帳、多為紙本保單送達、保險單送達翌日起算十日內。最下面一列標出在網路通路改由要保人自己做：自己註冊並完成身分驗證、自己讀條款全文並自己勾選告知、限本人信用卡或帳戶或電子支付、簡訊或電子郵件通知後送達、自己記起算日並自己提出撤銷。圖下方兩行說明：告知義務不因通路而改變，保險法第六十四條的據實說明義務在投保網頁上與紙本要保書相同；能線上投保的險種與保額上限以主管機關公告的現行附件為準。</desc>
