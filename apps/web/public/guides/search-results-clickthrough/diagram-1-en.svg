<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Arial','Noto Sans TC',sans-serif">
<title id="title">Reading search results: SERP features, CTR and changing impressions</title><desc id="desc">Four columns: inspect raw impression and click counts, keep segments comparable, observe result features, then revise titles and snippets to match the page.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="46" fill="#102A2B" text-anchor="start" font-weight="bold">When CTR falls: what to check</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Compare counts and scope before reviewing result features and edits</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Check totals</text>
<text x="108.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Clicks ÷ impressions</text>
<text x="108.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Did the base expand?</text>
<text x="108.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Do not average rates</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Hold segments</text>
<text x="477.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Match period and site</text>
<text x="477.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Query and page aim</text>
<text x="477.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Use the same rollup</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Inspect results</text>
<text x="846.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Text, image and video</text>
<text x="846.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Rank is not pixels</text>
<text x="846.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">One view has limits</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Review changes</text>
<text x="1215.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Match the page content</text>
<text x="1215.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Save edits and dates</text>
<text x="1215.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">Observe like for like</text>
<text x="80" y="803" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal">A rate change starts an investigation; it alone proves neither lost traffic nor an edit effect.</text>
<text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair original artwork</text>
</svg>
