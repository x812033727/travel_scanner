<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Malgun Gothic','Noto Sans TC',sans-serif">
<title id="title">검색결과 페이지 읽기: SERP 구성, CTR과 노출수 변화</title><desc id="desc">네 칸에 노출수·클릭수의 원래 값, 동일한 그룹 조건, 결과 영역을 확인한 다음 본문에 맞는 제목과 스니펫을 수정하는 순서를 설명한다.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">CTR 하락 시 점검 순서</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">수치와 범위를 먼저 확인한 뒤 검색결과 구성과 수정을 평가</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">전체 수치 확인</text>
<text x="108.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">클릭수 ÷ 노출수</text>
<text x="108.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">분모가 커졌나</text>
<text x="108.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">비율 단순 평균 금지</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">그룹 조건 고정</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">기간·속성·기기</text>
<text x="477.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">검색어·페이지 목적</text>
<text x="477.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">집계 방식 일치</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">결과 구성 관찰</text>
<text x="846.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">텍스트·이미지·영상</text>
<text x="846.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">순위는 픽셀 아님</text>
<text x="846.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">한 번 본 화면의 한계</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">수정 사항 확인</text>
<text x="1215.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">본문에 맞는 설명</text>
<text x="1215.0" y="423" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">수정 내용·날짜 기록</text>
<text x="1215.0" y="475" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">같은 조건으로 관찰</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">비율 변화만으로 트래픽 손실이나 수정 효과를 판단할 수 없습니다.</text>
<text x="1520" y="862" font-size="23" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
