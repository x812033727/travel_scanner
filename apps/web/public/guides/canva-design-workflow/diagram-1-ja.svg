<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Canvaデザインの四つの確認</title><desc id="desc">四枚のカードで用途、レイアウト、出力、納品の確認ポイントを説明し、エディターの画面と実際のダウンロードファイルを区別しています。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Canvaデザインの四つの確認</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">独自の古本交換会告知：内容確定から共有用の完成品まで順に確認</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">用途</text>
<text x="108.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">サイズと使用場面を明確に</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">日付と場所を確認</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">レイアウト</text>
<text x="477.0" y="371" font-size="23" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 23px;">ブランドルールと利用許諾</text>
<text x="477.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">長い文章は配置し直す</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">出力</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">形式・ページ・背景</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">印刷条件は別途確認</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">納品</text>
<text x="1215.0" y="371" font-size="19" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 19px;">ダウンロード後は各ページ確認</text>
<text x="1215.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">元データの権限とバージョン</text>
<text x="80" y="803" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">キャンバス上で完成して見えても、出力の正しさ、素材の利用可否、引き継ぐ人が元データを見つけられるかを確認します。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図版</text>
</svg>
