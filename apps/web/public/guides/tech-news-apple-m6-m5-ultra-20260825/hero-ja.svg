<title id="title">Apple、M6とM5 Ultraを発表：Mac miniとMac Studioに初搭載、台湾価格も</title><desc id="desc">オリジナルイラスト：上段左に単独のチップ、右に小さな接続部でつながった2つのチップ。下段には高さの異なる4つの長方形が階段状に並び、ユニファイドメモリ容量の段階を表します。幾何学図形のみで構成し、実際の製品外観や商標は一切描いていません。</desc>
