<title id="title">Apple, M6 및 M5 Ultra 공개: Mac mini와 Mac Studio 최초 탑재, 대만 가격도</title><desc id="desc">오리지널 일러스트: 윗줄 왼쪽에는 칩 하나, 오른쪽에는 작은 연결부로 이어진 두 개의 칩이 있습니다. 아랫줄에는 높이가 다른 네 개의 직사각형이 계단 모양으로 놓여 통합 메모리 용량 단계를 나타냅니다. 기하학적 도형만으로 구성했으며 실제 제품 외관이나 상표는 담지 않았습니다.</desc>
