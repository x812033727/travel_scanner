<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">公司資料分三路 / Company data on three routes</title>
  <desc id="desc">左邊是一份加了鎖的文件，上面幾條橫線代表內容，其中兩條是橘色，代表敏感的段落。三條曲線從文件往右散開，分別通向三個圓：綠色圓裡是一個勾，代表可以貼；橘色圓裡是一塊被塗黑的欄位，代表去識別之後才可以貼；紅色圓裡是一條斜槓，代表不可以貼。畫面下方寫著「貼之前，先分三級」。整張圖用圓、圓角方塊與線條構成，沒有品牌標誌、介面或人物。</desc>
