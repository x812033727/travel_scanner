<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">旅平險的分層：主約、附加與服務 / Travel insurance in layers: base policy, riders and service</title>
<desc id="desc">畫面中間是旅行平安保險主約的方框，寫著示範條款第二條的保險範圍是意外傷害事故所致的失能或死亡，第五條給付身故與喪葬費用保險金，第六條給付失能保險金。主約的上方、左方與右方各掛著一個要另外加保的框，由三條帶箭頭的連線連到主約：上方是附加條款「傷害醫療保險給付」，處理意外傷害事故後的實際醫療費用，接在示範條款正文之後；左方是附約「海外突發疾病醫療健康保險」，處理海外的住院、門診與急診，第二條的定義畫出既往症的界線，第九條另有除外責任；右方是服務「海外急難救助」，不在任何示範條款裡，要先確認資格再提供服務，服務清單由各家約定，與保險金給付是兩件事。畫面最右邊是一欄關鍵分界：條款裡的「意外」是非由疾病引起之外來突發事故，所以生病不是意外，疾病引起的就醫不在主約的保險範圍內；保險法把疾病交給健康保險，也就是第一百二十五條；實際認定仍看條款文字與個案事證。畫面下方一條橫幅寫著不在這張保單上的東西：班機與行李延誤看不便險，旅行社的責任保險與履約保證保險保的是旅行社那一端。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">旅平險的分層：主約、附加與服務</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Travel insurance in layers: the base policy, its riders and the service</text>

<line x1="610" y1="361" x2="610" y2="304" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="406" y1="472" x2="346" y2="472" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="814" y1="472" x2="874" y2="472" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="390" y="150" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="610" y="196" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">附加條款：傷害醫療保險給付</text>
<text x="610" y="234" font-size="17" fill="#5C6B6B" text-anchor="middle">意外傷害事故後的實際醫療費用</text>
<text x="610" y="264" font-size="17" fill="#5C6B6B" text-anchor="middle">接在示範條款正文之後</text>

<rect x="60" y="370" width="280" height="205" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="200" y="416" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">附約：海外突發疾病</text>
<text x="200" y="444" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">醫療健康保險</text>
<text x="200" y="482" font-size="16" fill="#5C6B6B" text-anchor="middle">海外的住院、門診、急診</text>
<text x="200" y="512" font-size="16" fill="#5C6B6B" text-anchor="middle">第二條定義既往症界線</text>
<text x="200" y="542" font-size="16" fill="#5C6B6B" text-anchor="middle">第九條另有除外責任</text>

<rect x="880" y="370" width="280" height="205" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1020" y="416" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">服務：海外急難救助</text>
<text x="1020" y="454" font-size="16" fill="#5C6B6B" text-anchor="middle">不在任何示範條款裡</text>
<text x="1020" y="484" font-size="16" fill="#5C6B6B" text-anchor="middle">先確認資格再提供服務</text>
<text x="1020" y="514" font-size="16" fill="#5C6B6B" text-anchor="middle">服務清單由各家約定</text>
<text x="1020" y="544" font-size="16" fill="#5C6B6B" text-anchor="middle">與保險金給付是兩件事</text>

<rect x="410" y="365" width="400" height="215" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="610" y="415" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">旅行平安保險（主約）</text>
<line x1="434" y1="433" x2="786" y2="433" stroke="#0D6B68" stroke-width="2"/>
<text x="610" y="463" font-size="17" fill="#5C6B6B" text-anchor="middle">示範條款第二條 保險範圍</text>
<text x="610" y="494" font-size="18" fill="#102A2B" text-anchor="middle">意外傷害事故所致的失能或死亡</text>
<text x="610" y="530" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="middle">第五條 身故與喪葬費用保險金</text>
<text x="610" y="558" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="middle">第六條 失能保險金</text>

<rect x="1200" y="150" width="340" height="425" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1370" y="198" font-size="24" font-weight="700" fill="#B8442D" text-anchor="middle">關鍵分界</text>
<line x1="1224" y1="218" x2="1516" y2="218" stroke="#B8442D" stroke-width="2"/>
<text x="1370" y="252" font-size="16" fill="#5C6B6B" text-anchor="middle">條款裡的「意外」是</text>
<text x="1370" y="284" font-size="19" fill="#102A2B" text-anchor="middle">非由疾病引起之</text>
<text x="1370" y="312" font-size="19" fill="#102A2B" text-anchor="middle">外來突發事故</text>
<text x="1370" y="360" font-size="24" font-weight="700" fill="#B8442D" text-anchor="middle">生病不是意外</text>
<text x="1370" y="400" font-size="16" fill="#5C6B6B" text-anchor="middle">疾病引起的就醫不在</text>
<text x="1370" y="428" font-size="16" fill="#5C6B6B" text-anchor="middle">主約的保險範圍內</text>
<text x="1370" y="468" font-size="16" fill="#5C6B6B" text-anchor="middle">保險法把疾病交給健康保險</text>
<text x="1370" y="496" font-size="16" fill="#5C6B6B" text-anchor="middle">（第一百二十五條）</text>
<text x="1370" y="528" font-size="17" font-weight="700" fill="#2F6F9F" text-anchor="middle">實際認定仍看</text>
<text x="1370" y="554" font-size="17" font-weight="700" fill="#2F6F9F" text-anchor="middle">條款文字與個案事證</text>

<rect x="60" y="655" width="1480" height="120" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="722" font-size="20" fill="#102A2B" text-anchor="middle">不在這張保單上：班機與行李延誤看不便險；旅行社的責任保險與履約保證保險保的是旅行社那一端</text>

