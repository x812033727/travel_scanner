<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">普吉不出海的一天：哪一段有公車、哪一段要包車 / Phuket by land: where the buses run</title>
<desc id="desc">示意圖，方向與距離非比例。一座直立的島由北到南依序標四站：普吉老城（他朗路、泰華博物館 200 泰銖）、查龍寺（參拜免費）、普吉大佛（山丘頂、出發前確認開放）、神仙半島（島的最南端、夕陽）。老城左側是蘭山觀景台，標半天版的替代站；普吉大佛與神仙半島之間是卡隆觀景台，標卡塔、卡隆盡收眼底。實線代表有公車：老城內部與周邊是 Dragon Line 免費循環巴士，老城的巴士總站 1 到芭東是 Route 2、50 泰銖，卡隆觀景台到神仙半島是 Route 1、100 泰銖，只有三班到神仙半島。虛線代表沒有公車、要包車：老城到查龍寺、查龍寺到普吉大佛，以及普吉大佛到卡隆觀景台。開放時間與班次見內文表格。</desc>
