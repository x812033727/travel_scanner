<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">예시가 가르치는 처리 규칙</title><desc id="desc">회의 원문과 기대하는 할 일 목록을 짝지어, SFT가 알려진 내용을 정리하고 미확인 필드를 남기는 법을 학습한 뒤 새 회의로 검증하는 과정</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">예시가 가르치는 처리 규칙</text><text x="60" y="84" font-size="18" fill="#5C6B6B">지도 미세 조정</text><path d="M 470 310 L 650 385" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 470 640 L 650 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 990 440 L 1170 440" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="220" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="275" y="304" font-size="28" fill="#102A2B" text-anchor="middle">회의 원문</text><text x="275" y="347" font-size="22" fill="#5C6B6B" text-anchor="middle">명시, 제안, 미확정</text><rect x="80" y="550" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="275" y="634" font-size="28" fill="#102A2B" text-anchor="middle">목표 할 일 목록</text><text x="275" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">미지정 필드 유지</text><rect x="660" y="340" width="330" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="825" y="434" font-size="28" fill="#102A2B" text-anchor="middle">SFT</text><text x="825" y="477" font-size="22" fill="#5C6B6B" text-anchor="middle">예시에 따라 매개변수 갱신</text><rect x="1180" y="340" width="350" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1355" y="434" font-size="28" fill="#102A2B" text-anchor="middle">새 회의로 평가</text><text x="1355" y="477" font-size="22" fill="#5C6B6B" text-anchor="middle">내용과 형식 별도 점검</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도표 제작 2026</text></svg>
