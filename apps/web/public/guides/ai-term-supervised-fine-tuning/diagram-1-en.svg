<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Examples Teach Handling Rules</title><desc id="desc">Meeting text is paired with target action items; SFT learns to organize known facts and preserve unknowns, then is evaluated on new meetings</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Examples Teach Handling Rules</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Supervised Fine-tuning</text><path d="M 470 310 L 650 385" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 470 640 L 650 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 990 440 L 1170 440" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><rect x="80" y="220" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="275" y="304" font-size="28" fill="#102A2B" text-anchor="middle">Meeting Text</text><text x="275" y="347" font-size="22" fill="#5C6B6B" text-anchor="middle">Explicit, Proposed, Uncertain</text><rect x="80" y="550" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="275" y="634" font-size="28" fill="#102A2B" text-anchor="middle">Target Action Items</text><text x="275" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">Keep Unknowns Unfilled</text><rect x="660" y="340" width="330" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="434" font-size="28" fill="#102A2B" text-anchor="middle">SFT</text><text x="825" y="477" font-size="19" fill="#5C6B6B" text-anchor="middle" style="font-size: 19px;">Update Parameters from Examples</text><rect x="1180" y="340" width="350" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1355" y="434" font-size="28" fill="#102A2B" text-anchor="middle">Evaluate on New Meetings</text><text x="1355" y="477" font-size="19" fill="#5C6B6B" text-anchor="middle" style="font-size: 19px;">Check Content and Format Separately</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphics 2026</text></svg>
