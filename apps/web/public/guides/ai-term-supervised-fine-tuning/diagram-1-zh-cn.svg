<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">示范教的是处理规则</title><desc id="desc">会议原文与期望待办配对，SFT 学习已知内容的整理与未知字段的保留，再用新会议验证</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">示范教的是处理规则</text><text x="60" y="84" font-size="18" fill="#5C6B6B">监督式微调</text><path d="M 470 310 L 650 385" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 470 640 L 650 490" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 990 440 L 1170 440" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="220" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="275" y="304" font-size="28" fill="#102A2B" text-anchor="middle">会议原文</text><text x="275" y="347" font-size="22" fill="#5C6B6B" text-anchor="middle">明示、提议、未确定</text><rect x="80" y="550" width="390" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="275" y="634" font-size="28" fill="#102A2B" text-anchor="middle">期望待办</text><text x="275" y="677" font-size="22" fill="#5C6B6B" text-anchor="middle">保留未指定字段</text><rect x="660" y="340" width="330" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="825" y="434" font-size="28" fill="#102A2B" text-anchor="middle">SFT</text><text x="825" y="477" font-size="22" fill="#5C6B6B" text-anchor="middle">按示范更新参数</text><rect x="1180" y="340" width="350" height="200" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1355" y="434" fo