  <path d="M 980 436 C 1060 436, 1060 430, 1140 430" fill="none" stroke="#2E7D5B" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 980 444 C 1060 444, 1060 520, 1140 520" fill="none" stroke="#2F6F9F" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 980 452 C 1060 452, 1060 610, 1140 610" fill="none" stroke="#7E57C2" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 980 462 C 1060 462, 1060 700, 1140 700" fill="none" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>

  <circle cx="1140" cy="250" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="1140" cy="340" r="13" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="1140" cy="430" r="13" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="1140" cy="520" r="13" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="1140" cy="610" r="13" fill="#FFFFFF" stroke="#7E57C2" stroke-width="6"/>
  <circle cx="1140" cy="700" r="13" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>

  <g fill="#102A2B">
    <text x="1165" y="256" font-size="20" font-weight="700">遊覧船・ロープウェイ Ropeway / Cruise</text>
    <text x="1165" y="280" font-size="17" fill="#5C6B6B">周遊バス約 15 分 · 纜車往返 1,000 日圓</text>
    <text x="1165" y="302" font-size="17" fill="#5C6B6B">遊覧船一周約 20 分 · 1,000 日圓 · 每 30 分一班</text>

    <text x="1165" y="346" font-size="20" font-weight="700">大石公園 Oishi Park · 河口湖自然生活館</text>
    <text x="1165" y="370" font-size="17" fill="#5C6B6B">レッドライン約 30 分 · 免費 · 常時開放</text>
    <text x="1165" y="392" font-size="17" fill="#5C6B6B">薰衣草 6 月下旬〜7 月中旬 · 掃帚草 10 月中下旬</text>

    <text x="1165" y="436" font-size="20" font-weight="700">西湖 Saiko · いやしの里根場・鳴沢氷穴</text>
    <text x="1165" y="460" font-size="17" fill="#5C6B6B">グリーンライン Green Line · 從河口湖駅發車</text>

    <text x="1165" y="526" font-size="20" font-weight="700">精進湖・本栖湖 Shoji / Motosu</text>
    <text x="1165" y="550" font-size="17" fill="#5C6B6B">ブルーライン Blue Line · 春天富士芝桜まつり会場</text>

    <text x="1165" y="616" font-size="20" font-weight="700">忍野八海 Oshino Hakkai（富士山駅轉乘）</text>
    <text x="1165" y="640" font-size="17" fill="#5C6B6B">ふじっ湖号 · 富士山駅から路線バス約 25 分</text>
    <text x="1165" y="662" font-size="17" fill="#5C6B6B">ふじっ湖号 2 日券 2,200 日圓 · 與紅綠藍券不通用</text>

    <text x="1165" y="706" font-size="20" font-weight="700">下吉田駅 Shimoyoshida → 新倉山浅間公園</text>
    <text x="1165" y="730" font-size="17" fill="#5C6B6B">富士急行線 230 日圓 · 富士回遊也停</text>
    <text x="1165" y="752" font-size="17" fill="#5C6B6B">走約 25 分・398 階到忠霊塔 · 免費 24 小時</text>
  </g>

  <!-- 2-day pass note -->
  <rect x="80" y="690" width="780" height="100" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="100" y="728" font-size="20" font-weight="700" fill="#B8442D">河口湖周遊バス 2 日券 2Day Pass · 成人 2,000 日圓、兒童 1,000 日圓</text>
  <text x="100" y="760" font-size="17" fill="#102A2B">紅綠藍三線通用 · 河口湖駅巴士窗口或線上買，車上只賣 1 日券 · 單程最低 180 日圓</text>

