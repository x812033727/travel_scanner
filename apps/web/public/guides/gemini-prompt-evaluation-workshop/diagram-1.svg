<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">一次只改一條規則</title><desc id="desc">固定：十題與量尺：先寫預期判斷；分開：A 與 B 新對話：保存二十份回答；評分：四項各零至二分：每次扣分附原因；決定：逐題看改善退步：缺資料不算勝出</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">一次只改一條規則</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#316553" font-weight="800">固定</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">十題與量尺</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">先寫預期判斷</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#316553" font-weight="800">分開</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">A 與 B 新對話</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">保存二十份回答</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#316553" font-weight="800">評分</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">四項各零至二分</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">每次扣分附原因</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#316553" font-weight="800">決定</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">逐題看改善退步</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">缺資料不算勝出</text><text x="85" y="818" font-size="47" fill="#4c685c" font-weight="500">檢查程式已測；模型回答待驗</text></g></svg>