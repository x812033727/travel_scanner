<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 北海道冬季活動時間軸：1 月下旬到 2 月底 / Hokkaido winter events timeline 2027</title>
  <desc id="desc">橫向時間軸從 2027 年 1 月 20 日到 2 月底，每列一個活動，橫條是主辦單位已公告的 2027 年日期：層雲峽氷瀑まつり 1 月 23 日到 3 月 7 日、支笏湖氷濤まつり 1 月 30 日到 2 月 23 日、さっぽろ雪まつり 2 月 4 日到 11 日、旭川冬まつり 2 月 6 日到 11 日、小樽雪あかりの路 2 月 6 日到 13 日；最下一列是旭山動物園冬季開園 11 月 11 日到 12 月 29 日與 1 月 2 日到 4 月 7 日。淡紅色底標出雪祭週 2 月 4 日到 11 日，箭頭代表活動延續到 3 月或 4 月。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <pattern id="hatchPurple" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7E57C2" stroke-width="3"/></pattern>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">2027 北海道冬季活動時間軸　1 月下旬到 2 月底</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Hokkaido winter events 2027 · 橫條＝主辦單位已公告的 2027 日期 · 2026 年 9 月 13 日查證</text>

  <!-- axis: Jan 20 = 520, Feb 1 = 814, Mar 1 = 1500 (24.5 px per day) -->
  <rect x="887.5" y="165" width="196" height="530" fill="#B8442D" fill-opacity="0.10"/>
  <g stroke="#C9C2B8" stroke-width="2">
    <line x1="520" y1="165" x2="520" y2="695"/>
    <line x1="814" y1="165" x2="814" y2="695"/>
    <line x1="1500" y1="165" x2="1500" y2="695"/>
  </g>
  <g stroke="#DAD3C8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="765" y1="170" x2="765" y2="695"/>
    <line x1="1034.5" y1="170" x2="1034.5" y2="695"/>
    <line x1="1279.5" y1="170" x2="1279.5" y2="695"/>
  </g>
  <g font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="667" y="150">1 月 Jan 2027</text>
    <text x="1157" y="150">2 月 Feb 2027</text>
  </g>
  <g font-size="15" fill="#8A8F8F" text-anchor="middle">
    <text x="520" y="186">20 日</text>
    <text x="765" y="186">30 日</text>
    <text x="1034.5" y="186">10 日</text>
    <text x="1279.5" y="186">20 日</text>
  </g>
  <text x="985" y="716" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">雪祭週 2/4～2/11</text>

  <!-- 1 Sounkyo -->
  <text x="60" y="215" font-size="18" font-weight="700" fill="#102A2B">層雲峡氷瀑まつり Sounkyo Ice Festival</text>
  <text x="60" y="236" font-size="15" fill="#5C6B6B">1 月 23 日～3 月 7 日（第 52 屆）</text>
  <text x="60" y="256" font-size="15" fill="#5C6B6B">2026 年平日 17:00～21:30、週末 11:00～21:30</text>
  <rect x="593.5" y="200" width="906.5" height="24" rx="12" fill="#0D6B68"/>
  <path d="M 1500 212 L 1530 212" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="1536" y="217" font-size="15" fill="#5C6B6B">到 3/7</text>

  <!-- 2 Shikotsu -->
  <text x="60" y="300" font-size="18" font-weight="700" fill="#102A2B">支笏湖氷濤まつり Shikotsu Ice Festival</text>
  <text x="60" y="321" font-size="15" fill="#5C6B6B">1 月 30 日～2 月 23 日</text>
  <text x="60" y="341" font-size="15" fill="#5C6B6B">10:00～20:00，點燈 16:30～20:00</text>
  <rect x="765" y="285" width="612.5" height="24" rx="12" fill="#2F6F9F"/>
  <text x="1386" y="302" font-size="15" fill="#2F6F9F">～2/23</text>

  <!-- 3 Sapporo Snow Festival -->
  <text x="60" y="385" font-size="18" font-weight="700" fill="#102A2B">さっぽろ雪まつり Sapporo Snow Festival</text>
  <text x="60" y="406" font-size="15" fill="#5C6B6B">2 月 4 日～2 月 11 日（第 77 屆）</text>
  <text x="60" y="426" font-size="15" fill="#5C6B6B">大通・すすきの・つどーむ三會場</text>
  <rect x="887.5" y="370" width="196" height="24" rx="12" fill="#B8442D"/>
  <text x="1092" y="387" font-size="15" fill="#B8442D">2/4～2/11</text>

  <!-- 4 Asahikawa -->
  <text x="60" y="470" font-size="18" font-weight="700" fill="#102A2B">旭川冬まつり Asahikawa Winter Festival</text>
  <text x="60" y="491" font-size="15" fill="#5C6B6B">2 月 6 日～2 月 11 日（第 68 屆）</text>
  <text x="60" y="511" font-size="15" fill="#5C6B6B">2026 年 10:00～20:00</text>
  <rect x="936.5" y="455" width="147" height="24" rx="12" fill="#D97A2B"/>
  <text x="1092" y="472" font-size="15" fill="#D97A2B">2/6～2/11</text>

  <!-- 5 Otaru -->
  <text x="60" y="555" font-size="18" font-weight="700" fill="#102A2B">小樽雪あかりの路 Otaru Snow Light Path</text>
  <text x="60" y="576" font-size="15" fill="#5C6B6B">2 月 6 日～2 月 13 日（第 29 屆）</text>
  <text x="60" y="596" font-size="15" fill="#5C6B6B">運河・舊手宮線沿線</text>
  <rect x="936.5" y="540" width="196" height="24" rx="12" fill="#2E7D5B"/>
  <text x="1141" y="557" font-size="15" fill="#2E7D5B">2/6～2/13</text>

  <!-- 6 Asahiyama Zoo winter season -->
  <text x="60" y="640" font-size="18" font-weight="700" fill="#102A2B">旭山動物園冬季開園 Asahiyama Zoo winter</text>
  <text x="60" y="661" font-size="15" fill="#5C6B6B">11 月 11 日～12 月 29 日、1 月 2 日～4 月 7 日</text>
  <text x="60" y="681" font-size="15" fill="#5C6B6B">10:30～15:30；12 月 30 日～1 月 1 日休園</text>
  <rect x="520" y="625" width="980" height="24" rx="12" fill="url(#hatchPurple)" stroke="#7E57C2" stroke-width="2"/>
  <path d="M 1500 637 L 1530 637" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="1536" y="642" font-size="15" fill="#5C6B6B">到 4/7</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <rect x="60" y="758" width="40" height="16" rx="8" fill="#0D6B68"/>
    <text x="108" y="772">層雲峽</text>
    <rect x="220" y="758" width="40" height="16" rx="8" fill="#2F6F9F"/>
    <text x="268" y="772">支笏湖</text>
    <rect x="380" y="758" width="40" height="16" rx="8" fill="#B8442D"/>
    <text x="428" y="772">札幌雪祭</text>
    <rect x="560" y="758" width="40" height="16" rx="8" fill="#D97A2B"/>
    <text x="608" y="772">旭川</text>
    <rect x="700" y="758" width="40" height="16" rx="8" fill="#2E7D5B"/>
    <text x="748" y="772">小樽</text>
    <rect x="840" y="758" width="40" height="16" rx="8" fill="url(#hatchPurple)" stroke="#7E57C2" stroke-width="2"/>
    <text x="888" y="772">旭山動物園冬季開園（斜紋＝整段期間都開園）</text>
    <rect x="60" y="796" width="40" height="16" rx="8" fill="#B8442D" fill-opacity="0.15" stroke="#B8442D" stroke-width="1"/>
    <text x="108" y="810">淡紅底＝雪祭週 2 月 4 日到 11 日；橫條＝主辦單位已公告的 2027 日期；箭頭＝活動延續到 3 月或 4 月</text>
    <text x="60" y="848" fill="#5C6B6B">來源：さっぽろ雪まつり、小樽観光協会、旭川冬まつり、層雲峡観光協会、ちとせ観光ナビ、旭山動物園 官網，2026 年 9 月 13 日查證</text>
    <text x="1540" y="885" fill="#8A8F8F" font-size="15" text-anchor="end">© Mokaair 製圖 2026</text>
  </g>
</svg>
