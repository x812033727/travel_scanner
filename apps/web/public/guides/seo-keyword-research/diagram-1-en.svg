<text x="108.0" y="314" font-size="29" fill="#102A2B" text-anchor="start" font-weight="bold">Collect questions</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Readers' own words</text>
