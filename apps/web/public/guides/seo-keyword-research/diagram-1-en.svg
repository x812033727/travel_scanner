<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Add or improve</text>
<text x="1215.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Update criteria</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Search volume is a clue; a group of answerable reader questions makes one article topic.</text>
