<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">資料離開對話框之後 / After your words leave the chat box</title>
  <desc id="desc">抽象插圖。左邊一個白色圓角對話框，裡面有四條淺綠色的短橫線代表你打進去的文字，框下有一個小尾巴。一支橘色箭頭從對話框指向右方一座直立的伺服器機櫃，機櫃裡有四層抽屜，每層左側有一個綠色圓點。機櫃外圈有一條紅褐色的虛線邊界，代表資料越過的邊界。機櫃右側再分出三支橘色箭頭，通向三個圓形：一個是同心圓的齒輪意象，一個是三條橫槓的堆疊意象，一個是文件意象，代表提供服務、訓練模型與依法配合三種用途。左下角有一行字：你的資料流向哪裡。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#D97A2B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft ground -->
  <circle cx="420" cy="410" r="250" fill="#E6F0F7"/>
  <circle cx="1300" cy="455" r="265" fill="#E3F0EF"/>

  <!-- speech bubble: what you type -->
  <rect x="180" y="280" width="380" height="250" rx="34" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/>
  <path d="M 255 528 L 330 528 L 250 606 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7" stroke-linejoin="round"/>
  <rect x="255" y="331" width="230" height="18" rx="9" fill="#E3F0EF"/>
  <rect x="255" y="375" width="285" height="18" rx="9" fill="#E3F0EF"/>
  <rect x="255" y="419" width="200" height="18" rx="9" fill="#E3F0EF"/>
  <rect x="255" y="463" width="255" height="18" rx="9" fill="#E3F0EF"/>

  <!-- flow into the rack -->
  <line x1="590" y1="405" x2="700" y2="405" stroke="#D97A2B" stroke-width="10" marker-end="url(#tip)"/>

  <!-- boundary the data crosses -->
  <rect x="700" y="195" width="360" height="450" rx="30" fill="none" stroke="#B8442D" stroke-width="6" stroke-dasharray="20 16"/>

  <!-- server rack -->
  <rect x="750" y="245" width="260" height="350" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/>
  <rect x="785" y="285" width="190" height="52" rx="12" fill="#E3F0EF"/>
  <circle cx="815" cy="311" r="9" fill="#2E7D5B"/>
  <rect x="785" y="357" width="190" height="52" rx="12" fill="#E3F0EF"/>
  <circle cx="815" cy="383" r="9" fill="#2E7D5B"/>
  <rect x="785" y="429" width="190" height="52" rx="12" fill="#E3F0EF"/>
  <circle cx="815" cy="455" r="9" fill="#2E7D5B"/>
  <rect x="785" y="501" width="190" height="52" rx="12" fill="#E3F0EF"/>
  <circle cx="815" cy="527" r="9" fill="#2E7D5B"/>

  <!-- three uses -->
  <path d="M 1075 400 C 1140 395 1170 290 1240 268" fill="none" stroke="#D97A2B" stroke-width="8" marker-end="url(#tip)"/>
  <path d="M 1075 420 C 1150 420 1170 450 1238 455" fill="none" stroke="#D97A2B" stroke-width="8" marker-end="url(#tip)"/>
  <path d="M 1075 440 C 1140 445 1170 610 1240 642" fill="none" stroke="#D97A2B" stroke-width="8" marker-end="url(#tip)"/>

  <circle cx="1340" cy="250" r="88" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/>
  <circle cx="1340" cy="250" r="42" fill="none" stroke="#0D6B68" stroke-width="9"/>
  <circle cx="1340" cy="250" r="14" fill="#0D6B68"/>

  <circle cx="1340" cy="455" r="88" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="7"/>
  <rect x="1286" y="414" width="108" height="17" rx="8" fill="#2F6F9F"/>
  <rect x="1286" y="447" width="108" height="17" rx="8" fill="#2F6F9F"/>
  <rect x="1286" y="480" width="108" height="17" rx="8" fill="#2F6F9F"/>

  <circle cx="1340" cy="660" r="88" fill="#FFFFFF" stroke="#B8442D" stroke-width="7"/>
  <rect x="1304" y="610" width="72" height="100" rx="10" fill="none" stroke="#B8442D" stroke-width="8"/>
  <rect x="1322" y="632" width="36" height="9" rx="4" fill="#B8442D"/>
  <rect x="1322" y="654" width="36" height="9" rx="4" fill="#B8442D"/>
  <rect x="1322" y="676" width="36" height="9" rx="4" fill="#B8442D"/>

  <text x="150" y="790" font-size="58" font-weight="700" fill="#102A2B">你的資料流向哪裡</text>
</svg>
