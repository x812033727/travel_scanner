<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">跨尺寸版面的驗收順序</title><desc id="desc">四張卡片說明窄畫面排序、依內容找斷點、縮放重排及真機操作，提醒不同驗收結果不能互相取代。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">跨尺寸版面的驗收順序</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">從窄畫面到真機操作，逐步確認內容與互動</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">窄畫面</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">資訊順序先排好</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">重要內容要保留</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">找斷點</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">依內容決定變化</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">前後尺寸都檢查</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">放大重排</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">正文閱讀不缺漏</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">表格例外另判讀</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">真機操作</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">觸控鍵盤走流程</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">預覽結果分開記</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">能在不同寬度打開，還要能在那些條件下完成主要任務。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
