<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">不同資料與量尺，不能直接排名</title><desc id="desc">識別：三份原始全文：作者・版本・授權；方法：問題・資料切分：監督訊號分清楚；結果：78.4 與 61.3：不是同一項測量；限制：歷史模型實驗：不能推成現況</desc>
