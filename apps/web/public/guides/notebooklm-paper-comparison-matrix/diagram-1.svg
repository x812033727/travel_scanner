<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">不同資料與量尺，不能直接排名</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">識別</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">三份原始全文</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">作者・版本・授權</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">方法</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">問題・資料切分</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">監督訊號分清楚</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">結果</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">78.4 與 61.3</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">不是同一項測量</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">限制</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">歷史模型實驗</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">不能推成現況</text><text x="85" y="818" font-size="47" fill="#475f7d" font-weight="500">原文與 PDF 已查；模型矩陣待驗</text></g></svg>