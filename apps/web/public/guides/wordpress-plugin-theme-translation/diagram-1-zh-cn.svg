<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','Noto Sans TC',sans-serif">
<title id="title">界面翻译的四个检查点</title><desc id="desc">四步图解：定位文字来源、保存自定义语言文件、校对变量和台湾用语、更新后重新同步并验证。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">界面翻译的四个检查点</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">从原文字符串到用户真正看到的画面</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">定位</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">找到文字来源</text>
<text x="108.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">记录触发条件</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">保存</text>
<text x="477.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">使用自定义位置</text>
<text x="477.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">保留原始备份</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">校对</text>
<text x="846.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">确认变量含义</text>
<text x="846.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">检查手机换行</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">同步</text>
<text x="1215.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">更新原文字符串</text>
<text x="1215.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">重走操作流程</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">以实际操作验收翻译，并保留后续维护方法。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创绘制</text>
</svg>
