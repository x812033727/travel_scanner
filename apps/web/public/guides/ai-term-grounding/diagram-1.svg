<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">引用要逐句對回來源，才算接得上 / Check each cited sentence against its source</title><desc id="desc">示例圖，虛構的三句回答各自連到來源。第一句說 7 月 1 日開放線上報名，附來源 A，與主辦單位公告一致，完整支持。第二句說 7 月 1 日起可線上或到現場報名，也附來源 A，但公告沒有寫現場報名，只有部分支持。第三句說另有網站寫 7 月 8 日才開放，附來源 B，文字與來源 B 相符，但來源 B 是沒有更新日期的轉貼，與公告衝突，需要回頭查。底部提醒：引用是指標，不是證明，要打開來源逐句核對原文、來源是否原始、日期是否適用。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">引用要逐句對回來源，才算接得上</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Check each cited sentence against its source</text><text x="330" y="160" font-size="22" font-weight="700" fill="#5C6B6B" text-anchor="middle">回答裡的三句話（示例）</text><text x="1270" y="160" font-size="22" font-weight="700" fill="#5C6B6B" text-anchor="middle">它們引用的來源</text><path d="M 600 250 L 1000 250" fill="none" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrow)"/><path d="M 600 410 L 1000 410" fill="none" stroke="#D97A2B" stroke-width="5" marker-end="url(#arrowO)"/><path d="M 600 570 L 1000 570" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrowR)"/><rect x="60" y="190" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/><text x="330" y="245" font-size="26" fill="#102A2B" text-anchor="middle">夏季講座 7 月 1 日開放線上報名</text><text x="330" y="282" font-size="20" fill="#5C6B6B" text-anchor="middle">附來源 A</text><rect x="60" y="350" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/><text x="330" y="405" font-size="26" fill="#102A2B" text-anchor="middle">7 月 1 日起可線上或到現場報名</text><text x="330" y="442" font-size="20" fill="#5C6B6B" text-anchor="middle">附來源 A</text><rect x="60" y="510" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/><text x="330" y="565" font-size="26" fill="#102A2B" text-anchor="middle">另有網站寫 7 月 8 日才開放</text><text x="330" y="602" font-size="20" fill="#5C6B6B" text-anchor="middle">附來源 B</text><rect x="1000" y="190" width="540" height="280" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1270" y="295" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">來源 A：主辦單位公告</text><text x="1270" y="340" font-size="24" fill="#102A2B" text-anchor="middle">線上報名自 7 月 1 日上午起受理</text><text x="1270" y="382" font-size="20" fill="#5C6B6B" text-anchor="middle">原始公布</text><rect x="1000" y="510" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4" stroke-dasharray="14 10"/><text x="1270" y="560" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">來源 B：活動網站轉貼</text><text x="1270" y="598" font-size="22" fill="#102A2B" text-anchor="middle">7 月 8 日開放，未標更新日期</text><rect x="680" y="228" width="240" height="44" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/><text x="800" y="257" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">完整支持</text><text x="800" y="302" font-size="20" fill="#5C6B6B" text-anchor="middle">原文一致</text><rect x="680" y="388" width="240" height="44" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/><text x="800" y="417" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">部分支持</text><text x="800" y="462" font-size="20" fill="#5C6B6B" text-anchor="middle">現場報名原文沒寫</text><rect x="680" y="548" width="240" height="44" rx="22" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/><text x="800" y="577" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">文字相符，來源待查</text><text x="800" y="622" font-size="20" fill="#5C6B6B" text-anchor="middle">與公告衝突，回頭查</text><rect x="60" y="690" width="1480" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="738" font-size="28" font-weight="700" fill="#102A2B" text-anchor="middle">引用是指標，不是證明：打開來源，逐句核對</text><text x="800" y="776" font-size="22" fill="#5C6B6B" text-anchor="middle">核對三件事：原文有沒有這樣寫、來源是不是原始公布、日期適不適用</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
