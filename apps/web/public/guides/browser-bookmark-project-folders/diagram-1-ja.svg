<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>ブラウザのブックマークが多すぎるときは：取り組んでいること別に整理し、また使える状態にする: 判断の流れ</title><desc>順に確認します：用途を分ける、保存理由を書く、実際に開く、終わったら整理する。編集による整理図であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践しやすい進め方</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、すべてを一度に終えなくても大丈夫</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">用途を分ける</text><text x="103" y="497" fill="#f4f0e5" font-size="23">目的別に分類</text><text x="103" y="573" fill="#f4dc9d" font-size="26">常用・作業・あとで読む</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">保存理由を書く</text><text x="473" y="497" fill="#f4f0e5" font-size="23">目的がわかる名前に</text><text x="473" y="573" fill="#f4dc9d" font-size="26">次に思い出せるように</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">実際に開く</text><text x="843" y="497" fill="#f4f0e5" font-size="23">開いて確認する</text><text x="843" y="573" fill="#f4dc9d" font-size="26">リンク切れは元サイトへ</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">終わったら整理</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">作業に区切りをつける</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">あとで読むにも出口を</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集制作の説明図</text></g></svg>
