<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>브라우저 북마크가 너무 많다면: 지금 하는 일에 맞춰 정리하고 다시 활용하기: 판단 순서</title><desc>순서대로 확인합니다: 용도 나누기, 저장 이유 적기, 직접 열기, 일이 끝나면 정리하기. 편집상 정리한 안내이며 지도나 실제 측정 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"></rect><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실천하기 좋은 순서</text><text x="100" y="175" fill="#576968" font-size="25">자신의 상황에 맞게 선택하세요. 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"></rect><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">용도 나누기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">목적별로 구분</text><text x="103" y="573" fill="#f4dc9d" font-size="23" style="font-size: 23px;">자주 쓰기·프로젝트·읽기</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"></rect><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">저장 이유 적기</text><text x="473" y="497" fill="#f4f0e5" font-size="23">목적이 보이는 이름</text><text x="473" y="573" fill="#f4dc9d" font-size="26">다음에도 떠올리기</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"></rect><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">직접 열기</text><text x="843" y="497" fill="#f4f0e5" font-size="23">열어서 확인</text><text x="843" y="573" fill="#f4dc9d" font-size="26">끊긴 링크는 출처 확인</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"></rect><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">끝나면 정리하기</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">프로젝트 마무리</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">읽기 목록에도 출구를</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집 제작 설명도</text></g></svg>
