<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">第一次使用 ChatGPT 的五個步驟 / Five steps for your first ChatGPT session</title>
  <desc id="desc">五個步驟由左到右用箭頭串起。步驟 1 註冊：用 Google、Apple、Microsoft 或 Email 加密碼登入，至少 13 歲，未滿 18 歲要父母或監護人同意。步驟 2 選模型：免費版與 Go 是 GPT-5.6 Luna，難題按 Think 多想一下，Plus 以上才有 GPT-5.6 Sol 與推理強度滑桿。步驟 3 提問：先說我是誰、對象是誰，再給長度、語氣、格式，最後附上原文，附件按加號，免費版一天 3 個。步驟 4 追問：在同一個對話裡接著問，只講要改的地方，例如縮成 2 句，事實一定另外查證。步驟 5 存下來：複製到你的訊息 App，對話會留在左側欄，暫時對話不留紀錄，官方最多保留 30 天。下方兩格：第一次就該做的設定是個人頭像、Settings、Data Controls 裡關掉 Improve the model for everyone，套用整個帳號，並到 Settings、Personalization、Memory 看記憶開關，私事用暫時對話；免費版夠不夠用：只是問問題、改文字用免費版，GPT-5.6 Luna 不限次數；一天傳超過 3 個檔案或常產圖看 Go，美國 8 美元一個月；要 GPT-5.6 Sol 與推理強度滑桿是 Plus，20 美元一個月。最下面補充：年齡規定來自 OpenAI 使用條款，台灣有沒有台幣定價以官網為準；手機 App 拍照上傳與語音最順手，Android 登入需要 Chrome 或 Brave，App 內購以當地貨幣計價。2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">第一次使用 ChatGPT 的五個步驟（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Five steps for your first ChatGPT session: sign up, pick a model, ask, follow up, save</text>

  <!-- step 1 註冊 -->
  <rect x="48" y="130" width="272" height="270" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="88" cy="170" r="22" fill="#0D6B68"/>
  <text x="88" y="178" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="122" y="178" font-size="20" font-weight="700" fill="#0B4F4D">註冊</text>
  <text x="122" y="204" font-size="15" fill="#5C6B6B">Sign up</text>
  <text x="72" y="246" font-size="16" fill="#102A2B">Google、Apple、Microsoft</text>
  <text x="72" y="274" font-size="16" fill="#102A2B">或 Email 加密碼</text>
  <text x="72" y="302" font-size="16" fill="#102A2B">至少 13 歲；未滿 18 歲</text>
  <text x="72" y="330" font-size="16" fill="#102A2B">要父母或監護人同意</text>
  <text x="72" y="358" font-size="16" fill="#102A2B">先關掉模型訓練（見下）</text>
  <path d="M 322 265 L 350 265" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2 選模型 -->
  <rect x="356" y="130" width="272" height="270" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="396" cy="170" r="22" fill="#2F6F9F"/>
  <text x="396" y="178" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="430" y="178" font-size="20" font-weight="700" fill="#1F4E73">選模型</text>
  <text x="430" y="204" font-size="15" fill="#5C6B6B">Pick a model</text>
  <text x="380" y="246" font-size="16" fill="#102A2B">免費版與 Go：GPT-5.6 Luna</text>
  <text x="380" y="274" font-size="16" fill="#102A2B">難題按 Think 多想一下</text>
  <text x="380" y="302" font-size="16" fill="#102A2B">Plus 以上才有 GPT-5.6 Sol</text>
  <text x="380" y="330" font-size="16" fill="#102A2B">與推理強度滑桿</text>
  <text x="380" y="358" font-size="16" fill="#102A2B">新手先把提問練好</text>
  <path d="M 630 265 L 658 265" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3 提問 -->
  <rect x="664" y="130" width="272" height="270" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <circle cx="704" cy="170" r="22" fill="#102A2B"/>
  <text x="704" y="178" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="738" y="178" font-size="20" font-weight="700" fill="#102A2B">提問</text>
  <text x="738" y="204" font-size="15" fill="#5C6B6B">Ask</text>
  <text x="688" y="246" font-size="16" fill="#102A2B">先說我是誰、對象是誰</text>
  <text x="688" y="274" font-size="16" fill="#102A2B">再給長度、語氣、格式</text>
  <text x="688" y="302" font-size="16" fill="#102A2B">最後附上原文</text>
  <text x="688" y="330" font-size="16" fill="#102A2B">附件按「+」，一天 3 個</text>
  <text x="688" y="358" font-size="16" fill="#102A2B">私事用暫時對話問</text>
  <path d="M 938 265 L 966 265" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4 追問 -->
  <rect x="972" y="130" width="272" height="270" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="1012" cy="170" r="22" fill="#D97A2B"/>
  <text x="1012" y="178" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1046" y="178" font-size="20" font-weight="700" fill="#8A4A16">追問</text>
  <text x="1046" y="204" font-size="15" fill="#5C6B6B">Follow up</text>
  <text x="996" y="246" font-size="16" fill="#102A2B">在同一個對話裡接著問</text>
  <text x="996" y="274" font-size="16" fill="#102A2B">只講要改的地方</text>
  <text x="996" y="302" font-size="16" fill="#102A2B">例如：縮成 2 句</text>
  <text x="996" y="330" font-size="16" fill="#102A2B">或換一個更輕鬆的版本</text>
  <text x="996" y="358" font-size="16" fill="#B8442D">事實一定另外查證</text>
  <path d="M 1246 265 L 1274 265" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 5 存下來 -->
  <rect x="1280" y="130" width="272" height="270" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="4"/>
  <circle cx="1320" cy="170" r="22" fill="#2E7D5B"/>
  <text x="1320" y="178" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1354" y="178" font-size="20" font-weight="700" fill="#1F5A40">存下來</text>
  <text x="1354" y="204" font-size="15" fill="#5C6B6B">Save</text>
  <text x="1304" y="246" font-size="16" fill="#102A2B">複製到你的訊息 App</text>
  <text x="1304" y="274" font-size="16" fill="#102A2B">對話會留在左側欄</text>
  <text x="1304" y="302" font-size="16" fill="#102A2B">下次可以回來接著問</text>
  <text x="1304" y="330" font-size="16" fill="#102A2B">暫時對話不留紀錄</text>
  <text x="1304" y="358" font-size="16" fill="#102A2B">官方最多保留 30 天</text>

  <!-- notes -->
  <rect x="48" y="450" width="740" height="176" rx="16" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="76" y="483" font-size="19" font-weight="700" fill="#102A2B">第一次就該做的設定　Settings to check first</text>
  <text x="76" y="516" font-size="16" fill="#102A2B">・個人頭像 → Settings → Data Controls</text>
  <text x="76" y="544" font-size="16" fill="#102A2B">　關掉「Improve the model for everyone」，套用整個帳號、不分裝置</text>
  <text x="76" y="572" font-size="16" fill="#102A2B">・Settings → Personalization → Memory 看記憶是開還是關</text>
  <text x="76" y="600" font-size="16" fill="#102A2B">・身分證字號、信用卡號、別人的個資不要貼進對話</text>

  <rect x="812" y="450" width="740" height="176" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <text x="840" y="483" font-size="19" font-weight="700" fill="#102A2B">免費版夠不夠用　Free or Go?</text>
  <text x="840" y="516" font-size="16" fill="#102A2B">・只是問問題、改文字：免費版就夠，GPT-5.6 Luna 文字對話不限次數</text>
  <text x="840" y="544" font-size="16" fill="#102A2B">・一天傳超過 3 個檔案或常產圖：看 Go，美國定價每月 8 美元</text>
  <text x="840" y="572" font-size="16" fill="#102A2B">・要 GPT-5.6 Sol 與推理強度滑桿：Plus，每月 20 美元</text>
  <text x="840" y="600" font-size="16" fill="#102A2B">・台灣有沒有台幣定價以官網為準；App 內購以當地貨幣計價</text>

  <text x="48" y="690" font-size="15" fill="#5C6B6B">年齡規定來自 OpenAI 使用條款：至少 13 歲，未滿 18 歲要父母或監護人同意；被誤判為青少年的成年人可以驗證年齡。</text>
  <text x="48" y="718" font-size="15" fill="#5C6B6B">手機 App 拍照上傳與語音最順手，Android 登入需要 Chrome 或 Brave；網頁版適合貼長文與整理檔案。</text>
  <text x="48" y="746" font-size="15" fill="#5C6B6B">方案名、價格、模型名稱依 OpenAI 官網與 help center 查證，之後可能變動，購買前再看一次 chatgpt.com 顯示的價格。</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
