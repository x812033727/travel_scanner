<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從第一個對話開始 / Start with your first conversation</title>
  <desc id="desc">米色底上有一個白色、深青色邊的大對話泡泡，泡泡裡有三條由長到短的淺青色文字線條與一個深青色游標，代表正在輸入的第一個問題。泡泡右下方是一顆綠色的圓形起始按鈕，中間是白色的播放三角形，外圈有一圈淡綠光暈。周圍散布幾個橘色與藍色的小圓點。下方一行字：從第一個對話開始。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="240" cy="200" r="150" fill="#E3F0EF"/>
  <circle cx="1380" cy="180" r="90" fill="#E6F0F7"/>
  <circle cx="1460" cy="760" r="120" fill="#E6F2EC"/>

  <!-- speech bubble -->
  <path d="M 380 160 H 1040 A 60 60 0 0 1 1100 220 V 500 A 60 60 0 0 1 1040 560 H 560 L 440 660 L 470 560 H 380 A 60 60 0 0 1 320 500 V 220 A 60 60 0 0 1 380 160 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="12" stroke-linejoin="round"/>

  <!-- text lines inside the bubble -->
  <rect x="410" y="250" width="520" height="30" rx="15" fill="#E3F0EF"/>
  <rect x="410" y="320" width="400" height="30" rx="15" fill="#E3F0EF"/>
  <rect x="410" y="390" width="260" height="30" rx="15" fill="#E3F0EF"/>
  <rect x="690" y="382" width="10" height="46" rx="3" fill="#0D6B68"/>

  <!-- green start button -->
  <circle cx="1210" cy="600" r="150" fill="#2E7D5B" opacity="0.18"/>
  <circle cx="1210" cy="600" r="112" fill="#2E7D5B"/>
  <polygon points="1178,540 1178,660 1278,600" fill="#FFFFFF"/>

  <!-- small accents -->
  <circle cx="160" cy="600" r="18" fill="#D97A2B"/>
  <circle cx="230" cy="700" r="12" fill="#2F6F9F"/>
  <circle cx="1370" cy="340" r="14" fill="#D97A2B"/>
  <circle cx="1040" cy="90" r="10" fill="#2F6F9F"/>

  <!-- one line of text -->
  <text x="800" y="810" font-size="48" font-weight="700" fill="#102A2B" text-anchor="middle">從第一個對話開始</text>
</svg>
