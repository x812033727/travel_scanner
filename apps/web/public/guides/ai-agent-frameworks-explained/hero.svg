<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">代理框架與代理迴圈示意 / Agent frameworks and the agent loop, illustrated</title>
<desc id="desc">一張幾何插圖。畫面中央是一個大圓環，圓環上有三段帶箭頭的弧線，順時針串起三個圖形：正上方是一個白色對話框，代表使用者的提示詞；右下是一個綠色六角形，代表語言模型；左下是一個橘色齒輪，代表被呼叫的工具。三者繞成一圈，表示代理判斷、呼叫工具、收到結果後再判斷的迴圈。畫面下方並排三個圓角方塊，裡面各有兩條短線，代表三套代理框架。上方寫著「代理框架怎麼選」。圖中沒有任何產品標誌、介面或人物。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
