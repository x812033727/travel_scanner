<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">河內到寧平怎麼去、寧平的景點在哪一邊 / Hanoi to Ninh Binh and where the ticketed sites are</title>
  <desc id="desc">示意圖，方向與距離非比例。左半邊是河內到寧平：河內端有 Ga Hà Nội 與 Bến xe Giáp Bát 兩個出發點，實線是鐵路，統一線 115 公里、約 2 小時 15 分，南下 SE7 06:00、北上 SE6 16:55；虛線是公路，從嘉八車站發車，票價 95,000 越南盾。當天來回的算術是 08:13 到、16:55 回，在寧平有 8 小時 42 分。右半邊是寧平的景點：西北邊是長安 Tràng An，300,000 越南盾、手划船，旁邊是華閭古都 Cố đô Hoa Lư，20,000 越南盾，河是沙溪 Sông Sào Khê；西南邊是三谷 Tam Cốc，250,000 越南盾、含電瓶車 350,000，往下是碧洞 Bích Động，約 2 公里，旁邊是舞洞 Hang Múa，150,000 越南盾、486 級石階，河是吳同江 Sông Ngô Đồng。長安那一群和三谷那一群之間有一條虛線，兩個景區的票分開，沒有聯票。中央偏右是寧平市區與 Ga Ninh Bình，景區都在市區外，下車要再叫車。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5C6B6B"/>
    </marker>
    <marker id="arrowRail" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0D6B68"/>
    </marker>
    <marker id="arrowRoad" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#D97A2B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

