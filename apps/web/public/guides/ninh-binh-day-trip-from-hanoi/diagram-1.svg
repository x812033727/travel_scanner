  <text x="960" y="762" text-anchor="middle" font-size="16" fill="#5C6B6B">碧洞寺</text>

  <rect x="1105" y="490" width="250" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
