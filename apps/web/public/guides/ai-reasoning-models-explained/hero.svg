<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">先想一下，再回答 / Think first, then answer</title>
  <desc id="desc">米色底上有一個白色的大對話泡泡，泡泡左半邊是一團藍色打結的線，往右逐漸被理順成一條綠色的直線，直線末端有箭頭指向泡泡右緣。泡泡右上方外側有三個橘色的小齒輪。泡泡下方一行深色文字：先想一下，再回答。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- speech bubble -->
  <path d="M 300 150 H 1300 A 40 40 0 0 1 1340 190 V 590 A 40 40 0 0 1 1300 630 H 560 L 430 730 L 460 630 H 300 A 40 40 0 0 1 260 590 V 190 A 40 40 0 0 1 300 150 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>

  <!-- tangled line on the left, straightening to the right -->
  <path d="M 340 400 C 380 300, 470 300, 470 390 C 470 480, 360 500, 400 420 C 440 340, 560 330, 560 420 C 560 500, 450 520, 500 440 C 550 360, 660 350, 660 430 C 660 500, 580 520, 620 450 C 660 380, 760 380, 760 430 C 760 470, 700 490, 740 440 C 780 395, 860 400, 900 400" fill="none" stroke="#2F6F9F" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 900 400 C 960 400, 1000 390, 1060 390 H 1230" fill="none" stroke="#2E7D5B" stroke-width="16" stroke-linecap="round"/>
  <path d="M 1210 350 L 1270 390 L 1210 430 Z" fill="#2E7D5B"/>

  <!-- three small gears above the bubble -->
  <circle cx="1210" cy="105" r="34" fill="none" stroke="#D97A2B" stroke-width="16" stroke-dasharray="14 10"/>
  <circle cx="1210" cy="105" r="12" fill="#D97A2B"/>
  <circle cx="1300" cy="70" r="28" fill="none" stroke="#D97A2B" stroke-width="14" stroke-dasharray="12 9"/>
  <circle cx="1300" cy="70" r="10" fill="#D97A2B"/>
  <circle cx="1385" cy="120" r="24" fill="none" stroke="#D97A2B" stroke-width="12" stroke-dasharray="10 8"/>
  <circle cx="1385" cy="120" r="8" fill="#D97A2B"/>

  <!-- one line of text -->
  <text x="800" y="825" font-size="60" font-weight="700" fill="#102A2B" text-anchor="middle">先想一下，再回答</text>
</svg>
