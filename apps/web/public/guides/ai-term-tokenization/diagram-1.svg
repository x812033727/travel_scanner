<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">先確認文字，再檢查切分</title>
<desc id="desc">菜單原稿先經文字抽取，再以分詞器產生片段與編號；還原文字可回頭檢查，之後才送入模型分類。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">先確認文字，再檢查切分</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Tokenization · 早餐菜單的處理鏈</text><path d="M440 280 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M980 280 H1150" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M800 380 V570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M610 665 H260 V380" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="80" y="190" width="360" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="260" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">菜單原稿</text><text x="260" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">名稱、標點、空白</text><rect x="620" y="190" width="360" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">分詞器</text><text x="800" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">片段與編號</text><rect x="1160" y="190" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1330" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">模型分類</text><text x="1330" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">挑出含蛋品項</text><rect x="620" y="580" width="360" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="800" y="657" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">還原文字</text><text x="800" y="707" text-anchor="middle" font-size="25" fill="#5C6B6B">與原稿對照</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
