<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">先确认文本，再检查切分</title>
<desc id="desc">菜单原稿经分词器生成片段与编号，再送入模型分类；另一路还原文本，回头与原稿对照。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">先确认文本，再检查切分</text><text x="60" y="84" font-size="18" fill="#5C6B6B">分词 · 早餐菜单的处理链</text><path d="M440 280 H610" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M980 280 H1150" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M800 380 V570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><path d="M610 665 H260 V380" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" /><rect x="80" y="190" width="360" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="260" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">菜单原稿</text><text x="260" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">名称、标点、空白</text><rect x="620" y="190" width="360" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="800" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">分词器</text><text x="800" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">片段与编号</text><rect x="1160" y="190" width="340" height="180" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1330" y="272" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">模型分类</text><text x="1330" y="322" text-anchor="middle" font-size="25" fill="#5C6B6B">筛出含蛋餐品</text><rect x="620" y="580" width="360" height="170" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="800" y="657" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">还原文本</text><text x="800" y="707" text-anchor="middle" font-size="25" fill="#5C6B6B">与原稿对照</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 制图 2026</text>
</svg>
