<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 農曆新年：六個地方的假期落在哪幾天 / Lunar New Year 2027 holidays across Asia</title>
  <desc id="desc">橫軸是 2027 年 2 月 4 日星期四到 2 月 11 日星期四共八天。台灣從 2 月 4 日連到 2 月 10 日共七天，其中 2 月 9 日與 2 月 10 日是補假。香港的公眾假期是 2 月 6 日農曆年初一、2 月 8 日農曆年初三、2 月 9 日農曆年初四，2 月 7 日的農曆年初二落在星期日。澳門的公眾假期是 2 月 6 日到 2 月 8 日，2 月 9 日與 2 月 10 日只是公共行政工作人員補假。新加坡是 2 月 6 日、2 月 7 日，加上 2 月 8 日。韓國的설 연휴從 2 月 6 日到 2 月 9 日，설날在 2 月 7 日，2 月 9 日是대체공휴일。日本沒有農曆新年假期，那一週只有 2 月 11 日建国記念の日。越南只有內務部提案的 2 月 4 日到 2 月 10 日，尚未定案。兩條垂直線標出 2 月 6 日的初一與 2 月 7 日的韓國설날，看得出韓國晚一天。</desc>
