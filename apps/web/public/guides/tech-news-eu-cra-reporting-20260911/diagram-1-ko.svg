<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">통보가 당국에 전달되는 과정</title><desc id="desc">통보 플랫폼의 접수와 전달 흐름. 공식 페이지와 사이버복원력법을 바탕으로 정리. 사실 확인일 2026년 9월 17일.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">통보가 당국에 전달되는 과정</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">인지한 순간</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">24시간 내 조기경보</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">72시간 이내</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">플랫폼에 전체 통보</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">단일 창구</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">CSIRT·ENISA 동시제출</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">국가 간 전달</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">다른 판매국 CSIRT로</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 제작 2026</text></svg>