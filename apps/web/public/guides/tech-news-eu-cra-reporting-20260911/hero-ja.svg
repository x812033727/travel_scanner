<title id="title">EUサイバーレジリエンス法の通報義務が始動：9月11日から誰がどれだけ早く通報するのか</title><desc id="desc">オリジナルイラスト：左側の時計から矢印が伸び、右上に警告の三角マークが付いた通報文書を指し、さらに矢印が中央の円形プラットフォームへ送られ、そこから3本の線で右側の3つの点（各国の対応チームへ通報を転送する様子）へつながっている</desc>
