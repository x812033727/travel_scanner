<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 模型家族怎麼選 / Choosing among the Claude models</title>
  <desc id="desc">插圖：米色底上有一道四階的白色階梯由左往右升高，每一階上各站著一個圓，由左到右越來越大，顏色依序是橘、綠、藍、深綠，代表 Haiku、Sonnet、Opus、Fable 四個等級由輕量到最強。每個圓上方各有一個白色的對話泡泡，泡泡裡有三個與圓同色的點，泡泡也隨著圓變大。階梯下方有一道淡色陰影，底部只有一行字：Claude 模型怎麼選。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- ground shadow -->
  <ellipse cx="800" cy="730" rx="660" ry="26" fill="#E3DDD2"/>

  <!-- staircase: four steps rising to the right -->
  <path d="M 160 720 L 160 660 L 460 660 L 460 570 L 760 570 L 760 480 L 1060 480 L 1060 390 L 1440 390 L 1440 720 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <!-- step tread accents -->
  <rect x="180" y="660" width="260" height="12" fill="#E3F0EF"/>
  <rect x="480" y="570" width="260" height="12" fill="#E3F0EF"/>
  <rect x="780" y="480" width="260" height="12" fill="#E3F0EF"/>
  <rect x="1080" y="390" width="340" height="12" fill="#E3F0EF"/>

  <!-- step 1: smallest circle (orange) -->
  <circle cx="310" cy="610" r="50" fill="#D97A2B" stroke="#102A2B" stroke-width="6"/>
  <path d="M 230 444 Q 230 428 246 428 L 374 428 Q 390 428 390 444 L 390 512 Q 390 528 374 528 L 326 528 L 310 546 L 296 528 L 246 528 Q 230 528 230 512 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="280" cy="478" r="9" fill="#D97A2B"/>
  <circle cx="310" cy="478" r="9" fill="#D97A2B"/>
  <circle cx="340" cy="478" r="9" fill="#D97A2B"/>

  <!-- step 2: green circle -->
  <circle cx="610" cy="504" r="66" fill="#2E7D5B" stroke="#102A2B" stroke-width="6"/>
  <path d="M 520 322 Q 520 306 536 306 L 684 306 Q 700 306 700 322 L 700 390 Q 700 406 684 406 L 628 406 L 610 424 L 594 406 L 536 406 Q 520 406 520 390 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="574" cy="356" r="10" fill="#2E7D5B"/>
  <circle cx="610" cy="356" r="10" fill="#2E7D5B"/>
  <circle cx="646" cy="356" r="10" fill="#2E7D5B"/>

  <!-- step 3: blue circle -->
  <circle cx="910" cy="398" r="82" fill="#2F6F9F" stroke="#102A2B" stroke-width="6"/>
  <path d="M 800 200 Q 800 184 816 184 L 1004 184 Q 1020 184 1020 200 L 1020 268 Q 1020 284 1004 284 L 930 284 L 910 302 L 892 284 L 816 284 Q 800 284 800 268 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="866" cy="234" r="11" fill="#2F6F9F"/>
  <circle cx="910" cy="234" r="11" fill="#2F6F9F"/>
  <circle cx="954" cy="234" r="11" fill="#2F6F9F"/>

  <!-- step 4: largest circle (deep green) -->
  <circle cx="1250" cy="290" r="100" fill="#0D6B68" stroke="#102A2B" stroke-width="6"/>
  <path d="M 1130 74 Q 1130 58 1146 58 L 1354 58 Q 1370 58 1370 74 L 1370 142 Q 1370 158 1354 158 L 1272 158 L 1250 176 L 1230 158 L 1146 158 Q 1130 158 1130 142 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="1200" cy="108" r="12" fill="#0D6B68"/>
  <circle cx="1250" cy="108" r="12" fill="#0D6B68"/>
  <circle cx="1300" cy="108" r="12" fill="#0D6B68"/>

  <!-- single line of text -->
  <text x="800" y="828" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">Claude 模型怎麼選</text>
</svg>
