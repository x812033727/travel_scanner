<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">海外 ATM 提款：一筆錢，三層費用</title>
<desc id="desc">畫面上方是三枚大小完全相同的圓形，像三枚抽象的硬幣，由左至右分別是綠邊、藍邊與橘邊，每一枚中間還有一個小圓環。三枚圓形各有一條短線往下接到同一條橫線上，橫線中央再有一條帶箭頭的線往下指進一台簡化的提款機。提款機是一個白色圓角長方形，上半部是淺綠色的螢幕，螢幕裡有一長一短兩條粗線代表畫面上的文字；螢幕下方是三乘二共六個圓角方塊組成的按鍵。機台左側插著一張白色圓角卡片，卡片上有一個橘色的晶片方塊與一條灰線；機台右側從機身邊緣伸出一張白色的明細單，上面有三條灰線。機台底部是一道深色出鈔口，出鈔口下方露出一張白色的抽象紙鈔，紙鈔中央是一個綠色圓環，兩側各有一條短灰線。畫面最下方置中一行字寫著一筆錢，三層費用。</desc>
