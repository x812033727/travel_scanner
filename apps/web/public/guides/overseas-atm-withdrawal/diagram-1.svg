<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">海外提款的錢，被誰各收一段 / Who charges what on an overseas ATM withdrawal</title>
<desc id="desc">最上排是出國前要在台灣做完的兩件設定：其一，開通跨國提款功能；其二，取得國外提款密碼。往下是提款當下的費用分層，由上而下四條橫帶，每一條左邊的方塊寫的是收費的人。第一層是發卡機構收的跨國提款手續費，常見是每筆固定金額，或固定金額再加一定比率，計收方式載於官網的服務費用標準。第二層是國際卡組織收的交易處理費，依交易金額計收，通常由發卡機構一併向你收取。第三層是當地機台業者可能加收的機台使用費，與你的發卡機構無關，通常在確認前於螢幕揭露。最後一條橫帶不是收費，而是幣別折算：領出來的是外幣，扣的是新臺幣，用哪一個匯率、哪一個時點由契約約定。最下方一格是站在機台前面唯一還能改的選擇：螢幕問要用台幣還是當地貨幣計價時選當地貨幣，三層裡也只有第三層會在現場出現。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">海外提款的錢，被誰各收一段</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Who charges what on an overseas ATM withdrawal · 出國前兩件事、費用三層、現場一個選擇</text>

<rect x="140" y="104" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="440" y="147" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">出國前其一：開通跨國提款功能</text>
<rect x="860" y="104" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1160" y="147" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">出國前其二：取得國外提款密碼</text>

<path d="M 800 180 L 800 214" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="110" y="210" font-size="20" font-weight="700" fill="#102A2B">提款當下：三方各收一段，最後再折算一次</text>

<rect x="110" y="232" width="1380" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<rect x="134" y="249" width="290" height="60" rx="12" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="279" y="287" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">第一層｜發卡機構</text>
<text x="456" y="274" font-size="22" font-weight="700" fill="#102A2B">跨國提款手續費</text>
<text x="456" y="306" font-size="17" fill="#5C6B6B">常見每筆固定金額，或固定金額再加一定比率，計收方式載於官網的服務費用標準</text>

<rect x="110" y="346" width="1380" height="94" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<rect x="134" y="363" width="290" height="60" rx="12" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="279" y="401" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">第二層｜國際卡組織</text>
<text x="456" y="388" font-size="22" font-weight="700" fill="#102A2B">交易處理費</text>
<text x="456" y="420" font-size="17" fill="#5C6B6B">依交易金額計收，通常由發卡機構一併向你收取，不會另外寄帳單</text>

<rect x="110" y="460" width="1380" height="94" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<rect x="134" y="477" width="290" height="60" rx="12" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
<text x="279" y="515" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">第三層｜當地機台業者</text>
<text x="456" y="502" font-size="22" font-weight="700" fill="#102A2B">機台使用費，可能加收</text>
<text x="456" y="534" font-size="17" fill="#5C6B6B">與你的發卡機構無關，通常在確認前於螢幕揭露，按下確認就是同意</text>

<rect x="110" y="574" width="1380" height="94" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<rect x="134" y="591" width="290" height="60" rx="12" fill="#F7F1E8" stroke="#5C6B6B" stroke-width="4"/>
<text x="279" y="629" text-anchor="middle" font-size="22" font-weight="700" fill="#5C6B6B">最後｜不是收費</text>
<text x="456" y="616" font-size="22" font-weight="700" fill="#102A2B">幣別折算：外幣領出，新臺幣扣帳</text>
<text x="456" y="648" font-size="17" fill="#5C6B6B">用哪一個匯率、哪一個時點由契約約定，以發卡機構公告為準</text>

<path d="M 800 672 L 800 706" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="110" y="710" width="1380" height="102" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">站在機台前面，唯一還能改的那個選擇</text>
<text x="800" y="784" text-anchor="middle" font-size="17" fill="#5C6B6B">螢幕問要用台幣還是當地貨幣計價時選當地貨幣；三層裡也只有第三層會在現場出現</text>

