<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>濟州肉湯麵：一碗麵的三個選擇</title><desc>肉湯麵點餐圖：고기국수先看豬肉、湯底與麵條；비빔고기국수及비빔국수是另列的拌麵選項，配方依店家。旅途中先分濟州市與西歸浦市，再核對分店名及道路門牌，不因店名有국수就當成同一家。</desc><rect width="1600" height="900" fill="#f4f2e9"/><g font-family="'Noto Sans TC','Noto Sans KR','Microsoft JhengHei',sans-serif"><text x="88" y="100" font-size="26" fill="#326d76">JEJU · 고기국수</text><text x="88" y="178" font-size="56" font-weight="700" fill="#1d414b">一碗麵，先確認三件事</text><text x="88" y="239" font-size="29" fill="#567078">完整菜名 → 湯底與麵條 → 城市與門牌</text><rect x="88" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="116" y="359" font-size="27" fill="#327984">一</text><text x="116" y="421" font-size="37" font-weight="700" fill="#1d414b">先看完整菜名</text><text x="116" y="495" font-size="26" fill="#304f56">고기국수 → 肉湯麵</text><text x="116" y="548" font-size="26" fill="#304f56">비빔고기국수 / 비빔국수</text><text x="116" y="601" font-size="26" fill="#304f56">另列的拌麵選項</text><rect x="572" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="600" y="359" font-size="27" fill="#327984">二</text><text x="600" y="421" font-size="37" font-weight="700" fill="#1d414b">再看各店差異</text><text x="600" y="495" font-size="26" fill="#304f56">豬肉、湯與麵</text><text x="600" y="548" font-size="26" fill="#304f56">有店的湯底加入鯷魚</text><text x="600" y="601" font-size="26" fill="#304f56">有店介紹自製生麵</text><rect x="1056" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="1084" y="359" font-size="27" fill="#327984">三</text><text x="1084" y="421" font-size="37" font-weight="700" fill="#1d414b">最後核對地點</text><text x="1084" y="495" font-size="26" fill="#304f56">제주시 → 濟州市</text><text x="1084" y="548" font-size="26" fill="#304f56">서귀포시 → 西歸浦市</text><text x="1084" y="601" font-size="26" fill="#304f56">分店名＋道路名＋門牌</text><rect x="88" y="710" width="1424" height="93" rx="18" fill="#1d414b"/><text x="125" y="770" font-size="29" fill="#fff">先選當天所在區域，再查供應、營業與停車；不要從菜名推定全部成分。</text><text x="88" y="858" font-size="22" fill="#567078">依據：Visit Jeju各店可見介紹。個別做法不代表每一家都相同。</text></g></svg>