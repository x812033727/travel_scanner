<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>濟州肉湯麵：先確認三件事</title><desc>圖的左上角先寫一行小標「JEJU · 고기국수」，主標題是「一碗麵，先確認三件事」，下一行是「完整菜名 → 湯底與麵條 → 城市與門牌」。中間三張白色卡片並排，各自編號一、二、三。第一張「先看完整菜名」，寫「고기국수 → 肉湯麵」、「비빔고기국수 / 비빔국수」與「另列的拌麵選項」。第二張「再看各店差異」，寫「豬肉、湯與麵」、「有的店湯底加鯷魚」與「有的店用自製生麵」。第三張「最後核對地點」，寫「제주시 → 濟州市」、「서귀포시 → 西歸浦市」與「分店名＋道路名＋門牌」。三張卡片下面是一條深色長條，寫「先選當天所在區域，再查供應、營業與停車；不要從菜名推定全部成分。」最下面一行是「資料：Visit Jeju」。</desc><rect width="1600" height="900" fill="#f4f2e9"/><g font-family="'Noto Sans TC','Noto Sans KR','Microsoft JhengHei',sans-serif"><text x="88" y="100" font-size="26" fill="#326d76">JEJU · 고기국수</text><text x="88" y="178" font-size="56" font-weight="700" fill="#1d414b">一碗麵，先確認三件事</text><text x="88" y="239" font-size="29" fill="#567078">完整菜名 → 湯底與麵條 → 城市與門牌</text><rect x="88" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="116" y="359" font-size="27" fill="#327984">一</text><text x="116" y="421" font-size="37" font-weight="700" fill="#1d414b">先看完整菜名</text><text x="116" y="495" font-size="26" fill="#304f56">고기국수 → 肉湯麵</text><text x="116" y="548" font-size="26" fill="#304f56">비빔고기국수 / 비빔국수</text><text x="116" y="601" font-size="26" fill="#304f56">另列的拌麵選項</text><rect x="572" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="600" y="359" font-size="27" fill="#327984">二</text><text x="600" y="421" font-size="37" font-weight="700" fill="#1d414b">再看各店差異</text><text x="600" y="495" font-size="26" fill="#304f56">豬肉、湯與麵</text><text x="600" y="548" font-size="26" fill="#304f56">有的店湯底加鯷魚</text><text x="600" y="601" font-size="26" fill="#304f56">有的店用自製生麵</text><rect x="1056" y="304" width="456" height="354" rx="24" fill="#fff"/><text x="1084" y="359" font-size="27" fill="#327984">三</text><text x="1084" y="421" font-size="37" font-weight="700" fill="#1d414b">最後核對地點</text><text x="1084" y="495" font-size="26" fill="#304f56">제주시 → 濟州市</text><text x="1084" y="548" font-size="26" fill="#304f56">서귀포시 → 西歸浦市</text><text x="1084" y="601" font-size="26" fill="#304f56">分店名＋道路名＋門牌</text><rect x="88" y="710" width="1424" height="93" rx="18" fill="#1d414b"/><text x="125" y="770" font-size="29" fill="#fff">先選當天所在區域，再查供應、營業與停車；不要從菜名推定全部成分。</text><text x="88" y="858" font-size="22" fill="#567078">資料：Visit Jeju</text></g></svg>