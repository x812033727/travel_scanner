<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">合成資料（Synthetic Data）：產生之後要篩選與抽查</title><desc id="desc">許多虛線小卡片代表模型產生的資料，落進中間的漏斗；漏斗下方只剩幾張打勾的實線卡片，代表篩選後留下的資料。左側一疊實線卡片代表真實資料，右側的放大鏡代表人工抽查。</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker></defs><path d="M 520 270 L 1080 270 L 900 500 L 900 610 L 700 610 L 700 500 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/><rect x="560" y="130" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-12 620 170)"/><rect x="690" y="80" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(8 750 120)"/><rect x="820" y="150" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-6 880 190)"/><rect x="940" y="85" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(14 1000 125)"/><rect x="1030" y="175" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-10 1090 215)"/><rect x="630" y="215" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="14 10" transform="rotate(5 690 255)"/><rect x="640" y="305" width="100" height="66" rx="10" fill="#FFFFFF" stroke