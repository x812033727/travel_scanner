<title id="title">Apple 調整歐盟 App 追蹤透明度詢問框：五國強制新版、設定改名、一年可再問</title><desc id="desc">原創插圖：畫面左側是一個對話框的幾何外框，框內一分為二，一半維持原本樣式、一半以虛線重繪代表另一版本；對話框下方延伸出兩條線，一條連向排成一列的五個小方塊，另一條連向一個時鐘圖示，代表地區差異與滿一年後的再次詢問</desc>
