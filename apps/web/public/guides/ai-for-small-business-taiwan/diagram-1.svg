<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">小店的一天：AI 在哪一段接手 / One shop day: where AI takes over</title>
  <desc id="desc">流程圖分成三段。開店前：設好 LINE 自動回應處理營業時間、訂位與停車問題，自動回應訊息不計費用；盤點免費額度，輕用量月費 0 元、每月 200 則免費群發；排好 Google 商家檔案貼文，可設每週或每月重複，未指定日期範圍時超過 6 個月自動封存。營業中：AI 聊天機器人（β）在聊天進階方案，訂閱制 NT$100，參考檔案最多 10 個；拍照問菜單，每張圖片上限 20MB，非拉丁字母辨識較弱；真人隨時可接手，AI 只產草稿，對外發言由你按送出。打烊後：回覆 Google 評論，先通過驗證才能回覆，審核 10 分鐘至 30 天；整理單據與留言用試算表 AI 函式，一次只處理前 350 格；碰到長期上限等 24 小時，數字仍要自己核對。三段共通的紅線是顧客個資不進公開 AI，個人資料保護法第 5 條規定蒐集、處理或利用不得逾越特定目的之必要範圍，貼進聊天 AI 前先把姓名、電話、地址、訂單編號換成代號。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">小店的一天：AI 在哪一段接手</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">One shop day: where AI takes over</text>

  <!-- Panel 1 -->
  <rect x="60" y="130" width="453" height="530" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="286" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">開店前</text>
  <text x="286" y="202" text-anchor="middle" font-size="15" fill="#5C6B6B">Before opening</text>

  <rect x="76" y="222" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="286" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">設好自動回應</text>
  <text x="286" y="286" text-anchor="middle" font-size="16" fill="#102A2B">營業時間、訂位、停車</text>
  <text x="286" y="314" text-anchor="middle" font-size="16" fill="#5C6B6B">自動回應訊息不計費用</text>

  <rect x="76" y="368" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="286" y="402" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">盤點免費額度</text>
  <text x="286" y="432" text-anchor="middle" font-size="16" fill="#102A2B">輕用量固定月費 0 元</text>
  <text x="286" y="460" text-anchor="middle" font-size="16" fill="#5C6B6B">每月 200 則免費群發</text>

  <rect x="76" y="514" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="286" y="548" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">排好商家檔案貼文</text>
  <text x="286" y="578" text-anchor="middle" font-size="16" fill="#102A2B">可設每週或每月重複</text>
  <text x="286" y="606" text-anchor="middle" font-size="16" fill="#5C6B6B">超過 6 個月自動封存</text>

  <!-- Panel 2 -->
  <rect x="573" y="130" width="453" height="530" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="799" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">營業中</text>
  <text x="799" y="202" text-anchor="middle" font-size="15" fill="#5C6B6B">During service</text>

  <rect x="589" y="222" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="799" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">AI 聊天機器人（β）</text>
  <text x="799" y="286" text-anchor="middle" font-size="16" fill="#102A2B">聊天進階方案 NT$100</text>
  <text x="799" y="314" text-anchor="middle" font-size="16" fill="#5C6B6B">參考檔案最多 10 個</text>

  <rect x="589" y="368" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="799" y="402" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">拍照問菜單</text>
  <text x="799" y="432" text-anchor="middle" font-size="16" fill="#102A2B">每張圖片上限 20MB</text>
  <text x="799" y="460" text-anchor="middle" font-size="16" fill="#5C6B6B">非拉丁字母辨識較弱</text>

  <rect x="589" y="514" width="421" height="132" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="799" y="548" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">真人隨時可接手</text>
  <text x="799" y="578" text-anchor="middle" font-size="16" fill="#102A2B">AI 只負責產草稿</text>
  <text x="799" y="606" text-anchor="middle" font-size="16" fill="#5C6B6B">對外發言由你按送出</text>

  <!-- Panel 3 -->
  <rect x="1086" y="130" width="453" height="530" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1312" y="176" text-anchor="middle" font-size="22" font-weight="bold" fill="#102A2B">打烊後</text>
  <text x="1312" y="202" text-anchor="middle" font-size="15" fill="#5C6B6B">After closing</text>

  <rect x="1102" y="222" width="421" height="132" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1312" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">回覆 Google 評論</text>
  <text x="1312" y="286" text-anchor="middle" font-size="16" fill="#102A2B">先通過驗證才能回覆</text>
  <text x="1312" y="314" text-anchor="middle" font-size="16" fill="#5C6B6B">審核 10 分鐘至 30 天</text>

  <rect x="1102" y="368" width="421" height="132" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1312" y="402" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">整理單據與留言</text>
  <text x="1312" y="432" text-anchor="middle" font-size="16" fill="#102A2B">用試算表 AI 函式分類</text>
  <text x="1312" y="460" text-anchor="middle" font-size="16" fill="#5C6B6B">一次只處理前 350 格</text>

  <rect x="1102" y="514" width="421" height="132" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
  <text x="1312" y="548" text-anchor="middle" font-size="17" font-weight="bold" fill="#102A2B">碰到上限就休息</text>
  <text x="1312" y="578" text-anchor="middle" font-size="16" fill="#102A2B">長期上限要等 24 小時</text>
  <text x="1312" y="606" text-anchor="middle" font-size="16" fill="#5C6B6B">數字仍要自己核對</text>

  <!-- arrows -->
  <line x1="521" y1="395" x2="565" y2="395" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1034" y1="395" x2="1078" y2="395" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- bottom band -->
  <rect x="60" y="692" width="1479" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="799" y="732" text-anchor="middle" font-size="19" font-weight="bold" fill="#B8442D">三段共通的紅線：顧客個資不進公開 AI</text>
  <text x="799" y="764" text-anchor="middle" font-size="16" fill="#102A2B">個人資料保護法第 5 條：蒐集、處理或利用不得逾越特定目的之必要範圍</text>
  <text x="799" y="792" text-anchor="middle" font-size="16" fill="#5C6B6B">貼進聊天 AI 前，先把姓名、電話、地址、訂單編號換成代號</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
