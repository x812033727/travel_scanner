<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">小店與三件 AI 工作 / A small shop and three AI jobs</title>
  <desc id="desc">幾何插圖。畫面中央是一間小店：條紋遮陽棚下有白色店面、一道門與兩扇窗，店面站在一條地平線上。店的上方有三個圖形用細線連到遮陽棚：左邊是藍色對話框，裡面有三條橫線代表客服訊息；中間是橘色邊框的卡片，上面幾條橫線代表菜單；右邊是綠色邊框的方塊，裡面有一個圓形與一排三角形，代表廣告用的圖片素材。畫面下方只有一行字：小店的一天。全圖沒有任何品牌標誌、產品介面或人物臉孔。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- chat bubble: customer service -->
  <path d="M 198 170 H 442 A 28 28 0 0 1 470 198 V 312 A 28 28 0 0 1 442 340 H 312 L 254 402 L 246 340 H 198 A 28 28 0 0 1 170 312 V 198 A 28 28 0 0 1 198 170 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10" stroke-linejoin="round"/>
  <line x1="212" y1="222" x2="410" y2="222" stroke="#2F6F9F" stroke-width="14" stroke-linecap="round"/>
