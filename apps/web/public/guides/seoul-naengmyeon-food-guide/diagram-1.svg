<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾冷麵解碼圖：평양냉면與함흥냉면怎麼分 / How to tell Seoul's two naengmyeon styles apart</title>
  <desc id="desc">圖上的標題是「평양냉면與함흥냉면：麵、湯、怎麼吃、配什麼」，副標是「Two systems of Seoul naengmyeon, side by side」。下面是左右兩欄的對照表。左欄的欄頭是綠色的「평양냉면 平壤冷麵」，底下一行小字「蕎麥麵、冰涼清湯」；右欄的欄頭是橘色的「함흥냉면 咸興冷麵」，底下一行小字「澱粉麵、辣拌」。往下四排，每排左右各一格。「麵」這排，左邊寫蕎麥（메밀），右邊寫澱粉（전분）。「湯」這排，左邊寫牛肉與牛骨熬的冰涼清湯，右邊寫肉高湯混水蘿蔔辛奇，再加一行小字「只淋一點，或不淋」。「怎麼吃」這排，左邊寫麵泡在湯裡、味道清淡，右邊寫拌開再吃、帶辣。「配什麼」這排，左邊寫만두（餃子）、제육（豬肉片），右邊寫生魚片配料、小黃瓜、水煮蛋。最下面是一條橫跨兩欄的綠色橫幅，寫「물냉면／비빔냉면是另一個軸」與「講的是那一碗有沒有湯，兩邊的店都可能有」。右下角是「© Mokaair 製圖 2026」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">평양냉면與함흥냉면：麵、湯、怎麼吃、配什麼</text>
  <text x="60" y="82" font-size="18" fill="#5C6B6B">Two systems of Seoul naengmyeon, side by side</text>

  <!-- column headers -->
  <rect x="40" y="104" width="740" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="132" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">평양냉면　平壤冷麵</text>
  <text x="410" y="156" font-size="15" fill="#0B4F4D" text-anchor="middle">蕎麥麵、冰涼清湯</text>

  <rect x="820" y="104" width="740" height="64" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4"/>
  <text x="1190" y="132" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">함흥냉면　咸興冷麵</text>
  <text x="1190" y="156" font-size="15" fill="#8A4A14" text-anchor="middle">澱粉麵、辣拌</text>

  <!-- row 1: 麵 -->
  <rect x="40" y="190" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="228" font-size="20" font-weight="700" fill="#0B4F4D">麵</text>
  <text x="76" y="262" font-size="19" fill="#102A2B">蕎麥（메밀）</text>

  <rect x="820" y="190" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="228" font-size="20" font-weight="700" fill="#8A4A14">麵</text>
  <text x="856" y="262" font-size="19" fill="#102A2B">澱粉（전분）</text>

  <!-- row 2: 湯 -->
  <rect x="40" y="346" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="384" font-size="20" font-weight="700" fill="#0B4F4D">湯</text>
  <text x="76" y="418" font-size="19" fill="#102A2B">牛肉與牛骨熬的冰涼清湯</text>

  <rect x="820" y="346" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="384" font-size="20" font-weight="700" fill="#8A4A14">湯</text>
  <text x="856" y="418" font-size="19" fill="#102A2B">肉高湯混水蘿蔔辛奇</text>
  <text x="856" y="446" font-size="17" fill="#5C6B6B">只淋一點，或不淋</text>

  <!-- row 3: 怎麼吃 -->
  <rect x="40" y="502" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="540" font-size="20" font-weight="700" fill="#0B4F4D">怎麼吃</text>
  <text x="76" y="574" font-size="19" fill="#102A2B">麵泡在湯裡，味道清淡</text>

  <rect x="820" y="502" width="740" height="138" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="540" font-size="20" font-weight="700" fill="#8A4A14">怎麼吃</text>
  <text x="856" y="574" font-size="19" fill="#102A2B">拌開再吃，帶辣</text>

  <!-- row 4: 配什麼 -->
  <rect x="40" y="658" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="696" font-size="20" font-weight="700" fill="#0B4F4D">配什麼</text>
  <text x="76" y="730" font-size="19" fill="#102A2B">만두（餃子）、제육（豬肉片）</text>

  <rect x="820" y="658" width="740" height="128" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/>
  <text x="856" y="696" font-size="20" font-weight="700" fill="#8A4A14">配什麼</text>
  <text x="856" y="730" font-size="19" fill="#102A2B">生魚片配料、小黃瓜、水煮蛋</text>

  <!-- bottom banner spanning both columns -->
  <rect x="40" y="800" width="1520" height="70" rx="14" fill="#EAF3EC" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="834" font-size="21" font-weight="700" fill="#1B4D36" text-anchor="middle">물냉면／비빔냉면是另一個軸</text>
  <text x="800" y="861" font-size="17" fill="#1B4D36" text-anchor="middle">講的是那一碗有沒有湯，兩邊的店都可能有</text>

  <text x="1540" y="888" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
