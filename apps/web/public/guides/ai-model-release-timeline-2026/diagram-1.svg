<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026 年 AI 模型發布時間軸 / 2026 AI model release timeline</title>
  <desc id="desc">一條由左到右的時間箭頭下方放三個面板。左邊面板是 1 到 3 月，主題是舊模型下架、新一代接著上：1 月有 Qwen3-Coder-Next 開放權重與 OpenAI 公告 GPT-4o 等舊型號下架；2 月有 Claude Opus 4.6、GPT-5.3-Codex、Qwen3.5、Claude Sonnet 4.6、Gemini 3.1 Pro；3 月有 Gemini 3.1 Flash-Lite、GPT-5.4、Grok 4.20、Mistral Small 4、MiniMax M2.7。中間面板是 4 到 6 月，主題是開放權重追上來、前沿模型分兩層：4 月有 Gemma 4、Claude Opus 4.7、GPT-5.5、DeepSeek-V4 預覽；5 月有 Gemini 3.5、Mistral Medium 3.5、Claude Opus 4.8；6 月有 MiniMax M3、Claude Sonnet 5、Claude Fable 5 與 Mythos 5。右邊面板是 7 到 9 月，主題是能力往上、免費層也動了：7 月有 Grok 4.5、GPT-5.6、Claude Opus 5、Gemini 3.6 Flash；8 月有 Qwen3.8、Grok 4.6、Gemini 3.7 Flash、DeepSeek-V4-Pro 正式版；9 月有 Claude Fable 5.1、Gemini 3.8 Flash、GPT-6 Astra、DeepSeek-V4.1-Flash。最下方的橫幅寫明收錄範圍是 2026 年 1 月 1 日到 9 月 15 日，只收各家官方公告頁宣布的模型，日期以官方公告頁標示的發布日為準，本圖不做排名。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2026 年 AI 模型大事記：官方公告時間軸</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">2026 AI model release timeline, from official announcements</text>

  <line x1="62" y1="116" x2="1548" y2="116" stroke="#0D6B68" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Panel 1 : Jan-Mar -->
  <rect x="60" y="140" width="480" height="530" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="90" y="186" font-size="24" font-weight="700" fill="#2F6F9F">1 月 – 3 月</text>
  <text x="90" y="216" font-size="17" fill="#5C6B6B">舊模型下架，新一代接著上</text>
  <line x1="86" y1="234" x2="514" y2="234" stroke="#E6F0F7" stroke-width="3"/>

  <text x="90" y="278" font-size="21" font-weight="700" fill="#102A2B">1 月</text>
  <text x="90" y="310" font-size="17" fill="#102A2B">Qwen3-Coder-Next 開放權重</text>
  <text x="90" y="338" font-size="17" fill="#102A2B">OpenAI 公告 GPT-4o 等舊型號下架</text>
  <line x1="86" y1="370" x2="514" y2="370" stroke="#E6F0F7" stroke-width="3"/>

  <text x="90" y="418" font-size="21" font-weight="700" fill="#102A2B">2 月</text>
  <text x="90" y="450" font-size="17" fill="#102A2B">Claude Opus 4.6、GPT-5.3-Codex</text>
  <text x="90" y="478" font-size="17" fill="#102A2B">Qwen3.5、Claude Sonnet 4.6、Gemini 3.1 Pro</text>
  <line x1="86" y1="510" x2="514" y2="510" stroke="#E6F0F7" stroke-width="3"/>

  <text x="90" y="558" font-size="21" font-weight="700" fill="#102A2B">3 月</text>
  <text x="90" y="590" font-size="17" fill="#102A2B">Gemini 3.1 Flash-Lite、GPT-5.4、Grok 4.20</text>
  <text x="90" y="618" font-size="17" fill="#102A2B">Mistral Small 4、MiniMax M2.7</text>

  <!-- Panel 2 : Apr-Jun -->
  <rect x="570" y="140" width="480" height="530" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="600" y="186" font-size="24" font-weight="700" fill="#D97A2B">4 月 – 6 月</text>
  <text x="600" y="216" font-size="17" fill="#5C6B6B">開放權重追上來，前沿模型分層</text>
  <line x1="596" y1="234" x2="1024" y2="234" stroke="#F1E3D3" stroke-width="3"/>

  <text x="600" y="278" font-size="21" font-weight="700" fill="#102A2B">4 月</text>
  <text x="600" y="310" font-size="17" fill="#102A2B">Gemma 4、Claude Opus 4.7</text>
  <text x="600" y="338" font-size="17" fill="#102A2B">GPT-5.5、DeepSeek-V4 預覽</text>
  <line x1="596" y1="370" x2="1024" y2="370" stroke="#F1E3D3" stroke-width="3"/>

  <text x="600" y="418" font-size="21" font-weight="700" fill="#102A2B">5 月</text>
  <text x="600" y="450" font-size="17" fill="#102A2B">Gemini 3.5、Mistral Medium 3.5</text>
  <text x="600" y="478" font-size="17" fill="#102A2B">Claude Opus 4.8</text>
  <line x1="596" y1="510" x2="1024" y2="510" stroke="#F1E3D3" stroke-width="3"/>

  <text x="600" y="558" font-size="21" font-weight="700" fill="#102A2B">6 月</text>
  <text x="600" y="590" font-size="17" fill="#102A2B">MiniMax M3、Claude Sonnet 5</text>
  <text x="600" y="618" font-size="17" fill="#102A2B">Claude Fable 5 與 Mythos 5</text>

  <!-- Panel 3 : Jul-Sep -->
  <rect x="1080" y="140" width="480" height="530" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1110" y="186" font-size="24" font-weight="700" fill="#0D6B68">7 月 – 9 月</text>
  <text x="1110" y="216" font-size="17" fill="#5C6B6B">能力往上，免費層也動了</text>
  <line x1="1106" y1="234" x2="1534" y2="234" stroke="#E3F0EF" stroke-width="3"/>

  <text x="1110" y="278" font-size="21" font-weight="700" fill="#102A2B">7 月</text>
  <text x="1110" y="310" font-size="17" fill="#102A2B">Grok 4.5、GPT-5.6、Claude Opus 5</text>
  <text x="1110" y="338" font-size="17" fill="#102A2B">Gemini 3.6 Flash</text>
  <line x1="1106" y1="370" x2="1534" y2="370" stroke="#E3F0EF" stroke-width="3"/>

  <text x="1110" y="418" font-size="21" font-weight="700" fill="#102A2B">8 月</text>
  <text x="1110" y="450" font-size="17" fill="#102A2B">Qwen3.8、Grok 4.6、Gemini 3.7 Flash</text>
  <text x="1110" y="478" font-size="17" fill="#102A2B">DeepSeek-V4-Pro 正式版</text>
  <line x1="1106" y1="510" x2="1534" y2="510" stroke="#E3F0EF" stroke-width="3"/>

  <text x="1110" y="558" font-size="21" font-weight="700" fill="#102A2B">9 月</text>
  <text x="1110" y="590" font-size="17" fill="#102A2B">Claude Fable 5.1、Gemini 3.8 Flash</text>
  <text x="1110" y="618" font-size="17" fill="#102A2B">GPT-6 Astra、DeepSeek-V4.1-Flash</text>

  <!-- Bottom note band -->
  <rect x="60" y="706" width="1500" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="92" y="748" font-size="19" font-weight="700" fill="#102A2B">收錄範圍：2026 年 1 月 1 日到 9 月 15 日，只收各家官方公告頁宣布的模型</text>
  <text x="92" y="780" font-size="17" fill="#5C6B6B">日期以官方公告頁標示的發布日為準；定位抄官方原文，本圖不做排名、不是完整名錄</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
