<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一年之中陸續發布的模型 / A year of model releases, illustrated</title>
<desc id="desc">一張幾何插圖。畫面下半部有一條橫貫左右的深色粗線，代表一整年的時間。線上等距排著九個實心圓點，由左到右愈來愈大，最右邊那顆最大，代表每個月都有新發布、而且規模愈滾愈大。每個圓點各有一條細直線往上連到一個彩色圓角長條，長條的高度與長度不一，像是一次次大小不同的公告；藍色、綠色、橘色與墨綠色交替出現，代表不同廠商。畫面上方置中寫著「2026 年 AI 模型大事記」。左下角與右上角各有一個淡色圓形色塊作為留白襯底。圖中沒有任何產品標誌、介面、文字標或人物。</desc>

