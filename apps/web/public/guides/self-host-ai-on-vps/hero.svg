<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">加密連線通往自己的伺服器 / An encrypted link from a laptop to your own server</title>
  <desc id="desc">插圖。畫面左邊是一台白色的筆記型電腦，螢幕用綠色粗框畫成圓角矩形，裡面有三條圓角橫條代表對話訊息，下面一條深綠色的長條是機身。筆電右側伸出一條藍色的粗線，線的中段有一把橘色的掛鎖，鎖身是圓角方塊，上面是半圓形的鎖環，中央有一個淺色鑰匙孔，代表加密連線。線的右端接到一台直立的伺服器主機，主機是白底綠框的高圓角矩形，裡面上方有兩層淺綠色的插槽，各帶一顆綠色與橘色的指示燈與一條深綠色橫條，下方是一顆深綠色的晶片，晶片中央是淺綠色方塊，兩側各有三根短接腳，代表在自己機器上執行的模型。畫面上方一行字寫著「自己的機器，自己的 AI」。整張圖只有幾何形狀，沒有任何品牌標誌、介面截圖或人物。</desc>
