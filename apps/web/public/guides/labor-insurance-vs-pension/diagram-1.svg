<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">勞保與勞退的五個差異 / Labour insurance and labour pension side by side</title>
<desc id="desc">左右兩欄的比較表。左欄是勞保，屬於社會保險：普通事故保險費由勞工負擔百分之二十、投保單位百分之七十、政府補助百分之十，錢進入共同的勞工保險基金，給付看保險年資與平均月投保薪資，請領年齡依出生年次提高到六十五歲為限並須辦理離職退保，換工作時保險年資合計、沒有加保的空窗不計入。右欄是勞退，屬於個人專戶：由雇主提繳不低於每月工資百分之六，錢存在你名下的個人退休金專戶，給付看專戶的本金與累積收益，年滿六十歲即可請領且在職與否都不影響，換工作時專戶跟著人走、前後提繳年資合併計算。兩欄並排而不交會，代表兩套制度各自請領。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">勞保與勞退的五個差異</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Labour insurance and labour pension · 兩套制度，兩種算法，兩次請領</text>

<rect x="280" y="112" width="615" height="66" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">勞保（社會保險）</text>
<rect x="925" y="112" width="615" height="66" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">勞退（個人專戶）</text>

<text x="250" y="256" text-anchor="end" font-size="20" font-weight="700" fill="#5C6B6B">誰出錢</text>
<rect x="280" y="192" width="615" height="108" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">勞工 20%・雇主 70%・政府 10%</text>
<text x="588" y="272" text-anchor="middle" font-size="17" fill="#5C6B6B">普通事故保險費，三方分擔</text>
<rect x="925" y="192" width="615" height="108" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">雇主提繳，不低於工資 6%</text>
<text x="1233" y="272" text-anchor="middle" font-size="17" fill="#5C6B6B">不從薪水扣，可另行自願提繳</text>

<text x="250" y="376" text-anchor="end" font-size="20" font-weight="700" fill="#5C6B6B">錢放在哪裡</text>
<rect x="280" y="312" width="615" height="108" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">共同的勞工保險基金</text>
<text x="588" y="392" text-anchor="middle" font-size="17" fill="#5C6B6B">累積的是保險年資，不是餘額</text>
<rect x="925" y="312" width="615" height="108" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">你名下的個人退休金專戶</text>
<text x="1233" y="392" text-anchor="middle" font-size="17" fill="#5C6B6B">錢是你的，查得到累計金額</text>

<text x="250" y="496" text-anchor="end" font-size="20" font-weight="700" fill="#5C6B6B">給付看什麼</text>
<rect x="280" y="432" width="615" height="108" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">保險年資與平均月投保薪資</text>
<text x="588" y="512" text-anchor="middle" font-size="17" fill="#5C6B6B">滿 15 年領年金，未滿領一次金</text>
<rect x="925" y="432" width="615" height="108" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">專戶的本金與累積收益</text>
<text x="1233" y="512" text-anchor="middle" font-size="17" fill="#5C6B6B">滿 15 年可選月退或一次</text>

<text x="250" y="616" text-anchor="end" font-size="20" font-weight="700" fill="#5C6B6B">幾歲領得到</text>
<rect x="280" y="552" width="615" height="108" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">依出生年次，最高 65 歲</text>
<text x="588" y="632" text-anchor="middle" font-size="17" fill="#5C6B6B">請領時應辦理離職退保</text>
<rect x="925" y="552" width="615" height="108" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">年滿 60 歲</text>
<text x="1233" y="632" text-anchor="middle" font-size="17" fill="#5C6B6B">在職與否都可以請領</text>

<text x="250" y="736" text-anchor="end" font-size="20" font-weight="700" fill="#5C6B6B">換工作</text>
<rect x="280" y="672" width="615" height="108" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="588" y="716" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">保險年資合計，換幾家都累加</text>
<text x="588" y="752" text-anchor="middle" font-size="17" fill="#5C6B6B">沒有加保的空窗不計入年資</text>
<rect x="925" y="672" width="615" height="108" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1233" y="716" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">專戶跟著人走，不必移轉</text>
<text x="1233" y="752" text-anchor="middle" font-size="17" fill="#5C6B6B">前後提繳年資合併計算</text>

<text x="60" y="828" font-size="20" fill="#5C6B6B">兩欄各自獨立：兩套制度都領得到，不是二選一，請領的時點也不必一致。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
