<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">延誤當下的時間軸與要留的文件 / Flight and baggage delay: what to secure, and when</title>
<desc id="desc">上排由左到右是四個時點：原定出發時間、延誤達條款門檻、抵達目的地、託運行李未送達；中間一條由左往右的時間軸把四個時點串起來。每個時點正下方是那一刻要拿到手的文件：原定出發時間要留登機證與行程證明、訂位與改票紀錄，用來證明原定出發時間；延誤達條款門檻時要向航空業者拿載明班次與實際時間的延誤證明，補償收據不算；抵達目的地後要留膳食、住宿與交通的收據正本，看得出品項與日期，實支實付型靠它計算；託運行李未送達時要拿行李事故報告、託運行李領取單，並留下應急採買的收據正本。圖的下半是兩種給付方式的舉證差別：定額型只要證明事故成立，也就是延誤達條款門檻，不看你花了多少；實支實付型還要證明每一筆費用，收據正本、品項與日期缺一不可，並受保險單所載限額拘束。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="60" y="52" text-anchor="start" font-size="30" fill="#102A2B" font-weight="bold">延誤當下的時間軸與要留的文件</text>
<text x="60" y="84" text-anchor="start" font-size="18" fill="#5C6B6B">Flight and baggage delay: what to secure, and when</text>
<text x="90" y="128" text-anchor="start" font-size="18" fill="#5C6B6B">事件</text>
<line x1="90" y1="262" x2="1556" y2="262" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="90" y="142" width="330" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="255" y="189" text-anchor="middle" font-size="20" fill="#102A2B">原定出發時間</text>
<line x1="255" y1="218" x2="255" y2="253" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt"/>
<circle cx="255" cy="262" r="9" fill="#0D6B68"/>
<line x1="255" y1="271" x2="255" y2="320" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt"/>
<rect x="460" y="142" width="330" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="625" y="189" text-anchor="middle" font-size="20" fill="#102A2B">延誤達條款門檻</text>
<line x1="625" y1="218" x2="625" y2="253" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt"/>
<circle cx="625" cy="262" r="9" fill="#0D6B68"/>
<line x1="625" y1="271" x2="625" y2="320" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt"/>
<rect x="830" y="142" width="330" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="995" y="189" text-anchor="middle" font-size="20" fill="#102A2B">抵達目的地</text>
<line x1="995" y1="218" x2="995" y2="253" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt"/>
<circle cx="995" cy="262" r="9" fill="#0D6B68"/>
<line x1="995" y1="271" x2="995" y2="320" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt"/>
<rect x="1200" y="142" width="330" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1365" y="189" text-anchor="middle" font-size="20" fill="#102A2B">託運行李未送達</text>
<line x1="1365" y1="218" x2="1365" y2="253" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt"/>
<circle cx="1365" cy="262" r="9" fill="#0D6B68"/>
<line x1="1365" y1="271" x2="1365" y2="320" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt"/>
<text x="90" y="304" text-anchor="start" font-size="18" fill="#5C6B6B">當下要拿到的文件</text>
<rect x="90" y="320" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="255" y="371" text-anchor="middle" font-size="19" fill="#102A2B" font-weight="bold">登機證與行程證明</text>
<text x="255" y="405" text-anchor="middle" font-size="18" fill="#102A2B">訂位與改票紀錄</text>
<text x="255" y="439" text-anchor="middle" font-size="18" fill="#5C6B6B">證明原定出發時間</text>
<rect x="460" y="320" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="625" y="371" text-anchor="middle" font-size="19" fill="#102A2B" font-weight="bold">航空業者的延誤證明</text>
<text x="625" y="405" text-anchor="middle" font-size="18" fill="#102A2B">載明班次與實際時間</text>
<text x="625" y="439" text-anchor="middle" font-size="18" fill="#5C6B6B">補償收據不算</text>
<rect x="830" y="320" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="995" y="371" text-anchor="middle" font-size="19" fill="#102A2B" font-weight="bold">膳食住宿交通收據正本</text>
<text x="995" y="405" text-anchor="middle" font-size="18" fill="#102A2B">看得出品項與日期</text>
<text x="995" y="439" text-anchor="middle" font-size="18" fill="#5C6B6B">實支實付型靠它計算</text>
<rect x="1200" y="320" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1365" y="371" text-anchor="middle" font-size="19" fill="#102A2B" font-weight="bold">行李事故報告</text>
<text x="1365" y="405" text-anchor="middle" font-size="18" fill="#102A2B">託運行李領取單</text>
<text x="1365" y="439" text-anchor="middle" font-size="18" fill="#5C6B6B">應急採買收據正本</text>
<rect x="90" y="580" width="690" height="140" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="435" y="624" text-anchor="middle" font-size="22" fill="#D97A2B" font-weight="bold">定額型</text>
<text x="435" y="660" text-anchor="middle" font-size="18" fill="#102A2B">只要證明事故成立：延誤達條款約定的門檻</text>
<text x="435" y="692" text-anchor="middle" font-size="18" fill="#5C6B6B">不看你實際花了多少</text>
<rect x="840" y="580" width="690" height="140" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1185" y="624" text-anchor="middle" font-size="22" fill="#2E7D5B" font-weight="bold">實支實付型</text>
<text x="1185" y="660" text-anchor="middle" font-size="18" fill="#102A2B">還要證明每一筆費用：收據正本、品項與日期</text>
<text x="1185" y="692" text-anchor="middle" font-size="18" fill="#5C6B6B">並受保險單所載限額拘束</text>
<text x="90" y="780" text-anchor="start" font-size="17" fill="#5C6B6B">門檻時數由條款約定，各家不同；延誤期間自預定出發之時起算，不是自你到機場起算。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
