<title id="title">行程被打斷的那一刻 / A break in the journey</title>
<desc id="desc">一條橫向的虛線由左往右穿過畫面上方，在正中央斷開；斷口處放著一個圓形時鐘，指針指著兩個不同方向。畫面下半並排兩件物品：左邊是一只立著的行李箱，有提把、兩個扣環與一張掛在提把上的行李吊牌；右邊是一張立起來的收據，上面有幾條橫線，下緣是鋸齒狀。兩件物品下方有一條淡色的地平線。整張圖用米色底，青綠與藍色的線條，沒有任何文字。</desc>
