  <text x="1530" y="316" font-size="15" font-weight="700" fill="#102A2B" text-anchor="end">송정 松亭 Songjeong</text>
  <text x="1585" y="540" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">スカイカプセル 尾浦↔青沙浦 約30分 · 海岸列車で松亭へ</text>

