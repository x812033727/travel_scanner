  <text x="380" y="150" font-size="18" font-weight="700" fill="#B8442D">空港リムジン 海雲台線 9,500ウォン · 約1時間 · 07:10–21:40 空港発</text>

  <!-- airport, light rail, line 2 -->
  <rect x="45" y="250" width="235" height="90" rx="22" fill="#0D6B68"/>
  <text x="162" y="288" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">김해공항 金海空港</text>
  <text x="162" y="318" font-size="17" fill="#E6F2F1" text-anchor="middle">Gimhae Airport · PUS</text>
  <line x1="280" y1="295" x2="395" y2="295" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <text x="338" y="278" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">軽電鉄 6分</text>
  <line x1="395" y1="295" x2="510" y2="295" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
  <text x="452" y="278" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">2号線 8駅</text>
