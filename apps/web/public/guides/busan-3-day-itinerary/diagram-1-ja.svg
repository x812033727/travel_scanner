<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Hiragino Sans','Noto Sans KR',system-ui,sans-serif">
  <title id="title">釜山2泊3日モデルコース エリア別ルート図 / Busan three-day itinerary by area</title>
  <desc id="desc">簡略化した釜山のエリア模式図（正確な縮尺ではありません）。左端の金海空港からは軽電鉄で6分の沙上駅に出て、2号線で8駅の西面へアクセス可能。空港リムジンバス海雲台線は9,500ウォン・約1時間（07:10–21:40空港発）で海雲台へ直行します。Day 1は海雲台と広安里（広安大橋の夜景）。Day 2は甘川文化村（土城駅6番出口からマウルバス沙下1-1・西区2・2-2、3–10月は09:00–18:00）と南浦洞のチャガルチ市場・BIFF広場・龍頭山公園。Day 3午前は松島海上ケーブルカー（往復19,000ウォン〜）または機張の海東龍宮寺（04:30–19:20・無料）、午後はBlueline Parkで尾浦からスカイカプセル約30分で青沙浦へ、海岸列車で松亭まで結ぶルートです。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <path d="M 0 840 C 250 810, 450 830, 700 750 C 900 680, 1020 630, 1150 590 C 1300 540, 1450 420, 1600 300 L 1600 900 L 0 900 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1450" y="640" font-size="18" font-weight="700" fill="#3F6C7A">바다 海 Sea</text>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">釜山2泊3日　1日1方面、海辺は朝晩にゆったり</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Busan in three days · イメージ図（非縮尺）· 料金・時間は2026年9月公式サイト確認</text>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  </defs>

