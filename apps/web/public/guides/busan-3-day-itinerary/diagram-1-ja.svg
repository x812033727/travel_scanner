  <circle cx="1260" cy="148" r="26" fill="#2E7D5B"/><text x="1260" y="154" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1415" y="188" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">기장 機張 · 해동용궁사</text>
  <text x="1415" y="214" font-size="15" fill="#5C6B6B" text-anchor="middle">海東龍宮寺 04:30–19:20 · 無料</text>
  <text x="1415" y="237" font-size="15" fill="#5C6B6B" text-anchor="middle">プランB · 海雲台からバス</text>
  <path d="M 1210 398 C 1235 330, 1265 300, 1300 254" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
  <text x="1268" y="325" font-size="15" font-weight="700" fill="#2E7D5B">バス</text>

  <!-- Gwangalli: Day 1 night -->
  <rect x="815" y="596" width="290" height="102" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="815" cy="596" r="26" fill="#2F6F9F"/><text x="815" y="602" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
