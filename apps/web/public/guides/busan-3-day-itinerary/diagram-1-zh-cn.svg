  <rect x="510" y="250" width="265" height="90" rx="22" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
  <text x="642" y="288" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">서면 西面 Seomyeon</text>
  <text x="642" y="318" font-size="15" fill="#5C6B6B" text-anchor="middle">住宿与换乘枢纽 · 1、2 号线</text>

