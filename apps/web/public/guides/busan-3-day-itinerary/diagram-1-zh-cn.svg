<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans KR',system-ui,sans-serif">
  <title id="title">釜山三天两夜行程分区示意图 / Busan three-day itinerary by area</title>
  <desc id="desc">简化的釜山示意地图，非精确比例。左侧为金海机场：乘轻轨 6 分钟到沙上，换乘 2 号线 8 站到西面（从西面乘 2 号线 16 站经广安、Centum City 可达海云台，乘 1 号线 8 站可达南浦洞）；机场大巴海云台线 9,500 韩元，07:10–21:40 从机场发车，约 1 小时直达海云台。Day 1 海云台与广安里（乘 2 号线 6 站到广安站看广安大桥夜景）；Day 2 甘川文化村（土城站 6 号出口换乘社区巴士沙下 1-1、西区 2 或 2-2，3–10 月 09:00–18:00 免费开放）与南浦洞的札嘎其市场、BIFF 广场、龙头山；Day 3 上午松岛海上缆车（往返 19,000 韩元起）或机张的海东龙宫寺（04:30–19:20、免费），下午到 Blueline Park 从米浦乘天空胶囊约 30 分钟到青沙浦，再乘海岸列车到松亭。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <path d="M 0 840 C 250 810, 450 830, 700 750 C 900 680, 1020 630, 1150 590 C 1300 540, 1450 420, 1600 300 L 1600 900 L 0 900 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1470" y="640" font-size="18" font-weight="700" fill="#3F6C7A">바다 海 Sea</text>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">釜山三天两夜　一天一个方向，海边留给早晚</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Busan in three days · 示意图，非精确比例 · 票价与时间 2026 年 9 月依官网查证</text>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  </defs>

  <!-- airport limousine to Haeundae -->
