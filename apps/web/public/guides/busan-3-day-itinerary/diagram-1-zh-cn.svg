  <rect x="490" y="470" width="275" height="112" rx="22" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="490" cy="470" r="28" fill="#B8442D"/><text x="490" y="477" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 2</text>
  <text x="627" y="514" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">남포동 南浦洞 Nampo</text>
  <text x="627" y="540" font-size="15" fill="#5C6B6B" text-anchor="middle">札嘎其市场 · BIFF 广场 · 龙头山</text>
  <text x="627" y="564" font-size="15" fill="#5C6B6B" text-anchor="middle">1 号线 札嘎其站／南浦站</text>

