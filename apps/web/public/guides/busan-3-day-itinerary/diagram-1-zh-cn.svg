  <text x="257" y="600" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">감천문화마을 甘川文化村</text>
  <text x="257" y="625" font-size="15" fill="#5C6B6B" text-anchor="middle">09:00–18:00（3–10 月）· 免费</text>
  <text x="257" y="648" font-size="15" fill="#5C6B6B" text-anchor="middle">土城站 6 号出口换乘社区巴士</text>
  <path d="M 488 540 C 464 560, 440 576, 419 590" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
