  <path d="M 1345 470 L 1390 458 L 1468 400 L 1545 330" fill="none" stroke="#0D6B68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1390" cy="458" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <circle cx="1468" cy="400" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <circle cx="1545" cy="330" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <text x="1404" y="480" font-size="15" font-weight="700" fill="#102A2B">미포 米浦</text>
  <text x="1483" y="414" font-size="15" font-weight="700" fill="#102A2B">청사포 青沙浦</text>
  <text x="1532" y="316" font-size="15" font-weight="700" fill="#102A2B" text-anchor="end">송정 松亭 Songjeong</text>
  <text x="1572" y="542" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">天空胶囊 米浦↔青沙浦 约 30 分钟 · 海岸列车到松亭</text>

  <!-- Gijang / Yonggungsa: Day 3 option B -->
  <rect x="1280" y="150" width="285" height="102" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="1280" cy="150" r="28" fill="#2E7D5B"/><text x="1280" y="157" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1422" y="191" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">기장 机张 · 해동용궁사</text>
  <text x="1422" y="217" font-size="15" fill="#5C6B6B" text-anchor="middle">海东龙宫寺 04:30–19:20 · 免费</text>
  <text x="1422" y="240" font-size="15" fill="#5C6B6B" text-anchor="middle">方案 B · 从海云台换乘公交车</text>
  <path d="M 1210 398 C 1240 330, 1270 300, 1310 254" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
  <text x="1282" y="328" font-size="15" fill="#2E7D5B">公交车</text>

  <!-- Gwangalli: Day 1 night -->
  <rect x="805" y="582" width="285" height="102" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="805" cy="582" r="28" fill="#2F6F9F"/><text x="805" y="589" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <text x="947" y="627" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">광안리 广安里 Gwangalli</text>
  <text x="947" y="656" font-size="15" fill="#5C6B6B" text-anchor="middle">广安大桥夜景 · 2 号线 广安站</text>
  <path d="M 1150 516 C 1135 562, 1118 584, 1094 602" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowBlue)"/>
  <text x="1156" y="568" font-size="15" fill="#2F6F9F">2 号线 6 站</text>

