  <rect x="1055" y="400" width="290" height="114" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="1055" cy="400" r="28" fill="#2F6F9F"/><text x="1055" y="407" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <circle cx="1345" cy="400" r="28" fill="#2E7D5B"/><text x="1345" y="407" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1200" y="446" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">해운대 海云台 Haeundae</text>
  <text x="1200" y="473" font-size="15" fill="#5C6B6B" text-anchor="middle">Day 1 傍晚沙滩、冬柏岛</text>
  <text x="1200" y="497" font-size="15" fill="#5C6B6B" text-anchor="middle">Day 3 下午 Blueline Park</text>

