  <path d="M 555 584 C 500 650, 445 692, 399 726" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
  <text x="515" y="674" font-size="15" fill="#2E7D5B">公交车或出租车</text>

