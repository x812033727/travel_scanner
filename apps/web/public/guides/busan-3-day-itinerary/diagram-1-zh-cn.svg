  <text x="415" y="148" font-size="18" font-weight="700" fill="#B8442D">机场大巴 海云台线 9,500 韩元 · 约 1 小时 · 07:10–21:40 从机场发车</text>

  <!-- airport, light rail, line 2 -->
  <rect x="50" y="250" width="235" height="90" rx="22" fill="#0D6B68"/>
  <text x="167" y="288" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">김해공항 金海机场</text>
  <text x="167" y="318" font-size="17" fill="#E6F2F1" text-anchor="middle">Gimhae Airport · PUS</text>
  <line x1="285" y1="295" x2="398" y2="295" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <text x="342" y="274" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">轻轨 6 分钟</text>
  <line x1="398" y1="295" x2="510" y2="295" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
  <text x="454" y="274" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">2 号线 8 站</text>
  <circle cx="398" cy="295" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="398" y="336" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">사상 沙上 Sasang</text>

