  <rect x="90" y="720" width="305" height="102" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="90" cy="720" r="28" fill="#2E7D5B"/><text x="90" y="727" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="242" y="759" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">송도 松岛 Songdo</text>
