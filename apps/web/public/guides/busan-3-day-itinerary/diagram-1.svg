  <text x="310" y="622" font-size="15" fill="#5C6B6B" text-anchor="middle">09:00–18:00（3–10 月）· 免費</text>
  <text x="310" y="645" font-size="15" fill="#5C6B6B" text-anchor="middle">土城站 6 號出口轉社區巴士</text>
