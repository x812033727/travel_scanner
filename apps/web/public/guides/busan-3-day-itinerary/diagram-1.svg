  <rect x="500" y="470" width="250" height="110" rx="22" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <circle cx="500" cy="470" r="26" fill="#B8442D"/><text x="500" y="477" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 2</text>
  <text x="625" y="510" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">남포동 南浦洞 Nampo</text>
  <text x="625" y="536" font-size="15" fill="#5C6B6B" text-anchor="middle">札嘎其市場 · BIFF 廣場 · 龍頭山</text>
  <text x="625" y="560" font-size="15" fill="#5C6B6B" text-anchor="middle">1 號線 札嘎其站／南浦站</text>

