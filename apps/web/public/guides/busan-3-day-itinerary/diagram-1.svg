  <text x="1590" y="535" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">天空膠囊 米浦↔青沙浦 約 30 分 · 海岸列車到松亭</text>

  <!-- Gijang / Yonggungsa: Day 3 option B -->
  <rect x="1290" y="150" width="270" height="100" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="1290" cy="150" r="26" fill="#2E7D5B"/><text x="1290" y="157" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="1425" y="190" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">기장 機張 · 해동용궁사</text>
  <text x="1425" y="216" font-size="15" fill="#5C6B6B" text-anchor="middle">海東龍宮寺 04:30–19:20 · 免費</text>
  <text x="1425" y="238" font-size="15" fill="#5C6B6B" text-anchor="middle">方案 B · 從海雲台轉公車</text>
  <path d="M 1210 398 C 1240 330, 1270 300, 1310 252" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
  <text x="1262" y="318" font-size="15" fill="#2E7D5B">公車</text>

  <!-- Gwangalli: Day 1 night -->
  <rect x="800" y="580" width="230" height="100" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="800" cy="580" r="26" fill="#2F6F9F"/><text x="800" y="587" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 1</text>
  <text x="915" y="620" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">광안리 廣安里 Gwangalli</text>
  <text x="915" y="648" font-size="15" fill="#5C6B6B" text-anchor="middle">廣安大橋夜景 · 2 號線 廣安站</text>
  <path d="M 1120 512 C 1100 560, 1070 580, 1034 600" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowBlue)"/>
  <text x="1140" y="560" font-size="15" fill="#2F6F9F">2 號線 6 站</text>

