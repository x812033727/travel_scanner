  <text x="430" y="150" font-size="18" font-weight="700" fill="#B8442D">利木津 海雲台線 9,500 韓元 · 約 1 小時 · 07:10–21:40 從機場發車</text>

  <!-- airport, light rail, line 2 -->
  <rect x="60" y="250" width="220" height="90" rx="22" fill="#0D6B68"/>
  <text x="170" y="288" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">김해공항 金海機場</text>
  <text x="170" y="318" font-size="17" fill="#E6F2F1" text-anchor="middle">Gimhae Airport · PUS</text>
  <line x1="280" y1="295" x2="400" y2="295" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <text x="340" y="280" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">輕軌 6 分</text>
  <line x1="400" y1="295" x2="520" y2="295" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"/>
  <text x="460" y="280" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">2 號線 8 站</text>
  <circle cx="400" cy="295" r="13" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <text x="400" y="332" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">사상 沙上 Sasang</text>

