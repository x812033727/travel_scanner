  <text x="240" y="784" font-size="15" fill="#5C6B6B" text-anchor="middle">海上纜車 往返 19,000 韓元起</text>
  <text x="240" y="806" font-size="15" fill="#5C6B6B" text-anchor="middle">方案 A · 從南浦洞搭公車或計程車</text>
