<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">釜山三天兩夜行程分區示意圖 / Busan three-day itinerary by area</title>
  <desc id="desc">簡化的釜山示意地圖，非精確比例。左側是金海機場：輕軌 6 分鐘到沙上，轉 2 號線 8 站到西面；利木津海雲台線 9,500 韓元約 1 小時直達海雲台。Day 1 海雲台與廣安里（廣安大橋夜景）；Day 2 甘川文化村（土城站 6 號出口轉社區巴士，3 到 10 月 09:00 到 18:00）與南浦洞的札嘎其市場、BIFF 廣場、龍頭山；Day 3 上午松島海上纜車（往返 19,000 韓元起）或機張的海東龍宮寺（04:30 到 19:20、免費），下午 Blueline Park 從米浦搭天空膠囊約 30 分到青沙浦、海岸列車到松亭。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <path d="M 0 840 C 250 810, 450 830, 700 750 C 900 680, 1020 630, 1150 590 C 1300 540, 1450 420, 1600 300 L 1600 900 L 0 900 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1470" y="640" font-size="18" font-weight="700" fill="#3F6C7A">바다 海 Sea</text>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">釜山三天兩夜　一天一個方向，海邊留給早晚</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Busan in three days · 示意圖，非精確比例 · 票價與時間 2026 年 9 月依官網查證</text>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D5B"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  </defs>

  <!-- airport limousine to Haeundae -->
