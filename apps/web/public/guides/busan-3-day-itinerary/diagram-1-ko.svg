  <circle cx="1385" cy="458" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <circle cx="1465" cy="400" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
