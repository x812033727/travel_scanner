<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">부산 2박 3일 권역별 동선 안내도 / Busan 3-day itinerary by area</title>
  <desc id="desc">실제 축척이 아닌 부산 주요 권역 약도예요. 왼쪽 김해국제공항에서 부산김해경전철로 6분이면 사상역에 닿고 2호선으로 갈아타면 서면까지 8정거장, 서면에서 해운대까지는 2호선 16정거장(광안·센텀시티 경유), 서면에서 남포동까지는 1호선 8정거장이에요. 공항 리무진 해운대 노선은 9,500원으로 약 1시간 만에 해운대까지 직통으로 연결하며 07:10–21:40에 공항에서 출발해요. Day 1은 해운대와 광안리(해운대역에서 2호선 6정거장, 광안대교 야경), Day 2는 감천문화마을(토성역 6번 출구에서 마을버스 사하 1-1·서구 2·2-2 환승, 3–10월 09:00–18:00, 무료)과 남포동의 자갈치시장·BIFF 광장·용두산공원, Day 3은 오전에 송도해상케이블카(왕복 19,000원부터) 또는 기장 해동용궁사(04:30–19:20, 무료)를 보고 오후에 해운대 블루라인파크 미포에서 청사포까지 스카이캡슐(약 30분)과 송정까지 이어지는 해변열차를 타는 코스예요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <path d="M 0 840 C 250 810, 450 830, 700 750 C 900 680, 1020 630, 1150 590 C 1300 540, 1450 420, 1600 300 L 1600 900 L 0 900 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1465" y="660" font-size="18" font-weight="700" fill="#3F6C7A">바다 · Sea</text>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#102A2B">부산 2박 3일: 하루 한 권역씩, 바다는 아침저녁으로</text>
  <text x="60" y="100" font-size="19" fill="#5C6B6B">Busan in 3 days · 약도(실제 축척 아님) · 요금·운영시간 2026년 9월 공식 홈페이지 기준</text>
