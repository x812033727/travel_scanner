  <text x="1572" y="544" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">스카이캡슐 미포↔청사포 약 30분</text>
  <text x="1572" y="568" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">해변열차 송정까지 연결</text>

