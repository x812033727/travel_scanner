  <text x="232" y="600" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">감천문화마을 Gamcheon</text>
  <text x="232" y="626" font-size="15" fill="#5C6B6B" text-anchor="middle">09:00–18:00 (Mar–Oct) · Free</text>
  <text x="232" y="649" font-size="15" fill="#5C6B6B" text-anchor="middle">Toseong Stn. Exit 6 → Village Bus</text>
  <path d="M 458 544 C 440 562, 424 576, 404 590" fill="none" stroke="#B8442D" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <text x="430" y="528" font-size="15" font-weight="700" fill="#B8442D" text-anchor="end">Village Bus Saha 1-1 / Seogu 2, 2-2</text>

  <!-- Songdo: Day 3 option A -->
  <rect x="70" y="715" width="340" height="104" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <circle cx="70" cy="715" r="30" fill="#2E7D5B"/><text x="70" y="720" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 3</text>
  <text x="240" y="755" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">송도 Songdo</text>
  <text x="240" y="781" font-size="15" fill="#5C6B6B" text-anchor="middle">Cable Car from KRW 19,000 round-trip</text>
  <text x="240" y="804" font-size="15" fill="#5C6B6B" text-anchor="middle">Option A · Bus or Taxi from Nampo</text>
  <path d="M 555 584 C 500 648, 435 688, 375 714" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowGreen)"/>
  <text x="506" y="668" font-size="15" font-weight="700" fill="#2E7D5B">Bus or Taxi</text>

