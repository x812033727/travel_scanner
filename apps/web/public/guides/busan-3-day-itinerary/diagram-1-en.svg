    <line x1="330" y1="860" x2="375" y2="860" stroke="#0D6B68" stroke-width="8" stroke-linecap="round"/><text x="385" y="866" font-size="16">Light Rail · Blueline Park</text>
    <line x1="600" y1="860" x2="645" y2="860" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round"/><text x="655" y="866" font-size="16">Metro Line 2</text>
    <line x1="790" y1="860" x2="835" y2="860" stroke="#D97A2B" stroke-width="8" stroke-linecap="round"/><text x="845" y="866" font-size="16">Metro Line 1</text>
    <line x1="980" y1="860" x2="1025" y2="860" stroke="#B8442D" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><text x="1035" y="866" font-size="16">Bus · Taxi</text>
