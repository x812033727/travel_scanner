<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">要保人、被保險人、受益人的關係與三種常見組合 / Policyholder, insured and beneficiary</title>
<desc id="desc">圖解分成上下兩段。上段畫錢與風險的方向：左邊是要保人，對保險標的有保險利益、負交付保險費義務，也是解約與質借的權利人；中間是保險人也就是保險公司，收保險費、承保風險並依條款核定保險金；右邊是受益人，約定享有賠償請求權、請求保險金。一支箭頭從要保人指向保險人標示保險費，另一支從保險人指向受益人標示保險金。中間下方是被保險人，生命或身體受保障、遭受損害，以一支向上的箭頭連到保險人並標示保險事故。左下的重點框說明要保人與被保險人不同人時，等於由第三人訂立的死亡保險契約，須經被保險人書面同意；右下的藍框說明受益人欄的兩條路，有指定則不作為遺產，未指定則作為遺產。下段並排三個同樣大小的方框，分別是自己保自己、父母保未滿十五歲子女、配偶互保，各列出該組合要先過的條文。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#5C6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">要保人、被保險人、受益人：三格的法律效果</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Policyholder, insured and beneficiary in the Insurance Act</text>

<text x="60" y="122" font-size="20" font-weight="700" fill="#0D6B68">錢與風險的方向</text>

<rect x="60" y="150" width="380" height="160" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="250" y="190" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">要保人</text>
<text x="250" y="224" font-size="17" text-anchor="middle" fill="#102A2B">對保險標的有保險利益</text>
<text x="250" y="254" font-size="17" text-anchor="middle" fill="#102A2B">負交付保險費義務（第 3 條）</text>
<text x="250" y="284" font-size="17" text-anchor="middle" fill="#5C6B6B">解約、質借的權利人</text>

<rect x="610" y="150" width="380" height="160" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="800" y="190" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">保險人（保險公司）</text>
<text x="800" y="224" font-size="17" text-anchor="middle" fill="#102A2B">收保險費、承保風險</text>
<text x="800" y="254" font-size="17" text-anchor="middle" fill="#5C6B6B">依條款核定保險金</text>

<rect x="1160" y="150" width="380" height="160" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1350" y="190" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">受益人</text>
<text x="1350" y="224" font-size="17" text-anchor="middle" fill="#102A2B">約定享有賠償請求權</text>
<text x="1350" y="254" font-size="17" text-anchor="middle" fill="#102A2B">請求保險金（第 5 條）</text>

<line x1="452" y1="230" x2="596" y2="230" stroke="#5C6B6B" stroke-width="6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="524" y="212" font-size="17" text-anchor="middle" fill="#102A2B">保險費</text>
<line x1="1002" y1="230" x2="1146" y2="230" stroke="#5C6B6B" stroke-width="6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="1074" y="212" font-size="17" text-anchor="middle" fill="#102A2B">保險金</text>

<line x1="800" y1="372" x2="800" y2="318" stroke="#5C6B6B" stroke-width="6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="818" y="352" font-size="17" text-anchor="start" fill="#5C6B6B">保險事故</text>

<rect x="610" y="380" width="380" height="130" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="800" y="420" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">被保險人</text>
<text x="800" y="454" font-size="17" text-anchor="middle" fill="#102A2B">生命或身體受保障</text>
<text x="800" y="484" font-size="17" text-anchor="middle" fill="#102A2B">遭受損害（第 4 條）</text>

<rect x="60" y="380" width="380" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="250" y="418" font-size="17" font-weight="700" text-anchor="middle" fill="#102A2B">要保人與被保險人不同人</text>
<text x="250" y="452" font-size="17" text-anchor="middle" fill="#102A2B">等於由第三人訂立的契約</text>
<text x="250" y="484" font-size="17" text-anchor="middle" fill="#102A2B">須書面同意（第 105 條）</text>

<rect x="1160" y="380" width="380" height="130" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1350" y="418" font-size="17" font-weight="700" text-anchor="middle" fill="#102A2B">受益人欄的兩條路</text>
<text x="1350" y="452" font-size="17" text-anchor="middle" fill="#102A2B">有指定：不作為遺產（第 112 條）</text>
<text x="1350" y="484" font-size="17" text-anchor="middle" fill="#B8442D">未指定：作為遺產（第 113 條）</text>

<text x="60" y="560" font-size="20" font-weight="700" fill="#0D6B68">三種常見組合</text>

<rect x="60" y="590" width="460" height="210" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="290" y="630" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">自己保自己</text>
<text x="290" y="668" font-size="17" text-anchor="middle" fill="#102A2B">要保人就是被保險人</text>
<text x="290" y="702" font-size="17" text-anchor="middle" fill="#102A2B">不是由第三人訂立</text>
<text x="290" y="736" font-size="17" text-anchor="middle" fill="#102A2B">沒有第 105 條同意問題</text>
<text x="290" y="770" font-size="17" text-anchor="middle" fill="#5C6B6B">受益人仍要另行指定</text>

<rect x="570" y="590" width="460" height="210" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="800" y="630" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">父母保未滿十五歲子女</text>
<text x="800" y="668" font-size="17" text-anchor="middle" fill="#102A2B">第 16 條第 1 款：家屬</text>
<text x="800" y="702" font-size="17" text-anchor="middle" fill="#102A2B">第 107 條：死亡給付遞延</text>
<text x="800" y="736" font-size="17" text-anchor="middle" fill="#102A2B">滿十五歲前僅喪葬費用保險金</text>
<text x="800" y="770" font-size="17" text-anchor="middle" fill="#B8442D">上限 69 萬元，跨公司合計</text>

<rect x="1080" y="590" width="460" height="210" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="1310" y="630" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">配偶互保</text>
<text x="1310" y="668" font-size="17" text-anchor="middle" fill="#102A2B">第 16 條第 1 款：家屬</text>
<text x="1310" y="702" font-size="17" text-anchor="middle" fill="#102A2B">屬由第三人訂立的契約</text>
<text x="1310" y="736" font-size="17" text-anchor="middle" fill="#102A2B">須依第 105 條書面同意</text>
<text x="1310" y="770" font-size="17" text-anchor="middle" fill="#5C6B6B">同意得隨時書面撤銷</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
