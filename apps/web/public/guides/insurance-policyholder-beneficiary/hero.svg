<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一張表單上三個同樣大小的欄位與一枚印章 / Three equal fields on one form with a seal</title>
<desc id="desc">插圖。畫面中央是一張白底、圓角的表單，表單上緣有一條橫線代表標題欄。表單裡並排三個同樣大小的圓角方框，彼此以短線相連，每個方框裡是一個沒有五官的圓形頭部與一道肩線，代表要保人、被保險人與受益人三種身分；三個方框大小完全相同，只有邊框顏色不同，分別是深綠、藍與橘。方框下方是一行字「三格，三種法律效果」，再下方是兩條代表簽名欄的橫線。表單右下角有一枚紅色圓形印章外框，中間是一個空心的圓角方塊。圖上沒有任何機構標誌、商品名稱、人臉、金額或曲線。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<rect x="300" y="130" width="1000" height="600" rx="28" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="6"/>
<line x1="360" y1="196" x2="820" y2="196" stroke="#102A2B" stroke-width="12" stroke-linecap="butt"/>
