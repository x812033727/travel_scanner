<line x1="900" y1="380" x2="970" y2="380" stroke="#5C6B6B" stroke-width="8" stroke-linecap="butt"/>

<rect x="430" y="280" width="200" height="200" rx="20" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7"/>
<circle cx="530" cy="352" r="32" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/>
<path d="M 480 438 C 480 392, 580 392, 580 438" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linecap="butt"/>

<rect x="700" y="280" width="200" height="200" rx="20" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7"/>
