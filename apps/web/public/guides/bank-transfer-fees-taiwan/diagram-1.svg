<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一筆轉帳的費用從哪裡來 / Where a transfer fee comes from</title>
<desc id="desc">由上往下的決策圖。最上面的問題是「收付雙方是同一家金融機構嗎」，往下分成兩個框：左邊是同行轉帳，不同分行也算同一家機構，錢在同一家的帳上移動，沒有跨行清算那一段；右邊是跨行轉帳，收款帳戶在另一家銀行、信用合作社或農漁會信用部，要經跨行金融資訊系統清算，費用含銀行付出去的那一段。兩個框再一起往下接到第二個問題「這一筆走哪一個通路」，下面並排四個框：臨櫃是櫃員時間、填單與身分確認，單位成本最高；實體 ATM 是機器布建、維護與現金作業；網路 ATM 要有卡片讀卡機，提供除現金提存外的功能；網路銀行與行動銀行是純系統處理，沒有機器也沒有櫃員。最下方註明免費次數與減免條件由各銀行自訂，以各銀行公告的服務費用標準為準。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一筆轉帳的費用從哪裡來</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Where a transfer fee comes from</text>

<rect x="300" y="112" width="1000" height="70" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
<text x="800" y="156" font-size="24" font-weight="700" text-anchor="middle" fill="#102A2B">先問：收付雙方是同一家金融機構嗎</text>

<path d="M 560 182 L 442 226" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<path d="M 1040 182 L 1158 226" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>

<rect x="120" y="236" width="620" height="176" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="430" y="280" font-size="22" font-weight="700" text-anchor="middle" fill="#102A2B">是：同行轉帳</text>
<text x="430" y="318" font-size="17" text-anchor="middle" fill="#102A2B">不同分行也算同一家機構</text>
<text x="430" y="350" font-size="17" text-anchor="middle" fill="#102A2B">錢在同一家的帳上移動</text>
<text x="430" y="382" font-size="17" font-weight="700" text-anchor="middle" fill="#0D6B68">沒有跨行清算那一段</text>

<rect x="860" y="236" width="620" height="176" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1170" y="280" font-size="22" font-weight="700" text-anchor="middle" fill="#102A2B">否：跨行轉帳</text>
<text x="1170" y="318" font-size="17" text-anchor="middle" fill="#102A2B">另一家銀行、信用合作社、農漁會信用部</text>
<text x="1170" y="350" font-size="17" text-anchor="middle" fill="#102A2B">經跨行金融資訊系統清算</text>
<text x="1170" y="382" font-size="17" font-weight="700" text-anchor="middle" fill="#2F6F9F">費用含銀行付出去的那一段</text>

<path d="M 430 412 L 548 456" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<path d="M 1170 412 L 1052 456" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>

<rect x="300" y="462" width="1000" height="66" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
<text x="800" y="504" font-size="24" font-weight="700" text-anchor="middle" fill="#102A2B">再問：這一筆走哪一個通路</text>

<path d="M 800 528 L 800 566" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none"/>
<path d="M 215 566 L 1385 566" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none"/>
<path d="M 215 566 L 215 608" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<path d="M 605 566 L 605 608" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<path d="M 995 566 L 995 608" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<path d="M 1385 566 L 1385 608" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>

<rect x="60" y="614" width="310" height="168" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="215" y="658" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">臨櫃</text>
<text x="215" y="696" font-size="17" text-anchor="middle" fill="#102A2B">櫃員時間</text>
<text x="215" y="726" font-size="17" text-anchor="middle" fill="#102A2B">填單與身分確認</text>
<text x="215" y="756" font-size="17" text-anchor="middle" fill="#B8442D">單位成本最高</text>

<rect x="450" y="614" width="310" height="168" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="605" y="658" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">實體 ATM</text>
<text x="605" y="700" font-size="17" text-anchor="middle" fill="#102A2B">機器布建與維護</text>
<text x="605" y="734" font-size="17" text-anchor="middle" fill="#102A2B">加上現金作業</text>

<rect x="840" y="614" width="310" height="168" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="995" y="658" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">網路 ATM</text>
<text x="995" y="700" font-size="17" text-anchor="middle" fill="#102A2B">要有卡片讀卡機</text>
<text x="995" y="734" font-size="17" text-anchor="middle" fill="#102A2B">除現金提存外的功能</text>

<rect x="1230" y="614" width="310" height="168" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1385" y="658" font-size="20" font-weight="700" text-anchor="middle" fill="#102A2B">網銀與行動銀行</text>
<text x="1385" y="700" font-size="17" text-anchor="middle" fill="#102A2B">純系統處理</text>
<text x="1385" y="734" font-size="17" font-weight="700" text-anchor="middle" fill="#2E7D5B">沒有機器也沒有櫃員</text>

<text x="60" y="830" font-size="17" fill="#5C6B6B">免費次數與減免條件由各銀行自訂，以各銀行公告的服務費用標準為準</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
