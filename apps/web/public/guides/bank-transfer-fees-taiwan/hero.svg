<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同一筆錢，兩條路 / One transfer, two routes</title>
<desc id="desc">一張簡單的插圖。畫面左邊是一個白底圓角方框，代表轉出的帳戶，框裡有三條粗的橫線像帳戶明細。方框右側分出兩條粗線：上面那條綠色的線平順地往右連到右上角另一個白底圓角方框，中間沒有經過任何東西；下面那條藍色的線先往下彎，穿過畫面中間偏下一個淺綠色的六邊形節點，節點中心有一個白色小圓，再往右連到右下角第三個白底圓角方框。畫面上方有一行字：同一筆錢，兩條路。整張圖沒有任何金融機構的標誌、人物或貨幣圖樣。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="tipb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker></defs>

