<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">海外刷卡的兩條路：當地幣別與新臺幣 / Two ways an overseas card charge is converted</title>
<desc id="desc">上方是在國外結帳時刷卡機問你要用哪一種幣別，同一筆消費的差別只在換匯由誰做。往下分成兩欄。左欄是選當地幣別：由信用卡國際組織依結匯日匯率換算當地幣別的原始金額，接著是國際組織就跨國交易收取的費用，再來是發卡機構的國外交易服務費，發卡機構得選擇不收，收取者不得賺取任何差價。右欄是選新臺幣，也就是動態貨幣轉換：國外的收單方當場用自己的匯率把當地幣別換成新臺幣，這段價差不在你的發卡契約裡，匯率由對方訂；而且交易仍然發生在國外，海外那幾筆費用是否照收要看契約。最下方一格說明兩條路最後都入帳新臺幣，帳單會列出交易國家或地區、幣別、折算金額與折算日期，幣別那一欄就看得出這筆走了哪一條路。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">海外刷卡的兩條路：當地幣別與新臺幣</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Two ways an overseas card charge is converted · 差別只在換匯由誰做</text>

<rect x="400" y="118" width="800" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">在國外結帳，刷卡機問你要用哪一種幣別</text>
<text x="800" y="194" text-anchor="middle" font-size="17" fill="#5C6B6B">同一筆消費，差別在換匯由誰做</text>

<path d="M 640 218 L 450 266" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M 960 218 L 1150 266" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="110" y="276" width="620" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">選當地幣別</text>
<rect x="870" y="276" width="620" height="76" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1180" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">選新臺幣，就是 DCC</text>

<rect x="110" y="370" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">國際組織依結匯日匯率換算</text>
<text x="420" y="450" text-anchor="middle" font-size="17" fill="#5C6B6B">換的是當地幣別的原始金額</text>

<rect x="110" y="490" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="534" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">國際組織的跨國交易費用</text>
<text x="420" y="570" text-anchor="middle" font-size="17" fill="#5C6B6B">依其公告的規範計收</text>

<rect x="110" y="610" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="420" y="654" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">發卡機構的國外交易服務費</text>
<text x="420" y="690" text-anchor="middle" font-size="17" fill="#5C6B6B">得不收；不得賺取任何差價</text>

<rect x="870" y="370" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1180" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">收單方當場用自己的匯率</text>
<text x="1180" y="450" text-anchor="middle" font-size="17" fill="#5C6B6B">把當地幣別換成新臺幣</text>

<rect x="870" y="490" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1180" y="534" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">這段價差不在你的發卡契約裡</text>
<text x="1180" y="570" text-anchor="middle" font-size="17" fill="#5C6B6B">匯率由對方訂</text>

<rect x="870" y="610" width="620" height="106" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1180" y="654" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">交易仍然發生在國外</text>
<text x="1180" y="690" text-anchor="middle" font-size="17" fill="#5C6B6B">海外那幾筆費用是否照收，看契約</text>

<path d="M 420 720 L 420 754" fill="none" stroke="#0D6B68" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrowTeal)"/>
<path d="M 1180 720 L 1180 754" fill="none" stroke="#D97A2B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrowOrange)"/>

<rect x="110" y="758" width="1380" height="84" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="794" text-anchor="middle" font-size="18" font-weight="700" fill="#102A2B">兩條路最後都入帳新臺幣</text>
<text x="800" y="826" text-anchor="middle" font-size="17" fill="#5C6B6B">帳單會列出交易國家或地區、幣別、折算金額與折算日期，幣別那一欄就看得出走了哪一條</text>
