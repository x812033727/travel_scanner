<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">海外刷卡手續費與 DCC：選當地幣別還是台幣</title>
<desc id="desc">左邊是一台白色的直立刷卡機，機身上方露出一張卡片的一角，卡片上有一個橘色的晶片方塊。刷卡機的螢幕是淺綠色，裡面有兩個選項列：上面那一列是白底，左側有一個綠色的勾，右側是一條代表文字的粗線；下面那一列是米色，只有一條較短的灰線。螢幕下方是三乘三共九個圓角方塊組成的按鍵。機身右側有一條線往外延伸後岔成兩條：綠色那條往上通到一個淺綠色的方框，框裡有一枚硬幣與兩條線；橘色那條往下通到一個白色方框，框裡有兩枚部分重疊的硬幣與兩條線，代表同一筆消費多付了一層。畫面下方置中一行字寫著當地幣別還是台幣。</desc>
