<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">從起始到結尾，追蹤同一只陶杯</title>
<desc id="desc">影片驗收把同一物件連續追蹤，並另列鏡頭與聲音檢查，不只檢查單張影格</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">從起始到結尾，追蹤同一只陶杯</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Text-to-Video｜時間中的一致性</text><path d="M475 260H600" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 260H1115" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M795 340V465H540V570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M795 465H1055V570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="85" y="180" width="390" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">起始畫面</text><text x="280" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">確認外觀與圖案</text><rect x="600" y="180" width="390" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">轉動過程</text><text x="795" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">追蹤形狀與相對位置</text><rect x="1115" y="180" width="390" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">結尾畫面</text><text x="1310" y="302" text-anchor="middle" font-size="25" fill="#5C6B6B">物件身分沒有改變</text><rect x="345" y="570" width="390" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="540" y="637" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">鏡頭檢查</text><text x="540" y="687" text-anchor="middle" font-size="25" fill="#5C6B6B">物件動還是攝影機動</text><rect x="860" y="570" width="390" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1055" y="637" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">成片檢查</text><text x="1055" y="687" text-anchor="middle" font-size="25" fill="#5C6B6B">播放、聲音與銜接</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
