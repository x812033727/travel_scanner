<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">加噪用於學習，逐步更新用於生成</title>
<desc id="desc">擴散模型將訓練加噪與生成去噪分成上下兩條方向不同的流程</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">加噪用於學習，逐步更新用於生成</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Diffusion Model｜兩條流程的起點不同</text><path d="M420 228H620" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M970 228H1160" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M420 615H620" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M970 615H1160" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M1335 300V410H795V540" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="155" width="350" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="219.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">訓練圖片</text><text x="245" y="269.5" text-anchor="middle" font-size="25" fill="#5C6B6B">提供資料規律</text><rect x="620" y="155" width="350" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="219.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">加入不同雜訊</text><text x="795" y="269.5" text-anchor="middle" font-size="25" fill="#5C6B6B">建立學習材料</text><rect x="1160" y="155" width="350" height="145" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="219.5" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">更新模型</text><text x="1335" y="269.5" text-anchor="middle" font-size="25" fill="#5C6B6B">學習去噪預測</text><rect x="70" y="540" width="350" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="607" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">隨機起點</text><text x="245" y="657" text-anchor="middle" font-size="25" fill="#5C6B6B">沒有指定原圖</text><rect x="620" y="540" width="350" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="795" y="607" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">反覆預測與更新</text><text x="795" y="657" text-anchor="middle" font-size="25" fill="#5C6B6B">可接受文字條件</text><rect x="1160" y="540" width="350" height="150" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1335" y="607" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">新影像</text><text x="1335" y="657" text-anchor="middle" font-size="25" fill="#5C6B6B">仍需依用途驗收</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
