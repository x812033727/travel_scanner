<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">Taiwan&#x27;s Act: business to license</title><desc id="desc">The seven categories of business (article 6, paragraph 1), the seven kinds of service provider (article 6, paragraph 2), a license and license certificate obtained kind by kind (article 7, paragraph 1), and no business without joining the trade association (article 29, paragraph 1).</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">Taiwan&#x27;s Act: business to license</text><rect x="110" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="246" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Seven services</text><text x="430" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Listed in article 6(1)</text><rect x="850" y="180" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="246" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="271" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Seven providers</text><text x="1170" y="348" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Kinds set by article 6(2)</text><rect x="110" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/><circle cx="173" cy="566" r="23" fill="#D97A2B" stroke="none" stroke-width="6"/><text x="470" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">License by kind</text><text x="430" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Certificate under article 7(1)</text><rect x="850" y="500" width="640" height="245" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="913" cy="566" r="23" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="1210" y="591" font-size="44" font-weight="600" fill="#102A2B" text-anchor="middle">Trade association</text><text x="1170" y="668" font-size="32" font-weight="600" fill="#5C6B6B" text-anchor="middle">Article 29: join to operate</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair Illustration 2026</text>