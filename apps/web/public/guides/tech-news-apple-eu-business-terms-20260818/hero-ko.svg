<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">Apple, EU 대상 새 App 사업 조건 발표: 코어 테크놀로지 수수료 5%로, 대체 결제도 동시 사용 가능</title><desc id="desc">오리지널 일러스트: 왼쪽에 겹쳐진 문서 세 장, 화살표가 가운데의 더 큰 문서 한 장을 가리키고, 다시 화살표가 오른쪽의 원 그래프를 가리킵니다. 원 그래프 위쪽에는 전체의 20분의 1을 차지하는 작은 음영 부분이 있어 여러 조건이 하나로 합쳐진 것과 5%의 요율을 나타냅니다</desc>
