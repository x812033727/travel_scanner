<title id="title">緊急預備金要存多少：怎麼算、放哪裡、什麼時候可以動</title>
<desc id="desc">一面圓角盾牌，輪廓是深綠色的粗線，盾牌內部排著四個同樣大小的圓角方塊，左上、右上與左下三格是淺綠色的實心方塊，右下那一格是空的，只有橘色外框。一道橘色的粗弧線從盾牌右下方外側彎回來，箭頭指進那個空格，表示動用之後再把它補回去。</desc>
