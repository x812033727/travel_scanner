<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">緊急預備金的兩個變數 / Two variables of an emergency fund</title>
<desc id="desc">一個月的必要支出乘以月數，等於緊急預備金的金額。左邊的方塊是第一個數字，從一個月的紀錄倒推出來的必要支出；中間的方塊是第二個數字，也就是月數，它看的是收入多容易被取代；右邊的方塊是相乘之後的金額，每年重算一次。中間的月數往下分成兩組條件：往上加的情況包括單一收入來源、自營作業或接案、職務高度專業化、有人依賴你的收入；往下減的情況包括雙薪且兩份收入分屬不同產業、技能通用職缺多、受僱且符合條件時非自願離職有失業給付可以先接一段。圖的下方兩行說明失業給付的水準與長度，以及只有非自願離職才請領得到。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">緊急預備金的兩個變數：必要支出與月數</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Emergency fund · 金額是算出來的，不是一句口號</text>

<rect x="70" y="150" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="270" y="196" text-anchor="middle" font-size="17" fill="#5C6B6B">第一個數字</text>
<text x="270" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">一個月的必要支出</text>
<text x="270" y="288" text-anchor="middle" font-size="18" fill="#5C6B6B">從一個月的紀錄倒推</text>

<text x="495" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#5C6B6B">×</text>

<rect x="520" y="150" width="400" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="720" y="196" text-anchor="middle" font-size="17" fill="#5C6B6B">第二個數字</text>
<text x="720" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">月數</text>
<text x="720" y="288" text-anchor="middle" font-size="18" fill="#5C6B6B">看收入多容易被取代</text>

<text x="945" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#5C6B6B">＝</text>

<rect x="970" y="150" width="560" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1250" y="196" text-anchor="middle" font-size="17" fill="#5C6B6B">相乘之後</text>
<text x="1250" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#102A2B">緊急預備金的金額</text>
<text x="1250" y="288" text-anchor="middle" font-size="18" fill="#5C6B6B">每年重算一次</text>

<path d="M700 334 L510 432" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M740 334 L1030 432" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="180" y="440" width="600" height="220" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="212" y="484" font-size="20" font-weight="700" fill="#D97A2B">月數往上加</text>
<text x="212" y="522" font-size="17" fill="#102A2B">單一收入來源，一份薪水中斷就全停</text>
<text x="212" y="558" font-size="17" fill="#102A2B">自營作業、接案，沒有失業給付可接</text>
<text x="212" y="594" font-size="17" fill="#102A2B">職務高度專業化，同類職缺少</text>
<text x="212" y="630" font-size="17" fill="#102A2B">有人依賴你的收入</text>

<rect x="820" y="440" width="600" height="220" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="852" y="484" font-size="20" font-weight="700" fill="#2E7D5B">月數往下減</text>
<text x="852" y="522" font-size="17" fill="#102A2B">雙薪，兩份收入分屬不同產業</text>
<text x="852" y="558" font-size="17" fill="#102A2B">技能通用，同類職缺數量多</text>
<text x="852" y="594" font-size="17" fill="#102A2B">受僱且符合條件，非自願離職時</text>
<text x="852" y="630" font-size="17" fill="#102A2B">有失業給付可以先接一段</text>

<text x="800" y="732" text-anchor="middle" font-size="20" fill="#5C6B6B">失業給付按平均月投保薪資 60% 發給，最長 6 個月；年滿 45 歲或領有身心障礙證明者，最長 9 個月。</text>
<text x="800" y="770" text-anchor="middle" font-size="20" fill="#5C6B6B">只有非自願離職且符合條件才請領得到；自願離職與自營作業者不在其中，月數要自己補上。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
