<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 數位商品能賣去哪裡 / Where AI-made digital goods can be sold</title>
  <desc id="desc">依作品類型分成三欄。第一欄圖片與影片素材：Adobe Stock 可投稿，要勾選生成式 AI 標示、提示詞不提名人與品牌，作者分成圖片 33%；Shutterstock 與 iStock 不收 AI 作品。第二欄模板與數位下載：Gumroad 可上架，直接銷售抽 10% + 0.50 美元、Discover 市集抽 30%，只能賣自己做的成品；Etsy 要揭露用了 AI，但金流服務不支援台灣，台灣暫時不能開新店。第三欄自訂 GPT：ChatGPT 企業版的自訂 GPT 正在退場，新的 GPT 建立也會停止，轉成外掛時自訂動作不會轉移；分潤與其他方案的時程以官方公告為準。綠色代表可上架，橘色代表有限制，紅色代表不收。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">AI 數位商品能賣去哪裡</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Where AI-made digital goods can be sold</text>

  <!-- column headers -->
  <rect x="60" y="118" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="152" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">圖片與影片素材</text>
  <text x="290" y="179" font-size="16" fill="#5C6B6B" text-anchor="middle">Stock images and video</text>

  <rect x="570" y="118" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="152" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">模板與數位下載</text>
  <text x="800" y="179" font-size="16" fill="#5C6B6B" text-anchor="middle">Templates and downloads</text>

  <rect x="1080" y="118" width="460" height="76" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1310" y="152" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">自訂 GPT</text>
  <text x="1310" y="179" font-size="16" fill="#5C6B6B" text-anchor="middle">Custom GPTs</text>

  <!-- column 1: Adobe Stock -->
  <rect x="60" y="222" width="460" height="230" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="290" y="264" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Adobe Stock</text>
  <rect x="225" y="282" width="130" height="34" rx="17" fill="#2E7D5B"/>
  <text x="290" y="305" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">可投稿</text>
  <text x="290" y="356" font-size="17" fill="#102A2B" text-anchor="middle">勾選生成式 AI 標示</text>
  <text x="290" y="390" font-size="17" fill="#102A2B" text-anchor="middle">提示詞不提名人、品牌</text>
  <text x="290" y="424" font-size="17" fill="#102A2B" text-anchor="middle">作者分成：圖片 33%</text>

  <!-- column 1: Shutterstock -->
  <rect x="60" y="480" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="290" y="522" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Shutterstock</text>
  <rect x="200" y="540" width="180" height="34" rx="17" fill="#B8442D"/>
  <text x="290" y="563" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">不收 AI 作品</text>

  <!-- column 1: iStock -->
  <rect x="60" y="628" width="460" height="120" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="290" y="670" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">iStock</text>
  <rect x="200" y="688" width="180" height="34" rx="17" fill="#B8442D"/>
  <text x="290" y="711" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">不收 AI 作品</text>

  <!-- column 2: Gumroad -->
  <rect x="570" y="222" width="460" height="230" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="264" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Gumroad</text>
  <rect x="735" y="282" width="130" height="34" rx="17" fill="#2E7D5B"/>
  <text x="800" y="305" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">可上架</text>
  <text x="800" y="356" font-size="17" fill="#102A2B" text-anchor="middle">直接銷售抽 10% + 0.50 美元</text>
  <text x="800" y="390" font-size="17" fill="#102A2B" text-anchor="middle">Discover 市集抽 30%</text>
  <text x="800" y="424" font-size="17" fill="#102A2B" text-anchor="middle">只能賣自己做的成品</text>

  <!-- column 2: Etsy -->
  <rect x="570" y="480" width="460" height="268" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="548" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Etsy</text>
  <rect x="690" y="566" width="220" height="34" rx="17" fill="#D97A2B"/>
  <text x="800" y="589" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">台灣暫時不能開新店</text>
  <text x="800" y="648" font-size="17" fill="#102A2B" text-anchor="middle">要揭露用了 AI</text>
  <text x="800" y="682" font-size="17" fill="#102A2B" text-anchor="middle">金流服務不支援台灣</text>

  <!-- column 3: GPT Store -->
  <rect x="1080" y="222" width="460" height="526" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1310" y="320" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">GPT Store</text>
  <rect x="1170" y="338" width="280" height="34" rx="17" fill="#D97A2B"/>
  <text x="1310" y="361" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">企業版自訂 GPT 退場中</text>
  <text x="1310" y="432" font-size="18" fill="#102A2B" text-anchor="middle">企業版新的 GPT 建立會停止</text>
  <text x="1310" y="468" font-size="18" fill="#102A2B" text-anchor="middle">可轉成外掛，自訂動作不會轉移</text>
  <line x1="1130" y1="532" x2="1490" y2="532" stroke="#D97A2B" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1310" y="604" font-size="18" fill="#5C6B6B" text-anchor="middle">分潤與其他方案時程</text>
  <text x="1310" y="664" font-size="30" font-weight="700" fill="#B8442D" text-anchor="middle">以官方公告為準</text>

  <!-- legend -->
  <rect x="60" y="788" width="24" height="24" rx="6" fill="#2E7D5B"/>
  <text x="96" y="807" font-size="17" fill="#102A2B">可上架</text>
  <rect x="210" y="788" width="24" height="24" rx="6" fill="#D97A2B"/>
  <text x="246" y="807" font-size="17" fill="#102A2B">有限制</text>
  <rect x="360" y="788" width="24" height="24" rx="6" fill="#B8442D"/>
  <text x="396" y="807" font-size="17" fill="#102A2B">不收</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
