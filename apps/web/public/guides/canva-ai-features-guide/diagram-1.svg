<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Canva 的 AI 功能分佈與每月額度 / Canva AI tools by category and monthly allowance</title>
  <desc id="desc">上半部把 Canva 的 AI 功能分成四欄。文字欄：Magic Write 文案不計額度，Magic Formulas 與 Magic Write for SEO 屬 Standard AI，Translate 翻譯 Pro 起可用。圖片欄：用 Canva AI 生成圖片屬 Premium AI，Magic Edit 與 Eraser、Magic Expand 與 Grab、照片去背與生成背景都是 Pro 起可用。影片欄：Image to Video 屬 Premium AI，用 Canva AI 生成影片屬 Premium 到 Ultra AI，影片去背與 Magic Animate 是 Pro 起可用，AI Voice 語音不計額度。設計欄：Canva AI 2.0 對話設計屬 Ultra AI，Canva Code 互動內容屬 Premium AI，Magic Charts 圖表免費可用，Magic Resize 改尺寸 Pro 起可用。下半部列出每月 AI 額度上限：Canva Free 為 Standard 200 次、Premium 20 次、沒有 Ultra；Canva Pro 為 Standard 2,000 次、Premium 200 次、Ultra 20 次；Canva Business 為 Standard 4,000 次、Premium 400 次、Ultra 40 次。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">Canva 的 AI 功能分佈與每月額度</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">How Canva AI tools map to text, image, video and design</text>

  <rect x="60" y="106" width="420" height="46" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="270" y="136" font-size="17" fill="#102A2B" text-anchor="middle">不計每月額度：AI 設計工具</text>
  <rect x="510" y="106" width="560" height="46" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="136" font-size="17" fill="#102A2B" text-anchor="middle">計入每月額度：Standard／Premium／Ultra</text>

  <!-- 文字 -->
  <rect x="60" y="180" width="345" height="380" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="232" y="228" font-size="20" font-weight="bold" fill="#0D6B68" text-anchor="middle">文字</text>
  <line x1="90" y1="248" x2="375" y2="248" stroke="#0D6B68" stroke-width="2"/>
  <text x="232" y="290" font-size="17" fill="#102A2B" text-anchor="middle">Magic Write 文案</text>
  <text x="232" y="316" font-size="15" fill="#5C6B6B" text-anchor="middle">不計額度</text>
  <text x="232" y="362" font-size="17" fill="#102A2B" text-anchor="middle">Magic Formulas</text>
  <text x="232" y="388" font-size="15" fill="#5C6B6B" text-anchor="middle">Standard AI</text>
  <text x="232" y="434" font-size="17" fill="#102A2B" text-anchor="middle">Magic Write for SEO</text>
  <text x="232" y="460" font-size="15" fill="#5C6B6B" text-anchor="middle">Standard AI</text>
  <text x="232" y="506" font-size="17" fill="#102A2B" text-anchor="middle">Translate 翻譯</text>
  <text x="232" y="532" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>

  <!-- 圖片 -->
  <rect x="445" y="180" width="345" height="380" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="617" y="228" font-size="20" font-weight="bold" fill="#2F6F9F" text-anchor="middle">圖片</text>
  <line x1="475" y1="248" x2="760" y2="248" stroke="#2F6F9F" stroke-width="2"/>
  <text x="617" y="290" font-size="17" fill="#102A2B" text-anchor="middle">用 Canva AI 生成圖片</text>
  <text x="617" y="316" font-size="15" fill="#5C6B6B" text-anchor="middle">Premium AI</text>
  <text x="617" y="362" font-size="17" fill="#102A2B" text-anchor="middle">Magic Edit／Eraser</text>
  <text x="617" y="388" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>
  <text x="617" y="434" font-size="17" fill="#102A2B" text-anchor="middle">Magic Expand／Grab</text>
  <text x="617" y="460" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>
  <text x="617" y="506" font-size="17" fill="#102A2B" text-anchor="middle">照片去背、生成背景</text>
  <text x="617" y="532" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>

  <!-- 影片 -->
  <rect x="830" y="180" width="345" height="380" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1002" y="228" font-size="20" font-weight="bold" fill="#D97A2B" text-anchor="middle">影片</text>
  <line x1="860" y1="248" x2="1145" y2="248" stroke="#D97A2B" stroke-width="2"/>
  <text x="1002" y="290" font-size="17" fill="#102A2B" text-anchor="middle">Image to Video</text>
  <text x="1002" y="316" font-size="15" fill="#5C6B6B" text-anchor="middle">Premium AI</text>
  <text x="1002" y="362" font-size="17" fill="#102A2B" text-anchor="middle">用 Canva AI 生成影片</text>
  <text x="1002" y="388" font-size="15" fill="#5C6B6B" text-anchor="middle">Premium／Ultra AI</text>
  <text x="1002" y="434" font-size="17" fill="#102A2B" text-anchor="middle">影片去背、Magic Animate</text>
  <text x="1002" y="460" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>
  <text x="1002" y="506" font-size="17" fill="#102A2B" text-anchor="middle">AI Voice 語音</text>
  <text x="1002" y="532" font-size="15" fill="#5C6B6B" text-anchor="middle">不計額度</text>

  <!-- 設計 -->
  <rect x="1215" y="180" width="345" height="380" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1387" y="228" font-size="20" font-weight="bold" fill="#2E7D5B" text-anchor="middle">設計</text>
  <line x1="1245" y1="248" x2="1530" y2="248" stroke="#2E7D5B" stroke-width="2"/>
  <text x="1387" y="290" font-size="17" fill="#102A2B" text-anchor="middle">Canva AI 2.0 對話設計</text>
  <text x="1387" y="316" font-size="15" fill="#5C6B6B" text-anchor="middle">Ultra AI</text>
  <text x="1387" y="362" font-size="17" fill="#102A2B" text-anchor="middle">Canva Code 互動內容</text>
  <text x="1387" y="388" font-size="15" fill="#5C6B6B" text-anchor="middle">Premium AI</text>
  <text x="1387" y="434" font-size="17" fill="#102A2B" text-anchor="middle">Magic Charts 圖表</text>
  <text x="1387" y="460" font-size="15" fill="#5C6B6B" text-anchor="middle">免費可用</text>
  <text x="1387" y="506" font-size="17" fill="#102A2B" text-anchor="middle">Magic Resize 改尺寸</text>
  <text x="1387" y="532" font-size="15" fill="#5C6B6B" text-anchor="middle">Pro 起可用</text>

  <text x="60" y="620" font-size="20" font-weight="bold" fill="#102A2B">每月 AI 額度上限（官方估算：只用同一等級、任務單純時）</text>

  <rect x="100" y="645" width="440" height="165" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="320" y="692" font-size="20" font-weight="bold" fill="#0D6B68" text-anchor="middle">Canva Free</text>
  <text x="320" y="727" font-size="17" fill="#102A2B" text-anchor="middle">Standard 200 次</text>
  <text x="320" y="757" font-size="17" fill="#102A2B" text-anchor="middle">Premium 20 次</text>
  <text x="320" y="787" font-size="17" fill="#B8442D" text-anchor="middle">沒有 Ultra</text>

  <rect x="580" y="645" width="440" height="165" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="692" font-size="20" font-weight="bold" fill="#2F6F9F" text-anchor="middle">Canva Pro</text>
  <text x="800" y="727" font-size="17" fill="#102A2B" text-anchor="middle">Standard 2,000 次</text>
  <text x="800" y="757" font-size="17" fill="#102A2B" text-anchor="middle">Premium 200 次</text>
  <text x="800" y="787" font-size="17" fill="#102A2B" text-anchor="middle">Ultra 20 次</text>

  <rect x="1060" y="645" width="440" height="165" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1280" y="692" font-size="20" font-weight="bold" fill="#2E7D5B" text-anchor="middle">Canva Business</text>
  <text x="1280" y="727" font-size="17" fill="#102A2B" text-anchor="middle">Standard 4,000 次</text>
  <text x="1280" y="757" font-size="17" fill="#102A2B" text-anchor="middle">Premium 400 次</text>
  <text x="1280" y="787" font-size="17" fill="#102A2B" text-anchor="middle">Ultra 40 次</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
