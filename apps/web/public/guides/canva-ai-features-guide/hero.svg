  <polygon points="440,416 530,268 620,416" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 212 500 q 62 -56 124 0 t 124 0 t 124 0" fill="none" stroke="#2F6F9F" stroke-width="9" stroke-linecap="round"/>
  <rect x="212" y="556" width="330" height="26" rx="13" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="212" y="606" width="212" height="26" rx="13" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>

  <path d="M 730 440 L 838 440" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-dasharray="12 14" stroke-linecap="round" marker-end="url(#arrow)"/>
  <polygon points="785,300 798,335 833,348 798,361 785,396 772,361 737,348 772,335" fill="#D97A2B"/>

  <rect x="860" y="250" width="560" height="78" rx="39" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
