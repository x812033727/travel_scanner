  <rect x="860" y="518" width="560" height="78" rx="39" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="5"/>
  <rect x="870" y="528" width="540" height="58" rx="29" fill="#2E7D5B"/>

  <text x="800" y="800" font-size="60" font-weight="bold" fill="#102A2B" text-anchor="middle">AI 功能與額度</text>
