<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 功能與每月額度 / AI features and the monthly allowance</title>
  <desc id="desc">一張手繪風格的插圖。左邊是一塊白色的設計畫布，上面放著一個圓形、一個三角形、一條波浪線與兩條色塊，代表設計裡的圖形與文字元素。一條虛線從畫布往右延伸，中間有一顆小星形，連到右邊三條由短到長的量表，代表不同方案每個月能用的 AI 額度多寡。底下有一行中文字：AI 功能與額度。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <rect x="150" y="210" width="560" height="460" rx="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
