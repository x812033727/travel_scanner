<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Yu Gothic','Meiryo','Noto Sans TC',sans-serif">
<title id="title">SEO 入門：4 つの実践ステップ</title><desc id="desc">検索を理解し、ページを確認し、具体的な問いに答え、データを記録して改善する。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">SEO 入門：4 つの実践ステップ</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">まず使えるページを作り、データを見て次の改善を決める</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">検索を理解</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">クロールと索引</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">クエリと表示</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">状態の違いを知る</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">ページを確認</text>
<text x="477.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">アクセスできる</text>
<text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">内容が分かる</text>
<text x="477.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">重要リンクが有効</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">問いに答える</text>
<text x="846.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">対象範囲を明確に</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">手順と根拠</text>
<text x="846.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">独自の例と図表</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">観察と改善</text>
<text x="1215.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">表示とクリック</text>
<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">訪問後の行動</text>
<text x="1215.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">変更仮説を記録</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">学習順序は作業の目安であり、順位を保証するものではありません。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル制作</text>
</svg>