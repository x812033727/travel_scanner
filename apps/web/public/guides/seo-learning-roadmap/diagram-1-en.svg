<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Segoe UI',Arial,sans-serif">
<title id="title">Four practical steps to learn SEO</title><desc id="desc">Understand search, check page access and links, answer a specific question, then record data and improve.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Four practical steps to learn SEO</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Make pages usable first, then use evidence to choose the next improvement</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="27" fill="#102A2B" text-anchor="start" font-weight="bold">Understand search</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Crawling &amp; indexing</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Queries &amp; results</text>
<text x="108.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Tell states apart</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="27" fill="#102A2B" text-anchor="start" font-weight="bold">Check the page</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Accessible to users</text>
<text x="477.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Content is clear</text>
<text x="477.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Key links work</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="27" fill="#102A2B" text-anchor="start" font-weight="bold">Answer a question</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Define the scope</text>
<text x="846.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Steps &amp; evidence</text>
<text x="846.0" y="475" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal">Original examples &amp; charts</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="27" fill="#102A2B" text-anchor="start" font-weight="bold">Measure &amp; improve</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Impressions &amp; clicks</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Post-visit actions</text>
<text x="1215.0" y="475" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Log change hypotheses</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">The learning order guides your work; it does not guarantee rankings.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original artwork by Mokaair</text>
</svg>