<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">2027 Golden Week: Days Off in Japan and Taiwan / Japan Golden Week 2027 and Taiwan Labour Day</title>
<desc id="desc">A nine-cell calendar runs from Thursday, 4/29/2027, to Friday, 5/7. The top row is Japan: 4/29 (Showa Day), 5/3 (Constitution Memorial Day), 5/4 (Greenery Day) and 5/5 (Children's Day) are national holidays; 5/1 and 2 are weekend days; 4/30, 5/6 and 5/7 are weekdays. Two brackets above show the five-day break without leave (5/1–5) and the seven-day break with 4/30 off (4/29–5/5). An arrow at the right shows that also taking 5/6 and 5/7 off extends the break through 5/9. The bottom row is Taiwan: 4/30 (substitute holiday), 5/1 (Labour Day) and 5/2 form a 3-day Labour Day break; the other six days are working days. A note at the bottom right says the all-reserved Nozomi period is subject to JR Central's announcement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs>
