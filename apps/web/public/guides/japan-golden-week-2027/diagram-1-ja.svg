<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">2027 年のゴールデンウィーク：日本と台湾はいつ休みか / 日本のゴールデンウィーク 2027 と台湾の労働節</title>
<desc id="desc">2027 年 4 月 29 日木曜日から 5 月 7 日金曜日まで、九つのマスが一列に並ぶカレンダーです。上段は日本で、4 月 29 日の昭和の日、5 月 3 日の憲法記念日、5 月 4 日のみどりの日、5 月 5 日のこどもの日が国民の祝日です。5 月 1 日と 2 日は週末、4 月 30 日、5 月 6 日、5 月 7 日は平日です。上側の二本の括弧は、休暇を取らない場合の五連休（5 月 1 日から 5 日）と、4 月 30 日に一日休暇を取る場合の七連休（4 月 29 日から 5 月 5 日）を示しています。右端の矢印は、さらに 5 月 6 日と 5 月 7 日に休暇を取れば 5 月 9 日まで休めることを示しています。下段は台湾で、4 月 30 日の振替休日、5 月 1 日の労働節、5 月 2 日を合わせた 3 日間が労働節連休です。残りの六日間は勤務日です。右下には、のぞみ全席指定席の対象期間は JR 東海の発表に従う旨が記されています。</desc>
