<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">2027 年黃金週：日本與台灣哪幾天放假 / Japan Golden Week 2027 and Taiwan Labour Day</title>
<desc id="desc">一條九格的日曆，從 2027 年 4 月 29 日星期四排到 5 月 7 日星期五。上排是日本：4 月 29 日昭和の日、5 月 3 日憲法記念日、5 月 4 日みどりの日、5 月 5 日こどもの日是國定假日，5 月 1 日與 2 日是週末，4 月 30 日、5 月 6 日、5 月 7 日是平日。上方兩條括弧標出不請假的五連休（5 月 1 日到 5 日）與請 4 月 30 日一天的七連休（4 月 29 日到 5 月 5 日），右端的箭頭標出再請 5 月 6 日、5 月 7 日可以休到 5 月 9 日。下排是台灣：4 月 30 日補假、5 月 1 日勞動節、5 月 2 日，合起來是 3 天的勞動節連假，其餘六天是上班日。右下角註明のぞみ全席指定席的期間以 JR 東海公告為準。</desc>
