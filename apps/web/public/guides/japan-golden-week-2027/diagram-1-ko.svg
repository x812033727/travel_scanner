<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">2027년 골든위크: 일본과 대만은 어느 날 쉬나 / 일본 골든위크 2027과 대만 노동절</title>
<desc id="desc">2027년 4월 29일 목요일부터 5월 7일 금요일까지 이어지는 아홉 칸짜리 달력입니다. 윗줄은 일본입니다. 4월 29일 쇼와의 날, 5월 3일 헌법기념일, 5월 4일 녹색의 날, 5월 5일 어린이날은 법정 공휴일이며, 5월 1일과 2일은 주말, 4월 30일·5월 6일·5월 7일은 평일입니다. 위쪽의 두 괄호는 휴가 없이 쉬는 닷새 연휴(5월 1일~5일)와 4월 30일 하루 휴가를 내면 가능한 이레 연휴(4월 29일~5월 5일)를 표시합니다. 오른쪽 끝 화살표는 5월 6일과 5월 7일에도 휴가를 내면 5월 9일까지 쉴 수 있음을 표시합니다. 아랫줄은 대만입니다. 4월 30일 대체휴일, 5월 1일 노동절, 5월 2일을 합쳐 3일간의 노동절 연휴이며, 나머지 엿새는 근무일입니다. 오른쪽 아래에는 のぞみ 전 좌석 지정석 적용 기간은 JR 도카이 공지를 기준으로 한다고 적혀 있습니다.</desc>
