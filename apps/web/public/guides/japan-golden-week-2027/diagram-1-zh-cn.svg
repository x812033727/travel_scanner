<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">2027 年黄金周：日本与台湾哪几天放假 / 2027 日本黄金周与台湾劳动节</title>
<desc id="desc">一条九格日历，从 2027 年 4 月 29 日星期四排到 5 月 7 日星期五。上排是日本：4 月 29 日昭和日、5 月 3 日宪法纪念日、5 月 4 日绿之日、5 月 5 日儿童节是法定节假日，5 月 1 日与 2 日是周末，4 月 30 日、5 月 6 日、5 月 7 日是工作日。上方两条括号标出不请假的五连休（5 月 1 日到 5 日）与请 4 月 30 日一天的七连休（4 月 29 日到 5 月 5 日），右端的箭头标出再请 5 月 6 日、5 月 7 日可以休到 5 月 9 日。下排是台湾：4 月 30 日补假、5 月 1 日劳动节、5 月 2 日，合起来是 3 天的劳动节连假，其余六天是工作日。右下角注明のぞみ全席指定席的时段以 JR 东海公告为准。</desc>
