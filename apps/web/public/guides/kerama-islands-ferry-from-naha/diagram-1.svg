<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">泊港的兩個乘船處 / Two piers at Naha Tomari Port</title>
  <desc id="desc">示意圖，方向與距離非比例。右側是一條南北向的道路，上面標泊高橋交差點；右下角是とまりんビル，裡面有 4 番櫃台（渡嘉敷村）與座間味村那霸出張所，渡輪的票只在這裡賣。右上角是美栄橋駅，一條虛線連到とまりんビル，標步行約 10 分，下方寫單軌那霸機場站到美栄橋約 14 分。とまりんビル往左上一條實線到北岸 North pier，線上標步行 7 到 10 分；北岸有クイーンざまみ與マリンライナーとかしき，下方註明北岸售票處出航 1 小時前開賣。とまりんビル往左一條實線到南岸 South pier；南岸有フェリーざまみ3與フェリーとかしき，下方註明フェリーとかしき就在とまりんビル對面。左側三個箭頭標三座島的方向與航程：渡嘉敷島高速船約 40 分、渡輪約 70 分；座間味島高速船約 50 分、渡輪約 2 小時；阿嘉島渡輪約 1 小時 30 分。圖例：實線是陸上步行，虛線是單軌與步行，箭頭是船。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#D97A2B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">泊港的兩個乘船處：渡輪南岸、高速船北岸</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Tomari Port, Naha: ferries at the south pier, high-speed boats at the north pier</text>
  <text x="1540" y="52" font-size="16" text-anchor="end" fill="#5C6B6B">示意圖，方向與距離非比例</text>

  <line x1="1520" y1="120" x2="1520" y2="840" stroke="#D8CFC0" stroke-width="18" stroke-linecap="round"/>
  <text x="1500" y="112" font-size="16" text-anchor="end" fill="#5C6B6B">主要道路</text>
  <circle cx="1520" cy="782" r="11" fill="#5C6B6B"/>
  <text x="1494" y="788" font-size="16" text-anchor="end" fill="#5C6B6B">泊高橋交差點</text>

  <rect x="1120" y="140" width="280" height="86" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1260" y="194" font-size="22" text-anchor="middle" fill="#102A2B">美栄橋駅</text>
  <text x="1260" y="256" font-size="16" text-anchor="middle" fill="#5C6B6B">單軌 那霸機場站→美栄橋 約 14 分</text>

  <line x1="1258" y1="272" x2="1252" y2="498" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 12"/>
  <text x="1280" y="392" font-size="16" fill="#2F6F9F">步行約 10 分</text>

  <rect x="1090" y="500" width="330" height="230" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1255" y="544" font-size="20" text-anchor="middle" fill="#102A2B">とまりんビル（泊港大樓）</text>
  <text x="1255" y="592" font-size="17" text-anchor="middle" fill="#102A2B">4 番櫃台（渡嘉敷村）</text>
  <text x="1255" y="628" font-size="17" text-anchor="middle" fill="#102A2B">座間味村那霸出張所</text>
  <text x="1255" y="672" font-size="16" text-anchor="middle" fill="#5C6B6B">渡輪的票只在這裡賣</text>

  <line x1="1088" y1="556" x2="986" y2="320" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1040" y="486" font-size="17" text-anchor="end" fill="#2F6F9F">步行 7 到 10 分</text>
  <line x1="1088" y1="648" x2="986" y2="660" stroke="#0D6B68" stroke-width="5"/>

  <rect x="600" y="180" width="380" height="210" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="224" font-size="20" text-anchor="middle" fill="#102A2B">北岸 North pier</text>
  <rect x="630" y="245" width="320" height="50" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="790" y="277" font-size="17" text-anchor="middle" fill="#102A2B">クイーンざまみ</text>
  <rect x="630" y="307" width="320" height="50" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="790" y="339" font-size="17" text-anchor="middle" fill="#102A2B">マリンライナーとかしき</text>
  <text x="790" y="420" font-size="16" text-anchor="middle" fill="#5C6B6B">北岸售票處：出航 1 小時前開賣</text>

  <rect x="600" y="560" width="380" height="210" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="790" y="604" font-size="20" text-anchor="middle" fill="#102A2B">南岸 South pier</text>
  <rect x="630" y="625" width="320" height="50" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="790" y="657" font-size="17" text-anchor="middle" fill="#102A2B">フェリーざまみ3</text>
  <rect x="630" y="687" width="320" height="50" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="790" y="719" font-size="17" text-anchor="middle" fill="#102A2B">フェリーとかしき</text>
  <text x="790" y="800" font-size="16" text-anchor="middle" fill="#5C6B6B">フェリーとかしき 就在とまりんビル對面</text>

  <line x1="590" y1="200" x2="374" y2="200" stroke="#D97A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="350" y="194" font-size="22" font-weight="bold" text-anchor="end" fill="#102A2B">渡嘉敷島</text>
  <text x="350" y="228" font-size="17" text-anchor="end" fill="#5C6B6B">高速船約 40 分／渡輪約 70 分</text>

  <line x1="590" y1="440" x2="374" y2="440" stroke="#D97A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="350" y="434" font-size="22" font-weight="bold" text-anchor="end" fill="#102A2B">座間味島</text>
  <text x="350" y="468" font-size="17" text-anchor="end" fill="#5C6B6B">高速船約 50 分／渡輪約 2 小時</text>

  <line x1="590" y1="680" x2="374" y2="680" stroke="#D97A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="350" y="674" font-size="22" font-weight="bold" text-anchor="end" fill="#102A2B">阿嘉島</text>
  <text x="350" y="708" font-size="17" text-anchor="end" fill="#5C6B6B">渡輪約 1 小時 30 分</text>

  <text x="60" y="852" font-size="16" fill="#5C6B6B">實線＝陸上步行　虛線＝單軌與步行　箭頭＝船</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
