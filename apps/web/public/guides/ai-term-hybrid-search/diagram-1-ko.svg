<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">각각 검색한 뒤 순위 융합</title><desc id="desc">같은 질문을 전문 검색과 벡터 검색에 보내고, 결과를 식별자로 중복 제거한 뒤 순위를 융합해 공통 후보 목록을 만드는 과정</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">각각 검색한 뒤 순위 융합</text><text x="60" y="84" font-size="18" fill="#5C6B6B">하이브리드 검색</text><path d="M 340 390 L 530 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 340 460 L 530 630" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 840 230 L 1060 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 840 630 L 1060 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="70" y="340" width="270" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="205" y="419" font-size="28" fill="#102A2B" text-anchor="middle">사용자 질문</text><text x="205" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">코드와 자연어</text><rect x="540" y="155" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="690" y="224" font-size="28" fill="#102A2B" text-anchor="middle">전문 검색</text><text x="690" y="267" font-size="22" fill="#5C6B6B" text-anchor="middle">정확한 어휘</text><rect x="540" y="555" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="690" y="624" font-size="28" fill="#102A2B" text-anchor="middle">벡터 검색</text><text x="690" y="667" font-size="22" fill="#5C6B6B" text-anchor="middle">의미적 관련성</text><rect x="1070" y="330" width="420" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1280" y="419" font-size="28" fill="#102A2B" text-anchor="middle">중복 제거·순위 융합</text><text x="1280" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">후보 목록 결합</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도표 제작 2026</text></svg>
