<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Search Separately, Then Fuse Ranks</title><desc id="desc">The same question goes to full-text and vector search; results are deduplicated by ID and fused by rank into a shared candidate list</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Search Separately, Then Fuse Ranks</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Hybrid Search</text><path d="M 340 390 L 530 240" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 340 460 L 530 630" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 840 230 L 1060 380" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><path d="M 840 630 L 1060 470" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)" /><rect x="70" y="340" width="270" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="205" y="419" font-size="28" fill="#102A2B" text-anchor="middle">User question</text><text x="205" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">Codes + natural language</text><rect x="540" y="155" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="690" y="224" font-size="28" fill="#102A2B" text-anchor="middle">Full-text search</text><text x="690" y="267" font-size="22" fill="#5C6B6B" text-anchor="middle">Exact terms</text><rect x="540" y="555" width="300" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="690" y="624" font-size="28" fill="#102A2B" text-anchor="middle">Vector search</text><text x="690" y="667" font-size="22" fill="#5C6B6B" text-anchor="middle">Semantic relevance</text><rect x="1070" y="330" width="420" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1280" y="419" font-size="28" fill="#102A2B" text-anchor="middle">Deduplicate + fuse ranks</text><text x="1280" y="462" font-size="22" fill="#5C6B6B" text-anchor="middle">Combined candidate list</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">Graphic © Mokaair 2026</text></svg>
