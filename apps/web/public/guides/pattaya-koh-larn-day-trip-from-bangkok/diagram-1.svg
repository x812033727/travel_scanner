<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">曼谷出發芭達雅與格蘭島：從上車點到島上海灘的動線與票價 / Bangkok to Pattaya and Koh Larn</title>
  <desc id="desc">示意圖，方向與距離非比例。左邊是曼谷的三個長途巴士上車點：蒙奇 2 巴士總站票價 155 泰銖、回程末班 18:00；Ekkamai 東巴士總站票價 144 泰銖、回程末班 22:00；蘇凡納布機場 1 樓 8 號門票價 135 泰銖、回程末班 21:00。三條線都標約 2 小時，收束到芭達雅北巴士總站（北芭達雅路）。往下接雙條車或計程車到南芭達雅路的巴里海碼頭，官方沒有這一段的車程時間；碼頭的船只在 08:00 到 17:00 之間開。碼頭往右有兩條海上路線到格蘭島：渡輪每人單程 30 泰銖、約 45 分鐘，快艇每人單程 200 到 250 泰銖、約 15 到 20 分鐘，兩條線中間標約 7 公里。格蘭島上有塔灣海灘碼頭（北）與家門碼頭，買票時要問清楚船停哪個碼頭；四個海灘是塔灣（北）、薩美（西）、天（西）、暖（南），只有家門碼頭到暖海灘畫了雙條車的虛線。圖例：實線是船、虛線是島上雙條車、粗線是長途巴士。</desc>
