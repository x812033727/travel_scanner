<pattern id="typhi" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#B8442D" stroke-width="5"/></pattern>
<pattern id="haze" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#D97A2B"/></pattern>
