<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans Thai','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">東南亞六個地區的季節月份 / Southeast Asia: when to go, month by month</title>
<desc id="desc">一張 6 列 12 欄的矩陣。橫向是 1 月到 12 月，縱向由上到下是普吉與喀比、清邁、曼谷、越南中部、新加坡、香港。綠色格子是乾季或最舒服的月份，白色格子是居中，藍色格子是雨季或多雨；紅色斜線疊在颱風與水患的月份上，香港 7 到 9 月的斜線加粗表示最可能，橘色點紋是霧霾與煙霞的月份，灰色細斜線是新加坡季風交替期的午後雷暴。普吉與喀比 1、2、3、11、12 月乾季，4、5 月居中，6 到 10 月雨季；清邁 11、12、1、2 月最舒服，3、4、10 月居中，5 到 9 月多雨，2 到 4 月疊霧霾；曼谷 1 到 4 月與 12 月少雨，5、6、11 月居中，7 到 10 月多雨；越南中部 3 到 8 月最舒服，2 月居中，9 月到隔年 1 月多雨，9 到 11 月疊颱風；新加坡 2、3 月最乾，11、12、1 月雨量較多，其餘居中，6 到 9 月疊煙霞，4、5、10、11 月疊交替期雷暴；香港 11、12 月最好，1 到 4 月居中，5 到 10 月多雨，5 到 11 月疊颱風。</desc>
