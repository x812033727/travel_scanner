<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從文字與圖片到影片，再分成延長與修改 / From text and image to video, then extend or edit</title>
  <desc id="desc">幾何插圖。左邊上方是一張白色卡片，裡面有三條橫線代表一段文字提示詞；左邊下方是一張淺綠卡片，裡面有圓形的太陽與兩座三角形山丘代表一張圖片。兩張卡片各有一個箭頭指向畫面中央的膠卷：一條白色長條，上下緣排著方形齒孔，中間分成三格畫面，分別是藍色圓形、橘色方塊與綠色三角形。膠卷右側再分出兩條箭頭：右上是一段綠框的膠卷，接了兩格畫面並加上一個橘色加號，代表把影片延長；右下是一段藍框的膠卷，左邊一格是藍色圓形，箭頭指向右邊一格已經換成橘色方塊，代表把畫面改掉。整張圖沒有任何文字、介面或品牌標誌。</desc>
