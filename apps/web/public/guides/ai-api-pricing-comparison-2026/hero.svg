<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">每百萬 token 的價格帶 / API price per million tokens</title>
  <desc id="desc">一張抽象插圖：左側有一條直立的細線當作起點，右邊接出三條由長到短的圓角橫帶，分別用綠、藍、深綠描邊，帶子上各放幾個實心圓點代表不同價位；畫面右側是一張圓角的計價卡片，卡片裡有五條長短不一的橫線與一個橘色圓點，代表把單價乘上用量算出來的帳單。上方一行字寫著「每百萬 token 多少錢」。</desc>
