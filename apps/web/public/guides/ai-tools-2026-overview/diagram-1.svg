<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">六個 AI 工具比較矩陣：免費版、入門價格、強項、資料放哪裡 / Six AI tools compared: free tier, entry plan, strengths, data location</title>
  <desc id="desc">六列六個工具、四個面向的比較矩陣。ChatGPT（OpenAI，美國）：免費版文字對話不限次數，檔案、圖片、語音另有額度；入門付費 Go 8 美元（美國定價）、Plus 20 美元；強項是功能最齊、使用者最多，同帳號可用 Codex；支援名單有台灣，美國公司，可關「為所有人改善模型」或用臨時聊天。Claude（Anthropic，美國）：免費版有 Sonnet、Haiku 模型與搜尋、記憶、檔案、語音；Pro 20 美元，年繳換算 17 美元；強項是長文件、寫作、程式，Pro 含 Claude Code；支援名單有台灣，美國公司，隱私設定可關模型改善，無痕對話不用於改善。Gemini（Google，美國）：免費版 Gemini 3.6 Flash、圖片生成、Deep Research、15 GB 雲端空間；Google AI Plus 165 元、AI Pro 650 元台幣；強項是與 Gmail、文件、YouTube 整合並有台幣定價；有台灣、含繁體中文，全球伺服器，可關「保留活動記錄」，關掉後只保留 72 小時。Codex（OpenAI，美國）：Free 方案可試小任務，不含圖片生成；隨 ChatGPT Plus 20 美元；寫程式代理，有網頁、CLI、編輯器、iOS；台灣與資料隨 ChatGPT。MiniMax 海螺 AI（上海稀宇科技，中國）：免費可生成影片但下載有浮水印；海螺 Standard 價格以官網為準，Token Plan Plus 22 美元；強項是影片、語音、音樂與開放權重模型 M3；國際版網站可開，由新加坡公司營運，中國版資料存放在中國境內。DeepSeek（杭州深度求索，中國）：網頁與 App 全部免費、無廣告、無內購；沒有個人付費方案；免費、MIT 授權開源、能看圖；民眾可用，公務機關 2025 年起全面禁用，資料在中國境內存放。底注：價格為 2026 年 9 月 13 日各家官網幣別，Google 有台幣定價，其餘以美元計。</desc>
