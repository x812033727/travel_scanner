<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2026 年 AI 工具全景 / The 2026 AI tool landscape</title>
  <desc id="desc">米色底上有六個顏色與形狀各不相同的對話泡泡聚在畫面中央：青綠色的圓角矩形、藍色的圓形、橘色的六角形、綠色的雲朵形、紅棕色的橢圓形與深色的圓角方形，每個泡泡裡有三個小點表示正在對話，泡泡之間用細線連在一起。下方一行字寫著 2026 年 AI 工具全景。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background ring -->
  <circle cx="800" cy="400" r="330" fill="none" stroke="#E3F0EF" stroke-width="40"/>
  <circle cx="800" cy="400" r="330" fill="none" stroke="#0D6B68" stroke-width="3" stroke-dasharray="18 22" opacity="0.5"/>

  <!-- connecting lines -->
  <g stroke="#5C6B6B" stroke-width="4" opacity="0.5">
    <line x1="560" y1="230" x2="800" y2="400"/>
    <line x1="1040" y1="230" x2="800" y2="400"/>
    <line x1="420" y1="450" x2="800" y2="400"/>
    <line x1="1180" y1="450" x2="800" y2="400"/>
    <line x1="600" y1="640" x2="800" y2="400"/>
    <line x1="1000" y1="640" x2="800" y2="400"/>
  </g>
  <circle cx="800" cy="400" r="34" fill="#102A2B"/>
  <circle cx="800" cy="400" r="14" fill="#F7F1E8"/>

  <!-- 1 teal rounded-rect bubble (top left) -->
  <g>
    <rect x="400" y="130" width="320" height="190" rx="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
    <polygon points="600,318 660,318 640,372" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8" stroke-linejoin="round"/>
    <rect x="606" y="306" width="50" height="20" fill="#E3F0EF"/>
    <circle cx="510" cy="225" r="16" fill="#0D6B68"/>
    <circle cx="560" cy="225" r="16" fill="#0D6B68"/>
    <circle cx="610" cy="225" r="16" fill="#0D6B68"/>
  </g>

  <!-- 2 blue circle bubble (top right) -->
  <g>
    <circle cx="1060" cy="220" r="120" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8"/>
    <polygon points="980,300 1020,330 950,345" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8" stroke-linejoin="round"/>
    <rect x="968" y="290" width="46" height="24" fill="#E6F0F7"/>
    <circle cx="1010" cy="220" r="16" fill="#2F6F9F"/>
    <circle cx="1060" cy="220" r="16" fill="#2F6F9F"/>
    <circle cx="1110" cy="220" r="16" fill="#2F6F9F"/>
  </g>

  <!-- 3 orange hexagon bubble (left) -->
  <g>
    <polygon points="300,340 400,340 450,430 400,520 300,520 250,430" fill="#FBEBDD" stroke="#D97A2B" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="420,500 470,470 460,540" fill="#FBEBDD" stroke="#D97A2B" stroke-width="8" stroke-linejoin="round"/>
    <rect x="404" y="486" width="36" height="24" fill="#FBEBDD" transform="rotate(-30 422 498)"/>
    <circle cx="305" cy="430" r="15" fill="#D97A2B"/>
    <circle cx="350" cy="430" r="15" fill="#D97A2B"/>
    <circle cx="395" cy="430" r="15" fill="#D97A2B"/>
  </g>

  <!-- 4 green cloud bubble (right) -->
  <g>
    <circle cx="1210" cy="440" r="70" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1290" cy="410" r="82" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1360" cy="460" r="66" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1285" cy="490" r="72" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1210" cy="440" r="70" fill="#E4F1EA"/>
    <circle cx="1290" cy="410" r="82" fill="#E4F1EA"/>
    <circle cx="1360" cy="460" r="66" fill="#E4F1EA"/>
    <circle cx="1285" cy="490" r="72" fill="#E4F1EA"/>
    <circle cx="1195" cy="565" r="22" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1160" cy="610" r="13" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="8"/>
    <circle cx="1240" cy="455" r="15" fill="#2E7D5B"/>
    <circle cx="1285" cy="455" r="15" fill="#2E7D5B"/>
    <circle cx="1330" cy="455" r="15" fill="#2E7D5B"/>
  </g>

  <!-- 5 red-brown ellipse bubble (bottom left) -->
  <g>
    <ellipse cx="600" cy="640" rx="170" ry="100" fill="#F6E4DF" stroke="#B8442D" stroke-width="8"/>
    <polygon points="690,720 740,700 730,770" fill="#F6E4DF" stroke="#B8442D" stroke-width="8" stroke-linejoin="round"/>
    <rect x="684" y="700" width="46" height="24" fill="#F6E4DF" transform="rotate(-20 707 712)"/>
    <circle cx="550" cy="640" r="16" fill="#B8442D"/>
    <circle cx="600" cy="640" r="16" fill="#B8442D"/>
    <circle cx="650" cy="640" r="16" fill="#B8442D"/>
  </g>

  <!-- 6 dark rounded-square bubble (bottom right) -->
  <g>
    <rect x="880" y="560" width="220" height="200" rx="48" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
    <polygon points="900,740 870,800 950,750" fill="#FFFFFF" stroke="#102A2B" stroke-width="8" stroke-linejoin="round"/>
    <rect x="896" y="734" width="50" height="22" fill="#FFFFFF"/>
    <circle cx="945" cy="660" r="16" fill="#102A2B"/>
    <circle cx="990" cy="660" r="16" fill="#102A2B"/>
    <circle cx="1035" cy="660" r="16" fill="#102A2B"/>
  </g>

  <text x="800" y="850" font-size="48" font-weight="700" fill="#102A2B" text-anchor="middle">2026 年 AI 工具全景</text>
</svg>
