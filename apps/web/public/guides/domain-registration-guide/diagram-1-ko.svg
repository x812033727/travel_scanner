<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<title id="title">하나의 주소, 네 가지 관리 정보</title><desc id="desc">도메인 등록, DNS, 웹사이트, 이메일을 네 칸으로 나누고 보관해야 할 관리 정보를 표시한다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">하나의 주소, 네 가지 관리 정보</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">서비스를 구분한 뒤 등록·연결·인계를 준비하세요</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">도메인</text>
<text x="108.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">등록자</text>
<text x="108.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">관리 계정</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">만료일</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">DNS</text>
<text x="477.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">DNS 호스팅</text>
<text x="477.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">DNS 레코드</text>
<text x="477.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">변경 기록</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">웹사이트</text>
<text x="846.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">호스팅 위치</text>
<text x="846.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">프로그램 데이터</text>
<text x="846.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">백업과 복원</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold">이메일</text>
<text x="1215.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">서비스 계정</text>
<text x="1215.0" y="423" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">메일 기록</text>
<text x="1215.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">인계 담당자</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">주소가 열려도 계정을 인계할 수 있는지 확인하세요.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 오리지널 그래픽</text>
</svg>
