<title id="title">GPT-Live 1, API 핵심 4가지</title><desc id="desc">GPT-Live 1이 API에 들어오며 생긴 네 가지 핵심: 전화는 수신 위주, 음성 지원 언어는 명시되지 않음, 기본값은 녹음 안 함, 분당 0.05달러. OpenAI 개발자 문서를 바탕으로 정리, 확인일 2026년 9월 18일.</desc>
