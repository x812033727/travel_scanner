  <rect x="382" y="427" width="140" height="34" rx="17" fill="#B8442D" opacity="0.35"/>

  <path d="M 682 400 C 745 355, 805 445, 866 400" fill="none" stroke="#5C6B6B" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="900" y="255" width="150" height="266" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
