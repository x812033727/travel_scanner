<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="title">五力分析先划定边界</title><desc id="desc">六张卡片先说明行业边界，再分别列出现有同行、新进入者、供应商、买方与替代方案的核心核查问题。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">五力分析先划定边界</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">从同一客户任务出发，分别研究五种竞争关系</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">先界定行业</text>
<text x="108" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">任务、地区与服务范围</text>
<text x="108" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">条件不同，分开比较</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">现有同行</text>
<text x="598" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">比较服务与交付</text>
<text x="598" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">竞争集中在哪些条件</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">新进入者</text>
<text x="1088" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">进入需要哪些能力</text>
<text x="1088" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">门槛不只有设备价格</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">供应商力量</text>
<text x="108" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">必要资源与可用来源</text>
<text x="108" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">切换需要多少准备</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">买方力量</text>
<text x="598" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">客户选择与交易条件</text>
<text x="598" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">议价不只是标价高低</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">替代方案</text>
<text x="1088" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">不同方式完成任务</text>
<text x="1088" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">核对质量与使用成本</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">行业结构提供线索，服务定位还需要需求证据与交付能力。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创绘图</text>
</svg>
