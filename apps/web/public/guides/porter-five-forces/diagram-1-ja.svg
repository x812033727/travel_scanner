<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<title id="title">まず業界の範囲を定める</title><desc id="desc">六つのカードで業界の範囲を示した後、既存の競合、新規参入者、供給者、買い手、代替手段について確認すべき主な問いを並べた図。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">まず業界の範囲を定める</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">同じ顧客の目的から、五つの競争関係を別々に調べる</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">業界の範囲</text>
<text x="108" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">目的・地域・サービス</text>
<text x="108" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">条件が違えば分ける</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">既存の競合</text>
<text x="598" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">サービスと納品を比較</text>
<text x="598" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">競争の焦点はどこか</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">新規参入者</text>
<text x="1088" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">参入に必要な能力</text>
<text x="1088" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">機材価格だけが壁ではない</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">供給者の力</text>
<text x="108" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">必要資源と調達先</text>
<text x="108" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">切り替えの準備</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">買い手の力</text>
<text x="598" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">顧客の選択と取引条件</text>
<text x="598" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">交渉は価格だけではない</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">代替手段</text>
<text x="1088" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">同じ目的を別の方法で</text>
<text x="1088" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">品質と利用コストを確認</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">業界構造は手掛かり。位置づけには需要の証拠と提供能力も必要。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル制作</text>
</svg>
