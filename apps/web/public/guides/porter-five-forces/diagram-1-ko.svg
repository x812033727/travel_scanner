<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<title id="title">먼저 산업의 범위를 정하기</title><desc id="desc">여섯 장의 카드로 산업의 범위를 설명한 뒤 기존 경쟁자, 신규 진입자, 공급자, 구매자, 대체 수단의 핵심 점검 질문을 제시한 도해.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">먼저 산업의 범위를 정하기</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">같은 고객 과업을 기준으로 다섯 경쟁 관계를 따로 조사</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">산업 범위 정의</text>
<text x="108" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">과업·지역·서비스 범위</text>
<text x="108" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">조건이 다르면 분리</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">기존 경쟁자</text>
<text x="598" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">서비스·납품 비교</text>
<text x="598" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">경쟁이 집중되는 조건</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">신규 진입자</text>
<text x="1088" y="339" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">진입에 필요한 역량</text>
<text x="1088" y="391" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">장비 가격만이 장벽은 아님</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">공급자의 힘</text>
<text x="108" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">필수 자원과 공급처</text>
<text x="108" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">전환에 필요한 준비</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">구매자의 힘</text>
<text x="598" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">고객 선택과 거래 조건</text>
<text x="598" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">교섭은 가격만의 문제 아님</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="542" font-size="33" fill="#102A2B" text-anchor="start" font-weight="bold">대체 수단</text>
<text x="1088" y="599" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">같은 과업의 다른 방법</text>
<text x="1088" y="651" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">품질과 이용 비용 확인</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">산업 구조는 단서일 뿐, 포지셔닝에는 수요 근거와 제공 역량도 필요</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
