<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">Define the Industry First</title><desc id="desc">Six cards define the industry boundary and ask core questions about existing rivals, new entrants, suppliers, buyers, and substitutes.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="46" fill="#102A2B" text-anchor="start" font-weight="bold">Define the Industry First</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Start with one customer job; examine five forces separately</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Set the boundary</text>
<text x="108" y="339" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Job, location, scope</text>
<text x="108" y="391" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Split unlike offers</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Existing rivals</text>
<text x="598" y="339" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Compare service, delivery</text>
<text x="598" y="391" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Where is rivalry strongest?</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">New entrants</text>
<text x="1088" y="339" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Skills needed to enter</text>
<text x="1088" y="391" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Beyond equipment cost</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Supplier power</text>
<text x="108" y="599" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Inputs and viable sources</text>
<text x="108" y="651" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Cost of switching</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Buyer power</text>
<text x="598" y="599" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Buyer choices and terms</text>
<text x="598" y="651" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Price is only one term</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="542" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Substitutes</text>
<text x="1088" y="599" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Same job, different way</text>
<text x="1088" y="651" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Check quality and cost</text>
<text x="80" y="803" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Structure guides; positioning needs demand evidence and delivery ability.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original art by Mokaair</text>
</svg>
