  <rect x="1060" y="646" width="500" height="170" rx="18" fill="#FFFFFF" stroke="#7E57C2" stroke-width="4"/>
  <rect x="1080" y="660" width="96" height="30" rx="15" fill="#7E57C2"/>
  <text x="1128" y="681" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">收費</text>
  <text x="1190" y="684" font-size="24" font-weight="700" fill="#102A2B">貓空纜車</text>
  <text x="1080" y="720" font-size="17" fill="#102A2B">捷運動物園站・25 分・NT$35（忠孝復興轉乘）</text>
  <text x="1080" y="748" font-size="17" fill="#102A2B">單程 NT$180・一日票 NT$300</text>
  <text x="1080" y="776" font-size="17" fill="#102A2B">平日 09:00–21:00・例假日 09:00–22:00</text>
  <text x="1080" y="804" font-size="17" fill="#5C6B6B">部分週一保養停駛・雷擊強風時停駛</text>

  <!-- C5 Qingtiangang, free -->
  <rect x="30" y="124" width="440" height="180" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="50" y="138" width="96" height="30" rx="15" fill="#0D6B68"/>
  <text x="98" y="159" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">免費</text>
  <text x="160" y="162" font-size="24" font-weight="700" fill="#102A2B">擎天崗</text>
  <text x="50" y="198" font-size="17" fill="#102A2B">捷運劍潭站・10 分・NT$20</text>
  <text x="50" y="226" font-size="17" fill="#102A2B">轉小 15 公車到終點</text>
  <text x="50" y="254" font-size="17" fill="#102A2B">平日 05:40–16:20・例假日至 17:30</text>
  <text x="50" y="282" font-size="17" fill="#5C6B6B">請勿靠近野化水牛</text>

  <!-- C6 Dadaocheng Wharf, free -->
  <rect x="30" y="560" width="440" height="180" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="50" y="574" width="96" height="30" rx="15" fill="#0D6B68"/>
  <text x="98" y="595" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">免費</text>
  <text x="160" y="598" font-size="24" font-weight="700" fill="#102A2B">大稻埕碼頭</text>
  <text x="50" y="634" font-size="17" fill="#102A2B">捷運北門站・5 分・NT$20</text>
  <text x="50" y="662" font-size="17" fill="#102A2B">或大橋頭站・8 分・NT$20</text>
  <text x="50" y="690" font-size="17" fill="#102A2B">淡水河夕陽・貨櫃市集</text>
  <text x="50" y="718" font-size="17" fill="#5C6B6B">五號水門旁</text>

  <!-- when to go -->
  <rect x="560" y="606" width="320" height="206" rx="18" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="6 6"/>
