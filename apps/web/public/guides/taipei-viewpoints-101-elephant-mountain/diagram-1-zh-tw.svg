  <path d="M 840 460 C 960 460, 950 355, 1060 355" fill="none" stroke="#B8442D" stroke-width="8" stroke-linecap="round"/>
  <path d="M 840 480 C 960 480, 950 543, 1060 543" fill="none" stroke="#B8442D" stroke-width="8" stroke-linecap="round"/>
  <path d="M 840 500 C 950 500, 950 731, 1060 731" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round"/>
  <!-- spokes, left -->
  <path d="M 640 425 C 640 390, 600 356, 560 356" fill="none" stroke="#B8442D" stroke-width="8" stroke-linecap="round"/>
  <path d="M 560 356 C 520 356, 500 270, 470 250" fill="none" stroke="#D97A2B" stroke-width="6" stroke-dasharray="16 11" stroke-linecap="round"/>
  <path d="M 560 495 C 515 495, 515 650, 470 650" fill="none" stroke="#2E7D5B" stroke-width="8" stroke-linecap="round"/>

  <!-- Jiantan node -->
  <circle cx="560" cy="356" r="12" fill="#FFFFFF" stroke="#B8442D" stroke-width="6"/>
  <text x="584" y="340" font-size="17" font-weight="700" fill="#102A2B">劍潭站</text>
  <text x="380" y="338" font-size="16" font-weight="700" fill="#9A4F12" text-anchor="middle">小 15 公車（虛線）</text>

  <!-- hub -->
  <rect x="560" y="425" width="280" height="90" rx="20" fill="#0D6B68"/>
  <text x="700" y="465" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">台北車站</text>
  <text x="700" y="497" font-size="18" fill="#E6F2F1" text-anchor="middle">起點</text>

  <!-- C1 Jiannan Road, free -->
  <rect x="1060" y="124" width="500" height="128" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="1080" y="138" width="96" height="30" rx="15" fill="#0D6B68"/>
