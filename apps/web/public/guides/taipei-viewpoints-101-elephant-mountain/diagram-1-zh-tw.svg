  <text x="584" y="674" font-size="16" fill="#102A2B">清晨、黃昏：象山</text>
  <text x="584" y="702" font-size="16" fill="#102A2B">夕陽：大稻埕碼頭</text>
  <text x="584" y="730" font-size="16" fill="#102A2B">夜景：貓空、文間山平台</text>
  <text x="584" y="758" font-size="16" fill="#102A2B">白天：擎天崗</text>
  <text x="584" y="786" font-size="16" fill="#102A2B">雨天：台北 101 室內觀景台</text>

