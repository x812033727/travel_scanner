<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北六大觀景點：從台北車站出發</title>
  <desc id="desc">以台北車站為起點的示意圖，青綠框為免費、紫框為收費。右側由上而下：文湖線到劍南路站（22 分、NT$30），文間山平台夜景，免費；淡水信義線到台北 101／世貿站（14 分、NT$25），觀景台全票 NT$600、101 樓加價 NT$380、10:00–21:00、20:15 最後入場，入口在辦公大樓 1 樓，收費；淡水信義線到象山站 2 號出口（15 分、NT$25），步道約 1.5 公里、全程約 1 小時 40 分，免費，部分路段施工，預計 2027 年 4 月 13 日前完工；文湖線到動物園站（25 分、NT$35）搭貓空纜車，單程 NT$180、一日票 NT$300，平日 09:00–21:00、例假日 09:00–22:00，收費。左側：淡水信義線到劍潭站（10 分、NT$20）轉小 15 公車（虛線）到擎天崗，平日首末班 05:40–16:20、例假日至 17:30，免費；松山新店線到北門站（5 分、NT$20）或大橋頭站（8 分、NT$20），前往大稻埕碼頭看淡水河夕陽，免費。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="36" font-weight="700" fill="#102A2B">台北六大觀景點　從台北車站出發</text>
  <text x="60" y="98" font-size="20" fill="#5C6B6B">示意圖，非精確比例・捷運為成人單程票價與車程・2026 年 9 月 21 日查核</text>

