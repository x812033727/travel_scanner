  <text x="1190" y="162" font-size="24" font-weight="700" fill="#102A2B">文間山平台</text>
  <text x="1080" y="198" font-size="17" fill="#102A2B">捷運劍南路站・22 分・NT$30</text>
  <text x="1080" y="226" font-size="17" fill="#5C6B6B">連接劍南路的夜景平台・自然步道</text>

