<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北六大觀景點交通示意圖 / Six Taipei viewpoints and how to reach them from Taipei Main Station</title>
  <desc id="desc">以台北車站為起點的示意圖，青綠框為免費、紫框為收費。右側由上而下：文湖線到劍南路站（22 分、NT$30），文間山平台夜景，免費；淡水信義線到台北101/世貿站（14 分、NT$25），觀景台全票 NT$600、101 樓加價 NT$380、10:00–21:00、20:15 最後入場，入口改在辦公大樓 1 樓，收費；淡水信義線到象山站 2 號出口（15 分、NT$25），步道約 1.5 公里、全程約 1 小時 40 分，免費，部分路段施工封閉至 2027 年 4 月 13 日；文湖線到動物園站（25 分、NT$35）搭貓空纜車，單程 NT$180、一日票 NT$300，平日 09:00–21:00、假日 09:00–22:00，收費。左側：淡水信義線到劍潭站（10 分、NT$20）轉小15 公車（虛線）到擎天崗，平日班次 05:40–16:20、假日至 17:30，免費；松山新店線到北門站（5 分、NT$20）或大橋頭站（8 分、NT$20）到大稻埕碼頭看淡水河夕陽，免費。Schematic map centred on Taipei Main Station; teal cards are free, purple cards need a ticket. Right, top to bottom: Wenhu Line to Jiannan Rd. (22 min, NT$30) for the free Wenjianshan platform night view; Tamsui-Xinyi Line to Taipei 101/World Trade Center (14 min, NT$25) for the paid observatory, NT$600 adult, NT$380 extra for the 101st floor, 10:00 to 21:00 with last entry 20:15, entrance now on Office Tower 1F; Tamsui-Xinyi Line to Xiangshan Exit 2 (15 min, NT$25) for free Elephant Mountain, trail about 1.5 km and about 1 hour 40 minutes in all, partly closed until 13 April 2027; Wenhu Line to Taipei Zoo (25 min, NT$35) for the paid Maokong Gondola, NT$180 a ride or NT$300 a day, 09:00 to 21:00 on weekdays and 09:00 to 22:00 at weekends. Left: Tamsui-Xinyi Line to Jiantan (10 min, NT$20) and bus 小15 (dashed) to free Qingtiangang, weekday departures 05:40 to 16:20 and to 17:30 at weekends; Songshan-Xindian Line to Beimen (5 min, NT$20) or Daqiaotou (8 min, NT$20) for the free sunset at Dadaocheng Wharf.</desc>
