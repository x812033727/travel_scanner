<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">警示帳戶的通報、限制與解除 / How a deposit account gets flagged and unflagged</title>
  <desc id="desc">由上而下的流程圖。最上排是三個常見起點：借出帳戶或提供帳號做代收轉付、求職或網拍被當成收款帳戶、自己被騙後贓款匯入再依指示轉出。三者都指向同一個動作：法院、檢察署或司法警察機關為偵辦刑事案件通報銀行；重大緊急案件得先以電話或傳真通知，五個營業日內補辦公文書。通報之後分成兩個框：左邊的警示帳戶是被通報的那一個，暫停該帳戶全部交易功能，匯入款項逕以退匯退回匯款行，提款、轉帳與臨櫃一併停止，警示期限自通報時起逾二年自動失效；右邊與它連動的衍生管制帳戶是同一開戶人名下的其他帳戶，暫停提款卡與語音、網路轉帳，暫停其他電子支付功能，臨櫃須說明交易合理性，異常情形消滅經查證後應即解除。最下方是僅有的兩條解除路徑：依原通報機關之通報解除，開戶人有疑義洽原通報機關處理；或警示期限屆滿，逾二年自動失效，延長以一次及一年為限。銀行沒有自行解除的權限。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">警示帳戶怎麼來、怎麼解除</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">How an account gets flagged, and the only two ways out</text>

  <text x="60" y="128" font-size="18" fill="#5C6B6B">常見起點：帳戶的控制權離開自己</text>

  <rect x="60" y="146" width="470" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="295" y="192" font-size="17" fill="#102A2B" text-anchor="middle">借出帳戶或提供帳號</text>
  <text x="295" y="224" font-size="17" fill="#102A2B" text-anchor="middle">代收轉付、朋友周轉</text>

  <rect x="565" y="146" width="470" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="192" font-size="17" fill="#102A2B" text-anchor="middle">求職、網拍被當收款帳戶</text>
  <text x="800" y="224" font-size="17" fill="#102A2B" text-anchor="middle">交出存摺、金融卡與密碼</text>

  <rect x="1070" y="146" width="470" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1305" y="192" font-size="17" fill="#102A2B" text-anchor="middle">自己被騙，贓款匯入</text>
  <text x="1305" y="224" font-size="17" fill="#102A2B" text-anchor="middle">再依對方指示轉出</text>

  <line x1="295" y1="264" x2="295" y2="302" stroke="#5C6B6B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="800" y1="264" x2="800" y2="302" stroke="#5C6B6B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1305" y1="264" x2="1305" y2="302" stroke="#5C6B6B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="60" y="310" width="1480" height="96" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="352" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">法院、檢察署或司法警察機關為偵辦刑事案件通報銀行</text>
  <text x="800" y="382" font-size="16" fill="#5C6B6B" text-anchor="middle">重大緊急案件得先以電話或傳真通知，五個營業日內補辦公文書</text>

  <line x1="410" y1="414" x2="410" y2="444" stroke="#5C6B6B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="60" y="452" width="700" height="200" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="410" y="496" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">警示帳戶：被通報的那一個</text>
  <text x="410" y="534" font-size="17" fill="#102A2B" text-anchor="middle">暫停該帳戶全部交易功能</text>
  <text x="410" y="566" font-size="17" fill="#102A2B" text-anchor="middle">匯入款項逕以退匯退回匯款行</text>
  <text x="410" y="598" font-size="17" fill="#102A2B" text-anchor="middle">提款、轉帳與臨櫃一併停止</text>
  <text x="410" y="630" font-size="16" fill="#5C6B6B" text-anchor="middle">警示期限自通報時起逾二年自動失效</text>

  <text x="800" y="528" font-size="15" fill="#5C6B6B" text-anchor="middle">連動</text>
  <line x1="770" y1="552" x2="828" y2="552" stroke="#5C6B6B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="840" y="452" width="700" height="200" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1190" y="496" font-size="20" font-weight="700" fill="#D97A2B" text-anchor="middle">衍生管制帳戶：名下其他帳戶</text>
  <text x="1190" y="534" font-size="17" fill="#102A2B" text-anchor="middle">暫停提款卡與語音、網路轉帳</text>
  <text x="1190" y="566" font-size="17" fill="#102A2B" text-anchor="middle">暫停其他電子支付功能</text>
  <text x="1190" y="598" font-size="17" fill="#102A2B" text-anchor="middle">臨櫃須說明交易合理性</text>
  <text x="1190" y="630" font-size="16" fill="#5C6B6B" text-anchor="middle">異常情形消滅經查證後應即解除</text>

  <text x="60" y="692" font-size="18" fill="#5C6B6B">解除的兩條路：銀行沒有自行解除的權限</text>

  <rect x="60" y="710" width="700" height="110" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="410" y="754" font-size="18" font-weight="700" fill="#2E7D5B" text-anchor="middle">依原通報機關之通報解除</text>
  <text x="410" y="790" font-size="16" fill="#5C6B6B" text-anchor="middle">開戶人有疑義洽原通報機關處理</text>

  <rect x="840" y="710" width="700" height="110" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1190" y="754" font-size="18" font-weight="700" fill="#2E7D5B" text-anchor="middle">警示期限屆滿</text>
  <text x="1190" y="790" font-size="16" fill="#5C6B6B" text-anchor="middle">逾二年自動失效，延長以一次及一年為限</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
