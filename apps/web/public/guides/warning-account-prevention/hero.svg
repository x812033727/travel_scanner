<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">守住帳戶的控制權 / Keeping control of your own bank account</title>
  <desc id="desc">插圖。畫面左側是一面淺綠底、深綠邊的大盾牌，盾牌裡放著一張白色存摺樣式的卡片，卡片上有一條深綠色的色帶與兩條灰色線條，卡片下方是一個深綠色的鑰匙孔。畫面右側有三支同樣粗細、同樣長度的橘色箭頭由右往左指向盾牌，代表三種要求交出帳戶的情境，但都被擋在盾牌外面沒有進入。畫面下方置中寫著一行字：帳戶只給自己用。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <path d="M 270 190 Q 270 150 310 150 L 670 150 Q 710 150 710 190 L 710 450 Q 710 570 490 670 Q 270 570 270 450 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10"/>

  <rect x="350" y="270" width="280" height="170" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <rect x="374" y="302" width="232" height="30" rx="8" fill="#0D6B68"/>
  <rect x="374" y="354" width="232" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="374" y="388" width="170" height="14" rx="7" fill="#5C6B6B"/>

  <circle cx="490" cy="510" r="30" fill="#0D6B68"/>
  <path d="M 475 528 L 505 528 L 513 576 L 467 576 Z" fill="#0D6B68"/>

  <defs>
    <marker id="block" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#D97A2B"/>
    </marker>
  </defs>

  <line x1="1400" y1="250" x2="768" y2="250" stroke="#D97A2B" stroke-width="14" stroke-linecap="butt" marker-end="url(#block)"/>
  <line x1="1400" y1="380" x2="768" y2="380" stroke="#D97A2B" stroke-width="14" stroke-linecap="butt" marker-end="url(#block)"/>
  <line x1="1400" y1="510" x2="784" y2="510" stroke="#D97A2B" stroke-width="14" stroke-linecap="butt" marker-end="url(#block)"/>

  <text x="835" y="772" font-size="48" font-weight="700" fill="#102A2B" text-anchor="middle">帳戶只給自己用</text>
</svg>
