<rect x="60" y="640" width="1480" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="694" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">一張「東西在哪裡」的索引</text>
<text x="800" y="730" text-anchor="middle" font-size="18" fill="#5C6B6B">家人不必懂你的分類邏輯，照著這一頁就能找</text>
<text x="800" y="788" text-anchor="middle" font-size="22" fill="#102A2B">每一列只回答四件事：這是什麼 · 正本在哪裡 · 電子檔在哪裡 · 要找誰</text>

