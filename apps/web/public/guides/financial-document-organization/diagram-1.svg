<text x="993" y="496" text-anchor="middle" font-size="22" font-weight="700" fill="#D97A2B">二年到五年</text>

<rect x="1215" y="170" width="325" height="370" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
