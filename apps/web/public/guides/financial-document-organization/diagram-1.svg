<text x="608" y="210" text-anchor="middle" font-size="17" fill="#5C6B6B">時機二</text>
<text x="608" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">每年五月要用</text>
<text x="608" y="316" text-anchor="middle" font-size="18" fill="#102A2B">稅單與扣繳憑單</text>
<text x="608" y="350" text-anchor="middle" font-size="18" fill="#102A2B">保費與捐贈收據</text>
<text x="608" y="384" text-anchor="middle" font-size="18" fill="#102A2B">購屋借款利息證明</text>
