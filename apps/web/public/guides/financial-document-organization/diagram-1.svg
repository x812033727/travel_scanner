<text x="1378" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">幾年才一次</text>
<text x="1378" y="316" text-anchor="middle" font-size="18" fill="#102A2B">不動產所有權狀</text>
<text x="1378" y="350" text-anchor="middle" font-size="18" fill="#102A2B">車輛行照與登記書</text>
<text x="1378" y="384" text-anchor="middle" font-size="18" fill="#102A2B">勞保勞退年資紀錄</text>
<path d="M 1243 422 H 1512" fill="none" stroke="#2E7D5B" stroke-width="3"/>
