<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">財務文件依「什麼時候會用到」分四格 / Filing by when you will need it</title>
<desc id="desc">四個並排的欄位代表四個使用時機。第一格「隨時可能要用」放身分證與護照、健保卡與駕照、印鑑與自然人憑證，保存期限是有效期限內。第二格「每年五月要用」放稅單與扣繳憑單、保費與捐贈收據、購屋借款利息證明，保存期限是申報後五年。第三格「出事那一天要用」放保單條款與批註、貸款契約、銀行與投資對帳單，保存期限是二年到五年。第四格「幾年才一次」放不動產所有權狀、車輛行照與登記書、勞保勞退年資紀錄，保存期限是持有期間全程。四格下方是一張「東西在哪裡」的索引，四個箭頭由索引指向四格；索引的每一列回答這是什麼、正本在哪裡、電子檔在哪裡、要找誰。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">財務文件依「什麼時候會用到」分四格</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Filing by when you will need it · 七類文件，四個時機，一張索引</text>
<text x="60" y="134" font-size="20" fill="#5C6B6B">分格的依據是使用時機，不是文件類型；每一格再決定保存期限。</text>

