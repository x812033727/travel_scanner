<text x="223" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">隨時可能要用</text>
<text x="223" y="316" text-anchor="middle" font-size="18" fill="#102A2B">身分證與護照</text>
<text x="223" y="350" text-anchor="middle" font-size="18" fill="#102A2B">健保卡與駕照</text>
<text x="223" y="384" text-anchor="middle" font-size="18" fill="#102A2B">印鑑與自然人憑證</text>
