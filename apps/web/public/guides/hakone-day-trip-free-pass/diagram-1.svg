<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">箱根黃金路線環狀圖 / Hakone Golden Course loop with minutes and fares</title>
  <desc id="desc">新宿搭浪漫特快約 80 分鐘到箱根湯本（特急券 1,200 日圓），箱根登山電車約 40 分鐘到強羅（460 日圓），登山纜車約 10 分鐘到早雲山（430 日圓），空中纜車經大涌谷到桃源台每段約 10 分鐘、全線約 30 分鐘（均一單程 2,000 日圓），海賊船約 25 到 40 分鐘到元箱根港與箱根町港（1,700 日圓，兩港之間 600 日圓），登山巴士回箱根湯本抓 50 分鐘（1,220 日圓）。山內一圈單程合計 5,810 日圓，箱根周遊券新宿出發 2 日 7,100 日圓、3 日 7,500 日圓全部涵蓋。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="60" font-size="34" font-weight="700" fill="#102A2B">箱根ゴールデンコース　Hakone Golden Course 環狀路線</text>
  <text x="60" y="96" font-size="19" fill="#5C6B6B">分鐘數為官網概略車程，票價為 2025 年 10 月 1 日起的大人單程；2026 年 9 月查證</text>

  <!-- pass box -->
  <rect x="1180" y="40" width="380" height="120" rx="16" fill="#0D6B68"/>
  <text x="1370" y="78" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">箱根フリーパス Hakone Freepass</text>
  <text x="1370" y="108" font-size="19" fill="#E6F2F1" text-anchor="middle">新宿發 2 日 7,100 日圓 · 3 日 7,500 日圓</text>
  <text x="1370" y="138" font-size="17" fill="#E6F2F1" text-anchor="middle">八種交通無限搭 · 浪漫特快特急券另加</text>

  <!-- Romancecar: Shinjuku -> Hakone-Yumoto -->
  <rect x="60" y="140" width="220" height="70" rx="16" fill="#7E57C2"/>
  <text x="170" y="184" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">新宿 Shinjuku</text>
  <line x1="170" y1="210" x2="260" y2="560" stroke="#7E57C2" stroke-width="10" stroke-linecap="round"/>
  <text x="215" y="290" font-size="18" font-weight="700" fill="#7E57C2">ロマンスカー Romancecar</text>
  <text x="215" y="316" font-size="18" fill="#102A2B">約 80 分 · 特急券 1,200 日圓</text>

  <!-- Tozan Railway: Yumoto -> Gora -->
  <line x1="260" y1="560" x2="500" y2="330" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <text x="420" y="430" font-size="18" font-weight="700" fill="#0D6B68">箱根登山電車 Tozan Railway</text>
  <text x="420" y="456" font-size="18" fill="#102A2B">約 40 分 · 460 日圓</text>

  <!-- Cable car: Gora -> Sounzan -->
  <line x1="500" y1="330" x2="720" y2="200" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round"/>
  <text x="570" y="300" font-size="18" font-weight="700" fill="#6B4A3A">ケーブルカー Cable Car</text>
  <text x="570" y="326" font-size="18" fill="#102A2B">約 10 分 · 430 日圓</text>

  <!-- Ropeway: Sounzan -> Owakudani -> Togendai -->
  <path d="M 720 200 L 980 200 L 1260 320" fill="none" stroke="#B8442D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="240" font-size="18" font-weight="700" fill="#B8442D" text-anchor="middle">ロープウェイ Ropeway</text>
  <text x="850" y="266" font-size="18" fill="#102A2B" text-anchor="middle">各段約 10 分 · 全線約 30 分 · 全線單程 2,000 日圓</text>

  <!-- Cruise: Togendai -> Moto-Hakone -->
  <line x1="1260" y1="320" x2="1200" y2="660" stroke="#2F6F9F" stroke-width="12" stroke-linecap="round"/>
  <text x="1290" y="480" font-size="18" font-weight="700" fill="#2F6F9F">海賊船 Pirate Ship</text>
  <text x="1290" y="506" font-size="18" fill="#102A2B">約 25〜40 分 · 1,700 日圓</text>

  <!-- Bus: Moto-Hakone -> Yumoto (dashed) -->
  <path d="M 1200 660 C 1000 800, 500 800, 260 560" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"/>
  <text x="730" y="810" font-size="18" font-weight="700" fill="#2E7D5B" text-anchor="middle">箱根登山バス Tozan Bus（H 路線 經 芦之湯・宮之下）</text>
  <text x="730" y="836" font-size="18" fill="#102A2B" text-anchor="middle">抓 50 分 · 1,220 日圓</text>

  <!-- stations -->
  <g font-size="22" font-weight="700" fill="#102A2B">
    <circle cx="260" cy="560" r="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
    <text x="260" y="606" text-anchor="middle">箱根湯本 Hakone-Yumoto</text>
    <circle cx="500" cy="330" r="18" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"/>
    <text x="500" y="372" text-anchor="middle">強羅 Gōra</text>
    <circle cx="720" cy="200" r="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
    <text x="720" y="170" text-anchor="middle">早雲山 Sōunzan</text>
    <circle cx="980" cy="200" r="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"/>
    <text x="980" y="170" text-anchor="middle">大涌谷 Ōwakudani</text>
    <circle cx="1260" cy="320" r="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
    <text x="1290" y="330">桃源台 Tōgendai</text>
    <circle cx="1200" cy="660" r="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
    <text x="1200" y="705" text-anchor="middle">元箱根港・箱根町港 Moto-Hakone / Hakone-machi</text>
  </g>
  <text x="1200" y="731" font-size="16" fill="#5C6B6B" text-anchor="middle">箱根神社 · 箱根関所 · 兩港之間 600 日圓</text>
  <text x="980" y="140" font-size="16" fill="#5C6B6B" text-anchor="middle">黒たまご · 火山氣體時會管制</text>

  <!-- sum box -->
  <rect x="60" y="780" width="430" height="76" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="84" y="810" font-size="18" font-weight="700" fill="#102A2B">山內一圈單程合計 5,810 日圓</text>
  <text x="84" y="838" font-size="16" fill="#5C6B6B">周遊券 2 日 7,100 日圓已含，繞一圈就划算</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <line x1="560" y1="876" x2="600" y2="876" stroke="#7E57C2" stroke-width="8" stroke-linecap="round"/>
    <text x="608" y="882">浪漫特快</text>
    <line x1="700" y1="876" x2="740" y2="876" stroke="#0D6B68" stroke-width="8" stroke-linecap="round"/>
    <text x="748" y="882">登山電車</text>
    <line x1="840" y1="876" x2="880" y2="876" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round"/>
    <text x="888" y="882">登山纜車</text>
    <line x1="980" y1="876" x2="1020" y2="876" stroke="#B8442D" stroke-width="8" stroke-linecap="round"/>
    <text x="1028" y="882">空中纜車</text>
    <line x1="1120" y1="876" x2="1160" y2="876" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
    <text x="1168" y="882">海賊船</text>
    <line x1="1240" y1="876" x2="1280" y2="876" stroke="#2E7D5B" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
    <text x="1288" y="882">巴士 Bus</text>
    <text x="1380" y="882" fill="#5C6B6B">© Mokaair 製圖 2026</text>
  </g>
</svg>
