<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Inter',system-ui,sans-serif">
  <title id="title">Da Nang &amp; Hoi An 4-Day Itinerary — Zone &amp; Route Map</title>
  <desc id="desc">Simplified schematic map of Da Nang and Hoi An (not to scale; adult fares verified September 2026). To the right is the East Sea (Biển Đông), with Son Tra Peninsula (Sơn Trà) and the free Linh Ung Pagoda (Chùa Linh Ứng) at upper right. In the center is Day 1 downtown Da Nang (Đà Nẵng): Han Market (Chợ Hàn), Han River (Sông Hàn), My Khe Beach (Mỹ Khê, free), and Dragon Bridge (Cầu Rồng, fire show Fri–Sun at 21:00), with Da Nang Airport (DAD) about 3 km to the west. On the left is Day 2 Sun World Ba Na Hills (Bà Nà Hills), with a 1,000,000 VND standard cable car fare, Golden Bridge (Cầu Vàng), French Village (Làng Pháp), and 22:00 park closing time, reached by Grab, private car, or free Wow Bus. About 8 km south of downtown is Day 4 Marble Mountains (Ngũ Hành Sơn, admission 40,000 VND, one-way elevator 15,000 VND). Further south is Day 3 Hoi An Ancient Town (Hội An, foreign-visitor ticket 120,000 VND, Japanese Covered Bridge / Chùa Cầu, pedestrian zone 09:00–21:30 and until 21:00 in winter, An Bang Beach about 10 minutes by car); the direct drive from the airport to Hoi An is 29 km and about 50 minutes. At lower left is the Day 4 alternative, My Son Sanctuary (Mỹ Sơn, admission 150,000 VND, open 06:00–17:00, 45 km from Hoi An and 68 km from Da Nang). Solid lines show main taxi or Grab drives; dashed lines show shuttle, private car, or day-tour routes.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">Da Nang &amp; Hoi An 4-Day Itinerary · Zone &amp; Route Map</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Đà Nẵng · Hội An · Schematic map, not to scale · Adult fares verified Sep 2026</text>

  <!-- sea and coast -->
  <path d="M 1180 120 L 1600 120 L 1600 860 L 1285 860 C 1265 680, 1250 480, 1235 300 C 1225 240, 1200 180, 1180 120 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1445" y="512" font-size="18" font-weight="700" fill="#3F6C7A" text-anchor="middle">East Sea</text>
  <text x="1445" y="538" font-size="16" font-weight="700" fill="#3F6C7A" text-anchor="middle">Biển Đông</text>
  <path d="M 1238 305 C 1246 380, 1252 460, 1260 545" fill="none" stroke="#D9B96A" stroke-width="10" stroke-linecap="round"/>
  <text x="1226" y="376" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">My Khe Beach (Mỹ Khê)</text>
  <text x="1226" y="398" font-size="15" fill="#0D6B68" text-anchor="end">Free public beach</text>

  <!-- Son Tra peninsula -->
  <path d="M 1195 205 C 1240 148, 1480 144, 1535 205 C 1500 266, 1300 280, 1195 254 Z" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/>
  <text x="1365" y="202" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">Son Tra · Sơn Trà</text>
  <text x="1365" y="228" font-size="15" fill="#5C6B6B" text-anchor="middle">Linh Ung Pagoda (Free)</text>
  <text x="1365" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">Chùa Linh Ứng</text>
  <line x1="1135" y1="228" x2="1195" y2="228" stroke="#0D6B68" stroke-width="3"/>

  <!-- connectors -->
  <line x1="460" y1="265" x2="626" y2="265" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="543" y="294" font-size="15" font-weight="700" fill="#6B4A3A" text-anchor="middle">West uphill</text>
  <line x1="654" y1="265" x2="745" y2="265" stroke="#102A2B" stroke-width="4"/>
  <text x="700" y="252" font-size="15" fill="#5C6B6B" text-anchor="middle">~3 km</text>
  <path d="M 640 279 L 640 690 L 820 690" fill="none" stroke="#B8442D" stroke-width="4"/>
  <text x="622" y="510" font-size="15" font-weight="700" fill="#B8442D" text-anchor="end">Airport → Hoi An</text>
  <text x="622" y="532" font-size="15" font-weight="700" fill="#B8442D" text-anchor="end">29 km · ~50 min</text>
  <line x1="940" y1="340" x2="940" y2="420" stroke="#2F6F9F" stroke-width="4"/>
  <text x="954" y="386" font-size="15" fill="#2F6F9F">~8 km</text>
  <line x1="940" y1="552" x2="940" y2="635" stroke="#B8442D" stroke-width="4"/>
  <text x="954" y="598" font-size="15" fill="#5C6B6B">En route back</text>
  <line x1="820" y1="748" x2="460" y2="748" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="640" y="736" font-size="15" font-weight="700" fill="#2E7D5B" text-anchor="middle">45 km · Private car or day tour</text>

  <!-- airport -->
  <circle cx="640" cy="265" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="640" y="218" font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">Da Nang Airport</text>
  <text x="640" y="238" font-size="15" font-weight="700" fill="#5C6B6B" text-anchor="middle">(DAD)</text>

  <!-- Day 1: Da Nang city -->
  <rect x="745" y="185" width="390" height="155" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <text x="940" y="218" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 1 · Da Nang (Đà Nẵng)</text>
  <text x="940" y="246" font-size="15" fill="#5C6B6B" text-anchor="middle">Han Market (Chợ Hàn) · Han River</text>
  <text x="940" y="270" font-size="15" fill="#5C6B6B" text-anchor="middle">Dragon Bridge · Fire show Fri–Sun 21:00</text>
  <text x="940" y="294" font-size="15" fill="#5C6B6B" text-anchor="middle">My Khe Beach (Mỹ Khê) · Free, across bridge</text>
  <text x="940" y="318" font-size="15" fill="#5C6B6B" text-anchor="middle">Linh Ung Pagoda on Son Tra (top right)</text>

  <!-- Day 2: Ba Na Hills -->
  <rect x="50" y="185" width="410" height="155" rx="20" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <text x="255" y="218" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 2 · Ba Na Hills (Bà Nà)</text>
  <text x="255" y="246" font-size="15" fill="#5C6B6B" text-anchor="middle">Sun World · Standard fare 1,000,000 VND</text>
  <text x="255" y="270" font-size="15" fill="#5C6B6B" text-anchor="middle">Golden Bridge (Cầu Vàng) · French Village</text>
  <text x="255" y="294" font-size="15" fill="#5C6B6B" text-anchor="middle">Closes 22:00 · Check official cable car hours</text>
  <text x="255" y="318" font-size="15" fill="#5C6B6B" text-anchor="middle">Grab · Private car · Free Wow Bus</text>

  <!-- Day 4: Marble Mountains -->
  <rect x="820" y="420" width="390" height="132" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1015" y="452" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 · Marble Mountains</text>
  <text x="1015" y="480" font-size="15" fill="#5C6B6B" text-anchor="middle">Ngũ Hành Sơn · Thuy Son &amp; Huyen Khong Cave</text>
  <text x="1015" y="504" font-size="15" fill="#5C6B6B" text-anchor="middle">Entry 40,000 VND · Elevator 15,000 one-way</text>
  <text x="1015" y="528" font-size="15" fill="#5C6B6B" text-anchor="middle">Stairs or elevator · Best in morning</text>

  <!-- Day 3: Hoi An -->
  <rect x="820" y="635" width="390" height="158" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1015" y="668" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 3 · Hoi An (Hội An)</text>
  <text x="1015" y="696" font-size="15" fill="#5C6B6B" text-anchor="middle">Ticket 120,000 VND (foreign visitors)</text>
  <text x="1015" y="720" font-size="15" fill="#5C6B6B" text-anchor="middle">Japanese Bridge (Chùa Cầu) · Lanterns · Boats</text>
  <text x="1015" y="744" font-size="15" fill="#5C6B6B" text-anchor="middle">Pedestrian zone 09:00–21:30 (21:00 winter)</text>
  <text x="1015" y="768" font-size="15" fill="#5C6B6B" text-anchor="middle">An Bang Beach (An Bàng) · ~10 min drive</text>

  <!-- Day 4 alternative: My Son -->
  <rect x="50" y="635" width="410" height="158" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <text x="255" y="668" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 Alt · My Son (Mỹ Sơn)</text>
  <text x="255" y="696" font-size="15" fill="#5C6B6B" text-anchor="middle">Champa ruins · Admission 150,000 VND</text>
  <text x="255" y="720" font-size="15" fill="#5C6B6B" text-anchor="middle">Open daily 06:00–17:00</text>
  <text x="255" y="744" font-size="15" fill="#5C6B6B" text-anchor="middle">45 km from Hoi An · 68 km from Da Nang</text>
  <text x="255" y="768" font-size="15" fill="#5C6B6B" text-anchor="middle">Private car or day tour · Leave airport buffer</text>

