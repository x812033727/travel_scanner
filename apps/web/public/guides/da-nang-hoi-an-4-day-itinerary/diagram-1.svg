<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">峴港會安四天三夜分區路線示意圖 / Da Nang and Hoi An four-day zones</title>
  <desc id="desc">簡化的峴港與會安示意地圖。右側是東海，右上角是山茶半島與免費的靈應寺；中央是 Day 1 的峴港市區：韓市場、美溪海灘、週五六日 21:00 噴火的龍橋，機場在市區西側約 3 公里。左側是 Day 2 的巴拿山 Sun World，纜車票原價 1,000,000 越南盾、22:00 關園，用 Grab、包車或免費 Wow Bus 上山。市區往南約 8 公里是 Day 4 的五行山，門票 40,000、電梯單程 15,000 越南盾；再往南是 Day 3 的會安古鎮，門票 120,000 越南盾、步行街 09:00 到 21:30，安邦海灘約 10 分鐘車程；機場到會安約 29 公里、約 50 分鐘。左下角是 Day 4 的替代方案美山聖地，門票 150,000 越南盾、06:00 到 17:00 開放，離會安 45 公里、離峴港 68 公里；虛線代表接駁、包車或一日遊。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">峴港會安四天三夜　四天分區路線示意圖</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Đà Nẵng · Hội An · 示意圖，非精確比例 · 成人票價，2026 年 9 月查證</text>

  <!-- sea and coast -->
  <path d="M 1180 120 L 1600 120 L 1600 860 L 1285 860 C 1265 680, 1250 480, 1235 300 C 1225 240, 1200 180, 1180 120 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1450" y="520" font-size="18" font-weight="700" fill="#3F6C7A" text-anchor="middle">東海 Biển Đông</text>
  <path d="M 1238 305 C 1246 380, 1252 460, 1260 545" fill="none" stroke="#D9B96A" stroke-width="10" stroke-linecap="round"/>
  <text x="1225" y="392" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">美溪海灘 Mỹ Khê 免費</text>

  <!-- Son Tra peninsula -->
  <path d="M 1200 205 C 1240 152, 1440 148, 1490 205 C 1460 262, 1290 276, 1200 252 Z" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/>
  <text x="1345" y="206" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">山茶半島 Sơn Trà</text>
  <text x="1345" y="234" font-size="15" fill="#5C6B6B" text-anchor="middle">靈應寺 Chùa Linh Ứng 免費</text>
  <line x1="1120" y1="230" x2="1200" y2="228" stroke="#0D6B68" stroke-width="3"/>

  <!-- connectors -->
  <line x1="460" y1="265" x2="624" y2="265" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="542" y="292" font-size="15" font-weight="700" fill="#6B4A3A" text-anchor="middle">往西上山</text>
  <line x1="654" y1="265" x2="760" y2="265" stroke="#102A2B" stroke-width="4"/>
  <text x="707" y="252" font-size="15" fill="#5C6B6B" text-anchor="middle">約 3 km</text>
  <path d="M 640 279 L 640 700 L 860 700" fill="none" stroke="#B8442D" stroke-width="4"/>
  <text x="652" y="560" font-size="15" font-weight="700" fill="#B8442D">機場 → 會安 29 km · 約 50 分</text>
  <line x1="940" y1="340" x2="940" y2="430" stroke="#2F6F9F" stroke-width="4"/>
  <text x="952" y="390" font-size="15" fill="#2F6F9F">約 8 km</text>
  <line x1="940" y1="540" x2="940" y2="640" stroke="#B8442D" stroke-width="4"/>
  <text x="952" y="595" font-size="15" fill="#5C6B6B">回程順路</text>
  <line x1="860" y1="740" x2="460" y2="740" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="660" y="728" font-size="15" font-weight="700" fill="#2E7D5B" text-anchor="middle">45 km · 包車或一日遊</text>

  <!-- airport -->
  <circle cx="640" cy="265" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="640" y="235" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">峴港機場 DAD</text>

  <!-- Day 1: Da Nang city -->
  <rect x="760" y="190" width="360" height="150" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <text x="940" y="222" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Day 1 峴港市區 Đà Nẵng</text>
  <text x="940" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">韓市場 Chợ Hàn · 韓江 Sông Hàn</text>
  <text x="940" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">龍橋 Cầu Rồng 週五六日 21:00 噴火</text>
  <text x="940" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">美溪海灘 Mỹ Khê 免費 · 過橋就到</text>
  <text x="940" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">靈應寺在山茶半島（右上）</text>

  <!-- Day 2: Ba Na Hills -->
  <rect x="80" y="190" width="380" height="150" rx="20" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <text x="270" y="222" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Day 2 巴拿山 Bà Nà Hills</text>
  <text x="270" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">Sun World · 纜車票原價 1,000,000 越南盾</text>
  <text x="270" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">黃金橋 Cầu Vàng · 法國村 Làng Pháp</text>
  <text x="270" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">22:00 關園 · 纜車時段以官網為準</text>
  <text x="270" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">Grab／包車／免費 Wow Bus 上山</text>

  <!-- Day 4: Marble Mountains -->
  <rect x="860" y="430" width="330" height="110" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1025" y="462" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 五行山 Ngũ Hành Sơn</text>
  <text x="1025" y="490" font-size="15" fill="#5C6B6B" text-anchor="middle">門票 40,000 · 電梯單程 15,000 越南盾</text>
  <text x="1025" y="514" font-size="15" fill="#5C6B6B" text-anchor="middle">石階或電梯上水山峰 · 玄空洞 · 早上去</text>

  <!-- Day 3: Hoi An -->
  <rect x="860" y="640" width="330" height="150" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1025" y="672" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Day 3 會安 Hội An</text>
  <text x="1025" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">古鎮門票 120,000 越南盾（外國旅客）</text>
  <text x="1025" y="724" font-size="15" fill="#5C6B6B" text-anchor="middle">日本橋 Chùa Cầu · 燈籠夜景 · 河上小船</text>
  <text x="1025" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">步行街 09:00–21:30（冬季到 21:00）</text>
  <text x="1025" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">安邦海灘 An Bàng 約 10 分車程</text>

  <!-- Day 4 alternative: My Son -->
  <rect x="80" y="640" width="380" height="150" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <text x="270" y="672" font-size="22" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 替代　美山聖地 Mỹ Sơn</text>
  <text x="270" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">占婆遺址 · 門票 150,000 越南盾</text>
  <text x="270" y="724" font-size="15" fill="#5C6B6B" text-anchor="middle">06:00 開放 · 17:00 關閉</text>
  <text x="270" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">離會安 45 km · 離峴港 68 km</text>
  <text x="270" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">包車或一日遊，回機場時間抓寬</text>

  <!-- legend -->
  <g font-size="15" fill="#102A2B">
    <line x1="60" y1="880" x2="110" y2="880" stroke="#102A2B" stroke-width="4"/><text x="120" y="885">主要車程（Grab／計程車）</text>
    <line x1="330" y1="880" x2="380" y2="880" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/><text x="390" y="885">接駁／包車／一日遊（虛線）</text>
    <text x="1540" y="885" fill="#8A8F8F" font-size="15" text-anchor="end">© Mokaair 製圖 2026</text>
  </g>
</svg>
