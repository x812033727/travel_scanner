    <line x1="360" y1="880" x2="408" y2="880" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/><text x="420" y="885">셔틀 / 프라이빗 차량 / 일일 투어 (점선)</text>
    <text x="1540" y="885" fill="#8A8F8F" font-size="15" text-anchor="end">© Mokaair 제작 2026</text>
