<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Noto Sans','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <title id="title">다낭·호이안 3박 4일 구역별 동선 지도 / Da Nang and Hoi An four-day zones</title>
  <desc id="desc">다낭과 호이안 3박 4일 권역별 동선을 단순화해 나타낸 개념도이며, 2026년 9월 기준으로 확인한 성인 요금을 표시했어요. 오른쪽에는 베트남 동해(Biển Đông)가 있고, 오른쪽 위에는 선짜 반도와 무료 입장인 영흥사(린응사)가 자리해요. 중앙은 Day 1 구역인 다낭 시내로 한시장, 미케비치, 금·토·일 21:00에 불쇼가 열리는 용다리가 모여 있으며 다낭 공항은 시내 서쪽 약 3 km 거리에 있어요. 왼쪽은 Day 2 구역인 Sun World 바나힐로 케이블카 정가 1,000,000동, 폐장 시간 22:00이며 Grab, 프라이빗 차량 또는 무료 Wow Bus로 올라가요. 시내에서 남쪽으로 약 8 km 내려가면 Day 4 구역인 오행산(마블 마운틴)이 나오고 입장료는 40,000동, 엘리베이터는 편도 15,000동이에요. 그보다 남쪽은 Day 3 구역인 호이안 올드타운으로 외국인 입장권은 120,000동, 보행자 거리 운영은 09:00~21:30(겨울철 21:00까지), 안방비치는 차로 약 10분 거리이며, 공항에서 호이안까지는 약 29 km, 차로 약 50분 걸려요. 왼쪽 아래는 Day 4 대안 코스인 미선 유적지로 입장료 150,000동, 개방 시간 06:00~17:00이며 호이안에서 45 km, 다낭에서 68 km 떨어져 있어요. 점선은 셔틀, 프라이빗 차량 또는 일일 투어 이동 구간을 뜻해요.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">다낭·호이안 3박 4일 구역별 동선 지도</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Đà Nẵng · Hội An · 개념도(비축척) · 성인 요금 기준, 2026년 9월 확인</text>

  <!-- sea and coast -->
  <path d="M 1180 120 L 1600 120 L 1600 860 L 1285 860 C 1265 680, 1250 480, 1235 300 C 1225 240, 1200 180, 1180 120 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1445" y="510" font-size="18" font-weight="700" fill="#3F6C7A" text-anchor="middle">베트남 동해</text>
  <text x="1445" y="536" font-size="16" font-weight="700" fill="#3F6C7A" text-anchor="middle">Biển Đông</text>
  <path d="M 1238 305 C 1246 380, 1252 460, 1260 545" fill="none" stroke="#D9B96A" stroke-width="10" stroke-linecap="round"/>
  <text x="1225" y="392" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">미케비치 Mỹ Khê 무료</text>

  <!-- Son Tra peninsula -->
  <path d="M 1200 205 C 1240 152, 1450 148, 1505 205 C 1475 262, 1295 276, 1200 252 Z" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/>
  <text x="1352" y="206" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">선짜 반도 Sơn Trà</text>
  <text x="1352" y="234" font-size="15" fill="#5C6B6B" text-anchor="middle">영흥사 Chùa Linh Ứng 무료</text>
  <line x1="1120" y1="230" x2="1200" y2="228" stroke="#0D6B68" stroke-width="3"/>

  <!-- connectors -->
  <line x1="460" y1="265" x2="624" y2="265" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="542" y="292" font-size="15" font-weight="700" fill="#6B4A3A" text-anchor="middle">서쪽 산길 이동</text>
  <line x1="654" y1="265" x2="760" y2="265" stroke="#102A2B" stroke-width="4"/>
  <text x="707" y="252" font-size="15" fill="#5C6B6B" text-anchor="middle">약 3 km</text>
  <path d="M 640 279 L 640 700 L 850 700" fill="none" stroke="#B8442D" stroke-width="4"/>
  <text x="654" y="555" font-size="15" font-weight="700" fill="#B8442D">공항 → 호이안</text>
  <text x="654" y="578" font-size="15" font-weight="700" fill="#B8442D">29 km · 약 50분</text>
  <line x1="940" y1="340" x2="940" y2="430" stroke="#2F6F9F" stroke-width="4"/>
  <text x="952" y="390" font-size="15" fill="#2F6F9F">약 8 km</text>
  <line x1="940" y1="540" x2="940" y2="640" stroke="#B8442D" stroke-width="4"/>
  <text x="952" y="595" font-size="15" fill="#5C6B6B">돌아오는 길 경유</text>
  <line x1="850" y1="740" x2="460" y2="740" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="655" y="728" font-size="15" font-weight="700" fill="#2E7D5B" text-anchor="middle">45 km · 프라이빗 차량/투어</text>

  <!-- airport -->
  <circle cx="640" cy="265" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="640" y="230" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">다낭 공항 DAD</text>

  <!-- Day 1: Da Nang city -->
  <rect x="760" y="190" width="360" height="150" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <text x="940" y="222" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 1 다낭 시내 Đà Nẵng</text>
  <text x="940" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">한시장 Chợ Hàn · 한강 Sông Hàn</text>
  <text x="940" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">용다리 Cầu Rồng 금·토·일 21:00 불쇼</text>
  <text x="940" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">미케비치 Mỹ Khê 무료 · 다리 건너 바로</text>
  <text x="940" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">영흥사(린응사)는 선짜 반도(우측 상단)</text>

  <!-- Day 2: Ba Na Hills -->
  <rect x="60" y="190" width="400" height="150" rx="20" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <text x="260" y="222" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 2 바나힐 Bà Nà Hills</text>
  <text x="260" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">Sun World · 케이블카 정가 1,000,000동</text>
  <text x="260" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">골든브리지 Cầu Vàng · 프랑스 마을 Làng Pháp</text>
  <text x="260" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">22:00 폐장 · 케이블카 시간은 공식 사이트 확인</text>
  <text x="260" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">Grab / 프라이빗 차량 / 무료 Wow Bus 이동</text>

  <!-- Day 4: Marble Mountains -->
  <rect x="850" y="430" width="350" height="110" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1025" y="462" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 오행산 Ngũ Hành Sơn</text>
  <text x="1025" y="490" font-size="15" fill="#5C6B6B" text-anchor="middle">입장료 40,000동 · 엘리베이터 편도 15,000동</text>
  <text x="1025" y="514" font-size="15" fill="#5C6B6B" text-anchor="middle">계단/엘리베이터로 투이선 봉우리·후옌콩 동굴</text>

  <!-- Day 3: Hoi An -->
  <rect x="850" y="640" width="350" height="150" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1025" y="672" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 3 호이안 Hội An</text>
  <text x="1025" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">올드타운 입장권 120,000동 (외국인)</text>
  <text x="1025" y="724" font-size="15" fill="#5C6B6B" text-anchor="middle">내원교 Chùa Cầu · 등불 야경 · 나룻배</text>
  <text x="1025" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">보행자 거리 09:00~21:30 (겨울 ~21:00)</text>
  <text x="1025" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">안방비치 An Bàng 차로 약 10분</text>

  <!-- Day 4 alternative: My Son -->
  <rect x="60" y="640" width="400" height="150" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <text x="260" y="672" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 대안 · 미선 유적지 Mỹ Sơn</text>
  <text x="260" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">참파 왕국 유적 · 입장료 150,000동</text>
  <text x="260" y="724" font-size="15" fill="#5C6B6B" text-anchor="middle">개방 06:00 · 마감 17:00</text>
  <text x="260" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">호이안에서 45 km · 다낭에서 68 km</text>
  <text x="260" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">프라이빗 차량/일일 투어 · 공항 이동 여유 필수</text>

