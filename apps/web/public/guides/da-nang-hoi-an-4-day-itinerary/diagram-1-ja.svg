  <text x="940" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">ハン市場 Chợ Hàn・ハン川 Sông Hàn</text>
  <text x="940" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">ドラゴン橋 Cầu Rồng 金土日21:00火吹き</text>
  <text x="940" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">ミーケビーチ Mỹ Khê 無料・橋を渡ってすぐ</text>
  <text x="940" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">リンウン寺はソンチャ半島（右上）</text>

