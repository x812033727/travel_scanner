  <text x="260" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">ホイアンから45 km・ダナンから68 km</text>
  <text x="260" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">チャーター車／日帰りツアー（帰路に余裕を）</text>

