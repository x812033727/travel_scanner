  <text x="260" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">Sun World・ロープウェイ定価1,000,000ドン</text>
  <text x="260" y="274" font-size="15" fill="#5C6B6B" text-anchor="middle">ゴールデンブリッジ・フランス村 Làng Pháp</text>
  <text x="260" y="298" font-size="15" fill="#5C6B6B" text-anchor="middle">22:00閉園・運行時間は公式サイト要確認</text>
  <text x="260" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">Grab／チャーター車／無料Wow Busで移動</text>

  <!-- Day 4: Marble Mountains -->
  <rect x="845" y="430" width="365" height="110" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <text x="1027" y="462" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 五行山 Ngũ Hành Sơn</text>
  <text x="1027" y="490" font-size="15" fill="#5C6B6B" text-anchor="middle">入場40,000・エレベーター片道15,000ドン</text>
  <text x="1027" y="514" font-size="15" fill="#5C6B6B" text-anchor="middle">階段またはエレベーターで水山・玄空洞へ</text>

  <!-- Day 3: Hoi An -->
  <rect x="845" y="640" width="365" height="150" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <text x="1027" y="672" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Day 3 ホイアン Hội An</text>
  <text x="1027" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">旧市街チケット 120,000ドン（外国人）</text>
  <text x="1027" y="724" font-size="15" fill="#5C6B6B" text-anchor="middle">日本橋 Chùa Cầu・ランタン夜景・手漕ぎ船</text>
  <text x="1027" y="748" font-size="15" fill="#5C6B6B" text-anchor="middle">歩行者天国 09:00〜21:30（冬は21:00まで）</text>
  <text x="1027" y="772" font-size="15" fill="#5C6B6B" text-anchor="middle">アンバンビーチ An Bàng 車で約10分</text>

  <!-- Day 4 alternative: My Son -->
  <rect x="60" y="640" width="400" height="150" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <text x="260" y="672" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">Day 4 代替案・ミーソン遺跡 Mỹ Sơn</text>
  <text x="260" y="700" font-size="15" fill="#5C6B6B" text-anchor="middle">チャンパ王国遺跡・入場料 150,000ドン</text>
