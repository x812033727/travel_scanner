<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Noto Sans','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ダナン・ホイアン3泊4日エリア別ルート概念図 / Da Nang and Hoi An four-day zones</title>
  <desc id="desc">ダナンとホイアンの位置関係を簡略化した概念図です（縮尺非準拠、大人料金は2026年9月確認）。右側が南シナ海（Biển Đông）、右上にソンチャ半島（Sơn Trà）と入場無料のリンウン寺（Chùa Linh Ứng）があります。中央はDay 1のダナン市街（Đà Nẵng）で、ハン市場（Chợ Hàn）、ハン川（Sông Hàn）、無料のミーケビーチ（Mỹ Khê）、毎週金・土・日の21:00に火を吹くドラゴン橋（ロン橋／Cầu Rồng）が位置し、ダナン空港（DAD）は市街地の西側約3 kmにあります。左側はDay 2のバーナーヒルズ（Sun World Ba Na Hills）で、ロープウェイ定価1,000,000ドン（VND）、ゴールデンブリッジとフランス村（Làng Pháp）があり22:00閉園、Grab・チャーター車・無料Wow Busで山へ向かいます。市街地から南へ約8 kmがDay 4の五行山（Ngũ Hành Sơn）で、入場料40,000ドン、エレベーター片道15,000ドン、水山と玄空洞を見学できます。さらに南がDay 3のホイアン旧市街（Hội An）で、外国人向け旧市街チケットは120,000ドン、日本橋（Chùa Cầu）やランタン夜景、川の手漕ぎ船が楽しめ、歩行者天国は09:00〜21:30（冬は21:00まで）、アンバンビーチ（An Bàng）は車で約10分です。空港からホイアンまでは約29 km・約50分です。左下はDay 4の代替案となるミーソン遺跡（Mỹ Sơn）で、入場料150,000ドン、営業時間06:00〜17:00、ホイアンから45 km・ダナンから68 kmです。実線はGrabやタクシーによる主な車移動、破線は送迎・チャーター車・日帰りツアーを表します。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">ダナン・ホイアン3泊4日　エリア別ルート概念図</text>
  <text x="60" y="100" font-size="20" font-weight="700" fill="#5C6B6B">Đà Nẵng・Hội An・位置関係の概念図（縮尺非準拠）・大人料金・2026年9月確認</text>

  <!-- sea and coast -->
  <path d="M 1180 120 L 1600 120 L 1600 860 L 1285 860 C 1265 680, 1250 480, 1235 300 C 1225 240, 1200 180, 1180 120 Z" fill="#BFD9E3" opacity="0.8"/>
  <text x="1450" y="510" font-size="18" font-weight="700" fill="#3F6C7A" text-anchor="middle">南シナ海</text>
  <text x="1450" y="534" font-size="16" font-weight="700" fill="#3F6C7A" text-anchor="middle">Biển Đông</text>
  <path d="M 1238 305 C 1246 380, 1252 460, 1260 545" fill="none" stroke="#D9B96A" stroke-width="10" stroke-linecap="round"/>
  <text x="1230" y="380" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">ミーケビーチ Mỹ Khê</text>
  <text x="1230" y="402" font-size="15" font-weight="700" fill="#0D6B68" text-anchor="end">入場無料</text>

  <!-- Son Tra peninsula -->
  <path d="M 1195 205 C 1235 148, 1465 146, 1532 205 C 1495 266, 1290 278, 1195 252 Z" fill="#F7F1E8" stroke="#0D6B68" stroke-width="3"/>
  <text x="1352" y="206" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">ソンチャ半島 Sơn Trà</text>
  <text x="1352" y="234" font-size="15" fill="#5C6B6B" text-anchor="middle">リンウン寺 Chùa Linh Ứng（無料）</text>
  <line x1="1130" y1="230" x2="1195" y2="228" stroke="#0D6B68" stroke-width="3"/>

  <!-- connectors -->
  <line x1="460" y1="265" x2="624" y2="265" stroke="#6B4A3A" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="542" y="292" font-size="15" font-weight="700" fill="#6B4A3A" text-anchor="middle">西の山へ</text>
  <line x1="654" y1="265" x2="750" y2="265" stroke="#102A2B" stroke-width="4"/>
  <text x="702" y="292" font-size="15" fill="#5C6B6B" text-anchor="middle">約3 km</text>
  <path d="M 640 279 L 640 700 L 845 700" fill="none" stroke="#B8442D" stroke-width="4"/>
  <text x="652" y="572" font-size="15" font-weight="700" fill="#B8442D">空港 → ホイアン 29 km・約50分</text>
  <line x1="940" y1="340" x2="940" y2="430" stroke="#2F6F9F" stroke-width="4"/>
  <text x="952" y="390" font-size="15" fill="#2F6F9F">約8 km</text>
  <line x1="940" y1="540" x2="940" y2="640" stroke="#B8442D" stroke-width="4"/>
  <text x="952" y="595" font-size="15" fill="#5C6B6B">帰路に立ち寄り</text>
  <line x1="845" y1="742" x2="460" y2="742" stroke="#2E7D5B" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="652" y="730" font-size="15" font-weight="700" fill="#2E7D5B" text-anchor="middle">45 km・チャーター車／日帰りツアー</text>

  <!-- airport -->
  <circle cx="640" cy="265" r="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <text x="640" y="235" font-size="17" font-weight="700" fill="#102A2B" text-anchor="middle">ダナン空港 DAD</text>

  <!-- Day 1: Da Nang city -->
  <rect x="750" y="190" width="380" height="150" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
