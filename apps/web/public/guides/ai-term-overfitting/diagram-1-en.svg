<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">Example: Where Two Error Curves Diverge / Overfitting: training vs. validation error</title>
<desc id="desc">An illustrative chart with invented teaching values, not actual training results. The horizontal axis shows training epochs; the vertical axis shows error rate. Dark green training error falls from 30% at epoch 1 to 1% at epoch 20. Orange validation error falls from 31% to 12% at epoch 8, then rises to 20% at epoch 20. Before epoch 8, both lines fall, indicating that the model is still learning general patterns. After epoch 8, the lines diverge and the gap grows, indicating overfitting. Early stopping would select the epoch 8 version. Notes on the right: both falling means the model is still learning patterns; falling training error and rising validation error mean overfitting; both high means underfitting.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" /></marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Example: Where Two Error Curves Diverge</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Overfitting: training error vs. validation error (illustrative numbers)</text>
<rect x="120" y="120" width="1085" height="700" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2" />
<rect x="220" y="170" width="331.6" height="560" fill="#E3F0EF" />
<rect x="551.6" y="170" width="568.4" height="560" fill="#D97A2B" fill-opacity="0.12" />
<text x="385.8" y="210" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">Both curves fall</text>
<text x="835.8" y="210" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">Divergence: validation error rises</text>
<text x="835.8" y="240" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">This is overfitting</text>
<path d="M 200 165 L 200 730 L 1150 730" fill="none" stroke="#102A2B" stroke-width="3" />
<text x="200" y="152" font-size="18" fill="#5C6B6B" text-anchor="middle">Error rate</text>
<path d="M 220.0 730 L 220.0 742 M 551.6 730 L 551.6 742 M 1120.0 730 L 1120.0 742" stroke="#102A2B" stroke-width="3" />
<text x="220.0" y="768" font-size="18" fill="#102A2B" text-anchor="middle">Epoch 1</text>
<text x="551.6" y="768" font-size="18" fill="#102A2B" text-anchor="middle">Epoch 8</text>
<text x="1120.0" y="768" font-size="18" fill="#102A2B" text-anchor="middle">Epoch 20</text>
<text x="670" y="802" font-size="18" fill="#5C6B6B" text-anchor="middle">Training epochs</text>
<path d="M 551.6 280 L 551.6 730" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="10 8" />
<text x="551.6" y="268" font-size="18" fill="#102A2B" text-anchor="middle">Early stopping point</text>
<polyline points="220.0,235.0 267.4,334.0 314.7,416.5 362.1,482.5 409.5,523.8 456.8,556.8 504.2,581.5 551.6,598.0 646.3,631.0 741.1,655.8 835.8,677.2 930.5,692.0 1025.3,705.2 1120.0,713.5" fill="none" stroke="#0D6B68" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="220.0,218.5 267.4,309.2 314.7,383.5 362.1,441.2 409.5,482.5 456.8,507.2 504.2,523.8 551.6,532.0 598.9,528.7 646.3,518.8 741.1,490.8 835.8,461.1 930.5,433.0 1025.3,413.2 1120.0,400.0" fill="none" stroke="#D97A2B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="551.6" cy="598.0" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5" />
<circle cx="551.6" cy="532.0" r="9" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5" />
<circle cx="1120.0" cy="713.5" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5" />
<circle cx="1120.0" cy="400.0" r="9" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5" />
<text x="569.6" y="498" font-size="18" font-weight="700" fill="#B8442D">Validation 12%</text>
<text x="535.6" y="632" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="end">Training 8%</text>
<text x="1104.0" y="376" font-size="18" font-weight="700" fill="#B8442D" text-anchor="end">Validation 20%</text>
<text x="1104.0" y="684" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="end">Training 1%</text>
<path d="M 1152 414.0 L 1152 699.5" stroke="#102A2B" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
<text x="1160" y="562" font-size="17" fill="#102A2B">Gap</text>
<rect x="1230" y="120" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
<path d="M 1258 182 L 1318 182" stroke="#0D6B68" stroke-width="6" stroke-linecap="round" />
<text x="1336" y="189" font-size="20" fill="#102A2B">Training error</text>
<path d="M 1258 240 L 1318 240" stroke="#D97A2B" stroke-width="6" stroke-linecap="round" />
<text x="1336" y="247" font-size="20" fill="#102A2B">Validation error</text>
<rect x="1230" y="315" width="330" height="270" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1395" y="360" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">How to read</text>
<text x="1256" y="405" font-size="17" fill="#102A2B">Both fall: learning patterns</text>
<text x="1256" y="450" font-size="17" fill="#102A2B">Training ↓, validation ↑: overfitting</text>
<text x="1256" y="495" font-size="17" fill="#102A2B">Both high: underfitting</text>
<text x="1256" y="540" font-size="17" fill="#102A2B">Stop at minimum validation error</text>
<rect x="1230" y="610" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" />
<text x="1395" y="655" font-size="17" fill="#5C6B6B" text-anchor="middle">Invented example values</text>
<text x="1395" y="690" font-size="17" fill="#5C6B6B" text-anchor="middle">No actual training</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphics 2026</text>
</svg>
