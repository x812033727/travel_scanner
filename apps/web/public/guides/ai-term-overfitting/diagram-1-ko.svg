<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">예시: 두 오차 곡선은 어디서 갈라질까 / 과적합: 학습 오차와 검증 오차</title>
<desc id="desc">예시 그림으로, 수치는 교육용으로 만든 설정이며 실제 학습 결과가 아니다. 가로축은 학습 회차, 세로축은 오류율이다. 짙은 녹색 학습 오차는 1회차의 30%에서 20회차의 1%까지 계속 내려간다. 주황색 검증 오차는 31%에서 8회차의 12%까지 내려갔다가 다시 올라가 20회차에는 20%가 된다. 8회차 전에는 두 선이 함께 내려가며, 모델이 여전히 일반적인 규칙을 학습하고 있음을 뜻한다. 8회차 이후 두 선이 갈라지고 차이가 점점 커지는 것이 과적합이며, 조기 종료는 8회차의 버전을 선택한다. 오른쪽 설명: 함께 내려가면 아직 규칙을 학습하는 중이고, 학습 오차는 내려가는데 검증 오차가 올라가면 과적합이며, 둘 다 높으면 과소적합이다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" /></marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">예시: 두 오차 곡선은 어디서 갈라질까</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">과적합: 학습 오차와 검증 오차(예시 수치)</text>
<rect x="120" y="120" width="1085" height="700" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="2" />
<rect x="220" y="170" width="331.6" height="560" fill="#E3F0EF" />
<rect x="551.6" y="170" width="568.4" height="560" fill="#D97A2B" fill-opacity="0.12" />
<text x="385.8" y="210" font-size="20" font-weight="700" fill="#0D6B68" text-anchor="middle">두 선이 함께 하락</text>
<text x="835.8" y="210" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">갈림: 검증 오차 상승</text>
<text x="835.8" y="240" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">이 구간이 과적합</text>
<path d="M 200 165 L 200 730 L 1150 730" fill="none" stroke="#102A2B" stroke-width="3" />
<text x="200" y="152" font-size="18" fill="#5C6B6B" text-anchor="middle">오류율</text>
<path d="M 220.0 730 L 220.0 742 M 551.6 730 L 551.6 742 M 1120.0 730 L 1120.0 742" stroke="#102A2B" stroke-width="3" />
<text x="220.0" y="768" font-size="18" fill="#102A2B" text-anchor="middle">1회차</text>
<text x="551.6" y="768" font-size="18" fill="#102A2B" text-anchor="middle">8회차</text>
<text x="1120.0" y="768" font-size="18" fill="#102A2B" text-anchor="middle">20회차</text>
<text x="670" y="802" font-size="18" fill="#5C6B6B" text-anchor="middle">학습 회차</text>
<path d="M 551.6 280 L 551.6 730" stroke="#5C6B6B" stroke-width="3" stroke-dasharray="10 8" />
<text x="551.6" y="268" font-size="18" fill="#102A2B" text-anchor="middle">조기 종료 지점</text>
<polyline points="220.0,235.0 267.4,334.0 314.7,416.5 362.1,482.5 409.5,523.8 456.8,556.8 504.2,581.5 551.6,598.0 646.3,631.0 741.1,655.8 835.8,677.2 930.5,692.0 1025.3,705.2 1120.0,713.5" fill="none" stroke="#0D6B68" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="220.0,218.5 267.4,309.2 314.7,383.5 362.1,441.2 409.5,482.5 456.8,507.2 504.2,523.8 551.6,532.0 598.9,528.7 646.3,518.8 741.1,490.8 835.8,461.1 930.5,433.0 1025.3,413.2 1120.0,400.0" fill="none" stroke="#D97A2B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="551.6" cy="598.0" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5" />
<circle cx="551.6" cy="532.0" r="9" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5" />
<circle cx="1120.0" cy="713.5" r="9" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5" />
<circle cx="1120.0" cy="400.0" r="9" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5" />
<text x="569.6" y="498" font-size="18" font-weight="700" fill="#B8442D">검증 12%</text>
<text x="535.6" y="632" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="end">학습 8%</text>
<text x="1104.0" y="376" font-size="18" font-weight="700" fill="#B8442D" text-anchor="end">검증 20%</text>
<text x="1104.0" y="684" font-size="18" font-weight="700" fill="#0D6B68" text-anchor="end">학습 1%</text>
<path d="M 1152 414.0 L 1152 699.5" stroke="#102A2B" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
<text x="1160" y="562" font-size="17" fill="#102A2B">격차</text>
<rect x="1230" y="120" width="330" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
<path d="M 1258 182 L 1318 182" stroke="#0D6B68" stroke-width="6" stroke-linecap="round" />
<text x="1336" y="189" font-size="20" fill="#102A2B">학습 오차</text>
<path d="M 1258 240 L 1318 240" stroke="#D97A2B" stroke-width="6" stroke-linecap="round" />
<text x="1336" y="247" font-size="20" fill="#102A2B">검증 오차</text>
<rect x="1230" y="315" width="330" height="270" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1395" y="360" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">읽는 법</text>
<text x="1256" y="405" font-size="17" fill="#102A2B">함께 하락: 규칙 학습 중</text>
<text x="1256" y="450" font-size="17" fill="#102A2B">학습↓ 검증↑: 과적합</text>
<text x="1256" y="495" font-size="17" fill="#102A2B">둘 다 높음: 과소적합</text>
<text x="1256" y="540" font-size="17" fill="#102A2B">검증 오차 최저점에서 종료</text>
<rect x="1230" y="610" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" />
<text x="1395" y="655" font-size="17" fill="#5C6B6B" text-anchor="middle">설명을 위해 만든 수치</text>
<text x="1395" y="690" font-size="17" fill="#5C6B6B" text-anchor="middle">실제 학습 결과 아님</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도표 제작 2026</text>
</svg>
