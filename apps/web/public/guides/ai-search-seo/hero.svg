  <title id="title">從一份頁面到一個答案 / From a page to an answer</title>
  <desc id="desc">原創插畫：左邊是一份白色的文件，中間是四階由低到高的台階，右邊是一個對話框，一條虛線由文件旁邊經過台階上方通往對話框。圖上只有一行字：先被讀到，才談其他。畫面用米色底與綠藍色塊，沒有任何產品標誌、介面或人物。</desc>
