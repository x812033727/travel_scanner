<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">首爾辣炒年糕菜單解碼</title>
<desc id="desc">街頭版本是持續煮好的떡볶이，點餐後舀一份；新堂洞的즉석떡볶이是點了在桌上煮的鍋物。鍋中可能有年糕、어묵魚板、만두餃子、라면拉麵及冬粉。라볶이是加入拉麵的年糕菜名。實際菜單依店家公告。© Mokaair 製圖 2026。</desc>
<rect width="1600" height="900" fill="#fff8f1"/>
<text x="90" y="110" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="55" font-weight="700" fill="#4b251d">首爾辣炒年糕：先看上桌方式</text>
<rect x="70" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#dfb6a2" stroke-width="3"/>
<rect x="840" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#e0b6a2" stroke-width="3"/>
<g font-family="'Noto Sans TC','Noto Sans KR',sans-serif" fill="#4b251d">
<text x="110" y="260" font-size="36" font-weight="700">街頭版本｜떡볶이</text><text x="110" y="325" font-size="26">大鐵盤持續煮，點後盛一份</text><text x="110" y="385" font-size="24">依韓國觀光公社料理專題</text>
<text x="880" y="260" font-size="36" font-weight="700">桌上現煮｜즉석떡볶이</text><text x="880" y="325" font-size="26">一鍋年糕與配料，點後在桌上煮</text>
<text x="880" y="410" font-size="30">어묵｜魚板　만두｜餃子</text><text x="880" y="475" font-size="30">라면｜拉麵　冬粉</text>
<text x="880" y="565" font-size="29" font-weight="700">라볶이｜拉麵年糕</text><text x="880" y="610" font-size="23">是店家頁出現的菜名，供應依菜單</text>
<text x="110" y="700" font-size="23">示意圖：實際材料、套餐與上菜方式依各店公告</text>
</g>
<text x="90" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：韓國觀光公社 VISITKOREA 官方料理與店家頁</text>
<text x="1250" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">© Mokaair 製圖 2026</text>
</svg>
