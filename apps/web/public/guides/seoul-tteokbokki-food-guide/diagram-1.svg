<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">首爾辣炒年糕菜單解碼</title>
<desc id="desc">圖上的標題是「首爾辣炒年糕：先看上桌方式」。圖分左右兩個白色方框。左框的標題是「街頭版本｜떡볶이」，下面兩行寫「大鐵盤持續煮，點後盛一份」與「端了就走，不用在桌邊等」；框的下方寫「示意圖：實際材料、套餐與上菜方式依各店公告」。右框的標題是「桌上現煮｜즉석떡볶이」，下面寫「一鍋年糕與配料，點後在桌上煮」與「菜單看到즉석兩個字，就是這一種」；再下面兩行是鍋裡的加料：어묵（魚板）、만두（餃子）、라면（拉麵）與冬粉；最後一組是라볶이（拉麵辣炒年糕），下面寫「年糕加麵；要不要另外加，看菜單」。最下面兩行是「資料：韓國觀光公社・首爾觀光財團」與「© Mokaair 製圖 2026」。</desc>
<rect width="1600" height="900" fill="#fff8f1"/>
<text x="90" y="110" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="55" font-weight="700" fill="#4b251d">首爾辣炒年糕：先看上桌方式</text>
<rect x="70" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#dfb6a2" stroke-width="3"/>
<rect x="840" y="185" width="690" height="580" rx="28" fill="#fff" stroke="#e0b6a2" stroke-width="3"/>
<g font-family="'Noto Sans TC','Noto Sans KR',sans-serif" fill="#4b251d">
<text x="110" y="260" font-size="36" font-weight="700">街頭版本｜떡볶이</text><text x="110" y="325" font-size="26">大鐵盤持續煮，點後盛一份</text><text x="110" y="385" font-size="24">端了就走，不用在桌邊等</text>
<text x="880" y="260" font-size="36" font-weight="700">桌上現煮｜즉석떡볶이</text><text x="880" y="325" font-size="26">一鍋年糕與配料，點後在桌上煮</text><text x="880" y="385" font-size="24">菜單看到즉석兩個字，就是這一種</text>
<text x="880" y="455" font-size="30">어묵｜魚板　만두｜餃子</text><text x="880" y="515" font-size="30">라면｜拉麵　冬粉</text>
<text x="880" y="595" font-size="29" font-weight="700">라볶이｜拉麵辣炒年糕</text><text x="880" y="638" font-size="23">年糕加麵；要不要另外加，看菜單</text>
<text x="110" y="700" font-size="23">示意圖：實際材料、套餐與上菜方式依各店公告</text>
</g>
<text x="90" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">資料：韓國觀光公社・首爾觀光財團</text>
<text x="1250" y="838" fill="#6c5145" font-family="'Noto Sans TC','Noto Sans KR',sans-serif" font-size="21">© Mokaair 製圖 2026</text>
</svg>
