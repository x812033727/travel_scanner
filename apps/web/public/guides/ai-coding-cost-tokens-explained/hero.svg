<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">token 怎麼變成錢 / How tokens turn into a bill</title>
  <desc id="desc">插圖：左邊是一個終端機視窗，裡面有三根越來越高的長條，代表對話每往下走一輪，送進模型的內容就更多；一支箭頭指向右邊的計量表，指針偏向高處，下面疊著三枚硬幣，代表這些累積的用量最後會變成帳單上的金額。畫面下方有一行字「token 怎麼變成錢」。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#5C6B6B"/>
    </marker>
  </defs>
