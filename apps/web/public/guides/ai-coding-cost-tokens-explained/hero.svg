  <line x1="220" y1="578" x2="740" y2="578" stroke="#5C6B6B" stroke-width="5"/>

  <line x1="820" y1="400" x2="955" y2="400" stroke="#5C6B6B" stroke-width="7" marker-end="url(#arrow)"/>

