<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">OpenAI와 Broadcom, Jalapeño 칩 공개: 공식 발표가 말하는 단계, 역할 분담, 그리고 아직 밝히지 않은 것</title><desc id="desc">오리지널 일러스트: 왼쪽 말풍선(언어 모델)에서 선이 이어져 중앙의 칩으로 연결된다. 칩은 점선 테두리로 그려져 아직 실험실 테스트 단계이며 확정되지 않았음을 나타낸다. 점선 화살표는 점선 테두리로 그려진 오른쪽 랙을 가리키며, 아직 계획 단계인 배포를 나타낸다.</desc>
