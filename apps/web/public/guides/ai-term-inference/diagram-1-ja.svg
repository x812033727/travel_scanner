<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">一回の回答の時間配分 / 一回の推論で時間がかかるところ</title><desc id="desc">時間軸の図。リクエストはまず待ち行列とネットワークを経て、プロンプトの読み込み（prefill）に進み、プロンプト全体をまとめて並列処理します。次に逐次生成（decode）に入り、終了まで各ステップで token を一つずつ生成します。最初の token までの時間には、待ち行列とネットワーク、プロンプトの読み込みが含まれます。生成時間は、その後の token を一つずつ生成する時間です。両者の合計が回答完了までの時間になります。入力が長いほど、主に最初の token までの時間が延び、出力が長いほど、主に生成時間が延びます。重みは全過程で固定され、更新されません。</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一回の回答の時間配分</text><text x="60" y="84" font-size="18" fill="#5C6B6B">推論：プロンプト読込と逐次生成</text><text x="805" y="178" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">回答完了までの時間 ＝ 最初の token までの時間 ＋ 生成時間</text><path d="M 80 216 V 200 H 1530 V 216" fill="none" stroke="#5C6B6B" stroke-width="4"></path><rect x="80" y="250" width="190" height="220" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"></rect><text x="175" y="355" font-size="16" fill="#102A2B" text-anchor="middle" style="font-size: 16px;">待ち行列とネットワーク</text><text x="175" y="392" font-size="20" fill="#5C6B6B" text-anchor="middle">往復の待ち時間</text><path d="M 274 360 L 296 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"></path><rect x="300" y="250" width="400" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="500" y="332" font-size="30" font-weight="700" fill="#102A2B" text-anchor="middle">プロンプト読込</text><text x="500" y="372" font-size="22" fill="#0D6B68" text-anchor="middle">prefill</text><text x="500" y="418" font-size="20" fill="#5C6B6B" text-anchor="middle">プロンプト全体を一括並列処理</text><path d="M 704 360 L 726 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)"></path><rect x="730" y="250" width="800" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="1130" y="292" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">逐次生成（decode）：毎回一つの token</text><rect x="786" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="842" y="376" font-size="22" fill="#102A2B" text-anchor="middle">次の</text><text x="842" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 901 382 L 927 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"></path><rect x="930" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="986" y="376" font-size="22" fill="#102A2B" text-anchor="middle">次の</text><text x="986" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 1045 382 L 1071 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"></path><rect x="1074" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><text x="1130" y="376" font-size="22" fill="#102A2B" text-anchor="middle">次の</text><text x="1130" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">token</text><path d="M 1189 382 L 1215 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"></path><rect x="1218" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect><circle cx="1252" cy="382" r="6" fill="#2F6F9F"></circle><circle cx="1274" cy="382" r="6" fill="#2F6F9F"></circle><circle cx="1296" cy="382" r="6" fill="#2F6F9F"></circle><path d="M 1333 382 L 1359 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)"></path><rect x="1362" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"></rect><text x="1418" y="392" font-size="24" fill="#102A2B" text-anchor="middle">終了</text><path d="M 80 496 V 512 H 700 V 496" fill="none" stroke="#D97A2B" stroke-width="5"></path><text x="390" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">最初の token までの時間（TTFT）</text><text x="390" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">リクエスト送信から最初の token の受信まで</text><path d="M 730 496 V 512 H 1530 V 496" fill="none" stroke="#2F6F9F" stroke-width="5"></path><text x="1130" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">生成時間</text><text x="1130" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">最初の token 以降を一つずつ生成</text><rect x="80" y="650" width="450" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">入力が長いほど、読込に時間がかかる</text><text x="305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">主に最初の token までの時間が延びる</text><rect x="580" y="650" width="450" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="805" y="716" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle" style="font-size: 21px;">出力が長いほど、繰り返すステップが増える</text><text x="805" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">主に生成時間が延びる</text><rect x="1080" y="650" width="450" height="140" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"></rect><text x="1305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">重みは全過程で固定、更新なし</text><text x="1305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">重みの調整は学習で行う</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 図版制作 2026</text></svg>
