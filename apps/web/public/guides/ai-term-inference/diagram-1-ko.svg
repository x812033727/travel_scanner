<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">한 번의 응답에서 시간이 드는 곳 / 한 번의 추론에서 시간이 드는 곳</title><desc id="desc">시간축 그림. 요청은 먼저 대기열과 네트워크를 거친 뒤 프롬프트 읽기(prefill) 단계로 들어가 프롬프트 전체를 한꺼번에 병렬 처리한다. 이어 순차 생성(decode) 단계에서 끝날 때까지 한 단계에 토큰 하나씩 생성한다. 첫 토큰 수신 시간에는 대기열·네트워크와 프롬프트 읽기가 포함되고, 생성 시간에는 그 이후의 토큰을 하나씩 생성하는 시간이 포함된다. 둘을 더하면 전체 응답 시간이 된다. 입력이 길수록 주로 첫 토큰 수신 시간이 길어지고, 출력이 길수록 주로 생성 시간이 길어진다. 가중치는 전 과정에서 고정되며 갱신되지 않는다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">한 번의 응답, 어디에 시간이 들까</text><text x="60" y="84" font-size="18" fill="#5C6B6B">추론: 프롬프트 읽기와 순차 생성</text><text x="805" y="178" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">전체 응답 시간 ＝ 첫 토큰 수신 시간 ＋ 생성 시간</text><path d="M 80 216 V 200 H 1530 V 216" fill="none" stroke="#5C6B6B" stroke-width="4" /><rect x="80" y="250" width="190" height="220" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" /><text x="175" y="355" font-size="22" fill="#102A2B" text-anchor="middle">대기열·네트워크</text><text x="175" y="392" font-size="20" fill="#5C6B6B" text-anchor="middle">왕복 대기</text><path d="M 274 360 L 296 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)" /><rect x="300" y="250" width="400" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="500" y="332" font-size="30" font-weight="700" fill="#102A2B" text-anchor="middle">프롬프트 읽기</text><text x="500" y="372" font-size="22" fill="#0D6B68" text-anchor="middle">prefill</text><text x="500" y="418" font-size="20" fill="#5C6B6B" text-anchor="middle">프롬프트 전체를 한꺼번에 병렬 처리</text><path d="M 704 360 L 726 360" fill="none" stroke="#0D6B68" stroke-width="4" marker-end="url(#arrow)" /><rect x="730" y="250" width="800" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="1130" y="292" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">순차 생성(decode): 한 단계에 토큰 하나</text><rect x="786" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="842" y="376" font-size="22" fill="#102A2B" text-anchor="middle">다음</text><text x="842" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">토큰</text><path d="M 901 382 L 927 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)" /><rect x="930" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="986" y="376" font-size="22" fill="#102A2B" text-anchor="middle">다음</text><text x="986" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">토큰</text><path d="M 1045 382 L 1071 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)" /><rect x="1074" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><text x="1130" y="376" font-size="22" fill="#102A2B" text-anchor="middle">다음</text><text x="1130" y="408" font-size="20" fill="#5C6B6B" text-anchor="middle">토큰</text><path d="M 1189 382 L 1215 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)" /><rect x="1218" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" /><circle cx="1252" cy="382" r="6" fill="#2F6F9F" /><circle cx="1274" cy="382" r="6" fill="#2F6F9F" /><circle cx="1296" cy="382" r="6" fill="#2F6F9F" /><path d="M 1333 382 L 1359 382" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow)" /><rect x="1362" y="324" width="112" height="116" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" /><text x="1418" y="392" font-size="24" fill="#102A2B" text-anchor="middle">종료</text><path d="M 80 496 V 512 H 700 V 496" fill="none" stroke="#D97A2B" stroke-width="5" /><text x="390" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">첫 토큰 수신 시간(TTFT)</text><text x="390" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">요청 전송부터 첫 토큰 수신까지</text><path d="M 730 496 V 512 H 1530 V 496" fill="none" stroke="#2F6F9F" stroke-width="5" /><text x="1130" y="556" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">생성 시간</text><text x="1130" y="590" font-size="20" fill="#5C6B6B" text-anchor="middle">첫 토큰 이후의 토큰을 하나씩 생성</text><rect x="80" y="650" width="450" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">입력이 길수록 프롬프트 읽기도 길어짐</text><text x="305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">주로 첫 토큰 수신 시간이 늘어남</text><rect x="580" y="650" width="450" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="805" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">출력이 길수록 반복 단계가 많아짐</text><text x="805" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">주로 생성 시간이 늘어남</text><rect x="1080" y="650" width="450" height="140" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4" /><text x="1305" y="716" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">가중치는 전 과정에서 고정, 갱신 없음</text><text x="1305" y="756" font-size="20" fill="#5C6B6B" text-anchor="middle">가중치 조정은 학습의 역할</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 제작 2026</text></svg>
