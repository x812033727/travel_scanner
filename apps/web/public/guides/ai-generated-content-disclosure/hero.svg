<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">先標示，再發布 / Label it, then publish</title>
  <desc id="desc">幾何插圖：左邊一張白色圓角卡片代表你做好的內容，裡面有一個圓形播放鍵與兩條橫槓；卡片右側用一條短線連到一個綠色的吊牌形狀，吊牌上有一個打勾記號，代表加上 AI 標示；吊牌再往右連出三條線，通向三個藍色方塊，代表把內容發布到三個平台。畫面下方有一行字「先標示，再發布」。整張圖沒有任何品牌標誌、介面截圖或人臉。</desc>
