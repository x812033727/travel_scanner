<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">試算表 AI 自動化的五個步驟 / Five steps of AI automation in a spreadsheet</title>
<desc id="desc">一張由左至右的流程圖，共五個步驟。第一步是複製原始資料，AI 只在複本上動手，原始表保持不動。第二步是規則式清理，用試算表內建的移除重複項目、刪除前後空格、清理建議與資料欄統計資料，這些結果穩定可重複。第三步才換 AI 上場做分類與摘要，Google 試算表用 AI 函式、Excel 用 Copilot 窗格，AI 函式一次最多產生前 350 格。第四步是人工抽查，自己先標好 20 到 30 列當答案，再比對不一致的比例。第五步是確認後才輸出，把結果合併回原始表或另存成報表。圖下方兩則提醒：碰到長期額度上限會暫時不能按 Generate，要等 24 小時再試；Excel 的 COPILOT 函式自 2026 年 9 月 14 日起停用，改用 Copilot 窗格。最下方列出方案條件：Google 需要 Workspace Business Standard 以上或 Google AI Pro 與 Ultra；Microsoft 需要含 AI 額度的個人版或家用版、進階版，或商用 Copilot 訂閱。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">試算表 AI 自動化的五個步驟</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Five steps of AI automation in a spreadsheet</text>

<rect x="71" y="150" width="250" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="196" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">複製原始資料</text>
<text x="196" y="248" text-anchor="middle" font-size="16" fill="#102A2B">AI 只在複本上動手</text>
<text x="196" y="284" text-anchor="middle" font-size="16" fill="#102A2B">原始表保持不動</text>

<rect x="373" y="150" width="250" height="220" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="498" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">規則式清理</text>
<text x="498" y="240" text-anchor="middle" font-size="16" fill="#102A2B">移除重複項目</text>
<text x="498" y="276" text-anchor="middle" font-size="16" fill="#102A2B">刪除前後空格</text>
<text x="498" y="312" text-anchor="middle" font-size="16" fill="#102A2B">清理建議、欄統計</text>

<rect x="675" y="150" width="250" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">AI 分類與摘要</text>
<text x="800" y="240" text-anchor="middle" font-size="16" fill="#102A2B">試算表：AI 函式</text>
<text x="800" y="276" text-anchor="middle" font-size="16" fill="#102A2B">Excel：Copilot 窗格</text>
<text x="800" y="312" text-anchor="middle" font-size="16" fill="#102A2B">一次最多 350 格</text>

<rect x="977" y="150" width="250" height="220" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1102" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">人工抽查</text>
<text x="1102" y="248" text-anchor="middle" font-size="16" fill="#102A2B">自己先標 20 到 30 列</text>
<text x="1102" y="284" text-anchor="middle" font-size="16" fill="#102A2B">比對不一致的比例</text>

<rect x="1279" y="150" width="250" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1404" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">確認後才輸出</text>
<text x="1404" y="248" text-anchor="middle" font-size="16" fill="#102A2B">合併回原始表</text>
<text x="1404" y="284" text-anchor="middle" font-size="16" fill="#102A2B">或另存成報表</text>

<line x1="325" y1="260" x2="367" y2="260" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="627" y1="260" x2="669" y2="260" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="929" y1="260" x2="971" y2="260" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1231" y1="260" x2="1273" y2="260" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="71" y="416" width="700" height="132" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="101" y="458" font-size="19" font-weight="700" fill="#B8442D">碰到額度上限會停住</text>
<text x="101" y="494" font-size="17" fill="#102A2B">AI 函式有短期與長期產生上限，碰到長期上限會暫時</text>
<text x="101" y="524" font-size="17" fill="#102A2B">不能按 Generate，要等 24 小時再試。</text>

<rect x="829" y="416" width="700" height="132" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="859" y="458" font-size="19" font-weight="700" fill="#2F6F9F">Excel 少了一層</text>
<text x="859" y="494" font-size="17" fill="#102A2B">COPILOT 函式自 2026 年 9 月 14 日起停用，儲存格</text>
<text x="859" y="524" font-size="17" fill="#102A2B">裡不再有 AI 函式，改用 Copilot 窗格下指令。</text>

<rect x="71" y="588" width="700" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="101" y="632" font-size="20" font-weight="700" fill="#102A2B">Google 試算表要哪個方案</text>
<text x="101" y="672" font-size="17" fill="#102A2B">Workspace：Business Standard、Business Plus、</text>
<text x="101" y="702" font-size="17" fill="#102A2B">Enterprise 版；個人帳戶：Google AI Pro 或 Ultra。</text>

<rect x="829" y="588" width="700" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="859" y="632" font-size="20" font-weight="700" fill="#102A2B">Excel 要哪個方案</text>
<text x="859" y="672" font-size="17" fill="#102A2B">含 AI 額度的個人版或家用版、進階版，或商用</text>
<text x="859" y="702" font-size="17" fill="#102A2B">Microsoft Copilot 訂閱；檔案要存在 OneDrive。</text>

<text x="800" y="800" text-anchor="middle" font-size="18" fill="#5C6B6B">規則式清理做得到的，就不要交給 AI；需要判斷語意的欄才用 AI 函式或 Copilot。</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
