<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">試算表 AI 自動化 / AI automation in a spreadsheet</title>
<desc id="desc">一張幾何插圖。左邊是一個四乘四的圓角方格陣列，像一張試算表，最左一整欄與右側幾格被填成深綠、藍與橘色，代表被整理過的資料欄。中間一條線接到一個大齒輪，代表把重複的整理工作交給自動化與 AI。齒輪右邊再接一條線到一個白色方框，框裡有一個綠色打勾，代表人工抽查通過後才輸出。下方一條橫線串起三個圓點，代表從資料到輸出的一段流程。畫面上方寫著「試算表 AI 自動化」。圖中沒有任何產品標誌、介面截圖或人物。</desc>
