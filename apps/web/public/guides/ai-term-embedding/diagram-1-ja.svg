<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">表現の近さは事実を保証しない</title><desc id="desc">質問と文書をそれぞれ互換性のあるエンコードでベクトルに変換し、類似度の計算後に原文を取得して、実際の条件を確認する</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">表現の近さは事実を保証しない</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Embedding</text><path d="M 420 280 L 600 390" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 420 625 L 600 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 940 430 L 1130 430" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><rect x="90" y="200" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="255" y="269" font-size="28" fill="#102A2B" text-anchor="middle">質問</text><text x="255" y="312" font-size="22" fill="#5C6B6B" text-anchor="middle">雨の日はどこに行ける</text><rect x="90" y="550" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="255" y="619" font-size="28" fill="#102A2B" text-anchor="middle">文書</text><text x="255" y="662" font-size="22" fill="#5C6B6B" text-anchor="middle">活動メモ</text><rect x="610" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="775" y="424" font-size="25" fill="#102A2B" text-anchor="middle" style="font-size: 25px;">互換性のあるベクトル表現</text><text x="775" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">モデルに応じて類似度を比較</text><rect x="1140" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1305" y="424" font-size="28" fill="#102A2B" text-anchor="middle">候補の原文を読む</text><text x="1305" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">予約と開館条件を確認</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 図版制作 2026</text></svg>
