<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">임베딩 벡터(Embedding)란: 콘텐츠를 비교 가능한 공간에 배치하기</title><desc id="desc">서로 다른 군집의 기하학적 점들이 질의점을 둘러싸고 있으며, 콘텐츠를 비교 가능한 벡터로 매핑하는 것을 상징합니다</desc><rect width="1600" height="900" fill="#F7F1E8" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker></defs><circle cx="260" cy="370" r="28" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="320" cy="280" r="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="380" cy="420" r="32" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="1040" cy="250" r="42" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="1120" cy="340" r="32" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="1240" cy="260" r="38" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="980" cy="620" r="40" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="1120" cy="660" r="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5" /><circle cx="720" cy="460" r="62" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="5" /><path d="M 720 460 L 390 405" fill="none" stroke="#2F6F9F" stroke-width="5" /><path d="M 720 460 L 1080 330" fill="none" stroke="#D97A2B" stroke-width="5" /><path d="M 720 460 L 1000 620" fill="none" stroke="#D97A2B" stroke-width="5" /></svg>
