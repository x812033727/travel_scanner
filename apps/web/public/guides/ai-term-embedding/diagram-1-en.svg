<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Similar Vectors Do Not Guarantee Truth</title><desc id="desc">The question and documents are encoded into compatible vectors. After similarity is calculated, the original text is retrieved to check actual conditions.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"></path></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Similar Vectors Do Not Guarantee Truth</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Embedding</text><path d="M 420 280 L 600 390" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 420 625 L 600 475" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><path d="M 940 430 L 1130 430" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"></path><rect x="90" y="200" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="255" y="269" font-size="28" fill="#102A2B" text-anchor="middle">Question</text><text x="255" y="312" font-size="22" fill="#5C6B6B" text-anchor="middle">Where to go when it rains?</text><rect x="90" y="550" width="330" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="255" y="619" font-size="28" fill="#102A2B" text-anchor="middle">Documents</text><text x="255" y="662" font-size="22" fill="#5C6B6B" text-anchor="middle">Activity notes</text><rect x="610" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="775" y="424" font-size="19" fill="#102A2B" text-anchor="middle" style="font-size: 19px;">Compatible vector representations</text><text x="775" y="467" font-size="19" fill="#5C6B6B" text-anchor="middle" style="font-size: 19px;">Compare model-specific similarity</text><rect x="1140" y="340" width="330" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1305" y="424" font-size="23" fill="#102A2B" text-anchor="middle" style="font-size: 23px;">Read candidates' original text</text><text x="1305" y="467" font-size="17" fill="#5C6B6B" text-anchor="middle" style="font-size: 17px;">Check booking and opening conditions</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Illustration 2026</text></svg>
