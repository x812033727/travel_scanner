<title id="title">付款前先停下來 / Pause before you pay</title>
<desc id="desc">米色底上，左邊一條細線從畫面上緣垂下，吊著一個橘色對話框，框裡有白色星形火花與幾條文字線，對話框下方掛著一支深色魚鉤，像釣魚的餌；一條橘色虛線從對話框連到右邊一張藍色付款卡，付款卡右上角蓋著一個紅色圓形暫停標誌；下方寫著「付款前先停下來」。</desc>
