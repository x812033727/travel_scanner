<text x="935.0" y="459.0" font-size="17" fill="#102A2B" text-anchor="middle">寫明具體內容與真實姓名</text>
<line x1="1121.3" y1="435.0" x2="1171.3" y2="435.0" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1179.3" y="374" width="360.7" height="122" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="5"/>
<text x="1359.7" y="427.0" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">向公平會檢舉</text>
<text x="1359.7" y="459.0" font-size="17" fill="#102A2B" text-anchor="middle">附上廣告等事證</text>
<line x1="302" y1="435.0" x2="322" y2="435.0" stroke="#2F6F9F" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="330" y="536" font-size="17" fill="#5C6B6B">社群與通訊軟體群組、說明會、銷售現場的口頭推銷，都算讓公眾得知的方法</text>
<rect x="40" y="588" width="1520" height="214" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#B8442D" stroke-opacity="0.35" stroke-width="2"/>
<rect x="60" y="610" width="236" height="122" rx="14" fill="#B8442D"/>
<text x="178.0" y="665.0" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">疑似詐騙</text>
<text x="178.0" y="697.0" font-size="17" fill="#FFFFFF" text-anchor="middle">Suspected fraud</text>
<rect x="330.0" y="610" width="360.7" height="122" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
