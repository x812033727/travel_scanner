<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">出了問題找誰：退費、廣告誇大與疑似詐騙 / Where to turn: refunds, misleading ads and suspected fraud</title>
<desc id="desc">三條由左往右的路線。第一條退費與解約：書面通知業者解除，網路下單 7 日內可解除；向業者或線上申訴系統申訴；業者應在 15 日內妥適處理；沒處理好再向縣市消費者保護官二次申訴；最後向消費爭議調解委員會申請調解。這條路線下方註明：撥 1950 可轉接縣市消費者服務中心諮詢；線上數位內容要業者事先告知排除並經你同意才開通，才能拒退。第二條廣告誇大：保存廣告截圖與網址日期；以書面或電子文件寫明具體內容與真實姓名；向公平會檢舉並附上廣告等事證。社群群組、說明會與現場口頭推銷都算讓公眾得知的方法。第三條疑似詐騙：停止付款、不交出存摺與網銀密碼；保留對話與轉帳紀錄；撥 165 諮詢、檢舉或報案。拉人頭分潤、先付保證金、拉進群組投資都走這一條。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102A2B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">出了問題找誰：退費、廣告誇大與疑似詐騙</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Where to turn: refunds, misleading ads and suspected fraud</text>
