<rect x="582.0" y="138" width="202.0" height="122" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="683.0" y="191.0" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">向業者申訴</text>
<text x="683.0" y="223.0" font-size="17" fill="#102A2B" text-anchor="middle">或用線上申訴系統</text>
