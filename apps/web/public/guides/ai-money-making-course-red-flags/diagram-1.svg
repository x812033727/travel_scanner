<text x="1187.0" y="223.0" font-size="17" fill="#102A2B" text-anchor="middle">二次申訴</text>
<line x1="1294.0" y1="199.0" x2="1330.0" y2="199.0" stroke="#102A2B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1338.0" y="138" width="202.0" height="122" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5"/>
<text x="1439.0" y="191.0" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">消費爭議</text>
<text x="1439.0" y="223.0" font-size="17" fill="#102A2B" text-anchor="middle">調解委員會</text>
<line x1="302" y1="199.0" x2="322" y2="199.0" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
