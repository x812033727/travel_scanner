<title id="title">Gemini 3.8 Live와 Extended Thinking: 새 음성 모델, 내 계정으로 쓸 수 있을까</title><desc id="desc">오리지널 일러스트: 왼쪽의 둥근 말풍선 안에 음파를 나타내는 선들이 늘어서 있어 음성 대화를 나타낸다. 화살표가 오른쪽의 네 개 사각형을 가리키며 네 가지 이용자 구분을 나타내는데, 그중 두 개는 실선, 두 개는 점선 테두리로 그려 동시에 발표되었지만 개방 정도가 다름을 상징한다.</desc>
