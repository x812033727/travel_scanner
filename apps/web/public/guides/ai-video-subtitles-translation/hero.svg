<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">上字幕，再翻譯 / Subtitle it, then translate it</title>
<desc id="desc">幾何插圖：畫面中央上方寫著「上字幕，再翻譯」。左邊一個白色圓角螢幕，裡面有一個淺綠圓形與一個淺藍圓角方塊代表畫面，螢幕下緣有一條深色字幕條。一個橘色箭頭指向右邊另一個同樣大小的螢幕，右邊螢幕的字幕條換成墨綠色，代表換了語言。下方三個圓角小卡片分別鑲墨綠、藍與橘色邊框，每張卡片裡有兩條短線，代表同一份字幕的三種語言版本。全圖不含任何品牌標誌或介面截圖。</desc>
