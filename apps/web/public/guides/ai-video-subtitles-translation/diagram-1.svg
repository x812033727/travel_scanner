<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">影片上字幕與翻譯的五個關卡 / Subtitling and translating a video: five stages, three routes</title>
<desc id="desc">橫向五個關卡：取得聲音、轉成文字、校正字與時間、翻成目標語言、輸出或上架。下方三列是三條路線。CapCut 這一列：影片拖進時間軸並把音樂與音效靜音、在 Text 選 Auto Captions 選語言後產生字幕、用 Edit captions 改字並按 B 或 Ctrl+B 斷句、把字幕翻成另一語言並自己核對人名術語、輸出影片或單獨匯出 SRT。Whisper 這一列：準備音訊檔且電腦要有 ffmpeg、用 --output_format srt 產生字幕檔、用文字編輯器改字但時間碼不要動、--task translate 只翻得到英文、字幕檔再上傳或燒進畫面。YouTube 這一列：上傳影片、自動字幕有 67 種語言、在 Studio 字幕頁編輯、觀眾端自己點自動翻譯、也可以上傳 srt 字幕檔。最下方提醒：三家官方說明都寫自動辨識會出錯，發布前逐行核對人名、數字與專有名詞。</desc>
