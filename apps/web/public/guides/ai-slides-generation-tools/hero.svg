<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從大綱到簡報的自繪插圖 / Illustration: from an outline to a deck</title>
  <desc id="desc">幾何圖形插圖。畫面左邊是一張白色圓角卡片，上方一條深色標題條，下面四列圓點加橫條，代表一份條列式大綱。中間是一個朝右的粗箭頭。右邊是三張疊在一起的圓角投影片卡片，最前面那張裡有一條深色標題條、一個淺綠色的圖片方塊和三條灰色文字條，代表生成出來的簡報。右下角有一個綠色圓形，裡面是白色的打勾符號，代表生成完之後的人工檢查。畫面左下寫著「從大綱到簡報」六個字。沒有任何產品標誌、介面截圖或人物。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- outline sheet -->
  <rect x="170" y="230" width="320" height="420" rx="28" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="215" y="270" width="230" height="26" rx="13" fill="#102A2B"/>
  <circle cx="228" cy="360" r="13" fill="#D97A2B"/>
  <rect x="258" y="351" width="185" height="18" rx="9" fill="#5C6B6B"/>
  <circle cx="228" cy="430" r="13" fill="#0D6B68"/>
  <rect x="258" y="421" width="150" height="18" rx="9" fill="#5C6B6B"/>
  <circle cx="228" cy="500" r="13" fill="#0D6B68"/>
  <rect x="258" y="491" width="185" height="18" rx="9" fill="#5C6B6B"/>
  <circle cx="228" cy="570" r="13" fill="#0D6B68"/>
  <rect x="258" y="561" width="120" height="18" rx="9" fill="#5C6B6B"/>

  <!-- arrow -->
  <path d="M 545 412 L 655 412 L 655 378 L 730 440 L 655 502 L 655 468 L 545 468 Z" fill="#0D6B68"/>

  <!-- stacked slides -->
  <rect x="880" y="190" width="520" height="330" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="840" y="250" width="520" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <rect x="800" y="310" width="520" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"/>
  <rect x="840" y="350" width="300" height="28" rx="14" fill="#102A2B"/>
  <rect x="840" y="400" width="190" height="140" rx="16" fill="#E3F0EF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="1060" y="410" width="220" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="1060" y="452" width="180" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="1060" y="494" width="220" height="18" rx="9" fill="#5C6B6B"/>
  <rect x="840" y="570" width="300" height="18" rx="9" fill="#5C6B6B"/>

  <!-- human check -->
  <circle cx="1420" cy="690" r="70" fill="#2E7D5B"/>
  <path d="M 1385 690 L 1410 718 L 1458 660" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="170" y="790" font-size="54" font-weight="bold" fill="#102A2B">從大綱到簡報</text>
</svg>
