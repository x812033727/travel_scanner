<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">One Question, One Short Video</title><desc id="desc">Four cards show question and script, filming and editing, publishing preview, and results review, linking short-video production to the tasks readers need to complete.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">One Question, One Short Video</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Complete the message first, then refine pacing, format, and follow-up tracking</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Question &amp; script</text>
<text x="108.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Choose one main question</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Video, audio, captions</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Film &amp; edit</text>
<text x="477.0" y="371" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Show key actions clearly</text>
<text x="477.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Allow time to read and grasp</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 30px;">Publishing preview</text>
<text x="846.0" y="371" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Check overlays and next steps</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Verify music rights</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Results review</text>
<text x="1215.0" y="371" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Distinguish viewing metrics</text>
<text x="1215.0" y="423" font-size="21" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 21px;">Compile follow-up questions</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Every shot in a short video should help viewers understand the same clear question.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
