<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">一つの疑問を一本の動画に</title><desc id="desc">四枚のカードで、疑問に答える台本、撮影・編集、公開前プレビュー、成果の振り返りを示し、ショート動画の制作を読者が達成したいことにつなげる。</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">一つの疑問を一本の動画に</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">まず情報をそろえ、テンポ・形式・公開後の確認を整える</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">疑問と台本</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">主な疑問は一つ</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">映像・音声・字幕</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">撮影・編集</text>
<text x="477.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">重要な動作を明確に</text>
<text x="477.0" y="423" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">読む・理解する間を確保</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">公開前プレビュー</text>
<text x="846.0" y="371" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">見切れと案内先を確認</text>
<text x="846.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">音楽の使用権を照合</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">成果の振り返り</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">視聴指標を区別</text>
<text x="1215.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">その後の疑問を整理</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">ショート動画の各カットは、同じ一つの明確な疑問を視聴者が理解する助けになるべきです。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図解</text>
</svg>
