<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">先說出口，再找真人 / Say it first, then reach a person</title>
  <desc id="desc">一張抽象插圖。左邊是一個淺藍底、深藍框的圓角對話框，左下角有一個小尖角，框裡橫排著三顆深藍色的圓點，代表正在打字說出心裡的話。對話框右側有一串青綠色的圓點排成一條往上彎再落下的弧線，連到畫面右邊的三層青綠色同心圓，最內圈是實心的，像電話接通的訊號。下方有一條淡青綠色的細長橫條當作地面，四周散落幾顆橘色、綠色與藍色的小圓點。畫面上方寫著「先說出口，再找真人」。整張圖沒有任何文字標誌、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="152" font-size="58" font-weight="bold" fill="#102A2B" text-anchor="middle">先說出口，再找真人</text>

