<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">想找 AI 聊的時候，什麼時候該換成真人 / When to move from AI chat to a real person</title>
  <desc id="desc">一張三段式判斷流程圖。起點是「現在想找個對象說說話」，往下分成三條路。第一條：只是想抒發、想整理或想練習怎麼開口，AI 可以陪你走這一段，做法是把想說的話先講一次、請它歸納情緒日記、整理就醫要問的問題，電話與地址自己核對。第二條：同一件事困擾超過兩週，睡不著、吃不下、提不起勁，該把主角換成真人，可以找各縣市社區心理衛生中心、身心科或心理諮商所、青壯世代心理健康支持方案，AI 只做整理資料的工具。第三條：出現傷害自己或別人的念頭，或是已經走到行動邊緣，先停止跟 AI 對話，立刻撥 1925 安心專線或 1995 生命線，立即危險撥 110 或 119，身邊有人就先告訴他。三條路的終點都一樣，接電話的是真人：1925 安心專線提供 24 小時免付費心理諮詢，1995 生命線全日守候，110 報警，119 救護。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">想找 AI 聊的時候，什麼時候該換成真人</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">When to move from AI chat to a real person</text>

  <rect x="540" y="106" width="520" height="64" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="146" font-size="22" fill="#102A2B" text-anchor="middle">現在想找個對象說說話</text>

  <line x1="800" y1="170" x2="800" y2="204" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="212" width="460" height="100" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="254" font-size="19" fill="#102A2B" text-anchor="middle">只是想抒發、想整理</text>
  <text x="290" y="286" font-size="19" fill="#102A2B" text-anchor="middle">或想練習怎麼開口</text>

  <rect x="570" y="212" width="460" height="100" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="254" font-size="19" fill="#102A2B" text-anchor="middle">同一件事困擾超過兩週</text>
  <text x="800" y="286" font-size="19" fill="#102A2B" text-anchor="middle">睡不著、吃不下、提不起勁</text>

  <rect x="1080" y="212" width="460" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1310" y="254" font-size="19" fill="#102A2B" text-anchor="middle">出現傷害自己或別人的念頭</text>
  <text x="1310" y="286" font-size="19" fill="#102A2B" text-anchor="middle">或是已經走到行動邊緣</text>

  <line x1="290" y1="312" x2="290" y2="346" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="312" x2="800" y2="346" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1310" y1="312" x2="1310" y2="346" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="352" width="460" height="270" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="402" font-size="24" font-weight="bold" fill="#0D6B68" text-anchor="middle">AI 可以陪你走這一段</text>
  <line x1="88" y1="428" x2="492" y2="428" stroke="#0D6B68" stroke-width="2"/>
  <text x="88" y="472" font-size="18" fill="#102A2B">・把想說的話先講一次</text>
  <text x="88" y="512" font-size="18" fill="#102A2B">・請它歸納情緒日記</text>
  <text x="88" y="552" font-size="18" fill="#102A2B">・整理就醫要問的問題</text>
  <text x="88" y="592" font-size="18" fill="#102A2B">・電話地址自己核對</text>

  <rect x="570" y="352" width="460" height="270" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="402" font-size="24" font-weight="bold" fill="#2F6F9F" text-anchor="middle">該把主角換成真人</text>
  <line x1="598" y1="428" x2="1002" y2="428" stroke="#2F6F9F" stroke-width="2"/>
  <text x="598" y="472" font-size="18" fill="#102A2B">・各縣市社區心理衛生中心</text>
  <text x="598" y="512" font-size="18" fill="#102A2B">・身心科或心理諮商所</text>
  <text x="598" y="552" font-size="18" fill="#102A2B">・青壯世代心理健康支持方案</text>
  <text x="598" y="592" font-size="18" fill="#102A2B">・AI 只做整理資料的工具</text>

  <rect x="1080" y="352" width="460" height="270" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="1310" y="402" font-size="24" font-weight="bold" fill="#B8442D" text-anchor="middle">先停止跟 AI 對話</text>
  <line x1="1108" y1="428" x2="1512" y2="428" stroke="#B8442D" stroke-width="2"/>
  <text x="1108" y="472" font-size="18" fill="#102A2B">・立刻撥 1925 安心專線</text>
  <text x="1108" y="512" font-size="18" fill="#102A2B">・或撥 1995 生命線</text>
  <text x="1108" y="552" font-size="18" fill="#102A2B">・立即危險撥 110 或 119</text>
  <text x="1108" y="592" font-size="18" fill="#102A2B">・身邊有人就先告訴他</text>

  <line x1="290" y1="622" x2="290" y2="690" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="622" x2="800" y2="690" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1310" y1="622" x2="1310" y2="690" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="696" width="1480" height="124" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="744" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">三條路的終點都一樣：接電話的是真人</text>
  <text x="800" y="788" font-size="20" fill="#102A2B" text-anchor="middle">1925 安心專線 24 小時免付費心理諮詢 ｜ 1995 生命線全日守候 ｜ 110 報警 ｜ 119 救護</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
