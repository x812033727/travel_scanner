<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">重複的事寫成技能 / Turn a repeated routine into a reusable skill</title>
  <desc id="desc">插圖：米色底，畫面中間偏下是一個深青色的資料夾，左上角有標籤。資料夾裡抽出一張略微傾斜的白色卡片，卡片上有四列步驟：前兩列的方框已經打勾、塗成深青色，後兩列還是空的方框，每個方框右邊都有一條灰色的文字線條，代表一份可以逐項勾掉的步驟清單。畫面左上方是一個藍色的對話泡泡，泡泡裡有三個白點，尾巴朝資料夾的方向，代表你在對話裡提問。畫面右上方是一個橘色的齒輪，中間鏤空，代表這份步驟被自動執行。資料夾下方有一道淺色的地面陰影，四周散著幾個小圓點當裝飾。畫面下方只有一行字：重複的事寫成技能。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="250" cy="640" r="150" fill="#E3F0EF"/>
  <circle cx="1420" cy="720" r="110" fill="#E6F0F7"/>
  <circle cx="700" cy="120" r="70" fill="#E3F0EF"/>

  <!-- ground shadow -->
  <ellipse cx="800" cy="752" rx="520" ry="30" fill="#E3DDD2"/>

  <!-- folder back with tab -->
  <rect x="430" y="330" width="280" height="90" rx="26" fill="#0D6B68"/>
  <rect x="430" y="380" width="760" height="330" rx="36" fill="#0D6B68"/>

  <!-- the step card pulled out of the folder -->
  <g transform="rotate(-8 800 400)">
    <rect x="620" y="168" width="360" height="450" rx="18" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
    <rect x="660" y="216" width="180" height="16" rx="8" fill="#102A2B"/>

    <rect x="660" y="278" width="34" height="34" rx="8" fill="#0D6B68"/>
    <path d="M 668 296 L 676 304 L 688 286" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="712" y="288" width="210" height="14" rx="7" fill="#5C6B6B"/>

    <rect x="660" y="356" width="34" height="34" rx="8" fill="#0D6B68"/>
    <path d="M 668 374 L 676 382 L 688 364" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="712" y="366" width="160" height="14" rx="7" fill="#5C6B6B"/>

    <rect x="660" y="434" width="34" height="34" rx="8" fill="none" stroke="#5C6B6B" stroke-width="6"/>
    <rect x="712" y="444" width="200" height="14" rx="7" fill="#5C6B6B"/>

    <rect x="660" y="512" width="34" height="34" rx="8" fill="none" stroke="#5C6B6B" stroke-width="6"/>
    <rect x="712" y="522" width="140" height="14" rx="7" fill="#5C6B6B"/>
  </g>

  <!-- folder front -->
  <path d="M 410 500 H 1210 A 36 36 0 0 1 1246 536 L 1206 702 A 36 36 0 0 1 1170 732 H 450 A 36 36 0 0 1 414 702 L 374 536 A 36 36 0 0 1 410 500 Z" fill="#6FB3AF"/>
  <path d="M 410 500 H 1210 A 36 36 0 0 1 1246 536 L 1206 702 A 36 36 0 0 1 1170 732 H 450 A 36 36 0 0 1 414 702 L 374 536 A 36 36 0 0 1 410 500 Z" fill="none" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>

  <!-- speech bubble, top left -->
  <path d="M 120 150 Q 120 110 160 110 L 470 110 Q 510 110 510 150 L 510 252 Q 510 292 470 292 L 296 292 L 238 344 L 252 292 L 160 292 Q 120 292 120 252 Z" fill="#2F6F9F" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="235" cy="201" r="18" fill="#FFFFFF"/>
  <circle cx="315" cy="201" r="18" fill="#FFFFFF"/>
  <circle cx="395" cy="201" r="18" fill="#FFFFFF"/>

  <!-- gear, top right -->
  <g fill="#D97A2B">
    <rect x="1311" y="166" width="38" height="64" rx="10"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(45 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(90 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(135 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(180 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(225 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(270 1330 300)"/>
    <rect x="1311" y="166" width="38" height="64" rx="10" transform="rotate(315 1330 300)"/>
  </g>
  <circle cx="1330" cy="300" r="104" fill="#D97A2B"/>
  <circle cx="1330" cy="300" r="44" fill="#F7F1E8" stroke="#B8442D" stroke-width="8"/>

  <!-- small accents -->
  <circle cx="330" cy="470" r="16" fill="#D97A2B"/>
  <circle cx="1290" cy="500" r="12" fill="#2F6F9F"/>
  <circle cx="1470" cy="430" r="18" fill="#0D6B68"/>
  <circle cx="560" cy="180" r="12" fill="#2E7D5B"/>

  <!-- single line of text -->
  <text x="800" y="850" font-size="54" font-weight="700" fill="#102A2B" text-anchor="middle">重複的事寫成技能</text>
</svg>
