<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">固定字首可重用，問題仍各自處理</title><desc id="desc">相同規則與手冊形成共用字首，開放時間與裝置借用兩個不同問題各自接在後面並生成答案，修訂手冊則需新版本</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">固定字首可重用，問題仍各自處理</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Prompt Caching</text><path d="M 570 380 L 820 255" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 570 480 L 820 625" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="310" width="500" height="240" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="320" y="424" font-size="28" fill="#102A2B" text-anchor="middle">固定規則＋同版手冊</text><text x="320" y="467" font-size="22" fill="#5C6B6B" text-anchor="middle">可重用的字首處理</text><rect x="830" y="170" width="620" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1140" y="249" font-size="28" fill="#102A2B" text-anchor="middle">問題：何時開放</text><text x="1140" y="292" font-size="22" fill="#5C6B6B" text-anchor="middle">產生這一題的回答</text><rect x="830" y="540" width="620" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1140" y="619" font-size="28" fill="#102A2B" text-anchor="middle">問題：裝置怎麼借</text><text x="1140" y="662" font-size="22" fill="#5C6B6B" text-anchor="middle">產生另一題的回答</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
