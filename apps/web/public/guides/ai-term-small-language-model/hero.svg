<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">小型語言模型 / Small Language Model</title><desc id="desc">筆記卡片在一臺小型裝置旁被整理成有勾記的清單，裝置外圍有清楚邊界，象徵資源有限的本機語言處理。</desc><rect width="1600" height="900" fill="#F7F1E8"/><rect x="600" y="140" width="420" height="650" rx="60" fill="white" stroke="#0D6B68" stroke-width="16"/><rect x="650" y="230" width="320" height="430" rx="25" fill="#E3F0EF"/><path d="M710 350 L750 390 L825 310 M710 490 L750 530 L825 450" stroke="#2E7D5B" stroke-width="20" fill="none"/><circle cx="810" cy="720" r="25" fill="#0D6B68"/><rect x="200" y="280" width="260" height="320" rx="25" transform="rotate(-10 330 440)" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10"/><path d="M260 370 H400 M260 450 H380 M260 530 H390" stroke="#2F6F9F" stroke-width="18"/><path d="M1080 360 H1360 M1080 450 H1280 M1080 540 H1360" stroke="#D97A2B" stroke-width="20" stroke-linecap="round"/></svg>
