<line x1="800" y1="250" x2="800" y2="294" marker-end="url(#arrow)"/>
<line x1="1100" y1="250" x2="1100" y2="294" marker-end="url(#arrow)"/>
<line x1="1400" y1="250" x2="1400" y2="294" marker-end="url(#arrow)"/>
</g>

<g stroke-width="4">
<rect x="60" y="298" width="280" height="324" rx="14" fill="#FFFFFF" stroke="#0D6B68"/>
<rect x="360" y="298" width="280" height="324" rx="14" fill="#FFFFFF" stroke="#0D6B68"/>
<rect x="660" y="298" width="280" height="324" rx="14" fill="#FFFFFF" stroke="#0D6B68"/>
<rect x="960" y="298" width="280" height="324" rx="14" fill="#FFFFFF" stroke="#0D6B68"/>
<rect x="1260" y="298" width="280" height="324" rx="14" fill="#FFFFFF" stroke="#D97A2B"/>
</g>
<g stroke="#0D6B68" stroke-width="2" opacity="0.35">
<line x1="84" y1="362" x2="316" y2="362"/>
