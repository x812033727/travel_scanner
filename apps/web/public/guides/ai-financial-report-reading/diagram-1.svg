<line x1="1284" y1="362" x2="1516" y2="362"/>
</g>

<g font-size="20" font-weight="700" text-anchor="middle">
<text x="200" y="342" font-size="20" fill="#0D6B68">出處</text>
<text x="500" y="342" font-size="20" fill="#0D6B68">單位</text>
<text x="800" y="342" font-size="20" fill="#0D6B68">期間</text>
<text x="1100" y="342" font-size="20" fill="#0D6B68">範圍</text>
<text x="1400" y="342" font-size="20" fill="#D97A2B">重算</text>
