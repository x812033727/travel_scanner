<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">一句 AI 摘要，拆成五個問題對照原文 / Checking an AI summary against the original filing</title>
<desc id="desc">最上方是一個藍框，寫著一句假設的 AI 摘要：第三季營收若干億元，成長若干百分比。往下分出五個並排的檢查框。出處：問數字和引述是否真的在原文裡，看 AI 標的頁碼並逐字對照引述。單位：問是千元、百萬元還是元，看報表表頭的單位，每股盈餘以元計。期間：問是當季還是年初累計，看欄位標題，第四季等於全年減前三季累計。範圍：問是合併還是個體，看報告名稱與歸屬於母公司業主的數字。重算：問是和哪一期比、是年增還是季增，用兩期原始數字自己算一次。五個框匯到底部後分成兩條路：全部對上，就寫進筆記並附上頁碼與單位，之後引用都回到原文；任何一項對不上，就標記起來回原文查，不要請 AI 自己改。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#0D6B68"/>
</marker>
<marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#B8442D"/>
</marker>
</defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一句 AI 摘要，拆成五個問題對照原文</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Check every figure in an AI summary against the original filing</text>

<rect x="420" y="112" width="760" height="100" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
