<line x1="520" y1="662" x2="520" y2="712" marker-end="url(#arrow)"/>
</g>
<line x1="1150" y1="662" x2="1150" y2="712" stroke="#B8442D" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrowred)"/>
<text x="536" y="696" font-size="15" fill="#2E7D5B" font-weight="700">全部對上</text>
<text x="1166" y="696" font-size="15" fill="#B8442D" font-weight="700">任何一項對不上</text>

<rect x="180" y="716" width="680" height="104" rx="14" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="4"/>
<text x="520" y="758" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">寫進筆記，附上頁碼與單位</text>
<text x="520" y="794" font-size="17" fill="#102A2B" text-anchor="middle">之後引用都回到原文，不引用摘要</text>

<rect x="880" y="716" width="540" height="104" rx="14" fill="#FBEAE6" stroke="#B8442D" stroke-width="4"/>
