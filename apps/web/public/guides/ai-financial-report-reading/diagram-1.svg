<g font-size="17" fill="#102A2B" text-anchor="middle">
<text x="200" y="426" font-size="17">數字和引述</text>
<text x="200" y="452" font-size="17">真的在原文裡嗎</text>
<text x="200" y="530" font-size="17">AI 標的頁碼</text>
<text x="200" y="556" font-size="17">逐字對照引述</text>

<text x="500" y="426" font-size="17">千元、百萬元</text>
<text x="500" y="452" font-size="17">還是元</text>
<text x="500" y="530" font-size="17">報表表頭的單位</text>
<text x="500" y="556" font-size="17">每股盈餘以元計</text>

<text x="800" y="426" font-size="17">當季還是</text>
<text x="800" y="452" font-size="17">年初累計</text>
<text x="800" y="530" font-size="17">欄位標題</text>
<text x="800" y="556" font-size="17">第四季＝全年</text>
<text x="800" y="582" font-size="17">減前三季累計</text>

<text x="1100" y="426" font-size="17">合併還是個體</text>
<text x="1100" y="530" font-size="17">報告名稱</text>
<text x="1100" y="556" font-size="17">歸屬於母公司業主</text>

<text x="1400" y="426" font-size="17">和哪一期比</text>
<text x="1400" y="452" font-size="17">年增還是季增</text>
<text x="1400" y="530" font-size="17">兩期原始數字</text>
<text x="1400" y="556" font-size="17">自己算一次</text>
</g>

<g fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt">
<line x1="200" y1="622" x2="200" y2="662"/>
<line x1="500" y1="622" x2="500" y2="662"/>
<line x1="800" y1="622" x2="800" y2="662"/>
<line x1="1100" y1="622" x2="1100" y2="662"/>
<line x1="1400" y1="622" x2="1400" y2="662"/>
