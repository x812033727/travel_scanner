<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">逐項對照原文 / Checking an AI summary line by line against a report</title>
<desc id="desc">左邊是一張財務報告的頁面，深綠色頁首下方有六列同樣長短的表格列，每列是一個標籤格與一個數值格。右邊是一個藍色對話框，裡面有三行同樣長度的句子。三條虛線分別把報告上的三列連到對話框裡的三行句子，連線中間各有一個圓形記號：前兩個是綠色打勾，第三個是橘色驚嘆號，表示這一項還沒對上。下方一行字寫著逐項對照原文。</desc>
