<svg lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans',Arial,sans-serif">
  <title id="title">Phuket Airport to the Beaches and Old Town: Bus Routes and Where to Stay</title>
  <desc id="desc">Phuket International Airport sits at the northern end of the island. Smart Bus Route 1 runs south from the airport along the west coast for a flat fare of THB 100, with airport departures from 08:15 to 23:30: passing the Cherngtalay area (beside the Bang Tao and Laguna resort zone, which the bus does not enter), reaching Kamala in about 1 hour, Patong in about 80 minutes, Karon in about 90 minutes, Kata in about 100 minutes, and the Rawai terminus in about 130 minutes. Nai Harn lies west of Rawai with no Smart Bus stop, near sunset viewpoint Promthep Cape. Shared minivans also serve Patong, Karon, and Kata. The Airport Bus runs southeast to Phuket Old Town in about 1 hour 30 minutes for THB 50 to 100. Smart Bus Route 2 connects Old Town and Patong for THB 50, while Old Town has the free Dragon Line loop. For the return trip to the airport, the first bus leaves Kata Palm at 05:20 and arrives at 07:32; the last bus leaves Rawai at 19:30 and arrives at 21:52. Times are based on the January 16, 2026 timetable and are approximate.</desc>
