  <rect x="1110" y="470" width="450" height="270" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1140" y="512" font-size="20" font-weight="700" fill="#102A2B">공항행 귀환 To the airport</text>
  <text x="1140" y="562" font-size="17" font-weight="700" fill="#0D6B68">첫차 05:20 Kata Palm 출발</text>
  <text x="1140" y="590" font-size="17" fill="#102A2B">→ 07:32 공항 도착</text>
