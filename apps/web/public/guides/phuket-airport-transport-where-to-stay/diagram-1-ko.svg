    <text x="445" y="580" font-size="16" fill="#0D6B68">약 90분 · 미니밴 정차</text>

    <line x1="455" y1="630" x2="513" y2="630" stroke="#5C6B6B" stroke-width="2"/>
    <circle cx="525" cy="630" r="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
    <text x="445" y="624" font-size="18" font-weight="700">카타 Kata</text>
    <text x="445" y="650" font-size="16" fill="#0D6B68">약 100분 · 맑은 바다 · 미니밴 정차</text>

    <line x1="455" y1="790" x2="500" y2="805" stroke="#5C6B6B" stroke-width="2"/>
    <circle cx="510" cy="808" r="10" fill="#FFFFFF" stroke="#8A9696" stroke-width="4" stroke-dasharray="4 3"/>
    <text x="445" y="784" font-size="17" font-weight="700">나이한 Nai Harn · 프롬텝 곶 일몰 인근</text>
    <text x="445" y="810" font-size="16" fill="#B8442D">Smart Bus 정류장 없음</text>
  </g>

  <!-- Rawai -->
  <circle cx="610" cy="815" r="13" fill="#0D6B68" stroke="#FFFFFF" stroke-width="4"/>
  <text x="680" y="806" font-size="18" font-weight="700" fill="#102A2B">라와이 Rawai</text>
  <text x="680" y="832" font-size="16" fill="#0D6B68">약 130분 · Route 1 종점</text>

  <!-- Old Town -->
  <circle cx="740" cy="520" r="30" fill="none" stroke="#2E7D5B" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="740" cy="520" r="13" fill="#6B4A3A" stroke="#FFFFFF" stroke-width="4"/>
  <text x="826" y="512" font-size="17" font-weight="700" fill="#102A2B">푸켓 올드타운 Old Town</text>
  <text x="826" y="538" font-size="15" fill="#6B4A3A">시노포르투갈 거리 · 내륙 위치</text>
  <text x="826" y="566" font-size="15" font-weight="700" fill="#2E7D5B">Dragon Line 무료 순환</text>

  <!-- Airport Bus label -->
