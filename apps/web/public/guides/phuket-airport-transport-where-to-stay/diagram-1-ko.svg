<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="title">푸켓 공항에서 주요 해변·올드타운까지 버스 노선 및 숙소 구역 / Phuket Airport to the beaches and Old Town</title>
  <desc id="desc">푸켓 국제공항은 섬 북쪽 끝에 있습니다. Smart Bus Route 1은 공항에서 서부 해안을 따라 남하하며 단일 요금 100바트, 공항 출발 08:15~23:30입니다. Cherngtalay 일대(인근에 방타오 Laguna 리조트 단지가 있으며 버스는 리조트 단지 내부로 진입하지 않음)를 지나 카말라 약 1시간, 파통 약 80분, 카론 약 90분, 카타 약 100분, 종점 라와이 약 130분 소요됩니다. 나이한은 라와이 서쪽에 있어 일몰 명소 프롬텝 곶과 가깝지만 Smart Bus 정류장은 없습니다. 합승 미니밴도 파통·카론·카타에 정차합니다. 공항버스는 남동쪽 푸켓 올드타운까지 약 1시간 30분 걸리며 요금은 50~100바트입니다. Smart Bus Route 2는 올드타운에서 파통까지 50바트이며, 올드타운에는 무료 순환버스 Dragon Line이 운행합니다. 공항행 귀환 노선은 첫차 05:20 Kata Palm 출발(07:32 공항 도착), 막차 19:30 라와이 출발(21:52 공항 도착)입니다. 시각은 2026년 1월 16일 시행 시간표 기준이며 모두 대략적인 값입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">푸켓 공항에서 해변·올드타운까지: 버스 노선과 숙소 구역</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Phuket Airport to the beaches and Old Town · Smart Bus, Airport Bus and where to stay</text>

  <!-- sea panel -->
