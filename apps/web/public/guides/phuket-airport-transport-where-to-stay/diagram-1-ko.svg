    <text x="800" y="250" font-size="18" font-weight="700">공항버스 Airport Bus</text>
    <text x="800" y="276">약 1시간 30분</text>
    <text x="800" y="300">50–100바트</text>
  </g>

  <!-- legend -->
  <rect x="1110" y="110" width="450" height="330" rx="14" fill="#FFFFFF" stroke="#C9B99A" stroke-width="3"/>
