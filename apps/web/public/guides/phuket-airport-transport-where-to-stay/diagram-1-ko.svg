  <!-- Laguna / Cherngtalay -->
  <line x1="455" y1="300" x2="503" y2="300" stroke="#5C6B6B" stroke-width="2"/>
  <rect x="85" y="258" width="370" height="84" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="270" y="292" font-size="18" font-weight="700" fill="#2E7D5B" text-anchor="middle">방타오 Laguna: 리조트 단지</text>
  <text x="270" y="322" font-size="15" fill="#5C6B6B" text-anchor="middle">Cherngtalay 정류장 · 버스는 단지 내 미진입</text>
