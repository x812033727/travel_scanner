    <line x1="455" y1="630" x2="513" y2="630" stroke="#5C6B6B" stroke-width="2"/>
    <circle cx="525" cy="630" r="10" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
    <text x="445" y="624" font-size="18" font-weight="700">卡塔 กะตะ Kata</text>
