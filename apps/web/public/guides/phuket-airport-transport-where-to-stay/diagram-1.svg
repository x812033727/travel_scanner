<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans Thai','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">普吉機場到各海灘與老城的巴士路線與分區 / Phuket Airport to the beaches and Old Town</title>
  <desc id="desc">普吉機場在島的北端。Smart Bus Route 1 從機場沿西岸南下，單一票價 100 泰銖，機場發車 08:15 到 23:30：經 Cherngtalay 一帶（旁邊是邦濤 Laguna 度假村區，巴士不進度假村區），到卡馬拉約 1 小時、芭東約 80 分、卡隆約 90 分、卡塔約 100 分、終點拉威約 130 分。奈函在拉威西邊，Smart Bus 沒有站，靠近以夕陽聞名的神仙半島。共乘廂型車也到芭東、卡隆、卡塔。機場巴士往東南到普吉老城，約 1 小時 30 分，50 到 100 泰銖。Smart Bus Route 2 從老城到芭東 50 泰銖，老城有免費的 Dragon Line 循環線。回程往機場：首班 05:20 從 Kata Palm 發車，07:32 到機場；末班 19:30 從拉威發車，21:52 到機場。時刻依 2026 年 1 月 16 日起的班表，均為約略值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">普吉機場到海灘與老城：巴士路線與住宿分區</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Phuket Airport to the beaches and Old Town · Smart Bus, Airport Bus and where to stay</text>

