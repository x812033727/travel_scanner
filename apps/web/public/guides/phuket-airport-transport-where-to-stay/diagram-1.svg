  <circle cx="740" cy="520" r="13" fill="#6B4A3A" stroke="#FFFFFF" stroke-width="4"/>
  <text x="826" y="512" font-size="18" font-weight="700" fill="#102A2B">普吉老城 Phuket Old Town</text>
  <text x="826" y="538" font-size="16" fill="#6B4A3A">中葡街屋．不在海邊</text>
  <text x="826" y="566" font-size="16" font-weight="700" fill="#2E7D5B">Dragon Line 免費</text>

  <!-- Airport Bus label -->
  <g font-size="16" fill="#6B4A3A">
    <text x="800" y="250" font-size="18" font-weight="700">機場巴士 Airport Bus</text>
    <text x="800" y="276">約 1 小時 30 分</text>
    <text x="800" y="300">50–100 泰銖</text>
  </g>

  <!-- legend -->
  <rect x="1110" y="110" width="450" height="330" rx="14" fill="#FFFFFF" stroke="#C9B99A" stroke-width="3"/>
