  <line x1="1140" y1="192" x2="1210" y2="192" stroke="#0D6B68" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <text x="1230" y="186" font-size="17" font-weight="700" fill="#0D6B68">Smart Bus Route 1</text>
  <text x="1230" y="210" font-size="15" fill="#5C6B6B">機場 → 西岸各海灘 → 拉威</text>
  <line x1="1140" y1="252" x2="1210" y2="252" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <text x="1230" y="246" font-size="17" font-weight="700" fill="#6B4A3A">機場巴士 Airport Bus</text>
  <text x="1230" y="270" font-size="15" fill="#5C6B6B">機場 → 普吉老城</text>
  <line x1="1140" y1="312" x2="1210" y2="312" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <text x="1230" y="306" font-size="17" font-weight="700" fill="#B8442D">Smart Bus Route 2</text>
