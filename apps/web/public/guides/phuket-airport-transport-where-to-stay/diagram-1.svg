  <rect x="40" y="110" width="1040" height="750" rx="14" fill="#E6F0F7"/>
  <text x="1060" y="146" font-size="15" fill="#2F6F9F" text-anchor="end">示意圖，不按比例</text>

  <!-- island -->
  <path d="M 610 128 C 680 150, 720 220, 740 290 C 770 380, 810 460, 800 540 C 790 620, 740 690, 700 760 C 670 810, 620 850, 570 852 C 520 850, 480 820, 470 780 C 465 740, 490 700, 490 660 C 480 600, 470 540, 470 480 C 465 420, 460 360, 475 300 C 495 220, 545 140, 610 128 Z" fill="#F2E8D5" stroke="#C9B99A" stroke-width="3"/>

  <!-- Airport Bus (mocha) -->
  <path d="M 610 175 C 690 220, 740 330, 745 420 C 748 460, 745 490, 740 520" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <!-- Route 2 (coral) -->
  <path d="M 740 520 C 680 480, 590 470, 510 480" fill="none" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <!-- Route 1 (teal) -->
  <path d="M 610 175 C 570 210, 530 250, 515 300 L 505 400 L 510 480 L 515 560 L 525 630 C 545 700, 580 760, 610 815" fill="none" stroke="#0D6B68" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>

  <!-- Route 1 label inside island -->
  <g font-size="17" fill="#0D6B68" text-anchor="middle">
    <text x="615" y="330" font-weight="700">Smart Bus Route 1</text>
    <text x="615" y="356">100 泰銖</text>
    <text x="615" y="382">08:15–23:30</text>
  </g>
  <!-- Route 2 label -->
  <text x="635" y="452" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">Route 2．50 泰銖</text>

  <!-- airport -->
  <line x1="420" y1="172" x2="596" y2="175" stroke="#5C6B6B" stroke-width="2"/>
  <rect x="70" y="128" width="350" height="88" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="245" y="164" font-size="18" fill="#5C6B6B" text-anchor="middle">สนามบินภูเก็ต</text>
  <text x="245" y="196" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">普吉機場 Phuket Airport (HKT)</text>
  <circle cx="610" cy="175" r="14" fill="#0D6B68" stroke="#FFFFFF" stroke-width="4"/>

