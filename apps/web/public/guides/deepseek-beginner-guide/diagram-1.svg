<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">你要用 DeepSeek 嗎？先看身分，再看資料，最後選途徑 / Should you use DeepSeek? Who you are, what you paste, then which route</title>
  <desc id="desc">左邊是三個依序往下問的問題，右邊是每個答案導向的路。問題一：你在公務機關工作嗎？含公立學校、公營事業、行政法人，或使用公家的電腦與網路；答「是」就不能用，行政院 2025 年 2 月 3 日要求公務機關全面禁用，含雲端服務、App 與地端下載，研究需求依程序報准後可用。答「否」往下到問題二：要貼進去的資料敏感嗎？個資、密碼、病歷、合約、客戶資料、原始碼、未公開文件都算敏感，判斷不了就當成敏感；答「不敏感」走途徑一官方 App 或網頁版，免費、模型最新（V4.1-Flash），資料存放在中華人民共和國，預設可用於訓練，可在設定關閉。答「敏感」往下到問題三：你有什麼資源？會寫程式、有雲端預算，走途徑二第三方雲端託管，例如 Microsoft Foundry、Amazon Bedrock，資料進該平台的資料中心，不經 DeepSeek，按 token 付費，版本落後官方；有一台記憶體與顯示卡夠強的電腦，走途徑三自己電腦跑開源權重，MIT 授權、免費、資料不離開電腦，完整版 552B 參數要伺服器級 GPU，一般電腦跑 Ollama 的 deepseek-r1 從 1.5b 到 671b 七種尺寸裡的小尺寸；跑不動又沒預算，就不要用 AI 處理這份資料，或改用已經評估過資料流向的工具。右側面板整理三條路的資料去向：途徑一到 DeepSeek 在中華人民共和國的伺服器，隱私政策寫可用於訓練除非關閉；途徑二到該雲端平台的資料中心，適用該平台的隱私條款；途徑三只在你的電腦裡，不需要網路，完整版要伺服器級 GPU。三條路的共同點：審查行為跟著權重走，特定話題可能不回答或答得不完整；任何模型都會有幻覺，重要事實另找一手來源。不論哪條路都不要貼身分證、護照、信用卡、密碼、病歷、合約、客戶名單、原始碼、含個資的訂單截圖。公務機關、公立學校、公營事業三種途徑都不能用。圖上的規定與模型名稱為 2026 年 9 月 13 日查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">你要用 DeepSeek 嗎？先看身分，再看資料，最後選途徑</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Should you use DeepSeek? Who you are, what you paste, then which route</text>

  <!-- Q1 -->
  <rect x="60" y="110" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="280" y="144" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題一　你在公務機關工作嗎？</text>
  <text x="280" y="174" font-size="16" fill="#102A2B" text-anchor="middle">含公立學校、公營事業、行政法人，</text>
  <text x="280" y="198" font-size="16" fill="#102A2B" text-anchor="middle">或使用公家的電腦與網路</text>
  <text x="280" y="226" font-size="15" fill="#5C6B6B" text-anchor="middle">（研究需求依程序報准後可用）</text>

  <!-- banned -->
  <rect x="600" y="110" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="820" y="144" font-size="19" font-weight="700" fill="#B8442D" text-anchor="middle">不能用</text>
  <text x="820" y="174" font-size="16" fill="#102A2B" text-anchor="middle">行政院 2025 年 2 月 3 日要求</text>
  <text x="820" y="198" font-size="16" fill="#102A2B" text-anchor="middle">公務機關全面禁用，含雲端服務、</text>
  <text x="820" y="226" font-size="16" fill="#102A2B" text-anchor="middle">App 與地端下載</text>
  <path d="M 502 180 L 596 180" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="549" y="170" font-size="16" fill="#5C6B6B" text-anchor="middle">是</text>
  <path d="M 280 252 L 280 291" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="296" y="278" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <rect x="60" y="295" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="280" y="329" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題二　要貼進去的資料敏感嗎？</text>
  <text x="280" y="359" font-size="16" fill="#102A2B" text-anchor="middle">個資、密碼、病歷、合約、客戶資料、</text>
  <text x="280" y="383" font-size="16" fill="#102A2B" text-anchor="middle">原始碼、未公開文件都算敏感</text>
  <text x="280" y="411" font-size="15" fill="#5C6B6B" text-anchor="middle">（判斷不了就當成敏感）</text>

  <!-- route 1 -->
  <rect x="600" y="295" width="440" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="820" y="329" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">途徑一　官方 App／網頁版</text>
  <text x="820" y="359" font-size="16" fill="#102A2B" text-anchor="middle">免費、模型最新（V4.1-Flash）</text>
  <text x="820" y="383" font-size="16" fill="#102A2B" text-anchor="middle">資料存放在中華人民共和國，</text>
  <text x="820" y="411" font-size="16" fill="#102A2B" text-anchor="middle">預設可用於訓練，可在設定關閉</text>
  <path d="M 502 365 L 596 365" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="549" y="355" font-size="16" fill="#5C6B6B" text-anchor="middle">不敏感</text>
  <path d="M 280 437 L 280 476" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="296" y="463" font-size="16" fill="#5C6B6B">敏感</text>

  <!-- Q3 -->
  <rect x="60" y="480" width="440" height="140" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="280" y="514" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題三　你有什麼資源？</text>
  <text x="280" y="544" font-size="16" fill="#102A2B" text-anchor="middle">會寫程式、有雲端預算，</text>
  <text x="280" y="568" font-size="16" fill="#102A2B" text-anchor="middle">或有一台記憶體與顯示卡夠強的電腦</text>
  <text x="280" y="596" font-size="15" fill="#5C6B6B" text-anchor="middle">（兩者都沒有，見右下的灰框）</text>

  <!-- route 2 -->
  <rect x="600" y="480" width="440" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="820" y="514" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">途徑二　第三方雲端託管</text>
  <text x="820" y="544" font-size="16" fill="#102A2B" text-anchor="middle">Microsoft Foundry、Amazon Bedrock 等</text>
  <text x="820" y="568" font-size="16" fill="#102A2B" text-anchor="middle">資料進該平台的資料中心，不經 DeepSeek</text>
  <text x="820" y="596" font-size="16" fill="#102A2B" text-anchor="middle">按 token 付費，版本落後官方</text>
  <path d="M 502 550 L 596 550" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="549" y="522" font-size="15" fill="#5C6B6B" text-anchor="middle">有工程師</text>
  <text x="549" y="541" font-size="15" fill="#5C6B6B" text-anchor="middle">與預算</text>
  <path d="M 280 622 L 280 661" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="296" y="648" font-size="16" fill="#5C6B6B">有夠強的電腦</text>

  <!-- route 3 -->
  <rect x="60" y="665" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="280" y="699" font-size="19" font-weight="700" fill="#D97A2B" text-anchor="middle">途徑三　自己電腦跑開源權重</text>
  <text x="280" y="729" font-size="16" fill="#102A2B" text-anchor="middle">MIT 授權、免費，資料不離開電腦</text>
  <text x="280" y="753" font-size="16" fill="#102A2B" text-anchor="middle">完整版 552B 參數要伺服器級 GPU</text>
  <text x="280" y="777" font-size="16" fill="#102A2B" text-anchor="middle">一般電腦跑 Ollama 的 deepseek-r1</text>
  <text x="280" y="801" font-size="16" fill="#102A2B" text-anchor="middle">1.5b 到 671b 七種尺寸裡的小尺寸</text>

  <!-- none of the above -->
  <rect x="600" y="665" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="820" y="699" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">都沒有：不要用 AI 處理這份資料</text>
  <text x="820" y="729" font-size="16" fill="#5C6B6B" text-anchor="middle">資料敏感又沒有安全的途徑時，</text>
  <text x="820" y="753" font-size="16" fill="#5C6B6B" text-anchor="middle">不用是最安全的選擇；</text>
  <text x="820" y="777" font-size="16" fill="#5C6B6B" text-anchor="middle">或改用你已經評估過資料流向的工具</text>
  <path d="M 502 745 L 596 745" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="549" y="735" font-size="16" fill="#5C6B6B" text-anchor="middle">跑不動</text>

  <!-- side panel -->
  <rect x="1140" y="110" width="400" height="715" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="1168" y="144" font-size="19" font-weight="700" fill="#102A2B">資料去哪裡　Where data goes</text>
  <circle cx="1176" cy="184" r="8" fill="#0D6B68"/>
  <text x="1194" y="190" font-size="17" font-weight="700" fill="#102A2B">途徑一　官方 App／網頁版</text>
  <text x="1168" y="216" font-size="16" fill="#102A2B">→ DeepSeek 在中華人民共和國的伺服器</text>
  <text x="1168" y="240" font-size="16" fill="#102A2B">→ 隱私政策：可用於訓練，除非關閉</text>
  <circle cx="1176" cy="280" r="8" fill="#2F6F9F"/>
  <text x="1194" y="286" font-size="17" font-weight="700" fill="#102A2B">途徑二　第三方雲端託管</text>
  <text x="1168" y="312" font-size="16" fill="#102A2B">→ 該雲端平台的資料中心</text>
  <text x="1168" y="336" font-size="16" fill="#102A2B">→ 適用該平台的隱私條款，不經 DeepSeek</text>
  <circle cx="1176" cy="376" r="8" fill="#D97A2B"/>
  <text x="1194" y="382" font-size="17" font-weight="700" fill="#102A2B">途徑三　自己電腦跑開源權重</text>
  <text x="1168" y="408" font-size="16" fill="#102A2B">→ 只在你的電腦裡，不需要網路</text>
  <text x="1168" y="432" font-size="16" fill="#102A2B">→ 完整版要伺服器級 GPU</text>
  <line x1="1168" y1="462" x2="1512" y2="462" stroke="#5C6B6B" stroke-width="2" opacity="0.4"/>
  <text x="1168" y="496" font-size="17" font-weight="700" fill="#102A2B">三條路的共同點</text>
  <text x="1168" y="524" font-size="16" fill="#102A2B">・審查行為跟著權重走：特定話題</text>
  <text x="1168" y="548" font-size="16" fill="#102A2B">　可能不回答或答得不完整</text>
  <text x="1168" y="572" font-size="16" fill="#102A2B">・任何模型都會有幻覺，</text>
  <text x="1168" y="596" font-size="16" fill="#102A2B">　重要事實另找一手來源</text>
  <text x="1168" y="640" font-size="17" font-weight="700" fill="#B8442D">不論哪條路都不要貼</text>
  <text x="1168" y="668" font-size="16" fill="#102A2B">身分證、護照、信用卡、密碼、</text>
  <text x="1168" y="692" font-size="16" fill="#102A2B">病歷、合約、客戶名單、原始碼、</text>
  <text x="1168" y="716" font-size="16" fill="#102A2B">含個資的訂單截圖</text>
  <text x="1168" y="760" font-size="15" fill="#5C6B6B">公務機關、公立學校、公營事業：</text>
  <text x="1168" y="782" font-size="15" fill="#5C6B6B">三種途徑都不能用</text>

  <text x="60" y="858" font-size="15" fill="#5C6B6B">圖上的規定與模型名稱為 2026 年 9 月 13 日查證，以行政院、數位發展部與 DeepSeek 官網為準。</text>
