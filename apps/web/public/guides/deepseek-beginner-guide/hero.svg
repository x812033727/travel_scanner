<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一個對話泡泡分成三條路：雲端、伺服器、自己的電腦 / One chat bubble, three routes: the cloud, a server, your own computer</title>
  <desc id="desc">米色底上，左邊是一個白色的大對話泡泡，裡面有三條長短不一的灰色橫條代表打進去的文字。泡泡右側伸出三條粗線：藍色的一條往右上連到一朵藍色的雲，墨綠色的一條往右連到一台有三格抽屜的伺服器機櫃，橘色的一條往右下連到一台橘色邊框的筆記型電腦。左下角一行字寫著「資料去哪裡？」。整張圖沒有其他文字，也沒有任何品牌標誌。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <circle cx="1270" cy="480" r="330" fill="#E3F0EF" opacity="0.55"/>
  <circle cx="200" cy="150" r="60" fill="#E6F0F7"/>
  <circle cx="760" cy="820" r="34" fill="#E6F0F7"/>
  <circle cx="90" cy="700" r="22" fill="#0D6B68" opacity="0.25"/>

  <!-- three routes out of the bubble -->
  <path d="M 640 380 C 820 380 860 230 1120 230" fill="none" stroke="#2F6F9F" stroke-width="12" stroke-linecap="round"/>
  <path d="M 640 430 C 820 430 900 460 1150 460" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <path d="M 640 480 C 820 480 860 700 1110 700" fill="none" stroke="#D97A2B" stroke-width="12" stroke-linecap="round"/>

  <!-- chat bubble -->
  <path d="M 200 610 L 180 690 L 300 610 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <rect x="120" y="250" width="520" height="360" rx="44" fill="#FFFFFF" stroke="#102A2B" stroke-width="7"/>
  <rect x="200" y="613" width="94" height="10" fill="#FFFFFF"/>
  <rect x="180" y="330" width="380" height="30" rx="15" fill="#102A2B" opacity="0.18"/>
  <rect x="180" y="400" width="290" height="30" rx="15" fill="#102A2B" opacity="0.18"/>
  <rect x="180" y="470" width="340" height="30" rx="15" fill="#102A2B" opacity="0.18"/>
  <rect x="180" y="540" width="120" height="30" rx="15" fill="#0D6B68" opacity="0.6"/>

  <!-- cloud -->
  <path d="M 1150 290 A 58 58 0 0 1 1195 185 A 88 88 0 0 1 1340 165 A 62 62 0 0 1 1395 290 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="7" stroke-linejoin="round"/>

  <!-- server rack -->
  <rect x="1170" y="350" width="200" height="230" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="7"/>
  <rect x="1198" y="380" width="144" height="46" rx="9" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <rect x="1198" y="442" width="144" height="46" rx="9" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <rect x="1198" y="504" width="144" height="46" rx="9" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <circle cx="1320" cy="403" r="7" fill="#2E7D5B"/>
  <circle cx="1320" cy="465" r="7" fill="#2E7D5B"/>
  <circle cx="1320" cy="527" r="7" fill="#D97A2B"/>

  <!-- laptop -->
  <rect x="1130" y="620" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="7"/>
  <rect x="1160" y="650" width="150" height="20" rx="10" fill="#D97A2B" opacity="0.35"/>
  <rect x="1160" y="690" width="240" height="20" rx="10" fill="#D97A2B" opacity="0.35"/>
  <rect x="1160" y="730" width="90" height="20" rx="10" fill="#D97A2B" opacity="0.35"/>
  <rect x="1090" y="804" width="380" height="28" rx="14" fill="#D97A2B"/>

  <text x="120" y="810" font-size="48" font-weight="700" fill="#102A2B">資料去哪裡？</text>
</svg>
