<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">讓它跑程式畫圖 / A bar chart and a line growing out of a file, beside a chat bubble</title>
  <desc id="desc">米色底的插圖。畫面中央偏左是一個白色的檔案圖示，右上角摺角，下半部有三條深色的短文字線。從檔案的上緣長出三根由矮到高的長條，顏色依序是墨綠、綠、橘；一條藍色的折線帶著四個圓點，從檔案左側往右上方一路升高，穿過三根長條的頂端。右側是一個大的墨綠色對話泡泡，尾巴朝向左下方的檔案，泡泡裡有三條由長到短的淺綠色文字線與一顆橘色的小圓點，代表正在回答。畫面下方置中一行深色的字：讓它跑程式畫圖。沒有任何品牌標誌、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="330" cy="230" r="110" fill="#E3F0EF"/>
  <circle cx="1390" cy="730" r="130" fill="#E6F0F7"/>

  <!-- file icon -->
  <path d="M 524 470 H 790 L 860 540 V 756 a 24 24 0 0 1 -24 24 H 524 a 24 24 0 0 1 -24 -24 V 494 a 24 24 0 0 1 24 -24 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 790 470 V 516 a 24 24 0 0 0 24 24 H 860 Z" fill="#E3F0EF" stroke="#102A2B" stroke-width="6" stroke-linejoin="round"/>
  <rect x="548" y="636" width="200" height="16" rx="8" fill="#5C6B6B"/>
  <rect x="548" y="678" width="250" height="16" rx="8" fill="#5C6B6B"/>
  <rect x="548" y="720" width="160" height="16" rx="8" fill="#5C6B6B"/>

  <!-- bars growing out of the file -->
  <rect x="540" y="300" width="66" height="200" rx="12" fill="#0D6B68"/>
  <rect x="630" y="220" width="66" height="280" rx="12" fill="#2E7D5B"/>
  <rect x="720" y="140" width="66" height="360" rx="12" fill="#D97A2B"/>

  <!-- rising line with dots -->
  <path d="M 470 340 L 573 262 L 663 182 L 753 102" stroke="#2F6F9F" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="470" cy="340" r="16" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="573" cy="262" r="16" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="663" cy="182" r="16" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="753" cy="102" r="16" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="6"/>

  <!-- chat bubble -->
  <rect x="990" y="240" width="440" height="320" rx="48" fill="#0D6B68"/>
  <path d="M 1080 552 L 992 648 L 1150 552 Z" fill="#0D6B68"/>
  <rect x="1040" y="310" width="330" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="1040" y="380" width="260" height="26" rx="13" fill="#E3F0EF"/>
  <rect x="1040" y="450" width="190" height="26" rx="13" fill="#E3F0EF"/>
  <circle cx="1262" cy="463" r="14" fill="#D97A2B"/>

  <text x="800" y="852" text-anchor="middle" font-size="52" font-weight="700" fill="#102A2B">讓它跑程式畫圖</text>
</svg>
