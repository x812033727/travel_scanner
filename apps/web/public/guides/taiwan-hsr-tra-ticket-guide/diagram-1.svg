<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台北到台中、台南、左營：高鐵最快車程與票價，以及台鐵的差別 / Taipei to Taichung, Tainan and Zuoying: fastest THSR times and fares, compared with TRA</title>
  <desc id="desc">高鐵路線圖：台北到台中最快 47 分、標準車廂對號座 NT$700；台中到台南 36 分、NT$650；台南到左營 12 分、NT$140；台北直達台南最快 1 小時 25 分、NT$1,350；台北直達左營最快 1 小時 34 分、NT$1,490。高鐵台中站走通廊到台鐵新烏日站再搭區間車 11 分、NT$22 到台中車站；高鐵台南站走通廊到台鐵沙崙站再搭沙崙線 23 分、NT$37 到台南車站；高鐵左營站與台鐵新左營站、高雄捷運 R16 同一棟。台鐵對照：台北到台中最快 1 小時 49 分、自強號等級 NT$500；台北到台南最快 3 小時 16 分、NT$891；台北到高雄最快 3 小時 46 分、NT$994。2026 年 9 月以高鐵與台鐵官網查證。 / THSR route map: Taipei to Taichung 47 minutes and NT$700 standard reserved; Taichung to Tainan 36 minutes NT$650; Tainan to Zuoying 12 minutes NT$140; Taipei to Tainan direct 1 h 25 min NT$1,350; Taipei to Zuoying direct 1 h 34 min NT$1,490. THSR Taichung connects by corridor to TRA Xinwuri, then 11 minutes and NT$22 by local train to Taichung Station; THSR Tainan connects to TRA Shalun, then 23 minutes and NT$37 to Tainan Station; THSR Zuoying shares its building with TRA Xinzuoying and Kaohsiung MRT R16. TRA comparison: Taipei to Taichung 1 h 49 min NT$500, to Tainan 3 h 16 min NT$891, to Kaohsiung 3 h 46 min NT$994. Checked on the THSRC and TRA sites in September 2026.</desc>
