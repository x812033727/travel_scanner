<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">收據與分項限額 / A receipt and its separate caps</title>
<desc id="desc">左邊是一張白色的收據，頂端有一條淺綠色標題帶，下面幾條長短不一的灰色線代表費用明細，其中一條是橘色，底邊畫成鋸齒狀。收據右側分出三個灰色箭頭，分別指向右邊三個同樣大小的白色圓角框。每個框裡有一條淺色軌道，軌道上有一段長度不同的綠色量條與一條橘色的直立刻度，代表三個給付項目各自的上限。畫面下方一行字寫著「分項各有上限」。</desc>
