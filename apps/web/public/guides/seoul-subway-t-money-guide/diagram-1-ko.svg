<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">서울 교통카드 선택 도표: T-money 또는 Climate Card</title>
  <desc id="desc">먼저 공항에서 시내로 들어오는 교통편을 확인한다. 인천공항역에서는 Climate Card로 승차할 수 없다. 공항철도 일반열차를 탄다면 빈 카드 가격이 약 2,500~5,000원인 T-money를 먼저 살 수 있다. 질문 하나: 지하철이나 버스를 각각 요금을 내고 여러 번 탈 예정인가? 환승할인으로 기본요금이 추가되지 않는 이동은 별도의 유료 이동이 아니다. 이용 횟수가 적다면 지하철 1,550원, 버스 1,500원부터 시작하는 T-money를 쓴다. 하차 후 30분 이내 환승 시 할인이 적용된다. 질문 둘: 그 이동이 모두 공식 이용 구간 안에 있는가? 인천공항에서 시내로 가거나 신분당선, 수원, 남이섬 등 적용되지 않는 구간에서는 T-money를 쓴다. 다만 서울의 이용 가능 역에서 공항철도 일반열차를 타면 인천공항 T1/T2에서 하차할 수 있다. 반대로 공항역에서 승차할 수는 없다. 질문 셋: 연속으로 며칠 사용할 것인가? 매번 별도로 기본요금 1,550원을 내고 승차권 전체 기간에 환승할인이 적용되지 않는다고 가정하면, Climate Card 실물 카드를 이미 가진 경우 1/2/3/5/7일권은 각각 최소 4/6/7/10/13회 타야 본전을 뽑는다. 실물 카드를 새로 사면 3,000원이 추가되어 같은 순서로 6/8/9/12/15회가 필요하다. 이 횟수는 액면가 기준으로 해외 신용·체크카드 수수료를 포함하지 않는다. 실제 결제액으로 손익분기 승차 횟수를 다시 계산하자. 단기권은 충전 당일부터 계산한다. 지하철 1~8호선의 지정 신형 기기에서는 해외 신용·체크카드로 단기권을 충전할 수 있지만 일부 판매처는 여전히 현금이 필요하다. 한두 번만 탄다면 기본요금 1,650원에 보증금 500원이 추가되는 일회용 교통카드도 쓸 수 있다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">서울 교통카드: 질문 세 가지로 고르는 T-money와 Climate Card(2026년 9월 요금 확인)</text>


  <rect x="300" y="72" width="1000" height="60" rx="30" fill="#2E7D5B" />
  <text x="800" y="110" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">공항에서 일반열차로 시내 이동? T-money 티머니 먼저 구매(빈 카드 약 2,500~5,000원)</text>
  <path d="M 800 134 L 800 166" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <polygon points="800,170 1100,230 800,290 500,230" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="224" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 1  서울에 머무는 동안</text>
  <text x="800" y="250" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">지하철·버스를 따로 여러 번 타나요?</text>

  <path d="M 500 230 L 330 230 L 330 296" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="470" y="222" font-size="18" fill="#5C6B6B" text-anchor="end">아니요</text>
  <rect x="120" y="300" width="420" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
  <text x="330" y="332" font-size="19" font-weight="700" fill="#1F5C42" text-anchor="middle">T-money 이용할 때마다 결제 티머니</text>
  <text x="330" y="358" font-size="15" fill="#1F5C42" text-anchor="middle">지하철 1,550원·버스 1,500원부터(10km 이내)</text>
  <text x="330" y="382" font-size="15" fill="#1F5C42" text-anchor="middle">하차 후 30분 이내 환승 할인(21:00~07:00에는 60분)</text>

  <path d="M 800 292 L 800 336" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="320" font-size="18" fill="#5C6B6B">예</text>


  <polygon points="800,340 1130,400 800,460 470,400" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="394" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 2  모두 공식 이용 범위에 포함되나요?</text>
  <text x="800" y="420" font-size="15" fill="#5C6B6B" text-anchor="middle">(공항→시내 제외, 서울→공항 일반열차 하차 가능)</text>

  <path d="M 1130 400 L 1176 400" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="1153" y="390" font-size="16" fill="#5C6B6B" text-anchor="middle">아니요</text>
  <rect x="1180" y="350" width="390" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1375" y="382" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">제외 구간에서는 T-money 사용</text>
  <text x="1375" y="408" font-size="15" fill="#8A2E1D" text-anchor="middle">공항→시내, 직통열차·공항버스 제외</text>
  <text x="1375" y="432" font-size="15" fill="#8A2E1D" text-anchor="middle">서울의 이용 가능 역에서 일반열차 탑승 시 공항 하차 가능</text>

  <path d="M 800 462 L 800 506" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="490" font-size="18" fill="#5C6B6B">예</text>


  <rect x="570" y="510" width="460" height="100" rx="22" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="554" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">질문 3  연속 며칠 사용하나요?</text>
  <text x="800" y="580" font-size="15" fill="#5C6B6B" text-anchor="middle">Climate Card 단기권 전체 기간의 유료 승차 횟수 비교</text>
  <path d="M 800 612 L 800 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 240 650 L 1360 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <g stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 240 650 L 240 676" />
    <path d="M 520 650 L 520 676" />
    <path d="M 800 650 L 800 676" />
    <path d="M 1080 650 L 1080 676" />
    <path d="M 1360 650 L 1360 676" />
  </g>
