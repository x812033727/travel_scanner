    <text x="1090" y="672">5일</text>
    <text x="1370" y="672">7일</text>
  </g>
  <g fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4">
    <rect x="115" y="680" width="250" height="90" rx="14" />
    <rect x="395" y="680" width="250" height="90" rx="14" />
    <rect x="675" y="680" width="250" height="90" rx="14" />
    <rect x="955" y="680" width="250" height="90" rx="14" />
    <rect x="1235" y="680" width="250" height="90" rx="14" />
  </g>
  <g font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="712">1일권 5,000원</text>
    <text x="520" y="712">2일권 8,000원</text>
    <text x="800" y="712">3일권 10,000원</text>
    <text x="1080" y="712">5일권 15,000원</text>
    <text x="1360" y="712">7일권 20,000원</text>
  </g>
  <g font-size="15" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="738">기존 카드: 전체 4회</text>
    <text x="520" y="738">기존 카드: 전체 6회</text>
    <text x="800" y="738">기존 카드: 전체 7회</text>
    <text x="1080" y="738">기존 카드: 전체 10회</text>
    <text x="1360" y="738">기존 카드: 전체 13회</text>
    <text x="240" y="760">새 카드＋3,000: 6회</text>
    <text x="520" y="760">새 카드＋3,000: 8회</text>
    <text x="800" y="760">새 카드＋3,000: 9회</text>
    <text x="1080" y="760">새 카드＋3,000: 12회</text>
    <text x="1360" y="760">새 카드＋3,000: 15회</text>
  </g>


  <text x="60" y="812" font-size="15" fill="#5C6B6B">각각 1,550원을 내는 승차 기준. 액면가 손익분기점에는 해외 카드 수수료가 없으므로 실제 결제액으로 다시 계산.</text>
  <text x="60" y="840" font-size="15" fill="#5C6B6B">한두 번만 탄다면 일회용 교통카드 1,650원+보증금 500원(하차 후 환급). 버스에서는 사용 불가. 최대 4번 환승 가능하며 버스 하차 시 태그하지 않으면 환승이 끊깁니다.</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 제작 2026</text>
