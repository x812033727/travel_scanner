<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">ソウル交通カード選択チャート：T-moneyかClimate Cardか</title>
  <desc id="desc">まず空港から市内への移動手段を確認。仁川空港駅から Climate Card では入場できません。空港鉄道の一般列車に乗るなら、約 2,500～5,000 ウォンの T-money カードを先に買えます。質問：個別に運賃が発生する地下鉄やバスの乗車が何度もありますか？乗り継ぎ割引で基本運賃が追加されない区間は、別の有料乗車に数えません。乗車が少なければ T-money を使い、地下鉄は 1,550 ウォン、バスは 1,500 ウォンから。降車後 30 分以内の乗り換えには割引があります。次の質問：それらの乗車はすべて公式の対象区間内ですか？仁川空港から市内、新盆唐線、水原や南怡島など対象外の移動には T-money を使います。ただし、ソウルの対象駅から空港鉄道の一般列車に乗れば、仁川空港 T1／T2 で降車できます。空港駅から逆方向に入場することはできません。最後の質問：連続して何日使いますか？各乗車で基本運賃 1,550 ウォンを個別に払い、有効期間中に乗り継ぎ割引が適用されない場合、Climate Card の実物カードをすでに持っていれば、1／2／3／5／7 日券はそれぞれ期間中に少なくとも 4／6／7／10／13 回の乗車で元が取れます。実物カードを新たに買う場合は別途 3,000 ウォンがかかり、同じ順に 6／8／9／12／15 回必要です。これは額面運賃による回収回数で、海外発行のクレジット／デビットカードの手数料を含みません。実際の請求額で回収回数を計算し直してください。短期券はチャージ当日から有効。地下鉄 1～8 号線の指定された新型券売機では海外発行のクレジット／デビットカードでチャージでき、一部の方法では現金が必要です。少ししか乗らない場合は単回用交通カードも選べます。基本運賃 1,650 ウォンに保証金 500 ウォンが加わります。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ソウル交通カード：三つの質問で選ぶT-moneyとClimate Card（運賃は2026/9確認）</text>


  <rect x="300" y="72" width="1000" height="60" rx="30" fill="#2E7D5B" />
  <text x="800" y="110" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">空港から一般列車で市内へ？まず T-money 티머니 を購入（カード約 2,500～5,000 ウォン）</text>
  <path d="M 800 134 L 800 166" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <polygon points="800,170 1100,230 800,290 500,230" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="224" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問 1　ソウル滞在中、</text>
  <text x="800" y="250" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">別料金の地下鉄・バス移動が多い？</text>

  <path d="M 500 230 L 330 230 L 330 296" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="470" y="222" font-size="18" fill="#5C6B6B" text-anchor="end">いいえ</text>
  <rect x="120" y="300" width="420" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
  <text x="330" y="332" font-size="19" font-weight="700" fill="#1F5C42" text-anchor="middle">T-moneyで都度払い 티머니</text>
  <text x="330" y="358" font-size="15" fill="#1F5C42" text-anchor="middle">地下鉄1,550・バス1,500ウォンから（10キロ以内）</text>
  <text x="330" y="382" font-size="15" fill="#1F5C42" text-anchor="middle">下車後30分以内は乗継割引（21:00〜07:00は60分）</text>

  <path d="M 800 292 L 800 336" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="320" font-size="18" fill="#5C6B6B">はい</text>


  <polygon points="800,340 1130,400 800,460 470,400" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="394" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問 2　すべて公式対象範囲内の乗車？</text>
  <text x="800" y="420" font-size="15" fill="#5C6B6B" text-anchor="middle">（空港→市内は不可／ソウル→空港は降車可）</text>

  <path d="M 1130 400 L 1176 400" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="1153" y="390" font-size="16" fill="#5C6B6B" text-anchor="middle">いいえ</text>
  <rect x="1180" y="350" width="390" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1375" y="382" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">対象外区間は T-money を利用</text>
  <text x="1375" y="408" font-size="15" fill="#8A2E1D" text-anchor="middle">空港から市内、直通列車、空港バスは対象外</text>
  <text x="1375" y="432" font-size="15" fill="#8A2E1D" text-anchor="middle">ソウルの対象駅から一般列車なら空港で降車可</text>

  <path d="M 800 462 L 800 506" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="490" font-size="18" fill="#5C6B6B">はい</text>


  <rect x="570" y="510" width="460" height="100" rx="22" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="554" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">質問3　連続で何日使う？</text>
  <text x="800" y="580" font-size="15" fill="#5C6B6B" text-anchor="middle">Climate Card 短期券：全期間の有料乗車回数で比較</text>
  <path d="M 800 612 L 800 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 240 650 L 1360 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <g stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 240 650 L 240 676" />
    <path d="M 520 650 L 520 676" />
    <path d="M 800 650 L 800 676" />
    <path d="M 1080 650 L 1080 676" />
    <path d="M 1360 650 L 1360 676" />
  </g>
  <g font-size="15" fill="#5C6B6B">
    <text x="250" y="672">1日</text>
    <text x="530" y="672">2日</text>
    <text x="810" y="672">3日</text>
    <text x="1090" y="672">5日</text>
    <text x="1370" y="672">7日</text>
  </g>
  <g fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4">
    <rect x="115" y="680" width="250" height="90" rx="14" />
    <rect x="395" y="680" width="250" height="90" rx="14" />
    <rect x="675" y="680" width="250" height="90" rx="14" />
    <rect x="955" y="680" width="250" height="90" rx="14" />
    <rect x="1235" y="680" width="250" height="90" rx="14" />
  </g>
  <g font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="712">1日券5,000ウォン</text>
    <text x="520" y="712">2日券8,000ウォン</text>
    <text x="800" y="712">3日券10,000ウォン</text>
    <text x="1080" y="712">5日券15,000ウォン</text>
    <text x="1360" y="712">7日券20,000ウォン</text>
  </g>
  <g font-size="15" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="738">カード所持：全期間で 4 回</text>
    <text x="520" y="738">カード所持：全期間で 6 回</text>
    <text x="800" y="738">カード所持：全期間で 7 回</text>
    <text x="1080" y="738">カード所持：全期間で 10 回</text>
    <text x="1360" y="738">カード所持：全期間で 13 回</text>
    <text x="240" y="760">新規カード＋3,000：6 回</text>
    <text x="520" y="760">新規カード＋3,000：8 回</text>
    <text x="800" y="760">新規カード＋3,000：9 回</text>
    <text x="1080" y="760">新規カード＋3,000：12 回</text>
    <text x="1360" y="760">新規カード＋3,000：15 回</text>
  </g>


  <text x="60" y="812" font-size="15" fill="#5C6B6B">個別に 1,550 ウォンを払う乗車で計算。額面の回収回数は海外発行カードの手数料を含まず、実際の請求額で再計算。</text>
  <text x="60" y="840" font-size="15" fill="#5C6B6B">一、二回だけなら使い捨て交通カード：1,650ウォン＋保証金500ウォン（下車後返却）。バスでは使えない。乗り継ぎは最大4回。バスを降りる際にタッチしないと乗り継ぎが途切れる。</text>
