<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">Seoul transit card decision tree: T-money or Climate Card / Which Seoul transit card to buy</title>
  <desc id="desc">At Incheon Airport you cannot enter with Climate Card. For AREX all-stop, buy T-money; an empty card costs 2,500–5,000 won. First: Several separately paid subway/bus rides? A discounted transfer with no additional basic fare does not count. Otherwise use T-money: subway from 1,550 won, bus from 1,500 won, with a transfer discount within 30 minutes of getting off. Second: Are all rides covered? Use T-money for excluded trips such as Incheon Airport to the city, Sinbundang Line, Suwon, or Nami Island. But you can exit at Incheon Airport T1/T2 after taking an AREX all-stop train from an eligible Seoul station; you cannot enter at the airport in the reverse direction. Third: How many consecutive days? If each ride incurs a separate basic fare of 1,550 won and no transfer discounts apply during the pass period, holders of a physical Climate Card need at least 4/6/7/10/13 rides to break even on the 1/2/3/5/7-day passes, respectively. A new physical card adds 3,000 won and raises those thresholds, in the same order, to 6/8/9/12/15 rides. These are face-value thresholds excluding any overseas-card service fee; recompute the break-even ride count from the amount actually charged. Short-term passes start on the top-up day. Designated new machines on subway Lines 1–8 accept overseas credit/debit cards for short-term passes; some channels still require cash. For just one or two rides, a single-use transit card is another option: a basic fare of 1,650 won plus a 500-won deposit.</desc>
