  <text x="330" y="382" font-size="15" fill="#1F5C42" text-anchor="middle">Transfer discount within 30 min (60 min from 21:00 to 07:00)</text>

  <path d="M 800 292 L 800 336" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="320" font-size="18" fill="#5C6B6B">Yes</text>


  <polygon points="800,340 1130,400 800,460 470,400" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="394" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">Question 2 · All trips covered?</text>
  <text x="800" y="420" font-size="15" fill="#5C6B6B" text-anchor="middle">(Airport→city: no; Seoul→airport all-stop: exit yes)</text>

