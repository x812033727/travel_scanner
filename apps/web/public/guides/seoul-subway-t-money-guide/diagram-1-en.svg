  <text x="60" y="812" font-size="15" fill="#5C6B6B">Break-even uses separate 1,550-won fares. Face-value thresholds exclude overseas-card fees; recompute from the amount charged.</text>
  <text x="60" y="840" font-size="15" fill="#5C6B6B">Only one or two rides? A single-use card costs 1,650 won plus a refundable 500-won deposit; it cannot be used on buses. Up to 4 transfers; tap off buses or the transfer chain ends.</text>
