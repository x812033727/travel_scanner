<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">首尔交通卡决策树：买 T-money 还是 Climate Card</title>
  <desc id="desc">先确认进城交通；仁川机场站不能用 Climate Card 进站，如乘机场铁路普通列车，可先买 T-money，空卡约 2,500 到 5,000 韩元。问题一：会有多次分别计费的地铁或公交行程吗？享换乘优惠且未另收基础票价的下一段不算另一次付费；乘车少就用 T-money，地铁 1,550、公交 1,500 韩元起，下车后 30 分钟内换乘有优惠。问题二：这些行程都在官方适用区段内吗？从仁川机场前往市区、新盆唐线、水原与南怡岛等不适用时用 T-money；但从首尔适用车站乘机场铁路普通列车，可在仁川机场 T1／T2 出站，反方向不能在机场进站。问题三：要连续用几天？若每趟都分别支付 1,550 韩元基本票价，整个票期都不适用换乘优惠，已有 Climate Card 实体卡时，1／2／3／5／7 日券分别至少需要 4／6／7／10／13 趟才回本；新买实体卡另加 3,000 韩元，依次需要 6／8／9／12／15 趟。这些仅按票面金额计算，未含境外信用卡／借记卡可能产生的服务费；须按实际扣款金额重新计算回本趟数。短期券从充值当天起算；地铁 1 到 8 号线的指定新机器可用境外信用卡／借记卡充值短期券，部分渠道仍须现金。只乘一两趟也可用一次性交通卡，基本票价 1,650 韩元，另加押金 500。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">首尔交通卡：三个问题选 T-money 或 Climate Card（2026 年 9 月核实票价）</text>


  <rect x="300" y="72" width="1000" height="60" rx="30" fill="#2E7D5B" />
  <text x="800" y="110" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">从机场乘普通列车进城？先买 T-money 티머니（空卡约 2,500 到 5,000 韩元）</text>
  <path d="M 800 134 L 800 166" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />


  <polygon points="800,170 1100,230 800,290 500,230" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="224" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 1　在首尔期间，</text>
  <text x="800" y="250" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">有多次分别付费的地铁／公交行程吗？</text>

  <path d="M 500 230 L 330 230 L 330 296" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="470" y="222" font-size="18" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="120" y="300" width="420" height="96" rx="14" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
  <text x="330" y="332" font-size="19" font-weight="700" fill="#1F5C42" text-anchor="middle">T-money 按次付费 티머니</text>
  <text x="330" y="358" font-size="15" fill="#1F5C42" text-anchor="middle">地铁 1,550・公交 1,500 韩元起（10 公里内）</text>
  <text x="330" y="382" font-size="15" fill="#1F5C42" text-anchor="middle">下车后 30 分钟内换乘优惠（21:00 到 07:00 为 60 分钟）</text>

  <path d="M 800 292 L 800 336" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="320" font-size="18" fill="#5C6B6B">是</text>


  <polygon points="800,340 1130,400 800,460 470,400" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="394" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 2　这些行程都在官方适用范围内吗？</text>
  <text x="800" y="420" font-size="15" fill="#5C6B6B" text-anchor="middle">（机场→市区不适用；首尔→机场普通列车可出站）</text>

  <path d="M 1130 400 L 1176 400" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <text x="1153" y="390" font-size="16" fill="#5C6B6B" text-anchor="middle">否</text>
  <rect x="1180" y="350" width="390" height="100" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
  <text x="1375" y="382" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">不适用区段用 T-money</text>
  <text x="1375" y="408" font-size="15" fill="#8A2E1D" text-anchor="middle">机场进城、直达列车和机场巴士不包含</text>
  <text x="1375" y="432" font-size="15" fill="#8A2E1D" text-anchor="middle">从首尔适用车站乘普通列车，可在机场出站</text>

  <path d="M 800 462 L 800 506" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)" />
  <text x="814" y="490" font-size="18" fill="#5C6B6B">是</text>


  <rect x="570" y="510" width="460" height="100" rx="22" fill="#FFFFFF" stroke="#102A2B" stroke-width="4" />
  <text x="800" y="554" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">问题 3　要连续用几天？</text>
  <text x="800" y="580" font-size="15" fill="#5C6B6B" text-anchor="middle">比较 Climate Card 短期券整个票期的付费趟数</text>
  <path d="M 800 612 L 800 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <path d="M 240 650 L 1360 650" stroke="#5C6B6B" stroke-width="4" fill="none" />
  <g stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 240 650 L 240 676" />
    <path d="M 520 650 L 520 676" />
    <path d="M 800 650 L 800 676" />
    <path d="M 1080 650 L 1080 676" />
    <path d="M 1360 650 L 1360 676" />
  </g>
  <g font-size="15" fill="#5C6B6B">
    <text x="250" y="672">1 天</text>
    <text x="530" y="672">2 天</text>
    <text x="810" y="672">3 天</text>
    <text x="1090" y="672">5 天</text>
    <text x="1370" y="672">7 天</text>
  </g>
  <g fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4">
    <rect x="115" y="680" width="250" height="90" rx="14" />
    <rect x="395" y="680" width="250" height="90" rx="14" />
    <rect x="675" y="680" width="250" height="90" rx="14" />
    <rect x="955" y="680" width="250" height="90" rx="14" />
    <rect x="1235" y="680" width="250" height="90" rx="14" />
  </g>
  <g font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="712">1 日券 5,000 韩元</text>
    <text x="520" y="712">2 日券 8,000 韩元</text>
    <text x="800" y="712">3 日券 10,000 韩元</text>
    <text x="1080" y="712">5 日券 15,000 韩元</text>
    <text x="1360" y="712">7 日券 20,000 韩元</text>
  </g>
  <g font-size="15" fill="#1F4E73" text-anchor="middle">
    <text x="240" y="738">已有卡：全期 4 趟</text>
    <text x="520" y="738">已有卡：全期 6 趟</text>
    <text x="800" y="738">已有卡：全期 7 趟</text>
    <text x="1080" y="738">已有卡：全期 10 趟</text>
    <text x="1360" y="738">已有卡：全期 13 趟</text>
    <text x="240" y="760">新卡＋3,000：6 趟</text>
    <text x="520" y="760">新卡＋3,000：8 趟</text>
    <text x="800" y="760">新卡＋3,000：9 趟</text>
    <text x="1080" y="760">新卡＋3,000：12 趟</text>
    <text x="1360" y="760">新卡＋3,000：15 趟</text>
  </g>


  <text x="60" y="812" font-size="15" fill="#5C6B6B">按每趟另付 1,550 韩元计算；票面回本门槛未含境外卡服务费，请按实际扣款金额重算。</text>
  <text x="60" y="840" font-size="15" fill="#5C6B6B">只乘坐一两趟：单次使用交通卡 1,650 韩元＋押金 500（出站退还），不能乘坐公交。最多换乘 4 次；下公交必须刷卡，否则换乘中断。</text>
  <text x="1540" y="882" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 制图 2026</text>
