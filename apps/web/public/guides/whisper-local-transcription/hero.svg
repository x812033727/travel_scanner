<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">離線轉逐字稿 / Turning a recording into text on your own machine</title>
<desc id="desc">抽象插圖。畫面中央是一台筆電形狀的深色外框與底座，螢幕裡分成左右兩邊：左邊是一個青綠色圓形，圓內有七根高低不同的直條，代表錄音的聲波；中間有一道橘色箭頭指向右邊；右邊是一張藍框的白色卡片，卡片上有五列內容，每一列左邊是橘色的時間戳標籤、右邊是長短不一的淺藍色橫條，代表帶時間戳的逐字稿。整台電腦以外沒有任何雲端或連線元素，畫面下方只有一行字：離線轉逐字稿。插圖沒有任何品牌標誌、介面截圖或人物。</desc>
