<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">從文字與圖片生成 3D 模型的示意插圖 / Text and image turning into a 3D model</title>
  <desc id="desc">左邊是兩張卡片，上面一張用三條橫線代表一段文字提示詞，下面一張用圓形與三角形代表一張參考圖片；兩個箭頭指向中間一個等角視角的立方體線框，立方體上有幾條細線代表網格面；立方體右側再分出兩個箭頭，上面是一個代表匯出檔案的方框，下面是一疊由寬到窄的橫條，代表 3D 列印一層一層堆出來的成品。底部有一行字：一句話變成 3D 模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- prompt card -->
  <rect x="120" y="170" width="320" height="190" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="165" y="218" width="230" height="18" rx="9" fill="#2F6F9F"/>
  <rect x="165" y="262" width="185" height="18" rx="9" fill="#2F6F9F"/>
  <rect x="165" y="306" width="130" height="18" rx="9" fill="#2F6F9F"/>

  <!-- reference image card -->
  <rect x="120" y="440" width="320" height="230" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <circle cx="205" cy="512" r="30" fill="#D97A2B"/>
  <path d="M 160 620 L 250 505 L 330 620 Z" fill="#2E7D5B"/>
  <path d="M 285 620 L 345 545 L 400 620 Z" fill="#0D6B68"/>

  <!-- arrows into the cube -->
  <line x1="460" y1="270" x2="600" y2="352" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="460" y1="556" x2="600" y2="474" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- isometric cube -->
  <path d="M 800 210 L 980 312 L 980 516 L 800 618 L 620 516 L 620 312 Z" fill="#E3F0EF" stroke="#0D6B68" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 800 210 L 800 414 M 800 414 L 980 516 M 800 414 L 620 516" stroke="#0D6B68" stroke-width="7" fill="none" stroke-linejoin="round"/>
  <path d="M 620 312 L 980 312 M 620 312 L 800 618 M 980 312 L 800 618" stroke="#2E7D5B" stroke-width="3" fill="none"/>

  <!-- arrows out of the cube -->
  <line x1="1010" y1="360" x2="1150" y2="300" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1010" y1="470" x2="1150" y2="552" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- exported file -->
  <path d="M 1170 200 L 1400 200 L 1470 268 L 1470 400 L 1170 400 Z" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 1400 200 L 1400 268 L 1470 268" fill="none" stroke="#2F6F9F" stroke-width="6" stroke-linejoin="round"/>
  <rect x="1215" y="300" width="180" height="16" rx="8" fill="#2F6F9F"/>
  <rect x="1215" y="336" width="120" height="16" rx="8" fill="#2F6F9F"/>

  <!-- printed layers -->
  <rect x="1265" y="470" width="110" height="28" rx="8" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="1240" y="512" width="160" height="28" rx="8" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="1210" y="554" width="220" height="28" rx="8" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="1190" y="596" width="260" height="28" rx="8" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="1170" y="638" width="300" height="28" rx="8" fill="#E3F0EF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="1140" y="684" width="360" height="12" rx="6" fill="#5C6B6B"/>

  <text x="800" y="810" text-anchor="middle" font-size="52" font-weight="bold" fill="#102A2B">一句話變成 3D 模型</text>
</svg>
