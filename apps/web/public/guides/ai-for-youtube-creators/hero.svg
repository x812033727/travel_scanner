<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">從構想到上片的製作路線 / From idea to publish</title>
<desc id="desc">一張抽象插圖。左邊是一顆亮著的燈泡，代表影片構想；一條粗線往右串起四個圓形站點，圓內分別是一份文稿、兩條字幕線、一張圖片與一個向上的箭頭，代表腳本、字幕、縮圖與上片四個環節；線的右端接到一個亮著橫線的螢幕，代表已發布的影片。四個站點上方各有一個橘色圓點與一道短線，標出 AI 介入的位置。下方一行字寫著「從構想到上片」。圖中沒有任何產品標誌、介面或人物。</desc>
