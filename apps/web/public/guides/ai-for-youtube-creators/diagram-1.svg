<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">YouTuber 的 AI 工作流與官方硬限制 / Where YouTube’s own AI fits in a creator’s flow</title>
<desc id="desc">一條由左至右的六步流程：企劃、腳本、拍攝與剪輯、字幕與配音、標題與縮圖、上片與標示。企劃與腳本由 YouTube 工作室的問問 Studio 負責，只支援電腦版瀏覽器，對話保留 30 天，回覆不可當專業建議；拍攝與剪輯桌機版沒有內建生成功能，要自己選剪輯軟體，生成素材在手機端；字幕與配音有自動字幕支援 67 種語言、直播字幕限訂閱數超過 1,000 的頻道、自動配音上限 120 分鐘；標題與縮圖可跑 A/B 測試最多 3 組、需跑滿 2 週才有結論，縮圖本身靠外部工具；上片時在屬性選「使用 AI 技術」揭露，Shorts 的 AI 片段最長 10 秒，營利政策以整個頻道為單位審查。下方兩欄列出必須揭露與不用揭露的例子，最下方一欄是 AI 換不掉的三件事：版權音樂、抄別人的影片與著作權警告。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="70" y="52" font-size="30" font-weight="700" fill="#102A2B">YouTuber 的 AI 工作流：內建功能與官方硬限制</text>
<text x="70" y="84" font-size="18" fill="#5C6B6B">Where YouTube’s own AI sits in the upload flow, and what each page says it will not do</text>
<rect x="70" y="125" width="205" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="172.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">企劃</text>
<rect x="70" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="172.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">問問 Studio</text>
<text x="172.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">限電腦版瀏覽器</text>
<text x="172.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">對話保留 30 天</text>
<line x1="283" y1="154" x2="310" y2="154" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="320" y="125" width="205" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="422.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">腳本</text>
<rect x="320" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="422.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">貼稿請它回饋</text>
<text x="422.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">外部 AI 起草</text>
<text x="422.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">不可當專業建議</text>
<line x1="533" y1="154" x2="560" y2="154" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="570" y="125" width="205" height="58" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="672.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">拍攝與剪輯</text>
<rect x="570" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="672.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">桌機版無內建</text>
<text x="672.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">剪輯軟體自己選</text>
<text x="672.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">生成功能在手機</text>
<line x1="783" y1="154" x2="810" y2="154" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="820" y="125" width="205" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="922.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">字幕與配音</text>
<rect x="820" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="922.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">自動字幕 67 種語言</text>
<text x="922.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">直播限 1,000 訂閱</text>
<text x="922.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">配音上限 120 分鐘</text>
<line x1="1033" y1="154" x2="1060" y2="154" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1070" y="125" width="205" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1172.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">標題與縮圖</text>
<rect x="1070" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1172.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">A/B 測試 3 組</text>
<text x="1172.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">跑滿 2 週才有結論</text>
<text x="1172.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">縮圖靠外部工具</text>
<line x1="1283" y1="154" x2="1310" y2="154" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1320" y="125" width="205" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1422.5" y="162" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">上片與標示</text>
<rect x="1320" y="200" width="205" height="150" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1422.5" y="246" font-size="16" fill="#102A2B" text-anchor="middle">屬性選「使用 AI」</text>
<text x="1422.5" y="282" font-size="16" fill="#102A2B" text-anchor="middle">Shorts 片段 10 秒</text>
<text x="1422.5" y="318" font-size="16" fill="#102A2B" text-anchor="middle">政策看整個頻道</text>
<rect x="70" y="385" width="705" height="155" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="92" y="424" font-size="18" font-weight="700" fill="#B8442D">必須揭露（在「屬性」選「是」）</text>
<text x="92" y="466" font-size="17" fill="#102A2B">AI 生成音樂、用 AI 生成實際地點的額外片段</text>
<text x="92" y="502" font-size="17" fill="#102A2B">讓人說出從未說過的建議、沒發生過的天災畫面</text>
<rect x="830" y="385" width="705" height="155" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="852" y="424" font-size="18" font-weight="700" fill="#0D6B68">官方明列不用揭露</text>
<text x="852" y="466" font-size="17" fill="#102A2B">大綱、腳本、縮圖、標題、資訊圖表、字幕製作</text>
<text x="852" y="502" font-size="17" fill="#102A2B">畫質修復、構思點子、複製自己的聲音用於旁白</text>
<rect x="70" y="575" width="1465" height="190" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="92" y="614" font-size="18" font-weight="700" fill="#D97A2B">AI 換不掉的三件事</text>
<text x="92" y="658" font-size="17" fill="#102A2B">版權音樂：用工作室的音效庫，標示創用 CC 授權的曲目要在說明標註作者</text>
<text x="92" y="694" font-size="17" fill="#102A2B">抄別人的影片：重複使用內容政策與著作權分開判定，以整個頻道為單位</text>
<text x="92" y="730" font-size="17" fill="#102A2B">著作權警告：完成著作權學校可在 90 天後失效，90 天內 3 次可能被終止</text>
<text x="70" y="815" font-size="17" fill="#5C6B6B">圖上的數字都是 YouTube 官方說明頁寫明的限制，查證日 2026 年 9 月 15 日。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
