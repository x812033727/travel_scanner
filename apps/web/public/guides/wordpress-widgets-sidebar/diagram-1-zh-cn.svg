<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">侧边栏的阅读检查</title><desc id="desc">侧边栏规划依用途、编辑位置、定位效果及多设备验收四阶段进行的图解。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">侧边栏的阅读检查</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">每个信息区块都要能说明用途与出现位置</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">用途</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">协助找内容</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">补充作者信息</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">必要内容在正文</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">位置</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">小工具区域</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">或模板区块</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">保存原设置</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">效果</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先用一般排列</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">再考虑粘性定位</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">高度不能过长</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">验收</text>
<text x="1215.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">手机与键盘</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">文字放大</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">主要按钮可用</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">信息更容易找到，正文也要保持完整可读。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
