<title id="title">文字變成聲音 / Text becomes voice</title>
<desc id="desc">以幾何圖形畫成的插圖。左邊是一張白色卡片，上面有五條代表文字的橫線；中間一個箭頭指向九根高低起伏的圓角直條，像一段聲音波形；右邊再一個箭頭指向一副簡化的耳機，由一條半圓弧與兩個圓角長方形組成，背後是一個淡藍色圓形。下方一行字寫著「文字變成聲音」。整張圖沒有任何商標、介面或人物。</desc>
