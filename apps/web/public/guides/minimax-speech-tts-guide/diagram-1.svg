<text x="88" y="528" font-size="16" fill="#102A2B">非同步 API 單次上限 1,000,000 字元</text>
<text x="88" y="560" font-size="16" fill="#102A2B">建立任務後拿 task_id，完成再用 file_id 下載</text>
<text x="88" y="592" font-size="16" fill="#102A2B">下載網址有效 9 小時，可回句級字幕時間戳</text>
<rect x="830" y="444" width="730" height="176" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="858" y="490" font-size="20" font-weight="700" fill="#B8442D">聲音複製的規則</text>
<text x="858" y="528" font-size="16" fill="#102A2B">需通過個人或企業驗證，錄音要有權利人授權</text>
<text x="858" y="560" font-size="16" fill="#102A2B">上傳錄音 10 秒到 5 分鐘，20 MB 以內</text>
<text x="858" y="592" font-size="16" fill="#102A2B">168 小時（7 天）未使用即刪；首次合成收 1.5 美元</text>
<rect x="60" y="648" width="1500" height="142" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="88" y="694" font-size="20" font-weight="700" fill="#0D6B68">動手前先確認的兩件事</text>
<text x="88" y="734" font-size="16" fill="#102A2B">一、要複製的聲音必須取得權利人授權，官網條款禁止冒充任何人。</text>
<text x="88" y="768" font-size="16" fill="#102A2B">二、輸出請標示 AI 生成；價格與規格以官網當天的頁面為準。</text>
