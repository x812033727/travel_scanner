<text x="84" y="232" font-size="15" fill="#102A2B">系統音色 332 個</text>
<text x="84" y="270" font-size="15" fill="#102A2B">中文普通話 34 個</text>
<text x="84" y="308" font-size="15" fill="#102A2B">粵語 6 個</text>
<text x="84" y="346" font-size="15" fill="#102A2B">也可自建複製音色</text>
<line x1="332" y1="266" x2="357" y2="266" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="369" y="118" width="264" height="296" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="415" cy="166" r="21" fill="#0D6B68"/>
<text x="415" y="173" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="449" y="174" font-size="20" font-weight="700" fill="#102A2B">調參數</text>
<text x="393" y="232" font-size="15" fill="#102A2B">語速 0.5 到 2</text>
<text x="393" y="270" font-size="15" fill="#102A2B">音量 0 到 10</text>
<text x="393" y="308" font-size="15" fill="#102A2B">音調 -12 到 12</text>
<text x="393" y="346" font-size="15" fill="#102A2B">情緒 9 種可選</text>
<text x="393" y="384" font-size="15" fill="#102A2B">停頓可自訂秒數</text>
<line x1="641" y1="266" x2="666" y2="266" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="678" y="118" width="264" height="296" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="724" cy="166" r="21" fill="#0D6B68"/>
<text x="724" y="173" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="758" y="174" font-size="20" font-weight="700" fill="#102A2B">產生</text>
<text x="702" y="232" font-size="15" fill="#102A2B">同步單次 10,000 字元</text>
<text x="702" y="270" font-size="15" fill="#102A2B">超過 3,000 字改串流</text>
<text x="702" y="308" font-size="15" fill="#102A2B">hd 或 turbo 擇一</text>
<line x1="950" y1="266" x2="975" y2="266" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="987" y="118" width="264" height="296" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="1033" cy="166" r="21" fill="#0D6B68"/>
