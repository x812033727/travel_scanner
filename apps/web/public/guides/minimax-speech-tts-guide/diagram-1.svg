<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">從文字到音檔：MiniMax 語音合成流程 / From text to audio with MiniMax Speech</title>
<desc id="desc">五個步驟的流程圖。第一步選音色：系統音色 332 個，其中中文普通話 34 個、粵語 6 個，也可以自建複製音色。第二步調參數：語速 0.5 到 2、音量 0 到 10、音調 -12 到 12、情緒 9 種可選，停頓可自訂秒數。第三步產生：同步單次上限 10,000 字元，超過 3,000 字改用串流，模型選 hd 或 turbo。第四步試聽：複製音色的試聽文字上限 1,000 字元，設計音色 500 字元，不對先換音色。第五步輸出：mp3、wav、flac 等格式，取樣率 8,000 到 44,100，下載連結有效 24 小時，可加字幕時間戳。左下方是長文與有聲書路線：非同步 API 單次上限 1,000,000 字元，建立任務後拿 task_id，完成再用 file_id 下載，下載網址有效 9 小時，可回句級字幕時間戳。右下方是聲音複製的規則：需通過個人或企業驗證，上傳錄音 10 秒到 5 分鐘、20 MB 以內，168 小時（7 天）未使用即刪除，第一次合成才收 1.5 美元。最下方提醒兩件事：要複製的聲音必須取得權利人授權，官網禁止冒充任何人；輸出請標示 AI 生成，價格與規格以官網當天頁面為準。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#5C6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#F7F1E8"/>
