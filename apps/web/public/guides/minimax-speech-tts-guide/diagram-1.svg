<text x="1011" y="232" font-size="15" fill="#102A2B">複製音色 1,000 字元</text>
<text x="1011" y="270" font-size="15" fill="#102A2B">設計音色 500 字元</text>
<text x="1011" y="308" font-size="15" fill="#102A2B">不對先換音色</text>
<line x1="1259" y1="266" x2="1284" y2="266" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1296" y="118" width="264" height="296" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<circle cx="1342" cy="166" r="21" fill="#0D6B68"/>
<text x="1342" y="173" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1376" y="174" font-size="20" font-weight="700" fill="#102A2B">輸出</text>
<text x="1320" y="232" font-size="15" fill="#102A2B">mp3／wav／flac</text>
<text x="1320" y="270" font-size="15" fill="#102A2B">取樣率 8,000–44,100</text>
<text x="1320" y="308" font-size="15" fill="#102A2B">連結有效 24 小時</text>
<text x="1320" y="346" font-size="15" fill="#102A2B">可加字幕時間戳</text>
<rect x="60" y="444" width="730" height="176" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
