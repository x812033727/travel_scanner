<title id="title">SEC 執法處長談兩種加密詐騙包裝：合夥投流動性池、假平台配投資社團</title><desc id="desc">原創插圖：左側一個圓形圖案代表被包裝成「流動性池」的募資名目，右側一個方形帶虛線邊框的圖案代表假交易平台，兩者以箭頭分別指向中央同一個警示符號，代表兩種包裝手法指向同一種投資人傷害；不含任何商標、字標或介面截圖</desc>
