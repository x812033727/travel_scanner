<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">Incheon Airport rail and bus routes into central Seoul</title>
  <desc id="desc">The AREX Express runs to Seoul Station; the all-stop train calls at Hongik Univ., Gongdeok, and other stations before Seoul Station; airport buses serve Myeongdong, Gangnam, and other areas; and N-series buses run late at night.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <text x="80" y="88" font-size="40" font-weight="700" fill="#102A2B">Incheon Airport → Central Seoul · Main routes</text>
  <text x="80" y="128" font-size="22" fill="#5C6B6B">Incheon Airport → central Seoul · Approximate travel times; check official timetables</text>


  <path d="M 300 470 C 620 470, 780 400, 1250 400" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"></path>

  <path d="M 300 470 C 560 470, 700 250, 960 250 L 1250 250 L 1250 400" fill="none" stroke="#6B4A3A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M 300 470 C 620 520, 900 580, 1210 580" fill="none" stroke="#B8442D" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"></path>
  <path d="M 300 470 C 620 600, 900 760, 1210 760" fill="none" stroke="#B8442D" stroke-width="10" stroke-dasharray="22 16" stroke-linecap="round"></path>

  <g>
    <rect x="80" y="410" width="220" height="120" rx="24" fill="#0D6B68"></rect>
    <text x="190" y="458" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Incheon</text>
    <text x="190" y="496" font-size="20" fill="#E6F2F1" text-anchor="middle">Terminals T1 / T2</text>
  </g>

  <g font-size="26" font-weight="700" fill="#102A2B">
    <circle cx="960" cy="250" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="960" y="210" text-anchor="middle">Hongik Univ.</text>
    <circle cx="1250" cy="250" r="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="8"></circle>
    <text x="1285" y="242">Gongdeok</text>
    <circle cx="1250" cy="400" r="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="8"></circle>
    <text x="1285" y="392">Seoul Station</text>
    <text x="1285" y="420" font-size="18" font-weight="400" fill="#5C6B6B">T1 43m / T2 51m · all-stop ~60m</text>
    <circle cx="1210" cy="580" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="588">Myeongdong</text>
    <text x="1285" y="616" font-size="16" font-weight="400" fill="#5C6B6B" style="font-size: 16px;">6001/6015 · N6701 Seoul Stn ~60m (T1)</text>
    <circle cx="1210" cy="760" r="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="8"></circle>
    <text x="1285" y="768">Gangnam</text>
    <text x="1285" y="796" font-size="18" font-weight="400" fill="#5C6B6B">6703 · N6000 Gangnam ~70m (T1)</text>
  </g>

  <g font-size="22" font-weight="700">
    <text x="560" y="300" fill="#6B4A3A">AREX all-stop</text>
    <text x="620" y="410" fill="#0D6B68">AREX express</text>
    <text x="520" y="690" fill="#B8442D">Airport &amp; N night buses</text>
  </g>

  <g font-size="20" fill="#102A2B">
    <line x1="80" y1="860" x2="140" y2="860" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"></line>
    <text x="152" y="867">AREX Express</text>
    <line x1="420" y1="860" x2="480" y2="860" stroke="#6B4A3A" stroke-width="10" stroke-linecap="round"></line>
    <text x="492" y="867">AREX All-Stop</text>
    <line x1="780" y1="860" x2="840" y2="860" stroke="#B8442D" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"></line>
    <text x="852" y="867">Bus</text>
    <text x="1180" y="867" fill="#5C6B6B">© Mokaair map 2026</text>
  </g>
