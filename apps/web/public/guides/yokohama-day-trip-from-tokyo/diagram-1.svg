<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">東京出發橫濱一日遊：三條進入線、みなとみらい線票價與港灣步行路線 / Yokohama day trip from Tokyo: ways in, Minatomirai Line fares and the harbor walk</title>
  <desc id="desc">左側是從東京進入橫濱的三條線：澀谷搭東急東横線，直通みなとみらい線；東京車站、品川搭 JR 京浜東北・根岸線，直達桜木町；新宿搭湘南新宿ライン到横浜站轉乘。右上是みなとみらい線六站：横浜、新高島、みなとみらい、馬車道、日本大通り、元町・中華街；一日乗車券 460 日圓，IC 卡運賃近距離 193 日圓、横浜到日本大通り與元町・中華街 224 日圓，只搭兩段最多 448 日圓，不回本。下方是步行路線：桜木町搭 YOKOHAMA AIR CABIN（單程 1,000 日圓）到運河パーク，走到カップヌードルミュージアム（入館 500 日圓，みなとみらい站步行 8 分），再到赤レンガ倉庫、大さん橋（日本大通り站步行 7 分）、山下公園，最後到中華街。左下角提醒：東急線みなとみらいパス澀谷出發 920 日圓，只在東急站售票機買、限當天；カップヌードルミュージアム週二休館。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">東京出發橫濱一日遊：從哪條線進去、票怎麼買、怎麼走</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Yokohama day trip from Tokyo: three ways in, Minatomirai Line fares and the harbor walking route</text>

