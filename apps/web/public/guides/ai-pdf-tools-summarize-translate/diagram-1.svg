<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">PDF 交給 AI 之前：先選對路 / Choosing an AI tool for a PDF</title>
  <desc id="desc">一張決策樹。最上面的問題是「你要這份 PDF 做什麼」，往下分成四條路。第一條是讀懂一兩份文件，工具是 ChatGPT、Claude 或 Gemini，官網上限是免費 ChatGPT 每天 3 個檔案、Claude 的 PDF 上限 1000 頁、Gemini 單檔 100 MB。第二條是對照很多份文件，工具是 Gemini Notebook，官網上限是免費每本 50 則來源、每則來源 50 萬字、每人 100 本筆記本。第三條是整份翻譯並留住版面，工具是 Google 翻譯與 DeepL 的文件翻譯，官網上限是 Google 翻譯 10 MB、PDF 限 300 頁以內、DeepL 免費 5 MB。第四條是檔案已經在 Acrobat 裡，工具是 Acrobat 的 AI 助理，官網上限是檔案小於 100 MB、最多 600 頁、支援的檔案語言不含中文。最下面一條橫幅寫四條路共同的坑：掃描檔與圖片型 PDF 只會被擷取數位文字、圖片會被丟掉，翻譯也不會動到圖片裡的字；不能外傳的檔案要用本機模型，不要上傳到雲端。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

