  <rect x="444" y="240" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="614" y="285" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">對照很多份文件</text>
  <rect x="816" y="240" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="986" y="285" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">整份翻譯留版面</text>
  <rect x="1188" y="240" width="340" height="72" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1358" y="285" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">檔案已經在 Acrobat 裡</text>

