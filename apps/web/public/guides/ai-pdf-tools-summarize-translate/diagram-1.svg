  <rect x="1188" y="344" width="340" height="96" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1358" y="381" font-size="19" font-weight="bold" fill="#102A2B" text-anchor="middle">Acrobat AI 助理</text>
  <text x="1358" y="412" font-size="17" fill="#5C6B6B" text-anchor="middle">AI Assistant</text>

  <path d="M 242 440 L 242 468" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 614 440 L 614 468" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 986 440 L 986 468" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1358 440 L 1358 468" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="72" y="472" width="340" height="152" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="242" y="508" font-size="17" font-weight="bold" fill="#2F6F9F" text-anchor="middle">官網寫的上限</text>
  <text x="242" y="546" font-size="17" fill="#102A2B" text-anchor="middle">免費 ChatGPT：每天 3 個檔案</text>
  <text x="242" y="578" font-size="17" fill="#102A2B" text-anchor="middle">Claude：PDF 上限 1000 頁</text>
  <text x="242" y="610" font-size="17" fill="#102A2B" text-anchor="middle">Gemini：單檔 100 MB</text>

  <rect x="444" y="472" width="340" height="152" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="614" y="508" font-size="17" font-weight="bold" fill="#2F6F9F" text-anchor="middle">官網寫的上限</text>
  <text x="614" y="546" font-size="17" fill="#102A2B" text-anchor="middle">免費：每本 50 則來源</text>
  <text x="614" y="578" font-size="17" fill="#102A2B" text-anchor="middle">每則來源 50 萬字</text>
  <text x="614" y="610" font-size="17" fill="#102A2B" text-anchor="middle">每人 100 本筆記本</text>

  <rect x="816" y="472" width="340" height="152" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="986" y="508" font-size="17" font-weight="bold" fill="#2F6F9F" text-anchor="middle">官網寫的上限</text>
  <text x="986" y="546" font-size="17" fill="#102A2B" text-anchor="middle">Google 翻譯：10 MB</text>
  <text x="986" y="578" font-size="17" fill="#102A2B" text-anchor="middle">PDF 限 300 頁以內</text>
  <text x="986" y="610" font-size="17" fill="#102A2B" text-anchor="middle">DeepL 免費：5 MB</text>

  <rect x="1188" y="472" width="340" height="152" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1358" y="508" font-size="17" font-weight="bold" fill="#2F6F9F" text-anchor="middle">官網寫的上限</text>
  <text x="1358" y="546" font-size="17" fill="#102A2B" text-anchor="middle">檔案小於 100 MB</text>
  <text x="1358" y="578" font-size="17" fill="#102A2B" text-anchor="middle">最多 600 頁</text>
  <text x="1358" y="610" font-size="17" fill="#102A2B" text-anchor="middle">檔案語言不含中文</text>

  <rect x="72" y="664" width="1456" height="142" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
