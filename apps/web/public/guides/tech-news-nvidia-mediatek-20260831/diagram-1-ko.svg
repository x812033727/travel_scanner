<title id="title">발표 하나, 문서 둘</title><desc id="desc">NVIDIA와 MediaTek의 2026년 8월 31일 공동 발표, 그리고 같은 날 MediaTek이 공개정보관측시스템에 제출한 가격 결정 신고서를 바탕으로 작성. 확인일 2026년 9월 17일.</desc>
