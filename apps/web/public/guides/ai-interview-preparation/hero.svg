<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用 AI 準備面試 / Preparing for a job interview with AI</title>
  <desc id="desc">米色底的插圖。中央是一台筆電，螢幕上有兩個對話框：左上是青綠色、畫著白色問號的提問框，右下是藍框白底、裡面有幾條文字線的回答框，代表和 AI 模擬問答。左邊是一棟藍色的辦公大樓，前方壓著一支橘色放大鏡，代表研究公司公開的資料。右邊是一面綠色盾牌，上面有白色勾號，代表求職人的權益。下方一行字：面試前，先和 AI 練一輪。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <g transform="translate(0,20)">
  <!-- building (company research) -->
  <rect x="120" y="230" width="220" height="330" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="150" y="270" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="208" y="270" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="266" y="270" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="150" y="330" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="208" y="330" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="266" y="330" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="150" y="390" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="208" y="390" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="266" y="390" width="44" height="40" rx="6" fill="#2F6F9F"/>
  <rect x="200" y="470" width="60" height="90" rx="6" fill="#2F6F9F"/>

  <!-- magnifier -->
  <line x1="372" y1="512" x2="426" y2="566" stroke="#D97A2B" stroke-width="20" stroke-linecap="round"/>
  <circle cx="326" cy="466" r="66" fill="#FFFFFF" fill-opacity="0.55" stroke="#D97A2B" stroke-width="14"/>

  <!-- laptop -->
  <rect x="520" y="160" width="560" height="360" rx="20" fill="#102A2B"/>
  <rect x="542" y="182" width="516" height="316" rx="10" fill="#F3F8F7"/>
  <rect x="450" y="520" width="700" height="36" rx="14" fill="#5C6B6B"/>
  <rect x="740" y="520" width="120" height="12" rx="4" fill="#102A2B"/>

  <!-- question bubble -->
  <rect x="580" y="208" width="250" height="118" rx="22" fill="#0D6B68"/>
  <path d="M612 322 L600 362 L652 322 Z" fill="#0D6B68"/>
  <path d="M684 246 A20 20 0 1 1 714 264 Q705 270 705 284" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="705" cy="304" r="7" fill="#FFFFFF"/>

  <!-- answer bubble -->
  <rect x="770" y="340" width="262" height="122" rx="22" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <path d="M960 456 L1004 488 L994 456" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6" stroke-linejoin="round" stroke-linecap="butt"/>
  <rect x="800" y="370" width="200" height="14" rx="7" fill="#C9D6E3"/>
  <rect x="800" y="396" width="170" height="14" rx="7" fill="#C9D6E3"/>
  <rect x="800" y="422" width="120" height="14" rx="7" fill="#D97A2B"/>

  <!-- shield (rights) -->
  <path d="M1380 240 L1490 282 L1490 396 Q1490 506 1380 560 Q1270 506 1270 396 L1270 282 Z" fill="#2E7D5B"/>
  <polyline points="1322,402 1364,444 1440,362" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <text x="800" y="718" font-size="48" font-weight="700" fill="#102A2B" text-anchor="middle">面試前，先和 AI 練一輪</text>
</svg>
