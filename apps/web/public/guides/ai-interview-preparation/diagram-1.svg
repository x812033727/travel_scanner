<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">用 AI 準備面試：前、中、後各怎麼用 / Using AI before, during and after a job interview</title>
  <desc id="desc">由左往右分成三欄。第一欄面試前，可以交給 AI 的準備工作：模擬問答，讓 AI 扮演面試官一次問一題、每題給一個優點與兩個改進，答案只用自己的經歷；公司研究，先查公開資訊觀測站與商工登記，原始資料再交給 AI 整理，數字與人名回原文核對；擬反問，問題建立在讀過的資料上，例如這個職位前三個月要完成什麼。第二欄面試進行中，以應徵公司的規則為準：先看招募頁、面試邀請信、測驗說明有沒有寫明可以使用 AI，寫明可以就照寫明的範圍使用，沒寫或不清楚就先問招募窗口、得到答覆前不要用；現場、視訊、錄影面試與線上測驗都一樣。第三欄面試後：檢討表現時，當天寫下題目與回答再交給 AI 分析，錄音錄影先徵得同意；權益受損時，例如因婚姻、年齡、性別被歧視，被要求非屬就業所需的隱私資料，被扣留財物或收取保證金，向縣市政府勞工主管單位（勞動局、勞工局、勞工處等）申訴，不確定就先撥勞動部勞工諮詢申訴專線 1955。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">用 AI 準備面試：前、中、後各怎麼用</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Using AI before, during and after a job interview</text>

  <g transform="translate(0,14)">
  <!-- stage headers -->
  <rect x="60" y="116" width="440" height="90" rx="14" fill="#E5F2EA" stroke="#2E7D5B" stroke-width="4"/>
  <text x="280" y="157" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">面試前</text>
  <text x="280" y="188" font-size="17" fill="#5C6B6B" text-anchor="middle">Before: practise and research</text>

  <rect x="580" y="116" width="440" height="90" rx="14" fill="#FBEBDC" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="157" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">面試進行中</text>
  <text x="800" y="188" font-size="17" fill="#5C6B6B" text-anchor="middle">During: the employer's rules</text>

  <rect x="1100" y="116" width="440" height="90" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1320" y="157" font-size="26" font-weight="700" fill="#102A2B" text-anchor="middle">面試後</text>
  <text x="1320" y="188" font-size="17" fill="#5C6B6B" text-anchor="middle">After: review and your rights</text>

  <line x1="508" y1="161" x2="568" y2="161" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="1028" y1="161" x2="1088" y2="161" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <!-- column 1: before -->
  <rect x="60" y="236" width="440" height="168" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="280" y="280" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">模擬問答</text>
  <text x="280" y="318" font-size="17" fill="#102A2B" text-anchor="middle">AI 扮演面試官，一次問一題</text>
  <text x="280" y="348" font-size="17" fill="#102A2B" text-anchor="middle">每題給一個優點、兩個改進</text>
  <text x="280" y="378" font-size="17" fill="#102A2B" text-anchor="middle">答案內容只用自己的經歷</text>

  <rect x="60" y="424" width="440" height="168" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="280" y="468" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">公司研究</text>
  <text x="280" y="506" font-size="17" fill="#102A2B" text-anchor="middle">先查公開資訊觀測站、商工登記</text>
  <text x="280" y="536" font-size="17" fill="#102A2B" text-anchor="middle">原始資料再交給 AI 整理</text>
  <text x="280" y="566" font-size="17" fill="#102A2B" text-anchor="middle">數字與人名回原文核對</text>

  <rect x="60" y="612" width="440" height="168" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="280" y="656" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">擬反問</text>
  <text x="280" y="694" font-size="17" fill="#102A2B" text-anchor="middle">問題建立在讀過的資料上</text>
  <text x="280" y="724" font-size="17" fill="#102A2B" text-anchor="middle">例如這個職位</text>
  <text x="280" y="754" font-size="17" fill="#102A2B" text-anchor="middle">前三個月要完成什麼</text>

  <!-- column 2: during -->
  <rect x="580" y="236" width="440" height="168" rx="14" fill="#FBEBDC" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="280" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">先找規則</text>
  <text x="800" y="318" font-size="17" fill="#102A2B" text-anchor="middle">看招募頁、面試邀請信</text>
  <text x="800" y="348" font-size="17" fill="#102A2B" text-anchor="middle">與測驗說明有沒有寫明</text>
  <text x="800" y="378" font-size="17" fill="#102A2B" text-anchor="middle">可以使用 AI</text>

  <line x1="685" y1="406" x2="685" y2="434" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="915" y1="406" x2="915" y2="434" stroke="#5C6B6B" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <rect x="580" y="444" width="210" height="168" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="685" y="500" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">寫明可以</text>
  <text x="685" y="540" font-size="17" fill="#102A2B" text-anchor="middle">照公司寫明的</text>
  <text x="685" y="570" font-size="17" fill="#102A2B" text-anchor="middle">範圍使用</text>

  <rect x="810" y="444" width="210" height="168" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="915" y="500" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">沒寫或不清楚</text>
  <text x="915" y="540" font-size="17" fill="#102A2B" text-anchor="middle">先問招募窗口</text>
  <text x="915" y="570" font-size="17" fill="#102A2B" text-anchor="middle">答覆前不要用</text>

  <rect x="580" y="632" width="440" height="148" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="800" y="676" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">每種面試都一樣</text>
  <text x="800" y="714" font-size="17" fill="#102A2B" text-anchor="middle">現場、視訊、錄影面試</text>
  <text x="800" y="744" font-size="17" fill="#102A2B" text-anchor="middle">以及線上測驗</text>

  <!-- column 3: after -->
  <rect x="1100" y="236" width="440" height="168" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1320" y="280" font-size="20" font-weight="700" fill="#2E7D5B" text-anchor="middle">檢討表現</text>
  <text x="1320" y="318" font-size="17" fill="#102A2B" text-anchor="middle">當天寫下題目與回答</text>
  <text x="1320" y="348" font-size="17" fill="#102A2B" text-anchor="middle">再交給 AI 分析</text>
  <text x="1320" y="378" font-size="17" fill="#102A2B" text-anchor="middle">錄音錄影先徵得同意</text>

  <rect x="1100" y="424" width="440" height="356" rx="14" fill="#F7E3DE" stroke="#B8442D" stroke-width="4"/>
  <text x="1320" y="468" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">權益受損時</text>
  <text x="1320" y="506" font-size="17" fill="#102A2B" text-anchor="middle">因婚姻、年齡、性別被歧視</text>
  <text x="1320" y="536" font-size="17" fill="#102A2B" text-anchor="middle">被要求非屬就業所需的隱私資料</text>
  <text x="1320" y="566" font-size="17" fill="#102A2B" text-anchor="middle">被扣留財物或收取保證金</text>
  <line x1="1130" y1="596" x2="1510" y2="596" stroke="#B8442D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1320" y="640" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">向縣市政府勞工主管單位申訴</text>
  <text x="1320" y="676" font-size="17" fill="#5C6B6B" text-anchor="middle">勞動局、勞工局、勞工處等</text>
  <text x="1320" y="724" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">不確定先撥 1955</text>
  <text x="1320" y="756" font-size="17" fill="#5C6B6B" text-anchor="middle">勞動部勞工諮詢申訴專線</text>

  </g>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
