<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">台灣小吃店點餐流程與常被問到的四組說法 / How to order at a Taiwanese eatery, with the four phrase scales you will be asked about</title>
  <desc id="desc">五個步驟由左到右：一、進店找位或排隊，小店不帶位，被問幾位就用手指比；二、拿紙菜單勾選，寫數量和桌號後交回櫃檯，只有牆上菜單就用指的；三、付款，小店多先付，有些離開時後付，餐廳加 10% 服務費，不用小費，攤位多只收現金；四、茶水、餐具、醬料自助，餐盤放回收區；五、拿統一發票，它是彩券，每兩個月開獎，護照可兌獎，不要就投捐發票箱。下方四組說法：甜度由正常糖、少糖、半糖、微糖到無糖；冰塊由正常冰、少冰、微冰、去冰到溫或熱；辣度由不辣、小辣、中辣到大辣；素食標示有素食、全素或純素、蛋素、奶素、奶蛋素、植物五辛素。Five steps left to right: find a seat or queue; tick the paper order sheet with quantities and table number; pay, usually first at small shops, restaurants add 10% service and there is no tipping; self-serve tea, cutlery and sauces; take the uniform-invoice receipt, which is a lottery ticket drawn every two months and claimable with a passport. Below: sugar scale full to none, ice scale regular to warm or hot, spice scale none to hot, and the vegetarian labels.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">台灣小吃店點餐流程　How to order at a Taiwanese eatery</text>
  <text x="60" y="98" font-size="19" fill="#5C6B6B">五個步驟＋一定會被問到的四組說法 · Five steps and the four phrase scales you will be asked about · 2026 年 9 月查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="140" width="250" height="330" rx="20" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
  <rect x="60" y="140" width="250" height="74" rx="20" fill="#0D6B68"/>
  <text x="185" y="172" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　進店找位</text>
  <text x="185" y="200" font-size="15" fill="#DDF0EE" text-anchor="middle">Find a seat or queue</text>
  <g font-size="17" fill="#102A2B">
    <text x="82" y="252">小店不帶位</text>
    <text x="82" y="276" font-size="15" fill="#5C6B6B">No host seating</text>
    <text x="82" y="316">有人排隊就跟著排</text>
    <text x="82" y="340" font-size="15" fill="#5C6B6B">Join the queue if there is one</text>
    <text x="82" y="380">「幾位？」用手指比</text>
    <text x="82" y="404" font-size="15" fill="#5C6B6B">"How many?" Show fingers</text>
  </g>

  <!-- step 2 -->
  <rect x="368" y="140" width="250" height="330" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="5"/>
  <rect x="368" y="140" width="250" height="74" rx="20" fill="#2F6F9F"/>
  <text x="493" y="172" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　拿菜單勾選</text>
  <text x="493" y="200" font-size="15" fill="#E3EEF6" text-anchor="middle">Tick the paper order sheet</text>
  <g font-size="17" fill="#102A2B">
    <text x="390" y="252">菜單＝紙本勾選單</text>
    <text x="390" y="276" font-size="15" fill="#5C6B6B">The menu is a tick sheet</text>
    <text x="390" y="316">寫數量、桌號，交回櫃檯</text>
    <text x="390" y="340" font-size="15" fill="#5C6B6B">Quantity + table no., hand in</text>
    <text x="390" y="380">只有牆上菜單就用指的</text>
    <text x="390" y="404" font-size="15" fill="#5C6B6B">Wall menu only? Point at it</text>
  </g>

  <!-- step 3 -->
  <rect x="676" y="140" width="250" height="330" rx="20" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
  <rect x="676" y="140" width="250" height="74" rx="20" fill="#B8442D"/>
  <text x="801" y="172" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　付款</text>
  <text x="801" y="200" font-size="15" fill="#F8E3DE" text-anchor="middle">Pay first or pay after</text>
  <g font-size="17" fill="#102A2B">
    <text x="698" y="248">小店多先付，有些後付</text>
    <text x="698" y="272" font-size="15" fill="#5C6B6B">Small shops: usually pay first</text>
    <text x="698" y="308">餐廳加 10% 服務費</text>
    <text x="698" y="332" font-size="15" fill="#5C6B6B">Restaurants add 10% service</text>
    <text x="698" y="368">不用小費</text>
    <text x="698" y="392" font-size="15" fill="#5C6B6B">No tipping</text>
    <text x="698" y="428">攤位多只收現金</text>
    <text x="698" y="452" font-size="15" fill="#5C6B6B">Stalls: cash only</text>
  </g>

  <!-- step 4 -->
  <rect x="984" y="140" width="250" height="330" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="5"/>
  <rect x="984" y="140" width="250" height="74" rx="20" fill="#2E7D5B"/>
  <text x="1109" y="172" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　自助茶水</text>
  <text x="1109" y="200" font-size="15" fill="#E2F0E9" text-anchor="middle">Self-service corner</text>
  <g font-size="17" fill="#102A2B">
    <text x="1006" y="252">茶水、餐具、醬料自己拿</text>
    <text x="1006" y="276" font-size="15" fill="#5C6B6B">Tea, cutlery, sauces: self-serve</text>
    <text x="1006" y="316">沒人會主動倒水</text>
    <text x="1006" y="340" font-size="15" fill="#5C6B6B">Nobody brings water</text>
    <text x="1006" y="380">餐盤放回收區</text>
    <text x="1006" y="404" font-size="15" fill="#5C6B6B">Return your tray</text>
  </g>

  <!-- step 5 -->
  <rect x="1292" y="140" width="250" height="330" rx="20" fill="#FFFFFF" stroke="#D97A2B" stroke-width="5"/>
  <rect x="1292" y="140" width="250" height="74" rx="20" fill="#D97A2B"/>
  <text x="1417" y="172" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">5　拿發票</text>
  <text x="1417" y="200" font-size="15" fill="#FBEBDD" text-anchor="middle">Take the receipt</text>
  <g font-size="17" fill="#102A2B">
    <text x="1314" y="248">統一發票＝彩券</text>
    <text x="1314" y="272" font-size="15" fill="#5C6B6B">The receipt is a lottery ticket</text>
    <text x="1314" y="308">每兩個月開獎</text>
    <text x="1314" y="332" font-size="15" fill="#5C6B6B">Drawn every two months</text>
    <text x="1314" y="368">護照可兌獎</text>
    <text x="1314" y="392" font-size="15" fill="#5C6B6B">Claim with a passport</text>
    <text x="1314" y="428">不要就投捐發票箱</text>
    <text x="1314" y="452" font-size="15" fill="#5C6B6B">Or drop it in the donation box</text>
  </g>

  <!-- arrows -->
  <path d="M 314 305 L 360 305" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 622 305 L 668 305" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 930 305 L 976 305" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1238 305 L 1284 305" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- phrase scales -->
  <rect x="60" y="510" width="1482" height="300" rx="20" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="84" y="550" font-size="22" font-weight="700" fill="#6B4A3A">一定會被問到的四組說法　The four phrase scales</text>

  <!-- sugar -->
  <text x="84" y="596" font-size="19" font-weight="700" fill="#B8442D">甜度 Sugar</text>
  <line x1="100" y1="650" x2="380" y2="650" stroke="#B8442D" stroke-width="4"/>
  <g fill="#FFFFFF" stroke="#B8442D" stroke-width="4">
    <circle cx="100" cy="650" r="8"/><circle cx="170" cy="650" r="8"/><circle cx="240" cy="650" r="8"/><circle cx="310" cy="650" r="8"/><circle cx="380" cy="650" r="8"/>
  </g>
  <g font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="100" y="630">正常糖</text><text x="170" y="630">少糖</text><text x="240" y="630">半糖</text><text x="310" y="630">微糖</text><text x="380" y="630">無糖</text>
  </g>
  <g font-size="15" fill="#5C6B6B" text-anchor="middle">
    <text x="100" y="680">full</text><text x="170" y="680">less</text><text x="240" y="680">half</text><text x="310" y="680">light</text><text x="380" y="680">none</text>
  </g>

  <!-- ice -->
  <text x="450" y="596" font-size="19" font-weight="700" fill="#2F6F9F">冰塊 Ice</text>
  <line x1="466" y1="650" x2="746" y2="650" stroke="#2F6F9F" stroke-width="4"/>
  <g fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4">
    <circle cx="466" cy="650" r="8"/><circle cx="536" cy="650" r="8"/><circle cx="606" cy="650" r="8"/><circle cx="676" cy="650" r="8"/><circle cx="746" cy="650" r="8"/>
  </g>
  <g font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="466" y="630">正常冰</text><text x="536" y="630">少冰</text><text x="606" y="630">微冰</text><text x="676" y="630">去冰</text><text x="746" y="630">溫／熱</text>
  </g>
  <g font-size="15" fill="#5C6B6B" text-anchor="middle">
    <text x="466" y="680">regular</text><text x="536" y="680">less</text><text x="606" y="680">little</text><text x="676" y="680">no ice</text><text x="746" y="680">warm/hot</text>
  </g>

  <!-- spice -->
  <text x="816" y="596" font-size="19" font-weight="700" fill="#D97A2B">辣度 Spice</text>
  <line x1="832" y1="650" x2="1082" y2="650" stroke="#D97A2B" stroke-width="4"/>
  <g fill="#FFFFFF" stroke="#D97A2B" stroke-width="4">
    <circle cx="832" cy="650" r="8"/><circle cx="915" cy="650" r="8"/><circle cx="998" cy="650" r="8"/><circle cx="1082" cy="650" r="8"/>
  </g>
  <g font-size="16" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="832" y="630">不辣</text><text x="915" y="630">小辣</text><text x="998" y="630">中辣</text><text x="1082" y="630">大辣</text>
  </g>
  <g font-size="15" fill="#5C6B6B" text-anchor="middle">
    <text x="832" y="680">none</text><text x="915" y="680">mild</text><text x="998" y="680">medium</text><text x="1082" y="680">hot</text>
  </g>

  <!-- vegetarian -->
  <text x="1160" y="596" font-size="19" font-weight="700" fill="#2E7D5B">素食標示 Vegetarian labels</text>
  <g font-size="16" fill="#102A2B">
    <text x="1160" y="628">素／素食　vegetarian sign</text>
    <text x="1160" y="654">全素・純素　no egg, dairy, garlic, onion</text>
    <text x="1160" y="680">蛋素／奶素／奶蛋素　egg / dairy / both</text>
    <text x="1160" y="706">植物五辛素　may contain garlic, onion</text>
  </g>

  <text x="84" y="740" font-size="17" fill="#102A2B">點飲料的順序：飲料 → 甜度 → 冰塊　Order a drink as: drink → sugar → ice</text>
  <text x="84" y="772" font-size="17" fill="#102A2B">指給店家看：我吃素 (vegetarian) · 不要香菜 (no coriander) · 不要辣 (not spicy) · 我對花生過敏 (peanut allergy)</text>
  <text x="84" y="804" font-size="15" fill="#5C6B6B">價格依店家，本圖不標價格 · Prices vary by shop and are not shown here</text>

  <text x="1540" y="880" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 2026</text>
</svg>
