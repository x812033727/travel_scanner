<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">臺灣小吃店點餐五步驟</title>
  <desc id="desc">臺灣小吃店點餐五步驟，圖中依序標示 1 至 5。一、進店先看是否要排隊、候位或自行找座位；被問幾位時可直接回答人數。二、拿紙本菜單勾選餐點，填數量與桌號；只有牆上菜單時可指著品項。三、依店家標示先付或後付；旅館或餐廳可能加收 10% 服務費，夜市攤位多準備現金。四、茶水、餐具、醬料與餐盤回收區如標示自助，就自行取用與回收。五、保留統一發票；每兩個月開獎，獎金從六獎 NT$200 到特別獎 NT$10,000,000，非本國國籍人士依身分以護照、居留證或入出境許可證兌獎，不保留時可投入捐發票箱。下方列出常見用語：甜度為正常糖、少糖、半糖、微糖、無糖；冰塊為正常冰、少冰、微冰、去冰、溫或熱；辣度為不辣、小辣、中辣、大辣；包裝食品的素食標示為全素或純素、蛋素、奶素、奶蛋素、植物五辛素。嚴重過敏者仍須向店家確認食材與交叉接觸。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="48" y="66" font-size="38" font-weight="700" fill="#12383A">臺灣小吃店點餐五步驟</text>
  <text x="48" y="104" font-size="20" fill="#536768">先看店內標示，再依序候位、點餐、付款、自助取用與收發票｜2026/9/22 查核</text>

  <rect x="35" y="145" width="290" height="330" rx="22" fill="#FFF9F0" stroke="#C8783E" stroke-width="3"/>
  <circle cx="78" cy="188" r="25" fill="#C8783E"/><text x="78" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text>
  <text x="116" y="196" font-size="25" font-weight="700" fill="#713D1D">找位或排隊</text>
  <text x="60" y="246" font-size="19" fill="#263D3E">• 先看候位方式</text>
  <text x="60" y="282" font-size="19" fill="#263D3E">• 問「幾位」就回答人數</text>
  <text x="60" y="318" font-size="19" fill="#263D3E">• 熱門店可能先登記</text>
  <text x="60" y="354" font-size="19" fill="#263D3E">• 小店也可能自行找位</text>
  <rect x="60" y="392" width="240" height="52" rx="14" fill="#F6E2D0"/><text x="180" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#713D1D">內用＝店內吃｜外帶＝帶走</text>

  <rect x="345" y="145" width="290" height="330" rx="22" fill="#F3FBF8" stroke="#238778" stroke-width="3"/>
  <circle cx="388" cy="188" r="25" fill="#238778"/><text x="388" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text>
  <text x="426" y="196" font-size="25" font-weight="700" fill="#15584F">勾菜單</text>
  <text x="370" y="246" font-size="19" fill="#263D3E">• 拿紙本菜單</text>
  <text x="370" y="282" font-size="19" fill="#263D3E">• 填餐點數量與桌號</text>
  <text x="370" y="318" font-size="19" fill="#263D3E">• 交回櫃檯或店員</text>
  <text x="370" y="354" font-size="19" fill="#263D3E">• 牆上菜單可直接指</text>
  <rect x="370" y="392" width="240" height="52" rx="14" fill="#DCEFEA"/><text x="490" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#15584F">先把忌口存在手機裡</text>

  <rect x="655" y="145" width="290" height="330" rx="22" fill="#F5F3FC" stroke="#6B5AB4" stroke-width="3"/>
  <circle cx="698" cy="188" r="25" fill="#6B5AB4"/><text x="698" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text>
  <text x="736" y="196" font-size="25" font-weight="700" fill="#46377E">確認付款</text>
  <text x="680" y="246" font-size="19" fill="#263D3E">• 看先付／後付標示</text>
  <text x="680" y="282" font-size="19" fill="#263D3E">• 夜市攤位多準備現金</text>
  <text x="680" y="318" font-size="19" fill="#263D3E">• 餐廳可能加收 10%</text>
  <text x="700" y="348" font-size="19" fill="#263D3E">服務費</text>
  <rect x="680" y="392" width="240" height="52" rx="14" fill="#E5E0F5"/><text x="800" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#46377E">一般不必另給小費</text>

  <rect x="965" y="145" width="290" height="330" rx="22" fill="#EFF7FC" stroke="#377DA0" stroke-width="3"/>
  <circle cx="1008" cy="188" r="25" fill="#377DA0"/><text x="1008" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text>
  <text x="1046" y="196" font-size="25" font-weight="700" fill="#24546D">自助取用</text>
  <text x="990" y="246" font-size="19" fill="#263D3E">• 茶水與餐具</text>
  <text x="990" y="282" font-size="19" fill="#263D3E">• 醬料與調味料</text>
  <text x="990" y="318" font-size="19" fill="#263D3E">• 有回收區就送回餐盤</text>
  <text x="990" y="354" font-size="19" fill="#263D3E">• 依店內標示操作</text>
  <rect x="990" y="392" width="240" height="52" rx="14" fill="#DCEAF2"/><text x="1110" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#24546D">看到「自助」就自己拿</text>

  <rect x="1275" y="145" width="290" height="330" rx="22" fill="#FBF3F1" stroke="#B45D52" stroke-width="3"/>
  <circle cx="1318" cy="188" r="25" fill="#B45D52"/><text x="1318" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">5</text>
  <text x="1356" y="196" font-size="25" font-weight="700" fill="#7A3831">保留發票</text>
  <text x="1300" y="246" font-size="19" fill="#263D3E">• 每 2 個月開獎</text>
  <text x="1300" y="282" font-size="19" fill="#263D3E">• 兌獎證件依身分準備</text>
  <text x="1300" y="318" font-size="19" fill="#263D3E">• 要保存發票正本</text>
  <text x="1300" y="354" font-size="19" fill="#263D3E">• 不留可投入捐發票箱</text>
  <rect x="1300" y="392" width="240" height="52" rx="14" fill="#F2DEDA"/><text x="1420" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#7A3831">護照／居留證／許可證</text>

  <text x="48" y="520" font-size="27" font-weight="700" fill="#12383A">常被問到的四組用語</text>
  <rect x="35" y="548" width="360" height="260" rx="22" fill="#FFFFFF" stroke="#C8783E" stroke-width="2"/>
  <text x="60" y="590" font-size="24" font-weight="700" fill="#713D1D">甜度</text>
  <text x="60" y="632" font-size="19" fill="#263D3E">正常糖 → 少糖 → 半糖</text>
  <text x="60" y="668" font-size="19" fill="#263D3E">微糖 → 無糖</text>
  <text x="60" y="718" font-size="17" fill="#687777">比例依店家標示</text>
  <text x="60" y="752" font-size="17" fill="#687777">不是所有飲品都能無糖</text>

  <rect x="425" y="548" width="360" height="260" rx="22" fill="#FFFFFF" stroke="#377DA0" stroke-width="2"/>
  <text x="450" y="590" font-size="24" font-weight="700" fill="#24546D">冰塊</text>
  <text x="450" y="632" font-size="19" fill="#263D3E">正常冰 → 少冰 → 微冰</text>
  <text x="450" y="668" font-size="19" fill="#263D3E">去冰 → 溫／熱</text>
  <text x="450" y="718" font-size="17" fill="#687777">去冰通常仍是冷飲</text>
  <text x="450" y="752" font-size="17" fill="#687777">可否做熱飲要先問</text>

  <rect x="815" y="548" width="360" height="260" rx="22" fill="#FFFFFF" stroke="#B45D52" stroke-width="2"/>
  <text x="840" y="590" font-size="24" font-weight="700" fill="#7A3831">辣度</text>
  <text x="840" y="632" font-size="19" fill="#263D3E">不辣 → 小辣 → 中辣 → 大辣</text>
  <text x="840" y="682" font-size="17" fill="#687777">醬料與胡椒也可能帶辣</text>
  <text x="840" y="716" font-size="17" fill="#687777">不能吃辣要在點餐時說</text>

  <rect x="1205" y="548" width="360" height="260" rx="22" fill="#FFFFFF" stroke="#238778" stroke-width="2"/>
  <text x="1230" y="590" font-size="24" font-weight="700" fill="#15584F">包裝食品五種素食標示</text>
  <text x="1230" y="632" font-size="19" fill="#263D3E">全素／純素｜蛋素｜奶素</text>
  <text x="1230" y="668" font-size="19" fill="#263D3E">奶蛋素｜植物五辛素</text>
  <text x="1230" y="718" font-size="17" fill="#687777">餐廳仍要確認共鍋與五辛</text>
  <text x="1230" y="752" font-size="17" fill="#687777">嚴重過敏要確認交叉接觸</text>
  <text x="1545" y="875" text-anchor="end" font-size="16" fill="#687777">© Mokaair 2026</text>
</svg>
