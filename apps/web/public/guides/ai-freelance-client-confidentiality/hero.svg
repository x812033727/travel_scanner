<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">客戶資料先過三關 / Client files pass three gates before AI</title>
  <desc id="desc">米色底的插圖。一條淺灰色的路由左往右延伸。左端是一個橘色資料夾，裡面露出一張白色文件，資料夾正面掛著一個青綠色的鎖頭；路的中段立著三道同樣大小的青綠色拱門，每道拱門裡有一個指向右邊的綠色箭頭記號；右端是一個藍色圓角方塊，上面有一大一小兩個白色星芒，代表 AI 工具。下方一行字寫著「客戶資料先過三關」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <g transform="translate(800,374) scale(1.12) translate(-800,-374)">
  <!-- road -->
  <rect x="170" y="500" width="1260" height="18" rx="9" fill="#C9D6D6"/>

  <!-- folder: back panel, tab, paper, front panel -->
  <rect x="210" y="270" width="270" height="230" rx="18" fill="#B9651F"/>
  <rect x="210" y="245" width="120" height="60" rx="14" fill="#B9651F"/>
  <rect x="266" y="232" width="190" height="170" rx="10" fill="#FFFFFF" stroke="#102A2B" stroke-width="5"/>
  <rect x="290" y="262" width="140" height="12" rx="6" fill="#C9D6D6"/>
  <rect x="290" y="290" width="140" height="12" rx="6" fill="#C9D6D6"/>
  <rect x="290" y="318" width="90" height="12" rx="6" fill="#C9D6D6"/>
  <rect x="210" y="330" width="270" height="170" rx="18" fill="#D97A2B"/>

  <!-- padlock on the folder -->
  <path d="M315,412 V388 A30,30 0 0 1 375,388 V412" fill="none" stroke="#0D6B68" stroke-width="14" stroke-linecap="butt"/>
  <rect x="293" y="406" width="104" height="80" rx="14" fill="#0D6B68"/>
  <circle cx="345" cy="440" r="11" fill="#F7F1E8"/>
  <rect x="340" y="444" width="10" height="24" rx="3" fill="#F7F1E8"/>

  <!-- three equal gates -->
  <path d="M585,500 V300 A50,50 0 0 1 685,300 V500" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="butt"/>
  <path d="M755,500 V300 A50,50 0 0 1 855,300 V500" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="butt"/>
  <path d="M925,500 V300 A50,50 0 0 1 1025,300 V500" fill="none" stroke="#0D6B68" stroke-width="18" stroke-linecap="butt"/>
  <polyline points="623,372 647,397 623,422" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="793,372 817,397 793,422" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="963,372 987,397 963,422" fill="none" stroke="#2E7D5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI tile with sparkles -->
  <rect x="1130" y="250" width="250" height="250" rx="40" fill="#2F6F9F"/>
  <path d="M1242,305 Q1242,385 1322,385 Q1242,385 1242,465 Q1242,385 1162,385 Q1242,385 1242,305 Z" fill="#FFFFFF"/>
  <path d="M1324,274 Q1324,302 1352,302 Q1324,302 1324,330 Q1324,302 1296,302 Q1324,302 1324,274 Z" fill="#FFFFFF"/>
  </g>

  <text x="800" y="672" font-size="56" font-weight="700" fill="#102A2B" text-anchor="middle">客戶資料先過三關</text>
</svg>
