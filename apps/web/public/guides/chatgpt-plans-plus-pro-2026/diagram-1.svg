  <text x="688" y="236" font-size="17" font-weight="700" fill="#102A2B">20 美元／月</text>
  <text x="688" y="266" font-size="16" fill="#102A2B">GPT-5.6 Sol＋推理滑桿</text>
  <text x="688" y="294" font-size="16" fill="#102A2B">Instant 到 Extra High</text>
  <text x="688" y="322" font-size="16" fill="#102A2B">完整 Codex 雲端功能</text>
  <text x="688" y="350" font-size="16" fill="#102A2B">語音每天 3 小時</text>
  <text x="688" y="378" font-size="16" fill="#102A2B">任務同時 5 個</text>
  <text x="688" y="406" font-size="16" fill="#102A2B">撞上限可買 credits</text>
  <text x="688" y="452" font-size="16" fill="#5C6B6B">給：每天用、寫作</text>
  <text x="688" y="480" font-size="16" fill="#5C6B6B">寫程式、學習的人</text>
  <path d="M 938 350 L 966 350" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

