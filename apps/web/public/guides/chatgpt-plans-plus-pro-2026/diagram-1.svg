  <text x="1304" y="236" font-size="17" font-weight="700" fill="#102A2B">每人每月 25 美元</text>
  <text x="1304" y="266" font-size="16" fill="#102A2B">年繳每人每月 20 美元</text>
  <text x="1304" y="294" font-size="16" fill="#102A2B">至少 2 個座位</text>
