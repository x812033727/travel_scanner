  <rect x="972" y="118" width="272" height="470" rx="14" fill="#FCEFE4" stroke="#D97A2B" stroke-width="4"/>
  <circle cx="1012" cy="160" r="22" fill="#D97A2B"/>
  <text x="1012" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1046" y="168" font-size="20" font-weight="700" fill="#8A4A16">Pro</text>
  <text x="1046" y="194" font-size="15" fill="#5C6B6B">兩級</text>
  <text x="996" y="236" font-size="17" font-weight="700" fill="#102A2B">100 美元：Plus 的 5 倍</text>
