  <text x="72" y="378" font-size="16" fill="#102A2B">語音 GPT-Live-1 mini</text>
  <text x="72" y="406" font-size="16" fill="#102A2B">部分國家有廣告</text>
  <text x="72" y="452" font-size="16" fill="#5C6B6B">給：偶爾問問題</text>
  <text x="72" y="480" font-size="16" fill="#5C6B6B">改改文字的人</text>
