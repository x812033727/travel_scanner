<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">ChatGPT 方案階梯：價格、模型、額度要點 / The ChatGPT plan ladder: price, model and usage</title>
  <desc id="desc">五個方案由左到右用箭頭串起，價格與額度遞增。第一格 Free：0 美元，GPT-5.6 Luna 加 Think，文字對話不限次數，檔案每天 3 個，同時 3 個任務，語音是 GPT-Live-1 mini，給偶爾問問題的人。第二格 Go：美國定價每月 8 美元，一樣是 GPT-5.6 Luna 加 Think，沒有 GPT-5.6 Sol，產圖與上傳上限更高，語音每天 3 小時，有專案、3 個任務與自訂 GPT，給常撞免費上限的人。第三格 Plus，標示甜蜜點：每月 20 美元，GPT-5.6 Sol 加推理滑桿，Instant 到 Extra High，完整 Codex 雲端功能，語音每天 3 小時，同時 5 個任務，撞上限可以買 credits，給每天寫作與寫程式的人。第四格 Pro：100 美元是 Plus 的 5 倍，200 美元是 Plus 的 20 倍，有 GPT-6 Pro 與 Sol Pro，語音 15 小時或不限時，同時 15 個任務，有 GPT-5.3-Codex-Spark，給每天撞額度的人；200 美元那一級自 2026 年 9 月 10 日起暫停新訂。第五格 Business：每人每月 25 美元，年繳每人每月 20 美元，至少 2 個座位，Standard 每月 15 則 Pro 訊息，Premium 每週 50 則且用量 5 倍，同時 10 個任務，給公司團隊。下方怎麼選：偶爾用 Free，卡檔案與產圖看 Go，每天用選 Plus，每週撞額度或要 GPT-6 Pro 才是 Pro 100 美元，2 人以上的公司看 Business；Codex 與 ChatGPT Work 共用額度，Plus 與 Pro 撞到上限先買 credits；台灣網頁刷卡以美元計價，沒填統一編號加 5% 營業稅，App 內購以當地貨幣，Go、Plus、Pro 都沒有年繳。最下面補充：Enterprise 與 Edu 沒有公開定價要聯絡業務，價格為官網美元定價，台灣幣別以登入後為準；GPT-6 Pro 在 Pro 100 美元與 Sol Pro 共用每週額度，Pro 200 美元用完自動切到 GPT-5.6 Thinking Medium。2026 年 9 月查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ChatGPT 方案階梯：價格、模型、額度要點（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">The ChatGPT plan ladder: price, model and usage at a glance, from Free to Business</text>

