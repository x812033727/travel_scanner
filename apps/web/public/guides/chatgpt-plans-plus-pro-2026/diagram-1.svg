  <text x="396" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="430" y="168" font-size="20" font-weight="700" fill="#1F4E73">Go</text>
  <text x="430" y="194" font-size="15" fill="#5C6B6B">入門付費</text>
