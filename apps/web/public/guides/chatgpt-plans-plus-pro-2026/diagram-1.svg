  <rect x="664" y="118" width="272" height="470" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <circle cx="704" cy="160" r="22" fill="#0D6B68"/>
  <text x="704" y="168" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="738" y="168" font-size="20" font-weight="700" fill="#0B4F4D">Plus</text>
