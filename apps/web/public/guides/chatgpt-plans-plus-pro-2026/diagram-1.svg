  <text x="380" y="294" font-size="16" fill="#102A2B">沒有 GPT-5.6 Sol</text>
  <text x="380" y="322" font-size="16" fill="#102A2B">產圖、上傳上限更高</text>
  <text x="380" y="350" font-size="16" fill="#102A2B">語音每天 3 小時</text>
