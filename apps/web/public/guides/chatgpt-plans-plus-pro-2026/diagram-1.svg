  <text x="380" y="406" font-size="16" fill="#102A2B">記憶更長</text>
  <text x="380" y="452" font-size="16" fill="#5C6B6B">給：常撞免費版</text>
  <text x="380" y="480" font-size="16" fill="#5C6B6B">檔案與產圖上限的人</text>
  <path d="M 630 350 L 658 350" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

