  <text x="122" y="194" font-size="15" fill="#5C6B6B">免費版</text>
  <text x="72" y="236" font-size="17" font-weight="700" fill="#102A2B">0 美元</text>
  <text x="72" y="266" font-size="16" fill="#102A2B">GPT-5.6 Luna＋Think</text>
  <text x="72" y="294" font-size="16" fill="#102A2B">文字對話不限次數</text>
