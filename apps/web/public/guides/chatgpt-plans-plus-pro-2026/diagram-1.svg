  <!-- how to choose -->
  <rect x="48" y="620" width="1504" height="150" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="76" y="654" font-size="19" font-weight="700" fill="#102A2B">怎麼選　How to choose</text>
  <text x="76" y="688" font-size="16" fill="#102A2B">・偶爾用 Free；卡檔案與產圖看 Go；每天用選 Plus；每週撞額度或要 GPT-6 Pro 才是 Pro 100 美元；2 人以上的公司看 Business</text>
  <text x="76" y="716" font-size="16" fill="#102A2B">・Codex 與 ChatGPT Work 共用額度；Plus 與 Pro 撞到上限先買 credits 加購用量，比升一整階便宜</text>
  <text x="76" y="744" font-size="16" fill="#102A2B">・台灣：網頁刷卡以美元計價，沒填統一編號加 5% 營業稅；App 內購以當地貨幣扣款；Go、Plus、Pro 都沒有年繳</text>

  <text x="48" y="806" font-size="15" fill="#5C6B6B">Enterprise 與 Edu 沒有公開定價，要聯絡 OpenAI 業務；價格為官網美元定價，台灣幣別以登入 chatgpt.com 後看到的為準。</text>
  <text x="48" y="834" font-size="15" fill="#5C6B6B">GPT-6 Pro 在 Pro 100 美元與 Sol Pro 共用每週額度；Pro 200 美元用完後自動切到 GPT-5.6 Thinking Medium 繼續回答。</text>
