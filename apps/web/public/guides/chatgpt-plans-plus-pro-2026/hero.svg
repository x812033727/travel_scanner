<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">付哪一階才划算 / Which ChatGPT tier is worth paying for</title>
  <desc id="desc">米色底上有一道白色、深青色邊的五級階梯，由左往右一階比一階高。每一級階梯上放一個圓角方塊，方塊由左到右越來越大，顏色依序是白底灰邊、藍色、深青色、橘色、綠色，代表 ChatGPT 由低到高的 Free、Go、Plus、Pro、Business 五個方案；中間的深青色方塊後面有一圈淡青色光暈，表示它是多數人的甜蜜點。周圍散布幾個橘色與藍色的小圓點。下方一行字：付哪一階才划算。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="220" cy="210" r="150" fill="#E3F0EF"/>
  <circle cx="1400" cy="160" r="90" fill="#E6F0F7"/>
  <circle cx="1480" cy="780" r="110" fill="#E6F2EC"/>

  <!-- five-step staircase -->
  <path d="M 200 760 V 700 H 440 V 620 H 680 V 540 H 920 V 460 H 1160 V 380 H 1400 V 760 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="10" stroke-linejoin="round"/>

  <!-- glow behind the sweet-spot block -->
  <circle cx="800" cy="466" r="120" fill="#0D6B68" opacity="0.14"/>

  <!-- blocks, growing from left to right -->
  <rect x="285" y="622" width="70" height="70" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="8"/>
  <rect x="510" y="512" width="100" height="100" rx="18" fill="#2F6F9F"/>
  <rect x="735" y="402" width="130" height="130" rx="22" fill="#0D6B68"/>
  <rect x="957" y="287" width="166" height="166" rx="26" fill="#D97A2B"/>
  <rect x="1180" y="172" width="200" height="200" rx="30" fill="#2E7D5B"/>

  <!-- small accents -->
  <circle cx="140" cy="560" r="18" fill="#D97A2B"/>
  <circle cx="210" cy="660" r="12" fill="#2F6F9F"/>
  <circle cx="1470" cy="330" r="14" fill="#D97A2B"/>
  <circle cx="1000" cy="150" r="10" fill="#2F6F9F"/>
  <circle cx="620" cy="250" r="12" fill="#2E7D5B"/>

  <!-- one line of text -->
  <text x="800" y="850" font-size="48" font-weight="700" fill="#102A2B" text-anchor="middle">付哪一階才划算</text>
</svg>
