<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一週貼文，一次排完 / A week of posts, scheduled in one sitting</title>
  <desc id="desc">幾何插圖。左邊三個圓角對話框上下排開，框內各有幾條橫線代表寫好的文案，三個框分別是白底、淺綠底與淺藍底。一支箭頭把三個對話框帶到畫面中央的一張日曆卡片：卡片上緣是深綠色標題帶，帶上跨著兩個圓環，卡片內是四乘四的方格，其中三格填成深綠色，代表已經排好時間的貼文。另一支箭頭從日曆通往右邊的白色成效卡片，卡片內是一條向右上走的折線與五個圓點，下方有一條灰色基準線。成效卡片下面是一個淺綠色圓形徽章，裡面是一個綠色勾號，代表發佈前人工確認過。畫面上方只有一行字：一週貼文，一次排完。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="170" font-size="56" font-weight="bold" fill="#102A2B" text-anchor="middle">一週貼文，一次排完</text>

