  <text x="1105" y="238" text-anchor="middle" font-size="16" fill="#5C6B6B">Meta Business</text>
  <text x="1105" y="262" text-anchor="middle" font-size="16" fill="#5C6B6B">Suite、Buffer</text>

  <text x="1410" y="172" text-anchor="middle" font-size="17" fill="#5C6B6B">第五步</text>
  <text x="1410" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">回顧</text>
  <text x="1410" y="238" text-anchor="middle" font-size="16" fill="#5C6B6B">Business Suite</text>
  <text x="1410" y="262" text-anchor="middle" font-size="16" fill="#5C6B6B">Insights</text>

  <path d="M 328 207 L 355 207" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 633 207 L 660 207" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 938 207 L 965 207" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1243 207 L 1270 207" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- row 2: what AI does -->
  <text x="60" y="330" font-size="18" font-weight="700" fill="#5C6B6B">AI 做什麼（灰框那一段不建議交給 AI，藍框是平台內建功能）</text>

  <rect x="60" y="348" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <rect x="365" y="348" width="260" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="670" y="348" width="260" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="975" y="348" width="260" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <rect x="1280" y="348" width="260" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>

  <text x="190" y="412" text-anchor="middle" font-size="17" fill="#5C6B6B">不建議交給 AI</text>

  <text x="495" y="392" text-anchor="middle" font-size="17" fill="#102A2B">產出多版草稿</text>
  <text x="495" y="424" text-anchor="middle" font-size="17" fill="#102A2B">改長度與語氣</text>

  <text x="800" y="392" text-anchor="middle" font-size="17" fill="#102A2B">去背、改尺寸</text>
  <text x="800" y="424" text-anchor="middle" font-size="17" fill="#102A2B">生成背景圖</text>

  <text x="1105" y="392" text-anchor="middle" font-size="17" fill="#102A2B">建議發文時段</text>
  <text x="1105" y="424" text-anchor="middle" font-size="17" fill="#2F6F9F">Active times</text>

  <text x="1410" y="392" text-anchor="middle" font-size="17" fill="#102A2B">整理成效數字</text>
  <text x="1410" y="424" text-anchor="middle" font-size="17" fill="#102A2B">歸納下週題目</text>

  <!-- row 3: what a person checks -->
  <text x="60" y="502" font-size="18" font-weight="700" fill="#5C6B6B">人要確認什麼（送出前逐篇看一次）</text>

  <rect x="60" y="520" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="365" y="520" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="670" y="520" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="975" y="520" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <rect x="1280" y="520" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>

  <text x="190" y="564" text-anchor="middle" font-size="17" fill="#102A2B">這個月要講的事</text>
  <text x="190" y="596" text-anchor="middle" font-size="17" fill="#102A2B">與不能講的事</text>

  <text x="495" y="564" text-anchor="middle" font-size="17" fill="#102A2B">日期、價格、地址</text>
  <text x="495" y="596" text-anchor="middle" font-size="17" fill="#102A2B">台灣用語與說法</text>

  <text x="800" y="564" text-anchor="middle" font-size="17" fill="#102A2B">圖上的字對不對</text>
  <text x="800" y="596" text-anchor="middle" font-size="17" fill="#102A2B">品牌色與標示</text>

  <text x="1105" y="564" text-anchor="middle" font-size="17" fill="#102A2B">平台與時間範圍</text>
  <text x="1105" y="596" text-anchor="middle" font-size="17" fill="#102A2B">跨發 Threads 條件</text>

  <text x="1410" y="564" text-anchor="middle" font-size="17" fill="#102A2B">指標定義</text>
  <text x="1410" y="596" text-anchor="middle" font-size="17" fill="#102A2B">比較同一段期間</text>

