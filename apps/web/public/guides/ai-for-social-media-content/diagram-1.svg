  <rect x="365" y="135" width="260" height="145" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="670" y="135" width="260" height="145" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="975" y="135" width="260" height="145" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <rect x="1280" y="135" width="260" height="145" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>

  <text x="190" y="172" text-anchor="middle" font-size="17" fill="#5C6B6B">第一步</text>
  <text x="190" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">定主題</text>
  <text x="190" y="238" text-anchor="middle" font-size="16" fill="#5C6B6B">行事曆或試算表</text>
  <text x="190" y="262" text-anchor="middle" font-size="16" fill="#5C6B6B">題目自己定</text>

  <text x="495" y="172" text-anchor="middle" font-size="17" fill="#5C6B6B">第二步</text>
  <text x="495" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">寫文案</text>
  <text x="495" y="238" text-anchor="middle" font-size="16" fill="#5C6B6B">ChatGPT</text>
  <text x="495" y="262" text-anchor="middle" font-size="16" fill="#5C6B6B">Claude</text>

  <text x="800" y="172" text-anchor="middle" font-size="17" fill="#5C6B6B">第三步</text>
  <text x="800" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#102A2B">做圖</text>
  <text x="800" y="238" text-anchor="middle" font-size="16" fill="#5C6B6B">設計工具</text>
  <text x="800" y="262" text-anchor="middle" font-size="16" fill="#5C6B6B">AI 圖片工具</text>

  <text x="1105" y="172" text-anchor="middle" font-size="17" fill="#5C6B6B">第四步</text>
