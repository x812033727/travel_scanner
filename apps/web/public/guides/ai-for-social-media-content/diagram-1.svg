<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一週貼文的五段工作流 / Weekly social post workflow: where AI helps and where you check</title>
  <desc id="desc">一條由左至右的五段流程。第一步定主題，工具是行事曆或試算表，這一段不建議交給 AI，人要確認這個月要講的事與不能講的事。第二步寫文案，工具是 ChatGPT 或 Claude，AI 產出多版草稿並改長度與語氣，人要確認日期、價格、地址與台灣用語。第三步做圖，工具是設計工具與 AI 圖片工具，AI 負責去背、改尺寸與生成背景圖，人要確認圖上的字是否正確以及品牌色與標示。第四步排程，工具是 Meta Business Suite 與 Buffer，平台提供 Active times 建議發文時段，人要確認平台與時間範圍以及跨發 Threads 的條件。第五步回顧，工具是 Business Suite Insights，AI 整理成效數字並歸納下週題目，人要確認指標定義與比較的是同一段期間。圖下方列出官方頁面寫的限制，查證日是 2026 年 9 月 15 日：Meta Business Suite 桌面版可排 Facebook 與 Instagram，跨發 Threads 只有桌面版；Facebook 粉絲專頁排程範圍是 20 分鐘到 29 天，Active times 依粉絲過去 7 天的活躍時間推薦，Insights 的 Overview 聚焦過去 28 天；Buffer 免費方案最多 3 個管道、每個管道同時 10 則排程，Essentials 每管道每月 US$6、年繳約 US$5。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一週貼文的五段工作流</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Weekly social post workflow: where AI helps and where you check</text>

