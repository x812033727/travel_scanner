<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">模型參數圖解 / Model Parameters</title><desc id="desc">原創示例輸入 3，乘以權重 2 再加偏差 1，得到輸出 7；下方區分當次輸入、學到的參數與呼叫設定。</desc><rect width="1600" height="900" fill="#F7F1E8"/><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">同一個算式中的資料與參數</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Model Parameters</text><rect x="80" y="220" width="290" height="160" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="225" y="312" text-anchor="middle" font-size="36" fill="#102A2B">輸入：3</text><path d="M 370 300 L 460 300" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="460" cy="300" r="10" fill="#0D6B68"/><rect x="460" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="615" y="312" text-anchor="middle" font-size="36" fill="#102A2B">權重：乘 2</text><path d="M 770 300 L 860 300" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="860" cy="300" r="10" fill="#0D6B68"/><rect x="860" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1015" y="312" text-anchor="middle" font-size="36" fill="#102A2B">偏差：加 1</text><path d="M 1170 300 L 1260 300" stroke="#0D6B68" stroke-width="9" fill="none"/><circle cx="1260" cy="300" r="10" fill="#0D6B68"/><rect x="1260" y="220" width="270" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1395" y="312" text-anchor="middle" font-size="36" fill="#102A2B">輸出：7</text><rect x="260" y="570" width="1080" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/><text x="800" y="657" text-anchor="middle" font-size="36" fill="#102A2B">改提示詞或溫度，不等於更新模型權重</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
