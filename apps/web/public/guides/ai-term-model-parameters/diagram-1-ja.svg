<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">モデルパラメータ図解 / Model Parameters</title><desc id="desc">独自の例として、入力 3 に重み 2 を掛け、バイアス 1 を足して出力 7 を得る図。下部では、その都度の入力、学習したパラメータ、呼び出し時の設定を区別しています。</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">同じ式の中のデータとパラメータ</text><text x="60" y="84" fill="#5C6B6B" font-size="18">モデルパラメータ</text><rect x="80" y="220" width="290" height="160" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="225" y="312" text-anchor="middle" font-size="36" fill="#102A2B">入力：3</text><path d="M 370 300 L 460 300" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="460" cy="300" r="10" fill="#0D6B68"></circle><rect x="460" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="615" y="312" text-anchor="middle" font-size="36" fill="#102A2B">重み：2 を掛ける</text><path d="M 770 300 L 860 300" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="860" cy="300" r="10" fill="#0D6B68"></circle><rect x="860" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1015" y="312" text-anchor="middle" font-size="32" fill="#102A2B" style="font-size: 32px;">バイアス：1 を足す</text><path d="M 1170 300 L 1260 300" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="1260" cy="300" r="10" fill="#0D6B68"></circle><rect x="1260" y="220" width="270" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1395" y="312" text-anchor="middle" font-size="36" fill="#102A2B">出力：7</text><rect x="260" y="570" width="1080" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="800" y="657" text-anchor="middle" font-size="36" fill="#102A2B">プロンプトや温度の変更 ≠ モデルの重み更新</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text></svg>
