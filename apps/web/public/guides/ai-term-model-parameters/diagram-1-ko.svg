<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">모델 매개변수 도해 / Model Parameters</title><desc id="desc">직접 만든 예시로, 입력 3에 가중치 2를 곱하고 편향 1을 더해 출력 7을 얻습니다. 아래에서는 해당 입력, 학습한 매개변수, 호출 설정을 구분합니다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">같은 수식 속 데이터와 매개변수</text><text x="60" y="84" fill="#5C6B6B" font-size="18">모델 매개변수</text><rect x="80" y="220" width="290" height="160" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="225" y="312" text-anchor="middle" font-size="36" fill="#102A2B">입력: 3</text><path d="M 370 300 L 460 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="460" cy="300" r="10" fill="#0D6B68" /><rect x="460" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="615" y="312" text-anchor="middle" font-size="36" fill="#102A2B">가중치: 2 곱하기</text><path d="M 770 300 L 860 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="860" cy="300" r="10" fill="#0D6B68" /><rect x="860" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1015" y="312" text-anchor="middle" font-size="36" fill="#102A2B">편향: 1 더하기</text><path d="M 1170 300 L 1260 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1260" cy="300" r="10" fill="#0D6B68" /><rect x="1260" y="220" width="270" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1395" y="312" text-anchor="middle" font-size="36" fill="#102A2B">출력: 7</text><rect x="260" y="570" width="1080" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="800" y="657" text-anchor="middle" font-size="36" fill="#102A2B">프롬프트·온도 변경은 가중치 갱신과 다름</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 도해 제작 2026</text></svg>
