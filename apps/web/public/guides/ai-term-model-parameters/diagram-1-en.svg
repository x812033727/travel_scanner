<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">Model Parameters Illustrated / Model Parameters</title><desc id="desc">Original example: input 3 is multiplied by weight 2, then bias 1 is added, yielding output 7. Below, current input, learned parameters and request settings are distinguished.</desc><rect width="1600" height="900" fill="#F7F1E8" /><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">Data and Parameters in One Equation</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Model Parameters</text><rect x="80" y="220" width="290" height="160" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="225" y="312" text-anchor="middle" font-size="36" fill="#102A2B">Input: 3</text><path d="M 370 300 L 460 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="460" cy="300" r="10" fill="#0D6B68" /><rect x="460" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="615" y="312" text-anchor="middle" font-size="36" fill="#102A2B">Weight: × 2</text><path d="M 770 300 L 860 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="860" cy="300" r="10" fill="#0D6B68" /><rect x="860" y="220" width="310" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1015" y="312" text-anchor="middle" font-size="36" fill="#102A2B">Bias: + 1</text><path d="M 1170 300 L 1260 300" stroke="#0D6B68" stroke-width="9" fill="none" /><circle cx="1260" cy="300" r="10" fill="#0D6B68" /><rect x="1260" y="220" width="270" height="160" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" /><text x="1395" y="312" text-anchor="middle" font-size="36" fill="#102A2B">Output: 7</text><rect x="260" y="570" width="1080" height="150" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" /><text x="800" y="657" text-anchor="middle" font-size="36" fill="#102A2B">Prompt or temperature changes ≠ weight updates</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair illustration 2026</text></svg>
