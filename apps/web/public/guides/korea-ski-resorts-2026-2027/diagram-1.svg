<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">首爾出發五大雪場交通示意圖：Elysian 江村、Vivaldi Park、Phoenix 平昌、龍平、High1 / Seoul to five Korean ski resorts</title>
  <desc id="desc">左側是首爾，向右五條路線各通往一個雪場，實線代表鐵路、虛線代表巴士與雪場接駁，圓圈是轉乘車站，橫向長度只示意車程。由上到下：Elysian 江村搭 ITX-청춘 京春線約 1 小時到白楊里站，出站免費接駁，上一季 12 月 5 日開放，夜滑到深夜 03:00；Vivaldi Park 搭首爾出發的接駁巴士，在 Sono 官網預約，車程以官網為準，上一季 12 月 5 日開放，深夜場 23:00 到隔天 03:00；Phoenix 平昌搭 KTX 江陵線到平昌站再免費接駁，KTO 寫從首爾約 1 小時 50 分，上一季 11 月 21 日開放；龍平搭 KTX 江陵線到珍富（五臺山）站，免費接駁約 20 分、16 公里，限住客或持票者，上一季 11 月 21 日開放；High1 從清涼里站搭一般列車到古汗站約 3 小時 30 分，或東首爾巴士站到古汗沙北巴士站約 2 小時 40 分，站前免費接駁，上一季 11 月 28 日開放，只到 16:00 沒有夜滑。車程與開放日取自各官網與 KTO 2025 年 11 月 27 日專文，2026–27 開放日五家皆未公告。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">首爾出發五大雪場：怎麼去、多久到　2026–27 雪季</text>
  <text x="60" y="98" font-size="18" fill="#5C6B6B">Seoul to five ski resorts · 實線＝鐵路、虛線＝巴士與雪場接駁 · 橫向長度示意車程，非比例 · 2026 年 9 月 13 日查證</text>

  <!-- Seoul -->
  <rect x="120" y="167" width="120" height="596" rx="18" fill="#0D6B68"/>
  <g text-anchor="middle" fill="#FFFFFF">
    <text x="180" y="436" font-size="28" font-weight="700">서울</text>
    <text x="180" y="472" font-size="26" font-weight="700">首爾</text>
    <text x="180" y="502" font-size="18">Seoul</text>
  </g>

  <!-- Band 1: Elysian Gangchon -->
  <line x1="240" y1="215" x2="600" y2="215" stroke="#0D6B68" stroke-width="6"/>
  <text x="420" y="195" font-size="17" fill="#102A2B" text-anchor="middle">ITX-청춘 京春線・約 1 小時（KTO）</text>
  <circle cx="600" cy="215" r="11" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="590" y="250" font-size="15" fill="#5C6B6B" text-anchor="middle">백양리 白楊里 Baegyang-ri</text>
  <line x1="611" y1="215" x2="720" y2="215" stroke="#0D6B68" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="665" y="195" font-size="15" fill="#5C6B6B" text-anchor="middle">免費接駁</text>
  <rect x="720" y="167" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="740" y="201" font-size="20" font-weight="700" fill="#102A2B">엘리시안 강촌 Elysian 江村</text>
  <text x="740" y="228" font-size="15" fill="#5C6B6B">春川 Chuncheon・上一季 12 月 5 日開放</text>
  <text x="740" y="251" font-size="15" fill="#5C6B6B">電鐵可達，夜滑到深夜 03:00</text>

  <!-- Band 2: Vivaldi Park -->
  <line x1="240" y1="340" x2="760" y2="340" stroke="#B8442D" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="500" y="320" font-size="17" fill="#102A2B" text-anchor="middle">首爾出發接駁巴士（Sono 官網預約，車程以官網為準）</text>
  <rect x="760" y="292" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="780" y="326" font-size="20" font-weight="700" fill="#102A2B">비발디파크 Vivaldi Park 洪川</text>
  <text x="780" y="353" font-size="15" fill="#5C6B6B">洪川 Hongcheon・上一季 12 月 5 日開放</text>
  <text x="780" y="376" font-size="15" fill="#5C6B6B">深夜場 23:00 到隔天 03:00</text>

  <!-- Band 3: Phoenix Pyeongchang -->
  <line x1="240" y1="465" x2="880" y2="465" stroke="#2F6F9F" stroke-width="6"/>
  <text x="560" y="445" font-size="17" fill="#102A2B" text-anchor="middle">KTX 江陵線（時刻、票價以 Korail 為準）</text>
  <circle cx="880" cy="465" r="11" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="860" y="500" font-size="15" fill="#5C6B6B" text-anchor="middle">평창 平昌 Pyeongchang</text>
  <line x1="891" y1="465" x2="1000" y2="465" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="945" y="445" font-size="15" fill="#5C6B6B" text-anchor="middle">免費接駁</text>
  <rect x="1000" y="417" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1020" y="451" font-size="20" font-weight="700" fill="#102A2B">휘닉스 평창 Phoenix 平昌</text>
  <text x="1020" y="478" font-size="15" fill="#5C6B6B">平昌奉坪・上一季 11 月 21 日開放</text>
  <text x="1020" y="501" font-size="15" fill="#5C6B6B">KTO：從首爾約 1 小時 50 分</text>

  <!-- Band 4: Yongpyong -->
  <line x1="240" y1="590" x2="980" y2="590" stroke="#2F6F9F" stroke-width="6"/>
  <text x="610" y="570" font-size="17" fill="#102A2B" text-anchor="middle">KTX 江陵線・平昌的下一站珍富（五臺山）</text>
  <circle cx="980" cy="590" r="11" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="980" y="625" font-size="15" fill="#5C6B6B" text-anchor="middle">진부(오대산) 珍富 Jinbu</text>
  <line x1="991" y1="590" x2="1140" y2="590" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="1130" y="570" font-size="15" fill="#5C6B6B" text-anchor="end">免費接駁 約 20 分・16 km</text>
  <rect x="1140" y="542" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/>
  <text x="1160" y="576" font-size="20" font-weight="700" fill="#102A2B">모나 용평 Yongpyong 龍平</text>
  <text x="1160" y="603" font-size="15" fill="#5C6B6B">平昌大關嶺・上一季 11 月 21 日開放</text>
  <text x="1160" y="626" font-size="15" fill="#5C6B6B">珍富站接駁限住客或持票者</text>

  <!-- Band 5: High1 -->
  <line x1="240" y1="715" x2="1060" y2="715" stroke="#6B4A3A" stroke-width="6"/>
  <text x="650" y="695" font-size="17" fill="#102A2B" text-anchor="middle">청량리 清涼里站 → 고한 古汗站 一般列車・約 3 小時 30 分（官網）</text>
  <text x="650" y="745" font-size="15" fill="#5C6B6B" text-anchor="middle">或東首爾巴士站 → 古汗沙北巴士站 約 2 小時 40 分</text>
  <circle cx="1060" cy="715" r="11" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="1060" y="749" font-size="15" fill="#5C6B6B" text-anchor="middle">고한 古汗 Gohan</text>
  <line x1="1071" y1="715" x2="1160" y2="715" stroke="#6B4A3A" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="1115" y="695" font-size="15" fill="#5C6B6B" text-anchor="middle">免費接駁</text>
  <rect x="1160" y="667" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="1180" y="701" font-size="20" font-weight="700" fill="#102A2B">하이원 High1 旌善</text>
  <text x="1180" y="728" font-size="15" fill="#5C6B6B">旌善 Jeongseon・上一季 11 月 28 日開放</text>
  <text x="1180" y="751" font-size="15" fill="#5C6B6B">只到 16:00、無夜滑；五家最遠</text>

  <!-- Legend -->
  <line x1="60" y1="805" x2="130" y2="805" stroke="#102A2B" stroke-width="6"/>
  <text x="145" y="811" font-size="16" fill="#102A2B">實線＝鐵路（ITX-청춘、KTX 江陵線、一般列車）</text>
  <line x1="620" y1="805" x2="690" y2="805" stroke="#102A2B" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="705" y="811" font-size="16" fill="#102A2B">虛線＝巴士、雪場免費接駁</text>
  <circle cx="1010" cy="805" r="9" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/>
  <text x="1030" y="811" font-size="16" fill="#102A2B">○＝轉乘車站</text>
  <text x="60" y="845" font-size="16" fill="#5C6B6B">車程與開放日取自各官網與 KTO 2025 年 11 月 27 日專文；2026–27 開放日五家皆未公告，以官網為準</text>
  <text x="1540" y="885" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
