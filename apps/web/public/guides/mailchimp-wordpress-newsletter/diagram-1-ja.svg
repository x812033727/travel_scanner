<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Yu Gothic','Noto Sans JP',sans-serif">
<title id="title">WordPressとMailchimpの連携を検証</title><desc id="desc">アカウント接続、フォーム確認、データ同期、配信停止の検証を四枚のカードで順に示し、システムをまたいで結果を確認する必要性を表す。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">WordPressとMailchimpの連携を検証</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">フォーム、データ同期、配信停止を分けて誤送信を防ぐ</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">アカウント接続</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">キーは設定画面へ</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">宛先を確認</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">フォーム確認</text>
<text x="477.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">項目形式を合わせる</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">送信と確認は別</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">データ同期</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">関心更新を定義</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">会員を自動登録しない</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">配信停止の検証</text>
<text x="1215.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">対応する入口を使う</text>
<text x="1215.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">古いデータを戻さない</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">WordPressで送信、Mailchimpで受信状態を確認する。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair独自の図</text>
</svg>