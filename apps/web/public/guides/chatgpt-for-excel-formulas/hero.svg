  <rect x="398" y="458" width="120" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="588" y="458" width="80" height="14" rx="7" fill="#D97A2B"/>
  <rect x="778" y="458" width="110" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="208" y="548" width="110" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="398" y="548" width="70" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="588" y="548" width="120" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="778" y="548" width="90" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="208" y="638" width="110" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="398" y="638" width="110" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="588" y="638" width="60" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="778" y="638" width="120" height="14" rx="7" fill="#5C6B6B"/>

  <!-- floating fx symbol -->
  <circle cx="880" cy="300" r="142" fill="#FFFFFF"/>
  <circle cx="880" cy="300" r="130" fill="#0D6B68"/>
  <text x="872" y="352" text-anchor="middle" font-size="150" font-style="italic" font-weight="700" fill="#FFFFFF" font-family="Georgia,'Times New Roman','Noto Serif TC',serif">fx</text>

  <!-- chat bubble -->
  <path d="M 1088 120 H 1452 a 48 48 0 0 1 48 48 V 352 a 48 48 0 0 1 -48 48 H 1170 L 1060 470 L 1088 400 a 48 48 0 0 1 -48 -48 V 168 a 48 48 0 0 1 48 -48 Z" fill="#2F6F9F"/>
  <rect x="1100" y="190" width="330" height="26" rx="13" fill="#E6F0F7"/>
