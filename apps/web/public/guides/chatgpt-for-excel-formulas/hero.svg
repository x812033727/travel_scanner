<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">描述清楚，公式就對 / A spreadsheet grid with a floating fx symbol and a chat bubble</title>
  <desc id="desc">米色底的插圖。畫面左半是一張白色的試算表：第一列是淡綠色的標題列，裡面有四條深綠色的短橫條代表欄位名稱，下面用綠色格線畫出三欄四列的儲存格，每格裡有一條灰色或綠色的短橫條代表資料，其中一格是橘色的。試算表的右上角浮著一個大的墨綠色圓形，圓形外圍有一圈白邊，圓裡是白色的斜體 fx 符號，代表公式。畫面右上方有一個藍色的對話泡泡，左下角的小尾巴朝向那個圓形，泡泡裡有三條由長到短的淺藍色文字線與一顆橘色的小圓點，代表對話正在回答。畫面下方置中一行深色的字：描述清楚，公式就對。沒有任何品牌標誌、介面或人物。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="250" cy="190" r="100" fill="#E3F0EF"/>
  <circle cx="1350" cy="700" r="130" fill="#E6F0F7"/>

  <!-- spreadsheet -->
  <rect x="180" y="260" width="760" height="440" rx="22" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <path d="M 202 260 H 918 a 22 22 0 0 1 22 22 V 330 H 180 V 282 a 22 22 0 0 1 22 -22 Z" fill="#E6F2EC"/>
  <path d="M 180 330 H 940 M 180 420 H 940 M 180 510 H 940 M 180 600 H 940 M 370 260 V 700 M 560 260 V 700 M 750 260 V 700" stroke="#2E7D5B" stroke-width="4" fill="none"/>
  <rect x="208" y="286" width="120" height="18" rx="9" fill="#2E7D5B"/>
  <rect x="398" y="286" width="120" height="18" rx="9" fill="#2E7D5B"/>
  <rect x="588" y="286" width="120" height="18" rx="9" fill="#2E7D5B"/>
  <rect x="778" y="286" width="120" height="18" rx="9" fill="#2E7D5B"/>
  <rect x="208" y="368" width="110" height="14" rx="7" fill="#2E7D5B"/>
  <rect x="398" y="368" width="90" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="588" y="368" width="120" height="14" rx="7" fill="#5C6B6B"/>
