<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">테마를 위한 다섯 가지 점검</title><desc id="desc">읽기, 조작, 기능 의존성, 업데이트, 이전 가능성의 다섯 기준으로 테마를 점검하는 독창적 도해.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">테마를 위한 다섯 가지 점검</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">외관뿐 아니라 편집과 장기 관리도 확인</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">읽기</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">중국어와 긴 제목</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">이미지와 표</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">조작</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">모바일과 키보드</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">탐색 메뉴와 양식</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">의존성</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">특수 콘텐츠의 출처</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">필수 추가 플러그인</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">업데이트</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">맞춤 설정 보존</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">호환성과 복구</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">이전</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">변경 후의 콘텐츠</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">재구성 작업량</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">실제 콘텐츠로 검증한 뒤 장기 유지 관리 방식을 결정합니다.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 독창적 도해</text>
</svg>
