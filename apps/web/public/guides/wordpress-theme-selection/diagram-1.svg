<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">佈景主題的五項驗收</title><desc id="desc">佈景選擇依閱讀、操作、功能依賴、更新與可攜性五項條件驗收的原創圖解。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">佈景主題的五項驗收</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">外觀之外，也要確認編輯與長期維護</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">閱讀</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">中文與長標題</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">圖片及表格</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">操作</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">手機與鍵盤</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">導覽及表單</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">依賴</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">特殊內容來源</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">必要附加外掛</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">更新</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">客製化保存</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">相容與回復</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">可攜性</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">切換後的內容</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">重建工作量</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先用真實內容驗收，再決定長期維護的方式。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
