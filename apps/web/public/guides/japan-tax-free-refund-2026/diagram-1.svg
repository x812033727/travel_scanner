<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本免稅流程新舊對照：2026 年 10 月 31 日以前的免稅方式與 11 月 1 日起的先付後退方式</title>
  <desc id="desc">上列是現行制度：在免稅店出示護照以免稅價購買、消耗品密封，出境時在安檢後的管制區由海關確認，然後登機。下列是 2026 年 11 月 1 日起的退款制：在免稅店付含稅價並登記退款方式，出境時在安檢前、託運行李之前於自助機台或 Visit Japan Web 掃護照，綠燈完成、紅燈要海關檢查並出示商品，出境後由免稅店或退款業者退款；購買日起 90 天內要完成。不變的是未稅 5,000 日圓門檻；取消的是一般物品與消耗品分類、50 萬日圓上限與密封包裝；境內用過的消耗品拿不到退款。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本免稅：現行方式 vs 2026 年 11 月 1 日起的先付後退方式</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">Tax-free shopping in Japan, before and after 1 Nov 2026 · 整理自觀光廳與國稅廳公告，2026 年 9 月查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- old row -->
  <rect x="60" y="130" width="1480" height="210" rx="20" fill="#EFEAE2"/>
  <text x="84" y="166" font-size="22" font-weight="700" fill="#5C6B6B">2026 年 10 月 31 日以前　現行制度（免税方式 / Tax-free at the till）</text>
  <g font-size="17" fill="#102A2B">
    <rect x="90" y="190" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3"/>
    <text x="110" y="222" font-weight="700">免稅店 Tax-free shop</text>
    <text x="110" y="250">出示護照，以免稅價（未稅）購買</text>
    <text x="110" y="276">消耗品密封包裝，境內不能拆用</text>
    <path d="M 496 250 L 540 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="550" y="190" width="440" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3"/>
    <text x="570" y="222" font-weight="700">機場安檢後（管制區）Customs after security</text>
    <text x="570" y="250">海關確認護照與購買紀錄</text>
    <text x="570" y="276">已經是免稅價，沒有退款步驟</text>
    <path d="M 996 250 L 1040 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1050" y="190" width="200" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3"/>
    <text x="1150" y="256" font-weight="700" text-anchor="middle">登機 Departure</text>
  </g>

  <!-- change tags between rows -->
  <g font-size="15" font-weight="700">
    <rect x="90" y="356" width="300" height="34" rx="17" fill="#2E7D5B"/><text x="240" y="379" fill="#FFFFFF" text-anchor="middle">未稅 5,000 日圓門檻：不變</text>
    <rect x="410" y="356" width="560" height="34" rx="17" fill="#B8442D"/><text x="690" y="379" fill="#FFFFFF" text-anchor="middle">一般物品／消耗品分類、50 萬日圓上限、密封包裝：取消</text>
    <rect x="990" y="356" width="380" height="34" rx="17" fill="#8C6A14"/><text x="1180" y="379" fill="#FFFFFF" text-anchor="middle">境內用過的消耗品：無法退款</text>
  </g>

  <!-- new row -->
  <rect x="60" y="410" width="1480" height="400" rx="20" fill="#E8F1F3"/>
  <text x="84" y="446" font-size="22" font-weight="700" fill="#0D6B68">2026 年 11 月 1 日起　先付後退方式（リファンド方式 / Refund system）</text>
  <rect x="84" y="462" width="1432" height="8" rx="4" fill="#0D6B68" opacity="0.25"/>
  <text x="1516" y="490" font-size="15" fill="#0D6B68" text-anchor="end" font-weight="700">購買日起 90 天內完成海關確認 · within 90 days of purchase</text>
  <g font-size="16" fill="#102A2B">
    <rect x="90" y="510" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="108" y="542" font-weight="700" font-size="18">1　免稅店 Tax-free shop</text>
    <text x="108" y="574">出示護照或 Visit Japan Web</text>
    <text x="108" y="600">付含稅價</text>
    <text x="108" y="626">登記退款方式（信用卡等）</text>
    <text x="108" y="652">購買紀錄傳到國稅廳系統</text>
    <path d="M 426 610 L 462 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="470" y="510" width="360" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="488" y="542" font-weight="700" font-size="18">2　機場：安檢前、託運前</text>
    <text x="488" y="568" fill="#5C6B6B">Before check-in (public area)</text>
    <text x="488" y="600">免稅手續自助機台 kiosk 掃護照</text>
    <text x="488" y="626">或 Visit Japan Web 線上辦</text>
    <text x="488" y="652">商品要帶在身上、還沒託運</text>
    <path d="M 836 580 L 872 560" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 836 640 L 872 660" stroke="#B8442D" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="880" y="510" width="300" height="86" rx="16" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4"/>
    <text x="898" y="542" font-weight="700" fill="#2E7D5B">綠色　確認完成 OK</text>
    <text x="898" y="572">直接去託運、安檢</text>
    <rect x="880" y="624" width="300" height="86" rx="16" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
    <text x="898" y="656" font-weight="700" fill="#B8442D">紅色　到海關櫃檯受檢</text>
    <text x="898" y="686">海關可要求出示商品</text>
    <path d="M 1186 610 L 1222 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="1230" y="510" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
    <text x="1248" y="542" font-weight="700" font-size="18">3　出境後退款 Refund</text>
    <text x="1248" y="574">由免稅店或其委託的</text>
    <text x="1248" y="600">退款業者退還消費稅相當額</text>
    <text x="1248" y="626">銀行匯款、信用卡、App</text>
    <text x="1248" y="652">或機場現金，各店不同</text>
    <text x="1248" y="684" fill="#5C6B6B" font-size="15">購買時先問清楚方式與時間</text>
  </g>
  <text x="84" y="790" font-size="16" fill="#5C6B6B">看的是「販售日」：11 月 1 日零時以後買的才適用退款制，10 月 31 日以前買的照舊制，沒有並行期。</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
