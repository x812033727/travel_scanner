<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本免税流程新旧对照：2026 年 10 月 31 日以前的免税方式与 11 月 1 日起的先付后退方式</title>
  <desc id="desc">上排是现行制度：在免税店出示护照，以免税价购买，消耗品密封；出境时在安检后的管制区由海关确认，然后登机。下排是 2026 年 11 月 1 日起的退款制：在免税店支付含税价并登记退款方式，出境时在安检前、托运行李之前，通过自助机或 Visit Japan Web 扫描护照，绿灯表示完成，红灯表示需要海关检查并出示商品，海关确认后由免税店或退款机构退款；须在购买日起 90 天内完成。不变的是不含税金额 5,000 日元门槛；取消的是一般物品与消耗品分类、50 万日元上限与密封包装；在境内使用过的消耗品拿不到退款。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本免税：现行方式与 2026 年 11 月 1 日起的先付后退方式对比</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">日本免税购物：1 Nov 2026 前后对比 · 根据观光厅与国税厅公告整理，2026 年 9 月核实</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>


  <rect x="60" y="130" width="1480" height="210" rx="20" fill="#EFEAE2" />
  <text x="84" y="166" font-size="22" font-weight="700" fill="#5C6B6B">2026 年 10 月 31 日以前　现行制度（免税方式／结账时免税）</text>
  <g font-size="17" fill="#102A2B">
    <rect x="90" y="190" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="110" y="222" font-weight="700">免税店</text>
    <text x="110" y="250">出示护照，以免税价（不含税）购买</text>
    <text x="110" y="276">消耗品密封包装，境内不能拆开使用</text>
    <path d="M 496 250 L 540 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="550" y="190" width="440" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="570" y="222" font-weight="700">机场安检后（管制区）海关</text>
    <text x="570" y="250">海关确认护照与购买记录</text>
    <text x="570" y="276">已按免税价购买，无退款步骤</text>
    <path d="M 996 250 L 1040 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="1050" y="190" width="200" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="1150" y="256" font-weight="700" text-anchor="middle">登机／离境</text>
  </g>


  <g font-size="15" font-weight="700">
    <rect x="90" y="356" width="300" height="34" rx="17" fill="#2E7D5B" /><text x="240" y="379" fill="#FFFFFF" text-anchor="middle">不含税金额 5,000 日元门槛：不变</text>
    <rect x="410" y="356" width="560" height="34" rx="17" fill="#B8442D" /><text x="690" y="379" fill="#FFFFFF" text-anchor="middle">一般物品／消耗品分类、50 万日元上限、密封包装：取消</text>
    <rect x="990" y="356" width="380" height="34" rx="17" fill="#8C6A14" /><text x="1180" y="379" fill="#FFFFFF" text-anchor="middle">境内使用过的消耗品：无法退款</text>
  </g>


  <rect x="60" y="410" width="1480" height="400" rx="20" fill="#E8F1F3" />
  <text x="84" y="446" font-size="22" font-weight="700" fill="#0D6B68">2026 年 11 月 1 日起　先付后退方式（退款方式／退款制）</text>
  <rect x="84" y="462" width="1432" height="8" rx="4" fill="#0D6B68" opacity="0.25" />
  <text x="1516" y="490" font-size="15" fill="#0D6B68" text-anchor="end" font-weight="700">购买日起 90 天内完成海关确认 · 购买后 90 天内</text>
  <g font-size="16" fill="#102A2B">
    <rect x="90" y="510" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="108" y="542" font-weight="700" font-size="18">1　免税店</text>
    <text x="108" y="574">出示护照或 Visit Japan Web</text>
    <text x="108" y="600">支付含税价</text>
    <text x="108" y="626">登记退款方式（信用卡等）</text>
    <text x="108" y="652">购买记录传至国税厅系统</text>
    <path d="M 426 610 L 462 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="470" y="510" width="360" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="488" y="542" font-weight="700" font-size="18">2　机场：安检前、托运前</text>
    <text x="488" y="568" fill="#5C6B6B">办理值机前（公共区域）</text>
    <text x="488" y="600">在免税手续自助机扫描护照</text>
    <text x="488" y="626">或通过 Visit Japan Web 在线办理</text>
    <text x="488" y="652">商品须随身携带、尚未托运</text>
    <path d="M 836 580 L 872 560" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrow)" />
    <path d="M 836 640 L 872 660" stroke="#B8442D" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="880" y="510" width="300" height="86" rx="16" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
    <text x="898" y="542" font-weight="700" fill="#2E7D5B">绿色　确认完成／通过</text>
    <text x="898" y="572">直接办理托运、安检</text>
    <rect x="880" y="624" width="300" height="86" rx="16" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
    <text x="898" y="656" font-weight="700" fill="#B8442D">红色　到海关柜台接受检查</text>
    <text x="898" y="686">海关可要求出示商品</text>
    <path d="M 1186 610 L 1222 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="1230" y="510" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="1248" y="542" font-weight="700" font-size="18">3　海关确认后退款</text>
    <text x="1248" y="574">由免税店或其委托的</text>
    <text x="1248" y="600">退款机构退还相当于消费税的金额</text>
    <text x="1248" y="626">银行汇款、信用卡、App</text>
    <text x="1248" y="652">或机场现金，各店不同</text>
    <text x="1248" y="684" fill="#5C6B6B" font-size="15">购买时先问清楚方式与时间</text>
  </g>
  <text x="84" y="790" font-size="16" fill="#5C6B6B">依据“销售日”：11 月 1 日零时以后购买的才适用退款制，10 月 31 日以前购买的按旧制办理，没有并行期。</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 制图 2026</text>
</svg>
