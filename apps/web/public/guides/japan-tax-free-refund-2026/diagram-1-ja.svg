<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本の免税手続きの新旧比較：2026 年 10 月 31 日以前の免税方式と 11 月 1 日からの先に支払い、後で返金する方式</title>
  <desc id="desc">上段は現行制度です。免税店でパスポートを提示して免税価格で購入し、消耗品を密封包装します。出国時は保安検査後の制限区域内で税関の確認を受け、その後に搭乗します。下段は 2026 年 11 月 1 日からのリファンド方式です。免税店で税込価格を支払い、返金方法を登録します。出国時は保安検査・手荷物を預ける前に、セルフ端末または Visit Japan Web でパスポートを読み取ります。緑なら完了、赤なら税関検査を受けて商品を提示します。税関確認後、免税店または返金事業者が返金します。購入日から 90 日以内に手続きを完了する必要があります。税抜 5,000 円の最低購入額は変わりません。一般物品と消耗品の分類、50 万円の上限、密封包装は廃止されます。日本国内で使用した消耗品は返金を受けられません。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">日本の免税：現行方式と 2026 年 11 月 1 日からの先払い・返金方式の比較</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">日本の免税ショッピング、1 Nov 2026 の前後 · 観光庁と国税庁の発表を基に整理、2026 年 9 月確認</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>


  <rect x="60" y="130" width="1480" height="210" rx="20" fill="#EFEAE2" />
  <text x="84" y="166" font-size="22" font-weight="700" fill="#5C6B6B">2026 年 10 月 31 日以前　現行制度（免税方式 / 会計時に免税）</text>
  <g font-size="17" fill="#102A2B">
    <rect x="90" y="190" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="110" y="222" font-weight="700">免税店（免税ショップ）</text>
    <text x="110" y="250">パスポートを提示し、免税価格（税抜）で購入</text>
    <text x="110" y="276">消耗品は密封包装、国内で開封・使用不可</text>
    <path d="M 496 250 L 540 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="550" y="190" width="440" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="570" y="222" font-weight="700">空港の保安検査後（制限区域）の税関</text>
    <text x="570" y="250">税関がパスポートと購入記録を確認</text>
    <text x="570" y="276">すでに免税価格のため、返金手続きなし</text>
    <path d="M 996 250 L 1040 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="1050" y="190" width="200" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="1150" y="256" font-weight="700" text-anchor="middle">搭乗・出発</text>
  </g>


  <g font-size="15" font-weight="700">
    <rect x="90" y="356" width="300" height="34" rx="17" fill="#2E7D5B" /><text x="240" y="379" fill="#FFFFFF" text-anchor="middle">税抜 5,000 円の最低購入額：変更なし</text>
    <rect x="410" y="356" width="560" height="34" rx="17" fill="#B8442D" /><text x="690" y="379" fill="#FFFFFF" text-anchor="middle">一般物品／消耗品の分類、50 万円上限、密封包装：廃止</text>
    <rect x="990" y="356" width="380" height="34" rx="17" fill="#8C6A14" /><text x="1180" y="379" fill="#FFFFFF" text-anchor="middle">国内で使用した消耗品：返金不可</text>
  </g>


  <rect x="60" y="410" width="1480" height="400" rx="20" fill="#E8F1F3" />
  <text x="84" y="446" font-size="22" font-weight="700" fill="#0D6B68">2026 年 11 月 1 日から　先払い・返金方式（リファンド方式 / 返金制度）</text>
  <rect x="84" y="462" width="1432" height="8" rx="4" fill="#0D6B68" opacity="0.25" />
  <text x="1516" y="490" font-size="15" fill="#0D6B68" text-anchor="end" font-weight="700">購入日から 90 日以内に税関確認を完了 · 購入から 90 日以内</text>
  <g font-size="16" fill="#102A2B">
    <rect x="90" y="510" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="108" y="542" font-weight="700" font-size="18">1　免税店（免税ショップ）</text>
    <text x="108" y="574">パスポートまたは Visit Japan Web を提示</text>
    <text x="108" y="600">税込価格を支払う</text>
    <text x="108" y="626">返金方法を登録（クレジットカードなど）</text>
    <text x="108" y="652">購入記録を国税庁のシステムへ送信</text>
    <path d="M 426 610 L 462 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="470" y="510" width="360" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="488" y="542" font-weight="700" font-size="18">2　空港：保安検査・手荷物を預ける前</text>
    <text x="488" y="568" fill="#5C6B6B">チェックイン前（一般区域）</text>
    <text x="488" y="600">免税手続きのセルフ端末でパスポートを読取</text>
    <text x="488" y="626">または Visit Japan Web でオンライン手続き</text>
    <text x="488" y="652">商品は携帯し、まだ預けていない状態で</text>
    <path d="M 836 580 L 872 560" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrow)" />
    <path d="M 836 640 L 872 660" stroke="#B8442D" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="880" y="510" width="300" height="86" rx="16" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
    <text x="898" y="542" font-weight="700" fill="#2E7D5B">緑　確認完了 OK</text>
    <text x="898" y="572">そのまま手荷物預け・保安検査へ</text>
    <rect x="880" y="624" width="300" height="86" rx="16" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
    <text x="898" y="656" font-weight="700" fill="#B8442D">赤　税関カウンターで検査</text>
    <text x="898" y="686">税関が商品提示を求める場合あり</text>
    <path d="M 1186 610 L 1222 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="1230" y="510" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="1248" y="542" font-weight="700" font-size="18">3　税関確認後に返金</text>
    <text x="1248" y="574">免税店またはその委託先の</text>
    <text x="1248" y="600">返金事業者が消費税相当額を返金</text>
    <text x="1248" y="626">銀行振込、クレジットカード、アプリ</text>
    <text x="1248" y="652">または空港で現金。店ごとに異なる</text>
    <text x="1248" y="684" fill="#5C6B6B" font-size="15">購入時に方法と時期を確認</text>
  </g>
  <text x="84" y="790" font-size="16" fill="#5C6B6B">基準は「販売日」：11 月 1 日午前零時以降の購入分だけがリファンド方式の対象。10 月 31 日以前の購入分は旧制度で、併用期間はありません。</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 作図 2026</text>
</svg>
