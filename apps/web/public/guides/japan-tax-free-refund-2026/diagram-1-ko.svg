<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">일본 면세 절차 신·구 비교: 2026년 10월 31일까지의 면세 방식과 11월 1일부터의 선납 후 환급 방식</title>
  <desc id="desc">위쪽은 현행 제도입니다. 면세점에서 여권을 제시하고 면세 가격으로 구매하며, 소모품은 밀봉합니다. 출국 시 보안검색 후 통제구역에서 세관 확인을 받고 탑승합니다. 아래쪽은 2026년 11월 1일부터의 환급제입니다. 면세점에서 세금 포함 가격을 지불하고 환급 방식을 등록합니다. 출국 시 보안검색 전, 수하물을 부치기 전에 셀프 서비스 기기나 Visit Japan Web에서 여권을 스캔합니다. 초록색이면 완료이며, 빨간색이면 세관 검사를 받고 상품을 제시해야 합니다. 세관 확인 후 면세점이나 환급 업체가 환급하며, 구매일부터 90일 이내에 절차를 마쳐야 합니다. 세금 제외 5,000엔 기준은 유지됩니다. 일반 물품·소모품 구분, 50만 엔 한도, 밀봉 포장은 폐지됩니다. 일본 내에서 사용한 소모품은 환급받을 수 없습니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="60" y="64" font-size="34" font-weight="700" fill="#102A2B">일본 면세: 현행 방식과 2026년 11월 1일부터의 선납 후 환급 방식 비교</text>
  <text x="60" y="96" font-size="18" fill="#5C6B6B">2026년 십일월 1일 전후 일본 면세 쇼핑 · 관광청·국세청 공지 정리, 2026년 9월 확인</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
  </defs>


  <rect x="60" y="130" width="1480" height="210" rx="20" fill="#EFEAE2" />
  <text x="84" y="166" font-size="22" font-weight="700" fill="#5C6B6B">2026년 10월 31일까지　현행 제도(결제 시 즉시 면세)</text>
  <g font-size="17" fill="#102A2B">
    <rect x="90" y="190" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="110" y="222" font-weight="700">면세점</text>
    <text x="110" y="250">여권 제시 후 면세 가격(세금 제외)으로 구매</text>
    <text x="110" y="276">소모품 밀봉 포장, 일본 내 개봉·사용 금지</text>
    <path d="M 496 250 L 540 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="550" y="190" width="440" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="570" y="222" font-weight="700">공항 보안검색 후(통제구역) 세관</text>
    <text x="570" y="250">세관이 여권과 구매 기록 확인</text>
    <text x="570" y="276">이미 면세 가격이므로 환급 절차 없음</text>
    <path d="M 996 250 L 1040 250" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />
    <rect x="1050" y="190" width="200" height="120" rx="16" fill="#FFFFFF" stroke="#8A8F8F" stroke-width="3" />
    <text x="1150" y="256" font-weight="700" text-anchor="middle">탑승·출국</text>
  </g>


  <g font-size="15" font-weight="700">
    <rect x="90" y="356" width="300" height="34" rx="17" fill="#2E7D5B" /><text x="240" y="379" fill="#FFFFFF" text-anchor="middle">세금 제외 5,000엔 기준: 유지</text>
    <rect x="410" y="356" width="560" height="34" rx="17" fill="#B8442D" /><text x="690" y="379" fill="#FFFFFF" text-anchor="middle">일반 물품·소모품 구분, 50만 엔 한도, 밀봉 포장: 폐지</text>
    <rect x="990" y="356" width="380" height="34" rx="17" fill="#8C6A14" /><text x="1180" y="379" fill="#FFFFFF" text-anchor="middle">일본 내에서 사용한 소모품: 환급 불가</text>
  </g>


  <rect x="60" y="410" width="1480" height="400" rx="20" fill="#E8F1F3" />
  <text x="84" y="446" font-size="22" font-weight="700" fill="#0D6B68">2026년 11월 1일부터　선납 후 환급 방식(리펀드 제도)</text>
  <rect x="84" y="462" width="1432" height="8" rx="4" fill="#0D6B68" opacity="0.25" />
  <text x="1516" y="490" font-size="15" fill="#0D6B68" text-anchor="end" font-weight="700">구매일부터 90일 이내 세관 확인 완료 · 구매 후 90일 이내</text>
  <g font-size="16" fill="#102A2B">
    <rect x="90" y="510" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="108" y="542" font-weight="700" font-size="18">1　면세점</text>
    <text x="108" y="574">여권 또는 Visit Japan Web 제시</text>
    <text x="108" y="600">세금 포함 가격 지불</text>
    <text x="108" y="626">환급 방식 등록(신용카드 등)</text>
    <text x="108" y="652">구매 기록을 국세청 시스템으로 전송</text>
    <path d="M 426 610 L 462 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="470" y="510" width="360" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="488" y="542" font-weight="700" font-size="18">2　공항: 보안검색 전·수하물 위탁 전</text>
    <text x="488" y="568" fill="#5C6B6B">체크인 전(일반구역)</text>
    <text x="488" y="600">면세 절차 셀프 서비스 기기에서 여권 스캔</text>
    <text x="488" y="626">또는 Visit Japan Web으로 온라인 처리</text>
    <text x="488" y="652">상품 휴대, 수하물로 부치기 전</text>
    <path d="M 836 580 L 872 560" stroke="#2E7D5B" stroke-width="5" marker-end="url(#arrow)" />
    <path d="M 836 640 L 872 660" stroke="#B8442D" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="880" y="510" width="300" height="86" rx="16" fill="#E9F5EE" stroke="#2E7D5B" stroke-width="4" />
    <text x="898" y="542" font-weight="700" fill="#2E7D5B">초록색　확인 완료 OK</text>
    <text x="898" y="572">바로 수하물 위탁·보안검색 진행</text>
    <rect x="880" y="624" width="300" height="86" rx="16" fill="#FBE9E4" stroke="#B8442D" stroke-width="4" />
    <text x="898" y="656" font-weight="700" fill="#B8442D">빨간색　세관 창구에서 검사</text>
    <text x="898" y="686">세관이 상품 제시를 요구할 수 있음</text>
    <path d="M 1186 610 L 1222 610" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)" />

    <rect x="1230" y="510" width="290" height="200" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4" />
    <text x="1248" y="542" font-weight="700" font-size="18">3　세관 확인 후 환급</text>
    <text x="1248" y="574">면세점 또는 매장이 위탁한</text>
    <text x="1248" y="600">환급 업체가 소비세 상당액 환급</text>
    <text x="1248" y="626">계좌 송금·신용카드·앱</text>
    <text x="1248" y="652">또는 공항 현금 수령, 매장마다 다름</text>
    <text x="1248" y="684" fill="#5C6B6B" font-size="15">구매 시 환급 방식·시점 확인</text>
  </g>
  <text x="84" y="790" font-size="16" fill="#5C6B6B">기준은 ‘판매일’: 11월 1일 자정 이후 구매분만 환급제 적용. 10월 31일까지 구매분은 기존 제도 적용. 병행 기간 없음.</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 도표 제작 2026</text>
</svg>
