<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">MiniMax 產品家族結構圖：一家公司、五條產品線、各自的入口 / MiniMax product family: one company, five product lines, their entry points</title>
  <desc id="desc">最上層是 MiniMax 公司：總部在上海，2022 年初成立，2026 年 1 月在香港上市；海外產品由新加坡的 Nanonoble Pte. Ltd. 營運，中國版網址另有一套，台灣使用者走國際版。往下分成五條產品線。一、海螺 AI 影片與圖片：模型 MiniMax H3，文字或圖片生成影片，4 到 15 秒、最高 2K，自帶立體聲配音；入口是 hailuoai.video 與 iOS、Android App。二、語音 MiniMax Audio：模型 Speech 2.8，文字轉語音與配音，10 秒樣本複製聲音，32 種語言；入口是 minimax.io 的 audio 分頁與 API。三、音樂 Music 3.0：描述加歌詞生成歌曲，最長 5 分鐘、含人聲，權重開放下載；入口是 MiniMax Audio、API 的 music-3.0 與 Hugging Face。四、對話與代理 MiniMax Agent：升級版改名 Mavis，有 Lightning 與 Pro 模式，Agent Team 多代理分工，桌面版叫 MiniMax Code；入口是 agent.minimax.io、macOS 與 Windows 桌面版、Google Play App。五、開源模型與 API 平台：M3 有 1M 上下文並支援多模態，M2.7、M2.5、M2 已開源，API 含文字、影片、語音、音樂；入口是 Hugging Face 的 MiniMaxAI、GitHub 的 MiniMax-AI 與 platform.minimax.io。底部註記：海螺註冊送點數並有每日獎勵點數，Audio 網頁可免費試聽，Agent 有每日簽到點數，價格以官網為準、以美元計價。</desc>
