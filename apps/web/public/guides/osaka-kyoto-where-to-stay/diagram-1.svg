  <!-- Keihan south of Gion -->
  <path d="M 1485 400 L 1485 700" fill="none" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGrey)"/>
  <text x="1580" y="748" font-size="15" font-weight="700" fill="#2F6F9F" text-anchor="end">京阪 → 東福寺 180 日圓・伏見稲荷 240 日圓 · 淀屋橋 490</text>
  <!-- walk between Kawaramachi and Gion -->
  <path d="M 1340 360 L 1390 360" fill="none" stroke="#5C6B6B" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round"/>
  <text x="1365" y="312" font-size="15" fill="#5C6B6B" text-anchor="middle">步行過四条大橋</text>

  <!-- KIX -->
  <rect x="110" y="780" width="220" height="70" rx="20" fill="#0D6B68"/>
  <text x="220" y="810" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">関西空港</text>
  <text x="220" y="836" font-size="15" fill="#E6F2F1" text-anchor="middle">Kansai Airport · KIX</text>
  <text x="350" y="808" font-size="15" fill="#102A2B">HARUKA 直達：天王寺 約 30 分 · 新大阪 約 50 分 · 京都 約 75 分（2,200 日圓）</text>
  <text x="350" y="832" font-size="15" fill="#102A2B">関空快速：天王寺 約 45 分 · 大阪 約 65 分　　利木津巴士：大阪站前、難波、京都站</text>

  <!-- Area boxes -->
  <rect x="330" y="210" width="200" height="80" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
