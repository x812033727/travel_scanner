    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- Osaka Loop Line -->
  <path d="M 430 250 L 760 300 L 720 650 L 470 650 L 250 360 Z" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-linejoin="round"/>
  <text x="600" y="600" font-size="15" font-weight="700" fill="#6B4A3A">JR 大阪環状線 Osaka Loop Line</text>
  <!-- USJ branch -->
  <path d="M 250 360 L 170 400" fill="none" stroke="#6B4A3A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="250" cy="360" r="9" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
  <text x="262" y="352" font-size="15" fill="#102A2B" font-weight="700">西九条 Nishikujo</text>
  <circle cx="170" cy="400" r="12" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="60" y="432" font-size="16" font-weight="700" fill="#102A2B">環球城 Universal City</text>
  <text x="60" y="454" font-size="15" fill="#5C6B6B">大阪駅→約 11 分 · 天王寺→約 13 分</text>
  <text x="60" y="474" font-size="15" fill="#5C6B6B">JR 難波→約 15 分 · 大阪難波→約 13 分</text>

  <!-- JR Kyoto line: Osaka - Shin-Osaka - Kyoto -->
  <path d="M 430 250 L 560 150 L 1090 112 L 1150 560" fill="none" stroke="#6B4A3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="560" cy="150" r="11" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="6"/>
  <text x="545" y="146" font-size="15" font-weight="700" fill="#102A2B" text-anchor="end">新大阪 Shin-Osaka · HARUKA 約 50 分 · 新幹線</text>
  <text x="720" y="170" font-size="15" font-weight="700" fill="#6B4A3A">JR 京都線 新快速・HARUKA（大阪・新大阪 ↔ 京都）</text>

  <!-- Hankyu Umeda - Kawaramachi -->
