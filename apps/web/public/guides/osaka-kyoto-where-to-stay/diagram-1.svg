<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">大阪、京都六個住宿區域與鐵道連結示意圖 / Where to stay in Osaka and Kyoto</title>
  <desc id="desc">示意圖。大阪三區：梅田（JR 大阪站、阪急）、難波（南海、御堂筋線）、天王寺（JR 環狀線）；京都三區：京都站、河原町（阪急京都河原町）、祇園（京阪祇園四条）。關西機場：南海 Rapi:t 到難波約 34 到 39 分、空港急行約 43 分；JR HARUKA 到天王寺約 30 分、新大阪約 50 分、京都約 75 分（2,200 日圓）；關空快速到天王寺約 45 分、大阪約 65 分。大阪到京都：阪急特急大阪梅田到京都河原町 43 分；京阪特急淀屋橋到祇園四条約 40 分、490 日圓；JR 京都線新快速大阪站直達京都站。大阪環狀線接環球城，大阪站到環球城約 11 分、天王寺約 13 分。京都站搭 JR 奈良線到東福寺約 3 分、稻荷 5 分，京阪祇園四条到東福寺 180 日圓、伏見稻荷 240 日圓。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="58" font-size="34" font-weight="700" fill="#102A2B">大阪、京都六個住宿區域，和把它們連起來的鐵道</text>
  <text x="60" y="92" font-size="19" fill="#5C6B6B">Where to stay in Osaka and Kyoto · 示意圖，非精確比例 · 2026 年 9 月查證</text>
