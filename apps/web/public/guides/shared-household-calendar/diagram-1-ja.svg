<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>家族の共有カレンダーの使い方：誰が出かけ、誰が引き継ぎ、いつ予定が変わるかを分かりやすくする：判断の流れ</title><desc>共有範囲を決める、引き継ぎを明確にする、見えるか確認する、変更を同期する、の順に確認します。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">実践の順序</text><text x="100" y="175" fill="#576968" font-size="25">自分の条件に合わせて選び、一度にすべて終えなくてもよい</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">共有範囲を決める</text><text x="103" y="497" fill="#f4f0e5" font-size="23">共有する範囲を選ぶ</text><text x="103" y="573" fill="#f4dc9d" font-size="26">すべて共有しなくてよい</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">引き継ぎを明確に</text><text x="473" y="497" fill="#f4f0e5" font-size="23">引き継ぎ内容を書く</text><text x="473" y="573" fill="#f4dc9d" font-size="26">誰が、いつ、どこで</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">見えるか確認</text><text x="843" y="497" fill="#f4f0e5" font-size="23">アクセスを確認</text><text x="843" y="573" fill="#f4dc9d" font-size="26">まずテスト用の予定</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">変更を同期する</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">変更を反映する</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">元の予定も変更</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の図解</text></g></svg>
