<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>How to use a shared household calendar: make it clear who is going out, who takes over and when plans change: decision sequence</title><desc>Check in order: decide what to share, make handoffs clear, check visibility, then keep changes in sync. An editorial guide, not a map or measured timings.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Arial, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Adapt it to your needs; you do not have to finish everything at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Choose the scope</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Choose what to share</text><text x="103" y="573" fill="#f4dc9d" font-size="23.5">No need to share everything</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="30.5" font-weight="700">Make handoffs clear</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Describe the handoff</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Who, when and where</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Check visibility</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Verify access</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Use a test event first</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="28" font-weight="700">Keep changes in sync</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Update changes</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Edit the original event too</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · Editorial diagram</text></g></svg>
