<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>가족 공유 캘린더 사용법: 누가 외출하고 누가 맡는지, 시간이 어떻게 바뀌는지 명확하게 정리하기: 판단 순서</title><desc>공유 범위 정하기, 인수인계 명확히 쓰기, 보이는지 확인하기, 변경 내용 동기화하기 순서로 확인합니다. 편집부가 정리한 안내이며 지도나 실측 시간이 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">실천 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하며 한 번에 모두 끝낼 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">공유 범위 정하기</text><text x="103" y="497" fill="#f4f0e5" font-size="23">공유할 범위 선택</text><text x="103" y="573" fill="#f4dc9d" font-size="26">전부 공유할 필요 없음</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">인수인계 명확히</text><text x="473" y="497" fill="#f4f0e5" font-size="23">넘겨줄 내용 작성</text><text x="473" y="573" fill="#f4dc9d" font-size="26">누가 언제 어디서</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">보이는지 확인</text><text x="843" y="497" fill="#f4f0e5" font-size="23">접근 가능 여부 확인</text><text x="843" y="573" fill="#f4dc9d" font-size="26">테스트 일정부터</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">변경 내용 동기화</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">변경 내용 갱신</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">원래 일정도 수정</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 제작 도해</text></g></svg>
