  <text x="1080" y="728" font-size="15" fill="#102A2B">Naver 地圖查營業時間、休息時段與最後點餐</text>
  <text x="1080" y="752" font-size="15" fill="#102A2B">店門口的候位機多要韓國手機號碼</text>

