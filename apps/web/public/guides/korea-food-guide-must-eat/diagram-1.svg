  <path d="M 1330 278 L 1330 298" stroke="#5C6B6B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="620" y="300" width="460" height="118" rx="12" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="640" y="328" font-size="18" font-weight="700" fill="#8A2E1D">烤肉店 고깃집 Korean BBQ</text>
  <text x="640" y="354" font-size="15" fill="#102A2B">五花、護心肉、牛排骨：多數店兩人份起點</text>
  <text x="640" y="376" font-size="15" fill="#102A2B">店員代烤、生菜包著吃，最後加冷麵或大醬湯</text>
  <text x="640" y="398" font-size="15" fill="#102A2B">外套放收納椅，免得帶著烤肉味逛街</text>

  <rect x="1100" y="300" width="460" height="118" rx="12" fill="#FBEFE3" stroke="#D97A2B" stroke-width="3"/>
  <text x="1120" y="328" font-size="18" font-weight="700" fill="#9A4F12">炸雞店 치킨집 Chimaek</text>
  <text x="1120" y="354" font-size="15" fill="#102A2B">原味 후라이드、調味 양념、半半 반반</text>
  <text x="1120" y="376" font-size="15" fill="#102A2B">一隻通常 2 到 3 人分，配生啤與醃蘿蔔</text>
  <text x="1120" y="398" font-size="15" fill="#102A2B">外送 app 多要韓國門號，店內吃最省事</text>

  <path d="M 850 418 L 850 438" stroke="#5C6B6B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1330 418 L 1330 438" stroke="#5C6B6B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="620" y="440" width="460" height="118" rx="12" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="640" y="468" font-size="18" font-weight="700" fill="#4E3428">鍋物 찌개・전골 Stew</text>
  <text x="640" y="494" font-size="15" fill="#102A2B">部隊鍋、海鮮鍋、排骨鍋：多為兩人份起</text>
  <text x="640" y="516" font-size="15" fill="#102A2B">拉麵、年糕自己加點，湯少了可以加湯</text>
  <text x="640" y="538" font-size="15" fill="#102A2B">參雞湯是一人一鍋的例外</text>

  <rect x="1100" y="440" width="460" height="118" rx="12" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1120" y="468" font-size="18" font-weight="700" fill="#1F4E73">市場 시장 Market</text>
  <text x="1120" y="494" font-size="15" fill="#102A2B">廣藏市場美食街開到 23:00，攤位併桌吃</text>
  <text x="1120" y="516" font-size="15" fill="#102A2B">札嘎其 05:00 到 22:00，一樓挑魚、樓上代煮</text>
  <text x="1120" y="538" font-size="15" fill="#102A2B">帶點現金，代煮費坐下前先問</text>

  <!-- Time and situation -->
  <line x1="60" y1="600" x2="1540" y2="600" stroke="#5C6B6B" stroke-width="1.5"/>
