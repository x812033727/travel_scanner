<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">韓國吃飯選店決策圖：幾個人、什麼時段、想吃什麼 / Which kind of restaurant in Korea</title>
  <desc id="desc">決策圖分三層。第一層問幾個人：一個人走左邊，對到湯飯店（豬肉湯飯、解酒湯、雪濃湯，不少店 24 小時，一人一鍋，蝦醬、辣醬、韭菜自己加）、粉食店（辣炒年糕、紫菜飯捲、拉麵、炸物，一人份就能點，辣度可調輕）、便利商店與美食街（三角飯糰、便當、泡麵配熱水機，百貨美食街一人一份）。兩人以上走右邊，再問想吃什麼：烤肉店（五花、護心肉、牛排骨，多數店兩人份起點，店員代烤、生菜包著吃，最後加冷麵或大醬湯，外套放收納椅）、炸雞店（原味、調味、半半，一隻通常 2 到 3 人分，配生啤與醃蘿蔔，外送 app 多要韓國門號）、鍋物（部隊鍋、海鮮鍋、排骨鍋多為兩人份起，拉麵、年糕自己加點，參雞湯是一人一鍋的例外）、市場（廣藏市場美食街開到 23:00 攤位併桌，札嘎其 05:00 到 22:00 一樓挑魚樓上代煮，帶點現金並先問代煮費）。第三層看時段與狀況：宵夜對到炸雞、豬腳、菜包肉、帳篷攤、24 小時湯飯與便利商店；不吃辣對到參雞湯、雪濃湯、水冷麵、烤肉、韓定食，湯飯辣醬另附，點餐說덜 맵게少辣、안 맵게不辣；想訂位排隊對到 Catchtable Global 不用韓國門號且遠端候位免訂金、Naver 地圖查營業時間與休息時段、店門口候位機多要韓國手機號碼。規矩與營業時間為 2026 年 9 月查證，價格以店家為準。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">韓國吃飯選店決策圖：幾個人、什麼時段、想吃什麼</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Which kind of restaurant in Korea: party size, time of day, what you crave · 2026 年 9 月查證</text>

  <!-- Q1 -->
  <rect x="640" y="104" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/>
  <text x="800" y="140" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">幾個人？ 몇 명이에요?</text>
  <path d="M 800 158 L 800 182" stroke="#5C6B6B" stroke-width="3" fill="none"/>
  <path d="M 250 182 L 1100 182" stroke="#5C6B6B" stroke-width="3" fill="none"/>
  <path d="M 250 182 L 250 201" stroke="#5C6B6B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1100 182 L 1100 201" stroke="#5C6B6B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Solo branch -->
  <rect x="100" y="205" width="300" height="50" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="3"/>
  <text x="250" y="238" font-size="19" font-weight="700" fill="#0B4F4D" text-anchor="middle">一個人 혼자 · Solo</text>
