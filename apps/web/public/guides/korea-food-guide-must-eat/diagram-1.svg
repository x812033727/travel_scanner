  <text x="80" y="704" font-size="15" fill="#102A2B">炸雞、豬腳、菜包肉：店內吃或外帶</text>
  <text x="80" y="728" font-size="15" fill="#102A2B">路邊帳篷攤 포장마차、24 小時湯飯與解酒湯</text>
  <text x="80" y="752" font-size="15" fill="#102A2B">便利商店的泡麵與熱水機隨時都在</text>

  <rect x="560" y="648" width="480" height="150" rx="14" fill="#E4F1EA" stroke="#2E7D5B" stroke-width="3"/>
  <text x="580" y="678" font-size="18" font-weight="700" fill="#1F5A40">不吃辣 안 매운 것 Not spicy</text>
  <text x="580" y="704" font-size="15" fill="#102A2B">參雞湯、雪濃湯、水冷麵、烤肉、韓定食</text>
