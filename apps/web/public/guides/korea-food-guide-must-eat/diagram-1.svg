  <rect x="140" y="280" width="420" height="88" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="160" y="308" font-size="18" font-weight="700" fill="#0B4F4D">湯飯店 국밥집 Gukbap</text>
  <text x="160" y="334" font-size="15" fill="#102A2B">豬肉湯飯、解酒湯、雪濃湯；不少店 24 小時</text>
  <text x="160" y="356" font-size="15" fill="#102A2B">一人一鍋，蝦醬、辣醬、韭菜自己加</text>

  <rect x="140" y="385" width="420" height="88" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="160" y="413" font-size="18" font-weight="700" fill="#0B4F4D">粉食店 분식집 Bunsik</text>
  <text x="160" y="439" font-size="15" fill="#102A2B">辣炒年糕、紫菜飯捲、拉麵、炸物</text>
  <text x="160" y="461" font-size="15" fill="#102A2B">一人份就能點，辣度可請店家調輕</text>

  <rect x="140" y="490" width="420" height="88" rx="12" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="160" y="518" font-size="18" font-weight="700" fill="#0B4F4D">便利商店・美食街 편의점</text>
  <text x="160" y="544" font-size="15" fill="#102A2B">三角飯糰、便當、泡麵配熱水機，多有座位</text>
  <text x="160" y="566" font-size="15" fill="#102A2B">百貨與購物中心美食街一人一份是常態</text>

  <!-- Group branch -->
  <rect x="840" y="205" width="520" height="50" rx="10" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="1100" y="238" font-size="19" font-weight="700" fill="#8A2E1D" text-anchor="middle">兩人以上 2명 이상 → 想吃什麼？ 뭐 먹을래요?</text>
  <path d="M 1100 255 L 1100 278" stroke="#5C6B6B" stroke-width="3" fill="none"/>
  <path d="M 850 278 L 1330 278" stroke="#5C6B6B" stroke-width="3" fill="none"/>
