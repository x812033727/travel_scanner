<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">儲值餘額怎麼被保障 / What protects a stored-value balance</title>
<desc id="desc">由上往下的金流圖。最上排：使用者加值的錢，也就是儲值款項與代理收付款項，經一道箭頭進入專營電子支付機構在金融機構開立的相同幣別專用存款帳戶，依條例第十七條辦理。中排分成兩條路：左邊依條例第二十條，儲值款項合計達一定金額者應繳存足額準備金；右邊依條例第二十一條，扣除準備金後的餘額併同代理收付款項，應全部交付信託或取得銀行十足之履約保證，並委託會計師每季查核。下排是錢出事時的另外三道機制：條例第二十二條讓使用者的債權優先於機構的其他債權人受償、條例第四十一條的清償基金在機構失卻清償能力而違約時代為清償、條例第四十條在機構不能繼續經營時由其他電子支付機構承受業務。最底下一條提醒：儲值餘額不是存款，不受存款保險保障；存款保險條例第十二條的標的是支票存款、活期存款、定期存款等，儲值餘額不在其中；例外是銀行與中華郵政兼營所收的儲值款項，依條例第四十三條是存款保險標的。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">儲值餘額怎麼被保障</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">What protects a stored-value balance · 錢先進專用存款帳戶，再分成兩條路</text>

<rect x="60" y="140" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
<text x="210" y="182" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">使用者加值的錢</text>
<text x="210" y="212" font-size="16" fill="#5C6B6B" text-anchor="middle">儲值款項與代理收付款項</text>

<path d="M 366 195 H 452" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="butt"/>
<path d="M 476 195 L 444 177 L 444 213 Z" fill="#0D6B68"/>

<rect x="480" y="125" width="640" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="172" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">專用存款帳戶</text>
<text x="800" y="205" font-size="17" fill="#5C6B6B" text-anchor="middle">條例第十七條：收取的支付款項存入金融機構</text>
<text x="800" y="232" font-size="17" fill="#5C6B6B" text-anchor="middle">開立的相同幣別專用存款帳戶</text>

<path d="M 800 269 V 300 H 510 V 302" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="butt"/>
<path d="M 510 326 L 492 294 L 528 294 Z" fill="#0D6B68"/>
<path d="M 800 269 V 300 H 1160 V 302" fill="none" stroke="#0D6B68" stroke-width="8" stroke-linecap="butt"/>
<path d="M 1160 326 L 1142 294 L 1178 294 Z" fill="#0D6B68"/>

<rect x="300" y="330" width="420" height="170" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="510" y="388" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">繳存準備金</text>
<text x="510" y="424" font-size="17" fill="#5C6B6B" text-anchor="middle">條例第二十條：儲值款項合計達</text>
<text x="510" y="451" font-size="17" fill="#5C6B6B" text-anchor="middle">一定金額者，應繳存足額準備金</text>

<rect x="880" y="330" width="560" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1160" y="375" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">交付信託或銀行十足履約保證</text>
<text x="1160" y="410" font-size="17" fill="#5C6B6B" text-anchor="middle">條例第二十一條：扣除準備金後的餘額，併同</text>
<text x="1160" y="437" font-size="17" fill="#5C6B6B" text-anchor="middle">代理收付款項，全部交付信託或取得履約保證</text>
<text x="1160" y="464" font-size="17" fill="#5C6B6B" text-anchor="middle">並委託會計師每季查核</text>

<text x="800" y="548" font-size="18" fill="#5C6B6B" text-anchor="middle">錢出事時，條例另外給了三道機制</text>

<rect x="60" y="565" width="460" height="125" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="290" y="604" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">使用者債權優先受償</text>
<text x="290" y="636" font-size="16" fill="#5C6B6B" text-anchor="middle">條例第二十二條：優先於機構</text>
<text x="290" y="661" font-size="16" fill="#5C6B6B" text-anchor="middle">的其他債權人受償</text>

<rect x="570" y="565" width="460" height="125" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="604" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">清償基金</text>
<text x="800" y="636" font-size="16" fill="#5C6B6B" text-anchor="middle">條例第四十一條：機構失卻清償</text>
<text x="800" y="661" font-size="16" fill="#5C6B6B" text-anchor="middle">能力而違約時代為清償</text>

<rect x="1080" y="565" width="460" height="125" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1310" y="604" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">業務移轉或指定承受</text>
<text x="1310" y="636" font-size="16" fill="#5C6B6B" text-anchor="middle">條例第四十條：不能繼續經營</text>
<text x="1310" y="661" font-size="16" fill="#5C6B6B" text-anchor="middle">時，由其他機構承受業務</text>

<rect x="60" y="715" width="1480" height="125" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="755" font-size="20" font-weight="700" fill="#B8442D" text-anchor="middle">儲值餘額不是存款，不受存款保險保障</text>
<text x="800" y="787" font-size="17" fill="#102A2B" text-anchor="middle">存款保險條例第十二條的標的是支票存款、活期存款、定期存款等，儲值餘額不在其中</text>
<text x="800" y="815" font-size="17" fill="#2F6F9F" text-anchor="middle">例外：銀行與中華郵政兼營所收的儲值款項，依條例第四十三條是存款保險標的</text>

<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
