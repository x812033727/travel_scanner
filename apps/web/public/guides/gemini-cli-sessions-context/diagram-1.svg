<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">對話與磁碟分別管理</title><desc id="desc">恢復對話：選擇正確工作紀錄；整理上下文：壓縮或清除聊天；檢查磁碟：檔案不會因此回復</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">對話與磁碟分別管理</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#415C8A" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#415C8A" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">恢復對話</text><text x="245" y="333" font-size="76" fill="#415C8A">選擇正確工作紀錄</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#415C8A" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#415C8A" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">整理上下文</text><text x="245" y="558" font-size="76" fill="#415C8A">壓縮或清除聊天</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#415C8A" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#415C8A" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">檢查磁碟</text><text x="245" y="783" font-size="76" fill="#415C8A">檔案不會因此回復</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>