<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>延南洞咖啡店地址對照</title><desc id="desc">地址分組對照，沒有道路連線或方位：成美山路149-8是Overdeep，161-4是Layered；成美山路29安街8是Parole &amp; Langue；延禧路25-1是Antique Coffee。各店網美標籤依官方具體空間描述。</desc><rect width="1600" height="900" fill="#fff8ed"/><g font-family="Noto Sans TC,Noto Sans KR,Microsoft JhengHei,sans-serif"><text x="85" y="106" font-size="50" fill="#343e36" font-weight="700">先讀完整道路名，再選咖啡店</text><text x="85" y="165" font-size="27" fill="#6a7467">地址分組對照 · 不表示方向、距離或步行先後</text><rect x="85" y="220" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="115" y="280" font-size="32" font-weight="700" fill="#25676a">성미산로</text><text x="115" y="338" font-size="28" fill="#343e36">Overdeep 연남 · 149-8</text><text x="115" y="389" font-size="27" fill="#65745f">Layered 연남점 · 161-4</text><rect x="815" y="220" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="845" y="280" font-size="32" font-weight="700" fill="#25676a">성미산로29안길</text><text x="845" y="338" font-size="28" fill="#343e36">Parole &amp; Langue · 8</text><text x="845" y="389" font-size="27" fill="#65745f">網美：住宅改建</text><rect x="85" y="475" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="115" y="535" font-size="32" font-weight="700" fill="#25676a">現場確認</text><text x="115" y="593" font-size="28" fill="#343e36">先選主要店，再留一間備選</text><text x="115" y="644" font-size="27" fill="#65745f">依當天營業與候位情況調整</text><rect x="815" y="475" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="845" y="535" font-size="32" font-weight="700" fill="#25676a">연희로</text><text x="845" y="593" font-size="28" fill="#343e36">Antique Coffee 연남점 · 25-1</text><text x="845" y="644" font-size="27" fill="#65745f">網美：花藝與古典室內</text><text x="85" y="794" font-size="27" fill="#343e36">Overdeep與Layered：網美標籤依官方描述的具體空間。</text><text x="85" y="848" font-size="23" fill="#65745f">資料：Visit Seoul各店專頁。各店細節與來源連結見正文。</text></g></svg>