<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>延南洞咖啡店地址對照</title><desc id="desc">圖上的標題是「先讀完整道路名，再選咖啡店」，副標是「地址分組對照 · 不表示方向、距離或步行先後」。圖分成四個並排的白色方框，方框之間沒有連接線或箭頭。左上方框的標題是路名성미산로（Seongmisan-ro），底下兩行是這條路上的兩家店與門牌號：오버딥 연남 149-8、카페 레이어드 연남점 161-4。右上方框的標題是另一條路성미산로29안길（Seongmisan-ro 29an-gil），底下是파롤앤랑그 8，再下一行寫「網美：住宅改建」。左下方框的標題是「現場確認」，兩行寫「先選主要店，再留一間備選」與「依當天營業與候位情況調整」。右下方框的標題是연희로（Yeonhui-ro），底下是앤티크커피 25-1，再下一行寫「網美：花藝與古典室內」。圖的下方兩行小字，一行寫「店名與路名照韓文寫，方便對照招牌與地圖」，一行寫「資料：Visit Seoul」。</desc><rect width="1600" height="900" fill="#fff8ed"/><g font-family="Noto Sans TC,Noto Sans KR,Microsoft JhengHei,sans-serif"><text x="85" y="106" font-size="50" fill="#343e36" font-weight="700">先讀完整道路名，再選咖啡店</text><text x="85" y="165" font-size="27" fill="#6a7467">地址分組對照 · 不表示方向、距離或步行先後</text><rect x="85" y="220" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="115" y="280" font-size="32" font-weight="700" fill="#25676a">성미산로（Seongmisan-ro）</text><text x="115" y="338" font-size="28" fill="#343e36">오버딥 연남 · 149-8</text><text x="115" y="389" font-size="27" fill="#65745f">카페 레이어드 연남점 · 161-4</text><rect x="815" y="220" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="845" y="280" font-size="28" font-weight="700" fill="#25676a">성미산로29안길（Seongmisan-ro 29an-gil）</text><text x="845" y="338" font-size="28" fill="#343e36">파롤앤랑그 · 8</text><text x="845" y="389" font-size="27" fill="#65745f">網美：住宅改建</text><rect x="85" y="475" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="115" y="535" font-size="32" font-weight="700" fill="#25676a">現場確認</text><text x="115" y="593" font-size="28" fill="#343e36">先選主要店，再留一間備選</text><text x="115" y="644" font-size="27" fill="#65745f">依當天營業與候位情況調整</text><rect x="815" y="475" width="690" height="220" rx="22" fill="white" stroke="#d0d8cc"/><text x="845" y="535" font-size="32" font-weight="700" fill="#25676a">연희로（Yeonhui-ro）</text><text x="845" y="593" font-size="28" fill="#343e36">앤티크커피 · 25-1</text><text x="845" y="644" font-size="27" fill="#65745f">網美：花藝與古典室內</text><text x="85" y="794" font-size="27" fill="#343e36">店名與路名照韓文寫，方便對照招牌與地圖。</text><text x="85" y="848" font-size="23" fill="#65745f">資料：Visit Seoul</text></g></svg>
