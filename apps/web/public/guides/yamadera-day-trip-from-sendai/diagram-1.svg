<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">仙台到山寺的交通示意 / Sendai to Yamadera by the JR Senzan Line</title>
  <desc id="desc">一條實線從仙台站經 JR 仙山線接到山寺駅，線上標約 50 分到 1 小時；山寺駅右側一段虛線代表步行，到登山口標徒步約 10 分。左下另有一條線從山形駅接到山寺駅，標仙山線 20 分。右上方框列出仙台まるごとパス 涵蓋的三段：JR 仙台到山寺、JR 仙台到松島海岸、仙台空港鉄道全線，票價 2,930 日圓、連續 2 日；框下小字提醒單程票價與班次以 JR 東日本官網為準。全圖為示意圖，距離非比例。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker><marker id="arroworange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker><marker id="arrowgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">仙台到山寺：一條仙山線</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B" text-anchor="start">Sendai to Yamadera on the JR Senzan Line</text>
  <line x1="330" y1="430" x2="792" y2="430" stroke="#0D6B68" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="560" y="372" font-size="18" fill="#5C6B6B" text-anchor="middle">JR 仙山線（Senzan Line）</text>
  <text x="560" y="404" font-size="21" fill="#102A2B" text-anchor="middle" font-weight="bold">約 50 分到 1 小時</text>
  <rect x="100" y="390" width="230" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="215" y="424" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="bold">仙台站</text>
  <text x="215" y="450" font-size="16" fill="#5C6B6B" text-anchor="middle">Sendai Sta.</text>
  <rect x="800" y="390" width="230" height="80" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="915" y="424" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="bold">山寺駅</text>
  <text x="915" y="450" font-size="16" fill="#5C6B6B" text-anchor="middle">Yamadera Sta.</text>
  <line x1="1034" y1="430" x2="1196" y2="430" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arroworange)"/>
  <text x="1115" y="404" font-size="18" fill="#102A2B" text-anchor="middle" font-weight="bold">徒步約 10 分</text>
  <rect x="1200" y="390" width="190" height="80" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1295" y="437" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="bold">登山口</text>
  <path d="M 330 690 H 915 V 476" fill="none" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowgrey)"/>
  <text x="600" y="666" font-size="18" fill="#5C6B6B" text-anchor="middle">仙山線 20 分</text>
  <rect x="100" y="650" width="230" height="80" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="215" y="684" font-size="22" fill="#102A2B" text-anchor="middle" font-weight="bold">山形駅</text>
  <text x="215" y="710" font-size="16" fill="#5C6B6B" text-anchor="middle">Yamagata Sta.</text>
  <text x="1010" y="96" font-size="19" fill="#2F6F9F" text-anchor="start" font-weight="bold">仙台まるごとパス 2,930 日圓／連續 2 日</text>
  <rect x="1010" y="116" width="530" height="168" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <circle cx="1048" cy="158" r="6" fill="#2F6F9F"/>
  <text x="1070" y="164" font-size="18" fill="#102A2B" text-anchor="start">JR 仙台—山寺</text>
  <circle cx="1048" cy="202" r="6" fill="#2F6F9F"/>
  <text x="1070" y="208" font-size="18" fill="#102A2B" text-anchor="start">JR 仙台—松島海岸</text>
  <circle cx="1048" cy="246" r="6" fill="#2F6F9F"/>
  <text x="1070" y="252" font-size="18" fill="#102A2B" text-anchor="start">仙台空港鉄道全線</text>
  <text x="1010" y="318" font-size="16" fill="#5C6B6B" text-anchor="start">單程票價與班次以 JR 東日本官網為準</text>
  <text x="100" y="800" font-size="17" fill="#5C6B6B" text-anchor="start">圖例：實線＝鐵道、虛線＝步行</text>
  <text x="100" y="830" font-size="15" fill="#5C6B6B" text-anchor="start">示意圖，距離非比例</text>
  <text x="1540" y="870" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
