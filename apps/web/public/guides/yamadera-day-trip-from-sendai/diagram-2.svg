  <circle cx="300" cy="680" r="9" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="300" y="722" font-size="20" fill="#102A2B" text-anchor="middle" font-weight="bold">根本中堂</text>
