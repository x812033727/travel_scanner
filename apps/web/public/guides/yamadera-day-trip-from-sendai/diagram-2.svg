  <text x="756.0" y="425.0" font-size="19" fill="#102A2B" text-anchor="middle" font-weight="bold">約 5 分</text>
  <path d="M 860 430 v -21.7 h 40.0 v -21.7 h 40.0 v -21.7 h 40.0 v -21.7 h 40.0 v -21.7 h 40.0 v -21.7 h 40.0" fill="none" stroke="#0D6B68" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="956.0" y="325.0" font-size="19" fill="#102A2B" text-anchor="middle" font-weight="bold">約 15 分</text>
  <path d="M 1100 300 v 15.0 h 35.0 v 15.0 h 35.0 v 15.0 h 35.0 v 15.0 h 35.0 v 15.0 h 35.0 v 15.0 h 35.0" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1229.0" y="305.0" font-size="19" fill="#102A2B" text-anchor="middle" font-weight="bold">約 10 分</text>
  <path d="M 1310 390 v 8.3 h 26.7 v 8.3 h 26.7 v 8.3 h 26.7 v 8.3 h 26.7 v 8.3 h 26.7 v 8.3 h 26.7" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1414.0" y="375.0" font-size="19" fill="#102A2B" text-anchor="middle" font-weight="bold">約 1 分</text>
  <circle cx="130" cy="730" r="9" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
