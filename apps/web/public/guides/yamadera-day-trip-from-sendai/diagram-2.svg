<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">山寺參拜路線的步行剖面 / Walking profile from the trailhead to Oku-no-in</title>
  <desc id="desc">一條由左下往右上的階梯狀剖面線，依序經過登山口、根本中堂、山門、せみ塚、仁王門、奧之院・大佛殿，之後折返向下經開山堂・納經堂到五大堂。各段的官方所需時間依序是約 3 分、約 5 分、約 15 分、約 5 分、約 15 分、約 10 分、約 1 分。線上方標示石階共 1,015 段，山門到奧之院之間標示 800 段以上，出自山形縣官方觀光站。奧之院是折返點，開山堂與納經堂是回程順路，五大堂是展望點。本圖為示意圖，坡度與距離非比例。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="52" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">登山口到奧之院，再折回五大堂</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B" text-anchor="start">Walking profile: the official minutes between the halls</text>
