  <circle cx="1310" cy="390" r="9" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1310" y="452" font-size="20" fill="#102A2B" text-anchor="middle" font-weight="bold">開山堂・納經堂</text>
  <text x="1310" y="480" font-size="17" fill="#5C6B6B" text-anchor="middle">回程順路</text>
  <circle cx="1470" cy="440" r="9" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1470" y="502" font-size="20" fill="#102A2B" text-anchor="middle" font-weight="bold">五大堂</text>
  <text x="1470" y="530" font-size="17" fill="#5C6B6B" text-anchor="middle">展望</text>
  <rect x="560" y="150" width="480" height="64" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="193" font-size="26" fill="#102A2B" text-anchor="middle" font-weight="bold">石階共 1,015 段</text>
  <text x="720" y="330" font-size="20" fill="#0D6B68" text-anchor="middle" font-weight="bold">山門到奧之院 800 段以上</text>
  <text x="720" y="358" font-size="16" fill="#5C6B6B" text-anchor="middle">（山形縣官方觀光站的說法）</text>
  <text x="60" y="858" font-size="15" fill="#5C6B6B" text-anchor="start">示意圖，坡度與距離非比例</text>
