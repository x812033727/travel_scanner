<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本八城市櫻花花期：氣象庁平年值與 2021–2026 年實績 / Cherry blossom dates in eight Japanese cities</title>
  <desc id="desc">這張圖是日本氣象庁的平年值（1991–2020 年平均）與 2021–2026 年實際觀測，不是 2027 年預測。橫軸是 3 月中旬到 5 月上旬，由上到下是福岡、廣島、東京、名古屋、京都、大阪、仙台、札幌。每個城市的深綠色條是平年開花到平年滿開：福岡 3/22 到 3/31、廣島 3/25 到 4/3、東京 3/24 到 3/31、名古屋 3/24 到 4/2、京都 3/26 到 4/4、大阪 3/27 到 4/4、仙台 4/8 到 4/13、札幌 5/1 到 5/6。色條下方的淺綠細線是 2021–2026 年滿開最早到最晚：福岡 3/22–4/3、廣島 3/25–4/5、東京 3/22–4/4、名古屋 3/27–4/7、京都 3/24–4/5、大阪 3/27–4/6、仙台 3/31–4/11、札幌 4/21–4/27。珊瑚色點是 2026 年開花、深棕色點是 2026 年滿開：福岡 3/24、4/3，廣島 3/19、3/30，東京 3/19、3/28，名古屋 3/17、3/30，京都 3/23、3/30，大阪 3/26、4/3，仙台 3/31、4/4，札幌 4/18、4/24。背景色帶是連假：日本三連休 3 月 20–22 日、台灣清明連假 4 月 3–6 日、台灣勞動節 4 月 30 日–5 月 2 日、日本 5 月 1–5 日連休。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">日本八城市櫻花花期：氣象庁平年值與 2021–2026 年實績</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">JMA normals (1991–2020 average) and 2021–2026 records, not a 2027 forecast</text>

