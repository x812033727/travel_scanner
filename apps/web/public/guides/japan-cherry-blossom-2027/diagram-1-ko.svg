<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">일본 여덟 도시 벚꽃 시기: 기상청 평년값과 2021–2026년 관측 기록 / 일본 여덟 도시의 벚꽃 날짜</title>
  <desc id="desc">이 도표는 일본 기상청의 평년값(1991–2020년 평균)과 2021–2026년 실제 관측 기록이며, 2027년 예보가 아닙니다. 가로축은 3월 중순부터 5월 초까지이며, 위에서부터 후쿠오카·히로시마·도쿄·나고야·교토·오사카·센다이·삿포로 순입니다. 도시별 짙은 녹색 막대는 평년 개화일부터 평년 만개일까지를 나타냅니다. 후쿠오카 3/22부터 3/31, 히로시마 3/25부터 4/3, 도쿄 3/24부터 3/31, 나고야 3/24부터 4/2, 교토 3/26부터 4/4, 오사카 3/27부터 4/4, 센다이 4/8부터 4/13, 삿포로 5/1부터 5/6입니다. 막대 아래 연녹색 가는 선은 2021–2026년 가장 이른 만개일부터 가장 늦은 만개일까지입니다. 후쿠오카 3/22–4/3, 히로시마 3/25–4/5, 도쿄 3/22–4/4, 나고야 3/27–4/7, 교토 3/24–4/5, 오사카 3/27–4/6, 센다이 3/31–4/11, 삿포로 4/21–4/27입니다. 산호색 점은 2026년 개화일, 짙은 갈색 점은 2026년 만개일입니다. 후쿠오카 3/24·4/3, 히로시마 3/19·3/30, 도쿄 3/19·3/28, 나고야 3/17·3/30, 교토 3/23·3/30, 오사카 3/26·4/3, 센다이 3/31·4/4, 삿포로 4/18·4/24입니다. 배경 색 띠는 연휴를 나타냅니다. 일본 사흘 연휴 3월 20–22일, 대만 청명절 연휴 4월 3–6일, 대만 노동절 4월 30일–5월 2일, 일본 연휴 5월 1–5일입니다.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">일본 여덟 도시 벚꽃 시기: 기상청 평년값과 2021–2026년 기록</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">JMA 평년값(1991–2020년 평균)과 2021–2026년 기록, 2027년 예보 아님</text>


