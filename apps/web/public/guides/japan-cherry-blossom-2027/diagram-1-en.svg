<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Cherry blossom dates in eight Japanese cities: JMA normals and 2021–2026 records / Cherry blossom dates in eight Japanese cities</title>
  <desc id="desc">JMA normals (1991–2020 averages) and 2021–2026 observations, not a 2027 forecast. Horizontal axis: mid-March (3) to early May (5). Top to bottom: Fukuoka, Hiroshima, Tokyo, Nagoya, Kyoto, Osaka, Sendai, Sapporo. Dark green bars show normal flowering to normal full bloom: Fukuoka 3/22 to 3/31; Hiroshima 3/25 to 4/3; Tokyo 3/24 to 3/31; Nagoya 3/24 to 4/2; Kyoto 3/26 to 4/4; Osaka 3/27 to 4/4; Sendai 4/8 to 4/13; Sapporo 5/1 to 5/6. Thin light green lines below show earliest–latest full bloom in 2021–2026: Fukuoka 3/22–4/3; Hiroshima 3/25–4/5; Tokyo 3/22–4/4; Nagoya 3/27–4/7; Kyoto 3/24–4/5; Osaka 3/27–4/6; Sendai 3/31–4/11; Sapporo 4/21–4/27. Coral dots show 2026 flowering; dark brown dots show 2026 full bloom: Fukuoka 3/24, 4/3; Hiroshima 3/19, 3/30; Tokyo 3/19, 3/28; Nagoya 3/17, 3/30; Kyoto 3/23, 3/30; Osaka 3/26, 4/3; Sendai 3/31, 4/4; Sapporo 4/18, 4/24. Background bands mark holidays: Japan's three-day break, March (3) 20–22; Taiwan's Qingming break, April (4) 3–6; Taiwan's Labor Day break, April (4) 30–May (5) 2; Japan's break, May (5) 1–5.</desc>
