<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">孩子用 AI：依年齡層的設定流程 / Age-based setup flow for children using AI</title>
  <desc id="desc">一張分成三欄的流程圖。左欄是未滿 13 歲：Gemini 由家長在 Family Link 開啟或關閉 Gemini Apps；ChatGPT、Meta AI 與 Claude 的官網條款寫這個年齡不能註冊；先用教育用途的 AI 工具，在家由家長陪著一起用。中欄是 13 歲到未滿 18 歲：ChatGPT 連結家長帳號，設安靜時段與敏感內容；Gemini 用一般帳號登入，未成年另有內容過濾；Claude 要 18 歲才能用，Character.AI 已無開放式對話。右欄是 18 歲以上：ChatGPT 判定滿 18 歲之後青少年防護預設關閉，家長控制一併解除、帳號設定由本人掌控，先前談好的約定不因成年而失效。最下面一條橫幅寫著不分年齡都要做的事：幻覺會編造、不輸入姓名照片住址校名、不當內容截圖不轉傳，以及 iWIN 網路內容防護機構 02-2577-5118 與衛福部 1925 安心專線 24 小時免付費。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">孩子用 AI：依年齡層的設定流程</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Age-based setup flow for children using AI</text>

  <!-- column 1: under 13 -->
  <rect x="60" y="118" width="460" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="159" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">未滿 13 歲</text>

  <rect x="60" y="202" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="250" font-size="19" fill="#102A2B" text-anchor="middle">Gemini：家長在 Family Link</text>
  <text x="290" y="284" font-size="19" fill="#102A2B" text-anchor="middle">開啟或關閉 Gemini Apps</text>
  <line x1="290" y1="322" x2="290" y2="346" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="350" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="398" font-size="19" fill="#102A2B" text-anchor="middle">ChatGPT、Meta AI、Claude</text>
  <text x="290" y="432" font-size="19" fill="#102A2B" text-anchor="middle">官網條款寫這個年齡不能註冊</text>
  <line x1="290" y1="470" x2="290" y2="494" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="498" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="290" y="546" font-size="19" fill="#102A2B" text-anchor="middle">先用教育用途的 AI 工具</text>
  <text x="290" y="580" font-size="19" fill="#102A2B" text-anchor="middle">在家由家長陪著一起用</text>

  <!-- column 2: 13 to under 18 -->
  <rect x="560" y="118" width="460" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="159" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">13 歲到未滿 18 歲</text>

  <rect x="560" y="202" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="250" font-size="19" fill="#102A2B" text-anchor="middle">ChatGPT：連結家長帳號</text>
  <text x="790" y="284" font-size="19" fill="#102A2B" text-anchor="middle">設安靜時段與敏感內容</text>
  <line x1="790" y1="322" x2="790" y2="346" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="560" y="350" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="398" font-size="19" fill="#102A2B" text-anchor="middle">Gemini：一般帳號可登入</text>
  <text x="790" y="432" font-size="19" fill="#102A2B" text-anchor="middle">未成年另有內容過濾</text>
  <line x1="790" y1="470" x2="790" y2="494" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="560" y="498" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="790" y="546" font-size="19" fill="#102A2B" text-anchor="middle">Claude 要 18 歲才能用</text>
  <text x="790" y="580" font-size="19" fill="#102A2B" text-anchor="middle">Character.AI 無開放式對話</text>

  <!-- column 3: 18 and over -->
  <rect x="1060" y="118" width="460" height="64" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1290" y="159" font-size="24" font-weight="bold" fill="#102A2B" text-anchor="middle">18 歲以上</text>

  <rect x="1060" y="202" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1290" y="250" font-size="19" fill="#102A2B" text-anchor="middle">ChatGPT 判定滿 18 歲之後</text>
  <text x="1290" y="284" font-size="19" fill="#102A2B" text-anchor="middle">青少年防護預設關閉</text>
  <line x1="1290" y1="322" x2="1290" y2="346" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1060" y="350" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1290" y="398" font-size="19" fill="#102A2B" text-anchor="middle">家長控制一併解除</text>
  <text x="1290" y="432" font-size="19" fill="#102A2B" text-anchor="middle">帳號設定由本人掌控</text>
  <line x1="1290" y1="470" x2="1290" y2="494" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1060" y="498" width="460" height="118" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1290" y="546" font-size="19" fill="#102A2B" text-anchor="middle">約定不因成年而失效</text>
  <text x="1290" y="580" font-size="19" fill="#102A2B" text-anchor="middle">幻覺、隱私、不當內容照談</text>

  <!-- shared bottom band -->
  <rect x="60" y="660" width="1460" height="150" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="790" y="706" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">不分年齡都要做：三件事先講清楚，出事有官方管道</text>
  <text x="790" y="744" font-size="19" fill="#102A2B" text-anchor="middle">幻覺會編造 · 不輸入姓名照片住址校名 · 不當內容截圖不轉傳</text>
  <text x="790" y="782" font-size="19" fill="#5C6B6B" text-anchor="middle">iWIN 網路內容防護機構 02-2577-5118 · 衛福部 1925 安心專線 24 小時免付費</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
