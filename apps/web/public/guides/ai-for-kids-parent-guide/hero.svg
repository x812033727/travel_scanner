<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">孩子用 AI 的年齡與設定 / Age limits and settings for children using AI</title>
  <desc id="desc">一張抽象插圖。畫面上方寫著「孩子用 AI 的年齡與設定」。左邊是一個淺青色的圓角對話框，框裡有三條粗短的青綠色橫線代表文字，框的左下角有一個小三角形的尾巴。對話框右邊有一串由小到大的圓點，沿著一條淺灰色的曲線往右上延伸，連到三個由低到高排列的圓角方塊，分別鑲著青綠、藍與橘色的粗邊；每個方塊上方各浮著一顆同色的圓點。三個方塊站在一條深色的橫線上，橫線兩端各有一個小方形端點，畫面四周散落幾顆大小不一的青綠、藍、綠與橘色圓點。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="800" y="150" font-size="56" font-weight="bold" fill="#102A2B" text-anchor="middle">孩子用 AI 的年齡與設定</text>

  <!-- speech bubble -->
  <rect x="170" y="255" width="470" height="285" rx="46" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9"/>
  <path d="M 256 530 L 262 626 L 342 530" fill="#E3F0EF" stroke="#0D6B68" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="228" y="322" width="350" height="24" rx="12" fill="#0D6B68"/>
  <rect x="228" y="382" width="272" height="24" rx="12" fill="#0D6B68"/>
  <rect x="228" y="442" width="318" height="24" rx="12" fill="#2E7D5B"/>

  <!-- connecting dotted path -->
  <circle cx="690" cy="500" r="9" fill="#5C6B6B"/>
  <circle cx="742" cy="478" r="11" fill="#5C6B6B"/>
  <circle cx="796" cy="452" r="13" fill="#5C6B6B"/>

  <!-- three ascending tiers -->
  <rect x="860" y="430" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#0D6B68" stroke-width="9"/>
  <circle cx="950" cy="370" r="28" fill="#0D6B68"/>

  <rect x="1078" y="350" width="180" height="260" rx="22" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="9"/>
  <circle cx="1168" cy="290" r="28" fill="#2F6F9F"/>

  <rect x="1296" y="270" width="180" height="340" rx="22" fill="#FFFFFF" stroke="#D97A2B" stroke-width="9"/>
  <circle cx="1386" cy="210" r="28" fill="#D97A2B"/>

  <!-- ground line -->
  <line x1="200" y1="660" x2="1440" y2="660" stroke="#102A2B" stroke-width="10" stroke-linecap="round"/>
  <rect x="186" y="645" width="30" height="30" rx="8" fill="#102A2B"/>
  <rect x="1424" y="645" width="30" height="30" rx="8" fill="#102A2B"/>

  <!-- scattered dots -->
  <circle cx="1512" cy="762" r="28" fill="#D97A2B"/>
  <circle cx="1532" cy="418" r="16" fill="#2E7D5B"/>
  <circle cx="140" cy="680" r="18" fill="#0D6B68"/>
  <circle cx="700" cy="720" r="26" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <circle cx="800" cy="748" r="13" fill="#5C6B6B"/>
  <circle cx="620" cy="212" r="20" fill="#2F6F9F"/>
  <circle cx="1030" cy="756" r="20" fill="#D97A2B"/>
</svg>
