<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">手續費從哪裡來，以及可以改的三件事 / Where bank fees come from</title>
<desc id="desc">上排是手續費的三個來源：通道成本看你用網銀、App、自動化服務機器還是臨櫃發動；跨行成本看錢有沒有離開這家銀行，跨行要走跨行金融資訊系統，資費依成本申請核准；帳戶本身的費用與單筆動作無關，包含帳戶管理費、起息點、補摺、掛失與久未往來。三個來源各有一個箭頭往下，對應三件可以改的事：換通道、把零星幾筆併成一筆並排在免費次數還沒用完時、以及回去查自己的契約與官網服務費用標準，因為調高或新增收費要事前公告。最下方另有一格說明外幣匯款是特例：你的銀行收一筆，款項經過的國外銀行可能再扣一筆，到帳金額因此少於匯出金額。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">手續費從哪裡來，以及可以改的三件事</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Where bank fees come from · 改的是方式與時機，不是換一家銀行</text>

<rect x="110" y="140" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="320" y="184" text-anchor="middle" font-size="17" fill="#5C6B6B">你用什麼方式發動</text>
<text x="320" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">通道成本</text>
<text x="320" y="278" text-anchor="middle" font-size="18" fill="#5C6B6B">網銀、App、自動化服務機器</text>
<text x="320" y="316" text-anchor="middle" font-size="18" fill="#5C6B6B">與臨櫃的作業成本不同</text>

<rect x="590" y="140" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="800" y="184" text-anchor="middle" font-size="17" fill="#5C6B6B">錢有沒有離開這家銀行</text>
<text x="800" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">跨行成本</text>
<text x="800" y="278" text-anchor="middle" font-size="18" fill="#5C6B6B">跨行要走跨行金融資訊系統</text>
<text x="800" y="316" text-anchor="middle" font-size="18" fill="#5C6B6B">資費依成本申請核准</text>

<rect x="1070" y="140" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<text x="1280" y="184" text-anchor="middle" font-size="17" fill="#5C6B6B">跟單筆動作無關</text>
<text x="1280" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">帳戶本身</text>
<text x="1280" y="278" text-anchor="middle" font-size="18" fill="#5C6B6B">帳戶管理費與起息點</text>
<text x="1280" y="316" text-anchor="middle" font-size="18" fill="#5C6B6B">補摺、掛失、久未往來</text>

<path d="M320 356 L320 434" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M800 356 L800 434" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1280 356 L1280 434" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="110" y="440" width="420" height="205" rx="18" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="320" y="486" text-anchor="middle" font-size="17" fill="#5C6B6B">可以改的第一件</text>
<text x="320" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">換通道</text>
<text x="320" y="578" text-anchor="middle" font-size="18" fill="#5C6B6B">同樣一筆錢</text>
<text x="320" y="614" text-anchor="middle" font-size="18" fill="#5C6B6B">改用自動化的方式送出</text>

<rect x="590" y="440" width="420" height="205" rx="18" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="486" text-anchor="middle" font-size="17" fill="#5C6B6B">可以改的第二件</text>
<text x="800" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">併筆與對時</text>
<text x="800" y="578" text-anchor="middle" font-size="18" fill="#5C6B6B">零星幾筆併成一筆</text>
<text x="800" y="614" text-anchor="middle" font-size="18" fill="#5C6B6B">排在免費次數還沒用完時</text>

<rect x="1070" y="440" width="420" height="205" rx="18" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1280" y="486" text-anchor="middle" font-size="17" fill="#5C6B6B">可以改的第三件</text>
<text x="1280" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">查自己的費用標準</text>
<text x="1280" y="578" text-anchor="middle" font-size="18" fill="#5C6B6B">契約與官網的服務費用標準</text>
<text x="1280" y="614" text-anchor="middle" font-size="18" fill="#5C6B6B">調高或新增須事前公告</text>

<rect x="110" y="684" width="1380" height="138" rx="18" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="726" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">外幣匯款是特例</text>
<text x="800" y="764" text-anchor="middle" font-size="18" fill="#5C6B6B">你的銀行收一筆，款項經過的國外銀行可能再扣一筆；到帳金額因此少於匯出金額。</text>
<text x="800" y="796" text-anchor="middle" font-size="18" fill="#5C6B6B">匯款單上「費用由誰負擔」的欄位，決定收款人實際拿到多少。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
