<title id="title">銀行手續費健檢：跨行、匯款與帳管費怎麼省</title>
<desc id="desc">兩張長條收據前後重疊，後面一張只露出左緣與上緣。前面那張的下緣是鋸齒狀撕痕，票面上有一條粗的標題線與五行較細的項目線，每一行的右側都有一個同樣大小的圓點，代表重複出現的同一筆費用。右側一個橘色的放大鏡圓框與握柄斜壓在收據右半部，圈住其中幾個圓點。</desc>
