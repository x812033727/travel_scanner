<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif">
<title id="title">Small-shop marketing review loop</title><desc id="desc">Four panels show the goal and baseline, evidence of demand, channel and budget actions, and monthly results review; completing actions is not the same as meeting the goal.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Small-shop marketing review loop</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Connect goals, demand, actions, and monthly reviews</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Define the goal</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Baseline and deadline</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Orders to improve</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Check capacity</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Verify demand</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Who needs what</text>
<text x="477.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Inquiry and order data</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">List assumptions</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Plan the work</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Channel roles</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Owner and deliverable</text>
<text x="846.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">Count cash and time</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Review monthly</text>
<text x="1215.0" y="371" font-size="31" fill="#102A2B" text-anchor="start" font-weight="normal">Work versus results</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Compare like data</text>
<text x="1215.0" y="475" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Keep, change, or pause</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Let one business problem guide action; use evidence to revise the next plan.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original illustration by Mokaair</text>
</svg>