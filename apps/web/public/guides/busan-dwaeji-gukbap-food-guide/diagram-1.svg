<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">釜山豬肉湯飯菜單解碼圖 / How to read a Busan dwaeji-gukbap menu</title>
  <desc id="desc">圖上的標題是「菜單上的국밥怎麼分，桌上佐料怎麼加」，副標是「Busan dwaeji-gukbap: menu and seasoning order」。圖分左右兩欄。左欄的標頭寫「菜單上的국밥 On the menu」與「碗裡放什麼，一次看懂」，下面六個方框由上而下：돼지국밥　豬肉湯飯，下面寫「豬骨湯＋薄切豬肉＋飯」；순대국밥　血腸湯飯，「換成血腸，常帶豬肝豬心」；내장국밥　內臟湯飯，「換成內臟，胃腸大腸頭心臟」；섞어국밥　混合湯飯，「肉配內臟，或肉配血腸」；따로국밥　湯飯分開，「湯一碗、飯一碗，不泡在一起」；수육백반　白切肉套餐，「湯、飯與切片白切肉分開上桌」。右欄的標頭寫「桌上的佐料，照這個順序 Season it in this order」與「湯上桌是原味的，鹹淡與辣度自己調」；下面三個方框用箭頭上下串起來：부추（정구지）　韭菜，下面寫「先鋪在湯上」；箭頭旁邊標「국물 먼저」與「（先喝一口原味的湯）」；다대기　辣醬，「按口味加辣」；새우젓　蝦醬，「最後用它調鹹淡」。右上角另有一個橘色虛線框，寫소면　素麵與「（有的店會附）」，下面兩行是一小把、可以先吃，它沒有接進佐料的順序裡。左下角是「資料：Visit Busan・韓國觀光公社」，右下角是「© Mokaair 製圖 2026」。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">菜單上的국밥怎麼分，桌上佐料怎麼加</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Busan dwaeji-gukbap: menu and seasoning order</text>

  <!-- left column header -->
  <rect x="40" y="104" width="740" height="64" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="132" font-size="22" font-weight="700" fill="#0B4F4D" text-anchor="middle">菜單上的국밥 On the menu</text>
  <text x="410" y="156" font-size="15" fill="#0B4F4D" text-anchor="middle">碗裡放什麼，一次看懂</text>

  <!-- right column header -->
  <rect x="820" y="104" width="740" height="64" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1190" y="132" font-size="22" font-weight="700" fill="#1F4E73" text-anchor="middle">桌上的佐料，照這個順序 Season it in this order</text>
  <text x="1190" y="156" font-size="15" fill="#1F4E73" text-anchor="middle">湯上桌是原味的，鹹淡與辣度自己調</text>

  <!-- left column: 6 menu boxes -->
  <rect x="40" y="184" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="224" font-size="23" font-weight="700" fill="#102A2B">돼지국밥　豬肉湯飯</text>
  <text x="70" y="256" font-size="16" fill="#5C6B6B">豬骨湯＋薄切豬肉＋飯</text>

  <rect x="40" y="290" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="330" font-size="23" font-weight="700" fill="#102A2B">순대국밥　血腸湯飯</text>
  <text x="70" y="362" font-size="16" fill="#5C6B6B">換成血腸，常帶豬肝豬心</text>

  <rect x="40" y="396" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="436" font-size="23" font-weight="700" fill="#102A2B">내장국밥　內臟湯飯</text>
  <text x="70" y="468" font-size="16" fill="#5C6B6B">換成內臟，胃腸大腸頭心臟</text>

  <rect x="40" y="502" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="542" font-size="23" font-weight="700" fill="#102A2B">섞어국밥　混合湯飯</text>
  <text x="70" y="574" font-size="16" fill="#5C6B6B">肉配內臟，或肉配血腸</text>

  <rect x="40" y="608" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="648" font-size="23" font-weight="700" fill="#102A2B">따로국밥　湯飯分開</text>
  <text x="70" y="680" font-size="16" fill="#5C6B6B">湯一碗、飯一碗，不泡在一起</text>

  <rect x="40" y="714" width="740" height="94" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/>
  <text x="70" y="754" font-size="23" font-weight="700" fill="#102A2B">수육백반　白切肉套餐</text>
  <text x="70" y="786" font-size="16" fill="#5C6B6B">湯、飯與切片白切肉分開上桌</text>

  <!-- right column: seasoning chain -->
  <rect x="820" y="184" width="460" height="165" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="255" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">부추（정구지）　韭菜</text>
  <text x="1050" y="291" font-size="17" fill="#5C6B6B" text-anchor="middle">先鋪在湯上</text>

  <path d="M 1050 349 L 1050 411" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1080" y="372" font-size="15" font-weight="700" fill="#1F4E73">국물 먼저</text>
  <text x="1080" y="393" font-size="15" fill="#5C6B6B">（先喝一口原味的湯）</text>

  <rect x="820" y="419" width="460" height="165" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="490" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">다대기　辣醬</text>
  <text x="1050" y="526" font-size="17" fill="#5C6B6B" text-anchor="middle">按口味加辣</text>

  <path d="M 1050 584 L 1050 616" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="624" width="460" height="165" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="3"/>
  <text x="1050" y="695" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">새우젓　蝦醬</text>
  <text x="1050" y="731" font-size="17" fill="#5C6B6B" text-anchor="middle">最後用它調鹹淡</text>

  <!-- side box: somyeon, independent of the chain -->
  <rect x="1300" y="184" width="260" height="235" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="1430" y="234" font-size="22" font-weight="700" fill="#8A4A14" text-anchor="middle">소면　素麵</text>
  <text x="1430" y="268" font-size="16" fill="#8A4A14" text-anchor="middle">（有的店會附）</text>
  <text x="1430" y="300" font-size="16" fill="#8A4A14" text-anchor="middle">一小把，</text>
  <text x="1430" y="324" font-size="16" fill="#8A4A14" text-anchor="middle">可以先吃</text>

  <!-- footer -->
  <text x="60" y="840" font-size="16" fill="#5C6B6B">資料：Visit Busan・韓國觀光公社</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
