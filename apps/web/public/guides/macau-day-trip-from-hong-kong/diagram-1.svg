<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">香港到澳門的三種去法與五個口岸 / Three ways from Hong Kong to Macau</title>
<desc id="desc">示意圖。左邊是香港：上環港澳碼頭在下方，港珠澳大橋香港口岸旅檢大樓在上方，兩者都在大嶼山與港島。右邊是澳門：右上是澳門半島，裡面有外港客運碼頭、大三巴、議事亭前地與媽閣廟；右下是氹仔與路氹，裡面有氹仔客運碼頭與官也街；中間偏上是港珠澳大橋澳門邊檢大樓。三條路線：上環到外港的噴射飛航，約 60 分鐘、普通位平日 194 港元；上環到氹仔的噴射飛航與金光飛航，金光飛航標準艙平日 192 港元；香港口岸到澳門口岸的穿梭巴士，橋上約 40 分鐘、日間 65 港元、24 小時營運。澳門境內：外港轉 3、3A、10、10A 號巴士到新馬路，澳門口岸有 101 巴士到亞馬喇前地與 103 到氹仔碼頭，氹仔碼頭與媽閣之間是輕軌氹仔線，全程約 28 分鐘。方向與距離非比例。</desc>
<defs>
<marker id="a-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0D6B68"/></marker>
<marker id="a-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6F9F"/></marker>
<marker id="a-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D97A2B"/></marker>
<marker id="a-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2E7D5B"/></marker>
</defs>
