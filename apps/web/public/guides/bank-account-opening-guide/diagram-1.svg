<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">開戶的三條路，卡在同一關 / Three routes to a first bank account</title>
<desc id="desc">上排三欄是三種開戶情境各自的到場與文件要求：成年本人臨櫃要本人到場，帶雙證件正本、印章與開戶存入款，行員查聯徵並建立開戶影像檔；線上開數位存款帳戶原則上免到場，留存雙證件影像檔，第一類仍須臨櫃查驗正本或視訊；未成年人開戶，未滿七歲由父母共同到場，七歲以上由父母代理或出具同意書，小孩本人不必到場。三欄的箭頭都往下匯到同一排認識客戶的四個問題：開戶目的、職業、資金來源、與本行既有往來。答得出來往左到受理開戶，答不出來往右到拒絕或暫不受理。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">開戶的三條路，卡在同一關</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Opening a first bank account in Taiwan · counter, online, minor</text>
<rect x="70" y="118" width="460" height="252" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="300" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">成年本人臨櫃</text>
<text x="300" y="228" text-anchor="middle" font-size="18" fill="#5C6B6B">本人到場</text>
<text x="300" y="266" text-anchor="middle" font-size="18" fill="#5C6B6B">雙證件正本、印章、開戶存入款</text>
<text x="300" y="304" text-anchor="middle" font-size="18" fill="#5C6B6B">行員查聯徵、建立開戶影像檔</text>
<path d="M300 372 V458" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="570" y="118" width="460" height="252" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">線上數位存款帳戶</text>
<text x="800" y="228" text-anchor="middle" font-size="18" fill="#5C6B6B">原則上免到場</text>
<text x="800" y="266" text-anchor="middle" font-size="18" fill="#5C6B6B">雙證件影像檔</text>
<text x="800" y="304" text-anchor="middle" font-size="18" fill="#5C6B6B">第一類仍須臨櫃查驗正本或視訊</text>
<path d="M800 372 V458" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="1070" y="118" width="460" height="252" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1300" y="180" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">未成年人開戶</text>
<text x="1300" y="228" text-anchor="middle" font-size="18" fill="#5C6B6B">未滿七歲：父母共同到場</text>
<text x="1300" y="266" text-anchor="middle" font-size="18" fill="#5C6B6B">七歲以上：父母代理或同意書</text>
<text x="1300" y="304" text-anchor="middle" font-size="18" fill="#5C6B6B">小孩本人不必到場</text>
<path d="M1300 372 V458" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="190" y="470" width="1220" height="180" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="800" y="520" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">認識客戶：行員一定會問的四題</text>
<rect x="215" y="556" width="270" height="68" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="350" y="599" text-anchor="middle" font-size="20" fill="#102A2B">開戶目的</text>
<rect x="510" y="556" width="270" height="68" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="645" y="599" text-anchor="middle" font-size="20" fill="#102A2B">職業</text>
<rect x="805" y="556" width="270" height="68" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="940" y="599" text-anchor="middle" font-size="20" fill="#102A2B">資金來源</text>
<rect x="1100" y="556" width="270" height="68" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="1235" y="599" text-anchor="middle" font-size="20" fill="#102A2B">與本行既有往來</text>
<path d="M640 650 V700 H530 V732" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M960 650 V700 H1070 V732" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="616" y="682" text-anchor="end" font-size="18" fill="#2E7D5B">答得出來</text>
<text x="988" y="682" text-anchor="start" font-size="18" fill="#B8442D">答不出來</text>
<rect x="300" y="744" width="460" height="116" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="530" y="794" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">受理開戶</text>
<text x="530" y="832" text-anchor="middle" font-size="18" fill="#5C6B6B">說得清楚、文件對得上</text>
<rect x="840" y="744" width="460" height="116" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1070" y="794" text-anchor="middle" font-size="26" font-weight="700" fill="#102A2B">拒絕或暫不受理</text>
<text x="1070" y="832" text-anchor="middle" font-size="18" fill="#5C6B6B">說不清楚、文件可疑或異常</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
