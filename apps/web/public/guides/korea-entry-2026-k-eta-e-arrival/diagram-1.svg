<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">入境韓國四步流程：行前、落地、入境審查、出關</title>
  <desc id="desc">四個步驟。行前：護照效期、K-ETA 免辦到 2026 年 12 月 31 日、抵達前 3 天內免費線上填 e-Arrival Card、回程機票與住宿。落地：跟入境審查指標走、排外國人櫃檯、有申報物品先用 App 填。入境審查：交護照、17 歲以上採指紋與臉部照片、官員系統看得到電子入境卡、之後可登錄 SES 自動通關。出關：領行李、無申報直接出關、有申報出示 App QR 碼、免稅額，然後前往交通中心。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">入境韓國四步：台灣旅客 2026 年版</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Entering Korea in four steps · 2026 年 9 月依法務部、關稅廳與領務局查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="150" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="60" y="150" width="340" height="88" rx="24" fill="#2F6F9F"/>
  <text x="230" y="188" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　行前</text>
  <text x="230" y="218" font-size="16" fill="#E6F0F7" text-anchor="middle">출발 전 (Before departure)</text>
  <g font-size="17" fill="#102A2B">
    <text x="88" y="282">● 護照效期：韓方說停留期間內有效即可，</text>
    <text x="106" y="308">台灣領務局建議 6 個月以上</text>
    <text x="88" y="352">● K-ETA：免辦到 2026-12-31</text>
    <rect x="106" y="366" width="96" height="30" rx="8" fill="#2E7D5B"/><text x="154" y="388" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">免辦</text>
    <text x="88" y="440">● e-Arrival Card：抵達前 3 天內線上填</text>
    <text x="106" y="466">www.e-arrivalcard.go.kr</text>
    <rect x="106" y="480" width="96" height="30" rx="8" fill="#2E7D5B"/><text x="154" y="502" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">免費</text>
    <text x="88" y="554">● 回程機票與住宿訂位（入境卡要填住址）</text>
  </g>
  <rect x="80" y="600" width="300" height="80" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="3"/>
  <text x="230" y="632" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">只用 go.kr 結尾的官網</text>
  <text x="230" y="658" font-size="15" fill="#8A2E1D" text-anchor="middle">要求付款的入境卡網站都是仿冒</text>

  <!-- step 2 -->
  <rect x="440" y="150" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#6E7A7A" stroke-width="6"/>
  <rect x="440" y="150" width="340" height="88" rx="24" fill="#6E7A7A"/>
  <text x="610" y="188" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　落地</text>
  <text x="610" y="218" font-size="16" fill="#EEF1F1" text-anchor="middle">도착 (Arrival)</text>
  <g font-size="17" fill="#102A2B">
    <text x="468" y="282">● 跟「입국심사 Immigration」指標走</text>
    <text x="468" y="326">● 排 Foreigner 外國人櫃檯</text>
    <text x="468" y="370">● 有申報物品的人：先開</text>
    <text x="486" y="396">「여행자 세관신고」App 填好</text>
    <text x="468" y="440">● 沒有申報物品：什麼都不用填</text>
  </g>

  <!-- step 3 -->
  <rect x="820" y="150" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="6"/>
  <rect x="820" y="150" width="340" height="88" rx="24" fill="#2E7D5B"/>
  <text x="990" y="188" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　入境審查</text>
  <text x="990" y="218" font-size="16" fill="#E7F2EC" text-anchor="middle">입국심사 (Immigration)</text>
  <g font-size="17" fill="#102A2B">
    <text x="848" y="282">● 交護照</text>
    <text x="848" y="326">● 17 歲以上採指紋與臉部照片</text>
    <text x="848" y="370">● 官員系統直接看到電子入境卡，</text>
    <text x="866" y="396">不用列印、不用出示</text>
    <text x="848" y="440">● 留下生物資料後，這趟出境可走</text>
    <text x="866" y="466">SES 自動通關（登錄櫃檯免費）</text>
  </g>
  <!-- fingerprint icon -->
  <g fill="none" stroke="#2E7D5B" stroke-width="4" stroke-linecap="round">
    <path d="M 990 560 m -40 0 a 40 40 0 0 1 80 0 v 30"/>
    <path d="M 990 560 m -26 0 a 26 26 0 0 1 52 0 v 46"/>
    <path d="M 990 560 m -12 0 a 12 12 0 0 1 24 0 v 60"/>
  </g>

  <!-- step 4 -->
  <rect x="1200" y="150" width="340" height="560" rx="24" fill="#FFFFFF" stroke="#D97A2B" stroke-width="6"/>
  <rect x="1200" y="150" width="340" height="88" rx="24" fill="#D97A2B"/>
  <text x="1370" y="188" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4　出關</text>
  <text x="1370" y="218" font-size="16" fill="#FBEFE4" text-anchor="middle">세관・도착홀 (Customs / Arrival hall)</text>
  <g font-size="17" fill="#102A2B">
    <text x="1228" y="282">● 領行李</text>
    <text x="1228" y="326">● 無申報物品：直接出關</text>
    <text x="1228" y="370">● 有申報物品：出示 App 的 QR 碼</text>
    <text x="1228" y="414">● 免稅額：一般物品 800 美元</text>
    <text x="1246" y="440">酒 2 公升且 400 美元以下</text>
    <text x="1246" y="466">菸 200 支、香水 100 毫升</text>
    <text x="1228" y="530">● 出關後 → 交通中心 교통센터</text>
    <text x="1246" y="556">AREX、機場巴士、計程車</text>
  </g>

  <!-- arrows -->
  <path d="M 402 430 L 436 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 782 430 L 816 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 1162 430 L 1196 430" stroke="#5C6B6B" stroke-width="6" marker-end="url(#arrow)"/>

  <text x="60" y="780" font-size="18" fill="#5C6B6B">K-ETA 免辦期間仍可自費申請（10,000 韓元，費用不退）；持有效 K-ETA 或外國人登錄證者免填電子入境卡。</text>
  <text x="60" y="812" font-size="18" fill="#5C6B6B">未滿 19 歲沒有酒與菸的免稅額。台灣領務局提醒韓國禁止攜帶豬肉製品入境。</text>
  <text x="1380" y="862" font-size="16" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
