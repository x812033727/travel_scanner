<title id="title">OpenAI, S-1 초안 비공개 제출: 한 줄 발표 너머 OpenAI가 아직 말하지 않은 것</title><desc id="desc">오리지널 일러스트: 왼쪽에는 자물쇠가 달린 점선 문서가 있어 비공개로 제출된 초안을 나타냅니다. 점선은 오른쪽의 점선 시계로 이어지며, 아직 정해지지 않은 시기를 나타냅니다. 기업 로고나 제품 화면은 그려져 있지 않습니다.</desc>
