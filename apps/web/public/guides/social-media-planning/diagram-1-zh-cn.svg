<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="title">社交媒体内容与互动一起排</title><desc id="desc">四张卡片依序列出平台任务、内容配比、互动维护与成果回顾，提醒发布后还有服务工作。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="50" fill="#102A2B" text-anchor="start" font-weight="bold">社交媒体内容与互动一起排</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">平台任务、内容、回复与回顾构成同一份工作计划</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">平台任务</text>
<text x="108.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">读者与接触目的</text>
<text x="108.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">先确认维护人力</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">内容配比</text>
<text x="477.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">问题情境与服务</text>
<text x="477.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">依需求调整比例</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">互动维护</text>
<text x="846.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">回复转交与规则</text>
<text x="846.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">保留更新与休息</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="36" fill="#102A2B" text-anchor="start" font-weight="bold">成果回顾</text>
<text x="1215.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">定义期间与口径</text>
<text x="1215.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">看问题是否改善</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">可持续的社交媒体节奏，包含制作内容也包含回应读者。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
