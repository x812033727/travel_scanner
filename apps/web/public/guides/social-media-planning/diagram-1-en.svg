<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="Arial,'Noto Sans',sans-serif">
<title id="title">Plan Content and Conversation Together</title><desc id="desc">Four cards show platform purpose, content mix, community care, and results review, reminding readers that service work continues after publishing.</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">Plan Content and Conversation Together</text>
<text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">Platform purpose, content, replies, and review belong in one plan</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Platform purpose</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Readers and their task</text>
<text x="108.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Check support capacity</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="477.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Content mix</text>
<text x="477.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Questions, uses, service</text>
<text x="477.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Adjust to current needs</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="846.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Community care</text>
<text x="846.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Reply and handoff rules</text>
<text x="846.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Allow updates and rest</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1215.0" y="314" font-size="31" fill="#102A2B" text-anchor="start" font-weight="bold">Results review</text>
<text x="1215.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Define period and metric</text>
<text x="1215.0" y="423" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal">Did the problem improve?</text>
<text x="80" y="803" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">A sustainable rhythm includes creating content and responding to readers.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original Mokaair graphic</text>
</svg>
