<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">同一個基準上的比較 / Weighing a price against its hidden costs</title>
  <desc id="desc">一張插圖。畫面中央是一座天平，立柱從底座往上接到支點，橫樑保持水平沒有傾向任何一邊。左邊的吊桿垂下一個淺碗形的盤子，盤上放著一個橫長的圓角吊牌，吊牌左側有一個穿繩用的圓孔，右側有兩條粗短的橫線代表標價。右邊的吊桿垂下另一個同樣的盤子，盤上並排放著三個大小完全相同的圓角方塊，代表三筆要被加總的成本。畫面下方有一行短標題文字。整張圖沒有任何機構標誌、人臉、貨幣圖樣，也沒有任何曲線或高低排列的柱體。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <rect x="792" y="218" width="16" height="340" fill="#102A2B"/>
  <path d="M 760 558 L 840 558 L 905 606 L 695 606 Z" fill="#102A2B"/>
  <rect x="665" y="606" width="270" height="22" rx="11" fill="#102A2B"/>

  <rect x="470" y="210" width="660" height="16" rx="8" fill="#102A2B"/>
  <circle cx="800" cy="218" r="20" fill="#0D6B68"/>

  <rect x="466" y="226" width="8" height="204" fill="#102A2B"/>
  <path d="M 330 426 Q 470 521 610 426 Z" fill="#0D6B68"/>

  <rect x="1126" y="226" width="8" height="204" fill="#102A2B"/>
  <path d="M 990 426 Q 1130 521 1270 426 Z" fill="#2F6F9F"/>

  <rect x="372" y="336" width="196" height="90" rx="18" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/>
  <circle cx="404" cy="381" r="13" fill="#F7F1E8" stroke="#0D6B68" stroke-width="5"/>
  <rect x="432" y="360" width="112" height="14" rx="7" fill="#0D6B68"/>
  <rect x="432" y="388" width="76" height="14" rx="7" fill="#5C6B6B"/>

  <rect x="996" y="350" width="76" height="76" rx="15" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
