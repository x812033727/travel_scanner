<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">模型的圖書館 / A library of downloadable models</title>
<desc id="desc">抽象插圖。畫面左邊是一座青綠色外框的書架，架上三層各放四張圓角卡片，代表模型倉庫；每張卡片上有兩條短橫線表示說明文字，部分卡片右下角有一個橘色小標籤，代表授權標籤。書架右側有一道橘色的弧形箭頭，把其中一份檔案送進右邊的深色螢幕；螢幕裡有三條淺色橫條與一條綠色進度條，代表模型已經下載到本機並開始執行。畫面下方只有一行字：模型的圖書館。插圖沒有任何品牌標誌、介面截圖或人物。</desc>
