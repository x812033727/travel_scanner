<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">三層有什麼不同</title><desc id="desc">對話、流程、代理三個層次的示意（查證：2026 年 9 月）</desc>
<rect width="1600" height="900" fill="#F7F1E8"/><text x="800" y="102" font-size="46" font-weight="600" fill="#102A2B" text-anchor="middle">三層有什麼不同</text><rect x="80.0" y="300" width="433.3333333333333" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="130.0" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="296.66666666666663" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">一次對話</text><text x="296.66666666666663" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">人腦記狀態、想下一步</text><path d="M521.3333333333333 465.0 L561.3333333333333 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M539.3333333333333 435.0 L575.3333333333333 465.0 L539.3333333333333 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="583.3333333333333" y="300" width="433.3333333333333" height="330" rx="24" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/><circle cx="633.3333333333333" cy="354" r="20" fill="#2F6F9F" stroke="none" stroke-width="6"/><text x="799.9999999999999" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">寫成流程</text><text x="799.9999999999999" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">步驟、契約、可重試</text><path d="M1024.6666666666665 465.0 L1064.6666666666665 465.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round"/><path d="M1042.6666666666665 435.0 L1078.6666666666665 465.0 L1042.6666666666665 495.0" fill="none" stroke="#102A2B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1086.6666666666665" y="300" width="433.3333333333333" height="330" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="6"/><circle cx="1136.6666666666665" cy="354" r="20" fill="#0D6B68" stroke="none" stroke-width="6"/><text x="1303.3333333333333" y="450" font-size="40" font-weight="600" fill="#102A2B" text-anchor="middle">交給代理</text><text x="1303.3333333333333" y="540" font-size="28" font-weight="600" fill="#5C6B6B" text-anchor="middle">模型自己判斷下一步</text><text x="1540" y="865" font-size="20" font-weight="600" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text></svg>