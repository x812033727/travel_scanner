<title id="title">OpenAI 主張美國帶頭訂前沿 AI 國際標準：兩個支柱與一條界線</title><desc id="desc">原創插圖：中央一個六邊形節點向外延伸兩條路徑，一條連到由多個小圓點排成、間距不一致的環狀圖案，代表尚未統一的各國標準；另一條連到一個方框，框內畫著一條粗分隔線，代表公告劃出的界線。</desc>
