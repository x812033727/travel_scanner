<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">把每個目標除成每月金額，再跟結餘比一次 / Turning goals into a monthly figure</title>
<desc id="desc">左邊三個假設的目標各自做一次除法：換手機三萬元除以十二個月，每月兩千五百元；家電汰換四萬元除以十個月，每月四千元；旅行六萬元除以二十四個月，每月兩千五百元。中間把三個每月金額相加，合計每月九千元。右邊拿這個合計跟每月結餘比較：假設結餘七千元，合計小於結餘就照表執行並固定回頭看進度，合計大於結餘則只有延長期限、降低金額、刪掉一個三種處理。圖上的金額都是假設值。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">把每個目標除成每月金額，再跟結餘比一次</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">Savings goals · 除法在左，決定在右；圖上金額均為假設值</text>

<path d="M440 250 L510 385" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M440 420 L510 420" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M440 590 L510 455" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M830 420 L890 420" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1190 400 L1240 275" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M1190 440 L1240 555" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="50" y="180" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="240" y="220" text-anchor="middle" font-size="17" fill="#5C6B6B">換手機</text>
<text x="240" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">3 萬元 ÷ 12 個月</text>
<text x="240" y="296" text-anchor="middle" font-size="18" fill="#0D6B68">每月 2,500 元</text>

<rect x="50" y="350" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="240" y="390" text-anchor="middle" font-size="17" fill="#5C6B6B">家電汰換</text>
<text x="240" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">4 萬元 ÷ 10 個月</text>
<text x="240" y="466" text-anchor="middle" font-size="18" fill="#0D6B68">每月 4,000 元</text>

<rect x="50" y="520" width="380" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<text x="240" y="560" text-anchor="middle" font-size="17" fill="#5C6B6B">旅行</text>
<text x="240" y="600" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">6 萬元 ÷ 24 個月</text>
<text x="240" y="636" text-anchor="middle" font-size="18" fill="#0D6B68">每月 2,500 元</text>

<rect x="520" y="350" width="310" height="140" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="675" y="390" text-anchor="middle" font-size="17" fill="#5C6B6B">三個目標相加</text>
<text x="675" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">每月合計 9,000 元</text>
<text x="675" y="466" text-anchor="middle" font-size="18" fill="#5C6B6B">要從結餘出的錢</text>

<rect x="890" y="350" width="300" height="140" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="1040" y="390" text-anchor="middle" font-size="17" fill="#5C6B6B">跟每月結餘比一次</text>
<text x="1040" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">假設結餘 7,000 元</text>
<text x="1040" y="466" text-anchor="middle" font-size="18" fill="#5C6B6B">結餘從紀錄來</text>

<rect x="1250" y="200" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
<text x="1400" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">合計小於結餘</text>
<text x="1400" y="292" text-anchor="middle" font-size="17" fill="#5C6B6B">照表執行，固定回頭看進度</text>

<rect x="1250" y="470" width="300" height="210" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="1400" y="518" text-anchor="middle" font-size="20" font-weight="700" fill="#102A2B">合計大於結餘</text>
<text x="1400" y="554" text-anchor="middle" font-size="17" fill="#5C6B6B">三選一，沒有第四個選項</text>
<text x="1400" y="592" text-anchor="middle" font-size="18" fill="#B8442D">延長期限</text>
<text x="1400" y="624" text-anchor="middle" font-size="18" fill="#B8442D">降低金額</text>
<text x="1400" y="656" text-anchor="middle" font-size="18" fill="#B8442D">刪掉一個</text>

<text x="60" y="760" font-size="20" fill="#5C6B6B">每一個目標都是：目標金額減已存金額，再除以剩餘月數；除不盡往上取整。</text>
<text x="60" y="796" font-size="20" fill="#5C6B6B">合計大於結餘不是意志力問題，是算術的結果：延長期限、降低金額、刪掉一個。</text>
<text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
