<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">The sitemap maintenance cycle</title><desc id="desc">Four stages: select public canonical URLs, use a generator to create valid files, submit and check fetch status, then sync and review as content changes.</desc>
<rect width="1600" height="900" fill="#F7F1E8"></rect>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">The sitemap maintenance cycle</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Keep the public URL list in sync with the site whenever content changes</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Select URLs</text>
<text x="108.0" y="371" font-size="24" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 24px;">Complete public content</text>
<text x="108.0" y="423" font-size="22" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 22px;">Intended canonical version</text>
<text x="108.0" y="475" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 28px;">Exclude private drafts</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Generate files</text>
<text x="477.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Complete URLs</text>
<text x="477.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Format and size</text>
<text x="477.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Actual update dates</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
<text x="846.0" y="314" font-size="34" fill="#102A2B" text-anchor="start" font-weight="bold" style="font-size: 34px;">Submit and fetch</text>
<text x="846.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Correct file location</text>
<text x="846.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Publicly fetchable</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Fetching ≠ indexing</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"></rect>
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Keep in sync</text>
<text x="1215.0" y="371" font-size="20" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 20px;">Additions and major updates</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Moves and removals</text>
<text x="1215.0" y="475" font-size="25" fill="#102A2B" text-anchor="start" font-weight="normal" style="font-size: 25px;">Compare with admin list</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Choose content worth finding, then keep the list accurate and up to date.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
