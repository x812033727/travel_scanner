<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">組裝你的專用助手 / Assembling your own custom GPT</title>
  <desc id="desc">米色底上，畫面中央是一個機器人形狀的大對話泡泡：淺綠底、深綠邊的圓角方框，頂上有一根天線和一顆小圓球，框裡有兩個圓形眼睛與一道微笑的弧線，左下角有一個對話泡泡的小尾巴。泡泡周圍有三個零件正沿著灰色虛線飛向它：左上方一顆橘色齒輪，代表指令與設定；右上方一本藍色的書，代表知識檔案；右下方一個綠色的開關，代表能力開關。畫面下方一行深色文字「組裝你的專用助手」。沒有任何品牌標誌。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background blobs -->
  <circle cx="800" cy="420" r="330" fill="#E3F0EF"/>
  <circle cx="330" cy="200" r="120" fill="#FCEFE4"/>
  <circle cx="1280" cy="640" r="140" fill="#E6F2EC"/>

  <!-- dotted assembly paths -->
  <path d="M 430 250 C 520 300, 580 330, 640 360" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>
  <path d="M 1170 230 C 1080 280, 1010 320, 950 350" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>
  <path d="M 1210 620 C 1120 590, 1050 560, 990 530" fill="none" stroke="#5C6B6B" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- robot-shaped speech bubble -->
  <line x1="800" y1="190" x2="800" y2="250" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <circle cx="800" cy="176" r="22" fill="#D97A2B" stroke="#0D6B68" stroke-width="8"/>
  <rect x="600" y="250" width="400" height="330" rx="48" fill="#FFFFFF" stroke="#0D6B68" stroke-width="12"/>
  <path d="M 660 578 L 630 660 L 740 578 Z" fill="#FFFFFF" stroke="#0D6B68" stroke-width="12" stroke-linejoin="round"/>
  <rect x="666" y="584" width="80" height="14" fill="#FFFFFF"/>
  <!-- eyes -->
  <circle cx="715" cy="380" r="38" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="885" cy="380" r="38" fill="#E3F0EF" stroke="#0D6B68" stroke-width="8"/>
  <circle cx="715" cy="380" r="14" fill="#102A2B"/>
  <circle cx="885" cy="380" r="14" fill="#102A2B"/>
  <!-- smile -->
  <path d="M 720 470 Q 800 530 880 470" fill="none" stroke="#0D6B68" stroke-width="12" stroke-linecap="round"/>
  <!-- side bolts -->
  <rect x="572" y="380" width="28" height="70" rx="10" fill="#2F6F9F"/>
  <rect x="1000" y="380" width="28" height="70" rx="10" fill="#2F6F9F"/>

  <!-- gear (top-left) -->
  <g transform="translate(340 200)">
    <g fill="#D97A2B">
      <rect x="-16" y="-96" width="32" height="40" rx="6"/>
      <rect x="-16" y="56" width="32" height="40" rx="6"/>
      <rect x="-96" y="-16" width="40" height="32" rx="6"/>
      <rect x="56" y="-16" width="40" height="32" rx="6"/>
      <rect x="-16" y="-96" width="32" height="40" rx="6" transform="rotate(45)"/>
      <rect x="-16" y="56" width="32" height="40" rx="6" transform="rotate(45)"/>
      <rect x="-96" y="-16" width="40" height="32" rx="6" transform="rotate(45)"/>
      <rect x="56" y="-16" width="40" height="32" rx="6" transform="rotate(45)"/>
    </g>
    <circle r="66" fill="#D97A2B"/>
    <circle r="26" fill="#F7F1E8"/>
  </g>

  <!-- book (top-right) -->
  <g transform="translate(1260 200)">
    <path d="M -110 -70 L -10 -50 L -10 90 L -110 70 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 110 -70 L 10 -50 L 10 90 L 110 70 Z" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10" stroke-linejoin="round"/>
    <line x1="-10" y1="-50" x2="10" y2="-50" stroke="#2F6F9F" stroke-width="10"/>
    <line x1="-10" y1="90" x2="10" y2="90" stroke="#2F6F9F" stroke-width="10"/>
    <line x1="-84" y1="-30" x2="-34" y2="-20" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
    <line x1="-84" y1="0" x2="-34" y2="10" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
    <line x1="-84" y1="30" x2="-34" y2="40" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
    <line x1="34" y1="-20" x2="84" y2="-30" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
    <line x1="34" y1="10" x2="84" y2="0" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- toggle switch (bottom-right) -->
  <g transform="translate(1300 640)">
    <rect x="-120" y="-50" width="240" height="100" rx="50" fill="#2E7D5B"/>
    <circle cx="60" cy="0" r="38" fill="#FFFFFF"/>
    <line x1="-70" y1="-18" x2="-70" y2="18" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- small spare parts on the left bottom -->
  <circle cx="300" cy="620" r="26" fill="#0D6B68"/>
  <rect x="360" y="640" width="90" height="26" rx="13" fill="#2F6F9F"/>
  <circle cx="240" cy="700" r="14" fill="#D97A2B"/>

  <text x="800" y="800" text-anchor="middle" font-size="56" font-weight="700" fill="#102A2B">組裝你的專用助手</text>
</svg>
