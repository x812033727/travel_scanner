<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Segoe UI',Arial,sans-serif">
  <title id="title">The website maintenance cycle</title>
  <desc id="desc">Maintenance starts by observing the site, then preparing a backup and change scope before updating and verifying the visitor journey.</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">
    <tspan x="80" dy="0">The website maintenance cycle</tspan>
  </text>
  <text x="80" y="151" font-size="27" fill="#5C6B6B" text-anchor="start" font-weight="normal">
    <tspan x="80" dy="0">Observe, prepare, update, verify, and keep a handover record</tspan>
  </text>
  <rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="108.0" y="310" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">
    <tspan x="108.0" dy="0">Observe</tspan>
  </text>
  <text x="108.0" y="405" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="108.0" dy="0">Visitor journeys</tspan>
    <tspan x="108.0" dy="31">and notices</tspan>
  </text>
  <text x="108.0" y="505" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="108.0" dy="0">Recent content</tspan>
    <tspan x="108.0" dy="31">and changes</tspan>
  </text>
  <rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
  <text x="477.0" y="310" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">
    <tspan x="477.0" dy="0">Prepare</tspan>
  </text>
  <text x="477.0" y="405" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="477.0" dy="0">Backup and</tspan>
    <tspan x="477.0" dy="31">restoration method</tspan>
  </text>
  <text x="477.0" y="505" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="477.0" dy="0">Scope affected</tspan>
    <tspan x="477.0" dy="31">by this change</tspan>
  </text>
  <rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <text x="846.0" y="310" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">
    <tspan x="846.0" dy="0">Execute</tspan>
  </text>
  <text x="846.0" y="405" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="846.0" dy="0">Test or</tspan>
    <tspan x="846.0" dy="31">maintenance window</tspan>
  </text>
  <text x="846.0" y="505" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="846.0" dy="0">Update by</tspan>
    <tspan x="846.0" dy="31">functional group</tspan>
  </text>
  <rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
  <text x="1215.0" y="310" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">
    <tspan x="1215.0" dy="0">Verify</tspan>
  </text>
  <text x="1215.0" y="405" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="1215.0" dy="0">Repeat the</tspan>
    <tspan x="1215.0" dy="31">original action</tspan>
  </text>
  <text x="1215.0" y="505" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="1215.0" dy="0">Record results</tspan>
    <tspan x="1215.0" dy="31">and action items</tspan>
  </text>
  <text x="80" y="803" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">
    <tspan x="80" dy="0">A website is easier to hand over continuously when maintenance has an owner and a recorded result.</tspan>
  </text>
  <text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">
    <tspan x="1520" dy="0">Original diagram by Mokaair</tspan>
  </text>
</svg>
