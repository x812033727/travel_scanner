<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">仙台松島兩天一夜的移動順序 / Two days in Sendai and Matsushima</title>
<desc id="desc">左半是 Day 1 的仙台市區：るーぷる仙台是一條單向環線，一圈約 70 分，仙台駅前 9:00 首班、16:00 末班，從仙台駅前 16 番のりば 出發，依序經過瑞鳳殿前（瑞鳳殿 570 円、下車徒步 7 分）、博物館・国際センター前（仙台市博物館 460 円、徒步 3 分）、仙台城跡（仙台城見聞館免費）、大崎八幡宮前（免費）、メディアテーク前與定禅寺通市役所前，再回到仙台駅前；環線是示意圖，不是實際路線形狀。右半是 Day 2 的松島：仙台駅搭 JR 仙石線約 40 分到松島海岸駅，走約 10 到 15 分到中央觀光棧橋搭遊覽船（航程 50 分、1,500 円），再走五大堂（免費）、瑞巖寺（1,000 円、距站徒步 10 分）、圓通院（500 円、距站徒步 5 分），最後是福浦橋（300 円）。徒步分鐘數是各官網寫的從松島海岸駅走過去的時間，不是點到點的距離。</desc>
<defs>
<marker id="arrowT" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#0D6B68"/></marker>
<marker id="arrowB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#2F6F9F"/></marker>
</defs>
