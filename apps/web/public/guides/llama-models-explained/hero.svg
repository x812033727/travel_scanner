<title id="title">下載模型權重之前，先讀授權 / Download the weights, then read the licence</title>
<desc id="desc">一張幾何插圖。左邊是三張層疊的圓角卡片，代表可以下載的模型版本；一支箭頭指向中央的筆記型電腦，螢幕裡有一個向下的下載箭頭；再一支箭頭指向右邊的文件，文件上有一行行條款，右下角蓋著一個打勾的核可章。畫面下方寫著「開放權重，先看授權」。</desc>
