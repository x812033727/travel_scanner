<text x="60" y="84" font-size="18" fill="#5C6B6B">Llama release timeline and Meta current flagship models</text>
<text x="60" y="116" font-size="17" fill="#5C6B6B">日期為官方授權文件標示的版本日期｜查證日 2026 年 9 月 14 日</text>
