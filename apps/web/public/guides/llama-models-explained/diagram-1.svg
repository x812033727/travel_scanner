<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">Llama 版本時序與 Meta 目前的主力模型 / Llama release timeline and Meta current flagship models</title>
<desc id="desc">依年份分成四欄的時間軸。2023 年欄是 Llama 2，版本日期 2023 年 7 月 18 日，是社群授權的起點。2024 年欄由上而下是 Llama 3，2024 年 4 月 18 日，8B 與 70B；Llama 3.1，2024 年 7 月 23 日，8B、70B、405B；Llama 3.2，2024 年 9 月 25 日，1B 與 3B 純文字、11B 與 90B 視覺；Llama 3.3，2024 年 12 月 6 日，70B 純文字、上下文 128K。2025 年欄是 Llama 4，2025 年 4 月 5 日，Scout 上下文 10M、Maverick 上下文 1M。2026 年欄是 Muse Spark，2026 年 4 月 8 日，未釋出權重只有 API；以及 Muse Glimmer，2026 年 8 月，30B、Apache 2.0。深綠框是可以下載權重的 Llama，橘框是 Meta 目前的主力 Muse 系列。資料查證日為 2026 年 9 月 14 日。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>
