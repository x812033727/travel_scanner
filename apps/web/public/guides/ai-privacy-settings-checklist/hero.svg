<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 隱私設定檢查清單 / AI privacy settings checklist</title>
  <desc id="desc">插圖：米色底上有一個深綠色的大對話泡泡，泡泡尾巴指向左下方；泡泡裡左邊掛著一個橘色的鎖頭，鎖身是圓角矩形、上面有拱形的鎖環與一個鑰匙孔；右邊是一個白色的開關，圓形滑塊撥在左側的關閉位置；兩者之間有三條淺色的文字線，代表對話內容。泡泡右上角有一個小小的藍色圓點裝飾。下方只有一行字：AI 隱私設定檢查清單。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft ground shadow -->
  <ellipse cx="800" cy="690" rx="560" ry="34" fill="#E3DDD2"/>

  <!-- speech bubble with tail to the lower left -->
  <path d="M 370 150 Q 370 120 400 120 L 1200 120 Q 1230 120 1230 150 L 1230 560 Q 1230 590 1200 590 L 560 590 L 430 680 L 470 590 L 400 590 Q 370 590 370 560 Z" fill="#0D6B68" stroke="#102A2B" stroke-width="8" stroke-linejoin="round"/>

  <!-- padlock: shackle -->
  <path d="M 545 345 L 545 290 Q 545 210 625 210 Q 705 210 705 290 L 705 345" fill="none" stroke="#102A2B" stroke-width="30" stroke-linecap="round"/>
  <path d="M 545 345 L 545 290 Q 545 210 625 210 Q 705 210 705 290 L 705 345" fill="none" stroke="#F7F1E8" stroke-width="16" stroke-linecap="round"/>
  <!-- padlock: body -->
  <rect x="490" y="330" width="270" height="200" rx="28" fill="#D97A2B" stroke="#102A2B" stroke-width="8"/>
  <!-- keyhole -->
  <circle cx="625" cy="410" r="26" fill="#102A2B"/>
  <rect x="611" y="420" width="28" height="60" rx="10" fill="#102A2B"/>

  <!-- text lines in the middle of the bubble -->
  <rect x="820" y="300" width="230" height="18" rx="9" fill="#E3F0EF"/>
  <rect x="820" y="356" width="170" height="18" rx="9" fill="#E3F0EF"/>
  <rect x="820" y="412" width="210" height="18" rx="9" fill="#E3F0EF"/>

  <!-- toggle switch, knob on the left (off) -->
  <rect x="880" y="470" width="260" height="110" rx="55" fill="#FFFFFF" stroke="#102A2B" stroke-width="8"/>
  <circle cx="937" cy="525" r="40" fill="#5C6B6B"/>

  <!-- small accent dot -->
  <circle cx="1300" cy="120" r="34" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="1300" cy="120" r="10" fill="#2F6F9F"/>

  <!-- single line of text -->
  <text x="800" y="800" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">AI 隱私設定檢查清單</text>
</svg>
