<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AI 隱私設定檢查清單：ChatGPT、Claude、Gemini 各四個開關 / AI privacy settings checklist</title>
  <desc id="desc">檢查清單，三欄並列、每欄四列，由上到下編號 1 到 4。左欄 ChatGPT：1 關掉訓練，Settings → Data Controls → Improve the model for everyone（預設開）；2 暫時對話，新對話右上角 Temporary 按鈕，不進歷史、不用記憶，保留最多 30 天；3 記憶，Settings → Personalization → Memory，逐條刪，或 Delete and turn off memory；4 匯出與刪除，Data Controls → Export data，連結 24 小時，Account → Delete account，30 天內刪除。中欄 Claude：1 關掉訓練，Settings → Privacy → Help improve our AI models（註冊時選一次）；2 無痕對話，新對話右上角的幽靈圖示，不進歷史、不用記憶、不訓練，保留 30 天；3 記憶，Settings → Memory → Topics，逐條編輯或刪除，Pause 或 Reset；4 匯出與刪除，Privacy → Export data，連結 24 小時，允許訓練保留 5 年、不允許 30 天。右欄 Gemini：1 關掉活動記錄，Settings &amp; help → Activity → Keep Activity，預設開、自動刪除預設 18 個月、關掉仍存 72 小時；2 暫時對話，New chat 旁的 Temporary chat，限個人帳號，保留 72 小時；3 記憶，Settings &amp; help → Personal Intelligence → Memory，要刪就到活動記錄刪對話；4 匯出與刪除，takeout.google.com 勾 Gemini Apps，連結 7 天，活動記錄頁刪，人工審閱過的保留 3 年。底部兩行：關掉訓練不等於不存在伺服器，刪掉的對話 ChatGPT、Claude 30 天內移除，Claude 允許訓練保留 5 年，Gemini 關掉活動記錄仍存 72 小時、人工審閱 3 年；公司或學校帳號預設不訓練，但管理員或擁有者可以取得對話，選單名稱與位置以各家官網為準。2026 年 9 月依官網查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">AI 隱私設定檢查清單：三家各四個開關（2026 年 9 月依官網查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Privacy settings checklist: ChatGPT, Claude and Gemini, four switches each</text>

  <!-- ===== column 1: ChatGPT (blue) ===== -->
