<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">先定用途，再用三條線檢查候選圖</title>
<desc id="desc">文字生圖的驗收分成需求、畫面與用途三條檢查線，再回到候選圖調整</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">先定用途，再用三條線檢查候選圖</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Text-to-Image｜漂亮只是其中一項觀察</text><path d="M415 420H570" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M920 420H1000V210H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M920 420H1050V440H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><path d="M920 420H1000V670H1110" fill="none" stroke="#5C6B6B" stroke-width="5" marker-end="url(#arrow)"/><rect x="75" y="340" width="340" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="245" y="412" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">文字描述</text><text x="245" y="462" text-anchor="middle" font-size="25" fill="#5C6B6B">主體、位置與風格</text><rect x="570" y="340" width="350" height="160" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="745" y="412" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">候選圖</text><text x="745" y="462" text-anchor="middle" font-size="25" fill="#5C6B6B">等待具體驗收</text><rect x="1110" y="140" width="400" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="202" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">需求</text><text x="1310" y="252" text-anchor="middle" font-size="25" fill="#5C6B6B">位置與指定元素</text><rect x="1110" y="370" width="400" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">畫面</text><text x="1310" y="482" text-anchor="middle" font-size="25" fill="#5C6B6B">透視、細節與文字</text><rect x="1110" y="600" width="400" height="140" rx="22" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1310" y="662" text-anchor="middle" font-size="32" font-weight="700" fill="#102A2B">用途</text><text x="1310" y="712" text-anchor="middle" font-size="25" fill="#5C6B6B">裁切、留白與標示</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
