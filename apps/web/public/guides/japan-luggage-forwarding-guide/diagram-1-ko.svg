<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 수하물 택배 이용법: 도시 간 가벼운 이동, 호텔 대리 수령과 공항 수령: 판단 절차</title><desc>순서대로 확인: 대리 수령 확인, 날짜 대조, 작은 가방 준비, 운송장 보관. 편집부가 정리한 도식이며 지도나 실측 시간 자료가 아닙니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하고, 한 번에 다 마칠 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">대리 수령 확인</text><text x="103" y="497" fill="#f4f0e5" font-size="23">수령인 확인</text><text x="103" y="573" fill="#f4dc9d" font-size="26">숙소 답변 먼저</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">날짜 대조</text><text x="473" y="497" fill="#f4f0e5" font-size="23">날짜 확인</text><text x="473" y="573" fill="#f4dc9d" font-size="26">배송업체 답변 기준</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">작은 가방 준비</text><text x="843" y="497" fill="#f4f0e5" font-size="23">필수품 챙기기</text><text x="843" y="573" fill="#f4dc9d" font-size="26">필수품은 곁에</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">운송장 보관</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">배송 상태 계속 확인</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">도착 후 재확인</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집 도식</text></g></svg>
