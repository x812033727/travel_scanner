<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本行李宅配怎么安排：跨城轻装、酒店代收与机场取件：判断流程</title><desc>依次检查：确认代收、核对日期、准备小包、保存单据。编辑整理，并非地图或实测时间。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先后顺序 · 实用流程</text><text x="100" y="175" fill="#576968" font-size="25">按你的条件取舍，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">确认代收</text><text x="103" y="497" fill="#f4f0e5" font-size="23">核实收件方</text><text x="103" y="573" fill="#f4dc9d" font-size="26">先获住宿方回复</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">核对日期</text><text x="473" y="497" fill="#f4f0e5" font-size="23">确认日期</text><text x="473" y="573" fill="#f4dc9d" font-size="26">以配送方答复为准</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">准备小包</text><text x="843" y="497" fill="#f4f0e5" font-size="23">装好必需品</text><text x="843" y="573" fill="#f4dc9d" font-size="26">必需品留身边</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">保存单据</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">持续追踪</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">抵达后再核对</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 编辑自制示意 / 编辑示意图</text></g></svg>
