<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">週回顧的迴圈：AI 只負責中間那一段 / Weekly review loop</title>
  <desc id="desc">一個五步驟的迴圈。第一格「收集」由你做：貼上本週完成、本週沒完成、行事曆與待辦，固定 4 份輸入，缺的寫「無」。第二格「整理」由 AI 做：只把紀錄排成固定格式，輸出 3 個重點、卡住的地方與 5 條下週候選，不確定就寫「資料不足」。第三格「決定」回到你：從 5 條候選圈出 3 件事，AI 不替你挑也不打分數。第四格「排進下週」：3 件事變成時段草稿與含截止日的待辦，重複任務可設每天、每週或每月。第五格「下次回顧」：用同一份範本與同樣 4 份輸入，格式一致才比得出變化，箭頭再回到第一格。底部註明 2026 年 9 月查官網的自動化上限：ChatGPT 同時啟用 3 個（Free 與 Go）、5 個（Plus）、10 個（Business 與 Edu）、15 個（Pro 與 Enterprise）；Gemini 排程動作同時最多 10 個；Claude Cowork 排程任務限付費方案。</desc>

  <rect width="1600" height="900" fill="#F7F1E8"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5C6B6B"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">週回顧的迴圈：AI 只負責中間那一段</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Weekly review loop — collect, let AI sort, decide yourself, schedule, repeat</text>

  <!-- 1 收集 -->
  <rect x="60" y="165" width="440" height="220" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="280" y="207" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">1　收集（你做）</text>
  <text x="280" y="250" font-size="17" fill="#102A2B" text-anchor="middle">本週完成｜本週沒完成</text>
  <text x="280" y="282" font-size="17" fill="#102A2B" text-anchor="middle">行事曆｜待辦清單</text>
  <text x="280" y="314" font-size="17" fill="#5C6B6B" text-anchor="middle">固定 4 份輸入，缺的寫「無」</text>

  <!-- 2 整理 -->
  <rect x="580" y="165" width="440" height="220" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="800" y="207" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">2　整理（AI 做）</text>
  <text x="800" y="250" font-size="17" fill="#102A2B" text-anchor="middle">只把紀錄排成固定格式</text>
  <text x="800" y="282" font-size="17" fill="#102A2B" text-anchor="middle">輸出 3 個重點、卡住的地方</text>
  <text x="800" y="314" font-size="17" fill="#102A2B" text-anchor="middle">與 5 條下週候選</text>
  <text x="800" y="346" font-size="17" fill="#5C6B6B" text-anchor="middle">不確定就寫「資料不足」</text>

  <!-- 3 決定 -->
  <rect x="1100" y="165" width="440" height="220" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1320" y="207" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">3　決定（你做）</text>
  <text x="1320" y="250" font-size="17" fill="#102A2B" text-anchor="middle">從 5 條候選圈出 3 件事</text>
  <text x="1320" y="282" font-size="17" fill="#102A2B" text-anchor="middle">AI 不替你挑，也不打分數</text>
  <text x="1320" y="314" font-size="17" fill="#B8442D" text-anchor="middle">決定權不外包</text>

  <!-- 4 排進下週 -->
  <rect x="1100" y="470" width="440" height="220" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1320" y="512" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">4　排進下週</text>
  <text x="1320" y="555" font-size="17" fill="#102A2B" text-anchor="middle">3 件事變成時段草稿</text>
  <text x="1320" y="587" font-size="17" fill="#102A2B" text-anchor="middle">與含截止日的待辦</text>
  <text x="1320" y="619" font-size="17" fill="#5C6B6B" text-anchor="middle">重複任務設每天／每週／每月</text>

  <!-- 5 下次回顧 -->
  <rect x="580" y="470" width="440" height="220" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="800" y="512" font-size="20" font-weight="700" fill="#102A2B" text-anchor="middle">5　下次回顧</text>
  <text x="800" y="555" font-size="17" fill="#102A2B" text-anchor="middle">同一份範本、同樣 4 份輸入</text>
  <text x="800" y="587" font-size="17" fill="#102A2B" text-anchor="middle">格式一致才比得出變化</text>
  <text x="800" y="619" font-size="17" fill="#5C6B6B" text-anchor="middle">排程只負責把它推到你面前</text>

  <!-- arrows -->
  <path d="M 512 275 H 566" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1032 275 H 1086" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1320 397 V 456" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1088 580 H 1034" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 568 580 H 300 V 399" stroke="#5C6B6B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="640" font-size="17" fill="#5C6B6B" text-anchor="middle">一週後回到第 1 格，格式不變</text>

  <!-- 底部：自動化上限 -->
  <rect x="60" y="725" width="1480" height="85" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="800" y="760" font-size="17" fill="#102A2B" text-anchor="middle">自動化上限（2026 年 9 月查官網）：ChatGPT 同時啟用 3（Free、Go）／5（Plus）／10（Business、Edu）／15（Pro、Enterprise）</text>
  <text x="800" y="790" font-size="17" fill="#102A2B" text-anchor="middle">Gemini 排程動作同時最多 10 個；Claude Cowork 排程任務限付費方案（Pro、Max、Team、Enterprise）</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
