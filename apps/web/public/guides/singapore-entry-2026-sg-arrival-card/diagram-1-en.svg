    <text x="560" y="562" font-size="18" fill="#102A2B">Age 18+</text>
    <text x="560" y="594" font-size="18" fill="#102A2B">Away from Singapore ≥48h</text>
    <text x="560" y="626" font-size="18" fill="#102A2B">Not arriving from Malaysia</text>
  </g>

  <rect x="770" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"></rect>
