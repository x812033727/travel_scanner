  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"></path>
    </marker>
  </defs>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">Singapore Entry in Five Steps: SGAC, Immigration, Customs</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Entering Singapore: SG Arrival Card, Changi immigration and customs</text>


