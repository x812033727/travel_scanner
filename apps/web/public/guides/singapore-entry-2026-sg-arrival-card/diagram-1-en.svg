<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Singapore Entry in Five Steps: SGAC, Changi Immigration, Customs / Entering Singapore: SG Arrival Card, immigration and customs</title>
  <desc id="desc">Five stations from left to right. First, complete the free SG Arrival Card on ICA's official website or MyICA App within 3 days before arrival, including arrival day; paid submission websites are unaffiliated with ICA. Second, fly. Third, Changi immigration: foreign travelers aged 6 and above use automated lanes, but must still present a passport on entry. Fourth, customs has a Green Channel (nothing to declare, or payment already completed online through Customs@SG) and a Red Channel (over duty-free allowances or carrying cigarettes). Duty-free liquor requires being at least 18, having been away from Singapore for at least 48 hours, and not arriving from Malaysia. Cigarettes have no duty-free allowance. GST relief is SGD 500 after 48 hours or more abroad, or SGD 100 after less than 48 hours. Fifth, exit customs. Prohibited items along the bottom are chewing gum, vapes (TVCA fine of up to SGD 10,000) and chewing tobacco.</desc>
