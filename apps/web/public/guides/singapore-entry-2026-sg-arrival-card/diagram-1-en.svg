    <text x="1230" y="282" font-size="17" fill="#5C6B6B">Red Channel</text>
    <text x="1230" y="328" font-size="18" fill="#102A2B">Over duty-free limit</text>
    <text x="1230" y="356" font-size="18" fill="#102A2B">Or carrying cigarettes</text>
  </g>


  <rect x="1380" y="220" width="180" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
