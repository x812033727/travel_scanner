    <text x="950" y="584" font-size="32" font-weight="700" fill="#B8442D" style="font-size: 32px;">0 duty-free allowance</text>
    <text x="950" y="630" font-size="17" fill="#5C6B6B">No duty-free allowance or GST relief</text>
  </g>

  <rect x="1160" y="480" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="1360" y="520" font-size="22" font-weight="700" fill="#102A2B">GST relief</text>
    <text x="1360" y="566" font-size="20" fill="#102A2B">Away ≥48h: SGD 500</text>
    <text x="1360" y="602" font-size="20" fill="#102A2B">Under 48h: SGD 100</text>
    <text x="1360" y="636" font-size="17" fill="#5C6B6B">Relief on goods value</text>
