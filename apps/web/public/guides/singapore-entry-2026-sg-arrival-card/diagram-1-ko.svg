<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">싱가포르 입국의 다섯 단계: SGAC·창이공항 입국 심사·세관 / 싱가포르 입국: SG Arrival Card·입국 심사·세관</title>
  <desc id="desc">왼쪽부터 오른쪽으로 다섯 단계다. 첫째, 도착 전 3일 이내(도착일 포함)에 ICA 공식 사이트 또는 MyICA App에서 SG Arrival Card를 무료로 작성한다. 유료 작성 대행 사이트는 ICA와 무관하다. 둘째, 이륙한다. 셋째, 창이공항 입국 심사에서 6세 이상 외국인 여행객은 자동 통로를 이용하며, 입국 시에는 여전히 여권을 제시해야 한다. 넷째, 세관은 녹색 통로(신고할 물품이 없거나 Customs@SG로 온라인 세금 납부 완료)와 적색 통로(면세 한도 초과 또는 담배 소지)로 나뉜다. 주류 면세는 만 18세 이상, 싱가포르를 떠난 지 48시간 이상, 말레이시아에서 입국하지 않을 것이라는 조건을 충족해야 한다. 담배에는 면세 한도가 없다. GST 감면은 출국 후 48시간 이상이면 500 싱가포르달러, 48시간 미만이면 100 싱가포르달러다. 다섯째, 세관을 통과한다. 아래에는 금지 품목인 껌, 전자담배(TVCA에 따라 최대 벌금 10,000 싱가포르달러), 씹는담배가 표시되어 있다.</desc>
