    <text x="730" y="342" font-size="17" fill="#5C6B6B">自动通道</text>
    <text x="730" y="386" font-size="20" fill="#102A2B">入境仍要出示护照</text>
  </g>


  <rect x="920" y="160" width="420" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4" />
  <text x="1130" y="198" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">海关</text>
  <rect x="940" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4" />
  <g text-anchor="middle">
    <text x="1030" y="254" font-size="22" font-weight="700" fill="#2E7D5B">绿色通道</text>
    <text x="1030" y="282" font-size="17" fill="#5C6B6B">绿色通道</text>
    <text x="1030" y="328" font-size="18" fill="#102A2B">无物品需申报</text>
    <text x="1030" y="356" font-size="18" fill="#102A2B">或已在线缴清</text>
  </g>
  <rect x="1140" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4" />
  <g text-anchor="middle">
