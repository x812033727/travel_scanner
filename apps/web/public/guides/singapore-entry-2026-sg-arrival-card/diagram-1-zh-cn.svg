<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">新加坡入境五关：SGAC、樟宜入境审查、海关 / 入境新加坡：SG Arrival Card、入境审查与海关</title>
  <desc id="desc">从左到右五站。一、抵达前 3 天内（含抵达日）在 ICA 官网或 MyICA App 免费填 SG Arrival Card，收费代填网站与 ICA 无关。二、起飞。三、樟宜入境审查：6 岁以上外国旅客走自动通道，入境仍要出示护照。四、海关分绿色通道（没有物品需要申报，或已用 Customs@SG 在线缴清税款）与红色通道（超过免税额度或带香烟）；酒类免税须年满 18 岁、离开新加坡满 48 小时、不是从马来西亚入境；香烟没有免税额度；GST 减免为离境 48 小时以上 500 新币、未满 48 小时 100 新币。五、出关。底部是违禁品：口香糖、电子烟（TVCA 最高罚 10,000 新币）、嚼烟。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B" />
    </marker>
  </defs>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">新加坡入境五关：SGAC、入境审查、海关</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">入境新加坡：SG Arrival Card、樟宜入境审查与海关</text>


  <g font-size="17" fill="#5C6B6B" text-anchor="middle">
