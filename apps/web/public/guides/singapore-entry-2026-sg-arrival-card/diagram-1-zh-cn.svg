  </g>


  <rect x="1380" y="220" width="180" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
  <g text-anchor="middle">
    <text x="1470" y="280" font-size="28" font-weight="700" fill="#0D6B68">出关</text>
    <text x="1470" y="314" font-size="18" fill="#5C6B6B">出口</text>
  </g>


  <g stroke="#2F6F9F" stroke-width="4" fill="none">
