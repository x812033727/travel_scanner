    <line x1="950" y1="450" x2="950" y2="474" marker-end="url(#arrow)" />
    <line x1="1360" y1="450" x2="1360" y2="474" marker-end="url(#arrow)" />
  </g>


  <rect x="380" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4" />
  <g text-anchor="middle">
    <text x="560" y="520" font-size="22" font-weight="700" fill="#102A2B">酒类免税</text>
    <text x="560" y="562" font-size="18" fill="#102A2B">年满 18 岁</text>
    <text x="560" y="594" font-size="18" fill="#102A2B">离开新加坡满 48 小时</text>
    <text x="560" y="626" font-size="18" fill="#102A2B">不是从马来西亚入境</text>
  </g>

  <rect x="770" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4" />
  <g text-anchor="middle">
    <text x="950" y="520" font-size="22" font-weight="700" fill="#102A2B">香烟</text>
    <text x="950" y="584" font-size="40" font-weight="700" fill="#B8442D">0 免税</text>
    <text x="950" y="630" font-size="17" fill="#5C6B6B">没有免税额度，也没有 GST 减免</text>
  </g>

  <rect x="1160" y="480" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" />
