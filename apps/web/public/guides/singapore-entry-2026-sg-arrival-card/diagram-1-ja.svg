<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">シンガポール入国の五段階：SGAC、チャンギ入国審査、税関 / シンガポール入国：SG Arrival Card、入国審査、税関</title>
  <desc id="desc">左から右へ五つの段階。一、到着前 3 日以内（到着日を含む）に ICA 公式サイトまたは MyICA App で SG Arrival Card を無料提出。有料代行サイトは ICA と無関係です。二、離陸。三、チャンギ空港の入国審査：6 歳以上の外国人旅行者は自動化ゲートを利用し、入国時は引き続きパスポートを提示します。四、税関は緑の通路（申告するものがない、または Customs@SG でオンライン納税済み）と赤の通路（免税枠を超える、または紙巻きたばこを持ち込む）に分かれます。酒類の免税条件は、18 歳以上、シンガポールを離れてから 48 時間以上経過、マレーシアからの入国ではないこと。紙巻きたばこには免税枠がありません。GST 減免は国外滞在 48 時間以上なら 500 シンガポールドル、48 時間未満なら 100 シンガポールドルです。五、税関を出ます。下部には禁止品として、ガム、電子たばこ（TVCA により最高 10,000 シンガポールドルの罰金）、噛みたばこを示しています。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"></path>
    </marker>
  </defs>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">シンガポール入国の五段階：SGAC、入国審査、税関</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">シンガポール入国：SG Arrival Card、チャンギ入国審査、税関</text>


  <g font-size="17" fill="#5C6B6B" text-anchor="middle">
    <line x1="40" y1="138" x2="340" y2="138" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"></line>
    <text x="190" y="124">出発前</text>
    <line x1="380" y1="138" x2="540" y2="138" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round"></line>
    <text x="460" y="124">出発日・フライト</text>
    <line x1="580" y1="138" x2="1560" y2="138" stroke="#D97A2B" stroke-width="6" stroke-linecap="round"></line>
    <text x="1070" y="124">チャンギ空港到着</text>
  </g>


  <g stroke="#102A2B" stroke-width="4" fill="none">
    <line x1="342" y1="285" x2="374" y2="285" marker-end="url(#arrow)"></line>
    <line x1="542" y1="285" x2="574" y2="285" marker-end="url(#arrow)"></line>
    <line x1="882" y1="285" x2="914" y2="285" marker-end="url(#arrow)"></line>
    <line x1="1342" y1="285" x2="1374" y2="285" marker-end="url(#arrow)"></line>
  </g>


  <rect x="40" y="160" width="300" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="190" y="206" font-size="28" font-weight="700" fill="#0D6B68">到着前 3 日以内</text>
    <text x="190" y="238" font-size="18" fill="#102A2B">（到着日を含む）</text>
    <text x="190" y="288" font-size="24" font-weight="700" fill="#102A2B">SGAC を無料提出</text>
    <text x="190" y="316" font-size="17" fill="#5C6B6B">SG Arrival Card</text>
    <text x="190" y="362" font-size="18" fill="#102A2B">ICA 公式サイトか MyICA App</text>
  </g>
  <line x1="190" y1="410" x2="190" y2="440" stroke="#B8442D" stroke-width="4" stroke-dasharray="8 6"></line>
  <rect x="40" y="440" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="190" y="478" font-size="20" font-weight="700" fill="#B8442D">有料代行サイトは ICA と無関係</text>
    <text x="190" y="508" font-size="17" fill="#5C6B6B">有料代行業者は ICA ではありません</text>
  </g>


  <rect x="380" y="220" width="160" height="130" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="460" y="280" font-size="28" font-weight="700" fill="#2F6F9F">離陸</text>
    <text x="460" y="314" font-size="18" fill="#5C6B6B">出発</text>
  </g>


  <rect x="580" y="160" width="300" height="250" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="730" y="204" font-size="26" font-weight="700" fill="#102A2B">チャンギ入国審査</text>
    <text x="730" y="232" font-size="17" fill="#5C6B6B">チャンギ入国審査</text>
    <text x="730" y="282" font-size="20" fill="#102A2B">外国人旅行者は 6 歳以上</text>
    <text x="730" y="316" font-size="24" font-weight="700" fill="#0D6B68">自動化ゲートへ</text>
    <text x="730" y="342" font-size="17" fill="#5C6B6B">自動化ゲート</text>
    <text x="730" y="386" font-size="20" fill="#102A2B">入国時はパスポート提示が必要</text>
  </g>


  <rect x="920" y="160" width="420" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect>
  <text x="1130" y="198" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">税関</text>
  <rect x="940" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="1030" y="254" font-size="22" font-weight="700" fill="#2E7D5B">緑の通路</text>
    <text x="1030" y="282" font-size="17" fill="#5C6B6B">緑の通路</text>
    <text x="1030" y="328" font-size="18" fill="#102A2B">申告するものなし</text>
    <text x="1030" y="356" font-size="18" fill="#102A2B">またはネット納税済み</text>
  </g>
  <rect x="1140" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="1230" y="254" font-size="22" font-weight="700" fill="#B8442D">赤の通路</text>
    <text x="1230" y="282" font-size="17" fill="#5C6B6B">赤の通路</text>
    <text x="1230" y="328" font-size="18" fill="#102A2B">免税枠を超える</text>
    <text x="1230" y="356" font-size="15" fill="#102A2B" style="font-size: 15px;">または紙巻きたばこ持込</text>
  </g>


  <rect x="1380" y="220" width="180" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="1470" y="280" font-size="28" font-weight="700" fill="#0D6B68">税関を出る</text>
    <text x="1470" y="314" font-size="18" fill="#5C6B6B">出口</text>
  </g>


  <g stroke="#2F6F9F" stroke-width="4" fill="none">
    <line x1="1130" y1="410" x2="1130" y2="450"></line>
    <line x1="560" y1="450" x2="1360" y2="450"></line>
    <line x1="560" y1="450" x2="560" y2="474" marker-end="url(#arrow)"></line>
    <line x1="950" y1="450" x2="950" y2="474" marker-end="url(#arrow)"></line>
    <line x1="1360" y1="450" x2="1360" y2="474" marker-end="url(#arrow)"></line>
  </g>


  <rect x="380" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="560" y="520" font-size="22" font-weight="700" fill="#102A2B">酒類免税</text>
    <text x="560" y="562" font-size="18" fill="#102A2B">18 歳以上</text>
    <text x="560" y="594" font-size="18" fill="#102A2B">シンガポール国外に 48 時間以上</text>
    <text x="560" y="626" font-size="18" fill="#102A2B">マレーシアからの入国は対象外</text>
  </g>

  <rect x="770" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="950" y="520" font-size="22" font-weight="700" fill="#102A2B">紙巻きたばこ</text>
    <text x="950" y="584" font-size="40" font-weight="700" fill="#B8442D">免税枠 0</text>
    <text x="950" y="630" font-size="17" fill="#5C6B6B">免税枠・GST 減免ともになし</text>
  </g>

  <rect x="1160" y="480" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"></rect>
  <g text-anchor="middle">
    <text x="1360" y="520" font-size="22" font-weight="700" fill="#102A2B">GST 減免</text>
    <text x="1360" y="566" font-size="18" fill="#102A2B" style="font-size: 18px;">国外滞在 48 時間以上：500 シンガポールドル</text>
    <text x="1360" y="602" font-size="20" fill="#102A2B">48 時間未満：100 シンガポールドル</text>
    <text x="1360" y="636" font-size="17" fill="#5C6B6B">物品価額に対する減免枠</text>
  </g>


  <rect x="40" y="700" width="1520" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"></rect>
  <rect x="40" y="700" width="250" height="100" rx="14" fill="#B8442D"></rect>
  <g text-anchor="middle">
    <text x="165" y="744" font-size="26" font-weight="700" fill="#FFFFFF">持込禁止品</text>
    <text x="165" y="776" font-size="18" fill="#FFFFFF">持込禁止</text>
  </g>
  <g font-size="20" fill="#102A2B" text-anchor="middle">
    <rect x="320" y="720" width="270" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"></rect>
    <text x="455" y="757">ガム</text>
    <rect x="615" y="720" width="560" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"></rect>
    <text x="895" y="757">電子たばこ · TVCA 罰金最高 <tspan font-weight="700" fill="#B8442D">10,000 シンガポールドル</tspan></text>
    <rect x="1200" y="720" width="340" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"></rect>
    <text x="1370" y="757">噛みたばこ</text>
  </g>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 作図 2026</text>
</svg>
