<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">新加坡入境五關：SGAC、樟宜入境審查、海關 / Entering Singapore: SG Arrival Card, immigration and customs</title>
  <desc id="desc">由左到右五站。一、抵達前 3 天內（含抵達日）在 ICA 官網或 MyICA App 免費填 SG Arrival Card，收費代填網站與 ICA 無關。二、起飛。三、樟宜入境審查：6 歲以上外國旅客走自動通道，入境仍要出示護照。四、海關分綠色通道（沒東西要申報，或已用 Customs@SG 線上繳清）與紅色通道（超過免稅額或帶香菸）；酒類免稅要年滿 18 歲、離開新加坡滿 48 小時、不是從馬來西亞入境；香菸沒有免稅額；GST 減免離境 48 小時以上 500 新幣、未滿 48 小時 100 新幣。五、出關。底部是禁止品：口香糖、電子菸（TVCA 最高罰 10,000 新幣）、嚼菸。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102A2B"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#102A2B">新加坡入境五關：SGAC、入境審查、海關</text>
  <text x="40" y="84" font-size="18" fill="#5C6B6B">Entering Singapore: SG Arrival Card, Changi immigration and customs</text>

  <!-- timeline -->
  <g font-size="17" fill="#5C6B6B" text-anchor="middle">
    <line x1="40" y1="138" x2="340" y2="138" stroke="#0D6B68" stroke-width="6" stroke-linecap="round"/>
    <text x="190" y="124">出發前 Before you fly</text>
    <line x1="380" y1="138" x2="540" y2="138" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round"/>
    <text x="460" y="124">出發日 Flight</text>
    <line x1="580" y1="138" x2="1560" y2="138" stroke="#D97A2B" stroke-width="6" stroke-linecap="round"/>
    <text x="1070" y="124">抵達樟宜機場 At Changi Airport</text>
  </g>

  <!-- arrows between stations -->
  <g stroke="#102A2B" stroke-width="4" fill="none">
    <line x1="342" y1="285" x2="374" y2="285" marker-end="url(#arrow)"/>
    <line x1="542" y1="285" x2="574" y2="285" marker-end="url(#arrow)"/>
    <line x1="882" y1="285" x2="914" y2="285" marker-end="url(#arrow)"/>
    <line x1="1342" y1="285" x2="1374" y2="285" marker-end="url(#arrow)"/>
  </g>

  <!-- 1 SGAC -->
  <rect x="40" y="160" width="300" height="250" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="190" y="206" font-size="28" font-weight="700" fill="#0D6B68">抵達前 3 天內</text>
    <text x="190" y="238" font-size="18" fill="#102A2B">（含抵達日）</text>
    <text x="190" y="288" font-size="24" font-weight="700" fill="#102A2B">免費填 SGAC</text>
    <text x="190" y="316" font-size="17" fill="#5C6B6B">SG Arrival Card</text>
    <text x="190" y="362" font-size="18" fill="#102A2B">ICA 官網或 MyICA App</text>
  </g>
  <line x1="190" y1="410" x2="190" y2="440" stroke="#B8442D" stroke-width="4" stroke-dasharray="8 6"/>
  <rect x="40" y="440" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="190" y="478" font-size="20" font-weight="700" fill="#B8442D">收費代填網站與 ICA 無關</text>
    <text x="190" y="508" font-size="17" fill="#5C6B6B">Paid agents are not ICA</text>
  </g>

  <!-- 2 Depart -->
  <rect x="380" y="220" width="160" height="130" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="460" y="280" font-size="28" font-weight="700" fill="#2F6F9F">起飛</text>
    <text x="460" y="314" font-size="18" fill="#5C6B6B">Depart</text>
  </g>

  <!-- 3 Immigration -->
  <rect x="580" y="160" width="300" height="250" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="730" y="204" font-size="26" font-weight="700" fill="#102A2B">樟宜入境審查</text>
    <text x="730" y="232" font-size="17" fill="#5C6B6B">Changi Immigration</text>
    <text x="730" y="282" font-size="20" fill="#102A2B">外國旅客 6 歲以上</text>
    <text x="730" y="316" font-size="24" font-weight="700" fill="#0D6B68">走自動通道</text>
    <text x="730" y="342" font-size="17" fill="#5C6B6B">Automated Lanes</text>
    <text x="730" y="386" font-size="20" fill="#102A2B">入境仍要出示護照</text>
  </g>

  <!-- 4 Customs -->
  <rect x="920" y="160" width="420" height="250" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1130" y="198" font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">海關 Customs</text>
  <rect x="940" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="1030" y="254" font-size="22" font-weight="700" fill="#2E7D5B">綠色通道</text>
    <text x="1030" y="282" font-size="17" fill="#5C6B6B">Green Channel</text>
    <text x="1030" y="328" font-size="18" fill="#102A2B">沒東西要申報</text>
    <text x="1030" y="356" font-size="18" fill="#102A2B">或已線上繳清</text>
  </g>
  <rect x="1140" y="216" width="180" height="176" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="1230" y="254" font-size="22" font-weight="700" fill="#B8442D">紅色通道</text>
    <text x="1230" y="282" font-size="17" fill="#5C6B6B">Red Channel</text>
    <text x="1230" y="328" font-size="18" fill="#102A2B">超過免稅額</text>
    <text x="1230" y="356" font-size="18" fill="#102A2B">或帶香菸</text>
  </g>

  <!-- 5 Exit -->
  <rect x="1380" y="220" width="180" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="1470" y="280" font-size="28" font-weight="700" fill="#0D6B68">出關</text>
    <text x="1470" y="314" font-size="18" fill="#5C6B6B">Exit</text>
  </g>

  <!-- connectors from customs to the three rules -->
  <g stroke="#2F6F9F" stroke-width="4" fill="none">
    <line x1="1130" y1="410" x2="1130" y2="450"/>
    <line x1="560" y1="450" x2="1360" y2="450"/>
    <line x1="560" y1="450" x2="560" y2="474" marker-end="url(#arrow)"/>
    <line x1="950" y1="450" x2="950" y2="474" marker-end="url(#arrow)"/>
    <line x1="1360" y1="450" x2="1360" y2="474" marker-end="url(#arrow)"/>
  </g>

  <!-- rule boxes -->
  <rect x="380" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="560" y="520" font-size="22" font-weight="700" fill="#102A2B">酒類免稅 Liquor</text>
    <text x="560" y="562" font-size="18" fill="#102A2B">年滿 18 歲</text>
    <text x="560" y="594" font-size="18" fill="#102A2B">離開新加坡滿 48 小時</text>
    <text x="560" y="626" font-size="18" fill="#102A2B">不是從馬來西亞入境</text>
  </g>

  <rect x="770" y="480" width="360" height="180" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="950" y="520" font-size="22" font-weight="700" fill="#102A2B">香菸 Cigarettes</text>
    <text x="950" y="584" font-size="40" font-weight="700" fill="#B8442D">0 免稅</text>
    <text x="950" y="630" font-size="17" fill="#5C6B6B">沒有免稅額，也沒有 GST 減免</text>
  </g>

  <rect x="1160" y="480" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="1360" y="520" font-size="22" font-weight="700" fill="#102A2B">GST 減免 GST relief</text>
    <text x="1360" y="566" font-size="20" fill="#102A2B">離境 48 小時以上：500 新幣</text>
    <text x="1360" y="602" font-size="20" fill="#102A2B">未滿 48 小時：100 新幣</text>
    <text x="1360" y="636" font-size="17" fill="#5C6B6B">物品價值的減免額</text>
  </g>

  <!-- prohibited band -->
  <rect x="40" y="700" width="1520" height="100" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <rect x="40" y="700" width="250" height="100" rx="14" fill="#B8442D"/>
  <g text-anchor="middle">
    <text x="165" y="744" font-size="26" font-weight="700" fill="#FFFFFF">禁止品</text>
    <text x="165" y="776" font-size="18" fill="#FFFFFF">Prohibited</text>
  </g>
  <g font-size="20" fill="#102A2B" text-anchor="middle">
    <rect x="320" y="720" width="270" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"/>
    <text x="455" y="757">口香糖 Chewing gum</text>
    <rect x="615" y="720" width="560" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"/>
    <text x="895" y="757">電子菸 Vapes · TVCA 最高罰 <tspan font-weight="700" fill="#B8442D">10,000 新幣</tspan></text>
    <rect x="1200" y="720" width="340" height="60" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"/>
    <text x="1370" y="757">嚼菸 Chewing tobacco</text>
  </g>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
