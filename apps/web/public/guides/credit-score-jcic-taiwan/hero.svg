<title id="title">聯徵信用報告怎麼查：信用評分是怎麼算出來的</title>
<desc id="desc">畫面中央是一份直立的白色圓角文件，頂端有一條深綠色的標題帶，文件內部有五條長度完全相同的橫條，由上到下分別是藍、深綠、橘、綠與灰色，代表信用報告裡的五大類資料。文件四周有四個大小相同的白色圓角方塊，各以一條短灰線連向中央的文件：左上角畫著一台螢幕，左下角畫著一個有投信口的郵筒，右上角畫著一棟有門的小房子，右下角畫著一個信封，代表線上查閱、郵局代收、臨櫃與郵寄四個調閱管道。</desc>
