<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">修好日期，也要保留商品外觀</title><desc id="desc">目標：十二月改成十月：每輪只改一件事；保留：杯身・把手・背景：未要求區域也查；退化：回原始圖重做：不覆蓋前輪結果；文字：保留可編輯圖層：人工補正另記錄</desc>
<rect width="1600" height="900" fill="#fbf1e8"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#263b38" font-weight="800">修好日期，也要保留商品外觀</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#875b3e" font-weight="800">目標</text><text x="120" y="311" font-size="54" fill="#263b38" font-weight="500">十二月改成十月</text><text x="120" y="379" font-size="54" fill="#263b38" font-weight="500">每輪只改一件事</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#875b3e" font-weight="800">保留</text><text x="855" y="311" font-size="54" fill="#263b38" font-weight="500">杯身・把手・背景</text><text x="855" y="379" font-size="54" fill="#263b38" font-weight="500">未要求區域也查</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#875b3e" font-weight="800">退化</text><text x="120" y="601" font-size="54" fill="#263b38" font-weight="500">回原始圖重做</text><text x="120" y="669" font-size="54" fill="#263b38" font-weight="500">不覆蓋前輪結果</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#875b3e" font-weight="800">文字</text><text x="855" y="601" font-size="54" fill="#263b38" font-weight="500">保留可編輯圖層</text><text x="855" y="669" font-size="54" fill="#263b38" font-weight="500">人工補正另記錄</text><text x="85" y="818" font-size="47" fill="#775b45" font-weight="500">作者補正示例；Gemini 修圖待驗</text></g></svg>