<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>일본 역 물품보관함 이용 가이드: 개찰구 안팎, 결제 증빙과 짐 찾기: 판단 순서</title><desc>돌아올 역 선택, 보관함 이용 조건 확인, 증표 보관, 일찍 짐 찾기 순으로 확인하세요. 편집부가 정리한 자료이며 지도나 실제 측정 시간을 나타내지 않습니다.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">진행 순서 · 실용적인 이용 순서</text><text x="100" y="175" fill="#576968" font-size="25">상황에 맞게 선택하세요. 한 번에 다 할 필요는 없습니다</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">돌아올 역 선택</text><text x="103" y="497" fill="#f4f0e5" font-size="23">역 고르기</text><text x="103" y="573" fill="#f4dc9d" font-size="26">되돌아가는 길 줄이기</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">보관함 조건 확인</text><text x="473" y="497" fill="#f4f0e5" font-size="23">이용 조건 읽기</text><text x="473" y="573" fill="#f4dc9d" font-size="26">시간과 크기</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">증표 잘 보관</text><text x="843" y="497" fill="#f4f0e5" font-size="23">잠금 해제 수단 보관</text><text x="843" y="573" fill="#f4dc9d" font-size="26">보관함 안에 넣지 않기</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">일찍 짐 찾기</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">짐부터 찾기</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">그다음 탑승</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 편집부 자체 제작 도식 / 편집부 도식</text></g></svg>
