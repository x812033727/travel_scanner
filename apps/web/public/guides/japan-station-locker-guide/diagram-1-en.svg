<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Japan Station Locker Guide: Inside or Outside Ticket Gates, Access Credentials, and Luggage Retrieval: Decision Process</title><desc>Check in order: choose your return station, check locker conditions, safeguard access credentials, and collect luggage early. Compiled by the editors; not a map or measured timings.</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">Step order · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">Choose what fits your needs; no need to do it all at once</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">Pick return station</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Choose station</text><text x="103" y="573" fill="#f4dc9d" font-size="26">Less backtracking</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">Check locker rules</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Read conditions</text><text x="473" y="573" fill="#f4dc9d" font-size="26">Hours and size</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">Keep access proof</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Keep access</text><text x="843" y="573" fill="#f4dc9d" font-size="26">Keep outside locker</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">Collect early</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Collect first</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">Then board</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · In-house editorial illustration / Editorial diagram</text></g></svg>
