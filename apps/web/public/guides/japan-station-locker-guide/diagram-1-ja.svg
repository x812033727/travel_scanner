<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>日本の駅ロッカー利用ガイド：改札内外・支払い控え・荷物の受け取り：判断の流れ</title><desc>順に確認：帰りの駅を選ぶ、利用条件を確認する、控えを保管する、早めに取り出す。編集部による整理であり、地図や実測時間ではありません。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5" /><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">進める順序 · 実践的な手順</text><text x="100" y="175" fill="#576968" font-size="25">条件に合わせて選択。すべて一度に行う必要なし</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50" /><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">帰りの駅を選ぶ</text><text x="103" y="497" fill="#f4f0e5" font-size="23">駅を選ぶ</text><text x="103" y="573" fill="#f4dc9d" font-size="26">引き返す距離を減らす</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61" /><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">利用条件を確認</text><text x="473" y="497" fill="#f4f0e5" font-size="23">条件を読む</text><text x="473" y="573" fill="#f4dc9d" font-size="26">時間とサイズ</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d" /><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">控えを保管</text><text x="843" y="497" fill="#f4f0e5" font-size="23">解錠手段を確保</text><text x="843" y="573" fill="#f4dc9d" font-size="26">ロッカーに入れない</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d" /><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">早めに取り出す</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">先に受け取る</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">その後に乗車</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編集部制作の模式図 / 編集部による図解</text></g></svg>
