<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif">
  <title id="title">ソウル・水西から釜山へのKTXとSRT路線図</title>
  <desc id="desc">2つの高速鉄道ルート図。KTXはソウル駅発（青緑色の線）、SRTは水西（スソ）駅発（赤茶色の線）で、天安牙山以降は同じ京釜高速線を走り、大田、東大邱、慶州（旧・新慶州）、蔚山を経て釜山へ至る。KTXのソウル〜釜山は最速2時間18分、1日74本、停車駅の多い便は3時間27分、運賃はKorail公式サイト基準。SRTの水西〜釜山は最速2時間11分、1日44本、一般室52,200ウォン・特室75,700ウォン（2026-09-01改定）。図の下部にSRT水西発の一般室運賃を記載：天安牙山11,300、大田20,100、東大邱37,000、慶州42,400、蔚山46,400、釜山52,200ウォン。釜山〜慶州間はKTX 28〜37分、SRT一般室10,100ウォン。ソウル〜慶州はKTX最速1時間59分、水西〜慶州はSRT最速1時間52分。注記：ソウル駅でSRTは買えず、水西駅にKTXは発着しない。KORAIL PASSではSRTに乗車不可。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">ソウル・水西から釜山へ：KTXとSRTの路線と最速所要時間（2026年9月確認）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">KTX from Seoul Station, SRT from Suseo Station: fastest journey times and SRT standard-class fares</text>

  <!-- summary boxes (widened for generous margins) -->
  <rect x="570" y="108" width="470" height="118" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="805" y="144" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">KTX（Korail）ソウル→釜山 最速2時間18分</text>
  <text x="805" y="174" font-size="15" fill="#0B4F4D" text-anchor="middle">1日74本・停車駅が多い便は3時間27分</text>
  <text x="805" y="202" font-size="15" fill="#0B4F4D" text-anchor="middle">運賃はKorail公式サイト基準・KORAIL PASS利用可</text>

  <rect x="1070" y="108" width="470" height="118" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1305" y="144" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">SRT（SR）水西→釜山 最速2時間11分</text>
  <text x="1305" y="174" font-size="15" fill="#8A2E1D" text-anchor="middle">1日44本・一般室52,200ウォン・特室75,700ウォン</text>
  <text x="1305" y="202" font-size="15" fill="#8A2E1D" text-anchor="middle">運賃2026-09-01改定・KORAIL PASS利用不可</text>

  <!-- legend -->
  <path d="M 60 136 L 122 136" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <text x="136" y="142" font-size="16" fill="#102A2B">KTX（Korail）</text>
  <path d="M 290 136 L 352 136" stroke="#B8442D" stroke-width="10" stroke-linecap="round"/>
  <text x="366" y="142" font-size="16" fill="#102A2B">SRT（SR）</text>

  <!-- lines -->
  <path d="M 150 310 C 260 310, 270 460, 380 460" stroke="#0D6B68" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 380 460 L 1430 460" stroke="#0D6B68" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 150 660 C 260 660, 270 480, 380 480" stroke="#B8442D" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 380 480 L 1430 480" stroke="#B8442D" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- origin stations (labels placed cleanly away from curves) -->
  <circle cx="150" cy="310" r="20" fill="#0D6B68" stroke="#FFFFFF" stroke-width="5"/>
  <text x="60" y="246" font-size="22" font-weight="700" fill="#102A2B">ソウル駅 Seoul Station</text>
  <text x="60" y="274" font-size="15" fill="#5C6B6B">KTX発着・一部は龍山駅・幸信駅発</text>

  <circle cx="150" cy="660" r="20" fill="#B8442D" stroke="#FFFFFF" stroke-width="5"/>
  <text x="60" y="716" font-size="22" font-weight="700" fill="#102A2B">水西（スソ）駅 Suseo Station</text>
  <text x="60" y="742" font-size="15" fill="#5C6B6B">SRT発着・地下鉄3号線、水仁・盆唐線、GTX-A</text>

  <!-- trunk stations (shifted right of x=380 merge so 天安牙山 clears the SRT curve completely) -->
  <g fill="#FFFFFF" stroke="#102A2B" stroke-width="5">
    <circle cx="445" cy="470" r="16"/>
    <circle cx="625" cy="470" r="16"/>
    <circle cx="815" cy="470" r="16"/>
    <circle cx="1015" cy="470" r="16"/>
    <circle cx="1215" cy="470" r="16"/>
    <circle cx="1430" cy="470" r="22"/>
  </g>
  <g font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="445" y="524">天安牙山</text>
    <text x="625" y="404">大田</text>
    <text x="815" y="524">東大邱</text>
    <text x="1015" y="404">慶州（旧・新慶州）</text>
    <text x="1215" y="524">蔚山</text>
    <text x="1430" y="404">釜山</text>
  </g>
  <g font-size="15" fill="#5C6B6B" text-anchor="middle">
    <text x="445" y="548">Cheonan-Asan</text>
    <text x="625" y="428">Daejeon</text>
    <text x="815" y="548">Dongdaegu</text>
    <text x="1015" y="428">Gyeongju</text>
    <text x="1215" y="548">Ulsan</text>
    <text x="1430" y="428">Busan</text>
  </g>

  <!-- SRT fares row -->
  <text x="445" y="598" font-size="16" font-weight="700" fill="#8A2E1D" text-anchor="start">SRT 水西発 一般室運賃（ウォン・2026-09-01改定）</text>
  <g font-size="17" font-weight="700" fill="#8A2E1D" text-anchor="middle">
    <text x="445" y="628">11,300</text>
    <text x="625" y="628">20,100</text>
    <text x="815" y="628">37,000</text>
    <text x="1015" y="628">42,400</text>
    <text x="1215" y="628">46,400</text>
    <text x="1430" y="628">52,200</text>
  </g>

  <!-- Busan-Gyeongju bracket -->
  <path d="M 1015 656 L 1015 686 L 1430 686 L 1430 656" stroke="#2F6F9F" stroke-width="4" fill="none"/>
  <text x="1222" y="716" font-size="16" font-weight="700" fill="#1F4E73" text-anchor="middle">釜山〜慶州 KTX 28〜37分・SRT一般室 10,100ウォン</text>

  <!-- notes -->
  <text x="60" y="804" font-size="15" fill="#5C6B6B">所要時間は2026-09-01改定のKTX・SRT時刻表における最速便。ソウル→慶州はKTX最速1時間59分、水西→慶州はSRT最速1時間52分。</text>
  <text x="60" y="832" font-size="15" fill="#5C6B6B">KTXとSRTは別会社：ソウル駅でSRTは買えず、水西駅にKTXは発着しません。KORAIL PASSはKorailのKTX・ITX・ムグンファ号のみ有効（SRT不可）。</text>
  <text x="1540" y="878" font-size="15" fill="#8A8F8F" text-anchor="end">© Mokaair 制作 2026</text>
</svg>
