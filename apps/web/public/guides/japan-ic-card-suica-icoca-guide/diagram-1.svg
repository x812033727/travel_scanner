<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">日本交通 IC 卡決策樹 / Which Japan transit IC card to get</title>
  <desc id="desc">三個問題。問題一：用 iPhone 嗎？是就在錢包 App 直接新增 Suica、PASMO 或 ICOCA，用 Apple Pay 裡的卡儲值（有例外），餘額上限 20,000 日圓；不行就用 Welcome Suica Mobile，180 天有效、13 歲以上、餘額不退。否就問題二：主要去東京、關東還是關西？關西就買 ICOCA，2,000 日圓含押金 500 日圓，退卡手續費 220 日圓，只能在 ICOCA 區域內退，到東京也能刷。東京就問題三：待 28 天以內而且不想留卡？是就買 Welcome Suica，免押金、含購買日 28 天、面額 1,000 到 10,000 日圓、只收現金儲值、餘額不退、一人一張；否就買一般 Suica 或 PASMO，含押金 500 日圓、沒有效期、退卡手續費 220 日圓，餘額不到 220 日圓只退押金，Suica 在 JR 東日本窗口退、PASMO 在 PASMO 區域退。補充：沖繩的ゆいレール十張卡都能刷、可在車站儲值但沒有自動儲值，OKICA 只能在沖繩用；通用規則是不能跨區連續搭乘、餘額上限 20,000 日圓、實體卡只收現金儲值、PiTaPa 電子錢包不互通、自動儲值出了發卡區域無效。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="58" font-size="32" font-weight="700" fill="#102A2B">日本交通 IC 卡怎麼選：三個問題選出該辦的卡</text>
  <text x="60" y="92" font-size="18" fill="#5C6B6B">Which Japan transit IC card · 十張卡全國互通，一張就夠 · 2026 年 9 月查證</text>

  <!-- Q1 -->
  <polygon points="800,120 1130,175 800,230 470,175" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="170" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 1　你用 iPhone 嗎？（iPhone 8 以後）</text>
  <text x="800" y="196" font-size="16" fill="#5C6B6B" text-anchor="middle">台灣的 Android 多半沒有 FeliCa，走實體卡</text>
  <path d="M 1130 175 L 1156 175" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="165" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1150" y="112" width="430" height="126" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1365" y="142" font-size="18" font-weight="700" fill="#0B4F4D" text-anchor="middle">錢包 App 直接新增 Suica／PASMO／ICOCA</text>
  <text x="1365" y="168" font-size="15" fill="#0B4F4D" text-anchor="middle">用 Apple Pay 裡的卡儲值（有例外），餘額上限 20,000 日圓</text>
  <text x="1365" y="194" font-size="15" fill="#0B4F4D" text-anchor="middle">不行就 Welcome Suica Mobile：180 天、13 歲以上、餘額不退</text>
  <text x="1365" y="220" font-size="15" fill="#0B4F4D" text-anchor="middle">再不行就到機場買實體 Welcome Suica 用現金</text>
  <path d="M 800 232 L 800 272" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="258" font-size="16" fill="#5C6B6B">否</text>

  <!-- Q2 -->
  <polygon points="800,275 1130,330 800,385 470,330" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="325" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 2　主要去東京、關東，還是關西？</text>
  <text x="800" y="351" font-size="16" fill="#5C6B6B" text-anchor="middle">十卡互通，去哪都能刷；差別在買卡與退卡的地點</text>
  <path d="M 470 330 L 444 330" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="452" y="320" font-size="16" fill="#5C6B6B" text-anchor="end">關西</text>
  <rect x="30" y="267" width="410" height="126" rx="14" fill="#EFE6DF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="235" y="297" font-size="18" font-weight="700" fill="#4E3428" text-anchor="middle">ICOCA（JR 西日本）</text>
  <text x="235" y="323" font-size="15" fill="#4E3428" text-anchor="middle">2,000 日圓含押金 500 日圓，部分售票機另有其他面額</text>
  <text x="235" y="349" font-size="15" fill="#4E3428" text-anchor="middle">退卡手續費 220 日圓，只能在 ICOCA 區域內的車站退</text>
  <text x="235" y="375" font-size="15" fill="#4E3428" text-anchor="middle">到了東京一樣能刷；儲值只收現金</text>
  <path d="M 800 387 L 800 427" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="812" y="413" font-size="16" fill="#5C6B6B">東京</text>

  <!-- Q3 -->
  <polygon points="800,430 1130,485 800,540 470,485" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="480" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">問題 3　待 28 天以內，而且不想留卡？</text>
  <text x="800" y="506" font-size="16" fill="#5C6B6B" text-anchor="middle">只來一次、餘額花完就好的人</text>
  <path d="M 1130 485 L 1156 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1134" y="475" font-size="16" fill="#5C6B6B">是</text>
  <rect x="1160" y="422" width="410" height="126" rx="14" fill="#FBE9E4" stroke="#B8442D" stroke-width="4"/>
  <text x="1365" y="452" font-size="18" font-weight="700" fill="#8A2E1D" text-anchor="middle">Welcome Suica（JR 東日本，機場與市區買）</text>
  <text x="1365" y="478" font-size="15" fill="#8A2E1D" text-anchor="middle">免押金，含購買日 28 天，面額 1,000〜10,000 日圓</text>
  <text x="1365" y="504" font-size="15" fill="#8A2E1D" text-anchor="middle">只收現金儲值，餘額上限 20,000 日圓</text>
  <text x="1365" y="530" font-size="15" fill="#8A2E1D" text-anchor="middle">餘額不退、不能延長；一人一張</text>
  <path d="M 470 485 L 444 485" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="452" y="475" font-size="16" fill="#5C6B6B" text-anchor="end">否</text>
  <rect x="30" y="422" width="410" height="126" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="235" y="452" font-size="18" font-weight="700" fill="#1F4E73" text-anchor="middle">一般 Suica／PASMO（含押金 500 日圓）</text>
  <text x="235" y="478" font-size="15" fill="#1F4E73" text-anchor="middle">沒有效期，下次來還能用</text>
  <text x="235" y="504" font-size="15" fill="#1F4E73" text-anchor="middle">退卡手續費 220 日圓，餘額不到 220 日圓只退押金</text>
  <text x="235" y="530" font-size="15" fill="#1F4E73" text-anchor="middle">Suica 在 JR 東日本窗口退、PASMO 在 PASMO 區域退</text>

  <!-- notes -->
  <rect x="60" y="600" width="700" height="140" rx="16" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="88" y="634" font-size="19" font-weight="700" fill="#102A2B">沖繩 Okinawa 例外</text>
  <text x="88" y="666" font-size="16" fill="#102A2B">十張卡都能刷ゆいレール，車站可儲值，但沒有自動儲值、不累點</text>
  <text x="88" y="694" font-size="16" fill="#102A2B">OKICA 只能在沖繩的單軌與本島路線巴士用，出了沖繩沒用</text>
  <text x="88" y="722" font-size="16" fill="#102A2B">沖繩路線巴士能否刷 Suica，以各巴士公司公告為準</text>

  <rect x="820" y="600" width="720" height="140" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="848" y="634" font-size="19" font-weight="700" fill="#102A2B">每張卡都適用的三條規則 Rules for every card</text>
  <text x="848" y="666" font-size="16" fill="#102A2B">不能跨區連續搭乘：同一區域進站、同一區域出站</text>
  <text x="848" y="694" font-size="16" fill="#102A2B">餘額上限 20,000 日圓；實體卡只收現金儲值</text>
  <text x="848" y="722" font-size="16" fill="#102A2B">PiTaPa 的電子錢包不互通；自動儲值出了發卡區域無效</text>

  <text x="60" y="790" font-size="15" fill="#5C6B6B">金額為 2026 年 9 月依 JR 東日本、PASMO、JR 西日本、ゆいレール與 Apple 官網查證；錢包 App 與 Welcome Suica Mobile 用台灣信用卡儲值不保證每張都過，出發前先試儲。</text>
  <text x="1380" y="874" font-size="15" fill="#8A8F8F">© Mokaair 製圖 2026</text>
</svg>
