<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">量化後的三種檔案大小 / One model, three quantized sizes</title>
  <desc id="desc">三個方塊由左到右依序變小，站在同一條基準線上。左邊最大的藍色方塊裡是細密的格子，代表原始的高精度權重；中間綠色方塊小一點、格子變少；右邊深綠色方塊最小，格子只剩四格，代表位元數降低之後檔案與記憶體需求跟著變小。上方有一條橘色弧線箭頭指向最小的方塊，表示這個遞減方向，下方寫著「同一個模型，三種大小」。</desc>
