<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">模型提出要求，程式決定能做什麼</title><desc id="desc">宣告：只讀合成訂單：名稱與參數白名單；檢查：查無與非法分開：不動態執行字串；回傳：保留呼叫識別碼：完整步驟交回模型；停止：次數與時間有界：不把逾時當重送</desc><rect width="1600" height="900" fill="#edf3f6"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="61" fill="#263b38" font-weight="800">模型提出要求，程式決定能做什麼</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">宣告</text><text x="120" y="311" font-size="52" fill="#263b38" font-weight="500">只讀合成訂單</text><text x="120" y="379" font-size="52" fill="#263b38" font-weight="500">名稱與參數白名單</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">檢查</text><text x="855" y="311" font-size="52" fill="#263b38" font-weight="500">查無與非法分開</text><text x="855" y="379" font-size="52" fill="#263b38" font-weight="500">不動態執行字串</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">回傳</text><text x="120" y="601" font-size="52" fill="#263b38" font-weight="500">保留呼叫識別碼</text><text x="120" y="669" font-size="52" fill="#263b38" font-weight="500">完整步驟交回模型</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">停止</text><text x="855" y="601" font-size="52" fill="#263b38" font-weight="500">次數與時間有界</text><text x="855" y="669" font-size="52" fill="#263b38" font-weight="500">不把逾時當重送</text><text x="85" y="818" font-size="47" fill="#365477" font-weight="500">本機協定已測；真實模型待驗</text></g></svg>