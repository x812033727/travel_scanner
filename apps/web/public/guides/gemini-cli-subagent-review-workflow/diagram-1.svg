<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">引用有依據，衝突交給人判斷</title><desc id="desc">契約：檔名・行號・原文：缺證據就不接受；重複：同項同建議：合併並保留來源；衝突：同項不同建議：列出兩邊理由；交付：待人工審閱：不自動套用修正</desc>
<rect width="1600" height="900" fill="#f3f5ee"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="64" fill="#173445" font-weight="800">引用有依據，衝突交給人判斷</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#2b6577" font-weight="800">契約</text><text x="120" y="311" font-size="54" fill="#173445" font-weight="500">檔名・行號・原文</text><text x="120" y="379" font-size="54" fill="#173445" font-weight="500">缺證據就不接受</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#2b6577" font-weight="800">重複</text><text x="855" y="311" font-size="54" fill="#173445" font-weight="500">同項同建議</text><text x="855" y="379" font-size="54" fill="#173445" font-weight="500">合併並保留來源</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#2b6577" font-weight="800">衝突</text><text x="120" y="601" font-size="54" fill="#173445" font-weight="500">同項不同建議</text><text x="120" y="669" font-size="54" fill="#173445" font-weight="500">列出兩邊理由</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#b9cfd1" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#2b6577" font-weight="800">交付</text><text x="855" y="601" font-size="54" fill="#173445" font-weight="500">待人工審閱</text><text x="855" y="669" font-size="54" fill="#173445" font-weight="500">不自動套用修正</text><text x="85" y="818" font-size="47" fill="#476574" font-weight="500">定義與合併已測；模型回答待驗</text></g></svg>