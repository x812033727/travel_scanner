<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">在自己的電腦上執行模型 / Running a model on your own machine</title>
  <desc id="desc">插圖：畫面中央是一台打開的筆記型電腦，螢幕裡有一個深綠色的對話框與一個淺色的回覆框。螢幕左上方有一個向下的箭頭落進一個圓角的方塊，代表把模型檔案下載到本機的硬碟；螢幕右側有一條線連到一個圓角方框，方框裡畫著三條橫線，代表程式透過本機端點呼叫模型。筆電下方是一條底線與一行短標題「從安裝到第一次對話」。整張圖用米色底、深綠與藍色的線條，沒有任何品牌標誌或介面截圖。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D6B68"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft background shapes -->
  <circle cx="250" cy="180" r="110" fill="#E3F0EF"/>
  <circle cx="1400" cy="800" r="96" fill="#E6F0F7"/>

  <!-- download: arrow into a disk block (left) -->
  <rect x="150" y="300" width="200" height="140" rx="18" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="8"/>
  <line x1="190" y1="360" x2="310" y2="360" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="395" x2="270" y2="395" stroke="#2F6F9F" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="170" x2="250" y2="285" stroke="#0D6B68" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- laptop -->
  <rect x="520" y="230" width="560" height="360" rx="20" fill="#FFFFFF" stroke="#102A2B" stroke-width="10"/>
  <rect x="470" y="600" width="660" height="34" rx="16" fill="#102A2B"/>

  <!-- chat bubbles inside the screen -->
  <rect x="570" y="290" width="300" height="86" rx="20" fill="#0D6B68"/>
  <line x1="605" y1="322" x2="835" y2="322" stroke="#F7F1E8" stroke-width="10" stroke-linecap="round"/>
  <line x1="605" y1="350" x2="760" y2="350" stroke="#F7F1E8" stroke-width="10" stroke-linecap="round"/>

  <rect x="700" y="410" width="330" height="130" rx="20" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <line x1="735" y1="452" x2="995" y2="452" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <line x1="735" y1="482" x2="960" y2="482" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>
  <line x1="735" y1="512" x2="880" y2="512" stroke="#0D6B68" stroke-width="10" stroke-linecap="round"/>

  <!-- link out to an API window (right) -->
  <line x1="1090" y1="410" x2="1240" y2="410" stroke="#0D6B68" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1250" y="320" width="220" height="180" rx="18" fill="#FFFFFF" stroke="#D97A2B" stroke-width="8"/>
  <line x1="1290" y1="380" x2="1430" y2="380" stroke="#D97A2B" stroke-width="8" stroke-linecap="round"/>
  <line x1="1290" y1="415" x2="1390" y2="415" stroke="#D97A2B" stroke-width="8" stroke-linecap="round"/>
  <line x1="1290" y1="450" x2="1410" y2="450" stroke="#D97A2B" stroke-width="8" stroke-linecap="round"/>

  <!-- ground line -->
  <line x1="240" y1="690" x2="1360" y2="690" stroke="#5C6B6B" stroke-width="6" stroke-linecap="round"/>

  <text x="800" y="800" text-anchor="middle" font-size="54" font-weight="bold" fill="#102A2B">從安裝到第一次對話</text>
</svg>
