<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">答案、引用與搜尋建議分別核對</title><desc id="desc">搜尋：確認搜尋步驟：沒有搜尋就不冒稱；定位：中文用位元組查：錯誤邊界停止連結；呈現：保留來源與建議：不改寫搜尋元件；保存：真實回應僅記憶體：作者測試資料可下載</desc><rect width="1600" height="900" fill="#edf3f6"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="85" y="108" font-size="61" fill="#263b38" font-weight="800">答案、引用與搜尋建議分別核對</text><rect x="85" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="235" font-size="57" fill="#365477" font-weight="800">搜尋</text><text x="120" y="311" font-size="52" fill="#263b38" font-weight="500">確認搜尋步驟</text><text x="120" y="379" font-size="52" fill="#263b38" font-weight="500">沒有搜尋就不冒稱</text><rect x="820" y="160" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="235" font-size="57" fill="#365477" font-weight="800">定位</text><text x="855" y="311" font-size="52" fill="#263b38" font-weight="500">中文用位元組查</text><text x="855" y="379" font-size="52" fill="#263b38" font-weight="500">錯誤邊界停止連結</text><rect x="85" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="120" y="525" font-size="57" fill="#365477" font-weight="800">呈現</text><text x="120" y="601" font-size="52" fill="#263b38" font-weight="500">保留來源與建議</text><text x="120" y="669" font-size="52" fill="#263b38" font-weight="500">不改寫搜尋元件</text><rect x="820" y="450" width="695" height="257" rx="25" fill="#ffffff" stroke="#adc6d8" stroke-width="3"/><text x="855" y="525" font-size="57" fill="#365477" font-weight="800">保存</text><text x="855" y="601" font-size="52" fill="#263b38" font-weight="500">真實回應僅記憶體</text><text x="855" y="669" font-size="52" fill="#263b38" font-weight="500">作者測試資料可下載</text><text x="85" y="818" font-size="47" fill="#365477" font-weight="500">合成引用已測；真實搜尋待驗</text></g></svg>