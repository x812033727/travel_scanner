<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>大邱烤腸：菜單先看三件事</title><desc>圖的左上角先寫一行小標「DAEGU · 막창구이」，主標題是「烤腸菜單，先看三件事」，下一行是「原料 → 調味 → 上桌後的烤法」。中間三張白色卡片並排，各自編號 01、02、03。第一張「先確認原料」，寫「돼지막창 → 豬」、「소막창 → 牛」與「只有 막창 → 先問店員」。第二張「再比較調味」，寫「양념막창」、「是另一個調味版本」與「詳細配方請向店家確認」。第三張「最後問烤法」，寫「初烤是店家的處理步驟」、「上桌後是否還要烤？」與「何時能吃，照店員指示」。三張卡片下面是一條深色長條，寫「菜名沒有寫清楚，就先確認；不要從招牌、顏色或照片推定原料。」最下面一行是「資料：大邱市美食入口網（대구푸드）」。</desc><rect width="1600" height="900" fill="#fbf4e6"/><g font-family="'Noto Sans TC','Noto Sans KR','Microsoft JhengHei',sans-serif"><text x="88" y="100" font-size="26" fill="#906047">DAEGU · 막창구이</text><text x="88" y="176" font-size="58" font-weight="700" fill="#243d37">烤腸菜單，先看三件事</text><text x="88" y="233" font-size="28" fill="#4c6159">原料 → 調味 → 上桌後的烤法</text><rect x="88" y="300" width="456" height="360" rx="24" fill="#fff"/><text x="118" y="355" font-size="26" fill="#ab512f">01</text><text x="118" y="415" font-size="37" font-weight="700" fill="#243d37">先確認原料</text><text x="118" y="490" font-size="27" fill="#344e45">돼지막창 → 豬</text><text x="118" y="545" font-size="27" fill="#344e45">소막창 → 牛</text><text x="118" y="600" font-size="27" fill="#344e45">只有 막창 → 先問店員</text><rect x="572" y="300" width="456" height="360" rx="24" fill="#fff"/><text x="602" y="355" font-size="26" fill="#ab512f">02</text><text x="602" y="415" font-size="37" font-weight="700" fill="#243d37">再比較調味</text><text x="602" y="490" font-size="27" fill="#344e45">양념막창</text><text x="602" y="545" font-size="27" fill="#344e45">是另一個調味版本</text><text x="602" y="600" font-size="27" fill="#344e45">詳細配方請向店家確認</text><rect x="1056" y="300" width="456" height="360" rx="24" fill="#fff"/><text x="1086" y="355" font-size="26" fill="#ab512f">03</text><text x="1086" y="415" font-size="37" font-weight="700" fill="#243d37">最後問烤法</text><text x="1086" y="490" font-size="27" fill="#344e45">初烤是店家的處理步驟</text><text x="1086" y="545" font-size="27" fill="#344e45">上桌後是否還要烤？</text><text x="1086" y="600" font-size="27" fill="#344e45">何時能吃，照店員指示</text><rect x="88" y="710" width="1424" height="95" rx="18" fill="#243d37"/><text x="123" y="770" font-size="29" fill="#fff">菜名沒有寫清楚，就先確認；不要從招牌、顏色或照片推定原料。</text><text x="88" y="857" font-size="21" fill="#61736b">資料：大邱市美食入口網（대구푸드）</text></g></svg>