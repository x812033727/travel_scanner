<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">4단계 흐름: 행동 판단, 다음 단계 기록, 대기 추적, 완료 후 보관</title>
<desc id="desc">행동 판단, 다음 단계 기록, 대기 추적, 완료 후 보관 순서로 확인한다. 편집상 정리이며 지도나 실측 시간이 아니다.</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">실행 순서</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">상황에 맞게 선택하며 한 번에 모두 끝낼 필요는 없습니다</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">처리 방식 판단</text>
<text x="245" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">다음 처리를 결정</text>
<text x="245" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">정보인지 할 일인지</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">다음 단계 기록</text>
<text x="615" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">다음 행동을 작성</text>
<text x="615" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">내용을 구체적으로</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">대기 사항 추적</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">확인 시점 설정</text>
<text x="985" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">다시 볼 때를 정하기</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">완료 후 보관</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">끝내고 보관하기</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">필요할 때 찾기</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair · 편집부 제작 도식</text>
</g>
</svg>
