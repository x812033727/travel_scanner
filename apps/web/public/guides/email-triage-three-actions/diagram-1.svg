<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>收件匣不必清到零：用待辦、等待與歸檔處理電子郵件：判斷流程</title><desc>依序檢查：判斷動作、記下一步、追蹤等待、完成歸檔。編輯整理，非地圖或實測時間。</desc><rect width="1600" height="900" rx="36" fill="#f4f0e5"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="100" y="118" fill="#154e50" font-size="42" font-weight="700">先後順序 · A practical sequence</text><text x="100" y="175" fill="#576968" font-size="25">依你的條件取捨，不必一次全部完成</text><rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/><text x="103" y="351" fill="#f4dc9d" font-size="34">01</text><text x="103" y="436" fill="white" font-size="33" font-weight="700">判斷動作</text><text x="103" y="497" fill="#f4f0e5" font-size="23">Decide the action</text><text x="103" y="573" fill="#f4dc9d" font-size="26">資訊或待辦</text><rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/><text x="473" y="351" fill="#f4dc9d" font-size="34">02</text><text x="473" y="436" fill="white" font-size="33" font-weight="700">記下一步</text><text x="473" y="497" fill="#f4f0e5" font-size="23">Capture next step</text><text x="473" y="573" fill="#f4dc9d" font-size="26">內容要具體</text><rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/><text x="843" y="351" fill="#f4dc9d" font-size="34">03</text><text x="843" y="436" fill="white" font-size="33" font-weight="700">追蹤等待</text><text x="843" y="497" fill="#f4f0e5" font-size="23">Track waiting</text><text x="843" y="573" fill="#f4dc9d" font-size="26">有回看時機</text><rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/><text x="1213" y="351" fill="#f4dc9d" font-size="34">04</text><text x="1213" y="436" fill="white" font-size="33" font-weight="700">完成歸檔</text><text x="1213" y="497" fill="#f4f0e5" font-size="23">Close and archive</text><text x="1213" y="573" fill="#f4dc9d" font-size="26">需要仍找得到</text><text x="100" y="780" fill="#576968" font-size="26">Mokaair · 編輯自製示意 / Editorial diagram</text></g></svg>