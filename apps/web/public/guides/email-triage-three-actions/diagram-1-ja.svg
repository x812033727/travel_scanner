<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">4段階の流れ：行動を判断し、次の一手を記録し、返信待ちを追跡し、完了後にアーカイブする</title>
<desc id="desc">行動を判断し、次の一手を記録し、返信待ちを追跡し、完了後にアーカイブする順で確認します。編集上の整理であり、地図や実測時間ではありません。</desc>
<rect width="1600" height="900" rx="36" fill="#f4f0e5"/>
<g font-family="Noto Sans,Noto Sans JP,Noto Sans KR,Noto Sans SC,Microsoft JhengHei,Arial,sans-serif">
<text x="100" y="118" fill="#154e50" font-size="42" text-anchor="start" font-weight="700">実践の順序</text>
<text x="100" y="175" fill="#576968" font-size="25" text-anchor="start">状況に合わせて選び、一度にすべて終える必要はありません</text>
<rect x="75" y="280" width="340" height="380" rx="26" fill="#154e50"/>
<text x="245" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">01</text>
<text x="245" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">対応を判断</text>
<text x="245" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">次の扱いを決める</text>
<text x="245" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">情報か対応事項か</text>
<rect x="445" y="280" width="340" height="380" rx="26" fill="#315f61"/>
<text x="615" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">02</text>
<text x="615" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">次の行動を記録</text>
<text x="615" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">次にすることを書く</text>
<text x="615" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">内容を具体的に</text>
<rect x="815" y="280" width="340" height="380" rx="26" fill="#9b543d"/>
<text x="985" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">03</text>
<text x="985" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">待機中を追跡</text>
<text x="985" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">確認時期を決める</text>
<text x="985" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">見直す時機を持つ</text>
<rect x="1185" y="280" width="340" height="380" rx="26" fill="#69663d"/>
<text x="1355" y="351" fill="#f4dc9d" font-size="34" text-anchor="middle">04</text>
<text x="1355" y="430" fill="white" font-size="31" text-anchor="middle" font-weight="700">完了して保管</text>
<text x="1355" y="497" fill="#f4f0e5" font-size="22" text-anchor="middle">終了後に保管する</text>
<text x="1355" y="573" fill="#f4dc9d" font-size="24" text-anchor="middle">必要時に見つける</text>
<text x="100" y="780" fill="#576968" font-size="26" text-anchor="start">Mokaair・編集部制作の図</text>
</g>
</svg>
