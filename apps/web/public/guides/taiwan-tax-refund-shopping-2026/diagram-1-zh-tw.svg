<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
  <title id="title">臺灣購物退稅三步驟與兩種辦理方式</title>
  <desc id="desc">三步驟加兩種辦理方式。第一步在貼有 TRS 標章的特約商店：同日同店含稅消費滿 NT$2,000，購物當日出示入境證照並取得退稅表單與統一發票；貨物須未拆封使用，且在購買日起 90 日內隨身出境。第二步在機場或港口：行李託運前至 E-VAT KIOSK 或退稅服務櫃檯掃描證照與表單，系統若判定須查驗，攜帶查驗單、退稅表單、入境證照、發票與貨物到海關櫃檯。第三步領款：可選新臺幣現金、信用卡或支票；退稅服務手續費為申退稅額的 20%。含稅 NT$10,000 的申退稅額為 NT$476，扣費後淨額約 NT$380。現場小額退稅適用同日同店含稅金額 NT$48,000 以下，當次來臺累計上限 NT$120,000、同年度上限 NT$240,000。特約市區退稅須在出境前 20 日內申請，信用卡預刷含稅消費金額 7% 作擔保，並在申請日起 20 日內攜貨出境。適用對象依入境證照與停留條件判定；持臨時停留許可證者只能在國際機場或港口辦理。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <text x="60" y="62" font-size="36" font-weight="700" fill="#102A2B">臺灣購物退稅：先開單、再查驗、最後領款</text>
  <text x="60" y="98" font-size="20" fill="#506362">2026 年 9 月 22 日依外籍旅客 e 化退稅服務網查證</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#657574"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="132" width="440" height="400" rx="24" fill="#FFFFFF" stroke="#0D6B68" stroke-width="5"/>
    <path d="M84 132 H476 A24 24 0 0 1 500 156 V210 H60 V156 A24 24 0 0 1 84 132 Z" fill="#0D6B68"/>
    <text x="280" y="182" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">1　特約商店開單</text>
    <g font-size="19" fill="#102A2B">
      <text x="88" y="252">找有 TRS 退稅標誌的商店</text>
      <text x="88" y="294">同日同店滿 NT$2,000（含稅）</text>
      <text x="88" y="336">購物當日出示入境證照</text>
      <text x="88" y="378">收好退稅表單與統一發票</text>
      <text x="88" y="420">貨物不要拆封、使用或調換</text>
      <text x="88" y="462">購買日起 90 日內攜貨出境</text>
    </g>
    <rect x="86" y="484" width="388" height="28" rx="14" fill="#E1F1EF"/>
    <text x="280" y="504" font-size="16" font-weight="700" fill="#0D6B68" text-anchor="middle">住宿、餐飲與免稅貨物不適用</text>
  </g>

  <g>
    <rect x="580" y="132" width="440" height="400" rx="24" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="5"/>
    <path d="M604 132 H996 A24 24 0 0 1 1020 156 V210 H580 V156 A24 24 0 0 1 604 132 Z" fill="#6B4A3A"/>
    <text x="800" y="182" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">2　機場或港口查驗</text>
    <g font-size="19" fill="#102A2B">
      <text x="608" y="252">行李託運前先辦退稅</text>
      <text x="608" y="294">官方建議提早 3 小時抵達</text>
      <text x="608" y="336">到 E-VAT KIOSK 或服務櫃檯</text>
      <text x="608" y="378">掃描入境證照與退稅表單</text>
      <text x="608" y="420">系統判定是否需要海關查驗</text>
      <text x="608" y="462">須查驗：帶齊單據、證照與貨物</text>
    </g>
    <rect x="606" y="484" width="388" height="28" rx="14" fill="#F3EAE5"/>
    <text x="800" y="504" font-size="16" font-weight="700" fill="#6B4A3A" text-anchor="middle">完成篩選與查驗後再託運</text>
  </g>

  <g>
    <rect x="1100" y="132" width="440" height="400" rx="24" fill="#FFFFFF" stroke="#B8442D" stroke-width="5"/>
    <path d="M1124 132 H1516 A24 24 0 0 1 1540 156 V210 H1100 V156 A24 24 0 0 1 1124 132 Z" fill="#B8442D"/>
    <text x="1320" y="182" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">3　核定後領款</text>
    <g font-size="19" fill="#102A2B">
      <text x="1128" y="252">新臺幣現金</text>
      <text x="1128" y="294">信用卡：VISA／Mastercard／JCB／銀聯</text>
      <text x="1128" y="336">或在服務櫃檯申請支票</text>
      <text x="1128" y="388">退稅服務手續費：申退稅額 20%</text>
      <text x="1128" y="430">含稅 NT$10,000 → 申退 NT$476</text>
      <text x="1128" y="472">扣費後淨額約 NT$380</text>
    </g>
    <rect x="1126" y="484" width="388" height="28" rx="14" fill="#FBE9E4"/>
    <text x="1320" y="504" font-size="16" font-weight="700" fill="#B8442D" text-anchor="middle">領款方式依個人卡片與櫃檯條件選擇</text>
  </g>

  <path d="M506 332 H568" stroke="#657574" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1026 332 H1088" stroke="#657574" stroke-width="6" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="572" width="720" height="204" rx="20" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4" stroke-dasharray="14 9"/>
    <text x="90" y="616" font-size="24" font-weight="700" fill="#2E7D5B">現場小額退稅</text>
    <g font-size="18" fill="#102A2B">
      <text x="90" y="656">同日同店含稅 NT$48,000 以下，購物當日於授權商店辦理</text>
      <text x="90" y="692">當次來臺累計上限 NT$120,000；同年度累計上限 NT$240,000</text>
      <text x="90" y="728">貨物仍須未使用，並在購買日起 90 日內攜出境</text>
      <text x="90" y="756" font-size="16" fill="#506362">持臨時停留許可證者不適用</text>
    </g>
  </g>

  <g>
    <rect x="820" y="572" width="720" height="204" rx="20" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4" stroke-dasharray="14 9"/>
    <text x="850" y="616" font-size="24" font-weight="700" fill="#2F6F9F">特約市區退稅</text>
    <g font-size="18" fill="#102A2B">
      <text x="850" y="656">出境前 20 日內申請；本人合格信用卡預刷消費額 7% 作擔保</text>
      <text x="850" y="692">申請日起 20 日內攜貨出境，並到機場或港口完成篩選</text>
      <text x="850" y="728">未完成篩選、應查驗卻未查驗，擔保金可能不退還</text>
      <text x="850" y="756" font-size="16" fill="#506362">持臨時停留許可證者不適用</text>
    </g>
  </g>

  <text x="60" y="824" font-size="17" fill="#102A2B">資格依入境證照與停留未滿 183 天判定，不以國籍推定。</text>
  <text x="60" y="854" font-size="17" fill="#506362">退稅專線：0800-880-288　｜　境外：+886-2-8978-7436</text>
  <text x="1540" y="880" font-size="15" fill="#506362" text-anchor="end">© Mokaair 2026</text>
</svg>
