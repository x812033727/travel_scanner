<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">兩張並排的稿紙與各自的對話泡泡 / Two drafts side by side, each under its own speech bubble</title>
  <desc id="desc">米色背景中央有一條由上往下的灰色虛線，把畫面分成左右對稱的兩半。左右各有一張白色的稿紙，紙上有四條橫線，線上用灰色長條代表寫好的文字，稿紙下半部各有一排五個空白方格，代表還沒填分數的評分欄。左邊稿紙的方格是青色邊框，右邊是藍色邊框。兩張稿紙上方各有一個對話泡泡，尖角朝下指向自己的稿紙，泡泡裡有三條短線代表一段回答；左邊泡泡是青色，右邊是藍色。兩邊的版面、行數與方格數完全一樣，表示用同一套題目、同一批材料各測一次。畫面最下方一行字寫著「自己測一次」。</desc>
