  <text x="60" y="700" font-size="17" fill="#102A2B">1 分要重寫、3 分要大改、5 分直接能用</text>
  <text x="60" y="732" font-size="17" fill="#5C6B6B">空白表抄回去，兩家各填一張，同一套題目填兩次</text>

  <text x="1000" y="142" font-size="20" font-weight="700" fill="#102A2B">公平測試的四個規則</text>

  <rect x="1000" y="164" width="540" height="110" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="1030" y="210" font-size="18" font-weight="700" fill="#102A2B">① 同一段提示詞</text>
  <text x="1030" y="246" font-size="16" fill="#102A2B">兩邊貼一模一樣的字，連標點都不要改</text>

  <rect x="1000" y="294" width="540" height="110" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1030" y="340" font-size="18" font-weight="700" fill="#0B4F4D">② 同一批材料</text>
  <text x="1030" y="376" font-size="16" fill="#102A2B">同一封信、同一份逐字稿、同一段英文</text>

  <rect x="1000" y="424" width="540" height="110" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1030" y="470" font-size="18" font-weight="700" fill="#1F4E73">③ 各開新對話</text>
  <text x="1030" y="506" font-size="16" fill="#102A2B">每題每家都開乾淨的新對話，關掉自訂指令</text>

  <rect x="1000" y="554" width="540" height="110" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1030" y="600" font-size="18" font-weight="700" fill="#A8571B">④ 盲評</text>
  <text x="1030" y="636" font-size="16" fill="#102A2B">貼到第三個地方、拿掉來源、隔一段時間再評</text>

  <text x="1000" y="700" font-size="17" fill="#B8442D">四條缺一條，左邊的分數就不能拿來比</text>
  <text x="1000" y="732" font-size="17" fill="#5C6B6B">整套五題兩家，約 30 分鐘</text>

  <text x="60" y="794" font-size="17" fill="#B8442D">同一題測兩次結果就會不同：官方文件寫明即使 temperature 設成 0，相同輸入也可能產生不同輸出</text>

