<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">五道題乘五個面向的空白評分矩陣，與公平測試的四個規則 / A blank five-by-five scoring matrix and the four rules for a fair test</title>
  <desc id="desc">左半邊是一張空白的評分矩陣，橫向五欄是五個評分面向：正確、語氣、繁中、結構、可直接用；縱向五列是五道測試題：一、改中文商務信，二、訪談整理成摘要，三、寫產品文案，四、英翻繁體中文，五、照舊文風格續寫。二十五個格子全部留白，每格畫一條短橫線表示自己填，每格填 1 到 5 分。矩陣下方寫著 1 分要重寫、3 分要大改、5 分直接能用，以及空白表抄回去、兩家各填一張、同一套題目填兩次。右半邊由上往下是公平測試的四個規則。第一，同一段提示詞：兩邊貼一模一樣的字，連標點都不要改。第二，同一批材料：同一封信、同一份逐字稿、同一段英文。第三，各開新對話：每題每家都開乾淨的新對話，並關掉自訂指令。第四，盲評：把兩份輸出貼到第三個地方、拿掉來源、隔一段時間再評。右下方註明四條缺一條，左邊的分數就不能拿來比，整套五題兩家大約三十分鐘。圖的下方提醒：同一題測兩次結果就會不同，官方文件寫明即使把 temperature 設成 0，相同輸入也可能產生不同輸出；模型、功能與方案依 2026 年 9 月的官方文件，這張圖畫的是方法，不是任何一次實測的結果。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">五道題 × 五個面向的評分矩陣與公平測試四規則（2026 年 9 月）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">A five-by-five scoring matrix and four rules for a fair side-by-side writing test</text>

