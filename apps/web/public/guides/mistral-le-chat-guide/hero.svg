<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">歐洲的 AI 助手 / A European AI assistant</title>
  <desc id="desc">插圖。左邊是一個大的圓角對話框，裡面有三條短橫線代表文字。對話框向右分出三條線，分別指向三個圓角方塊：上面的方塊畫三條橫線代表文件工作，中間的方塊畫左右兩個角括號代表程式，下面的方塊畫兩個小對話框代表一問一答。三個方塊再往右接到一個打開蓋子的箱子，箱子裡放著兩個方塊，上方有一個向下的箭頭，代表模型可以自己下載回來放著。畫面上方只有一行字：歐洲的 AI 助手。整張圖用米色底、深綠、藍、橘與白色的幾何形狀組成，沒有任何產品標誌或介面。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
