<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">Gandi 도메인 관리: 등록, DNS와 갱신 확인 — Gandi 관리를 위한 세 가지 목록</title><desc id="desc">Gandi 도메인 관리를 자산 정보, DNS 레코드, 갱신과 이전의 세 목록으로 나누고 각 목록에 보관할 정보를 보여 주는 그림.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Gandi 관리를 위한 세 가지 목록</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">작업마다 확인 가능한 상태 기록을 남기세요</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">자산 정보</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">등록자와 관리 계정</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">용도와 담당자</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">공식 알림 경로</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">DNS 레코드</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">현재 DNS 서비스</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">백업과 변경 내용</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">웹사이트·이메일 확인</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">갱신과 이전</text>
<text x="1092.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">만료일과 결제 상태</text>
<text x="1092.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">확장자별 적용 절차</text>
<text x="1092.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">다른 서비스 의존 관계</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">현재 상태부터 확인한 다음 최신 공식 문서에 따라 작업하세요.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 자체 제작 도해</text>
</svg>
