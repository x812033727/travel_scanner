<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">癌症保障的兩種給付邏輯與「重大傷病」的兩個意思 / Two cancer benefit structures and two meanings of major illness</title>
  <desc id="desc">上半兩個並排的方框比較癌症保障的兩種給付方式。左框是一次金：給付條件為符合條款定義的診斷確定，形式是一次給付一筆、通常不限定用途，次數是初次罹患癌症保險金終身僅領一次，常見爭點在原位癌與初期癌症的給付比例。右框是療程型：給付條件為實際發生條款列舉的療程項目，形式是按住院、手術、放射線與化學治療、門診逐項給付，次數依條款約定的給付項目與次數，常見爭點在條款的給付項目與實際療程對不對得上。下半兩個彼此不相連的方框說明「重大傷病」的兩個意思，中間以虛線分隔並標示兩套標準：左邊是健保的重大傷病證明，依全民健康保險法與相關辦法，由中央健康保險署核定，效果是就醫時免自行負擔費用；右邊是保單的重大疾病與特定傷病保險，依保單條款的疾病清單與嚴重程度，由保險公司認定，效果是依條款給付保險金。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">癌症保障的兩種給付邏輯，與「重大傷病」的兩個意思</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Two cancer benefit structures, and two separate meanings of major illness</text>

  <rect x="60" y="130" width="700" height="400" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="410" y="182" font-size="24" font-weight="bold" fill="#0D6B68" text-anchor="middle">一次金：診斷確定後給一筆</text>
  <line x1="88" y1="204" x2="732" y2="204" stroke="#0D6B68" stroke-width="2"/>
  <text x="88" y="240" font-size="17" fill="#5C6B6B">給付條件</text>
  <text x="88" y="266" font-size="19" fill="#102A2B">符合條款定義的「診斷確定」</text>
  <text x="88" y="322" font-size="17" fill="#5C6B6B">給付形式</text>
  <text x="88" y="348" font-size="19" fill="#102A2B">一次給付一筆，通常不限定用途</text>
  <text x="88" y="404" font-size="17" fill="#5C6B6B">給付次數</text>
  <text x="88" y="430" font-size="19" fill="#102A2B">初次罹患癌症保險金終身僅領一次</text>
  <text x="88" y="482" font-size="17" fill="#5C6B6B">常見爭點</text>
  <text x="88" y="508" font-size="19" fill="#B8442D">原位癌與初期癌症的給付比例</text>

  <rect x="840" y="130" width="700" height="400" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1190" y="182" font-size="24" font-weight="bold" fill="#2F6F9F" text-anchor="middle">療程型：按項目逐項給付</text>
  <line x1="868" y1="204" x2="1512" y2="204" stroke="#2F6F9F" stroke-width="2"/>
  <text x="868" y="240" font-size="17" fill="#5C6B6B">給付條件</text>
  <text x="868" y="266" font-size="19" fill="#102A2B">實際發生條款列舉的療程項目</text>
  <text x="868" y="322" font-size="17" fill="#5C6B6B">給付形式</text>
  <text x="868" y="348" font-size="19" fill="#102A2B">住院、手術、放射線與化學治療、門診</text>
  <text x="868" y="404" font-size="17" fill="#5C6B6B">給付次數</text>
  <text x="868" y="430" font-size="19" fill="#102A2B">依條款約定的給付項目與次數</text>
  <text x="868" y="482" font-size="17" fill="#5C6B6B">常見爭點</text>
  <text x="868" y="508" font-size="19" fill="#B8442D">條款的給付項目與實際療程對不對得上</text>

  <text x="60" y="588" font-size="24" font-weight="bold" fill="#102A2B">「重大傷病」在健保與在保單是兩件事</text>

  <rect x="60" y="610" width="670" height="222" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="395" y="654" font-size="22" font-weight="bold" fill="#2E7D5B" text-anchor="middle">健保：重大傷病證明</text>
  <line x1="88" y1="676" x2="702" y2="676" stroke="#2E7D5B" stroke-width="2"/>
  <text x="88" y="712" font-size="17" fill="#5C6B6B">依據與認定</text>
  <text x="88" y="738" font-size="19" fill="#102A2B">全民健康保險法與相關辦法，健保署核定</text>
  <text x="88" y="782" font-size="17" fill="#5C6B6B">效果</text>
  <text x="88" y="808" font-size="19" fill="#102A2B">就醫時免自行負擔費用</text>

  <line x1="800" y1="610" x2="800" y2="832" stroke="#B8442D" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="butt"/>
  <rect x="738" y="700" width="124" height="42" rx="14" fill="#F7F1E8" stroke="#B8442D" stroke-width="3"/>
  <text x="800" y="728" font-size="18" font-weight="bold" fill="#B8442D" text-anchor="middle">兩套標準</text>

  <rect x="870" y="610" width="670" height="222" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1205" y="654" font-size="22" font-weight="bold" fill="#D97A2B" text-anchor="middle">保單：重大疾病／特定傷病保險</text>
  <line x1="898" y1="676" x2="1512" y2="676" stroke="#D97A2B" stroke-width="2"/>
  <text x="898" y="712" font-size="17" fill="#5C6B6B">依據與認定</text>
  <text x="898" y="738" font-size="19" fill="#102A2B">條款的疾病清單與嚴重程度，保險公司認定</text>
  <text x="898" y="782" font-size="17" fill="#5C6B6B">效果</text>
  <text x="898" y="808" font-size="19" fill="#102A2B">依條款約定給付保險金</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
