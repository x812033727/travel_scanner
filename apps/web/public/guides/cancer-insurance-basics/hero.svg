<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">保單條款分出的兩種給付方式 / Two benefit paths from one policy document</title>
  <desc id="desc">左側是一份圓角的白色文件，代表保單條款，上方有一條深綠色的標題橫條，下面五條長短不一的灰色文字線。文件右側拉出一條連接線，在中間分成上下兩條路徑：上面那條通向一個大的圓角方塊，代表診斷確定後一次給付一筆；下面那條通向四個大小相同、並排成一列的小圓角方塊，代表按療程項目逐項給付。整張圖只有幾何形狀，沒有文字、人物與機構標誌。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

