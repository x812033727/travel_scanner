  <line x1="285" y1="588" x2="445" y2="588" stroke="#5C6B6B" stroke-width="8" stroke-linecap="butt"/>

  <line x1="615" y1="460" x2="735" y2="460" stroke="#102A2B" stroke-width="6" stroke-linecap="butt"/>
  <line x1="735" y1="330" x2="735" y2="590" stroke="#102A2B" stroke-width="6" stroke-linecap="butt"/>
  <line x1="735" y1="330" x2="1025" y2="330" stroke="#0D6B68" stroke-width="6" stroke-linecap="butt"/>
