<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans','Segoe UI',Arial,sans-serif">
<title id="title">Choose hosting by three dimensions</title><desc id="desc">A hosting comparison that checks resource conditions first, then maintenance responsibility, and finally validates real website flows.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">Choose hosting by three dimensions</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">Resources, maintenance, and validation determine whether it fits</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Resource conditions</text>
<text x="108.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Program and data needs</text>
<text x="108.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Storage and memory</text>
<text x="108.0" y="475" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Peaks and dynamic work</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Maintenance responsibilities</text>
<text x="600.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Who manages hosting and site</text>
<text x="600.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Updates, backups, and restore</text>
<text x="600.0" y="475" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Support scope for failures</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">Real-world validation</text>
<text x="1092.0" y="371" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Fixed pages and test conditions</text>
<text x="1092.0" y="423" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Visitor and admin flows</text>
<text x="1092.0" y="475" font-size="26" fill="#102A2B" text-anchor="start" font-weight="normal">Upgrade and exit plan</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">Find the constraint before upgrading; a name alone cannot guarantee speed.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>
