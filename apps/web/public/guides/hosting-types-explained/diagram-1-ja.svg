<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title id="title">ホスティング選びの三つの観点</title><desc id="desc">ホスティング比較で、最初に資源条件、次に保守責任を確認し、最後に実際のサイト動線で検証する。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">ホスティング選びの三つの観点</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">資源・保守・検証を合わせて適合性を判断する</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">資源条件</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">プログラムとデータの要件</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">容量とメモリ</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">ピーク時と動的処理</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">保守責任</text>
<text x="600.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">サーバーとサイトの管理者</text>
<text x="600.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">更新・バックアップ・復元</text>
<text x="600.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">障害時の支援範囲</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">実際の検証</text>
<text x="1092.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">固定ページと測定条件</text>
<text x="1092.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">訪問者と管理画面の動線</text>
<text x="1092.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">アップグレードと解約方法</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">まず制約を特定してから改善する。名称だけでは速度を保証できない。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair オリジナル図</text>
</svg>
