<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<title id="title">호스팅 선택의 세 가지 관점</title><desc id="desc">호스팅을 비교할 때 자원 조건을 먼저 확인하고 관리 책임을 살핀 뒤 실제 웹사이트 흐름으로 검증한다.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">호스팅 선택의 세 가지 관점</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">자원·유지 관리·검증을 함께 보고 적합성을 판단하세요</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">자원 조건</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">프로그램과 데이터 요구</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">저장 공간과 메모리</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">피크와 동적 작업</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">유지 관리 책임</text>
<text x="600.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">호스팅과 사이트 관리 주체</text>
<text x="600.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">업데이트·백업·복원</text>
<text x="600.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">장애 지원 범위</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">실제 검증</text>
<text x="1092.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">고정 페이지와 측정 조건</text>
<text x="1092.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">방문자와 관리자 흐름</text>
<text x="1092.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">업그레이드와 종료 방법</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">제약을 먼저 찾고 업그레이드를 논의하세요. 이름만으로 속도를 보장할 수 없습니다.</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 오리지널 그래픽</text>
</svg>
