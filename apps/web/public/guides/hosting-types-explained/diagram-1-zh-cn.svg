<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="title">选主机先看三个方面</title><desc id="desc">比较主机时先检查资源条件，再确认维护责任，最后以网站实际流程验收。</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="48" fill="#102A2B" text-anchor="start" font-weight="bold">选主机先看三个方面</text>
<text x="80" y="151" font-size="26" fill="#5C6B6B" text-anchor="start" font-weight="normal">资源、维护与验收共同决定是否适合</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">资源条件</text>
<text x="108.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">程序与资料的需求</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">空间与内存</text>
<text x="108.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">高峰及动态工作</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="600.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">维护责任</text>
<text x="600.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">主机与网站由谁管理</text>
<text x="600.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">更新、备份与还原</text>
<text x="600.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">故障支持范围</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="1092.0" y="314" font-size="30" fill="#102A2B" text-anchor="start" font-weight="bold">实际验收</text>
<text x="1092.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">固定页面与测量条件</text>
<text x="1092.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">访客与后台流程</text>
<text x="1092.0" y="475" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">升级及退出方法</text>
<text x="80" y="803" font-size="28" fill="#102A2B" text-anchor="start" font-weight="normal">先找限制，再谈升级；名称本身不保证速度。</text>
<text x="1520" y="862" font-size="22" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原创制图</text>
</svg>
