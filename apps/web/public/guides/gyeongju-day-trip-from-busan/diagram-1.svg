  <text x="859" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">走路</text>
  <rect x="880" y="160" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
  <text x="975" y="186" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">첨성대 瞻星台</text>
  <text x="975" y="210" font-size="15" fill="#5C6B6B" text-anchor="middle">免費・Cheomseongdae</text>

  <!-- D lunch -->
  <path d="M 1070 192 L 1108 192" stroke="#102A2B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1089" y="180" font-size="15" fill="#5C6B6B" text-anchor="middle">走路</text>
  <rect x="1110" y="160" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
  <text x="1230" y="186" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">교촌·황리단길 校村／皇理團路</text>
  <text x="1230" y="210" font-size="15" fill="#5C6B6B" text-anchor="middle">午餐・Gyochon / Hwangnidan-gil</text>

  <!-- E Bulguksa -->
  <path d="M 1240 226 L 1300 328" stroke="#0D6B68" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#arrowTeal)"/>
  <text x="1300" y="284" font-size="15" font-weight="700" fill="#0B4F4D">10／11 號公車</text>
  <rect x="1210" y="330" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1325" y="356" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">불국사 佛國寺 Bulguksa</text>
  <text x="1325" y="380" font-size="15" fill="#5C6B6B" text-anchor="middle">免費・3～9 月 18:00 停止入場</text>

  <!-- F Seokguram -->
  <path d="M 1400 396 L 1440 498" stroke="#0D6B68" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#arrowTeal)"/>
  <text x="1392" y="452" font-size="15" font-weight="700" fill="#0B4F4D" text-anchor="end">12 號公車 往返</text>
  <rect x="1330" y="500" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="1445" y="526" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">석굴암 石窟庵 Seokguram</text>
  <text x="1445" y="550" font-size="15" fill="#5C6B6B" text-anchor="middle">免費・12 號 08:40～16:40</text>

  <!-- G Donggung -->
  <path d="M 1240 396 C 1200 470, 1160 520, 1122 552" stroke="#0D6B68" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#arrowTeal)"/>
  <text x="1232" y="480" font-size="15" font-weight="700" fill="#0B4F4D">10／11 號公車</text>
  <rect x="880" y="530" width="240" height="64" rx="12" fill="#FFFFFF" stroke="#7E57C2" stroke-width="4"/>
  <text x="1000" y="556" font-size="18" font-weight="700" fill="#102A2B" text-anchor="middle">동궁과 월지 東宮與月池</text>
  <text x="1000" y="580" font-size="15" fill="#5C6B6B" text-anchor="middle">3,000 韓元・開到 22:00</text>

  <!-- G -> A -->
  <path d="M 880 562 L 604 334" stroke="#5C6B6B" stroke-width="4" fill="none" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="690" y="520" font-size="15" fill="#5C6B6B">10 號公車／計程車 回巴士站</text>

  <!-- return box -->
  <rect x="60" y="760" width="740" height="92" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/>
  <text x="84" y="792" font-size="17" font-weight="700" fill="#102A2B">回釜山</text>
  <text x="84" y="818" font-size="15" fill="#102A2B">市外巴士站 → 老圃 末班 22:40・一般 6,000／優等 7,700 韓元・約 1 小時</text>
  <text x="84" y="842" font-size="15" fill="#102A2B">KTX 慶州站 → 釜山站 末班 23:46（00:13 到）・711 號公車從慶州站發車末班 20:23</text>

  <!-- fees box -->
  <rect x="830" y="760" width="710" height="92" rx="14" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="3"/>
  <text x="854" y="792" font-size="17" font-weight="700" fill="#102A2B">門票與公車</text>
  <text x="854" y="818" font-size="15" fill="#102A2B">天馬塚、東宮與月池各 3,000 韓元（青少年 2,000、兒童 1,000）</text>
  <text x="854" y="842" font-size="15" fill="#102A2B">大陵苑公園、瞻星台、佛國寺、石窟庵免費・市區公車 1,500 韓元，刷卡 1,450</text>

