  <path d="M 600 296 L 640 204" stroke="#102A2B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="592" y="242" font-size="15" fill="#5C6B6B" text-anchor="end">走路</text>
  <rect x="640" y="160" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#6B4A3A" stroke-width="4"/>
