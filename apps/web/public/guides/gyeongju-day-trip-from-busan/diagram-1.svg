<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">釜山出發慶州一日路線圖 / Gyeongju day trip from Busan: route, buses and fares</title>
  <desc id="desc">左邊是釜山：市外巴士從老圃站的釜山東部巴士站 27 號月台出發，約 50 分鐘到慶州市外巴士站，優等 7,700 韓元、深夜班 9,200 韓元；KTX 與 SRT 從釜山站到慶州站（舊新慶州站，在市區外）28 到 37 分鐘，SRT 一般室 10,100 韓元，慶州站再搭 700 或 711 號公車進市區。市區一圈：市外巴士站走路到大陵苑（天馬塚 3,000 韓元），走路到瞻星台（免費），走路到校村或皇理團路午餐，搭 10 或 11 號公車到佛國寺（免費，3 到 9 月 18:00 停止入場），搭 12 號公車往返石窟庵（免費，08:40 到 16:40），再搭 10 或 11 號公車到東宮與月池（3,000 韓元，開到 22:00、21:30 停止入場），最後搭 10 號公車或計程車回市外巴士站。回釜山：市外巴士往老圃末班 22:40，一般 6,000、優等 7,700 韓元，約 1 小時；KTX 慶州站到釜山站末班 23:46、00:13 到，711 號公車從慶州站發車末班 20:23。門票欄：天馬塚與東宮與月池各 3,000 韓元，青少年 2,000、兒童 1,000；大陵苑公園、瞻星台、佛國寺、石窟庵免費；市區公車 1,500 韓元，刷交通卡 1,450。虛線是巴士與公車，實線是鐵路與步行。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">釜山出發慶州一日路線：怎麼去、怎麼繞、幾點回（2026 年 9 月查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Gyeongju day trip from Busan: intercity bus or KTX, city buses 10, 11 and 12, admission and last departures</text>

  <!-- legend -->
  <path d="M 60 136 L 130 136" stroke="#102A2B" stroke-width="5"/>
  <text x="142" y="142" font-size="15" fill="#102A2B">鐵路／走路</text>
  <path d="M 250 136 L 320 136" stroke="#B8442D" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="332" y="142" font-size="15" fill="#102A2B">巴士／公車</text>

  <!-- Busan -->
  <circle cx="140" cy="450" r="26" fill="#2F6F9F" stroke="#FFFFFF" stroke-width="5"/>
  <text x="140" y="390" font-size="21" font-weight="700" fill="#102A2B" text-anchor="middle">부산 釜山 Busan</text>
  <text x="140" y="415" font-size="15" fill="#5C6B6B" text-anchor="middle">노포 老圃 Nopo 巴士站・부산역 釜山站</text>

  <!-- Busan -> terminal by bus -->
  <path d="M 162 438 C 250 330, 300 302, 368 302" stroke="#B8442D" stroke-width="6" fill="none" stroke-dasharray="14 10" marker-end="url(#arrowCoral)"/>
  <text x="66" y="212" font-size="16" font-weight="700" fill="#8A2E1D">市外巴士 老圃 27 號月台出發</text>
  <text x="66" y="238" font-size="15" fill="#8A2E1D">約 50 分・優等 7,700 韓元・深夜班 9,200 韓元</text>

