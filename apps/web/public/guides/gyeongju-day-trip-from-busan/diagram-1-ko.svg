<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">부산 출발 경주 당일 여행 지도: 경로·버스·요금</title>
  <desc id="desc">왼쪽은 부산이다. 시외버스는 노포역 부산동부버스터미널 27번 승강장에서 출발해 약 50분 만에 경주시외버스터미널에 도착하며, 우등 7,700원·심야 9,200원이다. KTX와 SRT는 부산역에서 도심 밖 경주역(옛 신경주역)까지 28~37분 걸리고, SRT 일반실은 10,100원이다. 경주역에서는 700 또는 711번 버스로 도심에 들어간다. 경주 관광 코스: 시외버스터미널에서 대릉원(천마총 3,000원)까지 도보, 첨성대(무료)까지 도보, 교촌이나 황리단길까지 걸어가 점심, 10 또는 11번 버스로 불국사(무료, 3~9월 18:00 입장 마감), 12번 버스로 석굴암 왕복(무료, 08:40~16:40), 다시 10 또는 11번 버스로 동궁과 월지(3,000원, 22:00까지 운영·21:30 입장 마감), 마지막으로 10번 버스나 택시로 시외버스터미널에 돌아온다. 부산 복귀: 노포행 시외버스 막차 22:40, 일반 6,000원·우등 7,700원, 약 1시간. 경주역에서 부산역으로 가는 KTX 막차는 23:46 출발·00:13 도착이며, 711번 버스의 경주역 출발 막차는 20:23이다. 입장료 안내: 천마총·동궁과 월지 각각 3,000원, 청소년 2,000원·어린이 1,000원. 대릉원 공원·첨성대·불국사·석굴암은 무료. 시내버스 1,500원, 교통카드 1,450원. 점선은 시외·시내버스, 실선은 철도·도보를 뜻한다.</desc>
