<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">釜山出发庆州一日路线图／釜山出发庆州一日游：路线、公交与票价</title>
  <desc id="desc">左边是釜山：市外巴士从老圃站的釜山东部巴士站 27 号站台出发，约 50 分钟到庆州市外巴士站，优等 7,700 韩元、深夜班 9,200 韩元；KTX 与 SRT 从釜山站到庆州站（原新庆州站，在市区外）28 到 37 分钟，SRT 普通车厢 10,100 韩元，庆州站再乘 700 或 711 路公交进市区。市区一圈：市外巴士站步行到大陵苑（天马冢 3,000 韩元），步行到瞻星台（免费），步行到校村或皇理团路吃午餐，乘 10 或 11 路公交到佛国寺（免费，3 到 9 月 18:00 停止入场），乘 12 路公交往返石窟庵（免费，08:40 到 16:40），再乘 10 或 11 路公交到东宫与月池（3,000 韩元，开放到 22:00、21:30 停止入场），最后乘 10 路公交或出租车回市外巴士站。回釜山：市外巴士往老圃末班 22:40，普通 6,000、优等 7,700 韩元，约 1 小时；KTX 庆州站到釜山站末班 23:46、00:13 到，711 路公交从庆州站发车的末班为 20:23。门票栏：天马冢与东宫与月池各 3,000 韩元，青少年 2,000、儿童 1,000；大陵苑公园、瞻星台、佛国寺、石窟庵免费；市区公交 1,500 韩元，刷交通卡 1,450。虚线是巴士与公交，实线是铁路与步行。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B" /></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68" /></marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8442D" /></marker>
  </defs>
