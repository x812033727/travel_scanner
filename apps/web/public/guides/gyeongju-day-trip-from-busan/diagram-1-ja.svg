<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">釜山発・慶州日帰りルート図／釜山から慶州へ：ルート、バス、運賃</title>
  <desc id="desc">左側は釜山。市外バスは老圃駅の釜山東部バスターミナル27番乗り場を出発し、約50分で慶州市外バスターミナルへ。優等7,700ウォン、深夜便9,200ウォン。KTXとSRTは釜山駅から慶州駅（旧・新慶州駅、市街地の外）まで28〜37分、SRT一般室10,100ウォン。慶州駅から700または711番バスで市街へ。市内周遊：市外バスターミナルから大陵苑（天馬塚3,000ウォン）へ徒歩、瞻星台（無料）へ徒歩、校村か皇理団路へ歩いて昼食。10または11番バスで仏国寺へ（無料、3〜9月は18:00入場締切）、12番バスで石窟庵を往復（無料、08:40〜16:40）。その後10または11番バスで東宮と月池へ（3,000ウォン、22:00まで開場、21:30入場締切）、最後に10番バスかタクシーで市外バスターミナルへ戻る。釜山への帰路：老圃行き市外バスは最終22:40、一般6,000・優等7,700ウォン、約1時間。慶州駅から釜山駅へのKTXは最終23:46発・00:13着。711番バスの慶州駅発最終は20:23。入場料欄：天馬塚と東宮と月池は各3,000ウォン、青少年2,000・子ども1,000。大陵苑公園、瞻星台、仏国寺、石窟庵は無料。路線バスは1,500ウォン、交通カード利用で1,450。破線は市外バスと路線バス、実線は鉄道と徒歩。</desc>
