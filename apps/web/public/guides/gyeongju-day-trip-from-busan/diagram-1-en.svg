<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">Gyeongju day-trip route map from Busan / Gyeongju day trip from Busan: route, buses and fares</title>
  <desc id="desc">Left: Busan. Intercity buses leave Busan East Terminal at Nopo, platform 27: ~50 min to Gyeongju Intercity Terminal; deluxe ₩7,700, late-night ₩9,200. KTX/SRT: Busan Station→Gyeongju Station (formerly Singyeongju, outside downtown), 28–37 min; SRT standard ₩10,100. Bus 700 or 711 connects to downtown. City loop: walk from the terminal to Daereungwon (Cheonmachong ₩3,000), Cheomseongdae (free), then Gyochon or Hwangnidan-gil for lunch. Bus 10 or 11→Bulguksa (free; last entry 18:00 in months 3–9); bus 12↔Seokguram (free; 08:40–16:40); bus 10 or 11→Donggung Palace and Wolji Pond (₩3,000; open until 22:00, last entry 21:30); bus 10/taxi→terminal. Return to Busan: last intercity bus to Nopo 22:40; standard ₩6,000, deluxe ₩7,700; ~1 hour. Last KTX Gyeongju Station→Busan Station 23:46, arriving 00:13; last bus 711 from Gyeongju Station 20:23. Admission: Cheonmachong and Donggung Palace and Wolji Pond each ₩3,000; youths ₩2,000, children ₩1,000. Daereungwon park, Cheomseongdae, Bulguksa and Seokguram free. City bus ₩1,500; transit card ₩1,450. Dashed lines: intercity/city buses. Solid lines: rail/walking.</desc>
