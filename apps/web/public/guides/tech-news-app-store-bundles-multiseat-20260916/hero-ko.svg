<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="title">App Store 구독 새 규칙: 번들은 개발자 최대 5개사, 다중 시트 구매 기본 활성화, 볼륨 구매는 10월 22일 시작</title><desc id="desc">원본 일러스트: 왼쪽에는 크기가 같은 다섯 개의 블록이 원형으로 배열되어 선으로 이어지며 가운데의 구매 영수증 하나로 모입니다. 오른쪽에는 사람 모양 실루엣들이 나란히 서 있고 그 아래 공유된 원형 아이콘이 있어, 여러 구독이 하나의 구매로 합쳐지는 것과 여러 사람이 하나의 구매를 함께 쓰는 것을 나타냅니다.</desc>
