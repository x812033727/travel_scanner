<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">AIO 的三個所指 / Three things the abbreviation AIO points at</title>
  <desc id="desc">一張抽象插圖。畫面中央是一個白色圓角方框，裡面寫著大大的 AIO 三個字母。三條灰線從三個不同的圖形連到這個方框：左上是一個綠色邊框的螢幕，螢幕裡有幾條橫條，代表出現在畫面上的功能；右上是三條藍色邊框的橫列，每列左邊有一個小圓點，代表有步驟、有人執行的做法；下方是一個橘色邊框的方盒，盒上有一條直線與一條橫線構成的緞帶，代表可以買的套裝服務。整張圖的意思是同一個縮寫同時被三種不同的東西使用。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

