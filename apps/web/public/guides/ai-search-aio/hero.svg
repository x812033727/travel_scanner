  <circle cx="1152" cy="247" r="12" fill="#2F6F9F"/>
  <rect x="1110" y="296" width="340" height="58" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="1152" cy="325" r="12" fill="#2F6F9F"/>

