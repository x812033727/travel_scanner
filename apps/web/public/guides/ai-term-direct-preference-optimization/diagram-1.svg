<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">同一問題的比較，直接進入訓練</title><desc id="desc">同一產品說明形成保留限制和省略限制的兩份回答，偏好配對與參考模型共同參與 DPO 更新，再以新說明評估</desc><rect width="1600" height="900" fill="#F7F1E8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker></defs><text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一問題的比較，直接進入訓練</text><text x="60" y="84" font-size="18" fill="#5C6B6B">Direct Preference Optimization</text><path d="M 490 230 L 665 335" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 490 510 L 665 420" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 855 645 L 855 480" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1035 375 L 1210 375" fill="none" stroke="#0D6B68" stroke-width="5" marker-end="url(#arrow)"/><rect x="70" y="150" width="420" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="224" font-size="28" fill="#102A2B" text-anchor="middle">較佳回答</text><text x="280" y="267" font-size="22" fill="#5C6B6B" text-anchor="middle">保留離線使用限制</text><rect x="70" y="430" width="420" height="160" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="280" y="504" font-size="28" fill="#102A2B" text-anchor="middle">較差回答</text><text x="280" y="547" font-size="22" fill="#5C6B6B" text-anchor="middle">把所有功能說成離線</text><rect x="675" y="280" width="360" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="855" y="369" font-size="28" fill="#102A2B" text-anchor="middle">DPO 更新</text><text x="855" y="412" font-size="22" fill="#5C6B6B" text-anchor="middle">學相對偏好</text><rect x="675" y="645" width="360" height="130" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="855" y="704" font-size="28" fill="#102A2B" text-anchor="middle">參考模型</text><text x="855" y="747" font-size="22" fill="#5C6B6B" text-anchor="middle">比較基準</text><rect x="1220" y="280" width="310" height="190" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/><text x="1375" y="369" font-size="28" fill="#102A2B" text-anchor="middle">新資料評估</text><text x="1375" y="412" font-size="22" fill="#5C6B6B" text-anchor="middle">限制與格式</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text></svg>
