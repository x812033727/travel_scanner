<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">一隻雞吃法流程圖 / How to eat dak-hanmari step by step</title>
  <desc id="desc">由上到下的主要流程：닭한마리上桌，鍋裡是整隻雞、馬鈴薯與年糕，湯是清湯；接著계속 끓이기繼續煮，雞是先燙過的，要在桌上的爐子上再滾；再來소스 만들기調沾醬，材料是芥末、醬油、蒜、辣椒醬與醋，拌進韭菜；然後닭고기 찍어 먹기夾雞肉沾醬，雞肉熟了再夾起來；最後칼국수 사리最後煮麵，把剩下的湯拿來煮刀切麵。流程右側掛著兩個可選的小方框：다대기／신김치，標示湯要辣的話，做法是把辣醬或酸泡菜加進湯裡一起煮；죽，標示有的店可以點，收尾也可以換成粥。整理自 KTO 韓國觀光公社的官方頁。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6B68"/></marker>
    <marker id="arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A2B"/></marker>
  </defs>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">一隻雞上桌之後，照這個順序吃</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Dak-hanmari: what to do after the pot arrives</text>

  <!-- main flow: 5 boxes top to bottom -->
  <rect x="60" y="130" width="960" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="170" font-size="26" font-weight="700" fill="#102A2B">닭한마리　上桌</text>
  <text x="90" y="202" font-size="17" fill="#5C6B6B">整隻雞、馬鈴薯、年糕，清湯</text>

  <path d="M 540 234 L 540 254" stroke="#0D6B68" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="254" width="960" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="294" font-size="26" font-weight="700" fill="#102A2B">계속 끓이기　繼續煮</text>
  <text x="90" y="326" font-size="17" fill="#5C6B6B">雞先燙過，桌上的爐子上再滾</text>

  <path d="M 540 358 L 540 378" stroke="#0D6B68" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="378" width="960" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="418" font-size="26" font-weight="700" fill="#102A2B">소스 만들기　調沾醬</text>
  <text x="90" y="450" font-size="17" fill="#5C6B6B">芥末、醬油、蒜、辣椒醬、醋，拌進韭菜</text>

  <path d="M 540 482 L 540 502" stroke="#0D6B68" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="502" width="960" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="542" font-size="26" font-weight="700" fill="#102A2B">닭고기 찍어 먹기　夾雞肉沾醬</text>
  <text x="90" y="574" font-size="17" fill="#5C6B6B">雞肉熟了再夾起來</text>

  <path d="M 540 606 L 540 626" stroke="#0D6B68" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="626" width="960" height="104" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="90" y="666" font-size="26" font-weight="700" fill="#102A2B">칼국수 사리　最後煮麵</text>
  <text x="90" y="698" font-size="17" fill="#5C6B6B">剩下的湯拿來煮刀切麵</text>

  <!-- optional side box A: near step 2/3 boundary -->
  <path d="M 1020 368 L 1060 368" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6" fill="none" marker-end="url(#arrow-opt)"/>
  <rect x="1060" y="273" width="460" height="190" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="1090" y="289" width="70" height="30" rx="15" fill="#D97A2B"/>
  <text x="1125" y="310" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可選</text>
  <text x="1090" y="353" font-size="24" font-weight="700" fill="#8A4A14">다대기／신김치</text>
  <text x="1090" y="383" font-size="16" fill="#8A4A14">（湯要辣的話）</text>
  <text x="1090" y="417" font-size="17" fill="#8A4A14">辣醬或酸泡菜，加進湯裡一起煮</text>

  <!-- optional side box B: near step 5 -->
  <path d="M 1020 678 L 1060 678" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6" fill="none" marker-end="url(#arrow-opt)"/>
  <rect x="1060" y="588" width="460" height="180" rx="14" fill="#FBEFE3" stroke="#D97A2B" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="1090" y="604" width="70" height="30" rx="15" fill="#D97A2B"/>
  <text x="1125" y="625" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">可選</text>
  <text x="1090" y="668" font-size="24" font-weight="700" fill="#8A4A14">죽</text>
  <text x="1090" y="698" font-size="16" fill="#8A4A14">（有的店可以點）</text>
  <text x="1090" y="732" font-size="17" fill="#8A4A14">收尾也可以換成粥</text>

  <!-- footer -->
  <text x="60" y="840" font-size="16" fill="#102A2B">吃法整理自 KTO 韓國觀光公社的官方頁，逐步依據見下方正文。</text>
  <text x="1540" y="874" font-size="15" fill="#5C6B6B" text-anchor="end">© Mokaair 製圖 2026</text>
</svg>
