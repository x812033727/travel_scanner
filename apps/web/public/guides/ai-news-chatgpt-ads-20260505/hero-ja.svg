<title id="title">ChatGPT広告がセルフサーブ購入に対応：OpenAIが5月に発表したツールと課金・ターゲティングの仕組み</title><desc id="desc">オリジナルイラスト：左側に小さい順から大きい順へ積み重なった4つの角丸四角形があり、アカウント・キャンペーン・広告グループ・広告の4つの階層を表す。矢印が右側の吹き出しを指しており、吹き出しとさらに右にある広告看板の間には縦の点線があり、公式が説明する「広告と会話は分離されている」ことを表す。</desc>
