<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><title id="title">三段分鏡的連續性</title><desc id="desc">全景：交代杯子與場景；近景：保持主體與光源；結尾：檢查接續並匯出</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0" stroke="none" stroke-width="0"/><text x="65" y="110" font-size="78" font-weight="700" fill="#163431">三段分鏡的連續性</text><rect x="60" y="165" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="266" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="293" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">一</text><text x="245" y="247" font-size="76" font-weight="700" fill="#163431">全景</text><text x="245" y="333" font-size="76" fill="#87583B">交代杯子與場景</text><rect x="60" y="390" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="491" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="518" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">二</text><text x="245" y="472" font-size="76" font-weight="700" fill="#163431">近景</text><text x="245" y="558" font-size="76" fill="#87583B">保持主體與光源</text><rect x="60" y="615" width="1480" height="207" rx="24" fill="#FFFFFF" stroke="#87583B" stroke-width="4"/><circle cx="150" cy="716" r="53" fill="#87583B" stroke="none" stroke-width="0"/><text x="150" y="743" text-anchor="middle" font-size="76" font-weight="700" fill="#FFFFFF">三</text><text x="245" y="697" font-size="76" font-weight="700" fill="#163431">結尾</text><text x="245" y="783" font-size="76" fill="#87583B">檢查接續並匯出</text><text x="1530" y="876" text-anchor="end" font-size="22" fill="#49615C">© Mokaair · 教學示意</text></svg>