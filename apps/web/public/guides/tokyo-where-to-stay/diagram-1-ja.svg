th="3"/><rect x="390" y="502.6" width="400" height="110.60000000000002" rx="16" fill="#F7F1E8" stroke="#2E7D5B" stroke-width="3"/><rect x="50" y="642.6" width="290" height="138.60000000000002" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="590" y="187.6" width="350" height="107.79999999999998" rx="16" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/><rect x="810" y="662.6" width="330" height="110.60000000000002" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="100" y="1012.6" width="330" height="110.5999999999998" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="1230" y="422.6" width="320" height="110.60000000000002" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="1230" y="172.6" width="320" height="110.6" rx="16" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/><rect x="1230" y="1172.6" width="320" height="110.59999999999991" rx="16" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/><rect x="850" y="377.6" width="300" height="110.60000000000002" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="510" y="762.6" width="260" height="110.60000000000002" rx="16" fill="#FFFFFF" stroke="#0D6B68" stroke-width="3"/><rect x="820" y="982.6" width="330" height="73.60000000000002" rx="16" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/><rect x="830" y="1802.6" width="45" height="24" rx="6" fill="#fff" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">東京ではどこに泊まる？JR山手線の環に沿った七つのエリア</tspan></text><text data-source-index="1" x="50" y="119.6" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="119.6">東京の宿泊先ガイド・概略図、正確な縮尺ではありません・各社公式サイトの最速所要時間を2026年9月に確認</tspan></text><text data-source-index="2" x="410" y="546.6" font-size="24" font-weight="700" fill="#2E7D5B" xml:space="preserve"><tspan x="410" y="546.6">JR山手線</tspan></text><text data-source-index="3" x="410" y="585.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="410" y="585.2">環状線・内回りと外回りが運行</tspan></text><text data-source-index="20" x="70" y="686.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="686.6">新宿</tspan></text><text data-source-index="27" x="70" y="725.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="725.2">N'EX直通・夜遊び・出口多</tspan><tspan x="70" y="753.2">数</tspan></text><text data-source-index="21" x="200" y="221.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="200" y="221.6">池袋</tspan></text><text data-source-index="28" x="200" y="260.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="200" y="260.2">Skylinerで日暮里へ、山手線に</tspan><tspan x="200" y="288.2">乗換</tspan></text><text data-source-index="22" x="120" y="1056.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="120" y="1056.6">渋谷</tspan></text><text data-source-index="29" x="120" y="1095.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="120" y="1095.1999999999998">N'EX直通・若者向け・坂が多い</tspan></text><text data-source-index="23" x="830" y="706.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="830" y="706.6">東京駅</tspan></text><text data-source-index="30" x="830" y="745.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="830" y="745.2">N'EXで53分・新幹線</tspan></text><text data-source-index="24" x="530" y="806.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="530" y="806.6">銀座</tspan></text><text data-source-index="31" x="530" y="845.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="530" y="845.2">地下鉄三路線・買い物</tspan></text><text data-source-index="25" x="870" y="421.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="870" y="421.6">上野</tspan></text><text data-source-index="32" x="870" y="460.20000000000005" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="870" y="460.20000000000005">Skylinerで41分・アメ横</tspan></text><text data-source-index="26" x="1250" y="466.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1250" y="466.6">浅草</tspan></text><text data-source-index="33" x="1250" y="505.20000000000005" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="505.20000000000005">京急直通37分・雷門</tspan></text><text data-source-index="16" x="610" y="231.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="610" y="231.6">日暮里</tspan></text><text data-source-index="15" x="610" y="268.2" font-size="18" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="610" y="268.2">Skylinerで36分・山手線に乗換</tspan></text><text data-source-index="17" x="840" y="1026.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1026.6">浜松町</tspan></text><text data-source-index="18" x="530" y="1206.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="530" y="1206.6">品川</tspan></text><text data-source-index="19" x="530" y="1243.1999999999998" font-size="18" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="530" y="1243.1999999999998">京急14分・N'EX停車・山手線に乗換</tspan></text><text data-source-index="11" x="1250" y="216.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="216.6">成田空港 NRT</tspan></text><text data-source-index="12" x="1250" y="255.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="255.2">Skyliner・N'EX・バス</tspan></text><text data-source-index="13" x="1250" y="1216.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="1216.6">羽田空港 HND</tspan></text><text data-source-index="14" x="1250" y="1255.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="1255.1999999999998">京急・モノレール・バス</tspan></text><text data-source-index="4" x="70" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1432.6">京成Skyliner　日暮里36分・上野41分</tspan></text><text data-source-index="5" x="840" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1432.6">JR N'EX　東京53分</tspan></text><text data-source-index="6" x="840" y="1469.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1469.6">N'EXは品川・渋谷・新宿へ直通、乗換不要</tspan></text><text data-source-index="7" x="70" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1562.6">京急　品川14分</tspan></text><text data-source-index="8" x="70" y="1599.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1599.6">京急は都営浅草線へ直通</tspan></text><text data-source-index="9" x="70" y="1636.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1636.6">浅草37分・押上41分</tspan></text><text data-source-index="10" x="840" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1562.6">東京モノレール　浜松町13分</tspan></text><text data-source-index="34" x="115" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1719.6">JR山手線</tspan></text><text data-source-index="35" x="895" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1719.6">京成Skyliner</tspan></text><text data-source-index="36" x="115" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1769.6">JR N'EX</tspan></text><text data-source-index="37" x="895" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1769.6">京急（破線＝都営浅草線へ直通）</tspan></text><text data-source-index="38" x="115" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1819.6">東京モノレール</tspan></text><text data-source-index="39" x="895" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1819.6">宿泊エリア・枠内に向いている人を一言で表示</tspan></text><text data-source-index="40" x="115" y="1869.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1869.6">地下鉄駅（山手線の駅ではない）</tspan></text><text data-source-index="41" x="50" y="1927.6" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1927.6">© Mokaair 制作 2026</tspan></text></svg>
