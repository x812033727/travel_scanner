<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1980" viewBox="0 0 1600 1980" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">東京の宿泊先七エリアと空港路線の概略図／東京でどこに泊まる？山手線沿いの七エリア</title><desc id="desc">簡略化した東京の模式図。JR 山手線を環状に描き、環上には順に池袋、新宿、渋谷、品川、浜松町、東京駅、上野、日暮里がある。銀座は環の内側で東京駅の近く、浅草は環の外側の北東にある。成田空港から：京成 Skyliner で日暮里まで最短 36 分、上野まで 41 分；JR N'EX で東京駅まで最短 53 分、そのまま品川、渋谷、新宿へ向かう。羽田空港から：京急で品川まで 14 分、都営浅草線への直通運転で浅草まで 37 分、押上まで 41 分；東京モノレールで浜松町まで 13 分。七つの宿泊エリアを青緑色の枠で示し、それぞれにどんな人に適しているかを一文添える。</desc><rect width="1600" height="1980" fill="#F7F1E8"/><ellipse cx="580" cy="712.6" rx="380" ry="430" fill="none" stroke="#2E7D5B" stroke-width="9"/><circle cx="390" cy="340.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="200" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="311" cy="1016.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="680" cy="1127.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="870" cy="992.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="960" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="880" cy="442.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="730" cy="312.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><path d="M 1230 262.6 C 1080 172.6, 950 202.6, 730 312.6 L 880 442.6" fill="none" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 292.6 C 1160 492.6, 1120 662.6, 960 712.6 L 1190 802.6 L 1190 1112.6 C 990 1212.6, 780 1172.6, 680 1127.6 L 311 1016.6 L 200 712.6" fill="none" stroke="#B8442D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 1252.6 C 1070 1302.6, 890 1242.6, 680 1127.6" fill="none" stroke="#7E57C2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1380 1182.6