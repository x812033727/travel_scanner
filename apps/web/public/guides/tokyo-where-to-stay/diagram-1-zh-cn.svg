ll="#102A2B" xml:space="preserve"><tspan x="410" y="585.2">环线，顺时针、逆时针都有车</tspan></text><text data-source-index="20" x="70" y="686.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="686.6">新宿 Shinjuku</tspan></text><text data-source-index="27" x="70" y="725.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="725.2">N'EX 直达・夜生活・出口多</tspan></text><text data-source-index="21" x="200" y="221.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="200" y="221.6">池袋 Ikebukuro</tspan></text><text data-source-index="28" x="200" y="260.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="200" y="260.2">Skyliner 到日暮里换乘山手线</tspan></text><text data-source-index="22" x="120" y="1056.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="120" y="1056.6">涩谷 Shibuya</tspan></text><text data-source-index="29" x="120" y="1095.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="120" y="1095.1999999999998">N'EX 直达・年轻・坡道多</tspan></text><text data-source-index="23" x="830" y="706.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="830" y="706.6">东京站 Tokyo</tspan></text><text data-source-index="30" x="830" y="745.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="830" y="745.2">N'EX 53 分钟・新干线</tspan></text><text data-source-index="24" x="530" y="806.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="530" y="806.6">银座 Ginza</tspan></text><text data-source-index="31" x="530" y="845.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="530" y="845.2">三条地铁线・购物</tspan></text><text data-source-index="25" x="870" y="421.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="870" y="421.6">上野 Ueno</tspan></text><text data-source-index="32" x="870" y="460.200