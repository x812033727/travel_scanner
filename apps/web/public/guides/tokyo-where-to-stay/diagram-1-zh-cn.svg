ze="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="1255.1999999999998">京急・单轨电车・巴士</tspan></text><text data-source-index="4" x="70" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1432.6">京成 Skyliner　日暮里 36 分钟・上野 41 分钟</tspan></text><text data-source-index="5" x="840" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1432.6">JR N'EX 东京 53 分钟</tspan></text><text data-source-index="6" x="840" y="1469.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1469.6">N'EX 续开品川・涩谷・新宿，无需换车</tspan></text><text data-source-index="7" x="70" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1562.6">京急 Keikyu　品川 14 分钟</tspan></text><text data-source-index="8" x="70" y="1599.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1599.6">京急直通都营浅草线</tspan></text><text data-source-index="9" x="70" y="1636.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1636.6">浅草 37 分钟・押上 41 分钟</tspan></text><text data-source-index="10" x="840" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1562.6">东京单轨电车 Monorail　滨松町 13 分钟</tspan></text><text data-source-index="34" x="115" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1719.6">JR 山手线</tspan></text><text data-source-index="35" x="895" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1719.6">京成 Skyliner</tspan></text><text data-source-index="36" x="115" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1769.6">JR N'EX</tspan></text><text data-source-index="37" x="895" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1769.6">京急（虚线＝直通都营浅草线）</tspan></text><text data-source-index="38" x="115" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1819.6">东京单轨电车</tspan></text><text data-source-index="39" x="895" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1819.6">住宿区域，框内说明适合谁</tspan></text><text data-source-index="40" x="115" y="1869.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1869.6">地铁站（不在山手线上）</tspan></text><text data-source-index="41" x="50" y="1927.6" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1927.6">© Mokaair 制图 2026</tspan></text></svg>
