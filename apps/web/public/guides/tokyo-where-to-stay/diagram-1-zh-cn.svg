<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1980" viewBox="0 0 1600 1980" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">东京七个住宿区域与机场线路示意图 / 东京住哪里：山手线环上的七个区域</title><desc id="desc">简化的东京示意地图。JR 山手线画成一个环，环上依次是池袋、新宿、涩谷、品川、滨松町、东京车站、上野、日暮里；银座在环内靠东京车站，浅草在环外东北侧。成田机场出发：京成 Skyliner 到日暮里最快 36 分、上野 41 分；JR N'EX 到东京车站最快 53 分，再继续前往品川、涩谷、新宿。羽田机场出发：京急到品川 14 分，直通都营浅草线到浅草 37 分、押上 41 分；东京单轨电车到滨松町 13 分。七个住宿区用青绿色框标出，各附一句说明适合谁。</desc><rect width="1600" height="1980" fill="#F7F1E8"/><ellipse cx="580" cy="712.6" rx="380" ry="430" fill="none" stroke="#2E7D5B" stroke-width="9"/><circle cx="390" cy="340.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="200" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="311" cy="1016.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="680" cy="1127.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="870" cy="992.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="960" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="880" cy="442.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="730" cy="312.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><path d="M 1230 262.6 C 1080 172.6, 950 202.6, 730 312.6 L 880 442.6" fill="none" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 292.6 C 1160 492.6, 1120 662.6, 960 712.6 L 1190 802.6 L 1190 1112.6 C 990 1212.6, 780 1172.6, 680 1127.6 L 311 1016.6 L 200 712.6" fill="none" stroke="#B8442D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 1252.6 C 1070 1302.6, 890 1242.6, 680 1127.6" fill="none" stroke="#7E57C2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1380 1182.6 C 1580 1032.6, 1570 712.6, 1390 512.6" fill="none" stroke=