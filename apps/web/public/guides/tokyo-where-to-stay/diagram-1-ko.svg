<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1980" viewBox="0 0 1600 1980" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">도쿄 숙박 지역 일곱 곳과 공항 노선 안내도 / 도쿄 어디에 묵을까? 야마노테선 순환 구간의 일곱 지역</title><desc id="desc">단순화한 도쿄 개략 지도. JR 야마노테선을 고리로 그리고, 고리를 따라 이케부쿠로, 신주쿠, 시부야, 시나가와, 하마마쓰초, 도쿄역, 우에노, 닛포리가 순서대로 표시되어 있다. 긴자는 고리 안쪽의 도쿄역 가까이에, 아사쿠사는 고리 바깥쪽 북동쪽에 있다. 나리타 공항 출발: 게이세이 Skyliner로 닛포리까지 최단 36분, 우에노까지 41분. JR N'EX로 도쿄역까지 최단 53분이며, 이후 시나가와, 시부야, 신주쿠로 계속 간다. 하네다 공항 출발: 게이큐로 시나가와까지 14분, 도에이 아사쿠사선 직통으로 아사쿠사까지 37분, 오시아게까지 41분. 도쿄 모노레일로 하마마쓰초까지 13분. 일곱 숙박 지역이 청록색 테두리로 표시되어 있으며, 각 지역마다 누구에게 적합한지 한 문장씩 덧붙어 있다.</desc><rect width="1600" height="1980" fill="#F7F1E8"/><ellipse cx="580" cy="712.6" rx="380" ry="430" fill="none" stroke="#2E7D5B" stroke-width="9"/><circle cx="390" cy="340.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="200" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="311" cy="1016.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="680" cy="1127.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="870" cy="992.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="960" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="880" cy="442.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="730" cy="312.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><path d="M 1230 262.6 C 1080 172.6, 950 202.6, 730 312.6 L 880 442.6" fill="none" stroke="#2F6F9F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 292.6 C 1160 492.6, 1120 662.6, 960 712.6 L 1190 802.6 L 1190 1112.6 C 990 1212.6, 780 1172.6, 680 1127.6 L 311 1016.6 L 200 712.6" fill="none" stroke="#B8442D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 1252.6 C 1070 1302.6, 890 1242.6, 680 1127.6" fill="none" stroke="#7E57C2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1380 1182.6 C 1580 1032.6, 1570 712.6, 1390 512.6" fill="none" stroke="#7E57C2" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1230 1212.6 C 1100 1122.6, 1040 1032.6, 870 992.6" fill="none" stroke="#D97A2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 316.2 V 340.6" fill="none" stroke="#0D6B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680 1127.6 V 1162.6" fill="none" stroke="#102A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="737.6" r="8" fill="#6B4A3A"/><circle cx="1390" cy="402.6" r="8" fill="#6B4A3A"/><path d="M 50 1714.6 h 50" fill="none" stroke="#2E7D5B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 830 1714.6 h 50" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 1764.6 h 50" fill="none" stroke="#B8442D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 830 1764.6 h 50" fill="none" stroke="#7E57C2" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 1814.6 h 50" fill="none" stroke="#D97A2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="1864.6" r="7" fill="#6B4A3A"/><rect x="50" y="1522.6" width="720" height="142" rx="16" fill="#FFFFFF" stroke="#7E57C2" stroke-width="3"/><rect x="820" y="1392.6" width="730" height="105" rx="16" fill="#FFFFFF" stroke="#B8442D" stroke-width="3"/><rect x="820" y="1522.6" width="730" height="68" rx="16" fill="#FFFFFF" stroke="#D97A2B" stroke-width="3"/><rect x="510" y="1162.6" width="460" height="107.79999999999995" rx="16" fill="#FFFFFF" stroke="#102A2B" stroke-width="3"/><rect x="50" y="1392.6" width="720" height="68" rx="16" fill="#FFFFFF" stroke="#2