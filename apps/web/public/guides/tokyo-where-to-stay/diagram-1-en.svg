6" fill="#fff" stroke="#0D6B68" stroke-width="3"/><text data-source-index="0" x="50" y="74" font-size="34" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="50" y="74">Where to stay in Tokyo: seven areas around the JR Yamanote loop</tspan></text><text data-source-index="1" x="50" y="119.6" font-size="20" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="119.6">Where to stay in Tokyo · Schematic, not to scale · Fastest times verified on operators<tspan font-family="Arial">’</tspan> official websites in 2026/9</tspan></text><text data-source-index="2" x="410" y="546.6" font-size="24" font-weight="700" fill="#2E7D5B" xml:space="preserve"><tspan x="410" y="546.6">JR Yamanote Line</tspan></text><text data-source-index="3" x="410" y="585.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="410" y="585.2">Loop line, with trains in both </tspan><tspan x="410" y="613.2">directions</tspan></text><text data-source-index="20" x="70" y="686.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="70" y="686.6">Shinjuku</tspan></text><text data-source-index="27" x="70" y="725.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="725.2">Direct N'EX · nightlife · </tspan><tspan x="70" y="753.2">many exits</tspan></text><text data-source-index="21" x="200" y="221.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="200" y="221.6">Ikebukuro</tspan></text><text data-source-index="28" x="200" y="260.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="200" y="260.2">Skyliner to Nippori, then </tspan><tspan x="200" y="288.2">Yamanote Line</tspan></text><text data-source-index="22" x="120" y="1056.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="120" y="1056.6">Shibuya</tspan></text><text data-source-index="29" x="120" y="1095.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="120" y="1095.1999999999998">Direct N'EX · youthful · </tspan><tspan x="120" y="1123.1999999999998">many slopes</tspan></text><text data-source-index="23" x="830" y="706.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="830" y="706.6">Tokyo Station</tspan></text><text data-source-index="30" x="830" y="745.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="830" y="745.2">N'EX 53 min · Shinkansen</tspan></text><text data-source-index="24" x="530" y="806.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="530" y="806.6">Ginza</tspan></text><text data-source-index="31" x="530" y="845.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="530" y="845.2">Three subway lines · </tspan><tspan x="530" y="873.2">shopping</tspan></text><text data-source-index="25" x="870" y="421.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="870" y="421.6">Ueno</tspan></text><text data-source-index="32" x="870" y="460.20000000000005" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="870" y="460.20000000000005">Skyliner 41 min · Ameyoko</tspan></text><text data-source-index="26" x="1250" y="466.6" font-size="24" font-weight="700" fill="#0D6B68" xml:space="preserve"><tspan x="1250" y="466.6">Asakusa</tspan></text><text data-source-index="33" x="1250" y="505.20000000000005" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="505.20000000000005">Direct Keikyu 37 min · </tspan><tspan x="1250" y="533.2">Kaminarimon</tspan></text><text data-source-index="16" x="610" y="231.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="610" y="231.6">Nippori</tspan></text><text data-source-index="15" x="610" y="268.2" font-size="18" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="610" y="268.2">Skyliner 36 min · transfer to </tspan><tspan x="610" y="293.4">Yamanote Line</tspan></text><text data-source-index="17" x="840" y="1026.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1026.6">Hamamatsucho</tspan></text><text data-source-index="18" x="530" y="1206.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="530" y="1206.6">Shinagawa</tspan></text><text data-source-index="19" x="530" y="1243.1999999999998" font-size="18" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="530" y="1243.1999999999998">Keikyu 14 min · N'EX stop · Yamanote transfer</tspan></text><text data-source-index="11" x="1250" y="216.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="216.6">Narita Airport NRT</tspan></text><text data-source-index="12" x="1250" y="255.2" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="255.2">Skyliner · N'EX · bus</tspan></text><text data-source-index="13" x="1250" y="1216.6" font-size="24" font-weight="700" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="1216.6">Haneda Airport HND</tspan></text><text data-source-index="14" x="1250" y="1255.1999999999998" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="1250" y="1255.1999999999998">Keikyu · monorail · bus</tspan></text><text data-source-index="4" x="70" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1432.6">Keisei Skyliner · Nippori 36 min · Ueno 41 min</tspan></text><text data-source-index="5" x="840" y="1432.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1432.6">JR N'EX · Tokyo 53 min</tspan></text><text data-source-index="6" x="840" y="1469.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1469.6">N'EX continues to Shinagawa, Shibuya, Shinjuku · no transfer</tspan></text><text data-source-index="7" x="70" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1562.6">Keikyu · Shinagawa 14 min</tspan></text><text data-source-index="8" x="70" y="1599.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1599.6">Keikyu through service to Toei Asakusa Line</tspan></text><text data-source-index="9" x="70" y="1636.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="70" y="1636.6">Asakusa 37 min · Oshiage 41 min</tspan></text><text data-source-index="10" x="840" y="1562.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="840" y="1562.6">Tokyo Monorail · Hamamatsucho 13 min</tspan></text><text data-source-index="34" x="115" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1719.6">JR Yamanote Line</tspan></text><text data-source-index="35" x="895" y="1719.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1719.6">Keisei Skyliner</tspan></text><text data-source-index="36" x="115" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1769.6">JR N'EX</tspan></text><text data-source-index="37" x="895" y="1769.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1769.6">Keikyu (dashed = through Toei Asakusa Line)</tspan></text><text data-source-index="38" x="115" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1819.6">Tokyo Monorail</tspan></text><text data-source-index="39" x="895" y="1819.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="895" y="1819.6">Accommodation area, with a note on whom it suits</tspan></text><text data-source-index="40" x="115" y="1869.6" font-size="20" font-weight="400" fill="#102A2B" xml:space="preserve"><tspan x="115" y="1869.6">Subway station (off the Yamanote Line)</tspan></text><text data-source-index="41" x="50" y="1927.6" font-size="18" font-weight="400" fill="#5C6B6B" xml:space="preserve"><tspan x="50" y="1927.6">© Mokaair 2026</tspan></text></svg>
