<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1980" viewBox="0 0 1600 1980" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','Microsoft JhengHei','Yu Gothic','Malgun Gothic',sans-serif"><title id="title">Tokyo’s seven accommodation areas and airport routes / Where to stay in Tokyo: seven areas on the Yamanote loop</title><desc id="desc">A simplified schematic map of Tokyo. The JR Yamanote Line is drawn as a loop, with Ikebukuro, Shinjuku, Shibuya, Shinagawa, Hamamatsucho, Tokyo Station, Ueno, and Nippori appearing in that order around it. Ginza is inside the loop near Tokyo Station, and Asakusa is outside the loop to the northeast. From Narita Airport: Keisei Skyliner reaches Nippori in as little as 36 minutes and Ueno in 41 minutes; JR N'EX reaches Tokyo Station in as little as 53 minutes, then continues to Shinagawa, Shibuya, and Shinjuku. From Haneda Airport: Keikyu reaches Shinagawa in 14 minutes and runs through onto the Toei Asakusa Line, reaching Asakusa in 37 minutes and Oshiage in 41 minutes; Tokyo Monorail reaches Hamamatsucho in 13 minutes. Seven accommodation areas are outlined in teal, each with a sentence explaining who it suits.</desc><rect width="1600" height="1980" fill="#F7F1E8"/><ellipse cx="580" cy="712.6" rx="380" ry="430" fill="none" stroke="#2E7D5B" stroke-width="9"/><circle cx="390" cy="340.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="200" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="311" cy="1016.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="680" cy="1127.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="870" cy="992.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="960" cy="712.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="880" cy="442.6" r="9" fill="#fff" stroke="#102A2B" stroke-width="3"/><circle cx="730" cy="312.6" r="9" fill="#fff" stroke="#1