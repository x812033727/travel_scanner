<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">AI Diagram / Artificial Intelligence</title><desc id="desc">Human goals and data enter a system together. It produces predictions, content or recommendations, and the usage workflow determines whether action follows.</desc><rect width="1600" height="900" fill="#F7F1E8"></rect><text x="60" y="52" fill="#102A2B" font-size="30" font-weight="700">Understand AI Through Inputs, Inference and Results</text><text x="60" y="84" fill="#5C6B6B" font-size="18">Artificial Intelligence</text><rect x="90" y="200" width="370" height="140" rx="24" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"></rect><text x="275" y="282" text-anchor="middle" font-size="36" fill="#102A2B">Human Goals</text><rect x="90" y="480" width="370" height="140" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="275" y="562" text-anchor="middle" font-size="36" fill="#102A2B">Data Inputs</text><path d="M 460 270 L 650 410" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="410" r="10" fill="#0D6B68"></circle><path d="M 460 550 L 650 410" stroke="#0D6B68" stroke-width="9" fill="none"></path><circle cx="650" cy="410" r="10" fill="#0D6B68"></circle><rect x="650" y="300" width="350" height="220" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="825" y="422" text-anchor="middle" font-size="36" fill="#102A2B">System Inference</text><path d="M 1000 410 H 1060 M 1060 285 V 555 M 1060 285 H 1120 M 1060 555 H 1120" stroke="#0D6B68" stroke-width="9" fill="none"></path><rect x="1120" y="220" width="390" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1315" y="297" text-anchor="middle" font-size="36" fill="#102A2B">Predictions or Content</text><rect x="1120" y="490" width="390" height="130" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"></rect><text x="1315" y="567" text-anchor="middle" font-size="25" fill="#102A2B" style="font-size: 25px;">Recommendations or Decisions</text><text x="800" y="760" text-anchor="middle" font-size="32" fill="#102A2B">Verify Uses, Data and Operational Boundaries</text><text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair Graphic 2026</text></svg>
