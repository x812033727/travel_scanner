<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif"><title id="title">인공지능 / Artificial Intelligence</title><desc id="desc">사진, 글이 적힌 종이, 방향을 나타내는 경로가 중앙의 원형 연산부로 모여들고, 바깥으로 다양한 모양의 결과가 생성되어 인공지능의 여러 용도를 상징한다.</desc><rect width="1600" height="900" fill="#F7F1E8" /><circle cx="800" cy="450" r="215" fill="#E3F0EF" stroke="#0D6B68" stroke-width="14" /><path d="M700 390 L800 330 L900 390 V510 L800 570 L700 510 Z" fill="white" stroke="#0D6B68" stroke-width="12" /><path d="M700 390 L800 450 L900 390 M800 450 V570" fill="none" stroke="#0D6B68" stroke-width="12" /><rect x="170" y="220" width="250" height="210" rx="30" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="10" /><path d="M210 380 L270 300 L340 370 L385 330" stroke="#2F6F9F" stroke-width="16" fill="none" /><rect x="220" y="530" width="210" height="220" rx="25" fill="white" stroke="#2F6F9F" stroke-width="10" /><path d="M270 600 H380 M270 670 H365 M1030 450 H1200" stroke="#2F6F9F" stroke-width="18" /><circle cx="1280" cy="300" r="85" fill="#D97A2B" /><rect x="1195" y="530" width="170" height="170" rx="30" fill="#E3F0EF" stroke="#0D6B68" stroke-width="10" /></svg>
