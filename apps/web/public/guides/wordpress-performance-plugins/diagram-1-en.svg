<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Segoe UI','Noto Sans',sans-serif">
<title id="title">Configure and verify performance plugins</title><desc id="desc">Four stages show assigning functions, establishing a test baseline, changing one setting at a time, and accepting it only after functional and performance checks.</desc>
<rect width="1600" height="900" fill="#F7F1E8" />
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">Configure and verify performance plugins</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">Inventory first, then change one thing with a way back</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Assign roles</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Host and CDN</text>
<text x="108.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Images and cache tools</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Avoid overlap</text>
<rect x="449.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="477.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Set baseline</text>
<text x="477.0" y="371" font-size="29" fill="#102A2B" text-anchor="start" font-weight="normal">Representative pages</text>
<text x="477.0" y="423" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">Recoverable settings</text>
<text x="477.0" y="475" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">Same test conditions</text>
<rect x="818.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4" />
<text x="846.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Adjust</text>
<text x="846.0" y="371" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">One problem at a time</text>
<text x="846.0" y="423" font-size="27" fill="#102A2B" text-anchor="start" font-weight="normal">Understand Test Mode</text>
<text x="846.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Wait for output</text>
<rect x="1187.0" y="256" width="333.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4" />
<text x="1215.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">Accept</text>
<text x="1215.0" y="371" font-size="30" fill="#102A2B" text-anchor="start" font-weight="normal">Check functions first</text>
<text x="1215.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Speed and function</text>
<text x="1215.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Record exclusions</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">Give each setting a purpose and verify both function and speed.</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Original graphic by Mokaair</text>
</svg>