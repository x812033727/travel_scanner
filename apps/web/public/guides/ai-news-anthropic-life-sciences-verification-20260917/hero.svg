<title id="title">Anthropic 生命科學驗證方案上線：通過驗證的團隊才鬆綁生物類限制</title><desc id="desc">原創插圖：中央畫一個對半分開的盾牌圖案，左半邊維持完整的柵欄紋路，代表標準防護沒有改變；右半邊柵欄出現幾道缺口，代表對生物相關工作放寬的部分，缺口旁各站一個小方塊代表通過驗證的團隊，不畫任何商標或介面畫面。</desc>
