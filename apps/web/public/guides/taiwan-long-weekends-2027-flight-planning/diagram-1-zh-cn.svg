<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 台湾连休年历，对照日本与韩国放假日 / 2027 年台湾连休及日本、韩国假日</title>
  <desc id="desc">2027 年 1 月到 12 月的年历，分上下两半年。台湾九个连休：元旦 1/1–1/3、春节 2/4–2/10（请 3 休 12）、和平纪念日 2/27–3/1（请 4 休 9）、儿童节及清明节 4/3–4/6（请 3 休 9）、劳动节 4/30–5/2（请 4 休 9）、国庆日 10/9–10/11 与光复节 10/23–10/25（合并请 9 休 17）、行宪纪念日 12/24–12/26 与 2028 元旦 12/31–2028/1/2（合并请 4 休 10）。三个单日假：端午节 6/9（请 4 休 9）、中秋节 9/15（请 4 休 9）、教师节 9/28（请 1 休 4）。日本：政府机关休到 1/3、3/20–3/22、4/29、5/1–5/5、9/18–9/20、10/9–10/11、政府机关 12/29–1/3。韩国：1/1–1/3、2/6–2/9、2/27–3/1、5/1–5/3、9/14–9/16、10/9–10/11、12/25–12/27。虚线框标出假期重叠：元旦、春节、和平纪念日、劳动节、中秋、国庆（三地同一周末）、行宪接 2028 元旦。</desc>
  <rect width="1600" height="900" fill="#F7F1E8" />

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2027 台湾连休年历：九个连休、三个单日假，对照日本与韩国</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">2027 年台湾连休及日本、韩国假日 · 请假天数只算周一到周五</text>


