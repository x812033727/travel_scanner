<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 台灣連假年曆，對照日本與韓國放假日 / Taiwan long weekends in 2027 with Japan and Korea holidays</title>
  <desc id="desc">2027 年 1 月到 12 月的年曆，分上下兩半年。台灣九個連假：元旦 1/1–1/3、春節 2/4–2/10（請 3 休 12）、和平紀念日 2/27–3/1（請 4 休 9）、兒童節及清明節 4/3–4/6（請 3 休 9）、勞動節 4/30–5/2（請 4 休 9）、國慶日 10/9–10/11 與光復節 10/23–10/25（合併請 9 休 17）、行憲紀念日 12/24–12/26 與 2028 元旦 12/31–2028/1/2（合併請 4 休 10）。三個單日假：端午節 6/9（請 4 休 9）、中秋節 9/15（請 4 休 9）、教師節 9/28（請 1 休 4）。日本：官公廳休到 1/3、3/20–3/22、4/29、5/1–5/5、9/18–9/20、10/9–10/11、官公廳 12/29–1/3。韓國：1/1–1/3、2/6–2/9、2/27–3/1、5/1–5/3、9/14–9/16、10/9–10/11、12/25–12/27。虛線框標出撞期：元旦、春節、和平紀念日、勞動節、中秋、國慶（三地同週末）、行憲接 2028 元旦。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2027 台灣連假年曆：九個連假、三個單日假，對照日本與韓國</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Taiwan long weekends in 2027, with Japan and Korea holidays · 請假天數只算週一到週五</text>

