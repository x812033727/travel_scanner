<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027年 台湾の連休カレンダー、日本・韓国の休日と比較 / 2027年の台湾の連休と日本・韓国の休日</title>
  <desc id="desc">2027年1月から12月のカレンダーを上半期と下半期に分けて表示。台湾の九つの連休：元日1/1–1/3、春節2/4–2/10（休暇3日で12連休）、和平記念日2/27–3/1（休暇4日で9連休）、児童節・清明節4/3–4/6（休暇3日で9連休）、労働節4/30–5/2（休暇4日で9連休）、国慶日10/9–10/11と光復節10/23–10/25（つなげて休暇9日で17連休）、憲法施行記念日12/24–12/26と2028年の元日12/31–2028/1/2（つなげて休暇4日で10連休）。三つの単発の祝日：端午節6/9（休暇4日で9連休）、中秋節9/15（休暇4日で9連休）、教師節9/28（休暇1日で4連休）。日本：官公庁は1/3まで休み、3/20–3/22、4/29、5/1–5/5、9/18–9/20、10/9–10/11、官公庁は12/29–1/3が休み。韓国：1/1–1/3、2/6–2/9、2/27–3/1、5/1–5/3、9/14–9/16、10/9–10/11、12/25–12/27。破線枠で休日が重なる期間を表示：元日、春節、和平記念日、労働節、中秋節、国慶日（三地域が同じ週末）、憲法施行記念日から2028年の元日まで。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2027年 台湾の連休カレンダー：九つの連休と三つの単発の祝日、日本・韓国と比較</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">2027年の台湾の連休と日本・韓国の休日 · 休暇日数は月曜から金曜のみ</text>


