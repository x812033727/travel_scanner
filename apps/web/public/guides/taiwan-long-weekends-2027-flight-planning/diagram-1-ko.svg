<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 대만 연휴 달력, 일본·한국 휴일 비교 / 2027 대만 연휴와 일본·한국 휴일</title>
  <desc id="desc">2027년 1월부터 12월까지를 상·하반기로 나눈 연간 달력입니다. 대만의 아홉 번의 연휴: 신정 1/1–1/3, 춘절 2/4–2/10(휴가 3일로 12일 휴식), 평화기념일 2/27–3/1(휴가 4일로 9일 휴식), 어린이날·청명절 4/3–4/6(휴가 3일로 9일 휴식), 노동절 4/30–5/2(휴가 4일로 9일 휴식), 국경일 10/9–10/11과 대만 광복절 10/23–10/25(연결해 휴가 9일로 17일 휴식), 헌법시행기념일 12/24–12/26과 2028 신정 12/31–2028/1/2(연결해 휴가 4일로 10일 휴식). 세 번의 하루 공휴일: 단오절 6/9(휴가 4일로 9일 휴식), 중추절 9/15(휴가 4일로 9일 휴식), 교사의 날 9/28(휴가 1일로 4일 휴식). 일본: 관공서 1/3까지 휴무, 3/20–3/22, 4/29, 5/1–5/5, 9/18–9/20, 10/9–10/11, 관공서 12/29–1/3 휴무. 한국: 1/1–1/3, 2/6–2/9, 2/27–3/1, 5/1–5/3, 9/14–9/16, 10/9–10/11, 12/25–12/27. 점선 테두리로 겹치는 기간을 표시했습니다: 신정, 춘절, 평화기념일, 노동절, 중추절, 국경일(세 지역이 같은 주말에 휴무), 헌법시행기념일부터 2028 신정까지.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2027 대만 연휴 달력: 연휴 아홉 번·하루 공휴일 세 번, 일본·한국 비교</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">2027 대만 연휴와 일본·한국 휴일 · 휴가 일수는 월요일부터 금요일까지만 계산</text>


