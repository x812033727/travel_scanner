<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','Noto Sans KR','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">2027 Taiwan Long Weekend Calendar, Compared with Japan and Korea Holidays / Taiwan long weekends in 2027 with Japan and Korea holidays</title>
  <desc id="desc">2027 calendar, months 1 to 12, split into two half-years. Taiwan's nine long breaks: New Year 1/1–1/3; Lunar New Year 2/4–2/10 (3 leave days, 12 off); Peace Memorial Day 2/27–3/1 (4 leave, 9 off); Children's Day and Qingming 4/3–4/6 (3 leave, 9 off); Labor Day 4/30–5/2 (4 leave, 9 off); National Day 10/9–10/11 and Retrocession Day 10/23–10/25 (combined: 9 leave, 17 off); Constitution Day 12/24–12/26 and 2028 New Year 12/31–2028/1/2 (combined: 4 leave, 10 off). Three single-day holidays: Dragon Boat Festival 6/9 (4 leave, 9 off); Mid-Autumn Festival 9/15 (4 leave, 9 off); Teachers' Day 9/28 (1 leave, 4 off). Japan: government offices closed through 1/3; 3/20–3/22; 4/29; 5/1–5/5; 9/18–9/20; 10/9–10/11; government offices closed 12/29–1/3. Korea: 1/1–1/3; 2/6–2/9; 2/27–3/1; 5/1–5/3; 9/14–9/16; 10/9–10/11; 12/25–12/27. Dashed boxes mark overlaps: New Year, Lunar New Year, Peace Memorial Day, Labor Day, Mid-Autumn, National Day (all three places share the weekend), and Constitution Day through 2028 New Year.</desc>
  <rect width="1600" height="900" fill="#F7F1E8"></rect>

  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">2027 Taiwan Calendar: Nine Long Breaks, Three Single-Day Holidays · Japan/Korea</text>
