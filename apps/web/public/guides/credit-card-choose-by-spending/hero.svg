<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">先把一整年攤開，再算結構 / A year of statements becomes one structure</title>
<desc id="desc">一張抽象的插圖。畫面左半部是十二個同樣大小的白色圓角方塊，排成四欄三列，代表一整年的十二期帳單；每個方塊裡有兩道灰色短橫線，像帳單上的明細。方塊群的右側有一道深色粗箭頭水平指向右邊。畫面右半部是一條兩端圓角的長橫條，被四道細縫分成五段，五段高度相同、寬度不一，由左到右分別是墨綠、深藍、橘、綠與灰，代表同一年的消費被歸成幾個大類，每一段的寬度就是那一類的佔比。十二個方塊大小完全一樣，橫條的五段也等高，畫面上沒有任何由低到高的柱狀圖、沒有上升曲線，也沒有任何金融機構的標誌。畫面上方置中有一行字：先算結構再選卡。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
