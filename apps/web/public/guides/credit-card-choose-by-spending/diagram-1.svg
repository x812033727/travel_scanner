<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
<title id="title">同一組假設值，兩個分母 / One set of assumed numbers, two denominators</title>
<desc id="desc">全圖的金額都是為了示範算法而設的假設值。上半部是分類的三個步驟，由左向右以箭頭相連：第一格是一整年的帳單，假設總支出 60 萬元；第二格是可以刷卡的部分，假設 40 萬元，並標示這是你的分母；第三格是其中落在加碼條件內的部分，假設 6 萬元，只有這一段適用加碼。下半部是兩欄對照的換算。左欄標題為廣告的算法，分母是它指定的那一段：分子寫加碼回饋 1,800 元，分母寫該通路消費 6 萬元，結論框寫算出來一定好看，回答的是加碼寫得漂不漂亮。右欄標題為對你的算法，分母是你全年的可刷卡消費：分子寫 3,500 元減 1,200 元等於 2,300 元，分母寫 40 萬元，結論框寫可以跟另一張卡相比，回答的是你一年會多拿多少。最下面一列提醒，刷不到卡的 20 萬元不進任何一邊的分母，房租、傳統市場與規費換哪一張卡都一樣。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker></defs>

<text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">同一組假設值，兩個分母</text>
<text x="60" y="84" font-size="18" fill="#5C6B6B">One set of assumed numbers, two denominators · 圖上的金額全部是假設值</text>

<rect x="60" y="112" width="400" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="260" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">一整年的帳單</text>
<text x="260" y="218" text-anchor="middle" font-size="19" fill="#5C6B6B">假設總支出 60 萬元</text>

<path d="M478 187 H520" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="560" y="112" width="400" height="150" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
<text x="760" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">可以刷卡的部分</text>
<text x="760" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#2F6F9F">假設 40 萬元，這是你的分母</text>

<path d="M978 187 H1020" fill="none" stroke="#5C6B6B" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>

<rect x="1060" y="112" width="480" height="150" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
<text x="1300" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">其中落在加碼條件內</text>
<text x="1300" y="218" text-anchor="middle" font-size="19" fill="#5C6B6B">假設 6 萬元，只有這一段適用加碼</text>

<rect x="60" y="282" width="720" height="440" rx="14" fill="#FFFFFF" stroke="#D97A2B" stroke-width="4"/>
<rect x="60" y="282" width="720" height="110" rx="14" fill="#D97A2B"/>
<rect x="60" y="370" width="720" height="22" fill="#D97A2B"/>
<text x="420" y="334" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">廣告的算法</text>
<text x="420" y="366" text-anchor="middle" font-size="18" fill="#F7F1E8">分母是它指定的那一段</text>
<text x="420" y="430" text-anchor="middle" font-size="18" fill="#5C6B6B">分子：一年實際入帳的回饋</text>
<text x="420" y="472" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">加碼回饋 1,800 元</text>
<path d="M140 492 H700" fill="none" stroke="#D97A2B" stroke-width="4" stroke-linecap="butt"/>
<text x="420" y="528" text-anchor="middle" font-size="18" fill="#5C6B6B">分母：廣告指定的那一段消費</text>
<text x="420" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">該通路消費 6 萬元</text>
<rect x="100" y="598" width="640" height="104" rx="14" fill="#F7F1E8" stroke="#D97A2B" stroke-width="4"/>
<text x="420" y="640" text-anchor="middle" font-size="21" font-weight="700" fill="#102A2B">算出來一定好看</text>
<text x="420" y="676" text-anchor="middle" font-size="18" fill="#5C6B6B">回答的是加碼寫得漂不漂亮</text>

<rect x="820" y="282" width="720" height="440" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
<rect x="820" y="282" width="720" height="110" rx="14" fill="#0D6B68"/>
<rect x="820" y="370" width="720" height="22" fill="#0D6B68"/>
<text x="1180" y="334" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">對你的算法</text>
<text x="1180" y="366" text-anchor="middle" font-size="18" fill="#F7F1E8">分母是你全年的可刷卡消費</text>
<text x="1180" y="430" text-anchor="middle" font-size="18" fill="#5C6B6B">分子：一年回饋減掉年費</text>
<text x="1180" y="472" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">3,500 元 減 1,200 元 ＝ 2,300 元</text>
<path d="M900 492 H1460" fill="none" stroke="#0D6B68" stroke-width="4" stroke-linecap="butt"/>
<text x="1180" y="528" text-anchor="middle" font-size="18" fill="#5C6B6B">分母：你全年的可刷卡消費</text>
<text x="1180" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#102A2B">40 萬元</text>
<rect x="860" y="598" width="640" height="104" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1180" y="640" text-anchor="middle" font-size="21" font-weight="700" fill="#102A2B">可以跟另一張卡相比</text>
<text x="1180" y="676" text-anchor="middle" font-size="18" fill="#5C6B6B">回答的是你一年會多拿多少</text>

<rect x="60" y="744" width="1480" height="84" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
<text x="800" y="794" text-anchor="middle" font-size="21" fill="#102A2B">刷不到卡的 20 萬元不進任何一邊的分母：房租、傳統市場與規費，換哪一張卡都一樣</text>

