<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans KR','PingFang TC','Microsoft JhengHei','Apple SD Gothic Neo',system-ui,sans-serif">
  <title id="title">2026 韓國冬季活動時間軸：2026 年 11 月到 2027 年 1 月 / Korea winter events timeline</title>
  <desc id="desc">橫向時間軸從 2026 年 11 月到 2027 年 1 月，每列一個活動。實心橫條是官方已公告的 2026 日期：首爾冬季慶典 2026 年 12 月 4 日到 2027 年 1 月 31 日（預定）、海雲台燈節 2026 年 11 月 29 日到 2027 年 1 月 18 日。斜紋橫條是上一季日期、2026 尚未公告：首爾燈節 12 月 12 日到 1 月 18 日，首爾之光光化門 12 月 12 日到 1 月 4 日，光化門市集 12 月 12 日到 31 日，首爾廣場溜冰場 12 月 19 日到 2 月 8 日，首爾之光 DDP 12 月 18 日到 31 日，光復路冬季燈飾樹 12 月 5 日到 2 月 22 日，Elysian 江村雪場 12 月 5 日到 3 月 8 日。菱形是 12 月 31 日的單日活動：普信閣除夕敲鐘、廣安里跨年無人機秀與釜山市民鐘。Vivaldi Park 的 2026-27 開放日未公告。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <pattern id="hatchTeal" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#0D6B68" stroke-width="3"/></pattern>
    <pattern id="hatchBlue" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2F6F9F" stroke-width="3"/></pattern>
    <pattern id="hatchCoral" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B8442D" stroke-width="3"/></pattern>
    <pattern id="hatchGreen" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2E7D5B" stroke-width="3"/></pattern>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="66" font-size="36" font-weight="700" fill="#102A2B">2026 韓國冬季活動時間軸　11 月到 1 月</text>
  <text x="60" y="100" font-size="20" fill="#5C6B6B">Korea winter events · 實心＝官方已公告 2026 日期，斜紋＝上一季日期（2026 尚未公告） · 2026-09-13 查證</text>

  <!-- month grid: Nov 1 = 420, Dec 1 = 772, Jan 1 = 1136, Jan 31 end = 1500 -->
  <g stroke="#C9C2B8" stroke-width="2">
    <line x1="420" y1="165" x2="420" y2="770"/>
    <line x1="772" y1="165" x2="772" y2="770"/>
    <line x1="1136" y1="165" x2="1136" y2="770"/>
    <line x1="1500" y1="165" x2="1500" y2="770"/>
  </g>
  <g stroke="#DAD3C8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="584" y1="170" x2="584" y2="770"/>
    <line x1="937" y1="170" x2="937" y2="770"/>
    <line x1="1300" y1="170" x2="1300" y2="770"/>
  </g>
  <g font-size="24" font-weight="700" fill="#102A2B" text-anchor="middle">
    <text x="596" y="150">11 月 Nov 2026</text>
    <text x="954" y="150">12 月 Dec 2026</text>
    <text x="1318" y="150">1 月 Jan 2027</text>
  </g>
  <g font-size="15" fill="#8A8F8F" text-anchor="middle">
    <text x="584" y="184">15 日</text><text x="937" y="184">15 日</text><text x="1300" y="184">15 日</text>
  </g>

  <!-- rows: y baseline for name = 222 + 50*n ; bar y = name-14 -->
  <!-- 1 Seoul Winter Festa 2026 -->
  <text x="60" y="218" font-size="18" font-weight="700" fill="#102A2B">首爾冬季慶典 서울윈터페스타</text>
  <text x="60" y="238" font-size="15" fill="#5C6B6B">2026-12-04 ～ 2027-01-31（FUN SEOUL 預定）</text>
  <rect x="807" y="212" width="693" height="22" rx="11" fill="#0D6B68"/>
  <!-- 2 Lantern -->
  <text x="60" y="268" font-size="18" font-weight="700" fill="#102A2B">首爾燈節 서울빛초롱축제</text>
  <text x="60" y="288" font-size="15" fill="#5C6B6B">上一季 12-12 ～ 01-18，18:00–22:00；2026 待公告</text>
  <rect x="901" y="262" width="446" height="22" rx="11" fill="url(#hatchTeal)" stroke="#0D6B68" stroke-width="2"/>
  <!-- 3 Seoul Light Gwanghwamun -->
  <text x="60" y="318" font-size="18" font-weight="700" fill="#102A2B">首爾之光光化門 서울라이트 광화문</text>
  <text x="60" y="338" font-size="15" fill="#5C6B6B">上一季 12-12 ～ 01-04，17:30 起；2026 待公告</text>
  <rect x="901" y="312" width="282" height="22" rx="11" fill="url(#hatchTeal)" stroke="#0D6B68" stroke-width="2"/>
  <!-- 4 Gwanghwamun Market -->
  <text x="60" y="368" font-size="18" font-weight="700" fill="#102A2B">光化門市集 광화문마켓</text>
  <text x="60" y="388" font-size="15" fill="#5C6B6B">上一季 12-12 ～ 12-31，17:30–21:30；2026 待公告</text>
  <rect x="901" y="362" width="235" height="22" rx="11" fill="url(#hatchTeal)" stroke="#0D6B68" stroke-width="2"/>
  <!-- 5 Seoul Plaza rink -->
  <text x="60" y="418" font-size="18" font-weight="700" fill="#102A2B">首爾廣場溜冰場 서울광장 스케이트장</text>
  <text x="60" y="438" font-size="15" fill="#5C6B6B">上一季 12-19 ～ 02-08，1 小時 1,000 韓元；2026 待公告</text>
  <rect x="983" y="412" width="517" height="22" rx="11" fill="url(#hatchBlue)" stroke="#2F6F9F" stroke-width="2"/>
  <path d="M 1500 423 L 1530 423" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="1536" y="428" font-size="15" fill="#5C6B6B">到 2/8</text>
  <!-- 6 Seoul Light DDP -->
  <text x="60" y="468" font-size="18" font-weight="700" fill="#102A2B">首爾之光 DDP 서울라이트 DDP</text>
  <text x="60" y="488" font-size="15" fill="#5C6B6B">上一季 12-18 ～ 12-31，18:00–21:30；2026 待公告</text>
  <rect x="972" y="462" width="164" height="22" rx="11" fill="url(#hatchBlue)" stroke="#2F6F9F" stroke-width="2"/>
  <!-- 7 Bosingak bell -->
  <text x="60" y="518" font-size="18" font-weight="700" fill="#102A2B">除夕敲鐘 제야의 종 普信閣</text>
  <text x="60" y="538" font-size="15" fill="#5C6B6B">12-31 深夜，已列入 2026 慶典節目；上一季 23:30–00:30</text>
  <polygon points="1130,511 1142,523 1130,535 1118,523" fill="#0D6B68"/>
  <text x="1152" y="528" font-size="15" fill="#0D6B68">12/31</text>
  <!-- 8 Haeundae Light Festival -->
  <text x="60" y="568" font-size="18" font-weight="700" fill="#102A2B">海雲台燈節 해운대 빛축제</text>
  <text x="60" y="588" font-size="15" fill="#5C6B6B">2026-11-29 ～ 2027-01-18（海雲台區公告）；點燈 18:00–23:00</text>
  <rect x="749" y="562" width="598" height="22" rx="11" fill="#B8442D"/>
  <!-- 9 Gwangbok-ro tree lights -->
  <text x="60" y="618" font-size="18" font-weight="700" fill="#102A2B">光復路冬季燈飾樹 광복로 겨울빛 트리축제</text>
  <text x="60" y="638" font-size="15" fill="#5C6B6B">上一季 12-05 ～ 02-22，17:30–22:00；2026 待公告</text>
  <rect x="819" y="612" width="681" height="22" rx="11" fill="url(#hatchCoral)" stroke="#B8442D" stroke-width="2"/>
  <path d="M 1500 623 L 1530 623" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="1536" y="628" font-size="15" fill="#5C6B6B">到 2/22</text>
  <!-- 10 Gwangalli countdown -->
  <text x="60" y="668" font-size="18" font-weight="700" fill="#102A2B">廣安里跨年無人機秀・釜山市民鐘</text>
  <text x="60" y="688" font-size="15" fill="#5C6B6B">12-31；上一季無人機 23:56 升空 2,500 架；2026 待公告</text>
  <polygon points="1130,661 1142,673 1130,685 1118,673" fill="#B8442D"/>
  <text x="1152" y="678" font-size="15" fill="#B8442D">12/31</text>
  <!-- 11 Elysian Gangchon ski -->
  <text x="60" y="718" font-size="18" font-weight="700" fill="#102A2B">Elysian 江村雪場 엘리시안 강촌</text>
  <text x="60" y="738" font-size="15" fill="#5C6B6B">上一季 12-05 ～ 03-08；2026-27 開放日待公告</text>
  <rect x="819" y="712" width="681" height="22" rx="11" fill="url(#hatchGreen)" stroke="#2E7D5B" stroke-width="2"/>
  <path d="M 1500 723 L 1530 723" stroke="#5C6B6B" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="1536" y="728" font-size="15" fill="#5C6B6B">到 3/8</text>
  <!-- 12 Vivaldi Park -->
  <text x="60" y="768" font-size="18" font-weight="700" fill="#102A2B">Vivaldi Park 雪場 비발디파크</text>
  <text x="430" y="768" font-size="15" fill="#5C6B6B">2026-27 開放日與票價尚未公告，以 sonohotelsresorts.com 為準</text>

  <!-- legend -->
  <g font-size="16" fill="#102A2B">
    <rect x="60" y="808" width="60" height="18" rx="9" fill="#0D6B68"/>
    <text x="132" y="823">實心＝官方已公告 2026 日期</text>
    <rect x="400" y="808" width="60" height="18" rx="9" fill="url(#hatchTeal)" stroke="#0D6B68" stroke-width="2"/>
    <text x="472" y="823">斜紋＝上一季日期，2026 尚未公告，以官網為準</text>
    <polygon points="880,808 892,820 880,832 868,820" fill="#102A2B"/>
    <text x="904" y="823">菱形＝12 月 31 日單日活動</text>
    <text x="60" y="856" fill="#5C6B6B">青綠＝首爾冬季慶典系列　紅＝釜山　綠＝雪場　來源：FUN SEOUL、首爾文化入口網、海雲台區、Visit Busan、各雪場官網</text>
    <text x="1540" y="885" fill="#8A8F8F" font-size="15" text-anchor="end">© Mokaair 製圖 2026</text>
  </g>
</svg>
