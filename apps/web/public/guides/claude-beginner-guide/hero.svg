<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 新手入門 / Getting started with Claude</title>
  <desc id="desc">插圖：米色底上有一本打開的白色筆記本，左頁畫著幾條灰色的文字線，右頁畫著三個打勾的待辦方格與一條橘色書籤；筆記本右上方有一個深綠色的對話泡泡，泡泡裡有三個白點，泡泡的尾巴指向筆記本，代表用 AI 助手把筆記整理成待辦清單。下方只有一行字：Claude 新手入門。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <!-- soft ground shadow -->
  <ellipse cx="800" cy="720" rx="520" ry="34" fill="#E3DDD2"/>

  <!-- notebook: left page -->
  <path d="M 370 250 Q 370 232 388 232 L 790 232 L 790 700 L 388 700 Q 370 700 370 682 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <!-- notebook: right page -->
  <path d="M 810 232 L 1212 232 Q 1230 232 1230 250 L 1230 682 Q 1230 700 1212 700 L 810 700 Z" fill="#FFFFFF" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <!-- spine -->
  <rect x="784" y="226" width="32" height="480" rx="10" fill="#E3F0EF" stroke="#102A2B" stroke-width="7"/>

  <!-- left page text lines -->
  <rect x="420" y="300" width="300" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="352" width="250" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="404" width="310" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="456" width="190" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="508" width="280" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="560" width="230" height="14" rx="7" fill="#5C6B6B"/>
  <rect x="420" y="612" width="150" height="14" rx="7" fill="#5C6B6B"/>

  <!-- right page checklist -->
  <rect x="870" y="300" width="44" height="44" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <path d="M 880 322 L 892 335 L 908 308" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="940" y="315" width="220" height="14" rx="7" fill="#102A2B"/>

  <rect x="870" y="400" width="44" height="44" rx="10" fill="#E3F0EF" stroke="#0D6B68" stroke-width="6"/>
  <path d="M 880 422 L 892 435 L 908 408" fill="none" stroke="#0D6B68" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="940" y="415" width="170" height="14" rx="7" fill="#102A2B"/>

  <rect x="870" y="500" width="44" height="44" rx="10" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="6"/>
  <rect x="940" y="515" width="200" height="14" rx="7" fill="#5C6B6B"/>

  <!-- bookmark ribbon -->
  <path d="M 1080 226 L 1080 330 L 1106 306 L 1132 330 L 1132 226 Z" fill="#D97A2B"/>

  <!-- speech bubble -->
  <path d="M 1120 50 Q 1120 30 1140 30 L 1500 30 Q 1520 30 1520 50 L 1520 170 Q 1520 190 1500 190 L 1250 190 L 1190 226 L 1210 190 L 1140 190 Q 1120 190 1120 170 Z" fill="#0D6B68" stroke="#102A2B" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="1250" cy="110" r="18" fill="#FFFFFF"/>
  <circle cx="1320" cy="110" r="18" fill="#FFFFFF"/>
  <circle cx="1390" cy="110" r="18" fill="#FFFFFF"/>

  <!-- small accent: idea spark left of notebook -->
  <circle cx="250" cy="180" r="34" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="6"/>
  <circle cx="250" cy="180" r="10" fill="#2F6F9F"/>

  <!-- single line of text -->
  <text x="800" y="812" font-size="52" font-weight="700" fill="#102A2B" text-anchor="middle">Claude 新手入門</text>
