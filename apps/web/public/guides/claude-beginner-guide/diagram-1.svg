  <path d="M 1020 350 L 1114 286" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 580 520 L 486 584" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1020 520 L 1114 584" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 800 520 L 800 584" stroke="#5C6B6B" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- centre: chat -->
  <rect x="580" y="350" width="440" height="170" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="800" y="388" font-size="20" font-weight="700" fill="#0B4F4D" text-anchor="middle">對話　Chat</text>
  <text x="800" y="426" font-size="16" fill="#102A2B" text-anchor="middle">送出鍵旁：換模型、調 Effort、開關 Thinking</text>
  <text x="800" y="460" font-size="16" fill="#102A2B" text-anchor="middle">免費版就有網頁搜尋與記憶</text>
  <text x="800" y="494" font-size="16" fill="#102A2B" text-anchor="middle">用量以工作階段計，每 5 小時重置</text>

  <!-- top-left: Projects -->
  <rect x="60" y="110" width="420" height="170" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="270" y="150" font-size="19" font-weight="700" fill="#1F4E73" text-anchor="middle">Projects　專案工作區</text>
  <text x="270" y="188" font-size="16" fill="#102A2B" text-anchor="middle">知識庫 + 專案指令，每個對話都帶著背景</text>
  <text x="270" y="222" font-size="16" fill="#102A2B" text-anchor="middle">免費版最多 5 個，付費方案無上限</text>
  <text x="270" y="256" font-size="16" fill="#102A2B" text-anchor="middle">知識庫單檔 30 MB，只抽取文字</text>

