  <text x="270" y="658" font-size="16" fill="#102A2B" text-anchor="middle">加號或拖進對話；PDF、Word、Excel、圖片</text>
  <text x="270" y="692" font-size="16" fill="#102A2B" text-anchor="middle">一個對話 20 個檔案、單檔 500 MB</text>
  <text x="270" y="726" font-size="16" fill="#102A2B" text-anchor="middle">PDF 最多 1000 頁，前 100 頁看得到圖</text>

