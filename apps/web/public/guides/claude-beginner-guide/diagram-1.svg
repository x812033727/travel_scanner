  <text x="1330" y="620" font-size="19" font-weight="700" fill="#8A4A15" text-anchor="middle">思考模式　Thinking</text>
  <text x="1330" y="658" font-size="16" fill="#102A2B" text-anchor="middle">先拆解、規劃再回答，有可展開的摘要</text>
  <text x="1330" y="692" font-size="16" fill="#102A2B" text-anchor="middle">數學、規劃、多步驟分析時開</text>
  <text x="1330" y="726" font-size="16" fill="#102A2B" text-anchor="middle">Fable 5.1、Opus 5 關不掉</text>

  <!-- bottom-centre: apps -->
  <rect x="580" y="590" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#102A2B" stroke-width="4"/>
  <text x="800" y="628" font-size="19" font-weight="700" fill="#102A2B" text-anchor="middle">桌面版與手機 App</text>
  <text x="800" y="664" font-size="16" fill="#102A2B" text-anchor="middle">macOS 11、Windows 10、Linux 測試版</text>
  <text x="800" y="696" font-size="16" fill="#102A2B" text-anchor="middle">iOS 18.0、Android 8.0 以上</text>
  <text x="800" y="728" font-size="16" fill="#102A2B" text-anchor="middle">語音模式：按聲波圖示用講的</text>

  <!-- footer notes -->
  <text x="60" y="790" font-size="15" fill="#5C6B6B">模型家族：Fable 5.1 最難的推理與長任務、Opus 5 複雜程式與企業工作、Sonnet 5 速度與能力平衡、Haiku 4.5 最快</text>
  <text x="60" y="818" font-size="15" fill="#5C6B6B">免費版五個功能都能用，Projects 最多 5 個；Pro 每月 20 美元、用量至少 5 倍；Fable 系列只在付費方案</text>
  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
