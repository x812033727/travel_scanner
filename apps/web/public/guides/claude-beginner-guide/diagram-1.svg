<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">Claude 功能地圖：對話、Projects、Artifacts、檔案、思考模式、App / Claude feature map</title>
  <desc id="desc">結構圖。中央是「對話」：送出鍵旁邊可以換模型、調 Effort、開關 Thinking，免費版就有網頁搜尋與記憶，用量以工作階段計、每 5 小時重置。從對話連出五個功能。左上 Projects：知識庫加專案指令，每個對話都帶著背景，免費版最多 5 個、付費無上限，知識庫單檔 30 MB 只抽文字。右上 Artifacts：約 15 行以上的文件、程式、網頁、SVG、圖表放在旁邊的視窗，可以繼續改、切版本、下載，免費版也能發布成連結。左下 檔案上傳：用加號或拖進對話，支援 PDF、Word、Excel、圖片，一個對話 20 個檔案、單檔 500 MB，PDF 最多 1000 頁、前 100 頁看得到圖。右下 思考模式：先拆解、規劃再回答，有可展開的摘要，數學、規劃、多步驟分析時開，Fable 5.1 與 Opus 5 關不掉。下方 桌面版與手機 App：macOS 11、Windows 10、Linux 測試版，iOS 18.0、Android 8.0 以上，語音模式按聲波圖示。底部兩行：模型家族 Fable 5.1 最難的推理、Opus 5 複雜程式與企業工作、Sonnet 5 速度與能力平衡、Haiku 4.5 最快；免費版所有功能都能用，Pro 每月 20 美元、用量至少 5 倍，2026 年 9 月依官網查證。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B6B"/></marker>
  </defs>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#102A2B">Claude 功能地圖：從對話出發的五個功能（2026 年 9 月依官網查證）</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Claude feature map: chat at the centre, Projects, Artifacts, files, thinking and apps around it</text>

