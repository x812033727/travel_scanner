  <text x="1330" y="188" font-size="16" fill="#102A2B" text-anchor="middle">約 15 行以上的文件、程式、網頁、SVG、圖表</text>
  <text x="1330" y="222" font-size="16" fill="#102A2B" text-anchor="middle">對話裡繼續改、切換版本、下載</text>
  <text x="1330" y="256" font-size="16" fill="#102A2B" text-anchor="middle">免費版也能發布成連結</text>

