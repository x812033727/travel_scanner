<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">海外就醫後的兩條路 / Two routes after medical care abroad</title>
  <desc id="desc">一張左右並排的比較圖。左欄是健保核退，右欄是保險理賠，中間是四個比較項目。依據那一列，左邊是全民健康保險法第五十五條與第五十六條和自墊醫療費用核退辦法，右邊是個別保單條款，示範條款是條款結構的官方版本。申請時限那一列，左邊是門診、急診治療當日或出院之日起六個月內，右邊是依條款約定，示範條款的請求權時效兩年。要的文件那一列，左邊是核退申請書、收據正本、費用明細、診斷書、出院病歷摘要與出入境證明，右邊是保險金申請書、保險單、診斷書或住院證明、醫療費用收據與身分證明；中間用紅框標出兩條路的交會點，收據正本只有一份，兩邊都指名要正本，並用左右各一支箭頭指向兩欄的文件清單。金額上限那一列，左邊是依主管機關公告的支付標準核算，超過部分不予給付，右邊是依保單所載的各項限額，實支實付型不重複給付健保已付的部分。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#B8442D"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">海外就醫後的兩條路</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Two separate routes after medical care abroad</text>

  <rect x="60" y="118" width="496" height="58" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="308" y="156" font-size="26" font-weight="bold" fill="#0D6B68" text-anchor="middle">健保核退</text>
  <rect x="1044" y="118" width="496" height="58" rx="14" fill="#E6F0F7" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1292" y="156" font-size="26" font-weight="bold" fill="#2F6F9F" text-anchor="middle">保險理賠</text>
  <text x="800" y="155" font-size="19" fill="#5C6B6B" text-anchor="middle">在國外自費就醫之後</text>

  <rect x="60" y="198" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="308" y="246" font-size="17" fill="#102A2B" text-anchor="middle">全民健康保險法第五十五條</text>
  <text x="308" y="276" font-size="17" fill="#102A2B" text-anchor="middle">與第五十六條</text>
  <text x="308" y="306" font-size="17" fill="#5C6B6B" text-anchor="middle">自墊醫療費用核退辦法</text>
  <rect x="1044" y="198" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1292" y="246" font-size="17" fill="#102A2B" text-anchor="middle">個別保單條款</text>
  <text x="1292" y="276" font-size="17" fill="#5C6B6B" text-anchor="middle">示範條款是條款結構的</text>
  <text x="1292" y="306" font-size="17" fill="#5C6B6B" text-anchor="middle">官方版本</text>
  <rect x="640" y="238" width="320" height="60" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="800" y="276" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">依據</text>

  <rect x="60" y="356" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="308" y="418" font-size="17" fill="#102A2B" text-anchor="middle">門診、急診治療當日</text>
  <text x="308" y="450" font-size="17" fill="#102A2B" text-anchor="middle">或出院之日起六個月內</text>
  <rect x="1044" y="356" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1292" y="418" font-size="17" fill="#102A2B" text-anchor="middle">依條款約定</text>
  <text x="1292" y="450" font-size="17" fill="#5C6B6B" text-anchor="middle">示範條款的請求權時效兩年</text>
  <rect x="640" y="396" width="320" height="60" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="800" y="434" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">申請時限</text>

  <rect x="60" y="514" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="308" y="562" font-size="17" fill="#102A2B" text-anchor="middle">核退申請書、收據正本</text>
  <text x="308" y="592" font-size="17" fill="#102A2B" text-anchor="middle">費用明細、診斷書</text>
  <text x="308" y="622" font-size="17" fill="#5C6B6B" text-anchor="middle">出院病歷摘要、出入境證明</text>
  <rect x="1044" y="514" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1292" y="562" font-size="17" fill="#102A2B" text-anchor="middle">保險金申請書、保險單</text>
  <text x="1292" y="592" font-size="17" fill="#102A2B" text-anchor="middle">診斷書或住院證明</text>
  <text x="1292" y="622" font-size="17" fill="#5C6B6B" text-anchor="middle">醫療費用收據、身分證明</text>
  <line x1="650" y1="584" x2="516" y2="584" stroke="#B8442D" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="950" y1="584" x2="1084" y2="584" stroke="#B8442D" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="640" y="522" width="320" height="124" rx="14" fill="#FFFFFF" stroke="#B8442D" stroke-width="4"/>
  <text x="800" y="558" font-size="19" font-weight="bold" fill="#102A2B" text-anchor="middle">要的文件</text>
  <text x="800" y="592" font-size="20" font-weight="bold" fill="#B8442D" text-anchor="middle">收據正本只有一份</text>
  <text x="800" y="622" font-size="17" fill="#5C6B6B" text-anchor="middle">兩邊都指名要正本</text>

  <rect x="60" y="672" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="308" y="734" font-size="17" fill="#102A2B" text-anchor="middle">依主管機關公告的支付標準</text>
  <text x="308" y="766" font-size="17" fill="#102A2B" text-anchor="middle">核算，超過部分不予給付</text>
  <rect x="1044" y="672" width="496" height="140" rx="14" fill="#FFFFFF" stroke="#2F6F9F" stroke-width="4"/>
  <text x="1292" y="734" font-size="17" fill="#102A2B" text-anchor="middle">依保單所載的各項限額</text>
  <text x="1292" y="766" font-size="17" fill="#5C6B6B" text-anchor="middle">實支實付型不重複給付健保已付部分</text>
  <rect x="640" y="712" width="320" height="60" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="3"/>
  <text x="800" y="750" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">金額上限</text>

  <text x="1540" y="870" text-anchor="end" font-size="15" fill="#5C6B6B">© Mokaair 製圖 2026</text>
</svg>
