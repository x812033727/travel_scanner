<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei','Hiragino Sans',system-ui,sans-serif">
  <title id="title">峴港到順化的兩條路線與順化市區 / Da Nang to Hue: two routes and the sights of Hue</title>
  <desc id="desc">左半邊是峴港到順化的兩條走法：實線是鐵路，統一線這一段 103 公里、車程約 2 小時半到 2 小時 45 分，北上是 SE4 12:28 與 SE2 13:21，南下回峴港是 SE3 07:55 與 SE1 10:30；虛線是公路，包車約 2 小時，中途可以停海雲關，海雲關門票 70,000 越南盾、火車不停。峴港旁邊註明機場交通看峴港那一篇。右半邊是順化市區：香江由西往東穿過，北岸上游是天姥寺，不在售票清單中，北岸中段是皇城，門票 200,000 越南盾，皇城東邊是東巴市場；南岸由西往東是明命陵、啟定陵與嗣德陵，各 150,000 越南盾，另有 3 點聯票 420,000 越南盾與 4 點聯票 530,000 越南盾，順化火車站在南岸市區側。</desc>
  <rect width="1600" height="900" fill="#F7F1E8"/>

  <text x="60" y="52" font-size="30" font-weight="bold" fill="#102A2B">峴港到順化的兩條路線，與順化市區怎麼分布</text>
  <text x="60" y="84" font-size="18" fill="#5C6B6B">Da Nang to Hue: two routes, and how Hue is laid out</text>
  <text x="1540" y="52" font-size="15" fill="#5C6B6B" text-anchor="end">示意圖，方向與距離非比例</text>

  <line x1="800" y1="120" x2="800" y2="840" stroke="#5C6B6B" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>

  <text x="60" y="150" font-size="20" font-weight="bold" fill="#0D6B68">怎麼去：鐵路與公路</text>

  <line x1="300" y1="258" x2="470" y2="700" stroke="#2F6F9F" stroke-width="6"/>
  <line x1="360" y1="258" x2="530" y2="700" stroke="#D97A2B" stroke-width="5" stroke-dasharray="14 10"/>

  <rect x="210" y="175" width="240" height="76" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="330" y="207" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">順化</text>
  <text x="330" y="233" font-size="16" fill="#5C6B6B" text-anchor="middle">Huế</text>

  <rect x="380" y="706" width="240" height="76" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="500" y="738" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">峴港</text>
  <text x="500" y="764" font-size="16" fill="#5C6B6B" text-anchor="middle">Đà Nẵng</text>
  <text x="500" y="810" font-size="15" fill="#5C6B6B" text-anchor="middle">機場交通看峴港篇</text>

  <text x="285" y="348" font-size="17" font-weight="bold" fill="#2F6F9F" text-anchor="end">鐵路（實線）</text>
  <text x="285" y="378" font-size="17" fill="#102A2B" text-anchor="end">統一線 103 公里</text>
  <text x="285" y="404" font-size="17" fill="#102A2B" text-anchor="end">約 2 小時半到 2 小時 45 分</text>
  <text x="285" y="450" font-size="17" fill="#102A2B" text-anchor="end">北上 SE4 12:28／SE2 13:21</text>
  <text x="285" y="476" font-size="17" fill="#102A2B" text-anchor="end">南下 SE3 07:55／SE1 10:30</text>

  <text x="562" y="348" font-size="17" font-weight="bold" fill="#D97A2B">公路（虛線）</text>
  <text x="562" y="378" font-size="17" fill="#102A2B">包車約 2 小時</text>

  <circle cx="453" cy="500" r="11" fill="#B8442D"/>
  <line x1="468" y1="500" x2="552" y2="500" stroke="#B8442D" stroke-width="3"/>
  <text x="562" y="492" font-size="17" font-weight="bold" fill="#102A2B">海雲關 Hải Vân Quan</text>
  <text x="562" y="520" font-size="16" fill="#5C6B6B">門票 70,000 越南盾</text>
  <text x="562" y="546" font-size="16" fill="#5C6B6B">火車不停</text>

  <text x="840" y="150" font-size="20" font-weight="bold" fill="#0D6B68">順化市區：香江兩岸</text>

  <line x1="832" y1="500" x2="1566" y2="500" stroke="#2F6F9F" stroke-width="16" opacity="0.32" stroke-linecap="round"/>
  <text x="1560" y="484" font-size="16" fill="#5C6B6B" text-anchor="end">香江 Sông Hương（由西往東）</text>
  <text x="838" y="288" font-size="15" fill="#5C6B6B">北岸</text>
  <text x="838" y="536" font-size="15" fill="#5C6B6B">南岸</text>

  <rect x="848" y="318" width="240" height="96" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="968" y="356" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">天姥寺</text>
  <text x="968" y="382" font-size="15" fill="#5C6B6B" text-anchor="middle">Chùa Thiên Mụ</text>
  <text x="968" y="404" font-size="15" fill="#5C6B6B" text-anchor="middle">不在售票清單中</text>

  <rect x="1126" y="308" width="236" height="116" rx="14" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1244" y="346" font-size="20" font-weight="bold" fill="#102A2B" text-anchor="middle">皇城 Đại Nội</text>
  <text x="1244" y="376" font-size="17" fill="#102A2B" text-anchor="middle">200,000 越南盾</text>
  <text x="1244" y="404" font-size="15" fill="#5C6B6B" text-anchor="middle">從午門進場</text>

  <rect x="1400" y="318" width="160" height="96" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1480" y="360" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">東巴市場</text>
  <text x="1480" y="388" font-size="15" fill="#5C6B6B" text-anchor="middle">Chợ Đông Ba</text>

  <rect x="860" y="548" width="480" height="84" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="4"/>
  <text x="884" y="582" font-size="17" fill="#102A2B">3 點聯票 420,000 越南盾（皇城加兩座陵）</text>
  <text x="884" y="612" font-size="17" fill="#102A2B">4 點聯票 530,000 越南盾（皇城加三座陵）</text>

  <rect x="1380" y="548" width="180" height="84" rx="14" fill="#FFFFFF" stroke="#5C6B6B" stroke-width="4"/>
  <text x="1470" y="582" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">順化火車站</text>
  <text x="1470" y="610" font-size="15" fill="#5C6B6B" text-anchor="middle">Ga Huế</text>

  <rect x="860" y="666" width="220" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="970" y="702" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">明命陵</text>
  <text x="970" y="726" font-size="15" fill="#5C6B6B" text-anchor="middle">Lăng Minh Mạng（香壽）</text>
  <text x="970" y="758" font-size="17" fill="#102A2B" text-anchor="middle">150,000 越南盾</text>

  <rect x="1098" y="666" width="220" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1208" y="702" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">啟定陵</text>
  <text x="1208" y="726" font-size="15" fill="#5C6B6B" text-anchor="middle">Lăng Khải Định（水朋）</text>
  <text x="1208" y="758" font-size="17" fill="#102A2B" text-anchor="middle">150,000 越南盾</text>

  <rect x="1336" y="666" width="220" height="118" rx="14" fill="#FFFFFF" stroke="#0D6B68" stroke-width="4"/>
  <text x="1446" y="702" font-size="17" font-weight="bold" fill="#102A2B" text-anchor="middle">嗣德陵</text>
  <text x="1446" y="726" font-size="15" fill="#5C6B6B" text-anchor="middle">Lăng Tự Đức</text>
  <text x="1446" y="758" font-size="17" fill="#102A2B" text-anchor="middle">150,000 越南盾</text>

