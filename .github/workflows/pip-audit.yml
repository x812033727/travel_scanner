name: pip audit

# The enforcing half of the Python dependency check, mirroring npm-audit.yml: as a pull
# request gate the advisory lookup fails whenever PyPI hiccups, and since api became a
# required check that would block unrelated work. As a daily job it is simply retried.
# A failed scheduled run opens or comments on a `pip-audit-red` issue: ci-red-main.yml
# listens for this workflow by its `name:` above.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run pip-audit --local --skip-editable
