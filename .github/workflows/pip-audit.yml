name: pip audit

# The enforcing half of the Python dependency check, mirroring npm-audit.yml: as a pull
# request gate the advisory lookup fails whenever PyPI hiccups, and since api became a
# required check that would block unrelated work. As a daily job it is simply retried.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run pip-audit --local --skip-editable
