name: Video tooling

# The video pipeline's media stages need Chromium and ffmpeg, which the main CI job does not
# install before `npm run test:tools`. This workflow runs the pure tests again and then the whole
# render → assemble → review → package chain on the example video (tools/video/assemble/smoke.mjs),
# with a stand-in narration so no speech server or token is involved.

on:
  pull_request:
    paths:
      - '.github/workflows/video-tooling.yml'
      - 'tools/video/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-tooling.yml'
      - 'tools/video/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: video-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node --test "tools/video/**/*.test.mjs"
      - run: node tools/video/assemble/smoke.mjs --workdir "$RUNNER_TEMP/video-smoke"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-smoke
          path: |
            ${{ runner.temp }}/video-smoke/**/checks.json
            ${{ runner.temp }}/video-smoke/**/contact-sheet.png
            ${{ runner.temp }}/video-smoke/**/state.json
          if-no-files-found: ignore
          retention-days: 7
