name: Video tooling

# The video pipeline's media stages need Chromium and ffmpeg. ci.yml's required video-tests job
# installs both and runs every tools test with them on every pull request (web-checks runs them
# without, where the cases that need one skip). This workflow, for the pull requests that touch
# tools/video, package.json or the lockfile (and those paths on main), runs the tools/video tests once more and then the whole render → assemble → review →
# package chain on the example videos (tools/video/assemble/smoke.mjs), with a stand-in narration
# so no speech server or token is involved.

on:
  pull_request:
    paths:
      - '.github/workflows/video-tooling.yml'
      - 'tools/video/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-tooling.yml'
      - 'tools/video/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: video-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node --test "tools/video/**/*.test.mjs"
      - run: node tools/video/assemble/smoke.mjs --workdir "$RUNNER_TEMP/video-smoke"
      # The drama example: stand-in keyframes, clips and music through the same chain.
      - run: node tools/video/assemble/smoke.mjs --fixture drama --workdir "$RUNNER_TEMP/video-smoke-drama"
      # The brand story example: narrator only, every shot a still under a camera move.
      - run: node tools/video/assemble/smoke.mjs --fixture story --workdir "$RUNNER_TEMP/video-smoke-story"
      # Illustrated slides: still shots between the cards, drifting cards, dissolves, the owner's
      # music file and a sound-effect set through the same chain (docs/videos/ILLUSTRATED.md).
      - run: node tools/video/assemble/smoke.mjs --fixture illustrated --workdir "$RUNNER_TEMP/video-smoke-illustrated"
      # A Short from its script to its upload package, with supplied clips for the narration:
      # what can be checked without the site passes, what cannot fails saying so.
      - run: node tools/video/shorts/smoke.mjs --workdir "$RUNNER_TEMP/shorts-smoke"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-smoke
          path: |
            ${{ runner.temp }}/video-smoke/**/checks.json
            ${{ runner.temp }}/video-smoke/**/contact-sheet.png
            ${{ runner.temp }}/video-smoke/**/state.json
            ${{ runner.temp }}/video-smoke-drama/**/checks.json
            ${{ runner.temp }}/video-smoke-drama/**/frames/manifest.json
            ${{ runner.temp }}/video-smoke-drama/**/state.json
            ${{ runner.temp }}/video-smoke-story/**/checks.json
            ${{ runner.temp }}/video-smoke-story/**/frames/manifest.json
            ${{ runner.temp }}/video-smoke-story/**/state.json
            ${{ runner.temp }}/shorts-smoke/**/checks.json
            ${{ runner.temp }}/shorts-smoke/**/qa.json
            ${{ runner.temp }}/shorts-smoke/**/contact-sheet.png
          if-no-files-found: ignore
          retention-days: 7
