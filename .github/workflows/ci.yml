name: CI
on:
  # A branch with an open pull request used to start two full runs per push (one `push`
  # event, one `pull_request` event) and never cancel the superseded commit's runs; on
  # 2026-09-13 the same commit passed in one concurrent run and failed in the other. Push
  # runs are kept for `main` only -- that is the run the deploy agent reads -- and
  # `pull_request` covers every branch.
  push:
    branches: [main]
  pull_request:

# One live run per pull request: a new push cancels the run of the commit it replaced.
# `main` is deliberately never grouped, so a run there is never cancelled or left pending
# (a cancelled run on `main` reads as "not green" to the deploy agent).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static checks and the migration tests: everything in the api gate except the main
  # pytest run, which api-tests below splits across parallel jobs.
  api-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_DB: travel_scanner, POSTGRES_USER: travel, POSTGRES_PASSWORD: travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_scanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      # Same shape as the npm audit below: the advisory lookup needs PyPI at request time,
      # and a connection reset there failed the api job on a pull request whose code was
      # never run (2026-09-06). Now that api is a required check, that would block the
      # merge. The enforcing run lives in pip-audit.yml, daily and retryable.
      - name: Audit Python dependencies (advisory only; enforced by pip-audit.yml)
        run: uv run pip-audit --local --skip-editable
        continue-on-error: true
      - run: uv run ruff check .
      - run: uv run mypy app
      # tests/ is checked too, on its own line so a failure names itself; the override in
      # pyproject.toml says which strict rules tests are held to.
      - run: uv run mypy tests
      # The editorial rules in app/guides/pack_ingest.py (diagram figures the text carries,
      # 15 px labels, SVG safety): every article pack and its images, errors only fail.
      - name: Lint article content packs
        run: uv run python -m app.guides.pack_cli lint
      # One migration head, or a failure that names both files. Two branches that took
      # the same number otherwise surface as "found 2" from every test module, and
      # alembic upgrade below would only say "Multiple head revisions are present".
      - run: uv run pytest tests/test_schema.py -q -p no:cacheprovider
      - name: Validate seeded PostgreSQL upgrade from 0066
        run: uv run pytest tests/test_admin_operations_migration.py -q -p no:cacheprovider
        env:
          RUN_MIGRATION_TESTS: "1"
      - name: Validate site-page version migrations on PostgreSQL
        run: uv run pytest tests/test_site_pages_migration.py -q -p no:cacheprovider
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_MIGRATION_TESTS: "1"
  # The main pytest run took 23 of the old api job's 25 minutes (run 37111019702). Each
  # shard is its own job with its own PostgreSQL, Redis and S3 companion, so no two tests
  # running at once share a database. TOTAL in the pytest line must match the matrix.
  api-tests:
    name: api-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_DB: travel_scanner, POSTGRES_USER: travel, POSTGRES_PASSWORD: travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_scanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    env:
      # Named once so the pull and the run cannot name different tags. MinIO's own images need
      # a login now (Docker Hub since 2026-09-11, quay.io since 2026-09-24), so this is
      # Chainguard's public build of the same server, pinned by digest: its free tier only
      # publishes :latest. It runs as uid 65532, hence the tmpfs at /data where it runs.
      MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `docker run` pulls a missing image exactly once. A single 502, 504, connection reset or
      # token timeout from quay.io or auth.docker.io failed a job seven times in four jobs
      # (this one, containers, full-stack-smoke, travel-discovery) while a sibling job pulled
      # the same image seconds apart. The script retries transient failures (see its header);
      # the runs below use --pull=never so they cannot quietly pull without it.
      # $GITHUB_WORKSPACE because this job's steps default to apps/api.
      - name: Pull container images
        run: bash "$GITHUB_WORKSPACE/tools/ci/pull-images.sh" "$MINIO_IMAGE"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Start private S3 integration companion
        run: |
          docker run --pull=never -d --name community-test-storage -p 127.0.0.1:9000:9000 --tmpfs /data \
            -e MINIO_ROOT_USER=community-test -e MINIO_ROOT_PASSWORD=community-test-only-password \
            "$MINIO_IMAGE" server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs community-test-storage
          exit 1
      # tests/sharding.py places whole files, longest first, from tests/shard_durations.json.
      - run: uv run pytest --shard "${{ matrix.shard }}/4"
        env:
          RUN_INTEGRATION_TESTS: "1"
          COMMUNITY_TEST_S3: "1"
          COMMUNITY_S3_ENDPOINT: http://127.0.0.1:9000
          COMMUNITY_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          COMMUNITY_S3_ACCESS_KEY: community-test
          COMMUNITY_S3_SECRET_KEY: community-test-only-password
  # `api` is the required check (.github/BRANCH_PROTECTION.md and REQUIRED in
  # tools/ci/auto-update-branches.mjs), so the name stays on one job that is green only
  # when the checks and every shard are. `always()` makes it run, and fail, when one of
  # them failed or was cancelled; a skipped required check would read as passing.
  api:
    needs: [api-checks, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every API check and test shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "api-checks and api-tests: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
  # Lint, i18n, the task board, typecheck and the tools tests: everything in the web gate
  # except vitest and Playwright, which web-unit and web-e2e split across parallel jobs.
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Advisory lookups hit registry.npmjs.org at request time, so an outage there used
      # to fail this step and skip lint, typecheck, tests, build and Playwright with it -
      # three pull requests in one day went red without a line of their code being run.
      # The blocking check lives in npm-audit.yml, which runs daily and can be retried.
      - name: Audit dependencies (advisory only; enforced by npm-audit.yml)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint:web
      - run: npm run check:i18n
      - run: npm run check:tasks
      - run: npm run typecheck:web
      - run: npm run test:tools
  # vitest ran its ~350 files one at a time (vitest.config.ts) for 7m45s of the old web
  # job (run 37111019702). Each shard keeps that one-at-a-time setting; vitest splits the
  # files itself. TOTAL in the run line must match the matrix.
  web-unit:
    name: web-unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # vitest directly: `npm run test:web -- --shard` would hand --shard to the inner
      # `npm run --workspace`, not to vitest.
      - run: npx vitest run --shard="${{ matrix.shard }}/3"
        working-directory: apps/web
  # The isolated browser suite was the other 7m47s. Each shard builds the app itself, since
  # serving a build is what keeps these cases from timing out (playwright.config.ts), and
  # Playwright places whole spec files in shards. TOTAL in the run line must match the matrix.
  web-e2e:
    name: web-e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Run isolated browser UI tests
        run: npx playwright test --shard="${{ matrix.shard }}/3" e2e/navigation.spec.ts e2e/readability.spec.ts e2e/signed-out.spec.ts e2e/travel-services.spec.ts e2e/stay22-allez.spec.ts e2e/stay22-script.spec.ts e2e/guides-adsense.spec.ts e2e/stay22-maps.spec.ts e2e/merchant-styles.spec.ts e2e/admin-domains.spec.ts e2e/admin-operations.spec.ts e2e/admin-video-manual-upload.spec.ts e2e/admin-video-shorts.spec.ts e2e/admin-video-plans.spec.ts e2e/site-experience.spec.ts e2e/site-pages.spec.ts e2e/community-ui.spec.ts e2e/discovery-card-details.spec.ts e2e/planner-premium.spec.ts e2e/korea-dual-maps.spec.ts e2e/seo.spec.ts e2e/offline-day-view.spec.ts
        working-directory: apps/web
        # Serve the build from the step above instead of a dev server that compiles
        # each page on first visit; see playwright.config.ts.
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      # Keep only this small set of synthetic screenshots for visual review, not
      # the hundreds of screenshots produced by the complete successful suite.
      - name: Retain manual-upload visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          name: youtube-manual-browser-evidence-${{ matrix.shard }}
          path: apps/web/test-results/**/youtube-manual-*.jpg
          retention-days: 3
      # Only when something failed or the job timed out (which GitHub reports as cancelled):
      # that is when the traces get read. Every push runs this workflow for both the push and
      # the pull_request event, so uploading on success stored about 280 MB per passing commit.
      # By 2026-09-14 the repository held 122.7 GB of unexpired artifacts, and PR #497's
      # required web job went red on "Failed to FinalizeArtifact: ... (403) Forbidden" after
      # every test had passed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: site-experience-browser-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
  # `web` is the required check, like `api` above: green only when the checks and every
  # shard are, and red when one of them failed or was cancelled.
  web:
    needs: [web-checks, web-unit, web-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every web check and test shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "web-checks, web-unit and web-e2e: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
  containers:
    runs-on: ubuntu-latest
    env:
      NGINX_IMAGE: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried pull, then --pull=never below; see the api job and tools/ci/pull-images.sh.
      - name: Pull container images
        run: bash "$GITHUB_WORKSPACE/tools/ci/pull-images.sh" "$NGINX_IMAGE"
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build api worker
      - name: Validate reverse proxy config
        # Host nginx is deployed separately: check syntax and the real request behavior.
        run: |
          docker run --pull=never --rm -v "$PWD/ops/nginx:/etc/nginx/ops:ro" "$NGINX_IMAGE" \
            nginx -t -c /etc/nginx/ops/ci-validate.conf
      - name: Verify article images do not consume page rate limits
        run: |
          docker run --pull=never --rm -v "$PWD:/workspace:ro" -w /workspace "$NGINX_IMAGE" \
            sh -c 'apk add --no-cache python3 && python3 tools/test-guide-image-rate-limit.py /usr/sbin/nginx'
      - name: Validate production release Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          DATABASE_URL: postgresql+asyncpg://travel:ci-postgres-password@postgres:5432/travel_scanner
          REDIS_URL: redis://:ci-redis-password@redis:6379/0
          NEXT_PUBLIC_SITE_URL: https://mokaair.com
          RUNTIME_ENV_FILE: .env
          DEPLOY_AGENT_GID: "10002"
          RELEASE_SHA: ci
      - name: Build SHA-tagged production images
        run: docker compose -f docker-compose.prod.yml build api web
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          DATABASE_URL: postgresql+asyncpg://travel:ci-postgres-password@postgres:5432/travel_scanner
          REDIS_URL: redis://:ci-redis-password@redis:6379/0
          NEXT_PUBLIC_SITE_URL: https://mokaair.com
          RUNTIME_ENV_FILE: .env
          DEPLOY_AGENT_GID: "10002"
          RELEASE_SHA: ci
  full-stack-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_DB: travel_scanner, POSTGRES_USER: travel, POSTGRES_PASSWORD: travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_scanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://travel:travel@127.0.0.1:5432/travel_scanner
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET_KEY: ci-full-stack-secret-key-at-least-32-characters
      TRAVEL_PROVIDER_MODE: mock
      FLIGHT_PROVIDER_MODE: mock
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      API_INTERNAL_URL: http://127.0.0.1:8000
      # Playwright's API cookie jar permits production Secure cookies over HTTP
      # localhost, but not numeric loopback. Keep browser and API origins aligned.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      AUTH_REGISTER_IP_LIMIT: "100"
      AUTH_LOGIN_IP_LIMIT: "100"
      # The whole browser suite reads the catalogue from one address, which is precisely
      # the shape the public-read limit exists to notice. Its own unit tests cover it.
      PUBLIC_READ_RATE_LIMIT_MODE: "off"
      ADMIN_EMAILS: admin-workspace-desktop@example.com,admin-workspace-mobile@example.com
      DATABASE_ADMIN_EMAILS: admin-workspace-desktop@example.com,admin-workspace-mobile@example.com
      ADMIN_DATABASE_MAINTENANCE_ENABLED: "true"
      DEPLOY_AGENT_SOCKET: /tmp/travel-scanner-e2e-agent.sock
      DEPLOY_AGENT_HMAC_KEY: ci-signed-e2e-agent-key-at-least-32-characters
      RELEASE_SHA: cccccccccccccccccccccccccccccccccccccccc
      E2E_DEPLOY_AGENT_FIXTURE: "1"
      COMMUNITY_S3_ENDPOINT: http://127.0.0.1:9000
      COMMUNITY_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      COMMUNITY_S3_ACCESS_KEY: community-test
      COMMUNITY_S3_SECRET_KEY: community-test-only-password
      COMMUNITY_S3_BUCKET: mokaair-community-ci
      COMMUNITY_MEDIA_ORIGIN: http://127.0.0.1:9000
      COMMUNITY_SMTP_HOST: 127.0.0.1
      COMMUNITY_SMTP_PORT: "1025"
      COMMUNITY_SMTP_STARTTLS: "false"
      COMMUNITY_MAIL_FROM: Mokaair CI <accounts@example.test>
      # Chainguard's MinIO pinned by digest; see the api job.
      MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
      MAILPIT_IMAGE: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried pull, then --pull=never below; see the api job and tools/ci/pull-images.sh.
      # Early, so a registry outage fails here by name, before the build and before any
      # background process starts.
      - name: Pull container images
        run: bash "$GITHUB_WORKSPACE/tools/ci/pull-images.sh" "$MINIO_IMAGE" "$MAILPIT_IMAGE"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: uv sync --frozen
        working-directory: apps/api
      - run: npm ci
      - run: uv run alembic upgrade head
        working-directory: apps/api
      # Concurrent cold routes under next dev have returned partially read JSON
      # manifests/500s in smoke runs. Exercise the immutable production build,
      # as the isolated UI suite does, without relaxing browser assertions.
      - name: Build production web for full-stack journeys
        run: npm run build:web
      - name: Start API, worker and web
        run: |
          cd apps/api
          setsid uv run python tests/support/e2e_deploy_agent.py > /tmp/travel-agent.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-agent.pid"
          setsid uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/travel-api.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-api.pid"
          setsid uv run python -m app.worker > /tmp/travel-worker.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-worker.pid"
          cd ../..
          # The web start script (apps/web/package.json) carries --keepAliveTimeout 65000, the
          # same as KEEP_ALIVE_TIMEOUT in docker-compose.prod.yml. Playwright's APIRequestContext
          # reuses keep-alive sockets with no idle timeout of its own, and Next's default close
          # (5 s, plus Node's 1 s buffer) raced the ~6 s gaps in community.spec.ts
          # registerAndVerify, which came back as `read ECONNRESET`.
          setsid npm run start --workspace @travel-scanner/web -- --port 3000 > /tmp/travel-web.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-web.pid"
      - name: Start community test services and bootstrap test administrator
        run: |
          docker run --pull=never -d --name community-browser-storage -p 127.0.0.1:9000:9000 --tmpfs /data \
            -e MINIO_ROOT_USER=community-test -e MINIO_ROOT_PASSWORD=community-test-only-password \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3000 \
            "$MINIO_IMAGE" server /data
          docker run --pull=never -d --name community-browser-mail -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 "$MAILPIT_IMAGE"
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null && curl --fail --silent http://127.0.0.1:8025/livez >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          cd apps/api
          uv run python -c 'from app.community.media import storage; from app.config import get_settings; storage().create_bucket(Bucket=get_settings().community_s3_bucket)'
          printf '%s\n' 'community-ci-password-123' | uv run python -m app.cli create-admin --email ci-community@example.com --password-stdin
          printf '%s\n' 'isolated-admin-workspace-password-123' | uv run python -m app.cli create-admin --email admin-workspace-desktop@example.com --password-stdin
          printf '%s\n' 'isolated-admin-workspace-password-123' | uv run python -m app.cli create-admin --email admin-workspace-mobile@example.com --password-stdin
      - name: Wait for the real stack
        id: stack-ready
        run: |
          for attempt in {1..60}; do
            if test -S /tmp/travel-scanner-e2e-agent.sock && curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && curl --fail --silent http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/travel-agent.log /tmp/travel-api.log /tmp/travel-worker.log /tmp/travel-web.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Run unmocked desktop and Pixel 7 journeys
        id: travel-journeys
        # Each invocation clears its output directory. Keep suites separate so later
        # journeys cannot erase an earlier failure before the final artifact upload.
        # There are no retries here, so capture the first failure instead of waiting
        # for an on-first-retry trace that would never be recorded.
        run: npx playwright test e2e/full-stack.spec.ts --output=test-results/travel --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_REUSE_EXISTING: "true", PLAYWRIGHT_SERVE_BUILD: "true" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.travel-journeys.outcome == 'failure'
        with:
          name: travel-browser-failure
          path: apps/web/test-results
          retention-days: 7
      - name: Run private-media, mail and community browser journeys
        if: ${{ !cancelled() && steps.stack-ready.outcome == 'success' }}
        run: npx playwright test e2e/community.spec.ts --output=test-results/community --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_REUSE_EXISTING: "true", PLAYWRIGHT_SERVE_BUILD: "true", COMMUNITY_E2E: "1" }
      - name: Run isolated admin domain journeys
        if: ${{ !cancelled() && steps.stack-ready.outcome == 'success' }}
        run: npx playwright test e2e/admin-domains-full-stack.spec.ts --workers=1 --output=test-results/admin-domains --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_REUSE_EXISTING: "true", PLAYWRIGHT_SERVE_BUILD: "true", ADMIN_DOMAIN_E2E: "1" }
      - name: Run full-stack admin operations matrix
        if: ${{ !cancelled() && steps.stack-ready.outcome == 'success' }}
        run: npx playwright test e2e/admin-operations-full-stack.spec.ts --workers=1 --output=test-results/admin-operations --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_REUSE_EXISTING: "true", PLAYWRIGHT_SERVE_BUILD: "true", ADMIN_OPERATIONS_E2E: "1" }
      # Only on failure or timeout, for the storage reason given at the web job's upload.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: community-browser-results
          path: apps/web/test-results
          retention-days: 7
      # The logs do not exist when the job failed before the stack started (a registry outage
      # in "Pull container images"); that must not add a second, misleading red step.
      - name: Show service logs on failure
        if: failure()
        run: cat /tmp/travel-agent.log /tmp/travel-api.log /tmp/travel-worker.log /tmp/travel-web.log 2>/dev/null || true
      - name: Stop application processes
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP"/travel-*.pid; do
            [ -f "$pid_file" ] || continue
            pid="$(cat "$pid_file")"
            kill -TERM -- "-$pid" 2>/dev/null || true
          done
