name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: travel_scanner, POSTGRES_USER: travel, POSTGRES_PASSWORD: travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_scanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run pip-audit --local --skip-editable
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app
        env: { RUN_INTEGRATION_TESTS: "1" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:web
      - run: npm run check:i18n
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run test:tools
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Run isolated browser UI tests
        run: npx playwright test e2e/navigation.spec.ts
        working-directory: apps/web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build api worker
      - name: Validate production release Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          DATABASE_URL: postgresql+asyncpg://travel:ci-postgres-password@postgres:5432/travel_scanner
          REDIS_URL: redis://:ci-redis-password@redis:6379/0
          NEXT_PUBLIC_SITE_URL: https://mokaair.com
          RUNTIME_ENV_FILE: .env
          DEPLOY_AGENT_SOCKET_DIR: /tmp/travel-scanner-deployer
          DEPLOY_AGENT_GID: "10002"
          RELEASE_SHA: ci
      - name: Build SHA-tagged production images
        run: docker compose -f docker-compose.prod.yml build api web
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          DATABASE_URL: postgresql+asyncpg://travel:ci-postgres-password@postgres:5432/travel_scanner
          REDIS_URL: redis://:ci-redis-password@redis:6379/0
          NEXT_PUBLIC_SITE_URL: https://mokaair.com
          RUNTIME_ENV_FILE: .env
          DEPLOY_AGENT_SOCKET_DIR: /tmp/travel-scanner-deployer
          DEPLOY_AGENT_GID: "10002"
          RELEASE_SHA: ci
  full-stack-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: travel_scanner, POSTGRES_USER: travel, POSTGRES_PASSWORD: travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_scanner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://travel:travel@127.0.0.1:5432/travel_scanner
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET_KEY: ci-full-stack-secret-key-at-least-32-characters
      TRAVEL_PROVIDER_MODE: mock
      FLIGHT_PROVIDER_MODE: mock
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: uv sync --frozen
        working-directory: apps/api
      - run: npm ci
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - name: Start API, worker and web
        run: |
          cd apps/api
          setsid uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/travel-api.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-api.pid"
          setsid uv run python -m app.worker > /tmp/travel-worker.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-worker.pid"
          cd ../..
          setsid npm run dev --workspace @travel-scanner/web -- --port 3000 > /tmp/travel-web.log 2>&1 &
          echo $! > "$RUNNER_TEMP/travel-web.pid"
      - name: Wait for the real stack
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/travel-api.log /tmp/travel-worker.log /tmp/travel-web.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Run unmocked desktop and Pixel 7 journeys
        run: npx playwright test e2e/full-stack.spec.ts
        working-directory: apps/web
        env: { PLAYWRIGHT_REUSE_EXISTING: "true" }
      - name: Show service logs on failure
        if: failure()
        run: cat /tmp/travel-api.log /tmp/travel-worker.log /tmp/travel-web.log
      - name: Stop application processes
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP"/travel-*.pid; do
            [ -f "$pid_file" ] || continue
            pid="$(cat "$pid_file")"
            kill -TERM -- "-$pid" 2>/dev/null || true
          done
