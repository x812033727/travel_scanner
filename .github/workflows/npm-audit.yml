name: npm audit

# The enforcing half of the dependency check. It lives outside CI because the advisory
# lookup depends on registry.npmjs.org being up at that moment: as a pull request gate a
# registry outage blocks unrelated work, but as a daily job it is simply retried.
# A failed scheduled run opens or comments on an `npm-audit-red` issue: ci-red-main.yml
# listens for this workflow by its `name:` above.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
