name: Planner UX

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  planner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Verify manual creation, timeline and explicit AI preview/apply
        run: npx playwright test e2e/planner-route-tones.spec.ts e2e/planner-calm.spec.ts e2e/planner-premium.spec.ts e2e/trip-stay-areas.spec.ts e2e/stay22-maps.spec.ts --workers=1
        working-directory: apps/web
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: planner-premium-browser-results
          path: apps/web/test-results
          retention-days: 7
