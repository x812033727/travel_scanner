name: Planner UX

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  planner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Verify manual creation, timeline and explicit AI preview/apply
        run: npx playwright test e2e/planner-route-tones.spec.ts e2e/planner-calm.spec.ts e2e/planner-premium.spec.ts e2e/trip-stay-areas.spec.ts e2e/stay22-maps.spec.ts --workers=1
        working-directory: apps/web
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      # Only when something failed or the job timed out (reported as cancelled). Every push runs
      # this workflow for both the push and the pull_request event, and uploading passing runs'
      # traces helped fill the repository with 122.7 GB of unexpired artifacts by 2026-09-14,
      # when a required job went red on "Failed to FinalizeArtifact: ... (403) Forbidden" after
      # every test had passed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: planner-premium-browser-results
          path: apps/web/test-results
          retention-days: 7
