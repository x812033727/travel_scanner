name: YouTube VPS uploader
on:
  pull_request:
    paths:
      - "services/youtube-uploader/**"
      - "ops/youtube-uploader/**"
      - ".github/workflows/youtube-uploader.yml"
  push:
    branches: [main]
    paths:
      - "services/youtube-uploader/**"
      - "ops/youtube-uploader/**"
      - ".github/workflows/youtube-uploader.yml"
permissions:
  contents: read
concurrency:
  group: youtube-uploader-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  uploader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/youtube-uploader/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/youtube-uploader
      - run: npx playwright install --with-deps chromium
        working-directory: services/youtube-uploader
      - run: npm test
        working-directory: services/youtube-uploader
      - name: Build the independent container
        run: docker build -f ops/youtube-uploader/Dockerfile -t mokaair-uploader:test .
      - name: Start the headful desktop and check readiness without an account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uploader-secrets"
          printf '%s' 'ci-only-service-secret-not-for-deployment' > "$RUNNER_TEMP/uploader-secrets/uploader"
          printf '%s' 'ci-only-vnc-password' > "$RUNNER_TEMP/uploader-secrets/vnc_password"
          chmod 755 "$RUNNER_TEMP/uploader-secrets"
          chmod 444 "$RUNNER_TEMP/uploader-secrets/"*
          docker run -d --name uploader-check --shm-size=1g --cap-drop=ALL --security-opt=no-new-privileges --init -e UPLOADER_CHANNEL_ID=UCaaaaaaaaaaaaaaaaaaaaaa -e UPLOADER_SECRET_FILE=/run/secrets/uploader -v "$RUNNER_TEMP/uploader-secrets:/run/secrets:ro" mokaair-uploader:test
          trap 'docker stop uploader-check >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec uploader-check node -e "Promise.all([fetch('http://127.0.0.1:8789/health'),fetch('http://127.0.0.1:6080/vnc.html')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          docker logs uploader-check
          exit 1
