name: RunPod H3 image

# Builds the pod image (ops/runpod/Dockerfile), checks on CI's CPU that ComfyUI loads and has every
# node the workflows name, and on main publishes it to GHCR. The job summary prints the digest the
# admin RunPod card's image field wants; a moving tag is refused there on purpose.

on:
  pull_request:
    paths:
      - '.github/workflows/runpod-h3-image.yml'
      - 'ops/runpod/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runpod-h3-image.yml'
      - 'ops/runpod/**'

permissions:
  contents: read

concurrency:
  group: runpod-h3-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for the CUDA packages
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
      - name: Build
        run: DOCKER_BUILDKIT=1 docker build -f ops/runpod/Dockerfile -t runpod-h3:ci .
      - name: ComfyUI starts on CPU and has every workflow node
        run: |
          docker run -d --name h3 --entrypoint bash runpod-h3:ci -c \
            'cd /opt/ComfyUI && python3 main.py --cpu --listen 127.0.0.1 --port 8189 --disable-auto-launch'
          for _ in $(seq 1 60); do
            if docker exec h3 curl -fsS -o /dev/null http://127.0.0.1:8189/system_stats; then break; fi
            sleep 5
          done
          docker logs --tail 40 h3
          docker exec h3 python3 /opt/gate/smoke.py
      - name: Publish
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/runpod-h3"
          docker tag runpod-h3:ci "$image:$SHA"
          docker push "$image:$SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$SHA")"
          echo "Image for the RunPod card: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
