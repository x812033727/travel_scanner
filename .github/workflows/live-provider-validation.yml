name: Live travel provider validation

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin airport or city code
        required: true
        default: TPE
      destination:
        description: Destination airport or city code
        required: true
        default: NRT
      amadeus_environment:
        description: Amadeus test or production environment
        required: true
        default: test
        type: choice
        options: [test, production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TRAVEL_PROVIDER_MODE: live
      AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
      AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
      AMADEUS_ENV: ${{ inputs.amadeus_environment }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Verify all travel modules
        run: >-
          uv run python -m app.cli verify-live-provider
          --origin "${{ inputs.origin }}"
          --destination "${{ inputs.destination }}"
          --strict
        working-directory: apps/api
