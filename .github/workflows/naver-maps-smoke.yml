name: NAVER Maps credential smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seoul:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
      NAVER_MAPS_CLIENT_SECRET: ${{ secrets.NAVER_MAPS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen
        working-directory: apps/api
      - name: Verify Seoul places and driving route
        run: uv run python -m app.cli verify-naver-maps --strict
        working-directory: apps/api
      - name: Dynamic Map verification reminder
        run: >-
          echo "Server APIs passed. Verify Web Dynamic Map separately from an
          origin registered in the NAVER Cloud application."
