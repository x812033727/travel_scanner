name: Food map and reservations
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  food-map-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Verify five-language food actions and nested navigation
        run: npx playwright test e2e/food-map-reservations.spec.ts --workers=2
        working-directory: apps/web
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-map-reservations-browser-results
          path: apps/web/test-results
          retention-days: 7
