name: Food map and reservations
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  food-map-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Verify five-language food actions and nested navigation
        run: npx playwright test e2e/food-map-reservations.spec.ts e2e/food-reservation-platforms.spec.ts --workers=2 --max-failures=3 --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      - name: Verify sibling style editor keeps its own identity
        run: npx playwright test e2e/merchant-styles.spec.ts --grep "admin reviews one style" --workers=2 --output=test-results/admin-style-review --trace=retain-on-failure
        working-directory: apps/web
        env: { PLAYWRIGHT_SERVE_BUILD: "true" }
      # Only when something failed or the job timed out (reported as cancelled). Every push runs
      # this workflow for both the push and the pull_request event, and uploading passing runs'
      # traces helped fill the repository with 122.7 GB of unexpired artifacts by 2026-09-14,
      # when a required job went red on "Failed to FinalizeArtifact: ... (403) Forbidden" after
      # every test had passed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: food-map-reservations-browser-results
          path: apps/web/test-results
          retention-days: 7
