name: Red main

# Branch protection keeps a red pull request out of main, but a run can still fail on
# main itself — a flaky end-to-end case, a registry outage, a job that only fails on
# push. On 2026-09-05 main stayed red across two further merges before anyone looked.
# This opens (or comments on) an issue so the default branch announces the failure
# instead of waiting to be noticed.
#
# The daily npm and pip audits fail their own run on a known advisory, and until they were
# listed here nobody but the last committer's inbox heard about it (I4 in
# docs/security-review-2026-09-23.md). Each workflow has its own label, so each has its own
# open issue: an advisory is not a comment on a flaky end-to-end run.
on:
  workflow_run:
    # Matched by each workflow's `name:`, so a rename silently stops the announcement;
    # tools/supply-chain.test.mjs checks every entry names a workflow that exists.
    workflows: [CI, "npm audit", "pip audit"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  announce:
    # `branches: [main]` matches the head branch name of the run that finished, and a fork
    # chooses its own branch names: a fork's pull request from a branch called `main` that
    # failed CI used to file "CI is red on main" (L11 in the 2026-09-23 review).
    # `workflow_run.event` is the event that started that run. A fork can only start runs
    # here through `pull_request`; main's own CI runs on `push`, and the audits on `schedule`
    # (a `workflow_dispatch` re-run is watched by whoever started it).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const short = run.head_sha.slice(0, 7);
            const announcements = {
              CI: {
                label: "ci-red-main",
                title: `CI is red on main (${short})`,
                body: [
                  `The CI run for \`${short}\` on \`main\` failed: ${run.html_url}`,
                  "",
                  "Pull requests cannot merge while red, so this failed on main itself —",
                  "a flaky job, or one that only fails on push. Re-run it or fix forward,",
                  "then close this issue.",
                ],
              },
              "npm audit": {
                label: "npm-audit-red",
                title: `npm audit is red on main (${short})`,
                body: [
                  `The daily npm audit of \`${short}\` on \`main\` failed: ${run.html_url}`,
                  "",
                  "Either a package in package-lock.json has an advisory at high severity or",
                  "above, or the registry lookup failed; the log says which. Upgrade or replace",
                  "the package (or re-run the job if the registry was down), then close this issue.",
                ],
              },
              "pip audit": {
                label: "pip-audit-red",
                title: `pip audit is red on main (${short})`,
                body: [
                  `The daily pip audit of \`${short}\` on \`main\` failed: ${run.html_url}`,
                  "",
                  "Either a package in apps/api/uv.lock has a known advisory, or the PyPI lookup",
                  "failed; the log says which. Upgrade the package (or re-run the job if PyPI",
                  "was down), then close this issue.",
                ],
              },
            };
            const announcement = announcements[run.name];
            if (!announcement) {
              core.setFailed(`No announcement for the workflow "${run.name}"; add it to ci-red-main.yml.`);
              return;
            }
            const body = announcement.body.join("\n");
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: announcement.label, per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
              return;
            }
            await github.rest.issues.create({
              owner, repo, title: announcement.title, body, labels: [announcement.label],
            });
