# Automated dependency updates.
#
# This file is the other half of pinning every action to a commit SHA. A pin without
# updates is a dependency frozen at whatever was current the day someone pinned it, which
# trades a supply-chain risk for a staleness one; the two only work as a pair.
#
# `npm audit` and `pip-audit` already run daily and fail on a known advisory, but they only
# ever say that something is wrong. These pull requests are what makes the fix a review
# rather than an investigation.
version: 2
updates:
  # The npm workspace root. `apps/web` has no lock file of its own — `package-lock.json`
  # here covers both, so a second entry pointing at /apps/web would find nothing to update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the safe half, so a week of patch bumps is one CI run and one
      # review. Majors stay separate: `latest` ranges once let a major land silently here
      # (WEB-05 in docs/security-audit-2026-09.md), and that is exactly the change that
      # deserves to arrive on its own.
      minor-and-patch:
        update-types: [minor, patch]
        # @playwright/test arrives in a pull request of its own, because it does not pass alone:
        # the video worker's image (ops/video/Dockerfile) and ops/video/package.json have to move
        # to the same release, no ecosystem here updates those two with it, and
        # tools/supply-chain.test.mjs stays red until a person adds them. In the group, that red
        # would hold back the week's other bumps. The fonts and pinyin-pro go to the group below.
        exclude-patterns: ["@playwright/test", "@fontsource-variable/*", "pinyin-pro"]
      # The rest of what ops/video/package.json pins: the fonts the video worker draws frames and
      # thumbnails with, and pinyin-pro, which decides which narrated lines pass check-audio as
      # "same sound". The worker installs that file without a lock file and it is not a workspace,
      # so a bump here moves package-lock.json alone, and tools/supply-chain.test.mjs stays red
      # until a person sets ops/video/package.json to the lock's new versions on this pull
      # request's branch (.agents/skills/dev-and-ci/references/dependabot.md). Kept out of
      # minor-and-patch for the same reason as @playwright/test, and together in one pull request
      # because fontsource releases its fonts together: one red pull request and one edit, instead
      # of several that conflict in the lock. The worker installs every font tools/video draws
      # with, so each pull request of this group that moves a font needs that edit.
      video-worker:
        update-types: [minor, patch]
        patterns: ["@fontsource-variable/*", "pinyin-pro"]

  # apps/api is a uv project: pyproject.toml plus uv.lock, installed frozen in CI and in
  # the image. Dependabot updates both together.
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The pins in .github/workflows/*.yml. Dependabot rewrites the SHA and the trailing
  # version comment together, so the comment cannot drift away from what actually runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images, pinned `tag@sha256:digest` so a tag moved on the registry cannot change an
  # image without a diff. The digest moves when the publisher rebuilds the same tag with an OS
  # or runtime patch; these pull requests are how that reaches the images. A new version is a
  # migration rather than a refresh (Python 3.14 needs uv.lock's requires-python, Node 24 the
  # web engines, PostgreSQL 18 a dump and restore), so minor and major tags are ignored and
  # only digests and patch tags move here.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
  # The video worker. Playwright's image carries the browsers of its own release, so its tag has
  # to move with @playwright/test in package-lock.json and ops/video/package.json, and
  # tools/supply-chain.test.mjs fails while they differ. The npm entry above is what proposes a new
  # release; this one ignores patch tags as well and only refreshes the digest of the tag in use
  # (the publisher's rebuild of the same Playwright release). Dependabot's multi-ecosystem groups
  # would not keep them together: they bundle whatever each ecosystem finds that week, and nothing
  # updates ops/video/package.json. Playwright is the only image in this directory.
  - package-ecosystem: docker
    directory: /ops/video
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: docker
    directory: /ops/youtube-uploader
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  # The `image:` of every docker-compose*.yml at the root. docker-compose.yml and
  # docker-compose.community.yml are pinned by digest; docker-compose.prod.yml is not yet
  # (tasks/open/2026-10-05-pin-prod-compose-postgres-redis-by.md), and a bare tag gets no pull
  # request while its versions are ignored.
  #
  # No ecosystem reads the images in .github/workflows/*.yml (github-actions updates `uses:`
  # only, docker reads Dockerfiles and Kubernetes manifests), so those are bumped by hand.
  # tools/supply-chain.test.mjs fails while one image is pinned two ways, which is what turns
  # this pull request for mailpit, postgres or redis into a reminder to copy it into the
  # workflows (MAILPIT_IMAGE, the jobs' service containers).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
