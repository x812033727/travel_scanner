<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">從需求到網站交接</title><desc id="desc">六張卡片展示需求、內容、原型、製作、驗收及交接，說明完成網站需要銜接不同工作成果。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">從需求到網站交接</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">每一階段都留下可檢查的成果，發現問題就回頭修正</text>
<rect x="80" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">需求</text>
<text x="108" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">誰要完成什麼</text>
<text x="108" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">範圍條件寫清楚</text>
<rect x="570" y="224" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">內容</text>
<text x="598" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">正文與素材齊全</text>
<text x="598" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">審閱及授權有據</text>
<rect x="1060" y="224" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="282" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">原型</text>
<text x="1088" y="339" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">畫面關係先確認</text>
<text x="1088" y="391" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">任務流程先觀察</text>
<rect x="80" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="108" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">製作</text>
<text x="108" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">元件狀態要完整</text>
<text x="108" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">手機操作能成立</text>
<rect x="570" y="484" width="458" height="218" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="598" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">驗收</text>
<text x="598" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">前後台結果核對</text>
<text x="598" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">缺陷修正留紀錄</text>
<rect x="1060" y="484" width="458" height="218" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="1088" y="542" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">交接</text>
<text x="1088" y="599" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">帳號與文件交付</text>
<text x="1088" y="651" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">更新維護有人管</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先讓主要任務成立，再確認視覺、技術與後續維護都接得上。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
