<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="title">商店通路的三種責任分工</title><desc id="desc">三欄比較自架商店需安排技術維護、代管店面需核對方案與整合、商城需評估曝光和交易規則。</desc>
<rect width="1600" height="900" fill="#F7F1E8"/>
<text x="80" y="94" font-size="52" fill="#102A2B" text-anchor="start" font-weight="bold">商店通路的三種責任分工</text>
<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">先找到目前最需要解決的問題，再核對成本與資料</text>
<rect x="80.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="108.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">自架商店</text>
<text x="108.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">控制網站與流程</text>
<text x="108.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">安排更新與備份</text>
<text x="108.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">規劃自己的客源</text>
<rect x="572.0" y="256" width="456.0" height="400" rx="24" fill="#E6F0F7" stroke="#0D6B68" stroke-width="4"/>
<text x="600.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">代管店面</text>
<text x="600.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">核對方案與整合</text>
<text x="600.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">經營品牌和商品</text>
<text x="600.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">確認匯出與費用</text>
<rect x="1064.0" y="256" width="456.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
<text x="1092.0" y="314" font-size="38" fill="#102A2B" text-anchor="start" font-weight="bold">商城通路</text>
<text x="1092.0" y="371" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">測試搜尋與成交</text>
<text x="1092.0" y="423" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">遵循交易及活動規則</text>
<text x="1092.0" y="475" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">核算每筆訂單成本</text>
<text x="80" y="803" font-size="32" fill="#102A2B" text-anchor="start" font-weight="normal">先讓一個通路穩定接單與對帳，再處理多通路擴充。</text>
<text x="1520" y="862" font-size="24" fill="#5C6B6B" text-anchor="end" font-weight="normal">Mokaair 原創製圖</text>
</svg>
