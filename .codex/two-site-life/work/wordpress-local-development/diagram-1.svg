<text x="80" y="151" font-size="28" fill="#5C6B6B" text-anchor="start" font-weight="normal">瀏覽器、檔案與資料庫各有不同工作</text>
<rect x="80.0" y="256" width="333.0" height="400" rx="24" fill="#E3F0EF" stroke="#0D6B68" stroke-width="4"/>
